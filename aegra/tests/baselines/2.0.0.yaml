# aegra 2.0.0 — the production-leaning shape at the smallest size that runs: two Aegra replicas on the
# bundled single PostgreSQL (pgvector image, PostgreSQL 19) and a one-node Redis that requires a password, with the default image
# (Aegra's example agents, no model key needed) and an agent secret delivered as an env var. All
# credentials are prerequisite secrets CI creates (hex, so they are URL-safe for REDIS_URL).
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  pgpw: hex
  redispw: hex
  probe: hex

secrets:
  db:
    type: dictionary
    entries:
      username: aegra
      password: "{gen.pgpw}"
      database: aegra
  redis:
    type: dictionary
    entries:
      password: "{gen.redispw}"
  agent:
    type: dictionary
    entries:
      E2E_PROBE: "{gen.probe}"

vars:
  aegra_version: "0.11.0"          # the Aegra version the image reports on /info; bump with the image tag
  redis_password: "{gen.redispw}"
  probe: "{gen.probe}"
  pg_user: aegra
  pg_password: "{gen.pgpw}"
  pg_db: aegra

values:
  aegra:
    replicas: 2
  postgres:
    config:
      credentialsSecretName: "{secrets.db.name}"
  redis:
    redis:
      auth:
        fromSecret:
          enabled: true
          name: "{secrets.redis.name}"
  agentSecrets:
    secretName: "{secrets.agent.name}"
    keys: [E2E_PROBE]

# The highly available database (postgres-highly-available 3.0.0) as its own fresh install: every Aegra check
# runs against the HAProxy leader endpoint, and ha-is-18 proves the new cluster's major.
variants:
  - name: ha
    values:
      postgres:
        enabled: false
      postgresHA:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"
    timeoutSeconds: 1200

# 2.0.0 runs the single-instance database on PostgreSQL 19 (pgvector/pgvector:0.8.7-pg19), so a plain upgrade
# of a 1.0.0 release (data on PostgreSQL 18) must be REFUSED by the postgres boot guard with the data untouched;
# the upgrade pinned to pgvector/pgvector:0.8.7-pg18 then succeeds, and thread-persists proves the 1.0.0 thread
# survived.
upgradeFrom:
  - version: 1.0.0
    refused: {timeoutSeconds: 420}
    then: {set: {postgres: {image: "pgvector/pgvector:0.8.7-pg18"}}}
