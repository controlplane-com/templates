apiVersion: v2
name: aegra
description: Aegra agent server running your LangGraph agents, with PostgreSQL and Redis
type: application
version: 1.0.0
appVersion: "0.11.0"

annotations:
  created: "2026-11-05"
  lastModified: "2026-11-05"
  createsGvc: false

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres
    version: 3.4.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.8.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled
  - name: redis
    version: 3.9.0
    repository: "oci://ghcr.io/controlplane-com/templates"
