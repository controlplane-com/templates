{{- include "airflow.validate" . -}}
kind: secret
name: {{ include "airflow.secret.name" . }}
description: Airflow metadata database credentials
tags:
  {{- include "airflow.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.config.username | quote }}
  password: {{ .Values.postgres.config.password | quote }}
