{{- include "airflow.validate" . -}}
kind: volumeset
name: {{ include "airflow.volume.name" . }}
description: Airflow volume set
gvc: {{ .Values.global.cpln.gvc }}
tags:
  {{- include "airflow.tags" . | nindent 4 }}
spec:
  fileSystemType: shared
  initialCapacity: {{ .Values.volumeset.airflow.capacity }}
  performanceClass: shared


