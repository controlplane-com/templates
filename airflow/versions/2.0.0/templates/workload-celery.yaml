{{- include "airflow.validate" . -}}
kind: workload
name: {{ include "airflow.celery.name" . }}
description: Airflow Celery worker
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "airflow.tags" . | nindent 4 }}
spec:
  type: stateful
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "airflow.identity.name" . }}
  containers:
    - name: celery-worker
      cpu: {{ .Values.airflow.celeryWorker.resources.cpu | quote }}
      memory: {{ .Values.airflow.celeryWorker.resources.memory | quote }}
      env:
        - name: AIRFLOW_HOME
          value: /opt/airflow
        - name: AIRFLOW__API_AUTH__JWT_EXPIRATION_TIME
          value: "{{ .Values.airflow.auth.jwtExpirationTime }}"
        - name: POSTGRES_USERNAME
          value: cpln://secret/{{ include "airflow.secret.name" . }}.username
        - name: POSTGRES_PASSWORD
          value: cpln://secret/{{ include "airflow.secret.name" . }}.password
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          value: cpln://secret/{{ .Values.airflow.auth.secretName }}.jwtSecret
        - name: AIRFLOW__CORE__FERNET_KEY
          value: cpln://secret/{{ .Values.airflow.auth.secretName }}.fernetKey
        - name: AIRFLOW__API__BASE_URL
          value: http://{{ include "airflow.webserver.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:{{ .Values.airflow.webPort }}
        - name: AIRFLOW__CELERY__BROKER_URL
          value: redis://{{ include "airflow.redis.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: AIRFLOW__CELERY__RESULT_BACKEND
          value: db+postgresql://$(POSTGRES_USERNAME):$(POSTGRES_PASSWORD)@{{ include "airflow.postgres.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:5432/{{ .Values.postgres.config.database }}
        {{- /*
          Unconditional since 2.0.0. It used to be gated on keda.enabled, which
          was harmless while KEDA defaulted ON -- but KEDA now defaults OFF, and
          the gate would have left airflow.celery.workerConcurrency doing
          nothing in a default install while still appearing in values.yaml.
          Applying it always keeps the default behaviour 1.5.0 actually had.
        */}}
        - name: AIRFLOW__CELERY__WORKER_CONCURRENCY
          value: "{{ .Values.airflow.celery.workerConcurrency }}"
        {{- if .Values.gitSync.enabled }}
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: /opt/airflow/dags-sync/current{{ if .Values.gitSync.subPath }}/{{ .Values.gitSync.subPath }}{{ end }}
        {{- else }}
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: /opt/airflow/dags
        {{- end }}
        - name: AIRFLOW__CORE__EXECUTOR
          value: CeleryExecutor
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: postgresql+psycopg2://$(POSTGRES_USERNAME):$(POSTGRES_PASSWORD)@{{ include "airflow.postgres.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:5432/{{ .Values.postgres.config.database }}
        - name: AIRFLOW__LOGGING__REMOTE_LOGGING
          value: 'False'
      image: {{ .Values.airflow.celeryWorker.image }}
      inheritEnv: false
      ports: []
      volumes:
        - path: /opt/airflow
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "airflow.volume.name" . }}
  {{- /*
    KEDA is a GVC-LEVEL setting, and this chart no longer creates the GVC -- so
    keda.enabled now means "my GVC already has spec.keda.enabled: true", and the
    webserver checks that at boot. With it off, workers run at a fixed
    airflow.celeryWorker.replicas.

    Either way defaultOptions pins 0/0, so a GVC location this release did not
    ask for starts NO workers, and the single localOptions entry supplies the
    real counts. Every field is repeated in the entry -- including the whole
    keda block -- because the API completes a partial localOptions entry from
    PLATFORM defaults, not from this workload's defaultOptions.
  */}}
  defaultOptions:
    autoscaling:
      {{- include "airflow.celeryAutoscaling" (dict "root" . "scale" (dict "min" 0 "max" 0)) | nindent 6 }}
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    - autoscaling:
        {{- if .Values.keda.enabled }}
        {{- include "airflow.celeryAutoscaling" (dict "root" . "scale" (dict "min" (int .Values.keda.minScale) "max" (int .Values.keda.maxScale))) | nindent 8 }}
        {{- else }}
        {{- include "airflow.celeryAutoscaling" (dict "root" . "scale" (dict "min" (int .Values.airflow.celeryWorker.replicas) "max" (int .Values.airflow.celeryWorker.replicas))) | nindent 8 }}
        {{- end }}
      capacityAI: false
      debug: false
      location: //location/{{ .Values.location }}
      suspend: false
      timeoutSeconds: 5
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      {{- include "airflow.internalFirewall" (dict "root" . "keda" false) | nindent 6 }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
