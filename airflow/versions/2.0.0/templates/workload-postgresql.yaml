{{- include "airflow.validate" . -}}
kind: workload
name: {{ include "airflow.postgres.name" . }}
description: Airflow Postgres
gvc: {{ .Values.global.cpln.gvc }}
tags:
  {{- include "airflow.tags" . | nindent 2 }}
spec:
  type: stateful
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "airflow.identity.name" . }}
  containers:
    - name: postgresql
      env:
        - name: PGDATA
          value: "/var/lib/postgresql/data/pg_data"
        - name: POSTGRES_DB
          value: {{ .Values.postgres.config.database }}
        - name: POSTGRES_PASSWORD
          value: 'cpln://secret/{{ include "airflow.secret.name" . }}.password'
        - name: POSTGRES_USER
          value: 'cpln://secret/{{ include "airflow.secret.name" . }}.username'
      image: {{ .Values.postgres.image }}
      inheritEnv: false
      minCpu: {{ .Values.postgres.resources.minCpu | quote }}
      cpu: {{ .Values.postgres.resources.maxCpu | quote }}
      minMemory: {{ .Values.postgres.resources.minMemory | quote }}
      memory: {{ .Values.postgres.resources.maxMemory | quote }}
      ports:
        - number: 5432
          protocol: tcp
      readinessProbe:
        exec:
          command:
            - sh
            - '-c'
            - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
        failureThreshold: 10
        initialDelaySeconds: 17
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 3
      volumes:
        - path: /var/lib/postgresql/data
          uri: 'cpln://volumeset/{{ include "airflow.postgresVolume.name" . }}'
  {{- /*
    One replica, in the one configured location. Before 2.0.0 this workload
    carried minScale/maxScale 1 in defaultOptions with no localOptions, so a GVC
    with N locations would have started N Postgres instances -- each on its own
    volume, each a SEPARATE metadata database, and only one of them the one
    Airflow was talking to.
  */}}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    - autoscaling:
        maxConcurrency: 0
        maxScale: 1
        metric: disabled
        minScale: 1
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      location: //location/{{ .Values.location }}
      suspend: false
      timeoutSeconds: 5
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      {{- include "airflow.internalFirewall" (dict "root" . "keda" false) | nindent 6 }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
