{{- include "airflow.validate" . -}}
kind: workload
name: {{ include "airflow.redis.name" . }}
description: Airflow Redis
gvc: {{ .Values.global.cpln.gvc }}
tags:
  {{- include "airflow.tags" . | nindent 2 }}
spec:
  type: stateful
  containers:
    - name: redis
      cpu: {{ .Values.redis.resources.cpu | quote }}
      memory: {{ .Values.redis.resources.memory | quote }}
      image: {{ .Values.redis.image }}
      inheritEnv: false
      ports:
        - number: 6379
          protocol: tcp
      volumes:
        - path: /data
          uri: cpln://volumeset/{{ include "airflow.redisVolume.name" . }}
  {{- /*
    One broker, in the one configured location. Before 2.0.0 this workload
    declared no options at all, which left it on the platform defaults: one Redis
    per GVC location, each on its own volume, splitting the Celery queue.
  */}}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    - autoscaling:
        maxConcurrency: 0
        maxScale: 1
        metric: disabled
        minScale: 1
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      location: //location/{{ .Values.location }}
      suspend: false
      timeoutSeconds: 5
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      {{- /* keda=true: the KEDA operator polls the Celery queue length here */}}
      {{- include "airflow.internalFirewall" (dict "root" . "keda" true) | nindent 6 }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
