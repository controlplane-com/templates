{{- include "airflow.validate" . -}}
kind: secret
name: {{ include "airflow.webserverScript.name" . }}
description: Airflow webserver startup script
tags:
  {{- include "airflow.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    # Airflow's own boot sequence, preceded by the two checks Helm cannot make.
    #
    # This chart does not create a GVC. The platform does not validate either
    # direction of the topology it is given, so the checks live here, in the one
    # tier that always runs:
    #   * a localOptions entry naming a location the GVC does NOT have is stored
    #     verbatim and is simply inert -- nothing runs and nothing reports it;
    #   * a `metric: keda` workload is accepted into a GVC where KEDA is turned
    #     OFF, never autoscales, and sits at minScale forever.
    # Both measured 2026-08-28.

    AIRFLOW_HOME="${AIRFLOW_HOME:-/opt/airflow}"
    CONFIGURED_LOCATION="{{ .Values.location }}"
    LOCATION="$(basename "${CPLN_LOCATION:-unknown}")"
    GVC="${CPLN_GVC:-}"
    MARKER="${AIRFLOW_HOME}/.cpln-airflow-initialized"
    WANT_KEDA={{ .Values.keda.enabled | ternary "true" "false" }}

    # "Fresh" means this Airflow home has never completed `airflow db migrate`.
    # The checks below are FATAL only on a fresh install and a WARNING on an
    # established one: on a running deployment a missing GVC location is
    # indistinguishable from a location being down, and this check must never be
    # the reason a live Airflow stops scheduling.
    HAS_DATA=false
    if [ -f "${MARKER}" ]; then HAS_DATA=true; fi

    refuse_or_warn() {
      if [ "${HAS_DATA}" = "true" ]; then
        echo "[airflow] WARNING: $*" >&2
        return 0
      fi
      echo "[airflow] FATAL: $*" >&2
      exit 1
    }

    # --- Guard: never run outside the one configured location ---
    # defaultOptions.minScale/maxScale are 0 on every workload in this release,
    # so the platform should never place a replica anywhere but the configured
    # location. This is the last line of defence if it does: a second Airflow
    # home in another location is a DIFFERENT shared volume, with no DAGs, no
    # task logs and no way to see the first one's.
    if [ "${LOCATION}" != "${CONFIGURED_LOCATION}" ]; then
      refuse_or_warn "this replica is running in location '${LOCATION}', but the release is configured for '${CONFIGURED_LOCATION}'. A shared volumeset provisions one volume PER LOCATION, so this replica has its own empty Airflow home and cannot see the configured one's DAGs, logs or state. Set 'location' in your values to the location you want, and install a separate release per location if you really want two Airflows."
    fi

    # --- GVC reconciliation ---
    # `timeout` bounds the WHOLE call and curl's own --retry is NOT used:
    # --max-time is PER ATTEMPT, so retrying inside curl multiplies the wait.
    # Retrying in shell keeps the worst case at 3*6 + 3*2 = 24s. Measured in
    # this exact image against a blackholed address (connect hangs) and against
    # an accept-never-respond server: 6s per attempt, 24s for the loop, versus
    # an unbounded control still hanging at 25s. An unresolvable hostname
    # returns in 0s and proves nothing about the bound, so it was not used.
    TIMEOUT_CMD="timeout 8"
    command -v timeout >/dev/null 2>&1 || TIMEOUT_CMD=""

    GVC_JSON=""
    for _try in 1 2 3; do
      # -w writes the status AFTER the body so a non-2xx can be told apart from a
      # successful read. Without it a 403 body is valid, non-empty JSON: the loop
      # breaks, the parse succeeds, `spec.keda.enabled` is absent and defaults to
      # false -- reported to the user as "your GVC has KEDA disabled" when the
      # real cause was a missing `view` grant (measured 2026-08-28).
      if _RESP=$(${TIMEOUT_CMD} curl -sS --max-time 6 -w '\n%{http_code}' \
            -H "Authorization: ${CPLN_TOKEN:-}" \
            "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>/dev/null); then
        _CODE="${_RESP##*$'\n'}"
        GVC_JSON="${_RESP%$'\n'*}"
        if [ "${_CODE}" = "200" ] && [ -n "${GVC_JSON}" ]; then break; fi
        if [ -n "${_CODE}" ] && [ "${_CODE}" != "200" ]; then
          echo "[airflow] GVC read returned HTTP ${_CODE} (attempt ${_try}/3)." >&2
        fi
      fi
      GVC_JSON=""
      sleep 2
    done

    if [ -z "${GVC_JSON}" ]; then
      # A control-plane hiccup must never be the reason Airflow refuses to start.
      # Skip the API-backed checks; the location guard above still applies.
      # Reached on a transport failure OR any non-200. Both mean the same thing:
      # we do not know what the GVC says, so neither check may draw a conclusion.
      # A control-plane hiccup, or a missing `view` grant, must never be the
      # reason Airflow refuses to start -- and must never be reported as a KEDA
      # or location misconfiguration the user would then go and "fix".
      echo "[airflow] WARNING: could not read GVC '${GVC}' (no 200 response) -- skipping the GVC location and KEDA checks. If this persists, check that the identity has 'view' on the GVC via the chart's GVC policy." >&2
    else
      GVC_LOCS="$(printf '%s' "${GVC_JSON}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(l.rsplit("/",1)[-1] for l in d.get("spec",{}).get("staticPlacement",{}).get("locationLinks",[])))' 2>/dev/null || true)"
      GVC_KEDA="$(printf '%s' "${GVC_JSON}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("spec",{}).get("keda",{}).get("enabled",False)).lower())' 2>/dev/null || true)"

      if [ -z "${GVC_LOCS}" ]; then
        echo "[airflow] WARNING: could not read the location list of GVC '${GVC}' -- skipping the GVC location check." >&2
      else
        case " ${GVC_LOCS} " in
          *" ${CONFIGURED_LOCATION} "*)
            echo "[airflow] GVC location check OK -- '${GVC}' has '${CONFIGURED_LOCATION}'" ;;
          *)
            refuse_or_warn "location '${CONFIGURED_LOCATION}' is not a location of GVC '${GVC}' (it has: ${GVC_LOCS}). The platform accepts a localOptions entry for a location that does not exist without any error, so this release would run NOTHING, anywhere, with no failed deployment to observe. Add the location to the GVC, or set 'location' to one the GVC already has." ;;
        esac

        EXTRA=""
        for loc in ${GVC_LOCS}; do
          if [ "${loc}" != "${CONFIGURED_LOCATION}" ]; then EXTRA="${EXTRA}${loc} "; fi
        done
        if [ -n "${EXTRA}" ]; then
          echo "[airflow] GVC '${GVC}' also has locations this release does not use: ${EXTRA% } -- nothing Airflow-related runs there."
        fi
      fi

      if [ "${WANT_KEDA}" = "true" ] && [ "${GVC_KEDA}" != "true" ]; then
        refuse_or_warn "keda.enabled is true in your values, but GVC '${GVC}' has spec.keda.enabled = ${GVC_KEDA:-unknown}. KEDA is a GVC-LEVEL setting this chart cannot turn on for you. The Celery workers were accepted without any error and will never autoscale -- they sit at keda.minScale forever, which at minScale 0 is zero workers and every task queues silently. Enable KEDA on the GVC (see Prerequisites in the README), or set keda.enabled: false."
      fi
      if [ "${WANT_KEDA}" = "false" ] && [ "${GVC_KEDA}" = "true" ]; then
        echo "[airflow] GVC '${GVC}' has KEDA enabled but keda.enabled is false in your values -- Celery workers run at a fixed airflow.celeryWorker.replicas."
      fi
    fi

    # --- Airflow boot ---
    mkdir -p "${AIRFLOW_HOME}/dags"
    python3 -c "import json,os; print(json.dumps({os.environ['AIRFLOW_ADMIN_USERNAME']:os.environ['AIRFLOW_ADMIN_PASSWORD']}))" > "${AIRFLOW_HOME}/simple_auth_manager_passwords.json.generated"
    airflow db migrate
    touch "${MARKER}" 2>/dev/null || echo "[airflow] WARNING: could not write ${MARKER}; the boot checks will stay in fresh-install (fatal) mode." >&2
    airflow dag-processor &
    airflow scheduler &
    airflow triggerer &
    exec airflow api-server
