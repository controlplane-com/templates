---
kind: workload
name: {{ include "artemis.name" . }}
description: Apache Artemis message broker
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "artemis.tags" . | nindent 2 }}
spec:
  type: stateful
  containers:
    - name: artemis
      image: {{ .Values.image | quote }}
      command: /bin/bash
      args:
        - "-c"
        - {{- include "artemis.inlineScript" (include "artemis.script.start" .) | nindent 10 }}
      cpu: {{ .Values.resources.cpu | quote }}
      memory: {{ .Values.resources.memory | quote }}
      inheritEnv: false
      env:
        - name: ARTEMIS_USER
          value: cpln://secret/{{ .Values.credentialsSecretName }}.username
        - name: ARTEMIS_PASSWORD
          value: cpln://secret/{{ .Values.credentialsSecretName }}.password
        - name: ARTEMIS_HEAP_MB
          value: {{ include "artemis.heapMb" . | quote }}
        - name: ARTEMIS_CATCHUP_TIMEOUT
          value: {{ .Values.mirror.catchUpTimeoutSeconds | int | toString | quote }}
        {{- include "artemis.locationEnv" . | nindent 8 }}
      {{- /*
        8161 is listed FIRST: with publicAccess on, the canonical endpoint serves
        the first port, which must be the web console. 5445 (legacy HornetQ) is
        never started and not declared.
      */}}
      ports:
        - number: 8161
          protocol: http
        - number: 61616
          protocol: tcp
        - number: 5672
          protocol: tcp
        - number: 61613
          protocol: tcp
        - number: 1883
          protocol: tcp
        - number: 61617
          protocol: tcp
      {{- /*
        Readiness is on the MIRROR port, which opens as soon as the broker has
        activated. A probe on a client port deadlocks the catch-up gate: a
        not-ready replica is unreachable at its replica address, so the peer's
        mirror could never connect to it. No liveness probe: a TCP check proves
        nothing beyond readiness, and a wrong one would kill a broker mid journal
        load.
      */}}
      readinessProbe:
        tcpSocket:
          port: 61617
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
        successThreshold: 1
        failureThreshold: 3
      volumes:
        - path: /var/lib/artemis-instance
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "artemis.volume.name" . }}
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "artemis.identity.name" . }}
  defaultOptions:
    {{- /*
      minScale/maxScale 0: a GVC location this release does not list runs
      NOTHING. localOptions below runs one broker in each listed location.
    */}}
    autoscaling:
      maxConcurrency: 0
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    {{- range .Values.locations }}
    - location: //location/{{ .name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: 1
        metric: disabled
        minScale: 1
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  rolloutOptions:
    {{- /*
      maxUnavailableReplicas is not sent: the API drops it on stateful workloads.
      terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    maxSurgeReplicas: 25%
    minReadySeconds: 0
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  firewallConfig:
    {{- /* the empty lists are API backfills, declared so rendered == stored */}}
    external:
      {{- if .Values.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0   # the web console only: the canonical endpoint serves port 8161
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type | quote }}
      {{- if eq .Values.internalAccess.type "workload-list" }}
      {{- /*
        This list governs ALL inbound internal traffic, INCLUDING the mirror
        between this workload's own replicas in the two locations. A list naming
        only clients silently breaks the mirror, so the chart adds its own
        workload rather than requiring the user to know.
      */}}
      {{- $self := printf "//gvc/%s/workload/%s" .Values.global.cpln.gvc (include "artemis.name" .) }}
      inboundAllowWorkload:
        - {{ $self }}
        {{- range .Values.internalAccess.workloads }}
        {{- if ne . $self }}
        - {{ . }}
        {{- end }}
        {{- end }}
      {{- else if .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- else }}
      inboundAllowWorkload: []   # API backfill, declared so rendered == stored
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: true  # a stable per-location address (replica-0...) for the mirror
  securityOptions:
    filesystemGroupId: 1001  # the image runs as uid/gid 1001; the volume mounts root-owned
  supportDynamicTags: false
