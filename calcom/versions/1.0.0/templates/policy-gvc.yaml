{{- /*
  The app reads its OWN GVC at boot to report which other locations the GVC has
  — the bundled PostgreSQL subchart runs in all of them and this chart cannot
  pin it, so those extra databases are invisible cost that nothing else reports.

  Scoped to the ONE install GVC; never `target: all`, which would grant view on
  every GVC in the org.
*/ -}}
kind: policy
name: {{ include "calcom.gvcPolicy.name" . }}
description: Cal.com GVC read policy
tags: {{- include "calcom.tags" . | nindent 4 }}
bindings:
  - permissions:
      - view
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "calcom.identity.name" . }}
targetKind: gvc
targetLinks:
  - //gvc/{{ .Values.global.cpln.gvc }}
