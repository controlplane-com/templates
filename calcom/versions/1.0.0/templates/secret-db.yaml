{{- if or .Values.postgres.enabled .Values.postgresHA.enabled }}
{{- /*
  Credentials for the BUNDLED database. Internal plumbing: no human ever types
  this password — it exists only so Cal.com can reach its own Postgres — so the
  bundled-plumbing exception applies and it stays a template-created secret
  rather than a prerequisite the user has to create. postgres 3.4.0 and
  postgres-highly-available 2.5.0 both stopped creating this secret and now take
  only its NAME, which is why the chart on this side of the dependency owns it.

  The three keys are named exactly as both subcharts read them.
*/}}
kind: secret
name: {{ include "calcom.db.secretName" . }}
description: Cal.com bundled PostgreSQL credentials
tags: {{- include "calcom.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.database | quote }}
{{- end }}
