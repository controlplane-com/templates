{{- include "calcom.validate" . -}}
{{- /*
  REPLACES the image's own `scripts/start.sh`, which cannot be used as shipped.

  1. `start.sh` gates the boot on `scripts/wait-for-it.sh`, which at v6.2.0 is
     the eficode POSIX-sh variant and tests readiness with `nc -w 1 -z`. The
     Control Plane mesh sidecar COMPLETES THE TCP HANDSHAKE FOR ANYTHING, so
     that wait returns success instantly in every case. Proven in-container with
     three negative controls that all had to fail and did not: a dead port
     (9999), a hostname that does not exist, and the real port — all three
     "succeeded" in ~0 s.
  2. `start.sh` runs `set -x` but NOT `set -e`, so the `prisma migrate deploy`
     that then fails does not stop the boot. Cal.com went on to serve HTTP
     against a schema-less database, with `ready: true`, 200 on `/api/version`
     and 0 tables in `information_schema`. It is a race, so it is intermittent —
     and a fresh volumeset makes Postgres slow to accept connections, which is
     exactly the first-install case a new user hits.

  This script therefore (a) waits by exchanging REAL PostgreSQL PROTOCOL BYTES,
  and (b) runs under `set -e` so a failed migration crash-loops the container —
  a visible failure instead of a silent empty database.

  Verified against `calcom/cal.com:v6.2.0` itself (2026-08-31): `/bin/bash`
  5.2.15 is present (`/bin/sh` is dash, so this MUST be run with bash),
  `/dev/tcp` works, `curl`/`python3` are present, and there is NO `psql` or
  `pg_isready` in the image (`command -v` exits 127) — which is why the wait
  speaks the protocol by hand rather than shelling out to a client.
*/ -}}
kind: secret
name: {{ include "calcom.secret.startup.name" . }}
description: Cal.com startup script
tags: {{- include "calcom.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -euo pipefail

    # Upstream's WORKDIR. `scripts/replace-placeholder.sh` below greps relative
    # paths (apps/web/.next/, apps/web/public/), so the cwd is load-bearing.
    cd /calcom

    CONFIGURED_LOCATION="{{ .Values.location }}"
    # CPLN_LOCATION is a full resource link (/org/{org}/location/{name}).
    LOCATION="${CPLN_LOCATION:-}"
    LOCATION="${LOCATION##*/}"
    GVC="${CPLN_GVC:-}"
    DB_HOST="{{ include "calcom.db.host" . }}"
    DB_PORT=5432
    # 48 x 5s = 240s. The ceiling on this budget is the READINESS probe, not
    # liveness. A container that has never become ready is restarted by the
    # platform when READINESS exhausts its own deadline
    # (initialDelaySeconds + failureThreshold x periodSeconds), plus some
    # minutes of grace -- delivered as a signal, with a generic
    # "Health Check Failed" and no mention of the database. If the wait
    # outlives that, the FATAL below is dead code: measured at MAX_ATTEMPTS=120
    # the container was killed at ~515 s having reached attempt 104/120, and
    # `|= "FATAL"` returned zero lines.
    #
    # Measured 2026-08-31 on four throwaway workloads whose readiness could
    # never pass (nothing listening on the probed port), with no liveness probe
    # at all: the restart tracks the readiness deadline -- a 5 s deadline gave
    # a 238 s cycle, a 330 s deadline (calcom's own numbers) gave 563 s, a
    # 660 s deadline gave 1044 s, and a workload with NO readiness probe was
    # never restarted at all. So readiness sets the ceiling and this budget
    # must sit under it: calcom's readiness deadline is 30 + 20 x 15 = 330 s,
    # and 240 s of waiting plus at most ~25 s of the GVC read above lands the
    # FATAL inside even that floor, let alone the ~515 s the platform measured.
    #
    # Shortening the wait costs nothing operationally: the gate re-runs in full
    # on every restart, so a database slower than 240 s is still waited out
    # across cycles -- and now each cycle says why.
    MAX_ATTEMPTS=48
    SLEEP_SECONDS=5
    # Require CONSECUTIVE successes: the first byte back can precede the server
    # actually being ready to serve (grafana-multi-location measured a connect
    # 126 ms after its gate released dying on "connection reset by peer").
    REQUIRED_OK=3

    # --- Guard: never run outside the one configured location ---
    # defaultOptions.minScale/maxScale are 0 on both workloads of this release,
    # so the platform should never place a replica anywhere else. This is the
    # last line of defence if it does: a replica in another location reaches
    # THAT location's Postgres and becomes a second, independent Cal.com sharing
    # the same NEXTAUTH_SECRET.
    if [ -z "${LOCATION}" ]; then
      echo "[calcom] WARNING: CPLN_LOCATION is unset -- skipping the location guard." >&2
    elif [ "${LOCATION}" != "${CONFIGURED_LOCATION}" ]; then
      echo "[calcom] FATAL: this replica is running in location '${LOCATION}', but the release is configured for '${CONFIGURED_LOCATION}'. Refusing to start: it would reach a different PostgreSQL and become a SECOND, independent Cal.com holding different users and bookings, while sharing the same session secret. Set 'location' in your values to the location you want." >&2
      exit 1
    fi

    # --- Report the GVC's other locations ---
    # The bundled `postgres` / `postgres-highly-available` subcharts declare no
    # localOptions and a parent chart cannot template a subchart's values, so
    # the database is NOT confined and starts in every location the GVC has.
    # Those extra copies hold no Cal.com data and are never read, but each one
    # provisions a volumeset and bills for it. Nothing else reports this, so the
    # one tier that always runs says it out loud.
    #
    # Bounded, and FAIL-OPEN in every arm: a control-plane hiccup or a missing
    # `view` grant must never be why Cal.com refuses to start. `timeout` bounds
    # the whole call because curl's --max-time is per attempt.
    TIMEOUT_CMD="timeout 8"
    command -v timeout >/dev/null 2>&1 || TIMEOUT_CMD=""
    GVC_JSON=""
    if [ -n "${GVC}" ]; then
      for _try in 1 2 3; do
        # -w writes the status AFTER the body so a non-2xx can be told apart
        # from a successful read: a 403 body is valid, non-empty JSON and would
        # otherwise parse to "your GVC has no locations".
        if _RESP=$(${TIMEOUT_CMD} curl -sS --max-time 6 -w '\n%{http_code}' \
              -H "Authorization: ${CPLN_TOKEN:-}" \
              "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>/dev/null); then
          _CODE="${_RESP##*$'\n'}"
          GVC_JSON="${_RESP%$'\n'*}"
          if [ "${_CODE}" = "200" ] && [ -n "${GVC_JSON}" ]; then break; fi
          if [ -n "${_CODE}" ] && [ "${_CODE}" != "200" ]; then
            echo "[calcom] GVC read returned HTTP ${_CODE} (attempt ${_try}/3)." >&2
          fi
        fi
        GVC_JSON=""
        sleep 2
      done
    fi

    if [ -z "${GVC_JSON}" ]; then
      echo "[calcom] WARNING: could not read GVC '${GVC}' (no 200 response) -- skipping the extra-location report. If this persists, check that the identity has 'view' on the GVC via this chart's GVC policy." >&2
    else
      GVC_LOCS="$(printf '%s' "${GVC_JSON}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(l.rsplit("/",1)[-1] for l in d.get("spec",{}).get("staticPlacement",{}).get("locationLinks",[])))' 2>/dev/null || true)"
      EXTRA=""
      for _loc in ${GVC_LOCS}; do
        if [ "${_loc}" != "${CONFIGURED_LOCATION}" ]; then EXTRA="${EXTRA}${_loc} "; fi
      done
      if [ -n "${EXTRA}" ]; then
        echo "[calcom] WARNING: GVC '${GVC}' also has locations this release does not use: ${EXTRA% }. Cal.com and its cron caller run ONLY in '${CONFIGURED_LOCATION}', but the bundled PostgreSQL subchart cannot be pinned by this chart -- a full, empty database with its own volumeset is running in each of those locations, is never read, and is billed for. Remove those locations from the GVC, or install Cal.com into a single-location GVC." >&2
      fi
    fi

    # --- Wait for PostgreSQL, by speaking PostgreSQL ---
    # Send an SSLRequest and require the one-byte 'S'/'N' reply that only a live
    # backend produces. A TCP connect is NOT a readiness signal here: the mesh
    # sidecar answers it for a dead port and for a nonexistent host alike.
    # Measured in this exact image (2026-08-31): live Postgres -> READY in 0 s;
    # dead port -> NOT-READY; nonexistent host -> NOT-READY; and an
    # accepts-but-never-replies server (the shape the sidecar produces) ->
    # NOT-READY, bounded at 6 s by the `read -t 5`.
    pg_ready() {
      local reply=""
      exec 3<>"/dev/tcp/${DB_HOST}/${DB_PORT}" || return 1
      printf '\x00\x00\x00\x08\x04\xd2\x16\x2f' >&3 || { exec 3>&- 3<&- || true; return 1; }
      IFS= read -r -t 5 -n 1 reply <&3 || true
      exec 3>&- 3<&- || true
      [ "$reply" = "S" ] || [ "$reply" = "N" ]
    }

    echo "[calcom] waiting up to $((MAX_ATTEMPTS * SLEEP_SECONDS))s for PostgreSQL at ${DB_HOST}:${DB_PORT} to answer the Postgres protocol"
    OK=0
    READY=false
    for _i in $(seq 1 "${MAX_ATTEMPTS}"); do
      if pg_ready 2>/dev/null; then
        OK=$((OK + 1))
        if [ "${OK}" -ge "${REQUIRED_OK}" ]; then
          READY=true
          echo "[calcom] PostgreSQL is serving (attempt ${_i})"
          break
        fi
        echo "[calcom] PostgreSQL answered; confirming stability (${OK}/${REQUIRED_OK})"
      else
        OK=0
        echo "[calcom] PostgreSQL not serving yet (attempt ${_i}/${MAX_ATTEMPTS})"
      fi
      sleep "${SLEEP_SECONDS}"
    done

    if [ "${READY}" != "true" ]; then
      echo "[calcom] FATAL: PostgreSQL at ${DB_HOST}:${DB_PORT} did not answer the Postgres protocol within $((MAX_ATTEMPTS * SLEEP_SECONDS))s. Refusing to start: continuing would serve Cal.com against a database it cannot migrate. Check the backing store's workload." >&2
      exit 1
    fi

    # --- Upstream's boot, with the migration made fatal ---
    # Rewrite the statically built NEXT_PUBLIC_WEBAPP_URL, exactly as upstream's
    # start.sh does. Guarded because an EMPTY "from" value would make the
    # script's `sed s||TO|g` insert the URL at every position of every built
    # asset. Skipped entirely when the two are equal, which is the private
    # default (the baked value is http://localhost:3000).
    if [ -n "${BUILT_NEXT_PUBLIC_WEBAPP_URL:-}" ] && [ -n "${NEXT_PUBLIC_WEBAPP_URL:-}" ]; then
      scripts/replace-placeholder.sh "${BUILT_NEXT_PUBLIC_WEBAPP_URL}" "${NEXT_PUBLIC_WEBAPP_URL}"
    else
      echo "[calcom] WARNING: BUILT_NEXT_PUBLIC_WEBAPP_URL or NEXT_PUBLIC_WEBAPP_URL is empty -- skipping the built-asset URL rewrite." >&2
    fi

    # `set -e` makes this fatal. `prisma migrate deploy` exits 1 on P1001
    # (verified against the pinned image), so a database that is reachable but
    # unusable crash-loops the container instead of serving an empty schema.
    # Migrations take a Postgres advisory lock, so concurrent replica boots are
    # safe: one applies, the rest wait and no-op.
    npx prisma migrate deploy --schema /calcom/packages/prisma/schema.prisma

    # NOT fatal, deliberately: the seed upserts each app-store entry with its
    # own error handling, and a partial failure is a degraded integrations list,
    # not an unusable install. Loud enough to find in the log.
    if ! npx ts-node --transpile-only /calcom/scripts/seed-app-store.ts; then
      echo "[calcom] WARNING: the app-store seed did not complete. Cal.com will start, but some integrations may be missing from Settings -> Apps." >&2
    fi

    exec yarn start
