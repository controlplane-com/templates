# ─── Cal.com application ──────────────────────────────────────────────────────
calcom:
  image: calcom/cal.com:v6.2.0
  # 1 = the proven single-instance shape. 2+ = an always-on scaled tier for
  # zero-downtime rolling restarts. Replicas never talk to each other; they share
  # only the database and the auth secret below.
  replicas: 1
  # Public base URL used for booking links, emails and auth redirects. Empty =
  # derived: the platform canonical endpoint when publicAccess is on, otherwise
  # http://localhost:3000 so the `cpln port-forward` first run works. Set WITH a
  # scheme only for a custom domain, e.g. https://cal.example.com
  appUrl: ""
  resources:
    minCpu: 500m
    maxCpu: 2
    minMemory: 1Gi
    maxMemory: 4Gi # boot runs migrations + app-store seed; an OOM kill is silent
  auth:
    # REQUIRED PREREQUISITE SECRET — CREATE IT BEFORE YOU INSTALL. If it does not
    # exist the deployment WEDGES silently and `cpln logs` returns nothing; the
    # missing secret is named only in `status.versions[].message`.
    # A `dictionary` secret with exactly four keys:
    #   nextAuthSecret — signs session tokens        (openssl rand -base64 32)
    #   encryptionKey  — CALENDSO_ENCRYPTION_KEY, encrypts stored calendar and
    #                    app credentials; MUST be exactly 32 characters and
    #                    CANNOT be rotated without orphaning them all
    #                                                (openssl rand -base64 24)
    #   cronSecret     — guards the scheduled-job endpoints (openssl rand -hex 32)
    #   cronApiKey     — legacy cron header form            (openssl rand -hex 32)
    # See README Prerequisites for the exact command.
    secretName: my-calcom-auth

# ─── Scheduled jobs ───────────────────────────────────────────────────────────
# Cal.com runs NO scheduler of its own: without this workload the task queue
# (which carries queued outbound email), calendar-subscription sync and
# credential refresh never run, and every health surface still reads green.
# Requires internalAccess.type other than `none`.
cron:
  enabled: true
  resources:
    cpu: 100m
    memory: 128Mi

# ─── Email (optional) ─────────────────────────────────────────────────────────
# Off by default. With no SMTP server Cal.com falls back to a local sendmail
# binary that does not exist in the image, so booking confirmations, invites and
# password resets are silently dropped. Configure before inviting anyone.
email:
  enabled: false
  fromAddress: no-reply@example.com # EMAIL_FROM
  fromName: Cal.com                 # EMAIL_FROM_NAME
  host: smtp.example.com            # EMAIL_SERVER_HOST
  port: 587                         # EMAIL_SERVER_PORT
  auth:
    # OPTIONAL prerequisite `dictionary` secret holding EMAIL_SERVER_USER and
    # EMAIL_SERVER_PASSWORD, e.g. my-calcom-smtp. Empty = unauthenticated relay.
    secretName: ""

# ─── Access ───────────────────────────────────────────────────────────────────
# A firewall change takes ~30 s to ~10 minutes to propagate — re-poll rather than
# concluding a knob is broken.
publicAccess:
  # false = nothing reaches Cal.com from the internet. A fresh instance grants
  # instance-admin to whoever completes /auth/setup first, and self-service
  # signup cannot be turned off by configuration, so claim the admin account
  # over `cpln port-forward` first and only then set this true.
  enabled: false

internalAccess:
  type: same-gvc # options: none, same-gvc, same-org, workload-list
  # Only used when type is workload-list. This release's OWN workloads (the app
  # and, when it renders, the cron caller) are added automatically — the cron
  # workload's calls arrive on this list, so one naming only your clients would
  # silently stop every scheduled job. List your clients here; do not list this
  # release's workloads.
  workloads: []
  # workloads:
  #   - //gvc/GVC_NAME/workload/WORKLOAD_NAME

# ─── Backing store: single-instance PostgreSQL (default) ──────────────────────
# set postgresHA.enabled: true (and postgres.enabled: false) for near-zero-downtime
# failover. Every knob of the `postgres` template is available under this key,
# including scheduled backups — see "Backup setup" in the README.
postgres:
  enabled: true
  image: postgres:18
  # Name of the database Cal.com uses. Not a credential: it is also interpolated
  # into DATABASE_URL at render time, which a secret reference cannot be.
  database: calcom
  # Credentials for the bundled database — internal plumbing no human types
  # elsewhere. This chart CREATES the dictionary secret named by
  # config.credentialsSecretName out of these and postgres.database, so there is
  # nothing for you to create before installing.
  credentials:
    username: calcom
    password: change-me-calcom-db # used as-is — change before installing
  config:
    # Name of the dictionary secret this chart creates and the bundled postgres
    # reads. Secret names are org-wide: give each calcom release its own name. A
    # second release left on this name is REFUSED at install (it is owned by the
    # first release) — nothing is shared, overwritten or deleted.
    credentialsSecretName: my-calcom-db-credentials
  resources:
    minCpu: 250m
    maxCpu: 1
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10 # initial capacity in GiB (minimum is 10)
  # Scheduled backups of the Cal.com database to object storage (off by default).
  # Pass-through to the postgres template's native backup — see README "Backup setup".
  backup:
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0 # 18.1.0 = PG18, 17.1.0 = PG17
    schedule: "0 2 * * *" # daily at 2am UTC
    resources:
      cpu: 100m
      memory: 128Mi
    provider: aws # aws, gcp, or minio
    aws:
      bucket: my-calcom-bucket
      region: us-east-1
      cloudAccountName: my-s3-cloud-account
      policyName: my-calcom-backup-policy
      prefix: calcom/backups
    gcp:
      bucket: my-calcom-bucket
      cloudAccountName: my-gcs-cloud-account
      prefix: calcom/backups
    minio: # any S3-compatible endpoint (e.g. an internal MinIO template)
      endpoint: http://my-minio-workload:9000
      bucket: my-calcom-bucket
      # REQUIRED prerequisite dictionary secret holding `accessKey` and `secretKey`,
      # only when backup is enabled with provider: minio. See README "Backup setup".
      credentialsSecretName: my-calcom-minio-credentials
      prefix: calcom/backups

# ─── Backing store: highly available PostgreSQL (optional) ────────────────────
# Enable this AND set postgres.enabled: false. A Patroni-managed 3-replica store
# with automatic failover behind an HAProxy leader endpoint.
postgresHA:
  enabled: false
  config:
    # Both stores are fed the SAME secret this chart builds from
    # postgres.credentials.* above — keep this equal to
    # postgres.config.credentialsSecretName.
    credentialsSecretName: my-calcom-db-credentials
  replicas: 3
  volumeset:
    capacity: 10 # initial capacity in GiB per replica (minimum is 10)
  # Pass-through to the postgres-highly-available template's native backup.
  backup:
    enabled: false
    mode: logical # logical or wal-g
    resources:
      cpu: 100m
      memory: 512Mi # 128Mi OOMKills wal-g mid-backup
    logical:
      image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
      schedule: "0 2 * * *" # daily at 2am UTC
    walg:
      intervalSeconds: 21600 # every 6 hours
    provider: aws # aws, gcp, or minio
    aws:
      bucket: my-calcom-bucket
      region: us-east-1
      cloudAccountName: my-s3-cloud-account
      policyName: my-calcom-backup-policy
      prefix: calcom/backups
    gcp:
      bucket: my-calcom-bucket
      cloudAccountName: my-gcs-cloud-account
      prefix: calcom/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-calcom-bucket
      credentialsSecretName: my-calcom-minio-credentials
      prefix: calcom/backups
