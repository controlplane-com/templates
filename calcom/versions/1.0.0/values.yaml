# ─── Location ─────────────────────────────────────────────────────────────────
# The ONE location of your GVC that Cal.com runs in; it must already be a GVC location.
location: aws-us-east-1

# ─── Cal.com application ──────────────────────────────────────────────────────
calcom:
  image: calcom/cal.com:v6.2.0
  replicas: 1          # stateless; 2+ keeps the UI up through a rolling restart
  appUrl: ""           # empty = canonical endpoint (http://localhost:3000 when private); custom domain with scheme, e.g. https://cal.example.com
  resources:
    minCpu: 500m
    maxCpu: 2
    minMemory: 1Gi
    maxMemory: 4Gi     # boot runs migrations and the app-store seed
  auth:
    # REQUIRED — MUST EXIST BEFORE INSTALL, or the deployment WEDGES silently. A `dictionary` with the keys
    # nextAuthSecret, encryptionKey (exactly 32 characters), cronSecret and cronApiKey (see README Prerequisites).
    secretName: my-calcom-auth

# ─── Scheduled jobs ───────────────────────────────────────────────────────────
cron:
  enabled: true        # calls Cal.com's scheduled-job endpoints every minute; needs internalAccess.type other than none
  resources:
    cpu: 100m
    memory: 128Mi

# ─── Email ────────────────────────────────────────────────────────────────────
email:
  enabled: false       # off = no booking confirmations, invites or password resets
  fromAddress: no-reply@example.com
  fromName: Cal.com
  host: smtp.example.com
  port: 587
  auth:
    secretName: ""     # optional dictionary with username + password, e.g. my-calcom-smtp; empty = unauthenticated relay

# ─── Access ───────────────────────────────────────────────────────────────────
publicAccess:
  enabled: false       # claim the admin account over `cpln port-forward` first, then set true
internalAccess:
  type: same-gvc       # none | same-gvc | same-org | workload-list
  workloads: []        # workload-list only; this release's own workloads are always added
  # workloads:
  #   - //gvc/GVC_NAME/workload/WORKLOAD_NAME

# ─── Database: single-instance PostgreSQL (default) ───────────────────────────
# set postgresHA.enabled: true (and postgres.enabled: false) for near-zero-downtime upgrades and failover
postgres:
  enabled: true
  image: postgres:18
  config:
    # REQUIRED — MUST EXIST BEFORE INSTALL, or the deployment WEDGES silently. A `dictionary` with the
    # URL-safe keys username, password, database (see README Prerequisites).
    credentialsSecretName: my-calcom-db-credentials
  resources:
    minCpu: 250m
    maxCpu: 1
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10       # GiB (minimum 10)

  backup:              # pass-through to the postgres template's backup feature
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0   # tag must match the postgres major
    schedule: "0 2 * * *"   # daily at 02:00 UTC
    resources:
      cpu: 100m
      memory: 128Mi
    provider: aws      # aws | gcp | minio
    aws:
      bucket: my-calcom-backup-bucket
      region: us-east-1
      cloudAccountName: my-calcom-backup-cloudaccount
      policyName: my-calcom-backup-policy
      prefix: calcom/backups
    gcp:
      bucket: my-calcom-backup-bucket
      cloudAccountName: my-calcom-backup-cloudaccount
      prefix: calcom/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-calcom-backup-bucket
      credentialsSecretName: my-calcom-minio-credentials   # provider minio only: dictionary with accessKey + secretKey
      prefix: calcom/backups

# ─── Database: highly available PostgreSQL (opt-in) ───────────────────────────
# 3 Patroni replicas, 3 etcd and an HAProxy leader endpoint; enable exactly one of postgres / postgresHA.
postgresHA:
  enabled: false
  config:
    # REQUIRED in HA mode — MUST EXIST BEFORE INSTALL. Same `dictionary` shape as postgres.config above.
    credentialsSecretName: my-calcom-db-credentials
  replicas: 3
  volumeset:
    capacity: 10       # GiB per replica (minimum 10)

  backup:              # pass-through to the postgres-highly-available template's backup feature
    enabled: false
    mode: logical      # logical | wal-g
    resources:
      cpu: 100m
      memory: 512Mi    # 128Mi OOM-kills wal-g mid-backup
    logical:
      image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
      schedule: "0 2 * * *"   # daily at 02:00 UTC
    walg:
      intervalSeconds: 21600  # every 6 hours
    provider: aws      # aws | gcp | minio
    aws:
      bucket: my-calcom-backup-bucket
      region: us-east-1
      cloudAccountName: my-calcom-backup-cloudaccount
      policyName: my-calcom-backup-policy
      prefix: calcom/backups
    gcp:
      bucket: my-calcom-backup-bucket
      cloudAccountName: my-calcom-backup-cloudaccount
      prefix: calcom/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-calcom-backup-bucket
      credentialsSecretName: my-calcom-minio-credentials   # provider minio only: dictionary with accessKey + secretKey
      prefix: calcom/backups
