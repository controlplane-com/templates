# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Apache Cassandra
# Stateful nodes with no location handling: every GVC location would run its own cluster on its own volumes.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: credentials
    title: Credentials
    description: The prerequisite secret with the superuser password, the application role and its keyspace.
    fields:
      - type: note
        severity: warning
        text: >-
          The credentials secret must exist **before** you install. If it is missing, the deployment
          wedges silently: `cpln logs` shows nothing, and only `cpln workload get-deployments
          RELEASE_NAME-cassandra --gvc GVC_NAME -o yaml` shows the reason. Creating the secret repairs the
          deployment on its own in roughly 5.5 to 10.5 minutes, or force a redeployment to skip the wait.
        textExpression: >-
          'The credentials secret must exist **before** you install. If it is missing, the deployment
          wedges silently: `cpln logs` shows nothing, and only `cpln workload get-deployments ' +
          context.releaseName + '-cassandra' + (context.gvc != null ? ' --gvc ' + context.gvc : '') +
          ' -o yaml` shows the reason. Creating the secret repairs the deployment on its own in roughly 5.5
          to 10.5 minutes, or force a redeployment to skip the wait.'
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.1.0') < 0
        text: >-
          Upgrading from 1.0.x: `superuserPassword`, `username`, `password` and `keyspaceName` are no
          longer values, and the upgrade drops them. Create the secret with the credentials the cluster
          **already has**, taken from your current release values: Cassandra applied them on its first
          boot, and other values in the secret do not change them (`keyspaceName` becomes the `keyspace`
          key). Give the secret a new name: the `RELEASE_NAME-cassandra-credentials` secret that 1.0.x
          created belongs to the release, and this upgrade deletes it, or with backups on rewrites it with
          only the backup bucket settings. The upgrade restarts every node once, one at a time; while the
          application keyspace keeps one copy of each partition (replication factor 1), the data of each
          node is unavailable during its restart, so upgrade in a quiet period. 1.0.x shipped default
          credentials that are published in the template repository: if the dropped values
          are `supersecretpassword` or `password`, rotate them after the upgrade as described in
          [Rotating credentials](#rotating-credentials). See [Upgrading from 1.0.x](#upgrading-from-1-0-x).
      - path: credentialsSecretName
        type: ref
        label: Credentials secret
        required: true
        description: >-
          A dictionary secret with the keys `superuserPassword` (the built-in `cassandra` role, used for
          JMX and by the optional repair and backup jobs), `username`, `password` and `keyspace` (the
          application role and its keyspace). Secret names are org-wide: give each release its own.
        help: >-
          Node 0 applies these once, on the cluster's first boot; changing the secret later does not
          change the roles in Cassandra. `superuserPassword` is still read at every start (node 0's start
          check and the JMX password file) and by every repair and backup run, so rotate a password inside
          Cassandra first, then update the secret and force a redeployment of the nodes (see
          [Rotating credentials](#rotating-credentials)). The first-boot script writes the keyspace into
          CQL unquoted and the username and passwords inside single quotes, so use a keyspace of letters,
          digits and underscores that starts with a letter, and no `'` in the other three values.
        docs: "#credentials"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [superuserPassword, username, password, keyspace]
          create:
            suggestName: "context.releaseName + '-cassandra-auth'"
    rules:
      - rule: >-
          !has(self.superuserPassword) && !has(self.username) && !has(self.password) &&
          !has(self.keyspaceName)
        mirrors: cassandra.validateCredentials
        paths: [credentialsSecretName]
        message: >-
          `superuserPassword`, `username`, `password` and `keyspaceName` were removed in 1.1.0. Put them in
          the dictionary secret (`keyspaceName` becomes the `keyspace` key) and remove them from the values.
      - rule: >-
          oldSelf == null || oldSelf.credentialsSecretName == null || oldSelf.credentialsSecretName == '' ||
          self.credentialsSecretName == oldSelf.credentialsSecretName
        severity: info
        paths: [credentialsSecretName]
        message: >-
          Cassandra applied the credentials on its first boot, so another secret does not change them. Its
          `superuserPassword` must still be the cluster's superuser password: node 0 checks it at every
          start and restarts after 300 seconds when it does not match. Switching the secret also restarts
          every node, one at a time, since each node reads its credentials from it.
      # 1.1.x creates <release>-cassandra-credentials only with backups on (secret-credentials.yaml:1);
      # 1.0.x created it always, so an upgrade from 1.0.x with backups off deletes it.
      - when: >-
          self.backup.enabled == true || (context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.1.0') < 0)
        rule: self.credentialsSecretName != context.releaseName + '-cassandra-credentials'
        paths: [credentialsSecretName]
        messageExpression: >-
          '`' + context.releaseName + '-cassandra-credentials` is a secret the chart manages: ' +
          (self.backup.enabled == true ? 'with backups on, the chart writes it with only the backup bucket settings.' :
          'this upgrade deletes it, because this version creates it only with backups on.') +
          ' Choose a credentials secret with another name.'
        message: >-
          `RELEASE_NAME-cassandra-credentials` is a secret the chart manages: with backups on, the chart
          writes it with only the backup bucket settings, and an upgrade from 1.0.x with backups off
          deletes it. Choose a credentials secret with another name.

  - id: cluster
    title: Cluster
    description: How many nodes run, how many copies of each partition they keep, and the Cassandra image.
    fields:
      - path: replicas
        type: integer
        label: Nodes
        required: true
        min: 1
        suggestions: [1, 3, 5]
        description: Each node is a stateful replica with its own volume and a slice of the token ring.
        docs: "#cluster-size-and-replication"
        help: >-
          Adding nodes after the first install does not rebalance the existing data: after raising the
          count, run `nodetool rebuild` on each new node and then `nodetool cleanup` on each existing one
          (see [Scaling and availability](#scaling-and-availability)).
      - path: replicationFactor
        type: integer
        label: Replication factor
        required: true
        min: 1
        suggestions: [1, 2, 3]
        description: >-
          Copies of each partition in the application keyspace. The chart applies it once, when it creates
          the keyspace on the first boot.
      - path: image
        type: string
        format: image
        label: Cassandra image
        required: true
        description: The optional repair job runs this image too.
        docs: "#image-and-resources"
      - path: multiZone.enabled
        type: boolean
        label: Spread nodes across zones
        required: true
        description: >-
          Control Plane spreads the nodes across the availability zones of the location. Check that the
          location supports multiple zones first.
        help: >-
          This places nodes, not copies: the chart creates the keyspaces with `SimpleStrategy` and puts
          every node in rack `rack1`, so with more nodes than the replication factor, several copies of a
          partition can land in one zone.
        docs: "#multi-zone"
      - path: clusterName
        type: string
        label: Cluster name
        required: true
        immutable: >-
          Cassandra stores the cluster name on each node's volume at first start and refuses to start
          under another name.
        advanced: true
        description: >-
          Cassandra keeps it on each node's volume from the first start, so it cannot change after the
          install.
        pattern: '^[^''\x00-\x1f\x7f-\x9f\u2028\u2029\ufffe\uffff]*$'
        patternMessage: Leave out single quotes ('), line breaks and control characters.
    rules:
      - rule: self.replicationFactor <= self.replicas
        mirrors: cassandra.validate
        paths: [replicationFactor]
        messageExpression: >-
          'The replication factor (' + string(self.replicationFactor) + ') cannot exceed the number of
          nodes (' + string(self.replicas) + ').'
        message: The replication factor cannot exceed the number of nodes.
      # Install only: the chart applies the factor when it creates the keyspace on the first boot;
      # on upgrade the rule after the next one speaks.
      - when: oldSelf == null
        rule: self.replicationFactor >= 3
        severity: info
        paths: [replicationFactor]
        messageExpression: >-
          'The application keyspace keeps ' + string(self.replicationFactor) +
          (self.replicationFactor == 1 ? ' copy' : ' copies') + ' of each partition. For production use a
          replication factor of 3, with at least 3 nodes, so the cluster can survive a node failure while
          still achieving quorum.'
        message: >-
          For production use a replication factor of 3, with at least 3 nodes, so the cluster can survive
          a node failure while still achieving quorum.
      - rule: oldSelf == null || self.replicationFactor == oldSelf.replicationFactor
        severity: info
        paths: [replicationFactor]
        message: >-
          The chart applies the replication factor only when it creates the keyspace on the first boot, so
          this change does not alter the existing keyspace. Change the keyspace itself with `ALTER KEYSPACE`
          in cqlsh, then run `nodetool repair` on every node after raising it or `nodetool cleanup` after
          lowering it, and keep this value equal to its factor.
      - rule: oldSelf == null || self.replicas <= oldSelf.replicas
        severity: info
        paths: [replicas]
        message: >-
          Adding nodes does not rebalance the existing data. After the upgrade, run `nodetool rebuild` on
          each new node, then `nodetool cleanup` on each node that was there before.
      - rule: oldSelf == null || self.replicas >= oldSelf.replicas
        severity: info
        paths: [replicas]
        message: >-
          Lowering the node count stops the highest-numbered nodes without decommissioning them (a
          stopping node only runs `nodetool drain`), so they stay in the ring as down. Before you upgrade,
          run `nodetool decommission` on each node you remove. Cassandra refuses to decommission below a
          keyspace's replication factor, and the chart created `system_auth` with one copy per node on the
          first boot, so first lower it, and any keyspace above the new count, with `ALTER KEYSPACE`.
      - rule: oldSelf == null || self.image == oldSelf.image
        severity: info
        paths: [image]
        message: A new Cassandra image restarts every node, one at a time; the repair job, when on, runs it too.

  - id: resources
    title: Resources and storage
    description: The compute, JVM heap and data volume of each node.
    sections:
      - title: Node resources
        docs: "#image-and-resources"
        fields:
          - path: cpu
            type: quantity
            quantity: cpu
            label: CPU per node
            required: true
            min: 25m
            suggestions: ["500m", "1", "2", "4"]
          - path: memory
            type: quantity
            quantity: memory
            label: Memory per node
            required: true
            min: 32Mi
            suggestions: [2Gi, 4Gi, 8Gi, 16Gi]
          - path: jvmHeapSize
            type: string
            label: JVM heap size
            required: true
            pattern: '^[1-9][0-9]{0,6}[kKmMgG]$'
            patternMessage: Enter a size with its unit, such as 2G or 2048M.
            suggestions: [1G, 2G, 4G, 8G]
            description: >-
              Cassandra keeps bloom filters, caches and the OS page cache outside the heap, in the rest of
              the node's memory.
        rules:
          - rule: memoryBytes(self.memory) <= cpuMillicores(self.cpu) * 8388608
            paths: [memory]
            messageExpression: >-
              'With ' + string(cpuMillicores(self.cpu)) + 'm of CPU, the memory can be at most ' +
              string(cpuMillicores(self.cpu) * 8) + 'Mi (8 MiB per millicore). Raise the CPU or lower the memory.'
            message: The memory can be at most 8 MiB per millicore of CPU. Raise the CPU or lower the memory.
          - when: self.jvmHeapSize.matches('^[1-9][0-9]{0,6}[kKmMgG]$')
            rule: >-
              (self.jvmHeapSize.matches('[gG]$') ? int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1073741824 :
              self.jvmHeapSize.matches('[mM]$') ? int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1048576 :
              int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1024) < memoryBytes(self.memory)
            paths: [jvmHeapSize]
            message: >-
              The JVM heap must be smaller than the memory per node; Cassandra also needs memory outside
              the heap.
          # Only between half and all of the memory: at or above it, the error rule above speaks.
          - when: self.jvmHeapSize.matches('^[1-9][0-9]{0,6}[kKmMgG]$')
            rule: >-
              (self.jvmHeapSize.matches('[gG]$') ? int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1073741824 :
              self.jvmHeapSize.matches('[mM]$') ? int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1048576 :
              int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1024) * 2 <= memoryBytes(self.memory) ||
              (self.jvmHeapSize.matches('[gG]$') ? int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1073741824 :
              self.jvmHeapSize.matches('[mM]$') ? int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1048576 :
              int(self.jvmHeapSize.substring(0, size(self.jvmHeapSize) - 1)) * 1024) >= memoryBytes(self.memory)
            severity: info
            paths: [jvmHeapSize]
            message: >-
              The heap is more than half the memory per node. The chart recommends a heap of about 50% of
              the memory, leaving the rest for bloom filters, caches and the OS page cache.
          - rule: oldSelf == null || cpuMillicores(self.cpu) == cpuMillicores(oldSelf.cpu)
            severity: info
            paths: [cpu]
            message: Changing the CPU restarts every node, one at a time.
          - rule: oldSelf == null || memoryBytes(self.memory) == memoryBytes(oldSelf.memory)
            severity: info
            paths: [memory]
            message: Changing the memory restarts every node, one at a time.
          - rule: oldSelf == null || self.jvmHeapSize == oldSelf.jvmHeapSize
            severity: info
            paths: [jvmHeapSize]
            message: Changing the JVM heap size restarts every node, one at a time.
      - title: Data volume
        docs: "#storage"
        fields:
          - path: volumes.data.initialCapacity
            type: integer
            label: Initial capacity per node
            unit: GiB
            required: true
            min: 10
            max: 65536
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Each node has its own volume for its data, commit log and saved caches.
            help: Uninstalling the release deletes the volume set with the data.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.volumes.data.initialCapacity >= oldSelf.volumes.data.initialCapacity
            paths: [volumes.data.initialCapacity]
            message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - title: Volume autoscaling
        description: Each volume grows by the scaling factor whenever its free space drops below the threshold.
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumes.data.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            required: true
            min: 10
            max: 65536
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumes.data.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            required: true
            min: 1
            max: 100
            suggestions: [10, 20, 30]
          - path: volumes.data.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            required: true
            min: 1.1
            step: 0.1
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2×" }
              - { value: 1.5, label: "1.5× (default)" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumes.data.autoscaling.maxCapacity >= self.volumes.data.initialCapacity
            paths: [volumes.data.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.

  - id: network
    title: Network
    description: Which workloads can connect to Cassandra.
    fields:
      - path: internal_access.type
        type: enum
        label: Who can connect
        widget: cards
        required: true
        options:
          - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
          - { value: same-org, label: Same org, description: Any workload in this org. }
          - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
      - path: internal_access.workloads
        type: list
        label: Allowed workloads
        widget: tags
        unique: true
        description: >-
          Workloads allowed to connect besides the choice above, for example from another GVC; with
          Specific workloads, the only ones.
        docs: /reference/workload/firewall
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
            excludeTargetGvcWhen: self.internal_access.type == 'same-gvc'
    rules:
      - when: self.internal_access.type == 'same-gvc' && context.gvc != null
        rule: "!self.internal_access.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
        severity: info
        paths: [internal_access.workloads]
        messageExpression: >-
          'Same GVC already allows every workload in this GVC: ' +
          self.internal_access.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
          ' can be removed from the list.'
        message: >-
          Same GVC already allows every workload in this GVC, so those entries can be removed from the
          list.
      # workload-cassandra.yaml:129-130 writes any non-empty list into inboundAllowWorkload, whatever the type.
      - when: self.internal_access.type == 'same-org'
        rule: size(self.internal_access.workloads) == 0
        severity: info
        paths: [internal_access.workloads]
        message: Same org already lets every workload of the org connect, so these entries add nothing.
      - when: self.internal_access.type == 'none'
        rule: size(self.internal_access.workloads) == 0
        severity: warning
        paths: [internal_access.workloads]
        message: >-
          The chart still writes these workloads into the firewall, where the platform checks every entry, but "None" lets none of them connect. Remove them.
      - when: self.internal_access.type == 'workload-list'
        rule: size(self.internal_access.workloads) > 0
        severity: warning
        paths: [internal_access.workloads]
        message: With "Specific workloads" and no allowed workloads listed, no client can connect.
      - when: >-
          self.internal_access.type == 'workload-list' && context.gvc != null &&
          self.backup.enabled == true && self.backup.type == 'logical'
        rule: >-
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-cassandra-backup') in
          self.internal_access.workloads
        severity: warning
        paths: [internal_access.workloads]
        messageExpression: >-
          'The chart does not add its own workloads to the list. Add //gvc/' + context.gvc + '/workload/' +
          context.releaseName + '-cassandra-backup, or the logical backup job cannot reach the cluster.'
        message: >-
          The chart does not add its own workloads to the list. Add the logical backup job's workload, or
          it cannot reach the cluster.
        fix:
          path: internal_access.workloads
          items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-cassandra-backup']"

  - id: maintenance
    title: Repair and backups
    description: Scheduled anti-entropy repair and backups to object storage, each optional.
    sections:
      - id: repair
        title: Scheduled repair
        toggle: repair.enabled
        description: >-
          A cron job runs `nodetool repair` on every node in turn. Repair must complete on every node at
          least once within `gc_grace_seconds` (10 days by default), or deleted data can reappear after a
          node recovers from downtime, so keep it on in production.
        docs: "#repair"
        fields:
          - path: repair.schedule
            type: string
            format: cron
            label: Repair schedule (UTC)
            required: true
            pattern: '^(?![\s\S]*/0+(?![0-9]))\S(?:[\s\S]*\S)?$'
            patternMessage: Leave out a step of 0 and any spaces or line breaks at the start or end.
            help: >-
              Repair is resource-intensive on large datasets; schedule it for a low-traffic window rather
              than turning it off.
        rules:
          - when: size(self.repair.schedule.split(' ')) == 5
            rule: >-
              self.repair.schedule.split(' ')[3] == '*' &&
              (self.repair.schedule.split(' ')[2] == '*' || self.repair.schedule.split(' ')[4] != '*')
            severity: info
            paths: [repair.schedule]
            message: >-
              The repair schedule may leave more than 10 days between repairs. Repair must complete on every node
              at least once within `gc_grace_seconds` (10 days by default), or deleted data can reappear;
              the default weekly schedule fits with margin.
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        description: >-
          Backs up the application keyspace (logical) or every node's SSTables (physical) to S3 or GCS.
          Neither restore path has been verified end to end with this template: rehearse a restore on a
          scratch install before you rely on it.
        docs: "#backup"
        fields:
          - path: backup.type
            type: enum
            label: Backup type
            widget: cards
            required: true
            options:
              - value: logical
                label: Logical (cqlsh COPY TO)
                description: >-
                  A cron job exports each table of the application keyspace as a gzipped CSV. Suits smaller
                  datasets, or when portability matters.
              - value: physical
                label: Physical (nodetool snapshot)
                description: >-
                  A sidecar on every node uploads SSTable snapshots, which are restored node by node. The
                  Cassandra workload gets outbound internet access.
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: backup.schedule
            type: string
            format: cron
            label: Backup schedule (UTC)
            required: true
            pattern: '^(?![\s\S]*/0+(?![0-9]))\S(?:[\s\S]*\S)?$'
            patternMessage: Leave out a step of 0 and any spaces or line breaks at the start or end.
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
          - path: backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
            description: For the logical backup job, or for the sidecar on each node with physical backups.
        rules:
          # With physical backups the sidecar runs in every node's pod (workload-cassandra.yaml:74-100):
          # a change to its image, schedule, resources, provider or prefix rolls every node.
          - when: >-
              oldSelf != null && self.backup.type == 'physical' && oldSelf.backup.enabled == true &&
              oldSelf.backup.type == 'physical'
            rule: >-
              oldSelf == null || self.backup.image == oldSelf.backup.image
            severity: info
            paths: [backup.image]
            message: >-
              Changing the backup image restarts every node, one at a time: with physical backups the backup
              sidecar runs on every node.
          - when: >-
              oldSelf != null && self.backup.type == 'physical' && oldSelf.backup.enabled == true &&
              oldSelf.backup.type == 'physical'
            rule: >-
              oldSelf == null || self.backup.schedule == oldSelf.backup.schedule
            severity: info
            paths: [backup.schedule]
            message: >-
              Changing the backup schedule restarts every node, one at a time: with physical backups it is
              part of the backup sidecar on every node.
          - when: >-
              oldSelf != null && self.backup.type == 'physical' && oldSelf.backup.enabled == true &&
              oldSelf.backup.type == 'physical'
            rule: >-
              oldSelf == null ||
              (cpuMillicores(self.backup.resources.cpu) == cpuMillicores(oldSelf.backup.resources.cpu) &&
              memoryBytes(self.backup.resources.memory) == memoryBytes(oldSelf.backup.resources.memory))
            severity: info
            paths: [backup.resources]
            message: >-
              Changing the backup resources restarts every node, one at a time: with physical backups they
              size the backup sidecar on every node.
          - when: >-
              oldSelf != null && self.backup.type == 'physical' && oldSelf.backup.enabled == true &&
              oldSelf.backup.type == 'physical'
            rule: >-
              oldSelf == null || self.backup.provider == oldSelf.backup.provider
            severity: info
            paths: [backup.provider]
            message: >-
              Changing the backup destination restarts every node, one at a time: with physical backups it is
              part of the backup sidecar on every node.
      - id: aws
        title: AWS S3
        when: self.backup.enabled == true && self.backup.provider == 'aws'
        fields:
          - type: note
            severity: warning
            text: >-
              This version also attaches the AWS managed policy `aws::ReadOnlyAccess` to the backup identity,
              which grants read access to every bucket in your AWS account, not just the backup bucket.
              Version 1.1.1 removes it.
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits, dots and dashes, starting and ending with a letter or
              digit.
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            pattern: '^[^\x00-\x1f\x7f-\x9f\u2028\u2029\ufffe\uffff]*$'
            patternMessage: Leave out line breaks and control characters.
            help: >-
              Allow `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject`, `s3:ListBucket`,
              `s3:GetObjectVersion` and `s3:DeleteObjectVersion` on the bucket and its objects. The chart
              attaches it to the release's identity together with `cpln-connector` and `aws::ReadOnlyAccess`.
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: '^[^\x00-\x1f\x7f-\x9f\u2028\u2029\ufffe\uffff]*$'
            patternMessage: Leave out line breaks and control characters.
            rules:
              # `quote` on a null prefix renders BACKUP_PREFIX with no value (workload-backup.yaml:25,
              # workload-cassandra.yaml:93).
              - rule: self.backup.aws.prefix != null
                message: The S3 folder prefix is null. Write an empty prefix as "".
        rules:
          - when: >-
              oldSelf != null && self.backup.type == 'physical' && oldSelf.backup.enabled == true &&
              oldSelf.backup.type == 'physical' &&
              oldSelf.backup.provider == 'aws'
            rule: oldSelf == null || self.backup.aws.prefix == oldSelf.backup.aws.prefix
            severity: info
            paths: [backup.aws.prefix]
            message: >-
              Changing the S3 folder prefix restarts every node, one at a time: with physical backups it is
              part of the backup sidecar on every node.
      - id: gcs
        title: Google Cloud Storage
        when: self.backup.enabled == true && self.backup.provider == 'gcp'
        fields:
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^(?:[a-z0-9][a-z0-9_-]{1,61}[a-z0-9]|(?=.{3,222}$)[a-z0-9](?:[a-z0-9_-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9_-]{0,61}[a-z0-9])?)+)$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits, dashes and underscores, starting and ending with a
              letter or digit; a name with dots may have up to 222 characters, at most 63 between dots.
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage
              Admin role. The chart also binds the backup identity to `roles/storage.objectAdmin` on the
              bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: '^[^\x00-\x1f\x7f-\x9f\u2028\u2029\ufffe\uffff]*$'
            patternMessage: Leave out line breaks and control characters.
            rules:
              # `quote` on a null prefix renders BACKUP_PREFIX with no value (workload-backup.yaml:29,
              # workload-cassandra.yaml:97).
              - rule: self.backup.gcp.prefix != null
                message: The GCS folder prefix is null. Write an empty prefix as "".
        rules:
          - when: >-
              oldSelf != null && self.backup.type == 'physical' && oldSelf.backup.enabled == true &&
              oldSelf.backup.type == 'physical' &&
              oldSelf.backup.provider == 'gcp'
            rule: oldSelf == null || self.backup.gcp.prefix == oldSelf.backup.gcp.prefix
            severity: info
            paths: [backup.gcp.prefix]
            message: >-
              Changing the GCS folder prefix restarts every node, one at a time: with physical backups it is
              part of the backup sidecar on every node.
    rules:
      # The physical sidecar comes and goes with the backups switch, or with the type while backups stay on.
      - when: oldSelf != null && self.backup.enabled != oldSelf.backup.enabled
        rule: >-
          oldSelf == null ||
          (self.backup.enabled == true && self.backup.type == 'physical') ==
          (oldSelf.backup.enabled == true && oldSelf.backup.type == 'physical')
        severity: info
        paths: [backup.enabled]
        message: >-
          Adding or removing the physical backup sidecar restarts every node, one at a time.
      - when: oldSelf != null && self.backup.enabled == oldSelf.backup.enabled
        rule: >-
          oldSelf == null ||
          (self.backup.enabled == true && self.backup.type == 'physical') ==
          (oldSelf.backup.enabled == true && oldSelf.backup.type == 'physical')
        severity: info
        paths: [backup.type]
        message: >-
          Adding or removing the physical backup sidecar restarts every node, one at a time.

migrations:
  - fromVersions: "<1.1.0"
    from: superuserPassword
    note: >-
      Moved to the superuserPassword key of the dictionary secret named under Credentials; create the secret
      with the password the cluster already uses. If it is still the 1.0.x default "supersecretpassword",
      which is published in the template repository, rotate it after the upgrade.
  - fromVersions: "<1.1.0"
    from: username
    note: >-
      Moved to the username key of the dictionary secret named under Credentials; create the secret with the
      role the cluster already has.
  - fromVersions: "<1.1.0"
    from: password
    note: >-
      Moved to the password key of the dictionary secret named under Credentials; create the secret with the
      password the cluster already uses. If it is still the 1.0.x default value "password", which is published
      in the template repository, rotate it after the upgrade.
  - fromVersions: "<1.1.0"
    from: keyspaceName
    note: >-
      Moved to the keyspace key of the dictionary secret named under Credentials; create the secret with the
      keyspace the cluster already has.
