{{- if .Values.backup.enabled }}
kind: secret
name: {{ include "cassandra.secret.credentials.name" . }}
tags: {{- include "cassandra.tags" . | nindent 2 }}
type: dictionary
data:
{{- /*
  Credentials are NOT here any more. They live in the user's prerequisite
  secret named by credentialsSecretName, which the workloads read directly.
  What remains is non-sensitive backup configuration.
*/}}
{{- if and .Values.backup.enabled (eq .Values.backup.provider "aws") }}
  backup-bucket: {{ .Values.backup.aws.bucket | quote }}
  aws-region: {{ .Values.backup.aws.region | quote }}
{{- end }}
{{- if and .Values.backup.enabled (eq .Values.backup.provider "gcp") }}
  backup-bucket: {{ .Values.backup.gcp.bucket | quote }}
{{- end }}
{{- end }}
