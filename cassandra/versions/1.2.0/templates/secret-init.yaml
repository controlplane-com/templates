kind: secret
name: {{ include "cassandra.secret.init.name" . }}
tags: {{- include "cassandra.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |
    #!/bin/bash
    set -euo pipefail

    # Derive own internal FQDN and pod IP from /etc/hosts.
    # Control Plane inserts a line like:
    #   10.x.x.x   cassandra-0.cassandra.<namespace-hash>.svc.cluster.local   cassandra-0
    MY_FQDN=$(grep -E "^[0-9]" /etc/hosts | grep "${HOSTNAME}" | awk '{print $2}')

    if [ -z "${MY_FQDN}" ]; then
      echo "ERROR: Could not derive FQDN for ${HOSTNAME} from /etc/hosts"
      cat /etc/hosts
      exit 1
    fi

    MY_IP=$(grep -E "^[0-9]" /etc/hosts | grep "${HOSTNAME}" | awk '{print $1}')
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
    LOCATION=$(basename "${CPLN_LOCATION}")
    WORKLOAD_NAME=$(basename "${CPLN_WORKLOAD}")
    GVC_NAME=$(basename "${CPLN_GVC}")

    echo "HOSTNAME:       ${HOSTNAME}"
    echo "MY_FQDN:        ${MY_FQDN}"
    echo "MY_IP:          ${MY_IP}"
    echo "REPLICA_INDEX:  ${REPLICA_INDEX}"
    echo "LOCATION:       ${LOCATION}"
    echo "WORKLOAD_NAME:  ${WORKLOAD_NAME}"
    echo "GVC_NAME:       ${GVC_NAME}"

    # Seeds: stable per-replica headless-service FQDNs (K8s stateful-set DNS).
    # Strip the pod-specific prefix from MY_FQDN to get the base domain suffix,
    # then construct the FQDN for every replica without hard-coding the namespace hash.
    FQDN_BASE="${MY_FQDN#${HOSTNAME}.}"
    SEEDS=""
    for i in $(seq 0 $(( {{ .Values.replicas | int }} - 1 ))); do
      SEEDS="${SEEDS}${WORKLOAD_NAME}-${i}.${FQDN_BASE},"
    done
    SEEDS="${SEEDS%,}"
    echo "SEEDS:          ${SEEDS}"

    # Cassandra data dir ownership (cassandra runs as uid 999 in the official image).
    mkdir -p /var/lib/cassandra
    chown -R cassandra:cassandra /var/lib/cassandra 2>/dev/null || true
    rm -rf /var/lib/cassandra/lost+found 2>/dev/null || true

    # Write cassandra-rackdc.properties for DC/rack awareness.
    # DC = location name (e.g. aws-us-east-2), rack = rack1.
    mkdir -p /etc/cassandra
    printf 'dc=%s\nrack=rack1\nprefer_local=true\n' "${LOCATION}" > /etc/cassandra/cassandra-rackdc.properties
    echo "cassandra-rackdc.properties written: dc=${LOCATION} rack=rack1 prefer_local=true"

    # JMX credentials required for remote nodetool (LOCAL_JMX=no enables auth)
    printf 'cassandra %s\n' "${CASS_SUPERUSER_PASSWORD}" > /etc/cassandra/jmxremote.password
    chmod 400 /etc/cassandra/jmxremote.password
    printf 'cassandra readwrite\n' > /etc/cassandra/jmxremote.access
    chmod 644 /etc/cassandra/jmxremote.access
    chown cassandra:cassandra /etc/cassandra/jmxremote.password /etc/cassandra/jmxremote.access 2>/dev/null || true

    # Passwords never go on a command line (argv is readable through /proc by every process in the
    # container). nodetool reads the JMX password file above (-pwf takes the same "user password"
    # format); cqlsh reads a 0600 credentials file in a private 0700 directory.
    nt() { nodetool -u cassandra -pwf /etc/cassandra/jmxremote.password "$@"; }
    CRED_DIR=$(mktemp -d)
    # cql_as PASSWORD ARGS...: cqlsh to the local node as the cassandra superuser
    cql_as() {
      local pw="$1"; shift
      ( umask 077; printf '[plain_text_auth]\nusername = cassandra\npassword = %s\n' "${pw}" > "${CRED_DIR}/credentials" )
      cqlsh --credentials "${CRED_DIR}/credentials" 127.0.0.1 9042 "$@"
    }
    # sq VALUE: VALUE as the inside of a CQL string literal (a single quote is doubled)
    sq() { printf '%s' "$1" | sed "s/'/''/g"; }

    # Copy the mounted config template and replace placeholders with runtime values.
    # (Heredocs cannot be used inside a Helm YAML payload — << is a YAML merge key.)
    cp /cassandra-config/cassandra.yaml /etc/cassandra/cassandra.yaml
    sed -i "s|LISTEN_ADDRESS_PLACEHOLDER|${MY_FQDN}|g" /etc/cassandra/cassandra.yaml
    sed -i "s|SEEDS_PLACEHOLDER|${SEEDS}|g"           /etc/cassandra/cassandra.yaml

    echo "cassandra.yaml written."

    if [ "${REPLICA_INDEX}" = "0" ]; then
      # Replica 0 runs bootstrap after Cassandra is ready.
      # exec cannot be used here because bootstrap runs post-startup, so we
      # background Cassandra, trap SIGTERM for forwarding, and wait on its PID.
      _stop() { kill -TERM "${CASS_PID}" 2>/dev/null; wait "${CASS_PID}" 2>/dev/null || true; }
      trap _stop TERM INT
      # Set HOSTNAME to FQDN so cassandra-env.sh advertises the full FQDN as the
      # JMX/RMI callback address, making remote nodetool (repair cron) reachable.
      export HOSTNAME="${MY_FQDN}"
      if [ "$(id -u)" = "0" ]; then
        chown -R cassandra:cassandra /var/lib/cassandra 2>/dev/null || true
        gosu cassandra cassandra -f &
      else
        cassandra -f &
      fi
      CASS_PID=$!

      echo "Waiting for Cassandra to accept CQL connections..."
      ATTEMPTS=0
      until cql_as cassandra -e "SELECT now() FROM system.local" > /dev/null 2>&1 \
         || cql_as "${CASS_SUPERUSER_PASSWORD}" -e "SELECT now() FROM system.local" > /dev/null 2>&1; do
        ATTEMPTS=$(( ATTEMPTS + 1 ))
        if [ "${ATTEMPTS}" -ge 60 ]; then
          echo "ERROR: Cassandra did not become CQL-ready after 300 seconds"
          exit 1
        fi
        sleep 5
      done
      echo "CQL ready."

      BOOTSTRAP_FLAG="/var/lib/cassandra/.bootstrapped"
      if [ -f "${BOOTSTRAP_FLAG}" ]; then
        echo "Bootstrap flag found — skipping first-time initialisation."
      else
        # Wait for EVERY replica to be Up/Normal before writing any auth data. Every node is a seed,
        # and a seed never streams data when it joins (Cassandra skips auto_bootstrap on seeds): a
        # replica that joins after a write takes over its token ranges WITHOUT that data. So the
        # bootstrap cannot go ahead on a quorum: the default `cassandra` role, the new roles and any
        # application rows written before the last replica joins can land on ranges it then owns
        # empty (measured: RF 1 rows written on a 2-of-3 ring were missing once the third joined).
        # JMX authentication is on (LOCAL_JMX=no), so nodetool authenticates (nt above).
        # After 10 minutes this says so as an ERROR every 5 minutes, with nodetool's output, and keeps
        # waiting. The wait runs beside the live node: replica 0 serves CQL on 9042 (ready)
        # throughout, so it never meets a probe window; the other replicas start in order behind it.
        EXPECTED_NODES={{ .Values.replicas | int }}
        echo "Waiting for all ${EXPECTED_NODES} replicas to join before bootstrapping..."
        WAIT_START=$(date +%s)
        NEXT_ERROR=600
        while :; do
          NODETOOL_ERR=""
          if STATUS_OUT=$(nt status 2>&1); then
            UP_NODES=$(printf '%s\n' "${STATUS_OUT}" | grep -c '^UN' || true)
          else
            UP_NODES=0
            NODETOOL_ERR=$(printf '%s\n' "${STATUS_OUT}" | head -n 1)
          fi
          ELAPSED=$(( $(date +%s) - WAIT_START ))
          if [ "${UP_NODES}" -ge "${EXPECTED_NODES}" ]; then
            echo "All ${EXPECTED_NODES} replicas are Up/Normal after ${ELAPSED}s."
            break
          fi
          if [ "${ELAPSED}" -ge "${NEXT_ERROR}" ]; then
            echo "ERROR: ${UP_NODES} of ${EXPECTED_NODES} replicas are Up/Normal after ${ELAPSED}s. The keyspace '${CASS_KEYSPACE}' and user '${CASS_APP_USER}' are NOT created until every replica has joined (a replica that joins later would take over part of the data without it); still waiting."
            if [ -n "${NODETOOL_ERR}" ]; then
              echo "ERROR: nodetool status failed: ${NODETOOL_ERR}"
            else
              printf '%s\n' "${STATUS_OUT}"
            fi
            NEXT_ERROR=$(( NEXT_ERROR + 300 ))
          fi
          sleep 10
        done

        echo "Running first-time bootstrap..."

        # Detect which cassandra password to use in case a previous partial bootstrap
        # already ran ALTER USER before the script exited.
        # The default role row can sit on the replica that joined last, which creates it a few
        # seconds after it joins (measured ~20 s); until then neither password logs in. Wait up to
        # 2 minutes for one of them instead of failing the bootstrap and restarting the node.
        CQLSH_PASS=""
        for _ in $(seq 1 24); do
          if cql_as cassandra -e "SELECT now() FROM system.local" > /dev/null 2>&1; then
            CQLSH_PASS="cassandra"
            break
          fi
          if cql_as "${CASS_SUPERUSER_PASSWORD}" -e "SELECT now() FROM system.local" > /dev/null 2>&1; then
            CQLSH_PASS="${CASS_SUPERUSER_PASSWORD}"
            echo "Default cassandra password no longer valid — using configured superuser password."
            break
          fi
          sleep 5
        done
        if [ -z "${CQLSH_PASS}" ]; then
          echo "ERROR: neither the default nor the configured superuser password logs in after 120s; the bootstrap is retried on the next start."
          exit 1
        fi

        # Passwords are written as CQL string literals (sq doubles a single quote), into the private
        # credentials directory.
        BOOTSTRAP_CQL="${CRED_DIR}/bootstrap.cql"
        ( umask 077
          printf "ALTER USER cassandra WITH PASSWORD '%s';\n" "$(sq "${CASS_SUPERUSER_PASSWORD}")"
          printf "ALTER KEYSPACE system_auth WITH replication = {'class': 'SimpleStrategy', 'replication_factor': %s};\n" "{{ .Values.replicas | int }}"
          printf "CREATE KEYSPACE IF NOT EXISTS %s WITH replication = {'class': 'SimpleStrategy', 'replication_factor': %s};\n" "${CASS_KEYSPACE}" "{{ .Values.replicationFactor | int }}"
          printf "CREATE ROLE IF NOT EXISTS '%s' WITH PASSWORD = '%s' AND LOGIN = true;\n" "$(sq "${CASS_APP_USER}")" "$(sq "${CASS_APP_PASSWORD}")"
          printf "GRANT ALL PERMISSIONS ON KEYSPACE %s TO '%s';\n" "${CASS_KEYSPACE}" "$(sq "${CASS_APP_USER}")"
        ) > "${BOOTSTRAP_CQL}"

        cql_as "${CQLSH_PASS}" -f "${BOOTSTRAP_CQL}"
        rm -f "${BOOTSTRAP_CQL}"

        nt repair system_auth \
          && echo "system_auth repair complete." \
          || echo "WARN: system_auth repair did not complete — repair cron will handle it"

        touch "${BOOTSTRAP_FLAG}"
        echo "Bootstrap complete: keyspace '${CASS_KEYSPACE}', user '${CASS_APP_USER}' created."
      fi

      wait "${CASS_PID}"
    else
      # Non-replica-0: exec directly so Cassandra is PID 1.
      export HOSTNAME="${MY_FQDN}"
      if [ "$(id -u)" = "0" ]; then
        chown -R cassandra:cassandra /var/lib/cassandra 2>/dev/null || true
        exec gosu cassandra cassandra -f
      else
        exec cassandra -f
      fi
    fi
