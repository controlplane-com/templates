{{- /*
  Credentials for the bundled CDC database. Internal plumbing: no human types
  this password — it exists only so Debezium can read the pipeline's own
  Postgres — so the bundled-plumbing exception applies and it stays a
  chart-created secret rather than a prerequisite.

  postgres-highly-available 2.5.0 stopped creating this secret and now takes
  only its NAME, which is why the chart on this side of the dependency owns it.
  The three keys are named exactly as the subchart reads them.
*/}}
kind: secret
name: {{ index .Values "postgres-highly-available" "config" "credentialsSecretName" }}
description: CDC pipeline database credentials
tags: {{- include "cdc.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.database.username | quote }}
  password: {{ .Values.database.password | quote }}
  database: {{ .Values.database.name | quote }}
