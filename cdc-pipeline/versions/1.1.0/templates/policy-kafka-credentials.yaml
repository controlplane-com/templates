{{- /* The kafka subchart's brokers read their SASL passwords from the credentials secret (kafka.kafka.env). */ -}}
kind: policy
name: {{ include "cdc.kafka.credentialsPolicyName" . }}
description: Lets the Kafka brokers reveal the pipeline credentials secret
tags: {{- include "cdc.tags" . | nindent 2 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cdc.kafka.identityName" . }}
targetKind: secret
targetLinks:
  - //secret/{{ index .Values "postgres-highly-available" "config" "credentialsSecretName" }}
