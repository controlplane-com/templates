# chatwoot 2.0.0 — the default install: highly available PostgreSQL (3 Patroni members, 3 etcd, HAProxy),
# the bundled Redis and local attachment storage, at the chart's default sizes (the web tier needs its 2Gi to
# survive the first boot's migrations). All three prerequisite secrets are generated per run.
locations: [aws-us-east-1]
timeoutSeconds: 1200

generated:
  pgpw: hex
  redispw: hex
  skb1: hex
  skb2: hex
  arPrimary: hex
  arDeterministic: hex
  arSalt: hex

secrets:
  db:
    type: dictionary
    entries:
      username: chatwoot
      password: "{gen.pgpw}"
      database: chatwoot
  redis:
    type: dictionary
    entries:
      password: "{gen.redispw}"
  root:
    type: dictionary
    entries:
      SECRET_KEY_BASE: "{gen.skb1}{gen.skb2}"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "{gen.arPrimary}"
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "{gen.arDeterministic}"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "{gen.arSalt}"

vars:
  pg_user: chatwoot
  pg_password: "{gen.pgpw}"
  pg_db: chatwoot

values:
  secrets:
    name: "{secrets.root.name}"
  postgresHA:
    config:
      credentialsSecretName: "{secrets.db.name}"
  redis:
    credentialsSecretName: "{secrets.redis.name}"

# Single-instance PostgreSQL (the opt-in mode), which 2.0.0 moves to PostgreSQL 19 with pgvector: one more
# fresh install.
variants:
  - name: single
    values:
      postgresHA:
        enabled: false
      postgres:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"
    timeoutSeconds: 900

# 1.3.1 is the previous version (same values shape). Its baseline runs the HA database, so this upgrade
# moves postgres-highly-available 2.5.0 → 3.0.0, whose existing cluster keeps PostgreSQL 17: a plain
# upgrade. A refused single-instance upgrade from 1.3.1 is not expressible: the starting install always
# uses 1.3.1's own (HA) baseline.
upgradeFrom:
  - version: 1.3.1
