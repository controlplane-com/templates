# Feature checks for the chatwoot template. Each runs after install (and after each upgrade) on every version
# in its since/until range. Add a check with `since: <new version>` for every change you ship. Placeholders:
# {release} {gvc} {org} {version} {installed_version}, and the baseline vars (pg_user, pg_password, pg_db).
#
# The default-install checks run in a Patroni member, which carries curl and psql. Database checks go through
# the HAProxy endpoint, the address Chatwoot uses, so they only pass when the proxy routes to the current
# leader. They are kept off the [single] variant (single-instance PostgreSQL, no HA workload), whose own checks
# run in the postgres container and in the Chatwoot web container (busybox wget, no curl).
checks:
  - id: app-healthy
    description: >-
      Chatwoot's /api answers on its internal port with both its database and its Redis reported ok, which only
      a booted app connected to both returns.
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 10 http://{release}-chatwoot.{gvc}.cpln.local:3000/api 2>&1
    expect:
      stdout: '"data_services"\s*:\s*"ok"'
      notStdout: '"queue_services"\s*:\s*"failing"'
    retries: 12
    retryDelaySeconds: 15

  - id: schema-loaded
    description: >-
      Chatwoot's schema is in its database, including the vector extension it requires (the first boot loads
      it; a failed load leaves neither).
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        P={release}-postgres-ha-proxy.{gvc}.cpln.local
        psql -h "$P" -U {pg_user} -d {pg_db} -qtA -c "select 'TABLES ' ||
          (select count(*) from information_schema.tables where table_schema = 'public'
             and table_name in ('accounts', 'users', 'conversations', 'messages')) ||
          ' EXT ' || coalesce((select extname from pg_extension where extname = 'vector'), 'none')" 2>&1
    expect:
      stdout: "^TABLES 4 EXT vector$"
    retries: 6
    retryDelaySeconds: 15

  - id: rejects-bad-password
    description: A wrong database password is refused through the proxy (the control for the checks above).
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        PGPASSWORD=wrong-password psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -c "select 1" 2>&1
        echo "EXIT=$?"
    expect:
      stdout: "password authentication failed"
      notStdout: "^EXIT=0$"

  - id: write-read-via-proxy
    description: A row written as Chatwoot's database user through the proxy reads back.
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        set -e
        export PGPASSWORD='{pg_password}'
        P={release}-postgres-ha-proxy.{gvc}.cpln.local
        M="e2e-$(date +%s%N)"
        psql -h "$P" -U {pg_user} -d {pg_db} -v ON_ERROR_STOP=1 -qtA \
          -c "create table if not exists e2e (id serial primary key, version text not null, marker text not null)" \
          -c "insert into e2e (version, marker) values ('{version}', '$M')" >/dev/null
        psql -h "$P" -U {pg_user} -d {pg_db} -qtA -c "select marker from e2e where marker = '$M'" | grep -qx "$M" && echo "READ $M"
    expect:
      stdout: "^READ e2e-"
    retries: 6
    retryDelaySeconds: 15

  - id: data-survives-upgrade
    description: >-
      The row written on the version this scenario installed first is still there. On a fresh install that is
      the same version; after an upgrade it proves the database carried over.
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        n=$(psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select count(*) from e2e where version = '{installed_version}'" 2>&1)
        [ "${n:-0}" -ge 1 ] 2>/dev/null && echo PERSISTED || echo "MISSING (rows for {installed_version}: ${n:-none})"
    expect:
      stdout: "^PERSISTED$"
    retries: 4

  - id: pgvector-0-8-7-available
    description: >-
      The HA database runs pgvector 0.8.7 (CVE-2026-103484): patroni-postgres 0.8 from 1.3.1, 0.9 from 2.0.0.
      Read on the leader, through the proxy.
    issue: "#5376"
    since: 1.3.1
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select 'AVAIL ' || default_version from pg_available_extensions where name = 'vector'" 2>&1
    expect:
      stdout: "^AVAIL 0\\.8\\.7$"
    # After an upgrade the members restart one by one and the proxy can briefly reach a member still on the
    # old image; this runs long enough for the rollout to finish.
    # helm --wait returns while the Patroni members are still restarting, and the old leader restarts
    # last (~4 min in); 20 x 30 s covers the rollout.
    retries: 20
    retryDelaySeconds: 30

  - id: every-patroni-member-on-0-8
    description: >-
      Every Patroni member restarted onto an image with pgvector 0.8.7 (patroni-postgres 0.8 in 1.3.1, 0.9 from
      2.0.0) and is back in the cluster,
      not only the leader. The pgvector-0-8-7-available check passes as soon as the leader has moved to a
      restarted member, and the runner's readiness wait returns while the old leader is still restarting, so
      without this a member that never comes back (seen once in testing: the old leader stuck initializing for
      17 min) goes unseen.
    issue: "#5376"
    since: 1.3.1
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}' PGCONNECT_TIMEOUT=5
        LOC=$(basename "$CPLN_LOCATION")
        line="MEMBERS"
        for i in 0 1 2; do
          v=$(psql -h replica-$i.{release}-postgres-ha.$LOC.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
            -c "select default_version from pg_available_extensions where name = 'vector'" 2>/dev/null)
          line="$line $i=$v"
        done
        echo "$line HEALTHY $(curl -s -m 10 http://localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        print("%d/%d" % (len([x for x in m if x["state"] in ("running", "streaming")]), len(m)))' 2>&1)"
    expect:
      stdout: "^MEMBERS 0=0\\.8\\.7 1=0\\.8\\.7 2=0\\.8\\.7 HEALTHY 3/3$"
    # The old leader restarts last, a few minutes after the runner's readiness wait returns.
    retries: 24
    retryDelaySeconds: 30

  - id: ha-postgres-major
    description: >-
      The HA database (postgres-highly-available 3.0.0 from 2.0.0) runs PostgreSQL 18 on a cluster this version
      created, and a cluster created by 1.x keeps PostgreSQL 17 after the upgrade, on every member.
    since: 2.0.0
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        if [ "$(printf '%s\n' '{installed_version}' 2.0.0 | sort -V | head -1)" = 2.0.0 ]; then want=18; else want=17; fi
        curl -s -m 10 localhost:8008/cluster | python3 -c '
        import json, sys, urllib.request
        want = int(sys.argv[1])
        majors = []
        for m in json.load(sys.stdin)["members"]:
            v = json.load(urllib.request.urlopen(m["api_url"].rsplit("/", 1)[0] + "/patroni", timeout=5)).get("server_version", 0)
            majors.append(v // 10000)
        ok = len(majors) == 3 and all(x == want for x in majors)
        print(("MAJOR " if ok else "WRONG ") + "want=%d members=%s" % (want, majors))
        ' "$want"
    expect:
      stdout: "^MAJOR want="
    # The members restart one after another after an upgrade; the old leader restarts last.
    retries: 20
    retryDelaySeconds: 30

  # ── Single-instance mode ([single] variant): PostgreSQL 19 with pgvector from 2.0.0 ──
  - id: single-fresh-is-19
    description: >-
      A fresh single-instance install runs PostgreSQL 19 (pgvector/pgvector:0.8.7-pg19 on the postgres 4.0.2
      subchart) with pgvector 0.8.7 available.
    since: 2.0.0
    scenarios: "^install .*\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        H=$(hostname -i | awk '{print $1}')
        psql -h "$H" -U {pg_user} -d {pg_db} -qtA -c "select 'SERVER_VERSION_NUM=' || current_setting('server_version_num') ||
          ' VECTOR=' || coalesce((select default_version from pg_available_extensions where name = 'vector'), 'none')" 2>&1
    expect:
      stdout: "^SERVER_VERSION_NUM=19[0-9]{4} VECTOR=0\\.8\\.7$"

  - id: single-guard-passes
    description: >-
      On its own PostgreSQL 19 data the major-version guard hands over to the server: no guard file, and
      postgres is PID 1.
    since: 2.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        [ -e /tmp/pg-major-guard ] && echo GUARD_FILE_PRESENT || echo NO_GUARD_FILE
        echo "PID1=$(cat /proc/1/comm)"
    expect:
      stdout: "(?s)^NO_GUARD_FILE$.*^PID1=postgres$"

  - id: single-schema-loaded
    description: >-
      In single-instance mode the worker loaded Chatwoot's schema into PostgreSQL 19, including the vector
      extension it requires, and a row written as Chatwoot's user reads back; a wrong password is refused (the
      control).
    since: 2.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        H=$(hostname -i | awk '{print $1}')
        export PGPASSWORD='{pg_password}'
        psql -h "$H" -U {pg_user} -d {pg_db} -qtA -c "select 'TABLES ' ||
          (select count(*) from information_schema.tables where table_schema = 'public'
             and table_name in ('accounts', 'users', 'conversations', 'messages')) ||
          ' EXT ' || coalesce((select extname from pg_extension where extname = 'vector'), 'none')" 2>&1
        M="e2e-$(date +%s%N)"
        psql -h "$H" -U {pg_user} -d {pg_db} -v ON_ERROR_STOP=1 -qtA \
          -c "create table if not exists e2e (id serial primary key, version text not null, marker text not null)" \
          -c "insert into e2e (version, marker) values ('{version}', '$M')" >/dev/null 2>&1
        psql -h "$H" -U {pg_user} -d {pg_db} -qtA -c "select marker from e2e where marker = '$M'" 2>/dev/null | grep -qx "$M" && echo "READ $M"
        PGPASSWORD=wrong-password psql -h "$H" -U {pg_user} -d {pg_db} -c "select 1" >/dev/null 2>&1 \
          && echo BAD_PASSWORD_ACCEPTED || echo BAD_PASSWORD_REFUSED
    expect:
      stdout: "(?s)^TABLES 4 EXT vector$.*^READ e2e-.*^BAD_PASSWORD_REFUSED$"
    retries: 8
    retryDelaySeconds: 15

  - id: single-app-healthy
    description: >-
      Chatwoot serves in single-instance mode: /api, read from the web container on its own port, reports both
      its database and its Redis ok, which only a booted app connected to both returns.
    since: 2.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-chatwoot"
      container: chatwoot
      shell: sh
      script: |
        wget -q -T 10 -O - http://127.0.0.1:3000/api 2>&1
    expect:
      stdout: '"data_services"\s*:\s*"ok"'
      notStdout: '"queue_services"\s*:\s*"failing"'
    retries: 12
    retryDelaySeconds: 15
