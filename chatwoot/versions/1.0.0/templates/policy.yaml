---
kind: policy
name: {{ include "chatwoot.policy.name" . }}
description: Chatwoot secret access
tags: {{- include "chatwoot.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "chatwoot.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ include "chatwoot.postgres.secret.name" . }}
  - //secret/{{ include "chatwoot.secret.webStart.name" . }}
  - //secret/{{ include "chatwoot.secret.workerStart.name" . }}
  - //secret/{{ .Values.secrets.name }}
  {{- if eq (include "chatwoot.redis.authEnabled" .) "true" }}
  - //secret/{{ include "chatwoot.redis.secretPassword.name" . }}
  {{- end }}
  {{- if eq .Values.storage.type "s3-compatible" }}
  - //secret/{{ .Values.storage.s3Compatible.auth.secretName }}
  {{- end }}
  {{- if and .Values.smtp.enabled .Values.smtp.auth.secretName }}
  - //secret/{{ .Values.smtp.auth.secretName }}
  {{- end }}
