---
kind: secret
name: {{ include "chatwoot.secret.workerStart.name" . }}
description: Chatwoot worker start script (migrations + first-run onboarding flag, then Sidekiq)
tags: {{- include "chatwoot.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
    cd /app
    # Migrations run in exactly one place: this single-replica worker.
    # db:chatwoot_prepare loads the schema and seeds on a fresh database, then
    # migrates. The app-wide statement_timeout is 14s (config/database.yml), so
    # raise it for the migration run only or a long migration aborts mid-way.
    POSTGRES_STATEMENT_TIMEOUT=600s bundle exec rails db:chatwoot_prepare
    # Safety net for the split-brain first run: the "create the first admin"
    # flag lives in Redis while the schema marker lives in Postgres, so a seed
    # that failed after the schema loaded would never be retried and the
    # onboarding page would redirect away forever. Re-assert the flag only when
    # there are genuinely no users — a cheap psql check (postgresql-client ships
    # in the image), so routine restarts pay nothing.
    if [ "$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USERNAME" \
            -d "$POSTGRES_DATABASE" -tAc 'select count(*) from users' 2>/dev/null || echo 1)" = "0" ]; then
      echo "no users yet — re-asserting the installation onboarding flag"
      bundle exec rails runner 'Redis::Alfred.set(Redis::Alfred::CHATWOOT_INSTALLATION_ONBOARDING, true)'
    fi
    exec bundle exec sidekiq -C config/sidekiq.yml
