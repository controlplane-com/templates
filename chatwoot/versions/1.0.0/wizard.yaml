# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Chatwoot

# Both bundled databases and the bundled Redis are single-location stateful workloads with no location
# handling: postgres brings this limit with its import, and postgres-highly-available 2.4.1 (bound as parent
# fields below) and Redis need the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.3.0
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # The database user, password and name are bound in the Database step, next to the HA mode's, because
      # Chatwoot reads them too.
      - config
      # Chatwoot connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      image:
        help: >-
          Must carry pgvector: Chatwoot's schema runs `CREATE EXTENSION "vector"`, which the stock `postgres:`
          image does not provide. Keep `pgvector/pgvector:pg18` unless you supply your own pgvector build.
      internalAccess.type:
        description: >-
          Chatwoot connects to its database like any other workload: keep Same GVC, or add the Chatwoot web
          and worker workloads under Allowed workloads.

steps:
  - id: chatwoot
    title: Chatwoot
    description: The web tier, the Sidekiq worker, and the prerequisite secret with Chatwoot's root keys.
    sections:
      - title: Web
        docs: "#chatwoot-web"
        fields:
          - path: chatwoot.image
            type: string
            format: image
            label: Chatwoot image
            required: true
            help: Pin a released `-ce` tag (Community Edition); never `latest`.
          - path: chatwoot.replicas
            type: integer
            label: Web replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: More than one requires S3 or S3-compatible attachment storage.
          - path: chatwoot.frontendUrl
            type: string
            label: Public base URL
            placeholder: https://chat.example.com
            pattern: '^(https?://.+)?$'
            patternMessage: Include the scheme, for example https://chat.example.com.
            description: >-
              Used in the widget snippet, email links and callbacks. Leave empty to use the canonical endpoint;
              set it only when a custom domain fronts the workload.
          - path: chatwoot.resources
            type: resources
            label: Web resources
            required: true
            description: Per web replica. Boot migrations need about 2Gi of memory.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.chatwoot.replicas <= 1 || self.storage.type != 'local'
            mirrors: chatwoot.validate
            paths: [chatwoot.replicas, storage.type]
            message: >-
              More than one web replica needs S3 or S3-compatible attachment storage: local attachments live on a
              per-replica volume.
      - title: Sidekiq worker
        docs: "#sidekiq-worker"
        description: One replica, which also runs the database migrations and the first-run setup.
        fields:
          - path: worker.concurrency
            type: integer
            label: Concurrency
            required: true
            min: 1
            suggestions: [5, 10, 20]
            description: Sidekiq threads; also the worker's PostgreSQL connection pool size.
          - path: worker.resources
            type: resources
            label: Worker resources
            required: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.worker.concurrency >= 1
            mirrors: chatwoot.validate
            paths: [worker.concurrency]
            message: Concurrency must be at least 1.
      - title: Root keys
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              The root-keys secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: secrets.name
            type: ref
            label: Root-keys secret
            required: true
            description: >-
              A dictionary secret with the keys `SECRET_KEY_BASE`, `ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY`,
              `ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY` and `ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT`.
            help: >-
              All four keys are write-once: changing `SECRET_KEY_BASE` signs every user out, and changing an
              encryption key makes stored two-factor secrets unreadable.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys:
                - SECRET_KEY_BASE
                - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
                - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
                - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              create:
                suggestName: "context.releaseName + '-chatwoot-secrets'"
        rules:
          - rule: self.secrets.name != null && self.secrets.name != ''
            mirrors: chatwoot.validate
            paths: [secrets.name]
            message: The root-keys secret is required.

  - id: attachments
    title: Attachments
    description: Where uploaded files and attachments are stored.
    sections:
      - fields:
          - path: storage.type
            type: enum
            label: Attachment storage
            widget: cards
            required: true
            docs: "#attachment-storage"
            options:
              - value: local
                label: Local volume
                description: >-
                  A volume on the web workload only. One web replica; the worker cannot read attachments, so
                  attachment emails fail.
              - value: s3
                label: AWS S3
                description: Keyless access through a Control Plane cloud account.
              - value: s3-compatible
                label: S3-compatible
                description: MinIO, SeaweedFS or another S3 server, with static keys in a secret.
        rules:
          - rule: self.storage.type in ['local', 's3', 's3-compatible']
            mirrors: chatwoot.validate
            paths: [storage.type]
            message: Choose where attachments are stored.
      - title: Local volume
        when: self.storage.type == 'local'
        fields:
          - path: storage.local.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100]
            help: Uninstalling the release deletes the volume set, so the files do not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: >-
              oldSelf == null || oldSelf.storage.type != 'local' ||
              self.storage.local.volumeset.capacity >= oldSelf.storage.local.volumeset.capacity
            paths: [storage.local.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - title: AWS S3
        when: self.storage.type == 's3'
        docs: "#attachment-storage"
        fields:
          - path: storage.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: storage.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: storage.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
      - title: S3-compatible
        when: self.storage.type == 's3-compatible'
        docs: "#attachment-storage"
        fields:
          - path: storage.s3Compatible.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The S3 API address, with scheme and port.
          - path: storage.s3Compatible.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.s3Compatible.region
            type: string
            label: Region
            description: Any value; most S3-compatible servers ignore it.
          - path: storage.s3Compatible.forcePathStyle
            type: boolean
            label: Path-style addressing
            description: On for most S3-compatible servers.
          - path: storage.s3Compatible.auth.secretName
            type: ref
            label: Access keys secret
            required: true
            description: A dictionary secret with the keys `STORAGE_ACCESS_KEY_ID` and `STORAGE_SECRET_ACCESS_KEY`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY]

  - id: email
    title: Email
    description: Outbound mail for agent invites, password resets and email-channel replies.
    sections:
      - title: SMTP
        toggle: smtp.enabled
        docs: "#email"
        description: Agent invites and password resets are sent by email; without SMTP they fail. Configure it before inviting agents.
        fields:
          - path: smtp.address
            type: string
            label: SMTP server
            required: true
            example: true
            placeholder: smtp.example.com
          - path: smtp.port
            type: integer
            label: Port
            required: true
            min: 1
            max: 65535
            suggestions: [587, 465, 25, 1025]
          - path: smtp.fromEmail
            type: string
            label: Sender
            required: true
            example: true
            placeholder: Chatwoot <no-reply@example.com>
          - path: smtp.enableStarttlsAuto
            type: boolean
            label: STARTTLS
            description: Turn off for a plaintext mail catcher such as Mailpit on port 1025.
          - path: smtp.authentication
            type: string
            label: Authentication method
            suggestions: [login, plain, cram_md5]
            description: Empty for an unauthenticated relay.
          - path: smtp.auth.secretName
            type: ref
            label: SMTP login secret
            description: >-
              Optional. A dictionary secret with the keys `SMTP_USERNAME` and `SMTP_PASSWORD`. Leave empty for a
              relay without a login.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [SMTP_USERNAME, SMTP_PASSWORD]
          - path: smtp.domain
            type: string
            label: HELO domain
            advanced: true
            description: Empty to omit it.
        rules:
          - rule: "!self.smtp.enabled || (self.smtp.address != '' && self.smtp.fromEmail != '')"
            mirrors: chatwoot.validate
            paths: [smtp.address, smtp.fromEmail]
            message: The SMTP server and the sender are required when SMTP is on.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Chatwoot inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: The dashboard, API, chat widget and WebSockets on the canonical endpoint.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: chatwoot.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        mirrors: chatwoot.validate
        paths: [internalAccess.workloads]
        message: With "Specific workloads", list at least one workload.

  - id: database
    title: Database
    description: Which PostgreSQL holds Chatwoot's data, and the credentials it is created with.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - type: note
            severity: info
            when: oldSelf != null
            text: >-
              The database cannot be switched on a running release: the other choice is a separate, empty
              database, and Chatwoot would start over with onboarding.
      - id: credentials
        title: Database credentials
        description: >-
          The login of whichever PostgreSQL is chosen above. Each creates its secret from these values
          (<release>-pg-config for the single-instance one, <release>-postgres-config for the highly available
          one), and Chatwoot reads it. There is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.3.0 takes them from a secret
              you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: Used as typed, so replace the published default.
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.config.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgres.config.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: Used as typed, so replace the published default.
          - path: postgres.config.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
        rules:
          # The HA database (postgres-highly-available 2.4.1) writes the user and password unquoted into an
          # unquoted shell heredoc that becomes Patroni's YAML config (loaded as YAML 1.1), and the user and
          # database name into an unquoted psql command and CREATE DATABASE (templates/secret-startup.yaml).
          # Reproduced by running the heredoc with sh and loading the result with PyYAML: $ and ` are expanded,
          # a \ before $ ` \ or at the end is consumed, YAML indicators at the start, ': ', ' #' and a lone
          # - ~ = break or alter the value, and numbers, dates, 1:30 and yes/no/on/off change type. Quotes, :
          # and ! inside the value are kept.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              [self.postgresHA.postgres.password].all(x,
              !x.matches('[$`]') && !x.matches('\\\\([$`\\\\]|$)') &&
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']) && !(x in ['~', '=', '<<']) &&
              !x.matches('^[-+]?([0-9][0-9_]*|0b[01_]+|0x[0-9a-fA-F_]+)$') &&
              !x.matches('^[-+]?([0-9][0-9_]*)?\\.[0-9_]*([eE][-+][0-9]+)?$') &&
              !x.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              The highly available database writes the password unquoted into a shell script and its YAML config.
              Leave out $ and `, a \ before $, ` or \ or at the end, a leading space or YAML symbol, ": " and " #", and
              values that read as a number, a date, yes/no, on/off, true/false, null or <<.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              (self.postgresHA.postgres.username.matches('^[A-Za-z_][A-Za-z0-9_.-]*$') &&
              !(self.postgresHA.postgres.username.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']))
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Use letters, digits, _ . and -, starting with a letter or underscore, and not yes/no, on/off,
              true/false or null. The highly available database writes the user unquoted into its YAML config and
              a psql command.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database) ||
              (self.postgresHA.postgres.database.matches('^[a-z_][a-z0-9_]*$') && size(self.postgresHA.postgres.database) <= 63 &&
              !(self.postgresHA.postgres.database in ['postgres','template0','template1','all','analyse','analyze','and','any','array','as','asc','asymmetric','authorization','binary','both','case','cast','check','collate','collation','column','concurrently','constraint','create','cross','current_catalog','current_date','current_role','current_schema','current_time','current_timestamp','current_user','default','deferrable','desc','distinct','do','else','end','except','false','fetch','for','foreign','freeze','from','full','grant','group','having','ilike','in','initially','inner','intersect','into','is','isnull','join','lateral','leading','left','like','limit','localtime','localtimestamp','natural','not','notnull','null','offset','on','only','or','order','outer','overlaps','placing','primary','references','returning','right','select','session_user','similar','some','symmetric','system_user','table','tablesample','then','to','trailing','true','union','unique','user','using','variadic','verbose','when','where','window','with']))
            severity: warning
            paths: [postgresHA.postgres.database]
            message: >-
              Use up to 63 lowercase letters, digits and underscores, starting with a letter or underscore, and
              not postgres, template0, template1 or an SQL reserved word such as user or order. The highly
              available database runs an unquoted CREATE DATABASE when it is first created: it folds other names
              to lowercase or fails, and a failure stops the cluster from being created, while Chatwoot connects
              with the name as typed.
          # The single-instance PostgreSQL's readiness probe runs pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          # through sh -c without quotes (postgres 3.3.0 templates/workload-postgres.yaml).
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.username == oldSelf.postgres.config.username &&
              self.postgres.config.database == oldSelf.postgres.config.database) ||
              (!self.postgres.config.username.matches('\\s') && !self.postgres.config.database.matches('\\s'))
            severity: warning
            paths: [postgres.config.username, postgres.config.database]
            message: >-
              Leave out spaces: the database's readiness check passes the user and the database name to pg_isready
              unquoted, so it never becomes ready.
          - when: self.postgresHA.enabled
            rule: oldSelf == null || self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the password it was initialized with, and the replication user repl shares it.
              Run ALTER ROLE for the user and for repl first, or Chatwoot loses its database connection after this
              upgrade.
          - when: self.postgres.enabled
            rule: oldSelf == null || self.postgres.config.password == oldSelf.postgres.config.password
            severity: info
            paths: [postgres.config.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Chatwoot loses its
              database connection after this upgrade.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas (PostgreSQL 17 with pgvector), 3 etcd replicas and an HAProxy leader endpoint that
          Chatwoot connects through. Recommended for production.
        fields:
          - type: note
            severity: warning
            text: >-
              The bundled highly available database creates the cluster with consensus timeouts that Patroni
              silently tightens, so a leader that cannot reach etcd for about 14 seconds is demoted.
          - type: note
            severity: warning
            text: >-
              The bundled highly available database writes the password into Patroni's shared configuration,
              which anything that can reach port 8008 of the members can read without authentication at `/config`.
          - type: note
            severity: warning
            text: >-
              In this version the bundled etcd does not compact its history, so its storage can fill after a
              few months and force the database read-only
              ([etcd history compaction](/template-catalog/templates/postgres-highly-available#etcd-history-compaction)).
              Chatwoot 1.0.1 fixes it; install 1.0.1 or later, or choose the single-instance PostgreSQL.
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.resources
            type: resources
            label: PostgreSQL resources
            required: true
            description: Per Patroni replica.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - type: note
            severity: warning
            when: self.postgresHA.backup.mode == 'wal-g'
            text: >-
              The bundled database's WAL-G sidecar waits a full interval before its first base backup, so a new
              cluster archives WAL with nothing to restore it from for up to that long, and turning WAL-G on for a
              cluster that already exists does not start WAL archiving.
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources.memory
            type: quantity
            quantity: memory
            absent: true
            label: Backup memory
            advanced: true
            placeholder: 512Mi
            suggestions: [512Mi, 768Mi]
            description: >-
              Memory for the WAL-G sidecar or the logical backup job. Empty keeps the bundled database's default
              of 128Mi.
        rules:
          # Platform schema (nodelibs workload.ts): at most 8 MiB of memory per millicore of CPU.
          - rule: >-
              !has(self.postgresHA.backup.resources) || !has(self.postgresHA.backup.resources.memory) ||
              self.postgresHA.backup.resources.memory == '' ||
              (self.postgresHA.backup.resources.memory != null &&
              memoryBytes(self.postgresHA.backup.resources.memory) <= (dyn(self.postgresHA.backup.resources).exists(k, k == 'cpu') ?
              cpuMillicores(dyn(self.postgresHA.backup.resources)['cpu']) : 100) * 8 * 1048576)
            paths: [postgresHA.backup.resources.memory]
            message: >-
              The platform allows at most 8 MiB of memory per millicore of CPU, and the backup CPU is 100m, so use
              at most 800Mi.
          - when: self.postgresHA.backup.mode == 'wal-g'
            rule: >-
              has(self.postgresHA.backup.resources) && has(self.postgresHA.backup.resources.memory) &&
              self.postgresHA.backup.resources.memory != null && self.postgresHA.backup.resources.memory != '' ?
              memoryBytes(self.postgresHA.backup.resources.memory) >= memoryBytes('512Mi') : false
            severity: warning
            paths: [postgresHA.backup.resources.memory]
            message: >-
              Give the WAL-G sidecar at least 512Mi of memory (the bundled database's default is 128Mi). With less
              it is killed for running out of memory during the base backup and no backup is written. Raising it
              restarts the database members.
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - type: note
            severity: warning
            text: >-
              The bundled database's backup identity also carries the AWS managed policy ReadOnlyAccess, which can
              read every bucket in the AWS account, not only this one.
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.aws.prefix != null && self.postgresHA.backup.aws.prefix != ''
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix>, so ' #' starts a comment that
          # silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
