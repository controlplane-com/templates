    rules:
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: chatwoot.validate
        paths: [postgresHA.enabled, postgres.enabled]
        message: Enable exactly one database, either the highly available or the single-instance PostgreSQL.
      - rule: >-
          !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
          dyn(self.postgresHA)['proxy']['enabled'] == true || dyn(self.postgresHA)['proxy']['enabled'] == null
        mirrors: chatwoot.validate
        paths: [postgresHA.enabled]
        message: >-
          The HAProxy leader endpoint is how Chatwoot reaches the HA database, so postgresHA.proxy.enabled must
          stay true.
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        message: >-
          Switching the database on an installed release deletes the current one, with all of Chatwoot's data, and
          starts an empty one. Keep the current database, or install a new release with the other database and
          move the data.

  - id: redis
    title: Redis
    description: The bundled single-node Redis for Sidekiq queues, live updates and the cache.
    fields:
      - type: note
        severity: info
        when: oldSelf != null
        textExpression: >-
          "An upgrade usually restarts Redis, and Chatwoot's live updates do not reconnect on their own afterwards:
          when it is done, run cpln workload force-redeployment " + (context.releaseName != null &&
          context.releaseName != '' ? context.releaseName : 'RELEASE_NAME') + '-chatwoot --gvc ' +
          (context.gvc != null ? context.gvc : 'GVC_NAME') + '. Expect a few minutes of errors while Redis restarts.'
        text: >-
          An upgrade usually restarts Redis, and Chatwoot's live updates do not reconnect on their own afterwards:
          when it is done, force a redeployment of the RELEASE_NAME-chatwoot workload. Expect a few minutes of
          errors while Redis restarts.
      - path: redis.image
        type: string
        format: image
        label: Redis image
        required: true
      - type: note
        severity: warning
        text: >-
          The Redis password is stored in the Helm release in plain text. Version 1.3.0 takes it from a secret you
          create instead.
      - path: redis.auth.password
        type: string
        label: Redis password
        required: true
        sensitive: true
        widget: password
        example: true
        description: >-
          Used as typed, so replace the published default. It is part of the Redis connection URL, so use letters,
          digits, `-` and `_` only.
      - path: redis.resources
        type: resources
        label: Redis resources
        required: true
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
      - path: redis.volumeset.capacity
        type: integer
        label: Initial capacity
        unit: GiB
        min: 10
        max: 65536
        required: true
        suggestions: [10, 20, 50]
        help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
        docs: "/reference/volumeset#capacity-and-billing"
    rules:
      - rule: self.redis.auth.password != ''
        mirrors: chatwoot.validate
        paths: [redis.auth.password]
        message: The Redis password is required.
      - rule: self.redis.auth.password == '' || self.redis.auth.password.matches('^[A-Za-z0-9_-]+$')
        mirrors: chatwoot.validate
        paths: [redis.auth.password]
        message: Use only letters, digits, - and _. The password is part of the Redis connection URL.
      - rule: oldSelf == null || self.redis.volumeset.capacity >= oldSelf.redis.volumeset.capacity
        paths: [redis.volumeset.capacity]
        message: A volume set cannot shrink. Keep the capacity at or above the installed size.

# Rules over the imported values: their issues show on the imported fields' step.
rules:
  - when: self.postgres.enabled
    rule: "!self.postgres.image.startsWith('postgres:')"
    mirrors: chatwoot.validate
    paths: [postgres.image]
    message: >-
      The stock postgres image has no pgvector, which Chatwoot's schema requires. Use a pgvector image such
      as pgvector/pgvector:pg18, or the highly available database.
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Chatwoot, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: >-
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-chatwoot') in self.postgres.internalAccess.workloads &&
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-chatwoot-worker') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: >-
      'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-chatwoot and //gvc/' + context.gvc +
      '/workload/' + context.releaseName + '-chatwoot-worker, or Chatwoot cannot reach its database.'
    message: Add the Chatwoot web and worker workloads to the list, or Chatwoot cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Chatwoot connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.
