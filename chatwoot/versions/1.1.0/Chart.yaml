apiVersion: v2
name: chatwoot
description: Chatwoot customer engagement platform — live chat and shared inbox, backed by PostgreSQL and Redis
type: application
version: 1.0.1
appVersion: "4.16.2-ce"

annotations:
  created: "2026-08-05"
  lastModified: "2026-08-17"
  category: "customer-support"
  createsGvc: false

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.4.2
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled
  - name: postgres
    version: 3.3.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled
