---
kind: secret
name: {{ include "chatwoot.secret.webStart.name" . }}
description: Chatwoot web start script (waits for the schema, then boots Puma)
tags: {{- include "chatwoot.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
    cd /app
    # Stay down until the worker has created the schema, so readiness never lies
    # on a first install. A psql probe, not a Rails boot — each Rails boot costs
    # ~30s and this loop has to be cheap.
    until [ "$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USERNAME" \
               -d "$POSTGRES_DATABASE" -tAc "select 1 from information_schema.tables where table_name='accounts'" \
               2>/dev/null)" = "1" ]; do
      echo "waiting for the chatwoot schema..."
      sleep 5
    done
    # The image declares no ENTRYPOINT/CMD, and its bundled rails.sh entrypoint
    # runs `bundle install` on every boot — so Puma is started directly here.
    exec bundle exec rails s -p 3000 -b 0.0.0.0
