# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Chatwoot

# Both bundled databases and the bundled Redis are single-location stateful workloads with no location
# handling: postgres brings this limit with its import, and postgres-highly-available (no descriptor of its
# own, so its keys are parent fields below) and Redis need the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Chosen in the Database step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # Chatwoot connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      image:
        help: >-
          Must carry pgvector: Chatwoot's schema runs `CREATE EXTENSION "vector"`, which the stock `postgres:`
          image does not provide. Keep `pgvector/pgvector:pg18` unless you supply your own pgvector build.
      internalAccess.type:
        description: >-
          Chatwoot connects to its database like any other workload: keep Same GVC, or add the Chatwoot web
          and worker workloads under Allowed workloads.

steps:
  - id: chatwoot
    title: Chatwoot
    description: The web tier, the Sidekiq worker, and the prerequisite secret with Chatwoot's root keys.
    sections:
      - title: Web
        docs: "#chatwoot-web"
        fields:
          - path: chatwoot.image
            type: string
            format: image
            label: Chatwoot image
            required: true
            help: Pin a released `-ce` tag (Community Edition); never `latest`.
          - path: chatwoot.replicas
            type: integer
            label: Web replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: More than one requires S3 or S3-compatible attachment storage.
          - path: chatwoot.frontendUrl
            type: string
            label: Public base URL
            placeholder: https://chat.example.com
            pattern: '^(https?://.+)?$'
            patternMessage: Include the scheme, for example https://chat.example.com.
            description: >-
              Used in the widget snippet, email links and callbacks. Leave empty to use the canonical endpoint;
              set it only when a custom domain fronts the workload.
          - path: chatwoot.resources
            type: resources
            label: Web resources
            required: true
            description: Per web replica. Boot migrations need about 2Gi of memory.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.chatwoot.replicas <= 1 || self.storage.type != 'local'
            mirrors: chatwoot.validate
            paths: [chatwoot.replicas, storage.type]
            message: >-
              More than one web replica needs S3 or S3-compatible attachment storage: local attachments live on a
              per-replica volume.
      - title: Sidekiq worker
        docs: "#sidekiq-worker"
        description: One replica, which also runs the database migrations and the first-run setup.
        fields:
          - path: worker.concurrency
            type: integer
            label: Concurrency
            required: true
            min: 1
            suggestions: [5, 10, 20]
            description: Sidekiq threads; also the worker's PostgreSQL connection pool size.
          - path: worker.resources
            type: resources
            label: Worker resources
            required: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.worker.concurrency >= 1
            mirrors: chatwoot.validate
            paths: [worker.concurrency]
            message: Concurrency must be at least 1.
      - title: Root keys
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              The root-keys secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: secrets.name
            type: ref
            label: Root-keys secret
            required: true
            description: >-
              A dictionary secret with the keys `SECRET_KEY_BASE`, `ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY`,
              `ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY` and `ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT`.
            help: >-
              All four keys are write-once: changing `SECRET_KEY_BASE` signs every user out, and changing an
              encryption key makes stored two-factor secrets unreadable.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys:
                - SECRET_KEY_BASE
                - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
                - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
                - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              create:
                suggestName: "context.releaseName + '-chatwoot-secrets'"
        rules:
          - rule: self.secrets.name != null && self.secrets.name != ''
            mirrors: chatwoot.validate
            paths: [secrets.name]
            message: The root-keys secret is required.

  - id: attachments
    title: Attachments
    description: Where uploaded files and attachments are stored.
    sections:
      - fields:
          - path: storage.type
            type: enum
            label: Attachment storage
            widget: cards
            required: true
            docs: "#attachment-storage"
            options:
              - value: local
                label: Local volume
                description: >-
                  A volume on the web workload only. One web replica; the worker cannot read attachments, so
                  attachment emails fail.
              - value: s3
                label: AWS S3
                description: Keyless access through a Control Plane cloud account.
              - value: s3-compatible
                label: S3-compatible
                description: MinIO, SeaweedFS or another S3 server, with static keys in a secret.
        rules:
          - rule: self.storage.type in ['local', 's3', 's3-compatible']
            mirrors: chatwoot.validate
            paths: [storage.type]
            message: Choose where attachments are stored.
      - title: Local volume
        when: self.storage.type == 'local'
        fields:
          - path: storage.local.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100]
            help: Uninstalling the release deletes the volume set, so the files do not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: >-
              oldSelf == null || oldSelf.storage.type != 'local' ||
              self.storage.local.volumeset.capacity >= oldSelf.storage.local.volumeset.capacity
            paths: [storage.local.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - title: AWS S3
        when: self.storage.type == 's3'
        docs: "#attachment-storage"
        fields:
          - path: storage.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: storage.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: storage.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
      - title: S3-compatible
        when: self.storage.type == 's3-compatible'
        docs: "#attachment-storage"
        fields:
          - path: storage.s3Compatible.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The S3 API address, with scheme and port.
          - path: storage.s3Compatible.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.s3Compatible.region
            type: string
            label: Region
            description: Any value; most S3-compatible servers ignore it.
          - path: storage.s3Compatible.forcePathStyle
            type: boolean
            label: Path-style addressing
            description: On for most S3-compatible servers.
          - path: storage.s3Compatible.auth.secretName
            type: ref
            label: Access keys secret
            required: true
            description: A dictionary secret with the keys `STORAGE_ACCESS_KEY_ID` and `STORAGE_SECRET_ACCESS_KEY`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY]

  - id: email
    title: Email
    description: Outbound mail for agent invites, password resets and email-channel replies.
    sections:
      - title: SMTP
        toggle: smtp.enabled
        docs: "#email"
        description: Agent invites and password resets are sent by email; without SMTP they fail. Configure it before inviting agents.
        fields:
          - path: smtp.address
            type: string
            label: SMTP server
            required: true
            example: true
            placeholder: smtp.example.com
          - path: smtp.port
            type: integer
            label: Port
            required: true
            min: 1
            max: 65535
            suggestions: [587, 465, 25, 1025]
          - path: smtp.fromEmail
            type: string
            label: Sender
            required: true
            example: true
            placeholder: Chatwoot <no-reply@example.com>
          - path: smtp.enableStarttlsAuto
            type: boolean
            label: STARTTLS
            description: Turn off for a plaintext mail catcher such as Mailpit on port 1025.
          - path: smtp.authentication
            type: string
            label: Authentication method
            suggestions: [login, plain, cram_md5]
            description: Empty for an unauthenticated relay.
          - path: smtp.auth.secretName
            type: ref
            label: SMTP login secret
            description: >-
              Optional. A dictionary secret with the keys `SMTP_USERNAME` and `SMTP_PASSWORD`. Leave empty for a
              relay without a login.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [SMTP_USERNAME, SMTP_PASSWORD]
          - path: smtp.domain
            type: string
            label: HELO domain
            advanced: true
            description: Empty to omit it.
        rules:
          - rule: "!self.smtp.enabled || (self.smtp.address != '' && self.smtp.fromEmail != '')"
            mirrors: chatwoot.validate
            paths: [smtp.address, smtp.fromEmail]
            message: The SMTP server and the sender are required when SMTP is on.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Chatwoot inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: The dashboard, API, chat widget and WebSockets on the canonical endpoint.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: chatwoot.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        mirrors: chatwoot.validate
        paths: [internalAccess.workloads]
        message: With "Specific workloads", list at least one workload.

  - id: database
    title: Database
    description: Which PostgreSQL holds Chatwoot's data, and the prerequisite secret with its credentials.
    docs: "#database"
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - type: note
            severity: warning
            text: >-
              The database credentials secret must exist **before** you install; if it is missing, the
              deployment waits and `cpln logs` shows nothing at all.
          - type: note
            severity: info
            when: oldSelf != null
            text: >-
              The database cannot be switched on a running release: the other choice is a separate, empty
              database, and Chatwoot would start over with onboarding.
          - type: note
            severity: info
            when: >-
              oldSelf != null && self.postgresHA.enabled && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.3.1') < 0
            text: >-
              This version moves the HA database to patroni-postgres 0.8, with pgvector 0.8.7 (CVE-2026-103484).
              The fix takes effect when the members restart. In the Chatwoot database, `\dx` shows the old vector
              version until you run `ALTER EXTENSION vector UPDATE;`, which only updates that record.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas (PostgreSQL 17 with pgvector), 3 etcd replicas and an HAProxy leader endpoint that
          Chatwoot connects through. Recommended for production.
        fields:
          - path: postgresHA.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data is first initialized, and Chatwoot connects with
              them. To change the password later, change it in the database first, then update the secret and
              force a redeployment.
              In HA mode the order differs: move the leader to member -0 first (see the README's HA rotation steps).
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-chatwoot-db-credentials'"
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.resources
            type: resources
            label: PostgreSQL resources
            required: true
            description: Per Patroni replica.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
          - path: postgresHA.image
            type: string
            format: image
            label: Patroni PostgreSQL image
            required: true
            advanced: true
            description: The PostgreSQL image of the HA database; it carries pgvector, which Chatwoot requires.
            rules:
              - rule: >-
                  !self.postgresHA.enabled || (has(self.postgresHA.image) && self.postgresHA.image != '' && (
                  !(self.postgresHA.image.split(':')[0] in ['controlplanecorporation/patroni-postgres', 'docker.io/controlplanecorporation/patroni-postgres']) ||
                  size(self.postgresHA.image.split(':')) < 2 ||
                  !self.postgresHA.image.split(':')[1].matches('^0[.][0-7]([.][0-9]+)?$')))
                mirrors: chatwoot.validatePostgresHAImage
                message: >-
                  This image carries a pgvector older than 0.8.7, which is open to CVE-2026-103484: a database user who
                  can create an IVFFlat index can run arbitrary code. Use controlplanecorporation/patroni-postgres:0.8.
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: >-
          One PostgreSQL replica, for development and light use. Its server, storage, network and backups
          follow in the next steps.
        fields:
          - path: postgres.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data directory is first initialized, and Chatwoot
              connects with them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then
              update the secret and force a redeployment.
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-chatwoot-db-credentials'"
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Object
              Admin role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgresHA.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'minio'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgresHA.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.minio.credentialsSecretName
            type: ref
            label: MinIO credentials secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
          - path: postgresHA.backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - rule: "!has(self.postgresHA.backup.minio.accessKey) && !has(self.postgresHA.backup.minio.secretKey)"
            paths: [postgresHA.backup.minio.credentialsSecretName]
            message: >-
              postgresHA.backup.minio.accessKey and secretKey were removed in 1.2.1. Put them in the MinIO
              credentials secret and remove them from the values.
    rules:
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: chatwoot.validate
        paths: [postgresHA.enabled, postgres.enabled]
        message: Enable exactly one database, either the highly available or the single-instance PostgreSQL.
      - rule: "!self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled)"
        mirrors: chatwoot.validate
        paths: [postgresHA.enabled]
        message: >-
          The HAProxy leader endpoint is how Chatwoot reaches the HA database, so it stays on: remove
          postgresHA.proxy.enabled from the values.
      - rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != null &&
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != ''
        mirrors: chatwoot.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: The database credentials secret is required.
      - rule: "!has(self.postgres.credentials)"
        mirrors: chatwoot.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          postgres.credentials was removed in 1.3.0: the database credentials are now a prerequisite
          dictionary secret named by the credentials secret field. Remove postgres.credentials from the values.
      - rule: "!has(self.postgresHA.postgres)"
        paths: [postgresHA.config.credentialsSecretName]
        message: >-
          postgresHA.postgres was removed in 1.2.0: put its username, password and database in the database
          credentials secret and remove the block from the values.
      - rule: >-
          !has(self.postgres.config.username) && !has(self.postgres.config.password) &&
          !has(self.postgres.config.database)
        paths: [postgres.config.credentialsSecretName]
        message: >-
          postgres.config.username, password and database were removed in 1.1.0: put them in the database
          credentials secret and remove them from the values.
      # Upgrading from 1.2.x or earlier, the chart-created secret is deleted by the upgrade itself, so the new
      # prerequisite secret must have a different name (holding the same username, password and database).
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') < 0
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) !=
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          The previous version created the database secret itself, and this upgrade deletes it. Create a secret
          under a NEW name holding the same username, password and database, and name it here.
      - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.3.0') >= 0)
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) ==
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        severity: info
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          PostgreSQL reads the credentials only when its data is first initialized; pointing at another secret
          does not change the existing user or password.
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        paths: [postgresHA.enabled, postgres.enabled]
        message: >-
          Switching the database on a running release points Chatwoot at a separate, empty database; the
          existing data is not migrated.

  - id: redis
    title: Redis
    description: The bundled single-node Redis for Sidekiq queues, live updates and the cache.
    docs: "#redis"
    fields:
      - path: redis.image
        type: string
        format: image
        label: Redis image
        required: true
      - type: note
        severity: warning
        text: >-
          The Redis password secret must exist **before** you install. If it is missing, the deployment waits and
          `cpln logs` shows nothing at all.
      - path: redis.credentialsSecretName
        type: ref
        label: Redis password secret
        required: true
        description: >-
          A dictionary secret with the key `password`. It is part of the Redis connection URL, so use letters,
          digits, `-` and `_` only.
        help: >-
          Redis and Chatwoot read it when they start: after changing it, redeploy Redis, then the worker and the
          web workload (see Rotating the Redis password in the docs).
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [password]
          create:
            secretType: dictionary
            suggestName: "context.releaseName + '-chatwoot-redis'"
      - path: redis.resources
        type: resources
        label: Redis resources
        required: true
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
      - path: redis.volumeset.capacity
        type: integer
        label: Initial capacity
        unit: GiB
        min: 10
        required: true
        suggestions: [10, 20, 50]
        help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
        docs: "/reference/volumeset#capacity-and-billing"
    rules:
      - rule: self.redis.credentialsSecretName != ''
        mirrors: chatwoot.validateRedisSecret
        paths: [redis.credentialsSecretName]
        message: The Redis password secret is required.
      - rule: "!has(self.redis.auth) || !has(self.redis.auth.password)"
        mirrors: chatwoot.validateRedisSecret
        paths: [redis.credentialsSecretName]
        message: >-
          redis.auth.password was removed in 1.3.0: the Redis password is now a prerequisite dictionary secret
          (key: password) named by the Redis password secret field. Remove redis.auth from the values.
      # Upgrading from 1.2.x or earlier, the chart-created secret that held the Redis password is deleted by the
      # upgrade itself, so the new prerequisite secret must have a different name (holding the same password).
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') < 0
        rule: self.redis.credentialsSecretName != context.releaseName + '-chatwoot-creds'
        paths: [redis.credentialsSecretName]
        message: >-
          The previous version kept the Redis password in this secret, and this upgrade deletes it. Create a
          secret under a NEW name holding the same password, and name it here.
      - rule: oldSelf == null || self.redis.volumeset.capacity >= oldSelf.redis.volumeset.capacity
        paths: [redis.volumeset.capacity]
        message: A volume set cannot shrink. Keep the capacity at or above the installed size.

# Rules over the imported values: their issues show on the imported fields' step.
rules:
  - when: self.postgres.enabled
    rule: "!self.postgres.image.startsWith('postgres:')"
    mirrors: chatwoot.validate
    paths: [postgres.image]
    message: >-
      The stock postgres image has no pgvector, which Chatwoot's schema requires. Use a pgvector image such
      as pgvector/pgvector:pg18, or the highly available database.
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Chatwoot, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: >-
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-chatwoot') in self.postgres.internalAccess.workloads &&
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-chatwoot-worker') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: >-
      'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-chatwoot and //gvc/' + context.gvc +
      '/workload/' + context.releaseName + '-chatwoot-worker, or Chatwoot cannot reach its database.'
    message: Add the Chatwoot web and worker workloads to the list, or Chatwoot cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Chatwoot connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.3.0"
    from: redis.auth.password
    note: >-
      The Redis password is now a prerequisite dictionary secret (key: password). Create it under a NEW name
      holding the current password (key redisPassword of the <release>-chatwoot-creds secret), and choose it
      under Redis.
  - fromVersions: "<1.3.0"
    from: postgres.credentials
    note: >-
      In 1.2.x these credentials served both database modes (single-instance and HA). They are now a prerequisite
      dictionary secret (username, password, database): create it under a NEW name with the values the database
      was initialized with, and choose it under Database.
  - fromVersions: "<1.2.0"
    from: postgresHA.postgres
    note: >-
      Put the username, password and database the HA database was initialized with in the database
      credentials secret, and choose it under Database.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.1.0"
    from: postgres.config.username
    note: Put it in the database credentials secret (key username); choose the secret under Database.
  - fromVersions: "<1.1.0"
    from: postgres.config.password
    note: Put it in the database credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.1.0"
    from: postgres.config.database
    note: Put it in the database credentials secret (key database); choose the secret under Database.
