# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: ClickHouse
# createsGvc: true. The chart creates its own GVC from gvc.name and gvc.locations (templates/gvc.yaml), so there is
# no target GVC to limit and no gvc block (guide 14.2); the location rules work on gvc.locations instead.
steps:
  - id: locations
    title: GVC and locations
    description: >-
      The GVC this release creates, the locations ClickHouse runs in and the server replicas in each; the list
      also selects the deployment mode.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'install'
        text: >-
          This version creates its own GVC with the name below. Use a name no GVC in the org has: the release
          adopts an existing GVC of that name when no other release manages it (one another release manages is refused), and uninstalling the release then deletes that GVC with every
          workload in it. Uninstall the release against the GVC you install it into, not the GVC it creates.
      - path: gvc.name
        type: string
        label: GVC name
        required: true
        immutable: >-
          The release runs in the GVC it created; another name would create a new, empty GVC and delete this one
          with everything in it.
        description: The GVC this release creates and runs in. Give every install its own.
        pattern: '^[a-z][a-z0-9-]{0,61}[a-z0-9]$'
        patternMessage: >-
          Use lowercase letters, digits and hyphens, starting with a letter and ending with a letter or digit.
        rules:
          # The chart writes the GVC name unquoted (name: {{ .Values.gvc.name }}).
          - rule: >-
              (oldSelf != null && self.gvc.name == oldSelf.gvc.name) ||
              !(self.gvc.name in ['true', 'false', 'null'])
            severity: warning
            message: >-
              This version writes the GVC name unquoted, so YAML reads true, false and null as a boolean or
              null and the GVC cannot be created. Choose another name.
          - rule: self.gvc.name != 'clickhouse-gvc'
            severity: info
            messageExpression: >-
              'GVC names are org-wide: a release on this name is refused while another release manages that GVC.
              Give each release its own, for example ' + context.releaseName + '-clickhouse.'
            message: >-
              GVC names are org-wide: a release on this name is refused while another release manages that
              GVC. Give each release its own.
      - path: gvc.locations
        type: list
        label: Locations
        required: true
        minItems: 1
        uniqueBy: [name]
        widget: table
        newItem: { name: "", replicas: 1 }
        itemLabel: "item.name + ' × ' + (item.replicas == null ? '?' : string(item.replicas))"
        description: >-
          The locations of the GVC. In cluster modes, one shard per location, in list order: a location's
          position is its shard number, and the first three locations also host the Keeper members.
        item:
          type: object
          fields:
            - path: name
              type: ref
              label: Location
              required: true
              ref: { kind: location, format: name, mustExist: error }
            - path: replicas
              type: integer
              label: Server replicas
              required: true
              min: 0
              widget: stepper
          rules:
            # workload-server.yaml: replicas 0 renders localOptions[].suspend for that location.
            - rule: item.replicas == null || item.replicas != 0
              severity: warning
              paths: [replicas]
              message: >-
                0 suspends the server in this location, but the location keeps its shard number and Keeper
                slot. Remove the location instead.
        rules:
          - rule: size(self.gvc.locations) != 2
            mirrors: clickhouse.validateLocations
            message: >-
              2 locations are not supported. Use 1 location (a single node, or a single-shard cluster with
              more replicas) or 3 or more locations (one shard per location).
          # Shard numbers and Keeper slots exist only in cluster modes; a single node writes no <macros>.
          - rule: >-
              oldSelf == null || (size(oldSelf.gvc.locations) == 1 && oldSelf.gvc.locations[0].replicas == 1) ||
              (self.gvc.locations.map(l, l.name).join(',') + ',').startsWith(oldSelf.gvc.locations.map(l, l.name).join(',') + ',') ||
              (oldSelf.gvc.locations.map(l, l.name).join(',') + ',').startsWith(self.gvc.locations.map(l, l.name).join(',') + ',')
            severity: info
            message: >-
              This upgrade changes which location holds an installed position in the list. A location's
              position is its shard number, which its nodes use as their `{shard}` macro, and the first
              three locations are the Keeper members, so a moved location's nodes get another shard number
              than the one their replicated tables were created with, and a new location takes over another
              location's shard number and Keeper slot. Keep the installed locations first, in their order,
              and add new ones after them.
          # In single-node mode the chart declares no Keeper workload and no Keeper volume set (workload-keeper.yaml,
          # volumeset.yaml), and Helm deletes what a chart no longer declares.
          - rule: >-
              oldSelf == null || (size(oldSelf.gvc.locations) == 1 && oldSelf.gvc.locations[0].replicas == 1) ||
              !(size(self.gvc.locations) == 1 && self.gvc.locations[0].replicas == 1)
            severity: info
            message: >-
              One location with one replica turns the cluster into a single node, which has no Keeper: the
              upgrade deletes the Keeper workload and its volume set with the Raft log and Raft snapshots,
              and the server restarts with the single-node configuration.
          # Each location gets its own volume (guide 4.6), and the volume holds the metadata.
          - rule: >-
              oldSelf == null || !(size(oldSelf.gvc.locations) == 1 && oldSelf.gvc.locations[0].replicas == 1) ||
              self.gvc.locations.exists(l, l.name == oldSelf.gvc.locations[0].name)
            severity: info
            message: >-
              The installed single node's location is no longer in the list. Each location has its own volume,
              which holds the node's metadata, so a node in a new location starts without the installed node's
              tables, although their data stays in object storage.
          # templates/gvc.yaml: staticPlacement.locationLinks is the list, so a removed location leaves the GVC.
          - rule: >-
              oldSelf == null || oldSelf.gvc.locations.all(o, self.gvc.locations.exists(l, l.name == o.name))
            severity: info
            message: >-
              This upgrade removes a location from the GVC the release created, with the server replicas and
              the Keeper member that ran there and their volumes.
      - type: note
        when: size(self.gvc.locations) == 1 || size(self.gvc.locations) >= 3
        text: >-
          1 location with 1 replica is a single node without Keeper; 1 location with more replicas is a
          single-shard cluster with one Keeper member; 3 or more locations are a multi-shard cluster with one
          shard per location and three Keeper members.
        textExpression: >-
          size(self.gvc.locations) >= 3 ?
          'Multi-shard cluster: ' + string(size(self.gvc.locations)) + ' shards, one per location, and three Keeper members in the first three locations, which tolerate the loss of one.' :
          self.gvc.locations[0].replicas == 1 ?
          'Single node: one ClickHouse server and no Keeper.' :
          'Single-shard cluster: one shard with ' + string(self.gvc.locations[0].replicas) + ' server replicas, and one Keeper member, which tolerates no loss.'
      - type: note
        when: size(self.gvc.locations) >= 3 && self.gvc.locations.exists(l, l.replicas == 1)
        text: >-
          With one server replica in a location, losing that shard fails every distributed query, not only
          the rows on that shard. Add replicas there if partial results are not acceptable.
      - path: clusterName
        type: string
        label: Cluster name
        required: true
        when: "!(size(self.gvc.locations) == 1 && self.gvc.locations[0].replicas == 1)"
        description: The name of the cluster in `ON CLUSTER` DDL and in `Distributed` table definitions.
        rules:
          # secret-server-config.yaml writes it as an XML element name and unquoted into the CREATE DATABASE ... ON
          # CLUSTER statement; this chart does not check it, so an installed value is left alone.
          - rule: >-
              (oldSelf != null && self.clusterName == oldSelf.clusterName) ||
              self.clusterName.matches('^[A-Za-z_][A-Za-z0-9_]*$')
            severity: warning
            message: >-
              Use letters, digits and underscores only, not starting with a digit, such as my_cluster: the name
              becomes an XML element name and is used unquoted in `ON CLUSTER` DDL.
          - rule: >-
              oldSelf == null || (size(oldSelf.gvc.locations) == 1 && oldSelf.gvc.locations[0].replicas == 1) ||
              self.clusterName == oldSelf.clusterName
            severity: info
            message: >-
              Renaming the cluster orphans existing `Distributed` tables: they keep pointing at the old
              cluster name and fail with `Code: 701`. Recreate them after the upgrade.

  - id: credentials
    title: Credentials
    description: The secret with the password of the built-in `default` user and the name of the database to create.
    fields:
      - type: note
        severity: warning
        text: >-
          The credentials secret must exist **before** you install. If it is missing, the deployment waits
          silently and `cpln logs` shows nothing; `cpln workload get-deployments
          RELEASE_NAME-clickhouse-server --gvc GVC_NAME -o yaml` shows why under `status.versions[].message`.
          Creating the secret repairs the deployment in about 5.5 to 10.5 minutes, or force a redeployment
          to skip the wait.
        textExpression: >-
          'The credentials secret must exist **before** you install. If it is missing, the deployment waits silently and `cpln logs` shows nothing; `cpln workload get-deployments ' +
          context.releaseName + '-clickhouse-server --gvc ' + (self.gvc.name == '' ? 'GVC_NAME' : self.gvc.name) +
          ' -o yaml` shows why under `status.versions[].message`. Creating the secret repairs the deployment in about 5.5 to 10.5 minutes, or force a redeployment to skip the wait.'
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '2.6.0') < 0
        text: >-
          Versions before 2.6.0 shipped a default database password published in the template repository
          (`mypw` in 1.0.0, `mypassword` from 2.0.0). Put a new password in the credentials secret; do not
          reuse the old one.
      - path: database.credentialsSecretName
        type: ref
        label: Credentials secret
        required: true
        description: >-
          A dictionary secret with the keys `password` and `database`. There is no `username` key: ClickHouse
          uses its built-in `default` user.
        help: >-
          Secret names are org-wide, so give each release its own. To rotate the password, update the
          secret's `password`, run `cpln workload force-redeployment RELEASE_NAME-clickhouse-server --gvc
          GVC_NAME`, then update your clients: the server writes the password into `users.xml` at every start,
          and updating a secret does not restart the workload by itself. `ALTER USER` cannot change it, because
          `default` is defined in `users.xml`. Keep `database` unchanged: the server
          creates that database at start when it does not exist. The startup script puts `database` unquoted
          into SQL, so use a bare identifier such as `mydatabase`, and writes the password unescaped into the
          XML configuration, so keep `<` and `&` out of it.
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [password, database]
          create:
            suggestName: "context.releaseName + '-clickhouse-credentials'"
        rules:
          - rule: oldSelf == null || self.database.credentialsSecretName == oldSelf.database.credentialsSecretName
            severity: info
            message: >-
              The servers read the password from the new secret at their next start, so clients need its
              password from then on. A different `database` entry creates another database next to the
              existing one.
    rules:
      - rule: "!has(self.database.password) && !has(self.database.name)"
        mirrors: clickhouse.validate
        paths: [database.credentialsSecretName]
        message: >-
          `database.password` and `database.name` were removed in 2.6.0. Put them in the credentials secret as
          `password` and `database`, and remove them from the values.

  - id: storage
    title: Object storage
    description: Where ClickHouse keeps its table data; the server volume holds its metadata.
    sections:
      - fields:
          - type: note
            text: >-
              Give each release its own bucket or container: the chart writes to a fixed path in it, so two
              releases on one bucket would share a data path. Keep the locations and the bucket in the same cloud
              provider and region family: cross-region traffic to object storage is billed on every query
              that misses the local cache.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.0.0') < 0
            text: >-
              1.0.0 had no object storage. Tables created on 1.0.0 keep their parts on the server volume, while
              from 2.0.0 the chart sets a default storage policy that contains only the object storage disk, so
              this upgrade path is unproven. Install a new release and copy the data across instead.
          - path: provider
            type: enum
            label: Provider
            widget: cards
            required: true
            immutable: >-
              Switch object storage providers with a fresh install: the table data stays in the old storage,
              and the release's identity keeps a cloud binding once it has one.
            options:
              - value: aws
                label: AWS S3
                description: Keyless, through a cloud account and an AWS IAM policy.
              - value: gcp
                label: Google Cloud Storage
                description: Through the S3-compatible interface, with an HMAC key pair stored in the release values.
              - value: azure
                label: Azure Blob Storage
                description: With the storage account access key, stored in the release values.
              - value: hetzner
                label: Hetzner Object Storage
                description: S3-compatible, with an access key pair stored in the release values.
            rules:
              - rule: self.provider in ['aws', 'gcp', 'azure', 'hetzner']
                mirrors: clickhouse.validateStorage
                message: The provider must be `aws`, `gcp`, `azure` or `hetzner`.
      - id: aws
        title: AWS S3
        when: self.provider == 'aws'
        description: The workload identity reaches the bucket through the cloud account and the AWS IAM policy.
        docs: "#aws-s3"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.6.1') < 0
            text: >-
              2.6.1 stopped attaching `aws::ReadOnlyAccess` to the identity, which supplied any read action
              your bucket policy lacked. Before upgrading, make sure your AWS IAM policy allows the full action
              list under AWS IAM policy below.
          - path: aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            docs: "/guides/create-cloud-account"
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: aws.policyName
            type: string
            label: AWS IAM policy
            required: true
            example: true
            description: >-
              The name of the AWS IAM policy you created for the bucket (an AWS object, not a Control Plane
              policy).
            help: >-
              Allow `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject`, `s3:ListBucket`, `s3:GetObjectVersion`,
              `s3:DeleteObjectVersion`, `s3:GetBucketLocation`, `s3:AbortMultipartUpload`,
              `s3:ListBucketMultipartUploads` and `s3:ListMultipartUploadParts` on `arn:aws:s3:::BUCKET` and
              `arn:aws:s3:::BUCKET/*`.
            pattern: '^[\w+=,.@-]{1,128}$'
            patternMessage: Use up to 128 letters, digits and the characters + = , . @ _ -.
        rules:
          - rule: oldSelf == null || oldSelf.provider != 'aws' || self.aws.bucket == oldSelf.aws.bucket
            severity: info
            paths: [aws.bucket]
            message: >-
              The table data stays in the installed bucket, and the volume holds metadata that points
              there; another bucket does not move the data.
          - rule: oldSelf == null || oldSelf.provider != 'aws' || self.aws.region == oldSelf.aws.region
            severity: info
            paths: [aws.region]
            message: >-
              The bucket and its table data stay in their installed region, and the volume holds metadata
              that points there; another region does not move them.
      - id: gcp
        title: Google Cloud Storage
        when: self.provider == 'gcp'
        description: >-
          ClickHouse reaches GCS through its S3-compatible interface with an interoperability HMAC key; no cloud
          account is needed.
        fields:
          - type: note
            severity: warning
            text: >-
              This version takes the HMAC key as plain values, so it is stored in the Helm release and in a
              configuration secret the chart creates. 2.7.0 and later read it from a dictionary secret you create.
          - path: gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: gcp.accessKeyId
            type: string
            label: HMAC access key ID
            required: true
            example: true
            description: >-
              The HMAC key from the bucket project's Interoperability settings, for a service account with
              Storage Object Admin.
          - path: gcp.secretAccessKey
            type: string
            label: HMAC secret
            required: true
            sensitive: true
            widget: password
            example: true
        rules:
          - rule: oldSelf == null || oldSelf.provider != 'gcp' || self.gcp.bucket == oldSelf.gcp.bucket
            severity: info
            paths: [gcp.bucket]
            message: >-
              The table data stays in the installed bucket, and the volume holds metadata that points
              there; another bucket does not move the data.
      - id: azure
        title: Azure Blob Storage
        when: self.provider == 'azure'
        description: ClickHouse authenticates with a storage account access key; no cloud account is needed.
        fields:
          - type: note
            severity: warning
            text: >-
              This version takes the account key as a plain value, so it is stored in the Helm release and in a
              configuration secret the chart creates. 2.8.0 and later read it from a dictionary secret you create.
          - path: azure.storageAccount
            type: string
            label: Storage account
            required: true
            example: true
            pattern: '^[a-z0-9]{3,24}$'
            patternMessage: Use 3 to 24 lowercase letters and digits.
          - path: azure.container
            type: string
            label: Container
            required: true
            description: A private Blob Storage container in the storage account.
            pattern: '^[a-z0-9](?!.*--)[a-z0-9-]{1,61}[a-z0-9]$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits and single hyphens, starting and ending with a letter or
              digit.
            rules:
              - rule: self.azure.container != 'clickhouse-data'
                severity: info
                messageExpression: >-
                  'The chart has no path prefix, so two releases on one storage account and container share a
                  data path. Give each release its own container, for example ' + context.releaseName +
                  '-clickhouse-data.'
                message: >-
                  The chart has no path prefix, so two releases on one storage account and container share a
                  data path. Give each release its own container.
          - path: azure.accountKey
            type: string
            label: Account key
            required: true
            sensitive: true
            widget: password
            example: true
            description: One of the storage account's access keys (key1 or key2).
        rules:
          - rule: >-
              oldSelf == null || oldSelf.provider != 'azure' ||
              self.azure.storageAccount == oldSelf.azure.storageAccount
            severity: info
            paths: [azure.storageAccount]
            message: >-
              The table data stays in the installed storage account, and the volume holds metadata that
              points there; another storage account does not move the data.
          - rule: oldSelf == null || oldSelf.provider != 'azure' || self.azure.container == oldSelf.azure.container
            severity: info
            paths: [azure.container]
            message: >-
              The table data stays in the installed container, and the volume holds metadata that points
              there; another container does not move the data.
      - id: hetzner
        title: Hetzner Object Storage
        when: self.provider == 'hetzner'
        description: S3-compatible storage with an access key pair; no cloud account is needed.
        fields:
          - type: note
            severity: warning
            text: >-
              This version takes the access key pair as plain values, so it is stored in the Helm release and in a
              configuration secret the chart creates. 2.7.0 and later read it from a dictionary secret you create.
          - path: hetzner.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: hetzner.region
            type: enum
            label: Region
            widget: segmented
            required: true
            options:
              - { value: nbg1, label: Nuremberg (nbg1) }
              - { value: hel1, label: Helsinki (hel1) }
              - { value: fsn1, label: Falkenstein (fsn1) }
          - path: hetzner.accessKeyId
            type: string
            label: Access key
            required: true
            example: true
            description: Generated under Security, S3 Credentials in the Hetzner Cloud console.
          - path: hetzner.secretAccessKey
            type: string
            label: Secret key
            required: true
            sensitive: true
            widget: password
            example: true
        rules:
          - rule: oldSelf == null || oldSelf.provider != 'hetzner' || self.hetzner.bucket == oldSelf.hetzner.bucket
            severity: info
            paths: [hetzner.bucket]
            message: >-
              The table data stays in the installed bucket, and the volume holds metadata that points
              there; another bucket does not move the data.
          - rule: oldSelf == null || oldSelf.provider != 'hetzner' || self.hetzner.region == oldSelf.hetzner.region
            severity: info
            paths: [hetzner.region]
            message: >-
              The bucket and its table data stay in their installed region, and the volume holds metadata
              that points there; another region does not move them.

  - id: server
    title: Server
    description: The ClickHouse server's image, compute, volume and who can connect to it.
    sections:
      - fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.3.0') < 0
            text: >-
              2.3.0 renamed the workloads: RELEASE_NAME-server became RELEASE_NAME-clickhouse-server and
              RELEASE_NAME-keeper became RELEASE_NAME-clickhouse-keeper. The upgrade deletes the old workloads and
              creates the new ones, so point your clients at the new server name.
            textExpression: >-
              '2.3.0 renamed the workloads: ' + context.releaseName + '-server became ' + context.releaseName +
              '-clickhouse-server and ' + context.releaseName + '-keeper became ' + context.releaseName +
              '-clickhouse-keeper. The upgrade deletes the old workloads and creates the new ones, so point your clients at the new server name.'
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts every server replica in every location at once: nothing serialises a
              rolling restart of a stateful workload, so plan the upgrade as a query interruption.
          - path: server.image
            type: string
            format: image
            label: Server image
            required: true
            # The chart writes the image unquoted (workload-server.yaml:13); `format: image` covers it (guide 17.3.1).
          - path: server.resources
            type: resources
            label: Server resources
            required: true
            description: Per server replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: volumeset.server.capacity
            type: integer
            label: Server volume capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            description: >-
              Holds each replica's metadata and the object storage disk metadata; table data lives in object
              storage.
            docs: "#volumes"
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            rules:
              - rule: oldSelf == null || self.volumeset.server.capacity >= oldSelf.volumeset.server.capacity
                message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - id: server-access
        title: Who can connect
        description: Firewall changes take up to about five minutes to propagate.
        fields:
          - path: server.internal_access.type
            type: enum
            label: Who can connect to the server
            widget: cards
            required: true
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in this release's GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Blocks all internal traffic in this version (fixed in 3.0.0).
            rules:
              # workload-server.yaml renders inboundAllowWorkload: [] whatever the values say (CHANGELOG, clickhouse 3.0.0).
              - rule: self.server.internal_access.type != 'workload-list'
                severity: warning
                message: >-
                  This version never applies the workload list, so Specific workloads blocks every client and,
                  in cluster modes, the server replicas from each other. 3.0.0 fixes it. Choose Same GVC or
                  Same org.

  - id: keeper
    title: Keeper
    when: "!(size(self.gvc.locations) == 1 && self.gvc.locations[0].replicas == 1)"
    description: >-
      ClickHouse Keeper, the Raft coordination service of the cluster modes, with up to three members in the
      first three locations.
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts the Keeper members too, and changing a Keeper setting costs about 60
              seconds of coordination outage. Plan it as a query interruption.
          - path: keeper.image
            type: string
            format: image
            label: Keeper image
            required: true
            # Written unquoted too (workload-keeper.yaml:11); `format: image` covers it, as for the server image.
          - path: keeper.resources
            type: resources
            label: Keeper resources
            required: true
            description: Per Keeper member.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: volumeset.keeper.capacity
            type: integer
            label: Keeper volume capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            description: Holds each member's Raft log and snapshots.
            docs: "#volumes"
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            rules:
              # A release installed as a single node has no Keeper volume set yet.
              - rule: >-
                  oldSelf == null || (size(oldSelf.gvc.locations) == 1 && oldSelf.gvc.locations[0].replicas == 1) ||
                  self.volumeset.keeper.capacity >= oldSelf.volumeset.keeper.capacity
                message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - id: keeper-access
        title: Who can connect
        description: Firewall changes take up to about five minutes to propagate.
        fields:
          - path: keeper.internal_access.type
            type: enum
            label: Who can connect to Keeper
            widget: cards
            required: true
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in this release's GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Blocks all internal traffic in this version (fixed in 3.0.0).
            rules:
              # workload-keeper.yaml renders inboundAllowWorkload: [] whatever the values say.
              - rule: self.keeper.internal_access.type != 'workload-list'
                severity: warning
                message: >-
                  This version never applies the workload list, so Specific workloads blocks the ClickHouse
                  servers and the other Keeper members, and the cluster cannot coordinate. 3.0.0 fixes it.
                  Choose Same GVC or Same org.

yamlOnly:
  - path: server.internal_access.workloads
    reason: This version never applies it (the server firewall's workload list is always empty); fixed in 3.0.0.
  - path: keeper.internal_access.workloads
    reason: This version never applies it (the Keeper firewall's workload list is always empty); fixed in 3.0.0.

migrations:
  # 1.0.0 named the cluster my_cluster in the chart itself.
  - fromVersions: "<2.0.0"
    assume: { clusterName: my_cluster }
  # Before 2.1.0 the chart sized both volume sets at 10 GiB itself.
  - fromVersions: "<2.1.0"
    assume: { volumeset.server.capacity: 10, volumeset.keeper.capacity: 10 }
  # A computed migration carries the list even when the release kept its version's default: the default changed in
  # 2.2.0 (another third location) and 2.4.0 (another order), and the order sets the shard numbers.
  - fromVersions: "<2.4.0"
    to: gvc.locations
    valueExpr: self.gvc.locations
    note: The release keeps its installed locations, in their order; a location's position is its shard number.
  # 2.6.0 moved the database login into a secret.
  - fromVersions: "<2.6.0"
    from: database.password
    note: >-
      The password moved into a dictionary secret with the keys password and database; choose it under
      Credentials. Versions before 2.6.0 shipped a published default password: choose a new one.
  - fromVersions: "<2.6.0"
    from: database.name
    note: The database name moved into the credentials secret as the key database; choose the secret under Credentials.
  # 2.0.0 to 2.2.0 chose the storage with two switches and nested keys.
  - fromVersions: ">=2.0.0 <2.3.0"
    to: provider
    valueExpr: "self.gcp.enabled ? 'gcp' : 'aws'"
  - fromVersions: ">=2.0.0 <2.3.0"
    from: aws.enabled
    note: 2.3.0 replaced aws.enabled and gcp.enabled with Provider; the release's choice is carried there.
  - fromVersions: ">=2.0.0 <2.3.0"
    from: gcp.enabled
    note: 2.3.0 replaced aws.enabled and gcp.enabled with Provider; the release's choice is carried there.
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.bucket, to: aws.bucket }
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.region, to: aws.region }
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.cloudAccountName, to: aws.cloudAccountName }
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.policyName, to: aws.policyName }
  - { fromVersions: ">=2.0.0 <2.3.0", from: gcp.gcs.bucket, to: gcp.bucket }
  - { fromVersions: ">=2.0.0 <2.3.0", from: gcp.gcs.accessKeyId, to: gcp.accessKeyId }
  - { fromVersions: ">=2.0.0 <2.3.0", from: gcp.gcs.secretAccessKey, to: gcp.secretAccessKey }
