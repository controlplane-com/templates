{{- if not (include "clickhouse.isSingleNode" .) }}
---
kind: secret
name: {{ include "clickhouse.secretKeeper.name" . }}
description: Clickhouse keeper startup script
tags: {{- include "clickhouse.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    LOG_PREFIX="[clickhouse-keeper]"

    # --- Replica info ---
    # GVC comes from the runtime built-in (set by the shared guard below), not
    # from Helm, so it cannot drift from the GVC this workload actually runs in.
    LOCATION=$(basename "${CPLN_LOCATION:-}")
    HOSTNAME=${HOSTNAME:-}
    WORKLOAD_NAME="{{ include "clickhouse.keeper.name" . }}"
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')

    # --- Directories ---
    CONFIG_DIR="/etc/clickhouse-keeper"
    CONFIG_FILE="$CONFIG_DIR/config.xml"
    LOG_DIR="/var/log/clickhouse-keeper"
    DATA_DIR="/var/lib/clickhouse/coordination"

    # --- Prepare locations from Helm values ---
    IFS=',' read -r -a LOCATIONS <<< "${LOCATIONS_STR:-}"

    # --- Compute CURRENT_SERVER_ID ---
    # Values-only, so it runs before the API is consulted and can never be
    # skipped. 2.8.0 wrote server_id 0 -- an invalid Raft id -- and started
    # anyway when this replica was not a configured Keeper member.
    CURRENT_SERVER_ID=0
    SERVER_ID=1
    for LOC_PAIR in "${LOCATIONS[@]:0:3}"; do   # only first 3 locations
        LOC="${LOC_PAIR%%:*}"
        if [[ "$LOC" == "$LOCATION" && "$REPLICA_INDEX" == "0" ]]; then
            CURRENT_SERVER_ID=$SERVER_ID
        fi
        SERVER_ID=$((SERVER_ID+1))
    done
    if [[ "$CURRENT_SERVER_ID" -eq 0 ]]; then
        echo "[clickhouse-keeper] FATAL: this replica (location '${LOCATION}', replica index '${REPLICA_INDEX}') is not a configured Keeper member." >&2
        echo "[clickhouse-keeper] Keeper members are replica-0 of the first three entries in 'locations' (${LOCATIONS_STR:-})." >&2
        echo "[clickhouse-keeper] Refusing to start with Raft server_id 0, which is not a valid id. Remove this location from the GVC, or add it to 'locations' in your values." >&2
        exit 1
    fi

    mkdir -p "$CONFIG_DIR" "$LOG_DIR" "$DATA_DIR/logs" "$DATA_DIR/snapshots"


    {{- include "clickhouse.gvcLocationGuard" . | nindent 4 }}

    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"

    {{- include "clickhouse.keeperQuorumArithmetic" . | nindent 4 }}

    # --- Check C: Keeper quorum must be arithmetically possible ---
    # Unlike the server's location check this is NOT fresh/initialised
    # asymmetric: below a majority the Raft group cannot elect at all, so the
    # Keeper is useless whether or not it has data. It only fires on a
    # successful GVC read, so a control-plane hiccup can never trigger it.
    if [ "$KEEPER_QUORUM_OK" = "false" ]; then
        echo "[clickhouse-keeper] FATAL: Keeper quorum is unreachable. ${KEEPER_PRESENT} of ${KEEPER_TOTAL} configured Keeper locations (${KEEPER_MEMBER_LOCS% }) exist in GVC '${GVC}' (which has: ${GVC_LOCS% })." >&2
        echo "[clickhouse-keeper] A Raft group of ${KEEPER_TOTAL} needs floor(${KEEPER_TOTAL}/2)+1 members. Refusing to start rather than waiting for an election that can never complete." >&2
        echo "[clickhouse-keeper] Add the missing location(s) to the GVC, or remove them from 'locations' in your values." >&2
        exit 1
    fi
    if [ "$KEEPER_QUORUM_OK" = "true" ] && [ "$KEEPER_PRESENT" -lt "$KEEPER_TOTAL" ]; then
        echo "[clickhouse-keeper] WARNING: quorum is possible but degraded -- only ${KEEPER_PRESENT} of ${KEEPER_TOTAL} configured Keeper locations (${KEEPER_MEMBER_LOCS% }) exist in GVC '${GVC}'. There is no fault tolerance left." >&2
    fi

    echo "[clickhouse-keeper] Starting Keeper ${SELF_FQDN} as Raft server_id ${CURRENT_SERVER_ID} of ${KEEPER_TOTAL}"

    # --- Start config.xml ---
    cat > "$CONFIG_FILE" <<EOF
    <clickhouse>
        <logger>
            <level>information</level>
            <size>1000M</size>
            <count>3</count>
        </logger>

        <listen_host>0.0.0.0</listen_host>
        <keeper_server>
            <tcp_port>9181</tcp_port>
            <server_id>$CURRENT_SERVER_ID</server_id>
            <log_storage_path>$DATA_DIR/log</log_storage_path>
            <snapshot_storage_path>$DATA_DIR/snapshots</snapshot_storage_path>

            <coordination_settings>
                <operation_timeout_ms>20000</operation_timeout_ms>
                <session_timeout_ms>100000</session_timeout_ms>
                <raft_logs_level>information</raft_logs_level>
                <election_timeout_lower_bound_ms>20000</election_timeout_lower_bound_ms>
                <election_timeout_upper_bound_ms>100000</election_timeout_upper_bound_ms>
            </coordination_settings>

            <raft_configuration>
    EOF

    # --- Generate only 3 keeper replicas (replica-0 for first 3 locations) ---
    SERVER_ID=1
    for LOC in ${KEEPER_MEMBER_LOCS}; do
        FQDN="replica-0.${WORKLOAD_NAME}.${LOC}.${GVC}.cpln.local"

        cat >> "$CONFIG_FILE" <<EOL
                <server>
                    <id>$SERVER_ID</id>
                    <hostname>$FQDN</hostname>
                    <port>9234</port>
                </server>
    EOL

        SERVER_ID=$((SERVER_ID+1))
    done

    # --- Write myid file ---
    MYID_FILE="$DATA_DIR/myid"
    echo "$CURRENT_SERVER_ID" > "$MYID_FILE"
    echo "Created myid file with ID $CURRENT_SERVER_ID at $MYID_FILE"

    # --- Close XML ---
    cat >> "$CONFIG_FILE" <<EOF
            </raft_configuration>
        </keeper_server>
    </clickhouse>
    EOF

    echo "Generated Keeper config at $CONFIG_FILE:"
    cat "$CONFIG_FILE"

    exec clickhouse-keeper --config-file="$CONFIG_FILE"
{{- end }}
