{{- /*
  The aggregate validator is invoked from BOTH here and identity.yaml. It is
  defined once and emits nothing, so the second call costs nothing -- but
  Helm renders templates in reverse-lexical order within a directory, which
  puts workload-server.yaml FIRST and identity.yaml LAST. Wiring it only to
  identity.yaml meant a malformed `locations` (empty, or missing a name)
  crashed here with a Go-template error before the friendly message could
  fire. Do not rely on which of the two Helm reaches first.
*/ -}}
{{- include "clickhouse.validate" . -}}
kind: workload
name: {{ include "clickhouse.server.name" . }}
description: clickhouse server
tags: {{- include "clickhouse.tags" . | nindent 4 }}
spec:
  type: stateful
  containers:
    - name: server
      cpu: {{ .Values.server.resources.cpu | quote }}
      image: {{ .Values.server.image }}
      inheritEnv: false
      env:
      {{- if eq .Values.provider "gcp" }}
      - name: AWS_ACCESS_KEY_ID
        value: cpln://secret/{{ .Values.gcp.credentialsSecretName }}.accessKeyId
      - name: AWS_SECRET_ACCESS_KEY
        value: cpln://secret/{{ .Values.gcp.credentialsSecretName }}.secretAccessKey
      {{- end }}
      {{- if eq .Values.provider "hetzner" }}
      - name: AWS_ACCESS_KEY_ID
        value: cpln://secret/{{ .Values.hetzner.credentialsSecretName }}.accessKeyId
      - name: AWS_SECRET_ACCESS_KEY
        value: cpln://secret/{{ .Values.hetzner.credentialsSecretName }}.secretAccessKey
      {{- end }}
      {{- if eq .Values.provider "azure" }}
      - name: AZURE_STORAGE_ACCOUNT_KEY
        value: cpln://secret/{{ .Values.azure.credentialsSecretName }}.accountKey
      {{- end }}
      {{- include "clickhouse.locationsEnv" . | nindent 6 }}
      - name: CLICKHOUSE_PASSWORD
        value: cpln://secret/{{ .Values.database.credentialsSecretName }}.password
      - name: CLICKHOUSE_DATABASE
        value: cpln://secret/{{ .Values.database.credentialsSecretName }}.database
      memory: {{ .Values.server.resources.memory | quote }}
      command: "/bin/bash"
      args:
        - "/scripts/server-startup.sh"
      ports:
        - number: 8123
          protocol: http
        - number: 9000
          protocol: tcp
        - number: 9009
          protocol: http
      volumes:
        - path: /var/lib/clickhouse
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "clickhouse.volumeServer.name" . }}
        - path: /scripts/server-startup.sh
          uri: cpln://secret/{{ include "clickhouse.secretServer.name" . }}
        - path: /var/lib/clickhouse_cache
          recoveryPolicy: retain
          uri: scratch://cache-vol
        - path: /var/lib/clickhouse-tmp
          recoveryPolicy: retain
          uri: scratch://tmp-vol
        {{- if eq .Values.provider "aws" }}
        - path: /etc/clickhouse-server/config.d/storage.xml
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "clickhouse.secretS3.name" . }}
        {{- end }}
        {{- if eq .Values.provider "gcp" }}
        - path: /etc/clickhouse-server/config.d/storage.xml
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "clickhouse.secretGCS.name" . }}
        {{- end }}
        {{- if eq .Values.provider "azure" }}
        - path: /etc/clickhouse-server/config.d/storage.xml
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "clickhouse.secretAzure.name" . }}
        {{- end }}
        {{- if eq .Values.provider "hetzner" }}
        - path: /etc/clickhouse-server/config.d/storage.xml
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "clickhouse.secretHetzner.name" . }}
        {{- end }}
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "clickhouse.identity.name" . }}
  defaultOptions:
    autoscaling:
      keda: {}
      maxConcurrency: 0
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
  {{- range $location := .Values.locations }}
  - autoscaling:
      maxConcurrency: 0
      maxScale: {{ $location.replicas | int }}
      metric: disabled
      minScale: {{ $location.replicas | int }}
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    location: //location/{{ $location.name }}
    suspend: false
    timeoutSeconds: 10
  {{- end }}
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.server.internalAccess.type }}
      {{- $wl := .Values.server.internalAccess.workloads | default (list) }}
      {{- if eq .Values.server.internalAccess.type "workload-list" }}
      {{- /*
        This list governs ALL inbound internal traffic, INCLUDING traffic between
        the workloads of THIS release: Keeper's Raft on 9234, the servers' calls
        to Keeper on 9181, and server-to-server replication and distributed
        queries on 9000/9009. A list naming only clients cuts the cluster off
        from itself -- measured 2026-08-27 by following the README: Raft denied
        (`rbac_access_denied_matched_policy[none] ... "10.0.84.230:9234"`),
        quorum lost, cross-shard queries failing with `Code: 279`, while
        get-deployments reported every replica `ready=true restarts=0`. Adding
        the release's own links restored `zk_synced_followers 2`.

        Both own links are included on both workloads rather than the minimum
        each strictly needs. The over-grant is one release's workloads reaching
        each other inside one GVC; the under-grant is a silently destroyed
        cluster, and getting the direction wrong is exactly how this shipped.
      */}}
      {{- $own := list (printf "//gvc/%s/workload/%s" .Values.global.cpln.gvc (include "clickhouse.server.name" .)) }}
      {{- if not (include "clickhouse.isSingleNode" .) }}
      {{- $own = append $own (printf "//gvc/%s/workload/%s" .Values.global.cpln.gvc (include "clickhouse.keeper.name" .)) }}
      {{- end }}
      inboundAllowWorkload:
        {{- range $own }}
        - {{ . }}
        {{- end }}
        {{- range $wl }}
        {{- if not (has . $own) }}
        - {{ . }}
        {{- end }}
        {{- end }}
      {{- else if $wl }}
      inboundAllowWorkload:
        {{- range $wl }}
        - {{ . }}
        {{- end }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: true
  supportDynamicTags: false
