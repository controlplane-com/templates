# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: ClickHouse
# The chart lists its own locations (`locations[]`) and runs nothing in the GVC's other locations
# (defaultOptions 0/0, one localOptions entry per listed location), so the GVC only needs one location.
gvc:
  minLocations: 1
steps:
  - id: locations
    title: Locations
    description: >-
      The locations ClickHouse runs in and the server replicas in each; the list also selects the deployment
      mode.
    fields:
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '3.0.0') < 0
        text: >-
          Do not upgrade a 1.x or 2.x release to 3.0.0. Versions through 2.8.0 created their own GVC, and 3.0.0
          does not declare it, so the upgrade deletes that GVC with every workload, volume set and identity
          inside it. Instead: install 3.0.0 as a new release with a new release name into an existing GVC
          that has your locations, but not the GVC the old release created or named in `gvc.name`, because
          uninstalling the old release deletes that GVC with everything in it. Give the new release its own
          bucket or container, reload your data (do not reuse the old volume set), cut your applications
          over, then uninstall the old release against the GVC you originally installed it into.
      - path: locations
        type: list
        label: Locations
        docs: "#locations"
        required: true
        minItems: 1
        uniqueBy: [name]
        widget: table
        newItem: { name: "", replicas: 1 }
        itemLabel: "item.name + ' × ' + (item.replicas == null ? '?' : string(item.replicas))"
        description: >-
          In cluster modes, one shard per location, in list order: a location's position is its shard number,
          and the first three locations also host the Keeper members.
        item:
          type: object
          fields:
            - path: name
              type: ref
              label: Location
              required: true
              ref: { kind: location, scope: gvc, format: name, mustExist: error }
            - path: replicas
              type: integer
              label: Server replicas
              required: true
              min: 1
              widget: stepper
          rules:
            - rule: item.replicas == null || item.replicas >= 1
              mirrors: clickhouse.validateReplicas
              paths: [replicas]
              message: >-
                Each location needs at least 1 replica. To stop running in a location, remove it from the
                list.
            - when: context.mode == 'install'
              rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
              paths: [name]
              message: >-
                This location is not in the target GVC: nothing runs there, and every ClickHouse server in the
                other locations refuses to initialise. Add it to the GVC or pick another location.
            # A location the installed release did not list has no initialised node, so nothing starts there
            # (secret-server-config.yaml, check B is fatal on a fresh data directory); an installed location the GVC
            # lost keeps its other nodes serving (README: Important Notes), which this upgrade does not change.
            - when: >-
                context.mode == 'upgrade' &&
                (oldSelf == null || !oldSelf.locations.exists(l, l.name == item.name))
              rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
              paths: [name]
              message: >-
                This upgrade adds a location that is not in the release's GVC: nothing runs there, its shard
                never appears, and replicas this upgrade adds in any location refuse to initialise. Add it to
                the GVC or pick another location.
            - when: >-
                context.mode == 'upgrade' && oldSelf != null &&
                oldSelf.locations.exists(l, l.name == item.name)
              rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
              severity: info
              paths: [name]
              message: >-
                This installed location is no longer in the release's GVC, so no node runs there and its shard
                does not appear, and until it is back, replicas this upgrade adds in any location refuse to
                initialise. Add it to the GVC, or remove it from the list.
        rules:
          - rule: size(self.locations) != 2
            mirrors: clickhouse.validateLocations
            message: >-
              2 locations are not supported. Use 1 location (a single node, or a single-shard cluster with
              more replicas) or 3 or more locations (one shard per location).
          # Shard numbers and Keeper slots exist only in cluster modes; a single node writes no <macros>.
          - rule: >-
              oldSelf == null || (size(oldSelf.locations) == 1 && oldSelf.locations[0].replicas == 1) ||
              (self.locations.map(l, l.name).join(',') + ',').startsWith(oldSelf.locations.map(l, l.name).join(',') + ',') ||
              (oldSelf.locations.map(l, l.name).join(',') + ',').startsWith(self.locations.map(l, l.name).join(',') + ',')
            severity: info
            message: >-
              This upgrade changes which location holds an installed position in the list. A location's
              position is its shard number, which its nodes use as their `{shard}` macro, and the first
              three locations are the Keeper members, so a moved location's nodes get another shard number
              than the one their replicated tables were created with, and a new location takes over another
              location's shard number and Keeper slot. Keep the installed locations first, in their order,
              and add new ones after them.
          # The Keeper members are replica-0 of the first three locations, and below a majority of them in the
          # GVC every member exits at start, initialised or not (secret-keeper-config.yaml, check C). An upgrade
          # that changes the members causes that (error); one that keeps the installed members does not (info).
          - when: >-
              context.mode == 'upgrade' && context.gvcLocations != null && size(self.locations) >= 3 &&
              !(oldSelf != null && size(oldSelf.locations) >= 3 &&
              oldSelf.locations[0].name == self.locations[0].name &&
              oldSelf.locations[1].name == self.locations[1].name &&
              oldSelf.locations[2].name == self.locations[2].name)
            rule: >-
              (self.locations[0].name == '' || self.locations[0].name in context.gvcLocations ? 1 : 0) +
              (self.locations[1].name == '' || self.locations[1].name in context.gvcLocations ? 1 : 0) +
              (self.locations[2].name == '' || self.locations[2].name in context.gvcLocations ? 1 : 0) >= 2
            message: >-
              Fewer than two of the three Keeper locations (the first three in the list) are in the release's
              GVC, so after this upgrade the Keeper members exit at start and the cluster cannot coordinate.
              Add those locations to the GVC, or put locations the GVC has first in the list.
          - when: >-
              context.mode == 'upgrade' && context.gvcLocations != null && size(self.locations) >= 3 &&
              oldSelf != null && size(oldSelf.locations) >= 3 &&
              oldSelf.locations[0].name == self.locations[0].name &&
              oldSelf.locations[1].name == self.locations[1].name &&
              oldSelf.locations[2].name == self.locations[2].name
            rule: >-
              (self.locations[0].name == '' || self.locations[0].name in context.gvcLocations ? 1 : 0) +
              (self.locations[1].name == '' || self.locations[1].name in context.gvcLocations ? 1 : 0) +
              (self.locations[2].name == '' || self.locations[2].name in context.gvcLocations ? 1 : 0) >= 2
            severity: info
            message: >-
              Fewer than two of the three Keeper locations (the first three in the list) are in the release's
              GVC, so the Keeper members exit at start and the cluster cannot coordinate; this upgrade keeps
              the installed members. Add those locations to the GVC.
          # In single-node mode the chart declares no Keeper workload and no Keeper volume set (workload-keeper.yaml,
          # volumeset.yaml), and Helm deletes what a chart no longer declares (README: Migrating from 2.x).
          - rule: >-
              oldSelf == null || (size(oldSelf.locations) == 1 && oldSelf.locations[0].replicas == 1) ||
              !(size(self.locations) == 1 && self.locations[0].replicas == 1)
            severity: info
            message: >-
              One location with one replica turns the cluster into a single node, which has no Keeper: the
              upgrade deletes the Keeper workload and its volume set with the Raft log and Raft snapshots,
              and the server restarts with the single-node configuration.
          # Each location gets its own volume (guide §4.6), and the volume holds the metadata (README: Architecture).
          - rule: >-
              oldSelf == null || !(size(oldSelf.locations) == 1 && oldSelf.locations[0].replicas == 1) ||
              self.locations.exists(l, l.name == oldSelf.locations[0].name)
            severity: info
            message: >-
              The installed single node's location is no longer in the list. Each location has its own volume,
              which holds the node's metadata, so a node in a new location starts without the installed node's
              tables, although their data stays in object storage.
      - type: note
        when: size(self.locations) == 1 || size(self.locations) >= 3
        text: >-
          1 location with 1 replica is a single node without Keeper; 1 location with more replicas is a
          single-shard cluster with one Keeper member; 3 or more locations are a multi-shard cluster with one
          shard per location and three Keeper members.
        textExpression: >-
          size(self.locations) >= 3 ?
          'Multi-shard cluster: ' + string(size(self.locations)) + ' shards, one per location, and three Keeper members in the first three locations, which tolerate the loss of one.' :
          self.locations[0].replicas == 1 ?
          'Single node: one ClickHouse server and no Keeper.' :
          'Single-shard cluster: one shard with ' + string(self.locations[0].replicas) + ' server replicas, and one Keeper member, which tolerates no loss.'
      - type: note
        when: size(self.locations) >= 3 && self.locations.exists(l, l.replicas == 1)
        text: >-
          With one server replica in a location, losing that shard fails every distributed query, not only
          the rows on that shard, and it takes about 60 seconds to surface. Add replicas there if partial
          results are not acceptable.
      - type: note
        when: >-
          context.gvcLocations != null && self.locations.exists(l, l.name != '') &&
          context.gvcLocations.exists(g, !self.locations.exists(l, l.name == g))
        text: Locations of the GVC that are not listed here run nothing of this release.
        textExpression: >-
          'Locations of the GVC that are not listed here run nothing of this release: ' +
          context.gvcLocations.filter(g, !self.locations.exists(l, l.name == g)).join(', ') + '.'
      - path: clusterName
        type: string
        label: Cluster name
        required: true
        when: "!(size(self.locations) == 1 && self.locations[0].replicas == 1)"
        description: The name of the cluster in `ON CLUSTER` DDL and in `Distributed` table definitions.
        docs: "#cluster-and-database"
        pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        patternMessage: Use letters, digits and underscores only, not starting with a digit, such as my_cluster.
        rules:
          - rule: >-
              oldSelf == null || (size(oldSelf.locations) == 1 && oldSelf.locations[0].replicas == 1) ||
              self.clusterName == oldSelf.clusterName
            severity: info
            message: >-
              Renaming the cluster orphans existing `Distributed` tables: they keep pointing at the old
              cluster name and fail with `Code: 701`. Recreate them after the upgrade.
    rules:
      # clickhouse.validate runs validateClusterName in every mode, also single-node, where the field is hidden.
      - when: size(self.locations) == 1 && self.locations[0].replicas == 1
        # Helm refuses a falsy value (`not .Values.clusterName`) and matches the rest as text, so `true` passes.
        rule: >-
          self.clusterName == true || (type(self.clusterName) == string &&
          self.clusterName.matches('^[A-Za-z_][A-Za-z0-9_]*$'))
        mirrors: clickhouse.validateClusterName
        message: >-
          The chart checks `clusterName` in every mode, single-node included, where the field is hidden: set
          it in YAML mode to a bare identifier such as `my_cluster` (letters, digits and underscores, not
          starting with a digit).
      - rule: "!has(self.gvc)"
        mirrors: clickhouse.validateNoLegacyGvc
        paths: [locations]
        message: >-
          The `gvc` key was removed in 3.0.0: the chart deploys into the GVC you install into, and
          `gvc.locations` moved to Locations. Remove `gvc` from the values.

  - id: credentials
    title: Credentials
    description: The secret with the password of the built-in `default` user and the name of the database to create.
    fields:
      - type: note
        severity: warning
        text: >-
          The credentials secret must exist **before** you install. If it is missing, the deployment waits
          silently and `cpln logs` shows nothing; `cpln workload get-deployments
          RELEASE_NAME-clickhouse-server --gvc GVC_NAME -o yaml` shows why under `status.versions[].message`.
          Creating the secret repairs the deployment in about 5.5 to 10.5 minutes, or force a redeployment
          to skip the wait.
        textExpression: >-
          'The credentials secret must exist **before** you install. If it is missing, the deployment waits silently and `cpln logs` shows nothing; `cpln workload get-deployments ' +
          context.releaseName + '-clickhouse-server --gvc ' + (context.gvc == null ? 'GVC_NAME' : context.gvc) +
          ' -o yaml` shows why under `status.versions[].message`. Creating the secret repairs the deployment in about 5.5 to 10.5 minutes, or force a redeployment to skip the wait.'
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '2.6.0') < 0
        text: >-
          Versions before 2.6.0 shipped a default database password published in the template repository
          (`mypw` in 1.0.0, `mypassword` from 2.0.0). Put a new password in the new release's credentials
          secret; do not reuse the old one.
      - path: database.credentialsSecretName
        type: ref
        label: Credentials secret
        required: true
        description: >-
          A dictionary secret with the keys `password` and `database`. There is no `username` key: ClickHouse
          uses its built-in `default` user.
        help: >-
          Secret names are org-wide, so give each release its own. To rotate the password, update the
          secret's `password`, run `cpln workload force-redeployment RELEASE_NAME-clickhouse-server --gvc
          GVC_NAME`, then update your clients: the server writes the password into `users.xml` at every start,
          and updating a secret does not restart the workload by itself. `ALTER USER` cannot change it, because
          `default` is defined in `users.xml`. Keep `database` unchanged: the server
          creates that database at start when it does not exist. The startup script puts `database` unquoted
          into SQL, so use a bare identifier such as `mydatabase`, and writes the password unescaped into the
          XML configuration, so keep `<` and `&` out of it.
        docs: "#prerequisites"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [password, database]
          create:
            suggestName: "context.releaseName + '-clickhouse-credentials'"
        rules:
          - rule: oldSelf == null || self.database.credentialsSecretName == oldSelf.database.credentialsSecretName
            severity: info
            message: >-
              The servers read the password from the new secret at their next start, so clients need its
              password from then on. A different `database` entry creates another database next to the
              existing one.
    rules:
      - rule: "!has(self.database.password) && !has(self.database.name)"
        mirrors: clickhouse.validateCredentials
        paths: [database.credentialsSecretName]
        message: >-
          `database.password` and `database.name` were removed in 2.6.0. Put them in the credentials secret as
          `password` and `database`, and remove them from the values.

  - id: storage
    title: Object storage
    description: Where ClickHouse keeps its table data; the server volume holds its metadata.
    sections:
      - fields:
          - type: note
            text: >-
              Give each release its own bucket or container: the chart writes to a fixed path in it, so two
              releases on one bucket would share a data path. Keep the locations and the bucket in the same cloud
              provider and region family: cross-region traffic to object storage is billed on every query
              that misses the local cache.
          - path: provider
            type: enum
            label: Provider
            widget: cards
            required: true
            immutable: >-
              Switch object storage providers with a fresh install: the table data stays in the old storage,
              and the release's identity keeps a cloud binding once it has one.
            options:
              - value: aws
                label: AWS S3
                description: Keyless, through a cloud account and an AWS IAM policy.
              - value: gcp
                label: Google Cloud Storage
                description: Through the S3-compatible interface, with an HMAC key pair in a secret.
              - value: azure
                label: Azure Blob Storage
                description: With the storage account access key in a secret.
              - value: hetzner
                label: Hetzner Object Storage
                description: S3-compatible, with an access key pair in a secret.
            rules:
              - rule: self.provider in ['aws', 'gcp', 'azure', 'hetzner']
                mirrors: clickhouse.validateStorage
                message: The provider must be `aws`, `gcp`, `azure` or `hetzner`.
              # validateCredentials refuses azure.accountKey whatever the provider is.
              - rule: "!has(self.azure.accountKey)"
                mirrors: clickhouse.validateCredentials
                message: >-
                  `azure.accountKey` was removed in 2.8.0, and the chart refuses it with any provider. Put the
                  key in the Azure account key secret as `accountKey`, and remove `azure.accountKey` from the
                  values.
      - id: aws
        title: AWS S3
        when: self.provider == 'aws'
        description: The workload identity reaches the bucket through the cloud account and the AWS IAM policy.
        docs: "#aws-s3"
        fields:
          - path: aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            docs: "/guides/create-cloud-account"
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: aws.policyName
            type: string
            label: AWS IAM policy
            required: true
            example: true
            description: >-
              The name of the AWS IAM policy you created for the bucket (an AWS object, not a Control Plane
              policy).
            help: >-
              Allow `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject`, `s3:ListBucket`, `s3:GetObjectVersion`,
              `s3:DeleteObjectVersion`, `s3:GetBucketLocation`, `s3:AbortMultipartUpload`,
              `s3:ListBucketMultipartUploads` and `s3:ListMultipartUploadParts` on `arn:aws:s3:::BUCKET` and
              `arn:aws:s3:::BUCKET/*`. A policy written from the README of a version before 2.6.1 lacks the
              last four, so add them: versions up to 2.6.0 also attached `aws::ReadOnlyAccess`, and 3.0.0 does
              not.
            pattern: '^[\w+=,.@-]{1,128}$'
            patternMessage: Use up to 128 letters, digits and the characters + = , . @ _ -.
        rules:
          - rule: oldSelf == null || oldSelf.provider != 'aws' || self.aws.bucket == oldSelf.aws.bucket
            severity: info
            paths: [aws.bucket]
            message: >-
              The table data stays in the installed bucket, and the volume holds metadata that points
              there; another bucket does not move the data.
          - rule: oldSelf == null || oldSelf.provider != 'aws' || self.aws.region == oldSelf.aws.region
            severity: info
            paths: [aws.region]
            message: >-
              The bucket and its table data stay in their installed region, and the volume holds metadata
              that points there; another region does not move them.
      - id: gcp
        title: Google Cloud Storage
        when: self.provider == 'gcp'
        description: >-
          ClickHouse reaches GCS through its S3-compatible interface with an interoperability HMAC key; no cloud
          account is needed.
        docs: "#gcs"
        fields:
          - type: note
            severity: warning
            text: The HMAC key secret must exist **before** you install.
          - path: gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: gcp.credentialsSecretName
            type: ref
            label: HMAC key secret
            required: true
            description: >-
              A dictionary secret with the keys `accessKeyId` and `secretAccessKey`: the HMAC key from the
              bucket project's Interoperability settings, for a service account with Storage Object Admin.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKeyId, secretAccessKey]
              create:
                suggestName: "context.releaseName + '-clickhouse-gcs-credentials'"
        rules:
          - rule: "!has(self.gcp.accessKeyId) && !has(self.gcp.secretAccessKey)"
            mirrors: clickhouse.validateStorageCreds
            paths: [gcp.credentialsSecretName]
            message: >-
              `gcp.accessKeyId` and `gcp.secretAccessKey` were removed in 2.7.0. Put them in the HMAC key secret
              as `accessKeyId` and `secretAccessKey`, and remove them from the values.
          - rule: oldSelf == null || oldSelf.provider != 'gcp' || self.gcp.bucket == oldSelf.gcp.bucket
            severity: info
            paths: [gcp.bucket]
            message: >-
              The table data stays in the installed bucket, and the volume holds metadata that points
              there; another bucket does not move the data.
      - id: azure
        title: Azure Blob Storage
        when: self.provider == 'azure'
        description: ClickHouse authenticates with a storage account access key; no cloud account is needed.
        docs: "#azure-blob-storage"
        fields:
          - type: note
            severity: warning
            text: The account key secret must exist **before** you install.
          - path: azure.storageAccount
            type: string
            label: Storage account
            required: true
            example: true
            pattern: '^[a-z0-9]{3,24}$'
            patternMessage: Use 3 to 24 lowercase letters and digits.
          - path: azure.container
            type: string
            label: Container
            required: true
            description: A private Blob Storage container in the storage account.
            pattern: '^[a-z0-9](?!.*--)[a-z0-9-]{1,61}[a-z0-9]$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits and single hyphens, starting and ending with a letter or
              digit.
            rules:
              # README: Migrating from 2.x, step 2 (no prefix knob; releases on one bucket share a data path).
              - rule: self.azure.container != 'clickhouse-data'
                severity: info
                messageExpression: >-
                  'The chart has no path prefix, so two releases on one storage account and container share a
                  data path. Give each release its own container, for example ' + context.releaseName +
                  '-clickhouse-data.'
                message: >-
                  The chart has no path prefix, so two releases on one storage account and container share a
                  data path. Give each release its own container.
          - path: azure.credentialsSecretName
            type: ref
            label: Account key secret
            required: true
            description: A dictionary secret with the key `accountKey`, one of the storage account's access keys.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accountKey]
              create:
                suggestName: "context.releaseName + '-clickhouse-azure-credentials'"
        rules:
          - rule: >-
              oldSelf == null || oldSelf.provider != 'azure' ||
              self.azure.storageAccount == oldSelf.azure.storageAccount
            severity: info
            paths: [azure.storageAccount]
            message: >-
              The table data stays in the installed storage account, and the volume holds metadata that
              points there; another storage account does not move the data.
          - rule: oldSelf == null || oldSelf.provider != 'azure' || self.azure.container == oldSelf.azure.container
            severity: info
            paths: [azure.container]
            message: >-
              The table data stays in the installed container, and the volume holds metadata that points
              there; another container does not move the data.
      - id: hetzner
        title: Hetzner Object Storage
        when: self.provider == 'hetzner'
        description: S3-compatible storage with an access key pair; no cloud account is needed.
        docs: "#hetzner-object-storage"
        fields:
          - type: note
            severity: warning
            text: The access key secret must exist **before** you install.
          - path: hetzner.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: hetzner.region
            type: enum
            label: Region
            widget: segmented
            required: true
            options:
              - { value: nbg1, label: Nuremberg (nbg1) }
              - { value: hel1, label: Helsinki (hel1) }
              - { value: fsn1, label: Falkenstein (fsn1) }
          - path: hetzner.credentialsSecretName
            type: ref
            label: Access key secret
            required: true
            description: >-
              A dictionary secret with the keys `accessKeyId` and `secretAccessKey`, generated under Security,
              S3 Credentials in the Hetzner Cloud console.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKeyId, secretAccessKey]
              create:
                suggestName: "context.releaseName + '-clickhouse-hetzner-credentials'"
        rules:
          - rule: "!has(self.hetzner.accessKeyId) && !has(self.hetzner.secretAccessKey)"
            mirrors: clickhouse.validateStorageCreds
            paths: [hetzner.credentialsSecretName]
            message: >-
              `hetzner.accessKeyId` and `hetzner.secretAccessKey` were removed in 2.7.0. Put them in the access key
              secret as `accessKeyId` and `secretAccessKey`, and remove them from the values.
          - rule: oldSelf == null || oldSelf.provider != 'hetzner' || self.hetzner.bucket == oldSelf.hetzner.bucket
            severity: info
            paths: [hetzner.bucket]
            message: >-
              The table data stays in the installed bucket, and the volume holds metadata that points
              there; another bucket does not move the data.
          - rule: oldSelf == null || oldSelf.provider != 'hetzner' || self.hetzner.region == oldSelf.hetzner.region
            severity: info
            paths: [hetzner.region]
            message: >-
              The bucket and its table data stay in their installed region, and the volume holds metadata
              that points there; another region does not move them.

  - id: server
    title: Server
    description: The ClickHouse server's image, compute, volume and who can connect to it.
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts every server replica in every location at once: nothing serialises a
              rolling restart of a stateful workload. A three-shard cluster was measured at about 83 seconds
              of total unavailability, so plan the upgrade as a query interruption.
          - path: server.image
            type: string
            format: image
            label: Server image
            required: true
            # The chart writes the image unquoted (workload-server.yaml:20); `format: image` refuses every value YAML
            # would read as another type and an uppercase repository path, so no pattern of its own (guide 17.3.1).
          - path: server.resources
            type: resources
            label: Server resources
            required: true
            description: Per server replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: volumeset.server.capacity
            type: integer
            label: Server volume capacity
            unit: GiB
            min: 10
            required: true
            description: >-
              Holds each replica's metadata and the object storage disk metadata; table data lives in object
              storage.
            docs: "#volumes"
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            rules:
              - rule: oldSelf == null || self.volumeset.server.capacity >= oldSelf.volumeset.server.capacity
                message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - id: server-access
        title: Who can connect
        description: Firewall changes take up to about five minutes to propagate.
        fields:
          - type: note
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '3.0.0') < 0 && self.server.internalAccess.type == 'workload-list'
            text: >-
              2.x ignored the workload list, so Specific workloads blocked all internal traffic. 3.0.0 applies
              it: list your client workloads below.
          - path: server.internalAccess.type
            type: enum
            label: Who can connect to the server
            widget: cards
            required: true
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below; the chart adds this release's own workloads itself.
              - value: none
                label: None
                description: No workload can connect.
          # Shown with every type: workload-server.yaml:159-163 writes a non-empty list into the firewall whatever
          # the type, and the platform checks each entry also with Same org and None (guide 6.8).
          - path: server.internalAccess.workloads
            type: list
            label: Server client workloads
            widget: tags
            description: >-
              Client workloads allowed to connect, for example from another GVC. List only your clients. The
              platform applies the list with Same GVC and Specific workloads.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.server.internalAccess.type == 'same-gvc'
            rules:
              - when: self.server.internalAccess.type == 'workload-list'
                rule: size(self.server.internalAccess.workloads) > 0
                severity: warning
                message: >-
                  List the client workloads that may connect. With an empty list only this release's own
                  workloads can reach the server.
              - when: self.server.internalAccess.type == 'same-gvc' && context.gvc != null
                rule: "!self.server.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
                severity: info
                messageExpression: >-
                  'Same GVC already allows every workload in this GVC: ' +
                  self.server.internalAccess.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
                  ' can be removed from the list.'
                message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
              - when: self.server.internalAccess.type == 'same-org'
                rule: size(self.server.internalAccess.workloads) == 0
                severity: info
                message: >-
                  Same org already lets every workload of the org connect to the server, so the workloads listed for
                  the server add nothing.
              - when: self.server.internalAccess.type == 'none'
                rule: size(self.server.internalAccess.workloads) == 0
                severity: warning
                message: >-
                  The chart still writes the workloads listed for the server into its firewall, where the platform
                  checks every entry, but "None" lets none of them connect. Remove them.
        rules:
          # The internal firewall also governs the release's own traffic (workload-server.yaml comment).
          - when: "!(size(self.locations) == 1 && self.locations[0].replicas == 1)"
            rule: self.server.internalAccess.type != 'none'
            paths: [server.internalAccess.type]
            message: >-
              None also blocks the server replicas from each other: in cluster modes they replicate and run
              distributed queries through the internal firewall (ports 9000 and 9009). Choose another option.

  - id: keeper
    title: Keeper
    when: "!(size(self.locations) == 1 && self.locations[0].replicas == 1)"
    description: >-
      ClickHouse Keeper, the Raft coordination service of the cluster modes, with up to three members in the
      first three locations.
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts the Keeper members too, and changing a Keeper setting costs about 60
              seconds of coordination outage. Plan it as a query interruption.
          - path: keeper.image
            type: string
            format: image
            label: Keeper image
            required: true
            # Written unquoted too (workload-keeper.yaml:11); `format: image` covers it, as for the server image.
          - path: keeper.resources
            type: resources
            label: Keeper resources
            required: true
            description: Per Keeper member.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: volumeset.keeper.capacity
            type: integer
            label: Keeper volume capacity
            unit: GiB
            min: 10
            required: true
            description: Holds each member's Raft log and snapshots.
            docs: "#volumes"
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            rules:
              # A release installed as a single node has no Keeper volume set yet.
              - rule: >-
                  oldSelf == null || (size(oldSelf.locations) == 1 && oldSelf.locations[0].replicas == 1) ||
                  self.volumeset.keeper.capacity >= oldSelf.volumeset.keeper.capacity
                message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - id: keeper-access
        title: Who can connect
        description: Firewall changes take up to about five minutes to propagate.
        fields:
          - type: note
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '3.0.0') < 0 && self.keeper.internalAccess.type == 'workload-list'
            text: >-
              2.x ignored the workload list, so Specific workloads blocked all internal traffic. 3.0.0 applies
              it: list your client workloads below.
          - path: keeper.internalAccess.type
            type: enum
            label: Who can connect to Keeper
            widget: cards
            required: true
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below; the chart adds this release's own workloads itself.
              - value: none
                label: None
                description: No workload can connect.
            rules:
              - rule: self.keeper.internalAccess.type != 'none'
                message: >-
                  None also blocks the ClickHouse servers and the other Keeper members, which reach Keeper
                  through the internal firewall (ports 9181 and 9234), so the cluster cannot coordinate. Choose
                  another option.
          # Shown with every type: workload-keeper.yaml:112-116 writes a non-empty list into the firewall whatever
          # the type, and the platform checks each entry also with Same org and None (guide 6.8).
          - path: keeper.internalAccess.workloads
            type: list
            label: Keeper client workloads
            widget: tags
            description: >-
              Client workloads allowed to connect, for example from another GVC. List only your clients. The
              platform applies the list with Same GVC and Specific workloads.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.keeper.internalAccess.type == 'same-gvc'
            rules:
              # The chart adds this release's server and Keeper to the list (workload-keeper.yaml:99-111), which is
              # all the cluster needs, so an empty client list is a working lock-down of Keeper.
              - when: self.keeper.internalAccess.type == 'workload-list'
                rule: size(self.keeper.internalAccess.workloads) > 0
                severity: info
                message: >-
                  With an empty list only this release's own server and Keeper workloads can reach Keeper, which
                  is all the cluster needs. List other client workloads only if they use Keeper.
              - when: self.keeper.internalAccess.type == 'same-gvc' && context.gvc != null
                rule: "!self.keeper.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
                severity: info
                messageExpression: >-
                  'Same GVC already allows every workload in this GVC: ' +
                  self.keeper.internalAccess.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
                  ' can be removed from the list.'
                message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
              - when: self.keeper.internalAccess.type == 'same-org'
                rule: size(self.keeper.internalAccess.workloads) == 0
                severity: info
                message: >-
                  Same org already lets every workload of the org connect to Keeper, so the workloads listed for
                  Keeper add nothing.
              - when: self.keeper.internalAccess.type == 'none'
                rule: size(self.keeper.internalAccess.workloads) == 0
                severity: warning
                message: >-
                  The chart still writes the workloads listed for Keeper into its firewall, where the platform
                  checks every entry, but "None" lets none of them connect. Remove them.

rules:
  - rule: context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '3.0.0') >= 0
    message: >-
      Do not upgrade a 1.x or 2.x release to 3.0.0: the upgrade deletes the GVC that the old chart created, with
      every workload, volume set and identity inside it. Install 3.0.0 as a new release with a new name into
      an existing GVC other than the one the old release created or named in `gvc.name` (uninstalling the old
      release deletes that GVC), with its own bucket, reload your data, then uninstall the old release
      against the GVC you originally installed it into.

migrations:
  # 2.x → 3.0.0: the chart no longer creates a GVC.
  - fromVersions: "<3.0.0"
    from: gvc.name
    note: >-
      3.0.0 deploys into the GVC you install into and creates none of its own; a new 3.0.0 release picks its
      GVC on the Release step.
  - fromVersions: "<3.0.0"
    from: gvc.locations
    to: locations
    note: Every location listed must already be in the GVC you install into.
  - { fromVersions: "<3.0.0", from: server.internal_access.type, to: server.internalAccess.type }
  - fromVersions: "<3.0.0"
    from: server.internal_access.workloads
    to: server.internalAccess.workloads
    note: The list is applied from 3.0.0 (2.x ignored it); list only your clients, the chart adds its own workloads.
  - { fromVersions: "<3.0.0", from: keeper.internal_access.type, to: keeper.internalAccess.type }
  - fromVersions: "<3.0.0"
    from: keeper.internal_access.workloads
    to: keeper.internalAccess.workloads
    note: The list is applied from 3.0.0 (2.x ignored it); list only your clients, the chart adds its own workloads.
  # 2.7.0 and 2.8.0 moved the object storage keys into secrets.
  - fromVersions: ">=2.5.0 <2.8.0"
    from: azure.accountKey
    note: The Azure account key moved into a dictionary secret with the key accountKey; choose it under Object storage.
  - fromVersions: ">=2.3.0 <2.7.0"
    from: gcp.accessKeyId
    note: The GCS HMAC key moved into a dictionary secret with the keys accessKeyId and secretAccessKey; choose it under Object storage.
  - fromVersions: ">=2.3.0 <2.7.0"
    from: gcp.secretAccessKey
    note: The GCS HMAC key moved into a dictionary secret with the keys accessKeyId and secretAccessKey; choose it under Object storage.
  - fromVersions: ">=2.5.0 <2.7.0"
    from: hetzner.accessKeyId
    note: The Hetzner key pair moved into a dictionary secret with the keys accessKeyId and secretAccessKey; choose it under Object storage.
  - fromVersions: ">=2.5.0 <2.7.0"
    from: hetzner.secretAccessKey
    note: The Hetzner key pair moved into a dictionary secret with the keys accessKeyId and secretAccessKey; choose it under Object storage.
  # 2.6.0 moved the database login into a secret.
  - fromVersions: "<2.6.0"
    from: database.password
    note: >-
      The password moved into a dictionary secret with the keys password and database; choose it under
      Credentials. Versions before 2.6.0 shipped a published default password: choose a new one.
  - fromVersions: "<2.6.0"
    from: database.name
    note: The database name moved into the credentials secret as the key database; choose the secret under Credentials.
  # 2.0.0 to 2.2.0 chose the storage with two switches and nested keys.
  - fromVersions: ">=2.0.0 <2.3.0"
    to: provider
    valueExpr: "self.gcp.enabled ? 'gcp' : 'aws'"
  - fromVersions: ">=2.0.0 <2.3.0"
    from: aws.enabled
    note: 2.3.0 replaced aws.enabled and gcp.enabled with Provider; the release's choice is carried there.
  - fromVersions: ">=2.0.0 <2.3.0"
    from: gcp.enabled
    note: 2.3.0 replaced aws.enabled and gcp.enabled with Provider; the release's choice is carried there.
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.bucket, to: aws.bucket }
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.region, to: aws.region }
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.cloudAccountName, to: aws.cloudAccountName }
  - { fromVersions: ">=2.0.0 <2.3.0", from: aws.s3.policyName, to: aws.policyName }
  - { fromVersions: ">=2.0.0 <2.3.0", from: gcp.gcs.bucket, to: gcp.bucket }
  - fromVersions: ">=2.0.0 <2.3.0"
    from: gcp.gcs.accessKeyId
    note: The GCS HMAC key moved into a dictionary secret with the keys accessKeyId and secretAccessKey; choose it under Object storage.
  - fromVersions: ">=2.0.0 <2.3.0"
    from: gcp.gcs.secretAccessKey
    note: The GCS HMAC key moved into a dictionary secret with the keys accessKeyId and secretAccessKey; choose it under Object storage.
