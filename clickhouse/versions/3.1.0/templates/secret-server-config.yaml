{{- if include "clickhouse.isSingleNode" . }}
---
kind: secret
name: {{ include "clickhouse.secretServer.name" . }}
description: Clickhouse server startup script (single-node)
tags: {{- include "clickhouse.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    LOG_PREFIX="[clickhouse]"

    # --- Runtime variables ---
    LOCATION=$(basename "${CPLN_LOCATION:-}")

    # --- Directories ---
    CONFIG_DIR="/etc/clickhouse-server"
    LOG_DIR="/var/log/clickhouse-server"
    DATA_DIR="/var/lib/clickhouse"

    # Freshness marker, read BEFORE this script creates anything.
    # clickhouse-server creates $DATA_DIR/metadata on its first successful start
    # and it persists on the volumeset across a clean shutdown -- unlike
    # $DATA_DIR/status, which is removed on exit.
    if [ -d "${DATA_DIR}/metadata" ]; then FRESH="false"; else FRESH="true"; fi

    # --- Guard: never run in a location this release did not declare ---
    # defaultOptions.minScale/maxScale are 0, so the platform should never place
    # a replica in an undeclared GVC location at all. This is the last line of
    # defence if it does: a node started there has its own empty volume, answers
    # on the same service name, and is indistinguishable from the real one.
    # Values-only, so it never depends on the API and can never be skipped.
    CONFIGURED_LOC_NAMES=""
    for _pair in $(printf '%s' "${LOCATIONS_STR:-}" | tr ',' ' '); do
        CONFIGURED_LOC_NAMES="${CONFIGURED_LOC_NAMES}${_pair%%:*} "
    done
    case " ${CONFIGURED_LOC_NAMES} " in
      *" ${LOCATION} "*) : ;;
      *) echo "[clickhouse] FATAL: this replica is running in location '${LOCATION}', which is not in the configured location list (${LOCATIONS_STR:-})." >&2
         echo "[clickhouse] Refusing to start a second, unrelated ClickHouse under the same service name. Remove this location from the GVC, or add it to 'locations' in your values." >&2
         exit 1 ;;
    esac


    {{- include "clickhouse.gvcLocationGuard" . | nindent 4 }}

    # --- Check B: every declared location must exist in the GVC ---
    # Asymmetric on purpose: hard-fail only on a FRESH data directory. An
    # already-initialised node's own data is still correct, and hard-failing it
    # would turn "the GVC shrank" into "the database is down".
    if [ -n "${MISSING}" ]; then
        if [ "${FRESH}" = "true" ]; then
            echo "[clickhouse] FATAL: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
            echo "[clickhouse] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
            echo "[clickhouse] Refusing to initialise. Add the missing location(s) to the GVC, or remove them from 'locations' in your values." >&2
            exit 1
        else
            echo "[clickhouse] WARNING: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
            echo "[clickhouse] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
            echo "[clickhouse] This node is already initialised, so it keeps serving." >&2
        fi
    fi

    mkdir -p "$CONFIG_DIR" "$LOG_DIR" "$DATA_DIR"

    # --- Generate config.xml ---
    cat > "$CONFIG_DIR/config.xml" <<EOF
    <clickhouse>

        <!-- Users config -->
        <users_config>/etc/clickhouse-server/users.xml</users_config>

        <logger>
            <level>information</level>
        </logger>

        <!--
        Isolate temporary files from main data.
        Strongly recommended for containerized deployments.
        -->
        <tmp_path>/var/lib/clickhouse-tmp</tmp_path>

        <!--
        Prevent large merge operations from causing disk or memory spikes.
        These conservative defaults favor stability over raw throughput.
        -->
        <max_bytes_to_merge_at_max_space_in_pool>1073741824</max_bytes_to_merge_at_max_space_in_pool> <!-- 1 GiB -->
        <max_bytes_to_merge_at_min_space_in_pool>536870912</max_bytes_to_merge_at_min_space_in_pool>  <!-- 512 MiB -->

        <!--
        Cap total temporary data on disk to prevent runaway spill.
        Set to 0 (unlimited) only for controlled environments.
        -->
        <max_temporary_data_on_disk_size>21474836480</max_temporary_data_on_disk_size> <!-- 20 GiB -->

        <!-- Ports -->
        <tcp_port>9000</tcp_port>
        <http_port>8123</http_port>

        <!-- Listen on all interfaces -->
        <listen_host>0.0.0.0</listen_host>
        <listen_host>::</listen_host>

        <!-- Display name -->
        <display_name>clickhouse-standalone</display_name>

    </clickhouse>
    EOF

    echo "Generated ClickHouse config at $CONFIG_DIR/config.xml"

    # --- Generate users.xml dynamically ---
    cat > "$CONFIG_DIR/users.xml" <<EOF
    <clickhouse>
        <users>
            <default>
                <password>${CLICKHOUSE_PASSWORD}</password>
                <profile>default</profile>
                <quota>default</quota>
            </default>
        </users>

        <profiles>
            <default>
                <max_memory_usage>10000000000</max_memory_usage>
                <use_uncompressed_cache>0</use_uncompressed_cache>
                <load_balancing>in_order</load_balancing>
                <log_queries>1</log_queries>
            </default>
        </profiles>
    </clickhouse>
    EOF

    echo "Generated ClickHouse users.xml at $CONFIG_DIR/users.xml"

{{- if eq .Values.provider "aws" }}
    mkdir -p /var/lib/clickhouse/disks/s3_disk_metadata
    mkdir -p /var/lib/clickhouse_cache/s3
    echo "1" > /var/lib/clickhouse/disks/s3_disk_metadata/format_version.txt
    echo "Created paths for S3"
{{- end }}
{{- if eq .Values.provider "azure" }}
    mkdir -p /var/lib/clickhouse/disks/azure_disk_metadata
    mkdir -p /var/lib/clickhouse_cache/azure
    echo "1" > /var/lib/clickhouse/disks/azure_disk_metadata/format_version.txt
    echo "Created paths for Azure"
{{- end }}
{{- if eq .Values.provider "hetzner" }}
    mkdir -p /var/lib/clickhouse/disks/hetzner_disk_metadata
    mkdir -p /var/lib/clickhouse_cache/hetzner
    echo "1" > /var/lib/clickhouse/disks/hetzner_disk_metadata/format_version.txt
    echo "Created paths for Hetzner"
{{- end }}

    # --- Start ClickHouse server in the background ---
    clickhouse-server --config-file="$CONFIG_DIR/config.xml" &
    CH_PID=$!
    trap 'kill -TERM $CH_PID; wait $CH_PID' TERM INT

    # Wait for server to accept connections
    echo "Waiting for ClickHouse to accept connections..."
    until clickhouse-client --user default --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1" &>/dev/null; do
        sleep 1
    done

    echo "ClickHouse is ready!"

    # --- Create database ---
    echo "Creating database ${CLICKHOUSE_DATABASE}..."
    clickhouse-client --user default --password "$CLICKHOUSE_PASSWORD" \
        --query "CREATE DATABASE IF NOT EXISTS ${CLICKHOUSE_DATABASE} ENGINE = Atomic;"

    echo "Database ${CLICKHOUSE_DATABASE} created."

    # Bring ClickHouse server to foreground
    wait $CH_PID
{{- else }}
---
kind: secret
name: {{ include "clickhouse.secretServer.name" . }}
description: Clickhouse server startup script
tags: {{- include "clickhouse.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    LOG_PREFIX="[clickhouse]"

    # --- Runtime variables ---
    # GVC comes from the runtime built-in (set by the shared guard below), not
    # from Helm, so it cannot drift from the GVC this workload actually runs in.
    LOCATION=$(basename "${CPLN_LOCATION:-}")
    HOSTNAME=${HOSTNAME:-}
    WORKLOAD_NAME="{{ include "clickhouse.server.name" . }}"
    KEEPER_WORKLOAD_NAME="{{ include "clickhouse.keeper.name" . }}"
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')

    # --- Directories ---
    CONFIG_DIR="/etc/clickhouse-server"
    LOG_DIR="/var/log/clickhouse-server"
    DATA_DIR="/var/lib/clickhouse"

    # Freshness marker, read BEFORE this script creates anything.
    # clickhouse-server creates $DATA_DIR/metadata on its first successful start
    # and it persists on the volumeset across a clean shutdown -- unlike
    # $DATA_DIR/status, which is removed on exit.
    if [ -d "${DATA_DIR}/metadata" ]; then FRESH="false"; else FRESH="true"; fi

    # --- Parse locations and replicas ---
    IFS=',' read -r -a LOCATIONS <<< "${LOCATIONS_STR:-}"

    # --- Compute SHARD_INDEX for this node (per location, not per replica) ---
    # The sentinel is 0, and 0 is fatal. 2.8.0 started at 1 and let a location
    # that never matched fall out of the loop at len(locations)+1 -- a shard
    # number present in no <remote_servers> entry, written into <macros><shard>
    # and used for every ReplicatedMergeTree path. This runs BEFORE config.xml is
    # written and before clickhouse-server launches, so a node in an undeclared
    # location can never register a replicated path under a phantom shard.
    SHARD_INDEX=0
    _i=1
    for LOC_PAIR in "${LOCATIONS[@]}"; do
        if [[ "${LOC_PAIR%%:*}" == "$LOCATION" ]]; then
            SHARD_INDEX=$_i
            break
        fi
        _i=$((_i+1))
    done
    if [[ "$SHARD_INDEX" -eq 0 ]]; then
        echo "[clickhouse] FATAL: this replica is running in location '${LOCATION}', which is not in the configured location list (${LOCATIONS_STR:-})." >&2
        echo "[clickhouse] Refusing to start: it would take a shard number that appears in no <remote_servers> entry, register ReplicatedMergeTree paths under that phantom shard, and be invisible to every distributed query." >&2
        echo "[clickhouse] Remove this location from the GVC, or add it to 'locations' in your values." >&2
        exit 1
    fi


    {{- include "clickhouse.gvcLocationGuard" . | nindent 4 }}

    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"

    {{- include "clickhouse.keeperQuorumArithmetic" . | nindent 4 }}

    # --- Check C-prime: Keeper quorum must be arithmetically possible ---
    # Fresh only, and deliberately BEFORE check B: when a location is missing AND
    # that costs Keeper its majority, both checks are true, and 'quorum is
    # unreachable' is the more specific and more actionable of the two. It also
    # turns the bounded Keeper wait below into an immediate, named failure.
    # The degraded warning below is NOT fresh-gated -- an initialised node that
    # has lost fault tolerance should say so on every boot.
    if [ "${FRESH}" = "true" ] && [ "$KEEPER_QUORUM_OK" = "false" ]; then
        echo "[clickhouse] FATAL: Keeper quorum is unreachable. ${KEEPER_PRESENT} of ${KEEPER_TOTAL} configured Keeper locations (${KEEPER_MEMBER_LOCS% }) exist in GVC '${GVC}' (which has: ${GVC_LOCS% })." >&2
        echo "[clickhouse] A Raft group of ${KEEPER_TOTAL} needs floor(${KEEPER_TOTAL}/2)+1 members. Refusing to initialise rather than waiting for an election that can never complete." >&2
        exit 1
    fi
    if [ "$KEEPER_QUORUM_OK" = "true" ] && [ "$KEEPER_PRESENT" -lt "$KEEPER_TOTAL" ]; then
        echo "[clickhouse] WARNING: Keeper is degraded -- only ${KEEPER_PRESENT} of ${KEEPER_TOTAL} configured Keeper locations (${KEEPER_MEMBER_LOCS% }) exist in GVC '${GVC}'. Quorum is still possible, but there is no fault tolerance left." >&2
    fi

    # --- Check B: every declared location must exist in the GVC ---
    # Asymmetric on purpose: hard-fail only on a FRESH data directory. A fresh
    # node is being asked to build a cluster whose shards can never exist. An
    # already-initialised node's own data and <macros><shard> are still correct;
    # the only damage is that some OTHER shard is unreachable, and hard-failing
    # would turn "one shard down" into "all shards down".
    if [ -n "${MISSING}" ]; then
        if [ "${FRESH}" = "true" ]; then
            echo "[clickhouse] FATAL: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
            echo "[clickhouse] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
            echo "[clickhouse] Refusing to initialise a cluster whose declared shards can never exist. Add the missing location(s) to the GVC, or remove them from 'locations' in your values." >&2
            exit 1
        else
            echo "[clickhouse] WARNING: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
            echo "[clickhouse] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
            echo "[clickhouse] This node is already initialised, so it keeps serving its own shard -- but shards in the missing location(s) will never appear." >&2
        fi
    fi

    echo "[clickhouse] Starting ClickHouse server for replica ${SELF_FQDN} (shard ${SHARD_INDEX})"

    mkdir -p "$CONFIG_DIR" "$LOG_DIR" "$DATA_DIR"

    # --- Generate config.xml ---
    cat > "$CONFIG_DIR/config.xml" <<EOF
    <clickhouse>

        <!-- Users config -->
        <users_config>/etc/clickhouse-server/users.xml</users_config>

        <logger>
            <level>information</level>
        </logger>

        <!--
        Isolate temporary files from main data.
        Strongly recommended for containerized and object-storage-backed deployments.
        -->
        <tmp_path>/var/lib/clickhouse-tmp</tmp_path>

        <!--
        Prevent large merge operations from causing disk or memory spikes.
        These conservative defaults favor stability over raw throughput.
        -->
        <max_bytes_to_merge_at_max_space_in_pool>1073741824</max_bytes_to_merge_at_max_space_in_pool> <!-- 1 GiB -->
        <max_bytes_to_merge_at_min_space_in_pool>536870912</max_bytes_to_merge_at_min_space_in_pool>  <!-- 512 MiB -->

        <!--
        Cap total temporary data on disk to prevent runaway spill.
        Set to 0 (unlimited) only for controlled environments.
        -->
        <max_temporary_data_on_disk_size>21474836480</max_temporary_data_on_disk_size> <!-- 20 GiB -->

        <!-- Ports -->
        <tcp_port>9000</tcp_port>
        <http_port>8123</http_port>
        <interserver_http_port>9009</interserver_http_port>
        <interserver_http_host>$SELF_FQDN</interserver_http_host>

        <!-- Listen on all interfaces -->
        <listen_host>0.0.0.0</listen_host>
        <listen_host>::</listen_host>

        <!-- Display name -->
        <display_name>$WORKLOAD_NAME node $REPLICA_INDEX</display_name>
        <distributed_ddl>
            <path>/clickhouse/task_queue/ddl</path>
            <profile>default</profile>
        </distributed_ddl>
        <!-- Remote servers / cluster -->
        <remote_servers>
            <{{ .Values.clusterName }}>
    EOF

    # --- Add shards and replicas ---
    for LOC_PAIR in "${LOCATIONS[@]}"; do
        LOC="${LOC_PAIR%%:*}"
        REPLICAS="${LOC_PAIR##*:}"
        {
            echo "            <shard>"
            echo "                <internal_replication>true</internal_replication>"
            for IDX in $(seq 0 $((REPLICAS-1))); do
                FQDN="replica-$IDX.${WORKLOAD_NAME}.${LOC}.${GVC}.cpln.local"
                echo "                <replica>"
                echo "                    <host>$FQDN</host>"
                echo "                    <port>9000</port>"
                echo "                    <user>default</user>"
                echo "                    <password>${CLICKHOUSE_PASSWORD}</password>"
                echo "                    <default_database>${CLICKHOUSE_DATABASE}</default_database>"
                echo "                </replica>"
            done
            echo "            </shard>"
        } >> "$CONFIG_DIR/config.xml"
    done

    # --- Close remote_servers ---
    {
        echo "        </{{ .Values.clusterName }}>"
        echo "    </remote_servers>"
    } >> "$CONFIG_DIR/config.xml"

    # --- Zookeeper nodes ---
    {
    echo "  <zookeeper>"
    for LOC_NAME in ${KEEPER_MEMBER_LOCS}; do   # replica-0 of the first 3 locations
        FQDN="replica-0.${KEEPER_WORKLOAD_NAME}.${LOC_NAME}.${GVC}.cpln.local"
        echo "    <node>"
        echo "      <host>$FQDN</host>"
        echo "      <port>9181</port>"
        echo "    </node>"
    done
    echo "  </zookeeper>"
    } >> "$CONFIG_DIR/config.xml"

    # --- Macros ---
    {
        echo "    <macros>"
        printf "        <shard>%d</shard>\n" "$SHARD_INDEX"
        printf "        <replica>%d</replica>\n" "$((REPLICA_INDEX + 1))"
        echo "    </macros>"
    } >> "$CONFIG_DIR/config.xml"

    # --- Add system logging for filesystem cache and query visibility ---
    cat >> "$CONFIG_DIR/config.xml" <<EOF

        <!-- System logs settings -->
        <system_logs>
            <filesystem_cache_log>
                <database>system</database>
                <table>filesystem_cache_log</table>
                <engine>Log</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </filesystem_cache_log>
        </system_logs>
    EOF

    # --- Close XML ---
    echo "</clickhouse>" >> "$CONFIG_DIR/config.xml"

    echo "Generated ClickHouse config at $CONFIG_DIR/config.xml"

    # --- Generate users.xml dynamically ---
    cat > "$CONFIG_DIR/users.xml" <<EOF
    <clickhouse>
        <users>
            <default>
                <password>${CLICKHOUSE_PASSWORD}</password>
                <profile>default</profile>
                <quota>default</quota>
            </default>
        </users>

        <profiles>
            <default>
                <max_memory_usage>10000000000</max_memory_usage>
                <use_uncompressed_cache>0</use_uncompressed_cache>
                <load_balancing>in_order</load_balancing>
                <log_queries>1</log_queries>
            </default>
        </profiles>
    </clickhouse>
    EOF

    echo "Generated ClickHouse users.xml at $CONFIG_DIR/users.xml"

{{- if eq .Values.provider "aws" }}
    mkdir -p /var/lib/clickhouse/disks/s3_disk_metadata
    mkdir -p /var/lib/clickhouse_cache/s3
    echo "1" > /var/lib/clickhouse/disks/s3_disk_metadata/format_version.txt
    echo "Created paths for S3"
{{- end }}
{{- if eq .Values.provider "azure" }}
    mkdir -p /var/lib/clickhouse/disks/azure_disk_metadata
    mkdir -p /var/lib/clickhouse_cache/azure
    echo "1" > /var/lib/clickhouse/disks/azure_disk_metadata/format_version.txt
    echo "Created paths for Azure"
{{- end }}
{{- if eq .Values.provider "hetzner" }}
    mkdir -p /var/lib/clickhouse/disks/hetzner_disk_metadata
    mkdir -p /var/lib/clickhouse_cache/hetzner
    echo "1" > /var/lib/clickhouse/disks/hetzner_disk_metadata/format_version.txt
    echo "Created paths for Hetzner"
{{- end }}

    # --- Force ClickHouse to resolve local FQDN as localhost ---
    LOCAL_FQDN="$SELF_FQDN"

    echo "Applying hostname mapping workaround..."
    echo "127.0.0.1   $LOCAL_FQDN" >> /etc/hosts

    echo "Hosts file updated:"
    cat /etc/hosts

    # --- Start ClickHouse server in the background ---
    clickhouse-server --config-file="$CONFIG_DIR/config.xml" &
    CH_PID=$!
    trap 'kill -TERM $CH_PID; wait $CH_PID' TERM INT

    # Wait for server to accept connections using default superuser
    echo "Waiting for ClickHouse to accept connections..."
    until clickhouse-client --user default --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1" &>/dev/null; do
        sleep 1
    done

    echo "ClickHouse is ready!"

    # --- Compute if this node is the bootstrap node for cluster-wide DB creation ---
    FIRST_LOC="{{ (index .Values.locations 0).name }}"
    FIRST_LOCATION="false"

    if [[ "$LOCATION" == "$FIRST_LOC" && "$REPLICA_INDEX" == "0" ]]; then
        FIRST_LOCATION="true"
    fi

    if [[ "$FIRST_LOCATION" == "true" ]]; then
        # Skip the Keeper wait entirely when the database is already there:
        # neither the wait nor the ON CLUSTER DDL is needed, and this is what
        # keeps an initialised bootstrap node from crash-looping through a
        # Keeper outage.
        DB_EXISTS=$(clickhouse-client --user default --password "$CLICKHOUSE_PASSWORD" \
            --query "SELECT count() FROM system.databases WHERE name = '${CLICKHOUSE_DATABASE}'" 2>/dev/null || echo "0")

        if [[ "$DB_EXISTS" != "0" ]]; then
            echo "[clickhouse] Database '${CLICKHOUSE_DATABASE}' already exists -- skipping the Keeper wait and the bootstrap DDL."
        else
            # --- Wait for Keeper quorum before creating the database ---
            # BOUNDED. 2.8.0 looped forever printing "Keeper not ready yet",
            # which turned a configuration error into a workload that looked
            # healthy and never created the database. 300s is ~3x the worst
            # legitimate Raft election in this chart (20-100s bounds).
            echo "[clickhouse] Waiting for Keeper quorum before bootstrapping the database..."
            SECONDS=0
            until clickhouse-client --user default --password "$CLICKHOUSE_PASSWORD" \
                    --query "SELECT count() FROM system.zookeeper WHERE path='/'" >/dev/null 2>&1; do
                if (( SECONDS >= 300 )); then
                    echo "[clickhouse] FATAL: Keeper quorum was not reachable within 300s." >&2
                    echo "[clickhouse] Configured Keeper members: ${KEEPER_MEMBER_LOCS% } (replica-0 of each)." >&2
                    echo "[clickhouse] GVC '${GVC}' locations: ${GVC_LOCS:-<could not be read>}." >&2
                    echo "[clickhouse] Database '${CLICKHOUSE_DATABASE}' was NOT created. Check that every Keeper location exists in the GVC and that its replica-0 is ready." >&2
                    kill -TERM "$CH_PID" 2>/dev/null || true
                    wait "$CH_PID" 2>/dev/null || true
                    exit 1
                fi
                echo "[clickhouse] Keeper not ready yet, waiting... (${SECONDS}s of 300s)"
                sleep 5
            done
            echo "[clickhouse] Keeper quorum detected!"

            echo "[clickhouse] Bootstrapping ClickHouse database across cluster (ON CLUSTER)..."
            clickhouse-client --user default --password "$CLICKHOUSE_PASSWORD" \
                --query "CREATE DATABASE IF NOT EXISTS ${CLICKHOUSE_DATABASE} ON CLUSTER {{ .Values.clusterName }} ENGINE = Atomic;"
        fi
    else
        echo "Skipping DB creation on this replica (not the bootstrap node)."
    fi

    # Bring ClickHouse server to foreground
    wait $CH_PID
{{- end }}
