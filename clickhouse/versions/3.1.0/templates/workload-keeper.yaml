{{- if not (include "clickhouse.isSingleNode" .) }}
kind: workload
name: {{ include "clickhouse.keeper.name" . }}
description: clickhouse keeper
tags: {{- include "clickhouse.tags" . | nindent 4 }}
spec:
  type: stateful
  containers:
    - name: keeper
      cpu: {{ .Values.keeper.resources.cpu | quote }}
      image: {{ .Values.keeper.image }}
      inheritEnv: false
      env:
      {{- include "clickhouse.locationsEnv" . | nindent 6 }}
      memory: {{ .Values.keeper.resources.memory | quote }}
      command: "/bin/bash"
      args:
        - "/scripts/keeper-startup.sh"
      ports:
        - number: 9181
          protocol: tcp
        - number: 9234
          protocol: tcp
      volumes:
        - path: /var/lib/clickhouse
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "clickhouse.volumeKeeper.name" . }}
        - path: /scripts/keeper-startup.sh
          recoveryPolicy: retain   # API backfill, declared so rendered == stored
          uri: cpln://secret/{{ include "clickhouse.secretKeeper.name" . }}
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "clickhouse.identity.name" . }}
  defaultOptions:
    autoscaling:
      keda: {}
      maxConcurrency: 0
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  {{- /*
    Keeper members are replica-0 of the FIRST THREE locations only. 2.8.0
    rendered a localOptions entry for every location and set `suspend: true`
    on index >= 3; with defaultOptions pinned to 0/0 that entry is unnecessary,
    and dropping it removes this chart's only use of localOptions[].suspend --
    a field that permanently breaks a workload's inbound reachability from
    other locations.
  */}}
  localOptions:
  {{- range $i, $loc := .Values.locations }}
  {{- if lt $i 3 }}
    - autoscaling:
        maxConcurrency: 0
        metric: disabled
        minScale: 1
        maxScale: 1
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      location: //location/{{ $loc.name }}
      suspend: false
      timeoutSeconds: 5
  {{- end }}
  {{- end }}
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.keeper.internalAccess.type }}
      {{- $wl := .Values.keeper.internalAccess.workloads | default (list) }}
      {{- if eq .Values.keeper.internalAccess.type "workload-list" }}
      {{- /*
        This list governs ALL inbound internal traffic, INCLUDING traffic between
        the workloads of THIS release: Keeper's Raft on 9234, the servers' calls
        to Keeper on 9181, and server-to-server replication and distributed
        queries on 9000/9009. A list naming only clients cuts the cluster off
        from itself -- measured 2026-08-27 by following the README: Raft denied
        (`rbac_access_denied_matched_policy[none] ... "10.0.84.230:9234"`),
        quorum lost, cross-shard queries failing with `Code: 279`, while
        get-deployments reported every replica `ready=true restarts=0`. Adding
        the release's own links restored `zk_synced_followers 2`.

        Both own links are included on both workloads rather than the minimum
        each strictly needs. The over-grant is one release's workloads reaching
        each other inside one GVC; the under-grant is a silently destroyed
        cluster, and getting the direction wrong is exactly how this shipped.
      */}}
      {{- $own := list (printf "//gvc/%s/workload/%s" .Values.global.cpln.gvc (include "clickhouse.server.name" .)) }}
      {{- if not (include "clickhouse.isSingleNode" .) }}
      {{- $own = append $own (printf "//gvc/%s/workload/%s" .Values.global.cpln.gvc (include "clickhouse.keeper.name" .)) }}
      {{- end }}
      inboundAllowWorkload:
        {{- range $own }}
        - {{ . }}
        {{- end }}
        {{- range $wl }}
        {{- if not (has . $own) }}
        - {{ . }}
        {{- end }}
        {{- end }}
      {{- else if $wl }}
      inboundAllowWorkload:
        {{- range $wl }}
        - {{ . }}
        {{- end }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: true
  supportDynamicTags: false
{{- end }}
