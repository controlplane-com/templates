# cockroach 2.0.0 — the default install: three nodes in one location (CockroachDB's replication factor is 3),
# PgBouncer in front, default sizes. Insecure mode, so no prerequisite secrets.
locations: [aws-us-east-1]
timeoutSeconds: 900

vars:
  nodes: "3"
  db_name: mydb

values:
  locations:
    - name: aws-us-east-1
      replicas: 3
