---
{{- /*
  Each CockroachDB node reads its own GVC at boot to confirm the GVC really has
  every location this release declares -- the platform does not validate
  localOptions locations, so a typo is otherwise accepted silently and the
  region it names simply never appears. Scoped to the ONE install GVC; never
  `target: all`, which would grant view on every GVC in the org.
*/}}
kind: policy
name: {{ include "cockroach.policy.gvc.name" . }}
description: CockroachDB GVC read policy
tags: {{- include "cockroach.tags" . | nindent 4 }}
bindings:
  - permissions:
      - view
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cockroach.identity.name" . }}
targetKind: gvc
targetLinks:
  - //gvc/{{ .Values.global.cpln.gvc }}
