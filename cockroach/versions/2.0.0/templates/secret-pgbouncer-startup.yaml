{{- if .Values.pgbouncer.enabled }}
---
kind: secret
name: {{ include "cockroach.pgbouncer.secretStartup.name" . }}
description: PgBouncer startup script
tags: {{- include "cockroach.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu

    # The CockroachDB backend list is built HERE, at container start, from the
    # same CRDB_* env the nodes build their --join list from. Before 2.0.0 Helm
    # assembled it in this template from its own copy of the location list,
    # which meant PgBouncer's idea of the cluster and the cluster's idea of
    # itself were two independent renderings that could disagree -- and when
    # they did, the nodes PgBouncer did not know about were invisible rather
    # than broken. One source now, so they cannot.
    #
    # POSIX sh -- this image is Alpine/BusyBox and has no bash, no arrays.
    CRDB_HOSTS=""
    i=0
    for loc in ${CRDB_LOCATIONS}; do
      count=$(echo "${CRDB_REPLICAS}" | cut -d' ' -f$((i + 1)))
      j=0
      while [ "${j}" -lt "${count}" ]; do
        CRDB_HOSTS="${CRDB_HOSTS},replica-${j}.${CRDB_WORKLOAD}.${loc}.${CPLN_GVC}.cpln.local"
        j=$((j + 1))
      done
      i=$((i + 1))
    done
    DB_HOST=${CRDB_HOSTS#,}

    DB_NAME="{{ .Values.database.name }}"

    echo "Starting PgBouncer, connecting to ${DB_HOST}"

    printf '"root" ""\n"{{ .Values.database.user }}" ""\n' > /tmp/userlist.txt

    cat > /tmp/pgbouncer.ini <<EOF
    [databases]
    ${DB_NAME} = host=${DB_HOST} port=26257 dbname=${DB_NAME}

    [pgbouncer]
    listen_port = 5432
    listen_addr = 0.0.0.0
    auth_type = trust
    auth_file = /tmp/userlist.txt
    pool_mode = {{ .Values.pgbouncer.poolMode }}
    default_pool_size = {{ .Values.pgbouncer.defaultPoolSize }}
    max_client_conn = {{ .Values.pgbouncer.maxClientConn }}
    max_db_connections = {{ .Values.pgbouncer.maxDbConnections }}
    server_check_delay = {{ .Values.pgbouncer.serverCheckDelay }}
    server_connect_timeout = {{ .Values.pgbouncer.serverConnectTimeout }}
    server_login_retry = {{ .Values.pgbouncer.serverLoginRetry }}
    client_login_timeout = {{ .Values.pgbouncer.clientLoginTimeout }}
    query_wait_timeout = {{ .Values.pgbouncer.queryWaitTimeout }}
    tcp_keepalive = 1
    logfile = /dev/stdout
    pidfile = /tmp/pgbouncer.pid
    EOF

    exec pgbouncer /tmp/pgbouncer.ini
{{- end }}
