---
kind: secret
name: {{ include "cockroach.secretStartup.name" . }}
description: CockroachDB startup script
tags: {{- include "cockroach.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    # --- Runtime env ---
    # GVC comes from the runtime built-in, not from Helm: it cannot then drift
    # from the GVC the workload is actually running in.
    LOCATION=$(basename "${CPLN_LOCATION}")
    HOSTNAME=${HOSTNAME}
    GVC="${CPLN_GVC}"

    # Extract replica index from HOSTNAME (a stateful workload gives {workload}-{index})
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')

    # Topology comes from env, rendered once by the cockroach.locationEnv helper
    # and shared with PgBouncer, so the two tiers cannot disagree about which
    # nodes exist.
    LOCATIONS="${CRDB_LOCATIONS}"
    REPLICAS="${CRDB_REPLICAS}"
    WORKLOAD_NAME="${CRDB_WORKLOAD}"
    STORE_DIR="/cockroach/cockroach-data"

    # Self FQDN
    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"

    # --- Guard: never join the cluster from an undeclared location ---
    # defaultOptions.minScale/maxScale are 0, so the platform should never place
    # a replica here at all. This is the last line of defence if it does. A node
    # in an undeclared location has the full --join list, so it DOES join, and
    # advertises --locality=region=<undeclared> -- a region the database was
    # never told about via ADD REGION, holding replicas outside the survival
    # goal. PgBouncer never routes to it either, so it is paid for, load-bearing
    # and invisible. Unconditional, fresh store or not.
    case " ${LOCATIONS} " in
      *" ${LOCATION} "*) : ;;
      *) echo "[cockroach] FATAL: this node is running in location '${LOCATION}', which is not in the configured location list (${LOCATIONS})." >&2
         echo "[cockroach] Refusing to join the cluster from a region it was never told about: its replicas would sit outside the survival goal and PgBouncer would never route to it." >&2
         echo "[cockroach] Remove this location from the GVC, or add it to 'locations' in your values." >&2
         exit 1 ;;
    esac

    # --- GVC location reconciliation ---
    # The platform accepts a localOptions entry naming a location the GVC does
    # not have: it is stored verbatim, is inert, and nothing reports it. So a
    # typo in `locations` yields a cluster that waits for regions which can
    # never appear -- the region-propagation wait below times out, every
    # ADD REGION for the absent region fails, and the install still reports
    # success. Helm cannot see a live GVC at render time, so ask the GVC itself.
    #
    # Asymmetric on purpose: hard-fail ONLY when this node's store has never
    # been opened. On a node that already has data a missing location is
    # indistinguishable from a region being down, and surviving that is the
    # whole point of the product. This check must never be the reason a live
    # cluster stops.
    #
    # `timeout` bounds the WHOLE call, and curl's own --retry is NOT used.
    # Measured in this image (curl 7.76.1) against an unroutable address:
    # `--max-time 10 --retry 3 --retry-delay 2` took 46s, because --max-time is
    # per attempt, not a total. The same call under `timeout 15` stopped at 15s.
    # (An NXDOMAIN host returns in 6s and would have proved nothing.) Retrying
    # in shell keeps the worst case at 3*8 + 2*2 = 28s.
    GVC_LOCS=""
    GVC_READ_OK="false"
    for _try in 1 2 3; do
      if GVC_JSON=$(timeout 8 curl -sS --max-time 6 \
            -H "Authorization: ${CPLN_TOKEN:-}" \
            "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>/dev/null); then
        GVC_LOCS=$(printf '%s' "${GVC_JSON}" | tr -d ' \n' \
          | sed -n 's/.*"locationLinks":\[\([^]]*\)\].*/\1/p' \
          | tr ',' '\n' | sed 's#.*/##;s/"//g' | tr '\n' ' ')
        if [[ -n "${GVC_LOCS}" ]]; then
          GVC_READ_OK="true"
          break
        fi
      fi
      sleep 2
    done

    if [[ "${GVC_READ_OK}" != "true" ]]; then
      # A control-plane hiccup must never be the reason a database refuses to
      # start. Skip the API-backed check; the values-only guard above still applies.
      echo "[cockroach] WARNING: could not read the location list of GVC '${GVC}' -- skipping the GVC location check." >&2
    else
      MISSING=""
      for loc in ${LOCATIONS}; do
        case " ${GVC_LOCS} " in
          *" ${loc} "*) : ;;
          *) MISSING="${MISSING}${loc} " ;;
        esac
      done
      EXTRA=""
      for loc in ${GVC_LOCS}; do
        case " ${LOCATIONS} " in
          *" ${loc} "*) : ;;
          *) EXTRA="${EXTRA}${loc} " ;;
        esac
      done
      if [[ -n "${EXTRA}" ]]; then
        echo "[cockroach] GVC '${GVC}' also has locations this release does not use: ${EXTRA% } -- nothing CockroachDB-related runs there."
      fi
      if [[ -z "${MISSING}" ]]; then
        echo "[cockroach] GVC location check OK -- '${GVC}' has every configured location (${LOCATIONS% })"
      elif [[ ! -f "${STORE_DIR}/STORAGE_MIN_VERSION" ]]; then
        echo "[cockroach] FATAL: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "[cockroach] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "[cockroach] Refusing to initialise a cluster whose declared regions can never exist. Add the missing location(s) to the GVC, or remove them from 'locations' in your values." >&2
        exit 1
      else
        echo "[cockroach] WARNING: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "[cockroach] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "[cockroach] This node already has data, so it keeps serving -- but nodes in the missing location(s) will never appear." >&2
      fi
    fi

    # Build join list at runtime
    JOIN_HOSTS=""
    loc_index=0
    for loc in $LOCATIONS; do
      replica_count=$(echo $REPLICAS | cut -d' ' -f$((loc_index + 1)))
      for i in $(seq 0 $((replica_count - 1))); do
        host="replica-${i}.${WORKLOAD_NAME}.${loc}.${GVC}.cpln.local"
        if [[ "$host" != "$SELF_FQDN" ]]; then
          JOIN_HOSTS="${JOIN_HOSTS},${host}"
        fi
      done
      loc_index=$((loc_index + 1))
    done

    JOIN_HOSTS=${JOIN_HOSTS#,}  # trim leading comma

    echo "Starting CockroachDB on $SELF_FQDN with join [$JOIN_HOSTS]"

    # Cluster init only for replica-0 of first location, runs in background after cockroach is ready
    FIRST_LOCATION=$(echo $LOCATIONS | cut -d' ' -f1)
    if [[ "$REPLICA_INDEX" == "0" && "$LOCATION" == "$FIRST_LOCATION" ]]; then
      (
        echo "Attempting cluster initialization..."

        MAX_ATTEMPTS=20
        ATTEMPT=1
        SUCCESS=false
        FRESH_INIT=false

        while [[ $ATTEMPT -le $MAX_ATTEMPTS ]]; do

          set +e
          OUTPUT=$(cockroach init --insecure --host="$SELF_FQDN:26257" --cluster-name="${WORKLOAD_NAME}" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Init attempt $ATTEMPT: $OUTPUT"

          ALREADY_INITIALIZED=$(echo "$OUTPUT" | tr -d '\r' | grep -qiE "already.*initialized" && echo "true" || echo "false")

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo "Cluster initialization succeeded."
            SUCCESS=true
            FRESH_INIT=true
            break
          elif [[ "$ALREADY_INITIALIZED" == "true" ]]; then
            echo "Cluster already initialized — skipping init."
            SUCCESS=true
            FRESH_INIT=false
            break
          fi

          echo "Init not ready yet — retrying in 3s..."
          sleep 3
          ((ATTEMPT++))
        done

        if [[ "$SUCCESS" == true && "$FRESH_INIT" == true ]]; then
          echo "Proceeding to database/user creation..."
          cockroach sql --insecure --host="$SELF_FQDN:26257" <<EOF
    CREATE DATABASE IF NOT EXISTS {{ .Values.database.name | quote }};
    CREATE USER IF NOT EXISTS {{ .Values.database.user | quote }};
    GRANT ALL ON DATABASE {{ .Values.database.name | quote }} TO {{ .Values.database.user | quote }};
    EOF

          LOCATION_COUNT=$(echo $LOCATIONS | wc -w)

          if [[ $LOCATION_COUNT -ge 3 ]]; then
            cockroach sql --insecure --host="$SELF_FQDN:26257" \
              --execute="ALTER DATABASE {{ .Values.database.name | quote }} PRIMARY REGION \"$FIRST_LOCATION\";"

            echo "Waiting for region metadata to propagate..."

            EXPECTED_COUNT=$LOCATION_COUNT
            TIMEOUT=120
            WAITED=0

            while true; do
              REGISTERED_COUNT=$(cockroach sql --insecure --host="$SELF_FQDN:26257" --format=csv -e \
                "SELECT COUNT(DISTINCT region) FROM [SHOW REGIONS FROM CLUSTER];" | tail -n1)

              echo "Regions detected: $REGISTERED_COUNT / $EXPECTED_COUNT"

              if [[ "$REGISTERED_COUNT" -eq "$EXPECTED_COUNT" ]]; then
                echo "All cluster regions detected."
                break
              fi

              if [[ $WAITED -ge $TIMEOUT ]]; then
                echo "WARNING: Timeout waiting for region propagation — continuing."
                break
              fi

              sleep 5
              WAITED=$((WAITED+5))
            done

            REGION_SETUP_OK=true

            for loc in $LOCATIONS; do
              if [[ "$loc" != "$FIRST_LOCATION" ]]; then
                echo "Adding region: $loc"

                ADD_REGION_SUCCESS=false
                for attempt in {1..10}; do
                  set +e
                  ADD_OUTPUT=$(cockroach sql --insecure --host="$SELF_FQDN:26257" \
                    --execute="ALTER DATABASE {{ .Values.database.name | quote }} ADD REGION \"$loc\";" 2>&1)
                  ADD_EXIT_CODE=$?
                  set -e

                  if [[ $ADD_EXIT_CODE -eq 0 ]]; then
                    echo "Region $loc added successfully."
                    ADD_REGION_SUCCESS=true
                    break
                  fi

                  echo "Attempt $attempt failed to add region $loc: $ADD_OUTPUT — retrying in 5s..."
                  sleep 5
                done

                if [[ "$ADD_REGION_SUCCESS" == false ]]; then
                  echo "ERROR: Failed to add region $loc after 10 attempts."
                  REGION_SETUP_OK=false
                fi
              fi
            done

            # SURVIVE REGION FAILURE is rejected unless every declared region is
            # actually present, so it is exactly the command that fails when the
            # regions above did not all land. Before 2.0.0 it ran bare under
            # `set -e` inside this backgrounded subshell: a failure killed the
            # subshell silently -- no error line, and not even the completion
            # line below -- while the main process kept serving and the install
            # reported success. The database was then left multi-region with the
            # DEFAULT zone survival goal and nothing said so.
            set +e
            SURVIVE_OUTPUT=$(cockroach sql --insecure --host="$SELF_FQDN:26257" \
              --execute="ALTER DATABASE {{ .Values.database.name | quote }} SURVIVE REGION FAILURE;" 2>&1)
            SURVIVE_EXIT_CODE=$?
            set -e

            if [[ $SURVIVE_EXIT_CODE -eq 0 ]]; then
              echo "Survival goal set to REGION."
            else
              REGION_SETUP_OK=false
              echo "ERROR: Failed to set SURVIVE REGION FAILURE: $SURVIVE_OUTPUT"
            fi

            if [[ "$REGION_SETUP_OK" == true ]]; then
              echo "Multi-region configuration complete."
            else
              echo "ERROR: Multi-region configuration is INCOMPLETE. The database is serving, but it cannot survive the loss of a region."
              echo "ERROR: Check that every location in 'locations' exists in GVC '${GVC}' and has nodes running, then re-run the ALTER DATABASE statements by hand."
              cockroach sql --insecure --host="$SELF_FQDN:26257" \
                --execute="SHOW REGIONS FROM CLUSTER;" || true
            fi
          else
            echo "Single/dual location deployment — skipping multi-region configuration."
          fi

        elif [[ "$SUCCESS" == true && "$FRESH_INIT" == false ]]; then
          echo "Existing cluster detected — skipping region & DB configuration."
        else
          echo "ERROR: Failed to initialize cluster after $MAX_ATTEMPTS attempts."
        fi
      ) &
    fi

    # Replace shell with CockroachDB — receives SIGTERM, container exits if CockroachDB crashes
    exec cockroach start \
      --insecure \
      --listen-addr=0.0.0.0:26257 \
      --http-addr=0.0.0.0:8080 \
      --advertise-addr="$SELF_FQDN" \
      --join="$JOIN_HOSTS" \
      --cluster-name="${WORKLOAD_NAME}" \
      --locality=region=${LOCATION}
---
kind: secret
name: {{ include "cockroach.secretDatabase.name" . }}
description: CockroachDB config
tags: {{- include "cockroach.tags" . | nindent 4 }}
type: dictionary
data:
  db: {{ .Values.database.name | quote }}
  user: {{ .Values.database.user | quote }}
