{{- if .Values.backup.enabled }}
---
kind: workload
name: {{ include "cockroach.backup.name" . }}
description: CockroachDB Backup
tags: {{- include "cockroach.tags" . | nindent 4 }}
spec:
  type: cron
  containers:
    - name: backup-cockroach
      cpu: {{ .Values.backup.resources.cpu | quote }}
      memory: {{ .Values.backup.resources.memory | quote }}
      image: {{ .Values.backup.image }}
      inheritEnv: false
      env:
        - name: BACKUP_PROVIDER
          value: {{ .Values.backup.provider }}
        - name: COCKROACH_HOST
          {{- if .Values.pgbouncer.enabled }}
          value: {{ include "cockroach.pgbouncer.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
          {{- else }}
          value: {{ include "cockroach.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
          {{- end }}
        - name: COCKROACH_PORT
          {{- if .Values.pgbouncer.enabled }}
          value: "5432"
          {{- else }}
          value: "26257"
          {{- end }}
        - name: COCKROACH_DB
          value: {{ .Values.database.name | quote }}
      {{- if eq .Values.backup.provider "aws" }}
        - name: AWS_BUCKET
          value: {{ .Values.backup.aws.bucket }}
        - name: AWS_REGION
          value: {{ .Values.backup.aws.region }}
        - name: AWS_PREFIX
          value: {{ .Values.backup.aws.prefix | quote }}
      {{- end }}
      {{- if eq .Values.backup.provider "gcp" }}
        - name: GCP_BUCKET
          value: {{ .Values.backup.gcp.bucket }}
        - name: GCP_PREFIX
          value: {{ .Values.backup.gcp.prefix | quote }}
      {{- end }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 1
      metric: disabled
      minScale: 1
      scaleToZeroDelay: 300
      target: 95
    capacityAI: false
    debug: false
    suspend: true    # a GVC location this release did not ask for must NOT run a second backup
    timeoutSeconds: 3600
  {{- /*
    Unsuspended in exactly one location. backup.location is checked at render
    time against `locations` -- the platform accepts a localOptions entry for a
    location that does not exist, stores it, and the cron then never runs
    anywhere with nothing to observe.
  */}}
  localOptions:
    - location: //location/{{ .Values.backup.location }}
      suspend: false
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR: []
    internal:
      inboundAllowType: same-gvc
      inboundAllowWorkload: []
  job:
    activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
    concurrencyPolicy: Forbid
    historyLimit: 5
    restartPolicy: Never
    schedule: {{ .Values.backup.schedule | quote }}
  supportDynamicTags: false
{{- end }}
