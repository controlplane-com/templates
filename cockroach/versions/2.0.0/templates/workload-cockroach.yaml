---
kind: workload
name: {{ include "cockroach.name" . }}
description: CockroachDB cluster
tags: {{- include "cockroach.tags" . | nindent 2 }}
spec:
  type: stateful
  containers:
    - name: cockroach
      cpu: {{ .Values.resources.cpu | quote }}
      memory: {{ .Values.resources.memory | quote }}
      image: {{ .Values.image }}
      command: "/bin/bash"
      args:
        - "/cockroach/start.sh"
      inheritEnv: false
      env:
        - name: DB_NAME
          value: cpln://secret/{{ include "cockroach.secretDatabase.name" . }}.db
        - name: DB_USER
          value: cpln://secret/{{ include "cockroach.secretDatabase.name" . }}.user
        {{- include "cockroach.locationEnv" . | nindent 8 }}
      ports:
        - number: 8080
          protocol: tcp
        - number: 26257
          protocol: tcp
      lifecycle:
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - "cockroach node drain --insecure --host=localhost:26257 --self || true"
      {{- /*
        scheme/initialDelaySeconds/successThreshold and the recoveryPolicy below
        are all values the API BACKFILLS. Declaring them changes nothing about
        what runs -- it makes the rendered manifest equal the stored resource, so
        the deployment UI stops showing a permanent chart-vs-resource difference.
        Measured 2026-08-28 with render-vs-stored.py against this release.
      */}}
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
          scheme: HTTP
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        successThreshold: 1
        failureThreshold: 3
      volumes:
        - path: /cockroach/cockroach-data
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "cockroach.volume.name" . }}
        - path: /cockroach/start.sh
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "cockroach.secretStartup.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 0   # a GVC location this release did not ask for runs NOTHING
      metric: disabled
      minScale: 0   # localOptions below supplies the real count for each configured location
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    multiZone:
      enabled: {{ .Values.multiZone }}
    suspend: false
    timeoutSeconds: 10
  firewallConfig:
    {{- /* the four empty lists are API backfills, declared so rendered == stored */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
      - 0.0.0.0/0
      outboundAllowHostname: []
      outboundBlockedCIDR: []
    internal:
      {{- if .Values.pgbouncer.enabled }}
      inboundAllowType: workload-list
      inboundAllowWorkload:
        {{- include "cockroach.ownWorkloadLinks" . | nindent 8 }}
      {{- else }}
      inboundAllowType: {{ .Values.internal_access.type }}
      {{- if eq .Values.internal_access.type "workload-list" }}
      {{- /*
        This list governs ALL inbound internal traffic, INCLUDING node-to-node
        gossip and range replication between the replicas of THIS workload. The
        pgbouncer branch above already adds this workload to its own list; the
        else branch did not, so with pgbouncer DISABLED a workload-list naming
        only clients denied the nodes each other. Measured 2026-08-27: `node
        status` showed `2,false,false / 3,false,false` while every replica still
        reported `ready: true`; adding the workload to its own list brought all
        three back. Same defect confirmed in etcd-multi-location, clickhouse and
        pgedge in this batch.
      */}}
      {{- $own := splitList "\n" (trim (include "cockroach.ownWorkloadLinks" .)) }}
      inboundAllowWorkload:
        {{- include "cockroach.ownWorkloadLinks" . | nindent 8 }}
        {{- range .Values.internal_access.workloads }}
        {{- if not (has (printf "- %s" .) $own) }}
        - {{ . }}
        {{- end }}
        {{- end }}
      {{- else if .Values.internal_access.workloads }}
      inboundAllowWorkload: {{ .Values.internal_access.workloads | toYaml | nindent 8 }}
      {{- else }}
      inboundAllowWorkload: []   # API backfill, declared so rendered == stored
      {{- end }}
      {{- end }}
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cockroach.identity.name" . }}
  loadBalancer:
    replicaDirect: true
  {{- /*
    Every localOptions entry must carry the COMPLETE field set defaultOptions
    carries: localOptions is a full override, and a field left out would fall
    through to the 0/0 shape above and produce no nodes in a location the user
    did ask for.
  */}}
  localOptions:
    {{- range $location := .Values.locations }}
    - autoscaling:
        maxConcurrency: 0
        maxScale: {{ $location.replicas | int }}
        metric: disabled
        minScale: {{ $location.replicas | int }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      location: //location/{{ $location.name }}
      multiZone:
        enabled: {{ $.Values.multiZone }}
      suspend: false
      timeoutSeconds: 10
    {{- end }}
  supportDynamicTags: false
