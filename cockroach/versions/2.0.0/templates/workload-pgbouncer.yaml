{{- if .Values.pgbouncer.enabled }}
---
kind: workload
name: {{ include "cockroach.pgbouncer.name" . }}
description: PgBouncer Connection Pooler for CockroachDB
tags:
  {{- include "cockroach.tags" . | nindent 4 }}
spec:
  type: standard
  containers:
    - name: pgbouncer
      image: {{ .Values.pgbouncer.image }}
      cpu: {{ .Values.pgbouncer.resources.maxCpu | quote }}
      minCpu: {{ .Values.pgbouncer.resources.minCpu | quote }}
      memory: {{ .Values.pgbouncer.resources.maxMemory | quote }}
      minMemory: {{ .Values.pgbouncer.resources.minMemory | quote }}
      inheritEnv: false
      command: "/bin/sh"
      args:
        - "/pgbouncer/start.sh"
      env:
        {{- include "cockroach.locationEnv" . | nindent 8 }}
      {{- /*
        recoveryPolicy, initialDelaySeconds and successThreshold are API
        backfills, declared so the rendered manifest equals the stored resource
        and the deployment UI shows no permanent difference. Measured 2026-08-28
        with render-vs-stored.py. There is no httpGet scheme here because this
        probe is exec: the API backfills probe defaults per probe TYPE.
      */}}
      volumes:
        - path: /pgbouncer/start.sh
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "cockroach.pgbouncer.secretStartup.name" . }}
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "psql -h 127.0.0.1 -p 5432 -U root -d {{ .Values.database.name }} -c 'SELECT 1' -q 2>/dev/null"
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        successThreshold: 1
        failureThreshold: 4
      ports:
        - number: 5432
          protocol: tcp
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cockroach.identity.name" . }}
  defaultOptions:
    autoscaling:
      metric: disabled   # a GVC location this release did not ask for runs NOTHING
      minScale: 0        # localOptions below supplies the real counts
      maxScale: 0
      maxConcurrency: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  {{- /*
    A full override, like the CockroachDB tier: every field defaultOptions
    carries must be repeated, or it falls through to the 0/0 shape above.
  */}}
  localOptions:
    {{- range $location := .Values.locations }}
    - location: //location/{{ $location.name }}
      autoscaling:
        metric: rps
        minScale: {{ $.Values.pgbouncer.minReplicas }}
        maxScale: {{ $.Values.pgbouncer.maxReplicas }}
        maxConcurrency: 0
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  firewallConfig:
    internal:
      inboundAllowType: {{ .Values.pgbouncer.internal_access.type }}
      {{- if eq .Values.pgbouncer.internal_access.type "workload-list" }}
      {{- /* the backup cron reaches PgBouncer too -- see cockroach.ownWorkloadLinks */}}
      {{- $own := splitList "\n" (trim (include "cockroach.ownWorkloadLinks" .)) }}
      inboundAllowWorkload:
        {{- include "cockroach.ownWorkloadLinks" . | nindent 8 }}
        {{- range .Values.pgbouncer.internal_access.workloads }}
        {{- if not (has (printf "- %s" .) $own) }}
        - {{ . }}
        {{- end }}
        {{- end }}
      {{- else if .Values.pgbouncer.internal_access.workloads }}
      inboundAllowWorkload: {{ .Values.pgbouncer.internal_access.workloads | toYaml | nindent 8 }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundBlockedCIDR: []
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
{{- end }}
