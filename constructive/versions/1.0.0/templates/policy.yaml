kind: policy
name: {{ include "constructive.policy.name" . }}
tags: {{- include "constructive.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "constructive.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ .Values.postgres.config.credentialsSecretName }}
  - //secret/{{ .Values.server.loginSecretName }}
