---
kind: secret
name: {{ include "coraza.secretStartup.name" . }}
description: Coraza WAF startup script
tags: {{- include "coraza.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    # postStart hook — point the image's reverse_proxy handler at the target workload.
    #
    # This reaches into the Caddy configuration baked into the coraza-crs image, so it
    # depends on that image's internals. Each dependency is checked rather than assumed,
    # and a failed check exits NON-ZERO on purpose.
    #
    # Why non-zero, given that it makes the container restart: the only alternative is to
    # log a warning and exit 0, which leaves the WAF running with its reverse proxy
    # unconfigured while the deployment reports healthy — a security appliance in an
    # unknown state, silently. A restart loop is noisy and obvious; a quietly
    # misconfigured WAF is neither. Fail closed and loud, never open and quiet.
    # The platform surfaces this as "PostStartHook failed"; the [FATAL] lines below say
    # which check failed and what to do about it.
    #
    # Only the *-caddy-alpine-* variants of coraza-crs work with this template — the
    # nginx and apache variants have no admin API. Pin a datecode or a digest, never a
    # moving tag such as -lts: upstream repoints those, changing the image under a
    # running deployment.

    set -u

    # ── 0. Put this hook's output where the operator will look ────────────────────
    # A postStart hook runs as a SEPARATE exec session, so its stdout and stderr are
    # not part of the container's log stream. Measured on the platform: `cpln logs`
    # returns ZERO lines for every [INFO]/[FATAL] below, while the same query returns
    # the container's own output — so without this the operator sees only the opaque
    # "PostStartHook failed" and none of the diagnosis these messages exist to give.
    #
    # The obvious fix — writing to /proc/1/fd/1 — does NOT work on this image, and it
    # is worth saying why so nobody re-tries it. Caddy marks its own process
    # non-dumpable, so the kernel reassigns /proc/1/fd to root:root mode 0500 even
    # though PID 1 runs as caddy(1000); the hook, which also runs as caddy, gets
    # EACCES. Measured on the pinned digest, with the control that isolates it: an
    # alpine container whose PID 1 runs as uid 1000 has /proc/1/fd owned by 1000 and
    # the write succeeds, while this image denies it. It is a property of the caddy
    # binary, not of the runtime, so it fails the same way everywhere.
    #
    # So the hook writes to a file instead, and the container's command starts a
    # `tail -F` on that file BEFORE exec'ing the entrypoint — that tail inherits the
    # container's real stdout, so everything below lands in `cpln logs`. The two ends
    # of this are the HOOK_LOG path here and the same path in workload.yaml; they
    # must stay in step.
    #
    # Guarded on purpose, and appending rather than truncating:
    #   * the open is tried in a SUBSHELL first. A bare `exec >...` whose redirection
    #     fails terminates the shell, which would turn an unwritable /tmp into the
    #     very opaque restart loop this is meant to prevent. If the probe fails the
    #     hook simply carries on unredirected — degraded output, identical behaviour.
    #   * `>>` not `>`, so a hook that runs twice appends rather than erasing what the
    #     previous attempt reported.
    #   * stderr is folded into the same stream: one open is one failure mode, and the
    #     [FATAL] prefix already carries the severity.
    HOOK_LOG=/tmp/coraza-hook.log
    if ( : >>"${HOOK_LOG}" ) 2>/dev/null; then
      exec >>"${HOOK_LOG}" 2>&1
    fi

    ADMIN_URL="127.0.0.1"
    ADMIN_PORT="2019"
    ROUTE_BASE="/config/apps/http/servers/srv0/routes/0/handle"
    PATCH_FILE="/tmp/proxy_patch.json"
    # Measured: Caddy binds the admin socket before the postStart hook can even attach
    # (0 failed probes on a warm image), so 30s is a large margin. Keep it well under
    # any platform-side lifecycle-hook timeout, so that on failure the [FATAL] message
    # below is what the operator sees rather than an opaque kill.
    ADMIN_WAIT_SECONDS=30
    MAX_HANDLERS=20
    {{- if .Values.diskBodyInspection }}

    mkdir -p /tmp/coraza
    {{- end }}

    # GET a config path. Prints the raw JSON on success, nothing on a non-2xx.
    admin_get() {
      wget -q -O - "http://${ADMIN_URL}:${ADMIN_PORT}$1" 2>/dev/null
    }

    # ── 1. Wait for the admin API, but with a deadline ────────────────────────────
    # An unbounded wait here hangs the hook until the platform kills it, which
    # presents as a restart loop with no explanation. Bound it and say why instead.
    echo "[INFO] Waiting up to ${ADMIN_WAIT_SECONDS}s for the Caddy admin API..."
    DEADLINE=$(( $(date +%s) + ADMIN_WAIT_SECONDS ))
    until wget -q -O /dev/null "http://${ADMIN_URL}:${ADMIN_PORT}/config/" 2>/dev/null; do
      if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
        echo "[FATAL] The Caddy admin API did not answer at ${ADMIN_URL}:${ADMIN_PORT} within ${ADMIN_WAIT_SECONDS}s." >&2
        echo "[FATAL] The usual cause is that 'image' is not a Caddy build of coraza-crs." >&2
        echo "[FATAL] Check that it resolves to a *-caddy-alpine-* tag: the nginx and apache" >&2
        echo "[FATAL] variants ship no Caddy binary and no admin API, so this template cannot" >&2
        echo "[FATAL] configure them. If you pinned a moving tag (-lts, caddy-alpine), upstream" >&2
        echo "[FATAL] may have repointed it — pin a datecode or a digest instead." >&2
        exit 1
      fi
      sleep 1
    done
    echo "[INFO] Caddy admin API is up."

    # ── 2. Resolve the reverse_proxy handler index ────────────────────────────────
    # Do NOT assume a position. The index is only stable for one build of one image's
    # Caddyfile; patching a hardcoded index against a rebuilt image silently rewrites
    # the wrong handler. Ask the admin API which entry is the reverse proxy.
    echo "[INFO] Locating the reverse_proxy handler under ${ROUTE_BASE}..."
    HANDLER_INDEX=""
    i=0
    while [ "${i}" -lt "${MAX_HANDLERS}" ]; do
      HANDLER=$(admin_get "${ROUTE_BASE}/${i}/handler")
      # An empty reply means the index is past the end of the handler array.
      [ -z "${HANDLER}" ] && break
      echo "[INFO]   handle/${i} -> ${HANDLER}"
      if [ "${HANDLER}" = '"reverse_proxy"' ]; then
        HANDLER_INDEX="${i}"
        break
      fi
      i=$((i + 1))
    done

    if [ -z "${HANDLER_INDEX}" ]; then
      echo "[FATAL] No 'reverse_proxy' handler exists under ${ROUTE_BASE}." >&2
      echo "[FATAL] The image's built-in Caddy configuration is not the shape this template" >&2
      echo "[FATAL] expects (a WAF handler followed by a reverse proxy), so there is nothing" >&2
      echo "[FATAL] to point at the target workload. Verify that 'image' is a coraza-crs" >&2
      echo "[FATAL] *-caddy-alpine-* build; the handler list logged above is what was found." >&2
      exit 1
    fi

    ROUTE_PATH="${ROUTE_BASE}/${HANDLER_INDEX}"
    echo "[INFO] reverse_proxy resolved to ${ROUTE_PATH}."

    # ── 3. Patch that handler with the target workload ────────────────────────────
    cat > "${PATCH_FILE}" <<'EOF'
    {
      "handler": "reverse_proxy",
      "headers": {
        "request": {
          "set": {
            "Host": ["{{ .Values.targetWorkload }}"]
          }
        }
      },
      "trusted_proxies": ["192.168.0.0/16","172.16.0.0/12","10.0.0.0/8","127.0.0.1/8","fd00::/8","::1"],
      "upstreams": [
        { "dial": "{{ .Values.targetWorkload }}:{{ .Values.targetPort }}" }
      ]
    }
    EOF

    echo "[INFO] Applying PATCH to ${ROUTE_PATH}..."
    LEN=$(wc -c < "${PATCH_FILE}")
    RESPONSE=$(
      {
        printf "PATCH %s HTTP/1.1\r\nHost: %s:%s\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n" \
          "${ROUTE_PATH}" "${ADMIN_URL}" "${ADMIN_PORT}" "${LEN}"
        cat "${PATCH_FILE}"
      } | nc "${ADMIN_URL}" "${ADMIN_PORT}" || true
    )
    rm -f "${PATCH_FILE}"
    echo "${RESPONSE}"

    # Match the status line only. Grepping the whole response for "200 OK" can match
    # an error body that happens to quote it.
    STATUS=$(printf '%s\n' "${RESPONSE}" | head -n 1 | tr -d '\r')
    if ! printf '%s' "${STATUS}" | grep -q '^HTTP/[0-9.]* 200'; then
      echo "[FATAL] PATCH of ${ROUTE_PATH} failed: '${STATUS:-no response from the admin API}'." >&2
      echo "[FATAL] The WAF would otherwise be serving with no reverse-proxy configuration," >&2
      echo "[FATAL] so this exits non-zero rather than come up misconfigured. The full admin" >&2
      echo "[FATAL] API response is logged above." >&2
      exit 1
    fi

    # ── 4. Read the configuration back ────────────────────────────────────────────
    # A 200 means the PATCH was accepted, not that the upstream is what we intended.
    # This is the check that proves the WAF is actually proxying where it should.
    DIAL=$(admin_get "${ROUTE_PATH}/upstreams/0/dial")
    EXPECTED_DIAL='"{{ .Values.targetWorkload }}:{{ .Values.targetPort }}"'
    if [ "${DIAL}" != "${EXPECTED_DIAL}" ]; then
      echo "[FATAL] Verification failed: ${ROUTE_PATH} dials ${DIAL:-nothing} but should dial ${EXPECTED_DIAL}." >&2
      exit 1
    fi

    echo "[INFO] WAF configured: proxying to ${EXPECTED_DIAL} via ${ROUTE_PATH}."
