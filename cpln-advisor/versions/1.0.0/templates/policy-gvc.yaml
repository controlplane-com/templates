{{- include "cpln-advisor.validate" . -}}
{{- /*
  The API reads its own GVC at boot to confirm the GVC really has
  the location this release is pinned to, and to report any EXTRA locations —
  which matter here more than in most converted templates, because the bundled
  `postgres` subchart cannot be pinned and runs one independent database in each
  of them. The platform validates neither direction: a localOptions entry naming
  a location the GVC lacks is stored verbatim and is simply inert. Helm cannot
  see a live GVC at render time, so the container asks the GVC itself.

  Scoped to the ONE install GVC; never `target: all`, which would grant view on
  every GVC in the org.
*/}}
kind: policy
name: {{ include "cpln-advisor.gvcPolicy.name" . }}
description: CPLN Advisor GVC read policy
tags: {{- include "cpln-advisor.tags" . | nindent 4 }}
bindings:
  - permissions:
      - view
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cpln-advisor.identity.name" . }}
targetKind: gvc
targetLinks:
  - //gvc/{{ .Values.global.cpln.gvc }}
