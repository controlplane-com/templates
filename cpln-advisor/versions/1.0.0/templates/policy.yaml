{{- include "cpln-advisor.validate" . -}}
kind: policy
name: {{ include "cpln-advisor.policy.name" . }}
description: CPLN Advisor policy
tags: {{- include "cpln-advisor.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cpln-advisor.identity.name" . }}
targetKind: secret
targetLinks:
  # Exactly the one advisor credentials secret you created — never `target: all`,
  # which would grant reveal on every secret in the org. The bundled postgres
  # subchart brings its own policy for its own credentials secret, so this
  # identity never gets reveal on the database's.
  - //secret/{{ .Values.auth.secretName }}
