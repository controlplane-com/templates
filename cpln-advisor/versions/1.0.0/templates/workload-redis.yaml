{{- include "cpln-advisor.validate" . -}}
kind: workload
name: {{ include "cpln-advisor.redis.name" . }}
description: Task broker and cache for the advisor
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "cpln-advisor.tags" . | nindent 4 }}
spec:
  type: standard
  containers:
    - name: redis
      image: {{ .Values.redis.image }}
      inheritEnv: false
      cpu: {{ .Values.redis.resources.maxCpu | quote }}
      memory: {{ .Values.redis.resources.maxMemory | quote }}
      ports:
        - number: 6379
          protocol: tcp
      # Run through a shell so the empty `--save ''` stays INSIDE one argument.
      # Passed as its own array element it is rejected outright:
      # "args[2] is not allowed to be empty".
      #
      # `--save ''` disables RDB snapshots, which are pointless here — there is
      # no volume, so a snapshot would be written to ephemeral storage and lost
      # anyway while still paying the fork pause. `maxmemory` keeps a runaway
      # cache from being OOM-killed mid-scan, and allkeys-lru evicts rather than
      # refusing writes.
      #
      # `exec` matters: without it the shell stays PID 1 and swallows SIGTERM,
      # so the container is killed on the timeout instead of shutting down.
      command: /bin/sh
      args:
        - -c
        - exec redis-server --save '' --maxmemory {{ .Values.redis.maxmemory }} --maxmemory-policy allkeys-lru
      readinessProbe:
        exec:
          command:
            - sh
            - -c
            - redis-cli ping | grep -q PONG
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
        timeoutSeconds: 2
  defaultOptions:
    capacityAI: false # a broker should not be resized under load
    timeoutSeconds: 5
    autoscaling:
      maxConcurrency: 0
      metric: disabled
      minScale: 1
      maxScale: 1 # ONE replica: two brokers means tasks split between them
      scaleToZeroDelay: 300
      target: 95
  firewallConfig:
    external:
      inboundAllowCIDR: [] # no inbound from the internet
      inboundBlockedCIDR: []
      outboundAllowCIDR: [] # and it calls nothing
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      # Exactly the three workloads that use it, and nothing else. This is not
      # authenticated, so the firewall is the whole access control.
      inboundAllowType: workload-list
      inboundAllowWorkload:
        - //gvc/{{ .Values.global.cpln.gvc }}/workload/{{ include "cpln-advisor.api.name" . }}
        - //gvc/{{ .Values.global.cpln.gvc }}/workload/{{ include "cpln-advisor.worker.name" . }}
        - //gvc/{{ .Values.global.cpln.gvc }}/workload/{{ include "cpln-advisor.scheduler.name" . }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
