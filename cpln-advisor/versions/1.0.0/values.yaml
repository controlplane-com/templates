# ─── Location ─────────────────────────────────────────────────────────────────
# This chart deploys into the GVC you install into — it does NOT create one, and
# there is no `gvc` key any more. `global.cpln.gvc` is injected by the platform
# at install time, so it is never declared here.
#
# IF YOU INSTALLED THE EARLIER 1.0.0, DO NOT `helm upgrade` onto this one. That
# version created a GVC named after the one you installed into, so Helm ADOPTED
# your GVC; this one stops declaring it, and Helm deletes what a chart no longer
# declares — the GVC and everything in it. The chart refuses to render if the old
# `gvc` key is present, but a values-less upgrade sees only these defaults and
# cannot be caught. See `If you installed the earlier 1.0.0` in the README.
#
# The advisor runs in EXACTLY ONE location, and this names it. It must already
# be a location of that GVC — the API reads the GVC at boot and warns loudly if
# it is not.
#
# One location is not a simplification. Scale bounds are per-location, so a
# second location means a second scheduler firing every cron twice, a second
# Redis splitting the task queue, and a second API running the same startup
# migration. Every workload in this chart is pinned here by
# defaultOptions.minScale/maxScale 0 plus a localOptions entry — but see the
# Database section: the bundled `postgres` subchart is the one tier that cannot
# be pinned, so install the advisor into a SINGLE-LOCATION GVC.
location: aws-us-east-1

# ─── Images ───────────────────────────────────────────────────────────────────
# The API, worker and scheduler all run the SAME backend image — same code,
# different command. A scan is executed by the worker and served by the API, so
# they must never drift apart. Both packages are public on GHCR, so Control Plane
# pulls them anonymously and the GVC needs no pull secret.
#
# `:latest` tracks the project's main branch, and is resolved when the workload
# is DEPLOYED — a later push to the tag is NOT picked up until the next deploy,
# because these workloads set `supportDynamicTags: false`. Two consequences:
#
#   * Two installs a week apart can be running different code.
#   * There is nothing to roll back TO. Every build also publishes a
#     `:sha-<commit>` tag — pin one before you depend on going back.
images:
  backend: ghcr.io/controlplane-com/cpln-advisor/advisor-backend:latest
  web: ghcr.io/controlplane-com/cpln-advisor/advisor-web:latest

# ─── Credentials (PREREQUISITE SECRET) ────────────────────────────────────────
# This chart creates NO credential secret and takes NO credential as a value, so
# nothing sensitive passes through Helm or lands in the release. It reads
# everything out of one `dictionary` secret that must EXIST BEFORE YOU INSTALL —
# the workloads wedge waiting on it otherwise.
#
# Create it with the six keys below (see README Prerequisites for the commands):
#
#   ADVISOR_API_TOKEN       shared dashboard <-> API token; the API fails closed without it
#   ADVISOR_SECRET_KEY      encrypts the AI and Slack credentials stored in the database
#   ADVISOR_SESSION_SECRET  signs the dashboard session cookie
#   ADVISOR_USERNAME        the web-UI login name, e.g. admin
#   ADVISOR_PASSWORD        the web-UI login password
#   DATABASE_URL            postgresql+asyncpg://USER:PASS@RELEASE-postgres.GVC.cpln.local:5432/DB
#
# The key names are the app's own environment variable names, so a secret built
# for a hand-applied deployment works here unchanged.
#
# DATABASE_URL must carry the SAME username/password/database as the database's
# own secret (postgres.config.credentialsSecretName below). NOTHING CROSS-CHECKS
# THE TWO — a mismatch is an authentication failure at runtime, not a render
# error. The host is `{release}-postgres.{gvc}.cpln.local:5432`.
auth:
  secretName: advisor-config # MUST EXIST BEFORE INSTALL

# ─── Access ───────────────────────────────────────────────────────────────────
# The dashboard is PUBLIC, and that is not configurable. It is the only way in —
# nothing inside the GVC calls it, so an internal-only dashboard would be
# unreachable by the people it exists for.
#
# What stands between the internet and your fleet is the login: the session
# cookie is HMAC-signed, the API fails closed without its token, and both
# credentials come from a secret you create. There is no shipped default
# password to find.
#
# The API, worker, scheduler, Redis and the database are never public, and their
# internal firewalls admit only their real callers.
#
# To narrow the dashboard to an office or VPN range, edit `inboundAllowCIDR` on
# the `{release}-web` workload after installing.

# OPTIONAL override for the dashboard's public URL, used for the Slack "View in
# Advisor" links and the CORS allowlist.
#
# Leave it empty: the app derives `https://{web workload}-{gvc alias}.cpln.app`
# from Control Plane's built-in env vars, and the chart tells it this release's
# web workload name. Set this only for a CUSTOM DOMAIN, which cannot be derived.
# Never "*".
appUrl: ""

# ─── Sessions ─────────────────────────────────────────────────────────────────
# Idle windows: how long WITHOUT activity before you must sign in again. Both
# slide forward while you work, under a hard ceiling enforced by the app.
session:
  hours: 12
  rememberDays: 30

# INFO logs one line per scan plus notable events. DEBUG adds per-query detail
# for every Control Plane call and is very noisy.
logLevel: INFO

# ─── Workloads ────────────────────────────────────────────────────────────────
# A block that exposes BOTH a reservation and a limit names them
# `minCpu`/`maxCpu` and `minMemory`/`maxMemory`. A block that exposes only the
# disambiguate against. `worker` and `redis` still use `maxCpu`/`maxMemory`;
# renaming them is proposed separately, since it would break existing values.
#
# `minCpu`/`minMemory` are the floor Capacity AI scales from; where they are not
# set, Control Plane supplies its own default floor.
#
# Where a min IS set, max:min must stay under 4:1 on cpu (Control Plane rejects
# the workload otherwise) and at or under 4:1 on memory. The chart checks both at
# render time — the rule is in no JSON schema and would otherwise surface as a
# 400 partway through an install.

# The dashboard (Next.js). The only workload that can be made public.
web:
  replicas:
    min: 1 # set 0 to scale to zero when idle, at the cost of a cold start
    max: 3
  resources: # Capacity AI ON
    minCpu: 75m
    maxCpu: 250m
    minMemory: 128Mi
    maxMemory: 512Mi

# The API (FastAPI). Internal only — the browser never talks to it directly, the
# dashboard proxies server-side and attaches the token. Runs the database
# migration at startup, which is one reason it is pinned to a single replica.
api:
  resources: # Capacity AI ON
    # minCpu is 75m, not the 50m the upstream .cpln manifest carries: 256m/50m is
    # a 5.12:1 spread and Control Plane rejects it. 75m keeps the same ceiling at
    # 3.41:1.
    minCpu: 75m
    maxCpu: 256m
    minMemory: 128Mi
    maxMemory: 512Mi

# Runs the scans, applies autopilot changes and sends the Slack digest.
worker:
  resources: # Capacity AI off — a long scan should not be resized underneath itself
    maxCpu: 100m
    maxMemory: 256Mi

# Fires the crons that CREATE the scans. Without it nothing is ever scanned on a
# schedule, retention never prunes and autopilot never runs — while everything
# still looks healthy.
scheduler:
  resources: # Capacity AI ON
    minCpu: 25m
    maxCpu: 50m
    minMemory: 64Mi
    maxMemory: 128Mi

# Task broker and cache. NOT persistent: everything in it is derived or
# transient, so a restart at worst skips one scan and repeats one digest.
redis:
  image: redis:7-alpine
  resources: # Capacity AI off — a broker should not be resized under load
    maxCpu: 50m
    maxMemory: 128Mi
  # Cap the cache so a runaway key cannot get the container OOM-killed mid-scan.
  # Below `memory` on purpose (100 MB vs 128 MiB).
  maxmemory: 100mb

# ─── Database (subchart: postgres 3.4.1) ──────────────────────────────────────
# Bundled, so one install brings up everything. Values here are passed to the
# catalog's `postgres` chart, which creates the workload, its volume set, its own
# identity and a policy granting `reveal` on the credentials secret below.
#
# Three workloads write this database concurrently — the API serves the
# dashboard, the worker records scan results and Autopilot changes, and the
# scheduler writes cron state. That needs a database server, and one that is
# backed up.
#
# THE ONE TIER THIS CHART CANNOT PIN TO A LOCATION. postgres 3.4.1 has no
# `location` knob and renders no `localOptions`, and a subchart's values cannot
# be templated, so the parent cannot supply one. In a GVC with more than one
# location it therefore runs ONE INDEPENDENT, EMPTY DATABASE PER LOCATION, each
# on its own volume — billed, and answering the same `{release}-postgres.{gvc}`
# service DNS name this release connects to. INSTALL THE ADVISOR INTO A
# SINGLE-LOCATION GVC. The API warns about extra locations at boot; it cannot
# prevent them.
postgres:
  image: postgres:18 # 17+ is required for the backup feature below

  config:
    # SECOND PREREQUISITE SECRET — CREATE IT BEFORE YOU INSTALL. A `dictionary`
    # secret with exactly three keys: `username`, `password`, `database`. From
    # 3.4.0 the template reads them from here instead of taking them inline,
    # which is what keeps every credential out of this file.
    #
    # If it does not exist at install time the deployment WEDGES SILENTLY —
    # `cpln logs` returns nothing at all to tell you why.
    #
    # Its three values must match DATABASE_URL in the advisor secret above.
    # Nothing cross-checks them.
    credentialsSecretName: advisor-db-credentials

  # The advisor's database is small — scores, suggestions and activity, not
  # telemetry. Deliberately above the template's defaults on memory: a fleet scan
  # writes in bursts. Postgres is `stateful`, which respects minCpu/minMemory
  # whether or not Capacity AI is on. 3.4:1 and 2:1.
  resources:
    minCpu: 150m
    minMemory: 256Mi
    maxCpu: 512m
    maxMemory: 512Mi

  volumeset:
    capacity: 10 # GiB — 10 is the minimum
    # One-way (volumes never shrink), so maxCapacity is the real cost ceiling.
    autoscaling:
      enabled: true
      maxCapacity: 50
      minFreePercentage: 20
      scalingFactor: 1.5

  # `same-gvc`, because a subchart's values cannot be templated and a workload
  # list would have to hardcode release-prefixed names.
  #
  # The GVC is YOURS and may hold unrelated workloads, so `same-gvc`
  # now means "anything in your GVC may open port 5432" rather than "the advisor
  # and nothing else". If that GVC is shared, narrow it at install time with the
  # real names, e.g.:
  #
  #   --set postgres.internalAccess.type=workload-list \
  #   --set postgres.internalAccess.workloads[0]=//gvc/YOUR_GVC/workload/RELEASE-api \
  #   --set postgres.internalAccess.workloads[1]=//gvc/YOUR_GVC/workload/RELEASE-worker \
  #   --set postgres.internalAccess.workloads[2]=//gvc/YOUR_GVC/workload/RELEASE-scheduler
  #
  # Add the backup workload too if you turn backups on.
  internalAccess:
    type: same-gvc

  # Connection pooling. Off because this app holds few connections — three
  # workloads, one replica each. Turn it on if you ever raise those counts.
  pgbouncer:
    enabled: false

  # OFF because it needs a bucket and a cloud account you create first. TURN IT
  # ON: a volume is not a backup, and the reason this template runs Postgres at
  # all is that a database was lost.
  #
  # `backup.image` IS COUPLED TO `image` ABOVE — tag 18.1.0 backs up Postgres 18,
  # 17.1.0 backs up Postgres 17. Change one and change the other, or pg_dump
  # meets a server it cannot read.
  #
  # `provider: minio` needs its OWN prerequisite dictionary secret holding
  # `accessKey` and `secretKey`, named in backup.minio.credentialsSecretName.
  backup:
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0
    schedule: "0 2 * * *" # daily, 02:00 UTC
    provider: aws # options: aws, gcp, minio
    aws:
      bucket: my-backup-bucket
      region: us-east-1
      cloudAccountName: my-backup-cloudaccount
      policyName: my-backup-policy
      prefix: advisor/backups
