{{- include "cpln-advisor.validate" . -}}
kind: policy
name: {{ include "cpln-advisor.policy.name" . }}
description: CPLN Advisor policy
tags: {{- include "cpln-advisor.tags" . | nindent 4 }}
bindings:
  # `reveal`, NOT `view` — view exposes metadata only, and the cpln://secret/…
  # reference then resolves to an empty string. The containers start happily and
  # behave as though nothing were configured, so this failure is silent.
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cpln-advisor.identity.name" . }}
targetKind: secret
targetLinks:
  # Exactly two secrets — never `target: all`, which would grant reveal on every
  # secret in the org. The bundled postgres subchart brings its own policy for
  # its own credentials secret, so this identity never gets reveal on the
  # database's.
  #
  # 1. The advisor credentials secret YOU created.
  - //secret/{{ .Values.auth.secretName }}
  # 2. The startup script this chart creates and mounts into the API container.
  #    A file-mounted secret is still a secret: without reveal the mount is
  #    empty and the container cannot start.
  - //secret/{{ include "cpln-advisor.startupScript.name" . }}
