{{- include "cpln-advisor.validate" . -}}
{{- /*
  The API's boot script: Guard A (never run outside the configured location),
  the GVC reconciliation, then Alembic and Uvicorn. Delivered as a secret and
  mounted as a file because the GVC check is Python, and nesting Python inside a
  shell string inside a YAML scalar is how a quoting bug ships. Same shape as
  airflow, tidb, pgedge and mongodb-cluster.

  It holds no credential. It is a secret because that is the platform's file
  mount; the identity needs `reveal` on it (see policy.yaml) or the mount is
  empty and the container never starts.
*/}}
kind: secret
name: {{ include "cpln-advisor.startupScript.name" . }}
description: CPLN Advisor API startup script
tags:
  {{- include "cpln-advisor.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    {{- include "cpln-advisor.startupScript" . | nindent 4 }}
