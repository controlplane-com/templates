{{- include "cpln-advisor.validate" . -}}
kind: workload
name: {{ include "cpln-advisor.api.name" . }}
description: CPLN Advisor API
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "cpln-advisor.tags" . | nindent 4 }}
spec:
  type: standard
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "cpln-advisor.identity.name" . }}
  containers:
    - name: api
      image: {{ .Values.images.backend }}
      inheritEnv: false
      minCpu: {{ .Values.api.resources.minCpu | quote }}
      minMemory: {{ .Values.api.resources.minMemory | quote }}
      cpu: {{ .Values.api.resources.maxCpu | quote }}
      memory: {{ .Values.api.resources.maxMemory | quote }}
      ports:
        - number: 8000
          protocol: http
      # The boot script runs Guard A and the GVC reconciliation, then
      # `alembic upgrade head` and uvicorn — migrations before the server, so a
      # deploy that adds a column cannot serve traffic against the old schema.
      # The API is the tier that carries the GVC check: it is always on, its
      # image is the only one with an HTTP client (python3 — probed 2026-08-30:
      # no curl, no wget), and it is the only tier with `outboundAllowCIDR`
      # open, which the call to $CPLN_ENDPOINT needs.
      command: /bin/sh
      args:
        - /scripts/advisor-startup.sh
      volumes:
        - path: /scripts/advisor-startup.sh
          recoveryPolicy: retain # API backfill, declared so rendered == stored
          uri: cpln://secret/{{ include "cpln-advisor.startupScript.name" . }}.payload
      env:
        # Nothing here may be named CPLN_* — that prefix is RESERVED and a
        # workload setting one is rejected. The platform injects CPLN_ORG,
        # CPLN_GVC, CPLN_TOKEN and friends itself, which is where the app reads
        # its org from — and what the boot script's GVC read uses. The Control
        # Plane API token cannot be injected for the same reason: set it once on
        # the Configuration page, where it is stored encrypted in the database.
        - name: LOG_LEVEL
          value: {{ .Values.logLevel | quote }}
        - name: REDIS_URL
          value: {{ include "cpln-advisor.redis.url" . | quote }}
        # Postgres, from the bundled `postgres` subchart. The URL carries the
        # password, so it is a key in YOUR credentials secret rather than a value
        # here. Its username/password/database must match the database's own
        # prerequisite secret — nothing cross-checks the two.
        - name: DATABASE_URL
          value: cpln://secret/{{ .Values.auth.secretName }}.DATABASE_URL
        # The app derives the dashboard's public URL — the Slack "View in Advisor"
        # links and the CORS origin — from Control Plane's built-in env vars, as
        # `https://{ADVISOR_WEB_WORKLOAD}-{gvc alias}.cpln.app`. It defaults to
        # the literal "web", so it MUST be told this chart's actual dashboard
        # workload name or every derived link points at a workload that does not
        # exist. It is NOT built from CPLN_GLOBAL_ENDPOINT, which is the host of
        # whichever workload reads it — internal here, and not where a browser goes.
        - name: ADVISOR_WEB_WORKLOAD
          value: {{ include "cpln-advisor.web.name" . | quote }}
        {{- if .Values.appUrl }}
        # Explicit override, required only for a CUSTOM DOMAIN — that cannot be
        # derived. Setting it wins over the derivation above for both the Slack
        # links and the CORS allowlist.
        - name: APP_URL
          value: {{ .Values.appUrl | quote }}
        # CORS allowlist. Close to inert in this topology — the browser only
        # ever talks to the dashboard, which calls the API server-side — but it
        # matters the moment anything else calls the API from a page.
        - name: ADVISOR_ALLOWED_ORIGINS
          value: {{ .Values.appUrl | quote }}
        {{- end }}
        # Shared with the dashboard, which attaches it to every forwarded
        # request. The API FAILS CLOSED: with it unset every route except
        # /health is refused.
        - name: ADVISOR_API_TOKEN
          value: cpln://secret/{{ .Values.auth.secretName }}.ADVISOR_API_TOKEN
        # Decrypts the AI and Slack credentials held in the database. Change it
        # and those become unreadable — the app reports them as "not set".
        - name: ADVISOR_SECRET_KEY
          value: cpln://secret/{{ .Values.auth.secretName }}.ADVISOR_SECRET_KEY
        # The web login, verified HERE and never on the dashboard, so one
        # workload holds the credentials. Both unset ⇒ nobody can log in.
        - name: ADVISOR_USERNAME
          value: cpln://secret/{{ .Values.auth.secretName }}.ADVISOR_USERNAME
        - name: ADVISOR_PASSWORD
          value: cpln://secret/{{ .Values.auth.secretName }}.ADVISOR_PASSWORD
      readinessProbe:
        httpGet:
          path: /health # the only unauthenticated route, and it leaks nothing
          port: 8000
          scheme: HTTP # API backfill, declared so rendered == stored
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 1 # API backfill, declared so rendered == stored
        successThreshold: 1 # API backfill, declared so rendered == stored
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTP # API backfill, declared so rendered == stored
        initialDelaySeconds: 20
        periodSeconds: 30
        # 5, not 3: the boot script's GVC read is bounded at 22s worst case (3
        # attempts x 6s socket timeout + 2 x 2s backoff, measured in this image
        # against a blackholed address and an accept-never-respond server), and
        # `alembic upgrade head` runs after it. At 3 the container is restarted
        # 80s after start, which a slow migration plus an unreachable control
        # plane can exceed. 5 gives 170s. The platform cap is 20.
        failureThreshold: 5
        successThreshold: 1 # API backfill, declared so rendered == stored
        timeoutSeconds: 1 # API backfill, declared so rendered == stored
  {{- /*
    ONE replica, in the one configured location. Two would race on the same
    startup migration. That is now the only reason — Postgres handles concurrent
    writers fine — so raising it is a question of moving `alembic upgrade head`
    out of the container start command, not of the database.
  */}}
  defaultOptions:
    autoscaling:
      {{- include "cpln-advisor.autoscaling" (dict "scale" (dict "min" 0 "max" 0)) | nindent 6 }}
    capacityAI: true
    debug: false
    suspend: false
    timeoutSeconds: 120 # a scan's Control Plane and LLM calls can take a while
  localOptions:
    - autoscaling:
        {{- include "cpln-advisor.autoscaling" (dict "scale" (dict "min" 1 "max" 1)) | nindent 8 }}
      capacityAI: true
      debug: false
      location: //location/{{ .Values.location }}
      suspend: false
      timeoutSeconds: 120
  # Non-root. `filesystemGroupId` is gone with the shared volume it existed for,
  # and the startup script does not need it: a cpln://secret FILE mount lands
  # world-readable (`-rwxr--r-- root root`), which uid 10001 can read.
  # (Never 1337: that is the mesh proxy's UID, and a container running as it
  # bypasses the Envoy redirect.)
  securityOptions:
    runAsUser: 10001
  firewallConfig:
    external:
      inboundAllowCIDR: [] # never exposed publicly
      inboundBlockedCIDR: []
      # The advisor reads Control Plane's API, MCP and billing services, and
      # calls out to the configured LLM provider and Slack. The boot script's
      # GVC read goes to $CPLN_ENDPOINT over this path too.
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      # Only the dashboard calls the API. Rendered from the roster helper so no
      # workload link is hand-written anywhere in this chart.
      inboundAllowType: workload-list
      inboundAllowWorkload:
        {{- include "cpln-advisor.api.callers" . | nindent 8 }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
