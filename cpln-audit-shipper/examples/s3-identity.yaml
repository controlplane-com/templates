# The Control Plane audit trail to S3, with AWS access from the identity's cloud access (no keys stored).
# Checkpoints go to the same bucket, so the GVC may have any number of locations.
serviceAccount:
  name: cpln-audit-shipper
  keySecret: cpln-audit-shipper-key
sink:
  type: s3
  s3:
    bucket: my-audit-bucket
    region: us-east-1
aws:
  authMode: identity
  identity:
    cloudAccountName: my-aws-cloud-account
    policyRefs:
      - cpln-audit-shipper
