# Temporary credentials in a dictionary secret, used to assume a role in the bucket's account, with SSE-KMS.
interval: 15m
serviceAccount:
  name: cpln-audit-shipper
  keySecret: cpln-audit-shipper-key
sink:
  type: s3
  s3:
    bucket: my-audit-bucket
    region: eu-west-1
    kmsKeyId: alias/audit-trail
aws:
  authMode: secret
  secret:
    name: cpln-audit-shipper-aws-temp
    accessKeyIdKey: accessKeyId
    secretAccessKeyKey: secretAccessKey
    sessionTokenKey: sessionToken
    assumeRole:
      roleArn: arn:aws:iam::123456789012:role/cpln-audit-writer
      externalId: cpln-my-org
      durationSeconds: 3600
