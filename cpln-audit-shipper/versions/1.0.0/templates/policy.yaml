{{- include "cas.validate" . -}}
{{- $sa := printf "//serviceaccount/%s" (include "cas.serviceaccount.name" .) -}}
{{- $secrets := include "cas.secrets" . | fromJsonArray -}}
{{- if .Values.sources.cplnAudit.enabled }}
kind: policy
name: {{ include "cas.name" . }}-audit
description: Lets the audit shipper's service account read its audit contexts
tags:
  {{- include "cas.tags" . | nindent 2 }}
targetKind: auditctx
targetLinks:
  {{- range .Values.sources.cplnAudit.contexts }}
  - //auditctx/{{ . }}
  {{- end }}
bindings:
  - permissions:
      - readAudit
    principalLinks:
      - {{ $sa }}
{{- end }}
{{- if .Values.sources.k8sAudit.enabled }}
---
# readLogs exists only on the org and cannot be narrowed: the key can read every log in the org.
kind: policy
name: {{ include "cas.name" . }}-logs
description: Lets the audit shipper's service account read Kubernetes audit logs (every log in the org)
tags:
  {{- include "cas.tags" . | nindent 2 }}
targetKind: org
target: all
bindings:
  - permissions:
      - readLogs
    principalLinks:
      - {{ $sa }}
{{- end }}
{{- if not .Values.serviceAccount.existingName }}
---
# Each replica adds a key of its own to the release's service account at startup and removes it when it stops.
kind: policy
name: {{ include "cas.name" . }}-key
description: Lets the audit shipper's replicas add and remove their own keys of its service account
tags:
  {{- include "cas.tags" . | nindent 2 }}
targetKind: serviceaccount
targetLinks:
  - {{ $sa }}
bindings:
  - permissions:
      - addKey
      - edit
      - view
    principalLinks:
      - {{ include "cas.identity.link" . }}
{{- end }}
{{- if $secrets }}
---
kind: policy
name: {{ include "cas.name" . }}-secrets
description: Lets the audit shipper reveal its credential secrets
tags:
  {{- include "cas.tags" . | nindent 2 }}
targetKind: secret
targetLinks:
  {{- range $secrets }}
  - //secret/{{ . }}
  {{- end }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - {{ include "cas.identity.link" . }}
{{- end }}
{{- if eq .Values.state.backend "volumeSet" }}
---
# The shipper reads its GVC at startup and refuses volume set state when the GVC has more than one location.
kind: policy
name: {{ include "cas.name" . }}-gvc
description: Lets the audit shipper check that its GVC has a single location
tags:
  {{- include "cas.tags" . | nindent 2 }}
targetKind: gvc
targetLinks:
  - //gvc/{{ .Values.global.cpln.gvc }}
bindings:
  - permissions:
      - view
    principalLinks:
      - {{ include "cas.identity.link" . }}
{{- end }}
