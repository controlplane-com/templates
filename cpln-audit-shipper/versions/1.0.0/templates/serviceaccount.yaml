{{- include "cas.validate" . -}}
{{- if not .Values.serviceAccount.existingName }}
# Reads the audit trail and the logs for this release. Its replicas add and remove their own keys; uninstalling
# deletes it with any key left.
kind: serviceaccount
name: {{ include "cas.serviceaccount.name" . }}
description: Audit shipper {{ .Release.Name }} in GVC {{ .Values.global.cpln.gvc }}
tags:
  {{- include "cas.tags" . | nindent 2 }}
{{- end }}
