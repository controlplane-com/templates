{{- include "cpln-jenkins.validate" . -}}
{{- if .Values.cloud.enabled }}
{{/*
  The Control Plane cloud, as Configuration as Code. Mounted alongside the
  image's own base config, which sets CASC_JENKINS_CONFIG to the directory so
  both files are merged at boot.

  org and gvc come from the platform's own injected variables rather than from
  values, so they cannot drift from where the workload actually runs. The API
  key is interpolated from an env var the platform resolves — it is never
  written into this file.
*/}}
kind: secret
name: {{ include "cpln-jenkins.secret.cloud.name" . }}
type: opaque
tags: {{- include "cpln-jenkins.tags" . | nindent 4 }}
data:
  encoding: plain
  payload: |-
    jenkins:
      clouds:
        - cpln:
            name: "cpln"
            org: "${CPLN_ORG}"
            gvc: {{ include "cpln-jenkins.agentGvc" . | quote }}
            agentWorkload: {{ .Values.cloud.agentWorkload | quote }}
            agentImage: {{ .Values.cloud.agentImage | quote }}
            labels: {{ .Values.cloud.labels | quote }}
            allowJobsWithoutLabels: {{ .Values.cloud.allowJobsWithoutLabels }}
            useUniqueAgents: {{ .Values.cloud.useUniqueAgents }}
            executors: {{ .Values.cloud.executors }}
            cpu: {{ .Values.cloud.cpu }}
            memory: {{ .Values.cloud.memory }}
            retentionMins: {{ .Values.cloud.retentionMins }}
            provisioningCooldownSecs: {{ .Values.cloud.provisioningCooldownSecs }}
            volumeSetName: ""
            volumeSetPath: ""
            identity: ""
            jenkinsControllerUrl: "http://{{ include "cpln-jenkins.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:8080/"
            apiKey: "${CONTROLPLANE_API_KEY}"
{{- end }}
