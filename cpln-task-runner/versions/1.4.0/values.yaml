# Same image for both API and Worker workloads
image: controlplanecorporation/cpln-task-runner:0.4

# API configuration
api:
  # Enable/disable the API workload
  enabled: true
  # Number of replicas
  replicas:
    min: 1
    max: 3
  # Container port
  port: 8080
  # Public access configuration. DEFAULTS TO FALSE — see the README.
  # /v1/enqueue has NO authentication whatsoever, and it does not merely accept
  # registered client IDs: an UNKNOWN client_id is accepted and AUTO-REGISTERED
  # (measured). So with this true, any stranger can make the worker issue arbitrary
  # outbound HTTP with a method, headers and body of their choosing. There is no
  # knob that closes that — the application has no client authentication at all.
  # Turn this on only if you accept an open queue, or front it with an
  # authenticating proxy of your own.
  public:
    enabled: false
    # Not used for routing by this chart version (it does not change the endpoint path)
    pathPrefix: ""
  # ─── Admin API authentication (REQUIRED prerequisite secret) ─────────────────
  # /admin/* creates, edits and deletes clients and rate-limit tiers. It is guarded
  # by the X-Admin-Key header, and the key comes from an `opaque` secret (encoding:
  # plain) whose payload IS the key.
  #
  # THE SECRET MUST EXIST BEFORE YOU INSTALL — otherwise the deployment wedges
  # silently and `cpln logs` returns nothing at all. See Prerequisites in the README.
  #
  # Setting this to "" leaves the admin endpoints UNAUTHENTICATED, and is rejected
  # outright while api.public.enabled is true.
  admin:
    apiKeySecretName: my-cpln-task-runner-admin-key
  # Resource allocation
  resources:
    cpu: 500m
    memory: 512Mi
  # Environment variables
  env:
    # Log level (debug, info, warn, error)
    logLevel: info
    # OpenTelemetry endpoint (leave empty to disable tracing)
    otelEndpoint: ""
    # Redis connection retries
    connectRetries: 30
    # Redis retry interval in seconds
    retryIntervalSec: 2

# Worker configuration
worker:
  # Enable/disable the Worker workload
  enabled: true
  # Number of replicas
  replicas:
    min: 1
    max: 5
  # Container port (for health checks)
  port: 8082
  # Resource allocation
  resources:
    cpu: 1
    memory: 1Gi
  # Environment variables
  env:
    # Log level (debug, info, warn, error)
    logLevel: info
    # Number of concurrent workers per replica
    concurrency: 10
    # Task timeout in seconds (default: 30 minutes)
    taskTimeoutSec: 1800
    # Maximum retry attempts
    maxRetry: 5
    # Allow tasks to target private/internal URLs
    allowPrivateUrls: false
    # Circuit breaker failure threshold
    cbFailureThreshold: 5
    # Circuit breaker timeout in seconds
    cbTimeoutSec: 30
    # Redis connection retries
    connectRetries: 30
    # Redis retry interval in seconds
    retryIntervalSec: 2
    # OpenTelemetry endpoint (leave empty to disable tracing)
    otelEndpoint: ""

# ─── Bundled Redis + Sentinel ───────────────────────────────────────────────
# The Redis and Sentinel passwords come from TWO REQUIRED prerequisite `dictionary`
# secrets, each with the key `password`: one for Redis, one for Sentinel. The Redis
# subchart, the API and the Worker read both.
#
# THE SECRETS MUST EXIST BEFORE YOU INSTALL — otherwise the deployment wedges
# silently and `cpln logs` returns nothing at all. See Prerequisites in the README.
redis:
  redis:
    auth:
      fromSecret:
        enabled: true          # must stay true
        name: my-cpln-task-runner-redis-credentials   # prerequisite dictionary secret for Redis
        passwordKey: password  # key holding the Redis password
    persistence:
      enabled: true
  sentinel:
    auth:
      fromSecret:
        enabled: true          # must stay true
        name: my-cpln-task-runner-sentinel-credentials   # prerequisite dictionary secret for Sentinel
        passwordKey: password  # key holding the Sentinel password
    persistence:
      enabled: true
