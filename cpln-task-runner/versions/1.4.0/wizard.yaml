# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Control Plane Task Runner

# The API and Worker are serverless, but the bundled Redis and Sentinel are stateful workloads with no
# location handling: every extra GVC location would run its own, separate Redis cluster.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: secrets
    title: Secrets
    description: The prerequisite secrets the task runner and its Redis read.
    fields:
      - type: note
        severity: warning
        text: >-
          These secrets must exist **before** you install or upgrade. If one is missing, the deployment waits
          and `cpln logs` shows nothing at all.
      # Upgrades from <1.4.0. In oldSelf, the Sentinel secret name is the new placeholder exactly when the
      # previous release had createSecret true (the computed migration below), and the Redis secret name is the
      # previous secretName (the rename migration below). The note is shown when the installed values are
      # unknown too (oldSelf null), with the text covering both cases.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.4.0') < 0 &&
          (oldSelf == null || oldSelf.redis.sentinel.auth.fromSecret.name == 'my-cpln-task-runner-sentinel-credentials')
        text: >-
          If the previous version created the Redis secret itself (createSecret true, the default), this upgrade
          deletes it: `task-runner-secrets`, or the name in your previous `secretName`. Before upgrading, read it
          with `cpln secret reveal NAME -o yaml` and put the SAME passwords in two new secrets under the key
          `password`: `redis-password` in the Redis secret, `redis-sentinel-password` in the Sentinel secret.
          Redis and Sentinel keep the passwords they started with. A secret of your own (createSecret false) is
          kept, with its key names. The upgrade restarts Redis and Sentinel one node at a time over a few
          minutes, and enqueue can fail briefly while the primary moves.
        textExpression: >-
          'The previous version created the secret `' + oldSelf.redis.redis.auth.fromSecret.name + '` itself, ' +
          'and this upgrade deletes it. Before upgrading, read it with `cpln secret reveal ' +
          oldSelf.redis.redis.auth.fromSecret.name + ' -o yaml` and put the SAME passwords in two new secrets ' +
          'under the key `password`: `redis-password` in the Redis secret, `redis-sentinel-password` in the ' +
          'Sentinel secret. Redis and Sentinel keep the passwords they started with. The upgrade restarts Redis ' +
          'and Sentinel one node at a time over a few minutes, and enqueue can fail briefly while the primary moves.'
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.4.0') < 0 && oldSelf != null &&
          oldSelf.redis.sentinel.auth.fromSecret.name != 'my-cpln-task-runner-sentinel-credentials'
        text: >-
          Your own Redis secret (createSecret false) is kept, with its key names. The upgrade restarts Redis and
          Sentinel one node at a time over a few minutes, and enqueue can fail briefly while the primary moves.
      - path: redis.redis.auth.fromSecret.name
        type: ref
        label: Redis credentials secret
        required: true
        description: A dictionary secret with the Redis password under the key `password`.
        help: >-
          Sentinel keeps the Redis password it started with, so editing the secret alone locks the API and
          Worker out. To change it, follow "Rotating the Redis and Sentinel passwords" in the README.
        docs: "#prerequisites"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeysFrom: "[self.redis.redis.auth.fromSecret.passwordKey]"
          create:
            suggestName: "context.releaseName + '-task-runner-redis-credentials'"
            hint: "Generate the password with: openssl rand -hex 24"
      - path: redis.sentinel.auth.fromSecret.name
        type: ref
        label: Sentinel credentials secret
        required: true
        description: A dictionary secret with the Sentinel password under the key `password`.
        help: >-
          Sentinel keeps the password it started with, so editing the secret alone locks the API and Worker
          out. To change it, follow "Rotating the Redis and Sentinel passwords" in the README.
        docs: "#prerequisites"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeysFrom: "[self.redis.sentinel.auth.fromSecret.passwordKey]"
          create:
            suggestName: "context.releaseName + '-task-runner-sentinel-credentials'"
            hint: "Generate the password with: openssl rand -hex 24"
      - path: redis.redis.auth.fromSecret.passwordKey
        type: string
        label: Redis password key
        required: true
        pattern: '^[-._a-zA-Z0-9]+$'
        patternMessage: Use letters, digits, -, . and _.
        advanced: true
        description: The key in the Redis credentials secret that holds the Redis password.
      - path: redis.sentinel.auth.fromSecret.passwordKey
        type: string
        label: Sentinel password key
        required: true
        pattern: '^[-._a-zA-Z0-9]+$'
        patternMessage: Use letters, digits, -, . and _.
        advanced: true
        description: The key in the Sentinel credentials secret that holds the Sentinel password.
      - path: api.admin.apiKeySecretName
        type: ref
        label: Admin API key secret
        description: >-
          An opaque secret whose payload is the key for `/admin/*` (the `X-Admin-Key` header). Empty is
          allowed only while the API is not public, and leaves the admin endpoints unauthenticated.
        help: >-
          Create the payload with `printf`, not `echo`, or the trailing newline becomes part of the key. After
          changing the key, force a redeployment of the API workload.
        docs: "#rotating-the-admin-key"
        ref:
          kind: secret
          format: name
          filter: { secretType: [opaque] }
          mustExist: error
          allowCreate: true
          create:
            encoding: plain
            suggestName: "context.releaseName + '-task-runner-admin-key'"
            hint: "Generate the content with: openssl rand -hex 32"
      - type: note
        severity: warning
        when: self.api.enabled && self.api.admin.apiKeySecretName == ''
        text: >-
          No admin API key secret: anything in this GVC can create, edit and delete clients and rate-limit tiers
          through `/admin/*`. Choose one unless that is acceptable.
    rules:
      - rule: >-
          !has(self.createSecret) && !has(self.secretName) && !has(self.redis.redisPassword) &&
          !has(self.redis.sentinelPassword)
        mirrors: cpln-task-runner.validateRedisCredentials
        paths: [redis.redis.auth.fromSecret.name]
        message: >-
          createSecret, secretName, redis.redisPassword and redis.sentinelPassword were removed in 1.4.0: the
          passwords now come from the Redis and Sentinel credentials secrets. Remove those keys from the values.
      - rule: self.redis.redis.auth.fromSecret.name != '' && self.redis.sentinel.auth.fromSecret.name != ''
        mirrors: cpln-task-runner.validateRedisCredentials
        paths: [redis.redis.auth.fromSecret.name, redis.sentinel.auth.fromSecret.name]
        message: Name the Redis and Sentinel credentials secrets; the chart does not render without them.
      - rule: >-
          self.redis.redis.auth.fromSecret.name != 'task-runner-secrets' &&
          self.redis.sentinel.auth.fromSecret.name != 'task-runner-secrets'
        mirrors: cpln-task-runner.validateRedisCredentials
        paths: [redis.redis.auth.fromSecret.name, redis.sentinel.auth.fromSecret.name]
        message: >-
          task-runner-secrets is the secret version 1.3.0 and earlier created itself, and upgrading deletes it.
          Create the credentials secrets under new names holding the same passwords.
      # A previous release with createSecret true and a custom secretName: the upgrade deletes that secret too.
      # oldSelf holds the previous secretName at redis.redis.auth.fromSecret.name (the rename migration below);
      # the literal task-runner-secrets is left to the rule above.
      - when: >-
          context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0
        rule: >-
          oldSelf == null ||
          oldSelf.redis.sentinel.auth.fromSecret.name != 'my-cpln-task-runner-sentinel-credentials' ||
          oldSelf.redis.redis.auth.fromSecret.name == 'task-runner-secrets' ||
          self.redis.redis.auth.fromSecret.name != oldSelf.redis.redis.auth.fromSecret.name
        paths: [redis.redis.auth.fromSecret.name]
        message: >-
          The previous version created this secret itself (its secretName), and this upgrade deletes it. Create
          the credentials secrets under new names holding the same passwords.
        messageExpression: >-
          'The previous version created ' + oldSelf.redis.redis.auth.fromSecret.name + ' itself (its secretName), and this upgrade deletes it. Create the credentials secrets under new names holding the same passwords.'
      - when: >-
          context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0
        rule: >-
          oldSelf == null ||
          oldSelf.redis.sentinel.auth.fromSecret.name != 'my-cpln-task-runner-sentinel-credentials' ||
          oldSelf.redis.redis.auth.fromSecret.name == 'task-runner-secrets' ||
          self.redis.sentinel.auth.fromSecret.name != oldSelf.redis.redis.auth.fromSecret.name
        paths: [redis.sentinel.auth.fromSecret.name]
        message: >-
          The previous version created this secret itself (its secretName), and this upgrade deletes it. Create
          the credentials secrets under new names holding the same passwords.
        messageExpression: >-
          'The previous version created ' + oldSelf.redis.redis.auth.fromSecret.name + ' itself (its secretName), and this upgrade deletes it. Create the credentials secrets under new names holding the same passwords.'
      - rule: >-
          self.redis.redis.auth.fromSecret.passwordKey != '' && self.redis.sentinel.auth.fromSecret.passwordKey != ''
        mirrors: cpln-task-runner.validateRedisCredentials
        paths: [redis.redis.auth.fromSecret.passwordKey, redis.sentinel.auth.fromSecret.passwordKey]
        message: Name the keys that hold the Redis and Sentinel passwords.
      - rule: self.redis.redis.auth.fromSecret.enabled && self.redis.sentinel.auth.fromSecret.enabled
        mirrors: cpln-task-runner.validateRedisCredentials
        paths: [redis.redis.auth.fromSecret.name]
        message: >-
          Keep redis.redis.auth.fromSecret.enabled and redis.sentinel.auth.fromSecret.enabled true: the API and
          Worker always authenticate to Redis and Sentinel.
      - rule: "!has(self.api.env.adminApiKey) && !has(self.redis.admin)"
        mirrors: cpln-task-runner.validateAdmin
        paths: [api.admin.apiKeySecretName]
        message: >-
          api.env.adminApiKey and redis.admin were removed in 1.3.0: the admin key is an opaque secret chosen
          here. Remove them from the values.
      - when: self.api.public.enabled
        rule: self.api.admin.apiKeySecretName != ''
        mirrors: cpln-task-runner.validate
        paths: [api.admin.apiKeySecretName, api.public.enabled]
        message: >-
          With public access on, an admin API key secret is required; without one, anyone could manage clients
          and rate-limit tiers.

  - id: api
    title: API
    description: The HTTP endpoint that accepts tasks and serves the admin endpoints.
    sections:
      - id: api
        title: API workload
        toggle: api.enabled
        docs: "#api-workload"
        fields:
          - path: api.public.enabled
            type: boolean
            label: Serve on the public HTTPS endpoint
            description: >-
              `/v1/enqueue` has no authentication and registers unknown clients, so anyone who reaches it can
              make the workers send arbitrary HTTP requests. Keep it off unless an authenticating proxy fronts it.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.3.0') < 0
            text: >-
              Public access now defaults to off (1.2.x defaulted to on), so this upgrade removes the public
              endpoint unless you turn it on here. `/v1/enqueue` is unauthenticated either way.
          - path: api.replicas.min
            type: integer
            label: Minimum replicas
            required: true
            min: 0
            suggestions: [1, 2]
          - path: api.replicas.max
            type: integer
            label: Maximum replicas
            required: true
            min: 1
            suggestions: [3, 5]
          - path: api.resources
            type: resources
            label: Resources
            required: true
            description: Per replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: api.env.logLevel
            type: enum
            label: Log level
            widget: segmented
            required: true
            options:
              - { value: debug, label: Debug }
              - { value: info, label: Info }
              - { value: warn, label: Warn }
              - { value: error, label: Error }
          - path: api.env.otelEndpoint
            type: string
            label: OpenTelemetry endpoint
            description: "Leave empty to disable tracing. The built-in collector is `tracing.controlplane:4318`."
            docs: "#opentelemetry"
          - path: api.port
            type: integer
            label: Port
            required: true
            min: 1
            max: 65535
            advanced: true
          - path: api.env.connectRetries
            type: integer
            label: Redis connection attempts
            required: true
            min: 1
            advanced: true
            description: At startup.
          - path: api.env.retryIntervalSec
            type: integer
            label: Seconds between Redis connection attempts
            required: true
            min: 1
            advanced: true
        rules:
          - rule: self.api.replicas.max >= self.api.replicas.min
            paths: [api.replicas.max]
            message: Set the maximum replicas at or above the minimum.
          - rule: "!(self.api.port in [8012, 8022, 9090, 9091, 15000, 15001, 15006, 15020, 15021, 15090, 41000])"
            paths: [api.port]
            message: >-
              Control Plane reserves this port (8012, 8022, 9090, 9091, 15000, 15001, 15006, 15020, 15021, 15090 and
              41000 are refused at install); choose another.

  - id: worker
    title: Worker
    description: The workers that deliver each task to its target URL.
    sections:
      - id: worker
        title: Worker workload
        toggle: worker.enabled
        docs: "#worker-workload"
        fields:
          - path: worker.replicas.min
            type: integer
            label: Minimum replicas
            required: true
            min: 1
            description: The workers pull tasks from Redis and receive no requests, so at least one must run.
            suggestions: [1, 2]
          - path: worker.replicas.max
            type: integer
            label: Maximum replicas
            required: true
            min: 1
            suggestions: [5, 10]
          - path: worker.resources
            type: resources
            label: Resources
            required: true
            description: Per replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: worker.env.concurrency
            type: integer
            label: Concurrent tasks per replica
            required: true
            min: 1
          - path: worker.env.taskTimeoutSec
            type: integer
            label: Task timeout
            unit: seconds
            required: true
            min: 1
          - path: worker.env.maxRetry
            type: integer
            label: Delivery attempts before a task is archived
            required: true
            min: 0
          - path: worker.env.allowPrivateUrls
            type: boolean
            label: Allow tasks to target private URLs
            description: >-
              On, any enqueued task can reach anything the worker can route to, including internal addresses.
          - path: worker.env.cbFailureThreshold
            type: integer
            label: Circuit breaker failure threshold
            required: true
            min: 1
            advanced: true
            description: Failures before the circuit opens.
          - path: worker.env.cbTimeoutSec
            type: integer
            label: Circuit breaker timeout
            unit: seconds
            required: true
            min: 1
            advanced: true
            description: How long the circuit stays open before retrying.
          - path: worker.env.logLevel
            type: enum
            label: Log level
            widget: segmented
            required: true
            advanced: true
            options:
              - { value: debug, label: Debug }
              - { value: info, label: Info }
              - { value: warn, label: Warn }
              - { value: error, label: Error }
          - path: worker.env.otelEndpoint
            type: string
            label: OpenTelemetry endpoint
            advanced: true
            description: Leave empty to disable tracing.
          - path: worker.port
            type: integer
            label: Health check port
            required: true
            min: 1
            max: 65535
            advanced: true
          - path: worker.env.connectRetries
            type: integer
            label: Redis connection attempts
            required: true
            min: 1
            advanced: true
            description: At startup.
          - path: worker.env.retryIntervalSec
            type: integer
            label: Seconds between Redis connection attempts
            required: true
            min: 1
            advanced: true
        rules:
          - rule: self.worker.replicas.max >= self.worker.replicas.min
            paths: [worker.replicas.max]
            message: Set the maximum replicas at or above the minimum.
          - rule: "!(self.worker.port in [8012, 8022, 9090, 9091, 15000, 15001, 15006, 15020, 15021, 15090, 41000])"
            paths: [worker.port]
            message: >-
              Control Plane reserves this port (8012, 8022, 9090, 9091, 15000, 15001, 15006, 15020, 15021, 15090 and
              41000 are refused at install); choose another.

  - id: redis
    title: Redis
    description: The bundled Redis with Sentinel failover that stores the queues.
    sections:
      - title: Persistence
        fields:
          - path: redis.redis.persistence.enabled
            type: boolean
            label: Keep Redis data on a volume
            description: >-
              Off, queued tasks are lost whenever a Redis node restarts. Choose now: changing it after install
              replaces the storage and can lose queued tasks.
          - path: redis.sentinel.persistence.enabled
            type: boolean
            label: Keep Sentinel state on a volume
            description: >-
              Lets Sentinel remember the current primary across restarts. Choose now: changing it after install
              replaces the storage.
        rules:
          - rule: >-
              oldSelf == null ||
              (self.redis.redis.persistence.enabled == oldSelf.redis.redis.persistence.enabled &&
              self.redis.sentinel.persistence.enabled == oldSelf.redis.sentinel.persistence.enabled)
            severity: warning
            paths: [redis.redis.persistence.enabled, redis.sentinel.persistence.enabled]
            message: >-
              Changing persistence on a running release replaces the Redis and Sentinel workloads' storage;
              queued tasks can be lost. Keep the installed setting.

# 1.0.0 bundles redis 3.0.2; 1.1.0 and later bundle redis 3.1.1 or later, which renamed the volume sets
# ({release}-redis → {release}-redis-vs, {release}-sentinel → {release}-sentinel-vs), so an in-place upgrade from
# 1.0.0 deletes the volume sets the release runs on. Same rule as the redis template's own descriptor.
rules:
  - rule: >-
      context.mode != 'upgrade' || context.fromVersion == null || oldSelf == null ||
      semverCompare(context.fromVersion, '1.1.0') >= 0 ||
      (!oldSelf.redis.redis.persistence.enabled && !oldSelf.redis.sentinel.persistence.enabled)
    message: >-
      Do not upgrade a 1.0.0 release in place: its bundled Redis (3.0.2) names the volume sets differently
      (RELEASE-redis and RELEASE-sentinel; later versions use RELEASE-redis-vs and RELEASE-sentinel-vs), so the
      upgrade deletes the volume sets this release runs on, with the queued tasks. Install this version as a new
      release, move producers and drain the old queue, then uninstall the old release.
    messageExpression: >-
      'Do not upgrade a 1.0.0 release in place: its bundled Redis (3.0.2) names the volume sets ' +
      context.releaseName + '-redis and ' + context.releaseName + '-sentinel, and this version names them ' +
      context.releaseName + '-redis-vs and ' + context.releaseName + '-sentinel-vs, so the upgrade deletes the ' +
      'volume sets this release runs on, with the queued tasks. Install this version as a new release, move ' +
      'producers and drain the old queue, then uninstall the old release.'

yamlOnly:
  - path: image
    reason: One image serves both workloads and is pinned to the version this chart was built for.
  - path: api.public.pathPrefix
    reason: Has no routing effect in this chart version.
  - path: redis.redis.auth.fromSecret.enabled
    reason: Must stay true (the chart refuses false); the API and Worker always authenticate to Redis.
  - path: redis.sentinel.auth.fromSecret.enabled
    reason: Must stay true (the chart refuses false); the API and Worker always authenticate to Sentinel.

migrations:
  # The never-changed passwords differ: 1.0.0-1.2.x shipped mypassword for both, 1.3.0 the change-me- values.
  - fromVersions: "<1.3.0"
    from: redis.redisPassword
    note: >-
      The Redis password is now in the Redis credentials secret (key password). Put the password the release
      runs with today there (read it with `cpln secret reveal NAME -o yaml`, NAME being `task-runner-secrets`
      or your previous `secretName`); a password never changed is `mypassword`.
  - fromVersions: ">=1.3.0 <1.4.0"
    from: redis.redisPassword
    note: >-
      The Redis password is now in the Redis credentials secret (key password). Put the password the release
      runs with today there (read it with `cpln secret reveal NAME -o yaml`, NAME being `task-runner-secrets`
      or your previous `secretName`); a password never changed is `change-me-cpln-task-runner-redis`.
  - fromVersions: "<1.3.0"
    from: redis.sentinelPassword
    note: >-
      The Sentinel password is now in the Sentinel credentials secret (key password). Put the password the
      release runs with today there; a password never changed is `mypassword`.
  - fromVersions: ">=1.3.0 <1.4.0"
    from: redis.sentinelPassword
    note: >-
      The Sentinel password is now in the Sentinel credentials secret (key password). Put the password the
      release runs with today there; a password never changed is `change-me-cpln-task-runner-sentinel`.
  - fromVersions: "<1.4.0"
    from: createSecret
    note: >-
      The chart no longer creates the Redis secret. If it did (createSecret true, the default), this upgrade
      deletes it (`task-runner-secrets`, or your previous `secretName`): create the Redis and Sentinel
      credentials secrets under new names and choose them under Secrets. A secret of your own (createSecret
      false) is kept.
  # A release that brought its own secret (createSecret: false) keeps it, with its key names: the passwordKey
  # defaults changed (redis-password → password, redis-sentinel-password → password), and a rename
  # alone would hand such a release the new names its secret does not have.
  - fromVersions: "<1.4.0"
    to: redis.redis.auth.fromSecret.passwordKey
    valueExpr: "self.createSecret ? 'password' : self.redis.redis.auth.fromSecret.passwordKey"
    note: Your own Redis secret is kept with its key names.
  - fromVersions: "<1.4.0"
    to: redis.sentinel.auth.fromSecret.passwordKey
    valueExpr: "self.createSecret ? 'password' : self.redis.sentinel.auth.fromSecret.passwordKey"
    note: Your own Sentinel secret is kept with its key names.
  # With createSecret: true, 1.3.0 also pointed fromSecret.name at the secret it created, which this upgrade deletes.
  - fromVersions: "<1.4.0"
    to: redis.redis.auth.fromSecret.name
    valueExpr: "self.createSecret ? 'my-cpln-task-runner-redis-credentials' : self.redis.redis.auth.fromSecret.name"
    note: The secret 1.3.0 created is deleted by this upgrade; choose a new Redis credentials secret.
  - fromVersions: "<1.4.0"
    to: redis.sentinel.auth.fromSecret.name
    valueExpr: "self.createSecret ? 'my-cpln-task-runner-sentinel-credentials' : self.redis.sentinel.auth.fromSecret.name"
    note: The secret 1.3.0 created is deleted by this upgrade; choose a new Sentinel credentials secret.
  # secretName is renamed, not dropped, so that oldSelf keeps it: the secret it names is deleted by the upgrade,
  # and the Secrets rule refuses it. Migrations build oldSelf in this order, so this rename (after the computed
  # migration above) leaves oldSelf.redis.redis.auth.fromSecret.name = the previous secretName. In the carried
  # values the computed migration wins over a rename at the same path (WIZARD_AUTHORING §9.2), so the picker
  # still gets the new placeholder.
  - fromVersions: "<1.4.0"
    from: secretName
    to: redis.redis.auth.fromSecret.name
    note: >-
      The Redis and Sentinel credentials secrets are now chosen under Secrets. If the previous version created
      the secret named here (createSecret true), this upgrade deletes it, so neither can use it.
