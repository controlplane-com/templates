# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: CPLN Trivy
# No gvc block: a cron workload and a serverless workload, no volume set. A GVC with several locations
# runs one scan per location (an info rule on the Scanning step says so), which costs but does not break.

steps:
  - id: access
    title: Secrets and access
    description: The two prerequisite secrets and the service account Trivy pulls images with.
    fields:
      - type: note
        severity: warning
        when: >-
          context.mode == 'install' ||
          (context.fromVersion != null && semverCompare(context.fromVersion, '1.2.0') < 0)
        text: >-
          Both secrets and the service account must exist **before** you install or upgrade. If a secret is
          missing, the deployment waits on it and `cpln logs` shows nothing at all; the reason is in
          `status.versions[].message` of `cpln workload get-deployments web-server --gvc GVC_NAME -o yaml`.
          It recovers on its own within about 10 minutes of the secret being created, or at once with
          `cpln workload force-redeployment web-server --gvc GVC_NAME`.
        textExpression: >-
          'Both secrets and the service account must exist **before** you install or upgrade. If a secret is
          missing, the deployment waits on it and `cpln logs` shows nothing at all; the reason is in
          `status.versions[].message` of `cpln workload get-deployments web-server --gvc ' +
          (context.gvc != null ? context.gvc : 'GVC_NAME') + ' -o yaml`. It recovers on its own within about
          10 minutes of the secret being created, or at once with `cpln workload force-redeployment web-server --gvc ' +
          (context.gvc != null ? context.gvc : 'GVC_NAME') + '`.'
      # 1.0.0 and 1.1.0 rendered postToken into the chart-owned dictionary secret RELEASE-secret (key
      # POST_TOKEN); 1.2.0 has no secret.yaml, so the upgrade deletes it. Both workloads switch to the new
      # secret in the same upgrade, so a new token works too (the docs page says so); the README's
      # "a different one ... 401" applies only to a client outside this release.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.2.0') < 0
        text: >-
          Version 1.2.0 moved the report post token out of the values into an opaque secret you own, because
          it guards an upload endpoint on the public internet. **Before you upgrade**, copy the token the
          release uses today, because the upgrade deletes the secret that holds it:
          `cpln secret reveal RELEASE_NAME-secret -o json | jq -r .data.POST_TOKEN | cpln secret create-opaque --name POST_TOKEN_SECRET_NAME --encoding plain -f -`.
          Then choose that secret below. If the token is `changeme`, the published default of earlier versions,
          create the secret with a new random token instead
          (`printf '%s' "$(openssl rand -hex 32)" | cpln secret create-opaque --name POST_TOKEN_SECRET_NAME --encoding plain -f -`):
          the daemon and the web server both switch to the secret in this upgrade. See
          [Upgrading from 1.1.0](/template-catalog/templates/cpln-trivy#upgrading-from-1-1-0).
        textExpression: >-
          'Version 1.2.0 moved the report post token out of the values into an opaque secret you own, because
          it guards an upload endpoint on the public internet. **Before you upgrade**, copy the token the
          release uses today, because the upgrade deletes the secret that holds it: `cpln secret reveal ' +
          context.releaseName + '-secret -o json | jq -r .data.POST_TOKEN | cpln secret create-opaque --name
          POST_TOKEN_SECRET_NAME --encoding plain -f -`. Then choose that secret below. If the token is
          `changeme`, the published default of earlier versions, create the secret with a new random token
          instead (`printf "%s" "$(openssl rand -hex 32)" | cpln secret create-opaque --name POST_TOKEN_SECRET_NAME
          --encoding plain -f -`): the daemon and the web server both switch to the secret in this upgrade. See
          [Upgrading from 1.1.0](/template-catalog/templates/cpln-trivy#upgrading-from-1-1-0).'
      # 1.0.0: trivyAuth.type inline wrote the key into RELEASE-secret (key SERVICE_ACCOUNT_KEY); existingSecret
      # read a DICTIONARY secret's key. 1.1.0 and later read the .payload of an OPAQUE secret.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.1.0') < 0
        text: >-
          Version 1.1.0 changed how Trivy finds the service account key: it now reads the whole value of an
          **opaque** secret. If the release pasted the key into the values (`trivyAuth.type: inline`), copy it
          before you upgrade, because the upgrade deletes the secret that holds it:
          `cpln secret reveal RELEASE_NAME-secret -o json | jq -r .data.SERVICE_ACCOUNT_KEY | cpln secret create-opaque --name REGISTRY_SECRET_NAME --encoding plain -f -`.
          If it read a dictionary secret (`trivyAuth.type: existingSecret`), copy that key into an opaque secret
          the same way (`jq -r .data.KEY_NAME`); a dictionary secret does not work any more. A key that was in
          the values was stored in the Helm release: consider adding a new key to the service account and
          deleting the old one.
        textExpression: >-
          'Version 1.1.0 changed how Trivy finds the service account key: it now reads the whole value of an
          **opaque** secret. If the release pasted the key into the values (`trivyAuth.type: inline`), copy it
          before you upgrade, because the upgrade deletes the secret that holds it: `cpln secret reveal ' +
          context.releaseName + '-secret -o json | jq -r .data.SERVICE_ACCOUNT_KEY | cpln secret create-opaque
          --name REGISTRY_SECRET_NAME --encoding plain -f -`. If it read a dictionary secret
          (`trivyAuth.type: existingSecret`), copy that key into an opaque secret the same way
          (`jq -r .data.KEY_NAME`); a dictionary secret does not work any more. A key that was in the values
          was stored in the Helm release: consider adding a new key to the service account and deleting the
          old one.'
      - path: postToken.secretName
        type: ref
        label: Report post token secret
        required: true
        description: >-
          An opaque secret (encoding plain) holding a random bearer token. The daemon presents it when it
          uploads a report to the web server, whose upload endpoint is on the public internet.
        help: >-
          Create the secret with
          `printf '%s' "$(openssl rand -hex 32)" | cpln secret create-opaque --name POST_TOKEN_SECRET_NAME --encoding plain -f -`.
          To rotate the token later, apply the whole secret with the new value, then run
          `cpln workload force-redeployment` on both `daemon` and `web-server`: a running workload keeps the
          old token until it is redeployed, and uploads fail with 401 while the two disagree.
        docs: "#prerequisites"
        ref:
          kind: secret
          format: name
          filter: { secretType: [opaque] }
          mustExist: error
          allowCreate: true
          create:
            encoding: plain
            suggestName: "context.releaseName + '-trivy-post-token'"
            hint: "Generate the content with: openssl rand -hex 32"
      - path: serviceAccountName
        type: ref
        label: Registry service account
        required: true
        description: >-
          The service account Trivy pulls images with. The template grants it `pull` and `view` on every
          image in the org.
        help: >-
          [Create a service account](/reference/serviceaccount) and add a key to it; copy the key value, which
          cannot be read again later. The key goes in the secret below.
        ref:
          kind: serviceaccount
          format: name
          mustExist: error
      - path: trivyAuth.secretName
        type: ref
        label: Service account key secret
        required: true
        description: An opaque secret (encoding plain) holding only the key of the service account above.
        help: >-
          Create the secret with
          `printf '%s' 'SERVICE-ACCOUNT-KEY' | cpln secret create-opaque --name REGISTRY_SECRET_NAME --encoding plain -f -`.
          To replace the key, add a new key to the service account, apply the secret with it, run
          `cpln workload force-redeployment daemon`, then delete the old key.
        ref:
          kind: secret
          format: name
          filter: { secretType: [opaque] }
          mustExist: error
          allowCreate: true
          create:
            encoding: plain
            suggestName: "context.releaseName + '-trivy-registry-key'"
            hint: Paste the key of the registry service account.
      # policy.yaml: manage on target all images (the scan tags), and pull/view on target all images for the
      # service account. Deliberate: the template scans the whole registry.
      - type: note
        text: >-
          A scan covers **every image in the org**, not only images this release created. To do that the
          template's identity holds `manage` on all images in the org (to write the `cpln/trivy-scan` and
          `cpln/trivy-scan-time` tags), and the service account above gets `pull` and `view` on all images.
          These org-wide grants are what the scanner needs; treat the workloads as security-sensitive.
    rules:
      - rule: type(self.postToken) == map
        mirrors: cpln-trivy.validatePostToken
        paths: [postToken.secretName]
        message: >-
          postToken is no longer a plain value since 1.2.0. Put the token in an opaque secret, choose it here,
          and remove the postToken value.
      - rule: self.postToken.secretName != null && self.postToken.secretName != ''
        mirrors: cpln-trivy.validatePostToken
        paths: [postToken.secretName]
        message: The report post token secret is required.
      - rule: self.trivyAuth.secretName != null && self.trivyAuth.secretName != ''
        mirrors: cpln-trivy.validateAuth
        paths: [trivyAuth.secretName]
        message: The service account key secret is required.
      # The chart-owned RELEASE-secret of 1.0.0 and 1.1.0 is deleted by this upgrade.
      - rule: >-
          context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '1.2.0') >= 0 ||
          self.postToken.secretName != context.releaseName + '-secret'
        severity: warning
        paths: [postToken.secretName]
        message: >-
          The installed version created this secret itself, and the upgrade deletes it. Copy the token into an
          opaque secret under another name and choose that one.
      - rule: >-
          context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '1.2.0') >= 0 ||
          self.trivyAuth.secretName != context.releaseName + '-secret'
        severity: warning
        paths: [trivyAuth.secretName]
        message: >-
          The installed version created this secret itself, and the upgrade deletes it. Copy the key into an
          opaque secret under another name and choose that one.
      - rule: self.postToken.secretName == '' || self.postToken.secretName != self.trivyAuth.secretName
        severity: warning
        paths: [trivyAuth.secretName]
        message: >-
          Choose two different secrets. With one secret, the service account key would also be the bearer token
          of the public upload endpoint.
      - rule: >-
          oldSelf == null || context.fromVersion == null || semverCompare(context.fromVersion, '1.2.0') < 0 ||
          self.postToken.secretName == oldSelf.postToken.secretName
        severity: info
        paths: [postToken.secretName]
        message: >-
          The daemon and the web server both switch to the new secret in this upgrade. A scan run that is in
          progress keeps the old token, so its remaining uploads may fail with 401.

  - id: storage
    title: Report storage
    description: Where the web server stores the HTML reports.
    sections:
      - fields:
          - path: storage.type
            type: enum
            label: Storage
            widget: cards
            required: true
            docs: "#storage"
            options:
              - value: s3
                label: AWS S3
                description: An S3 bucket, reached keylessly through an AWS cloud account and an IAM policy.
              - value: azureFileshare
                label: Azure file share
                description: An Azure file share, mounted into the web server through an Azure cloud account.
        rules:
          - rule: self.storage.type in ['s3', 'azureFileshare']
            mirrors: cpln-trivy.validateStorage
            paths: [storage.type]
            message: Choose AWS S3 or Azure file share for the reports.
          # identity.yaml switches aws: / azure:, and the API keeps an identity's old cloud binding on update
          # (CLAUDE.md, measured 2026-08-21). The web server reads reports only from the new storage.
          - rule: oldSelf == null || self.storage.type == oldSelf.storage.type
            severity: info
            paths: [storage.type]
            message: >-
              Reports stored so far stay in the old storage, and the web server no longer serves them: their
              links in the image tags stop working until the images are scanned again. The identity also keeps
              its old cloud binding after the switch; only a reinstall removes it.
      - title: AWS S3
        when: self.storage.type == 's3'
        fields:
          - path: storage.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: storage.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: storage.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) for the AWS account that holds the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              The policy allows `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject` and `s3:ListBucket` on the
              bucket and on its objects; the docs page has the full JSON under
              [Prerequisites](/template-catalog/templates/cpln-trivy#prerequisites). The identity carries no
              other AWS policy.
            pattern: '^[A-Za-z0-9+=,.@_-]+$'
            patternMessage: "Enter the name of your IAM policy, using letters, digits and + = , . @ _ -."
        rules:
          - rule: self.storage.s3.cloudAccountName != null && self.storage.s3.cloudAccountName != ''
            mirrors: cpln-trivy.validateStorage
            paths: [storage.s3.cloudAccountName]
            message: The AWS cloud account is required for S3 storage.
      - title: Azure file share
        when: self.storage.type == 'azureFileshare'
        fields:
          - path: storage.azureFileshare.accountName
            type: string
            label: Storage account
            required: true
            example: true
            pattern: '^[a-z0-9]{3,24}$'
            patternMessage: Enter the storage account name, 3 to 24 lowercase letters and digits.
          - path: storage.azureFileshare.fileShare
            type: string
            label: File share
            required: true
            example: true
            description: The web server mounts it at `/app/data`.
          - path: storage.azureFileshare.scope
            type: string
            label: Storage account resource ID
            required: true
            placeholder: /subscriptions/SUBSCRIPTION_ID/resourceGroups/RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/STORAGE_ACCOUNT
            description: >-
              The template grants the identity the **Reader and Data Access** role at exactly this scope.
          - path: storage.azureFileshare.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An Azure [cloud account](/guides/create-cloud-account) for the subscription that holds the storage account."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [azure] }
              mustExist: error
        rules:
          - rule: self.storage.azureFileshare.scope != null && self.storage.azureFileshare.scope != ''
            mirrors: cpln-trivy.validateStorage
            paths: [storage.azureFileshare.scope]
            message: The storage account resource ID is required for Azure file share storage.
          # A stricter check than the chart's: skip the installed value (guide §8.8).
          - rule: >-
              self.storage.azureFileshare.scope == '' ||
              (oldSelf != null && self.storage.azureFileshare.scope == oldSelf.storage.azureFileshare.scope) ||
              self.storage.azureFileshare.scope.matches('^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\\.Storage/storageAccounts/[^/]+$')
            paths: [storage.azureFileshare.scope]
            message: >-
              Enter the storage account's full resource ID, in the form
              /subscriptions/ID/resourceGroups/GROUP/providers/Microsoft.Storage/storageAccounts/NAME.
          - rule: >-
              self.storage.azureFileshare.scope == '' || self.storage.azureFileshare.accountName == '' ||
              self.storage.azureFileshare.scope.endsWith('/storageAccounts/' + self.storage.azureFileshare.accountName)
            severity: warning
            paths: [storage.azureFileshare.scope]
            message: >-
              The resource ID names another storage account than the one above, so the role would be granted on
              the wrong account and the web server could not use the file share.

  - id: scanning
    title: Scanning
    description: When the daemon runs, when it scans an image again, and the compute of each run.
    fields:
      - type: note
        when: context.gvcLocations != null && size(context.gvcLocations) > 1
        text: >-
          The daemon is a cron workload, so every location of this GVC runs its own scan of the whole org on
          each tick, and each image is scanned once per location. Install into a GVC with one location to scan
          each image once.
        textExpression: >-
          'The daemon is a cron workload, so each of the ' + string(size(context.gvcLocations)) + ' locations
          of this GVC runs its own scan of the whole org on each tick, and each image is scanned ' +
          string(size(context.gvcLocations)) + ' times. Install into a GVC with one location to scan each image once.'
      - type: note
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.1.0') < 0
        text: >-
          Version 1.1.0 added rescans. With the setting below, images whose last scan is older than that are
          scanned again, and their report is replaced at the same URL. Empty it to keep scanning each image
          only once.
      - path: schedule
        type: string
        format: cron
        label: Schedule (UTC)
        required: true
        description: >-
          Runs never overlap: a long run over a large registry delays the next one instead of starting a
          second.
        suggestions:
          - { value: "0 * * * *", label: "Every hour" }
          - { value: "0 */6 * * *", label: "Every 6 hours" }
          - { value: "0 2 * * *", label: "Daily at 02:00" }
          - { value: "0 2 * * 0", label: "Weekly, Sunday 02:00" }
      - path: rescanAfter
        type: string
        label: Rescan after
        placeholder: 7d
        description: >-
          Scan an image again once its last scan is older than this, so it reflects new CVEs. Leave it empty
          to scan each image only once.
        docs: "#scanning"
        pattern: '^[0-9]+[dh]$'
        patternMessage: Enter a whole number followed by d (days) or h (hours), such as 7d or 24h.
        suggestions: [24h, 7d, 30d]
      - path: daemon.image
        type: string
        format: image
        label: Daemon image
        required: true
        advanced: true
      - path: daemon.resources
        type: resources
        label: Daemon resources
        required: true
        advanced: true
        cpu: { min: 25m }
        memory: { min: 32Mi }
      - path: trivyApi.image
        type: string
        format: image
        label: Trivy image
        required: true
        advanced: true
      - path: trivyApi.resources
        type: resources
        label: Trivy resources
        required: true
        advanced: true
        description: Scanning is CPU-bound; less CPU makes every run longer.
        cpu: { min: 25m }
        memory: { min: 32Mi }
      - path: daemon.firewall.outboundAllowCIDR
        type: list
        label: Daemon outbound CIDRs
        widget: tags
        unique: true
        advanced: true
        description: >-
          Where the daemon may connect: the Control Plane API, the image registry and the web server's public
          endpoint.
        item: { type: string, format: cidr }
    rules:
      - rule: self.rescanAfter == null || self.rescanAfter == '' || self.rescanAfter.matches('^[0-9]+[dh]$')
        mirrors: cpln-trivy.validateRescan
        paths: [rescanAfter]
        message: Rescan after must be a whole number followed by d (days) or h (hours), such as 7d or 24h.
      - rule: size(self.daemon.firewall.outboundAllowCIDR) > 0
        severity: warning
        paths: [daemon.firewall.outboundAllowCIDR]
        message: >-
          With no outbound CIDRs the daemon reaches neither the Control Plane API nor the web server, so no
          image is ever scanned. Allow at least the addresses it needs, for example 0.0.0.0/0.

  - id: webserver
    title: Report web server
    description: Who can open the reports, and the scale of the web server that stores and serves them.
    sections:
      - title: Report access
        docs: "#connecting"
        fields:
          - type: note
            text: >-
              The web server has no internal access: the daemon uploads each report through the web server's
              **public** endpoint, and reports are read there by URL without any login (the URL holds an
              unguessable hash). A report's URL is in the `cpln/trivy-scan` tag of the scanned image.
          - path: webServer.firewall.inboundAllowCIDR
            type: list
            label: Allowed inbound CIDRs
            widget: tags
            unique: true
            description: >-
              Addresses allowed to reach the web server, both to open reports and to upload them. Narrow it to
              keep reports private, but keep the range the daemon's traffic leaves from, or uploads stop.
              Firewall changes take up to a few minutes to take effect.
            help: >-
              Read the public address from `status.canonicalEndpoint` in
              `cpln workload get web-server --gvc GVC_NAME -o yaml`.
            item: { type: string, format: cidr }
        rules:
          - rule: size(self.webServer.firewall.inboundAllowCIDR) > 0
            severity: warning
            paths: [webServer.firewall.inboundAllowCIDR]
            message: >-
              With no inbound CIDRs nothing reaches the web server, including the daemon, which uploads every
              report through it. Allow at least the range the daemon's traffic leaves from.
          - rule: >-
              size(self.webServer.firewall.inboundAllowCIDR) == 0 ||
              self.webServer.firewall.inboundAllowCIDR.exists(c, c == '0.0.0.0/0')
            severity: info
            paths: [webServer.firewall.inboundAllowCIDR]
            message: >-
              The daemon uploads reports through this same public endpoint. Make sure the list includes the
              range its traffic leaves from, or no new report is stored.
      - title: Scale and resources
        fields:
          - path: webServer.autoscaling.minScale
            type: integer
            label: Minimum replicas
            min: 0
            required: true
            description: With 0 the web server scales to zero when idle and starts on the next request.
          - path: webServer.autoscaling.maxScale
            type: integer
            label: Maximum replicas
            min: 1
            required: true
          - path: webServer.image
            type: string
            format: image
            label: Web server image
            required: true
            advanced: true
          - path: webServer.resources
            type: resources
            label: Web server resources
            required: true
            advanced: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: webServer.firewall.outboundAllowCIDR
            type: list
            label: Web server outbound CIDRs
            widget: tags
            unique: true
            advanced: true
            description: Where the web server may connect; it must reach your S3 bucket or Azure storage.
            item: { type: string, format: cidr }
        rules:
          - rule: self.webServer.autoscaling.maxScale >= self.webServer.autoscaling.minScale
            paths: [webServer.autoscaling.maxScale]
            message: The maximum replicas must be at least the minimum replicas.
          - when: self.storage.type == 's3'
            rule: size(self.webServer.firewall.outboundAllowCIDR) > 0
            severity: warning
            paths: [webServer.firewall.outboundAllowCIDR]
            message: >-
              With no outbound CIDRs the web server cannot reach the S3 bucket, so no report is stored or served.
              Allow at least the bucket's addresses, for example 0.0.0.0/0.

migrations:
  # 1.1.0 replaced trivyAuth.type (inline or existingSecret, a dictionary key) with one opaque secret.
  - fromVersions: "<1.1.0"
    from: trivyAuth.type
    note: >-
      The service account key is now always read from an opaque secret you create; choose it under Secrets and
      access.
  - fromVersions: "<1.1.0"
    from: trivyAuth.serviceAccountKey
    note: >-
      The key moved out of the values: put it in an opaque secret (encoding plain) and choose it under Secrets
      and access. With trivyAuth.type inline, the installed release keeps it in the secret RELEASE_NAME-secret
      (key SERVICE_ACCOUNT_KEY), which the upgrade deletes; copy it first. A key that was in the values was
      stored in the Helm release, so consider replacing it.
  - fromVersions: "<1.1.0"
    from: trivyAuth.existingSecret.name
    note: >-
      A dictionary secret no longer works: copy the key's value into an opaque secret (encoding plain) and choose
      it under Secrets and access.
  - fromVersions: "<1.1.0"
    from: trivyAuth.existingSecret.key
    note: >-
      A dictionary secret no longer works: copy the key's value into an opaque secret (encoding plain) and choose
      it under Secrets and access.
  # 1.2.0 turned the plaintext postToken into postToken.secretName. The old string is dropped as a
  # type-conflict (a drop migration would be MIGRATION_KEY_PRESENT, since postToken is now a map); this
  # computed migration starts the new reference empty and carries the note that says where the token went.
  - fromVersions: "<1.2.0"
    to: postToken.secretName
    valueExpr: "''"
    note: >-
      The post token moved out of the values into an opaque secret you create; choose it under Secrets and
      access. The installed release keeps it in the secret RELEASE_NAME-secret (key POST_TOKEN), which the
      upgrade deletes: copy it first, or use a new random token if it is the published default changeme.
