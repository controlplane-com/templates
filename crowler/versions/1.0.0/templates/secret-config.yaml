{{- if not .Values.config.existingSecretName }}
---
{{- /*
  CROWler config.yaml, mounted at /app/config.yaml in engine, api and events.
  Every section of upstream's common/config/config.default is kept with its
  defaults; only the values below are wired in. Credentials stay out of the
  file: ${VAR} references are expanded by CROWler itself from env vars the
  platform resolves from secrets. ${CROWLER_LOCATION} is exported by the start
  wrapper, so per-replica browser hostnames are finalised at boot.
  Not rendered when config.existingSecretName points at the user's own file.
*/}}
{{- $vdi := include "crowler.vdi.name" . }}
{{- $engine := include "crowler.engine.name" . }}
{{- $gvc := .Values.global.cpln.gvc }}
kind: secret
name: {{ include "crowler.secret.config.name" . }}
description: CROWler rendered config.yaml
tags: {{- include "crowler.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    version: 1.0.0
    author: control-plane-template
    description: CROWler configuration rendered by the Control Plane template
    database:
      type: postgres
      host: {{ include "crowler.postgres.host" . }}
      port: 5432
      user: ${CROWLER_DB_USER}
      password: ${CROWLER_DB_PASSWORD}
      dbname: {{ .Values.postgres.credentials.database }}
      retry_time: 10
      ping_time: 10
      sslmode: disable
      optimize_for: write
      max_conns: 50
      max_idle_conns: 30
    email:
      enabled: false
      credentials: {}
    crawler:
      query_timer: {{ int .Values.crawler.queryTimer }}
      workers: 3
      engine:
        {{- range $i := until (int .Values.engine.replicas) }}
        - name: {{ $engine }}-{{ $i }}
          query_timer: {{ int $.Values.crawler.queryTimer }}
          vdi_name:
            {{- range $j := until (int $.Values.vdi.replicas) }}
            {{- if eq (mod $j (int $.Values.engine.replicas)) $i }}
            - vdi-{{ $j }}
            {{- end }}
            {{- end }}
        {{- end }}
      set_vdi_gpu_patch: false
      resolve_vdi_dns: false
      platform: desktop
      browser_platform: linux
      interval: random(1, 3)
      timeout: 30
      crawling_interval: {{ .Values.crawler.crawlingInterval }}
      crawling_if_error: {{ .Values.crawler.crawlingIfError }}
      crawling_if_ok: {{ .Values.crawler.crawlingInterval }}
      processing_timeout: {{ .Values.crawler.processingTimeout }}
      maintenance: 120
      source_screenshot: false
      full_site_screenshot: false
      max_depth: {{ int .Values.crawler.maxDepth }}
      max_links: {{ int .Values.crawler.maxLinks }}
      max_sources: 0
      initial_ramp_up: 0
      delay: random(1, 3)
      cdp_delay: 0
      browsing_mode: recursive
      max_retries: 3
      max_requests: 0
      change_useragent: never
      force_sec_fetch_site_same_origin: false
      reset_cookies_policy: on_start
      no_third_party_cookies: true
      request_images: true
      request_css: true
      request_scripts: true
      request_plugins: false
      request_frames: false
      prevent_duplicate_urls: true
      refresh_content: false
      collect_html: true
      collect_images: true
      collect_files: false
      collect_content: true
      collect_keywords: true
      collect_metatags: true
      collect_performance: false
      collect_events: false
      collect_xhr: false
      filter_xhr:
        - text/empty
        - text/css
        - text/html
        - image/png
        - image/jpeg
        - image/gif
        - image/x-icon
        - image/svg+xml
        - audio/mpeg
        - video/mp4
        - font/woff2
        - font/woff
        - font/ttf
        - application/xhtml+xml
        - application/javascript
        - application/pdf
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.ms-powerpoint
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/zip
        - application/x-tar
        - application/gzip
        - application/x-bzip2
        - application/x-rar-compressed
        - application/x-msdownload
        - application/x-msi
        - application/x-debian-package
        - application/x-rpm
        - application/vnd.android.package-archive
        - application/x-iso9660-image
      collect_links: true
      create_event_when_done: false
      control:
        host: 0.0.0.0
        port: 8081
        timeout: 20
        sslmode: disable
        cert_file: ""
        key_file: ""
        rate_limit: "100,100"
        readheader_timeout: 30
        write_timeout: 30
    information_seed:
      enabled: false
      query_timer: 300
      max_concurrent_seeds: 2
      max_queries_per_seed: 5
      max_candidates_per_seed: 50
      retry_interval: 60
      processing_timeout: 30 minutes
      provider_allow_list: []
      providers: {}
      plugin_limits:
        timeout: 30
        max_output_size_bytes: 1048576
    timeseries:
      enabled: false
      defaults:
        value_type: integer
        aggregates: [count]
        bucket_interval: 1h
        time_basis: observed_at
        dedupe_scope: none
        failure_policy: log_skip
      retention:
        raw: 30d
        aggregated: 365d
      aggregation:
        enabled: false
        schedule: 5m
        batch_size: 1000
        max_batches: 10
        overlap: 15m
      storage:
        backend: postgres
        table_prefix: timeseries
        partitioning:
          enabled: false
          interval: 1d
          precreate: 7
      cardinality:
        max_series_per_metric: 100000
        max_dimensions: 10
        max_values_per_dimension: 10000
        overflow: drop
      privacy:
        hash_only: false
        store_value_text: false
        max_value_length: 2048
        redact_patterns: []
      metrics: []
    attributes_indexing:
      webobject: []
      netinfo: []
      httpinfo: []
    api:
      url: ""
      host: 0.0.0.0
      port: 8080
      timeout: 30
      disable_default: false
      enable_api_docs: {{ .Values.api.enableApiDocs }}
      sslmode: disable
      cert_file: ""
      key_file: ""
      rate_limit: "1000,1000"
      readheader_timeout: 30
      write_timeout: 30
      enable_console: {{ .Values.api.enableConsole }}
      cors:
        enabled: false
        allowed_origins: [ "*" ]
      websocket:
        enabled: false
        allowed_origins: [ "*" ]
        heartbeat_interval: 30
        write_queue_size: 64
        write_timeout: 5
      return_404: false
      content_search: false
      return_content: false
      allowed_ips: []
      plugins:
        enabled: false
        timeout: 30
        allow: []
      use_google_cloud_run: false
    vdi:
      {{- range $j := until (int .Values.vdi.replicas) }}
      - type: chrome
        host: replica-{{ $j }}.{{ $vdi }}.${CROWLER_LOCATION}.{{ $gvc }}.cpln.local
        port: 4444
        sslmode: disable
        headless: false
        name: vdi-{{ $j }}
        location: ""
        language: ""
        path: ""
        driver_path: ""
        use_service: false
        download_path: "./downloads"
        proxy_url: ""
        sys_manager:
          port: 4445
          timeout: 30
          sslmode: disable
      {{- end }}
    prometheus:
      {{- if .Values.pushgateway.enabled }}
      enabled: true
      host: {{ include "crowler.pushgateway.host" . }}
      port: 9092
      {{- else }}
      enabled: false
      host: 0.0.0.0
      port: 9092
      {{- end }}
    network_info:
      # The platform grants no NET_RAW/NET_ADMIN, so nmap-based recon cannot run.
      dns:
        enabled: false
        timeout: 60
        rate_limit: 20/s
      whois:
        enabled: false
        timeout: 60
        rate_limit: 20/s
      netlookup:
        enabled: false
        timeout: 60
        rate_limit: 20/s
      geo_localization:
        enabled: false
        type: maxmind
        path: ""
        timeout: 60
        api_key: ""
        sslmode: disable
      service_scout:
        enabled: false
        timeout: 60
        ping_scan: false
        connect_scan: false
        syn_scan: false
        udp_scan: false
        no_dns_resolution: false
        service_detection: false
        service_db: ""
        os_finger_print: false
        aggressive_scan: false
        script_scan: []
        excluded_hosts: []
        timing_template: T3
        host_timeout: "60"
        min_rate: "10"
        max_retries: 0
        interface: ""
        spoof_ip: ""
        randomize_hosts: true
        data_length: 0
        delay: "1"
        mtu_discovery: true
        scan_flags: SYN
        ip_fragment: false
        min_port_number: 1
        max_port_number: 9000
        max_parallelism: 10
        dns_servers: []
        proxies: []
    events:
      url: ""
      host: 0.0.0.0
      port: 8082
      timeout: 30
      sslmode: disable
      cert_file: ""
      key_file: ""
      cors:
        enabled: false
        allowed_origins: [ "*" ]
      websocket:
        enabled: false
        allowed_origins: [ "*" ]
        heartbeat_interval: 30
        write_queue_size: 64
        write_timeout: 5
      use_google_cloud_run: false
      master_events_manager: {{ include "crowler.events.name" . }}-0
      enable_api_docs: {{ .Values.events.enableApiDocs }}
      automatic_events_removal: "on_success"
      heartbeat_enabled: false
      heartbeat_interval: "30"
      heartbeat_timeout: "10"
      heartbeat_log: false
      sys_db_maintenance_schedule: ""
      sys_db_webobjects_retention: ""
      rate_limit: "1200,1200"
      readheader_timeout: 30
      write_timeout: 30
    image_storage:
      type: local
      path: "./data/images"
      timeout: 30
    file_storage:
      type: local
      path: "./data/files"
      timeout: 30
    http_headers:
      enabled: false
      timeout: 30
      follow_redirects: true
      ssl_discovery:
        enabled: false
        jarm: false
        ja3: false
        ja3s: false
        ja4: false
        ja4s: false
        hassh: false
        hassh_server: false
        tlsh: false
        simhash: false
        minhash: false
        blake2: false
        sha256: false
        cityhash: false
        murmurhash: false
        custom_tls: false
      proxies: []
    rulesets_schema_path: "./schemas/crowler-ruleset-schema.json"
    rulesets:
      - type: local
        path:
          - "./rules/*.yaml"
          - "./user/rules/*.yaml"
        host: ""
        port: "0"
        region: ""
        token: ""
        secret: ""
        timeout: 30
        sslmode: disable
        refresh: 0
    agents:
      - type: local
        path:
          - "./agents/*.yaml"
          - "./user/agents/*.yaml"
        host: ""
        port: "0"
        region: ""
        token: ""
        secret: ""
        global_parameters: {}
        timeout: 30
        agents_timeout: 30
        plugins_timeout: 30
        refresh: 0
    agent:
      identity_enforcement: false
      contract_enforcement: false
      memory_runtime: false
    plugins:
      global_parameters: {}
      timeout: 30
      plugins_timeout: 30
      locations:
        - type: local
          path:
            - "./plugins/*.js"
            - "./user/plugins/*.js"
          refresh: 0
    external_detection:
      abuse_ipdb:
        api_key: ""
      alien_vault:
        api_key: ""
      censys:
        api_id: ""
        api_secret: ""
      cisco_umbrella:
        api_key: ""
      cuckoo: {}
      google_safe_browsing:
        company_id: ""
        api_key: ""
      hybrid_analysis:
        api_key: ""
      ipvoid:
        api_key: ""
      open_phish:
        api_key: ""
      phish_tank: {}
      shodan:
        api_key: ""
      ssllabs:
        api_key: ""
      url_haus: {}
      virus_total:
        api_key: ""
    debug_level: {{ int .Values.crawler.debugLevel }}
{{- end }}
