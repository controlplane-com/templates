---
{{- /*
  The CROWler APP database role (created by the schema loader on first install
  and used by engine/api/events) plus the browser nodes' VNC password. Both are
  internal plumbing: the role exists only to connect the CROWler tiers to their
  own bundled database, and VNC is never exposed outside the GVC.
*/}}
kind: secret
name: {{ include "crowler.secret.creds.name" . }}
description: CROWler app database role and VNC password
tags: {{- include "crowler.tags" . | nindent 4 }}
type: dictionary
data:
  crowlerDbUser: {{ .Values.crowlerDb.username | quote }}
  crowlerDbPassword: {{ .Values.crowlerDb.password | quote }}
  vncPassword: {{ .Values.vdi.vncPassword | quote }}
