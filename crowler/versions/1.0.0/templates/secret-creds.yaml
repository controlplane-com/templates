---
{{- /*
  The CROWler APP database role, created by the schema loader on first install
  and used by engine/api/events. Internal plumbing: it exists only to connect the
  CROWler tiers to their own bundled database.
*/}}
kind: secret
name: {{ include "crowler.secret.creds.name" . }}
description: CROWler app database role
tags: {{- include "crowler.tags" . | nindent 4 }}
type: dictionary
data:
  crowlerDbUser: {{ .Values.crowlerDb.username | quote }}
  crowlerDbPassword: {{ .Values.crowlerDb.password | quote }}
