---
{{- /*
  Superuser credentials for the BUNDLED database, in the shape the postgres
  subchart reads: exactly username, password and database. Internal plumbing —
  no human types this password — so the bundled-plumbing exception applies and
  this chart creates it (guacamole precedent). Only the schema-loader sidecar and
  the postgres workload receive these values; the CROWler apps use the separate,
  non-superuser app role in crowler-creds.
*/}}
kind: secret
name: {{ include "crowler.secret.db.name" . }}
description: CROWler bundled PostgreSQL superuser credentials
tags: {{- include "crowler.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
