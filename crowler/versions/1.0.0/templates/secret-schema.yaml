---
{{- /*
  Schema loader, run by the schema-loader sidecar (crowler-db image, bash) in each
  of engine, api and events. The CROWler schema ships only as an initdb file in
  that image, so it is applied here against the bundled postgres instead:
    - pg_isready sends a real startup packet, so the mesh's bare-TCP handshake
      cannot fake readiness.
    - A session advisory lock serializes every loader that starts at once; losers
      block, then find the schema present and skip.
    - The load runs in ONE transaction. The version row sits at the TOP of the
      upstream file, so only an atomic load makes "dbschemaversion exists" a sound
      "schema is complete" test. A crash mid-load rolls back and the next pass
      retries cleanly.
    - The six ALTER SYSTEM lines and pg_reload_conf() are stripped: PostgreSQL
      refuses ALTER SYSTEM inside a transaction, and the values upstream passes
      equal PostgreSQL 17's defaults, so nothing is lost.
  A schema version that differs from the image's only WARNS: re-running the full
  file on a populated database is unsafe, and a check must never take down a
  live install. Upstream ships version-to-version migrations to run by hand.
*/}}
kind: secret
name: {{ include "crowler.secret.schema.name" . }}
description: CROWler schema-loader script
tags: {{- include "crowler.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -u
    SQL=/docker-entrypoint-initdb.d/postgresql-setup.pgsql
    MARK=/schema/ready
    log() { echo "schema-loader: $*"; }

    EXPECTED=$(grep -o "WHERE version = '[0-9.]*'" "$SQL" | head -1 | grep -o "[0-9.]*")
    sed -E '/^ALTER SYSTEM /d; /^SELECT pg_reload_conf\(\);/d' "$SQL" > /tmp/schema.pgsql

    cat > /tmp/driver.psql <<'DRV'
    SELECT pg_advisory_lock(7270011);
    SELECT (to_regclass('public.dbschemaversion') IS NOT NULL) AS present \gset
    \if :present
      \echo schema-loader: schema already present - skipping
    \else
      \echo schema-loader: applying schema
      BEGIN;
      \i /tmp/schema.pgsql
      COMMIT;
      \echo schema-loader: schema applied
    \endif
    SELECT pg_advisory_unlock(7270011);
    DRV

    while :; do
      until pg_isready -q -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
        log "waiting for PostgreSQL at $PGHOST:$PGPORT"
        sleep 3
      done
      if psql -X -q -v ON_ERROR_STOP=1 \
           -v POSTGRES_DB="$PGDATABASE" \
           -v CROWLER_DB_USER="$CROWLER_DB_USER" \
           -v CROWLER_DB_PASSWORD="$CROWLER_DB_PASSWORD" \
           -f /tmp/driver.psql > /tmp/load.log 2>&1; then
        grep 'schema-loader' /tmp/load.log
        if ! psql -X -At -c "SELECT 1 FROM dbschemaversion WHERE version::text = '$EXPECTED'" | grep -q 1; then
          FOUND=$(psql -X -At -c "SELECT string_agg(version::text, ',') FROM dbschemaversion")
          log "WARNING: database schema is '${FOUND}', image expects '${EXPECTED}' - apply the upstream db_migrations scripts manually"
        fi
        : > "$MARK"
        log "ready (schema ${EXPECTED})"
        exec sleep infinity
      fi
      log "psql failed, retrying in 15s:"
      tail -n 5 /tmp/load.log
      sleep 15
    done
