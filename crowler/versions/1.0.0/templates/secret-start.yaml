---
{{- /*
  Start wrapper for the engine, api and events containers (alpine busybox sh).
  Replaces the crude fixed sleep with two real gates:
    1. the schema marker written by this replica's schema-loader sidecar (which
       itself implies PostgreSQL answered with a real startup packet);
    2. engine only: every browser node pinned to THIS engine reports
       "ready": true on its WebDriver /status. Without it the first crawl hits a
       booting Chromium and the source is parked for crawler.crawlingIfError.
  Each gate is bounded inside the readiness deadline, so the FATAL line prints
  before the platform restarts the container.
  MICROSERVICE_NAME = the stateful hostname ({workload}-{i}) drives engine VDI
  pinning and the events master election. CROWLER_LOCATION is the bare location
  name the rendered config interpolates into per-replica browser hostnames.
*/}}
kind: secret
name: {{ include "crowler.secret.start.name" . }}
description: CROWler app start wrapper
tags: {{- include "crowler.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -u
    ROLE="${1:-}"
    export MICROSERVICE_NAME="$HOSTNAME"
    export CROWLER_LOCATION="${CPLN_LOCATION##*/}"

    t=0
    until [ -f /schema/ready ]; do
      if [ "$t" -ge 180 ]; then
        echo "FATAL: database schema not ready after 180s - read the schema-loader container's logs"
        exit 1
      fi
      [ $((t % 15)) -eq 0 ] && echo "crowler-start: waiting for the database schema (${t}s)"
      sleep 1
      t=$((t + 1))
    done
    echo "crowler-start: database schema ready"

    if [ "$ROLE" = engine ]; then
      idx="${HOSTNAME##*-}"
      j=0
      t=0
      while [ "$j" -lt {{ .Values.vdi.replicas }} ]; do
        if [ $((j % {{ .Values.engine.replicas }})) -eq "$idx" ]; then
          h="replica-${j}.{{ include "crowler.vdi.name" . }}.${CROWLER_LOCATION}.{{ .Values.global.cpln.gvc }}.cpln.local"
          until wget -qO- -T 5 "http://${h}:4444/status" 2>/dev/null | grep -Eq '"ready": *true'; do
            if [ "$t" -ge 150 ]; then
              echo "FATAL: browser node ${h} not ready after 150s - check the vdi workload"
              exit 1
            fi
            [ $((t % 15)) -eq 0 ] && echo "crowler-start: waiting for browser node ${h} (${t}s)"
            sleep 5
            t=$((t + 5))
          done
          echo "crowler-start: browser node ${h} ready"
        fi
        j=$((j + 1))
      done
    fi

    case "$ROLE" in
      engine) exec ./thecrowler ;;
      api)    exec ./api ;;
      events) exec ./events ;;
      *) echo "FATAL: unknown role '${ROLE}'"; exit 1 ;;
    esac
