---
{{- /*
  Start wrapper for the engine, api and events containers (alpine busybox sh).
  Replaces the crude fixed sleep with two real gates:
    1. the schema marker written by this replica's schema-loader sidecar (which
       itself implies PostgreSQL answered with a real startup packet);
    2. engine only: every browser node pinned to THIS engine answers its
       WebDriver /status. Without it the first crawl hits a node that is not up
       yet and the source is parked for crawler.crawlingIfError.
  Each gate is bounded inside the readiness deadline, so the FATAL line prints
  before the platform restarts the container.
  MICROSERVICE_NAME = the stateful hostname ({workload}-{i}) drives engine VDI
  pinning and the events master election. CROWLER_LOCATION is the bare location
  name the rendered config interpolates into per-replica browser hostnames.
*/}}
kind: secret
name: {{ include "crowler.secret.start.name" . }}
description: CROWler app start wrapper
tags: {{- include "crowler.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -u
    ROLE="${1:-}"
    export MICROSERVICE_NAME="$HOSTNAME"
    export CROWLER_LOCATION="${CPLN_LOCATION##*/}"

    # Deadlines are wall-clock (date +%s), not loop counters: a wget against an
    # unready per-replica name can hang for its full timeout, so counting loop
    # passes would let a gate overrun the readiness deadline and the FATAL line
    # would never print.
    start=$(date +%s)
    last=0
    until [ -f /schema/ready ]; do
      el=$(( $(date +%s) - start ))
      if [ "$el" -ge 180 ]; then
        echo "FATAL: database schema not ready after ${el}s - read the schema-loader container's logs"
        exit 1
      fi
      if [ $((el - last)) -ge 15 ] || [ "$last" -eq 0 ]; then
        echo "crowler-start: waiting for the database schema (${el}s)"
        last=$el
        [ "$last" -eq 0 ] && last=1
      fi
      sleep 1
    done
    echo "crowler-start: database schema ready"

    if [ "$ROLE" = engine ]; then
      idx="${HOSTNAME##*-}"
      j=0
      gate=$(date +%s)
      while [ "$j" -lt {{ .Values.vdi.replicas }} ]; do
        if [ $((j % {{ .Values.engine.replicas }})) -eq "$idx" ]; then
          h="replica-${j}.{{ include "crowler.vdi.name" . }}.${CROWLER_LOCATION}.{{ .Values.global.cpln.gvc }}.cpln.local"
          # Wait until the node is IDLE ("ready": true), not merely answering.
          # After an engine restart mid-crawl, the dead engine's session holds the
          # node's single slot until Selenium reaps it (session timeout 300 s). An
          # engine that starts work during that window has its session request
          # time out and CROWler marks the source errored (measured). Pinned nodes
          # serve only this engine, so waiting out the orphan is always correct.
          # Budget 330 s covers the full reap window; the readiness deadline
          # (10 + 20x27 = 550 s) covers it plus the 180 s schema wait.
          until wget -qO- -T 5 "http://${h}:4444/status" 2>/dev/null | grep -Eq '"ready": *true'; do
            el=$(( $(date +%s) - gate ))
            if [ "$el" -ge 330 ]; then
              echo "FATAL: browser node ${h} still busy or not answering after ${el}s - check the vdi workload"
              exit 1
            fi
            echo "crowler-start: waiting for browser node ${h} to be free (${el}s; a session left by a previous engine is released within 300s)"
            sleep 5
          done
          echo "crowler-start: browser node ${h} ready"
        fi
        j=$((j + 1))
      done
    fi

    case "$ROLE" in
      engine) exec ./thecrowler ;;
      api)    exec ./api ;;
      events) exec ./events ;;
      *) echo "FATAL: unknown role '${ROLE}'"; exit 1 ;;
    esac
