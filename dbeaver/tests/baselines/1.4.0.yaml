# dbeaver 1.4.0 — the default install: one CloudBeaver instance at the chart's default size, private (internal
# access only). The admin password is generated per run.
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  adminpw: hex

secrets:
  admin:
    type: opaque
    payload: "{gen.adminpw}"

vars:
  admin_user: cbadmin
  admin_password: "{gen.adminpw}"

values:
  admin:
    passwordSecretName: "{secrets.admin.name}"

# 1.3.0 is the previous version. Older ones keep the admin password in values (removed in 1.3.0), so their
# upgrade needs a different values shape.
upgradeFrom:
  - version: 1.3.0
