{{- include "dbeaver.validate" . }}
kind: workload
name: {{ include "dbeaver.name" . }}
description: DBeaver Database GUI
tags: {{- include "dbeaver.tags" . | nindent 4 }}
spec:
  type: stateful
  containers:
    - name: dbeaver
      cpu: {{ .Values.resources.cpu | quote }}
      image: {{ .Values.image }}
      inheritEnv: false
      env:
        # Admin bootstrap. The login name is not sensitive and stays a value;
        # the password comes from a prerequisite opaque secret the user creates
        # before install, so it never enters the Helm release. Both are honored
        # only when the workspace is first initialized on the volumeset — after
        # that, change the password in the CloudBeaver UI.
        - name: CB_ADMIN_NAME
          value: {{ .Values.admin.name | quote }}
        - name: CB_ADMIN_PASSWORD
          value: cpln://secret/{{ .Values.admin.passwordSecretName }}.payload
        - name: CB_SERVER_NAME
          value: {{ include "dbeaver.name" . }}
        - name: CB_SERVER_URL
          value: http://{{ include "dbeaver.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:8978
      memory: {{ .Values.resources.memory | quote }}
      ports:
        - number: 8978
          protocol: http
      volumes:
        - path: /opt/cloudbeaver/workspace
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "dbeaver.volumeset.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 3
      metric: cpu
      minScale: 1
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  firewallConfig:
    external:
      {{- if .Values.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
      inboundBlockedCIDR: []
      # Closed egress: the console reaches databases inside the GVC only.
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if eq .Values.internalAccess.type "workload-list" }}
      inboundAllowWorkload:
        {{- range .Values.internalAccess.workloads }}
        - {{ . }}
        {{- end }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "dbeaver.identity.name" . }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
