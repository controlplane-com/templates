# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: DBeaver CloudBeaver
# One stateful replica on its own volume set and no location handling: every GVC location would run an
# independent console with its own workspace.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: admin
    title: Admin login
    description: The prerequisite secret with the admin password, and the admin login name.
    fields:
      - type: note
        severity: warning
        when: >-
          context.mode == 'install' ||
          (context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') < 0)
        textExpression: >-
          'The admin password secret must exist **before** you install or upgrade. If it is missing, the ' +
          'deployment waits on it and `cpln logs` shows nothing at all; the reason is in ' +
          '`status.versions[].message` of `cpln workload get-deployments ' + context.releaseName +
          '-dbeaver --gvc ' + (context.gvc != null ? context.gvc : 'GVC_NAME') + ' -o yaml`. Once the secret ' +
          'exists it recovers on its own within about 10 minutes, or at once with ' +
          '`cpln workload force-redeployment ' + context.releaseName + '-dbeaver --gvc ' +
          (context.gvc != null ? context.gvc : 'GVC_NAME') + '`.'
        text: >-
          The admin password secret must exist **before** you install or upgrade. If it is missing, the
          deployment waits on it and `cpln logs` shows nothing at all; the reason is in
          `status.versions[].message` of `cpln workload get-deployments RELEASE_NAME-dbeaver --gvc GVC_NAME -o yaml`.
          Once the secret exists it recovers on its own within about 10 minutes, or at once with
          `cpln workload force-redeployment RELEASE_NAME-dbeaver --gvc GVC_NAME`.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.3.0') < 0
        textExpression: >-
          'Version 1.3.0 moved the admin password out of the values and into a secret you create. This upgrade ' +
          'deletes the secret the chart created (`' + context.releaseName + '-dbeaver-admin-config`), so create ' +
          'the new one under another name; to reuse the current password, read it first with ' +
          '`cpln secret reveal ' + context.releaseName + '-dbeaver-admin-config -o yaml` (key `admin_password`). ' +
          'The workspace keeps the login it was first set up with: after the upgrade you still sign in with the ' +
          'old name and password, and changing the secret does not change them. Earlier versions shipped the ' +
          'published default login `adminusername` / `Password123`. If this release still uses it, treat it as ' +
          'compromised and change it in the CloudBeaver UI right after the upgrade. See ' +
          '[Upgrading From 1.2.1 or Earlier](/template-catalog/templates/dbeaver#upgrading-from-1-2-1-or-earlier).'
        text: >-
          Version 1.3.0 moved the admin password out of the values and into a secret you create. This upgrade
          deletes the secret the chart created (`RELEASE_NAME-dbeaver-admin-config`), so create the new one
          under another name; to reuse the current password, read it first with
          `cpln secret reveal RELEASE_NAME-dbeaver-admin-config -o yaml` (key `admin_password`). The workspace
          keeps the login it was first set up with: after the upgrade you still sign in with the old name and
          password, and changing the secret does not change them. Earlier versions shipped the published
          default login `adminusername` / `Password123`. If this release still uses it, treat it as compromised
          and change it in the CloudBeaver UI right after the upgrade. See
          [Upgrading From 1.2.1 or Earlier](/template-catalog/templates/dbeaver#upgrading-from-1-2-1-or-earlier).
      - path: admin.passwordSecretName
        type: ref
        label: Admin password secret
        required: true
        description: >-
          An opaque secret (encoding plain) holding only the admin password, 8 characters or more. Whoever
          holds it can query every database the console is connected to, so use a strong one.
        help: >-
          CloudBeaver reads the password only when the workspace is first initialized. To change it later, use
          the CloudBeaver UI (Settings, Administration, Users); updating the secret alone changes nothing.
          Create the secret with:
          `printf '%s' 'YOUR-STRONG-PASSWORD' | cpln secret create-opaque --name SECRET_NAME --encoding plain -f -`
        docs: "#admin-login"
        ref:
          kind: secret
          format: name
          filter: { secretType: [opaque] }
          mustExist: error
          allowCreate: true
          create:
            encoding: plain
            suggestName: "context.releaseName + '-dbeaver-admin-password'"
            hint: "Use a strong password of at least 8 characters."
      - path: admin.name
        type: string
        label: Admin login name
        required: true
        description: >-
          Not sensitive. Like the password, it is applied only when the workspace is first initialized.
    rules:
      - rule: self.admin.passwordSecretName != null && self.admin.passwordSecretName != ''
        mirrors: dbeaver.validate
        paths: [admin.passwordSecretName]
        message: The admin password secret is required.
      - rule: self.admin.name != null && self.admin.name != ''
        mirrors: dbeaver.validate
        paths: [admin.name]
        message: The admin login name is required.
      - rule: "!has(self.admin.password)"
        severity: info
        paths: [admin.passwordSecretName]
        message: >-
          admin.password was removed in 1.3.0 and the chart ignores it. Put the password in the admin password
          secret and remove admin.password from the values.
      # Before 1.3.0 the chart created RELEASE-dbeaver-admin-config itself, and this upgrade deletes it.
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') < 0
        rule: self.admin.passwordSecretName != context.releaseName + '-dbeaver-admin-config'
        severity: warning
        paths: [admin.passwordSecretName]
        message: >-
          The previous version created this secret itself, and this upgrade deletes it, which leaves the
          console waiting on a missing secret. Create a secret under a new name and choose it here.
      - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.3.0') >= 0)
        rule: self.admin.passwordSecretName == oldSelf.admin.passwordSecretName
        severity: info
        paths: [admin.passwordSecretName]
        message: >-
          CloudBeaver reads the password only when the workspace is first initialized; pointing at another
          secret does not change the admin password. Change it in the CloudBeaver UI.
      - when: oldSelf != null
        rule: self.admin.name == oldSelf.admin.name
        severity: info
        paths: [admin.name]
        message: >-
          CloudBeaver reads the login name only when the workspace is first initialized; changing it here does
          not rename the existing admin account.

  - id: access
    title: Access
    description: Whether the console is on the internet, and which workloads inside Control Plane can reach it.
    sections:
      - title: Public access
        docs: "#first-run"
        fields:
          - type: note
            severity: info
            when: context.mode == 'install'
            textExpression: >-
              'Recommended first run: install with public access off, then open a tunnel with ' +
              '`cpln port-forward ' + context.releaseName + '-dbeaver 8978:8978 --gvc ' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + '`, browse to `http://localhost:8978` and sign ' +
              'in with the admin login to confirm it works. Only then, if you need it, upgrade the release with ' +
              'public access on, and allow a few minutes for the firewall change to take effect.'
            text: >-
              Recommended first run: install with public access off, then open a tunnel with
              `cpln port-forward RELEASE_NAME-dbeaver 8978:8978 --gvc GVC_NAME`, browse to `http://localhost:8978`
              and sign in with the admin login to confirm it works. Only then, if you need it, upgrade the release
              with public access on, and allow a few minutes for the firewall change to take effect.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.3.0') < 0
            text: >-
              Earlier versions published the console to the internet with no way to turn it off, and allowed no
              workload inside Control Plane to reach it. Since 1.3.0 it is private unless you turn on public access
              below, and the workloads of the GVC can reach it. Turn it on only if you need the internet-facing
              address, and change a published default password first (see Admin login). Without it, reach the UI
              with `cpln port-forward`.
          - path: publicAccess.enabled
            type: boolean
            label: Publish to the internet
            description: >-
              Puts a database administration console and its login form on the canonical endpoint. Anyone who
              reaches it needs only the admin password to query every connected database.
            help: >-
              Read the public address from `status.canonicalEndpoint` in
              `cpln workload get RELEASE_NAME-dbeaver --gvc GVC_NAME -o yaml`. With it off,
              `cpln port-forward RELEASE_NAME-dbeaver 8978:8978 --gvc GVC_NAME` reaches the UI at
              `http://localhost:8978`. A change takes a few minutes to take effect.
      - title: Internal access
        docs: "#access"
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can reach the console
            widget: cards
            required: true
            description: >-
              Workloads inside Control Plane, on `http://RELEASE_NAME-dbeaver.GVC_NAME.cpln.local:8978`.
              `cpln port-forward` works with every choice. A change takes a few minutes to take effect.
            options:
              - value: none
                label: None
                description: No workload can reach the console.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          # workload.yaml writes the list into inboundAllowWorkload only with workload-list ([] otherwise).
          - path: internalAccess.workloads
            when: self.internalAccess.type == 'workload-list'
            type: list
            label: Allowed workloads
            widget: tags
            unique: true
            description: The whole allow-list; only these workloads can reach the console.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: dbeaver.validate
        paths: [internalAccess.type]
        message: Choose None, Same GVC, Same org or Specific workloads.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        mirrors: dbeaver.validate
        paths: [internalAccess.workloads]
        message: List at least one workload when the console is open to specific workloads.
      - when: self.internalAccess.type == 'none'
        rule: self.publicAccess.enabled
        severity: info
        paths: [internalAccess.type]
        message: >-
          With None and public access off, only cpln port-forward reaches the console.

  - id: server
    title: Server
    description: The CloudBeaver image, its compute, and the volume set that holds its workspace.
    sections:
      - fields:
          - path: image
            type: string
            format: image
            label: CloudBeaver image
            required: true
            docs: "#image"
          - path: resources
            type: resources
            label: Resources
            required: true
            description: >-
              One stateful replica. The chart's CPU autoscaling can start up to 3 replicas under sustained load,
              each with its own empty workspace, so size it to keep one replica below its CPU limit.
            docs: "#scaling-and-availability"
            cpu: { min: 25m }
            memory: { min: 32Mi }
      - title: Storage
        docs: "#resources-and-storage"
        fields:
          - type: note
            severity: info
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.1.0') < 0
            text: >-
              Version 1.0.0 configured the volume set to grow on its own; later versions do not declare that and
              set the capacity from Initial capacity instead.
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100]
            description: >-
              The workspace: server configuration, saved connections and users. Uninstalling the release deletes
              the volume set and every saved connection with it.
            help: >-
              There are no scheduled snapshots; the only automatic one is taken when the volume set is deleted,
              and kept for 7 days.
        rules:
          - rule: oldSelf == null || oldSelf.volumeset.capacity == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

migrations:
  # 1.3.0 moved the admin password into a prerequisite secret.
  - fromVersions: "<1.3.0"
    from: admin.password
    note: >-
      The admin password moved to an opaque secret; choose it under Admin login. The workspace keeps the password
      it was first set up with. Earlier versions shipped the published default "Password123": if this release
      still uses it, change it in the CloudBeaver UI right after the upgrade.
  # 1.3.0 changed the default login name (adminusername became cbadmin). The workspace keeps the account it was
  # first set up with, so keep the installed name rather than showing a name the release does not use.
  - fromVersions: "<1.3.0"
    to: admin.name
    valueExpr: self.admin.name
    note: The workspace keeps the admin login it was first set up with, so the installed name is kept.
