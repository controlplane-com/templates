                mirrors: debezium.validateCredentials
                message: >-
                  sink.http.bearerToken was removed in 1.2.0 and the chart refuses it. Clear it: it served only
                  Bearer authentication, which the Debezium Server HTTP sink refuses at startup.
          - path: sink.pulsar.authToken
