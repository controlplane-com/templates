  - id: workload
    title: Workload
    description: The Debezium Server image, its compute and its firewall.
    sections:
      - id: server
        fields:
          - path: image
            type: string
            format: image
            label: Debezium Server image
            required: true
          - path: resources
            type: resources
            label: Resources
            docs: "#image-and-resources"
            required: true
            description: A single replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
      - id: firewall
        title: Firewall
        docs: "#firewall"
        fields:
          - path: firewall.internal.inboundAllowType
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Who in Control Plane can reach port 8080, where Debezium Server serves its health endpoints.
            options:
              - value: none
                label: None
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          # workload-debezium.yaml:218-220 writes any non-empty list into inboundAllowWorkload, whatever the type,
          # so the list shows in every type (§6.8).
          - path: firewall.internal.workloads
            type: list
            label: Allowed workloads
            description: Extra workloads allowed to connect, for example from another GVC.
            widget: tags
            unique: true
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.firewall.internal.inboundAllowType == 'same-gvc'
            rules:
              - when: self.firewall.internal.inboundAllowType == 'same-gvc' && context.gvc != null
                rule: "!self.firewall.internal.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
                severity: info
                messageExpression: >-
                  'Same GVC already allows every workload in this GVC: ' +
                  self.firewall.internal.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
                  ' can be removed from the list.'
                message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
              - rule: self.firewall.internal.inboundAllowType != 'workload-list' || size(self.firewall.internal.workloads) > 0
                severity: info
                message: With "Specific workloads" and an empty list, no workload can reach the health endpoints.
              - when: self.firewall.internal.inboundAllowType == 'same-org'
                rule: size(self.firewall.internal.workloads) == 0
                severity: info
                message: Same org already lets every workload of the org connect, so these entries add nothing.
              - when: self.firewall.internal.inboundAllowType == 'none'
                rule: size(self.firewall.internal.workloads) == 0
                severity: warning
                message: >-
                  The chart still writes these workloads into the firewall, where the platform checks every entry, but
                  "None" lets none of them connect. Remove them.
          - path: firewall.external.outboundAllowCIDR
            type: list
            label: Outbound CIDRs
            description: >-
              Addresses outside Control Plane that Debezium Server may reach, such as a source database or a sink
              that runs elsewhere.
            docs: "/reference/workload/firewall#outbound-requests"
            unique: true
            item: { type: string, format: cidr, label: CIDR }
            rules:
              # values.yaml: "required for database connectivity".
              - rule: size(self.firewall.external.outboundAllowCIDR) > 0
                severity: info
                message: >-
                  With no outbound CIDR, Debezium Server reaches only workloads inside Control Plane. Add 0.0.0.0/0
                  (the default), or the addresses of your source database and sink, unless both run in this org.
                fix:
                  path: firewall.external.outboundAllowCIDR
                  items: "['0.0.0.0/0']"

yamlOnly:
  - path: source.postgres.heartbeatActionQuery
    reason: >-
      SQL written unescaped into the generated properties file; only experts set a heartbeat query, and the
      defaults leave it empty.
  - path: sink.http.headers
    reason: >-
      Written unescaped into the properties file as debezium.sink.http.headers.<name>=<value>; the Debezium
      Server 3.0 HTTP sink sends none of them as headers and reads only the expert keys prefix and
      encode.base64; the defaults leave it empty.
  - path: sink.kinesis.credentialsProvider
    reason: >-
      Written unescaped into the generated properties file; the Kinesis sink does not read it (it uses the AWS
      default credentials, which the AWS cloud account section provides), so only experts change it.
  - path: source.oracle
    reason: >-
      The chart writes schema history only for MySQL and SQL Server, and the Debezium 3.0 Oracle connector needs
      one (it falls back to Kafka schema history and stops at startup without its topic), so the Oracle source cannot
      run with this chart (it is not offered under Source database).
  - path: sink.nats.username
    reason: >-
      The chart writes it as nats-jetstream.username, but the Debezium Server NATS JetStream sink reads
      auth.user, so the value is never sent.
  - path: sink.http.username
    reason: Written only with authentication type basic, which the Debezium Server HTTP sink refuses at startup.
  - path: sink.eventhubs.hubName
    reason: >-
      The chart writes eventhubs.connection.string and eventhubs.hub.name, but the Debezium Server Event Hubs
      sink requires eventhubs.connectionstring and eventhubs.hubname and stops at startup without them, so the
      Event Hubs sink cannot run with this chart (it is not offered under Sink).

migrations:
  # 1.2.0 moved every credential into the prerequisite secret (README "Upgrading from 1.1.x", CHANGELOG 1.2.0).
  - fromVersions: "<1.2.0"
    from: source.database.password
    note: Put the database password in the credentials secret as sourcePassword, and choose the secret under Credentials.
  - fromVersions: "<1.2.0"
    from: source.mongodb.connectionString
    note: If the release used it, put it in the credentials secret as mongodbConnectionString.
  - fromVersions: "<1.2.0"
    from: source.offset.redis.password
    note: If the release used it, put it in the credentials secret as offsetRedisPassword.
  - fromVersions: "<1.2.0"
    from: source.offset.jdbc.password
    note: If the release used it, put it in the credentials secret as offsetJdbcPassword.
  - fromVersions: "<1.2.0"
    from: source.schemaHistory.redis.password
    note: If the release used it, put it in the credentials secret as schemaHistoryRedisPassword.
  - fromVersions: "<1.2.0"
    from: source.schemaHistory.jdbc.password
    note: If the release used it, put it in the credentials secret as schemaHistoryJdbcPassword.
  - fromVersions: "<1.2.0"
    from: sink.kafka.saslPassword
    note: If the release used it, put it in the credentials secret as kafkaSaslPassword.
  - fromVersions: "<1.2.0"
    from: sink.redis.password
    note: If the release used it, put it in the credentials secret as sinkRedisPassword.
  - fromVersions: "<1.2.0"
    from: sink.nats.password
    note: >-
      If the release used it, there is nothing to move: the Debezium Server NATS JetStream sink does not read the
      NATS credentials this chart writes. Also clear sink.nats.username in YAML mode, or the chart still reads
      natsPassword from the credentials secret.
  - fromVersions: "<1.2.0"
    from: sink.http.password
    note: >-
      If the release used it, there is nothing to move: it served only Basic authentication, which the
      Debezium Server HTTP sink refuses at startup, so the endpoint must accept requests without credentials.
  - fromVersions: "<1.2.0"
    from: sink.http.bearerToken
    note: >-
      If the release used it, there is nothing to move: it served only Bearer authentication, which the
      Debezium Server HTTP sink refuses at startup, so the endpoint must accept requests without credentials.
  - fromVersions: "<1.2.0"
    from: sink.pulsar.authToken
    note: If the release used it, put it in the credentials secret as pulsarAuthToken.
  - fromVersions: "<1.2.0"
    from: sink.eventhubs.connectionString
    note: >-
      If the release used it, there is nothing to move: the Debezium Server Event Hubs sink cannot run with
      this chart, which writes property names that sink does not read. Choose another sink under Sink.
  - fromVersions: "<1.2.0"
    from: format.schemaRegistry.password
    note: If the release used it, put it in the credentials secret as schemaRegistryPassword.
  # 1.1.x turned these on whenever the credential was not empty; the switches keep the release's behaviour
  # (null computes nothing, so a release without the credential keeps the default false; dyn() lets the
  # ternary mix a bool and null).
  - fromVersions: "<1.2.0"
    to: source.mongodb.useConnectionString
    valueExpr: "self.source.mongodb.connectionString != null && self.source.mongodb.connectionString != '' ? dyn(true) : null"
    note: Turned on because the release had a connection string, which versions before 1.2.0 used whenever one was set.
  - fromVersions: "<1.2.0"
    to: source.offset.redis.authEnabled
    valueExpr: "self.source.offset.redis.password != null && self.source.offset.redis.password != '' ? dyn(true) : null"
    note: Turned on because the release had a Redis offset store password, which versions before 1.2.0 used whenever one was set.
  - fromVersions: "<1.2.0"
    to: source.schemaHistory.redis.authEnabled
    valueExpr: "self.source.schemaHistory.redis.password != null && self.source.schemaHistory.redis.password != '' ? dyn(true) : null"
    note: Turned on because the release had a Redis schema history password, which versions before 1.2.0 used whenever one was set.
  - fromVersions: "<1.2.0"
    to: sink.redis.authEnabled
    valueExpr: "self.sink.redis.password != null && self.sink.redis.password != '' ? dyn(true) : null"
    note: Turned on because the release had a Redis sink password, which versions before 1.2.0 used whenever one was set.
  - fromVersions: "<1.2.0"
    to: sink.pulsar.authEnabled
    valueExpr: "self.sink.pulsar.authToken != null && self.sink.pulsar.authToken != '' ? dyn(true) : null"
    note: Turned on because the release had a Pulsar auth token, which versions before 1.2.0 used whenever one was set.
