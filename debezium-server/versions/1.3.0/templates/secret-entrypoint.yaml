{{- if and (eq .Values.source.type "postgres") (gt (int .Values.source.postgres.heartbeatIntervalMs) 0) }}
kind: secret
name: {{ include "debezium.entrypoint.name" . }}
description: Debezium Server entrypoint script for PostgreSQL prerequisites
tags:
  {{- include "debezium.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |
    #!/bin/bash

    set -o nounset

    echo "=== Debezium Server Entrypoint ==="

    # Find the PostgreSQL JDBC driver JAR (bundled with Debezium Server)
    JDBC_JAR=$(find /debezium -name "postgresql-*.jar" -print -quit 2>/dev/null || true)
    if [ -z "${JDBC_JAR}" ]; then
      echo "WARNING: PostgreSQL JDBC driver not found. Skipping prerequisites."
      exec /debezium/run.sh
    fi
    echo "Using JDBC driver: ${JDBC_JAR}"

    # Waits for the database, then creates the heartbeat table that heartbeatActionQuery
    # writes to. It deliberately does NOT create the replication slot: Debezium creates the
    # publication first and the slot second. A slot that is older than its publication can
    # never decode the changes in between ("publication ... does not exist"), so the
    # connector would stop for good on a fresh database.
    # Run from source by the image's JDK (single-file source launch), so nothing is precompiled.
    cat > /tmp/PgInit.java <<'JAVA'
    import java.sql.Connection;
    import java.sql.DriverManager;
    import java.sql.SQLException;
    import java.sql.Statement;

    public class PgInit {
        public static void main(String[] args) throws Exception {
            if (args.length < 5) {
                System.err.println("Usage: PgInit <host> <port> <dbname> <user> <password>");
                System.exit(1);
            }
            String url = "jdbc:postgresql://" + args[0] + ":" + args[1] + "/" + args[2];
            int attempts = 30;
            Connection conn = null;
            for (int i = 1; conn == null; i++) {
                try {
                    conn = DriverManager.getConnection(url, args[3], args[4]);
                } catch (SQLException e) {
                    if (i >= attempts) {
                        System.err.println("ERROR: Could not connect after " + attempts + " attempts: " + e.getMessage());
                        System.exit(1);
                    }
                    System.out.println("  Attempt " + i + "/" + attempts + " - retrying in 5s... (" + e.getMessage() + ")");
                    Thread.sleep(5000);
                }
            }
            System.out.println("Connected to PostgreSQL.");
            try (Connection c = conn; Statement s = c.createStatement()) {
                System.out.println("Ensuring debezium_heartbeat table exists...");
                s.execute("CREATE TABLE IF NOT EXISTS debezium_heartbeat (id INTEGER PRIMARY KEY, ts TIMESTAMP NOT NULL DEFAULT now())");
                s.execute("INSERT INTO debezium_heartbeat (id, ts) VALUES (1, now()) ON CONFLICT (id) DO NOTHING");
                System.out.println("Heartbeat table ready.");
            }
        }
    }
    JAVA

    echo "Running PostgreSQL prerequisites..."
    java -cp "${JDBC_JAR}" /tmp/PgInit.java \
      "${DB_HOSTNAME}" \
      "{{ include "debezium.databasePort" . }}" \
      "{{ .Values.source.database.name }}" \
      "${DB_USER}" \
      "${DB_PASSWORD}" || echo "WARNING: Prerequisites script returned non-zero. Debezium Server will start anyway."

    echo "=== Starting Debezium Server ==="
    exec /debezium/run.sh
{{- end }}
