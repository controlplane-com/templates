# dify 2.0.0 — the production-leaning shape at the smallest size that runs: two replicas of the gateway,
# web, API, sandbox and SSRF proxy, two Celery workers, the bundled single PostgreSQL (pgvector, PostgreSQL 19) and a
# one-node Redis that requires a password, with one extraEnv setting. All credentials are prerequisite
# secrets CI creates (hex, so every value is letters and digits). The initPassword must be at most 30
# characters, so it uses the 22-character kraft-cluster-id generator (base64url; Dify accepts it).
locations: [aws-us-east-1]
timeoutSeconds: 1200

generated:
  pgpw: hex
  redispw: hex
  secretkey: hex
  plugkey: hex
  innerkey: hex
  sandboxkey: hex
  adminpw: hex
  initpw: kraft-cluster-id

secrets:
  app:
    type: dictionary
    entries:
      secretKey: "{gen.secretkey}"
      initPassword: "{gen.initpw}"
      pluginDaemonKey: "{gen.plugkey}"
      pluginInnerApiKey: "{gen.innerkey}"
  sandbox:
    type: opaque
    payload: "{gen.sandboxkey}"
  db:
    type: dictionary
    entries:
      username: dify
      password: "{gen.pgpw}"
      database: dify
  redis:
    type: dictionary
    entries:
      password: "{gen.redispw}"

vars:
  dify_version: "1.19.0"            # the version the API's /health reports; bump with the image tag
  admin_email: admin@example.com
  admin_password: "Dify1{gen.adminpw}"   # Dify requires a letter and a digit
  init_password: "{gen.initpw}"
  redis_password: "{gen.redispw}"
  pg_user: dify
  pg_password: "{gen.pgpw}"
  pg_db: dify

values:
  dify:
    replicas: 2
    secretName: "{secrets.app.name}"
    extraEnv:
      - name: UPLOAD_FILE_SIZE_LIMIT
        value: "7"
  worker:
    replicas: 2
  codeExecution:
    apiKeySecretName: "{secrets.sandbox.name}"
  ssrfProxy:
    enabled: true
  postgres:
    config:
      credentialsSecretName: "{secrets.db.name}"
  postgresHA:
    config:
      credentialsSecretName: "{secrets.db.name}"
  redis:
    redis:
      auth:
        fromSecret:
          enabled: true
          name: "{secrets.redis.name}"

# The highly available database mode as its own fresh install: Dify on a new postgres-highly-available cluster
# (PostgreSQL 18) through its HAProxy endpoint, the same checks proving apps, workflows and knowledge bases work.
variants:
  - name: ha
    values:
      postgres:
        enabled: false
      postgresHA:
        enabled: true
    timeoutSeconds: 1500

# 2.0.0 runs the single-instance database on PostgreSQL 19 (pgvector/pgvector:0.8.7-pg19), so a plain upgrade
# of a 1.0.1 release (data on PostgreSQL 18) must be REFUSED by the postgres boot guard with the data untouched;
# the upgrade pinned to pgvector/pgvector:0.8.7-pg18 then succeeds on the original data.
upgradeFrom:
  - version: 1.0.1
    refused: {timeoutSeconds: 420}
    then: {set: {postgres: {image: "pgvector/pgvector:0.8.7-pg18"}}}
