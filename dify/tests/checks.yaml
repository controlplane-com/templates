            outputs=[dict(variable='result', value_selector=['1002', 'result'], value_type='string')]))
        edges = [dict(id='e1', source='1001', sourceHandle='source', target='1002', targetHandle='target', type='custom', data=dict(sourceType='start', targetType='code')),
                 dict(id='e2', source='1002', sourceHandle='source', target='1003', targetHandle='target', type='custom', data=dict(sourceType='code', targetType='end'))]
        dsl = dict(version='0.7.0', kind='app', dependencies=[],
            app=dict(name='e2e-egress-' + secrets.token_hex(3), mode='workflow', icon='\U0001F916', icon_background='#FFEAD5', description=''),
