# Feature checks for the dify template. Each runs after install (and after each upgrade) on every version in
# its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars
# (dify_version, admin_email, admin_password, init_password, redis_password).
#
# The checks are Python (standard library only) run in the API container against its own port 127.0.0.1:5001,
# or through the gateway's internal address to prove its routing. The runner reads any {word} as a
# placeholder, so the scripts use % formatting and dict(), never f-strings or dict literals. The console
# API sets __Host- cookies (the public URL is https), which urllib's cookie jar drops over plain http, so
# the scripts carry the cookies and the X-CSRF-Token header by hand.
checks:
  - id: boot-version
    description: >-
      The API reports the baseline's dify_version, and the gateway's internal address routes /console/api to the
      API and / to the web tier.
    exec:
      workload: "{release}-dify-api"
      container: api
      script: |
        python3 - <<'PY'
        import json, urllib.request, urllib.error
        def get(u):
            try:
                with urllib.request.urlopen(u, timeout=30) as r:
                    return r.status, r.read().decode()
            except urllib.error.HTTPError as e:
                return e.code, e.read().decode()
        c, b = get('http://127.0.0.1:5001/health')
        v = json.loads(b).get('version') if c == 200 else None
        print('VERSION_OK' if v == '{dify_version}' else 'VERSION_BAD %d %s' % (c, b[:200]))
        G = 'http://{release}-dify.{gvc}.cpln.local:8080'
        c, b = get(G + '/console/api/system-features')
        print('GATEWAY_API_OK' if c == 200 and 'is_allow_register' in b else 'GATEWAY_API_BAD %d %s' % (c, b[:200]))
        c, b = get(G + '/signin')
        print('GATEWAY_WEB_OK' if c == 200 and '<html' in b.lower() else 'GATEWAY_WEB_BAD %d' % c)
        PY
    expect:
      stdout: "(?s)^VERSION_OK\nGATEWAY_API_OK\nGATEWAY_WEB_OK$"
    retries: 10
    retryDelaySeconds: 15

  - id: init-password-guard
    description: >-
      The initPassword guards first setup: a wrong init password and a setup without a validated init are
      refused, the right password lets setup create the admin, and a second setup is refused. On a release that
      is already set up (a re-run, or after an upgrade), it prints ALREADY_SET_UP instead of SETUP_OK, init and
      setup are both refused, and LOGIN_OK proves the admin exists.
    exec:
      workload: "{release}-dify-api"
      container: api
      script: |
        python3 - <<'PY'
        import base64, json, urllib.request, urllib.error
        B = 'http://127.0.0.1:5001'
        JAR = dict()
        def req(m, p, body=None):
            h = dict()
            if JAR:
                h['Cookie'] = '; '.join(k + '=' + v for k, v in JAR.items())
            data = None
            if body is not None:
                data = json.dumps(body).encode()
                h['Content-Type'] = 'application/json'
            try:
                r = urllib.request.urlopen(urllib.request.Request(B + p, data=data, headers=h, method=m), timeout=60)
                c = r.status
            except urllib.error.HTTPError as e:
                r, c = e, e.code
            for sc in r.headers.get_all('Set-Cookie') or []:
                k, _, v = sc.split(';', 1)[0].partition('=')
                JAR[k.strip()] = v
            return c, r.read().decode()
        setup = dict(email='{admin_email}', name='admin', password='{admin_password}')
        c, b = req('GET', '/console/api/setup')
        if json.loads(b).get('step') != 'finished':
            c, _ = req('POST', '/console/api/init', dict(password='wrong-init-password'))
            print('WRONG_INIT_REFUSED' if 400 <= c < 500 else 'WRONG_INIT_GOT %d' % c)
            JAR.clear()
            c, _ = req('POST', '/console/api/setup', setup)
            print('UNVALIDATED_SETUP_REFUSED' if 400 <= c < 500 else 'UNVALIDATED_SETUP_GOT %d' % c)
            c, b = req('POST', '/console/api/init', dict(password='{init_password}'))
            ok = c in (200, 201) and 'success' in b
            c, b = req('POST', '/console/api/setup', setup)
            print('SETUP_OK' if ok and c in (200, 201) and 'success' in b else 'SETUP_BAD %d %s' % (c, b[:200]))
        else:
            c, _ = req('POST', '/console/api/init', dict(password='wrong-init-password'))
            print('WRONG_INIT_REFUSED' if 400 <= c < 500 else 'WRONG_INIT_GOT %d' % c)
            c, _ = req('POST', '/console/api/setup', setup)
            print('UNVALIDATED_SETUP_REFUSED' if 400 <= c < 500 else 'UNVALIDATED_SETUP_GOT %d' % c)
            print('ALREADY_SET_UP')
        JAR.clear()
        c, _ = req('POST', '/console/api/init', dict(password='{init_password}'))
        c, b = req('POST', '/console/api/setup', setup)
        print('SECOND_SETUP_REFUSED' if 400 <= c < 500 else 'SECOND_SETUP_GOT %d' % c)
        pw = base64.b64encode('{admin_password}'.encode()).decode()
        JAR.clear()
        c, b = req('POST', '/console/api/login', dict(email='{admin_email}', password=pw, remember_me=False))
        print('LOGIN_OK' if c == 200 and any(k.endswith('access_token') for k in JAR) else 'LOGIN_BAD %d %s' % (c, b[:200]))
        PY
    expect:
      stdout: "(?s)^WRONG_INIT_REFUSED\nUNVALIDATED_SETUP_REFUSED\n(SETUP_OK|ALREADY_SET_UP)\nSECOND_SETUP_REFUSED\nLOGIN_OK$"
    retries: 3
    retryDelaySeconds: 20
    timeoutSeconds: 180

  - id: single-workspace
    description: >-
      Self sign-up is off, as the licence allows one workspace per install: system-features reports registration
      off, the email sign-up endpoint is refused with 403, and the admin's account lists exactly one workspace.
    exec:
      workload: "{release}-dify-api"
      container: api
      script: |
        python3 - <<'PY'
        import base64, json, time, urllib.request, urllib.error
        B = 'http://127.0.0.1:5001'
        JAR = dict()
        def req(m, p, body=None):
            h = dict()
            if JAR:
                h['Cookie'] = '; '.join(k + '=' + v for k, v in JAR.items())
                for k, v in JAR.items():
                    if k.endswith('csrf_token'):
                        h['X-CSRF-Token'] = v
            data = None
            if body is not None:
                data = json.dumps(body).encode()
                h['Content-Type'] = 'application/json'
            try:
                r = urllib.request.urlopen(urllib.request.Request(B + p, data=data, headers=h, method=m), timeout=60)
                c = r.status
            except urllib.error.HTTPError as e:
                r, c = e, e.code
            for sc in r.headers.get_all('Set-Cookie') or []:
                k, _, v = sc.split(';', 1)[0].partition('=')
                JAR[k.strip()] = v
            return c, r.read().decode()
        c, b = req('GET', '/console/api/system-features')
        f = json.loads(b) if c == 200 else dict()
        print('REGISTER_FLAG_OFF' if f.get('is_allow_register') is False else 'REGISTER_FLAG_GOT %d %s' % (c, f.get('is_allow_register')))
        c, b = req('POST', '/console/api/email-register/send-email', dict(email='e2e-signup@example.com', language='en-US'))
        print('SIGNUP_REFUSED' if c == 403 else 'SIGNUP_GOT %d %s' % (c, b[:200]))
        pw = base64.b64encode('{admin_password}'.encode()).decode()
        for _ in range(6):
            c, b = req('POST', '/console/api/login', dict(email='{admin_email}', password=pw, remember_me=False))
            if c != 429:
                break
            time.sleep(20)
        c, b = req('GET', '/console/api/workspaces')
        n = len(json.loads(b).get('workspaces') or []) if c == 200 else -1
        print('ONE_WORKSPACE' if n == 1 else 'WORKSPACES_GOT %d %d' % (c, n))
        PY
    expect:
      stdout: "(?s)^REGISTER_FLAG_OFF\nSIGNUP_REFUSED\nONE_WORKSPACE$"
    retries: 3
    retryDelaySeconds: 20

  - id: public-url
