            elif JAR:
                h['Cookie'] = '; '.join(k + '=' + v for k, v in JAR.items())
                for k, v in JAR.items():
                    if k.endswith('csrf_token'):
                        h['X-CSRF-Token'] = v
            data = None
            if body is not None:
                data = json.dumps(body).encode()
                h['Content-Type'] = 'application/json'
            try:
                r = urllib.request.urlopen(urllib.request.Request(B + p, data=data, headers=h, method=m), timeout=120)
                c = r.status
            except urllib.error.HTTPError as e:
                r, c = e, e.code
            if not auth:
                for sc in r.headers.get_all('Set-Cookie') or []:
                    k, _, v = sc.split(';', 1)[0].partition('=')
                    JAR[k.strip()] = v
            return c, r.read().decode()
        pw = base64.b64encode('{admin_password}'.encode()).decode()
        for _ in range(6):
            c, b = req('POST', '/console/api/login', dict(email='{admin_email}', password=pw, remember_me=False))
            if c != 429:
                break
            time.sleep(20)
        c, b = req('POST', '/console/api/datasets/api-keys')
        key = json.loads(b)['token']
        c, b = req('POST', '/v1/datasets', dict(name='e2e-kb-' + secrets.token_hex(3), indexing_technique='economy'), auth=key)
        ds = json.loads(b)['id']
        token = 'zq' + secrets.token_hex(6)
        text = 'The control word for this end to end check is ' + token + '. It appears only in this document.'
        c, b = req('POST', '/v1/datasets/' + ds + '/document/create-by-text',
                   dict(name='e2e.txt', text=text, indexing_technique='economy', process_rule=dict(mode='automatic')), auth=key)
        batch = json.loads(b)['batch']
        status = ''
        for _ in range(40):
            c, b = req('GET', '/v1/datasets/' + ds + '/documents/' + batch + '/indexing-status', auth=key)
            rows = json.loads(b).get('data') or []
            status = rows[0].get('indexing_status') if rows else ''
            if status in ('completed', 'error'):
                break
            time.sleep(5)
        c, b = req('POST', '/v1/datasets/' + ds + '/retrieve', dict(query=token), auth=key)
        hit = c == 200 and token in b
        print('KB_OK' if status == 'completed' and hit else 'KB_BAD %s %d %s' % (status, c, b[:200]))
        PY
    expect:
      stdout: "^KB_OK$"
    retries: 3
    retryDelaySeconds: 30
    timeoutSeconds: 420

  - id: plugin-installs
    description: >-
      The plugin daemon installs a signed tool plugin from the Dify marketplace, and the workspace lists it as
      installed.
    exec:
      workload: "{release}-dify-api"
      container: api
      script: |
        python3 - <<'PY'
        import base64, json, time, urllib.request, urllib.error
        B = 'http://127.0.0.1:5001'
        PLUGIN = 'langgenius/openai_api_compatible'
        JAR = dict()
        def req(m, p, body=None):
            h = dict()
            if JAR:
                h['Cookie'] = '; '.join(k + '=' + v for k, v in JAR.items())
                for k, v in JAR.items():
                    if k.endswith('csrf_token'):
                        h['X-CSRF-Token'] = v
            data = None
            if body is not None:
                data = json.dumps(body).encode()
                h['Content-Type'] = 'application/json'
            try:
                r = urllib.request.urlopen(urllib.request.Request(B + p, data=data, headers=h, method=m), timeout=120)
                c = r.status
            except urllib.error.HTTPError as e:
                r, c = e, e.code
            for sc in r.headers.get_all('Set-Cookie') or []:
                k, _, v = sc.split(';', 1)[0].partition('=')
                JAR[k.strip()] = v
            return c, r.read().decode()
        pw = base64.b64encode('{admin_password}'.encode()).decode()
        for _ in range(6):
            c, b = req('POST', '/console/api/login', dict(email='{admin_email}', password=pw, remember_me=False))
            if c != 429:
                break
            time.sleep(20)
        def installed():
            c, b = req('GET', '/console/api/workspaces/current/plugin/list?page=1&page_size=100')
            return c == 200 and any(p.get('plugin_id') == PLUGIN for p in json.loads(b).get('plugins', []))
        if not installed():
            ua = dict(Accept='application/json')
            ua['User-Agent'] = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
            mreq = urllib.request.Request('https://marketplace.dify.ai/api/v1/plugins/' + PLUGIN, headers=ua)
            m = json.loads(urllib.request.urlopen(mreq, timeout=30).read())
            ident = m['data']['plugin']['latest_package_identifier']
            c, b = req('POST', '/console/api/workspaces/current/plugin/install/marketplace', dict(plugin_unique_identifiers=[ident]))
            if c != 200:
                print('INSTALL_BAD %d %s' % (c, b[:300])); raise SystemExit
            task = (json.loads(b) or dict()).get('task_id')
            last = ''
            for _ in range(60):
                if installed():
                    break
                if task:
                    tc, last = req('GET', '/console/api/workspaces/current/plugin/tasks/' + task)
                    if '"status": "failed"' in last or '"status":"failed"' in last:
                        break
                time.sleep(5)
            if not installed():
                print('PLUGIN_BAD task=%s %s' % (task, last[:400])); raise SystemExit
        print('PLUGIN_OK' if installed() else 'PLUGIN_BAD')
        PY
    expect:
      stdout: "^PLUGIN_OK$"
    retries: 2
    retryDelaySeconds: 30
    timeoutSeconds: 480

