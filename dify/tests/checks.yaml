  - id: ssrf-proxy-filters
    description: >-
      The SSRF proxy the API sends user-driven requests through fetches a public https page but refuses an
      in-GVC address (the API's own *.cpln.local name) and the link-local metadata address.
    exec:
      workload: "{release}-dify-api"
      container: api
      script: |
        python3 - <<'PY'
        import os, urllib.request, urllib.error
        p = os.environ.get('SSRF_PROXY_HTTP_URL', '')
        o = urllib.request.build_opener(urllib.request.ProxyHandler(dict(http=p, https=p)))
        def fetch(u):
            try:
                return 'OK ' + o.open(u, timeout=30).read().decode(errors='replace')
            except urllib.error.HTTPError as e:
                return 'HTTP %d' % e.code
            except Exception as e:
                return 'ERR %s' % e
        r = fetch('https://example.com/')
        print('PUBLIC_ALLOWED' if p and r.startswith('OK') and 'Example Domain' in r else 'PUBLIC_BAD %s' % r[:120])
        r = fetch('http://{release}-dify-api.{gvc}.cpln.local:5001/health')
        print('GVC_REFUSED' if r == 'HTTP 403' else 'GVC_GOT %s' % r[:120])
        r = fetch('http://169.254.169.254/')
        print('METADATA_REFUSED' if r == 'HTTP 403' else 'METADATA_GOT %s' % r[:120])
        PY
    expect:
      stdout: "(?s)^PUBLIC_ALLOWED\nGVC_REFUSED\nMETADATA_REFUSED$"
    retries: 4
    retryDelaySeconds: 15

  - id: redis-requires-password
    description: The bundled Redis refuses a command without the password and answers PONG with it.
    exec:
      workload: "{release}-dify-api"
      container: api
      script: |
        python3 - <<'PY'
        import socket
        def ask(cmds):
            s = socket.create_connection(('{release}-redis.{gvc}.cpln.local', 6379), timeout=15)
            out = []
            for c in cmds:
                s.sendall(c)
                out.append(s.recv(256).decode(errors='replace').strip())
            s.close()
            return out
        r = ask([b'PING\r\n'])
        print('NOAUTH_REFUSED' if r[0].startswith('-NOAUTH') else 'NOAUTH_GOT %s' % r)
        pw = '{redis_password}'.encode()
        r = ask([b'*2\r\n$4\r\nAUTH\r\n$' + str(len(pw)).encode() + b'\r\n' + pw + b'\r\n', b'PING\r\n'])
        print('AUTH_PONG' if r == ['+OK', '+PONG'] else 'AUTH_GOT %s' % r)
        PY
    expect:
      stdout: "(?s)^NOAUTH_REFUSED\nAUTH_PONG$"

  - id: workers-answer
    description: Both Celery worker replicas (worker.replicas 2 in the baseline) answer a ping over the Redis broker.
    exec:
      workload: "{release}-dify-api"
      container: api
      shell: bash
      script: |
        cd /app/api && n="$(celery -A app.celery inspect ping --timeout 15 2>/dev/null | grep -c 'pong')"
        echo "WORKERS $n"
    expect:
      stdout: "^WORKERS 2$"
    retries: 6
    retryDelaySeconds: 20
    timeoutSeconds: 180

