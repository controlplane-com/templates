  - id: workflow-code-node
    description: >-
      A workflow imported as DSL (Start, a Python Code node, End), published and run through the gateway's
      service API with an app key, returns its random input repeated 7 times: the code ran in the sandbox.
    exec:
      workload: "{release}-dify-api"
      container: api
      script: |
        python3 - <<'PY'
        import base64, json, secrets, time, urllib.request, urllib.error
        B = 'http://127.0.0.1:5001'
        G = 'http://{release}-dify.{gvc}.cpln.local:8080'
        JAR = dict()
        def req(m, p, body=None, base=B, auth=None):
            h = dict()
            if auth:
                h['Authorization'] = 'Bearer ' + auth
            elif JAR:
                h['Cookie'] = '; '.join(k + '=' + v for k, v in JAR.items())
                for k, v in JAR.items():
                    if k.endswith('csrf_token'):
                        h['X-CSRF-Token'] = v
            data = None
            if body is not None:
                data = json.dumps(body).encode()
                h['Content-Type'] = 'application/json'
            try:
                r = urllib.request.urlopen(urllib.request.Request(base + p, data=data, headers=h, method=m), timeout=120)
                c = r.status
            except urllib.error.HTTPError as e:
                r, c = e, e.code
            if not auth:
                for sc in r.headers.get_all('Set-Cookie') or []:
                    k, _, v = sc.split(';', 1)[0].partition('=')
                    JAR[k.strip()] = v
            return c, r.read().decode()
        pw = base64.b64encode('{admin_password}'.encode()).decode()
        for _ in range(6):
            c, b = req('POST', '/console/api/login', dict(email='{admin_email}', password=pw, remember_me=False))
            if c != 429:
                break
            time.sleep(20)
        code = 'def main(a: str) -> dict:\n    return dict(result=a * 7)\n'
        start = dict(id='1001', type='custom', position=dict(x=0, y=0), data=dict(type='start', title='Start', desc='',
            variables=[dict(variable='a', label='a', type='text-input', required=True, max_length=48, options=[])]))
        node = dict(id='1002', type='custom', position=dict(x=300, y=0), data=dict(type='code', title='Code', desc='',
            code_language='python3', code=code, variables=[dict(variable='a', value_selector=['1001', 'a'])],
            outputs=dict(result=dict(type='string', children=None))))
        end = dict(id='1003', type='custom', position=dict(x=600, y=0), data=dict(type='end', title='End', desc='',
            outputs=[dict(variable='result', value_selector=['1002', 'result'], value_type='string')]))
        edges = [dict(id='e1', source='1001', sourceHandle='source', target='1002', targetHandle='target', type='custom', data=dict(sourceType='start', targetType='code')),
                 dict(id='e2', source='1002', sourceHandle='source', target='1003', targetHandle='target', type='custom', data=dict(sourceType='code', targetType='end'))]
        dsl = dict(version='0.7.0', kind='app', dependencies=[],
            app=dict(name='e2e-code-' + secrets.token_hex(3), mode='workflow', icon='\U0001F916', icon_background='#FFEAD5', description=''),
            workflow=dict(graph=dict(nodes=[start, node, end], edges=edges, viewport=dict(x=0, y=0, zoom=1)),
                features=dict(), environment_variables=[], conversation_variables=[]))
        c, b = req('POST', '/console/api/apps/imports', dict(mode='yaml-content', yaml_content=json.dumps(dsl, ensure_ascii=False)))
        imp = json.loads(b)
        app_id = imp.get('app_id')
        if not app_id:
            print('IMPORT_BAD %d %s' % (c, b[:300])); raise SystemExit
        c, b = req('POST', '/console/api/apps/' + app_id + '/workflows/publish', dict(marked_name='', marked_comment=''))
        c, b = req('POST', '/console/api/apps/' + app_id + '/api-keys')
        key = json.loads(b)['token']
        probe = secrets.token_hex(4)
        c, b = req('POST', '/v1/workflows/run', dict(inputs=dict(a=probe), response_mode='blocking', user='e2e'), base=G, auth=key)
        out = (json.loads(b).get('data') or dict()).get('outputs') or dict() if c == 200 else dict()
        print('CODE_NODE_OK' if out.get('result') == probe * 7 else 'CODE_NODE_BAD %d %s' % (c, b[:300]))
        PY
    expect:
      stdout: "^CODE_NODE_OK$"
    retries: 3
    retryDelaySeconds: 30
    timeoutSeconds: 300

  - id: code-node-egress
