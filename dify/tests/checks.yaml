            if c != 429:
                break
            time.sleep(20)
        c, b = req('GET', '/console/api/files/upload')
        limit = json.loads(b).get('file_size_limit') if c == 200 else None
        print('EXTRA_ENV_OK' if limit == 7 else 'EXTRA_ENV_BAD %d %s' % (c, b[:200]))
        PY
    expect:
      stdout: "^EXTRA_ENV_OK$"
    retries: 3
    retryDelaySeconds: 20

  - id: gateway-timeout
    description: The gateway holds a request for dify.requestTimeoutSeconds (600 by default) before cutting it.
    exec:
      workload: "{release}-dify"
      container: gateway
      script: |
        n="$(grep -c -e 'proxy_read_timeout 600s;' -e 'proxy_send_timeout 600s;' /etc/nginx/conf.d/default.conf)"
        echo "TIMEOUTS $n"
    expect:
      stdout: "^TIMEOUTS 2$"
