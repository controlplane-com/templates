        c, b = req('POST', '/v1/workflows/run', dict(inputs=dict(a=probe), response_mode='blocking', user='e2e'), base=G, auth=key)
        out = (json.loads(b).get('data') or dict()).get('outputs') or dict() if c == 200 else dict()
        print(out.get('result') or 'EGRESS_BAD %d %s' % (c, b[:300]))
