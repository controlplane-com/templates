# ─── Location ─────────────────────────────────────────────────────────────────
# The ONE location of your GVC that Directus runs in; it must already be a GVC location.
location: aws-us-east-1

# ─── Directus ─────────────────────────────────────────────────────────────────
directus:
  image: directus/directus:12.6.1
  # 1-10 interchangeable replicas; 2+ needs redis.enabled: true (shared cache, locks, scheduled flows)
  # set directus.replicas: 2, redis.enabled: true and postgresHA.enabled: true for near-zero-downtime upgrades and failover
  replicas: 1
  publicUrl: ""          # empty = canonical endpoint (http://localhost:8055 when private); custom domain with scheme, e.g. https://cms.example.com
  resources:
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 2Gi       # headroom for image transformations

# ─── Prerequisite secret: signing secret and first admin ──────────────────────
# REQUIRED — MUST EXIST BEFORE INSTALL, or the deployment WEDGES silently. A `dictionary` with the keys
# secret (e.g. openssl rand -hex 32), adminEmail and adminPassword (first boot only; see README Prerequisites).
secrets:
  name: my-directus-secrets

# ─── License key (optional) ───────────────────────────────────────────────────
# Without a key Directus runs on the free Core tier (3 Studio users, 25 collections, 5 flows).
license:
  secretName: ""         # optional `opaque` secret (encoding plain) holding your license key, e.g. my-directus-license

# ─── File storage ─────────────────────────────────────────────────────────────
storage:
  type: local            # local (shared volume, deleted on uninstall) | s3
  local:
    capacity: 10         # GiB (minimum 10)
  s3:
    bucket: my-directus-bucket
    region: us-east-1
    endpoint: ""         # S3-compatible servers only, e.g. http://my-minio.GVC.cpln.local:9000
    forcePathStyle: false   # true for most S3-compatible servers (MinIO)
    cloudAccountName: my-directus-cloud-account   # AWS keyless auth (used when auth.secretName is empty)
    policyName: my-directus-s3-policy             # your bucket-scoped IAM policy (README Storage setup)
    auth:
      secretName: ""     # S3-compatible servers only: dictionary with accessKeyId + secretAccessKey, e.g. my-directus-s3-keys

# ─── Response cache ───────────────────────────────────────────────────────────
cache:
  enabled: false         # cache API reads (in Redis when redis.enabled, else per replica); purged on every write

# ─── Email ────────────────────────────────────────────────────────────────────
email:
  enabled: false         # off = no user invites or password-reset mail
  fromAddress: no-reply@example.com
  host: smtp.example.com
  port: 587
  secure: false          # false = STARTTLS/plain (587); true = implicit TLS (465)
  auth:
    secretName: ""       # optional dictionary with username + password, e.g. my-directus-smtp

# ─── Access ───────────────────────────────────────────────────────────────────
publicAccess:
  enabled: true          # the API and Studio on the canonical *.cpln.app endpoint
internalAccess:
  type: same-gvc         # none | same-gvc | same-org | workload-list
  workloads: []          # workload-list only; this release's own workloads are always added
  # workloads:
  #   - //gvc/GVC_NAME/workload/WORKLOAD_NAME

# ─── Database: single-instance PostgreSQL (default) ───────────────────────────
# set postgresHA.enabled: true (and postgres.enabled: false) for near-zero-downtime upgrades and failover
postgres:
  enabled: true
  image: postgres:18
  config:
    # REQUIRED — MUST EXIST BEFORE INSTALL, or the deployment WEDGES silently. A `dictionary` with the
    # keys username, password, database (see README Prerequisites).
    credentialsSecretName: my-directus-db-credentials
  resources:
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10         # GiB (minimum 10)

  backup:                # pass-through to the postgres template's backup feature
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0   # tag must match the postgres major
    schedule: "0 2 * * *"   # daily at 02:00 UTC
    resources:
      cpu: 100m
      memory: 128Mi
    provider: aws        # aws | gcp | minio
    aws:
      bucket: my-directus-backup-bucket
      region: us-east-1
      cloudAccountName: my-directus-backup-cloudaccount
      policyName: my-directus-backup-policy
      prefix: directus/backups
    gcp:
      bucket: my-directus-backup-bucket
      cloudAccountName: my-directus-backup-cloudaccount
      prefix: directus/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-directus-backup-bucket
      credentialsSecretName: my-directus-minio-credentials   # provider minio only: dictionary with accessKey + secretKey
      prefix: directus/backups

# ─── Database: highly available PostgreSQL (opt-in) ───────────────────────────
# 3 Patroni replicas, 3 etcd and an HAProxy leader endpoint; enable exactly one of postgres / postgresHA.
postgresHA:
  enabled: false
  config:
    # REQUIRED in HA mode — MUST EXIST BEFORE INSTALL. Same `dictionary` shape as postgres.config above.
    credentialsSecretName: my-directus-db-credentials
  replicas: 3
  resources:
    minCpu: 500m
    maxCpu: 1000m
    minMemory: 1Gi
    maxMemory: 2Gi
  volumeset:
    capacity: 10         # GiB per replica (minimum 10)

  backup:                # pass-through to the postgres-highly-available template's backup feature
    enabled: false
    mode: logical        # logical | wal-g
    resources:
      cpu: 100m
      memory: 512Mi      # wal-g backups need at least 512Mi
    logical:
      image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
      schedule: "0 2 * * *"   # daily at 02:00 UTC
    walg:
      intervalSeconds: 21600  # every 6 hours
    provider: aws        # aws | gcp | minio
    aws:
      bucket: my-directus-backup-bucket
      region: us-east-1
      cloudAccountName: my-directus-backup-cloudaccount
      policyName: my-directus-backup-policy
      prefix: directus/backups
    gcp:
      bucket: my-directus-backup-bucket
      cloudAccountName: my-directus-backup-cloudaccount
      prefix: directus/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-directus-backup-bucket
      credentialsSecretName: my-directus-minio-credentials   # provider minio only: dictionary with accessKey + secretKey
      prefix: directus/backups

# ─── Redis (opt-in; required for 2+ replicas) ─────────────────────────────────
# One Redis node for Directus's shared cache, locks, message bus and scheduled-flow sync.
# Holds no data of record: a Redis restart only empties the cache.
redis:
  enabled: false
  mode: dev              # required — the chart refuses production (Sentinel) mode
  redis:
    image: redis:8
    resources:
      maxCpu: 200m
      maxMemory: 256Mi
      minCpu: 80m
      minMemory: 128Mi
    auth:
      # Off by default (the same-GVC firewall is the boundary). To require AUTH, create a
      # `dictionary` secret with the key `password` BEFORE install, then enable it here.
      fromSecret:
        enabled: false
        name: ""         # e.g. my-directus-redis
        passwordKey: password
