---
kind: secret
name: {{ include "docmost.secret.creds.name" . }}
description: Docmost bundled-component credentials (DATABASE_URL / REDIS_URL assembly)
tags: {{- include "docmost.tags" . | nindent 4 }}
type: dictionary
data:
  postgresUsername: {{ .Values.postgres.config.username | quote }}
  postgresPassword: {{ .Values.postgres.config.password | quote }}
  redisPassword: {{ .Values.redis.auth.password | quote }}
