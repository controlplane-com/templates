---
{{- /*
  The bundled Redis password only. Up to 1.1.0 this secret also carried a COPY of
  the database username and password; since 1.2.0 the database credentials live
  only in the user's prerequisite secret (postgres.config.credentialsSecretName),
  which Docmost and the postgres subchart both read. The name is unchanged so an
  upgrade needs no new reveal grant for the Redis password.
*/}}
kind: secret
name: {{ include "docmost.secret.creds.name" . }}
description: Docmost bundled Redis password (REDIS_URL assembly)
tags: {{- include "docmost.tags" . | nindent 4 }}
type: dictionary
data:
  redisPassword: {{ .Values.redis.auth.password | quote }}
