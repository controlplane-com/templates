# Default install: single-instance PostgreSQL 19, documents in the database, public endpoint, no SMTP.
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  cert: pkcs12                      # throwaway self-signed .p12 → {gen.cert}, {gen.cert.passphrase}

secrets:
  app:
    type: dictionary
    keys: [nextAuthSecret, encryptionKey, encryptionSecondaryKey]
    entries:
      signingPassphrase: "{gen.cert.passphrase}"
  cert:
    type: opaque
    payload: "{gen.cert}"
  db:
    type: dictionary
    keys: [password]
    entries: {username: documenso, database: documenso}

vars:
  pg_user: documenso
  pg_password: "{secrets.db.password}"
  pg_db: documenso

values:
  location: aws-us-east-1
  secrets:
    name: "{secrets.app.name}"
  signing:
    certificateSecretName: "{secrets.cert.name}"
  postgres:
    config:
      credentialsSecretName: "{secrets.db.name}"

# The highly available database (postgres-highly-available 3.0.0): a fresh HA install, where every Documenso
# check runs against the HAProxy leader endpoint and ha-is-18 proves the new cluster's major.
variants:
  - name: ha
    values:
      postgres:
        enabled: false
      postgresHA:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"
    timeoutSeconds: 1200

# 2.0.0 runs the single-instance PostgreSQL on 19, so a plain upgrade of a 1.1.0 release (data on PostgreSQL
# 18) must be REFUSED by the postgres boot guard with the data untouched; the upgrade pinned to postgres:18,
# as the guard says, then succeeds and the document sealed on 1.1.0 survives.
upgradeFrom:
  - version: 1.1.0
    refused: {timeoutSeconds: 420}
    then: {set: {postgres: {image: "postgres:18"}}}
