---
{{- /*
  Credentials for the BUNDLED database, in the shape both PostgreSQL subcharts
  read: exactly the keys username, password and database. Internal plumbing —
  no human ever types this password into a client or a connection string — so
  the bundled-plumbing exception applies and it stays a template-created secret
  rather than a prerequisite the user creates.

  postgres 3.4.0 and postgres-highly-available 2.5.0 both stopped creating this
  secret and now take only its NAME, which is why the chart on this side of the
  dependency owns it.

  ONE secret, not two (docmost renders two). Its whole contents are exactly what
  both sides need — username, password, database — so a second copy would add a
  resource and buy no isolation. docmost needs the split only because its app
  secret also carries a Redis password it must not hand to the Postgres identity.
*/}}
kind: secret
name: {{ include "documenso.secret.db.name" . }}
description: Documenso bundled PostgreSQL credentials
tags: {{- include "documenso.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.database.username | quote }}
  password: {{ .Values.database.password | quote }}
  database: {{ .Values.database.name | quote }}
