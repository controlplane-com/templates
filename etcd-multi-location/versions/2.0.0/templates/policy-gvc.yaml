{{- /*
The etcd container reads its own GVC at boot to confirm the GVC really has every
location this release declares. The platform does not validate localOptions
locations: an entry naming a location the GVC lacks is accepted, stored and
inert, so the declared member never starts and the cluster forms on a bare
majority while reporting healthy. Scoped to the ONE install GVC; never
`target: all`, which would grant view on every GVC in the org.
*/}}
kind: policy
name: {{ include "etcd-ml.policy.gvc.name" . }}
description: etcd GVC read policy
tags: {{- include "etcd-ml.tags" . | nindent 4 }}
bindings:
  - permissions:
      - view
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "etcd-ml.identity.name" . }}
targetKind: gvc
targetLinks:
  - //gvc/{{ .Values.global.cpln.gvc }}
