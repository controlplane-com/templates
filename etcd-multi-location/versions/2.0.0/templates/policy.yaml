kind: policy
name: {{ include "etcd-ml.policy.name" . }}
description: etcd policy
tags: {{- include "etcd-ml.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "etcd-ml.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ include "etcd-ml.secretStartup.name" . }}
