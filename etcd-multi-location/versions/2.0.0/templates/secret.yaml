kind: secret
name: {{ include "etcd-ml.secretStartup.name" . }}
description: etcd startup script
tags: {{- include "etcd-ml.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -euo pipefail

    # Runtime env provided by Control Plane. GVC comes from the built-in, not
    # from Helm: this chart no longer creates or names a GVC, so a render-time
    # name could only ever drift from where the workload actually runs.
    GVC=${CPLN_GVC}
    LOCATION=${CPLN_LOCATION##*/}
    HOSTNAME=${HOSTNAME}

    # Extract replica index from HOSTNAME (always 0 — one member per location)
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
    WORKLOAD_NAME=$(echo "${HOSTNAME}" | sed 's/-[0-9]*$//')

    # Self FQDN for peer and client URLs
    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"

    # One member per location; the member name is location-qualified so it is
    # stable across restarts and reschedules.
    ETCD_NAME="${WORKLOAD_NAME}-${LOCATION}"
    LOCATIONS=({{ range .Values.global.locations }}"{{ .name }}" {{ end }})
    CONFIGURED_LOCS="${LOCATIONS[*]}"
    TOTAL=${#LOCATIONS[@]}
    INITIAL_CLUSTER=""
    for loc in "${LOCATIONS[@]}"; do
      peer="replica-0.${WORKLOAD_NAME}.${loc}.${GVC}.cpln.local"
      entry="${WORKLOAD_NAME}-${loc}=http://${peer}:2380"
      if [[ -z "$INITIAL_CLUSTER" ]]; then
        INITIAL_CLUSTER="$entry"
      else
        INITIAL_CLUSTER="${INITIAL_CLUSTER},$entry"
      fi
    done

    # --- Check A: never form a member identity in an undeclared location ---
    # defaultOptions.minScale/maxScale are 0, so the platform should never place
    # a replica in a location this release did not ask for. This is the last
    # line of defence if it does: ETCD_NAME is derived from CPLN_LOCATION, so
    # such a member starts with an --initial-cluster that does not contain
    # itself. etcd's own message for that state is obscure; name the real cause.
    # Unconditional — fresh or not, this member can never be a cluster member.
    case " ${CONFIGURED_LOCS} " in
      *" ${LOCATION} "*) : ;;
      *) echo "[etcd] FATAL: this member is running in location '${LOCATION}', which is not in the configured location list (${CONFIGURED_LOCS})." >&2
         echo "[etcd] Its member name '${ETCD_NAME}' does not appear in --initial-cluster, so it can never join. Remove this location from GVC '${GVC}', or add it to global.locations in your values." >&2
         exit 1 ;;
    esac

    # etcd warns that the mounted data dir is world-readable and recommends 0700.
    # The mount point is created by the platform, so tighten it at boot.
    chmod 700 /var/lib/etcd 2>/dev/null || true

    # Determine cluster state from the retained data directory
    if [ -d "/var/lib/etcd/member" ] && [ "$(ls -A /var/lib/etcd/member)" ]; then
        INITIAL_CLUSTER_STATE="existing"
        FRESH="false"
    else
        INITIAL_CLUSTER_STATE="new"
        FRESH="true"
    fi

    # --- GVC location reconciliation ---
    # The platform accepts a localOptions entry naming a location the GVC does
    # not have: it is stored verbatim and is simply inert. For etcd that is the
    # worst possible failure, because --initial-cluster is the DECLARED set and
    # a `new` bootstrap only needs a majority of it: 3 declared / 2 present
    # forms a healthy-looking cluster with ZERO fault tolerance, and nothing
    # anywhere says so. Helm cannot see a live GVC, and peer unreachability is
    # not usable as the signal (surviving a peer outage is the product). So ask
    # the GVC itself.
    #
    # Bounding, measured in THIS image against a blackholed address
    # (192.0.2.1 — an NXDOMAIN control returned in 6 s, so a fast control would
    # have proved nothing): curl's own `--retry 3 --retry-delay 2 --max-time 10`
    # took 46 s, because --max-time is per attempt and not a retry cap. The
    # retry is therefore done in shell, each attempt bounded twice: --max-time 8
    # is what normally fires, and `timeout 12` is the backstop if curl itself
    # hangs. Worst case 3x12 + 2x2 = 40 s; measured 28 s of guard time on a
    # blackhole and 7 s on an HTTP 403. Both `timeout` and curl 8.12 are in the
    # image. Do not tighten further: a timeout short enough to trip on a slow
    # API turns this check off exactly when it is needed.
    GVC_LOCS=""
    GVC_READ_OK="false"
    GVC_HTTP="000"
    GVC_CHECK_TMP=$(mktemp)
    for _try in 1 2 3; do
      GVC_HTTP=$(timeout 12 curl -sS -o "${GVC_CHECK_TMP}" -w '%{http_code}' \
        --max-time 8 \
        -H "Authorization: ${CPLN_TOKEN:-}" \
        "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>/dev/null) || GVC_HTTP="000"
      if [ "${GVC_HTTP}" = "200" ]; then
        GVC_LOCS=$(tr -d ' \n' < "${GVC_CHECK_TMP}" \
          | sed -n 's/.*"locationLinks":\[\([^]]*\)\].*/\1/p' \
          | tr ',' '\n' | sed 's#.*/##;s/"//g' | tr '\n' ' ')
        if [ -n "${GVC_LOCS}" ]; then
          GVC_READ_OK="true"
          break
        fi
      fi
      sleep 2
    done
    rm -f "${GVC_CHECK_TMP}"

    MISSING=""
    PRESENT=0
    if [ "${GVC_READ_OK}" != "true" ]; then
      # A control-plane hiccup must never be the reason etcd refuses to start.
      # Skip the API-backed checks; Check A above still applies.
      echo "[etcd] WARNING: could not read the location list of GVC '${GVC}' (HTTP ${GVC_HTTP}) — skipping the GVC location check." >&2
    else
      for loc in ${CONFIGURED_LOCS}; do
        case " ${GVC_LOCS} " in
          *" ${loc} "*) PRESENT=$((PRESENT+1)) ;;
          *) MISSING="${MISSING}${loc} " ;;
        esac
      done
      EXTRA=""
      for loc in ${GVC_LOCS}; do
        case " ${CONFIGURED_LOCS} " in
          *" ${loc} "*) : ;;
          *) EXTRA="${EXTRA}${loc} " ;;
        esac
      done
      if [ -n "${EXTRA}" ]; then
        echo "[etcd] GVC '${GVC}' also has locations this release does not use: ${EXTRA% } — no etcd member runs there (minScale/maxScale are 0 outside localOptions)."
      fi

      # --- Check B: quorum must be arithmetically possible ---
      # Deliberately BEFORE check C: when locations are missing AND that costs
      # the cluster its majority, both are true and "quorum can never be
      # reached" is the more specific and more actionable of the two. It also
      # turns what would otherwise be an unbounded wait for peers that can never
      # exist into an immediate, named failure.
      if [ $((2 * PRESENT)) -le "${TOTAL}" ]; then
        if [ "${FRESH}" = "true" ]; then
          echo "[etcd] FATAL: quorum is unreachable. ${PRESENT} of ${TOTAL} configured locations (${CONFIGURED_LOCS}) exist in GVC '${GVC}' (which has: ${GVC_LOCS% })." >&2
          echo "[etcd] --initial-cluster declares ${TOTAL} members and a 'new' bootstrap needs floor(${TOTAL}/2)+1 of them to elect at all. Refusing to wait for an election that can never complete." >&2
          echo "[etcd] Add the missing location(s) to the GVC, or remove them from global.locations in your values." >&2
          exit 1
        fi
        echo "[etcd] WARNING: only ${PRESENT} of ${TOTAL} configured locations (${CONFIGURED_LOCS}) exist in GVC '${GVC}' — below the majority this cluster needs to commit a write." >&2
        echo "[etcd] This member is already initialised, so it keeps running rather than taking a live cluster down. See 'Recovering from a lost location' in the README." >&2
      # --- Check C: every declared location must exist in the GVC ---
      # Asymmetric on purpose: hard-fail ONLY on a fresh data directory. A fresh
      # member is being asked to bootstrap a cluster on a BARE MAJORITY of a
      # roster whose remaining members can never exist — it would report healthy
      # while one location from permanent quorum loss. An already-initialised
      # member is a different situation: a location removed from the GVC is
      # indistinguishable from one that is down, and hard-failing would turn
      # "lost one member" into "lost the cluster". It also must not block the
      # --force-new-cluster recovery path, which by definition runs on a
      # non-fresh data directory.
      elif [ -n "${MISSING}" ]; then
        if [ "${FRESH}" = "true" ]; then
          echo "[etcd] FATAL: locations declared in global.locations are not in GVC '${GVC}': ${MISSING% }" >&2
          echo "[etcd] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
          echo "[etcd] ${PRESENT} of ${TOTAL} declared members can actually start. That is a bare majority: the cluster would form, report healthy, and have ZERO fault tolerance — losing any one location would lose quorum permanently. Refusing to bootstrap it." >&2
          echo "[etcd] Add the missing location(s) to the GVC, or remove them from global.locations in your values." >&2
          exit 1
        fi
        echo "[etcd] WARNING: locations declared in global.locations are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "[etcd] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "[etcd] This member is already initialised, so it keeps serving — but members in the missing location(s) will never appear, and only ${PRESENT} of ${TOTAL} declared members exist." >&2
      else
        echo "[etcd] GVC location check OK — '${GVC}' has every configured location (${CONFIGURED_LOCS})"
      fi
    fi

    EXTRA_FLAGS=()
    {{- if .Values.recovery.forceNewClusterInLocation }}
    # EMERGENCY: rebuild a single-member cluster from this member's own WAL after
    # a permanent loss of quorum. Applies to one location only.
    #
    # The render-time check can only compare this against the VALUES list. If the
    # named location is in the values but not in the GVC, no member runs there,
    # the flag is never applied, and the operator sees nothing happen during an
    # outage. Every surviving member says so instead.
    if [ "${GVC_READ_OK}" = "true" ]; then
      case " ${GVC_LOCS} " in
        *" {{ .Values.recovery.forceNewClusterInLocation }} "*) : ;;
        *) echo "[etcd] WARNING: recovery.forceNewClusterInLocation is set to '{{ .Values.recovery.forceNewClusterInLocation }}', which GVC '${GVC}' does not have (it has: ${GVC_LOCS% }). No member runs there, so --force-new-cluster will NEVER be applied. Set it to a location this GVC actually has." >&2 ;;
      esac
    fi
    if [ "${LOCATION}" = "{{ .Values.recovery.forceNewClusterInLocation }}" ]; then
      echo "RECOVERY: --force-new-cluster is set for location ${LOCATION}"
      EXTRA_FLAGS+=(--force-new-cluster)
    fi
    {{- end }}

    echo "Starting etcd node '${ETCD_NAME}' with cluster state: $INITIAL_CLUSTER_STATE"
    echo "Initial cluster: $INITIAL_CLUSTER"

    # Run etcd
    exec etcd \
      --name "${ETCD_NAME}" \
      --data-dir /var/lib/etcd \
      --listen-client-urls "http://0.0.0.0:2379" \
      --advertise-client-urls "http://${SELF_FQDN}:2379" \
      --listen-peer-urls "http://0.0.0.0:2380" \
      --initial-advertise-peer-urls "http://${SELF_FQDN}:2380" \
      --initial-cluster "$INITIAL_CLUSTER" \
      --initial-cluster-state "$INITIAL_CLUSTER_STATE" \
      --heartbeat-interval {{ .Values.tuning.heartbeatIntervalMs }} \
      --election-timeout {{ .Values.tuning.electionTimeoutMs }} \
      {{- if .Values.tuning.quotaBackendBytes }}
      --quota-backend-bytes {{ .Values.tuning.quotaBackendBytes }} \
      {{- end }}
      --auto-compaction-mode {{ .Values.tuning.autoCompactionMode }} \
      --auto-compaction-retention {{ .Values.tuning.autoCompactionRetention }} \
      ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"}
