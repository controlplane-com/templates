kind: volumeset
name: {{ include "etcd-ml.volume.name" . }}
description: etcd volumeset
gvc: {{ .Values.global.gvc.name }}
tags:
  {{- include "etcd-ml.tags" . | nindent 2 }}
  workload: {{ include "etcd-ml.name" . }}
spec:
  fileSystemType: ext4
  initialCapacity: {{ .Values.volumeset.capacity }}
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: 7d
