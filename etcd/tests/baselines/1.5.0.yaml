# etcd 1.5.0 — the default install: three members in one location (the chart's minimum, an odd quorum),
# no client auth, so no prerequisite secrets. Resources are cut to 500m / 512Mi, the size the
# etcd-multi-location template ships by default with the same image. Daily volume snapshots are on by
# default from this version.
locations: [aws-us-east-1]
timeoutSeconds: 900

vars:
  members: "3"

values:
  replicas: 3
  resources:
    cpu: 500m
    memory: 512Mi

upgradeFrom:
  - version: 1.4.2
