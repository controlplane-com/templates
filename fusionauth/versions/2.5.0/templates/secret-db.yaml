{{- /*
  Credentials for the BUNDLED database. Internal plumbing: no human ever types this
  password — it exists only so FusionAuth can reach its own Postgres — so the
  bundled-plumbing exception applies and it stays a template-created secret rather
  than a prerequisite the user has to create. postgres 3.4.0 stopped creating this
  secret and now only takes its NAME, which is why the chart on this side of the
  dependency owns it.

  The three keys are named exactly as the postgres subchart reads them: username,
  password, database.
*/}}
kind: secret
name: {{ include "fusionauth.secretPostgres.name" . }}
description: FusionAuth bundled PostgreSQL credentials
tags: {{- include "fusionauth.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
