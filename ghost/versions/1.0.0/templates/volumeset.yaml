kind: volumeset
name: {{ include "ghost.volume.name" . }}
gvc: {{ .Values.global.cpln.gvc }}
description: Ghost content directory (uploaded images, themes, logs, adapters)
tags: {{- include "ghost.tags" . | nindent 4 }}
spec:
  fileSystemType: ext4
  initialCapacity: {{ .Values.volumeset.capacity }}
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: 7d
