kind: secret
name: {{ include "ghost.secretStart.name" . }}
description: Ghost startup script (derives `url` from the canonical endpoint, then execs the image entrypoint)
tags: {{- include "ghost.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
    # Ghost bakes `url` into every generated link and email, and the canonical
    # *.cpln.app hostname is only known at runtime — so derive it here.
{{- if .Values.publicUrl }}
    export url="{{ .Values.publicUrl }}"
{{- else if .Values.publicAccess.enabled }}
    # CPLN_GLOBAL_ENDPOINT is already a full URL (https://...), NOT a bare host —
    # use it verbatim, never prepend a second scheme.
    export url="${CPLN_GLOBAL_ENDPOINT}"
{{- else }}
    # No public endpoint — links point at the internal in-GVC address.
    export url="http://{{ include "ghost.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:2368"
{{- end }}
    # Hand off to the image's own entrypoint with its default CMD so the root
    # chown + gosu-node step-down + theme-seed logic runs (docker-entrypoint.sh
    # keys on the `node ... current/index.js` arguments).
    exec docker-entrypoint.sh node current/index.js
