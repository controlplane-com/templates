# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Ghost

# One stateful Ghost replica and one stateful MySQL, each with its own volume: every GVC location
# would run its own copy of both.
gvc:
  minLocations: 1
  maxLocations: 1

# The bundled mysql 1.5.2 keys are bound here as plain fields (not imported)
# (they are all in this chart's `mysql:` block) and its chart checks are restated as rules.
steps:
  - id: ghost
    title: Ghost
    description: The two database secrets, then the Ghost image, its compute and content volume.
    sections:
      - title: Database credentials
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              Both database secrets must exist **before** you install or upgrade. If one is missing, the
              deployment waits and `cpln logs` shows nothing at all.
          - type: note
            severity: warning
            when: context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') < 0
            text: >-
              1.2.0 created the database secret itself (`<release>-mysql-config`), and this upgrade deletes it.
              Before upgrading, read it with `cpln secret reveal <release>-mysql-config -o yaml` and create two
              secrets under NEW names with the values the database was initialized with: a dictionary with
              `username` (from `user`), `password` and `database`, and an opaque secret holding `rootPassword`.
              After the upgrade the new version can wait about 10 minutes with "is not allowed to reveal the
              secret" while access to the new secrets propagates; the old version keeps serving meanwhile.
            textExpression: >-
              '1.2.0 created the database secret itself (`' + context.releaseName + '-mysql-config`), and this
              upgrade deletes it. Before upgrading, read it with `cpln secret reveal ' + context.releaseName +
              '-mysql-config -o yaml` and create two secrets under NEW names with the values the database was
              initialized with: a dictionary with `username` (from `user`), `password` and `database`, and an
              opaque secret holding `rootPassword`. After the upgrade the new version can wait about 10 minutes
              with "is not allowed to reveal the secret" while access to the new secrets propagates; the old
              version keeps serving meanwhile.'
          - path: mysql.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              MySQL is initialized with these on first boot, and Ghost connects with the same keys. To change the
              password later, change it inside MySQL first, then update the secret and force a redeployment of
              the MySQL and Ghost workloads.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-ghost-db-credentials'"
                hint: "Typical values: username ghost, database ghost, and a strong password."
          - path: mysql.rootPasswordSecretName
            type: ref
            label: MySQL root password secret
            required: true
            description: An opaque secret holding only the MySQL root password. Ghost never reads it.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                secretType: opaque
                encoding: plain
                suggestName: "context.releaseName + '-ghost-mysql-root-password'"
                hint: "Generate the content with: openssl rand -base64 24"
        rules:
          - rule: self.mysql.credentialsSecretName != '' && self.mysql.rootPasswordSecretName != ''
            mirrors: ghost.validateDatabaseSecrets
            paths: [mysql.credentialsSecretName, mysql.rootPasswordSecretName]
            message: Name both database secrets; the chart does not render without them.
          - when: context.releaseName != null
            rule: self.mysql.credentialsSecretName != context.releaseName + '-mysql-config'
            mirrors: ghost.validateDatabaseSecrets
            paths: [mysql.credentialsSecretName]
            message: >-
              This is the secret ghost 1.2.0 created itself, and upgrading to 1.3.0 deletes it. Create the
              credentials secret under a new name.
          - when: context.releaseName != null
            rule: self.mysql.rootPasswordSecretName != context.releaseName + '-mysql-config'
            mirrors: ghost.validateDatabaseSecrets
            paths: [mysql.rootPasswordSecretName]
            message: >-
              This is the secret ghost 1.2.0 created itself, and upgrading to 1.3.0 deletes it. Create the root
              password secret under a new name.
          - rule: self.mysql.credentialsSecretName != self.mysql.rootPasswordSecretName
            mirrors: ghost.validateDatabaseSecrets
            paths: [mysql.rootPasswordSecretName]
            message: The credentials and the root password must be two different secrets.
          - rule: >-
              oldSelf == null || !has(oldSelf.mysql.credentialsSecretName) ||
              self.mysql.credentialsSecretName == oldSelf.mysql.credentialsSecretName
            severity: info
            paths: [mysql.credentialsSecretName]
            message: >-
              MySQL reads the credentials only when its data directory is first initialized; pointing at another
              secret does not change the existing user or password.
      - title: Server
        docs: "#ghost-application"
        fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts Ghost, its single replica: the site is unavailable for a short time.
          - path: image
            type: string
            format: image
            label: Ghost image
            required: true
          - path: resources
            type: resources
            label: Resources
            required: true
            maxRatio: 4
            cpu: { min: 100m }
            memory: { min: 256Mi }
          - path: volumeset.capacity
            type: integer
            label: Content volume capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250]
            description: Uploaded images, themes, logs and adapters.
            help: Uninstalling the release deletes the volume set with everything on it.
        rules:
          - rule: "!has(self.resources.cpu) && !has(self.resources.memory)"
            mirrors: ghost.validateResourceKnobs
            paths: [resources]
            message: >-
              resources.cpu and resources.memory were renamed to resources.maxCpu and resources.maxMemory in
              1.1.0. Remove the old keys from the values.
          - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: site
    title: Site and access
    description: The public URL Ghost builds links with, and who reaches the site.
    sections:
      - title: Site URL
        docs: "#site-url"
        fields:
          - path: publicUrl
            type: string
            format: url
            label: Public URL
            placeholder: https://blog.example.com
            description: >-
              Used in every link and email. Leave empty to use the canonical endpoint; set it once a custom
              domain fronts the workload.
            # The start script writes it into export url="..." (templates/secret-start.yaml) under set -eu.
            pattern: '^[^"$`\\]*$'
            patternMessage: >-
              Leave out double quotes, $, backticks and backslashes: the start script writes the URL into a
              shell string, where they would change or stop it.
      - title: Public access
        docs: "#access"
        fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public HTTPS endpoint
            description: The site and the admin at `/ghost` on the workload's `*.cpln.app` endpoint.
      - title: Internal access
        docs: /reference/workload/firewall
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            options:
              - { value: none, label: None, description: No workload can reach Ghost internally. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
          # workload.yaml writes any non-empty list into inboundAllowWorkload, whatever the type.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internalAccess.type == 'same-gvc'
            rules:
              - when: self.internalAccess.type == 'same-org'
                rule: size(self.internalAccess.workloads) == 0
                severity: info
                message: Same org already lets every workload of the org connect, so these entries add nothing.
              - when: self.internalAccess.type == 'none'
                rule: size(self.internalAccess.workloads) == 0
                severity: warning
                message: >-
                  The chart still writes these workloads into the firewall, but "None" lets none of them connect.
                  Remove them.
              - when: self.internalAccess.type == 'workload-list'
                rule: size(self.internalAccess.workloads) > 0
                severity: warning
                message: With "Specific workloads" and an empty list, no workload can reach Ghost internally.

  - id: email
    title: Email
    description: Outbound mail for member sign-in links, newsletters to members and staff email.
    sections:
      - fields:
          - id: mailMode
            virtual: true
            type: enum
            label: Email
            widget: cards
            required: true
            init: "self.mail.secretName != '' ? 'smtp' : 'off'"
            options:
              - value: 'off'
                label: Off
                description: >-
                  No email is sent; members cannot sign in by link. Choosing Off clears the SMTP login secret and
                  turns staff device verification off.
                set: { mail.secretName: '', staffDeviceVerification: false }
              - value: smtp
                label: SMTP
                description: Ghost sends through your SMTP server.
      - title: SMTP
        when: ui.mailMode == 'smtp'
        docs: "#mail-smtp"
        fields:
          - path: mail.secretName
            type: ref
            label: SMTP login secret
            required: true
            description: A dictionary secret with the keys `user` and `password`.
            help: After rotating it, force a redeployment of the Ghost workload; a running replica keeps the old login.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [user, password]
              create:
                suggestName: "context.releaseName + '-ghost-smtp'"
          - path: mail.host
            type: string
            format: hostname
            label: SMTP server
            required: true
            placeholder: smtp.mailgun.org
          - path: mail.port
            type: integer
            label: Port
            required: true
            min: 1
            max: 65535
            suggestions: [587, 465, 25]
          - path: mail.secure
            type: boolean
            label: Implicit TLS
            description: On for port 465; off for STARTTLS on 587.
          - path: mail.from
            type: string
            label: Sender
            required: true
            placeholder: Ghost <noreply@example.com>
          - path: staffDeviceVerification
            type: boolean
            label: Staff device verification
            description: >-
              Ghost emails staff a code on every admin sign-in from a new device. Turn it on once mail works:
              without working mail, staff cannot sign in to `/ghost`.
        rules:
          - rule: self.mail.host != '' && self.mail.from != ''
            mirrors: ghost.validate
            paths: [mail.host, mail.from]
            message: The SMTP server and the sender are required when an SMTP login secret is set.
          - rule: self.mail.secure == (self.mail.port == 465)
            severity: info
            paths: [mail.secure]
            message: Implicit TLS is normally on for port 465 and off for every other port.

  - id: database
    title: Database
    description: The bundled MySQL 8 that Ghost stores posts, members and settings in, and its backups.
    sections:
      - title: MySQL server
        docs: "#backing-database"
        fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              An upgrade that changes the database restarts MySQL; Ghost loses its connection until MySQL is
              back.
          - path: mysql.image
            type: string
            format: image
            label: MySQL image
            required: true
            description: Ghost supports MySQL 8 only, not MySQL 9 or MariaDB.
          - path: mysql.resources
            type: resources
            label: MySQL resources
            required: true
            maxRatio: 4
            cpu: { min: 50m }
            memory: { min: 128Mi }
          - path: mysql.volumeset.capacity
            type: integer
            label: Database volume capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250]
            help: Uninstalling the release deletes the volume set and the database on it.
        rules:
          - rule: imageMajor(self.mysql.image) < 0 || imageMajor(self.mysql.image) == 8
            severity: warning
            paths: [mysql.image]
            message: Ghost supports MySQL 8 only; it refuses other MySQL majors.
          - rule: >-
              oldSelf == null || imageMajor(self.mysql.image) < 0 || imageMajor(oldSelf.mysql.image) < 0 ||
              imageMajor(self.mysql.image) == imageMajor(oldSelf.mysql.image)
            severity: warning
            paths: [mysql.image]
            message: The data directory belongs to the installed MySQL major version; keep the same major.
          - rule: oldSelf == null || self.mysql.volumeset.capacity >= oldSelf.mysql.volumeset.capacity
            paths: [mysql.volumeset.capacity]
            message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - title: Database network
        docs: /reference/workload/firewall
        fields:
          - path: mysql.internalAccess.type
            type: enum
            label: Who can connect to MySQL
            widget: cards
            required: true
            description: >-
              Ghost connects to its database like any other workload: keep Same GVC, or list the Ghost workload
              under Specific workloads.
            options:
              - { value: none, label: None, description: No workload can connect. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
          - path: mysql.internalAccess.workloads
            type: list
            label: Workloads allowed to connect to MySQL
            widget: tags
            when: self.mysql.internalAccess.type == 'workload-list'
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
        rules:
          - rule: self.mysql.internalAccess.type != 'none'
            paths: [mysql.internalAccess.type]
            message: '"None" also blocks Ghost, which connects to its database like any other workload.'
          - rule: self.mysql.internalAccess.type != 'workload-list' || size(self.mysql.internalAccess.workloads) > 0
            paths: [mysql.internalAccess.workloads]
            message: Specific workloads needs at least one workload; the mysql chart does not render without one.
          - when: self.mysql.internalAccess.type == 'workload-list' && context.gvc != null && context.releaseName != null
            rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-ghost') in self.mysql.internalAccess.workloads
            severity: warning
            paths: [mysql.internalAccess.workloads]
            messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-ghost, or Ghost cannot reach its database.'"
            fix:
              path: mysql.internalAccess.workloads
              items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-ghost']"
            message: Add the Ghost workload to the list, or Ghost cannot reach its database.
      - id: backup
        title: Scheduled backups
        toggle: mysql.backup.enabled
        description: Adds one cron workload that dumps the Ghost database and uploads it to your bucket.
        docs: "#backing-up"
        fields:
          - path: mysql.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: mysql.backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
          - path: mysql.backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
          - path: mysql.backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.mysql.backup.enabled && self.mysql.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: mysql.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: mysql.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: mysql.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: mysql.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            # The platform's identity PolicyRef pattern (the mysql chart writes the name inside double quotes).
            pattern: '^(aws::)?[A-Za-z0-9/+=,.@_-]+$'
            patternMessage: >-
              Use letters, digits and / + = , . @ _ -, optionally after aws:: for an AWS managed policy.
          - path: mysql.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.mysql.backup.enabled && self.mysql.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: mysql.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            # Written unquoted into the identity's GCP binding (mysql 1.5.2 templates/identity.yaml).
            pattern: '^(?:[a-z0-9][a-z0-9_-]{1,61}[a-z0-9]|(?=.{3,222}$)(?!.*[a-z0-9_-]{64})[a-z0-9][a-z0-9_.-]*\.[a-z0-9_.-]*[a-z0-9])$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits, hyphens and underscores, starting and ending with a
              letter or digit; a name with dots can have up to 222 characters, with at most 63 between dots.
          - path: mysql.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has Storage Object
              Admin on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: mysql.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.

rules:
  # No paths: staffDeviceVerification sits in the SMTP section, hidden when email is Off, and a rule whose
  # paths are all hidden is not shown.
  - rule: "!self.staffDeviceVerification || self.mail.secretName != ''"
    mirrors: ghost.validate
    message: >-
      staffDeviceVerification is on but email is off: Ghost emails the code, so without SMTP staff cannot sign in
      to the admin. Choose SMTP under Email, or set staffDeviceVerification to false in YAML.
  - rule: "!has(self.mysql.config) && !has(self.mysql.enablePhpMyAdmin)"
    mirrors: ghost.validateRemovedKeys
    paths: [mysql.credentialsSecretName]
    message: >-
      mysql.config and mysql.enablePhpMyAdmin were removed in 1.3.0: the database credentials are now the two
      prerequisite secrets under Ghost. Remove both keys from the values.

migrations:
  - fromVersions: "<1.3.0"
    from: mysql.config.db
    note: >-
      The database name moved into the database credentials secret (key database); use the same name the
      database was created with, and choose the secret under Ghost.
  - fromVersions: "<1.3.0"
    from: mysql.config.user
    note: >-
      The database user moved into the database credentials secret (key username); use the same user, and
      choose the secret under Ghost.
  - fromVersions: "<1.3.0"
    from: mysql.config.password
    note: >-
      The database password moved into the database credentials secret (key password). MySQL keeps the
      password it was initialized with, so put in the current one.
  - fromVersions: "<1.3.0"
    from: mysql.config.rootPassword
    note: >-
      The root password moved into its own opaque secret. MySQL keeps the root password it was initialized
      with, so put in the current one.
  - fromVersions: "<1.3.0"
    from: mysql.enablePhpMyAdmin
    note: >-
      This upgrade removes the public phpMyAdmin of earlier versions, whose PHP was affected by CVE-2026-109618
      and CVE-2026-109619. To have one again, set mysql.phpMyAdmin.enabled in YAML: it runs a patched PHP and
      is internal-only.
  - fromVersions: "<1.1.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<1.1.0"
    from: resources.memory
    to: resources.maxMemory
  - fromVersions: "<1.2.0"
    to: staffDeviceVerification
    valueExpr: "self.mail.secretName != '' ? dyn(true) : null"
    note: >-
      Earlier versions left Ghost's emailed staff sign-in code on. This release has SMTP, so the installed
      behaviour is kept and Staff device verification stays on.
