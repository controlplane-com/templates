kind: secret
name: {{ include "gitea.secret.env.name" . }}
description: Gitea app secrets and admin credentials
tags: {{- include "gitea.tags" . | nindent 4 }}
type: dictionary
data:
  secretKey: {{ .Values.gitea.security.secretKey | quote }}
  internalToken: {{ .Values.gitea.security.internalToken | quote }}
  jwtSecret: {{ .Values.gitea.security.jwtSecret | quote }}
  adminUsername: {{ .Values.gitea.admin.username | quote }}
  adminPassword: {{ .Values.gitea.admin.password | quote }}
  adminEmail: {{ .Values.gitea.admin.email | quote }}
