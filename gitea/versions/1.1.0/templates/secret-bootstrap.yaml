kind: secret
name: {{ include "gitea.secret.bootstrap.name" . }}
description: Gitea admin-bootstrap wrapper script
tags: {{- include "gitea.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu

    # The image entrypoint (docker-setup.sh) has already generated app.ini and run
    # environment-to-ini with the static GITEA__* env. Here we derive the public URLs
    # from the platform-injected canonical endpoint (a full URL — strip the scheme for
    # the bare host) and re-apply them before starting the server.
    HOST="${CPLN_GLOBAL_ENDPOINT#https://}"
    HOST="${HOST#http://}"

    export GITEA__server__ROOT_URL="https://${HOST}/"
    export GITEA__server__DOMAIN="${HOST}"
    {{- if .Values.ssh.enabled }}
    SSH_DOMAIN="{{ .Values.ssh.domain }}"
    if [ -z "${SSH_DOMAIN}" ]; then
      SSH_DOMAIN="${HOST}"
    fi
    export GITEA__server__SSH_DOMAIN="${SSH_DOMAIN}"
    {{- end }}

    environment-to-ini --config "${GITEA_APP_INI}"

    # Apply DB schema (idempotent).
    gitea -c "${GITEA_APP_INI}" migrate

    # Create the initial site admin. Idempotent across restarts: once the user exists
    # this exits non-zero, which we swallow so the workload still starts.
    gitea -c "${GITEA_APP_INI}" admin user create \
      --username "${GITEA_ADMIN_USERNAME}" \
      --password "${GITEA_ADMIN_PASSWORD}" \
      --email "${GITEA_ADMIN_EMAIL}" \
      --admin --must-change-password=false || true

    exec gitea -c "${GITEA_APP_INI}" web
