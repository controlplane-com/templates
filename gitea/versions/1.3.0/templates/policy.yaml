kind: policy
name: {{ include "gitea.policy.name" . }}
description: Gitea policy
tags:
  {{- include "gitea.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "gitea.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ include "gitea.secret.bootstrap.name" . }}
  # Prerequisite secrets the user creates — granted by name, nothing broader.
  - //secret/{{ include "gitea.secretPostgres.name" . }}
  - //secret/{{ .Values.gitea.auth.secretName }}
