# glitchtip 2.0.0 — the default install: highly available PostgreSQL (3 Patroni members, 3 etcd, HAProxy)
# and the bundled Redis with Sentinel, at the chart's default sizes. All three prerequisite secrets are
# generated per run.
locations: [aws-us-east-1]
timeoutSeconds: 1200

generated:
  pgpw: hex
  redispw: hex
  djangokey1: hex
  djangokey2: hex
  adminpw: hex

secrets:
  db:
    type: dictionary
    entries:
      username: glitchtip
      password: "{gen.pgpw}"
      database: glitchtip
  auth:
    type: dictionary
    entries:
      secretKey: "{gen.djangokey1}{gen.djangokey2}"
      adminEmail: e2e-admin@example.com
      adminPassword: "{gen.adminpw}"
  redis:
    type: dictionary
    entries:
      password: "{gen.redispw}"

vars:
  pg_user: glitchtip
  pg_password: "{gen.pgpw}"
  pg_db: glitchtip
  admin_email: e2e-admin@example.com

values:
  auth:
    secretName: "{secrets.auth.name}"
  postgresHA:
    config:
      credentialsSecretName: "{secrets.db.name}"
  redis:
    redis:
      auth:
        fromSecret:
          name: "{secrets.redis.name}"

# Single-instance PostgreSQL (the opt-in mode), which 2.0.0 moves to PostgreSQL 19: one more fresh install.
variants:
  - name: single
    values:
      postgresHA:
        enabled: false
      postgres:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"
    timeoutSeconds: 900

# 1.4.1 is the previous version (same values shape). Its baseline runs the HA database, so this upgrade
# moves postgres-highly-available 2.5.0 → 3.0.0, whose existing cluster keeps PostgreSQL 17: a plain
# upgrade. A refused single-instance upgrade from 1.4.1 is not expressible: the starting install always
# uses 1.4.1's own (HA) baseline.
upgradeFrom:
  - version: 1.4.1
