{{- if .Values.postgres.enabled }}
{{- /*
  Credentials for the BUNDLED single-instance database. Internal plumbing: no human
  ever types this password — it exists only so GlitchTip can reach its own Postgres —
  so the bundled-plumbing exception applies and it stays a template-created secret
  rather than a prerequisite the user has to create. (The credentials that DO guard a
  human-facing login — auth.secretName's Django signing key and the admin bootstrap
  login — remain user-created prerequisite secrets, unchanged from 1.1.0.)
  postgres 3.4.0 stopped creating this secret and now only takes its NAME, which is
  why the chart on this side of the dependency owns it.

  The three keys are named exactly as the postgres subchart reads them: username,
  password, database. The HA path is untouched — postgres-highly-available still
  creates its own {release}-postgres-config secret carrying the same three keys.
*/}}
kind: secret
name: {{ include "glitchtip.secret.db.name" . }}
description: GlitchTip bundled PostgreSQL credentials
tags: {{- include "glitchtip.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
{{- end }}
