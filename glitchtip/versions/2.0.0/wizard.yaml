# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: GlitchTip

# GlitchTip's web tier and worker are stateless, but both bundled databases and the Redis + Sentinel tier are
# single-location stateful workloads with no location handling: postgres and postgres-highly-available bring
# this limit with their imports, and redis 3.4.3 (no descriptor of its own, so its keys are parent fields
# below) needs the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 4.0.2
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: dbserver
    steps:
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Chosen in the Database step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # GlitchTip connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
      # The server step (image and compute) is bound in the parent's Database server step, so its upgrade note,
      # cross-major warning and image migration name this chart's README section; the child's checks are
      # restated there.
      - image
      - resources
    override:
      internalAccess.type:
        description: >-
          GlitchTip connects to its database like any other workload: keep Same GVC, or add the GlitchTip web
          and worker workloads under Allowed workloads.

  - template: postgres-highly-available
    version: 3.0.0
    alias: postgresHA
    when: self.postgresHA.enabled
    title: Highly available PostgreSQL
    after: dbserver
    steps:
      - { id: cluster, title: Database cluster, description: The Patroni-managed PostgreSQL members GlitchTip stores its issues and events in. }
      - { id: storage, title: Database storage }
      - { id: etcd, title: Database consensus }
      - { id: network, title: Database network }
      - id: backup
        title: Database backups
        description: >-
          Optional backups to object storage. Uninstalling the release deletes the database volumes, so turn
          this on if your issues and events matter.
    exclude:
      # Named in the Database step, next to the single-instance mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # GlitchTip connects to the HAProxy leader endpoint directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      multiZone:
        description: >-
          Applies to the PostgreSQL members and their HAProxy workloads. Confirm that your location supports
          multiple zones.
      internal_access.type:
        description: >-
          GlitchTip connects through the HAProxy endpoint like any other workload: keep Same GVC, or add the
          GlitchTip web and worker workloads under Allowed workloads.

steps:
  - id: glitchtip
    title: GlitchTip
    description: The GlitchTip image, the web tier and the background worker, and the prerequisite auth secret.
    sections:
      - title: Web tier
        docs: "#glitchtip-web-and-worker"
        fields:
          - path: image
            type: string
            format: image
            label: GlitchTip image
            required: true
            description: Used by both the web tier and the worker.
          - path: replicas
            type: integer
            label: Web replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: The web tier is stateless; every replica serves the UI, the API and SDK event ingest.
          - path: resources
            type: resources
            label: Web resources
            required: true
            description: Per web replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: >-
              !has(self.resources.cpu) && !has(self.resources.memory) &&
              !has(self.worker.resources.cpu) && !has(self.worker.resources.memory)
            mirrors: glitchtip.validateRemovedKeys
            paths: [resources]
            message: >-
              resources.cpu/memory and worker.resources.cpu/memory were renamed to maxCpu and maxMemory in 1.1.0.
              Remove the old keys from the values.
      - title: Background worker
        description: >-
          One replica that processes events, alerts, emails and scheduled jobs, and runs database migrations at
          boot. It is a fixed singleton.
        fields:
          - path: worker.resources
            type: resources
            label: Worker resources
            required: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: worker.concurrency
            type: integer
            label: Concurrent tasks
            required: true
            min: 1
            suggestions: [10, 20, 40]
            description: Async tasks the worker processes in parallel.
      - title: Auth and sign-up
        docs: "#authentication-and-registration"
        fields:
          - type: note
            severity: warning
            text: >-
              The auth secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: auth.secretName
            type: ref
            label: Auth secret
            required: true
            description: A dictionary secret with the keys `secretKey`, `adminEmail` and `adminPassword`.
            help: >-
              `secretKey` signs sessions and tokens: changing it logs every user out. The superuser login is seeded
              on first boot only, so change its password in the UI, not in the secret.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [secretKey, adminEmail, adminPassword]
              create:
                suggestName: "context.releaseName + '-glitchtip-auth'"
          - path: registration.enabled
            type: boolean
            label: Open self-signup
            description: >-
              Anyone who can reach the endpoint can create an account. Users created by an admin and invites work
              either way.
        rules:
          - rule: >-
              (!has(self.django) || !has(self.django.secretKey)) &&
              (!has(self.admin) || (!has(self.admin.email) && !has(self.admin.password)))
            mirrors: glitchtip.validateRemovedKeys
            paths: [auth.secretName]
            message: >-
              django.secretKey, admin.email and admin.password were removed in 1.1.0. Put them in the auth secret
              (keys secretKey, adminEmail and adminPassword) and remove them from the values.
      - id: email
        title: Outbound email
        docs: "#email"
        description: Invites, alerts and password resets.
        fields:
          - path: email.secretName
            type: ref
            label: Email secret
            description: >-
              Optional. An opaque secret whose payload is an email URL such as
              `smtp://user:password@smtp.example.com:587`. Leave empty to run without email.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                suggestName: "context.releaseName + '-glitchtip-email'"
          - path: email.fromAddress
            type: string
            label: From address
            format: email
            when: self.email.secretName != null && self.email.secretName != ''
            required: true

  - id: access
    title: Access
    description: The public endpoint, the URL in DSNs, and which workloads can reach GlitchTip inside Control Plane.
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        docs: "#access"
        description: >-
          The UI and SDK event ingest on the canonical endpoint. Browser SDKs and apps outside the GVC report
          through it.
      - path: domain
        type: string
        format: url
        label: Custom URL
        placeholder: https://errors.example.com
        description: >-
          Optional. The full URL used in DSNs and email links; leave empty to use the canonical endpoint. Changing
          it later changes every DSN.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: >-
          self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list'] && self.replicas >= 1 &&
          self.worker.concurrency >= 1
        mirrors: glitchtip.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: redis
    title: Redis
    description: The task queue, cache and sessions. Turned off, PostgreSQL carries them instead.
    sections:
      - id: redis
        title: Redis with Sentinel
        toggle: redis.enabled
        docs: "#redis"
        description: >-
          A Redis master with replicas, watched by Sentinels; GlitchTip connects through Sentinel. Turn it off for a
          lighter shape with lower throughput.
        fields:
          - path: redis.redis.auth.fromSecret.name
            type: ref
            label: Redis password secret
            required: true
            description: A dictionary secret with the key `password`. Redis, Sentinel and GlitchTip all read it.
            help: >-
              Create it before you install; if it is missing, the deployment waits and `cpln logs` shows nothing.
              Changing the password later takes more than a secret edit, because the Sentinels keep the old one:
              follow "Rotating the Redis password" in the README.
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [password]
              create:
                suggestName: "context.releaseName + '-glitchtip-redis'"
          - path: redis.redis.auth.fromSecret.enabled
            type: boolean
            label: Redis password on
            readOnly: true
            advanced: true
            description: GlitchTip's Sentinel URL carries this password, so it stays on.
          - path: redis.redis.replicas
            type: integer
            label: Redis nodes
            min: 1
            required: true
            suggestions: [1, 2, 3]
          - path: redis.sentinel.replicas
            type: integer
            label: Sentinels
            min: 1
            required: true
            suggestions: [1, 3, 5]
          - path: redis.redis.persistence.enabled
            type: boolean
            label: Redis persistence
            advanced: true
            description: Keep Redis data on a volume set across restarts.
          - path: redis.sentinel.persistence.enabled
            type: boolean
            label: Sentinel persistence
            advanced: true
            description: Keep the Sentinel state, including the current master, across restarts.
          - path: redis.redis.firewall.internal_inboundAllowType
            type: enum
            label: Who can connect to Redis
            advanced: true
            required: true
            options:
              - { value: same-gvc, label: Same GVC }
              - { value: same-org, label: Same org }
          - path: redis.sentinel.firewall.internal_inboundAllowType
            type: enum
            label: Who can connect to Sentinel
            advanced: true
            required: true
            options:
              - { value: same-gvc, label: Same GVC }
              - { value: same-org, label: Same org }
        rules:
          - rule: >-
              self.redis.redis.auth.fromSecret.enabled == true &&
              self.redis.redis.auth.fromSecret.name != null && self.redis.redis.auth.fromSecret.name != '' &&
              (!has(self.redis.sentinel.auth) ||
              ((!has(self.redis.sentinel.auth.password) || !has(self.redis.sentinel.auth.password.enabled)) &&
              (!has(self.redis.sentinel.auth.fromSecret) || !has(self.redis.sentinel.auth.fromSecret.enabled))))
            mirrors: glitchtip.validate
            paths: [redis.redis.auth.fromSecret.name]
            message: >-
              The Redis password secret is required, and Sentinel authentication must stay off (remove
              redis.sentinel.auth from the values): GlitchTip sends the Redis password in its Sentinel URL and does
              not send a Sentinel password.
          - rule: "!has(self.redis.redis.auth.password)"
            mirrors: glitchtip.validateRedisSecret
            paths: [redis.redis.auth.fromSecret.enabled]
            message: >-
              redis.redis.auth.password was removed in 1.4.0: the Redis password is now a prerequisite dictionary
              secret (key password) named by the Redis password secret field. Remove redis.redis.auth.password from
              the values.
          # Upgrading from 1.3.x or earlier, the redis chart's own {release}-redis-auth-password secret is deleted
          # by the upgrade itself, so the new prerequisite secret must have a different name (same password).
          - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0
            rule: self.redis.redis.auth.fromSecret.name != context.releaseName + '-redis-auth-password'
            paths: [redis.redis.auth.fromSecret.name]
            message: >-
              The previous version created the Redis password secret itself, and this upgrade deletes it. Create a
              secret under a NEW name holding the CURRENT Redis password (not a new one: the Sentinels keep the
              password they started with), and name it here.
          - when: >-
              oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.4.0') >= 0) &&
              has(oldSelf.redis.redis.auth.fromSecret.name)
            rule: self.redis.redis.auth.fromSecret.name == oldSelf.redis.redis.auth.fromSecret.name
            severity: warning
            paths: [redis.redis.auth.fromSecret.name]
            message: >-
              Pointing at another secret changes the Redis password, and the Sentinels keep the old one. Follow
              "Rotating the Redis password" in the README instead.

  - id: database
    title: Database
    description: Which PostgreSQL holds GlitchTip's issues and events, and the prerequisite secret with its credentials.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            docs: "#database"
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
          # Declared so the imports' conditions are fields; the chooser above writes them, so they are never shown.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            when: self.postgres.enabled == null   # never shown: the Database choice writes it
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            when: self.postgresHA.enabled == null   # never shown: the Database choice writes it
            description: Set by the database choice above.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '2.0.0') < 0 &&
              self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
            text: >-
              Before you upgrade, update the IAM policy of your backup bucket to the action list in the README
              (AWS S3). The backup identity no longer carries `aws::ReadOnlyAccess`, so with the old policy the
              backups fail.
          - type: note
            severity: warning
            text: >-
              The database credentials secret must exist **before** you install; if it is missing, the
              deployment waits and `cpln logs` shows nothing at all.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint that GlitchTip connects through.
          Recommended for production. Its cluster, storage, consensus, network and backups follow in the next
          steps.
        fields:
          - type: note
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.0.0') < 0
            text: >-
              New highly available clusters run PostgreSQL 18; this release's cluster keeps PostgreSQL 17 in place.
              Moving it to 18 is a copy into a new release; see Upgrading from 1.x in the README.
          - path: postgresHA.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data is first initialized, and GlitchTip connects with
              them. To change the password later, change it in the database first, then update the secret and
              force a redeployment.
              In HA mode the order differs: move the leader to member -0 first (see the README's HA rotation steps).
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-glitchtip-db-credentials'"
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: >-
          One PostgreSQL replica, for development and light use. Its server, storage, network and backups
          follow in the next steps.
        fields:
          - path: postgres.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data directory is first initialized, and GlitchTip
              connects with them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then
              update the secret and force a redeployment.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-glitchtip-db-credentials'"
    rules:
      - rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != null &&
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != ''
        mirrors: glitchtip.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: The database credentials secret is required.
      - rule: "!has(self.postgres.credentials)"
        mirrors: glitchtip.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          postgres.credentials was removed in 1.4.0: the database credentials are now a prerequisite
          dictionary secret named by the credentials secret field. Remove postgres.credentials from the values.
      - rule: "!has(self.postgresHA.postgres)"
        paths: [postgresHA.config.credentialsSecretName]
        message: >-
          postgresHA.postgres was removed in 1.3.0: put its username, password and database in the database
          credentials secret and remove the block from the values.
      - rule: >-
          !has(self.postgres.config.username) && !has(self.postgres.config.password) &&
          !has(self.postgres.config.database)
        paths: [postgres.config.credentialsSecretName]
        message: >-
          postgres.config.username, password and database were removed in 1.2.0: put them in the database
          credentials secret and remove them from the values.
      # Upgrading from 1.3.x or earlier, the chart-created secret is deleted by the upgrade itself, so the new
      # prerequisite secret must have a different name (holding the same username, password and database).
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) !=
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          The previous version created the database secret itself, and this upgrade deletes it. Create a secret
          under a NEW name holding the same username, password and database, and name it here.
      - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.4.0') >= 0)
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) ==
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        severity: info
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          PostgreSQL reads the credentials only when its data is first initialized; pointing at another secret
          does not change the existing user or password.

  # The single-instance PostgreSQL's image and compute, bound here instead of in the imported Server step (the
  # postgres import excludes these paths); the checks of the postgres descriptor are restated below.
  - id: dbserver
    title: Database server
    description: The Postgres image and the compute of the single-instance database's stateful replica.
    when: self.postgres.enabled
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts the database server. Nothing limits the rollout of a stateful workload, so
              plan a short write outage.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.0.0') < 0
            text: >-
              New installs of this version run PostgreSQL 19. This release keeps the major its database was
              created with, so the image below stays on it. Moving the data to 19 is a dump and restore into a new
              release; see Upgrading from 1.x in the README.
          - path: postgres.image
            type: string
            format: image
            label: Postgres image
            required: true
            help: >-
              New installs run `postgres:19`; `postgres:18` and `postgres:17` also work. The data directory is
              specific to a major version: on an existing volume, an image of another major does not start, and
              the database logs the image to set instead.
          - path: postgres.resources
            type: resources
            label: Postgres resources
            required: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: >-
              oldSelf == null || !has(oldSelf.postgres.image) || imageMajor(self.postgres.image) < 0 ||
              imageMajor(oldSelf.postgres.image) < 0 || imageMajor(self.postgres.image) == imageMajor(oldSelf.postgres.image)
            severity: warning
            paths: [postgres.image]
            messageExpression: >-
              'This release\'s data directory is PostgreSQL ' + string(imageMajor(oldSelf.postgres.image)) +
              '; a PostgreSQL ' + string(imageMajor(self.postgres.image)) + ' image refuses to start on it. Keep the image at ' +
              oldSelf.postgres.image + ', or move to PostgreSQL ' + string(imageMajor(self.postgres.image)) +
              ' with a dump and restore into a new release (README, Upgrading from 1.x).'
            message: >-
              The data directory belongs to the installed Postgres major version; an image of a different major
              refuses to start on it. Keep the installed image, or move with a dump and restore into a new release
              (README, Upgrading from 1.x).

# Rules over the imported values: their issues show on the imported fields' steps. Rules without paths only
# trip on YAML edits (the Database choice writes the hidden switches); they block Install and show on Review.
rules:
  - rule: self.postgresHA.enabled != self.postgres.enabled
    mirrors: glitchtip.validate
    message: Enable exactly one database, either the highly available or the single-instance PostgreSQL.
  - rule: >-
      !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
      dyn(self.postgresHA)['proxy']['enabled'] == true
    mirrors: glitchtip.validate
    message: postgresHA.proxy.enabled must stay true; the HAProxy leader endpoint is GlitchTip's database endpoint.
  # glitchtip.validatePostgresHAImage also refuses tags 0.1-0.7; the import's own image rule says that, so this
  # one keeps only the check the child does not make. The field is required, so it shows only in YAML mode.
  - rule: "!self.postgresHA.enabled || (has(self.postgresHA.image) && self.postgresHA.image != '')"
    mirrors: glitchtip.validatePostgresHAImage
    paths: [postgresHA.image]
    message: Set postgresHA.image to controlplanecorporation/patroni-postgres:0.9, or remove it from the values to use the chart default.
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks GlitchTip, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: >-
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-glitchtip') in self.postgres.internalAccess.workloads &&
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-glitchtip-worker') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: >-
      'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-glitchtip and //gvc/' + context.gvc +
      '/workload/' + context.releaseName + '-glitchtip-worker, or GlitchTip cannot reach its database.'
    message: Add the GlitchTip web and worker workloads to the list, or GlitchTip cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: GlitchTip connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.
  - path: postgresHA.pgbouncer
    reason: GlitchTip connects to the HAProxy leader endpoint directly, so a PgBouncer in front of it would sit unused.

# A 1.x release that never set postgres.image runs postgres:18 (1.x's default), and its data directory is
# PostgreSQL 18. Carry-over would hand it the new default postgres:19, which refuses to start on that data:
# keep the installed image instead. Claims the postgres import's own image migration (the import excludes
# `image` and binds it in Database server), so the note names this chart's README section.
migrations:
  - fromVersions: ">=1.0.0 <2.0.0"
    to: postgres.image
    # has(): the previous version's own values.yaml leaves the image to the postgres 3.4.1 default, postgres:18.
    valueExpr: "has(self.postgres.image) ? self.postgres.image : 'postgres:18'"
    note: >-
      The database keeps the PostgreSQL major it was created with, so the installed image is kept (Database
      server, Postgres image). To move to PostgreSQL 19, dump and restore into a new release (README, Upgrading
      from 1.x).
  - fromVersions: "<1.4.0"
    from: redis.redis.auth.password
    note: >-
      The Redis password is now a prerequisite dictionary secret (key password). Create it under a NEW name
      holding your CURRENT Redis password, and choose it under Redis.
  - fromVersions: "<1.4.0"
    from: postgres.credentials
    note: >-
      This setting served both database modes (single-instance and HA). The database credentials are now a
      prerequisite dictionary secret (username, password, database). Create it under a NEW name with the values the
      database was initialized with, and choose it under Database.
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.0"
    from: postgresHA.postgres
    note: >-
      Put the username, password and database the HA database was initialized with in the database
      credentials secret, and choose it under Database.
  - fromVersions: "<1.2.0"
    from: postgres.config.username
    note: Put it in the database credentials secret (key username); choose the secret under Database.
  - fromVersions: "<1.2.0"
    from: postgres.config.password
    note: Put it in the database credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.2.0"
    from: postgres.config.database
    note: Put it in the database credentials secret (key database); choose the secret under Database.
  - fromVersions: "<1.2.0"
    from: postgres.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.2.0"
    from: postgres.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.1.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<1.1.0"
    from: resources.memory
    to: resources.maxMemory
  - fromVersions: "<1.1.0"
    from: worker.resources.cpu
    to: worker.resources.maxCpu
  - fromVersions: "<1.1.0"
    from: worker.resources.memory
    to: worker.resources.maxMemory
  - fromVersions: "<1.1.0"
    from: django.secretKey
    note: >-
      Put it in the auth secret (key secretKey) and choose it under GlitchTip. Reuse the same value: a new one logs
      every user out.
  - fromVersions: "<1.1.0"
    from: admin.email
    note: The superuser login moved into the auth secret (keys adminEmail and adminPassword); choose it under GlitchTip.
  - fromVersions: "<1.1.0"
    from: admin.password
    note: The superuser login moved into the auth secret (keys adminEmail and adminPassword); choose it under GlitchTip.
