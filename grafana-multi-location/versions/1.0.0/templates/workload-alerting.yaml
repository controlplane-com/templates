{{- include "grafana-ml.validate" . -}}
{{/*
THE ALERT EVALUATOR. Exactly-once evaluation is a property of this workload's
TOPOLOGY — one workload, exactly one replica, exactly one location — not
something the containers negotiate. There is nothing to elect, nothing to derive
from a hostname (a standard workload's HOSTNAME carries a random suffix, not an
index), and no value of `.Values.replicas` can create a second evaluator because
that knob belongs to a different workload.
An empty alerting.location renders NOTHING here: alert rules can still be created
and viewed, they are simply never evaluated.
*/}}
{{- if .Values.alerting.location }}
kind: workload
name: {{ include "grafana-ml.alerting.name" . }}
description: Grafana alert-rule evaluator — exactly one replica, in one location, never public
gvc: {{ .Values.global.gvc.name }}
tags:
  {{- include "grafana-ml.tags" . | nindent 2 }}
spec:
  # Same image, same env as the UI tier apart from EXECUTE_ALERTS and the root
  # URL. Stateless: all alert state lives in the shared database, so this needs
  # no volume and no handover.
  type: standard
  identityLink: //gvc/{{ .Values.global.gvc.name }}/identity/{{ include "grafana-ml.identity.name" . }}
  containers:
    - name: grafana
      image: {{ .Values.image }}
      command: /bin/bash
      args:
        - -c
        - |-
          {{- if .Values.publicAccess.enabled }}
          # CPLN_GLOBAL_ENDPOINT is PER-WORKLOAD, and this workload has no
          # inbound access — using it raw would put a dead link in every alert
          # email and webhook payload, since the evaluator is the instance that
          # renders notifications. Rewrite ONLY the workload-name prefix of our
          # own endpoint: the hostname's shape is not stable across GVCs
          # ({workload}-{gvcAlias}.cpln.app in one, {workload}-{gvcAlias}.{orgAlias}.cpln.app
          # in another) and there is no CPLN_ORG_ALIAS, so never rebuild it from
          # parts. If the prefix does not match, fall back to the internal URL
          # rather than emitting a hostname we invented.
          _ui="{{ include "grafana-ml.name" . }}"
          _self="{{ include "grafana-ml.alerting.name" . }}"
          _scheme="${CPLN_GLOBAL_ENDPOINT%%://*}"
          _host="${CPLN_GLOBAL_ENDPOINT#*://}"
          case "$_host" in
            "$_self"-*)
              export GF_SERVER_ROOT_URL="${_scheme}://${_ui}-${_host#$_self-}"
              ;;
            *)
              echo "could not derive the UI tier endpoint from '${CPLN_GLOBAL_ENDPOINT}'; alert links will use the internal address"
              export GF_SERVER_ROOT_URL="http://{{ include "grafana-ml.name" . }}.{{ .Values.global.gvc.name }}.cpln.local:3000/"
              ;;
          esac
          {{- else }}
          # Public access is off, so there is no public endpoint to advertise;
          # alert links point at the UI tier's internal address.
          export GF_SERVER_ROOT_URL="http://{{ include "grafana-ml.name" . }}.{{ .Values.global.gvc.name }}.cpln.local:3000/"
          {{- end }}
          echo "alert links will point at ${GF_SERVER_ROOT_URL}"
          {{- include "grafana-ml.dbGate" . | nindent 10 }}
          exec /run.sh
      inheritEnv: false
      minCpu: {{ .Values.alerting.resources.minCpu | quote }}
      minMemory: {{ .Values.alerting.resources.minMemory | quote }}
      cpu: {{ .Values.alerting.resources.maxCpu | quote }}
      memory: {{ .Values.alerting.resources.maxMemory | quote }}
      env:
        {{- include "grafana-ml.env" (dict "root" . "executeAlerts" "true") | nindent 8 }}
      ports:
        - number: 3000
          protocol: http
      {{- if .Values.datasources.definitions }}
      volumes:
        - path: /etc/grafana/provisioning/datasources/cpln-datasources.yaml
          # Declared because the API backfills it on secret volumes.
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "grafana-ml.secretDatasources.name" . }}.payload
      {{- end }}
      readinessProbe:
        httpGet:
          path: /api/health
          port: 3000
          # explicit server default — prevents cosmetic drift vs the live workload
          scheme: HTTP
        # Declared because the API backfills it.
        initialDelaySeconds: 10
        # 20 is the platform MAXIMUM for failureThreshold — raise periodSeconds.
        periodSeconds: 10
        failureThreshold: 20
        successThreshold: 1
        timeoutSeconds: 3
      livenessProbe:
        httpGet:
          path: /api/health
          port: 3000
          scheme: HTTP
        # Declared because the API backfills it. Long enough to cover the 180 s
        # database gate plus migrations waiting behind another instance's lock.
        initialDelaySeconds: 240
        periodSeconds: 30
        failureThreshold: 5
        successThreshold: 1
        timeoutSeconds: 5
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      # ZERO by default, ONE only in alerting.location below. The fail-safe
      # direction is deliberate: if a localOptions entry were ever missing, that
      # location runs NOTHING rather than a second evaluator. Duplicate
      # notifications are the failure this whole design exists to prevent.
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 30
  localOptions:
    # Written in FULL for every location, for the same reason as the UI tier, and
    # load-bearing twice over here.
    # Zero-scaling a location is NOT `suspend`: localOptions[].suspend
    # permanently withdraws that location's endpoints from the other locations'
    # service discovery and only workload deletion fixes it. Scale-to-zero was
    # verified on a live workload — accepted, stored verbatim, and yielding 0
    # replicas in the zero-scaled locations and 1 in the selected one.
    {{- range $location := .Values.global.gvc.locations }}
    {{- $isEvaluator := eq $location.name $.Values.alerting.location }}
    - location: //location/{{ $location.name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: {{ if $isEvaluator }}1{{ else }}0{{ end }}
        metric: disabled
        minScale: {{ if $isEvaluator }}1{{ else }}0{{ end }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 30
    {{- end }}
  rolloutOptions:
    {{- /*
    Surge is 0% here, unlike the UI tier: a surged second evaluator, however
    briefly, is a duplicate notification. A few seconds without evaluation is
    strictly preferable. maxUnavailableReplicas is deliberately not set (see the
    UI tier); terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    maxSurgeReplicas: 0%
    minReadySeconds: 30
    scalingPolicy: Parallel
    terminationGracePeriodSeconds: 90
  firewallConfig:
    external:
      # NEVER public, with no dependence on publicAccess.enabled. It serves no
      # users; exposing it would only put a second admin-capable login form on
      # the internet guarding the same database.
      inboundAllowCIDR: []
      # Must reach the user's datasources during rule evaluation, plus the SMTP
      # server and every webhook contact point.
      outboundAllowCIDR:
        - 0.0.0.0/0
      # Declared empty because the API backfills these.
      inboundBlockedCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      # Honoured deliberately: in-GVC reachability at
      # {release}-grafana-ml-alerting.{gvc}.cpln.local:3000 is what makes the
      # silence workaround an exact instruction (see the README).
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if and (eq .Values.internalAccess.type "workload-list") .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
{{- end }}
