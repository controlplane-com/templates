apiVersion: v2
name: grafana-multi-location
description: Grafana OSS dashboards and alerting spread across locations, backed by one stretched PostgreSQL cluster, with optional Redis-coordinated alerting HA, surviving the loss of a region
type: application
version: 1.1.1
appVersion: "13.1.3"

annotations:
  created: "2026-08-11"
  lastModified: "2026-08-13"
  category: "observability"
  createsGvc: true

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres-multi-location
    alias: postgresML
    version: 1.0.2
    repository: "oci://ghcr.io/controlplane-com/templates"
  # Rendered ONLY when alerting.highAvailability.enabled is true. 2.1.0 is the
  # first version consumable as a subchart: it gates its own `kind: gvc` on
  # .Chart.IsRoot and reads global.gvc, so the release still has exactly one GVC.
  - name: redis-multi-location
    alias: redisML
    version: 2.1.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: alerting.highAvailability.enabled
