apiVersion: v2
name: grafana-multi-location
description: Grafana dashboards and alerting across locations, on one stretched PostgreSQL cluster, surviving a region loss
type: application
version: 2.0.0
appVersion: "13.1.3"

annotations:
  created: "2026-08-11"
  lastModified: "2026-08-29"
  category: "observability"
  createsGvc: false

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  # 2.0.0 is the first version that does NOT create a GVC. A parent cannot
  # convert while vendoring a GVC-creating child, so this pin is load-bearing:
  # 1.x renders its own `kind: gvc` and reads `global.gvc`, both of which this
  # chart no longer supplies.
  - name: postgres-multi-location
    alias: postgresML
    version: 2.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  # Rendered ONLY when alerting.highAvailability.enabled is true. 3.0.0 is the
  # GVC-free version, and also the first to offer the Valkey engine (exposed
  # below as redisML.engine).
  - name: redis-multi-location
    alias: redisML
    version: 3.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: alerting.highAvailability.enabled
