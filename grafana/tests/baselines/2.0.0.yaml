# grafana 2.0.0 — the default install: one Grafana replica on highly available PostgreSQL (3 Patroni
# members, 3 etcd, HAProxy), Redis off, at the chart's default sizes. The three prerequisite secrets are
# generated per run.
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  pgpw: hex
  adminpw: hex
  secretkey: hex

secrets:
  db:
    type: dictionary
    entries:
      username: grafana
      password: "{gen.pgpw}"
      database: grafana
  admin:
    type: opaque
    payload: "{gen.adminpw}"
  key:
    type: opaque
    payload: "{gen.secretkey}"

vars:
  pg_user: grafana
  pg_password: "{gen.pgpw}"
  pg_db: grafana
  admin_password: "{gen.adminpw}"

values:
  admin:
    passwordSecretName: "{secrets.admin.name}"
    secretKeySecretName: "{secrets.key.name}"
  postgresHA:
    config:
      credentialsSecretName: "{secrets.db.name}"

# Single-instance PostgreSQL (the opt-in mode), which 2.0.0 moves to PostgreSQL 19: one more fresh install.
variants:
  - name: single
    values:
      postgresHA:
        enabled: false
      postgres:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"

# 1.5.1 is the previous version (same values shape). Its baseline runs the HA database, so this upgrade
# moves postgres-highly-available 2.5.0 → 3.0.0, whose existing cluster keeps PostgreSQL 17: a plain
# upgrade. A refused single-instance upgrade from 1.5.1 is not expressible: the starting install always
# uses 1.5.1's own (HA) baseline.
upgradeFrom:
  - version: 1.5.1
