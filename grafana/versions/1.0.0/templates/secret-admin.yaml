kind: secret
name: {{ include "grafana.secretAdmin.name" . }}
description: Grafana admin bootstrap credentials and datasource-encryption key
tags: {{- include "grafana.tags" . | nindent 4 }}
type: dictionary
data:
  # user/password apply on FIRST boot only — later changes don't update the
  # stored admin account.
  user: {{ .Values.admin.user | quote }}
  password: {{ .Values.admin.password | quote }}
  # Write-once: encrypts datasource secrets stored in the DB (AES-256);
  # rotating it breaks decryption of every saved datasource credential.
  secretKey: {{ .Values.admin.secretKey | quote }}
