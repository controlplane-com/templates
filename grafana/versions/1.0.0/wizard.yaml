            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin role
              on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgres.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgres.backup.enabled && self.postgres.backup.provider == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
