# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Grafana

# Grafana itself is stateless, but every database mode (postgres-highly-available, postgres) and the
# optional Redis Sentinel tier are stateful with no location handling: each GVC location would run its
# own copy with its own data.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: grafana
    title: Grafana
    description: The Grafana image, its replicas and compute, and the admin login.
    sections:
      - title: Server
        fields:
          - path: image
            type: string
            format: image
            label: Grafana image
            required: true
          - path: replicas
            type: integer
            label: Replicas
            min: 1
            required: true
            suggestions: [1, 2, 3]
            description: Replicas share the PostgreSQL app database; the Grafana tier itself is stateless.
          # This version mixes cpu/memory (the limits) with minCpu/minMemory, which the resources type cannot model.
          - path: resources.minCpu
            type: quantity
            quantity: cpu
            label: Minimum CPU
            required: true
            min: 25m
          - path: resources.cpu
            type: quantity
            quantity: cpu
            label: Maximum CPU
            required: true
            min: 25m
          - path: resources.minMemory
            type: quantity
            quantity: memory
            label: Minimum memory
            required: true
            min: 32Mi
          - path: resources.memory
            type: quantity
            quantity: memory
            label: Maximum memory
            required: true
            min: 32Mi
      - id: redis
        title: Alerting coordination (Redis Sentinel)
        toggle: redis.enabled
        description: >-
          Needed for 2 or more replicas: Redis Sentinel coordinates alert evaluation so each alert sends one
          notification instead of one per replica.
        docs: "#alerting-high-availability"
        fields:
          - path: redis.redis.replicas
            type: integer
            label: Redis nodes
            min: 1
            required: true
            suggestions: [1, 2, 3, 5]
          - path: redis.sentinel.replicas
            type: integer
            label: Sentinels
            min: 1
            required: true
            suggestions: [1, 3, 5]
          - path: redis.redis.image
            type: string
            format: image
            label: Redis image
            required: true
            advanced: true
          - path: redis.redis.resources.minCpu
            type: quantity
            quantity: cpu
            label: Redis minimum CPU
            required: true
            advanced: true
          - path: redis.redis.resources.cpu
            type: quantity
            quantity: cpu
            label: Redis maximum CPU
            required: true
            advanced: true
          - path: redis.redis.resources.minMemory
            type: quantity
            quantity: memory
            label: Redis minimum memory
            required: true
            advanced: true
          - path: redis.redis.resources.memory
            type: quantity
            quantity: memory
            label: Redis maximum memory
            required: true
            advanced: true
          - path: redis.sentinel.image
            type: string
            format: image
            label: Sentinel image
            required: true
            advanced: true
          - path: redis.sentinel.resources.minCpu
            type: quantity
            quantity: cpu
            label: Sentinel minimum CPU
            required: true
            advanced: true
          - path: redis.sentinel.resources.cpu
            type: quantity
            quantity: cpu
            label: Sentinel maximum CPU
            required: true
            advanced: true
          - path: redis.sentinel.resources.minMemory
            type: quantity
            quantity: memory
            label: Sentinel minimum memory
            required: true
            advanced: true
          - path: redis.sentinel.resources.memory
            type: quantity
            quantity: memory
            label: Sentinel maximum memory
            required: true
            advanced: true
        rules:
          # Redis and Sentinel are stateful workloads: the platform rejects a max:min ratio above 4:1.
          - rule: >-
              cpuMillicores(self.redis.redis.resources.cpu) <= 4 * cpuMillicores(self.redis.redis.resources.minCpu) &&
              memoryBytes(self.redis.redis.resources.memory) <= 4 * memoryBytes(self.redis.redis.resources.minMemory)
            paths: [redis.redis.resources.minCpu, redis.redis.resources.minMemory]
            message: The Redis maximum CPU and memory can each be at most 4 times their minimum on a stateful workload.
          - rule: >-
              cpuMillicores(self.redis.sentinel.resources.cpu) <= 4 * cpuMillicores(self.redis.sentinel.resources.minCpu) &&
              memoryBytes(self.redis.sentinel.resources.memory) <= 4 * memoryBytes(self.redis.sentinel.resources.minMemory)
            paths: [redis.sentinel.resources.minCpu, redis.sentinel.resources.minMemory]
            message: The Sentinel maximum CPU and memory can each be at most 4 times their minimum on a stateful workload.
          # Read through a bound variable: redis.redis.auth comes from the redis subchart's defaults, which
          # this descriptor does not import. The chart fails only when an enabled flag is true.
          - rule: >-
              [self.redis.redis].all(r, !has(r.auth) ||
              ((!has(r.auth.password) || !has(r.auth.password.enabled) || r.auth.password.enabled != true) &&
              (!has(r.auth.fromSecret) || !has(r.auth.fromSecret.enabled) || r.auth.fromSecret.enabled != true)))
            mirrors: grafana.validate
            paths: [redis.redis.replicas]
            message: >-
              Redis authentication is not supported in this version: remove redis.redis.auth from the values (the
              same-GVC firewall is the boundary).
          # Read through a bound variable: redis.sentinel.auth comes from the redis subchart's defaults, which
          # this descriptor does not import. The chart fails only when an enabled flag is true.
          - rule: >-
              [self.redis.sentinel].all(r, !has(r.auth) ||
              ((!has(r.auth.password) || !has(r.auth.password.enabled) || r.auth.password.enabled != true) &&
              (!has(r.auth.fromSecret) || !has(r.auth.fromSecret.enabled) || r.auth.fromSecret.enabled != true)))
            mirrors: grafana.validate
            paths: [redis.sentinel.replicas]
            message: >-
              Sentinel authentication is not supported in this version: remove redis.sentinel.auth from the
              values (the same-GVC firewall is the boundary).
      - title: Admin login
        fields:
          - type: note
            severity: warning
            text: >-
              The admin password and the encryption key are values: the chart creates their secret, so there is
              nothing to create first. They are stored in the Helm release; 1.2.0 takes them from secrets you
              create instead.
          - path: admin.user
            type: string
            label: Admin user
            required: true
            description: Applies only when the admin account is first created.
          - path: admin.password
            type: string
            label: Admin password
            required: true
            sensitive: true
            widget: password
            example: true
            description: >-
              The first-boot password of the admin login. Applies only when the admin account is first created;
              change it in the Grafana UI afterwards.
          - path: admin.secretKey
            type: string
            label: Encryption key
            required: true
            sensitive: true
            widget: password
            example: true
            description: >-
              Encrypts the datasource credentials stored in the database. Set it once and keep it for the life of
              the install.
            help: "Generate one with: openssl rand -hex 32"
        rules:
          - rule: self.admin.password != ''
            mirrors: grafana.validate
            paths: [admin.password]
            message: Set the admin password; the chart does not render without it.
          - rule: self.admin.secretKey != ''
            mirrors: grafana.validate
            paths: [admin.secretKey]
            message: Set the encryption key; the chart does not render without it.
          - rule: oldSelf == null || self.admin.secretKey == oldSelf.admin.secretKey
            severity: info
            paths: [admin.secretKey]
            message: >-
              Keep the installed encryption key: a different key makes every datasource credential stored in the
              database unreadable.
    rules:
      - rule: >-
          cpuMillicores(self.resources.cpu) >= cpuMillicores(self.resources.minCpu) &&
          memoryBytes(self.resources.memory) >= memoryBytes(self.resources.minMemory)
        severity: warning
        paths: [resources.minCpu, resources.minMemory]
        message: The maximum CPU and memory must each be at least their minimum.
      - rule: self.replicas < 2 || self.redis.enabled
        mirrors: grafana.validate
        paths: [replicas]
        message: >-
          2 or more replicas need alerting coordination (Redis Sentinel); without it every replica sends its own
          alert notifications. Turn it on, or use 1 replica.

  - id: datasources
    title: Datasources and email
    description: Datasources provisioned as code, their credentials, and SMTP for alert emails.
    sections:
      - title: Datasources as code
        docs: "#datasources-as-code"
        fields:
          - path: datasources.definitions
            type: yaml
            yamlType: list
            label: Datasource definitions
            description: >-
              Grafana provisioning entries, passed through verbatim; provisioned datasources are read-only in the
              UI. Write `$KEY` where a credential goes.
            help: >-
              Point them at your own datasources, such as a Prometheus or Thanos install in the same GVC
              (`http://RELEASE-prometheus.GVC.cpln.local:9095`). Control Plane's built-in workload metrics already
              have dashboards in the console.
      - title: Datasource credentials
        docs: "#datasource-credentials"
        fields:
          - path: datasources.credentialSecrets
            type: list
            label: Credential secrets
            widget: table
            uniqueBy: [name]
            newItem: { name: "", keys: [] }
            itemLabel: "item.name + ' (' + string(size(item.keys)) + ' keys)'"
            description: >-
              What Grafana authenticates to each datasource with. Each key becomes an environment variable that a
              definition references as `$KEY`.
            item:
              type: object
              fields:
                - path: name
                  type: ref
                  label: Secret
                  required: true
                  ref:
                    kind: secret
                    format: name
                    filter: { secretType: [dictionary] }
                    mustExist: error
                    allowCreate: true
                - path: keys
                  type: list
                  label: Keys
                  required: true
                  unique: true
                  widget: tags
                  item:
                    type: string
                    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
                    patternMessage: Use letters, digits and underscores, and do not start with a digit.
              rules:
                - rule: item.name != '' && size(item.keys) > 0
                  mirrors: grafana.validate
                  paths: [keys]
                  message: Each credential secret needs a name and at least one key.
      - id: smtp
        title: Alert emails (SMTP)
        toggle: smtp.enabled
        description: Lets Grafana send alert notifications and invites by email.
        docs: "#smtp"
        fields:
          - path: smtp.host
            type: string
            label: SMTP server
            required: true
            example: true
            placeholder: smtp.example.com:587
            pattern: '^[^:\s]+:\d+$'
            patternMessage: Enter the host and port, such as smtp.example.com:587.
          - path: smtp.user
            type: string
            label: SMTP user
            description: Leave empty for unauthenticated SMTP.
          - path: smtp.passwordSecretName
            type: ref
            label: SMTP password secret
            required: true
            when: self.smtp.user != ''
            description: An opaque secret (encoding plain) holding only the SMTP password.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create: { secretType: opaque, encoding: plain }
          - path: smtp.fromAddress
            type: string
            format: email
            label: Sender address
            required: true
            example: true
          - path: smtp.fromName
            type: string
            label: Sender name
        rules:
          - rule: self.smtp.user == '' || self.smtp.passwordSecretName != ''
            mirrors: grafana.validate
            paths: [smtp.passwordSecretName]
            message: Name the SMTP password secret, or clear the SMTP user for unauthenticated SMTP.

  - id: access
    title: Access
    description: Who reaches Grafana, from the internet and from inside the GVC.
    docs: "#access"
    sections:
      - title: Public access
        fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public HTTPS endpoint
            description: The UI and API on the workload's `*.cpln.app` endpoint.
      - title: Internal access
        docs: /reference/workload/firewall
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Firewall changes take 30 to 150 seconds to take effect.
            options:
              - { value: none, label: None, description: No workload can reach Grafana internally. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
            rules:
              - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
                mirrors: grafana.validate
                message: The internal access must be none, same-gvc, same-org or workload-list.
          # workload.yaml writes inboundAllowWorkload only for workload-list.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
            rules:
              - rule: size(self.internalAccess.workloads) > 0
                severity: warning
                message: With "Specific workloads" and an empty list, no workload can connect.

  - id: database
    title: Database
    description: The PostgreSQL that holds every dashboard, user and alert rule, and its credentials.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: >-
                  The default: 3 Patroni replicas with automatic failover, 3 etcd replicas and an HAProxy leader
                  endpoint Grafana connects through.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: >-
                  One PostgreSQL replica, lighter and without failover. Its storage and backups follow below.
                set: { postgresHA.enabled: false, postgres.enabled: true }
          # The chooser above writes these.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
      - id: db-credentials
        title: Database credentials
        fields:
          - type: note
            severity: warning
            text: >-
              The database credentials are values: the bundled database creates its secret from them, so there is
              nothing to create first. They are stored in the Helm release; a later version of this template takes
              them from a secret you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: Used as-is, so replace the example value.
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
          - path: postgres.config.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
          - path: postgres.config.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: Used as-is, so replace the example value.
          - path: postgres.config.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
        rules:
          # The HA database (postgres-highly-available 2.4.x) writes the password unquoted into an unquoted shell
          # heredoc that becomes Patroni's YAML config (templates/secret-startup.yaml): $ and ` are expanded, a \
          # before $ ` \ or at the end is consumed, YAML indicators at the start, ': ', ' #' and a lone - ~ = <<
          # break or alter the value, and numbers, dates, 1:30 and yes/no/on/off change type.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              [self.postgresHA.postgres.password].all(x,
              !x.matches('[$`]') && !x.matches('\\\\([$`\\\\]|$)') &&
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']) && !(x in ['~', '=', '<<']) &&
              !x.matches('^[-+]?([0-9][0-9_]*|0b[01_]+|0x[0-9a-fA-F_]+)$') &&
              !x.matches('^[-+]?([0-9][0-9_]*)?\\.[0-9_]*([eE][-+][0-9]+)?$') &&
              !x.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              The highly available database writes the password unquoted into a shell script and its YAML config.
              Leave out $ and `, a \ before $, ` or \ or at the end, a leading space or YAML symbol, ": " and " #", and
              values that read as a number, a date, yes/no, on/off, true/false or null.
          - when: self.postgresHA.enabled
            rule: >-
              oldSelf == null || !oldSelf.postgresHA.enabled ||
              (self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username &&
              self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password &&
              self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database)
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the user, password and database it was initialized with: changing them here does not
              change the database, and Grafana loses its connection unless the database is changed to match first.
          - when: self.postgres.enabled
            rule: >-
              oldSelf == null || !oldSelf.postgres.enabled ||
              (self.postgres.config.username == oldSelf.postgres.config.username &&
              self.postgres.config.password == oldSelf.postgres.config.password &&
              self.postgres.config.database == oldSelf.postgres.config.database)
            severity: info
            paths: [postgres.config.password]
            message: >-
              PostgreSQL keeps the user, password and database it was initialized with: changing them here does not
              change the database, and Grafana loses its connection unless the database is changed to match first.
      - id: postgres-single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        fields:
          - path: postgres.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: >-
              oldSelf == null || !oldSelf.postgres.enabled ||
              self.postgres.volumeset.capacity >= oldSelf.postgres.volumeset.capacity
            paths: [postgres.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: postgres-ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        fields:
          - type: note
            severity: warning
            text: >-
              In this version the bundled etcd does not compact its history, so its storage grows with time until
              it reaches its quota and goes read-only, which takes PostgreSQL failover with it
              ([etcd history compaction](/template-catalog/templates/postgres-highly-available#etcd-history-compaction)).
              1.2.1 fixes it.
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            min: 1
            required: true
            suggestions: [1, 3, 5]
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity per replica
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
          - path: postgresHA.proxy.enabled
            type: boolean
            absent: true
            default: true
            readOnly: true
            advanced: true
            label: HAProxy leader endpoint
            description: Grafana's database endpoint; it stays on.
        rules:
          - rule: self.postgresHA.proxy.enabled != false
            mirrors: grafana.validate
            paths: [postgresHA.proxy.enabled]
            message: >-
              postgresHA.proxy.enabled must stay true: the HAProxy leader endpoint is Grafana's database endpoint.
          - rule: >-
              oldSelf == null || !oldSelf.postgresHA.enabled ||
              self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
    rules:
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        message: >-
          Switching the database on an installed release deletes the current one, with all of Grafana's
          dashboards, users and alert rules, and starts an empty one. Keep the current database, or install a new
          release with the other database and move the data.
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: grafana.validate
        paths: [postgresHA.enabled]
        message: >-
          Turn on exactly one database: the highly available PostgreSQL or the single-instance PostgreSQL.

  - id: ha-backup
    title: Database backups
    description: Optional backups of the highly available PostgreSQL to object storage.
    when: self.postgresHA.enabled
    sections:
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: cards
            required: true
            options:
              - { value: logical, label: Logical, description: A scheduled pg_dumpall uploaded to the bucket. }
              - { value: wal-g, label: WAL-G, description: Base backups and WAL archiving at an interval. }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Backup interval
            unit: seconds
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 43200, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
