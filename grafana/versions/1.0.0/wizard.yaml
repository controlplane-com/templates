  - id: single-backup
    title: Database backups
    description: Optional backups of the single-instance PostgreSQL to object storage.
    when: self.postgres.enabled
    sections:
      - id: single-backup
        title: Database backups
        toggle: postgres.backup.enabled
        fields:
          - path: postgres.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgres.backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            description: A scheduled pg_dumpall uploaded to the bucket.
          - path: postgres.backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
          - path: postgres.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgres.backup.enabled && self.postgres.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgres.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgres.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgres.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgres.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgres.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgres.backup.enabled && self.postgres.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgres.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
