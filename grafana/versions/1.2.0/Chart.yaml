apiVersion: v2
name: grafana
description: Grafana OSS dashboards and alerting over your own datasources — Prometheus-compatible stores, SQL databases, and external systems — backed by PostgreSQL, with optional Redis-coordinated HA
type: application
version: 1.2.0
appVersion: "13.1.1"

annotations:
  created: "2026-07-31"
  lastModified: "2026-08-07"
  category: "observability"
  createsGvc: false

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.4.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled
  - name: postgres
    version: 3.3.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled
  - name: redis
    version: 3.4.3
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: redis.enabled
