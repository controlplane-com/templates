{{- if .Values.datasources.definitions }}
kind: secret
name: {{ include "grafana.secretDatasources.name" . }}
description: Grafana datasource provisioning file (datasources-as-code)
tags: {{- include "grafana.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  # Rendered verbatim under apiVersion 1; $KEY references are interpolated by
  # Grafana at load time from env vars exposed via datasources.credentialSecrets.
  payload: |-
    apiVersion: 1
    datasources:
      {{- toYaml .Values.datasources.definitions | nindent 6 }}
{{- end }}
