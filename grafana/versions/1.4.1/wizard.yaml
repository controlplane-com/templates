rules:
  # Rules over the imported values: their issues show on the imported fields' step (postgres:network).
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Grafana, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-grafana') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-grafana, or Grafana cannot reach its database.'"
    message: Add the Grafana workload to the list, or Grafana cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Grafana connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.4.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.4.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  # 1.4.0 feeds both database modes from postgres.credentials. Carry the credentials of the mode the release ran,
  # whatever they are: PostgreSQL keeps the ones it was initialized with.
  - fromVersions: ">=1.3.0 <1.4.0"
    to: postgres.credentials.username
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.username : self.postgres.credentials.username"
  - fromVersions: ">=1.3.0 <1.4.0"
    to: postgres.credentials.password
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.password : self.postgres.credentials.password"
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: ">=1.3.0 <1.4.0"
    to: postgres.credentials.database
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.database : self.postgres.credentials.database"
  - fromVersions: "<1.3.0"
    to: postgres.credentials.username
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.username : self.postgres.config.username"
  - fromVersions: "<1.3.0"
    to: postgres.credentials.password
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.password : self.postgres.config.password"
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: "<1.3.0"
    to: postgres.credentials.database
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.database : self.postgres.config.database"
  - fromVersions: "<1.4.0"
    from: postgresHA.postgres
    note: Its username, password and database now come from Database credentials, which Grafana turns into the secret.
  - fromVersions: "<1.3.0"
    from: postgres.config.username
    note: Moved to Database credentials (postgres.credentials.username).
  - fromVersions: "<1.3.0"
    from: postgres.config.password
    note: Moved to Database credentials (postgres.credentials.password).
  - fromVersions: "<1.3.0"
    from: postgres.config.database
    note: Moved to Database credentials (postgres.credentials.database).
  - fromVersions: "<1.3.0"
    from: postgres.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.0"
    from: postgres.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.2.0"
    from: admin.password
    note: >-
      The admin account already exists, so a new password secret changes nothing: turn off Apply the admin
      password secret, or name any opaque secret. The admin password does not change on upgrade; if it is still
      change-me-grafana-1, change it in Grafana now.
  - fromVersions: "<1.2.0"
    from: admin.secretKey
    note: >-
      Create an opaque secret holding exactly this key and choose it as the encryption key secret. Any other value
      makes every saved datasource credential unreadable.
  - fromVersions: "<1.1.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<1.1.0"
    from: resources.memory
    to: resources.maxMemory
