# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Grafana

# Grafana itself is stateless, but every database mode (postgres-highly-available, postgres) and the
# optional Redis Sentinel tier are stateful with no location handling: each GVC location would run its
# own copy with its own data.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the single-instance PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Grafana creates this secret itself (templates/secret-db.yaml) and names it in the Database step.
      - config.credentialsSecretName
      # Grafana connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          Grafana connects to its database like any other workload: keep Same GVC, or add the Grafana
          workload under Allowed workloads.

steps:
  - id: grafana
    title: Grafana
    description: The Grafana image, its replicas and compute, and the admin login.
    docs: "#grafana-instance"
    sections:
      - title: Server
        fields:
          - path: image
            type: string
            format: image
            label: Grafana image
            required: true
          - path: replicas
            type: integer
            label: Replicas
            min: 1
            required: true
            suggestions: [1, 2, 3]
            description: Replicas share the PostgreSQL app database; the Grafana tier itself is stateless.
          - path: resources
            type: resources
            label: Resources
            required: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
      - id: redis
        title: Alerting coordination (Redis Sentinel)
        toggle: redis.enabled
        description: >-
          Needed for 2 or more replicas: Redis Sentinel coordinates alert evaluation so each alert sends one
          notification instead of one per replica.
        docs: "#alerting-high-availability"
        fields:
          - path: redis.redis.replicas
            type: integer
            label: Redis nodes
            min: 1
            required: true
            suggestions: [1, 2, 3, 5]
          - path: redis.sentinel.replicas
            type: integer
            label: Sentinels
            min: 1
            required: true
            suggestions: [1, 3, 5]
          - path: redis.redis.image
            type: string
            format: image
            label: Redis image
            required: true
            advanced: true
          - path: redis.redis.resources.minCpu
            type: quantity
            quantity: cpu
            min: 25m
            label: Redis minimum CPU
            required: true
            advanced: true
          - path: redis.redis.resources.cpu
            type: quantity
            quantity: cpu
            min: 25m
            label: Redis maximum CPU
            required: true
            advanced: true
          - path: redis.redis.resources.minMemory
            type: quantity
            quantity: memory
            min: 32Mi
            label: Redis minimum memory
            required: true
            advanced: true
          - path: redis.redis.resources.memory
            type: quantity
            quantity: memory
            min: 32Mi
            label: Redis maximum memory
            required: true
            advanced: true
          - path: redis.sentinel.image
            type: string
            format: image
            label: Sentinel image
            required: true
            advanced: true
          - path: redis.sentinel.resources.minCpu
            type: quantity
            quantity: cpu
            min: 25m
            label: Sentinel minimum CPU
            required: true
            advanced: true
          - path: redis.sentinel.resources.cpu
            type: quantity
            quantity: cpu
            min: 25m
            label: Sentinel maximum CPU
            required: true
            advanced: true
          - path: redis.sentinel.resources.minMemory
            type: quantity
            quantity: memory
            min: 32Mi
            label: Sentinel minimum memory
            required: true
            advanced: true
          - path: redis.sentinel.resources.memory
            type: quantity
            quantity: memory
            min: 32Mi
            label: Sentinel maximum memory
            required: true
            advanced: true
        rules:
          # Stateful workloads: the platform refuses a limit more than 4 cores or 4Gi above its reservation.
          - rule: >-
              (oldSelf != null && string(oldSelf.redis.redis.resources.cpu) == string(self.redis.redis.resources.cpu) &&
              string(oldSelf.redis.redis.resources.minCpu) == string(self.redis.redis.resources.minCpu) &&
              string(oldSelf.redis.redis.resources.memory) == string(self.redis.redis.resources.memory) &&
              string(oldSelf.redis.redis.resources.minMemory) == string(self.redis.redis.resources.minMemory)) ||
              (cpuMillicores(self.redis.redis.resources.cpu) - cpuMillicores(self.redis.redis.resources.minCpu) <= 4000 &&
              memoryBytes(self.redis.redis.resources.memory) - memoryBytes(self.redis.redis.resources.minMemory) <= 4096 * 1048576)
            paths: [redis.redis.resources.cpu, redis.redis.resources.memory]
            message: The Redis CPU limit can be at most 4 cores above its reservation, and the memory limit at most 4Gi above.
          # redis 3.4.x writes the value unquoted: a whole number of cores or a unitless memory reaches the API as a number, which it refuses.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.cpu) && string(oldSelf.redis.redis.resources.cpu) == string(self.redis.redis.resources.cpu)) ||
              string(self.redis.redis.resources.cpu).endsWith('m')
            paths: [redis.redis.resources.cpu]
            message: Write the Redis CPU in millicores, such as 200m or 1000m.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.minCpu) && string(oldSelf.redis.redis.resources.minCpu) == string(self.redis.redis.resources.minCpu)) ||
              string(self.redis.redis.resources.minCpu).endsWith('m')
            paths: [redis.redis.resources.minCpu]
            message: Write the Redis CPU in millicores, such as 200m or 1000m.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.memory) && string(oldSelf.redis.redis.resources.memory) == string(self.redis.redis.resources.memory)) ||
              string(self.redis.redis.resources.memory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.redis.resources.memory]
            message: Write the Redis memory with a unit, such as 256Mi or 1Gi.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.minMemory) && string(oldSelf.redis.redis.resources.minMemory) == string(self.redis.redis.resources.minMemory)) ||
              string(self.redis.redis.resources.minMemory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.redis.resources.minMemory]
            message: Write the Redis memory with a unit, such as 256Mi or 1Gi.
          # Stateful workloads: the platform refuses a limit more than 4 cores or 4Gi above its reservation.
          - rule: >-
              (oldSelf != null && string(oldSelf.redis.sentinel.resources.cpu) == string(self.redis.sentinel.resources.cpu) &&
              string(oldSelf.redis.sentinel.resources.minCpu) == string(self.redis.sentinel.resources.minCpu) &&
              string(oldSelf.redis.sentinel.resources.memory) == string(self.redis.sentinel.resources.memory) &&
              string(oldSelf.redis.sentinel.resources.minMemory) == string(self.redis.sentinel.resources.minMemory)) ||
              (cpuMillicores(self.redis.sentinel.resources.cpu) - cpuMillicores(self.redis.sentinel.resources.minCpu) <= 4000 &&
              memoryBytes(self.redis.sentinel.resources.memory) - memoryBytes(self.redis.sentinel.resources.minMemory) <= 4096 * 1048576)
            paths: [redis.sentinel.resources.cpu, redis.sentinel.resources.memory]
            message: The Sentinel CPU limit can be at most 4 cores above its reservation, and the memory limit at most 4Gi above.
          # redis 3.4.x writes the value unquoted: a whole number of cores or a unitless memory reaches the API as a number, which it refuses.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.cpu) && string(oldSelf.redis.sentinel.resources.cpu) == string(self.redis.sentinel.resources.cpu)) ||
              string(self.redis.sentinel.resources.cpu).endsWith('m')
            paths: [redis.sentinel.resources.cpu]
            message: Write the Sentinel CPU in millicores, such as 200m or 1000m.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.minCpu) && string(oldSelf.redis.sentinel.resources.minCpu) == string(self.redis.sentinel.resources.minCpu)) ||
              string(self.redis.sentinel.resources.minCpu).endsWith('m')
            paths: [redis.sentinel.resources.minCpu]
            message: Write the Sentinel CPU in millicores, such as 200m or 1000m.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.memory) && string(oldSelf.redis.sentinel.resources.memory) == string(self.redis.sentinel.resources.memory)) ||
              string(self.redis.sentinel.resources.memory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.sentinel.resources.memory]
            message: Write the Sentinel memory with a unit, such as 256Mi or 1Gi.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.minMemory) && string(oldSelf.redis.sentinel.resources.minMemory) == string(self.redis.sentinel.resources.minMemory)) ||
              string(self.redis.sentinel.resources.minMemory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.sentinel.resources.minMemory]
            message: Write the Sentinel memory with a unit, such as 256Mi or 1Gi.
          # Redis and Sentinel are stateful workloads: the platform rejects a max:min ratio above 4:1.
          - rule: >-
              cpuMillicores(self.redis.redis.resources.cpu) <= 4 * cpuMillicores(self.redis.redis.resources.minCpu) &&
              memoryBytes(self.redis.redis.resources.memory) <= 4 * memoryBytes(self.redis.redis.resources.minMemory)
            paths: [redis.redis.resources.minCpu, redis.redis.resources.minMemory]
            message: The Redis maximum CPU and memory can each be at most 4 times their minimum on a stateful workload.
          - rule: >-
              cpuMillicores(self.redis.sentinel.resources.cpu) <= 4 * cpuMillicores(self.redis.sentinel.resources.minCpu) &&
              memoryBytes(self.redis.sentinel.resources.memory) <= 4 * memoryBytes(self.redis.sentinel.resources.minMemory)
            paths: [redis.sentinel.resources.minCpu, redis.sentinel.resources.minMemory]
            message: The Sentinel maximum CPU and memory can each be at most 4 times their minimum on a stateful workload.
          # Read through a bound variable: redis.redis.auth comes from the redis subchart's defaults, which
          # this descriptor does not import. The chart fails only when an enabled flag is true.
          - rule: >-
              [self.redis.redis].all(r, !has(r.auth) ||
              ((!has(r.auth.password) || !has(r.auth.password.enabled) || r.auth.password.enabled != true) &&
              (!has(r.auth.fromSecret) || !has(r.auth.fromSecret.enabled) || r.auth.fromSecret.enabled != true)))
            mirrors: grafana.validate
            paths: [redis.redis.replicas]
            message: >-
              Redis authentication is not supported in this version: remove redis.redis.auth from the values (the
              same-GVC firewall is the boundary).
          # Read through a bound variable: redis.sentinel.auth comes from the redis subchart's defaults, which
          # this descriptor does not import. The chart fails only when an enabled flag is true.
          - rule: >-
              [self.redis.sentinel].all(r, !has(r.auth) ||
              ((!has(r.auth.password) || !has(r.auth.password.enabled) || r.auth.password.enabled != true) &&
              (!has(r.auth.fromSecret) || !has(r.auth.fromSecret.enabled) || r.auth.fromSecret.enabled != true)))
            mirrors: grafana.validate
            paths: [redis.sentinel.replicas]
            message: >-
              Sentinel authentication is not supported in this version: remove redis.sentinel.auth from the
              values (the same-GVC firewall is the boundary).
      - title: Admin login
        docs: "#admin-credentials"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.2.0') < 0
            text: >-
              1.2.0 moved the encryption key out of the values into a secret. Create the encryption key secret with
              exactly the admin.secretKey value the release uses today, or every saved datasource credential becomes
              unreadable. The admin account already exists, so the password secret changes nothing: you may turn off
              applying it.
          - type: note
            severity: warning
            text: >-
              The admin password and encryption key secrets must exist **before** you install. If one is missing,
              the deployment waits and `cpln logs` shows nothing at all.
          - path: admin.user
            type: string
            label: Admin user
            required: true
            description: Applies only when the admin account is first created.
          - path: admin.applyPassword
            type: boolean
            label: Apply the admin password secret
            description: >-
              Turn off after your first login: the chart stops referencing the password secret, which you can then
              delete.
          - path: admin.passwordSecretName
            type: ref
            label: Admin password secret
            required: true
            when: self.admin.applyPassword
            description: An opaque secret (encoding plain) holding only the first-boot admin password.
            help: >-
              Grafana reads it only when the admin account is first created; change the password in the Grafana UI
              afterwards.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                secretType: opaque
                encoding: plain
                suggestName: "context.releaseName + '-grafana-admin-password'"
          - path: admin.secretKeySecretName
            type: ref
            label: Encryption key secret
            required: true
            description: >-
              An opaque secret (encoding plain) with the key that encrypts stored datasource credentials. Read on
              every boot: keep it for the life of the install and back it up.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                secretType: opaque
                encoding: plain
                suggestName: "context.releaseName + '-grafana-secret-key'"
                hint: "Generate the content with: openssl rand -hex 32"
        rules:
          - rule: "!self.admin.applyPassword || self.admin.passwordSecretName != ''"
            mirrors: grafana.validate
            paths: [admin.passwordSecretName]
            message: Name the admin password secret, or turn off applying it once you have logged in.
          - rule: self.admin.secretKeySecretName != ''
            mirrors: grafana.validate
            paths: [admin.secretKeySecretName]
            message: Name the encryption key secret; the chart does not render without it.
          - rule: >-
              oldSelf == null || !has(oldSelf.admin.secretKeySecretName) ||
              self.admin.secretKeySecretName == oldSelf.admin.secretKeySecretName
            severity: info
            paths: [admin.secretKeySecretName]
            message: >-
              The new secret must hold the same encryption key as the installed one, or every datasource credential
              stored in the database becomes unreadable.
    rules:
      - rule: self.replicas < 2 || self.redis.enabled
        mirrors: grafana.validate
        paths: [replicas]
        message: >-
          2 or more replicas need alerting coordination (Redis Sentinel); without it every replica sends its own
          alert notifications. Turn it on, or use 1 replica.

  - id: datasources
    title: Datasources and email
    description: Datasources provisioned as code, their credentials, and SMTP for alert emails.
    sections:
      - title: Datasources as code
        docs: "#datasources-as-code"
        fields:
          - path: datasources.definitions
            type: yaml
            yamlType: list
            label: Datasource definitions
            description: >-
              Grafana provisioning entries, passed through verbatim; provisioned datasources are read-only in the
              UI. Write `$KEY` where a credential goes.
            help: >-
              Point them at your own datasources, such as a Prometheus or Thanos install in the same GVC
              (`http://RELEASE-prometheus.GVC.cpln.local:9095`). Control Plane's built-in workload metrics already
              have dashboards in the console.
      - title: Datasource credentials
        docs: "#datasource-credentials"
        fields:
          - path: datasources.credentialSecrets
            type: list
            label: Credential secrets
            widget: table
            uniqueBy: [name]
            newItem: { name: "", keys: [] }
            itemLabel: "item.name + ' (' + string(size(item.keys)) + ' keys)'"
            description: >-
              What Grafana authenticates to each datasource with. Each key becomes an environment variable that a
              definition references as `$KEY`.
            item:
              type: object
              fields:
                - path: name
                  type: ref
                  label: Secret
                  required: true
                  ref:
                    kind: secret
                    format: name
                    filter: { secretType: [dictionary] }
                    mustExist: error
                    allowCreate: true
                - path: keys
                  type: list
                  label: Keys
                  required: true
                  unique: true
                  widget: tags
                  item:
                    type: string
                    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
                    patternMessage: Use letters, digits and underscores, and do not start with a digit.
              rules:
                - rule: item.name != '' && size(item.keys) > 0
                  mirrors: grafana.validate
                  paths: [keys]
                  message: Each credential secret needs a name and at least one key.
      - id: smtp
        title: Alert emails (SMTP)
        toggle: smtp.enabled
        description: Lets Grafana send alert notifications and invites by email.
        docs: "#smtp"
        fields:
          - path: smtp.host
            type: string
            label: SMTP server
            required: true
            example: true
            placeholder: smtp.example.com:587
            pattern: '^[^:\s]+:\d+$'
            patternMessage: Enter the host and port, such as smtp.example.com:587.
          - path: smtp.user
            type: string
            label: SMTP user
            description: Leave empty for unauthenticated SMTP.
          - path: smtp.passwordSecretName
            type: ref
            label: SMTP password secret
            required: true
            when: self.smtp.user != ''
            description: An opaque secret (encoding plain) holding only the SMTP password.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create: { secretType: opaque, encoding: plain }
          - path: smtp.fromAddress
            type: string
            format: email
            label: Sender address
            required: true
            example: true
          - path: smtp.fromName
            type: string
            label: Sender name
        rules:
          - rule: self.smtp.user == '' || self.smtp.passwordSecretName != ''
            mirrors: grafana.validate
            paths: [smtp.passwordSecretName]
            message: Name the SMTP password secret, or clear the SMTP user for unauthenticated SMTP.

  - id: access
    title: Access
    description: Who reaches Grafana, from the internet and from inside the GVC.
    docs: "#access"
    sections:
      - title: Public access
        fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public HTTPS endpoint
            description: The UI and API on the workload's `*.cpln.app` endpoint.
      - title: Internal access
        docs: /reference/workload/firewall
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Firewall changes take 30 to 150 seconds to take effect.
            options:
              - { value: none, label: None, description: No workload can reach Grafana internally. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
            rules:
              - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
                mirrors: grafana.validate
                message: The internal access must be none, same-gvc, same-org or workload-list.
          # workload.yaml writes inboundAllowWorkload only for workload-list.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
            rules:
              - rule: size(self.internalAccess.workloads) > 0
                severity: warning
                message: With "Specific workloads" and an empty list, no workload can connect.

  - id: database
    title: Database
    description: The PostgreSQL that holds every dashboard, user and alert rule, and its credentials.
    docs: "#app-database"
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: >-
                  The default: 3 Patroni replicas with automatic failover, 3 etcd replicas and an HAProxy leader
                  endpoint Grafana connects through.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: >-
                  One PostgreSQL replica, lighter and without failover. Its server, storage, network and backups
                  follow in the next steps.
                set: { postgresHA.enabled: false, postgres.enabled: true }
          # Declared so the postgres import's condition is a field; the chooser above writes them.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
      - id: db-credentials
        title: Database credentials
        fields:
          - type: note
            severity: warning
            text: >-
              Grafana creates the database credentials secret from these three values in both database modes, so
              there is nothing to create first. They are stored in the Helm release; a later version of this
              template takes them from a secret you create instead.
          - path: postgres.credentials.username
            type: string
            label: Database user
            required: true
          - path: postgres.credentials.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            description: Used as-is, so replace the example value.
          - path: postgres.credentials.database
            type: string
            label: Database name
            required: true
          - path: postgresHA.config.credentialsSecretName
            type: string
            label: Credentials secret name
            required: true
            when: self.postgresHA.enabled
            description: The dictionary secret Grafana creates and the highly available PostgreSQL reads. Secret names are org-wide.
          - path: postgres.config.credentialsSecretName
            type: string
            label: Credentials secret name
            required: true
            when: self.postgres.enabled
            description: The dictionary secret Grafana creates and the single-instance PostgreSQL reads. Secret names are org-wide.
        rules:
          # postgres-highly-available 2.5.0 writes the password inside double quotes in Patroni's config on every
          # start (templates/secret-startup.yaml). 2.4.x (grafana 1.3.x and earlier) allowed " and \, so an
          # unchanged password is exempt only when it comes from a version that already ran 2.5.0.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.4.0') >= 0) &&
              self.postgres.credentials.password == oldSelf.postgres.credentials.password) ||
              !self.postgres.credentials.password.matches('["\\\\]')
            severity: warning
            paths: [postgres.credentials.password]
            message: >-
              Leave out double quotes and backslashes. The highly available database writes the password inside
              double quotes in its config on every start, where they break the configuration or change the
              password. To change an existing password, run ALTER ROLE for the user and for repl first.
          # postgres-highly-available 2.5.0 renders a secret named <release>-postgres-config for its backup settings,
          # and 2.4.x (grafana 1.3.x and earlier) kept the database credentials in a chart secret of that name.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') >= 0 &&
              self.postgresHA.config.credentialsSecretName == oldSelf.postgresHA.config.credentialsSecretName &&
              !self.postgresHA.backup.enabled) ||
              self.postgresHA.config.credentialsSecretName != context.releaseName + '-postgres-config'
            severity: warning
            paths: [postgresHA.config.credentialsSecretName]
            message: >-
              Choose another name. The highly available database renders its own secret under this name when backups
              are on, and on an upgrade from grafana 1.3.x or earlier this is the old chart's secret, which the
              upgrade removes or rewrites.
          - rule: >-
              oldSelf == null || !has(oldSelf.postgres.credentials) ||
              (self.postgres.credentials.username == oldSelf.postgres.credentials.username &&
              self.postgres.credentials.password == oldSelf.postgres.credentials.password &&
              self.postgres.credentials.database == oldSelf.postgres.credentials.database)
            severity: info
            paths: [postgres.credentials.password]
            message: >-
              PostgreSQL keeps the user, password and database it was initialized with: changing them here does not
              change the database, and Grafana loses its connection unless the database is changed to match first.
          - when: self.postgresHA.enabled
            rule: self.postgresHA.config.credentialsSecretName != 'my-grafana-db-credentials'
            severity: info
            paths: [postgresHA.config.credentialsSecretName]
            messageExpression: >-
              'Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Grafana release its own name, for example ' + context.releaseName +
              '-grafana-db-credentials.'
            message: >-
              Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Grafana release its own name.
          - when: self.postgres.enabled
            rule: self.postgres.config.credentialsSecretName != 'my-grafana-db-credentials'
            severity: info
            paths: [postgres.config.credentialsSecretName]
            messageExpression: >-
              'Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Grafana release its own name, for example ' + context.releaseName +
              '-grafana-db-credentials.'
            message: >-
              Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Grafana release its own name.
          # postgres 3.4.1 fails on these keys; excluding config.credentialsSecretName from the import dropped its rule.
          - when: self.postgres.enabled
            rule: >-
              !has(self.postgres.config.username) && !has(self.postgres.config.password) &&
              !has(self.postgres.config.database)
            paths: [postgres.credentials.username]
            message: >-
              postgres.config.username, postgres.config.password and postgres.config.database were removed in
              1.3.0. Move their values to postgres.credentials, from which Grafana creates the secret, and remove
              them from postgres.config.
          # postgres-highly-available 2.5.0 fails on this block.
          - when: self.postgresHA.enabled
            rule: "!has(self.postgresHA.postgres)"
            paths: [postgres.credentials.username]
            message: >-
              postgresHA.postgres was removed in 1.4.0. Move its username, password and database unchanged to
              postgres.credentials, from which Grafana creates the secret, and remove postgresHA.postgres.
      - id: postgres-ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        fields:
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            min: 1
            required: true
            suggestions: [1, 3, 5]
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity per replica
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
          - path: postgresHA.proxy.enabled
            type: boolean
            absent: true
            default: true
            readOnly: true
            advanced: true
            label: HAProxy leader endpoint
            description: Grafana's database endpoint; it stays on.
        rules:
          - rule: self.postgresHA.proxy.enabled != false
            mirrors: grafana.validate
            paths: [postgresHA.proxy.enabled]
            message: >-
              postgresHA.proxy.enabled must stay true: the HAProxy leader endpoint is Grafana's database endpoint.
          - rule: >-
              oldSelf == null || !oldSelf.postgresHA.enabled ||
              self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
    rules:
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        message: >-
          Switching the database on an installed release deletes the current one, with all of Grafana's
          dashboards, users and alert rules, and starts an empty one. Keep the current database, or install a new
          release with the other database and move the data.
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: grafana.validate
        paths: [postgresHA.enabled]
        message: >-
          Turn on exactly one database: the highly available PostgreSQL or the single-instance PostgreSQL.

  - id: ha-backup
    title: Database backups
    description: Optional backups of the highly available PostgreSQL to object storage.
    when: self.postgresHA.enabled
    docs: "#backing-up"
    sections:
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: cards
            required: true
            options:
              - { value: logical, label: Logical, description: A scheduled pg_dumpall uploaded to the bucket. }
              - { value: wal-g, label: WAL-G, description: Base backups and WAL archiving at an interval. }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Backup interval
            unit: seconds
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 43200, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
        rules:
          - when: self.postgresHA.backup.mode == 'wal-g'
            rule: >-
              (oldSelf != null && oldSelf.postgresHA.backup.mode == 'wal-g' &&
              self.postgresHA.backup.resources.memory == oldSelf.postgresHA.backup.resources.memory) ||
              memoryBytes(self.postgresHA.backup.resources.memory) >= memoryBytes('512Mi')
            severity: warning
            paths: [postgresHA.backup.resources]
            message: >-
              Give the WAL-G sidecar at least 512Mi of memory, and at most 8 MiB per millicore of the backup CPU
              (800Mi at 100m). With less it is killed for running out of memory during the base backup and no
              backup is written.
      - title: AWS S3
        when: self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.aws.prefix != null && self.postgresHA.backup.aws.prefix != ''
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> (WALG_S3_PREFIX / WALG_GS_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: Google Cloud Storage
        when: self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
