---
kind: secret
name: {{ include "guacamole.secret.start.name" . }}
description: Guacamole start wrapper (hands the schema to the init sidecar, then boots Tomcat)
tags: {{- include "guacamole.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu

    SHARED=/guac-init

    # The schema SQL ships only in THIS image (via initdb.sh) and psql ships only
    # in the postgres image, so the two containers hand the file to each other
    # over a shared scratch volume. Wait for the sidecar to prepare the mount —
    # it runs as root and makes the directory writable for this uid-1001 user.
    echo "guacamole: waiting for $SHARED to be prepared..."
    until [ -f "$SHARED/.dir-ready" ]; do sleep 2; done

    if [ ! -f "$SHARED/schema.sql" ]; then
      echo "guacamole: exporting the PostgreSQL schema for this image version"
      /opt/guacamole/bin/initdb.sh --postgresql > "$SHARED/schema.sql.tmp"
      # Atomic rename so the sidecar never reads a partial file.
      mv "$SHARED/schema.sql.tmp" "$SHARED/schema.sql"
    fi

    # Tomcat must NOT serve before the stock guacadmin/guacadmin account has been
    # replaced, so the well-known default is never reachable over the network.
    echo "guacamole: waiting for the schema and admin account to be applied..."
    until [ -f "$SHARED/schema.applied" ]; do sleep 2; done

    echo "guacamole: schema ready, starting Tomcat"
    exec /opt/guacamole/bin/entrypoint.sh
