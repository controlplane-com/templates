---
kind: secret
name: {{ include "guacamole.secret.init.name" . }}
description: Guacamole schema and admin bootstrap script (runs once, then idles)
tags: {{- include "guacamole.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu

    SHARED=/guac-init

    # This container runs as root (the postgres image sets no USER), so it owns
    # making the shared scratch mount writable by the uid-1001 guacamole
    # container. .dir-ready is the handshake marker the other side waits on.
    mkdir -p "$SHARED"
    chmod 1777 "$SHARED"
    : > "$SHARED/.dir-ready"
    chmod 666 "$SHARED/.dir-ready"

    echo "schema-init: waiting for postgres at $PGHOST:$PGPORT ..."
    until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" >/dev/null 2>&1; do
      sleep 3
    done
    echo "schema-init: postgres is accepting connections"

    if [ "$(psql -tAc "SELECT to_regclass('public.guacamole_user') IS NOT NULL" 2>/dev/null || true)" = "t" ]; then
      echo "schema-init: guacamole schema already present, skipping bootstrap"
    else
      echo "schema-init: waiting for the guacamole container to export the schema..."
      until [ -f "$SHARED/schema.sql" ]; do sleep 2; done

      echo "schema-init: applying the guacamole schema"
      psql -v ON_ERROR_STOP=1 --single-transaction -f "$SHARED/schema.sql"

      # Replace the stock guacadmin/guacadmin account with the configured admin.
      # Hash format read from SHA256PasswordEncryptionService @ 1.6.0:
      #   password_hash = SHA256( UTF8( password || UPPERCASE_HEX(salt) ) )
      # Values are passed as psql variables so the username is quoted by psql
      # (:'adminuser') and never string-concatenated into SQL. Kept as a SECOND
      # psql invocation on purpose: setting -v variables while feeding the 24KB
      # upstream schema risks psql interpolating a :token inside vendor SQL.
      echo "schema-init: configuring the admin account"
      SALT=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' | tr 'a-f' 'A-F')
      HASH=$(printf '%s%s' "$GUACAMOLE_ADMIN_PASSWORD" "$SALT" | sha256sum | cut -d' ' -f1 | tr 'a-f' 'A-F')
      psql -v ON_ERROR_STOP=1 --single-transaction \
           -v adminuser="$GUACAMOLE_ADMIN_USERNAME" -v salt="$SALT" -v hash="$HASH" <<'SQL'
    UPDATE guacamole_user
       SET password_hash = decode(:'hash', 'hex'),
           password_salt = decode(:'salt', 'hex'),
           password_date = CURRENT_TIMESTAMP
     WHERE entity_id = (SELECT entity_id FROM guacamole_entity
                         WHERE name = 'guacadmin' AND type = 'USER');
    UPDATE guacamole_entity
       SET name = :'adminuser'
     WHERE name = 'guacadmin' AND type = 'USER';
    SQL
      unset SALT HASH
    fi

    : > "$SHARED/schema.applied"
    chmod 666 "$SHARED/schema.applied"
    echo "schema-init: bootstrap complete, idling"
    # A container that exits is restarted by the platform, so idle instead.
    exec sleep infinity
