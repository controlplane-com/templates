# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Hermes Agent
# One stateful replica on its own volume and no location handling: every GVC location would run its own
# agent with its own memory, each answering the same chat channels.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: secret
    title: Secret
    description: The prerequisite secret that holds your model key and the agent's own credentials.
    sections:
      - fields:
          - type: note
            severity: warning
            textExpression: >-
              'The secret must exist **before** you install or upgrade. If it is missing, the deployment waits on it and ' +
              '`cpln logs` shows nothing at all; the reason is in `status.versions[].message` of ' +
              '`cpln workload get-deployments ' + context.releaseName + '-hermes-agent --gvc ' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + ' -o yaml`. Once the secret exists the ' +
              'deployment recovers on its own within about ten minutes, or at once with ' +
              '`cpln workload force-redeployment ' + context.releaseName + '-hermes-agent --gvc ' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + '`.'
            text: >-
              The secret must exist **before** you install or upgrade. If it is missing, the deployment waits on
              it and `cpln logs` shows nothing at all; the reason is in `status.versions[].message` of
              `cpln workload get-deployments RELEASE_NAME-hermes-agent --gvc GVC_NAME -o yaml`. Once the secret
              exists the deployment recovers on its own within about ten minutes, or at once with
              `cpln workload force-redeployment RELEASE_NAME-hermes-agent --gvc GVC_NAME`.
          - path: secret.name
            type: ref
            label: Secret
            required: true
            description: >-
              A dictionary secret with the API key for the provider you choose on the next step and the token
              clients present to the gateway API, plus the dashboard password while the dashboard is on. The
              token must be at least 16 characters, or the API never serves and the workload never becomes
              ready.
            help: >-
              Create it with
              `cpln secret create-dictionary --name SECRET_NAME --entry "api-key=YOUR-LLM-API-KEY" --entry "api-server-key=$(openssl rand -hex 32)" --entry "dashboard-password=$(openssl rand -hex 32)"`.
              Whoever signs in to the dashboard or holds the token operates an agent that can run commands, so use long random values.
              A changed value reaches the running agent only after
              `cpln workload force-redeployment RELEASE_NAME-hermes-agent --gvc GVC_NAME`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeysFrom: >-
                [self.secret.keys.apiKey, self.secret.keys.apiServerKey] +
                (self.dashboard.enabled ? [self.secret.keys.dashboardPassword] : [])
              create:
                suggestName: "context.releaseName + '-hermes-secret'"
                hint: "Generate api-server-key and dashboard-password with: openssl rand -hex 32"
      - id: key-names
        title: Key names
        advanced: true
        description: >-
          The keys inside your secret that hold each value. Change them only to match a secret that uses
          other names; the dashboard password key sits with the dashboard.
        fields:
          - path: secret.keys.apiKey
            type: string
            label: LLM API key
            required: true
            description: The key holding your provider's API key.
          - path: secret.keys.apiServerKey
            type: string
            label: Gateway API token
            required: true
            description: The key holding the bearer token clients present to the gateway API.
    rules:
      # hermes-agent.validate refuses an empty secret.name (required above); restated for the mirror.
      - rule: self.secret.name != null && self.secret.name != ''
        mirrors: hermes-agent.validate
        paths: [secret.name]
        message: The prerequisite secret is required.

  - id: model
    title: Model
    description: The LLM provider and model the agent runs on, and what this version offers for chat platforms and browser tools.
    sections:
      - fields:
          - path: model.provider
            type: enum
            label: Provider
            widget: cards
            required: true
            description: The secret's LLM API key must be a key for this provider.
            options:
              - value: anthropic
                label: Anthropic
                description: >-
                  Claude models. Create the key inside an Anthropic workspace; other keys fail every request
                  with "anthropic-workspace-id is required".
              - value: openai
                label: OpenAI
                description: GPT models through the OpenAI API.
              - value: custom
                label: OpenAI-compatible endpoint
                description: Any other OpenAI-compatible API, such as OpenRouter, Ollama, vLLM or LiteLLM.
          - path: model.baseUrl
            type: string
            format: url
            label: Base URL
            when: self.model.provider != 'anthropic' || (self.model.baseUrl != null && self.model.baseUrl != '')
            placeholder: https://openrouter.ai/api/v1
            description: >-
              The endpoint's OpenAI-compatible base URL, usually ending in `/v1`. With OpenAI, empty uses
              `https://api.openai.com/v1`.
          - path: model.name
            type: string
            label: Model ID
            placeholder: claude-opus-4-6
            description: >-
              The model ID exactly as your provider lists it; empty uses Hermes's built-in default, an Anthropic
              model. With Anthropic,
              give the bare ID: the chart adds the `anthropic/` prefix.
          - path: model.reasoningEffort
            type: enum
            label: Reasoning effort
            widget: segmented
            required: true
            description: >-
              Hermes sends it with every request. Models without reasoning, such as gpt-4o, reject it with
              "Unsupported parameter: reasoning.effort", so choose None for them.
            options:
              - { value: none, label: None }
              - { value: low, label: Low }
              - { value: medium, label: Medium }
              - { value: high, label: High }
      - id: channels
        title: Chat platforms and browser tools
        fields:
          - type: note
            textExpression: >-
              'Telegram, Slack, Discord and other chat platforms are not set here: set them up after install ' +
              'with `cpln workload exec ' + context.releaseName + '-hermes-agent --gvc ' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + ' --container hermes -- hermes gateway setup`. ' +
              'Their tokens are stored on the volume. This version does not set up WhatsApp; 1.4.0 adds it.'
            text: >-
              Telegram, Slack, Discord and other chat platforms are not set here: set them up after install
              with `cpln workload exec RELEASE_NAME-hermes-agent --gvc GVC_NAME --container hermes -- hermes gateway setup`.
              Their tokens are stored on the volume. This version does not set up WhatsApp; 1.4.0 adds it.
          - type: note
            severity: warning
            text: >-
              Version 1.4.1 fixed chat-platform turns that replied they could not connect to the AI model,
              found on its newer image. This version's startup script lacks that fix; if a chat platform
              answers that way, upgrade to 1.4.1.
          - type: note
            severity: warning
            text: >-
              Browser tools do not work in this version: the image has no browser to drive, so they quietly
              fall back to fetching page text. Version 1.3.0 adds a headless Chromium container for them.
    rules:
      - rule: self.model.provider in ['anthropic', 'openai', 'custom']
        mirrors: hermes-agent.validate
        paths: [model.provider]
        message: Choose Anthropic, OpenAI or an OpenAI-compatible endpoint as the provider.
      - rule: self.model.provider != 'custom' || (self.model.baseUrl != null && self.model.baseUrl != '')
        mirrors: hermes-agent.validate
        paths: [model.baseUrl]
        message: An OpenAI-compatible endpoint needs its base URL.
      - rule: self.model.provider != 'anthropic' || self.model.baseUrl == null || self.model.baseUrl == ''
        mirrors: hermes-agent.validate
        paths: [model.baseUrl]
        message: >-
          The Anthropic client ignores the base URL, and the chart refuses it. Clear it, or choose an
          OpenAI-compatible endpoint to route the model through a proxy.
      - rule: self.model.reasoningEffort in ['none', 'low', 'medium', 'high']
        mirrors: hermes-agent.validate
        paths: [model.reasoningEffort]
        message: Choose None, Low, Medium or High as the reasoning effort.
      - when: self.model.provider == 'anthropic'
        rule: >-
          (oldSelf != null && self.model.name == oldSelf.model.name) ||
          self.model.name == null || !self.model.name.startsWith('anthropic/')
        severity: warning
        paths: [model.name]
        message: >-
          Give the bare model ID without "anthropic/": the chart adds that prefix itself, and a doubled
          prefix names a model that does not exist.
      - when: self.model.provider == 'anthropic'
        rule: self.model.name == null || !self.model.name.contains('.')
        severity: info
        paths: [model.name]
        message: Anthropic model IDs use hyphens, not dots, for example claude-opus-4-6.
      - when: self.model.provider != 'anthropic'
        rule: self.model.name != null && self.model.name != ''
        severity: info
        paths: [model.name]
        message: >-
          Set the model ID for this provider. Without one, Hermes falls back to its own default model,
          which is an Anthropic model.

  - id: dashboard
    title: Dashboard
    description: The optional web dashboard.
    sections:
      - id: dashboard
        title: Dashboard
        toggle: dashboard.enabled
        description: >-
          A web UI on port 9119 behind a basic-auth login, where you manage MCP servers. Whoever signs in
          operates the agent, so use a long random password. Where it can be reached is decided under
          Network.
        fields:
          - path: dashboard.username
            type: string
            label: Username
            required: true
            description: The basic-auth username; the password comes from the secret.
          - path: secret.keys.dashboardPassword
            type: string
            label: Password key in the secret
            required: true
            description: The key in your secret that holds the dashboard password.

  - id: server
    title: Server and storage
    description: The Hermes image, the compute of its single stateful replica, and the volume with its memory.
    sections:
      - fields:
          - type: note
            severity: warning
            text: >-
              This version's default image, `nousresearch/hermes-agent:v2026.8.31`, has an upstream
              session-store defect that can corrupt the session database on some installs, including through
              the dashboard at startup. Version 1.4.1 moves to an image that fixes it.
          - path: image
            type: string
            format: image
            label: Hermes image
            required: true
            description: >-
              This version's startup script was tested only with the default image. After changing it, check
              that the workload becomes ready and that a chat request gets an answer.
          - path: resources
            type: resources
            label: Hermes resources
            required: true
            description: A single stateful replica; it idles at the minimum and bursts during agent turns.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250]
            description: >-
              Holds the memory database, sessions, skills, config, MCP tokens and chat platform tokens.
            help: >-
              The initial capacity sizes only a new volume. Uninstalling the release deletes the volume set
              with everything the agent remembers; its final snapshot is kept for 7 days.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: "!has(self.resources.cpu) && !has(self.resources.memory)"
            mirrors: hermes-agent.validateResourceKnobs
            paths: [resources]
            message: >-
              resources.cpu and resources.memory were renamed to resources.maxCpu and resources.maxMemory in
              1.1.0, and the chart refuses the old names. Remove them from the values.
          - rule: oldSelf == null || self.image == oldSelf.image
            severity: info
            paths: [image]
            message: >-
              A new image restarts the single replica, so the agent is offline until it is ready again. Its
              state stays on the volume.
          - rule: oldSelf == null || oldSelf.volumeset.capacity == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - id: autoscaling
        title: Grow the volume automatically
        toggle: volumeset.autoscaling.enabled
        description: The volume set grows by the scaling factor whenever its free space falls below the threshold.
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [50, 100, 250, 500, 1000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            mirrors: hermes-agent.validate
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.

  - id: network
    title: Network
    description: Whether the agent is on the internet, which surface its public endpoint serves, and who reaches it inside.
    sections:
      # expose only orders the ports when public access is off (the first port is the one the canonical
      # endpoint fronts), so it sits in the public access section.
      - id: public
        title: Public access
        toggle: publicAccess.enabled
        description: >-
          Puts one surface on the workload's public HTTPS endpoint. Whoever gets past its login or token
          operates an agent that can run commands with full file access, so use long random credentials.
          Off, every surface is reachable only inside Control Plane.
        fields:
          - path: publicAccess.expose
            type: enum
            label: Public surface
            widget: cards
            required: true
            description: >-
              A workload has one public endpoint, and it serves one of these; the others stay internal.
              Access changes take up to a few minutes to take effect.
            options:
              - value: api
                label: Gateway API
                description: The OpenAI-compatible API on port 8642, behind the bearer token.
              - value: dashboard
                label: Dashboard
                description: The web dashboard on port 9119, behind its basic-auth login.
      - fields:
          - type: note
            when: >-
              self.dashboard.enabled && !(self.publicAccess.enabled && self.publicAccess.expose == 'dashboard')
            text: >-
              The dashboard is not on the public endpoint, so only workloads inside Control Plane reach it.
              To use it in a browser, turn on public access with the Dashboard surface.
          - type: note
            severity: warning
            when: self.dashboard.enabled
            textExpression: >-
              'In this version, Authenticate on the MCP page fails for an MCP server that signs in with OAuth, ' +
              'even on the public dashboard ("cleartext http redirect_uris are only allowed for loopback hosts"); ' +
              'version 1.2.1 fixes it for a public dashboard. Sign in from a terminal instead: `cpln workload connect ' +
              context.releaseName + '-hermes-agent --gvc ' + (context.gvc != null ? context.gvc : 'GVC_NAME') +
              ' --container hermes`, then `hermes mcp login NAME`, and paste the address the sign-in finally ' +
              'lands on (a connection error on 127.0.0.1:27890) back into the shell.'
            text: >-
              In this version, Authenticate on the MCP page fails for an MCP server that signs in with OAuth,
              even on the public dashboard ("cleartext http redirect_uris are only allowed for loopback
              hosts"); version 1.2.1 fixes it for a public dashboard. Sign in from a terminal instead:
              `cpln workload connect RELEASE_NAME-hermes-agent --gvc GVC_NAME --container hermes`, then
              `hermes mcp login NAME`, and paste the address the sign-in finally lands on (a connection error
              on 127.0.0.1:27890) back into the shell.
      - title: Other workloads
        fields:
          - type: note
            textExpression: >-
              'Other workloads call the API at `http://' + context.releaseName + '-hermes-agent.' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + '.cpln.local:8642` with the gateway API token ' +
              'as the bearer token.'
            text: >-
              Other workloads call the API at `http://RELEASE_NAME-hermes-agent.GVC_NAME.cpln.local:8642` with
              the gateway API token as the bearer token.
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Access changes take up to a few minutes to take effect.
            options:
              - value: none
                label: Nobody
                description: No workload can connect over the internal network.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          # The chart writes the list only with workload-list (workload.yaml), so it is shown only then.
          - path: internalAccess.workloads
            when: self.internalAccess.type == 'workload-list'
            type: list
            label: Allowed workloads
            widget: tags
            unique: true
            description: The whole allow-list; workloads in other GVCs can be listed too.
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
    rules:
      - rule: self.publicAccess.expose in ['api', 'dashboard']
        mirrors: hermes-agent.validate
        paths: [publicAccess.enabled]
        message: >-
          publicAccess.expose must be api or dashboard; the chart checks it even with public access off.
          Correct it in YAML mode.
      # This version refuses expose: dashboard with the dashboard off even while public access is off, so
      # the rule sits at step level rather than in the public access section.
      - when: self.publicAccess.expose == 'dashboard'
        rule: self.dashboard.enabled
        mirrors: hermes-agent.validate
        paths: [publicAccess.enabled, dashboard.enabled]
        message: >-
          The public surface is set to Dashboard, which this version checks even with public access off,
          and the dashboard is off. Turn the dashboard on, or choose Gateway API as the public surface
          (turn public access on to see it, or correct publicAccess.expose in YAML mode).
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: hermes-agent.validate
        paths: [internalAccess.type]
        message: Choose Nobody, Same GVC, Same org or Specific workloads.
      - when: self.internalAccess.type == 'workload-list'
        rule: size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With no workloads listed, no workload can connect, as with Nobody.

migrations:
  # 1.1.0 named the limits maxCpu and maxMemory (same defaults as 1.0.0's cpu and memory).
  - { fromVersions: "<1.1.0", from: resources.cpu, to: resources.maxCpu }
  - { fromVersions: "<1.1.0", from: resources.memory, to: resources.maxMemory }
