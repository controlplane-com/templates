{{- /*
  Credentials for the BUNDLED single-instance database, in the exact shape the
  postgres subchart reads them: a dictionary with the keys `username`,
  `password` and `database`. postgres 3.4.0 stopped creating this secret and now
  only takes its NAME, which is why the chart on this side of the dependency
  owns it.

  This is internal plumbing — no human ever types this password; it exists only
  so Infisical can reach its own Postgres — so the bundled-plumbing exception
  applies and it stays a template-created secret rather than a prerequisite the
  user has to create.

  It is deliberately SEPARATE from {release}-infisical-db, which keeps its own
  `postgresUsername`/`postgresPassword` keys for the app's DB_CONNECTION_URI.
  The two secrets carry the same values but are read by different identities and
  their key names are fixed by different consumers, so neither can be dropped.

  Not gated on postgres.enabled: the postgres dependency has no `condition` in
  Chart.yaml, so the bundled database is always deployed.
*/}}
---
kind: secret
name: {{ include "infisical.pgCredentials.secret.name" . }}
description: Infisical bundled PostgreSQL credentials (read by the postgres subchart)
tags: {{- include "infisical.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
