---
kind: secret
name: {{ include "infisical.db.secret.name" . }}
description: Infisical database credentials (for DB_CONNECTION_URI assembly)
tags: {{- include "infisical.tags" . | nindent 4 }}
type: dictionary
data:
  postgresUsername: {{ .Values.postgres.config.username | quote }}
  postgresPassword: {{ .Values.postgres.config.password | quote }}
