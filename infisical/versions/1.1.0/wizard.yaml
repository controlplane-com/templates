# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Infisical

# The Infisical tier is stateless, but the bundled PostgreSQL (brings this limit with its import) and the
# Redis + Sentinel tier (redis 3.4.3 has no descriptor, so its keys are parent fields below) are
# single-location stateful workloads with no location handling.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    title: Bundled PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Infisical creates this secret itself (templates/secret-db-credentials.yaml) and names it in the Database
      # credentials step below.
      - config.credentialsSecretName
      # Infisical connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          Infisical connects to its database like any other workload: keep Same GVC, or add the Infisical
          workload under Allowed workloads.
      backup.enabled:
        help: Adds one cron workload that runs `pg_dumpall` and uploads a gzipped dump to the bucket.
      volumeset.capacity:
        max: 65536
      volumeset.autoscaling.maxCapacity:
        max: 65536

steps:
  - id: infisical
    title: Infisical
    description: The Infisical server, its root-of-trust keys and outbound email.
    docs: "#configuration"
    sections:
      - title: Server
        docs: "#infisical-server"
        fields:
          - path: infisical.image
            type: string
            format: image
            label: Infisical image
            required: true
            description: The standalone image; it runs database migrations on every boot.
          - path: infisical.replicas
            type: integer
            label: Replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: The server is stateless over PostgreSQL and Redis; 2 or more keep it up through restarts.
          - path: infisical.siteUrl
            type: string
            format: url
            label: Site URL
            placeholder: https://secrets.example.com
            description: >-
              Optional. The public URL used for links and cookies, with `https://`. Leave empty to use the
              canonical endpoint.
          - path: infisical.resources
            type: resources
            label: Resources
            required: true
            description: Per replica. Keep at least 2Gi of memory; boot migrations run out of memory at 1Gi.
            cpu: { min: 100m }
            memory: { min: 256Mi }
      - title: Root-of-trust keys
        docs: "#prerequisite-secret"
        fields:
          - type: note
            severity: warning
            text: >-
              The secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: secrets.name
            type: ref
            label: Keys secret
            required: true
            description: A dictionary secret with the keys `ENCRYPTION_KEY` and `AUTH_SECRET`.
            help: >-
              Both are write-once. A new `ENCRYPTION_KEY` makes every stored secret unreadable; a new
              `AUTH_SECRET` logs everyone out.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [ENCRYPTION_KEY, AUTH_SECRET]
              create:
                secretType: dictionary
                suggestName: "context.releaseName + '-infisical-secrets'"
                hint: "ENCRYPTION_KEY: openssl rand -hex 16. AUTH_SECRET: openssl rand -base64 32"
        rules:
          - rule: oldSelf == null || self.secrets.name == oldSelf.secrets.name
            severity: info
            paths: [secrets.name]
            message: >-
              The new secret must hold the same ENCRYPTION_KEY and AUTH_SECRET as the installed one, or stored
              secrets become unreadable.
      - id: smtp
        title: Outbound email
        toggle: smtp.enabled
        docs: "#email"
        description: Invites, email verification and password reset. Off, the first sign-up becomes the admin.
        fields:
          - path: smtp.host
            type: string
            format: hostname
            label: SMTP host
            required: true
            example: true
          - path: smtp.port
            type: integer
            label: SMTP port
            required: true
            min: 1
            max: 65535
            suggestions: [25, 465, 587, 1025, 2525]
          - path: smtp.fromAddress
            type: string
            format: email
            label: From address
            required: true
            example: true
          - path: smtp.fromName
            type: string
            label: From name
          - path: smtp.requireTls
            type: boolean
            label: Require STARTTLS
            description: Turn off only for a plaintext mail catcher such as Mailpit on port 1025.
          - path: smtp.auth.secretName
            type: ref
            label: SMTP login secret
            description: >-
              Optional. A dictionary secret with the keys `SMTP_USERNAME` and `SMTP_PASSWORD`. Leave empty for a
              relay without authentication.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [SMTP_USERNAME, SMTP_PASSWORD]
              create:
                secretType: dictionary
                suggestName: "context.releaseName + '-infisical-smtp'"
    rules:
      - rule: >-
          self.secrets.name != '' && self.infisical.replicas >= 1 &&
          self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list'] &&
          (!self.smtp.enabled || (self.smtp.host != '' && self.smtp.fromAddress != ''))
        mirrors: infisical.validate
        paths: [secrets.name]
        message: >-
          Name the keys secret, keep at least one replica, and with email on set the SMTP host and from
          address; the chart does not render otherwise.

  - id: access
    title: Access
    description: Who reaches the UI and API, from the internet and from inside the GVC.
    docs: "#access"
    sections:
      - fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public HTTPS endpoint
            description: >-
              The UI and API on the workload's `*.cpln.app` endpoint. The first account to sign up becomes the
              admin, so sign up right after install.
          - path: internalAccess.type
            type: enum
            label: Who can connect internally
            widget: cards
            required: true
            description: Firewall changes take 30 seconds to a few minutes to take effect.
            options:
              - { value: none, label: None, description: No workload can reach Infisical internally. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
          # workload.yaml writes this list only when the type is workload-list.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
    rules:
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: redis
    title: Redis
    description: Cache and background-job queues. Required; Infisical connects through Sentinel.
    docs: "#bundled-redis"
    sections:
      - title: Redis with Sentinel
        fields:
          - path: redis.redis.replicas
            type: integer
            label: Redis nodes
            required: true
            min: 1
            suggestions: [1, 3]
          - path: redis.sentinel.replicas
            type: integer
            label: Sentinels
            required: true
            min: 1
            suggestions: [1, 3, 5]
        rules:
          # infisical.validate checks Sentinel auth only with the Redis password on; 1.2.1 refuses it always.
          - when: "!self.redis.redis.auth.password.enabled"
            rule: >-
              [self.redis.sentinel].all(s, !s.exists(k, k == 'auth' && s[k] != null && [s[k]].exists(a,
              a.exists(j, j in ['password', 'fromSecret'] && a[j] != null && [a[j]].exists(p,
              p.exists(e, e == 'enabled' && p[e] == true))))))
            severity: warning
            paths: [redis.sentinel.replicas]
            message: >-
              Keep Sentinel authentication off (remove redis.sentinel.auth from the values): Infisical sends no
              Sentinel password, so it cannot reach Redis, and the plain-text password would sit in the release.
              Version 1.2.1 refuses it.
      - id: redis-auth
        title: Redis password
        toggle: redis.redis.auth.password.enabled
        description: >-
          Off, Redis accepts connections from the GVC without a password. On, Redis requires the password below
          and Infisical sends it to the Redis nodes; Sentinels stay without one.
        fields:
          - type: note
            severity: warning
            textExpression: >-
              'This version takes the Redis password as a value: it is stored in the Helm release and in the secret ' +
              (context.releaseName == null || context.releaseName == '' ? 'RELEASE_NAME' : context.releaseName) +
              '-redis-auth-password, which the bundled Redis creates. Version 1.2.0 reads it from a secret you
              create instead.'
            text: >-
              This version takes the Redis password as a value: it is stored in the Helm release and in the secret
              RELEASE_NAME-redis-auth-password, which the bundled Redis creates. Version 1.2.0 reads it from a
              secret you create instead.
          - path: redis.redis.auth.password.value
            type: string
            label: Redis password
            required: true
            sensitive: true
            widget: password
            example: true
            description: >-
              Used as typed, so replace the published default. Leave out spaces, quotes and backslashes: the Redis
              nodes and Sentinels write it into their config files.
        rules:
          - rule: self.redis.redis.auth.password.value != null && self.redis.redis.auth.password.value != ''
            mirrors: infisical.validate
            paths: [redis.redis.auth.password.value]
            message: Set the Redis password.
          - rule: >-
              [self.redis.sentinel].all(s, !s.exists(k, k == 'auth' && s[k] != null && [s[k]].exists(a,
              a.exists(j, j in ['password', 'fromSecret'] && a[j] != null && [a[j]].exists(p,
              p.exists(e, e == 'enabled' && p[e] == true))))))
            mirrors: infisical.validate
            paths: [redis.redis.auth.password.value]
            message: >-
              Keep Sentinel authentication off (remove redis.sentinel.auth from the values): Infisical
              authenticates only to the Redis nodes.
          # redis 3.4.3 writes the password unquoted into redis.conf and sentinel.conf with sh echo
          # (templates/workload-redis.yaml, workload-sentinel.yaml): a space splits it, quotes start a quoted
          # string, and echo turns backslash sequences into other characters.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.auth.password.value) &&
              self.redis.redis.auth.password.value == oldSelf.redis.redis.auth.password.value) ||
              (!self.redis.redis.auth.password.value.matches('\\s') && !self.redis.redis.auth.password.value.contains('"') &&
              !self.redis.redis.auth.password.value.contains("'") && !self.redis.redis.auth.password.value.contains('\\'))
            severity: warning
            paths: [redis.redis.auth.password.value]
            message: >-
              Leave out spaces, quotes and backslashes: the Redis nodes and Sentinels write the password unquoted
              into their config files, where these characters break or change it.
          - when: >-
              oldSelf != null && has(oldSelf.redis.redis.auth.password.enabled) && oldSelf.redis.redis.auth.password.enabled == true &&
              [self.redis.sentinel].exists(s, s.exists(k, k == 'persistence' && s[k] != null && [s[k]].exists(p, p.exists(e, e == 'enabled' && p[e] == true))))
            rule: self.redis.redis.auth.password.value == oldSelf.redis.redis.auth.password.value
            severity: info
            paths: [redis.redis.auth.password.value]
            message: >-
              The Sentinels keep the Redis password they were first started with (their config lives on a volume).
              Run SENTINEL SET mymaster auth-pass with the new password on every Sentinel first, or failover stops
              working. The Redis nodes and Infisical restart with the new password.
          - when: oldSelf != null
            rule: self.redis.redis.auth.password.value != 'change-me-infisical-redis'
            severity: info
            paths: [redis.redis.auth.password.value]
            message: The Redis password is still the published default.
          # redis 3.4.3 templates/workload-sentinel.yaml: bootstrap_sentinel_conf keeps an existing sentinel.conf, which
          # survives a restart only with sentinel.persistence on (off by default, values.yaml:146-147).
          - when: >-
              oldSelf != null && self.redis.redis.auth.password.enabled &&
              (!has(oldSelf.redis.redis.auth.password.enabled) || oldSelf.redis.redis.auth.password.enabled != true) &&
              [self.redis.sentinel].exists(s, s.exists(k, k == 'persistence' && s[k] != null && [s[k]].exists(p, p.exists(e, e == 'enabled' && p[e] == true))))
            rule: "false"
            severity: info
            paths: [redis.redis.auth.password.value]
            message: >-
              The Sentinels were first started without a Redis password and keep that config on their volume, so
              they cannot authenticate to the Redis nodes after this change. Run SENTINEL SET mymaster auth-pass
              with the password on every Sentinel once the Redis nodes have restarted.
      - title: Images
        advanced: true
        fields:
          - path: redis.redis.image
            type: string
            format: image
            label: Redis image
            required: true
          - path: redis.sentinel.image
            type: string
            format: image
            label: Sentinel image
            required: true

  - id: database
    title: Database credentials
    description: >-
      The user, password and database the bundled PostgreSQL is initialized with. Infisical creates the
      dictionary secret named below from them, and both PostgreSQL and Infisical read it; there is nothing to
      create first.
    docs: "#bundled-postgresql"
    fields:
      - type: note
        severity: warning
        textExpression: >-
          'These values are stored in the Helm release in plain text, and in the secrets ' +
          (context.releaseName == null || context.releaseName == '' ? 'RELEASE_NAME' : context.releaseName) +
          '-infisical-db and the one named below, which the chart creates. Version 1.2.0 takes them from a
          secret you create instead.'
        text: >-
          These values are stored in the Helm release in plain text, and in the secrets RELEASE_NAME-infisical-db
          and the one named below, which the chart creates. Version 1.2.0 takes them from a secret you create
          instead.
      - path: postgres.credentials.username
        type: string
        label: Database user
        required: true
        immutable: PostgreSQL creates this user once, when its data is first initialized.
        description: Infisical puts it into its database connection URL, so use letters, digits, `-` and `_` only.
      - path: postgres.credentials.password
        type: string
        label: Database password
        required: true
        sensitive: true
        widget: password
        example: true
        description: >-
          Used as typed, so replace the published default. Infisical puts it into its database connection URL,
          so use letters, digits, `-` and `_` only.
        help: PostgreSQL keeps the password it was initialized with, so change it with `ALTER ROLE` before you change it here.
      - path: postgres.credentials.database
        type: string
        label: Database name
        required: true
        immutable: PostgreSQL creates this database once, when its data is first initialized.
      - path: postgres.config.credentialsSecretName
        type: string
        label: Credentials secret name
        required: true
        description: The dictionary secret Infisical creates from these values for PostgreSQL. Secret names are org-wide.
        pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
        patternMessage: Use lowercase letters, digits and hyphens, starting with a letter.
    rules:
      # Infisical builds DB_CONNECTION_URI as postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@<host>:5432/<database>,
      # with the database name written unquoted into the env value (templates/workload.yaml).
      - rule: >-
          (oldSelf != null && has(oldSelf.postgres.credentials.username) &&
          self.postgres.credentials.username == oldSelf.postgres.credentials.username) ||
          self.postgres.credentials.username.matches('^[A-Za-z0-9_-]+$')
        severity: warning
        paths: [postgres.credentials.username]
        message: >-
          Use only letters, digits, - and _: Infisical puts the user unencoded into its database connection URL.
      - rule: >-
          (oldSelf != null && has(oldSelf.postgres.credentials.password) &&
          self.postgres.credentials.password == oldSelf.postgres.credentials.password) ||
          self.postgres.credentials.password.matches('^[A-Za-z0-9_-]+$')
        severity: warning
        paths: [postgres.credentials.password]
        message: >-
          Use only letters, digits, - and _: Infisical puts the password unencoded into its database connection
          URL, where other characters break it.
      - rule: >-
          (oldSelf != null && has(oldSelf.postgres.credentials.database) &&
          self.postgres.credentials.database == oldSelf.postgres.credentials.database) ||
          self.postgres.credentials.database.matches('^[A-Za-z0-9_-]+$')
        severity: warning
        paths: [postgres.credentials.database]
        message: >-
          Use only letters, digits, - and _: Infisical writes the database name unencoded and unquoted at the end
          of its database connection URL.
      - rule: oldSelf == null || self.postgres.credentials.password == oldSelf.postgres.credentials.password
        severity: info
        paths: [postgres.credentials.password]
        message: >-
          PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Infisical loses its
          database connection after this upgrade.
      - when: oldSelf != null
        rule: self.postgres.credentials.password != 'change-me-infisical-pg'
        severity: info
        paths: [postgres.credentials.password]
        message: >-
          The password is still the published default. Change it with ALTER ROLE ... PASSWORD, then set the
          same value here.
      - rule: self.postgres.config.credentialsSecretName != 'my-infisical-db-credentials'
        severity: info
        paths: [postgres.config.credentialsSecretName]
        messageExpression: >-
          'Secret names are org-wide: a release on this name is refused while another release manages that
          secret. Give each Infisical release its own name, for example ' + context.releaseName +
          '-infisical-db-credentials.'
        message: >-
          Secret names are org-wide: a release on this name is refused while another release manages that
          secret. Give each Infisical release its own name.
      - rule: >-
          !(self.postgres.config.credentialsSecretName in [context.releaseName + '-infisical-db',
          context.releaseName + '-redis-config', context.releaseName + '-sentinel-config'] +
          (self.redis.redis.auth.password.enabled ? [context.releaseName + '-redis-auth-password'] : []))
        severity: warning
        paths: [postgres.config.credentialsSecretName]
        message: >-
          Choose another name: this release already creates a secret under it (<release>-infisical-db,
          <release>-redis-config, <release>-sentinel-config or <release>-redis-auth-password).

# Rules over the imported values: their issues show on the imported fields' step.
rules:
  # postgres 3.4.1 refuses its 3.3.0 credential keys (pg.validateCredentials); Infisical 1.1.0 reads postgres.credentials.
  - rule: >-
      [self.postgres.config].all(m, !m.exists(k, k in ['username', 'password', 'database']))
    paths: [postgres.credentials.username]
    message: >-
      postgres.config.username, password and database are not read by this version and the bundled PostgreSQL
      refuses them: set the Database credentials step instead, and remove them from postgres.config.
  # In 1.1.0 Infisical sends REDIS_PASSWORD only for redis.redis.auth.password; the redis chart's fromSecret
  # method would require a password Infisical never sends.
  - rule: >-
      [self.redis.redis].all(r, !r.exists(k, k == 'auth' && r[k] != null && [r[k]].exists(a,
      a.exists(j, j == 'fromSecret' && a[j] != null && [a[j]].exists(f, f.exists(e, e == 'enabled' && f[e] == true))))))
    severity: warning
    paths: [redis.redis.auth.password.enabled]
    message: >-
      Turn off redis.redis.auth.fromSecret: in this version Infisical sends only the password set under Redis
      password, so Redis would refuse it. Version 1.2.0 reads the password from a secret.
  - rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Infisical, which connects to its database like any other workload.'
  - when: self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-infisical') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-infisical, or Infisical cannot reach its database.'"
    fix:
      path: postgres.internalAccess.workloads
      items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-infisical']"
    message: Add the Infisical workload to the list, or Infisical cannot reach its database.
  # Secrets the chart creates itself: <release>-infisical-db, the database secret named under Database
  # credentials, the redis subchart's <release>-redis-config and <release>-sentinel-config, and
  # <release>-redis-auth-password with the Redis password on.
  - rule: >-
      !(([self.secrets.name] +
      (self.smtp.enabled && self.smtp.auth.secretName != '' ? [self.smtp.auth.secretName] : []) +
      (self.postgres.backup.enabled && self.postgres.backup.provider == 'minio' ? [self.postgres.backup.minio.credentialsSecretName] : [])).exists(n,
      n == self.postgres.config.credentialsSecretName || n in [context.releaseName + '-infisical-db', context.releaseName + '-redis-config', context.releaseName + '-sentinel-config'] +
      (self.redis.redis.auth.password.enabled ? [context.releaseName + '-redis-auth-password'] : [])))
    severity: warning
    paths: [secrets.name]
    message: >-
      This release creates its own secret under a name you chose for the keys secret, the SMTP login secret or
      the backup keys secret (<release>-infisical-db, the database credentials secret, <release>-redis-config,
      <release>-sentinel-config or <release>-redis-auth-password). Use a different name.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Infisical connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.
  - path: redis.redis.resources
    reason: >-
      redis 3.4.3 names its limits cpu/memory beside minCpu/minMemory, a shape the resources field cannot bind;
      the defaults suit the cache and job queues.
  - path: redis.sentinel.resources
    reason: >-
      redis 3.4.3 names its limits cpu/memory beside minCpu/minMemory, a shape the resources field cannot bind;
      a Sentinel needs little.

migrations:
  - fromVersions: "<1.1.0"
    from: postgres.config.username
    to: postgres.credentials.username
  - fromVersions: "<1.1.0"
    from: postgres.config.password
    to: postgres.credentials.password
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: "<1.1.0"
    from: postgres.config.database
    to: postgres.credentials.database
