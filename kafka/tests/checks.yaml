# Feature checks for the kafka template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org}, and the vars each baseline defines (admin_password, rest_password,
# connect_rest_password, connect_env_provider, and the 4.5.1 connect_alias_* / connect_secret_* names; an empty
# var means the baseline does not configure that feature and the check prints SKIP).
checks:
  - id: produce-consume
    description: A message produced over SASL reaches a consumer, on a topic replicated to all three brokers.
    exec:
      workload: "{release}-client"
      container: kafka
      shell: bash
      script: |
        set -e
        cd /opt/kafka/bin
        cat > /tmp/e2e.properties <<'EOF'
        security.protocol=SASL_PLAINTEXT
        sasl.mechanism=PLAIN
        sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="{admin_password}";
        EOF
        B={release}-cluster.{gvc}.cpln.local:9092
        ./kafka-topics.sh --bootstrap-server $B --command-config /tmp/e2e.properties --create --if-not-exists \
          --topic e2e --partitions 3 --replication-factor 3 >/dev/null
        MSG="e2e-$(date +%s%N)"
        echo "$MSG" | ./kafka-console-producer.sh --bootstrap-server $B --producer.config /tmp/e2e.properties --topic e2e
        ./kafka-console-consumer.sh --bootstrap-server $B --consumer.config /tmp/e2e.properties --topic e2e \
          --from-beginning --timeout-ms 60000 2>/dev/null | grep -qx "$MSG" && echo "CONSUMED $MSG"
    expect:
      stdout: "^CONSUMED e2e-"
    retries: 4
    retryDelaySeconds: 30
    timeoutSeconds: 180

  - id: replicas-in-sync
    description: Every partition of the test topic has three in-sync replicas.
    exec:
      workload: "{release}-client"
      container: kafka
      shell: bash
      script: |
        cd /opt/kafka/bin
        printf '%s\n' 'security.protocol=SASL_PLAINTEXT' 'sasl.mechanism=PLAIN' \
          'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="{admin_password}";' > /tmp/e2e.properties
        ./kafka-topics.sh --bootstrap-server {release}-cluster.{gvc}.cpln.local:9092 \
          --command-config /tmp/e2e.properties --describe --topic e2e | grep 'Partition:' \
          | awk '{ for (i=1;i<=NF;i++) if ($i=="Isr:") print split($(i+1), a, ",") }' | sort -u
    expect:
      stdout: "\\A3\\s*\\Z"
    # After a rolling upgrade the last broker restarted needs a few minutes to rejoin the ISR.
    retries: 8
    retryDelaySeconds: 30

  - id: rest-proxy
    description: The REST Proxy authenticates a basic-auth user and lists the cluster's topics.
    # Run in the proxy's own container: its default firewall admits no other workload in the GVC.
    exec:
      workload: "{release}-rest-proxy"
      container: rest-proxy
      script: |
        python3 - <<'EOF'
        import base64, urllib.request, urllib.error
        auth = base64.b64encode(b"e2e:{rest_password}").decode()
        req = urllib.request.Request("http://127.0.0.1:8082/topics", headers={"Authorization": "Basic " + auth})
        print(urllib.request.urlopen(req, timeout=20).read().decode())
        EOF
    expect:
      stdout: '"e2e"'
    retries: 4
    retryDelaySeconds: 20
    # A fresh 4.4.0 install passes; this still blocks there.
    knownIssue:
      note: >-
        Values from 4.1.0 and older carry the old Jetty JAAS class, which cp-kafka-rest:latest rejects, so every
        basic-auth user gets 401 after the upgrade. Pending a maintainer ruling.
      scenarios: "^upgrade "

  - id: rest-proxy-rejects-bad-password
    description: The REST Proxy refuses a wrong basic-auth password (the control for the check above).
    exec:
      workload: "{release}-rest-proxy"
      container: rest-proxy
      script: |
        python3 - <<'EOF'
        import base64, urllib.request, urllib.error
        auth = base64.b64encode(b"e2e:wrong-password").decode()
        req = urllib.request.Request("http://127.0.0.1:8082/topics", headers={"Authorization": "Basic " + auth})
        try:
            print("STATUS", urllib.request.urlopen(req, timeout=20).status)
        except urllib.error.HTTPError as e:
            print("STATUS", e.code)
        EOF
    expect:
      stdout: "^STATUS 401$"

  - id: kafbat-ui
    description: The Kafbat UI is up and reports its cluster online with all three brokers.
    exec:
      workload: "{release}-kafbat-ui"
      container: kafbat-ui
      script: wget -qO- http://127.0.0.1:8080/api/clusters
    expect:
      stdout: '"status":"ONLINE".*"brokerCount":3'
    # Kafbat refreshes its cluster view on a timer, so right after an upgrade it can still count a
    # broker that is rejoining as missing.
    retries: 8
    retryDelaySeconds: 30

  - id: log4j-root-loglevel
    issue: "#5137"
    since: 4.2.0
    description: >-
      The brokers run with KAFKA_LOG4J_ROOT_LOGLEVEL=INFO, so the official 3.x image does not also write
      root logs to server.log, which filled the container's ephemeral storage.
    exec:
      workload: "{release}-cluster"
      container: kafka
      script: |
        echo "LEVEL=$KAFKA_LOG4J_ROOT_LOGLEVEL"
        ls -l /opt/kafka/logs/server.log* 2>/dev/null || echo "NO-SERVER-LOG"
    expect:
      stdout: "^LEVEL=INFO$"
      notStdout: "server\\.log"

  - id: connect-stdout-only
    issue: "#5401"
    since: 4.4.1
    description: >-
      The Kafka Connect worker runs with a root logger of INFO, stdout only, so it does not also write connect.log,
      which filled the container's ephemeral storage.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      script: |
        if [ -n '{connect_rest_password}' ]; then
          set -- --header="Authorization: Basic $(printf 'e2e:%s' '{connect_rest_password}' | base64 | tr -d '\n')"
        fi
        wget -qO- "$@" http://127.0.0.1:8083/ | grep -o '"version":"[^"]*"' || echo "CONNECT-DOWN"
        for p in /proc/[0-9]*; do
          tr '\0' '\n' < $p/cmdline 2>/dev/null | grep -qx org.apache.kafka.connect.cli.ConnectDistributed &&
            tr '\0' '\n' < $p/cmdline | grep '^-Dlog4j.configuration='
        done
        grep '^log4j.rootLogger=' /opt/kafka/config/connect-log4j-updated.properties 2>/dev/null || echo "NO-UPDATED-CONFIG"
        ls -l /opt/kafka/logs/connect.log* 2>/dev/null || echo "NO-CONNECT-LOG"
    expect:
      stdout: '\A"version":"3\.[0-9.]+"\n-Dlog4j\.configuration=file:/opt/kafka/config/connect-log4j-updated\.properties\nlog4j\.rootLogger=INFO, stdout\nNO-CONNECT-LOG\s*\Z'
    retries: 8
    retryDelaySeconds: 30

  - id: connect-rest-auth
    issue: "#5596"
    since: 4.5.0
    description: >-
      With rest_auth_secret set, the Kafka Connect REST API refuses every read and write without credentials, including
      the ones that return connector configs and the admin loggers, refuses a wrong password, accepts every user in the
      secret, and answers an unsigned internal task request with 400 (missing signature). With values carried from older
      versions it stays open.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      script: |
        PW='{connect_rest_password}'
        U=http://127.0.0.1:8083
        code() { wget -q -S -O /dev/null "$@" 2>&1 | sed -n 's/^ *HTTP\/[0-9.]* \([0-9][0-9]*\).*/\1/p' | tail -1; }
        raw() { printf '%s /%s HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' "$1" "$2" "${#3}" "$3" | nc 127.0.0.1 8083 | sed -n '1s/^HTTP\/[0-9.]* \([0-9]*\).*/\1/p'; }
        basic() { printf 'Authorization: Basic %s' "$(printf '%s' "$1" | base64 | tr -d '\n')"; }
        if [ -n "$PW" ]; then
          echo "NONE root=$(code $U/) plugins=$(code $U/connector-plugins) list=$(code $U/connectors) info=$(code "$U/connectors?expand=info") config=$(code $U/connectors/e2e-sink-a/config) create=$(code --header='Content-Type: application/json' --post-data='{"name":"x","config":{}}' $U/connectors) pause=$(raw PUT connectors/e2e-sink-a/pause) delete=$(raw DELETE connectors/e2e-sink-a) loggers=$(code $U/admin/loggers) setlogger=$(raw PUT admin/loggers/root '{"level":"DEBUG"}')"
          echo "WRONG list=$(code --header="$(basic e2e:wrong)" $U/connectors)"
          echo "USERS e2e=$(code --header="$(basic "e2e:$PW")" $U/connectors) kafka-ui=$(code --header="$(basic "kafka-ui:$PW")" $U/connectors)"
          echo "UNSIGNED tasks=$(code --header='Content-Type: application/json' --post-data='[]' $U/connectors/e2e-sink-a/tasks)"
        else
          echo "OPEN list=$(code $U/connectors)"
        fi
    expect:
      stdout: '\A(NONE root=401 plugins=401 list=401 info=401 config=401 create=401 pause=401 delete=401 loggers=401 setlogger=401\nWRONG list=401\nUSERS e2e=200 kafka-ui=200\nUNSIGNED tasks=400|OPEN list=200)\s*\Z'
    retries: 8
    retryDelaySeconds: 30

  - id: connect-rest-auth-connectors
    issue: "#5596"
    since: 4.5.0
    description: >-
      With REST API auth on, the chart's connector setup still creates its connectors, and on two workers every
      connector and task runs, spread over both: a follower's internal task-config requests pass the auth filter.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      script: |
        PW='{connect_rest_password}'
        if [ -z "$PW" ]; then echo "SKIP no auth"; exit 0; fi
        A="Authorization: Basic $(printf 'e2e:%s' "$PW" | base64 | tr -d '\n')"
        # Only the two sink connectors: later baselines add more connectors to the group.
        S="$(wget -qO- --header="$A" http://127.0.0.1:8083/connectors/e2e-sink-a/status)$(wget -qO- --header="$A" http://127.0.0.1:8083/connectors/e2e-sink-b/status)"
        echo "connectors: $(echo "$S" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | sort -u | tr '\n' ' ')"
        echo "states: $(echo "$S" | grep -o '"state":"[A-Z]*"' | cut -d'"' -f4 | sort | uniq -c | awk '{printf "%s %s ", $1, $2}')"
        echo "workers: $(echo "$S" | grep -o '"worker_id":"[^"]*"' | sort -u | wc -l | tr -d ' ')"
    expect:
      stdout: '\A(connectors: e2e-sink-a e2e-sink-b \nstates: 6 RUNNING \nworkers: 2|SKIP no auth)\s*\Z'
    retries: 10
    retryDelaySeconds: 30

  - id: connect-rest-auth-forwarding
    issue: "#5596"
    since: 4.5.0
    description: >-
      Each worker refuses a connector restart without credentials and accepts it with them. The connector runs on one
      worker only, so at least one of them forwards the request, and the forwarded request keeps its credentials.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      script: |
        PW='{connect_rest_password}'
        if [ -z "$PW" ]; then echo "SKIP no auth"; exit 0; fi
        A="Authorization: Basic $(printf 'e2e:%s' "$PW" | base64 | tr -d '\n')"
        code() { wget -q -S -O /dev/null "$@" 2>&1 | sed -n 's/^ *HTTP\/[0-9.]* \([0-9][0-9]*\).*/\1/p' | tail -1; }
        for i in 0 1; do
          H=http://{release}-connect-e2e-$i.{release}-connect-e2e:8083/connectors/e2e-sink-a/restart
          echo "worker-$i none=$(code --header='Content-Type: application/json' --post-data='' "$H") auth=$(code --header='Content-Type: application/json' --post-data='' --header="$A" "$H")"
        done
    expect:
      stdout: '\A(worker-0 none=401 auth=20[0-9]\nworker-1 none=401 auth=20[0-9]|SKIP no auth)\s*\Z'
    retries: 6
    retryDelaySeconds: 30

  - id: kafbat-ui-connect
    issue: "#5596"
    since: 4.5.0
    description: >-
      The Kafka UI lists the connectors of a Connect group with REST API auth, logging in as a user that is not the
      first in the secret.
    exec:
      workload: "{release}-kafbat-ui"
      container: kafbat-ui
      script: |
        if [ -z '{connect_rest_password}' ]; then echo "SKIP no auth"; exit 0; fi
        wget -qO- http://127.0.0.1:8080/api/clusters/e2e/connectors | grep -o '"name":"e2e-sink-[ab]"' | sort -u | tr '\n' ' '
    expect:
      stdout: '\A("name":"e2e-sink-a" "name":"e2e-sink-b" |SKIP no auth)\s*\Z'
    retries: 8
    retryDelaySeconds: 30

  # ─── 4.5.1: connector credentials from mounted Control Plane secrets (dir config provider) ─────────────────────
  # The aliases are canaries that only appear in a topic name when the worker resolved the placeholder. The admin
  # password ({admin_password}) is read by the connectors through ${dir:} and must never appear in any surface.
  # No check prints a secret value.

  - id: connect-secret-mounts
    issue: "#5597"
    since: 4.5.1
    description: >-
      A dictionary secret listed in secrets is mounted as a directory with one file per key (plus the platform's own
      ___cpln___ file), and an opaque secret as one file, under /opt/kafka/secrets.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      shell: bash
      script: |
        D='{connect_secret_dict}'; O='{connect_secret_opaque}'
        if [ -z "$D" ]; then echo "SKIP no secrets"; exit 0; fi
        if [ -d "/opt/kafka/secrets/$D" ]; then echo "DICT $(ls -1 "/opt/kafka/secrets/$D" | grep -v '^___cpln___' | tr '\n' ' ')"; else echo "DICT not a directory"; fi
        if [ -f "/opt/kafka/secrets/$O" ] && [ ! -d "/opt/kafka/secrets/$O" ]; then echo "OPAQUE file"; else echo "OPAQUE not a file"; fi
    expect:
      stdout: '\A(DICT admin-password alias wrong-password \nOPAQUE file|SKIP no secrets)\s*\Z'
    retries: 4
    retryDelaySeconds: 20

  - id: connect-secret-dir-used
    issue: "#5597"
    since: 4.5.1
    description: >-
      A MirrorSource connector whose aliases and SASL passwords are ${dir:} placeholders runs: its offset-syncs topic is
      named after the alias read from the dictionary secret, its remote topic after the alias read from the opaque
      secret, and a freshly produced record is mirrored (which needs the passwords from the secret to log in).
    exec:
      workload: "{release}-client"
      container: kafka
      shell: bash
      script: |
        A='{connect_alias_dict}'; O='{connect_alias_opaque}'
        if [ -z "$A" ]; then echo "SKIP no secrets"; exit 0; fi
        cd /opt/kafka/bin
        printf '%s\n' 'security.protocol=SASL_PLAINTEXT' 'sasl.mechanism=PLAIN' \
          'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="{admin_password}";' > /tmp/e2e.properties
        B={release}-cluster.{gvc}.cpln.local:9092
        T=$(./kafka-topics.sh --bootstrap-server $B --command-config /tmp/e2e.properties --list)
        echo "$T" | grep -qxF "mm2-offset-syncs.$A.internal" && echo "DICT-ALIAS-TOPIC"
        echo "$T" | grep -qxF "$O.e2e" && echo "OPAQUE-ALIAS-TOPIC"
        MSG="e2e-mirror-$(date +%s%N)"
        echo "$MSG" | ./kafka-console-producer.sh --bootstrap-server $B --producer.config /tmp/e2e.properties --topic e2e
        ./kafka-console-consumer.sh --bootstrap-server $B --consumer.config /tmp/e2e.properties --topic "$O.e2e" \
          --from-beginning --timeout-ms 60000 2>/dev/null | grep -qxF "$MSG" && echo "MIRRORED"
        true
    expect:
      stdout: '\A(DICT-ALIAS-TOPIC\nOPAQUE-ALIAS-TOPIC\nMIRRORED|SKIP no secrets)\s*\Z'
    retries: 8
    retryDelaySeconds: 30
    timeoutSeconds: 180

  - id: connect-secret-wrong-password-refused
    issue: "#5597"
    since: 4.5.1
    description: >-
      The control for the check above: the same connector reading a wrong password from the secret never creates its
      offset-syncs topic, while the one reading the right password has.
    exec:
      workload: "{release}-client"
      container: kafka
      shell: bash
      script: |
        A='{connect_alias_dict}'; BAD='{connect_alias_bad}'
        if [ -z "$A" ]; then echo "SKIP no secrets"; exit 0; fi
        cd /opt/kafka/bin
        printf '%s\n' 'security.protocol=SASL_PLAINTEXT' 'sasl.mechanism=PLAIN' \
          'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="{admin_password}";' > /tmp/e2e.properties
        T=$(./kafka-topics.sh --bootstrap-server {release}-cluster.{gvc}.cpln.local:9092 --command-config /tmp/e2e.properties --list)
        if ! echo "$T" | grep -qxF "mm2-offset-syncs.$A.internal"; then echo "WAITING for the working connector's topic"; exit 0; fi
        if echo "$T" | grep -qxF "mm2-offset-syncs.$BAD.internal"; then echo "BAD-TOPIC-PRESENT"; else echo "BAD-TOPIC-ABSENT"; fi
    expect:
      stdout: '\A(BAD-TOPIC-ABSENT|SKIP no secrets)\s*\Z'
    retries: 8
    retryDelaySeconds: 30

  - id: connect-secret-placeholders-rest
    issue: "#5597"
    since: 4.5.1
    description: >-
      The REST API returns the connector's config, its info and its task configs with the ${dir:} placeholders, never
      the values they resolve to.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      shell: bash
      script: |
        PW='{connect_rest_password}'; A='{connect_alias_dict}'; O='{connect_alias_opaque}'; ADM='{admin_password}'
        if [ -z "$A" ]; then echo "SKIP no secrets"; exit 0; fi
        H="Authorization: Basic $(printf 'e2e:%s' "$PW" | base64 | tr -d '\n')"
        out=""
        for p in config:connectors/e2e-mirror-dir/config 'info:connectors?expand=info' tasks:connectors/e2e-mirror-dir/tasks; do
          R=$(wget -qO- --header="$H" "http://127.0.0.1:8083/${p#*:}")
          ph=$(printf '%s' "$R" | grep -oF '${dir:/opt/kafka/secrets' | wc -l | tr -d ' ')
          leaks=$(( $(printf '%s' "$R" | grep -oF -- "$ADM" | wc -l) + $(printf '%s' "$R" | grep -oF -- "$A" | wc -l) + $(printf '%s' "$R" | grep -oF -- "$O" | wc -l) ))
          out="$out${p%%:*}=$ph/$leaks "
        done
        echo "$out"
    expect:
      stdout: '\A(config=[1-9][0-9]*/0 info=[1-9][0-9]*/0 tasks=[1-9][0-9]*/0 |SKIP no secrets)\s*\Z'
    retries: 6
    retryDelaySeconds: 30

  - id: connect-secret-placeholders-files
    issue: "#5597"
    since: 4.5.1
    description: >-
      The worker's setup script and properties (the chart's -init and -props secrets) hold placeholders only, and the
      worker config merges the user's providers with dir, limits dir to /opt/kafka/secrets and limits env so that
      CPLN_ variables never resolve.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      shell: bash
      script: |
        A='{connect_alias_dict}'; ADM='{admin_password}'
        if [ -z "$A" ]; then echo "SKIP no secrets"; exit 0; fi
        C=/opt/kafka/config
        F="/opt/kafka/init.sh $C/connect-distributed.properties $C/connect-distributed-updated.properties"
        echo "LEAKS $(cat $F | grep -oF -- "$ADM" | wc -l | tr -d ' ') PLACEHOLDERS $(cat $F | grep -oF '${dir:/opt/kafka/secrets' | wc -l | tr -d ' ')"
        echo "PROVIDERS $(grep -cxF 'config.providers=env,dir' $C/connect-distributed-updated.properties)" \
          "ALLOWED $(grep -cxF 'config.providers.dir.param.allowed.paths=/opt/kafka/secrets' $C/connect-distributed-updated.properties)" \
          "ALLOWLIST $(grep -cxF 'config.providers.env.param.allowlist.pattern=(?!CPLN_).*' $C/connect-distributed-updated.properties)"
    expect:
      stdout: '\A(LEAKS 0 PLACEHOLDERS [1-9][0-9]*\nPROVIDERS 1 ALLOWED 1 ALLOWLIST 1|SKIP no secrets)\s*\Z'

  - id: connect-secret-placeholders-topic
    issue: "#5597"
    since: 4.5.1
    description: The connector configs Kafka Connect stores in its config topic hold the placeholders, not the values.
    exec:
      workload: "{release}-client"
      container: kafka
      shell: bash
      script: |
        A='{connect_alias_dict}'; ADM='{admin_password}'
        if [ -z "$A" ]; then echo "SKIP no secrets"; exit 0; fi
        cd /opt/kafka/bin
        printf '%s\n' 'security.protocol=SASL_PLAINTEXT' 'sasl.mechanism=PLAIN' \
          'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="{admin_password}";' > /tmp/e2e.properties
        ./kafka-console-consumer.sh --bootstrap-server {release}-cluster.{gvc}.cpln.local:9092 --consumer.config /tmp/e2e.properties \
          --topic e2e-connect-configs --from-beginning --timeout-ms 30000 > /tmp/e2e-configs.txt 2>/dev/null || true
        echo "NAMED $(grep -cF 'e2e-mirror-dir' /tmp/e2e-configs.txt) PLACEHOLDERS $(grep -oF '${dir:/opt/kafka/secrets' /tmp/e2e-configs.txt | wc -l | tr -d ' ') LEAKS $(grep -oF -- "$ADM" /tmp/e2e-configs.txt | wc -l | tr -d ' ')"
        rm -f /tmp/e2e-configs.txt
    expect:
      stdout: '\A(NAMED [1-9][0-9]* PLACEHOLDERS [1-9][0-9]* LEAKS 0|SKIP no secrets)\s*\Z'
    retries: 4
    retryDelaySeconds: 30
    timeoutSeconds: 150

  - id: connect-secret-placeholders-ui
    issue: "#5597"
    since: 4.5.1
    description: The Kafka UI shows the connector's config with the placeholders, not the values.
    exec:
      workload: "{release}-kafbat-ui"
      container: kafbat-ui
      script: |
        A='{connect_alias_dict}'; ADM='{admin_password}'
        if [ -z "$A" ]; then echo "SKIP no secrets"; exit 0; fi
        R=$(wget -qO- http://127.0.0.1:8080/api/clusters/e2e/connects/e2e/connectors/e2e-mirror-dir/config)
        echo "PLACEHOLDERS $(printf '%s' "$R" | grep -oF '${dir:/opt/kafka/secrets' | wc -l | tr -d ' ') LEAKS $(printf '%s' "$R" | grep -oF -- "$ADM" | wc -l | tr -d ' ')"
    expect:
      stdout: '\A(PLACEHOLDERS [1-9][0-9]* LEAKS 0|SKIP no secrets)\s*\Z'
    retries: 6
    retryDelaySeconds: 30

  - id: connect-secret-missing-key
    issue: "#5597"
    since: 4.5.1
    description: >-
      A connector that reads a key its secret does not have is not created (Kafka would pass the placeholder text on
      as the value), while the connectors around it are.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      script: |
        PW='{connect_rest_password}'; A='{connect_alias_dict}'
        if [ -z "$A" ]; then echo "SKIP no secrets"; exit 0; fi
        H="Authorization: Basic $(printf 'e2e:%s' "$PW" | base64 | tr -d '\n')"
        code() { wget -q -S -O /dev/null --header="$H" "http://127.0.0.1:8083/connectors/$1" 2>&1 | sed -n 's/^ *HTTP\/[0-9.]* \([0-9][0-9]*\).*/\1/p' | tail -1; }
        # e2e-mirror-bad comes after e2e-mirror-missing in the plugin list, so it existing means the setup got past it.
        echo "dir=$(code e2e-mirror-dir) bad=$(code e2e-mirror-bad) missing=$(code e2e-mirror-missing)"
    expect:
      stdout: '\A(dir=200 bad=200 missing=404|SKIP no secrets)\s*\Z'
    retries: 8
    retryDelaySeconds: 30

  - id: connect-config-provider-limits
    issue: "#5597"
    since: 4.5.1
    description: >-
      The worker's env config provider never resolves a CPLN_ variable (the workload's Control Plane token is one) but
      still resolves other variables, and the dir provider resolves a mounted secret but not a file outside
      /opt/kafka/secrets. Probed through the REST API's config validation, which returns resolved values.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      shell: bash
      script: |
        PW='{connect_rest_password}'; ENVP='{connect_env_provider}'; OS='{connect_secret_opaque}'; AO='{connect_alias_opaque}'
        if [ -z "$ENVP" ]; then echo "SKIP no env provider"; exit 0; fi
        H=""; [ -n "$PW" ] && H="Authorization: Basic $(printf 'e2e:%s' "$PW" | base64 | tr -d '\n')"$'\r\n'
        BODY='{"connector.class":"org.apache.kafka.connect.mirror.MirrorSourceConnector","name":"e2e-validate","source.cluster.alias":"${'"$ENVP"':CPLN_GVC}","target.cluster.alias":"${'"$ENVP"':KAFKA_HEAP_OPTS}"'
        [ -n "$OS" ] && BODY="$BODY"',"topics":"${dir:/opt/kafka/config:connect-log4j.properties}","topics.exclude":"${dir:/opt/kafka/secrets:'"$OS"'}"'
        BODY="$BODY}"
        R=$( { printf 'PUT /connector-plugins/org.apache.kafka.connect.mirror.MirrorSourceConnector/config/validate HTTP/1.1\r\nHost: localhost\r\n%sContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n' "$H" "${#BODY}"; printf '%s' "$BODY"; } | nc 127.0.0.1 8083)
        val() { printf '%s' "$R" | grep -o "\"value\":{\"name\":\"$1\",\"value\":\"[^\"]*\"" | sed 's/.*,"value":"//; s/"$//'; }
        # Precondition: CPLN_GVC is set in this container, so a literal below means the allowlist refused it.
        [ -n "$CPLN_GVC" ] && pre=set || pre=unset
        v=$(val source.cluster.alias); [ "$v" = "\${$ENVP:CPLN_GVC}" ] && e1=literal || e1="not-literal"
        v=$(val target.cluster.alias); case "$v" in -Xms*) e2=resolved;; *) e2="not-resolved";; esac
        out="CPLN_GVC=$pre ENV_CPLN=$e1 ENV_OTHER=$e2"
        if [ -n "$OS" ]; then
          v=$(val topics); [ "$v" = '${dir:/opt/kafka/config:connect-log4j.properties}' ] && d1=literal || d1="not-literal"
          v=$(val topics.exclude); [ "$v" = "$AO" ] && d2=resolved || d2="not-resolved"
          out="$out DIR_OUTSIDE=$d1 DIR_SECRET=$d2"
        fi
        echo "$out"
    expect:
      stdout: '\A(CPLN_GVC=set ENV_CPLN=literal ENV_OTHER=resolved( DIR_OUTSIDE=literal DIR_SECRET=resolved)?|SKIP no env provider)\s*\Z'
    retries: 6
    retryDelaySeconds: 30

  - id: connect-automatic-providers-blocked
    issue: "#5597"
    since: 4.5.1
    description: >-
      A connector cannot declare config providers of its own for the clients it configures (here a MirrorSource
      source.admin.* EnvVarConfigProvider reading CPLN_GVC): the worker runs with
      org.apache.kafka.automatic.config.providers=none, so that connector fails with "is not allowed", while the
      same connector shape without its own provider runs.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      script: |
        PW='{connect_rest_password}'
        if [ -z '{connect_alias_dict}' ]; then echo "SKIP no secrets"; exit 0; fi
        H="Authorization: Basic $(printf 'e2e:%s' "$PW" | base64 | tr -d '\n')"
        st() { wget -qO- --header="$H" "http://127.0.0.1:8083/connectors/$1/status"; }
        C=$(st e2e-mirror-dir); A=$(st e2e-mirror-autoprov)
        printf '%s' "$C" | grep -q '"connector":{"state":"RUNNING"' && c=running || c=not-running
        printf '%s' "$A" | grep -q 'EnvVarConfigProvider is not allowed' && a=blocked || a=not-blocked
        echo "control=$c autoprov=$a"
    expect:
      stdout: '\A(control=running autoprov=blocked|SKIP no secrets)\s*\Z'
    retries: 8
    retryDelaySeconds: 30

  - id: connect-env-provider
    issue: "#5597"
    since: 4.5.1
    description: >-
      A worker that logs in to Kafka with ${env:} placeholders (the pattern from 4.4.0) still serves its connector list
      once env is limited with allowlist.pattern.
    exec:
      workload: "{release}-connect-e2e"
      container: kafka-connect
      script: |
        PW='{connect_rest_password}'
        if [ -z '{connect_env_provider}' ]; then echo "SKIP no env provider"; exit 0; fi
        if [ -n "$PW" ]; then set -- --header="Authorization: Basic $(printf 'e2e:%s' "$PW" | base64 | tr -d '\n')"; fi
        R=$(wget -qO- "$@" http://127.0.0.1:8083/connectors) && echo "LIST $R" | head -c 6
    expect:
      stdout: '\A(LIST \[|SKIP no env provider)\s*\Z'
    retries: 8
    retryDelaySeconds: 30
