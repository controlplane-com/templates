# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Keycloak

# Keycloak's own replicas cluster within one location (replica-direct names carry the location), and both
# bundled databases are single-location stateful workloads with no location handling. Neither bundled chart
# (postgres 3.3.0, postgres-highly-available 2.4.0) has a descriptor, so their keys are parent fields below.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: keycloak
    title: Keycloak
    description: The Keycloak image, its compute and cluster size, and the bootstrap admin login.
    sections:
      - title: Server
        fields:
          - path: image
            type: string
            format: image
            label: Keycloak image
            required: true
          - path: replicas
            type: integer
            label: Replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              2 or more form an Infinispan cluster through the shared database, for zero-downtime restarts. 1 runs
              without clustering.
          - path: resources.cpu
            type: quantity
            quantity: cpu
            label: Maximum CPU
            required: true
            description: Per replica.
          - path: resources.minCpu
            type: quantity
            quantity: cpu
            label: Minimum CPU
            required: true
          - path: resources.memory
            type: quantity
            quantity: memory
            label: Maximum memory
            required: true
            description: Per replica. The JVM heap is 70% of this limit; keep it at 1.5Gi or more.
          - path: resources.minMemory
            type: quantity
            quantity: memory
            label: Minimum memory
            required: true
        rules:
          - rule: >-
              cpuMillicores(self.resources.cpu) >= cpuMillicores(self.resources.minCpu) &&
              memoryBytes(self.resources.memory) >= memoryBytes(self.resources.minMemory)
            paths: [resources.minCpu, resources.minMemory]
            message: The minimum CPU and memory cannot exceed their maximum.
          # Keycloak is a stateful workload: the platform rejects a max:min ratio above 4:1.
          - rule: >-
              cpuMillicores(self.resources.cpu) <= 4 * cpuMillicores(self.resources.minCpu) &&
              memoryBytes(self.resources.memory) <= 4 * memoryBytes(self.resources.minMemory)
            paths: [resources.minCpu, resources.minMemory]
            message: The maximum CPU and memory can each be at most 4 times their minimum on a stateful workload.
      - title: Admin bootstrap
        fields:
          - type: note
            severity: warning
            text: >-
              The admin login is stored in the Helm release in plain text, and its login form is on the public
              endpoint when public access is on. Version 1.1.0 takes it from a secret you create instead.
          - path: admin.username
            type: string
            label: Admin username
            required: true
          - path: admin.password
            type: string
            label: Admin password
            required: true
            sensitive: true
            widget: password
            example: true
            description: Used as typed, so replace the published default.
            help: >-
              The temporary bootstrap admin, created on first boot only. Log in, create a permanent admin, then
              remove the bootstrap one.
        rules:
          - rule: >-
              oldSelf == null || (self.admin.username == oldSelf.admin.username &&
              self.admin.password == oldSelf.admin.password)
            severity: info
            paths: [admin.password]
            message: >-
              Keycloak creates the bootstrap admin on first boot only, so changing it here does not change any
              login. Change passwords in the Keycloak admin console.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Keycloak inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The login pages, OIDC/SAML endpoints and admin console on the canonical endpoint. Browser single
          sign-on needs it.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect. Only possible with 1 replica.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.replicas >= 1 && (self.replicas == 1 || self.internalAccess.type != 'none')
        mirrors: keycloak.validate
        paths: [internalAccess.type]
        message: >-
          With 2 or more replicas, choose who can connect other than None: the replicas reach each other on
          ports 7800 and 57800 to form the cluster.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: >-
          With "Specific workloads" and an empty list, no other workload inside Control Plane can connect.

  - id: database
    title: Database
    description: Which PostgreSQL runs Keycloak's data, and its login.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
          # Declared so the database choice is stored in the values; the chooser above writes them.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
      - id: credentials
        title: Database credentials
        description: >-
          The login of whichever PostgreSQL is chosen above. The chosen database creates its secret from these
          values (<release>-postgres-config for the highly available one, <release>-pg-config for the
          single-instance one), and Keycloak reads it. There is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.5.0 takes them from a secret
              you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: Used as typed, so replace the published default.
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.config.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgres.config.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: Used as typed, so replace the published default.
          - path: postgres.config.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
            pattern: '^[A-Za-z0-9_]+$'
            patternMessage: Use letters, digits and underscores only; the name is written into Keycloak's JDBC URL.
        rules:
          # The HA database (postgres-highly-available 2.4.0) writes the user and password unquoted into an
          # unquoted shell heredoc that becomes Patroni's YAML config, and the database name into an unquoted
          # CREATE DATABASE. Measured by running the rendered heredoc: $ and backticks are expanded by the shell,
          # " #", ": ", leading * @ % break or truncate the YAML, and yes/digits change type.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              (self.postgresHA.postgres.password.matches('^[A-Za-z][A-Za-z0-9_.+=/~!-]*$') &&
              !(self.postgresHA.postgres.password.lowerAscii() in ['yes', 'no', 'on', 'off', 'true', 'false', 'null', 'y', 'n']))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              Start with a letter and use only letters, digits and _ . + = / ~ ! -. The highly available database
              writes the password unquoted into a shell script and its YAML config, so other characters are
              changed or break the configuration.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              (self.postgresHA.postgres.username.matches('^[A-Za-z_][A-Za-z0-9_]*$') &&
              !(self.postgresHA.postgres.username.lowerAscii() in ['yes', 'no', 'on', 'off', 'true', 'false', 'null', 'y', 'n']))
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Use letters, digits and underscores, starting with a letter or underscore. The highly available
              database writes the user unquoted into its YAML config and a psql command.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database) ||
              self.postgresHA.postgres.database.matches('^[a-z_][a-z0-9_]*$')
            severity: warning
            paths: [postgresHA.postgres.database]
            message: >-
              Use lowercase letters, digits and underscores, starting with a letter or underscore. The highly
              available database creates it with an unquoted CREATE DATABASE, which folds the name to lowercase,
              while Keycloak's JDBC URL uses it as typed.
          - when: self.postgresHA.enabled
            rule: oldSelf == null || self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Keycloak loses its
              database connection after this upgrade.
          - when: self.postgres.enabled
            rule: oldSelf == null || self.postgres.config.password == oldSelf.postgres.config.password
            severity: info
            paths: [postgres.config.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Keycloak loses its
              database connection after this upgrade.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint that Keycloak connects through.
          Recommended for production.
        fields:
          - type: note
            severity: warning
            text: >-
              In this version the bundled etcd does not compact its history, so its storage can fill after a
              couple of months and force the database read-only
              ([etcd history compaction](/template-catalog/templates/postgres-highly-available#etcd-history-compaction)).
              Keycloak 1.0.1 fixes it; install 1.0.1 or later, or choose the single-instance PostgreSQL.
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: One PostgreSQL replica, for development and light use.
        fields:
          - path: postgres.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgres.volumeset.capacity >= oldSelf.postgres.volumeset.capacity
            paths: [postgres.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: single-backup
        title: Database backups
        toggle: postgres.backup.enabled
        when: self.postgres.enabled
        description: A scheduled logical dump of the single-instance PostgreSQL to object storage.
        fields:
          - path: postgres.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgres.backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
          - path: postgres.backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            description: Tag 18.x.x for the bundled PostgreSQL 18.
          - path: postgres.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'aws'
        fields:
          - path: postgres.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgres.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgres.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgres.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgres.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'gcp'
        fields:
          - path: postgres.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgres.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin
              role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgres.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
              The access and secret keys are stored in the Helm release in plain text. Version 1.2.0 takes them
              from a secret you create instead.
          - path: postgres.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgres.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgres.backup.minio.accessKey
            type: string
            label: Access key
            required: true
            example: true
          - path: postgres.backup.minio.secretKey
            type: string
            label: Secret key
            required: true
            sensitive: true
            widget: password
            example: true
          - path: postgres.backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin
              role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgresHA.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
              The access and secret keys are stored in the Helm release in plain text. Version 1.3.1 takes them
              from a secret you create instead.
          - path: postgresHA.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgresHA.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.minio.accessKey
            type: string
            label: Access key
            required: true
            example: true
          - path: postgresHA.backup.minio.secretKey
            type: string
            label: Secret key
            required: true
            sensitive: true
            widget: password
            example: true
          - path: postgresHA.backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
    rules:
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: keycloak.validate
        paths: [postgresHA.enabled, postgres.enabled]
        message: Enable exactly one database, either the highly available or the single-instance PostgreSQL.
      - rule: >-
          !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
          dyn(self.postgresHA)['proxy']['enabled'] == true
        mirrors: keycloak.validate
        paths: [postgresHA.enabled]
        message: postgresHA.proxy.enabled must stay true; the HAProxy leader endpoint is Keycloak's database endpoint.
