apiVersion: v2
name: keycloak
description: Keycloak identity and access management with clustered SSO, OIDC/SAML, backed by PostgreSQL
type: application
version: 1.4.0
appVersion: "26.6.3"

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.5.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled
  - name: postgres
    version: 3.4.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled

annotations:
  created: "2026-07-09"
  lastModified: "2026-08-23"
  category: "authentication"
  createsGvc: false
