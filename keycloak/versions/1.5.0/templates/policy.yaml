kind: policy
name: {{ include "keycloak.policy.name" . }}
description: Keycloak policy
tags: {{- include "keycloak.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "keycloak.identity.name" . }}
targetKind: secret
targetLinks:
  # Prerequisite secrets the user creates (admin login, database credentials) are
  # granted by name, nothing broader; the startup script is chart-created.
  - //secret/{{ .Values.admin.secretName }}
  - //secret/{{ include "keycloak.secretStartup.name" . }}
  - //secret/{{ include "keycloak.db.secretName" . }}
