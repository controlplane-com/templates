apiVersion: v2
name: langflow
description: Langflow visual builder for AI agents and flows, with PostgreSQL
type: application
version: 1.0.0
appVersion: "1.13.1"

annotations:
  created: "2026-11-06"
  lastModified: "2026-11-06"
  createsGvc: false

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres
    version: 3.4.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.8.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled
  - name: redis
    version: 3.9.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: redis.enabled
