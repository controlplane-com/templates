# ─── Langflow ─────────────────────────────────────────────────────────────────
langflow:
  # Official image. To add custom components, build FROM this image and set your own here.
  image: langflowai/langflow:1.13.1
  # Interchangeable replicas sharing PostgreSQL, the data volume and Redis; above 1 requires redis.enabled: true.
  # set langflow.replicas: 2, redis.enabled: true and postgresHA.enabled: true for near-zero-downtime upgrades and failover
  replicas: 1                   # 1-4
  resources:
    minCpu: 500m
    maxCpu: 2000m
    minMemory: 1Gi
    maxMemory: 3Gi
  requestTimeoutSeconds: 600    # longest request on the public URL (flow runs, editor build streams) before it is cut (1-3600)
  volumeset:
    capacity: 10                # GiB (minimum 10): uploaded files, knowledge bases and the secret-key file, shared by all replicas
  # Plain (non-secret) Langflow settings, e.g. LANGFLOW_SSRF_ALLOWED_HOSTS, LANGFLOW_NEW_USER_IS_ACTIVE, DO_NOT_TRACK.
  extraEnv: []
  # extraEnv:
  #   - name: LANGFLOW_NEW_USER_IS_ACTIVE
  #     value: "true"

# ─── Admin login and encryption key (REQUIRED prerequisite secrets) ──────────
admin:
  # REQUIRED PREREQUISITE SECRET — CREATE IT BEFORE YOU INSTALL, or the deployment WEDGES silently.
  # A `dictionary` secret with keys `username` and `password`: the superuser created on first start.
  # Later starts keep the existing password; change it in the Langflow UI.
  secretName: my-langflow-admin
secretKey:
  # REQUIRED PREREQUISITE SECRET — an `opaque` secret (encoding: plain) holding a 44-character Fernet key.
  # Encrypts every stored API key and signs logins. Never rotate or delete it. See README Prerequisites.
  secretName: my-langflow-secret-key

# ─── Provider keys as global variables (optional prerequisite) ───────────────
# A `dictionary` secret you create; every key listed in `keys` becomes an env var AND a Langflow
# global variable of the same name (model provider API keys, vector store tokens). "" = none.
variableSecrets:
  secretName: ""                # e.g. my-langflow-provider-keys
  keys: []                      # e.g. [OPENAI_API_KEY, ANTHROPIC_API_KEY]

# ─── Access ───────────────────────────────────────────────────────────────────
publicAccess:
  enabled: true                 # public *.cpln.app URL; login required (the admin secret above)
internalAccess:
  type: same-gvc                # none | same-gvc | same-org | workload-list
  workloads: []                 # used only with workload-list
  # workloads:
  #   - //gvc/GVC_NAME/workload/WORKLOAD_NAME

# ─── Database: single PostgreSQL (default) ───────────────────────────────────
# Every knob of the `postgres` template is available under this key. Enable exactly one of postgres / postgresHA.
postgres:
  enabled: true
  image: postgres:18
  config:
    # REQUIRED PREREQUISITE SECRET — CREATE IT BEFORE YOU INSTALL, or the deployment WEDGES silently.
    # A `dictionary` secret with exactly username, password and database, all URL-safe
    # (letters, digits, - _ . ~): Langflow receives them inside a connection URL.
    credentialsSecretName: my-langflow-db-credentials
  resources:
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10                # GiB (minimum 10)
  backup: # pass-through to the postgres template's backup feature (Postgres 17+)
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0
    schedule: "0 2 * * *"       # daily at 2am UTC
    resources:
      cpu: 100m
      memory: 128Mi
    provider: aws               # aws, gcp or minio
    aws:
      bucket: my-langflow-backup-bucket
      region: us-east-1
      cloudAccountName: my-langflow-backup-cloudaccount
      policyName: my-langflow-backup-policy
      prefix: postgres/backups
    gcp:
      bucket: my-langflow-backup-bucket
      cloudAccountName: my-langflow-backup-cloudaccount
      prefix: postgres/backups
    minio:                      # any S3-compatible endpoint, e.g. an internal MinIO template deployment
      endpoint: http://my-minio-workload:9000
      bucket: my-langflow-backup-bucket
      # REQUIRED prerequisite dictionary secret holding `accessKey` and `secretKey`,
      # only when backup is enabled with provider: minio (see the postgres template docs).
      credentialsSecretName: my-langflow-minio-credentials
      prefix: postgres/backups

# ─── Database: highly available PostgreSQL ───────────────────────────────────
# 3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint; every knob of the
# `postgres-highly-available` template is available under this key.
postgresHA:
  enabled: false
  config:
    # REQUIRED PREREQUISITE SECRET when enabled — same keys and URL-safe rule as postgres.config above.
    credentialsSecretName: my-langflow-db-credentials
  replicas: 3
  resources:                    # per Patroni replica
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 2Gi
  volumeset:
    capacity: 10                # GiB per replica (minimum 10)
  backup: # pass-through to the postgres-highly-available template's backup feature
    enabled: false
    mode: logical               # logical or wal-g
    resources:
      cpu: 100m
      memory: 512Mi             # 128Mi OOM-kills wal-g mid-backup
    logical:
      image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
      schedule: "0 2 * * *"     # daily at 2am UTC
    walg:
      intervalSeconds: 21600    # every 6 hours
    provider: aws               # aws, gcp or minio
    aws:
      bucket: my-langflow-backup-bucket
      region: us-east-1
      cloudAccountName: my-langflow-backup-cloudaccount
      policyName: my-langflow-backup-policy
      prefix: postgres/backups
    gcp:
      bucket: my-langflow-backup-bucket
      cloudAccountName: my-langflow-backup-cloudaccount
      prefix: postgres/backups
    minio:                      # any S3-compatible endpoint, e.g. an internal MinIO template deployment
      endpoint: http://my-minio-workload:9000
      bucket: my-langflow-backup-bucket
      # REQUIRED prerequisite dictionary secret holding `accessKey` and `secretKey`,
      # only when backup is enabled with provider: minio (see the postgres-highly-available docs).
      credentialsSecretName: my-langflow-minio-credentials
      prefix: postgres/backups

# ─── Redis (shared build-job queue; required when langflow.replicas > 1) ─────
# One Redis node: Langflow connects to a single Redis URL and cannot use Sentinel.
redis:
  enabled: false
  mode: dev                     # required — the chart refuses production (Sentinel) mode
  redis:
    image: redis:8
    resources:
      maxCpu: 200m
      maxMemory: 256Mi
      minCpu: 80m
      minMemory: 128Mi
    auth:
      # Off by default (the same-GVC firewall is the boundary). To require AUTH, create a `dictionary`
      # secret with a URL-safe key `password` BEFORE install, then enable it here.
      fromSecret:
        enabled: false
        name: ""                # e.g. my-langflow-redis
        passwordKey: password
