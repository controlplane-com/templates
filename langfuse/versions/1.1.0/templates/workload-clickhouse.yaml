---
kind: workload
name: {{ include "langfuse.clickhouse.name" . }}
description: ClickHouse analytics database
tags: {{- include "langfuse.tags" . | nindent 2 }}
gvc: {{ .Values.global.cpln.gvc }}
spec:
  type: stateful
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "langfuse.identity.name" . }}
  containers:
    - name: clickhouse
      image: {{ .Values.clickhouse.image }}
      inheritEnv: false
      minCpu: {{ .Values.clickhouse.resources.minCpu | quote }}
      cpu: {{ .Values.clickhouse.resources.maxCpu | quote }}
      minMemory: {{ .Values.clickhouse.resources.minMemory | quote }}
      memory: {{ .Values.clickhouse.resources.maxMemory | quote }}
      command: "/bin/bash"
      args:
        - "/scripts/startup.sh"
      env:
        - name: CLICKHOUSE_PASSWORD
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.clickhousePassword
        - name: CLICKHOUSE_DATABASE
          value: {{ .Values.clickhouse.config.database | quote }}
        {{- if eq .Values.objectStore.provider "gcp" }}
        # Read by storage.xml via ClickHouse's `from_env` substitution, so the
        # HMAC pair never appears in a rendered config file or in Helm values.
        - name: GCS_ACCESS_KEY_ID
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.accessKeyId
        - name: GCS_SECRET_ACCESS_KEY
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.secretAccessKey
        {{- end }}
      ports:
        - number: 8123
          protocol: http
        - number: 9000
          protocol: tcp
      readinessProbe:
        httpGet:
          path: /ping
          port: 8123
          scheme: HTTP
        failureThreshold: 10
        initialDelaySeconds: 20
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 3
      volumes:
        - path: /var/lib/clickhouse
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "langfuse.clickhouse.volumeset.name" . }}
        - path: /var/lib/clickhouse_cache
          recoveryPolicy: retain
          uri: scratch://cache-vol
        - path: /var/lib/clickhouse-tmp
          recoveryPolicy: retain
          uri: scratch://tmp-vol
        - path: /scripts/startup.sh
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "langfuse.clickhouse.startup.secret.name" . }}
        - path: /etc/clickhouse-server/config.d/storage.xml
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "langfuse.clickhouse.storage.secret.name" . }}
  defaultOptions:
    autoscaling:
      metric: disabled
      minScale: 1
      maxScale: 1
      maxConcurrency: 0
      target: 100
      scaleToZeroDelay: 300
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  rolloutOptions:
    {{- /*
    maxUnavailableReplicas is deliberately NOT set: the API drops it on a
    stateful workload, so sending it produces permanent drift AND implies a
    rolling-restart limit that is not in force.
    terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  firewallConfig:
    {{- /* Every field is declared: the API backfills the empty lists, so
    omitting them makes a default install drift from the moment it is created. */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      # Egress is open because ClickHouse writes its data parts straight to the
      # object store (S3 / GCS) rather than to the volumeset.
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: same-gvc
      inboundAllowWorkload: []
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
