---
kind: workload
name: {{ include "langfuse.web.name" . }}
description: Langfuse web server
tags: {{- include "langfuse.tags" . | nindent 2 }}
gvc: {{ .Values.global.cpln.gvc }}
spec:
  type: stateful
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "langfuse.identity.name" . }}
  containers:
    - name: langfuse-web
      image: {{ .Values.langfuse.web.image }}
      inheritEnv: false
      minCpu: {{ .Values.langfuse.web.resources.minCpu | quote }}
      cpu: {{ .Values.langfuse.web.resources.maxCpu | quote }}
      minMemory: {{ .Values.langfuse.web.resources.minMemory | quote }}
      memory: {{ .Values.langfuse.web.resources.maxMemory | quote }}
      env:
        # Postgres
        - name: POSTGRES_USER
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.postgresUsername
        - name: POSTGRES_PASSWORD
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.postgresPassword
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ printf "%s-postgres" .Release.Name }}.{{ .Values.global.cpln.gvc }}.cpln.local:5432/{{ .Values.postgres.config.database }}
        # ClickHouse
        - name: CLICKHOUSE_PASSWORD
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.clickhousePassword
        - name: CLICKHOUSE_URL
          value: http://{{ include "langfuse.clickhouse.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:8123
        - name: CLICKHOUSE_MIGRATION_URL
          value: clickhouse://default:$(CLICKHOUSE_PASSWORD)@{{ include "langfuse.clickhouse.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9000/{{ .Values.clickhouse.config.database }}
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        # Redis
        - name: REDIS_HOST
          value: {{ include "langfuse.redis.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_AUTH
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.redisPassword
        # Auth
        # NEXTAUTH_URL must be the origin the BROWSER uses: NextAuth builds the
        # form actions of its own server-rendered pages from it, and only sets
        # the session cookie's Secure flag when it is https. The canonical
        # hostname shape is not stable and the org alias is not injected on its
        # own, so it is derived at runtime from this workload's own
        # CPLN_GLOBAL_ENDPOINT (already a full URL — never prepend a scheme)
        # rather than assembled here.
        {{- if .Values.langfuse.publicUrl }}
        - name: NEXTAUTH_URL
          value: {{ .Values.langfuse.publicUrl | quote }}
        {{- else if .Values.publicAccess.enabled }}
        - name: NEXTAUTH_URL
          value: "$(CPLN_GLOBAL_ENDPOINT)"
        {{- else }}
        - name: NEXTAUTH_URL
          value: http://{{ include "langfuse.web.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:3000
        {{- end }}
        - name: AUTH_TRUST_HOST
          value: "true"
        # Signing and encryption keys come from the prerequisite secret, so they
        # never pass through Helm values or land in the release.
        - name: NEXTAUTH_SECRET
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.nextAuthSecret
        - name: ENCRYPTION_KEY
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.encryptionKey
        - name: SALT
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.salt
        # Sign-up control. AUTH_DISABLE_SIGNUP blocks BOTH email/password and
        # first-time SSO user creation, with no first-user exemption — which is
        # why the owner below is provisioned headlessly instead.
        - name: AUTH_DISABLE_SIGNUP
          value: {{ .Values.langfuse.auth.disableSignup | quote }}
        - name: NEXT_PUBLIC_SIGN_UP_DISABLED
          value: {{ .Values.langfuse.auth.disableSignup | quote }}
        # Headless initialization: creates the organization and an OWNER user on
        # every boot (idempotent — existing rows are left alone) and bypasses the
        # sign-up block, so a closed instance still has a way in.
        - name: LANGFUSE_INIT_ORG_ID
          value: default
        - name: LANGFUSE_INIT_ORG_NAME
          value: {{ .Values.langfuse.auth.organizationName | quote }}
        - name: LANGFUSE_INIT_USER_EMAIL
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.adminEmail
        - name: LANGFUSE_INIT_USER_PASSWORD
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.adminPassword
        # Object store (AWS)
        {{- if eq .Values.objectStore.provider "aws" }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: {{ .Values.objectStore.aws.bucket | quote }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: {{ .Values.objectStore.aws.region | quote }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: {{ .Values.objectStore.aws.bucket | quote }}
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: {{ .Values.objectStore.aws.region | quote }}
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        {{- end }}
        # Object store (GCP)
        {{- if eq .Values.objectStore.provider "gcp" }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: {{ .Values.objectStore.gcp.bucket | quote }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
          value: "https://storage.googleapis.com"
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.accessKeyId
        - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.secretAccessKey
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: {{ .Values.objectStore.gcp.bucket | quote }}
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
          value: "https://storage.googleapis.com"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.accessKeyId
        - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.secretAccessKey
        {{- end }}
      ports:
        - number: 3000
          protocol: http
      readinessProbe:
        httpGet:
          path: /api/public/health
          port: 3000
          scheme: HTTP
        failureThreshold: 10
        initialDelaySeconds: 30
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 5
  defaultOptions:
    autoscaling:
      metric: cpu
      target: 70
      minScale: {{ .Values.langfuse.web.minReplicas }}
      maxScale: {{ .Values.langfuse.web.maxReplicas }}
      maxConcurrency: 0
      scaleToZeroDelay: 300
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 30
  rolloutOptions:
    {{- /*
    maxUnavailableReplicas is deliberately NOT set: the API drops it on a
    stateful workload, so sending it produces permanent drift AND implies a
    rolling-restart limit that is not in force.
    terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  firewallConfig:
    {{- /* Every field is declared: the API backfills the empty lists, so
    omitting them makes a default install drift from the moment it is created. */}}
    external:
      {{- if .Values.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if and .Values.internalAccess.workloads (has .Values.internalAccess.type (list "same-gvc" "workload-list")) }}
      inboundAllowWorkload:
        {{- range .Values.internalAccess.workloads }}
        - {{ . }}
        {{- end }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
