---
{{/*
Bundled-datastore plumbing only. Every credential here serves Langfuse's own
Postgres, Redis and ClickHouse, is unreachable from outside the GVC, and is
never typed by a human. The signing/encryption keys and the admin login live in
the prerequisite secret named by langfuse.auth.secretName instead.
*/}}
kind: secret
name: {{ include "langfuse.secret.name" . }}
description: Langfuse datastore credentials
tags: {{- include "langfuse.tags" . | nindent 4 }}
type: dictionary
data:
  postgresUsername: {{ .Values.postgres.credentials.username | quote }}
  postgresPassword: {{ .Values.postgres.credentials.password | quote }}
  redisPassword: {{ .Values.redis.auth.password | quote }}
  clickhousePassword: {{ .Values.clickhouse.config.password | quote }}
