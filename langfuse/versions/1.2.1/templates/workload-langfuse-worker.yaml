---
kind: workload
name: {{ include "langfuse.worker.name" . }}
description: Langfuse background worker
tags: {{- include "langfuse.tags" . | nindent 2 }}
gvc: {{ .Values.global.cpln.gvc }}
spec:
  type: stateful
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "langfuse.identity.name" . }}
  containers:
    - name: langfuse-worker
      image: {{ .Values.langfuse.worker.image }}
      inheritEnv: false
      minCpu: {{ .Values.langfuse.worker.resources.minCpu | quote }}
      cpu: {{ .Values.langfuse.worker.resources.maxCpu | quote }}
      minMemory: {{ .Values.langfuse.worker.resources.minMemory | quote }}
      memory: {{ .Values.langfuse.worker.resources.maxMemory | quote }}
      env:
        # Postgres
        - name: POSTGRES_USER
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.postgresUsername
        - name: POSTGRES_PASSWORD
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.postgresPassword
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ printf "%s-postgres" .Release.Name }}.{{ .Values.global.cpln.gvc }}.cpln.local:5432/{{ .Values.postgres.credentials.database }}
        # ClickHouse
        - name: CLICKHOUSE_PASSWORD
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.clickhousePassword
        - name: CLICKHOUSE_URL
          value: http://{{ include "langfuse.clickhouse.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:8123
        - name: CLICKHOUSE_MIGRATION_URL
          value: clickhouse://default:$(CLICKHOUSE_PASSWORD)@{{ include "langfuse.clickhouse.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9000/{{ .Values.clickhouse.config.database }}
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        # Redis
        - name: REDIS_HOST
          value: {{ include "langfuse.redis.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_AUTH
          value: cpln://secret/{{ include "langfuse.secret.name" . }}.redisPassword
        # Auth
        - name: AUTH_TRUST_HOST
          value: "true"
        # Same prerequisite secret as the web tier: the worker decrypts the same
        # stored provider keys and hashes the same API keys.
        - name: NEXTAUTH_SECRET
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.nextAuthSecret
        - name: ENCRYPTION_KEY
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.encryptionKey
        - name: SALT
          value: cpln://secret/{{ .Values.langfuse.auth.secretName }}.salt
        # Object store (AWS)
        {{- if eq .Values.objectStore.provider "aws" }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: {{ .Values.objectStore.aws.bucket | quote }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: {{ .Values.objectStore.aws.region | quote }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: {{ .Values.objectStore.aws.bucket | quote }}
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: {{ .Values.objectStore.aws.region | quote }}
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        {{- end }}
        # Object store (GCP)
        {{- if eq .Values.objectStore.provider "gcp" }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: {{ .Values.objectStore.gcp.bucket | quote }}
        - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
          value: "https://storage.googleapis.com"
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.accessKeyId
        - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.secretAccessKey
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: {{ .Values.objectStore.gcp.bucket | quote }}
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
          value: "https://storage.googleapis.com"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.accessKeyId
        - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
          value: cpln://secret/{{ .Values.objectStore.gcp.credentialsSecretName }}.secretAccessKey
        {{- end }}
  defaultOptions:
    autoscaling:
      metric: disabled
      minScale: {{ .Values.langfuse.worker.replicas }}
      maxScale: {{ .Values.langfuse.worker.replicas }}
      maxConcurrency: 0
      target: 100
      scaleToZeroDelay: 300
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 30
  rolloutOptions:
    {{- /*
    maxUnavailableReplicas is deliberately NOT set: the API drops it on a
    stateful workload, so sending it produces permanent drift AND implies a
    rolling-restart limit that is not in force.
    terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  firewallConfig:
    {{- /* Every field is declared: the API backfills the empty lists, so
    omitting them makes a default install drift from the moment it is created. */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: same-gvc
      inboundAllowWorkload: []
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
