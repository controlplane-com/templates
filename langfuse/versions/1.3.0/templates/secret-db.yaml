---
{{- /*
  Credentials for the BUNDLED database, in the shape the postgres subchart reads:
  exactly the keys username, password and database. Internal plumbing — no human
  ever types this password — so the bundled-plumbing exception applies and it
  stays a template-created secret rather than a prerequisite the user creates.
  postgres 3.4.0 stopped creating this secret and now only takes its NAME, which
  is why the chart on this side of the dependency owns it.

  SEPARATE from {release}-langfuse-config on purpose. The subchart's policy grants
  its identity `reveal` on the WHOLE secret it is handed; the app's own config
  secret also carries redisPassword and clickhousePassword, so handing that one
  over would give the Postgres identity both. The two DB values are therefore
  rendered into both secrets, read by different identities.
*/}}
kind: secret
name: {{ include "langfuse.secret.db.name" . }}
description: Langfuse bundled PostgreSQL credentials
tags: {{- include "langfuse.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
