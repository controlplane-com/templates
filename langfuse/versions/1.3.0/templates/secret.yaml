{{/*
Bundled-datastore plumbing only: the Redis and ClickHouse passwords. Both serve
Langfuse's own datastores, are unreachable from outside the GVC, and are never
typed by a human. The PostgreSQL credentials are NOT here: since 1.3.0 they live
in the prerequisite secret named by postgres.config.credentialsSecretName, which
the bundled postgres and both Langfuse workloads read. The signing/encryption
keys and the admin login live in the prerequisite secret named by
langfuse.auth.secretName.
*/}}
kind: secret
name: {{ include "langfuse.secret.name" . }}
description: Langfuse datastore credentials
tags: {{- include "langfuse.tags" . | nindent 4 }}
type: dictionary
data:
  redisPassword: {{ .Values.redis.auth.password | quote }}
  clickhousePassword: {{ .Values.clickhouse.config.password | quote }}
