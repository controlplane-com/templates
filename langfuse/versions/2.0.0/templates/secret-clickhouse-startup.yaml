---
kind: secret
name: {{ include "langfuse.clickhouse.startup.secret.name" . }}
description: ClickHouse server startup script
tags: {{- include "langfuse.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    CONFIG_DIR="/etc/clickhouse-server"
    LOG_DIR="/var/log/clickhouse-server"
    DATA_DIR="/var/lib/clickhouse"

    mkdir -p "$CONFIG_DIR" "$LOG_DIR" "$DATA_DIR"

    cat > "$CONFIG_DIR/config.xml" <<EOF
    <clickhouse>

        <users_config>/etc/clickhouse-server/users.xml</users_config>

        <!-- Console only (no log files on the volume set): everything, including
             a config error that stops the server, reaches `cpln logs`. -->
        <logger>
            <level>information</level>
            <console>1</console>
        </logger>

        <tmp_path>/var/lib/clickhouse-tmp</tmp_path>
        <max_temporary_data_on_disk_size>21474836480</max_temporary_data_on_disk_size>

        <!-- Filesystem caches of the object-store disk (config.d/storage.xml) live
             on the scratch volume. A cache disk's relative <path> resolves here. -->
        <filesystem_caches_path>/var/lib/clickhouse_cache/</filesystem_caches_path>

        <!-- Langfuse 4 reads system.query_log to track and recover its long
             queries (the historic backfill fails without it) and to find callers
             of deprecated APIs. Kept on the local volume set, for 7 days. -->
        <query_log>
            <database>system</database>
            <table>query_log</table>
            <storage_policy>default</storage_policy>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
        </query_log>

        <tcp_port>9000</tcp_port>
        <http_port>8123</http_port>

        <listen_host>0.0.0.0</listen_host>
        <listen_host>::</listen_host>

        <display_name>langfuse-clickhouse</display_name>

    </clickhouse>
    EOF

    cat > "$CONFIG_DIR/users.xml" <<EOF
    <clickhouse>
        <users>
            <${CLICKHOUSE_USER}>
                <password from_env="CLICKHOUSE_PASSWORD"/>
                <profile>default</profile>
                <quota>default</quota>
            </${CLICKHOUSE_USER}>
        </users>

        <profiles>
            <default>
                <max_memory_usage>10000000000</max_memory_usage>
                <use_uncompressed_cache>0</use_uncompressed_cache>
                <load_balancing>in_order</load_balancing>
                <log_queries>1</log_queries>
            </default>
        </profiles>
    </clickhouse>
    EOF

    {{- if eq .Values.objectStore.provider "aws" }}
    mkdir -p /var/lib/clickhouse/disks/s3_disk_metadata
    mkdir -p /var/lib/clickhouse_cache/s3
    echo "1" > /var/lib/clickhouse/disks/s3_disk_metadata/format_version.txt
    {{- end }}

    clickhouse-server --config-file="$CONFIG_DIR/config.xml" &
    CH_PID=$!
    trap 'kill -TERM $CH_PID; wait $CH_PID' TERM INT

    echo "Waiting for ClickHouse to accept connections..."
    until clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1" &>/dev/null; do
        if ! kill -0 "$CH_PID" 2>/dev/null; then
            rc=0; wait "$CH_PID" || rc=$?
            echo "FATAL: clickhouse-server exited with code $rc before accepting connections; its error is logged above." >&2
            exit 1
        fi
        sleep 1
    done
    echo "ClickHouse is accepting connections."

    rc=0; wait "$CH_PID" || rc=$?
    echo "clickhouse-server exited with code $rc." >&2
    exit "$rc"
