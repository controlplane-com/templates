apiVersion: v2
name: librechat
description: LibreChat multi-provider AI chat with search and optional chat over your files
type: application
version: 1.0.0
appVersion: "0.8.8"

annotations:
  created: "2026-11-09"
  lastModified: "2026-11-11"
  createsGvc: false

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: mongodb
    version: 1.4.2
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: meilisearch
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: search.enabled
  - name: pgvector
    version: 1.0.2
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: rag.enabled
  - name: redis
    version: 3.9.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: redis.enabled
