# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: listmonk

# listmonk is a single stateful replica, and both bundled databases are single-location stateful workloads
# with no location handling. Neither bundled chart (postgres 3.3.0, postgres-highly-available 2.4.1) has a
# descriptor in this repo, so their keys are parent fields below.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: listmonk
    title: listmonk
    description: The listmonk image, its compute and media storage, and the Super Admin login.
    sections:
      - title: Server
        fields:
          - path: image
            type: string
            format: image
            label: listmonk image
            required: true
          - path: resources.cpu
            type: quantity
            quantity: cpu
            label: Maximum CPU
            required: true
            min: 25m
            description: listmonk is a single Go binary with a light footprint.
          - path: resources.minCpu
            type: quantity
            quantity: cpu
            label: Minimum CPU
            required: true
            min: 25m
          - path: resources.memory
            type: quantity
            quantity: memory
            label: Maximum memory
            required: true
            min: 32Mi
          - path: resources.minMemory
            type: quantity
            quantity: memory
            label: Minimum memory
            required: true
            min: 32Mi
          - path: volumeset.capacity
            type: integer
            label: Media storage capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100]
            description: Images uploaded on the Media page, kept at /listmonk/uploads.
            help: Uninstalling the release deletes the volume set, so uploaded media does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
          - path: timezone
            type: string
            label: Time zone
            required: true
            placeholder: Etc/UTC
            description: The container's time zone, which campaign scheduling times follow.
          - type: note
            severity: warning
            text: >-
              This version leaves listmonk's Root URL at the installer's `http://localhost:9000`, so subscription,
              unsubscribe and tracking links and the links in sent email point there until you set the Root URL in
              Settings, General after install. Version 1.5.0 sets it at startup.
        rules:
          - rule: >-
              cpuMillicores(self.resources.cpu) >= cpuMillicores(self.resources.minCpu) &&
              memoryBytes(self.resources.memory) >= memoryBytes(self.resources.minMemory)
            paths: [resources.minCpu, resources.minMemory]
            message: The minimum CPU and memory cannot exceed their maximum.
          # listmonk is a stateful workload: the platform rejects a max:min ratio above 4:1.
          - rule: >-
              cpuMillicores(self.resources.cpu) <= 4 * cpuMillicores(self.resources.minCpu) &&
              memoryBytes(self.resources.memory) <= 4 * memoryBytes(self.resources.minMemory)
            paths: [resources.minCpu, resources.minMemory]
            message: The maximum CPU and memory can each be at most 4 times their minimum on a stateful workload.
          # Platform limits (nodelibs schema workload.ts): max - min at most 4000 millicores and 4096 MiB on a
          # stateful workload, and at most 8 MiB of memory per millicore of CPU on any workload.
          - rule: >-
              cpuMillicores(self.resources.cpu) - cpuMillicores(self.resources.minCpu) <= 4000 &&
              memoryBytes(self.resources.memory) - memoryBytes(self.resources.minMemory) <= 4096 * 1048576
            paths: [resources.minCpu, resources.minMemory]
            message: >-
              The maximum can be at most 4000m CPU and 4096Mi memory above its minimum on a stateful workload.
          - rule: memoryBytes(self.resources.memory) <= 8 * 1048576 * cpuMillicores(self.resources.cpu)
            paths: [resources.memory]
            message: The maximum memory can be at most 8Mi per millicore of maximum CPU (for example 4Gi needs 512m).
          - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - title: Super Admin
        fields:
          - type: note
            severity: warning
            text: >-
              The Super Admin login is stored in the Helm release in plain text, and its login form is on the
              public endpoint when public access is on. Version 1.1.0 takes it from a secret you create instead.
          - path: admin.username
            type: string
            label: Super Admin username
            required: true
            description: At least 3 characters.
          - path: admin.password
            type: string
            label: Super Admin password
            required: true
            sensitive: true
            widget: password
            example: true
            description: At least 8 characters. Used as typed, so replace the published default.
            help: >-
              Used on the first install only: the account then lives in the database, so change the password in
              Admin, Users.
        rules:
          - rule: size(self.admin.username) >= 3
            mirrors: listmonk.validate
            paths: [admin.username]
            message: The username must be at least 3 characters.
          - rule: size(self.admin.password) >= 8
            mirrors: listmonk.validate
            paths: [admin.password]
            message: The password must be at least 8 characters.
          - rule: >-
              oldSelf == null || (self.admin.username == oldSelf.admin.username &&
              self.admin.password == oldSelf.admin.password)
            severity: info
            paths: [admin.password]
            message: >-
              listmonk creates the Super Admin on the first install only, so changing it here does not change any
              login. Change passwords in Admin, Users.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach listmonk inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The admin UI and the subscriber-facing pages on the canonical endpoint. Subscription forms,
          unsubscribe links and tracking pixels must be reachable from the internet.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.publicAccess.enabled
        severity: warning
        paths: [publicAccess.enabled]
        message: >-
          Without public access, subscription forms, unsubscribe links and tracking pixels cannot be reached by
          subscribers.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: database
    title: Database
    description: Which PostgreSQL holds listmonk's data, its login, server, storage and backups.
    docs: "#configuration"
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgresHA.enabled && !self.postgres.enabled ? 'ha' : 'single'"
            options:
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica on a persistent volume; the default.
                set: { postgresHA.enabled: false, postgres.enabled: true }
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
          # Declared so the database choice is stored in the values; the chooser above writes them.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
      - id: credentials
        title: Database credentials
        description: >-
          The login of whichever PostgreSQL is chosen above. The chosen database creates its secret from these
          values (<release>-postgres-config for the highly available one, <release>-pg-config for the
          single-instance one), and listmonk reads it. There is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.6.0 takes them from a secret
              you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: Used as typed, so replace the published default.
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.config.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgres.config.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: Used as typed, so replace the published default.
          - path: postgres.config.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
        rules:
          # listmonk writes the database name into a single-quoted YAML string (LISTMONK_db__database), and the
          # single-instance PostgreSQL's readiness probe runs pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          # through sh -c without quotes.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.database == oldSelf.postgres.config.database) ||
              !self.postgres.config.database.matches("[\\s']")
            severity: warning
            paths: [postgres.config.database]
            message: >-
              Leave out spaces and single quotes: listmonk writes the name into a single-quoted string, and the
              database's readiness probe passes it to pg_isready unquoted.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.username == oldSelf.postgres.config.username) ||
              !self.postgres.config.username.matches('\\s')
            severity: warning
            paths: [postgres.config.username]
            message: >-
              Leave out spaces: the database's readiness probe passes the user name to pg_isready unquoted, so
              it never becomes ready.
          # The HA database (postgres-highly-available 2.4.1) writes the user and password unquoted into an
          # unquoted shell heredoc that becomes Patroni's YAML config (loaded as YAML 1.1), and the user and
          # database name into an unquoted psql command and CREATE DATABASE (templates/secret-startup.yaml).
          # Reproduced by running the heredoc with sh and loading the result with PyYAML: $ and ` are expanded,
          # a \ before $ ` \ or at the end is consumed, YAML indicators at the start, ': ', ' #' and a lone
          # - ~ = break or alter the value, and numbers, dates, 1:30 and yes/no/on/off change type. Quotes, :
          # and ! inside the value are kept.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              [self.postgresHA.postgres.password].all(x,
              !x.matches('[$`]') && !x.matches('\\\\([$`\\\\]|$)') &&
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']) && !(x in ['~', '=', '<<']) &&
              !x.matches('^[-+]?([0-9][0-9_]*|0b[01_]+|0x[0-9a-fA-F_]+)$') &&
              !x.matches('^[-+]?([0-9][0-9_]*)?\\.[0-9_]*([eE][-+][0-9]+)?$') &&
              !x.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              The highly available database writes the password unquoted into a shell script and its YAML config.
              Leave out $ and `, a \ before $, ` or \ or at the end, a leading space or YAML symbol, ": " and " #", and
              values that read as a number, a date, yes/no, on/off, true/false or null.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              (self.postgresHA.postgres.username.matches('^[A-Za-z_][A-Za-z0-9_.-]*$') &&
              !(self.postgresHA.postgres.username.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']))
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Use letters, digits, _ . and -, starting with a letter or underscore, and not yes/no, on/off,
              true/false or null. The highly available database writes the user unquoted into its YAML config and
              a psql command.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database) ||
              (self.postgresHA.postgres.database.matches('^[a-z_][a-z0-9_]*$') && size(self.postgresHA.postgres.database) <= 63 &&
              !(self.postgresHA.postgres.database in ['postgres','template0','template1','all','analyse','analyze','and','any','array','as','asc','asymmetric','authorization','binary','both','case','cast','check','collate','collation','column','concurrently','constraint','create','cross','current_catalog','current_date','current_role','current_schema','current_time','current_timestamp','current_user','default','deferrable','desc','distinct','do','else','end','except','false','fetch','for','foreign','freeze','from','full','grant','group','having','ilike','in','initially','inner','intersect','into','is','isnull','join','lateral','leading','left','like','limit','localtime','localtimestamp','natural','not','notnull','null','offset','on','only','or','order','outer','overlaps','placing','primary','references','returning','right','select','session_user','similar','some','symmetric','system_user','table','tablesample','then','to','trailing','true','union','unique','user','using','variadic','verbose','when','where','window','with']))
            severity: warning
            paths: [postgresHA.postgres.database]
            message: >-
              Use up to 63 lowercase letters, digits and underscores, starting with a letter or underscore, and
              not postgres, template0, template1 or an SQL reserved word such as user or order. The highly available
              database runs an unquoted CREATE DATABASE when it is first created: it folds other names to lowercase or
              fails, and a failure stops the cluster from being created.
          - when: self.postgresHA.enabled
            rule: oldSelf == null || self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or listmonk loses its
              database connection after this upgrade.
          - when: self.postgres.enabled
            rule: oldSelf == null || self.postgres.config.password == oldSelf.postgres.config.password
            severity: info
            paths: [postgres.config.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or listmonk loses its
              database connection after this upgrade.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: One PostgreSQL replica on a persistent volume set.
        fields:
          - path: postgres.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
          - path: postgres.image
            type: string
            format: image
            label: PostgreSQL image
            required: true
            advanced: true
            help: >-
              This version ships `postgres:18`; another image is unproven with it, so try it on a test release
              first. The data directory is specific to a major version: a different major on an existing volume
              does not start. listmonk needs PostgreSQL 12 or later.
          - path: postgres.resources
            type: resources
            label: PostgreSQL resources
            required: true
            advanced: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: oldSelf == null || self.postgres.volumeset.capacity >= oldSelf.postgres.volumeset.capacity
            paths: [postgres.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
          - rule: >-
              oldSelf == null || imageMajor(self.postgres.image) < 0 || imageMajor(oldSelf.postgres.image) < 0 ||
              imageMajor(self.postgres.image) == imageMajor(oldSelf.postgres.image)
            severity: warning
            paths: [postgres.image]
            message: >-
              The data directory belongs to the installed PostgreSQL major version; a different major version does
              not start on it. Upgrade with a dump and restore instead.
      - id: single-backup
        title: Database backups
        toggle: postgres.backup.enabled
        when: self.postgres.enabled
        description: A scheduled logical dump of the single-instance PostgreSQL to object storage.
        fields:
          - path: postgres.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgres.backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            pattern: '^\s*[0-9][0-9*,/-]*(\s+[0-9*,/-]+){4}\s*$'
            patternMessage: >-
              Use five fields of numbers, *, ranges, steps and lists, starting with a digit: this version writes
              the schedule unquoted, so a schedule that starts with * (such as */15 * * * *) fails to install.
              Write 0,15,30,45 * * * * instead.
          - path: postgres.backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            description: Tag 18.x.x for PostgreSQL 18, 17.x.x for PostgreSQL 17.
          - path: postgres.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
        rules:
          - rule: >-
              imageMajor(self.postgres.image) < 0 || imageMajor(self.postgres.backup.image) < 0 ||
              imageMajor(self.postgres.backup.image) >= imageMajor(self.postgres.image)
            severity: warning
            paths: [postgres.backup.image]
            message: >-
              The backup image's major version must be at least the PostgreSQL major version; an older pg_dump
              cannot dump a newer server.
          - rule: imageMajor(self.postgres.image) < 0 || imageMajor(self.postgres.image) >= 17
            severity: warning
            paths: [postgres.backup.enabled]
            message: Backups need PostgreSQL 17 or later; the selected image is older.
      - title: AWS S3
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'aws'
        fields:
          - path: postgres.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgres.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgres.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgres.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgres.backup.aws.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'gcp'
        fields:
          - path: postgres.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgres.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account can write to the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgres.backup.gcp.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
              The access and secret keys are stored in the Helm release in plain text. Version 1.2.0 takes them
              from a secret you create instead.
          - path: postgres.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgres.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgres.backup.minio.accessKey
            type: string
            label: Access key
            required: true
            example: true
          - path: postgres.backup.minio.secretKey
            type: string
            label: Secret key
            required: true
            sensitive: true
            widget: password
            example: true
          - path: postgres.backup.minio.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint that listmonk connects through.
        fields:
          - type: note
            severity: warning
            text: >-
              In this version the bundled etcd does not compact its history, so its storage can fill after a
              few months and force the database read-only
              ([etcd history compaction](/template-catalog/templates/postgres-highly-available#etcd-history-compaction)).
              listmonk 1.0.1 fixes it; install 1.0.1 or later, or choose the single-instance PostgreSQL.
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
        rules:
          - when: self.postgresHA.backup.mode == 'wal-g'
            rule: >-
              (oldSelf != null && oldSelf.postgresHA.backup.mode == 'wal-g' &&
              self.postgresHA.backup.resources.memory == oldSelf.postgresHA.backup.resources.memory) ||
              memoryBytes(self.postgresHA.backup.resources.memory) >= memoryBytes('512Mi')
            severity: warning
            paths: [postgresHA.backup.resources]
            message: >-
              Give the WAL-G sidecar at least 512Mi of memory, and at most 8 MiB per millicore of the backup CPU
              (800Mi at 100m). With less it is killed for running out of memory during the base backup and no
              backup is written.
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.aws.prefix != null && self.postgresHA.backup.aws.prefix != ''
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> (WALG_S3_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.gcp.bucket
