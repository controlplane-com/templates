kind: volumeset
name: {{ include "listmonk.volume.name" . }}
gvc: {{ .Values.global.cpln.gvc }}
description: Listmonk uploads directory (filesystem media store)
tags: {{- include "listmonk.tags" . | nindent 4 }}
spec:
  fileSystemType: ext4
  initialCapacity: {{ .Values.volumeset.capacity }}
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: 7d
