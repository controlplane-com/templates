# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: listmonk

# listmonk is a single stateful replica, and both bundled databases are single-location stateful workloads
# with no location handling: postgres brings this limit with its import, and postgres-highly-available (no
# descriptor of its own, so its keys are parent fields below) needs the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Chosen in the Database step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # listmonk connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          listmonk connects to its database like any other workload: keep Same GVC, or add the listmonk
          workload under Allowed workloads.

steps:
  - id: listmonk
    title: listmonk
    description: The listmonk image, its compute and media storage, and the prerequisite Super Admin secret.
    sections:
      - title: Server
        docs: "#application"
        fields:
          - path: image
            type: string
            format: image
            label: listmonk image
            required: true
          - path: resources
            type: resources
            label: Resources
            required: true
            description: listmonk is a single Go binary with a light footprint.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: volumeset.capacity
            type: integer
            label: Media storage capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100]
            description: Images uploaded on the Media page, kept at /listmonk/uploads.
            help: Uninstalling the release deletes the volume set, so uploaded media does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
          - path: timezone
            type: string
            label: Time zone
            required: true
            placeholder: Etc/UTC
            description: The container's time zone, which campaign scheduling times follow.
          - path: rootUrl
            type: string
            format: url
            label: Public base URL
            description: >-
              The base of every subscriber link and email link. Leave empty to use the canonical endpoint
              while public access is on; set it to your custom domain once attached.
            docs: "#root-url"
        rules:
          - rule: "!has(self.resources.cpu) && !has(self.resources.memory)"
            mirrors: listmonk.validateResourceKnobs
            paths: [resources]
            message: >-
              resources.cpu and resources.memory were renamed to resources.maxCpu and resources.maxMemory in
              1.4.0. Remove the old keys from the values.
          - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
          # The boot script writes the URL as ROOT_URL='<value>' (templates/workload.yaml:45); a single quote ends
          # the string and the script stops with a syntax error (reproduced with sh -n on the rendered script).
          - rule: self.rootUrl == null || !self.rootUrl.contains("'")
            severity: warning
            paths: [rootUrl]
            message: Leave out single quotes. The startup script writes the URL inside single quotes, so one stops listmonk from starting.
      - title: Super Admin
        docs: "#admin-bootstrap"
        fields:
          - type: note
            severity: warning
            text: >-
              The admin secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: admin.secretName
            type: ref
            label: Super Admin secret
            required: true
            description: >-
              A dictionary secret with the keys `username` (at least 3 characters) and `password` (at least 8).
            help: >-
              Used on the first install only: the account then lives in the database, so change the password in
              Admin, Users, not in the secret.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password]
              create:
                suggestName: "context.releaseName + '-listmonk-admin-credentials'"
        rules:
          # 1.0.x rendered its own admin secret named <release>-listmonk-admin; upgrading to 1.1.0 or later
          # prunes it, so a release pointed at that name would reference a secret the upgrade deletes.
          - rule: >-
              context.mode != 'upgrade' || context.fromVersion == null ||
              semverCompare(context.fromVersion, '1.1.0') >= 0 ||
              self.admin.secretName != context.releaseName + '-listmonk-admin'
            paths: [admin.secretName]
            message: >-
              That secret belongs to the 1.0.x release, and this upgrade deletes it. Create a new dictionary
              secret with the keys username and password and choose it here.
          - rule: "!has(self.admin.username) && !has(self.admin.password)"
            mirrors: listmonk.validateAdmin
            paths: [admin.secretName]
            message: >-
              admin.username and admin.password were removed in 1.1.0. Put them in the admin secret and remove
              them from the values.
          # <release>-postgres-config is a chart secret of the highly available database: in 2.4.x (listmonk 1.2.0
          # and earlier) it held username and password, so the picker's requiredKeys accept it, and the upgrade
          # removes or rewrites it; from 2.5.0 the database renders it for its backup settings when backups are on.
          - rule: >-
              self.admin.secretName != context.releaseName + '-postgres-config' ||
              (!(self.postgresHA.enabled && self.postgresHA.backup.enabled) &&
              !(oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') < 0 &&
              oldSelf.postgresHA.enabled))
            severity: warning
            paths: [admin.secretName]
            message: >-
              Choose another secret. The highly available database renders its own secret under this name when
              backups are on, and on an upgrade from listmonk 1.2.x or earlier this is the old chart's secret, which
              the upgrade removes or rewrites.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach listmonk inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The admin UI and the subscriber-facing pages on the canonical endpoint. Subscription forms,
          unsubscribe links and tracking pixels must be reachable from the internet.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.publicAccess.enabled
        severity: warning
        paths: [publicAccess.enabled]
        message: >-
          Without public access, subscription forms, unsubscribe links and tracking pixels cannot be reached by
          subscribers.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: database
    title: Database
    description: Which PostgreSQL holds listmonk's data, and the prerequisite secret with its credentials.
    docs: "#configuration"
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgresHA.enabled && !self.postgres.enabled ? 'ha' : 'single'"
            options:
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica on a persistent volume; the default.
                set: { postgresHA.enabled: false, postgres.enabled: true }
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - type: note
            severity: warning
            text: >-
              The database credentials secret must exist **before** you install; if it is missing, the
              deployment waits and `cpln logs` shows nothing at all.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: >-
          One PostgreSQL replica. Its server, storage, network and backups follow in the next steps.
        docs: "#single-instance-postgresql"
        fields:
          - path: postgres.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data directory is first initialized, and listmonk
              connects with them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then
              update the secret and right away force a redeployment of listmonk (not the database).
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-listmonk-db-credentials'"
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint that listmonk connects through.
        docs: "#highly-available-postgresql"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.3.0') < 0
            text: >-
              From this version the highly available database writes the password inside double quotes in its
              config on every start, so a password with a `"` or `\` breaks it. If yours has one, change it with
              ALTER ROLE for the user and for repl before upgrading, and put the new one in the secret.
          - path: postgresHA.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: >-
              A dictionary secret with the keys `username`, `password` and `database`, and no `"` or `\` in the
              user or password.
            help: >-
              PostgreSQL reads these values only when its data is first initialized, and listmonk connects with
              them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then update the secret and
              force a redeployment of PostgreSQL, then of listmonk.
              In HA mode the order differs: move the leader to member -0 first (see the README's HA rotation steps).
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-listmonk-db-credentials'"
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
          # postgres-highly-available 2.5.0 renders a secret named <release>-postgres-config for its backup settings,
          # and 2.4.x (listmonk 1.2.0 and earlier) kept the database credentials in a chart secret of that name.
          - rule: >-
              !self.postgresHA.enabled ||
              (oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') >= 0 &&
              self.postgresHA.config.credentialsSecretName == oldSelf.postgresHA.config.credentialsSecretName &&
              !self.postgresHA.backup.enabled) ||
              self.postgresHA.config.credentialsSecretName != context.releaseName + '-postgres-config'
            severity: warning
            paths: [postgresHA.config.credentialsSecretName]
            message: >-
              Choose another name. The highly available database renders its own secret under this name when backups
              are on, and on an upgrade from listmonk 1.2.x or earlier this is the old chart's secret, which the
              upgrade removes or rewrites.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
        rules:
          - when: self.postgresHA.backup.mode == 'wal-g'
            rule: >-
              (oldSelf != null && oldSelf.postgresHA.backup.mode == 'wal-g' &&
              self.postgresHA.backup.resources.memory == oldSelf.postgresHA.backup.resources.memory) ||
              memoryBytes(self.postgresHA.backup.resources.memory) >= memoryBytes('512Mi')
            severity: warning
            paths: [postgresHA.backup.resources]
            message: >-
              Give the WAL-G sidecar at least 512Mi of memory, and at most 8 MiB per millicore of the backup CPU
              (800Mi at 100m). With less it is killed for running out of memory during the base backup and no
              backup is written.
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.aws.prefix != null && self.postgresHA.backup.aws.prefix != ''
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> (WALG_S3_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Object
              Admin role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgresHA.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.gcp.prefix != null && self.postgresHA.backup.gcp.prefix != ''
            severity: warning
            paths: [postgresHA.backup.gcp.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.gcp.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.gcp.prefix == oldSelf.postgresHA.backup.gcp.prefix) ||
              [self.postgresHA.backup.gcp.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.gcp.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside gs://<bucket>/<prefix> (WALG_GS_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.gcp.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.gcp.prefix == oldSelf.postgresHA.backup.gcp.prefix) ||
              [self.postgresHA.backup.gcp.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.gcp.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: MinIO or S3-compatible
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'minio'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgresHA.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.minio.credentialsSecretName
            type: ref
            label: MinIO credentials secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
          - path: postgresHA.backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.minio.prefix != null && self.postgresHA.backup.minio.prefix != ''
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.minio.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.minio.prefix == oldSelf.postgresHA.backup.minio.prefix) ||
              [self.postgresHA.backup.minio.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> (WALG_S3_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.minio.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.minio.prefix == oldSelf.postgresHA.backup.minio.prefix) ||
              [self.postgresHA.backup.minio.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
          - rule: "!has(self.postgresHA.backup.minio.accessKey) && !has(self.postgresHA.backup.minio.secretKey)"
            paths: [postgresHA.backup.minio.credentialsSecretName]
            message: >-
              postgresHA.backup.minio.accessKey and secretKey were removed in 1.3.1. Put them in the MinIO
              credentials secret and remove them from the values.
    rules:
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        message: >-
          Switching the database on an installed release deletes the current one, with all of listmonk's data, and
          starts an empty one. Keep the current database, or install a new release with the other database and
          move the data.
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: listmonk.validate
        paths: [postgresHA.enabled, postgres.enabled]
        message: Enable exactly one database, either the single-instance or the highly available PostgreSQL.
      - rule: >-
          !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
          dyn(self.postgresHA)['proxy']['enabled'] == true || dyn(self.postgresHA)['proxy']['enabled'] == null
        mirrors: listmonk.validate
        paths: [postgresHA.enabled]
        message: postgresHA.proxy.enabled must stay true; the HAProxy leader endpoint is listmonk's database endpoint.
      - rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != null &&
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != ''
        mirrors: listmonk.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: The database credentials secret is required.
      - rule: "!has(self.postgres.credentials)"
        mirrors: listmonk.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          postgres.credentials was removed in 1.6.0: the database credentials are now a prerequisite
          dictionary secret named by the credentials secret field. Remove postgres.credentials from the values.
      - rule: "!has(self.postgresHA.postgres)"
        paths: [postgresHA.config.credentialsSecretName]
        message: >-
          postgresHA.postgres was removed in 1.3.0: put its username, password and database in the database
          credentials secret and remove the block from the values.
      - rule: >-
          !has(self.postgres.config.username) && !has(self.postgres.config.password) &&
          !has(self.postgres.config.database)
        paths: [postgres.config.credentialsSecretName]
        message: >-
          postgres.config.username, password and database were removed in 1.2.0: put them in the database
          credentials secret and remove them from the values.
      # Upgrading from 1.5.0 or earlier, the chart-created secret is deleted by the upgrade itself, so the new
      # prerequisite secret must have a different name (holding the same username, password and database).
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.6.0') < 0
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) !=
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          The previous version created the database secret itself, and this upgrade deletes it. Create a secret
          under a NEW name holding the same username, password and database, and name it here.
      - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.6.0') >= 0)
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) ==
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        severity: info
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          PostgreSQL reads the credentials only when its data is first initialized; pointing at another secret
          does not change the existing user or password.

# Rules over the imported values: their issues show on the imported fields' step (postgres:network).
rules:
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks listmonk, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-listmonk') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-listmonk, or listmonk cannot reach its database.'"
    message: Add the listmonk workload to the list, or listmonk cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: listmonk connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.6.0"
    from: postgres.credentials
    note: >-
      This setting served both database modes (single-instance and HA). The database credentials are now a
      prerequisite dictionary secret (username, password, database). Create it under a NEW name with the values the
      database was initialized with, and choose it under Database.
  - fromVersions: "<1.4.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<1.4.0"
    from: resources.memory
    to: resources.maxMemory
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.0"
    from: postgresHA.postgres
    note: >-
      Put the username, password and database the HA database was initialized with in the database
      credentials secret, and choose it under Database.
  - fromVersions: "<1.2.0"
    from: postgres.config.username
    note: Put it in the database credentials secret (key username); choose the secret under Database.
  - fromVersions: "<1.2.0"
    from: postgres.config.password
    note: Put it in the database credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.2.0"
    from: postgres.config.database
    note: Put it in the database credentials secret (key database); choose the secret under Database.
  - fromVersions: "<1.1.0"
    from: admin.username
    note: The Super Admin login moved into the admin secret (keys username and password); choose it under listmonk.
  - fromVersions: "<1.1.0"
    from: admin.password
    note: >-
      The Super Admin login moved into the admin secret (keys username and password); choose it under listmonk.
      The admin password does not change on upgrade; if it is still change-me-listmonk-admin, change it in
      listmonk now.
