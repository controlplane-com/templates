---
kind: secret
name: {{ include "litellm.db.secret.name" . }}
description: LiteLLM database credentials (for DATABASE_URL assembly)
tags: {{- include "litellm.tags" . | nindent 4 }}
type: dictionary
data:
  postgresUsername: {{ .Values.postgres.config.username | quote }}
  postgresPassword: {{ .Values.postgres.config.password | quote }}
