---
kind: secret
name: {{ include "litellm.config.secret.name" . }}
description: LiteLLM proxy config.yaml (model list + Redis cache block)
tags: {{- include "litellm.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    model_list:
{{ .Values.litellm.modelList | toYaml | indent 6 }}
    {{- if .Values.redis.enabled }}
    # Shared response cache + rate-limit counters via the redis subchart's
    # Sentinel cluster (master name `mymaster`). Sentinel-aware so failover is
    # transparent. Wired here (not env) because REDIS_* env parsing is unreliable.
    litellm_settings:
      cache: true
      cache_params:
        type: redis
        service_name: mymaster
        sentinel_nodes: [["{{ printf "%s-sentinel.%s.cpln.local" .Release.Name .Values.global.cpln.gvc }}", 26379]]
        {{- if eq (include "litellm.redisAuthEnabled" .) "true" }}
        # Master-only password (NOT a sentinel password — upstream #20734).
        password: os.environ/LITELLM_REDIS_PASSWORD
        {{- end }}
    {{- end }}
