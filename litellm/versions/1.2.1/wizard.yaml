# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: LiteLLM

# The proxy is stateless, but the bundled PostgreSQL and the Redis Sentinel cluster are stateful workloads
# with no location handling: every extra GVC location would run its own, separate database and Redis.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    title: Bundled PostgreSQL
    after: redis
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # A prerequisite the proxy needs too: chosen in the Secrets step, next to the keys secret.
      - config.credentialsSecretName
      # The proxy connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          The proxy connects to its database like any other workload: keep Same GVC, or add the LiteLLM
          workload under Allowed workloads.
      backup.enabled:
        help: Adds one cron workload that runs `pg_dumpall` and uploads a gzipped dump to the bucket.
      volumeset.capacity:
        max: 65536
      volumeset.autoscaling.maxCapacity:
        max: 65536

steps:
  - id: secrets
    title: Secrets
    description: The two prerequisite secrets the proxy and its database read.
    docs: "#prerequisites"
    fields:
      - type: note
        severity: warning
        text: >-
          Both secrets must exist **before** you install. If one is missing, the deployment waits and
          `cpln logs` shows nothing at all.
      - path: litellm.providerEnv
        type: list
        label: Provider key variables
        widget: tags
        description: >-
          Environment variable names the proxy reads from the keys secret (for example `OPENAI_API_KEY`), so
          the secret below must hold each one. Reference them in the model list as `os.environ/NAME`.
        unique: true
        item:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          patternMessage: Letters, digits and underscores, not starting with a digit.
          maxLength: 120
      - path: secrets.name
        type: ref
        label: Keys secret
        required: true
        description: >-
          A dictionary secret with `LITELLM_MASTER_KEY`, `LITELLM_SALT_KEY` and one key per provider key
          variable above. The master key must start with `sk-`, and it is also the Admin UI password for
          user `admin`.
        help: >-
          `LITELLM_SALT_KEY` encrypts the provider keys stored in the database: never change it once models
          or keys are stored. The master key can be rotated.
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeysFrom: "['LITELLM_MASTER_KEY', 'LITELLM_SALT_KEY'] + self.litellm.providerEnv"
          create:
            suggestName: "context.releaseName + '-litellm-secrets'"
      - path: postgres.config.credentialsSecretName
        type: ref
        label: Database credentials secret
        required: true
        description: A dictionary secret with the keys `username`, `password` and `database`, all URL-safe.
        help: >-
          PostgreSQL reads these values only when its data directory is first initialized, and the proxy
          connects with them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then update
          the secret and right away force a redeployment of the proxy (not the database).
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [username, password, database]
          create:
            suggestName: "context.releaseName + '-litellm-db-credentials'"
    rules:
      # Platform schema (nodelibs env.ts): names starting with CPLN_, the K_ names, and a name the container
      # already has (the proxy's own variables, templates/workload.yaml) are refused at apply.
      - rule: >-
          self.litellm.providerEnv.all(n, !n.startsWith('CPLN_') &&
          !(n in ['K_SERVICE', 'K_CONFIGURATION', 'K_REVISION', 'LITELLM_MASTER_KEY', 'LITELLM_SALT_KEY', 'POSTGRES_USER', 'POSTGRES_PASSWORD', 'POSTGRES_DB', 'DATABASE_URL', 'STORE_MODEL_IN_DB']) &&
          !(n == 'LITELLM_REDIS_PASSWORD' && self.redis.enabled && self.redis.redis.auth.fromSecret.enabled) &&
          !(n in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL']))
        paths: [litellm.providerEnv]
        message: >-
          The platform refuses names starting with CPLN_, K_SERVICE, K_CONFIGURATION and K_REVISION, and the
          names the proxy already sets (LITELLM_MASTER_KEY, LITELLM_SALT_KEY, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL, STORE_MODEL_IN_DB, and LITELLM_REDIS_PASSWORD with the Redis password on). The chart also writes the
          names unquoted, so true, false and null are refused.
      - rule: self.secrets.name != ''
        mirrors: litellm.validate
        paths: [secrets.name]
        message: Name the prerequisite keys secret; the chart does not render without it.
      - rule: "!has(self.postgres.credentials)"
        mirrors: litellm.validateRemovedKeys
        paths: [postgres.config.credentialsSecretName]
        message: >-
          postgres.credentials was removed in 1.2.0: the database credentials are now a prerequisite dictionary
          secret named by the database credentials secret field. Remove postgres.credentials from the values.
      # Restated from the postgres import, whose rule on this path the exclusion above drops.
      - rule: >-
          !has(self.postgres.config.username) && !has(self.postgres.config.password) &&
          !has(self.postgres.config.database)
        paths: [postgres.config.credentialsSecretName]
        message: >-
          postgres.config.username, password and database were removed in 1.1.0: put them in the database
          credentials secret and remove them from the values.
      # Upgrading from 1.1.0 or earlier, the chart-created secret is deleted by the upgrade itself, so the new
      # prerequisite secret must have a different name (holding the same username, password and database).
      - when: context.fromVersion != null && semverCompare(context.fromVersion, '1.2.0') < 0
        rule: >-
          oldSelf == null || !has(oldSelf.postgres.config.credentialsSecretName) ||
          self.postgres.config.credentialsSecretName != oldSelf.postgres.config.credentialsSecretName
        paths: [postgres.config.credentialsSecretName]
        message: >-
          The previous version created the database secret itself, and this upgrade deletes it. Create a secret
          under a NEW name holding the same username, password and database, and name it here.
      - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.2.0') >= 0)
        rule: self.postgres.config.credentialsSecretName == oldSelf.postgres.config.credentialsSecretName
        severity: info
        paths: [postgres.config.credentialsSecretName]
        message: >-
          PostgreSQL reads the credentials only when its data directory is first initialized; pointing at
          another secret does not change the existing user or password.
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.2.0') < 0
        rule: "false"
        severity: info
        paths: [postgres.config.credentialsSecretName]
        message: >-
          This upgrade restarts the bundled PostgreSQL, so LiteLLM loses its database for a minute or two and
          reconnects by itself. A new workload version can also wait up to about 10 minutes for access to the
          new secrets; the previous version keeps serving meanwhile.

  - id: litellm
    title: LiteLLM proxy
    description: The proxy image, its replicas and compute, and the models it serves.
    docs: "#litellm-proxy"
    sections:
      - title: Server
        fields:
          - path: litellm.image
            type: string
            format: image
            label: LiteLLM image
            required: true
            description: Use a `litellm-database` image; it applies the database migrations on boot.
          - path: litellm.replicas
            type: integer
            label: Replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              The proxy is stateless. With two or more, keep Redis on so rate limits and budgets are shared
              between replicas.
          - path: litellm.resources
            type: resources
            label: Resources
            required: true
            description: Per replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.litellm.replicas >= 1
            mirrors: litellm.validate
            paths: [litellm.replicas]
            message: Run at least one replica.
          - when: self.litellm.replicas >= 2
            rule: self.redis.enabled
            severity: info
            paths: [litellm.replicas]
            message: >-
              Without Redis every replica rate-limits on its own, so the effective limit is the replica count
              times the configured one.
      - title: Models
        fields:
          - path: litellm.modelList
            type: yaml
            label: Model list
            required: true
            description: >-
              The `model_list` of LiteLLM's config. Reference provider keys as `os.environ/NAME`, never as
              literal keys.
            help: "See [model configuration](https://docs.litellm.ai/docs/proxy/configs) in the LiteLLM docs."
          - path: litellm.storeModelInDb
            type: boolean
            label: Manage models in the Admin UI too
            description: Models added in the Admin UI are stored in the database, next to the list above.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach the proxy inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The API and the Admin UI on the workload's `*.cpln.app` endpoint. Every request still needs the
          master key or a virtual key.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - { value: none, label: None, description: No workload can connect. }
          - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
          - { value: same-org, label: Same org, description: Any workload in this org. }
          - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning

  - id: redis
    title: Redis
    description: Shares rate-limit counters, budgets and the response cache between proxy replicas.
    docs: "#bundled-redis"
    # Step-level, so it runs while the toggle below is off; the copy on the proxy step only shows there.
    rules:
      - when: self.litellm.replicas >= 2
        rule: self.redis.enabled
        severity: info
        paths: [redis.enabled]
        message: >-
          Without Redis every replica rate-limits on its own, so the effective limit is the replica count
          times the configured one.
    sections:
      - id: redis
        title: Bundled Redis with Sentinel
        toggle: redis.enabled
        description: >-
          A Redis primary with replicas and Sentinel failover. Without it each proxy replica rate-limits in
          memory on its own.
        fields:
          - path: redis.redis.replicas
            type: integer
            label: Redis replicas
            required: true
            min: 1
            suggestions: [1, 3]
            description: One primary, the rest replicas.
          - path: redis.sentinel.replicas
            type: integer
            label: Sentinel replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Use an odd number so the sentinels can agree on a failover.
          - path: redis.redis.auth.fromSecret.enabled
            type: boolean
            label: Require a password
            description: >-
              Off, the GVC firewall is the only boundary. On, Redis, Sentinel and the proxy read the password
              from the secret below.
          - path: redis.redis.auth.fromSecret.name
            type: ref
            label: Redis password secret
            required: true
            when: self.redis.redis.auth.fromSecret.enabled
            description: >-
              A dictionary secret with the key `password`. It must exist before you install. Leave out spaces,
              quotes and backslashes: the Redis nodes write the password into their config files.
            help: >-
              Changing the password later takes more than a secret edit, because a running Sentinel keeps the
              old one: follow "Rotating the Redis password" in the README.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [password]
              create:
                suggestName: "context.releaseName + '-litellm-redis'"
          - path: redis.redis.image
            type: string
            format: image
            label: Redis image
            required: true
            advanced: true
          - path: redis.redis.resources.cpu
            type: quantity
            quantity: cpu
            label: Redis CPU limit
            min: 25m
            required: true
            advanced: true
          - path: redis.redis.resources.minCpu
            type: quantity
            quantity: cpu
            label: Redis CPU reservation
            min: 25m
            required: true
            advanced: true
          - path: redis.redis.resources.memory
            type: quantity
            quantity: memory
            label: Redis memory limit
            min: 32Mi
            required: true
            advanced: true
          - path: redis.redis.resources.minMemory
            type: quantity
            quantity: memory
            label: Redis memory reservation
            min: 32Mi
            required: true
            advanced: true
          - path: redis.sentinel.image
            type: string
            format: image
            label: Sentinel image
            required: true
            advanced: true
          - path: redis.sentinel.resources.cpu
            type: quantity
            quantity: cpu
            label: Sentinel CPU limit
            min: 25m
            required: true
            advanced: true
          - path: redis.sentinel.resources.minCpu
            type: quantity
            quantity: cpu
            label: Sentinel CPU reservation
            min: 25m
            required: true
            advanced: true
          - path: redis.sentinel.resources.memory
            type: quantity
            quantity: memory
            label: Sentinel memory limit
            min: 32Mi
            required: true
            advanced: true
          - path: redis.sentinel.resources.minMemory
            type: quantity
            quantity: memory
            label: Sentinel memory reservation
            min: 32Mi
            required: true
            advanced: true
        rules:
          - when: self.redis.redis.auth.fromSecret.enabled
            rule: self.redis.redis.auth.fromSecret.name != ''
            mirrors: litellm.validate
            paths: [redis.redis.auth.fromSecret.name]
            message: Name the Redis password secret, or turn the password off.
          # Upgrading from 1.1.0 with auth on, the upgrade deletes the chart-created <release>-redis-auth-password
          # secret, so the prerequisite secret must have a different name (holding the same password).
          - when: >-
              self.redis.redis.auth.fromSecret.enabled && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.2.0') < 0
            rule: self.redis.redis.auth.fromSecret.name != context.releaseName + '-redis-auth-password'
            paths: [redis.redis.auth.fromSecret.name]
            message: >-
              The previous version created this secret itself, and this upgrade deletes it. Create a secret under
              a NEW name holding your current Redis password, and name it here.
          # redis 3.4.3 templates/workload-sentinel.yaml: bootstrap_sentinel_conf keeps an existing sentinel.conf, which
          # survives a restart only with sentinel.persistence on (off by default).
          - when: >-
              oldSelf != null && self.redis.redis.auth.fromSecret.enabled &&
              (!has(oldSelf.redis.redis.auth.fromSecret.enabled) || oldSelf.redis.redis.auth.fromSecret.enabled != true) &&
              [self.redis.sentinel].exists(s, s.exists(k, k == 'persistence' && s[k] != null && [s[k]].exists(p, p.exists(e, e == 'enabled' && p[e] == true))))
            rule: "false"
            severity: info
            paths: [redis.redis.auth.fromSecret.name]
            message: >-
              The Sentinels were first started without a Redis password and keep that config on their volume, so
              they cannot authenticate to the Redis nodes after this change. Run SENTINEL SET mymaster auth-pass
              with the password on every Sentinel once the Redis nodes have restarted.
          # Redis and Sentinel are stateful workloads (redis 3.4.3): the platform rejects a max:min ratio above 4:1,
          # a minimum above its maximum, and more than 8 MiB of memory per millicore of CPU (nodelibs workload.ts).
          - rule: >-
              cpuMillicores(self.redis.redis.resources.cpu) >= cpuMillicores(self.redis.redis.resources.minCpu) &&
              memoryBytes(self.redis.redis.resources.memory) >= memoryBytes(self.redis.redis.resources.minMemory)
            paths: [redis.redis.resources.minCpu, redis.redis.resources.minMemory]
            message: The Redis CPU and memory reservations cannot exceed their limits.
          - rule: >-
              cpuMillicores(self.redis.redis.resources.cpu) <= 4 * cpuMillicores(self.redis.redis.resources.minCpu) &&
              memoryBytes(self.redis.redis.resources.memory) <= 4 * memoryBytes(self.redis.redis.resources.minMemory)
            paths: [redis.redis.resources.minCpu, redis.redis.resources.minMemory]
            message: The Redis CPU and memory limits can each be at most 4 times their reservation on a stateful workload.
          - rule: memoryBytes(self.redis.redis.resources.memory) <= 8 * 1048576 * cpuMillicores(self.redis.redis.resources.cpu)
            paths: [redis.redis.resources.memory]
            message: The platform allows at most 8 MiB of memory per millicore of CPU; raise the Redis CPU limit or lower its memory.
          - rule: >-
              cpuMillicores(self.redis.sentinel.resources.cpu) >= cpuMillicores(self.redis.sentinel.resources.minCpu) &&
              memoryBytes(self.redis.sentinel.resources.memory) >= memoryBytes(self.redis.sentinel.resources.minMemory)
            paths: [redis.sentinel.resources.minCpu, redis.sentinel.resources.minMemory]
            message: The Sentinel CPU and memory reservations cannot exceed their limits.
          - rule: >-
              cpuMillicores(self.redis.sentinel.resources.cpu) <= 4 * cpuMillicores(self.redis.sentinel.resources.minCpu) &&
              memoryBytes(self.redis.sentinel.resources.memory) <= 4 * memoryBytes(self.redis.sentinel.resources.minMemory)
            paths: [redis.sentinel.resources.minCpu, redis.sentinel.resources.minMemory]
            message: The Sentinel CPU and memory limits can each be at most 4 times their reservation on a stateful workload.
          - rule: memoryBytes(self.redis.sentinel.resources.memory) <= 8 * 1048576 * cpuMillicores(self.redis.sentinel.resources.cpu)
            paths: [redis.sentinel.resources.memory]
            message: The platform allows at most 8 MiB of memory per millicore of CPU; raise the Sentinel CPU limit or lower its memory.
          # Stateful workloads: the platform refuses a limit more than 4 cores or 4Gi above its reservation.
          - rule: >-
              cpuMillicores(self.redis.redis.resources.cpu) - cpuMillicores(self.redis.redis.resources.minCpu) <= 4000 &&
              memoryBytes(self.redis.redis.resources.memory) - memoryBytes(self.redis.redis.resources.minMemory) <= 4096 * 1048576
            paths: [redis.redis.resources.cpu, redis.redis.resources.memory]
            message: The Redis CPU limit can be at most 4 cores above its reservation, and the memory limit at most 4Gi above.
          # redis 3.4.3 writes the value unquoted: a whole number of cores reaches the API as a number, which it refuses.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.cpu) && string(oldSelf.redis.redis.resources.cpu) == string(self.redis.redis.resources.cpu)) ||
              string(self.redis.redis.resources.cpu).endsWith('m')
            paths: [redis.redis.resources.cpu]
            message: Write the Redis CPU in millicores, such as 200m or 1000m.
          # redis 3.4.3 writes the value unquoted: a whole number of cores reaches the API as a number, which it refuses.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.minCpu) && string(oldSelf.redis.redis.resources.minCpu) == string(self.redis.redis.resources.minCpu)) ||
              string(self.redis.redis.resources.minCpu).endsWith('m')
            paths: [redis.redis.resources.minCpu]
            message: Write the Redis CPU in millicores, such as 200m or 1000m.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.memory) && string(oldSelf.redis.redis.resources.memory) == string(self.redis.redis.resources.memory)) ||
              string(self.redis.redis.resources.memory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.redis.resources.memory]
            message: Write the Redis memory with a unit, such as 256Mi or 1Gi.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.redis.resources.minMemory) && string(oldSelf.redis.redis.resources.minMemory) == string(self.redis.redis.resources.minMemory)) ||
              string(self.redis.redis.resources.minMemory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.redis.resources.minMemory]
            message: Write the Redis memory with a unit, such as 256Mi or 1Gi.
          # Stateful workloads: the platform refuses a limit more than 4 cores or 4Gi above its reservation.
          - rule: >-
              cpuMillicores(self.redis.sentinel.resources.cpu) - cpuMillicores(self.redis.sentinel.resources.minCpu) <= 4000 &&
              memoryBytes(self.redis.sentinel.resources.memory) - memoryBytes(self.redis.sentinel.resources.minMemory) <= 4096 * 1048576
            paths: [redis.sentinel.resources.cpu, redis.sentinel.resources.memory]
            message: The Sentinel CPU limit can be at most 4 cores above its reservation, and the memory limit at most 4Gi above.
          # redis 3.4.3 writes the value unquoted: a whole number of cores reaches the API as a number, which it refuses.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.cpu) && string(oldSelf.redis.sentinel.resources.cpu) == string(self.redis.sentinel.resources.cpu)) ||
              string(self.redis.sentinel.resources.cpu).endsWith('m')
            paths: [redis.sentinel.resources.cpu]
            message: Write the Sentinel CPU in millicores, such as 200m or 1000m.
          # redis 3.4.3 writes the value unquoted: a whole number of cores reaches the API as a number, which it refuses.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.minCpu) && string(oldSelf.redis.sentinel.resources.minCpu) == string(self.redis.sentinel.resources.minCpu)) ||
              string(self.redis.sentinel.resources.minCpu).endsWith('m')
            paths: [redis.sentinel.resources.minCpu]
            message: Write the Sentinel CPU in millicores, such as 200m or 1000m.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.memory) && string(oldSelf.redis.sentinel.resources.memory) == string(self.redis.sentinel.resources.memory)) ||
              string(self.redis.sentinel.resources.memory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.sentinel.resources.memory]
            message: Write the Sentinel memory with a unit, such as 256Mi or 1Gi.
          - rule: >-
              (oldSelf != null && has(oldSelf.redis.sentinel.resources.minMemory) && string(oldSelf.redis.sentinel.resources.minMemory) == string(self.redis.sentinel.resources.minMemory)) ||
              string(self.redis.sentinel.resources.minMemory).matches('(k|Ki|M|Mi|G|Gi)$')
            paths: [redis.sentinel.resources.minMemory]
            message: Write the Sentinel memory with a unit, such as 256Mi or 1Gi.

# Rules over the imported values: their issues show on the imported fields' steps.
rules:
  # Top level, not in the Redis section: the chart refuses the removed key even with Redis off.
  # The chart refuses it only when enabled is true or the value differs from the subchart default your-password.
  - rule: >-
      [self.redis.redis].all(r, !r.exists(k, k == 'auth' && r[k] != null && [r[k]].exists(a,
      a.exists(j, j == 'password' && a[j] != null && [a[j]].exists(p,
      p.exists(e, e == 'enabled' && p[e] == true) ||
      p.exists(e, e == 'value' && p[e] != null && string(p[e]) != 'your-password'))))))
    mirrors: litellm.validateRedisPassword
    paths: [redis.enabled]
    message: >-
      redis.redis.auth.password was removed in 1.2.0: the Redis password is now a prerequisite dictionary secret
      (key password) chosen under Bundled Redis. Remove redis.redis.auth.password from the values.
  # Top level too: since 1.2.1 the chart refuses Sentinel auth (including the plaintext
  # redis.sentinel.auth.password) whatever Redis and Redis auth are set to. Any redis.sentinel.auth block is
  # YAML-only here.
  - rule: >-
      [self.redis.sentinel].all(s, !s.exists(k, k == 'auth' && s[k] != null && [s[k]].exists(a,
      a.exists(j, j == 'password' && a[j] != null && [a[j]].exists(p,
      p.exists(e, e == 'enabled' && p[e] == true) ||
      p.exists(e, e == 'value' && p[e] != null && !(string(p[e]) in ['', 'your-password'])))) ||
      a.exists(j, j == 'fromSecret' && a[j] != null && [a[j]].exists(f, f.exists(e, e == 'enabled' && f[e] == true))))))
    mirrors: litellm.validateSentinelAuth
    paths: [redis.enabled]
    message: >-
      Keep Sentinel authentication off (remove redis.sentinel.auth from the values): LiteLLM sends only the Redis
      password, not a Sentinel password, and a Sentinel password would sit in the release as plain text.
  - rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks the proxy, which connects to its database like any other workload.'
  - when: self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-litellm') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-litellm, or the proxy cannot reach its database.'"
    fix:
      path: postgres.internalAccess.workloads
      items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-litellm']"
    message: Add the LiteLLM workload to the list, or the proxy cannot reach its database.
  # Secrets the chart creates itself: <release>-litellm-config, and with Redis on the redis subchart's
  # <release>-redis-config and <release>-sentinel-config. A secret you name must not share one of those names.
  - rule: >-
      !(([self.secrets.name, self.postgres.config.credentialsSecretName] +
      (self.redis.enabled && self.redis.redis.auth.fromSecret.enabled ? [self.redis.redis.auth.fromSecret.name] : []) +
      (self.postgres.backup.enabled && self.postgres.backup.provider == 'minio' ? [self.postgres.backup.minio.credentialsSecretName] : [])).exists(n,
      n == context.releaseName + '-litellm-config' ||
      (self.redis.enabled && n in [context.releaseName + '-redis-config', context.releaseName + '-sentinel-config'])))
    severity: warning
    paths: [secrets.name]
    message: >-
      This release creates secrets named <release>-litellm-config and, with Redis on, <release>-redis-config and
      <release>-sentinel-config. A secret you name here (keys, database credentials, Redis password or backup
      keys) must use another name.

yamlOnly:
  - path: postgres.pgbouncer
    reason: The proxy connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.2.0"
    from: redis.redis.auth.password.enabled
    to: redis.redis.auth.fromSecret.enabled
  - fromVersions: "<1.2.0"
    from: redis.redis.auth.password.value
    note: >-
      The Redis password is now a prerequisite dictionary secret (key password). If Redis auth was on, create it
      under a NEW name holding your CURRENT Redis password, and choose it under Redis.
  - fromVersions: "<1.2.0"
    from: postgres.credentials
    note: >-
      The database credentials are now a prerequisite dictionary secret (username, password, database). Create
      it under a NEW name with the values the database was initialized with, and choose it under Secrets. Read
      them before upgrading with `cpln secret reveal` on the installed release's
      postgres.config.credentialsSecretName (the upgrade deletes that secret); a password never overridden is
      `change-me-litellm-pg`.
  - fromVersions: "<1.1.0"
    from: postgres.config.username
    note: Put it in the database credentials secret (key username); choose the secret under Secrets.
  - fromVersions: "<1.1.0"
    from: postgres.config.password
    note: Put it in the database credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.1.0"
    from: postgres.config.database
    note: Put it in the database credentials secret (key database); choose the secret under Secrets.
