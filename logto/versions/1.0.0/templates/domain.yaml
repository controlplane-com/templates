{{- $tls := dict "cipherSuites" (list "ECDHE-ECDSA-AES256-GCM-SHA384" "ECDHE-ECDSA-CHACHA20-POLY1305" "ECDHE-ECDSA-AES128-GCM-SHA256" "ECDHE-RSA-AES256-GCM-SHA384" "ECDHE-RSA-CHACHA20-POLY1305" "ECDHE-RSA-AES128-GCM-SHA256" "AES256-GCM-SHA384" "AES128-GCM-SHA256") "minProtocolVersion" "TLSV1_2" }}
{{- range $d := list (dict "host" .Values.customDomain.core "workload" (include "logto.name" .) "port" 3001) (dict "host" .Values.customDomain.adminConsole "workload" (include "logto.admin.name" .) "port" 3002) }}
{{- if $d.host }}
---
kind: domain
name: {{ $d.host }}
description: {{ $d.host }}
tags: {{- include "logto.tags" $ | nindent 2 }}
spec:
  acceptAllHosts: false
  acceptAllSubdomains: false
  dnsMode: cname
  ports:
    - number: 443
      protocol: http2
      routes:
        - port: {{ $d.port }}
          prefix: /
          workloadLink: //gvc/{{ $.Values.global.cpln.gvc }}/workload/{{ $d.workload }}
      tls: {{- toYaml $tls | nindent 8 }}
{{- end }}
{{- end }}
