{{- if .Values.phpMyAdmin.enabled }}
kind: workload
name: {{ include "maria.phpAdmin.name" . }}
description: phpMyAdmin for MariaDB database management
gvc: {{ .Values.global.cpln.gvc }}
tags:
  {{- include "maria.tags" . | nindent 2 }}
spec:
  type: serverless
  containers:
    - name: phpmyadmin
      env:
        # Connection target only. phpMyAdmin presents a login form (auth_type
        # cookie) and the user supplies credentials there, so this workload is
        # given no identity and no access to any secret.
        - name: PMA_HOST
          value: '{{ include "maria.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local'
        - name: PMA_PORT
          value: '3306'
      image: {{ .Values.phpMyAdmin.image }}
      inheritEnv: false
      cpu: {{ .Values.phpMyAdmin.resources.cpu | quote }}
      memory: {{ .Values.phpMyAdmin.resources.memory | quote }}
      ports:
        - number: 80
          protocol: http
  defaultOptions:
    autoscaling:
      metric: disabled
      minScale: 1
      maxScale: 1
  firewallConfig:
    external:
      {{- if .Values.phpMyAdmin.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
      inboundBlockedCIDR: []
      # Closed egress: the console reaches the database inside the GVC only.
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.phpMyAdmin.internalAccess.type }}
      {{- if .Values.phpMyAdmin.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.phpMyAdmin.internalAccess.workloads | toYaml | nindent 8 }}
      {{- end }}
{{- end }}
