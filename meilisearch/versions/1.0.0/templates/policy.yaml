kind: policy
name: {{ include "meilisearch.policy.name" . }}
description: Meilisearch master-key secret access
tags: {{- include "meilisearch.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "meilisearch.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ .Values.auth.secretName }}
