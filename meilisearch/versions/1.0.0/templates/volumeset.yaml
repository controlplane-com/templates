kind: volumeset
name: {{ include "meilisearch.volume.name" . }}
gvc: {{ .Values.global.cpln.gvc }}
description: Meilisearch data directory (LMDB index, Meilisearch snapshots, dumps)
tags: {{- include "meilisearch.tags" . | nindent 4 }}
spec:
  # ext4 block device, never the shared/NFS class — upstream advises explicitly
  # against network-mounted storage for the memory-mapped LMDB index.
  fileSystemType: ext4
  initialCapacity: {{ .Values.volumeset.capacity }}
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: {{ .Values.backup.retention | quote }}
    {{- if .Values.backup.enabled }}
    schedule: {{ .Values.backup.schedule | quote }}
    {{- end }}
