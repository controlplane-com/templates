# Feature checks for the metabase template. Each runs after install (and after each upgrade) on every version
# in its since/until range. Add a check with `since: <new version>` for every change you ship. Placeholders:
# {release} {gvc} {org} {version} {installed_version}, and the baseline vars (pg_user, pg_password, pg_db,
# admin_email, admin_password).
#
# Every check runs in a Patroni member, which carries curl and psql. Database checks go through the HAProxy
# endpoint, the address Metabase uses, so they only pass when the proxy routes to the current leader.
checks:
  - id: app-healthy
    description: >-
      Metabase answers on its internal port: /api/health is ok and the first-boot setup has created the admin
      (has-user-setup), which only a running, set-up app reports.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        U=http://{release}-metabase.{gvc}.cpln.local:3000
        curl -s -m 10 "$U/api/health" 2>&1; echo
        curl -s -m 10 "$U/api/session/properties" | grep -o '"has-user-setup":[a-z]*'
    expect:
      stdout: '(?s)"status"\s*:\s*"ok".*"has-user-setup":true'
    retries: 12
    retryDelaySeconds: 15

  - id: admin-login
    description: The admin signs in with the email and password from the prerequisite secret and gets a session.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 15 -H 'Content-Type: application/json' \
          -d '{"username":"{admin_email}","password":"{admin_password}"}' \
          http://{release}-metabase.{gvc}.cpln.local:3000/api/session 2>&1
    expect:
      stdout: '"id"\s*:\s*"[0-9a-f-]+"'
    retries: 6
    retryDelaySeconds: 15

  - id: rejects-unknown-login
    description: >-
      A sign-in as an unknown user is refused (the control for admin-login; an unknown user, so failed attempts
      never throttle the real admin).
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 15 -H 'Content-Type: application/json' \
          -d '{"username":"e2e-nobody@example.com","password":"wrong-password1"}' \
          http://{release}-metabase.{gvc}.cpln.local:3000/api/session 2>&1
    expect:
      stdout: '"errors"'
      notStdout: '"id"\s*:\s*"[0-9a-f-]+"'

  - id: state-in-postgres
    description: Metabase keeps its application data in the bundled PostgreSQL, where the admin account is a superuser.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        out=$(psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select email from core_user where is_superuser" 2>&1)
        # expect patterns are not placeholder-filled, so the comparison happens here
        printf '%s\n' "$out" | grep -qxF '{admin_email}' && echo ADMIN_IS_SUPERUSER || echo "NO ADMIN MATCH: $out"
    expect:
      stdout: "^ADMIN_IS_SUPERUSER$"
    retries: 6
    retryDelaySeconds: 15

  - id: rejects-bad-password
    description: A wrong database password is refused through the proxy (the control for the checks above).
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        PGPASSWORD=wrong-password psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -c "select 1" 2>&1
        echo "EXIT=$?"
    expect:
      stdout: "password authentication failed"
      notStdout: "^EXIT=0$"

  - id: write-read-via-proxy
    description: A row written as Metabase's database user through the proxy reads back.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        set -e
        export PGPASSWORD='{pg_password}'
        P={release}-postgres-ha-proxy.{gvc}.cpln.local
        M="e2e-$(date +%s%N)"
        psql -h "$P" -U {pg_user} -d {pg_db} -v ON_ERROR_STOP=1 -qtA \
          -c "create table if not exists e2e (id serial primary key, version text not null, marker text not null)" \
          -c "insert into e2e (version, marker) values ('{version}', '$M')" >/dev/null
        psql -h "$P" -U {pg_user} -d {pg_db} -qtA -c "select marker from e2e where marker = '$M'" | grep -qx "$M" && echo "READ $M"
    expect:
      stdout: "^READ e2e-"
    retries: 6
    retryDelaySeconds: 15

  - id: data-survives-upgrade
    description: >-
      The row written on the version this scenario installed first is still there. On a fresh install that is
      the same version; after an upgrade it proves the database carried over.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        n=$(psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select count(*) from e2e where version = '{installed_version}'" 2>&1)
        [ "${n:-0}" -ge 1 ] 2>/dev/null && echo PERSISTED || echo "MISSING (rows for {installed_version}: ${n:-none})"
    expect:
      stdout: "^PERSISTED$"
    retries: 4

  - id: pgvector-0-8-7-available
    description: >-
      The HA database runs patroni-postgres 0.8, whose pgvector is 0.8.7 (CVE-2026-103484), the image 1.5.1
      moved to. Read on the leader, through the proxy.
    issue: "#5376"
    since: 1.5.1
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select 'AVAIL ' || default_version from pg_available_extensions where name = 'vector'" 2>&1
    expect:
      stdout: "^AVAIL 0\\.8\\.7$"
    # After an upgrade the members restart one by one and the proxy can briefly reach a member still on the
    # old image, and helm returns while the old leader (restarted last, ~4 min in) is still on 0.7; this
    # runs long enough for the whole rollout to finish.
    retries: 20
    retryDelaySeconds: 30
