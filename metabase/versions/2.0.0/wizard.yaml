# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Metabase

# Metabase itself is stateless, but both bundled databases are single-location stateful workloads with no
# location handling: postgres brings this limit with its import, and postgres-highly-available (no
# descriptor of its own, so its keys are parent fields below) needs the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 4.0.2
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: dbserver
    steps:
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Chosen in the Database step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # Metabase connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
      # The server step (image and compute) is bound in the parent's Database server step, so its upgrade note,
      # cross-major warning and image migration name this chart's README section; the child's checks are
      # restated there.
      - image
      - resources
    override:
      internalAccess.type:
        description: >-
          Metabase connects to its database like any other workload: keep Same GVC, or add the Metabase
          workload under Allowed workloads.

  - template: postgres-highly-available
    version: 3.0.0
    alias: postgresHA
    when: self.postgresHA.enabled
    title: Highly available PostgreSQL
    after: dbserver
    steps:
      - { id: cluster, title: Database cluster, description: The Patroni-managed PostgreSQL members Metabase stores its app data in. }
      - { id: storage, title: Database storage }
      - { id: etcd, title: Database consensus }
      - { id: network, title: Database network }
      - id: backup
        title: Database backups
        description: >-
          Optional backups to object storage. Uninstalling the release deletes the database volumes, so turn
          this on if your questions, dashboards and users matter.
    exclude:
      # Named in the Database step, next to the single-instance mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # Metabase connects to the HAProxy leader endpoint directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      multiZone:
        description: >-
          Applies to the PostgreSQL members and their HAProxy workloads. Confirm that your location supports
          multiple zones.
      internal_access.type:
        description: >-
          Metabase connects through the HAProxy endpoint like any other workload: keep Same GVC, or add the
          Metabase workload under Allowed workloads.

steps:
  - id: metabase
    title: Metabase
    description: The Metabase image, its compute, and the prerequisite admin and encryption-key secrets.
    sections:
      - title: Server
        docs: "#metabase-instance"
        fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Metabase runs a single replica, so an upgrade restarts it and the UI is briefly unavailable.
          - path: image
            type: string
            format: image
            label: Metabase image
            required: true
            help: Use the open-source `metabase/metabase` image; the Pro/Enterprise image is not supported.
          - path: resources
            type: resources
            label: Resources
            required: true
            description: The JVM heap is sized to 75% of the memory limit.
            cpu: { min: 250m }
            memory: { min: 1Gi }
        rules:
          - rule: "!has(self.resources.cpu) && !has(self.resources.memory)"
            mirrors: metabase.validateResourceKnobs
            paths: [resources]
            message: >-
              resources.cpu and resources.memory were renamed to resources.maxCpu and resources.maxMemory in
              1.4.0. Remove the old keys from the values.
      - title: Admin account and encryption key
        docs: "#admin-account-and-encryption-key"
        fields:
          - type: note
            severity: warning
            text: >-
              Both secrets must exist **before** you install. If one is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: admin.secretName
            type: ref
            label: Admin secret
            required: true
            description: A dictionary secret with the keys `email` and `password`.
            help: >-
              The password needs letters and digits and at least 8 characters, and neither value may contain a
              double quote or a backslash. Used on first boot only: change the password in the Metabase UI
              afterwards.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [email, password]
              create:
                suggestName: "context.releaseName + '-metabase-admin'"
          - path: admin.firstName
            type: string
            label: Admin first name
            required: true
          - path: admin.lastName
            type: string
            label: Admin last name
            required: true
          - path: siteName
            type: string
            label: Site name
            required: true
            description: The instance name shown in the UI and in emails.
          - path: encryptionKey.secretName
            type: ref
            label: Encryption key secret
            required: true
            description: An opaque secret holding a random string of at least 16 characters.
            help: >-
              Encrypts saved database connections. Back it up: losing or changing it means re-entering every
              saved connection.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                suggestName: "context.releaseName + '-metabase-encryption-key'"
        rules:
          - rule: "!has(self.admin.email) && !has(self.admin.password)"
            mirrors: metabase.validateAdmin
            paths: [admin.secretName]
            message: >-
              admin.email and admin.password were removed in 1.1.0. Put them in the admin secret and remove
              them from the values.
          - rule: >-
              !(self.admin.firstName.contains('"') || self.admin.firstName.contains('\\') ||
              self.admin.lastName.contains('"') || self.admin.lastName.contains('\\') ||
              self.siteName.contains('"') || self.siteName.contains('\\'))
            mirrors: metabase.validate
            paths: [admin.firstName, admin.lastName, siteName]
            message: >-
              The admin names and the site name must not contain a double quote or a backslash: they are
              embedded in the first-boot setup request.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Metabase inside Control Plane.
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        docs: "#access"
        description: The UI and the API on the canonical endpoint.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: metabase.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: database
    title: Database
    description: Which PostgreSQL runs Metabase's data, and the prerequisite secret with its credentials.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            docs: "#app-database"
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
            rules:
              - rule: self.postgresHA.enabled != self.postgres.enabled
                mirrors: metabase.validate
                message: Enable exactly one database, either the highly available or the single-instance PostgreSQL.
          # Declared so the imports' conditions are fields; the chooser above writes them, so they are never shown.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            when: self.postgres.enabled == null   # never shown: the Database choice writes it
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            when: self.postgresHA.enabled == null   # never shown: the Database choice writes it
            description: Set by the database choice above.
      - title: Credentials
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '2.0.0') < 0 &&
              self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
            text: >-
              Before you upgrade, update the IAM policy of your backup bucket to the action list in the README
              (AWS S3). The backup identity no longer carries `cpln-connector` or `aws::ReadOnlyAccess`, so with the
              old policy the backups fail.
          - type: note
            severity: warning
            text: >-
              The database credentials secret must exist **before** you install; if it is missing, the
              deployment waits and `cpln logs` shows nothing at all.
          - path: postgresHA.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            when: self.postgresHA.enabled
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data is first initialized, and Metabase connects with
              them. To change the password later, change it in the database first, then update the secret and
              force a redeployment.
              In HA mode the order differs: move the leader to member -0 first (see the README's HA rotation steps).
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-metabase-db-credentials'"
          - path: postgres.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            when: self.postgres.enabled
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data directory is first initialized, and Metabase
              connects with them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then
              update the secret and force a redeployment.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-metabase-db-credentials'"
        rules:
          - rule: >-
              (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != null &&
              (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != ''
            mirrors: metabase.validateDatabaseSecret
            paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
            message: The database credentials secret is required.
          - rule: "!has(self.postgres.credentials)"
            mirrors: metabase.validateDatabaseSecret
            paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
            message: >-
              postgres.credentials was removed in 1.5.0: the database credentials are now a prerequisite
              dictionary secret named by the credentials secret field. Remove postgres.credentials from the values.
          # Upgrading from 1.4.0 or earlier, the chart-created secret is deleted by the upgrade itself, so the new
          # prerequisite secret must have a different name (holding the same username, password and database).
          - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.5.0') < 0
            rule: >-
              (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) !=
              (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
            paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
            message: >-
              The previous version created the database secret itself, and this upgrade deletes it. Create a secret
              under a NEW name holding the same username, password and database, and name it here.
          - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.5.0') >= 0)
            rule: >-
              (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) ==
              (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
            severity: info
            paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
            message: >-
              PostgreSQL reads the credentials only when its data is first initialized; pointing at another secret
              does not change the existing user or password.

  # The single-instance PostgreSQL's image and compute, bound here instead of in the imported Server step (the
  # postgres import excludes these paths); the checks of the postgres descriptor are restated below.
  - id: dbserver
    title: Database server
    description: The Postgres image and the compute of the single-instance database's stateful replica.
    when: self.postgres.enabled
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts the database server. Nothing limits the rollout of a stateful workload, so
              plan a short write outage.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.0.0') < 0
            text: >-
              New installs of this version run PostgreSQL 19. This release keeps the major its database was
              created with, so the image below stays on it. Moving the data to 19 is a dump and restore into a new
              release; see Upgrading from 1.x in the README.
          - path: postgres.image
            type: string
            format: image
            label: Postgres image
            required: true
            help: >-
              New installs run `postgres:19`; `postgres:18` and `postgres:17` also work. The data directory is
              specific to a major version: on an existing volume, an image of another major does not start, and
              the database logs the image to set instead.
          - path: postgres.resources
            type: resources
            label: Postgres resources
            required: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: >-
              oldSelf == null || !has(oldSelf.postgres.image) || imageMajor(self.postgres.image) < 0 ||
              imageMajor(oldSelf.postgres.image) < 0 || imageMajor(self.postgres.image) == imageMajor(oldSelf.postgres.image)
            severity: warning
            paths: [postgres.image]
            messageExpression: >-
              'This release\'s data directory is PostgreSQL ' + string(imageMajor(oldSelf.postgres.image)) +
              '; a PostgreSQL ' + string(imageMajor(self.postgres.image)) + ' image refuses to start on it. Keep the image at ' +
              oldSelf.postgres.image + ', or move to PostgreSQL ' + string(imageMajor(self.postgres.image)) +
              ' with a dump and restore into a new release (README, Upgrading from 1.x).'
            message: >-
              The data directory belongs to the installed Postgres major version; an image of a different major
              refuses to start on it. Keep the installed image, or move with a dump and restore into a new release
              (README, Upgrading from 1.x).

# Rules over values outside the steps and over the imported values: their issues show on the fields named in
# paths. Rules without paths only trip on YAML edits (the Database choice writes the hidden switches); they
# block Install and show on Review.
rules:
  # metabase.validatePostgresHAImage also refuses tags 0.1-0.7; the import's own image rule says that, so this
  # one keeps only the check the child does not make. The field is required, so it shows only in YAML mode.
  - rule: "!self.postgresHA.enabled || (has(self.postgresHA.image) && self.postgresHA.image != '')"
    mirrors: metabase.validatePostgresHAImage
    paths: [postgresHA.image]
    message: Set postgresHA.image to controlplanecorporation/patroni-postgres:0.9, or remove it from the values to use the chart default.
  - rule: >-
      !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
      dyn(self.postgresHA)['proxy']['enabled'] == true
    mirrors: metabase.validate
    message: postgresHA.proxy.enabled must stay true; the HAProxy leader endpoint is Metabase's database endpoint.
  - rule: "!has(self.postgresHA.postgres)"
    message: >-
      postgresHA.postgres was removed in 1.3.0: put its username, password and database in the database
      credentials secret and remove the block from the values.
  # The postgres import's own rule for these keys is dropped with the excluded secret field, so it is repeated here.
  - rule: >-
      !self.postgres.enabled || (!has(self.postgres.config.username) && !has(self.postgres.config.password) &&
      !has(self.postgres.config.database))
    paths: [postgres.config.credentialsSecretName]
    message: >-
      postgres.config.username, password and database were removed in 1.2.0: put them in the database
      credentials secret and remove them from the values.
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Metabase, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-metabase') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-metabase, or Metabase cannot reach its database.'"
    message: Add the Metabase workload to the list, or Metabase cannot reach its database.
  - when: self.postgresHA.enabled
    rule: self.postgresHA.internal_access.type != 'none'
    paths: [postgresHA.internal_access.type]
    message: '"None" also blocks Metabase, which connects to the HAProxy endpoint like any other workload.'
  - when: self.postgresHA.enabled && self.postgresHA.internal_access.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-metabase') in self.postgresHA.internal_access.workloads
    severity: warning
    paths: [postgresHA.internal_access.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-metabase, or Metabase cannot reach its database.'"
    message: Add the Metabase workload to the list, or Metabase cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Metabase connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.
  - path: postgresHA.pgbouncer
    reason: Metabase connects to the HAProxy leader endpoint directly, so a PgBouncer in front of it would sit unused.

migrations:
  # A 1.x release that never set postgres.image runs postgres:18 (1.x's default), and its data directory is
  # PostgreSQL 18. Carry-over would hand it the new default postgres:19, which refuses to start on that data:
  # keep the installed image instead. Claims the postgres import's own image migration (the import excludes
  # `image` and binds it in Database server), so the note names this chart's README section. No 1.x
  # values.yaml sets postgres.image (the subchart's postgres:18 applied), hence the fallback.
  - fromVersions: ">=1.0.0 <2.0.0"
    to: postgres.image
    valueExpr: "has(self.postgres.image) && self.postgres.image != '' ? self.postgres.image : 'postgres:18'"
    note: >-
      The database keeps the PostgreSQL major it was created with, so the installed image is kept (Database
      server, Postgres image). To move to PostgreSQL 19, dump and restore into a new release (README, Upgrading
      from 1.x).
  - fromVersions: "<1.5.0"
    from: postgres.credentials
    note: >-
      This setting served both database modes (single-instance and HA). The database credentials are now a
      prerequisite dictionary secret (username, password, database). Create it under a NEW name with the values the
      database was initialized with, and choose it under Database.
  - fromVersions: "<1.4.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<1.4.0"
    from: resources.memory
    to: resources.maxMemory
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.0"
    from: postgresHA.postgres
    note: >-
      Put the username, password and database the HA database was initialized with in the database
      credentials secret, and choose it under Database.
  - fromVersions: "<1.2.0"
    from: postgres.config.username
    note: Put it in the database credentials secret (key username); choose the secret under Database.
  - fromVersions: "<1.2.0"
    from: postgres.config.password
    note: Put it in the database credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.2.0"
    from: postgres.config.database
    note: Put it in the database credentials secret (key database); choose the secret under Database.
  - fromVersions: "<1.1.0"
    from: admin.email
    note: The admin login moved into the admin secret (keys email and password); choose it under Metabase.
  - fromVersions: "<1.1.0"
    from: admin.password
    note: The admin login moved into the admin secret (keys email and password); choose it under Metabase.
