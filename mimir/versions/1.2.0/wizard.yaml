# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Grafana Mimir
# A stateful workload with no location handling: every GVC location would run its own Mimir, all
# writing to the one bucket.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: storage
    title: Object storage
    description: The bucket that holds the metric blocks, and how Mimir reaches it.
    sections:
      - fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && oldSelf != null &&
              (self.storage.type != oldSelf.storage.type ||
              (self.storage.type == 'aws' && self.storage.aws.bucket != oldSelf.storage.aws.bucket) ||
              (self.storage.type == 'gcp' && self.storage.gcp.bucket != oldSelf.storage.gcp.bucket) ||
              (self.storage.type == 'minio' && (self.storage.minio.bucket != oldSelf.storage.minio.bucket ||
              self.storage.minio.endpoint != oldSelf.storage.minio.endpoint)))
            text: >-
              This points Mimir at another bucket. The metrics already stored in the old bucket are not
              copied, so queries no longer see them. A switch
              between AWS S3 and Google Cloud Storage leaves the previous cloud access on the identity; only a
              reinstall removes it.
            textExpression: >-
              'This points Mimir at another bucket. The metrics already stored in the old bucket are not ' +
              'copied, so queries no longer see them. A switch ' +
              'between AWS S3 and Google Cloud Storage leaves the previous cloud access on the identity; only a ' +
              'reinstall removes it.'
          - path: storage.type
            type: enum
            label: Storage backend
            widget: cards
            required: true
            description: >-
              Metric blocks live in this bucket, not on the volume, so the bucket must exist before you
              install. Reinstalling against the same bucket resumes with its data.
            docs: "#object-storage"
            options:
              - value: aws
                label: AWS S3
                description: Keyless, through a Control Plane cloud account and an AWS IAM policy.
              - value: gcp
                label: Google Cloud Storage
                description: Keyless, through a Control Plane cloud account.
              - value: minio
                label: S3-compatible
                description: MinIO, R2, Wasabi and others, with access keys from a secret.
      - title: AWS S3
        when: self.storage.type == 'aws'
        fields:
          - type: note
            severity: warning
            text: >-
              The bucket, the AWS cloud account and the IAM policy must exist **before** the release uses
              them, on install or when you switch storage. See
              [Prerequisites](/template-catalog/templates/mimir#prerequisites) for the steps.
          - path: storage.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: storage.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
            description: The AWS region the bucket was created in; the S3 endpoint is built from it.
          - path: storage.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) for the AWS account that holds the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              The policy needs `s3:ListBucket`, `s3:GetObject`, `s3:PutObject` and `s3:DeleteObject` on the
              bucket and on its objects; [Prerequisites](/template-catalog/templates/mimir#prerequisites) has
              the JSON. Enter the bare policy name, not its ARN.
            pattern: '^[A-Za-z0-9+=,.@_-]+$'
            patternMessage: "Enter the bare name of your IAM policy, using letters, digits and + = , . @ _ -."
      - title: Google Cloud Storage
        when: self.storage.type == 'gcp'
        fields:
          - type: note
            severity: warning
            text: >-
              The bucket and the GCP cloud account must exist **before** the release uses them, on install or
              when you switch storage. See [Prerequisites](/template-catalog/templates/mimir#prerequisites)
              for the steps.
          - path: storage.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: storage.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) for the project that holds the bucket. The
              template grants the workload `roles/storage.objectAdmin` on that bucket only.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
      - title: S3-compatible
        when: self.storage.type == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
              The bucket and the access keys secret must exist **before** the release uses them, on install or
              when you switch storage. If the secret is missing, the deployment waits and `cpln logs` shows
              nothing at all: the reason is in `status.versions[].message` of
              `cpln workload get-deployments RELEASE_NAME-mimir --gvc GVC_NAME -o yaml`. It recovers on its own
              within about 10 minutes of the secret existing, or at once with
              `cpln workload force-redeployment RELEASE_NAME-mimir --gvc GVC_NAME`.
            textExpression: >-
              'The bucket and the access keys secret must exist **before** the release uses them, on install or ' +
              'when you switch storage. If the secret is missing, the deployment waits and `cpln logs` shows ' +
              'nothing at all: the reason is in `status.versions[].message` of `cpln workload get-deployments ' +
              context.releaseName + '-mimir --gvc ' + (context.gvc != null ? context.gvc : 'GVC_NAME') +
              ' -o yaml`. It recovers on its own within about 10 minutes of the secret existing, or at once with ' +
              '`cpln workload force-redeployment ' + context.releaseName + '-mimir --gvc ' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + '`.'
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.2.0') < 0
            text: >-
              1.2.0 moved the access keys out of the values into the access keys secret. **Before you
              upgrade**, read the keys this release uses today: `cpln secret reveal RELEASE_NAME-mimir-config -o yaml`
              shows them in the configuration as `access_key_id` and `secret_access_key`. Put them in the secret
              as `accessKey` and `secretKey`. If the deployment then reports it is not allowed to reveal the
              secret, wait about 5 minutes and run
              `cpln workload force-redeployment RELEASE_NAME-mimir --gvc GVC_NAME`. See
              [Upgrading from 1.1.0](/template-catalog/templates/mimir#upgrading-from-1-1-0).
            textExpression: >-
              '1.2.0 moved the access keys out of the values into the access keys secret. **Before you ' +
              'upgrade**, read the keys this release uses today: `cpln secret reveal ' + context.releaseName +
              '-mimir-config -o yaml` shows them in the configuration as `access_key_id` and `secret_access_key`. ' +
              'Put them in the secret as `accessKey` and `secretKey`. If the deployment then reports it is not ' +
              'allowed to reveal the secret, wait about 5 minutes and run `cpln workload force-redeployment ' +
              context.releaseName + '-mimir --gvc ' + (context.gvc != null ? context.gvc : 'GVC_NAME') + '`. See ' +
              '[Upgrading from 1.1.0](/template-catalog/templates/mimir#upgrading-from-1-1-0).'
          - path: storage.minio.endpoint
            type: string
            label: S3 endpoint
            required: true
            example: true
            placeholder: WORKLOAD_NAME.GVC_NAME.cpln.local:9000
            description: >-
              The S3 API address as host and port, without `http://` or `https://`. For a server running in
              Control Plane, use its fully qualified internal name.
          - path: storage.minio.insecure
            type: boolean
            label: Plain HTTP endpoint
            description: >-
              On for an endpoint without TLS, such as a MinIO in this GVC. Turn it off for R2, Wasabi and
              other HTTPS services.
          - path: storage.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.minio.region
            type: string
            label: Region
            placeholder: us-east-1
          - path: storage.minio.credentialsSecretName
            type: ref
            label: Access keys secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            help: >-
              Mimir receives the keys as `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`. To use new keys
              later, update the secret and run `cpln workload force-redeployment` on the Mimir workload; the
              running replicas keep the old keys until then. Create the secret with:
              `cpln secret create-dictionary --name SECRET_NAME --entry accessKey='YOUR-ACCESS-KEY' --entry secretKey='YOUR-SECRET-KEY'`
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
              create:
                suggestName: "context.releaseName + '-mimir-minio-credentials'"
        rules:
          - rule: "!self.storage.minio.endpoint.contains('://')"
            mirrors: mimir.validate
            paths: [storage.minio.endpoint]
            message: Enter the S3 endpoint as host:port, without http:// or https://. Use Plain HTTP endpoint for a server without TLS.
          - rule: self.storage.minio.credentialsSecretName != null && self.storage.minio.credentialsSecretName != ''
            mirrors: mimir.validateObjstoreCreds
            paths: [storage.minio.credentialsSecretName]
            message: The access keys secret is required for S3-compatible storage.
          - rule: "!has(self.storage.minio.accessKey) && !has(self.storage.minio.accessSecret)"
            mirrors: mimir.validateObjstoreCreds
            paths: [storage.minio.credentialsSecretName]
            message: >-
              storage.minio.accessKey and storage.minio.accessSecret were removed in 1.2.0, and the chart
              refuses them. Put the keys in the access keys secret as accessKey and secretKey, and remove both
              from the values.

  - id: server
    title: Server
    description: The Mimir image, its replicas and compute, and the volume each replica keeps.
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade' && self.replicas == 1
            text: >-
              When an upgrade restarts Mimir, a single replica interrupts ingest and queries for about a
              minute. Prometheus remote write clients buffer and retry through it.
          - path: image
            type: string
            format: image
            label: Mimir image
            required: true
            docs: "#image-and-resources"
          - path: replicas
            type: integer
            label: Replicas
            min: 1
            required: true
            suggestions: [1, 3, 5]
            description: >-
              One runs a single instance. Three or more form a cluster that replicates every write three
              ways, so pushes and queries continue through a replica loss or a rolling restart.
            docs: "#scaling-and-availability"
          - path: resources
            type: resources
            label: Resources
            required: true
            description: Per replica. Memory bounds how many active series Mimir can ingest.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
      - title: Volume
        docs: "#volume-set"
        fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250]
            description: >-
              Per replica, for the ingester write-ahead log and the compactor's workspace. The metric blocks
              themselves live in the bucket. Can be raised later, never lowered.
    rules:
      - rule: self.replicas == 1 || self.replicas >= 3
        mirrors: mimir.validate
        paths: [replicas]
        message: Set the replicas to 1, or to 3 or more. Two replicas have no failure tolerance under three-way replication.
      - rule: "!has(self.resources.cpu) && !has(self.resources.memory)"
        mirrors: mimir.validateResourceKnobs
        paths: [resources]
        message: >-
          resources.cpu and resources.memory were renamed to resources.maxCpu and resources.maxMemory in
          1.1.0, and the chart refuses the old names. Move the values to the new keys and remove the old ones.
      - when: oldSelf != null && oldSelf.replicas == 1 && self.replicas >= 3
        rule: "false"
        severity: info
        paths: [replicas]
        message: >-
          After a live scale-up from 1 replica, metrics written shortly before it can be missing from some
          query results for up to about 12 hours. No data is lost and new writes are unaffected; scale up at a
          quiet time if that matters.
      - rule: oldSelf == null || oldSelf.volumeset.capacity == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volumes.

  - id: data
    title: Tenancy and retention
    description: Whether clients name a tenant on every request, and how long metric blocks are kept.
    sections:
      - fields:
          - type: note
            severity: info
            when: >-
              context.mode == 'upgrade' && oldSelf != null &&
              (self.multitenancy.enabled != oldSelf.multitenancy.enabled ||
              self.retention.period != oldSelf.retention.period)
            text: >-
              The replicas restart to apply this change; with one replica, ingest and queries pause briefly
              while it comes back.
      - title: Tenancy
        docs: "#tenancy"
        fields:
          - path: multitenancy.enabled
            type: boolean
            label: Require a tenant on every request
            description: >-
              Every push and query must then send the header `X-Scope-OrgID: <tenant>`, and requests without it
              are rejected. Tenants need no provisioning. The header separates tenants; it does not
              authenticate anyone.
        rules:
          - when: oldSelf != null && !oldSelf.multitenancy.enabled && self.multitenancy.enabled
            rule: "false"
            severity: info
            paths: [multitenancy.enabled]
            message: >-
              Add the X-Scope-OrgID header to every collector's remote write configuration and to every
              Grafana data source first; once this takes effect, their requests without it are rejected.
      - title: Retention
        docs: "#retention"
        fields:
          - path: retention.period
            type: string
            label: Keep metric blocks for
            required: true
            suggestions: ["0", 30d, 90d, 13w, 1y]
            description: >-
              `0` keeps data forever. The compactor enforces it, so a shorter period also deletes existing
              blocks that are older.
            pattern: '^(0|[0-9]+(ms|s|m|h|d|w|y))$'
            patternMessage: Enter 0, or a number with one unit such as 30d, 13w or 1y.
        rules:
          - when: oldSelf != null && self.retention.period != oldSelf.retention.period
            rule: "false"
            severity: info
            paths: [retention.period]
            message: >-
              The new retention applies to the blocks already in the bucket too: a shorter period deletes the
              older ones.

  - id: network
    title: Network
    description: Which workloads can push metrics to Mimir and query it.
    sections:
      - title: Access
        docs: "#internal-access"
        fields:
          - type: note
            severity: info
            text: >-
              Collectors push to `http://RELEASE_NAME-mimir.GVC_NAME.cpln.local:8080/api/v1/push`, and PromQL
              clients such as Grafana query `http://RELEASE_NAME-mimir.GVC_NAME.cpln.local:8080/prometheus`.
            textExpression: >-
              'Collectors push to `http://' + context.releaseName + '-mimir.' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + '.cpln.local:8080/api/v1/push`, and PromQL ' +
              'clients such as Grafana query `http://' + context.releaseName + '-mimir.' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') + '.cpln.local:8080/prometheus`.'
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: >-
              Mimir has no authentication of its own, so this template never publishes it to the internet.
              Access changes take a few minutes to take effect.
            options:
              - value: none
                label: None
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          # The chart writes inboundAllowWorkload only with workload-list (workload.yaml).
          - path: internalAccess.workloads
            when: self.internalAccess.type == 'workload-list'
            type: list
            label: Allowed workloads
            widget: tags
            unique: true
            description: >-
              The only workloads allowed to connect, including this release's own Mimir workload when it runs
              more than one replica (the replicas reach each other through it).
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: mimir.validate
        paths: [internalAccess.type]
        message: Choose None, Same GVC, Same org or Specific workloads.
      - when: self.internalAccess.type == 'workload-list'
        rule: size(self.internalAccess.workloads) > 0
        severity: warning
        paths: [internalAccess.workloads]
        message: List at least one workload when Mimir is open to specific workloads, or none can connect.
      # Same mechanism as weaviate 1.1.1 (measured 2026-10-23): replicas of one workload reach each other
      # through its own firewall, which workload-list without the workload itself closes. Mimir 3+ replicas
      # join through RELEASE-mimir.GVC.cpln.local:7946 (_helpers.tpl memberlist.join_members).
      - when: self.internalAccess.type == 'workload-list' && context.gvc != null && self.replicas > 1
        rule: >-
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-mimir') in self.internalAccess.workloads
        severity: warning
        paths: [internalAccess.workloads]
        messageExpression: >-
          'The Mimir replicas reach each other through their own workload, and the chart does not add it to the list. Add //gvc/' +
          context.gvc + '/workload/' + context.releaseName + '-mimir, or the replicas cannot form one cluster.'
        message: >-
          The Mimir replicas reach each other through their own workload, and the chart does not add it to the
          list. Add this release's Mimir workload, or the replicas cannot form one cluster.
        fix:
          path: internalAccess.workloads
          items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-mimir']"
      - when: self.internalAccess.type == 'none'
        rule: "false"
        severity: info
        paths: [internalAccess.type]
        messageExpression: >-
          'With None, no collector can push metrics and no client can query them.' +
          (self.replicas > 1 ? ' The replicas also reach each other through their own workload, which None may close: ' +
          'to limit access with more than one replica, prefer Specific workloads with the Mimir workload of this release in the list.' : '')
        message: With None, no collector can push metrics and no client can query them.

migrations:
  # 1.1.0 named the limits maxCpu and maxMemory; the defaults (1000m, 2Gi) did not change.
  - { fromVersions: "<1.1.0", from: resources.cpu, to: resources.maxCpu }
  - { fromVersions: "<1.1.0", from: resources.memory, to: resources.maxMemory }
  # 1.2.0 moved the S3-compatible keys into a prerequisite secret.
  - fromVersions: "<1.2.0"
    from: storage.minio.accessKey
    note: >-
      S3-compatible access keys moved to a dictionary secret with the keys accessKey and secretKey; choose it
      under Object storage when the storage backend is S3-compatible. Nothing to do for AWS S3 or Google Cloud
      Storage.
  - fromVersions: "<1.2.0"
    from: storage.minio.accessSecret
    note: >-
      S3-compatible access keys moved to a dictionary secret with the keys accessKey and secretKey (put the
      old accessSecret under secretKey); choose it under Object storage when the storage backend is
      S3-compatible. Nothing to do for AWS S3 or Google Cloud Storage.
