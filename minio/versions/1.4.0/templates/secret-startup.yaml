{{- include "minio.validate" . -}}
kind: secret
name: {{ include "minio.secretStartup.name" . }}
description: MinIO startup config
tags: {{- include "minio.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    INDEX=${HOSTNAME##*-}
    LOCATION=$(basename "${CPLN_LOCATION}")
    DOMAIN="{{ include "minio.name" . }}.${LOCATION}.{{ .Values.global.cpln.gvc }}.cpln.local"

    # Append mapping (LOCAL_IP already provided by default variable)
    echo "$LOCAL_IP replica-${INDEX}.${DOMAIN}" >> /etc/hosts

    # Build distributed server list dynamically
    SERVER_ARGS=""
    {{- $replicas := int .Values.replicas }}
    {{- range $i, $ := until $replicas }}
    SERVER_ARGS="$SERVER_ARGS http://replica-{{ $i }}.${DOMAIN}/data"
    {{- end }}

    echo "Starting MinIO node index $INDEX with endpoints:"
    echo "$SERVER_ARGS"

    # Silo (the fork the chart pins) installs its server binary as `silo`; an upstream MinIO image
    # installs it as `minio`. Run whichever this image has.
    BIN=$(command -v silo || command -v minio) || { echo "[minio] FATAL: neither silo nor minio is on PATH in image ${CPLN_IMAGE:-?}" >&2; exit 1; }
    exec "$BIN" server \
      $SERVER_ARGS \
      --console-address :9001