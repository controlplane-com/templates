{{- include "minio.validate" . -}}
kind: workload
name: {{ include "minio.name" . }}
description: MinIO
tags: {{- include "minio.tags" . | nindent 4 }}
spec:
  type: stateful
  containers:
    - name: minio
      command: "/bin/bash"
      args:
        - "/minio/start.sh"
      env:
        - name: LOCAL_IP
          value: cpln://reference/status.podIP
        # The root credentials come from the user-created prerequisite secret, so
        # no MinIO access key or secret key is ever written into the Helm release.
        - name: MINIO_ROOT_PASSWORD
          value: cpln://secret/{{ .Values.admin.credentialsSecretName }}.password
        - name: MINIO_ROOT_USER
          value: cpln://secret/{{ .Values.admin.credentialsSecretName }}.username
      image: {{ .Values.image }}
      inheritEnv: false
      minCpu: {{ .Values.resources.minCpu | quote }}
      minMemory: {{ .Values.resources.minMemory | quote }}
      cpu: {{ .Values.resources.maxCpu | quote }}
      memory: {{ .Values.resources.maxMemory | quote }}
      ports:
        - number: 9000
          protocol: http
        - number: 9001
          protocol: http
      {{- /*
      Readiness must NOT need cluster quorum: a not-ready replica is unreachable
      on the mesh, so a quorum-gated probe would stop peers from ever reaching
      each other on a cold start. /minio/health/ready answers per node (it does
      not wait for the erasure sets); /minio/health/cluster is the quorum check
      and is deliberately not used.
      Startup window ≈ initialDelaySeconds + 30 × periodSeconds (~310 s) for a
      cold start of the whole set; failureThreshold keeps a sick node in
      rotation for only ~30 s.
      */}}
      readinessProbe:
        httpGet:
          path: /minio/health/ready
          port: 9000
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1
      livenessProbe:
        httpGet:
          path: /minio/health/live
          port: 9000
          scheme: HTTP
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 5
        successThreshold: 1
      volumes:
        {{- /* recoveryPolicy is declared on both volumes because the API backfills `retain`. */}}
        - path: /data
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "minio.volumeName" . }}
        - path: /minio/start.sh
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "minio.secretStartup.name" . }}.payload
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "minio.identity.name" . }}
  defaultOptions:
    autoscaling:
      keda:
        cooldownPeriod: 1
        initialCooldownPeriod: 1
        pollingInterval: 1
        triggers: []
      maxConcurrency: 0
      maxScale: {{ .Values.replicas }}
      metric: disabled
      minScale: {{ .Values.replicas }}
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  rolloutOptions:
    {{- /*
    maxUnavailableReplicas is deliberately NOT set: the API DROPS it on a
    stateful workload, so sending it produces permanent drift AND implies a
    rolling-restart limit that is not in force.
    terminationGracePeriodSeconds is declared because the API backfills 90.
    scalingPolicy is Parallel so every node starts at once and the pool can
    reach quorum on a cold start; a rollout still replaces one replica at a
    time and waits for its readiness probe before the next.
    */}}
    maxSurgeReplicas: 25%
    minReadySeconds: 0
    scalingPolicy: Parallel
    terminationGracePeriodSeconds: 90
  firewallConfig:
    {{- /* Every field is declared, empty lists included: the API backfills them,
    so omitting one makes a default install drift from the moment it is created. */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if and .Values.internalAccess.workloads (has .Values.internalAccess.type (list "same-gvc" "workload-list")) }}
      inboundAllowWorkload:
        {{- range .Values.internalAccess.workloads }}
        - {{ . }}
        {{- end }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: true
  supportDynamicTags: false
