# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: MongoDB Cluster
# createsGvc: true. The chart creates its own GVC from gvc.name and gvc.locations (templates/gvc.yaml), so there is
# no target GVC to limit and no gvc block (guide 14.2); the location rules work on gvc.locations instead.

steps:
  - id: topology
    title: GVC and locations
    description: The GVC this release creates, its locations and the replica set members in each. Every member votes.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'install'
        text: >-
          This version creates its own GVC with the name below. Use a name no GVC in the org has: the release
          adopts an existing GVC of that name when no other release manages it (one another release manages is refused), and uninstalling the release then deletes that GVC with every
          workload in it.
      - path: gvc.name
        type: string
        label: GVC name
        required: true
        immutable: >-
          The release runs in the GVC it created; another name would create a new, empty GVC and delete this one
          with every member and volume in it.
        description: The GVC this release creates and runs in. Give every install its own.
        pattern: '^[a-z][a-z0-9-]{0,61}[a-z0-9]$'
        patternMessage: >-
          Use lowercase letters, digits and hyphens, starting with a letter and ending with a letter or digit.
        rules:
          # templates/gvc.yaml (name:) and identity.yaml (gvc:) write the name unquoted.
          - rule: "!(self.gvc.name in ['true', 'false', 'null'])"
            paths: [gvc.name]
            message: This name would be read as a boolean or null; choose another.
          - rule: self.gvc.name != 'mongodb-gvc'
            severity: info
            messageExpression: >-
              'GVC names are org-wide: while another release runs on this name, this install is refused. Give
              each release its own, for example ' + context.releaseName + '-mongodb.'
            message: >-
              GVC names are org-wide: while another release runs on this name, this install is refused. Give
              each release its own.
      - type: note
        textExpression: >-
          sum(self.gvc.locations.map(l, l.replicas)) < 1 ? 'No members configured.' :
          sum(self.gvc.locations.map(l, l.replicas)) > 7 ?
          string(sum(self.gvc.locations.map(l, l.replicas))) + ' members, of which 7 vote; the replica set survives losing 3.' :
          string(sum(self.gvc.locations.map(l, l.replicas))) + ' voting members; the replica set survives losing ' +
          string((sum(self.gvc.locations.map(l, l.replicas)) - 1) / 2) + '.'
      - path: gvc.locations
        type: list
        label: Locations
        required: true
        minItems: 1
        uniqueBy: [name]
        widget: table
        newItem: { name: "", replicas: 1 }
        itemLabel: "item.name + ' × ' + (item.replicas == null ? '?' : string(item.replicas))"
        description: >-
          The locations of the GVC, one entry each; members are the mongod replicas in that location. The
          first location's first member initializes the replica set.
        help: >-
          Before lowering a location's members (or removing a location), remove those members from
          the replica set: connect to the primary and run `rs.remove(...)`.
        item:
          type: object
          fields:
            - path: name
              type: ref
              label: Location
              required: true
              ref: { kind: location, format: name, mustExist: error }
            - path: replicas
              type: integer
              label: Members
              required: true
              min: 1
              widget: stepper
      - path: multiZone
        type: boolean
        label: Spread members across zones
        description: Also applies to HAProxy. Confirm that your locations support multiple zones.
    rules:
      - rule: size(self.gvc.locations) > 0
        mirrors: mongo-cluster.validateLocations
        paths: [gvc.locations]
        message: Add at least one location.
      - rule: self.gvc.locations.all(l, l.replicas == null || l.replicas >= 1)
        mirrors: mongo-cluster.validateLocations
        paths: [gvc.locations]
        message: Every location needs at least 1 member; to stop running in a location, remove it.
      # The chart has no upper bound here; 2.0.0 refuses a total above 7 (briefings/mongodb-cluster.md, CHANGELOG).
      - when: >-
          oldSelf == null ||
          sum(self.gvc.locations.map(l, l.replicas)) > sum(oldSelf.gvc.locations.map(l, l.replicas))
        rule: sum(self.gvc.locations.map(l, l.replicas)) <= 7
        severity: warning
        paths: [gvc.locations]
        message: MongoDB allows at most 7 voting members.
        messageExpression: >-
          'The members add up to ' + string(sum(self.gvc.locations.map(l, l.replicas))) +
          '. MongoDB allows at most 7 voting members and this version adds every member as a voter, so the members
          beyond the seventh run and report ready but never join the replica set. Use 3, 5 or 7 in all; 2.0.0
          refuses more than 7.'
      - when: >-
          oldSelf != null &&
          sum(self.gvc.locations.map(l, l.replicas)) <= sum(oldSelf.gvc.locations.map(l, l.replicas))
        rule: sum(self.gvc.locations.map(l, l.replicas)) <= 7
        severity: info
        paths: [gvc.locations]
        message: >-
          More than 7 members: MongoDB allows at most 7 voting members, so the members beyond the seventh run
          and report ready but are not in the replica set.
      - rule: sum(self.gvc.locations.map(l, l.replicas)) != 2
        severity: info
        paths: [gvc.locations]
        message: >-
          A 2-member replica set has no fault tolerance and is worse than 1: losing either member leaves no
          primary. Use 1 member, or 3 or more.
      - rule: sum(self.gvc.locations.map(l, l.replicas)) != 1
        severity: info
        paths: [gvc.locations]
        message: A single member has no failover.
      - rule: >-
          sum(self.gvc.locations.map(l, l.replicas)) < 4 ||
          sum(self.gvc.locations.map(l, l.replicas)) % 2 == 1
        severity: info
        paths: [gvc.locations]
        message: An even member count adds no fault tolerance over one member fewer; an odd count avoids a split majority.
      - rule: >-
          oldSelf == null ||
          oldSelf.gvc.locations.all(o, self.gvc.locations.exists(l, l.name == o.name && l.replicas >= o.replicas))
        severity: info
        paths: [gvc.locations]
        message: >-
          Fewer members than installed: remove the members from the replica set with `rs.remove(...)`
          on the primary before you upgrade, or elections and quorum are distorted. A removed location also
          leaves the GVC, with the members and volumes that ran there.
      - rule: >-
          oldSelf == null || size(oldSelf.gvc.locations) == 0 || size(self.gvc.locations) == 0 ||
          self.gvc.locations[0].name == oldSelf.gvc.locations[0].name
        severity: info
        paths: [gvc.locations]
        message: >-
          The first location changed. Its first member is the one that initializes the replica set and the
          first host the other members look for, so keep the installed first location first.

  - id: credentials
    title: Credentials
    description: The root user and the replica set key.
    fields:
      - type: note
        severity: warning
        text: >-
          This version takes the credentials and the replica set key as values, so they are stored in the Helm
          release and in two secrets the release creates. 1.1.0 and later read them from secrets you create.
      - path: mongodb.username
        type: string
        label: Username
        required: true
        description: The root user, created in the admin database when the cluster is first initialized.
      - path: mongodb.password
        type: string
        label: Password
        required: true
        sensitive: true
        example: true
        description: The root user's password.
        help: >-
          MongoDB reads it only when the cluster is first initialized. To change it later, run
          `db.changeUserPassword()` on the primary first, then set the same value here.
      - path: mongodb.database
        type: string
        label: Database
        description: >-
          Stored in the credentials secret for your own connection strings; the chart does not create it.
          MongoDB creates a database on its first write.
      - path: mongodb.replicaSetKey
        type: string
        label: Replica set key
        required: true
        sensitive: true
        example: true
        immutable: The key cannot be changed after the cluster is initialized.
        description: >-
          The shared key the members authenticate to each other with: 6 to 1024 characters from the base64
          alphabet. Generate it with `openssl rand -base64 756`. The default is published in the chart, so
          anyone who has it can join a member to your replica set.
    rules:
      # secret-startup.yaml puts the credentials unescaped into mongodb:// URIs (mongosh rejects : / ? # [ ]
      # and misreads @ and %; measured with mongodb-connection-string-url) and into single-quoted JavaScript
      # in db.createUser (a ' is a syntax error, a \ starts an escape); the backup jobs build URIs the same way.
      - when: oldSelf == null || self.mongodb.username != oldSelf.mongodb.username
        rule: >-
          !self.mongodb.username.matches("[:/?#\\[\\]@%'\\\\]")
        severity: warning
        paths: [mongodb.username]
        message: >-
          Leave out : / ? # [ ] @ % ' and \. The startup script and the backup jobs put the username into
          connection strings and a script unescaped, so with them the root user is not created or the other
          members cannot sign in to join the replica set.
      - when: oldSelf == null || self.mongodb.password != oldSelf.mongodb.password
        rule: >-
          !self.mongodb.password.matches("[:/?#\\[\\]@%'\\\\]")
        severity: warning
        paths: [mongodb.password]
        message: >-
          Leave out : / ? # [ ] @ % ' and \. The startup script and the backup jobs put the password into
          connection strings and a script unescaped, so with them the root user is not created or the other
          members cannot sign in to join the replica set.
      - rule: oldSelf == null || self.mongodb.password == oldSelf.mongodb.password
        severity: info
        paths: [mongodb.password]
        message: >-
          MongoDB reads the password only when the cluster is first initialized, so a new value here does not
          change it. Run db.changeUserPassword() on the primary first.
      - rule: oldSelf == null || self.mongodb.username == oldSelf.mongodb.username
        severity: info
        paths: [mongodb.username]
        message: >-
          MongoDB creates the root user only when the cluster is first initialized, so a new username here
          does not create that user, and the members and backup jobs then sign in with a user that does not
          exist.
      # mongod accepts a keyfile of 6-1024 base64 characters once whitespace is removed; this version does not
      # check it before starting mongod.
      - when: oldSelf == null || self.mongodb.replicaSetKey != oldSelf.mongodb.replicaSetKey
        rule: >-
          self.mongodb.replicaSetKey.matches('^\\s*([A-Za-z0-9+/=]\\s*){6,1024}$')
        severity: warning
        paths: [mongodb.replicaSetKey]
        message: >-
          mongod accepts only 6 to 1024 characters from the base64 alphabet (A-Z a-z 0-9 + / =), so this key
          would not start the cluster. Generate one with openssl rand -base64 756.

  - id: resources
    title: Resources and storage
    description: Compute and storage of each member.
    sections:
      - fields:
          - path: resources
            type: resources
            label: Resources per member
            required: true
          - path: volumeset.capacity
            type: integer
            label: Initial capacity per member
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume set; a final snapshot is kept for 7 days.
            docs: "/reference/volumeset#capacity-and-billing"
      - id: autoscaling
        title: Grow storage automatically
        toggle: volumeset.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: access
    title: Access and proxy
    description: Who can connect, and the HAProxy endpoint that routes to the primary.
    sections:
      - title: Access
        fields:
          - path: firewall.internalAllowType
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: MongoDB has no public endpoint. A firewall change can take about 10 minutes to apply.
            options:
              - { value: same-gvc, label: Same GVC, description: Any workload in the GVC this release creates. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
          - path: firewall.workloads
            type: list
            label: Allowed workloads
            when: self.firewall.internalAllowType == 'workload-list'
            widget: tags
            description: >-
              The whole allow-list, as //gvc/GVC_NAME/workload/WORKLOAD_NAME. This version does not add its own
              workloads: list this release's MongoDB, HAProxy and backup workloads as well as your clients.
            item:
              type: string
              pattern: '^//gvc/[a-z0-9-]+/workload/[a-z0-9-]+$'
              patternMessage: Write each entry as //gvc/GVC_NAME/workload/WORKLOAD_NAME.
        rules:
          # The list also carries member-to-member replication, HAProxy's health checks and the backup job
          # (briefings/mongodb-cluster.md); 2.0.0 adds the release's own workloads itself.
          - when: self.firewall.internalAllowType == 'workload-list'
            rule: >-
              ([context.releaseName + '-mongo'] +
              (self.proxy.enabled ? [context.releaseName + '-mongo-proxy'] : []) +
              (self.backup.enabled && self.backup.mode == 'logical' ? [context.releaseName + '-mongo-backup'] : []) +
              (self.backup.enabled && self.backup.mode == 'physical' ? [context.releaseName + '-mongo-physical-backup'] : []))
              .all(w, ('//gvc/' + self.gvc.name + '/workload/' + w) in self.firewall.workloads)
            severity: warning
            paths: [firewall.workloads]
            message: >-
              List this release's own workloads too. The list also governs replication between the members,
              HAProxy's health checks and the backup job, so without them the replica set is cut off from
              itself while every member still reports ready. 2.0.0 adds them itself.
            messageExpression: >-
              'Add ' + ([context.releaseName + '-mongo'] +
              (self.proxy.enabled ? [context.releaseName + '-mongo-proxy'] : []) +
              (self.backup.enabled && self.backup.mode == 'logical' ? [context.releaseName + '-mongo-backup'] : []) +
              (self.backup.enabled && self.backup.mode == 'physical' ? [context.releaseName + '-mongo-physical-backup'] : []))
              .filter(w, !(('//gvc/' + self.gvc.name + '/workload/' + w) in self.firewall.workloads))
              .map(w, '//gvc/' + self.gvc.name + '/workload/' + w).join(', ') +
              '. The list also governs replication between the members, the HAProxy health checks and the
              backup job, so without them the replica set is cut off from itself while every member still
              reports ready.'
      - id: proxy
        title: HAProxy primary endpoint
        toggle: proxy.enabled
        description: One stable address that always routes to the current primary. Backups do not use it.
        fields:
          - path: proxy.minReplicas
            type: integer
            label: Minimum proxy replicas per location
            min: 1
            required: true
            suggestions: [1, 2, 3, 5]
          - path: proxy.maxReplicas
            type: integer
            label: Maximum proxy replicas per location
            min: 1
            required: true
            suggestions: [1, 2, 3, 5]
            description: In each location, HAProxy scales between the two by requests per second.
          - path: proxy.image
            type: string
            format: image
            label: HAProxy image
            required: true
            advanced: true
            help: >-
              Tested with the default haproxy:2.9. Another image is unproven here; it must provide /bin/sh and
              haproxy on the PATH, which the startup script runs.
          - path: proxy.resources
            type: resources
            label: HAProxy resources
            required: true
            advanced: true
        rules:
          - rule: self.proxy.minReplicas <= self.proxy.maxReplicas
            paths: [proxy.minReplicas]
            message: The minimum proxy replicas must not be greater than the maximum.
          # workload-haproxy.yaml writes cpu and memory unquoted; the API takes them as strings only
          # (nodelibs schema workload.ts: Cpu and Memory are Joi.string()).
          - when: oldSelf == null || self.proxy.resources != oldSelf.proxy.resources
            rule: self.proxy.resources.cpu.matches('^[0-9]+m$') && self.proxy.resources.memory.matches('[A-Za-z]$')
            severity: warning
            paths: [proxy.resources]
            message: >-
              This version writes the HAProxy CPU and memory unquoted: enter CPU in millicores (such as 1000m)
              and memory with a unit (such as 128Mi), or the workload is refused.
          # secret-haproxy.yaml: one backend per member index of the LARGEST location, in every location.
          - rule: self.gvc.locations.all(l, l.replicas == self.gvc.locations[0].replicas)
            severity: info
            paths: [proxy.enabled]
            message: >-
              The locations have different member counts. This version gives HAProxy backends for the largest
              count in every location, so the smaller locations have backends for members that do not exist.

  - id: backup
    title: Backups
    description: Scheduled backups to object storage.
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        fields:
          - path: backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical (mongodump) }
              - { value: physical, label: Physical (Percona Backup) }
          - type: note
            severity: warning
            when: self.backup.mode == 'physical'
            text: >-
              Physical backups cannot be restored: the restore must run mongod, which the pbm-agent image does
              not contain, so this mode writes snapshots that can never be restored. Use logical; 2.0.0 removed
              physical.
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - type: note
            textExpression: >-
              'The backup job runs in ' + (self.backup.provider == 'aws' ? 'aws-' + self.backup.aws.region +
              ', derived from the bucket region' : (size(self.gvc.locations) > 0 ? self.gvc.locations[0].name : 'the first location') +
              ', the first location') + ', and connects to the first member there.'
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
          - path: backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.backup.mode == 'logical'
          - path: backup.logical.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
            when: self.backup.mode == 'logical'
          - path: backup.physical.image
            type: string
            format: image
            label: Percona Backup image
            required: true
            advanced: true
            when: self.backup.mode == 'physical'
          - path: backup.physical.resources
            type: resources
            label: pbm-agent sidecar resources
            description: The agent runs next to every member.
            required: true
            advanced: true
            when: self.backup.mode == 'physical'
          - path: backup.physical.cron.resources
            type: resources
            label: Backup trigger job resources
            required: true
            advanced: true
            when: self.backup.mode == 'physical'
        rules:
          - rule: >-
              self.gvc.locations.exists(l, l.name ==
              (self.backup.provider == 'aws' ? 'aws-' + self.backup.aws.region : self.gvc.locations[0].name))
            mirrors: mongo-cluster.validateBackupConfig
            paths: [backup.provider]
            message: >-
              The backup job runs in aws- plus the bucket region, which must be one of the locations. Add that
              location, or use a bucket in the region of one of them.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        fields:
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
            description: The backup job runs in the location aws- plus this region.
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: >-
              An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy). This version
              also gives the backup identity aws::ReadOnlyAccess, read access to every bucket in the AWS
              account; 1.1.1 removes it, so include every action the backup needs here.
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        fields:
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the
              Storage Admin role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.

  - id: advanced
    title: Advanced
    description: The MongoDB image.
    sections:
      - fields:
          - path: image
            type: string
            format: image
            label: MongoDB image
            required: true
            help: >-
              Tested with the default percona/percona-server-mongodb:8.0. Another image is unproven here; it must
              provide bash and mongosh, which the startup script runs.
        rules:
          - rule: oldSelf == null || self.image == oldSelf.image
            severity: info
            paths: [image]
            message: >-
              Changing the MongoDB image restarts every member. MongoDB upgrades one major version at a
              time (for example 7.0 to 8.0), raising featureCompatibilityVersion after each step, and a
              raised featureCompatibilityVersion must be lowered before you can go back; take a backup
              first.
