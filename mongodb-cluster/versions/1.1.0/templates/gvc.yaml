{{- include "mongo-cluster.validate" . -}}
---
kind: gvc
name: {{ .Values.gvc.name }}
tags: {{- include "mongo-cluster.tags" . | nindent 2 }}
spec:
  endpointNamingFormat: org
  staticPlacement:
    locationLinks:
    {{- /*
    Sorted, because the API STORES locationLinks alphabetically. Rendering them
    in values order made every install drift against its own manifest from the
    moment it was created.
    */}}
    {{- $names := list }}
    {{- range .Values.gvc.locations }}{{ $names = append $names .name }}{{ end }}
    {{- range (sortAlpha $names) }}
      - //location/{{ . }}
    {{- end }}
