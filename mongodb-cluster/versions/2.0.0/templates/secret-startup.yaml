{{- /* Validation runs at every entry point that iterates `locations`: Helm does
       not render templates in a guaranteed order, so this loop can be reached
       before identity.yaml has run. */ -}}
{{- include "mongo-cluster.validate" . -}}
---
kind: secret
name: {{ include "mongo-cluster.secretStartup.name" . }}
description: MongoDB startup script
tags: {{- include "mongo-cluster.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -euo pipefail

    # Copy and secure the keyfile
    # mongod requires the keyfile to be chmod 400 and unreadable by others, and a
    # cpln:// secret mount cannot be given those permissions — hence the copy.
    mkdir -p /tmp/mongo-keys
    cp /etc/mongo-keyfile/keyfile /tmp/mongo-keys/keyfile
    chmod 400 /tmp/mongo-keys/keyfile

    # The keyfile comes from a secret the USER created, so its content cannot be
    # checked at render time. mongod accepts 6-1024 characters from the base64
    # alphabet ONLY (A-Z a-z 0-9 + / =) once whitespace is stripped, and dies with
    # an unhelpful message otherwise — so say plainly what is wrong instead.
    KEY_CONTENT=$(tr -d '[:space:]' < /tmp/mongo-keys/keyfile)
    if [[ ${#KEY_CONTENT} -lt 6 || ${#KEY_CONTENT} -gt 1024 ]]; then
      echo "FATAL: the keyfile in secret '{{ .Values.mongodb.keyfileSecretName }}' is ${#KEY_CONTENT} characters; mongod requires 6-1024. Regenerate it with: openssl rand -base64 756" >&2
      exit 1
    fi
    if [[ "$KEY_CONTENT" =~ [^A-Za-z0-9+/=] ]]; then
      echo "FATAL: the keyfile in secret '{{ .Values.mongodb.keyfileSecretName }}' contains characters outside the base64 alphabet (A-Z a-z 0-9 + / =). A passphrase with hyphens or punctuation will NOT work. Regenerate it with: openssl rand -base64 756" >&2
      exit 1
    fi

    # ── Runtime identity ──────────────────────────────────────────────────────
    # GVC comes from the built-in, not from Helm: this chart no longer creates or
    # names a GVC, so a render-time name could only ever drift from where the
    # workload actually runs.
    REPLICA_INDEX="${HOSTNAME##*-}"
    WORKLOAD_NAME="{{ include "mongo-cluster.name" . }}"
    LOCATION="${CPLN_LOCATION##*/}"
    GVC="${CPLN_GVC}"
    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"
    FIRST_LOCATION="{{ (index .Values.locations 0).name }}"

    # The configured roster, as "location:replicas" pairs, baked in at render time.
    # Everything below is derived from it, so the seed list, the location check and
    # the member count can never disagree about what was configured.
    CONFIGURED="{{ range .Values.locations }}{{ .name }}:{{ .replicas | int }} {{ end }}"
    CONFIGURED_LOCS=""
    TOTAL_MEMBERS=0
    SEEDS=""
    for pair in ${CONFIGURED}; do
      CONFIGURED_LOCS="${CONFIGURED_LOCS}${pair%%:*} "
      TOTAL_MEMBERS=$((TOTAL_MEMBERS + ${pair##*:}))
      SEEDS="${SEEDS}replica-0.${WORKLOAD_NAME}.${pair%%:*}.${GVC}.cpln.local:27017 "
    done

    # ── Check A: never start in a location this release did not ask for ───────
    # defaultOptions.minScale/maxScale are 0, so the platform should never place a
    # member in an undeclared location. This is the last line of defence if it
    # does. Such a member has working per-replica DNS, so it WOULD succeed in
    # adding itself to the replica set — becoming a voting member the operator
    # never sized for, in a region they never chose, that HAProxy has no backend
    # for. Unconditional: fresh or not, it must not join.
    case " ${CONFIGURED_LOCS} " in
      *" ${LOCATION} "*) : ;;
      *) echo "FATAL: this member is running in location '${LOCATION}', which is not in the configured location list (${CONFIGURED_LOCS% })." >&2
         echo "It would add itself to replica set rs0 as a voting member the cluster was never sized for, and HAProxy has no backend for it." >&2
         echo "Remove this location from GVC '${GVC}', or add it to the 'locations' list in your values." >&2
         exit 1 ;;
    esac

    # ── Freshness ─────────────────────────────────────────────────────────────
    # mongod writes /data/db/WiredTiger when it first creates the storage engine
    # files, so its presence is the honest "this member holds data" test. An ext4
    # volumeset is NOT empty on first boot — it carries lost+found — so `ls -A`
    # would report every fresh member as initialised.
    if [[ -f /data/db/WiredTiger ]]; then
      FRESH="false"
    else
      FRESH="true"
    fi

    # ── Boot-time GVC read ────────────────────────────────────────────────────
    # The platform accepts a localOptions entry naming a location the GVC does not
    # have: it is stored verbatim and is simply inert. Helm cannot see a live GVC,
    # and peer unreachability is not usable as the signal (surviving a peer outage
    # is the product). So ask the GVC itself.
    #
    # This image HAS curl (7.76.1, checked against the pinned tag; it has no wget).
    # Bounding, measured in THIS image: --connect-timeout 8 bounds a blackholed
    # connect() (SYN dropped) at 8 s, and --max-time 10 bounds a server that
    # accepts and never responds at 10 s. --connect-timeout ALONE does NOT bound
    # that second arm — the same call ran past 25 s until an external timeout
    # killed it. A refused connection returns in 0 s and an NXDOMAIN in 0 s: those
    # are the controls that make the two numbers above mean something, and neither
    # would have exercised the bound. `timeout 15` is the backstop if curl itself
    # hangs. Worst case 3 x 15 + 2 x 2 = 49 s. Do not tighten: a timeout short
    # enough to trip on a slow API turns this check off exactly when it is needed.
    GVC_LOCS=""
    GVC_READ_OK="false"
    GVC_ERR=""
    GVC_BODY=$(mktemp)
    for _try in 1 2 3; do
      if GVC_ERR=$(timeout 15 curl -fsS --connect-timeout 8 --max-time 10 \
        -o "${GVC_BODY}" \
        -H "Authorization: ${CPLN_TOKEN:-}" \
        "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>&1); then
        GVC_LOCS=$(tr -d ' \n' < "${GVC_BODY}" \
          | sed -n 's/.*"locationLinks":\[\([^]]*\)\].*/\1/p' \
          | tr ',' '\n' | sed 's#.*/##;s/"//g' | tr '\n' ' ')
        if [[ -n "${GVC_LOCS}" ]]; then
          GVC_READ_OK="true"
          break
        fi
        GVC_ERR="read OK but the response carried no spec.staticPlacement.locationLinks"
      fi
      sleep 2
    done
    rm -f "${GVC_BODY}"

    MISSING=""
    PRESENT_MEMBERS=0
    if [[ "${GVC_READ_OK}" != "true" ]]; then
      # A control-plane hiccup must never be the reason MongoDB refuses to start.
      # Skip the API-backed checks; Check A above still applies.
      echo "WARNING: could not read the location list of GVC '${GVC}' — skipping the GVC location check. Last error: ${GVC_ERR}" >&2
      echo "A 403 here means the GVC-read policy is missing: this release's identity needs 'view' on GVC '${GVC}'." >&2
    else
      for pair in ${CONFIGURED}; do
        loc="${pair%%:*}"
        case " ${GVC_LOCS} " in
          *" ${loc} "*) PRESENT_MEMBERS=$((PRESENT_MEMBERS + ${pair##*:})) ;;
          *) MISSING="${MISSING}${loc} " ;;
        esac
      done
      EXTRA=""
      for loc in ${GVC_LOCS}; do
        case " ${CONFIGURED_LOCS} " in
          *" ${loc} "*) : ;;
          *) EXTRA="${EXTRA}${loc} " ;;
        esac
      done
      if [[ -n "${EXTRA}" ]]; then
        echo "GVC '${GVC}' also has locations this release does not use: ${EXTRA% } — no member runs there (minScale/maxScale are 0 outside localOptions)."
      fi

      # ── Check B: every declared location must exist in the GVC ──────────────
      if [[ -n "${MISSING}" ]]; then
        echo "locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "${PRESENT_MEMBERS} of ${TOTAL_MEMBERS} declared members can actually start, so the replica set's majority is computed over a smaller set than you configured." >&2
        if [[ "${FRESH}" == "true" ]]; then
          echo "FATAL: refusing to bootstrap a replica set smaller than it was configured to be. It would report healthy while tolerating fewer failures than you sized it for." >&2
          echo "Add the missing location(s) to the GVC, or remove them from the 'locations' list in your values." >&2
          exit 1
        fi
        echo "This member holds data and keeps running rather than taking a live cluster down." >&2
      else
        echo "GVC location check OK — '${GVC}' has every configured location (${CONFIGURED_LOCS% })"
      fi

      # ── Check C: must not land on exactly 2 members ─────────────────────────
      # INDEPENDENT of Check B. The render-time validator refuses a 2-member
      # roster, but it sees only the VALUES — a 3-member roster with one location
      # absent from the GVC is a 2-member set in reality, and that is the shape
      # strictly worse than a single member, because a majority of 2 is 2.
      if [[ "${PRESENT_MEMBERS}" == "2" ]]; then
        echo "WARNING: exactly 2 members can start, so the replica set's majority is 2 of 2 — losing EITHER member leaves no primary and the set goes read-only. A single member would keep accepting writes. Use 1 member or at least 3." >&2
      fi
    fi

    echo "Starting MongoDB on ${SELF_FQDN}..."

    if [[ "$REPLICA_INDEX" == "0" && "$LOCATION" == "$FIRST_LOCATION" ]]; then
      # Bootstrap: init with self only (1/1 = immediate primary), then create admin user.
      # All other replicas self-register once the primary is ready.
      (
        set +e

        # Wait for mongod using bash's built-in /dev/tcp — no mongosh, no exit code surprises.
        # mongosh 2.x internal auth probe failures can override process.exit() via Node.js
        # exit handlers, making exit-code-based mongosh checks unreliable.
        echo "Waiting for mongod TCP port..."
        until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do
          sleep 1
        done
        sleep 2  # brief pause for MongoDB protocol layer to finish initializing
        echo "mongod is ready"

        # Authenticated check: if credentials work and RS is up, this is a restart — skip init.
        # print() writes directly to stdout and is NOT suppressed by --quiet.
        AUTH_OK=$(mongosh \
          "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin" \
          --quiet \
          --eval "try { print(rs.status().ok === 1 ? 'UP' : 'DOWN') } catch(e) { print('ERR') }" \
          2>/dev/null)

        if [[ "$AUTH_OK" == "UP" ]]; then
          IN_RS=$(mongosh \
            "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin" \
            --quiet \
            --eval "
              try {
                var members = rs.conf().members;
                print(members.some(function(m) { return m.host === '${SELF_FQDN}:27017'; }) ? 'YES' : 'NO')
              } catch(e) { print('ERR') }
            " 2>/dev/null)
          if [[ "$IN_RS" == "NO" ]]; then
            echo "Not in replica set config — re-registering via seed discovery..."
            PRIMARY_HOST=""
            until [[ -n "$PRIMARY_HOST" ]]; do
              for SEED in $SEEDS; do
                PRIMARY_HOST=$(mongosh \
                  "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${SEED}/admin" \
                  --quiet \
                  --eval "try { print(db.hello().primary || '') } catch(e) { print('') }" 2>/dev/null)
                [[ -n "$PRIMARY_HOST" ]] && break
              done
              [[ -z "$PRIMARY_HOST" ]] && sleep 5
            done
            mongosh "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${PRIMARY_HOST}/admin" \
              --quiet \
              --eval "try { rs.add('${SELF_FQDN}:27017') } catch(e) { print('rs.add: ' + e.message) }" \
              2>/dev/null
          else
            echo "Replica set already initialized"
          fi
        else
          # Unauthenticated check — only applicable before any users exist.
          RS_STATE=$(mongosh --quiet \
            --eval "
              try {
                print(rs.status().ok === 1 ? 'UP' : 'NO_CONFIG')
              } catch(e) {
                var m = String(e);
                if (m.includes('Unauthorized') || m.includes('requires authentication')) {
                  print('AUTH')
                } else {
                  print('NO_CONFIG')
                }
              }
            " 2>/dev/null)

          if [[ "$RS_STATE" == "AUTH" ]]; then
            echo "Replica set already initialized"
          else
            if [[ "$RS_STATE" != "UP" ]]; then
              echo "Initiating replica set..."
              until [[ "$(mongosh --quiet \
                --eval "
                  try {
                    var r = rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '${SELF_FQDN}:27017' }] });
                    print(r.ok === 1 ? 'OK' : 'FAIL')
                  } catch(e) {
                    print(String(e).includes('already initialized') ? 'OK' : 'ERR')
                  }
                " 2>/dev/null)" == "OK" ]]; do
                sleep 2
              done
              echo "Replica set initiated"
            else
              echo "Replica set configured, completing initialization..."
            fi

            # Wait for PRIMARY — needed whether RS was just initiated or already configured.
            echo "Waiting for PRIMARY election..."
            ATTEMPTS=0
            until [[ "$(mongosh --quiet \
              --eval "print(db.hello().isWritablePrimary ? 'PRIMARY' : 'NOT')" \
              2>/dev/null)" == "PRIMARY" ]]; do
              sleep 2
              ATTEMPTS=$((ATTEMPTS + 1))
              if [[ $ATTEMPTS -gt 30 ]]; then
                echo "Timeout waiting for PRIMARY — check replica set status"
                break
              fi
            done

            # Create admin user with retry.
            echo "Creating admin user..."
            USER_CREATED=false
            for i in $(seq 1 15); do
              RESULT=$(mongosh admin --quiet \
                --eval "
                  try {
                    db.createUser({
                      user: '$MONGO_INITDB_ROOT_USERNAME',
                      pwd: '$MONGO_INITDB_ROOT_PASSWORD',
                      roles: [{ role: 'root', db: 'admin' }]
                    });
                    print('OK')
                  } catch(e) { print('ERR: ' + e.message) }
                " 2>/dev/null)
              if [[ "$RESULT" == "OK" ]]; then
                USER_CREATED=true
                break
              fi
              echo "createUser attempt $i: $RESULT"
              sleep 2
            done

            if [[ "$USER_CREATED" == "true" ]]; then
              echo "MongoDB cluster bootstrapped"
            else
              echo "Failed to create admin user after retries"
            fi
          fi
        fi
      ) &
    else
      # All other replicas: wait for the primary to be ready, then self-register.
      # rs.add() is called on the primary so it can coordinate the config change.
      (
        set +e

        echo "Waiting for local mongod TCP port..."
        until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do
          sleep 1
        done

        echo "Locating primary via seed nodes..."
        PRIMARY_HOST=""
        until [[ -n "$PRIMARY_HOST" ]]; do
          for SEED in $SEEDS; do
            PRIMARY_HOST=$(mongosh \
              "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${SEED}/admin" \
              --quiet \
              --eval "try { print(db.hello().primary || '') } catch(e) { print('') }" 2>/dev/null)
            [[ -n "$PRIMARY_HOST" ]] && break
          done
          [[ -z "$PRIMARY_HOST" ]] && sleep 5
        done

        echo "Primary is ${PRIMARY_HOST}, adding self to replica set..."
        mongosh \
          "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${PRIMARY_HOST}/admin" \
          --quiet \
          --eval "try { rs.add('${SELF_FQDN}:27017') } catch(e) { print('rs.add: ' + e.message) }" \
          2>/dev/null
        echo "Added ${SELF_FQDN} to replica set"
      ) &
    fi

    # Replace shell with mongod as PID 1 — directly receives SIGTERM for clean shutdown
    exec mongod \
      --replSet rs0 \
      --bind_ip_all \
      --auth \
      --keyFile /tmp/mongo-keys/keyfile \
      --dbpath /data/db \
      --port 27017
