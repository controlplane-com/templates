{{- /* Validation runs at every entry point that iterates `locations`. */ -}}
{{- include "mongo-cluster.validate" . -}}
{{- if .Values.backup.enabled }}

{{- if eq .Values.backup.mode "logical" }}
---
kind: workload
name: {{ include "mongo-cluster.backup.name" . }}
description: MongoDB logical backup
tags: {{- include "mongo-cluster.tags" . | nindent 2 }}
spec:
  type: cron
  containers:
    - name: backup-mongodb
      image: {{ .Values.backup.logical.image }}
      cpu: {{ .Values.backup.logical.resources.cpu | quote }}
      memory: {{ .Values.backup.logical.resources.memory | quote }}
      inheritEnv: false
      env:
        - name: BACKUP_PROVIDER
          value: {{ .Values.backup.provider | quote }}
        {{- /* replica-0 in backup.location always exists: backup.location is one
               of `locations` and every location has at least 1 replica. */}}
        - name: MONGO_HOST
          value: replica-0.{{ include "mongo-cluster.name" . }}.{{ .Values.backup.location }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: MONGO_USER
          value: 'cpln://secret/{{ .Values.mongodb.credentialsSecretName }}.username'
        - name: MONGO_PASSWORD
          value: 'cpln://secret/{{ .Values.mongodb.credentialsSecretName }}.password'
        - name: MONGO_RS
          value: rs0
        {{- /* Bucket and region are not secrets — they come straight from values. */}}
        - name: BACKUP_BUCKET
          value: {{ (eq .Values.backup.provider "aws") | ternary .Values.backup.aws.bucket .Values.backup.gcp.bucket | quote }}
        {{- if eq .Values.backup.provider "aws" }}
        - name: AWS_REGION
          value: {{ .Values.backup.aws.region | quote }}
        - name: BACKUP_PREFIX
          value: {{ .Values.backup.aws.prefix | quote }}
        {{- end }}
        {{- if eq .Values.backup.provider "gcp" }}
        - name: BACKUP_PREFIX
          value: {{ .Values.backup.gcp.prefix | quote }}
        {{- end }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 1
      metric: disabled
      minScale: 1
      scaleToZeroDelay: 300
      target: 95
    capacityAI: false
    debug: false
    suspend: true # a GVC location this release did not ask for must NOT run a second backup
    timeoutSeconds: 3600
  {{- /*
    Unsuspended in exactly one location. backup.location is checked at render time
    against `locations` -- the platform accepts a localOptions entry for a location
    that does not exist, stores it, and the cron then never runs anywhere with
    nothing to observe.

    Every field defaultOptions carries is REPEATED here. A localOptions entry is
    not a patch onto defaultOptions: the API completes a partial entry from its
    OWN platform defaults. Measured on a sibling template -- with only `location`
    and `suspend` sent, the one location that actually ran the backup was stored
    with timeoutSeconds 5 instead of 3600, capacityAI true instead of false, and
    autoscaling {metric: concurrency, minScale: 1, maxScale: 5}, i.e. eligible to
    run FIVE concurrent backup pods. 1.x sent exactly that partial entry.
  */}}
  localOptions:
    - location: //location/{{ .Values.backup.location }}
      autoscaling:
        maxConcurrency: 0
        maxScale: 1
        metric: disabled
        minScale: 1
        scaleToZeroDelay: 300
        target: 95
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 3600
  firewallConfig:
    {{- /* Every field declared — the API backfills the empty lists. */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowPort:
        - number: 443
          protocol: tcp
      {{- if eq .Values.backup.provider "aws" }}
      outboundAllowHostname:
        - s3.{{ .Values.backup.aws.region }}.amazonaws.com
        - s3.amazonaws.com
      {{- end }}
      {{- if eq .Values.backup.provider "gcp" }}
      outboundAllowHostname:
        - storage.googleapis.com
      {{- end }}
      outboundBlockedCIDR: []
    internal:
      {{- /* Nothing connects TO the cron; it only dials out to replica-0. */}}
      inboundAllowType: none
      inboundAllowWorkload: []
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "mongo-cluster.identity.name" . }}
  job:
    activeDeadlineSeconds: 14400
    concurrencyPolicy: Forbid
    historyLimit: 5
    restartPolicy: Never
    schedule: {{ .Values.backup.schedule | quote }}
  supportDynamicTags: false
{{- end }}


{{- end }}
