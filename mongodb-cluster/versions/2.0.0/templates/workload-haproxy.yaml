{{- if .Values.proxy.enabled }}
{{- /* Validation runs at every entry point that iterates `locations`. */ -}}
{{- include "mongo-cluster.validate" . -}}
---
kind: workload
name: {{ include "mongo-cluster.proxy.name" . }}
description: HAProxy primary-only endpoint for MongoDB
tags: {{- include "mongo-cluster.tags" . | nindent 2 }}
spec:
  type: standard
  containers:
    - name: haproxy
      image: {{ .Values.proxy.image }}
      inheritEnv: false
      command: /bin/sh
      args:
        - /proxy/start.sh
      cpu: {{ .Values.proxy.resources.cpu | quote }}
      memory: {{ .Values.proxy.resources.memory | quote }}
      ports:
        - number: 27017
          protocol: tcp
        - number: 8404
          protocol: http
        - number: 8405
          protocol: http
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8404
          scheme: HTTP
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 2
      volumes:
        {{- /* recoveryPolicy is declared because the API backfills `retain`. */}}
        - path: /proxy/start.sh
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "mongo-cluster.secretProxyStartup.name" . }}.payload
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "mongo-cluster.identity.name" . }}
  defaultOptions:
    {{- /*
    0/0 for the same reason as the MongoDB tier: a GVC location this release did
    not ask for must run nothing. localOptions below supplies the real counts.
    */}}
    autoscaling:
      maxConcurrency: 0
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    multiZone:
      enabled: {{ .Values.multiZone }}
    suspend: false
    timeoutSeconds: 5
  localOptions:
    {{- /* A full override, like the MongoDB tier: every field defaultOptions
           carries must be repeated, or the API completes the entry from its own
           platform defaults rather than from defaultOptions. */}}
    {{- range $location := .Values.locations }}
    - location: //location/{{ $location.name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: {{ $.Values.proxy.maxReplicas }}
        metric: rps
        minScale: {{ $.Values.proxy.minReplicas }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      multiZone:
        enabled: {{ $.Values.multiZone }}
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  firewallConfig:
    internal:
      inboundAllowType: {{ .Values.firewall.internalAllowType }}
      {{- include "mongo-cluster.inboundAllowWorkload" . | nindent 6 }}
    {{- /* Every field declared — the API backfills the empty lists. */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  rolloutOptions:
    {{- /*
    A `standard` workload RETAINS maxUnavailableReplicas (unlike the stateful
    MongoDB tier, where the API drops it). terminationGracePeriodSeconds is
    declared because the API backfills 90.
    */}}
    maxSurgeReplicas: "1"
    maxUnavailableReplicas: "0"
    minReadySeconds: 0
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  supportDynamicTags: false
{{- end }}
