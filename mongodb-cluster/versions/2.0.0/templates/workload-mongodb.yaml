{{- /* Validation runs at every entry point that iterates `locations`. */ -}}
{{- include "mongo-cluster.validate" . -}}
---
kind: workload
name: {{ include "mongo-cluster.name" . }}
description: MongoDB cluster
tags:
  cpln/publishNotReadyAddresses: "true"
  {{- include "mongo-cluster.tags" . | nindent 2 }}
spec:
  type: stateful
  containers:
    - name: mongodb
      image: {{ .Values.image }}
      command: /bin/bash
      args:
        - /scripts/start.sh
      inheritEnv: false
      cpu: {{ .Values.resources.cpu | quote }}
      memory: {{ .Values.resources.memory | quote }}
      env:
        {{- /* From the user-created prerequisite secret — never through values. */}}
        - name: MONGO_INITDB_ROOT_USERNAME
          value: 'cpln://secret/{{ .Values.mongodb.credentialsSecretName }}.username'
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: 'cpln://secret/{{ .Values.mongodb.credentialsSecretName }}.password'
      ports:
        - number: 27017
          protocol: tcp
      readinessProbe:
        exec:
          command:
            - /bin/bash
            - -c
            - (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null
        failureThreshold: 3
        initialDelaySeconds: 15
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 5
      livenessProbe:
        exec:
          command:
            - /bin/bash
            - -c
            - (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null
        failureThreshold: 3
        initialDelaySeconds: 30
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 5
      lifecycle:
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - >-
                mongosh --quiet
                -u "$MONGO_INITDB_ROOT_USERNAME"
                -p "$MONGO_INITDB_ROOT_PASSWORD"
                --authenticationDatabase admin
                --eval 'try { rs.stepDown(10, 5) } catch(e) { }' || true
      volumes:
        - path: /data/db
          recoveryPolicy: retain
          uri: 'cpln://volumeset/{{ include "mongo-cluster.volume.name" . }}'
        - path: /scripts/start.sh
          recoveryPolicy: retain
          uri: 'cpln://secret/{{ include "mongo-cluster.secretStartup.name" . }}'
        - path: /etc/mongo-keyfile/keyfile
          recoveryPolicy: retain
          uri: 'cpln://secret/{{ .Values.mongodb.keyfileSecretName }}'
  defaultOptions:
    {{- /*
    minScale/maxScale are 0 so a GVC location this release did not ask for runs
    NOTHING: an undeclared location gets desiredScale 0 and its deployment reads
    "This workload location is deactivated because maxScale is set to 0".
    localOptions below supplies the real per-location counts. Without this, an
    extra GVC location silently starts mongod members that add THEMSELVES to the
    replica set as voting members nobody sized the quorum for, and that HAProxy
    has no backend for. It also stops a volume being provisioned there.
    */}}
    autoscaling:
      maxConcurrency: 0
      maxScale: 0
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    multiZone:
      enabled: {{ .Values.multiZone }}
    suspend: false
    timeoutSeconds: 10
  localOptions:
    {{- /*
    Every field defaultOptions carries is REPEATED on every entry. A localOptions
    entry is not a patch onto defaultOptions: the API completes a PARTIAL entry
    from its OWN platform defaults — measured on a sibling template turning
    capacityAI ON against a chart that set it false, and making a backup cron
    eligible for five concurrent pods. A half-specified entry silently gets
    settings the chart never asked for, and none of it is visible in the chart.
    */}}
    {{- range $location := .Values.locations }}
    - location: //location/{{ $location.name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: {{ $location.replicas | int }}
        metric: disabled
        minScale: {{ $location.replicas | int }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      multiZone:
        enabled: {{ $.Values.multiZone }}
      suspend: false
      timeoutSeconds: 10
    {{- end }}
  firewallConfig:
    {{- /*
    Every field of `external` is declared — the API backfills the empty lists,
    so omitting them made a default install drift against its own manifest from
    the moment it was created. MongoDB is reachable on the INTERNAL network
    only; there is no public endpoint and no knob to create one.
    */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.firewall.internalAllowType }}
      {{- /*
      Exactly ONE inboundAllowWorkload key, rendered by a helper that always
      includes this release's own workloads — member-to-member replication,
      HAProxy's checks and the backup cron all arrive on this path.
      */}}
      {{- include "mongo-cluster.inboundAllowWorkload" . | nindent 6 }}
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "mongo-cluster.identity.name" . }}
  securityOptions:
    filesystemGroupId: 1001
  loadBalancer:
    replicaDirect: true
  rolloutOptions:
    {{- /*
    maxUnavailableReplicas is deliberately NOT set: the API DROPS it on a
    stateful workload, so sending it produced permanent drift AND implied a
    rolling-restart limit that was never in force.
    terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    maxSurgeReplicas: 25%
    minReadySeconds: 0
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  supportDynamicTags: false
