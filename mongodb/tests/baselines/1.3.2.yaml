# mongodb 1.3.2 — the last version with credentials inline in values.
# Used as the starting point of an upgrade to a newer version.
locations: [aws-us-east-1]
timeoutSeconds: 600

generated:
  mongopw: hex

vars:
  mongo_workload: "{release}-mongo"
  mongo_user: e2e
  mongo_password: "{gen.mongopw}"
  mongo_db: test

values:
  config:
    username: e2e
    password: "{gen.mongopw}"
    database: test
