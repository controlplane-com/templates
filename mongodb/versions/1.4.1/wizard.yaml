# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: MongoDB
# One stateful replica on its own volume: every GVC location would run an independent copy.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: credentials
    title: Credentials
    description: The prerequisite secret with the root user, its password and the database name.
    fields:
      - type: note
        severity: warning
        when: >-
          context.mode == 'install' ||
          (context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0)
        textExpression: >-
          'The credentials secret must exist **before** you install or upgrade. If it is missing, the ' +
          'deployment waits on it and `cpln logs` shows nothing at all; the reason is in ' +
          '`cpln workload get-deployments ' + context.releaseName + '-mongo` under `status.versions[].message`.'
        text: >-
          The credentials secret must exist **before** you install or upgrade. If it is missing, the
          deployment waits on it and `cpln logs` shows nothing at all; the reason is in
          `cpln workload get-deployments RELEASE-mongo` under `status.versions[].message`.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.4.0') < 0
        textExpression: >-
          'Version 1.4.0 moved the database credentials out of the values and into the secret below. ' +
          'Before you upgrade, read the credentials the database already uses, because the upgrade removes them ' +
          'from the secret that holds them: `cpln secret reveal ' + context.releaseName + '-mongo-config -o yaml` ' +
          '(keys `username` and `password`). Create the secret below with those same values, and set `database` ' +
          'to the database your applications use (the old default was `test`): MongoDB keeps the user stored ' +
          'on its volume. Earlier versions shipped the published default user `username` with the password ' +
          '`password`, shared by every install. If the reveal shows that password, treat it as compromised: after ' +
          'the upgrade, change it with `db.changeUserPassword()`, then update the secret to match. See ' +
          '[Upgrading from earlier versions](/template-catalog/templates/mongodb#upgrading-from-earlier-versions).'
        text: >-
          Version 1.4.0 moved the database credentials out of the values and into the secret below. Before
          you upgrade, read the credentials the database already uses, because the upgrade removes them from
          the secret that holds them: `cpln secret reveal RELEASE_NAME-mongo-config -o yaml` (keys `username`
          and `password`). Create the secret below with those same values, and set `database` to the database
          your applications use (the old default was `test`): MongoDB keeps the user stored on its volume.
          Earlier versions shipped the published default user `username` with the password `password`, shared
          by every install. If the reveal shows that password, treat it as compromised: after the upgrade,
          change it with `db.changeUserPassword()`, then update the secret to match. See
          [Upgrading from earlier versions](/template-catalog/templates/mongodb#upgrading-from-earlier-versions).
      - path: config.credentialsSecretName
        type: ref
        label: Database credentials secret
        required: true
        description: >-
          A dictionary secret with the keys `username`, `password` and `database`. MongoDB creates this user
          in the `admin` database with the `root` role on first boot, so connection strings carry
          `authSource=admin`. Secret names are org-wide: give each release its own.
        help: >-
          MongoDB reads the credentials only when the volume is first initialized, and creates the database on
          its first write. To change the password later, run `db.changeUserPassword()` inside MongoDB, then
          update the secret to match. With backups on, the username and password must not contain : / @ or %,
          because the backup job puts them into its connection string unescaped and every backup run then
          fails. Create the secret with:
          `cpln secret create-dictionary --name CREDENTIALS_SECRET_NAME --entry username=myuser --entry password='YOUR-STRONG-PASSWORD' --entry database=mydb`
        docs: "#credentials"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [username, password, database]
          create:
            suggestName: "context.releaseName + '-mongodb-credentials'"
    rules:
      # mongo.validate: a blank name fails (required on the field; restated here for the mirror,
      # suppressed while REQUIRED shows), and config.username / config.password are refused.
      - rule: self.config.credentialsSecretName != null && self.config.credentialsSecretName != ''
        mirrors: mongo.validate
        paths: [config.credentialsSecretName]
        message: The database credentials secret is required.
      - rule: "!has(self.config.username) && !has(self.config.password)"
        mirrors: mongo.validate
        paths: [config.credentialsSecretName]
        message: >-
          config.username and config.password were removed in 1.4.0. Put the credentials in a dictionary
          secret with the keys username, password and database, and remove them from the values.
      - rule: >-
          oldSelf == null || context.fromVersion == null || semverCompare(context.fromVersion, '1.4.0') < 0 ||
          self.config.credentialsSecretName == oldSelf.config.credentialsSecretName
        severity: info
        paths: [config.credentialsSecretName]
        messageExpression: >-
          "MongoDB reads the credentials only when the volume is first initialized; pointing at another
          secret does not change the existing user or password. The new secret must keep the same username;
          run db.changeUserPassword() first so its password matches" + (self.backup.enabled ? ", or your
          applications and the backup job, which signs in with this secret, cannot connect." : ", or your
          applications cannot connect.")
        message: >-
          MongoDB reads the credentials only when the volume is first initialized; pointing at another
          secret does not change the existing user or password. The new secret must keep the same username;
          run db.changeUserPassword() first so its password matches, or your applications cannot connect.

  - id: server
    title: Server
    description: The MongoDB image and the compute of its single stateful replica.
    fields:
      - path: image
        type: string
        format: image
        label: MongoDB image
        required: true
        description: >-
          MongoDB moves between major versions one at a time, after setting the feature compatibility
          version, so change it on purpose, after a backup.
        docs: "#image-and-resources"
      - path: resources
        type: resources
        label: Resources
        required: true
        description: A single stateful replica.
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
    rules:
      - rule: >-
          oldSelf == null || imageMajor(self.image) < 0 || imageMajor(oldSelf.image) < 0 ||
          imageMajor(self.image) == imageMajor(oldSelf.image) ||
          imageMajor(self.image) == imageMajor(oldSelf.image) + 1
        severity: warning
        paths: [image]
        message: >-
          MongoDB upgrades one major version at a time and does not start a newer data directory on an
          older major. Move up one major per upgrade, each after setFeatureCompatibilityVersion, or migrate
          with mongodump and mongorestore.
      - rule: >-
          oldSelf == null || imageMajor(self.image) < 0 || imageMajor(oldSelf.image) < 0 ||
          imageMajor(self.image) != imageMajor(oldSelf.image) + 1
        severity: info
        paths: [image]
        message: >-
          A new major version restarts MongoDB on the existing data directory. Take a backup first, and
          check that setFeatureCompatibilityVersion reports the installed major before you upgrade.

  - id: storage
    title: Storage
    description: The volume set that holds the database.
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: >-
              The data lives on the volume set and survives redeploys. Uninstalling the release deletes
              the volume set, after a final snapshot that is kept for 7 days.
            docs: "#storage"
      - id: autoscaling
        title: Grow storage automatically
        toggle: volumeset.autoscaling.enabled
        description: The volume set grows by the scaling factor whenever its free space falls below the threshold.
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: oldSelf == null || oldSelf.volumeset.capacity == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: backup
    title: Backups
    description: Scheduled database dumps to object storage.
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        description: >-
          A cron workload runs mongodump of every database on a schedule and uploads the gzipped archive to
          an S3 or GCS bucket through a Control Plane cloud account. The bucket and the cloud account (for S3
          also the IAM policy) must exist before you turn it on. The archives are never expired; use a bucket
          lifecycle rule for that.
        docs: "#backup"
        fields:
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            rules:
              # templates/workload-backup.yaml writes the schedule unquoted: a value starting with * or @
              # fails helm template (measured: "*/15 * * * *" and "@daily").
              - rule: "!self.backup.schedule.matches('^[*@]')"
                message: >-
                  This version writes the schedule unquoted, so a schedule starting with * or @ fails to
                  install. Write the first field as a range instead, such as 0-59/15 for every 15 minutes or 0
                  for the top of the hour.
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            description: Works with every MongoDB version.
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.backup.provider in ['aws', 'gcp']
            mirrors: mongo.validateBackupConfig
            paths: [backup.provider]
            message: Choose AWS S3 or Google Cloud Storage as the backup destination.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.4.1') < 0 && oldSelf != null &&
              oldSelf.backup.enabled == true && oldSelf.backup.provider == 'aws'
            text: >-
              This version removes `aws::ReadOnlyAccess` from the backup identity. That managed policy
              granted read access to every bucket in your AWS account and was silently supplying any read
              action your bucket-scoped policy omitted. **Before you upgrade**, update your IAM policy to
              the full action list in [Backing up](/template-catalog/templates/mongodb#backing-up); if it
              already matches, no action is needed. See
              [Upgrading from earlier versions](/template-catalog/templates/mongodb#upgrading-from-earlier-versions).
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) for the AWS account that holds the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              The policy needs all ten S3 actions listed under
              [Backing up](/template-catalog/templates/mongodb#backing-up), on the bucket and on its objects. The
              backup identity carries only `cpln-connector` and this policy, so an action missing from it is
              missing for the backup job.
            pattern: '^[A-Za-z0-9+=,.@_-]+$'
            patternMessage: "Enter the name of your IAM policy, using letters, digits and + = , . @ _ -."
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        fields:
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the
              Storage Admin role.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.

  - id: network
    title: Network
    description: Who can connect to the database, inside Control Plane and from the internet.
    sections:
      - title: Database access
        docs: "#internal-access"
        fields:
          - type: note
            severity: info
            textExpression: >-
              'Applications connect to `' + context.releaseName + '-mongo.' + (context.gvc == null ? 'GVC' : context.gvc) +
              '.cpln.local:27017` with the secret username and password and `authSource=admin`.'
            text: >-
              Applications connect to `RELEASE-mongo.GVC.cpln.local:27017` with the secret username and
              password and `authSource=admin`.
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Access changes take up to a couple of minutes to take effect.
            options:
              - value: none
                label: None
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          # Shown for every type: the values comment says "only used if type is same-gvc or workload-list", but
          # workload-mongodb.yaml:43-44 writes any non-empty list into inboundAllowWorkload, and the platform
          # validates every entry, though it applies the workload links only with same-gvc and workload-list.
          - path: internalAccess.workloads
            when: self.internalAccess.type in ['same-gvc', 'workload-list'] || size(self.internalAccess.workloads) > 0
            type: list
            label: Allowed workloads
            widget: tags
            unique: true
            description: >-
              With Specific workloads, the only workloads allowed to connect; with Same GVC, extra workloads
              from other GVCs. The platform ignores the list with the other choices.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internalAccess.type == 'same-gvc'
      - title: Internet access
        docs: "#direct-load-balancer"
        fields:
          - path: directLoadBalancer.enabled
            type: boolean
            label: Publish through a direct load balancer
            description: >-
              Exposes MongoDB on TCP port 27017 through a direct load balancer with a public address in each
              location. Anyone who reaches it needs only the password; leave it off for applications inside
              Control Plane.
    rules:
      - when: self.internalAccess.type == 'workload-list'
        rule: size(self.internalAccess.workloads) > 0
        severity: warning
        paths: [internalAccess.workloads]
        message: List at least one workload when the database is open to specific workloads, or none can connect.
      - when: self.internalAccess.type == 'same-gvc' && context.gvc != null
        rule: "!self.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
        severity: info
        paths: [internalAccess.workloads]
        messageExpression: >-
          'Same GVC already allows every workload in this GVC: ' +
          self.internalAccess.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
          ' can be removed from the list.'
        message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
      - when: self.internalAccess.type == 'same-org'
        rule: size(self.internalAccess.workloads) == 0
        severity: info
        paths: [internalAccess.workloads]
        message: >-
          Same org already lets every workload of the org connect to MongoDB, so the workloads listed add
          nothing.
      - when: self.internalAccess.type == 'none'
        rule: size(self.internalAccess.workloads) == 0
        severity: warning
        paths: [internalAccess.workloads]
        message: >-
          The chart still writes the listed workloads into the firewall, where the platform checks every
          entry, but "None" lets none of them connect. Remove them.
      - when: self.internalAccess.type == 'none'
        rule: "!self.backup.enabled"
        severity: warning
        paths: [internalAccess.type]
        message: >-
          "None" also blocks the backup job, which connects to MongoDB like any other workload.
      - when: self.internalAccess.type == 'workload-list' && context.gvc != null && self.backup.enabled
        rule: >-
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-mongo-backup') in self.internalAccess.workloads
        severity: warning
        paths: [internalAccess.workloads]
        messageExpression: >-
          'The chart does not add its own backup job to the list. Add //gvc/' + context.gvc + '/workload/' +
          context.releaseName + '-mongo-backup, or it cannot connect.'
        message: The chart does not add its own backup job to the list; add the backup workload, or it cannot connect.
        fix:
          path: internalAccess.workloads
          items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-mongo-backup']"

rules:
  - rule: context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '1.2.0') >= 0
    message: >-
      Do not upgrade a 1.0.x or 1.1.x release in place: 1.2.0 renamed the workload and the volume set, so the
      upgrade deletes the volume set that holds the database and starts MongoDB on an empty one. Install this
      version as a new release, load a mongodump of the old database into it with mongorestore, then uninstall
      the old release.

migrations:
  # 1.0.0 and 1.1.0 set one CPU and memory value; 1.2.0 split them into minimums and maximums.
  - { fromVersions: "<1.2.0", from: resources.cpu, to: resources.maxCpu }
  - { fromVersions: "<1.2.0", from: resources.memory, to: resources.maxMemory }
  # 1.4.0 moved the credentials into a prerequisite secret.
  - fromVersions: "<1.4.0"
    from: config.username
    note: Credentials moved to a dictionary secret with the keys username, password and database; choose it under Credentials. MongoDB keeps the user stored on its volume.
  - fromVersions: "<1.4.0"
    from: config.password
    note: >-
      Credentials moved to a dictionary secret with the keys username, password and database; choose it under
      Credentials. MongoDB keeps the password stored on its volume. Earlier versions shipped the published
      default password "password": if this value is that default, change it with db.changeUserPassword() after
      the upgrade, then update the secret to match.
  - fromVersions: ">=1.3.0 <1.4.0"
    from: config.database
    note: The database name moved to the database key of the credentials secret; choose it under Credentials.
