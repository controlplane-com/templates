# mysql 1.4.0 — a customer install as it looks today: credentials inline in `config`.
# Used as the starting point of an upgrade to a newer version. phpMyAdmin is left off so CI never
# publishes a login form.
locations: [aws-us-east-1]
timeoutSeconds: 600

generated:
  apppw: hex
  rootpw: hex

vars:
  mysql_workload: "{release}-mysql"
  mysql_user: e2e
  mysql_password: "{gen.apppw}"
  mysql_db: e2e
  mysql_root_password: "{gen.rootpw}"

values:
  enablePhpMyAdmin: false
  config:
    db: e2e
    user: e2e
    password: "{gen.apppw}"
    rootPassword: "{gen.rootpw}"
