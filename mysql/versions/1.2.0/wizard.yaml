# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: MySQL
# One stateful replica with its own volume set and no location handling: every GVC location would
# run its own unrelated copy of the database.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: credentials
    title: Credentials
    description: The database, user and passwords that the chart stores in a secret of its own.
    fields:
      - type: note
        severity: warning
        text: >-
          These values are stored in the release values and in the dictionary secret the chart creates
          for MySQL. The default passwords are published in the template and shared by every install that
          keeps them, so set your own. MySQL applies all four values only when its data directory is first
          initialized. 1.5.0 and later read the credentials from secrets you create instead.
        textExpression: >-
          'These values are stored in the release values and in the dictionary secret `' +
          context.releaseName + '-mysql-config`, which the chart creates for MySQL. The default passwords
          are published in the template and shared by every install that keeps them, so set your own. MySQL
          applies all four values only when its data directory is first initialized. 1.5.0 and later read the
          credentials from secrets you create instead.'
      - path: config.db
        type: string
        label: Database name
        required: true
        immutable: MySQL creates this database once, when its data directory is initialized.
        # The official mysql image (docker-entrypoint.sh, identical in its 8.4 and 9.7 images; mysql:9 is
        # 9.7) runs CREATE DATABASE `<name>` with the name unescaped, and MySQL 9.7 refuses database names
        # over 64 characters, with characters outside the BMP or ending with a space (reference manual,
        # "Schema Object Names" and "Identifier Length Limits"). Initialization then fails.
        maxLength: 64
        pattern: '^(?!.* $)[^\x00-\x1f\x7f\u2028\u2029`\ud800-\udfff]*$'
        patternMessage: >-
          Leave out backticks, control characters and emoji or other characters outside the Basic
          Multilingual Plane, and do not end the name with a space. The MySQL image writes the name between
          backticks without escaping it, and MySQL refuses characters outside that plane and a trailing
          space.
        rules:
          # This version writes the value into its secret unquoted (templates/secret-config.yaml; 1.3.0 quotes
          # it). Measured with helm template and the cpln CLI's YAML parser: "a: b" and a trailing ":" fail to
          # render, "#x" becomes null, "ab #c" is cut to "ab", 12345 becomes a number and 2024-01-01 a date;
          # 9f8a7b6c5d stays a string. yes/no/on/off stay refused: they are YAML 1.1 booleans, and which parser
          # every install path uses is unproven. Checked only when the value changes.
          - when: oldSelf == null || self.config.db != oldSelf.config.db
            rule: >-
              !self.config.db.matches('^[-+]?(\\.[0-9]+|[0-9][0-9_]*(\\.[0-9_]*)?)([eE][-+]?[0-9]+)?$') &&
              !self.config.db.matches('^[-+]?0[xX][0-9a-fA-F_]+$') &&
              !self.config.db.matches('^[-+]?0[oO][0-7_]+$') &&
              !self.config.db.matches('^[-+]?0[bB][01_]+$') &&
              !self.config.db.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !self.config.db.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt ].*)?$') &&
              !self.config.db.matches("^[!&*%@`'\"\\[\\]{}|>?,#]") &&
              !self.config.db.matches('^\\s|\\s$|\\t') &&
              !self.config.db.contains(': ') && !self.config.db.contains(' #') && !self.config.db.endsWith(':') &&
              !(self.config.db.lowerAscii() in ['y', 'yes', 'n', 'no', 'true', 'false', 'on', 'off', 'null', '~', '.inf', '-.inf', '+.inf', '.nan'])
            severity: warning
            message: >-
              This version writes the database name into its secret unquoted, so some values break the install or
              are stored as something else. Avoid a value that is only a number or a date, words such as
              true, yes, no or null, a leading quote, # or another YAML symbol, ': ', ' #', a trailing ':'
              and tabs, or install 1.3.0 or later, which quotes it.
      - path: config.user
        type: string
        label: Database user
        required: true
        immutable: MySQL creates this user once, when its data directory is initialized.
        # The image refuses MYSQL_USER=root and writes the name into CREATE USER '<name>'@'%' unescaped;
        # MySQL 9.7 user names are up to 32 characters (reference manual, "User Names and Passwords").
        maxLength: 32
        pattern: '^(?!root$)[^\x00-\x1f\x7f\u2028\u2029''\\]*$'
        patternMessage: >-
          Use a name other than root, and leave out quotes ('), backslashes and control characters. The
          MySQL image refuses root here, and it writes the name into SQL without escaping quotes or
          backslashes.
        rules:
          # This version writes the value into its secret unquoted (templates/secret-config.yaml; 1.3.0 quotes
          # it). Measured with helm template and the cpln CLI's YAML parser: "a: b" and a trailing ":" fail to
          # render, "#x" becomes null, "ab #c" is cut to "ab", 12345 becomes a number and 2024-01-01 a date;
          # 9f8a7b6c5d stays a string. yes/no/on/off stay refused: they are YAML 1.1 booleans, and which parser
          # every install path uses is unproven. Checked only when the value changes.
          - when: oldSelf == null || self.config.user != oldSelf.config.user
            rule: >-
              !self.config.user.matches('^[-+]?(\\.[0-9]+|[0-9][0-9_]*(\\.[0-9_]*)?)([eE][-+]?[0-9]+)?$') &&
              !self.config.user.matches('^[-+]?0[xX][0-9a-fA-F_]+$') &&
              !self.config.user.matches('^[-+]?0[oO][0-7_]+$') &&
              !self.config.user.matches('^[-+]?0[bB][01_]+$') &&
              !self.config.user.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !self.config.user.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt ].*)?$') &&
              !self.config.user.matches("^[!&*%@`'\"\\[\\]{}|>?,#]") &&
              !self.config.user.matches('^\\s|\\s$|\\t') &&
              !self.config.user.contains(': ') && !self.config.user.contains(' #') && !self.config.user.endsWith(':') &&
              !(self.config.user.lowerAscii() in ['y', 'yes', 'n', 'no', 'true', 'false', 'on', 'off', 'null', '~', '.inf', '-.inf', '+.inf', '.nan'])
            severity: warning
            message: >-
              This version writes the user name into its secret unquoted, so some values break the install or
              are stored as something else. Avoid a value that is only a number or a date, words such as
              true, yes, no or null, a leading quote, # or another YAML symbol, ': ', ' #', a trailing ':'
              and tabs, or install 1.3.0 or later, which quotes it.
      - path: config.password
        type: string
        label: User password
        widget: password
        required: true
        example: true
        sensitive: true
        pattern: '^[^\x00-\x1f\x7f\u2028\u2029]*$'
        patternMessage: Leave out control characters and line breaks.
        rules:
          # This version writes the value into its secret unquoted (templates/secret-config.yaml; 1.3.0 quotes
          # it). Measured with helm template and the cpln CLI's YAML parser: "a: b" and a trailing ":" fail to
          # render, "#x" becomes null, "ab #c" is cut to "ab", 12345 becomes a number and 2024-01-01 a date;
          # 9f8a7b6c5d stays a string. yes/no/on/off stay refused: they are YAML 1.1 booleans, and which parser
          # every install path uses is unproven. Checked only when the value changes.
          - when: oldSelf == null || self.config.password != oldSelf.config.password
            rule: >-
              !self.config.password.matches('^[-+]?(\\.[0-9]+|[0-9][0-9_]*(\\.[0-9_]*)?)([eE][-+]?[0-9]+)?$') &&
              !self.config.password.matches('^[-+]?0[xX][0-9a-fA-F_]+$') &&
              !self.config.password.matches('^[-+]?0[oO][0-7_]+$') &&
              !self.config.password.matches('^[-+]?0[bB][01_]+$') &&
              !self.config.password.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !self.config.password.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt ].*)?$') &&
              !self.config.password.matches("^[!&*%@`'\"\\[\\]{}|>?,#]") &&
              !self.config.password.matches('^\\s|\\s$|\\t') &&
              !self.config.password.contains(': ') && !self.config.password.contains(' #') && !self.config.password.endsWith(':') &&
              !(self.config.password.lowerAscii() in ['y', 'yes', 'n', 'no', 'true', 'false', 'on', 'off', 'null', '~', '.inf', '-.inf', '+.inf', '.nan'])
            severity: warning
            message: >-
              This version writes the user password into its secret unquoted, so some values break the install or
              are stored as something else. Avoid a value that is only a number or a date, words such as
              true, yes, no or null, a leading quote, # or another YAML symbol, ': ', ' #', a trailing ':'
              and tabs, or install 1.3.0 or later, which quotes it.
          # The image writes it into IDENTIFIED BY '<password>' unescaped when it initializes the data
          # directory (install only): a quote ends the string and a backslash starts an escape sequence, so
          # initialization fails or stores another password than the secret holds.
          - when: context.mode == 'install'
            rule: >-
              !self.config.password.matches("['\\\\]")
            message: >-
              Leave out quotes (') and backslashes: the MySQL image writes the user password into SQL
              without escaping it when it initializes the database.
          - rule: oldSelf == null || self.config.password == oldSelf.config.password
            severity: info
            message: >-
              MySQL keeps the password it was initialized with. Change it in MySQL with `ALTER USER`
              first, or the new value in the secret no longer matches the database.
          - when: oldSelf != null
            rule: self.config.password != 'password'
            severity: info
            message: >-
              This release still uses the template's published default user password. Change it in
              MySQL with `ALTER USER`, then enter the new password here.
      - path: config.rootPassword
        type: string
        label: Root password
        widget: password
        required: true
        example: true
        sensitive: true
        description: The optional backup job and phpMyAdmin console also receive it in their environment.
        # The readiness probe runs sh -c 'mysqladmin ping -u root -p${MYSQL_ROOT_PASSWORD}' with the
        # expansion unquoted (templates/workload-mysql.yaml), so whitespace splits the password.
        pattern: '^[^\s\x00-\x1f\x7f]+$'
        patternMessage: >-
          Leave out spaces, tabs, line breaks and other control characters. The readiness check passes the
          root password to the shell unquoted, so whitespace would split it.
        rules:
          # This version writes the value into its secret unquoted (templates/secret-config.yaml; 1.3.0 quotes
          # it). Measured with helm template and the cpln CLI's YAML parser: "a: b" and a trailing ":" fail to
          # render, "#x" becomes null, "ab #c" is cut to "ab", 12345 becomes a number and 2024-01-01 a date;
          # 9f8a7b6c5d stays a string. yes/no/on/off stay refused: they are YAML 1.1 booleans, and which parser
          # every install path uses is unproven. Checked only when the value changes.
          - when: oldSelf == null || self.config.rootPassword != oldSelf.config.rootPassword
            rule: >-
              !self.config.rootPassword.matches('^[-+]?(\\.[0-9]+|[0-9][0-9_]*(\\.[0-9_]*)?)([eE][-+]?[0-9]+)?$') &&
              !self.config.rootPassword.matches('^[-+]?0[xX][0-9a-fA-F_]+$') &&
              !self.config.rootPassword.matches('^[-+]?0[oO][0-7_]+$') &&
              !self.config.rootPassword.matches('^[-+]?0[bB][01_]+$') &&
              !self.config.rootPassword.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !self.config.rootPassword.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt ].*)?$') &&
              !self.config.rootPassword.matches("^[!&*%@`'\"\\[\\]{}|>?,#]") &&
              !self.config.rootPassword.matches('^\\s|\\s$|\\t') &&
              !self.config.rootPassword.contains(': ') && !self.config.rootPassword.contains(' #') && !self.config.rootPassword.endsWith(':') &&
              !(self.config.rootPassword.lowerAscii() in ['y', 'yes', 'n', 'no', 'true', 'false', 'on', 'off', 'null', '~', '.inf', '-.inf', '+.inf', '.nan'])
            severity: warning
            message: >-
              This version writes the root password into its secret unquoted, so some values break the install or
              are stored as something else. Avoid a value that is only a number or a date, words such as
              true, yes, no or null, a leading quote, # or another YAML symbol, ': ', ' #', a trailing ':'
              and tabs, or install 1.3.0 or later, which quotes it.
          # At initialization (install only) the image writes it unescaped into IDENTIFIED BY '<password>'
          # and into its client option file as password="<password>": a quote ends the SQL string, a
          # backslash starts an escape in both, and a " followed by # cuts the option file value.
          - when: context.mode == 'install'
            rule: >-
              !self.config.rootPassword.matches("['\"\\\\]")
            message: >-
              Leave out quotes and backslashes: the MySQL image writes the root password into SQL and into
              its client options without escaping it when it initializes the database.
          - rule: oldSelf == null || self.config.rootPassword == oldSelf.config.rootPassword
            severity: info
            message: >-
              MySQL keeps the root password it was initialized with. Change it in MySQL first with
              `ALTER USER` for both `'root'@'localhost'` and `'root'@'%'`, or the secret, which the optional
              backup job reads, no longer matches the database.
          - when: oldSelf != null
            rule: self.config.rootPassword != 'root-password'
            severity: info
            message: >-
              This release still uses the template's published default root password. Change it in MySQL
              with `ALTER USER` for both `'root'@'localhost'` and `'root'@'%'`, then enter the new password
              here.

  - id: server
    title: Server
    description: The MySQL image and the compute of its single stateful replica.
    fields:
      - path: image
        type: string
        format: image
        label: MySQL image
        required: true
        description: >-
          This version was published with mysql:9, and its values file documents backups for MySQL 9 or later.
          Another image is untested with this version; after a change, check that MySQL starts and, with
          backups on, that a backup run succeeds.
        # Written unquoted (templates/workload-mysql.yaml); `format: image` refuses the values YAML would read
        # as a boolean, null or number (guide §17.3.1).
      - path: resources
        type: resources
        label: Resources
        required: true
        docs: "#resources"
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
        rules:
          # templates/workload-mysql.yaml writes all four values unquoted in this version, and the
          # platform's Cpu type is a string: a whole number of cores renders as a YAML number and is refused.
          - rule: type(self.resources.maxCpu) == string && self.resources.maxCpu.endsWith('m')
            paths: [resources.maxCpu]
            message: >-
              Enter the maximum CPU in millicores, such as 1000m for one core. The chart writes this value
              unquoted, and the platform refuses a plain number of cores.
          - rule: type(self.resources.minCpu) == string && self.resources.minCpu.endsWith('m')
            paths: [resources.minCpu]
            message: >-
              Enter the minimum CPU in millicores, such as 250m. This version writes this value unquoted,
              and the platform refuses a plain number of cores.
          - rule: >-
              type(self.resources.maxMemory) == string && self.resources.maxMemory.matches('[A-Za-z]$') &&
              type(self.resources.minMemory) == string && self.resources.minMemory.matches('[A-Za-z]$')
            severity: warning
            paths: [resources.maxMemory, resources.minMemory]
            message: >-
              Give memory with a unit, such as 512Mi. This version writes these values unquoted, so a value
              without a unit is written as a number rather than a quantity.
      - path: timeoutSeconds
        type: integer
        label: Request timeout
        required: true
        advanced: true
        description: The workload's maximum request duration (`defaultOptions.timeoutSeconds`).
        docs: "/reference/workload/general#timeout-seconds"
        unit: seconds
        min: 1
        max: 3600
    rules:
      # MySQL 9.7 reference manual, "Downgrading MySQL": an in-place downgrade is supported only within an
      # LTS series; to an earlier series only by a logical dump and load.
      - rule: oldSelf == null || oldSelf.image == null || self.image == oldSelf.image
        severity: info
        paths: [image]
        messageExpression: >-
          imageMajor(self.image) >= 0 && imageMajor(oldSelf.image) >= 0 &&
          imageMajor(self.image) < imageMajor(oldSelf.image) ?
          'A new image restarts MySQL, and MySQL supports an in-place downgrade only within one LTS series,
          so going from MySQL ' + string(imageMajor(oldSelf.image)) + ' back to ' +
          string(imageMajor(self.image)) + ' needs a logical dump and load: dump the database with `mysqldump`
          and load it into a new release.' :
          'A new image restarts MySQL. It runs a single replica, so clients cannot connect until it is back.
          Going back to an older MySQL release works in place only within one LTS series.'
        message: >-
          A new image restarts MySQL, and it runs a single replica, so clients cannot connect until it is
          back. MySQL supports an in-place downgrade only within one LTS series.

  - id: storage
    title: Storage
    description: The volume set that holds the MySQL data directory.
    fields:
      - path: volumeset.capacity
        type: integer
        label: Initial capacity
        unit: GiB
        min: 10
        max: 65536
        required: true
        suggestions: [10, 20, 50, 100, 250, 500, 1000]
        description: This version has no setting to grow the volume set automatically.
        docs: "/reference/volumeset#capacity-and-billing"
    rules:
      - rule: >-
          oldSelf == null || oldSelf.volumeset.capacity == null ||
          self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: network
    title: Network and phpMyAdmin
    description: Who can connect to MySQL, and the optional phpMyAdmin console.
    sections:
      - title: Network access
        docs: /reference/workload/firewall
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: The workloads that can reach MySQL on port 3306.
            options:
              - value: none
                label: None
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Lets no workload connect in this version, which cannot apply a list.
          # templates/workload-mysql.yaml writes inboundAllowWorkload with the list and then again as [];
          # measured: the cpln CLI's YAML parser (js-yaml 4.2.0, as `cpln helm install` loads the rendered
          # manifest) refuses it with "duplicated mapping key". 1.3.0 removed the second key.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            description: Leave empty. This version cannot apply a list of workloads.
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
            rules:
              - rule: size(self.internalAccess.workloads) == 0
                severity: warning
                message: >-
                  This version writes the allowed-workloads setting twice, the second time empty, and the
                  cpln CLI refuses that manifest (duplicated mapping key). Leave the list empty, or install
                  1.3.0 or later.
      - id: phpmyadmin
        title: phpMyAdmin console
        toggle: enablePhpMyAdmin
        description: >-
          A web console for the database. This version publishes it to the internet with no setting to
          restrict who can reach it, runs the `latest` phpMyAdmin image and puts the root password in its
          environment. Turn it off unless you need the console.
        fields: []
    rules:
      - when: self.internalAccess.type == 'none'
        rule: "!self.enablePhpMyAdmin && !self.backup.enabled"
        severity: warning
        paths: [internalAccess.type]
        messageExpression: >-
          '"None" also blocks ' + (self.enablePhpMyAdmin ? 'the phpMyAdmin console' : '') +
          (self.enablePhpMyAdmin && self.backup.enabled ? ' and ' : '') +
          (self.backup.enabled ? 'the backup job' : '') +
          (self.enablePhpMyAdmin && self.backup.enabled ? ', which connect' : ', which connects') +
          ' to MySQL like any other workload.'
        message: >-
          "None" also blocks the phpMyAdmin console and the backup job, which connect to MySQL like any
          other workload.
      - rule: self.internalAccess.type != 'workload-list'
        severity: warning
        paths: [internalAccess.type]
        message: >-
          This version cannot apply a list of workloads, so "Specific workloads" lets no workload connect.
          Choose Same GVC or Same org, or install 1.3.0 or later.

  - id: backup
    title: Backups
    description: Scheduled backups of the database to an S3 or GCS bucket.
    sections:
      - id: backup
        title: Scheduled backups
        description: >-
          Adds a cron workload that uploads a gzipped `mysqldump` to your bucket. In this version
          the backup job always dumps a database named test (fixed in 1.4.3).
        fields:
          - type: note
            severity: warning
            when: self.backup.enabled && self.config.db != 'test'
            text: >-
              This version's backup job always dumps a database named test. If the database under Credentials
              has another name, every backup run fails and nothing is uploaded (fixed in 1.4.3).
          # This version has no backup.provider: backup.enabled, backup.aws.enabled and backup.gcp.enabled
          # must agree (mysql.validateBackupConfig), so one choice sets all three.
          - id: backupDestination
            virtual: true
            type: enum
            label: Backups
            widget: cards
            required: true
            init: >-
              self.backup.enabled == true && self.backup.aws.enabled == true && self.backup.gcp.enabled != true ? 'aws' :
              self.backup.enabled == true && self.backup.gcp.enabled == true && self.backup.aws.enabled != true ? 'gcp' :
              'off'
            options:
              - value: "off"
                label: "Off"
                set: { backup.enabled: false, backup.aws.enabled: false, backup.gcp.enabled: false }
              - value: aws
                label: AWS S3
                set: { backup.enabled: true, backup.aws.enabled: true, backup.gcp.enabled: false }
              - value: gcp
                label: Google Cloud Storage
                set: { backup.enabled: true, backup.aws.enabled: false, backup.gcp.enabled: true }
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.backup.enabled
            # This version writes the schedule unquoted (templates/workload-backup.yaml): measured, helm
            # template fails on any schedule starting with * ("did not find expected alphabetic or numeric
            # character"); 1.4.3 quotes it.
            # The platform's ScheduleType (nodelibs/schema/src/workload.ts) accepts five numeric fields only, each
            # within its range (checkCronValues): no macros, no month or day names (single spaces between the
            # fields keep the never-fires rule below simple; tabs are refused). Its cron scheduler
            # (regulator/pkg/jobs/cron/scheduler.go, robfig/cron v3) drops a schedule with a step of 0 or one
            # that never fires and only logs "Invalid schedule", so the job would never run.
            pattern: '^(\*(/(0?[1-9]|[1-5]\d))?|([0-5]?\d)(-([0-5]?\d))?(/0*[1-9]\d*)?)(,(\*(/(0?[1-9]|[1-5]\d))?|([0-5]?\d)(-([0-5]?\d))?(/0*[1-9]\d*)?))* (\*(/(0?[1-9]|1\d|2[0-3]))?|([01]?\d|2[0-3])(-([01]?\d|2[0-3]))?(/0*[1-9]\d*)?)(,(\*(/(0?[1-9]|1\d|2[0-3]))?|([01]?\d|2[0-3])(-([01]?\d|2[0-3]))?(/0*[1-9]\d*)?))* (\*(/(0?[1-9]|[12]\d|3[01]))?|(0?[1-9]|[12]\d|3[01])(-(0?[1-9]|[12]\d|3[01]))?(/0*[1-9]\d*)?)(,(\*(/(0?[1-9]|[12]\d|3[01]))?|(0?[1-9]|[12]\d|3[01])(-(0?[1-9]|[12]\d|3[01]))?(/0*[1-9]\d*)?))* (\*(/(0?[1-9]|1[0-2]))?|(0?[1-9]|1[0-2])(-(0?[1-9]|1[0-2]))?(/0*[1-9]\d*)?)(,(\*(/(0?[1-9]|1[0-2]))?|(0?[1-9]|1[0-2])(-(0?[1-9]|1[0-2]))?(/0*[1-9]\d*)?))* (\*(/(0?[1-6]))?|(0?[0-6])(-(0?[0-6]))?(/0*[1-9]\d*)?)(,(\*(/(0?[1-6]))?|(0?[0-6])(-(0?[0-6]))?(/0*[1-9]\d*)?))*$'
            patternMessage: >-
              Use five numeric fields separated by single spaces (minute 0-59, hour 0-23, day 1-31, month
              1-12, weekday 0-6), such as 0 2 * * *, with steps (/n) of at least 1; macros such as @daily and
              names such as MON are not accepted.
            rules:
              - rule: "!self.backup.schedule.startsWith('*')"
                message: >-
                  This version writes the schedule unquoted, so a schedule starting with * fails to render.
                  Start the minute field with a number, for example 0-59/5 instead of */5, or install 1.4.3 or
                  later, which quotes it.
              # With the weekday unrestricted (* or */1), cron runs only on the chosen days of the chosen
              # months: the earliest chosen day must fit in the longest chosen month (February 29, April,
              # June, September and November 30). A range, step or * in the months counts as 31 days.
              - rule: >-
                  !self.backup.schedule.matches('^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [*](/0*1)?$') ||
                  self.backup.schedule.split(' ')[2].split(',').exists(d,
                  self.backup.schedule.split(' ')[3].split(',').exists(m,
                  (d.startsWith('*') ? 1 : int(d.split('/')[0].split('-')[0])) <=
                  (m.matches('^[0-9]+$') ? (int(m) == 2 ? 29 : int(m) in [4, 6, 9, 11] ? 30 : 31) : 31)))
                message: >-
                  None of the chosen months has the chosen day, so the backup would never run. February has at
                  most 29 days, and April, June, September and November 30.
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.backup.enabled
            # Written unquoted (templates/workload-backup.yaml), as the MySQL image; `format: image` covers it.
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
            when: self.backup.enabled
            cpu: { min: 25m }
            memory: { min: 32Mi }
            rules:
              # This version writes both values unquoted (templates/workload-backup.yaml).
              - rule: type(self.backup.resources.cpu) == string && self.backup.resources.cpu.endsWith('m')
                paths: [backup.resources.cpu]
                message: >-
                  Enter the CPU in millicores, such as 1000m for one core. This version writes this value
                  unquoted, and the platform refuses a plain number of cores.
              - rule: type(self.backup.resources.memory) == string && self.backup.resources.memory.matches('[A-Za-z]$')
                severity: warning
                paths: [backup.resources.memory]
                message: >-
                  Give memory with a unit, such as 128Mi. This version writes this value unquoted, so a value
                  without a unit is written as a number rather than a quantity.
        rules:
          - rule: "!(self.backup.aws.enabled == true && self.backup.gcp.enabled == true)"
            mirrors: mysql.validateBackupConfig
            paths: [backup.aws.enabled, backup.gcp.enabled]
            message: Turn on only one backup provider, AWS S3 or Google Cloud Storage.
          - rule: "self.backup.enabled != true || self.backup.aws.enabled == true || self.backup.gcp.enabled == true"
            mirrors: mysql.validateBackupConfig
            paths: [backup.enabled]
            message: With backups on, turn on one backup provider, AWS S3 or Google Cloud Storage.
          - rule: "self.backup.enabled == true || !(self.backup.aws.enabled == true || self.backup.gcp.enabled == true)"
            mirrors: mysql.validateBackupConfig
            paths: [backup.enabled]
            message: A backup provider is on while backups are off. Turn backups on, or turn the provider off.
          - rule: >-
              oldSelf == null || oldSelf.backup.enabled != true ||
              (self.backup.aws.enabled == oldSelf.backup.aws.enabled && self.backup.gcp.enabled == oldSelf.backup.gcp.enabled)
            severity: info
            paths: [backup.enabled]
            message: >-
              The backups already written stay in the previous destination; the job writes new backups only
              to the destination chosen here.
      - title: AWS S3
        when: self.backup.enabled && self.backup.aws.enabled
        fields:
          - type: note
            severity: warning
            text: >-
              Create the bucket, an AWS cloud account and the IAM policy **before** you install. The policy
              allows `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject`, `s3:ListBucket`,
              `s3:GetObjectVersion` and `s3:DeleteObjectVersion` on the bucket and its objects.
          - path: backup.aws.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
            rules:
              # This version writes the bucket into its secret unquoted (templates/secret-config.yaml): a name
              # YAML reads as a number or a date is stored as something else (measured as for the passwords).
              - when: oldSelf == null || self.backup.aws.s3.bucket != oldSelf.backup.aws.s3.bucket
                rule: >-
                  !self.backup.aws.s3.bucket.matches('^[-+]?(\\.[0-9]+|[0-9][0-9_]*(\\.[0-9_]*)?)([eE][-+]?[0-9]+)?$') &&
                  !self.backup.aws.s3.bucket.matches('^[-+]?0[xX][0-9a-fA-F_]+$') &&
                  !self.backup.aws.s3.bucket.matches('^[-+]?0[oO][0-7_]+$') &&
                  !self.backup.aws.s3.bucket.matches('^[-+]?0[bB][01_]+$') &&
                  !self.backup.aws.s3.bucket.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
                  !self.backup.aws.s3.bucket.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt ].*)?$')
                severity: warning
                message: >-
                  This version writes the bucket name into its secret unquoted, so a name YAML reads as a number
                  or a date is stored as something else. Use another name, or install 1.3.0 or later.
          - path: backup.aws.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              The chart attaches it to the identity that MySQL, the optional phpMyAdmin console and the
              backup job share, together with `cpln-connector` and the AWS managed policy
              `aws::ReadOnlyAccess`.
            # The platform's identity PolicyRef pattern (the chart writes the name inside double quotes).
            pattern: '^(aws::)?[A-Za-z0-9/+=,.@_-]+$'
            patternMessage: >-
              Use letters, digits and / + = , . @ _ -, optionally after aws:: for an AWS managed policy.
          - path: backup.aws.s3.prefix
            type: string
            label: Folder prefix
            required: true
            # The platform caps an environment variable's value at 4 KiB (nodelibs/schema/src/env.ts).
            maxLength: 4096
            # BACKUP_PREFIX is written unquoted (templates/workload-backup.yaml): keep it a plain YAML string.
            pattern: '^(?!(?:[Yy]|[Yy]es|YES|[Nn]|[Nn]o|NO|[Tt]rue|TRUE|[Ff]alse|FALSE|[Oo]n|ON|[Oo]ff|OFF|[Nn]ull|NULL)$)(?=[A-Za-z]|[^/]*/)[A-Za-z0-9._/-]+$'
            patternMessage: >-
              Use letters, digits, ".", "_", "-" and "/", start with a letter or include a "/", and avoid
              YAML words such as true or null.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.gcp.enabled
        fields:
          - type: note
            severity: warning
            text: >-
              Create the bucket and a GCP cloud account **before** you install. The cloud account's service
              account needs the Storage Admin role.
          - path: backup.gcp.gcs.bucket
            type: string
            label: Bucket
            required: true
            example: true
            # Written unquoted into the identity's GCP binding (templates/identity.yaml).
            pattern: '^(?:[a-z0-9][a-z0-9_-]{1,61}[a-z0-9]|(?=.{3,222}$)(?!.*[a-z0-9_-]{64})[a-z0-9][a-z0-9_.-]*\.[a-z0-9_.-]*[a-z0-9])$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits, hyphens and underscores, starting and ending with a
              letter or digit; a name with dots can have up to 222 characters, with at most 63 between dots.
            rules:
              # This version writes the bucket into its secret unquoted (templates/secret-config.yaml): a name
              # YAML reads as a number or a date is stored as something else (measured as for the passwords).
              - when: oldSelf == null || self.backup.gcp.gcs.bucket != oldSelf.backup.gcp.gcs.bucket
                rule: >-
                  !self.backup.gcp.gcs.bucket.matches('^[-+]?(\\.[0-9]+|[0-9][0-9_]*(\\.[0-9_]*)?)([eE][-+]?[0-9]+)?$') &&
                  !self.backup.gcp.gcs.bucket.matches('^[-+]?0[xX][0-9a-fA-F_]+$') &&
                  !self.backup.gcp.gcs.bucket.matches('^[-+]?0[oO][0-7_]+$') &&
                  !self.backup.gcp.gcs.bucket.matches('^[-+]?0[bB][01_]+$') &&
                  !self.backup.gcp.gcs.bucket.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
                  !self.backup.gcp.gcs.bucket.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt ].*)?$')
                severity: warning
                message: >-
                  This version writes the bucket name into its secret unquoted, so a name YAML reads as a number
                  or a date is stored as something else. Use another name, or install 1.3.0 or later.
          - path: backup.gcp.gcs.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account). The chart grants its identity
              `roles/storage.objectAdmin` on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.gcs.prefix
            type: string
            label: Folder prefix
            required: true
            # The platform caps an environment variable's value at 4 KiB (nodelibs/schema/src/env.ts).
            maxLength: 4096
            pattern: '^(?!(?:[Yy]|[Yy]es|YES|[Nn]|[Nn]o|NO|[Tt]rue|TRUE|[Ff]alse|FALSE|[Oo]n|ON|[Oo]ff|OFF|[Nn]ull|NULL)$)(?=[A-Za-z]|[^/]*/)[A-Za-z0-9._/-]+$'
            patternMessage: >-
              Use letters, digits, ".", "_", "-" and "/", start with a letter or include a "/", and avoid
              YAML words such as true or null.

rules:
  # 1.0.0 and 1.1.0 named the workload and the volume set after the release; 1.2.0 renamed them.
  - rule: >-
      context.mode != 'upgrade' || context.fromVersion == null ||
      semverCompare(context.fromVersion, '1.2.0') >= 0
    messageExpression: >-
      'Do not upgrade a 1.0.0 or 1.1.0 release in place. Those versions named the MySQL workload and its
      volume set `' + context.releaseName + '`; this version names them `' + context.releaseName + '-mysql` and `' +
      context.releaseName + '-mysql-vs`, so the upgrade starts MySQL on a new, empty volume set at a new
      endpoint and removes the old workload and volume set with your data. Install this version as a new
      release, copy the data over with `mysqldump`, then uninstall the old release.'
    message: >-
      Do not upgrade a 1.0.0 or 1.1.0 release in place. Those versions named the MySQL workload and its
      volume set after the release; this version adds the suffixes `-mysql` and `-mysql-vs`, so the upgrade
      starts MySQL on a new, empty volume set at a new endpoint and removes the old workload and volume set
      with your data. Install this version as a new release, copy the data over with `mysqldump`, then
      uninstall the old release.

migrations:
  # 1.2.0 split the limits into min and max values.
  - { fromVersions: "<1.2.0", from: resources.cpu, to: resources.maxCpu }
  - { fromVersions: "<1.2.0", from: resources.memory, to: resources.maxMemory }
  # 1.2.0 changed the default passwords (root-pw and pw), and MySQL keeps the ones it was initialized
  # with: carry them even when the release kept the old defaults (the upgrade is blocked above anyway).
  - fromVersions: "<1.2.0"
    to: config.rootPassword
    valueExpr: self.config.rootPassword
    note: MySQL keeps the root password it was initialized with, so the installed one is kept.
  - fromVersions: "<1.2.0"
    to: config.password
    valueExpr: self.config.password
    note: MySQL keeps the user password it was initialized with, so the installed one is kept.
