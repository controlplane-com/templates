{{- if .Values.phpMyAdmin.enabled }}
kind: workload
name: {{ include "mysql.phpAdmin.name" . }}
description: Admin interface for MySQL database
gvc: {{ .Values.global.cpln.gvc }}
tags:
  {{- include "mysql.tags" . | nindent 2 }}
spec:
  type: serverless
  containers:
    - name: phpmyadmin
      env:
        # Connection target only. phpMyAdmin presents a login form (auth_type
        # cookie) and the user supplies credentials there, so this workload is
        # given no identity and no access to any secret.
        - name: PMA_HOST
          value: '{{ include "mysql.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local'
        - name: PMA_PORT
          value: '3306'
      image: {{ .Values.phpMyAdmin.image }}
      inheritEnv: false
      cpu: {{ .Values.phpMyAdmin.resources.cpu | quote }}
      memory: {{ .Values.phpMyAdmin.resources.memory | quote }}
      ports:
        - number: 80
          protocol: http
  defaultOptions:
    # Declared in full: the API fills any field a partial block leaves out,
    # and the Console's Drift tab then shows the workload drifting.
    autoscaling:
      maxConcurrency: 0
      maxScale: 1
      metric: disabled
      minScale: 1
      scaleToZeroDelay: 300
      target: 95
    timeoutSeconds: 5
  firewallConfig:
    external:
      {{- if .Values.phpMyAdmin.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
      inboundBlockedCIDR: []
      # Closed egress: the console reaches the database inside the GVC only.
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.phpMyAdmin.internalAccess.type }}
      {{- if .Values.phpMyAdmin.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.phpMyAdmin.internalAccess.workloads | toYaml | nindent 8 }}
      {{- end }}
{{- end }}
