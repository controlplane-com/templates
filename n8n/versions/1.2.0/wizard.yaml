# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: n8n

# One stateful n8n replica with its own volume and no location handling: every GVC location would run
# its own independent copy.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the single-instance PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Named in the Database step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # n8n connects to <release>-postgres directly: a pooler in front of it would sit unused.
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          n8n connects to its database like any other workload: keep Same GVC, or add the n8n workload under
          Allowed workloads.

steps:
  - id: n8n
    title: n8n
    description: The n8n image, its compute, and the encryption key and owner secrets.
    docs: "#n8n-instance"
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts the single n8n replica, so the editor and webhooks are down for about a
              minute.
          - path: image
            type: string
            format: image
            label: n8n image
            required: true
          - path: resources
            type: resources
            label: Resources
            required: true
            maxRatio: 4
          - path: timezone
            type: string
            label: Timezone
            required: true
            description: The IANA timezone for Schedule triggers and `$now`.
            placeholder: UTC
            suggestions: [UTC, America/New_York, Europe/London, Europe/Berlin, Asia/Tokyo]
      - title: Encryption key
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              The encryption key and owner secrets must exist **before** you install. If one is missing, the
              deployment waits and `cpln logs` shows nothing at all.
          - path: encryptionKey.secretName
            type: ref
            label: Encryption key secret
            required: true
            description: An opaque secret (encoding plain) holding a random key.
            help: >-
              n8n encrypts every stored credential with this key. Back it up, and never change it after first
              boot: n8n refuses to start on a different key, and stored credentials cannot be decrypted without it.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                encoding: plain
                suggestName: "context.releaseName + '-n8n-encryption-key'"
                hint: "Generate the content with: openssl rand -hex 24"
            rules:
              - rule: self.encryptionKey.secretName != ''
                mirrors: n8n.validate
                message: Name the prerequisite encryption key secret; the chart does not render without it.
              - rule: oldSelf == null || self.encryptionKey.secretName == oldSelf.encryptionKey.secretName
                severity: info
                message: >-
                  The new secret must hold the same key as the installed one, or n8n does not start and stored
                  credentials cannot be decrypted.
      - title: Instance owner
        docs: "#prerequisites"
        fields:
          - path: owner.secretName
            type: ref
            label: Owner secret
            required: true
            description: A dictionary secret with `email` and `passwordHash`, a bcrypt hash of the owner password.
            help: >-
              n8n re-applies the owner from this secret on every start, so editing the secret and forcing a
              redeployment changes the login.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [email, passwordHash]
              create:
                suggestName: "context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '1.1.0') < 0 ? context.releaseName + '-n8n-owner-secret' : context.releaseName + '-n8n-owner'"
                hint: "Hash the password with: htpasswd -bnBC 10 \"\" 'your-password' | tr -d ':\\n'"
            rules:
              - rule: self.owner.secretName != ''
                mirrors: n8n.validate
                message: Name the prerequisite owner secret; the chart does not render without it.
              # 1.0.x rendered its own owner secret, <release>-n8n-owner (keys email and password-hash); upgrading
              # to 1.1.0 or later prunes it, so a release pointed at that name would reference a deleted secret.
              - rule: >-
                  context.mode != 'upgrade' || context.fromVersion == null ||
                  semverCompare(context.fromVersion, '1.1.0') >= 0 ||
                  self.owner.secretName != context.releaseName + '-n8n-owner'
                message: >-
                  That secret belongs to the 1.0.x release, and this upgrade deletes it. Create a new dictionary
                  secret with the keys email and passwordHash (a bcrypt hash of the password you log in with today)
                  and choose it here.
          - path: owner.firstName
            type: string
            label: Owner first name
          - path: owner.lastName
            type: string
            label: Owner last name

  - id: storage
    title: Storage
    description: The volume set with n8n's instance config and binary execution data.
    docs: "#n8n-instance"
    fields:
      - path: volumeset.capacity
        type: integer
        label: Initial capacity
        unit: GiB
        min: 10
        required: true
        suggestions: [10, 20, 50, 100, 250]
        help: Uninstalling the release deletes the volume set.
    rules:
      - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: A volume set cannot shrink. Keep the capacity at or above the installed size.

  - id: access
    title: Access
    description: Who reaches the editor and webhooks, from the internet and from inside the GVC.
    docs: "#access"
    sections:
      - title: Public access
        fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public HTTPS endpoint
            description: The editor, API and webhooks on the workload's `*.cpln.app` endpoint.
      - title: Internal access
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            options:
              - { value: none, label: None, description: No workload can reach n8n internally. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
            rules:
              - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
                mirrors: n8n.validate
                message: The internal access must be none, same-gvc, same-org or workload-list.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning

  - id: database
    title: Database
    description: The bundled PostgreSQL and the credentials it is created with.
    docs: "#database"
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
            rules:
              - rule: self.postgresHA.enabled != self.postgres.enabled
                mirrors: n8n.validate
                message: Enable exactly one database, highly available or single-instance.
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
      - id: credentials
        title: Credentials
        description: >-
          The login of whichever PostgreSQL is chosen above. The highly available database creates the secret
          <release>-postgres-config from its values; for the single-instance database, n8n creates the secret
          named below. There is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.4.0 takes them from a secret
              you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: Used as typed, so replace the published default.
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.credentials.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgres.credentials.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: Used as typed, so replace the published default.
          - path: postgres.credentials.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.config.credentialsSecretName
            type: string
            label: Credentials secret name
            required: true
            when: self.postgres.enabled
            description: The dictionary secret n8n creates from the credentials above. Secret names are org-wide.
            pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
            patternMessage: Use lowercase letters, digits and hyphens, starting with a letter.
        rules:
          # The HA database (postgres-highly-available 2.4.2) writes the user and password unquoted into an
          # unquoted shell heredoc that becomes Patroni's YAML config (loaded as YAML 1.1), and the user and
          # database name into an unquoted psql command and CREATE DATABASE (templates/secret-startup.yaml).
          # Reproduced by running the heredoc with sh and loading the result with PyYAML: $ and ` are expanded,
          # a \ before $ ` \ or at the end is consumed, YAML indicators at the start, ': ', ' #' and a lone
          # - ~ = break or alter the value, and numbers, dates, 1:30 and yes/no/on/off change type. Quotes, :
          # and ! inside the value are kept.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              [self.postgresHA.postgres.password].all(x,
              !x.matches('[$`]') && !x.matches('\\\\([$`\\\\]|$)') &&
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']) && !(x in ['~', '=', '<<']) &&
              !x.matches('^[-+]?([0-9][0-9_]*|0b[01_]+|0x[0-9a-fA-F_]+)$') &&
              !x.matches('^[-+]?([0-9][0-9_]*)?\\.[0-9_]*([eE][-+][0-9]+)?$') &&
              !x.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              The highly available database writes the password unquoted into a shell script and its YAML config.
              Leave out $ and `, a \ before $, ` or \ or at the end, a leading space or YAML symbol, ": " and " #", and
              values that read as a number, a date, yes/no, on/off, true/false or null.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              (self.postgresHA.postgres.username.matches('^[A-Za-z_][A-Za-z0-9_.-]*$') &&
              !(self.postgresHA.postgres.username.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']))
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Use letters, digits, _ . and -, starting with a letter or underscore, and not yes/no, on/off,
              true/false or null. The highly available database writes the user unquoted into its YAML config and
              a psql command.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database) ||
              self.postgresHA.postgres.database.matches('^[a-z_][a-z0-9_]*$')
            severity: warning
            paths: [postgresHA.postgres.database]
            message: >-
              Use lowercase letters, digits and underscores, starting with a letter or underscore. The highly
              available database creates it with an unquoted CREATE DATABASE, which folds the name to lowercase,
              while n8n connects with the name as typed.
          # The single-instance PostgreSQL's readiness probe runs pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          # through sh -c without quotes.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.credentials.username == oldSelf.postgres.credentials.username &&
              self.postgres.credentials.database == oldSelf.postgres.credentials.database) ||
              (!self.postgres.credentials.username.matches('\\s') && !self.postgres.credentials.database.matches('\\s'))
            severity: warning
            paths: [postgres.credentials.username, postgres.credentials.database]
            message: >-
              Leave out spaces: the database's readiness check passes the user and the database name to pg_isready
              unquoted, so it never becomes ready.
          - when: self.postgresHA.enabled
            rule: oldSelf == null || self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or n8n loses its
              database connection after this upgrade.
          - when: self.postgres.enabled
            rule: oldSelf == null || self.postgres.credentials.password == oldSelf.postgres.credentials.password
            severity: info
            paths: [postgres.credentials.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or n8n loses its
              database connection after this upgrade.
          - when: self.postgres.enabled
            rule: self.postgres.config.credentialsSecretName != 'my-n8n-db-credentials'
            severity: info
            paths: [postgres.config.credentialsSecretName]
            messageExpression: >-
              'Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each n8n release its own name, for example ' + context.releaseName +
              '-n8n-db-credentials.'
            message: >-
              Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each n8n release its own name.
      - id: postgres-ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        fields:
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            description: Per replica.
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
          - rule: self.postgresHA.replicas >= 3
            severity: info
            paths: [postgresHA.replicas]
            message: Fewer than 3 PostgreSQL replicas cannot fail over while one of them is down.
    rules:
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        message: >-
          Switching the database on an installed release deletes the current one, with all of n8n's workflows,
          stored credentials and execution history, and starts an empty one. Keep the current database, or
          install a new release with the other database and move the data.

  - id: backups
    title: Database backups
    description: Optional backups of the highly available PostgreSQL to object storage.
    docs: "#database-backups"
    when: self.postgresHA.enabled
    sections:
      - id: backup
        title: Scheduled backups
        toggle: postgresHA.backup.enabled
        description: >-
          Logical dumps on a schedule, or continuous WAL-G archiving with periodic base backups. Uninstalling
          the release deletes the database volumes, so turn this on if your workflows and credentials matter.
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps, description: A scheduled pg_dump of every database. }
              - { value: wal-g, label: WAL-G, description: Continuous WAL archiving plus periodic base backups. }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Base backup interval
            unit: s
            required: true
            min: 1
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions:
              - { value: 3600, label: "3600 (hourly)" }
              - { value: 21600, label: "21600 (6 hours, default)" }
              - { value: 86400, label: "86400 (daily)" }
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Logical backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
            description: Used by whichever mode is on.
      - title: AWS S3
        when: self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#database-backups"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
            patternMessage: Use lowercase letters, digits, dots and hyphens (3 to 63 characters).
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
            patternMessage: Use an AWS region name, such as us-east-1.
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.aws.prefix != null && self.postgresHA.backup.aws.prefix != ''
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> (WALG_S3_PREFIX / WALG_GS_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: Google Cloud Storage
        when: self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#database-backups"
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "A GCP [cloud account](/guides/create-cloud-account) for the project that owns the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgresHA.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.gcp.prefix != null && self.postgresHA.backup.gcp.prefix != ''
            severity: warning
            paths: [postgresHA.backup.gcp.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.gcp.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.gcp.prefix == oldSelf.postgresHA.backup.gcp.prefix) ||
              [self.postgresHA.backup.gcp.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.gcp.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> (WALG_S3_PREFIX / WALG_GS_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.gcp.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.gcp.prefix == oldSelf.postgresHA.backup.gcp.prefix) ||
              [self.postgresHA.backup.gcp.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.gcp.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: MinIO or S3-compatible
        when: self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'minio'
        docs: "#database-backups"
        fields:
          - type: note
            severity: warning
            text: >-
              The access and secret keys are stored in the Helm release in plain text. Version 1.3.1 takes them
              from a secret you create instead.
          - path: postgresHA.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgresHA.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.minio.accessKey
            type: string
            label: Access key
            required: true
            example: true
          - path: postgresHA.backup.minio.secretKey
            type: string
            label: Secret key
            required: true
            sensitive: true
            widget: password
            example: true
          - path: postgresHA.backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.minio.prefix != null && self.postgresHA.backup.minio.prefix != ''
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.minio.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.minio.prefix == oldSelf.postgresHA.backup.minio.prefix) ||
              [self.postgresHA.backup.minio.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> (WALG_S3_PREFIX / WALG_GS_PREFIX),
          # so ' #' starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.minio.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.minio.prefix == oldSelf.postgresHA.backup.minio.prefix) ||
              [self.postgresHA.backup.minio.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.

# Rules over values outside the steps: their issues show on the fields named in paths.
rules:
  # The postgres import's own rule for these keys is dropped with the excluded secret field, so it is repeated here.
  - rule: >-
      !self.postgres.enabled || (!has(self.postgres.config.username) && !has(self.postgres.config.password) &&
      !has(self.postgres.config.database))
    paths: [postgres.credentials.username]
    message: >-
      postgres.config.username, password and database were removed in 1.2.0: move them to the database
      credentials (postgres.credentials) and remove them from postgres.config.
  - rule: "!has(self.owner.email) && !has(self.owner.password)"
    mirrors: n8n.validateRemovedKeys
    paths: [owner.secretName]
    message: >-
      owner.email and owner.password were removed in 1.1.0: put the email and a bcrypt hash of the password
      you use today into the owner secret, and remove them from the values.
  - rule: >-
      !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
      dyn(self.postgresHA)['proxy']['enabled'] == true
    mirrors: n8n.validate
    paths: [postgres.enabled]
    message: postgresHA.proxy.enabled must stay true; the HAProxy leader endpoint is n8n's database endpoint.
  - rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks n8n, which connects to its database like any other workload.'
  - when: self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-n8n') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-n8n, or n8n cannot reach its database.'"
    fix:
      path: postgres.internalAccess.workloads
      items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-n8n']"
    message: Add the n8n workload to the list, or n8n cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: n8n connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.2.0"
    from: postgres.config.username
    to: postgres.credentials.username
  - fromVersions: "<1.2.0"
    from: postgres.config.password
    to: postgres.credentials.password
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: "<1.2.0"
    from: postgres.config.database
    to: postgres.credentials.database
  # The renames above move changed values only; carry the installed values whatever they are, so a release on
  # the single-instance database keeps its login (the defaults were the same, but a release may have kept them).
  - fromVersions: "<1.2.0"
    to: postgres.credentials.username
    valueExpr: self.postgres.config.username
  - fromVersions: "<1.2.0"
    to: postgres.credentials.password
    valueExpr: self.postgres.config.password
  - fromVersions: "<1.2.0"
    to: postgres.credentials.database
    valueExpr: self.postgres.config.database
  - fromVersions: "<1.1.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<1.1.0"
    from: resources.memory
    to: resources.maxMemory
  - fromVersions: "<1.1.0"
    from: owner.email
    note: The owner email moved into the owner secret (key email); choose it under n8n.
  - fromVersions: "<1.1.0"
    from: owner.password
    note: >-
      The owner password moved into the owner secret as a bcrypt hash (key passwordHash). Hash the password you
      use today: n8n re-applies the owner on every start.
