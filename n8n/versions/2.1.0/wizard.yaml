# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: n8n

# One stateful n8n replica with its own volume and no location handling: every GVC location would run
# its own independent copy.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 4.0.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the single-instance PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Named in the Database step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # n8n connects to <release>-postgres directly: a pooler in front of it would sit unused.
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          n8n connects to its database like any other workload: keep Same GVC, or add the n8n workload under
          Allowed workloads.

  - template: postgres-highly-available
    version: 3.0.0
    alias: postgresHA
    when: self.postgresHA.enabled
    title: Highly available PostgreSQL
    after: database
    steps:
      - { id: cluster, title: Database cluster, description: The Patroni-managed PostgreSQL members n8n stores its workflows and credentials in. }
      - { id: storage, title: Database storage }
      - { id: etcd, title: Database consensus }
      - { id: network, title: Database network }
      - id: backup
        title: Database backups
        description: >-
          Optional backups to object storage. Uninstalling the release deletes the database volumes, so turn
          this on if your workflows and credentials matter.
    exclude:
      # Named in the Database step, next to the single-instance mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # n8n connects to the HAProxy leader endpoint directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      multiZone:
        description: >-
          Applies to the PostgreSQL members and their HAProxy workloads. Confirm that your location supports
          multiple zones.
      internal_access.type:
        description: >-
          n8n connects through the HAProxy endpoint like any other workload: keep Same GVC, or add the n8n
          workload under Allowed workloads.

steps:
  - id: n8n
    title: n8n
    description: The n8n workload, its prerequisite secrets, its volume and who can reach it.
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Every upgrade restarts the single n8n replica, so the editor and webhooks are down for about two
              minutes.
          - type: note
            severity: warning
            when: context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '1.5.0') < 0
            text: >-
              This upgrade moves n8n from 2.29.8 to 2.45.4, which migrates the database on its first start. Rolling
              back to an earlier chart version is not supported, so back up the database first. Schedule Triggers
              set to "every N seconds/minutes" then run N apart from when the workflow was activated, instead of on
              clock boundaries.
          - path: image
            type: string
            format: image
            label: n8n image
            docs: "#n8n-instance"
            required: true
            rules:
              - rule: >-
                  !(self.image.split(':')[0] in ['n8nio/n8n', 'docker.io/n8nio/n8n']) ||
                  size(self.image.split(':')) < 2 ||
                  !self.image.split(':')[1].matches('^[0-9]+[.][0-9]+[.][0-9]+') ||
                  semverCompare(self.image.split(':')[1].split('@')[0].split('-')[0], '2.45.4') >= 0
                mirrors: n8n.validateImage
                message: >-
                  n8n before 2.45.4 carries Critical CVEs, including vm2 sandbox escapes (CVE-2026-100721,
                  CVE-2026-47686, CVE-2026-47698). Use n8nio/n8n:2.45.4.
          - path: resources
            type: resources
            label: Resources
            required: true
            maxRatio: 4
          - path: timezone
            type: string
            label: Timezone
            required: true
            description: The IANA timezone for Schedule triggers and `$now`.
            placeholder: UTC
            suggestions: [UTC, America/New_York, Europe/London, Europe/Berlin, Asia/Tokyo]
      - title: Encryption key
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              The encryption key and owner secrets must exist **before** you install. If one is missing, the
              deployment waits and `cpln logs` shows nothing at all.
          - path: encryptionKey.secretName
            type: ref
            label: Encryption key secret
            required: true
            description: An opaque secret (encoding plain) holding a random key.
            help: >-
              n8n encrypts every stored credential with this key. Back it up, and never change it after first
              boot: n8n refuses to start on a different key, and stored credentials cannot be decrypted without it.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                encoding: plain
                suggestName: "context.releaseName + '-n8n-encryption-key'"
                hint: "Generate the content with: openssl rand -hex 24"
            rules:
              - rule: self.encryptionKey.secretName != ''
                mirrors: n8n.validate
                message: Name the prerequisite encryption key secret; the chart does not render without it.
              - rule: oldSelf == null || self.encryptionKey.secretName == oldSelf.encryptionKey.secretName
                severity: info
                message: >-
                  The new secret must hold the same key as the installed one, or n8n does not start and stored
                  credentials cannot be decrypted.
      - title: Instance owner
        fields:
          - path: owner.secretName
            type: ref
            label: Owner secret
            required: true
            description: A dictionary secret with `email` and `passwordHash`, a bcrypt hash of the owner password.
            help: >-
              n8n re-applies the owner from this secret on every start, so editing the secret and forcing a
              redeployment changes the login.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [email, passwordHash]
              create:
                suggestName: "context.releaseName + '-n8n-owner'"
                hint: "Hash the password with: htpasswd -bnBC 10 \"\" 'your-password' | tr -d ':\\n'"
            rules:
              - rule: self.owner.secretName != ''
                mirrors: n8n.validate
                message: Name the prerequisite owner secret; the chart does not render without it.
          - path: owner.firstName
            type: string
            label: Owner first name
          - path: owner.lastName
            type: string
            label: Owner last name
      - title: Storage
        fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250]
            description: The volume set with n8n's instance config and binary execution data.
            help: Uninstalling the release deletes the volume set.
            rules:
              - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
                message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - title: Public access
        docs: "#access"
        fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public HTTPS endpoint
            description: The editor, API and webhooks on the workload's `*.cpln.app` endpoint.
      - title: Internal access
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            options:
              - { value: none, label: None, description: No workload can reach n8n internally. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
            rules:
              - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
                mirrors: n8n.validate
                message: The internal access must be none, same-gvc, same-org or workload-list.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning


  - id: database
    title: Database
    description: The bundled PostgreSQL and its prerequisite credentials secret.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            docs: "#database"
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
            rules:
              - rule: self.postgresHA.enabled != self.postgres.enabled
                mirrors: n8n.validate
                message: Enable exactly one database, highly available or single-instance.
          # Declared so the imports' conditions are fields; the chooser above writes them, so they are never shown.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            when: self.postgres.enabled == null   # never shown: the Database choice writes it
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            when: self.postgresHA.enabled == null   # never shown: the Database choice writes it
            description: Set by the database choice above.
      - title: Credentials
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '2.0.0') < 0 &&
              self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
            text: >-
              Before you upgrade, update the IAM policy of your backup bucket to the action list in the README
              (AWS S3). The backup identity no longer carries `cpln-connector` or `aws::ReadOnlyAccess`, so with the
              old policy the backups fail.
          - type: note
            severity: warning
            text: >-
              The database credentials secret must exist **before** you install. If it is missing, the
              deployment waits and `cpln logs` shows nothing at all.
          - path: postgresHA.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            when: self.postgresHA.enabled
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL initializes from it and n8n connects with it. PostgreSQL reads it only when its data
              directory is first initialized, so editing it later does not change the database password.
              In HA mode the order differs: move the leader to member -0 first (see the README's HA rotation steps).
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-n8n-db-credentials'"
                hint: "Generate the password with: openssl rand -hex 24"
          - path: postgres.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            when: self.postgres.enabled
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL initializes from it and n8n connects with it. PostgreSQL reads it only when its data
              directory is first initialized, so editing it later does not change the database password.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-n8n-db-credentials'"
                hint: "Generate the password with: openssl rand -hex 24"
        rules:
          - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.4.0') >= 0) && self.postgresHA.enabled
            rule: self.postgresHA.config.credentialsSecretName == oldSelf.postgresHA.config.credentialsSecretName
            severity: info
            paths: [postgresHA.config.credentialsSecretName]
            message: >-
              PostgreSQL reads the credentials only when its data directory is first initialized; pointing at
              another secret does not change the existing user or password.
          # Upgrading from 1.3.x, the chart-created secret is deleted by the upgrade itself, so the new
          # prerequisite secret must have a different name (holding the same username, password and database).
          - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0 && self.postgresHA.enabled
            rule: self.postgresHA.config.credentialsSecretName != oldSelf.postgresHA.config.credentialsSecretName
            paths: [postgresHA.config.credentialsSecretName]
            message: >-
              The previous version created the database secret itself, and this upgrade deletes it. Create a
              secret under a NEW name holding the same username, password and database, and name it here.
          - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0 && self.postgres.enabled
            rule: self.postgres.config.credentialsSecretName != oldSelf.postgres.config.credentialsSecretName
            paths: [postgres.config.credentialsSecretName]
            message: >-
              The previous version created the database secret itself, and this upgrade deletes it. Create a
              secret under a NEW name holding the same username, password and database, and name it here.
# Rules over values outside the steps: their issues show on the fields named in paths. Rules without paths
# only trip on YAML edits (the Database choice writes the hidden switches); they block Install and show on Review.
rules:
  # n8n.validatePostgresHAImage also refuses tags 0.1-0.7; the import's own image rule says that, so this
  # one keeps only the check the child does not make. The field is required, so it shows only in YAML mode.
  - rule: "!self.postgresHA.enabled || (has(self.postgresHA.image) && self.postgresHA.image != '')"
    mirrors: n8n.validatePostgresHAImage
    paths: [postgresHA.image]
    message: Set postgresHA.image to controlplanecorporation/patroni-postgres:0.9, or remove it from the values to use the chart default.
  # The postgres import's own rule for these keys is dropped with the excluded secret field, so it is repeated here.
  - rule: >-
      !self.postgres.enabled || (!has(self.postgres.config.username) && !has(self.postgres.config.password) &&
      !has(self.postgres.config.database))
    paths: [postgres.config.credentialsSecretName]
    message: >-
      postgres.config.username, password and database are no longer read: put them in the database credentials
      secret and remove them from the values.
  - rule: "!has(self.postgres.credentials)"
    mirrors: n8n.validateRemovedKeys
    message: >-
      postgres.credentials was removed in 1.4.0: the database credentials are now a prerequisite dictionary
      secret named under Database. Remove postgres.credentials from the values.
  - rule: "!has(self.owner.email) && !has(self.owner.password)"
    mirrors: n8n.validateRemovedKeys
    paths: [owner.secretName]
    message: >-
      owner.email and owner.password were removed in 1.1.0: put the email and a bcrypt hash of the password
      you use today into the owner secret, and remove them from the values.
  - rule: "!has(self.postgresHA.postgres)"
    message: >-
      The postgresHA.postgres block was removed in 1.3.0. Put its username, password and database into the
      database credentials secret, and remove the block.
  - rule: >-
      !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
      dyn(self.postgresHA)['proxy']['enabled'] == true
    mirrors: n8n.validate
    message: postgresHA.proxy.enabled must stay true; the HAProxy leader endpoint is n8n's database endpoint.
  - rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks n8n, which connects to its database like any other workload.'
  - when: self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-n8n') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-n8n, or n8n cannot reach its database.'"
    fix:
      path: postgres.internalAccess.workloads
      items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-n8n']"
    message: Add the n8n workload to the list, or n8n cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: n8n connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.
  - path: postgresHA.pgbouncer
    reason: n8n connects to the HAProxy leader endpoint directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.4.0"
    from: postgres.credentials
    note: >-
      This setting served both database modes (single-instance and HA). The database credentials are now a
      prerequisite dictionary secret (username, password, database). Create it under a NEW name with the values the
      database was initialized with, and choose it under Database.
  - fromVersions: "<1.3.0"
    from: postgresHA.postgres
    note: >-
      Put its username, password and database, unchanged, into the database credentials secret and choose it
      under Database.
  - fromVersions: "<1.2.0"
    from: postgres.config.username
    note: Put it in the database credentials secret (key username).
  - fromVersions: "<1.2.0"
    from: postgres.config.password
    note: Put it in the database credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.2.0"
    from: postgres.config.database
    note: Put it in the database credentials secret (key database).
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.accessKey
    note: The MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.3.1"
    from: postgresHA.backup.minio.secretKey
    note: The MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.1.0"
    from: owner.email
    note: The owner email moved into the owner secret (key email); choose it under n8n.
  - fromVersions: "<1.1.0"
    from: owner.password
    note: >-
      The owner password moved into the owner secret as a bcrypt hash (key passwordHash). Hash the password you
      use today: n8n re-applies the owner on every start.
