{{- /* Helm does not render templates in alphabetical order, so a malformed
       `locations` reaches the loops below before identity.yaml's aggregate
       validator has ever run -- the user then gets `range can't iterate over []`
       instead of a sentence naming the fix. Validation is idempotent, so running
       it at every entry point costs nothing. */ -}}
{{- include "nats.validate" . -}}
kind: secret
name: {{ include "nats.secret.name" . }}
description: NATS startup script
tags: {{- include "nats.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu

    # ── Runtime environment provided by Control Plane ─────────────────────────
    # GVC comes from the built-in, not from Helm: this chart no longer creates or
    # names a GVC, so a render-time name could only ever drift from where the
    # workload actually runs.
    GVC="${CPLN_GVC}"
    LOCATION="${CPLN_LOCATION##*/}"
    WORKLOAD="{{ include "nats.name" . }}"
    HOST="${HOSTNAME:-$(hostname)}"
    REPLICA_IDX="${HOST##*-}"
    SELF="replica-${REPLICA_IDX}.${WORKLOAD}.${LOCATION}.${GVC}"
    CLUSTER_PORT="{{ .Values.nats_defaults.cluster.port }}"

    # The configured roster, as "location:replicas" pairs, baked in at render time.
    CONFIGURED="{{ range .Values.locations }}{{ .name }}:{{ .replicas | int }} {{ end }}"
    CONFIGURED_LOCS=""
    TOTAL_SERVERS=0
    LOC_REPLICAS=0
    for pair in ${CONFIGURED}; do
      CONFIGURED_LOCS="${CONFIGURED_LOCS}${pair%%:*} "
      TOTAL_SERVERS=$((TOTAL_SERVERS + ${pair##*:}))
      if [ "${pair%%:*}" = "${LOCATION}" ]; then
        LOC_REPLICAS="${pair##*:}"
      fi
    done

    # ── Check A: never start in a location this release did not ask for ───────
    # defaultOptions.minScale/maxScale are 0, so the platform should never place a
    # replica in an undeclared location. This is the last line of defence if it
    # does. Such a server names its cluster after its own location, so no other
    # server has a route to it and no gateway names it: it would accept clients
    # into a cluster of one and silently drop everything they publish.
    # Unconditional — fresh or not, this server can never join the cluster.
    case " ${CONFIGURED_LOCS} " in
      *" ${LOCATION} "*) : ;;
      *) echo "[nats] FATAL: this server is running in location '${LOCATION}', which is not in the configured location list (${CONFIGURED_LOCS% })." >&2
         echo "[nats] No other server routes to it and no gateway names it, so it would accept clients into a cluster of one and silently drop their messages." >&2
         echo "[nats] Remove this location from GVC '${GVC}', or add it to the 'locations' list in your values." >&2
         exit 1 ;;
    esac

    # ── Freshness ─────────────────────────────────────────────────────────────
    {{- if .Values.jetstream.enabled }}
    # JetStream state lives on the retained volume set. A server with a populated
    # store is a LIVE member of a running cluster, so the GVC checks below only
    # ever warn for it — refusing to start would turn "one location went away"
    # into "the whole message bus is down".
    if [ -d "/data/nats" ] && [ -n "$(ls -A /data/nats 2>/dev/null)" ]; then
      FRESH="false"
    else
      FRESH="true"
    fi
    {{- else }}
    # JetStream is disabled, so this server holds NO persistent state and there is
    # no fresh-vs-initialised distinction to make. It is deliberately treated as
    # initialised, i.e. the GVC checks below warn and never exit:
    #   - core NATS has no quorum and no data, so a location missing from the GVC
    #     costs redundancy, not correctness; and
    #   - a stateless server is rescheduled routinely, so exiting on a GVC that
    #     changed after install would take a live, working bus permanently offline
    #     the next time any replica moved.
    # Check A above still exits, because that case is never merely redundancy.
    FRESH="false"
    {{- end }}

    # ── Boot-time GVC read ────────────────────────────────────────────────────
    # The platform accepts a localOptions entry naming a location the GVC does not
    # have: it is stored verbatim and is simply inert. Helm cannot see a live GVC,
    # and peer unreachability is not usable as the signal (surviving a peer outage
    # is the product). So ask the GVC itself.
    #
    # This image has NO curl — nats:2.11.6-alpine ships busybox wget only (checked
    # against the pinned tag). Bounding, measured in THIS image: -T 8 bounds BOTH
    # slow arms at 8 s — a blackholed connect (SYN dropped, so connect() hangs)
    # and a server that accepts and never responds. A refused connection returns
    # in 0 s, which is the negative control that makes those numbers mean
    # something; an NXDOMAIN also returns instantly and would have proved nothing
    # about the bound. "timeout 12" is the backstop if wget itself hangs. Worst
    # case 3 x 12 + 2 x 2 = 40 s. Do not tighten: a timeout short enough to trip
    # on a slow API turns this check off exactly when it is needed.
    GVC_LOCS=""
    GVC_READ_OK="false"
    GVC_ERR=""
    GVC_BODY=$(mktemp)
    for _try in 1 2 3; do
      if GVC_ERR=$(timeout 12 wget -q -T 8 -O "${GVC_BODY}" \
        --header "Authorization: ${CPLN_TOKEN:-}" \
        "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>&1); then
        GVC_LOCS=$(tr -d ' \n' < "${GVC_BODY}" \
          | sed -n 's/.*"locationLinks":\[\([^]]*\)\].*/\1/p' \
          | tr ',' '\n' | sed 's#.*/##;s/"//g' | tr '\n' ' ')
        if [ -n "${GVC_LOCS}" ]; then
          GVC_READ_OK="true"
          break
        fi
        GVC_ERR="read OK but the response carried no spec.staticPlacement.locationLinks"
      fi
      sleep 2
    done
    rm -f "${GVC_BODY}"

    MISSING=""
    PRESENT_SERVERS=0
    if [ "${GVC_READ_OK}" != "true" ]; then
      # A control-plane hiccup must never be the reason NATS refuses to start.
      # Skip the API-backed checks; Check A above still applies.
      echo "[nats] WARNING: could not read the location list of GVC '${GVC}' — skipping the GVC location check. Last error: ${GVC_ERR}" >&2
      echo "[nats] A 403 here means the GVC-read policy is missing: this release's identity needs 'view' on GVC '${GVC}'." >&2
    else
      for pair in ${CONFIGURED}; do
        loc="${pair%%:*}"
        case " ${GVC_LOCS} " in
          *" ${loc} "*) PRESENT_SERVERS=$((PRESENT_SERVERS + ${pair##*:})) ;;
          *) MISSING="${MISSING}${loc} " ;;
        esac
      done
      EXTRA=""
      for loc in ${GVC_LOCS}; do
        case " ${CONFIGURED_LOCS} " in
          *" ${loc} "*) : ;;
          *) EXTRA="${EXTRA}${loc} " ;;
        esac
      done
      if [ -n "${EXTRA}" ]; then
        echo "[nats] GVC '${GVC}' also has locations this release does not use: ${EXTRA% } — no NATS server runs there (minScale/maxScale are 0 outside localOptions)."
      fi

      # ── Check B: every declared location must exist in the GVC ──────────────
      if [ -n "${MISSING}" ]; then
        echo "[nats] locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "[nats] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "[nats] ${PRESENT_SERVERS} of ${TOTAL_SERVERS} declared servers can actually start. Every running server keeps retrying route and gateway URLs in the missing location(s), which can never answer." >&2
        if [ "${FRESH}" = "true" ]; then
          echo "[nats] FATAL: refusing to bootstrap JetStream on a cluster smaller than it was configured to be. It would report healthy with less fault tolerance than you asked for, and every stream created against it would place its replicas accordingly." >&2
          echo "[nats] Add the missing location(s) to the GVC, or remove them from the 'locations' list in your values." >&2
          exit 1
        fi
        echo "[nats] This server keeps running rather than taking a live cluster down." >&2
      # ── Check C: JetStream must not land on exactly 2 servers ───────────────
      # The render-time validator refuses a 2-server roster, but it can only see
      # the VALUES. A 3-server roster with one location absent from the GVC is a
      # 2-server cluster in reality — the one shape strictly worse than a single
      # server, because quorum is 2 of 2.
      elif [ "${PRESENT_SERVERS}" = "2" ]; then
        echo "[nats] WARNING: exactly 2 servers are running. If JetStream is enabled its quorum is 2 of 2, so losing either one takes JetStream down completely — worse than a single standalone server. Use 1 server or at least 3." >&2
      else
        echo "[nats] GVC location check OK — '${GVC}' has every configured location (${CONFIGURED_LOCS% })"
      fi
    fi

    # ── Build nats.conf ───────────────────────────────────────────────────────
    # Static values are rendered by Helm; anything location- or replica-dependent
    # is resolved here, at runtime.
    (
    printf 'server_name: "%s"\n\n' "${SELF}"
    printf 'listen: "0.0.0.0:{{ .Values.nats_defaults.port }}"\n'
    printf 'http: "0.0.0.0:8222"\n\n'

    printf 'cluster {\n'
    printf '  name: "%s"\n' "${LOCATION}"
    printf '  listen: "0.0.0.0:%s"\n' "${CLUSTER_PORT}"
    printf '  advertise: "%s.cpln.local:%s"\n' "${SELF}" "${CLUSTER_PORT}"
    printf '  routes: [\n'
    i=0
    while [ "${i}" -lt "${LOC_REPLICAS}" ]; do
      if [ "${i}" != "${REPLICA_IDX}" ]; then
        printf '    "nats://replica-%s.%s.%s.%s.cpln.local:%s"\n' \
          "${i}" "${WORKLOAD}" "${LOCATION}" "${GVC}" "${CLUSTER_PORT}"
      fi
      i=$((i+1))
    done
    printf '  ]\n'
    printf '}\n\n'
    {{- if gt (len .Values.locations) 1 }}

    # Gateways join the per-location clusters into a super cluster. Rendered only
    # for a multi-location release: with one location there is no other cluster to
    # reach, and an unused listener is one more port to get wrong. Built from the
    # same CONFIGURED roster the routes above use, so the two can never disagree.
    printf 'gateway {\n'
    printf '  name: "%s"\n' "${LOCATION}"
    printf '  listen: "0.0.0.0:{{ .Values.nats_defaults.gateway.port }}"\n'
    printf '  advertise: "%s.cpln.local:{{ .Values.nats_defaults.gateway.port }}"\n' "${SELF}"
    printf '  gateways: [\n'
    # Every OTHER location — self is excluded, which would otherwise inflate the
    # JetStream cluster size.
    for pair in ${CONFIGURED}; do
      gwloc="${pair%%:*}"
      gwreplicas="${pair##*:}"
      if [ "${gwloc}" != "${LOCATION}" ]; then
        gwurls=""
        k=0
        while [ "${k}" -lt "${gwreplicas}" ]; do
          if [ -n "${gwurls}" ]; then
            gwurls="${gwurls}, "
          fi
          gwurls="${gwurls}\"nats://replica-${k}.${WORKLOAD}.${gwloc}.${GVC}.cpln.local:{{ .Values.nats_defaults.gateway.port }}\""
          k=$((k+1))
        done
        printf '    { name: "%s", urls: [%s] },\n' "${gwloc}" "${gwurls}"
      fi
    done
    printf '  ]\n'
    printf '}\n\n'
    {{- end }}
    {{- if .Values.nats_defaults.websocket.enabled }}
    printf 'websocket {\n'
    printf '  port: {{ .Values.nats_defaults.websocket.port }}\n'
    printf '  no_tls: {{ .Values.nats_defaults.websocket.noTls | default true }}\n'
    printf '  compression: {{ .Values.nats_defaults.websocket.compression | default false }}\n'
    printf '}\n\n'
    {{- end }}
    {{- if .Values.jetstream.enabled }}
    printf 'jetstream {\n'
    printf '  store_dir: "/data/nats"\n'
    printf '}\n\n'
    {{- end }}
    ) > /tmp/nats.conf

    {{- if and .Values.nats_extra_config (ne (.Values.nats_extra_config | trim) "") }}
    cat /etc/nats/nats-extra.conf >> /tmp/nats.conf
    {{- end }}

    echo "[nats] starting server '${SELF}' in cluster '${LOCATION}'"
    exec nats-server -c /tmp/nats.conf

{{- if and .Values.nats_extra_config (ne (.Values.nats_extra_config | trim) "") }}
---

kind: secret
name: {{ include "nats.extraData.name" . }}
description: NATS extra configuration
tags: {{- include "nats.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    {{ .Values.nats_extra_config | trim | nindent 4 }}
{{- end }}
