{{- if .Values.jetstream.enabled }}
kind: volumeset
name: {{ include "nats.volumeset.name" . }}
description: NATS JetStream persistent storage
tags: {{- include "nats.tags" . | nindent 2 }}
spec:
  fileSystemType: xfs
  initialCapacity: {{ .Values.volumeset.capacity }}
  performanceClass: general-purpose-ssd
{{- end }}
