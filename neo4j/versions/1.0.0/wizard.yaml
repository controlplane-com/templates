# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Neo4j
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: credentials
    title: Credentials
    description: The prerequisite secret with the password of the `neo4j` admin user.
    fields:
      - type: note
        severity: warning
        text: >-
          The credentials secret must exist **before** you install. If it is missing, the
          deployment waits and `cpln logs` shows nothing at all.
      - path: auth.credentialsSecretName
        type: ref
        label: Credentials secret
        required: true
        description: >-
          A dictionary secret with the key `password`: at least 8 characters, no `/`. The user
          is always `neo4j`.
        help: >-
          Neo4j reads the password only on its first start. To change it later, run
          `ALTER CURRENT USER SET PASSWORD FROM 'old' TO 'new'` and then update the secret.
        docs: "#credentials"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [password]
          create:
            secretType: dictionary
            suggestName: "context.releaseName + '-neo4j-credentials'"
            hint: "Generate the password with: openssl rand -hex 24"
    rules:
      - rule: self.auth.credentialsSecretName != null && self.auth.credentialsSecretName != ''
        mirrors: neo4j.validateCredentials
        paths: [auth.credentialsSecretName]
        message: Choose the dictionary secret that holds the `password` key.
      - rule: oldSelf == null || self.auth.credentialsSecretName == oldSelf.auth.credentialsSecretName
        severity: info
        paths: [auth.credentialsSecretName]
        message: >-
          Neo4j reads the password only on its first start; pointing at another secret does not
          change the password of the existing database.

  - id: server
    title: Server
    description: The Neo4j image, its compute, and how it splits memory.
    sections:
      - fields:
          - type: note
            severity: warning
            when: context.mode == 'upgrade'
            text: >-
              Neo4j Community runs a single server, so every upgrade restarts it: plan a short
              outage.
          - path: image
            type: string
            format: image
            label: Neo4j image
            required: true
            advanced: true
            help: >-
              Community Edition only, for example `neo4j:2026.09.0-community`. A store cannot be
              moved back to an older Neo4j version.
          - path: resources
            type: resources
            label: Resources
            required: true
            docs: "#resources"
            maxRatio: 4
            cpu: { min: 250m }
            memory: { min: 1Gi }
        rules:
          - rule: "!self.image.lowerAscii().contains('enterprise')"
            mirrors: neo4j.validateImage
            paths: [image]
            message: >-
              Enterprise Edition needs a paid Neo4j license; this template runs Community Edition
              only.
      - title: Memory and plugins
        docs: "#neo4j-memory-and-plugins"
        fields:
          - path: neo4j.heapSize
            type: string
            label: JVM heap
            required: true
            description: Initial and maximum heap, in Neo4j size syntax such as `512m` or `2g`.
            pattern: '^[0-9]+[kKmMgG]$'
            patternMessage: Use a number followed by k, m or g, such as 512m or 2g.
            suggestions: [512m, 1g, 2g, 4g]
          - path: neo4j.pageCacheSize
            type: string
            label: Page cache
            required: true
            description: Memory outside the heap that caches the graph store.
            pattern: '^[0-9]+[kKmMgG]$'
            patternMessage: Use a number followed by k, m or g, such as 512m or 2g.
            suggestions: [512m, 1g, 2g, 4g]
          - path: neo4j.apoc
            type: boolean
            label: Load APOC Core
            description: The standard procedure library, bundled in the image; LangChain and LlamaIndex need it.
        rules:
          - rule: self.neo4j.heapSize.matches('^[0-9]+[kKmMgG]$')
            mirrors: neo4j.validateMemory
            paths: [neo4j.heapSize]
            message: Use a number followed by k, m or g, such as 512m or 2g.
          - rule: self.neo4j.pageCacheSize.matches('^[0-9]+[kKmMgG]$')
            mirrors: neo4j.validateMemory
            paths: [neo4j.pageCacheSize]
            message: Use a number followed by k, m or g, such as 512m or 2g.
          - when: >-
              self.neo4j.heapSize.matches('^[0-9]+[kKmMgG]$') &&
              self.neo4j.pageCacheSize.matches('^[0-9]+[kKmMgG]$')
            rule: >-
              (int(self.neo4j.heapSize.substring(0, size(self.neo4j.heapSize) - 1)) *
              (self.neo4j.heapSize.lowerAscii().endsWith('g') ? 1073741824 :
              self.neo4j.heapSize.lowerAscii().endsWith('m') ? 1048576 : 1024) +
              int(self.neo4j.pageCacheSize.substring(0, size(self.neo4j.pageCacheSize) - 1)) *
              (self.neo4j.pageCacheSize.lowerAscii().endsWith('g') ? 1073741824 :
              self.neo4j.pageCacheSize.lowerAscii().endsWith('m') ? 1048576 : 1024)) * 4 <=
              memoryBytes(self.resources.maxMemory) * 3
            severity: warning
            paths: [neo4j.heapSize, neo4j.pageCacheSize]
            message: >-
              Heap plus page cache is more than 3/4 of the memory limit; the JVM needs the rest,
              and the container may be OOM-killed.

  - id: storage
    title: Storage
    description: The volume set that holds the database and its transaction logs.
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: >-
              Uninstalling the release deletes the volume set and its restorable snapshots.
            docs: "/reference/volumeset#capacity-and-billing"
      - id: snapshots
        title: Volume snapshots
        description: >-
          Snapshots of the data volume, the backup for this template. They are deleted with the
          volume set when you uninstall.
        docs: "#backup-and-restore"
        fields:
          - path: volumeset.snapshots.schedule
            type: string
            format: cron
            label: Snapshot schedule (UTC)
            description: Leave it empty to turn scheduled snapshots off.
            pattern: '^\s*[0-5]?[0-9] +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+\s*$'
            patternMessage: >-
              Use 5 fields with a single fixed minute, such as `0 3 * * *`; macros such as `@daily` are not
              accepted. Snapshots cannot run more often than hourly.
          - path: volumeset.snapshots.retentionDuration
            type: string
            label: Keep snapshots for
            required: true
            placeholder: 7d
            pattern: '^\d+(\.\d+)?[dhm]$'
            patternMessage: Use a number followed by d, h or m, such as 7d or 12h.
        rules:
          - rule: >-
              self.volumeset.snapshots.schedule != null &&
              (self.volumeset.snapshots.schedule == '' ||
              self.volumeset.snapshots.schedule.trim().matches('^[0-5]?[0-9] +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+$'))
            mirrors: neo4j.validateSnapshots
            paths: [volumeset.snapshots.schedule]
            message: >-
              Snapshots run at most hourly: use a 5-field schedule with a single fixed minute, or an
              empty string ("") to turn them off.
      - id: autoscaling
        title: Grow storage automatically
        toggle: volumeset.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            mirrors: neo4j.validateVolumeset
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: self.volumeset.capacity >= 10
        mirrors: neo4j.validateVolumeset
        paths: [volumeset.capacity]
        message: The initial capacity must be at least 10 GiB.
      - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: network
    title: Network access
    description: Who can reach Neo4j. Bolt always stays private.
    sections:
      - title: Public access
        docs: "#public-access"
        fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public HTTPS endpoint
            description: >-
              Serve Neo4j Browser and the HTTP API on the workload's public endpoint, protected by the
              `neo4j` password. Apps using Bolt still connect from inside the GVC.
          - type: note
            severity: warning
            when: self.publicAccess.enabled
            text: >-
              Always use the `https://` address. The endpoint also answers plain `http://`, which
              sends the password unencrypted. Open Browser as
              `https://ENDPOINT/browser/?dbms=https://ENDPOINT:443`: Bolt's port 7687 is not public,
              so a pre-filled `:7687` makes Connect hang. Firewall changes can take a few minutes to apply.
      - title: Internal access
        docs: "#internal-access"
        fields:
          - type: note
            textExpression: >-
              'To open Neo4j Browser from your computer, run `cpln port-forward ' +
              context.releaseName + '-neo4j 7474:7474 7687:7687 --gvc ' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') +
              '`, open http://localhost:7474/browser/ and connect to `bolt://localhost:7687`.'
            text: >-
              To open Neo4j Browser from your computer, port-forward 7474 and 7687 with
              `cpln port-forward`, open http://localhost:7474/browser/ and connect to
              `bolt://localhost:7687`.
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Firewall changes can take a few minutes to take effect.
            options:
              - value: none
                label: None
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            description: Extra workloads allowed to connect, for example from another GVC.
            when: self.internalAccess.type in ['same-gvc', 'workload-list']
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internalAccess.type == 'same-gvc'
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: neo4j.validateInternalAccess
        paths: [internalAccess.type]
        message: Choose one of None, Same GVC, Same org or Specific workloads.
      - when: self.internalAccess.type == 'same-gvc' && context.gvc != null
        rule: "!self.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
        severity: info
        paths: [internalAccess.workloads]
        messageExpression: >-
          'Same GVC already allows every workload in this GVC: ' +
          self.internalAccess.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
          ' can be removed from the list.'
        message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: warning
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no client can connect.
