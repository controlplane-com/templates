{{- /*
  Both workloads read their OWN GVC at boot to refuse a fresh install into a
  multi-location GVC — the bundled PostgreSQL and Redis subcharts run in every
  location and this chart cannot pin them.

  Scoped to the ONE install GVC; never `target: all`, which would grant view on
  every GVC in the org.
*/ -}}
kind: policy
name: {{ include "nextcloud.gvcPolicy.name" . }}
description: Nextcloud GVC read policy
tags: {{- include "nextcloud.tags" . | nindent 4 }}
bindings:
  - permissions:
      - view
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "nextcloud.identity.name" . }}
targetKind: gvc
targetLinks:
  - //gvc/{{ .Values.global.cpln.gvc }}
