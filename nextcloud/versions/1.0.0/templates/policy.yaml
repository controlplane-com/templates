kind: policy
name: {{ include "nextcloud.policy.name" . }}
description: Nextcloud secret access
tags: {{- include "nextcloud.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "nextcloud.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ include "nextcloud.secret.db.name" . }}
  - //secret/{{ .Values.admin.secretName }}
  {{- if .Values.redis.enabled }}
  - //secret/{{ include "nextcloud.redis.secretName" . }}
  {{- end }}
  {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.auth.secretName }}
  - //secret/{{ .Values.storage.s3.auth.secretName }}
  {{- end }}
