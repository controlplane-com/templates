# ─── Location ─────────────────────────────────────────────────────────────────
# The ONE location of your GVC that Nextcloud runs in; it must already be a GVC location.
location: aws-us-east-1

# ─── Nextcloud ────────────────────────────────────────────────────────────────
nextcloud:
  image: nextcloud:34.0.5-apache   # one major version at a time on upgrade; never downgrade
  # 1-10 interchangeable replicas; 2+ needs redis.enabled: true (shared sessions and file locks)
  # set nextcloud.replicas: 2 and postgresHA.enabled: true for near-zero-downtime restarts and failover
  replicas: 1
  publicUrl: ""                    # empty = canonical endpoint; custom domain with scheme, e.g. https://cloud.example.com
  maxRequestWorkers: 20            # Apache workers per replica (~100 MiB each); raise with resources.maxMemory
  php:
    memoryLimit: 512M              # PHP memory_limit (minimum 512M)
  uploads:
    maxSize: 16G                   # largest single request body; browser uploads are chunked and not bound by it
  resources:
    minCpu: 500m
    maxCpu: 2000m
    minMemory: 1Gi
    maxMemory: 2Gi

# ─── Background jobs (one replica, always) ────────────────────────────────────
cron:
  resources:
    minCpu: 100m
    maxCpu: 1000m
    minMemory: 256Mi
    maxMemory: 1Gi

# ─── Admin account ────────────────────────────────────────────────────────────
# REQUIRED — MUST EXIST BEFORE INSTALL, or the deployment WEDGES silently. A `dictionary` with the
# keys username and password (10+ characters). Read on first boot only.
admin:
  secretName: my-nextcloud-admin

# ─── Volume ───────────────────────────────────────────────────────────────────
# Shared by every replica and the cron worker: config, installed apps and (storage.type local) all files.
# Not snapshotted; deleted on uninstall.
volumeset:
  capacity: 10                     # GiB (minimum 10)

# ─── File storage ─────────────────────────────────────────────────────────────
storage:
  type: local                      # local (the volume above) | s3 — fixed at install, cannot be switched later
  s3:
    bucket: my-nextcloud-bucket
    region: us-east-1
    endpoint: ""                   # S3-compatible servers only, e.g. http://my-minio.GVC.cpln.local:9000
    usePathStyle: false            # true for most S3-compatible servers (MinIO)
    cloudAccountName: my-nextcloud-cloud-account   # AWS keyless auth (used when auth.secretName is empty)
    policyName: my-nextcloud-s3-policy             # your bucket-scoped IAM policy (README Storage setup)
    auth:
      secretName: ""               # S3-compatible servers only: dictionary with accessKeyId + secretAccessKey, e.g. my-nextcloud-s3-keys

# ─── Access ───────────────────────────────────────────────────────────────────
publicAccess:
  enabled: true                    # web UI, WebDAV and sync clients on the canonical *.cpln.app endpoint
internalAccess:
  type: same-gvc                   # none | same-gvc | same-org | workload-list
  workloads: []                    # workload-list only; this release's own workloads are always added
  # workloads:
  #   - //gvc/GVC_NAME/workload/WORKLOAD_NAME

# ─── Database: single-instance PostgreSQL (default) ───────────────────────────
# set postgresHA.enabled: true (and postgres.enabled: false) for near-zero-downtime upgrades and failover
postgres:
  enabled: true
  image: postgres:18
  config:
    # REQUIRED — MUST EXIST BEFORE INSTALL, or the deployment WEDGES silently. A `dictionary` with the
    # keys username, password, database (see README Prerequisites).
    credentialsSecretName: my-nextcloud-db-credentials
  resources:
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10                   # GiB (minimum 10)

  backup:                          # pass-through to the postgres template's backup feature
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0   # tag must match the postgres major
    schedule: "0 2 * * *"          # daily at 02:00 UTC
    resources:
      cpu: 100m
      memory: 128Mi
    provider: aws                  # aws | gcp | minio
    aws:
      bucket: my-nextcloud-backup-bucket
      region: us-east-1
      cloudAccountName: my-nextcloud-backup-cloudaccount
      policyName: my-nextcloud-backup-policy
      prefix: nextcloud/backups
    gcp:
      bucket: my-nextcloud-backup-bucket
      cloudAccountName: my-nextcloud-backup-cloudaccount
      prefix: nextcloud/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-nextcloud-backup-bucket
      credentialsSecretName: my-nextcloud-minio-credentials   # provider minio only: dictionary with accessKey + secretKey
      prefix: nextcloud/backups

# ─── Database: highly available PostgreSQL (opt-in) ───────────────────────────
# 3 Patroni replicas, 3 etcd and an HAProxy leader endpoint; enable exactly one of postgres / postgresHA.
postgresHA:
  enabled: false
  config:
    # REQUIRED in HA mode — MUST EXIST BEFORE INSTALL. Same `dictionary` shape as postgres.config above.
    credentialsSecretName: my-nextcloud-db-credentials
  replicas: 3
  resources:
    minCpu: 500m
    maxCpu: 1000m
    minMemory: 1Gi
    maxMemory: 2Gi
  volumeset:
    capacity: 10                   # GiB per replica (minimum 10)

  backup:                          # pass-through to the postgres-highly-available template's backup feature
    enabled: false
    mode: logical                  # logical | wal-g
    resources:
      cpu: 100m
      memory: 512Mi                # wal-g backups need at least 512Mi
    logical:
      image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
      schedule: "0 2 * * *"        # daily at 02:00 UTC
    walg:
      intervalSeconds: 21600       # every 6 hours
    provider: aws                  # aws | gcp | minio
    aws:
      bucket: my-nextcloud-backup-bucket
      region: us-east-1
      cloudAccountName: my-nextcloud-backup-cloudaccount
      policyName: my-nextcloud-backup-policy
      prefix: nextcloud/backups
    gcp:
      bucket: my-nextcloud-backup-bucket
      cloudAccountName: my-nextcloud-backup-cloudaccount
      prefix: nextcloud/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-nextcloud-backup-bucket
      credentialsSecretName: my-nextcloud-minio-credentials   # provider minio only: dictionary with accessKey + secretKey
      prefix: nextcloud/backups

# ─── Redis: file locks, cache and sessions (recommended; required for 2+ replicas) ──
# Holds no data of record: a Redis restart signs browser sessions out, nothing else.
redis:
  enabled: true
  mode: dev                        # required — Nextcloud connects to one Redis endpoint
  redis:
    image: redis:8
    resources:
      maxCpu: 200m
      maxMemory: 256Mi
      minCpu: 80m
      minMemory: 128Mi
    auth:
      fromSecret:
        enabled: true              # required: Redis holds login sessions
        # REQUIRED when redis.enabled — MUST EXIST BEFORE INSTALL. A `dictionary` with the key
        # `password` (hex, e.g. openssl rand -hex 32).
        name: my-nextcloud-redis-password
        passwordKey: password
