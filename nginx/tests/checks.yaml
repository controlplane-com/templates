# Feature checks for the nginx template. Each runs after install (and after each upgrade) on every version in
# its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}.
# The scripts run in the proxy's own nginx container (the image carries curl) against its loopback listener.
checks:
  - id: image-version-1.1.3
    description: The proxy runs nginx 1.31.7.
    since: 1.1.3
    until: 1.1.3
    exec:
      workload: "{release}-nginx"
      container: nginx
      script: |
        v=$(nginx -v 2>&1)
        [ "$v" = "nginx version: nginx/1.31.7" ] && echo VERSION_OK || echo "VERSION_BAD $v"
    expect:
      stdout: "^VERSION_OK$"

  - id: image-version
    description: The proxy runs the patched nginx 1.31.9 (CVE-2026-123633, CVE-2026-123007, CVE-2026-113425, CVE-2026-121810).
    since: 1.1.4
    issue: "#5638"
    exec:
      workload: "{release}-nginx"
      container: nginx
      script: |
        v=$(nginx -v 2>&1)
        [ "$v" = "nginx version: nginx/1.31.9" ] && echo VERSION_OK || echo "VERSION_BAD $v"
    expect:
      stdout: "^VERSION_OK$"

  - id: routes-default-port
    description: >-
      On the default port 80, /health answers 200 with its body, /fail answers 500, and / reaches the example
      backend.
    scenarios: "^(?!.*\\[port\\])"
    exec:
      workload: "{release}-nginx"
      container: nginx
      script: |
        st() { curl -s -i --max-time 20 "$1" | tr -d '\r' | awk 'NR==1{print $2} /^$/{b=1;next} b{print $0}' | tr '\n' ' '; }
        echo "health $(st http://127.0.0.1:80/health)"
        echo "fail $(st http://127.0.0.1:80/fail)"
        echo "root $(st http://127.0.0.1:80/)"
    expect:
      stdout: '(?s)^health 200 \{"success":true,"message":"OK"\} \nfail 500 \{"success":false,"message":"Error"\} \nroot 200 Hello [^\n]*-example! *$'
    retries: 10
    retryDelaySeconds: 15

  - id: routes-custom-port
    description: >-
      With proxyWorkload.port 8080, nginx listens on 8080 (and the install's readiness proves the probes
      follow it): /health and / answer there, and nothing listens on 80.
    since: 1.1.4
    issue: "#5213"
    scenarios: "\\[port\\]"
    exec:
      workload: "{release}-nginx"
      container: nginx
      script: |
        st() { curl -s -i --max-time 20 "$1" | tr -d '\r' | awk 'NR==1{print $2} /^$/{b=1;next} b{print $0}' | tr '\n' ' '; }
        echo "health $(st http://127.0.0.1:8080/health)"
        echo "root $(st http://127.0.0.1:8080/)"
        curl -s --max-time 5 http://127.0.0.1:80/health >/dev/null; echo "old exit $?"
    expect:
      stdout: '(?s)^health 200 \{"success":true,"message":"OK"\} \nroot 200 Hello [^\n]*-example! *\nold exit 7$'
    retries: 10
    retryDelaySeconds: 15
