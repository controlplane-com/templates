# nocodb 2.0.0 default install: single-instance PostgreSQL 19, one NocoDB replica, the bundled Redis, local
# attachment storage, one location, and every prerequisite secret created by CI (the optional super-admin one
# too, so the checks can log in).
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  pgpw: hex
  redispw: hex
  jwt: hex
  enc: hex
  adminpw: hex

secrets:
  db:
    type: dictionary
    entries:
      username: nocodb
      password: "{gen.pgpw}"
      database: nocodb
  redis:
    type: dictionary
    entries:
      password: "{gen.redispw}"
  keys:
    type: dictionary
    entries:
      NC_AUTH_JWT_SECRET: "{gen.jwt}"
      NC_CONNECTION_ENCRYPT_KEY: "{gen.enc}"
  admin:
    type: dictionary
    entries:
      NC_ADMIN_EMAIL: e2e-admin@example.com
      # NocoDB's password policy: 8+ characters with an uppercase letter, a digit and a special character.
      NC_ADMIN_PASSWORD: "Aa1!{gen.adminpw}"

vars:
  pg_user: nocodb
  pg_password: "{gen.pgpw}"
  pg_db: nocodb
  admin_email: e2e-admin@example.com
  admin_password: "Aa1!{gen.adminpw}"

values:
  secrets:
    name: "{secrets.keys.name}"
  admin:
    secretName: "{secrets.admin.name}"
  redis:
    credentialsSecretName: "{secrets.redis.name}"
  postgres:
    config:
      credentialsSecretName: "{secrets.db.name}"

# The highly available database (postgres-highly-available 3.0.0): a fresh HA install, where NocoDB runs
# against the HAProxy leader endpoint and ha-postgres-major proves the new cluster runs PostgreSQL 18.
variants:
  - name: ha
    values:
      postgres:
        enabled: false
      postgresHA:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"
    # HA first boot: Patroni elects a leader before NocoDB can run its migrations (about 5-7 minutes).
    timeoutSeconds: 1200

# 1.4.1 is the previous version. Its baseline runs the HA database, so this upgrade moves
# postgres-highly-available 2.5.0 → 3.0.0, whose existing cluster keeps PostgreSQL 17: a plain upgrade.
# A refused single-instance upgrade from 1.4.1 is not expressible: the starting install always uses
# 1.4.1's own (HA) baseline.
upgradeFrom:
  - version: 1.4.1
    timeoutSeconds: 1200
