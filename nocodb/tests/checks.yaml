# Feature checks for the nocodb template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars (pg_user,
# pg_password, pg_db, admin_email, admin_password).
#
# The app checks run in the NocoDB container (curl and node, no bash or python) against NocoDB on
# 127.0.0.1, so they hold in either database mode. NocoDB keeps its users and bases in PostgreSQL, so a
# sign-in and a base read back only pass when the server and its database both work. The HA checks run in
# a Patroni member (curl, psql, python3) and are scoped to the scenarios that run the HA database: the [ha]
# variant and the upgrade from 1.4.1, whose baseline is HA. The single-instance checks run in the postgres
# container and are scoped to the default fresh install.
# (Inside scripts, write $VAR rather than the braced form, and keep a space inside any other braces: the
# runner fills every {name} placeholder and fails on an unknown one.)
checks:
  - id: cluster-healthy
    description: Patroni reports exactly one leader and every other member streaming from it.
    scenarios: "\\[ha\\]|^upgrade "   # the HA database: the [ha] variant, and the upgrade from 1.4.1's HA baseline
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        leaders = [x["name"] for x in m if x["role"] == "leader"]
        streaming = [x["name"] for x in m if x["role"] in ("replica", "sync_standby")
                     and (x["state"] == "streaming" or (x["state"] == "running" and isinstance(x.get("lag"), int)))]
        print(f"MEMBERS {len(m)} LEADERS {len(leaders)} STREAMING {len(streaming)}")
        '
    expect:
      stdout: "^MEMBERS 3 LEADERS 1 STREAMING 2$"
    retries: 20
    retryDelaySeconds: 15

  - id: nocodb-healthy
    description: NocoDB answers its health endpoint.
    exec:
      workload: "{release}-nocodb"
      container: nocodb
      script: |
        curl -s -m 10 http://127.0.0.1:8080/api/v1/health
    expect:
      stdout: '"message":\s*"OK"'
    retries: 10
    retryDelaySeconds: 15

  - id: admin-signin-and-base
    description: >-
      The bootstrapped super admin signs in, creates a base named after the running version, and reads it
      back from the base list.
    exec:
      workload: "{release}-nocodb"
      container: nocodb
      script: |
        U=http://127.0.0.1:8080
        N="e2e-$(echo '{version}' | tr . -)"
        T=$(curl -s -m 15 -H 'Content-Type: application/json' \
          -d '{"email":"{admin_email}","password":"{admin_password}"}' "$U/api/v1/auth/user/signin" |
          node -e 'try { console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).token || "") } catch (e) { console.log("") }')
        [ -n "$T" ] && echo "SIGNIN ok" || echo "SIGNIN failed"
        found() {
          curl -s -m 15 -H "xc-auth: $T" "$U/api/v2/meta/bases/" |
            node -e 'const n = process.argv[1]; try { const l = JSON.parse(require("fs").readFileSync(0, "utf8")).list; console.log(l.filter((b) => b.title === n).length) } catch (e) { console.log("ERR " + e.message) }' "$N"
        }
        if [ "$(found)" = 0 ]; then
          curl -s -m 30 -o /dev/null -H "xc-auth: $T" -H 'Content-Type: application/json' \
            -d "{\"title\":\"$N\"}" "$U/api/v2/meta/bases/"
        fi
        echo "BASES $N $(found)"
    expect:
      stdout: "^SIGNIN ok$[\\s\\S]*^BASES e2e-\\S+ [1-9][0-9]*$"
    # NocoDB and its Redis restart on every chart upgrade (~2 min measured); 16 x 15 s outlasts it.
    retries: 16
    retryDelaySeconds: 15

  - id: rejects-bad-password
    description: A wrong super-admin password gets no token (the control for the check above).
    exec:
      workload: "{release}-nocodb"
      container: nocodb
      script: |
        curl -s -m 15 -H 'Content-Type: application/json' \
          -d '{"email":"{admin_email}","password":"Wrong-password-1"}' \
          http://127.0.0.1:8080/api/v1/auth/user/signin |
          node -e 'try { const b = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(b.token ? "TOKEN" : "REFUSED " + (b.msg || b.message)) } catch (e) { console.log("ERR " + e.message) }'
    expect:
      stdout: "^REFUSED "
      notStdout: "^TOKEN"

  - id: data-survives-upgrade
    description: >-
      The base created on the version this scenario installed first is still there. On a fresh install
      that is the same version; after an upgrade it proves the bases carried over.
    exec:
      workload: "{release}-nocodb"
      container: nocodb
      script: |
        U=http://127.0.0.1:8080
        N="e2e-$(echo '{installed_version}' | tr . -)"
        T=$(curl -s -m 15 -H 'Content-Type: application/json' \
          -d '{"email":"{admin_email}","password":"{admin_password}"}' "$U/api/v1/auth/user/signin" |
          node -e 'try { console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).token || "") } catch (e) { console.log("") }')
        n=$(curl -s -m 15 -H "xc-auth: $T" "$U/api/v2/meta/bases/" |
          node -e 'const n = process.argv[1]; try { const l = JSON.parse(require("fs").readFileSync(0, "utf8")).list; console.log(l.filter((b) => b.title === n).length) } catch (e) { console.log("ERR " + e.message) }' "$N")
        echo "BASES $N $n"
    expect:
      stdout: "^BASES e2e-\\S+ [1-9][0-9]*$"
    retries: 4
    retryDelaySeconds: 15

  - id: pgvector-0-8-7-available
    description: >-
      The HA leader runs an image with pgvector 0.8.7 (CVE-2026-103484): patroni-postgres 0.8 in 1.4.1, 0.9
      from 2.0.0.
    issue: "#5376"
    since: 1.4.1
    scenarios: "\\[ha\\]|^upgrade "   # the HA database: the [ha] variant, and the upgrade from 1.4.1's HA baseline
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select 'AVAIL ' || default_version from pg_available_extensions where name = 'vector'" 2>&1
    expect:
      stdout: "^AVAIL 0\\.8\\.7$"
    # After the upgrade the members restart one at a time; this runs long enough to reach the new leader.
    # helm --wait returns while the Patroni members are still restarting, and the old leader restarts
    # last (~4 min in); 20 x 30 s covers the rollout.
    retries: 20
    retryDelaySeconds: 30

  - id: every-patroni-member-on-0-8
    description: >-
      Every Patroni member restarted onto an image with pgvector 0.8.7 (patroni-postgres 0.8 in 1.4.1, 0.9 from
      2.0.0) and is back in the cluster,
      not only the leader. The pgvector-0-8-7-available check passes as soon as the leader has moved to a
      restarted member, and the runner's readiness wait returns while the old leader is still restarting, so
      without this a member that never comes back (seen once in testing: the old leader stuck initializing for
      17 min) goes unseen.
    issue: "#5376"
    since: 1.4.1
    scenarios: "\\[ha\\]|^upgrade "   # the HA database: the [ha] variant, and the upgrade from 1.4.1's HA baseline
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}' PGCONNECT_TIMEOUT=5
        LOC=$(basename "$CPLN_LOCATION")
        line="MEMBERS"
        for i in 0 1 2; do
          v=$(psql -h replica-$i.{release}-postgres-ha.$LOC.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
            -c "select default_version from pg_available_extensions where name = 'vector'" 2>/dev/null)
          line="$line $i=$v"
        done
        echo "$line HEALTHY $(curl -s -m 10 http://localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        print("%d/%d" % (len([x for x in m if x["state"] in ("running", "streaming")]), len(m)))' 2>&1)"
    expect:
      stdout: "^MEMBERS 0=0\\.8\\.7 1=0\\.8\\.7 2=0\\.8\\.7 HEALTHY 3/3$"
    # The old leader restarts last, a few minutes after the runner's readiness wait returns.
    retries: 24
    retryDelaySeconds: 30

  - id: ha-postgres-major
    description: >-
      The HA database (postgres-highly-available 3.0.0 from 2.0.0) runs PostgreSQL 18 on a cluster this version
      created, and a cluster created by 1.x keeps PostgreSQL 17 after the upgrade, on every member.
    since: 2.0.0
    scenarios: "\\[ha\\]|^upgrade "   # the HA database: the [ha] variant, and the upgrade from 1.4.1's HA baseline
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        if [ "$(printf '%s\n' '{installed_version}' 2.0.0 | sort -V | head -1)" = 2.0.0 ]; then want=18; else want=17; fi
        curl -s -m 10 localhost:8008/cluster | python3 -c '
        import json, sys, urllib.request
        want = int(sys.argv[1])
        majors = []
        for m in json.load(sys.stdin)["members"]:
            v = json.load(urllib.request.urlopen(m["api_url"].rsplit("/", 1)[0] + "/patroni", timeout=5)).get("server_version", 0)
            majors.append(v // 10000)
        ok = len(majors) == 3 and all(x == want for x in majors)
        print(("MAJOR " if ok else "WRONG ") + "want=%d members=%s" % (want, majors))
        ' "$want"
    expect:
      stdout: "^MAJOR want="
    # The members restart one after another after an upgrade; the old leader restarts last.
    retries: 20
    retryDelaySeconds: 30

  # ── Single-instance mode (the default fresh install): PostgreSQL 19 from 2.0.0 ──
  - id: single-fresh-is-19
    description: A fresh single-instance install runs PostgreSQL 19 (the postgres 4.0.2 subchart).
    since: 2.0.0
    scenarios: "^install (?!.*\\[ha\\])"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      script: |
        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT 'SERVER_VERSION_NUM=' || current_setting('server_version_num')"
    expect:
      stdout: "^SERVER_VERSION_NUM=19[0-9]{4}$"
    retries: 3

  - id: single-guard-passes
    description: >-
      On its own PostgreSQL 19 data the major-version guard hands over to the server: no guard file, and
      postgres is PID 1.
    since: 2.0.0
    scenarios: "^install (?!.*\\[ha\\])"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        [ -e /tmp/pg-major-guard ] && echo GUARD_FILE_PRESENT || echo NO_GUARD_FILE
        echo "PID1=$(cat /proc/1/comm)"
    expect:
      stdout: "(?s)^NO_GUARD_FILE$.*^PID1=postgres$"

  - id: single-bases-in-19
    description: >-
      The base admin-signin-and-base created through NocoDB is a row in NocoDB's metadata in the PostgreSQL 19
      server, so the app runs on the new major (not only the database).
    since: 2.0.0
    scenarios: "^install (?!.*\\[ha\\])"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      script: |
        N="e2e-$(echo '{version}' | tr . -)"
        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT 'SERVER_VERSION_NUM=' || current_setting('server_version_num')" \
          -c "SELECT 'BASE_ROWS=' || count(*) FROM nc_bases_v2 WHERE title = '$N'" 2>&1
    expect:
      stdout: "(?s)^SERVER_VERSION_NUM=19[0-9]{4}$.*^BASE_ROWS=[1-9][0-9]*$"
    retries: 4
    retryDelaySeconds: 15
