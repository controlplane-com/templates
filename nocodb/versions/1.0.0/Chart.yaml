apiVersion: v2
name: nocodb
description: NocoDB no-code database and spreadsheet-style app builder — grid, kanban, gallery and calendar views, forms, automations and a REST API, backed by Postgres (single-instance or highly available), Redis and optional S3 attachment storage
type: application
version: 1.0.0
appVersion: "2026.07.0"

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres
    version: 3.3.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.4.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled

annotations:
  created: "2026-08-06"
  lastModified: "2026-08-06"
  category: "no-code-database"
  createsGvc: false
