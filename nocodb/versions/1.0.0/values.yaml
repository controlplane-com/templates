# ─── NocoDB server ────────────────────────────────────────────────
nocodb:
  # Single image: UI + REST/GraphQL API + socket.io realtime on :8080.
  # Runs meta-database migrations automatically on boot. Never use latest.
  image: nocodb/nocodb:2026.07.0
  # Stateless app tier over shared Postgres + Redis. >1 REQUIRES storage.type: s3
  # (local attachments are per-replica and would 404). Jobs run in-process, so a
  # replica restart abandons any import/export it was running.
  replicas: 1
  # Public base URL. MUST match the URL browsers use — it drives invite/reset
  # links, the auth cookie secure flag, AND the socket.io namespace. Empty =
  # derive from the platform canonical endpoint. Set WITH https:// only for a
  # custom domain.
  siteUrl: ""
  resources:
    # Upstream recommends 4 vCPU / 8 GB for a busy multi-team instance; these are
    # small-production defaults. Raise maxCpu/maxMemory together for large imports.
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 2Gi

# ─── Prerequisite secret (USER-CREATED — MUST EXIST BEFORE INSTALL) ─
# Dictionary secret holding NocoDB's root-of-trust keys. Create it FIRST — the
# deployment WEDGES on a missing secret and looks broken. BOTH keys are
# WRITE-ONCE: rotating NC_AUTH_JWT_SECRET logs out every user; changing
# NC_CONNECTION_ENCRYPT_KEY makes stored external-database credentials
# undecryptable (upstream has no rotation path).
#   NC_AUTH_JWT_SECRET          openssl rand -hex 64
#   NC_CONNECTION_ENCRYPT_KEY   openssl rand -hex 32
secrets:
  name: my-nocodb-secrets

# ─── Super-admin bootstrap (optional) ─────────────────────────────
# Empty = off: the FIRST browser signup becomes super admin. Set to an OPTIONAL
# prerequisite dictionary secret with NC_ADMIN_EMAIL + NC_ADMIN_PASSWORD
# (e.g. my-nocodb-admin) to bootstrap it instead. NocoDB re-applies these on
# EVERY boot, so a password changed in the UI is reverted on the next restart.
# Password rules: 8+ chars with an uppercase letter, a digit and a special char.
admin:
  secretName: ""

# ─── Attachment storage ───────────────────────────────────────────
storage:
  type: local                 # local | s3  (s3 required for nocodb.replicas > 1)
  local:
    volumeset:
      capacity: 10            # GiB (minimum 10); mounted at /usr/app/data
  s3:
    bucket: my-nocodb-bucket
    region: us-east-1
    endpoint: ""              # set for S3-compatible servers (e.g. http://my-minio-workload:9000)
    forcePathStyle: false     # true for most S3-compatible servers (MinIO, SeaweedFS)
    # Keyless auth (AWS, preferred): Control Plane cloud account + your pre-created
    # IAM policy scoped to the bucket (full JSON in README). Used only when
    # auth.secretName is empty.
    cloudAccountName: my-s3-cloud-account
    policyName: my-nocodb-s3-policy
    auth:
      # Static-key dictionary secret (NC_S3_ACCESS_KEY + NC_S3_ACCESS_SECRET) —
      # ONLY for S3-compatible servers (requires endpoint set). AWS S3 is always
      # keyless via the cloud account (e.g. my-nocodb-s3-keys).
      secretName: ""

# ─── SMTP / email (optional) ──────────────────────────────────────
# Off by default. With SMTP off, member invitations and password-reset emails
# cannot be delivered — configure before inviting collaborators.
smtp:
  enabled: false
  host: smtp.example.com      # NC_SMTP_HOST
  port: 587                   # NC_SMTP_PORT
  secure: false               # false = STARTTLS/plain (587); true = implicit TLS (465)
  from: no-reply@example.com  # NC_SMTP_FROM — From address
  ignoreTls: false            # true for a plaintext mail catcher
  rejectUnauthorized: false   # true to require a valid server certificate
  auth:
    # OPTIONAL prerequisite dictionary secret with NC_SMTP_USERNAME +
    # NC_SMTP_PASSWORD. Empty = unauthenticated relay (e.g. my-nocodb-smtp).
    secretName: ""

# ─── Access ───────────────────────────────────────────────────────
publicAccess:
  enabled: true               # HTTPS UI, API, shared views/forms and websockets on the auto *.cpln.app endpoint
internalAccess:
  type: same-gvc              # none | same-gvc | same-org | workload-list
  workloads: []               # used only with workload-list
  # workloads:
  #   - //gvc/GVC_NAME/workload/WORKLOAD_NAME

# ─── Redis (bundled single node) — REQUIRED ───────────────────────
# Drives the socket.io adapter (cross-replica realtime), the metadata cache, the
# rate limiter and job-progress pub/sub. NocoDB speaks only a plain redis:// URL,
# so the Sentinel-based redis template is not used. noeviction is mandatory —
# an evicted key silently drops realtime and job events.
redis:
  image: redis:8.10.0
  auth:
    password: change-me-nocodb-redis   # template-managed; embedded in NC_REDIS_URL — letters/digits/-/_ only
  resources:
    minCpu: 100m
    maxCpu: 400m
    minMemory: 256Mi
    maxMemory: 512Mi
  volumeset:
    capacity: 10              # GiB (minimum 10); AOF at /data

# ─── Database: single-instance PostgreSQL (default) ───────────────
# One Postgres workload holding all bases, tables, views, users and automations.
# Enable exactly one of postgres / postgresHA.
postgres:
  enabled: true
  image: postgres:18          # NocoDB supports PostgreSQL 12+ (the HA path below runs 17)
  config:
    username: nocodb
    password: change-me-nocodb-db     # change before install; letters/digits/-/_ only (embedded in NC_DB)
    database: nocodb
  resources:
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10              # GiB (minimum 10)

  backup:                     # optional database backups — see README storage setup
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0   # tag must match the postgres major above
    schedule: "0 2 * * *"     # daily at 2am UTC
    resources:
      cpu: 100m
      memory: 128Mi
    provider: aws             # aws | gcp | minio
    aws:
      bucket: my-nocodb-pg-backup-bucket
      region: us-east-1
      cloudAccountName: my-s3-cloud-account
      policyName: my-nocodb-pg-backup-policy
      prefix: postgres/backups
    gcp:
      bucket: my-nocodb-pg-backup-bucket
      cloudAccountName: my-gcs-cloud-account
      prefix: postgres/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-nocodb-pg-backup-bucket
      accessKey: my-minio-username
      secretKey: my-minio-password
      prefix: postgres/backups

# ─── Database: Highly Available PostgreSQL 17 (opt-in) ────────────
# Deploys the postgres-highly-available template: 3 Patroni replicas, 3 etcd
# replicas, and an HAProxy leader endpoint NocoDB connects to. Recommended for
# production. Enable this and set postgres.enabled: false.
postgresHA:
  enabled: false
  postgres:
    username: nocodb
    password: change-me-nocodb-db     # change before install; letters/digits/-/_ only (embedded in NC_DB)
    database: nocodb
  replicas: 3
  resources:                  # per Patroni replica; the default install runs 3 of these
    minCpu: 500m
    maxCpu: 1000m
    minMemory: 1Gi
    maxMemory: 2Gi
  volumeset:
    capacity: 10              # GiB per replica (minimum 10)

  backup:                     # optional database backups — see README storage setup
    enabled: false
    mode: logical             # logical | wal-g
    resources:
      cpu: 100m
      memory: 128Mi
    logical:
      image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
      schedule: "0 2 * * *"
    walg:
      intervalSeconds: 21600
    provider: aws             # aws | gcp | minio
    aws:
      bucket: my-nocodb-pg-backup-bucket
      region: us-east-1
      cloudAccountName: my-s3-cloud-account
      policyName: my-nocodb-pg-backup-policy
      prefix: postgres/backups
    gcp:
      bucket: my-nocodb-pg-backup-bucket
      cloudAccountName: my-gcs-cloud-account
      prefix: postgres/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-nocodb-pg-backup-bucket
      accessKey: my-minio-username
      secretKey: my-minio-password
      prefix: postgres/backups
