apiVersion: v2
name: nocodb
description: NocoDB no-code database and spreadsheet-style app builder, backed by Postgres and Redis
type: application
version: 1.2.0
appVersion: "2026.07.0"

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres
    version: 3.4.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.5.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled

annotations:
  created: "2026-08-06"
  lastModified: "2026-08-20"
  category: "no-code-database"
  createsGvc: false
