kind: secret
name: {{ include "open-webui.secretConfig.name" . }}
description: Open WebUI config (stable session/JWT signing key)
tags: {{- include "open-webui.tags" . | nindent 4 }}
type: dictionary
data:
  # Signs sessions/JWTs. Kept stable across upgrades so users are not logged
  # out — cpln Helm has no `lookup`, so this is a value, never auto-generated.
  webuiSecretKey: {{ .Values.auth.webuiSecretKey | quote }}
