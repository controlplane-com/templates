# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Open WebUI
# One stateful replica with its own data volume and no location handling: every GVC location would run
# its own Open WebUI with its own accounts and chats.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: sign-in
    title: Sign-in
    description: The session signing key and who can create an account.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'install'
        text: >-
          This version has no admin setting: the first account registered becomes the administrator, and
          its defaults put the UI on the internet, so whoever registers first on the public URL gets it.
          Install with public access off, register that account through
          `cpln port-forward <release>-open-webui 8080:8080 --gvc <gvc>`, then turn public access on.
          Registering in a browser through the tunnel can hang; this works instead:
          `cpln workload exec <release>-open-webui --gvc <gvc> --container open-webui -- curl -sS -X POST
          http://localhost:8080/api/v1/auths/signup -H 'Content-Type: application/json' -d
          '{"name":"Admin","email":"…","password":"…"}'`. 1.1.0 makes the UI private by default, and 1.3.0 creates the
          administrator from a secret.
      - path: auth.webuiSecretKey
        type: string
        label: Session signing key
        required: true
        sensitive: true
        widget: password
        example: true
        description: >-
          Signs every session and JWT. Generate it once with `openssl rand -base64 32` and keep it
          forever: changing it logs every user out.
        help: >-
          This version stores the key in the release values and in a secret the chart creates. 1.1.0
          reads it from an opaque secret you create instead, so the key never passes through Helm.
      - path: auth.enableSignup
        type: boolean
        label: Allow self-service sign-up
        description: >-
          Open WebUI reads this only while no account exists. Registering the first account (the
          administrator) stores sign-up as off in its database whatever this says, and from then on this
          setting changes nothing: add users in Admin Settings → Users, and open sign-up in Settings →
          Admin → Authentication (New Sign Ups).
    rules:
      - rule: self.auth.webuiSecretKey != null && self.auth.webuiSecretKey != ''
        mirrors: open-webui.validate
        paths: [auth.webuiSecretKey]
        message: The session signing key is required.
      - rule: >-
          oldSelf == null || oldSelf.auth.webuiSecretKey == null || oldSelf.auth.webuiSecretKey == '' ||
          self.auth.webuiSecretKey == oldSelf.auth.webuiSecretKey
        severity: info
        paths: [auth.webuiSecretKey]
        message: A different signing key logs every user out.
      - rule: >-
          oldSelf == null || oldSelf.auth.webuiSecretKey != 'CHANGE-ME-openssl-rand-base64-32-abcdEFGH1234' ||
          self.auth.webuiSecretKey != oldSelf.auth.webuiSecretKey
        severity: info
        paths: [auth.webuiSecretKey]
        message: >-
          This release signs sessions with the published example key, which anyone can read in this
          chart. Replace it with a key of your own; every user is logged out once.
      - rule: oldSelf == null || self.auth.enableSignup == oldSelf.auth.enableSignup
        severity: info
        paths: [auth.enableSignup]
        message: >-
          Once an account exists this setting has no effect; open or close sign-up in Admin Settings
          instead.

  - id: models
    title: Model backends
    description: The model servers Open WebUI chats with.
    sections:
      - fields:
          - type: note
            text: >-
              Open WebUI reads these settings on first boot only and then keeps them in its database.
              Set them at install; afterwards change model connections in Settings → Admin → Connections.
          - type: note
            text: >-
              This version does not switch off a backend you leave unset: Open WebUI then uses its own
              defaults (Ollama at host.docker.internal:11434, OpenAI at api.openai.com with no key), and
              Ollama logs a connection error on every model list. 1.3.0 switches unset backends off.
      - id: ollama
        title: Ollama
        toggle: ollama.enabled
        description: >-
          Connects to an existing Ollama workload in this GVC, such as one from the `ollama` template.
          Without one, Open WebUI still starts and lists no Ollama models.
        fields:
          - path: ollama.workloadName
            type: ref
            label: Ollama workload
            required: true
            description: Reached at `http://<workload>.<gvc>.cpln.local:<port>`.
            help: >-
              The `ollama` template names its workload after its release, such as `my-ollama-ollama`, so
              the default `ollama` usually names nothing. A workload that does not exist makes every page
              load wait on the failed connection, about 10 seconds; turn Ollama off if you have none.
              1.3.0 turns Ollama off by default.
            ref: { kind: workload, format: name, mustExist: off }
          - path: ollama.port
            type: integer
            label: Ollama port
            required: true
            min: 80
            max: 65535
        rules:
          - rule: self.ollama.workloadName != null && self.ollama.workloadName != ''
            mirrors: open-webui.validate
            paths: [ollama.workloadName]
            message: Choose the Ollama workload, or turn Ollama off.
      - id: openai
        title: OpenAI-compatible API
        description: >-
          Any OpenAI-compatible endpoint, such as OpenAI, a LiteLLM gateway or a vLLM workload. Off while
          no API key secret is chosen.
        fields:
          - path: openai.apiKeySecretName
            type: ref
            label: API key secret
            description: An opaque secret (encoding plain) holding the API key.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                encoding: plain
                suggestName: "context.releaseName + '-openwebui-openai-key'"
          - path: openai.baseUrl
            type: string
            format: url
            label: Base URL
            required: true
            when: self.openai.apiKeySecretName != null && self.openai.apiKeySecretName != ''
            placeholder: https://api.openai.com/v1
            description: >-
              Includes the API version path, such as `/v1`. A workload in this GVC is reached at
              `http://<workload>.<gvc>.cpln.local:<port>/v1`.
    rules:
      - rule: >-
          self.ollama.enabled || (self.openai.apiKeySecretName != null && self.openai.apiKeySecretName != '')
        severity: info
        paths: [openai.apiKeySecretName]
        message: >-
          No model backend is set, so the chat has no models until an admin adds a connection in Settings → Admin → Connections.
      - rule: >-
          oldSelf == null || (self.ollama.enabled == oldSelf.ollama.enabled &&
          self.ollama.workloadName == oldSelf.ollama.workloadName && self.ollama.port == oldSelf.ollama.port)
        severity: info
        paths: [ollama.enabled]
        message: >-
          A running install keeps the Ollama connection it started with; this change has no effect.
          Change it in Settings → Admin → Connections.
      - rule: >-
          oldSelf == null || (self.openai.apiKeySecretName == oldSelf.openai.apiKeySecretName &&
          self.openai.baseUrl == oldSelf.openai.baseUrl)
        severity: info
        paths: [openai.apiKeySecretName]
        message: >-
          A running install keeps the OpenAI-compatible connection it started with; this change has no
          effect. Change it in Settings → Admin → Connections.

  - id: server
    title: Server
    description: The Open WebUI image and the compute of its single stateful replica.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'upgrade'
        text: >-
          Every upgrade restarts the single replica, so the UI is down for about a minute.
      - path: image
        type: string
        format: image
        label: Open WebUI image
        required: true
      # This version names the limits resources.cpu / resources.memory next to minCpu / minMemory
      # (1.2.0 renamed them maxCpu / maxMemory), so plain quantity fields bind the keys the chart reads.
      - path: resources.cpu
        type: quantity
        quantity: cpu
        label: CPU limit
        required: true
        min: 25m
      - path: resources.memory
        type: quantity
        quantity: memory
        label: Memory limit
        required: true
        min: 32Mi
        description: >-
          Retrieval over uploaded documents loads a local embedding model into memory.
      - path: resources.minCpu
        type: quantity
        quantity: cpu
        label: CPU reservation
        required: true
        min: 25m
      - path: resources.minMemory
        type: quantity
        quantity: memory
        label: Memory reservation
        required: true
        min: 32Mi
    rules:
      # A stateful workload: the platform refuses a limit above 4x the reservation, a CPU range over
      # 4000 millicores, a memory range over 4096 MiB, and more than 8 MiB of memory per millicore.
      - rule: cpuMillicores(self.resources.minCpu) <= cpuMillicores(self.resources.cpu)
        paths: [resources.minCpu]
        message: The CPU reservation cannot be greater than the CPU limit.
      - rule: memoryBytes(self.resources.minMemory) <= memoryBytes(self.resources.memory)
        paths: [resources.minMemory]
        message: The memory reservation cannot be greater than the memory limit.
      - rule: cpuMillicores(self.resources.cpu) <= 4 * cpuMillicores(self.resources.minCpu)
        paths: [resources.minCpu]
        message: The CPU limit can be at most 4 times the reservation on a stateful workload; raise the reservation.
      - rule: memoryBytes(self.resources.memory) <= 4 * memoryBytes(self.resources.minMemory)
        paths: [resources.minMemory]
        message: The memory limit can be at most 4 times the reservation on a stateful workload; raise the reservation.
      - rule: cpuMillicores(self.resources.cpu) - cpuMillicores(self.resources.minCpu) <= 4000
        paths: [resources.minCpu]
        message: The CPU limit can be at most 4000 millicores above the reservation; raise the reservation.
      - rule: memoryBytes(self.resources.memory) - memoryBytes(self.resources.minMemory) <= 4294967296
        paths: [resources.minMemory]
        message: The memory limit can be at most 4096 MiB above the reservation; raise the reservation.
      - rule: memoryBytes(self.resources.memory) <= cpuMillicores(self.resources.cpu) * 8388608
        paths: [resources.memory]
        message: The memory limit can be at most 8 MiB per millicore of the CPU limit. Raise the CPU or lower the memory.

  - id: storage
    title: Storage and snapshots
    description: The data volume and its scheduled snapshots.
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            description: Holds the database, uploaded files, the vector store for documents and the cache.
            help: >-
              Uninstalling the release deletes the volume set after a final snapshot, so a reinstall
              starts empty, admin account included.
            docs: "/reference/volumeset#capacity-and-billing"
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
          - path: backup.retention
            type: string
            label: Keep snapshots for
            required: true
            placeholder: 7d
            description: Also applies to the final snapshot taken when the volume set is deleted.
            pattern: '^\d+(\.\d+)?[dhm]$'
            patternMessage: Use a number followed by d, h or m, such as 7d or 720h.
        rules:
          - rule: self.volumeset.capacity >= 10
            mirrors: open-webui.validate
            paths: [volumeset.capacity]
            message: The initial capacity must be at least 10 GiB.
          - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: backup
        title: Scheduled snapshots
        toggle: backup.enabled
        description: >-
          Crash-consistent platform snapshots of the data volume, with no bucket or cloud account.
          Restoring one is a manual step that loses everything written after it.
        docs: "#restoring-a-backup"
        fields:
          - path: backup.schedule
            type: string
            label: Schedule (UTC)
            placeholder: 0 3 * * *
            required: true
        rules:
          # This version has no chart check; the platform refuses a schedule more frequent than hourly when
          # the volume set is applied, leaving a half-installed release.
          - rule: >-
              (oldSelf != null && has(oldSelf.backup.schedule) && self.backup.schedule == oldSelf.backup.schedule) ||
              self.backup.schedule.matches('^\\s*[0-5]?[0-9] +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+\\s*$')
            severity: warning
            paths: [backup.schedule]
            message: >-
              Use 5 fields with a single fixed minute, such as 0 3 * * *. Snapshots cannot run more often
              than hourly, and the platform refuses such a schedule when the volume set is applied.

  - id: access
    title: Access
    description: Where the chat UI is served and which workloads can call its API.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'install' && self.publicAccess.enabled
        text: >-
          On a fresh install the first account registered becomes the administrator. With public access
          on, whoever reaches the sign-up page first gets it. Install private, register your
          administrator, then turn public access on.
      - path: publicAccess.enabled
        type: boolean
        label: Reachable from the internet
        description: >-
          Serves the chat UI and its sign-in form on the canonical `*.cpln.app` URL. Firewall changes
          take up to a few minutes.
        help: >-
          Off, the UI is still reachable from your machine with
          `cpln port-forward <release>-open-webui 8080:8080 --gvc <gvc>`.
      - path: customDomain
        type: string
        label: Custom domain URL
        placeholder: https://chat.example.com
        description: >-
          The URL Open WebUI uses for its links and redirects. It does not create the domain: create and
          verify it in Control Plane separately. Empty uses the canonical URL.
        help: >-
          Open WebUI reads it on first boot only and keeps it in its database, so set it at install
          rather than in a later upgrade.
      - path: internalAccess.type
        type: enum
        label: Workloads that can connect
        widget: cards
        required: true
        description: Other workloads calling the Open WebUI API on port 8080.
        options:
          - value: none
            label: Nobody
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: open-webui.validate
        paths: [internalAccess.type]
        message: Choose which workloads can connect.
      # This version has no chart check: it passes the value to Open WebUI as WEBUI_URL as typed.
      - rule: >-
          (oldSelf != null && self.customDomain == oldSelf.customDomain) ||
          self.customDomain == null || self.customDomain == '' ||
          self.customDomain.startsWith('https://') || self.customDomain.startsWith('http://')
        severity: warning
        paths: [customDomain]
        message: >-
          Use a full URL with its scheme, such as https://chat.example.com. This version passes the value
          to Open WebUI as typed, and 1.1.0 refuses one without a scheme.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: warning
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload can connect.
      - rule: oldSelf == null || oldSelf.publicAccess.enabled || !self.publicAccess.enabled
        severity: info
        paths: [publicAccess.enabled]
        message: >-
          Public access was off: this change puts the chat UI and its sign-in form on the internet.
          Register your administrator account first.
      - rule: >-
          oldSelf == null || self.customDomain == oldSelf.customDomain
        severity: info
        paths: [customDomain]
        message: >-
          A running install keeps the URL it started with, so this change has no effect on Open WebUI's
          links and redirects.

