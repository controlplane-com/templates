kind: secret
name: {{ include "open-webui.secretStart.name" . }}
description: Open WebUI startup script (derives WEBUI_URL from the canonical endpoint)
tags: {{- include "open-webui.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
    # WEBUI_URL is used for absolute links and OAuth redirects; it must match
    # the browser-visible origin, and the canonical *.cpln.app hostname is only
    # known at runtime — so derive it here. CPLN_GLOBAL_ENDPOINT is already a
    # full URL (https://...), NOT a bare host — never prepend a second scheme.
    # An explicit WEBUI_URL env (customDomain) wins over the fallback.
    export WEBUI_URL="${WEBUI_URL:-$CPLN_GLOBAL_ENDPOINT}"
    # Hand off to the image's own entrypoint (Dockerfile: WORKDIR /app/backend,
    # CMD ["bash","start.sh"]).
    cd /app/backend
    exec bash start.sh
