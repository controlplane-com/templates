kind: secret
name: {{ include "open-webui.secretStart.name" . }}
description: Open WebUI startup script (derives WEBUI_URL from the canonical endpoint)
tags: {{- include "open-webui.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
    # WEBUI_URL is used for absolute links and OAuth redirects; it must match
    # the browser-visible origin, and the canonical *.cpln.app hostname is only
    # known at runtime — so derive it here. CPLN_GLOBAL_ENDPOINT is already a
    # full URL (https://...), NOT a bare host — never prepend a second scheme.
    # An explicit WEBUI_URL env (customDomain) wins over the fallback.
    export WEBUI_URL="${WEBUI_URL:-$CPLN_GLOBAL_ENDPOINT}"
    {{- if .Values.cplnMcp.enabled }}
    # Control Plane MCP server: add it as a tool server and register its OAuth client with
    # auth.cpln.io (dynamic client registration), once per install, as the bootstrap admin —
    # Open WebUI otherwise registers only from the admin UI, and its TOOL_SERVER_CONNECTIONS env
    # applies to a new database only. A marker on the volume makes this run once, so an admin who
    # later removes the server keeps it removed. Retried on the next boot if it cannot finish
    # (e.g. the admin password no longer matches the secret).
    python3 - <<'PY' &
    import json, os, time, urllib.request
    B = 'http://127.0.0.1:8080'
    MARK = '/app/backend/data/.cpln-mcp-registered'
    CONN = json.loads({{ include "open-webui.cplnMcpConnection" . | squote }})
    def call(path, body=None, tok=None):
        h = {'content-type': 'application/json'}
        if tok: h['Authorization'] = 'Bearer ' + tok
        req = urllib.request.Request(B + path, data=None if body is None else json.dumps(body).encode(), headers=h)
        with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
    def log(m): print('cpln-mcp-register: ' + m, flush=True)
    if os.path.exists(MARK): raise SystemExit
    for _ in range(120):
        try:
            urllib.request.urlopen(B + '/health', timeout=5); break
        except Exception: time.sleep(5)
    try:
        try:
            tok = call('/api/v1/auths/signin', {'email': os.environ['WEBUI_ADMIN_EMAIL'], 'password': os.environ['WEBUI_ADMIN_PASSWORD']})['token']
        except Exception as e:
            log('skipped: the admin secret does not match an admin login (%s); add the server in Settings > Admin > Integrations, or put the current admin credentials in the secret and restart' % e)
            raise SystemExit
        conns = call('/api/v1/configs/tool_servers', tok=tok)['TOOL_SERVER_CONNECTIONS'] or []
        conns = [c for c in conns if (c.get('info') or {}).get('id') != 'cpln']
        for attempt in range(5):
            try:
                reg = call('/api/v1/configs/oauth/clients/register?type=mcp', {'url': CONN['url'], 'client_id': 'cpln', 'client_name': 'Open WebUI'}, tok); break
            except Exception as e:
                log('register attempt %d failed: %s' % (attempt + 1, e)); time.sleep(15 * (attempt + 1))
        else:
            raise SystemExit
        CONN['info']['oauth_client_info'] = reg['oauth_client_info']
        call('/api/v1/configs/tool_servers', {'TOOL_SERVER_CONNECTIONS': conns + [CONN]}, tok)
        open(MARK, 'w').close()
        log('added the Control Plane MCP server and registered its OAuth client')
    except SystemExit: pass
    except Exception as e: log('skipped, will retry on the next start: %s' % e)
    PY
    {{- end }}
    # Hand off to the image's own entrypoint (Dockerfile: WORKDIR /app/backend,
    # CMD ["bash","start.sh"]).
    cd /app/backend
    exec bash start.sh
