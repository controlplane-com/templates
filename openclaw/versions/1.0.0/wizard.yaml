# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: OpenClaw
# One stateful Gateway with no location handling: every GVC location would run its own assistant with
# its own state, each fighting over the same bot tokens.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: secret
    title: Secret and model
    description: The prerequisite secret with your login token and model key, and the model the assistant runs on.
    sections:
      - title: Secret
        docs: "#secret"
        fields:
          - type: note
            severity: warning
            text: >-
              The secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all; `status.versions[].message` of
              `cpln workload get-deployments` names the missing secret.
          - path: secret.name
            type: ref
            label: Secret
            required: true
            description: >-
              A dictionary secret with `gateway-token` (your Control UI login and full-admin API token)
              and `llm-api-key` (the key for the model provider), plus the bot tokens of the channels
              you turn on.
            help: >-
              Generate the gateway token with `openssl rand -hex 32`; a token shorter than 24 characters
              stops the Gateway at start. A changed key reaches the running Gateway only after
              `cpln workload force-redeployment <release>-openclaw --gvc <gvc>`, which takes the assistant offline for
              about 4 minutes.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeysFrom: >-
                ['gateway-token', 'llm-api-key'] +
                (self.channels.telegram.enabled ? ['telegram-bot-token'] : []) +
                (self.channels.slack.enabled ? ['slack-bot-token', 'slack-app-token'] : []) +
                (self.channels.discord.enabled ? ['discord-bot-token'] : [])
              create:
                suggestName: "context.releaseName + '-openclaw-secret'"
                hint: "Generate gateway-token with: openssl rand -hex 32"
      - title: Model
        docs: "#model"
        description: >-
          The assistant spends model tokens on its own: OpenClaw runs a heartbeat turn every 30 minutes by
          default, which you can change or turn off in the Control UI.
        fields:
          - type: note
            when: context.mode == 'upgrade'
            text: >-
              The model, channel, HTTP API and Control Plane MCP settings are applied again only when you
              change them here; changes made in the Control UI persist otherwise. Changing any of them restarts the
              Gateway, which is offline for about 2 minutes.
          - path: model.provider
            type: enum
            label: Provider
            widget: cards
            required: true
            description: The secret's `llm-api-key` must be a key for this provider.
            options:
              - value: anthropic
                label: Anthropic
                description: Claude models.
              - value: openai
                label: OpenAI
                description: GPT models.
              - value: custom
                label: OpenAI-compatible endpoint
                description: Any OpenAI-compatible API, such as OpenRouter or LiteLLM.
          - path: model.name
            type: string
            label: Model ID
            required: true
            placeholder: claude-opus-5-5
            pattern: '^\S+$'
            patternMessage: Enter the model ID without spaces.
            description: The model ID as your provider names it.
          - path: model.baseUrl
            type: string
            label: Base URL
            required: true
            when: self.model.provider == 'custom' || (self.model.baseUrl != null && self.model.baseUrl != '')
            placeholder: https://openrouter.ai/api/v1
            pattern: '^https?://\S+$'
            patternMessage: Enter a URL that starts with http:// or https://.
            description: The endpoint's OpenAI-compatible base URL, usually ending in `/v1`.
        rules:
          - rule: self.model.provider == 'custom' || !self.model.name.contains('/')
            mirrors: openclaw.validate
            paths: [model.name]
            messageExpression: >-
              'Give the bare model ID without "/": the chart adds the "' + self.model.provider +
              '/" prefix itself.'
            message: Give the bare model ID without "/"; the chart adds the provider prefix itself.
          - rule: self.model.provider == 'custom' || self.model.baseUrl == null || self.model.baseUrl == ''
            mirrors: openclaw.validate
            paths: [model.baseUrl]
            message: >-
              The base URL is only used with an OpenAI-compatible endpoint. Clear it, or choose that
              provider to route the model through it.
          - when: self.model.provider == 'openai'
            rule: self.model.name != 'claude-opus-5-5'
            severity: warning
            paths: [model.name]
            message: >-
              claude-opus-5-5 is the chart's default Anthropic model ID. Enter the ID of an OpenAI model.
          - when: self.model.provider == 'custom'
            rule: self.model.name != 'claude-opus-5-5'
            severity: info
            paths: [model.name]
            message: >-
              claude-opus-5-5 is the chart's default Anthropic model ID. Enter the ID your endpoint uses;
              OpenRouter, for example, prefixes the vendor (`openai/gpt-4o`).
          - rule: oldSelf == null || self.model.provider == oldSelf.model.provider
            severity: info
            paths: [model.provider]
            message: >-
              After the upgrade, rebuild the memory index with
              `cpln workload exec <release>-openclaw --gvc <gvc> --container openclaw -- sh -c 'cd /app && node openclaw.mjs memory status --index --agent main'`;
              until then memory search returns nothing.

  - id: channels
    title: Channels
    description: Which chat apps the assistant answers on.
    sections:
      - id: telegram
        title: Telegram
        toggle: channels.telegram.enabled
        description: A Telegram bot from @BotFather. It connects outbound, so no public endpoint is needed.
        fields:
          - type: note
            severity: warning
            text: >-
              Add the key `telegram-bot-token` with the bot token to the secret before you install or
              upgrade.
      - id: slack
        title: Slack
        toggle: channels.slack.enabled
        description: A Slack app in Socket Mode. It connects outbound, so no public endpoint is needed.
        fields:
          - type: note
            severity: warning
            text: >-
              Add the keys `slack-bot-token` (the `xoxb-` bot token) and `slack-app-token` (the `xapp-`
              Socket Mode app token) to the secret before you install or upgrade.
      - id: discord
        title: Discord
        toggle: channels.discord.enabled
        description: >-
          A Discord bot with the Message Content intent enabled. It connects outbound, so no public
          endpoint is needed.
        fields:
          - type: note
            severity: warning
            text: >-
              Add the key `discord-bot-token` with the bot token to the secret before you install or
              upgrade.
      - id: whatsapp
        title: WhatsApp
        toggle: channels.whatsapp.enabled
        description: >-
          Unofficial WhatsApp Web: you link a phone after install by scanning a QR code, and the account
          can be banned, so use a dedicated number. No key in the secret.
        docs: "#connecting-chat-channels"
        fields:
          - type: note
            text: >-
              After install, open the Control UI over the public endpoint, then **Settings → Channels →
              WhatsApp → Show QR**, and link it on the phone under **Linked devices**. A private install
              can print the QR in a terminal instead:
              `cpln workload exec <release>-openclaw --gvc <gvc> --container openclaw -- sh -c 'cd /app && node openclaw.mjs channels login --channel whatsapp'`.
      - fields:
          - type: note
            severity: warning
            when: >-
              self.channels.telegram.enabled || self.channels.slack.enabled ||
              self.channels.discord.enabled || self.channels.whatsapp.enabled
            text: >-
              Every new chat contact gets a pairing code and is ignored until you approve it with
              `pairing approve <channel> <code>`. Approve only contacts you would trust as admins: an
              approved contact can have the agent run shell commands in the container, and those
              commands can read the gateway token and the workload's Control Plane token.

  - id: tools
    title: Tools and API
    description: >-
      Which tools the agent has, and whether the Gateway serves an OpenAI-compatible HTTP API.
    sections:
      - id: browser
        title: Browser tool
        docs: "#browser-tool-and-http-api"
        toggle: browser.enabled
        description: >-
          Headless Chromium for the agent's browser tool. It runs the `-browser` variant of the image,
          which needs about 1 GiB more memory.
        fields: []
      - id: cpln-mcp
        title: Control Plane MCP
        toggle: cplnMcp.enabled
        description: >-
          Registers the Control Plane MCP server, so the assistant can read and manage Control Plane
          resources. Nobody is signed in at install; the sign-in mode decides who signs in and from where.
        docs: "#control-plane-mcp"
        fields:
          - type: note
            severity: warning
            when: self.cplnMcp.signIn == 'per-requester'
            text: >-
              Sign-in links are single-use and connect whoever opens them, so ask for them only in a direct
              message, never in a group chat.
          - path: cplnMcp.signIn
            type: enum
            label: Sign-in
            widget: cards
            required: true
            options:
              - value: shared
                label: Shared
                description: >-
                  You sign in once from a terminal after install. Every chat, including the Control UI
                  chat, then acts as your Control Plane account.
              - value: per-requester
                label: Per chat user
                description: >-
                  Each person signs in with a link the assistant sends in a chat channel and acts as
                  themselves. Needs the public Control UI; the Control UI chat cannot sign in.
        rules:
          - when: self.cplnMcp.signIn == 'per-requester'
            rule: >-
              self.channels.telegram.enabled || self.channels.slack.enabled ||
              self.channels.discord.enabled || self.channels.whatsapp.enabled
            severity: info
            paths: [cplnMcp.signIn]
            message: >-
              Each user signs in from a chat channel, so turn on a channel; the Control UI chat cannot sign
              in in this mode.
          - rule: oldSelf == null || self.cplnMcp.signIn == oldSelf.cplnMcp.signIn
            severity: info
            paths: [cplnMcp.signIn]
            message: >-
              Links issued in the old sign-in mode do not work after the change. With Per chat user, ask
              the assistant for a new link. With Shared, run
              `cpln workload exec <release>-openclaw --gvc <gvc> --container openclaw -- sh -c 'cd /app && node openclaw.mjs mcp status --verbose'`
              and sign in from a terminal if it does not read `oauth: authorized`.
      - id: http-api
        title: OpenAI-compatible HTTP API
        toggle: httpApi.enabled
        description: >-
          Serves `/v1/chat/completions` and `/v1/responses` on port 18789, with the gateway token as the
          bearer token.
        fields:
          - type: note
            text: >-
              Callers inside the GVC must also send an `X-Forwarded-For` header with a non-loopback
              address (e.g. `10.0.0.1`; `127.0.0.1` is refused), or the Gateway answers
              `403 proxy_attribution_required`.
    rules:
      - when: "!self.cplnMcp.enabled"
        rule: self.cplnMcp.signIn in ['shared', 'per-requester']
        mirrors: openclaw.validate
        paths: [cplnMcp.enabled]
        message: >-
          cplnMcp.signIn must be shared or per-requester: the chart checks it even with Control Plane MCP
          off. Correct it in YAML mode.

  - id: storage
    title: Resources and storage
    description: The Gateway's compute, its state volume and that volume's snapshots.
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            description: Config, chat sessions, plugins, memory and the agent's workspace.
            help: >-
              The initial capacity sizes only new volumes: an existing volume keeps its size and grows only
              through automatic growth. Uninstalling the release deletes the volume set and all of the
              assistant's state.
            docs: "/reference/volumeset#capacity-and-billing"
            suggestions: [10, 20, 50, 100, 250]
          - path: backup.retention
            type: string
            format: retention
            label: Snapshot retention
            required: true
            description: How long each snapshot is kept, the final one taken at uninstall included.
            suggestions: [7d, 14d, 30d]
          - path: resources
            type: resources
            label: Resources
            required: true
            advanced: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
            description: A single stateful replica.
          - path: image.repository
            type: string
            label: Image repository
            format: image
            required: true
            advanced: true
            pattern: '^(?!.*:[^/]*$)\S+$'
            patternMessage: Enter the repository without a tag or spaces, such as ghcr.io/openclaw/openclaw.
          - path: image.tag
            type: string
            label: Image tag
            required: true
            advanced: true
            pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
            patternMessage: Enter a tag such as 2026.9.8, without a colon or spaces.
            description: An exact OpenClaw release. `-browser` is appended while the browser tool is on.
        rules:
          - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
          - when: self.browser.enabled
            rule: "!self.image.tag.endsWith('-browser')"
            paths: [image.tag]
            message: "Enter the tag without `-browser`: the chart appends it while the browser tool is on."
          - rule: oldSelf == null || self.image.tag == oldSelf.image.tag
            severity: info
            paths: [image.tag]
            message: >-
              A new release migrates the state on its first start, and an older release cannot read it
              afterwards. Take a volume snapshot before you change the tag, with
              `cpln volumeset snapshot create <release>-openclaw-vs --gvc <gvc> --snapshot-name <name> --location <location> --volume-index 0`,
              and do not lower the tag unless you restore a snapshot taken while the volume ran that older tag.
          - when: self.browser.enabled
            rule: memoryBytes(self.resources.maxMemory) >= memoryBytes('3Gi')
            severity: info
            paths: [resources]
            message: >-
              With the browser tool on, keep the maximum memory at 3Gi or more: 2Gi is enough only with
              the browser tool off.
      - id: autoscaling
        title: Grow the volume automatically
        toggle: volumeset.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [50, 100, 250, 500, 1000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            mirrors: openclaw.validate
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
      - id: backup
        title: Scheduled snapshots
        toggle: backup.enabled
        description: >-
          Platform-managed snapshots of the state volume, with no bucket needed. They hold your channel
          sessions and tokens, so treat them as secrets.
        docs: "/reference/volumeset#snapshots"
        fields:
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            widget: cron
            required: true
        rules:
          - rule: >-
              self.backup.schedule == null || self.backup.schedule == '' ||
              self.backup.schedule.trim().matches('^[0-5]?[0-9] +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+$')
            mirrors: openclaw.validate
            paths: [backup.schedule]
            message: >-
              Snapshots cannot run more often than hourly: use a single fixed minute, for example
              "0 3 * * *" for daily at 03:00 UTC.

  - id: access
    title: Access
    description: Who can reach the Control UI and the Gateway, from the internet and from other workloads.
    sections:
      - id: public
        title: Public Control UI
        toggle: publicAccess.enabled
        description: >-
          Puts the Control UI on the public HTTPS endpoint. That exposes an agent with a shell to the
          internet behind one token, the gateway token, and each new browser needs a one-time approval
          from the CLI before it connects. Without it, reach the UI with `cpln port-forward`.
        docs: "#access"
        fields:
          - path: publicAccess.origin
            type: string
            label: Custom domain origin
            docs: "#custom-domain"
            placeholder: https://assistant.example.com
            pattern: '^https://[^/?#\s]+$'
            patternMessage: Enter an https origin with no path, trailing slash or spaces, such as https://assistant.example.com.
            description: >-
              Set it after routing a Control Plane domain to port 18789 of this workload; the canonical
              endpoint is then refused. Empty serves the UI on the canonical endpoint.
      - title: Other workloads
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Firewall changes take from about 30 seconds to 10 minutes to take effect.
            options:
              - value: none
                label: Nobody
                description: No workload can connect over the internal network.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            required: true
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
    rules:
      - when: self.cplnMcp.enabled && self.cplnMcp.signIn == 'per-requester'
        rule: self.publicAccess.enabled
        mirrors: openclaw.validate
        paths: [publicAccess.enabled]
        message: >-
          Per chat user sign-in (under Tools and API) needs the public Control UI, because each sign-in
          returns to the Gateway's public address. Turn it on, or choose Shared there.
      - when: "!self.publicAccess.enabled"
        rule: self.publicAccess.origin == null || self.publicAccess.origin == ''
        mirrors: openclaw.validate
        paths: [publicAccess.enabled]
        message: >-
          A custom domain origin is set while the public Control UI is off. Turn it on, since the domain
          reaches the workload through its public endpoint, or clear the origin in YAML mode.
      - when: self.httpApi.enabled && !self.publicAccess.enabled
        rule: self.internalAccess.type != 'none'
        severity: info
        paths: [internalAccess.type]
        message: With "Nobody", no workload in Control Plane can call the HTTP API.
