# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: OpenClaw
# One stateful Gateway with no location handling: every GVC location would run its own assistant with
# its own state, each fighting over the same bot tokens.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: secret
    title: Secret and model
    description: The prerequisite secret with your login token and model key, and the model the assistant runs on.
    sections:
      - title: Secret
        docs: "#prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              The secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all; `status.versions[].message` of
              `cpln workload get-deployments` names the missing secret.
          - path: secret.name
            type: ref
            label: Secret
            required: true
            description: >-
              A dictionary secret with `gateway-token` (your Control UI login and full-admin API token)
              and `llm-api-key` (the key for the model provider), plus the bot tokens of the channels
              you turn on.
            help: >-
              Generate the gateway token with `openssl rand -hex 32`; a shorter token than 24 characters
              stops the Gateway at start. A changed key reaches the running Gateway only after
              `cpln workload force-redeployment <release>-openclaw --gvc <gvc>`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeysFrom: >-
                ['gateway-token', 'llm-api-key'] +
                (self.channels.telegram.enabled ? ['telegram-bot-token'] : []) +
                (self.channels.slack.enabled ? ['slack-bot-token', 'slack-app-token'] : []) +
                (self.channels.discord.enabled ? ['discord-bot-token'] : [])
              create:
                suggestName: "context.releaseName + '-openclaw-secret'"
                hint: "Generate gateway-token with: openssl rand -hex 32"
        rules:
          - rule: self.secret.name != null && self.secret.name != ''
            mirrors: openclaw.validate
            paths: [secret.name]
            message: The secret is required.
      - title: Model
        docs: "#model"
        fields:
          - type: note
            when: context.mode == 'upgrade'
            text: >-
              The model, channel and HTTP API settings are applied again only when you change them here;
              changes made in the Control UI persist otherwise.
          - path: model.provider
            type: enum
            label: Provider
            widget: cards
            required: true
            description: The secret's `llm-api-key` must be a key for this provider.
            options:
              - value: anthropic
                label: Anthropic
                description: Claude models.
              - value: openai
                label: OpenAI
                description: GPT models.
              - value: custom
                label: OpenAI-compatible endpoint
                description: Any OpenAI-compatible API, such as OpenRouter or LiteLLM.
          - path: model.name
            type: string
            label: Model ID
            required: true
            placeholder: claude-opus-5-5
            description: The model ID as your provider names it.
          - path: model.baseUrl
            type: string
            label: Base URL
            when: self.model.provider == 'custom' || (self.model.baseUrl != null && self.model.baseUrl != '')
            placeholder: https://openrouter.ai/api/v1
            pattern: '^https?://\S+$'
            patternMessage: Enter a URL that starts with http:// or https://.
            description: The endpoint's OpenAI-compatible base URL, usually ending in `/v1`.
        rules:
          - rule: self.model.provider in ['anthropic', 'openai', 'custom']
            mirrors: openclaw.validate
            paths: [model.provider]
            message: Choose Anthropic, OpenAI or an OpenAI-compatible endpoint.
          - rule: self.model.provider == 'custom' || !self.model.name.contains('/')
            mirrors: openclaw.validate
            paths: [model.name]
            messageExpression: >-
              'Give the bare model ID without "/": the chart adds the "' + self.model.provider +
              '/" prefix itself.'
            message: Give the bare model ID without "/"; the chart adds the provider prefix itself.
          - rule: self.model.provider != 'custom' || (self.model.baseUrl != null && self.model.baseUrl != '')
            mirrors: openclaw.validate
            paths: [model.baseUrl]
            message: The base URL is required for an OpenAI-compatible endpoint.
          - rule: self.model.provider == 'custom' || self.model.baseUrl == null || self.model.baseUrl == ''
            mirrors: openclaw.validate
            paths: [model.baseUrl]
            message: >-
              The base URL is only used with an OpenAI-compatible endpoint. Clear it, or choose that
              provider to route the model through it.

  - id: channels
    title: Channels
    description: The chat apps the assistant answers on.
    docs: "#channels"
    sections:
      - id: telegram
        title: Telegram
        toggle: channels.telegram.enabled
        description: A Telegram bot from @BotFather. It connects outbound, so no public endpoint is needed.
        fields:
          - type: note
            severity: warning
            text: Add the key `telegram-bot-token` with the bot token to the secret before you install.
      - id: slack
        title: Slack
        toggle: channels.slack.enabled
        description: A Slack app in Socket Mode. It connects outbound, so no public endpoint is needed.
        fields:
          - type: note
            severity: warning
            text: >-
              Add the keys `slack-bot-token` (the `xoxb-` bot token) and `slack-app-token` (the `xapp-`
              Socket Mode app token) to the secret before you install.
      - id: discord
        title: Discord
        toggle: channels.discord.enabled
        description: >-
          A Discord bot with the Message Content intent enabled. It connects outbound, so no public
          endpoint is needed.
        fields:
          - type: note
            severity: warning
            text: Add the key `discord-bot-token` with the bot token to the secret before you install.
      - id: whatsapp
        title: WhatsApp
        toggle: channels.whatsapp.enabled
        description: >-
          Unofficial WhatsApp Web: you link a phone after install by scanning a QR code, and the account
          can be banned, so use a dedicated number. No key in the secret.
        docs: "#connecting"
        fields:
          - type: note
            text: >-
              After install, open the Control UI over the public endpoint, then **Settings → Channels →
              WhatsApp → Show QR**, and link it on the phone under **Linked devices**. A private install
              can print the QR in a terminal instead:
              `cpln workload exec <release>-openclaw --gvc <gvc> --container openclaw -- sh -c 'cd /app && node openclaw.mjs channels login --channel whatsapp'`.

  - id: tools
    title: Tools and API
    description: >-
      The agent's headless browser, the Control Plane MCP server and an OpenAI-compatible HTTP API on
      the Gateway.
    docs: "#browser-tool-and-http-api"
    sections:
      - id: browser
        title: Browser tool
        toggle: browser.enabled
        description: >-
          Headless Chromium for the agent's browser tool. It runs the `-browser` variant of the image,
          which needs about 1 GiB more memory.
        fields: []
      - id: cpln-mcp
        title: Control Plane MCP
        toggle: cplnMcp.enabled
        description: >-
          Registers the Control Plane MCP server, so the assistant can read and manage your Control
          Plane resources with your own permissions. Nobody is signed in at install. With the public
          Control UI, each chat user signs in from chat with a link the assistant sends; without it,
          you sign in once from the CLI for every chat.
        docs: "#connecting-control-plane-tools-mcp"
        fields: []
      - id: http-api
        title: OpenAI-compatible HTTP API
        toggle: httpApi.enabled
        description: >-
          Serves `/v1/chat/completions` and `/v1/responses` on port 18789, with the gateway token as the
          bearer token.
        fields:
          - type: note
            text: >-
              Callers inside the GVC must also send an `X-Forwarded-For` header (any value), or the
              Gateway answers `403 proxy_attribution_required`.

  - id: storage
    title: Resources and storage
    description: The Gateway's compute, its state volume and that volume's snapshots.
    docs: "#resources-and-storage"
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            description: Config, chat sessions, plugins, memory and the agent's workspace.
            help: Uninstalling the release deletes the volume set; a final snapshot is kept.
            docs: "/reference/volumeset#capacity-and-billing"
            suggestions: [10, 20, 50, 100, 250]
          - path: backup.retention
            type: string
            format: duration
            label: Snapshot retention
            required: true
            description: How long each snapshot is kept, the final snapshot taken at uninstall included.
            suggestions: [7d, 14d, 30d]
          - path: resources
            type: resources
            label: Resources
            required: true
            advanced: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
            description: A single stateful replica.
          - path: image.repository
            type: string
            label: Image repository
            required: true
            advanced: true
          - path: image.tag
            type: string
            label: Image tag
            required: true
            advanced: true
            description: An exact OpenClaw release. `-browser` is appended while the browser tool is on.
        rules:
          - rule: self.backup.retention != null && self.backup.retention != ''
            mirrors: openclaw.validate
            paths: [backup.retention]
            message: The snapshot retention is required.
          - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
            paths: [volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
          - rule: oldSelf == null || self.image.tag == oldSelf.image.tag
            severity: info
            paths: [image.tag]
            message: >-
              A new release migrates the state on its first start, and an older release cannot read it
              afterwards. Take a volume snapshot before you upgrade.
          - when: self.browser.enabled
            rule: memoryBytes(self.resources.maxMemory) >= memoryBytes('3Gi')
            severity: info
            paths: [resources]
            message: >-
              With the browser tool on, keep the maximum memory at 3Gi or more: Chromium with one tab
              uses about 1 GiB on its own.
      - id: autoscaling
        title: Grow the volume automatically
        toggle: volumeset.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 250, 500, 1000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            mirrors: openclaw.validate
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
      - id: backup
        title: Scheduled snapshots
        toggle: backup.enabled
        description: >-
          Platform-managed snapshots of the state volume, with no bucket needed. They hold your channel
          sessions and tokens, so treat them as secrets.
        docs: "/reference/volumeset#snapshots"
        fields:
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            widget: cron
            required: true
        rules:
          - rule: self.backup.schedule != null && self.backup.schedule != ''
            mirrors: openclaw.validate
            paths: [backup.schedule]
            message: The snapshot schedule is required.

  - id: access
    title: Access
    description: Who can reach the Control UI and the Gateway, from the internet and from other workloads.
    docs: "#access"
    sections:
      - id: public
        title: Public Control UI
        toggle: publicAccess.enabled
        description: >-
          Puts the Control UI on the public HTTPS endpoint. That exposes an agent with a shell to the
          internet behind one token, the gateway token, and each new browser needs a one-time approval
          from the CLI before it connects. Without it, reach the UI with `cpln port-forward`.
        docs: "#connecting"
        fields:
          - path: publicAccess.origin
            type: string
            label: Custom domain origin
            placeholder: https://assistant.example.com
            pattern: '^https://[^/?#]+$'
            patternMessage: Enter an https origin with no path or trailing slash, such as https://assistant.example.com.
            description: >-
              Set it after routing a Control Plane domain to port 18789 of this workload; the canonical
              endpoint is then refused. Empty serves the UI on the canonical endpoint.
      - title: Other workloads
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Firewall changes take from about 30 seconds to 10 minutes to take effect.
            options:
              - value: none
                label: Nobody
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
    rules:
      - when: "!self.publicAccess.enabled"
        rule: self.publicAccess.origin == null || self.publicAccess.origin == ''
        mirrors: openclaw.validate
        paths: [publicAccess.enabled]
        message: >-
          A custom domain origin is set while the public Control UI is off. Turn it on, since the domain
          reaches the workload through its public endpoint, or clear the origin in YAML mode.
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: openclaw.validate
        paths: [internalAccess.type]
        message: Choose who can connect.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        mirrors: openclaw.validate
        paths: [internalAccess.workloads]
        message: Add at least one workload, or choose another setting.
      - when: self.httpApi.enabled
        rule: self.internalAccess.type != 'none'
        severity: info
        paths: [internalAccess.type]
        message: With "Nobody", no workload in Control Plane can call the HTTP API.
