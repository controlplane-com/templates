# Default install: 3 nodes with the security plugin on, Dashboards private, no demo, no backups.
locations: [aws-us-east-1]
timeoutSeconds: 1200

generated:
  ca: pkcs12                        # throwaway self-signed CA (CN=templates-ci) → {gen.ca}, {gen.ca.passphrase}

secrets:
  creds:
    type: dictionary
    keys: [password, dashboardsPassword, cookieSecret]
  ca:
    type: dictionary
    entries:
      keystore: "{gen.ca}"
      passphrase: "{gen.ca.passphrase}"

vars:
  os_url: "https://127.0.0.1:9200"
  curl_auth: "-u admin:{secrets.creds.password}"
  admin_password: "{secrets.creds.password}"

values:
  security:
    credentialsSecretName: "{secrets.creds.name}"
    caSecretName: "{secrets.ca.name}"

upgradeFrom:
  - version: 1.0.2
    values: new                     # 2.0.0 adds two required prerequisite secrets
