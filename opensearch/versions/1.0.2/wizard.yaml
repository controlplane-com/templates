# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: OpenSearch
# Every node builds its seed and cluster-manager lists from its own location (secret-startup.yaml:39-62), so
# each GVC location would form its own independent cluster on its own volumes.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: cluster
    title: Cluster
    description: The number of OpenSearch nodes, the cluster name, and the image and compute of each node.
    fields:
      # 1.0.0 and 1.0.1 hardcoded //gvc/test-gvc/... in every identityLink and principalLinks (fixed in 1.0.2,
      # PR #461); values.yaml is identical across 1.0.0, 1.0.1 and 1.0.2, so nothing needs a migration.
      - type: note
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.0.2') < 0
        text: >-
          1.0.0 and 1.0.1 pointed the workloads at an identity in a GVC named `test-gvc`, so a release in any
          other GVC could not start. This upgrade points them at the identity in this release's GVC and keeps
          the data on the volume sets. See [Upgrading from 1.0.x](#upgrading-from-1-0-x).
      # 1.0.0 and 1.0.1 policy.yaml: the demo-logs policy carried targetQuery {match: all, terms: []}, which
      # resolves to every secret of the org (briefings/opensearch.md).
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.0.2') < 0 && oldSelf != null && oldSelf.demoLogs.enabled == true
        text: >-
          With the demo pipeline on, 1.0.0 and 1.0.1 granted the demo identity `reveal` on **every secret in
          the org**. This upgrade narrows it to the Fluent Bit configuration secret, but it does not undo past
          access: review what the org holds and rotate anything sensitive. See
          [Upgrading from 1.0.x](#upgrading-from-1-0-x).
      - path: replicas
        type: integer
        label: Nodes
        required: true
        min: 1
        suggestions: [1, 3, 5, 7]
        description: Each node runs on its own volume, and every node is eligible as cluster manager.
        docs: "#scaling-and-availability"
        rules:
          - rule: self.replicas % 2 == 1
            mirrors: opensearch.validate
            message: The number of nodes must be odd so the cluster can form a quorum.
          - rule: self.replicas != 1
            severity: info
            message: A single node has no failover and keeps no replica of your indices.
          - rule: oldSelf == null || oldSelf.replicas == null || self.replicas == oldSelf.replicas
            severity: info
            message: >-
              The chart only changes the node count; it does not move shards off a node it removes. Take a
              snapshot first, and add or remove nodes as the OpenSearch cluster documentation describes.
      - path: clusterName
        type: string
        label: Cluster name
        required: true
        description: The name every node joins under. Clients and Dashboards do not use it.
        docs: "#cluster"
        rules:
          - rule: oldSelf == null || oldSelf.clusterName == null || self.clusterName == oldSelf.clusterName
            severity: info
            message: >-
              The nodes start under the new cluster name from their existing volumes. Keep the installed name
              unless you mean to rename the cluster.
      - path: image
        type: string
        format: image
        label: OpenSearch image
        required: true
        docs: "#cluster"
        rules:
          - rule: oldSelf == null || oldSelf.image == null || self.image == oldSelf.image
            severity: info
            message: >-
              A new image restarts the nodes. OpenSearch cannot read indices written by a newer version, so
              move only forward, after a snapshot.
      - path: resources
        type: resources
        label: Resources
        required: true
        description: Per node. OpenSearch is memory-sensitive; raise the memory before the CPU.
        docs: "#resources"
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }

  - id: storage
    title: Storage
    description: The volume set that holds each node's indices.
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per node.
            help: >-
              The data lives on the volume set and survives redeploys and upgrades. Uninstalling the release
              deletes the volume set, and the indices with it; a final snapshot of each volume is taken first and
              kept for 7 days.
            docs: "/reference/volumeset#capacity-and-billing"
      - id: autoscaling
        title: Grow storage automatically
        toggle: volumeset.autoscaling.enabled
        description: Each node's volume grows by the scaling factor whenever its free space falls below the threshold.
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: oldSelf == null || oldSelf.volumeset.capacity == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volumes.

  # Before Network: the "Specific workloads" rule there names the backup setup job.
  - id: backup
    title: Backups
    description: Scheduled OpenSearch snapshots to object storage.
    sections:
      - id: backup
        title: Scheduled snapshots
        toggle: backup.enabled
        description: >-
          Each node installs the S3 or GCS repository plugin, and a setup job registers a snapshot repository
          and a policy that takes snapshots of every index on a schedule and prunes old ones. The bucket and the
          Control Plane cloud account (for S3 also the IAM policy) must exist before you turn it on. Turning it
          on at install avoids a few minutes of setup retries on a running cluster.
        docs: "#backing-up"
        fields:
          # README Important Notes and docs Troubleshooting: the plugin is installed by the startup script, so
          # the setup job logs "repository type [s3] does not exist" and restarts until every node carries it.
          - type: note
            when: context.mode == 'upgrade' && oldSelf != null && oldSelf.backup.enabled != true
            text: >-
              On a running cluster the setup job fails for a few minutes, logging
              `repository type [s3] does not exist` (or `[gcs]`) and restarting, until every node has restarted
              with the repository plugin. It then succeeds on its own.
          # 1.0.0 and 1.0.1 identity.yaml: `and .Values.backup.enabled .Values.backup.provider "aws"` is true
          # for either provider, so both the aws and the gcp blocks rendered; the API never removes a cloud
          # binding block from an existing identity (CLAUDE.md, measured 2026-08-21).
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.0.2') < 0 && oldSelf != null && oldSelf.backup.enabled == true
            text: >-
              With backups on, 1.0.0 and 1.0.1 gave the identity both an AWS and a GCP cloud binding. This
              version renders only the one for the destination you choose, but the platform keeps a binding
              once it is set, so the other one stays on the identity. Only uninstalling and reinstalling the
              release removes it.
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: backup.schedule
            type: string
            format: cron
            label: Snapshot schedule (UTC)
            required: true
          - path: backup.retention.maxAge
            type: string
            label: Delete snapshots older than
            required: true
            placeholder: 30d
            description: A number and a unit, such as `30d` or `12h`. Old snapshots are pruned daily at 03:00 UTC.
          - path: backup.retention.maxCount
            type: integer
            label: Snapshots kept at most
            min: 1
            required: true
            suggestions: [7, 14, 30, 60]
          # Shown once the setup job has had a chance to run (an upgrade of a release with backups already on),
          # or while it is set.
          - path: backup.remove_setup_workload
            type: boolean
            label: Remove the setup job
            when: >-
              (oldSelf != null && oldSelf.backup.enabled == true) || self.backup.remove_setup_workload == true
            description: >-
              The repository and the policy live inside OpenSearch, so scheduled snapshots continue without the
              job. Remove it once its log ends with Backup Configuration Complete!
            help: >-
              Read the log with `cpln logs '{gvc="GVC_NAME", workload="RELEASE_NAME-backup-setup"}' --limit 50 --since 10m`.
        rules:
          - rule: self.backup.provider in ['aws', 'gcp']
            mirrors: opensearch.validate
            paths: [backup.provider]
            message: Choose AWS S3 or Google Cloud Storage as the backup destination.
          # OpenSearch time units (TimeValue): nanos, micros, ms, s, m, h, d. A rule rather than a pattern, so a
          # value an installed release already holds is not refused.
          - rule: >-
              (oldSelf != null && oldSelf.backup.retention.maxAge == self.backup.retention.maxAge) ||
              self.backup.retention.maxAge.matches('^[0-9]+(nanos|micros|ms|s|m|h|d)$')
            paths: [backup.retention.maxAge]
            message: Enter the snapshot age as a number and a unit, such as 30d, 12h or 90m.
          # workload-backup-setup.yaml: with remove_setup_workload the job is never rendered, so on a fresh
          # enable nothing registers the repository or the policy.
          - rule: >-
              !self.backup.remove_setup_workload ||
              (oldSelf != null && oldSelf.backup.enabled == true)
            severity: warning
            paths: [backup.remove_setup_workload]
            message: >-
              The setup job has not run yet, and it is what registers the snapshot repository and the policy.
              Leave Remove the setup job off until its log ends with Backup Configuration Complete!
          # workload-backup-setup.yaml step 4: the policy is created only when GET automated-snapshots fails, so
          # a changed schedule or retention never reaches a running cluster.
          - when: >-
              oldSelf != null && oldSelf.backup.enabled == true && !self.backup.remove_setup_workload
            rule: >-
              self.backup.schedule == oldSelf.backup.schedule &&
              self.backup.retention.maxAge == oldSelf.backup.retention.maxAge &&
              self.backup.retention.maxCount == oldSelf.backup.retention.maxCount
            severity: info
            paths: [backup.schedule]
            messageExpression: >-
              'The setup job creates the snapshot policy only when none exists, so the new schedule or retention
              does not reach this cluster. After the upgrade, delete the policy from a workload in the GVC with
              curl -X DELETE http://' + context.releaseName + '-opensearch.' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') +
              '.cpln.local:9200/_plugins/_sm/policies/automated-snapshots, then run cpln workload force-redeployment ' +
              context.releaseName + '-backup-setup --gvc ' + (context.gvc != null ? context.gvc : 'GVC_NAME') +
              ' so the job creates it again with the new settings.'
            message: >-
              The setup job creates the snapshot policy only when none exists, so the new schedule or retention
              does not reach this cluster. After the upgrade, delete the automated-snapshots policy, then force a
              redeployment of the backup setup workload so the job creates it again with the new settings.
          - when: >-
              oldSelf != null && oldSelf.backup.enabled == true && self.backup.remove_setup_workload
            rule: >-
              self.backup.provider == oldSelf.backup.provider &&
              self.backup.schedule == oldSelf.backup.schedule &&
              self.backup.retention.maxAge == oldSelf.backup.retention.maxAge &&
              self.backup.retention.maxCount == oldSelf.backup.retention.maxCount &&
              self.backup.aws.bucket == oldSelf.backup.aws.bucket &&
              self.backup.aws.region == oldSelf.backup.aws.region &&
              self.backup.aws.prefix == oldSelf.backup.aws.prefix &&
              self.backup.gcp.bucket == oldSelf.backup.gcp.bucket &&
              self.backup.gcp.prefix == oldSelf.backup.gcp.prefix
            severity: warning
            paths: [backup.remove_setup_workload]
            message: >-
              Only the setup job writes the snapshot settings into OpenSearch, so with the job removed the
              changed settings never reach the cluster. Turn off Remove the setup job for this upgrade.
          # README Important Notes: the API merges identity updates and never removes a provider block.
          - rule: >-
              oldSelf == null || oldSelf.backup.enabled != true || self.backup.provider == oldSelf.backup.provider
            severity: info
            paths: [backup.provider]
            message: >-
              The platform keeps the old destination's cloud binding on the identity after a switch. Only
              uninstalling and reinstalling the release removes it.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        fields:
          # 1.0.2 identity.yaml dropped aws::ReadOnlyAccess from policyRefs.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.0.2') < 0 && oldSelf != null &&
              oldSelf.backup.enabled == true
            text: >-
              This version removes `aws::ReadOnlyAccess` from the identity. That managed policy granted read
              access to every bucket in your AWS account and may have been supplying a read action your
              bucket-scoped policy omits. **Before you upgrade**, make your IAM policy match the one in
              [Backing Up](#backing-up), on both the bucket and the `bucket/*` ARNs.
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) for the AWS account that holds the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              The policy needs the eight S3 actions listed under [Backing Up](#backing-up), on both
              `arn:aws:s3:::BUCKET` and `arn:aws:s3:::BUCKET/*`. With only the `/*` ARN the repository registers
              and listing snapshots then fails. The identity carries only `cpln-connector` and this policy.
            pattern: '^[A-Za-z0-9+=,.@_-]+$'
            patternMessage: "Enter the name of your IAM policy, using letters, digits and + = , . @ _ -."
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        fields:
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin
              role. Access is keyless; no credentials are stored.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.

  # Before Network: the "Specific workloads" rule there names the Dashboards and demo workloads.
  - id: dashboards
    title: Dashboards
    description: The OpenSearch Dashboards UI and an optional demo log pipeline.
    sections:
      - id: dashboard
        title: OpenSearch Dashboards
        toggle: dashboard.enabled
        description: >-
          The web UI for searching and visualizing your indices. It is never published to the internet; you
          reach it with cpln port-forward.
        docs: "#dashboards"
        fields:
          - type: note
            text: >-
              Open it with `cpln port-forward RELEASE_NAME-opensearch-dashboard 5601:5601 --gvc GVC_NAME`, then
              browse to `http://localhost:5601`. There is no login.
            textExpression: >-
              'Open it with `cpln port-forward ' + context.releaseName + '-opensearch-dashboard 5601:5601 --gvc ' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') +
              '`, then browse to `http://localhost:5601`. There is no login.'
          - path: dashboard.image
            type: string
            format: image
            label: Dashboards image
            required: true
            advanced: true
          - path: dashboard.resources
            type: resources
            label: Dashboards resources
            required: true
            advanced: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - when: self.image.contains(':') && self.dashboard.image.contains(':')
            rule: >-
              self.image.split(':')[size(self.image.split(':')) - 1] ==
              self.dashboard.image.split(':')[size(self.dashboard.image.split(':')) - 1]
            severity: info
            paths: [dashboard.image]
            message: >-
              OpenSearch Dashboards works only with an OpenSearch of the same version. Keep the Dashboards image
              on the same tag as the OpenSearch image.
      - id: demo
        title: Demo log pipeline
        toggle: demoLogs.enabled
        description: >-
          A sample app writes logs that a Fluent Bit sidecar ships into a demo-logs index, and a setup job adds
          a demo-logs* index pattern to Dashboards, to see the pipeline end to end. It runs a workload, a volume
          set, an identity and a policy of its own; leave it off in production.
        docs: "#demo-logs"
        fields:
          - path: demoLogs.remove_setup_workload
            type: boolean
            label: Remove the demo setup job
            when: >-
              (oldSelf != null && oldSelf.demoLogs.enabled == true) || self.demoLogs.remove_setup_workload == true
            description: >-
              The index template and the index pattern stay in OpenSearch and Dashboards, so the pipeline keeps
              running without the job. Remove it once the job has completed.
        rules:
          # workload-demo-logs.yaml step 3 waits for the Dashboards workload, exits 1 after 60 attempts and
          # restarts (docs Troubleshooting: 'Waiting for Dashboard...').
          - rule: self.dashboard.enabled
            severity: warning
            paths: [demoLogs.enabled]
            message: >-
              The demo setup job creates its index pattern in Dashboards and keeps failing without it. Turn on
              OpenSearch Dashboards, or leave the demo pipeline off.
          - rule: >-
              !self.demoLogs.remove_setup_workload ||
              (oldSelf != null && oldSelf.demoLogs.enabled == true)
            severity: warning
            paths: [demoLogs.remove_setup_workload]
            message: >-
              The demo setup job has not run yet, and it is what creates the demo index template and the index
              pattern. Leave Remove the demo setup job off until it has completed.

  - id: network
    title: Network
    description: Which workloads can reach OpenSearch on port 9200.
    sections:
      - title: OpenSearch access
        docs: "#internal-access"
        fields:
          - type: note
            severity: warning
            text: >-
              The security plugin is off, so there is **no authentication**: every workload admitted here has
              full admin access to every index. This setting is the only access control the cluster has.
          - path: internal_access.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: >-
              OpenSearch is never published to the internet by this template. Access changes take up to a
              couple of minutes to take effect.
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org. Prefer Specific workloads for anything sensitive.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          # Shown for every type that uses it: workload-opensearch.yaml:57-59 writes any non-empty list into
          # inboundAllowWorkload, and the platform applies the links only with same-gvc and workload-list.
          - path: internal_access.workloads
            when: self.internal_access.type in ['same-gvc', 'workload-list'] || size(self.internal_access.workloads) > 0
            type: list
            label: Allowed workloads
            widget: tags
            unique: true
            description: >-
              With Specific workloads this is the whole allow-list, including this release's own workloads. With
              Same GVC, add workloads from other GVCs here.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internal_access.type == 'same-gvc'
    rules:
      - when: self.internal_access.type == 'same-gvc' && context.gvc != null
        rule: "!self.internal_access.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
        severity: info
        paths: [internal_access.workloads]
        messageExpression: >-
          'Same GVC already allows every workload in this GVC: ' +
          self.internal_access.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
          ' can be removed from the list.'
        message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
      - when: self.internal_access.type == 'same-org'
        rule: size(self.internal_access.workloads) == 0
        severity: info
        paths: [internal_access.workloads]
        message: >-
          Same org already lets every workload of the org connect to OpenSearch, so the workloads listed add
          nothing.
      # The internal firewall also governs the nodes' transport traffic on 9300 (replicaDirect, per-replica
      # names): etcd-multi-location measured quorum loss when the list omitted the workload itself. The chart
      # adds none of its own workloads (workload-opensearch.yaml:55-59); Dashboards (OPENSEARCH_HOSTS), the
      # backup setup job, the demo generator's Fluent Bit sidecar and the demo setup job all call :9200.
      - when: self.internal_access.type == 'workload-list' && context.gvc != null
        rule: >-
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-opensearch') in self.internal_access.workloads &&
          (!self.dashboard.enabled ||
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-opensearch-dashboard') in self.internal_access.workloads) &&
          (!self.backup.enabled || self.backup.remove_setup_workload ||
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-backup-setup') in self.internal_access.workloads) &&
          (!self.demoLogs.enabled ||
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-demo-log-generator') in self.internal_access.workloads) &&
          (!self.demoLogs.enabled || self.demoLogs.remove_setup_workload ||
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-demo-log-setup') in self.internal_access.workloads)
        severity: warning
        paths: [internal_access.workloads]
        messageExpression: >-
          'The chart does not add its own workloads to the list, and the nodes reach each other through it too. Add ' +
          (['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-opensearch'] +
          (self.dashboard.enabled ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-opensearch-dashboard'] : []) +
          (self.backup.enabled && !self.backup.remove_setup_workload ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-backup-setup'] : []) +
          (self.demoLogs.enabled ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-demo-log-generator'] : []) +
          (self.demoLogs.enabled && !self.demoLogs.remove_setup_workload ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-demo-log-setup'] : []))
          .filter(w, !(w in self.internal_access.workloads)).join(', ') +
          ', or the cluster cannot form and these workloads cannot connect.'
        message: >-
          The chart does not add its own workloads to the list, and the nodes reach each other through it too.
          Add the OpenSearch workload itself and the enabled Dashboards, backup setup and demo workloads.
        fix:
          path: internal_access.workloads
          items: >-
            (['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-opensearch'] +
            (self.dashboard.enabled ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-opensearch-dashboard'] : []) +
            (self.backup.enabled && !self.backup.remove_setup_workload ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-backup-setup'] : []) +
            (self.demoLogs.enabled ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-demo-log-generator'] : []) +
