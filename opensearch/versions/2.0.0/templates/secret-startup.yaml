kind: secret
name: {{ include "opensearch.secretStartup.name" . }}
description: OpenSearch startup script
tags: {{ include "opensearch.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  {{- /*
  The script holds no credentials: they arrive as cpln://secret env vars. It is
  mounted as a file, so $ needs no doubling here.
  */}}
  payload: |-
    #!/bin/bash
    set -e

    OS_HOME=/usr/share/opensearch
    CONF="${OS_HOME}/config"
    CERTS="${CONF}/certs"

    {{- if .Values.backup.enabled }}

    # --- Snapshot repository plugin ---
    {{- if eq .Values.backup.provider "aws" }}
    [ -d "${OS_HOME}/plugins/repository-s3" ] || "${OS_HOME}/bin/opensearch-plugin" install --batch repository-s3
    {{- else if eq .Values.backup.provider "gcp" }}
    [ -d "${OS_HOME}/plugins/repository-gcs" ] || "${OS_HOME}/bin/opensearch-plugin" install --batch repository-gcs
    {{- end }}
    {{- end }}

    # --- Node identity ---
    REPLICA_INDEX="${HOSTNAME##*-}"
    LOCATION="${CPLN_LOCATION##*/}"
    NODE_NAME="replica-${REPLICA_INDEX}.{{ include "opensearch.name" . }}.${LOCATION}.{{ .Values.global.cpln.gvc }}.cpln.local"
    CERT_O="{{ include "opensearch.certOrg" . }}"
    echo "Starting OpenSearch node: ${NODE_NAME}"

    for v in OS_CA_KEYSTORE OS_CA_PASSPHRASE OS_ADMIN_PASSWORD OS_DASHBOARDS_PASSWORD; do
      if [ -z "${!v}" ]; then
        echo "FATAL: ${v} is empty. Check the {{ include "opensearch.secret.credentials.name" . }} and {{ include "opensearch.secret.ca.name" . }} secrets (README Prerequisites)."
        exit 1
      fi
    done

    # --- Certificates, issued at every start from the user's CA (keytool only) ---
    rand() { tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32; }
    NODE_PASS="$(rand)"; ADMIN_PASS="$(rand)"; TS_PASS="$(rand)"
    umask 077  # every file written below is private to the opensearch user
    rm -rf "${CERTS}"
    mkdir -p "${CERTS}"
    cd "${CERTS}"
    printf '%s' "${OS_CA_KEYSTORE}" | base64 -d > ca.p12
    CA_ALIAS="$(keytool -list -v -keystore ca.p12 -storetype PKCS12 -storepass "${OS_CA_PASSPHRASE}" \
      | awk -F': ' '/^Alias name:/{a=$2} /^Entry type: PrivateKeyEntry/{print a; exit}' || true)"
    if [ -z "${CA_ALIAS}" ]; then
      echo "FATAL: the CA keystore holds no private key, or the passphrase is wrong (README Prerequisites)."
      exit 1
    fi
    keytool -exportcert -rfc -alias "${CA_ALIAS}" -keystore ca.p12 -storetype PKCS12 \
      -storepass "${OS_CA_PASSPHRASE}" -file ca.pem
    keytool -importcert -noprompt -alias ca -file ca.pem -keystore truststore.p12 -storetype PKCS12 \
      -storepass "${TS_PASS}"

    # issue ALIAS DN EKU PASS [SAN]: a key pair signed by the CA, in ALIAS.p12
    issue() {
      keytool -genkeypair -alias "$1" -keyalg RSA -keysize 2048 -dname "$2" -validity 825 \
        -keystore "$1.p12" -storetype PKCS12 -storepass "$4"
      keytool -certreq -alias "$1" -keystore "$1.p12" -storetype PKCS12 -storepass "$4" -file "$1.csr"
      keytool -gencert -rfc -alias "${CA_ALIAS}" -keystore ca.p12 -storetype PKCS12 \
        -storepass "${OS_CA_PASSPHRASE}" -infile "$1.csr" -outfile "$1.crt" -validity 825 \
        ${5:+-ext "SAN=$5"} -ext "EKU=$3" -ext "KU=digitalSignature,keyEncipherment"
      keytool -importcert -noprompt -alias ca -file ca.pem -keystore "$1.p12" -storetype PKCS12 -storepass "$4"
      keytool -importcert -noprompt -alias "$1" -file "$1.crt" -keystore "$1.p12" -storetype PKCS12 -storepass "$4"
      keytool -delete -alias ca -keystore "$1.p12" -storetype PKCS12 -storepass "$4"
      rm -f "$1.csr" "$1.crt"
    }
    issue node "CN=node-${REPLICA_INDEX},OU=node,O=${CERT_O}" "serverAuth,clientAuth" "${NODE_PASS}" \
      "dns:${NODE_NAME},dns:{{ include "opensearch.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local,dns:localhost,ip:127.0.0.1"
    issue admin "CN=admin,OU=client,O=${CERT_O}" "clientAuth" "${ADMIN_PASS}"
    rm -f ca.p12
    # Nothing below needs the CA again; no child process (the reconcile subshell included) inherits it.
    unset OS_CA_KEYSTORE OS_CA_PASSPHRASE
    echo "Issued node and admin certificates from CA alias ${CA_ALIAS}"
    cd "${OS_HOME}"

    # --- Internal users: only admin and kibanaserver (the image's demo users are dropped) ---
    HASH="${OS_HOME}/plugins/opensearch-security/tools/hash.sh"
    ADMIN_HASH="$(bash "${HASH}" -env OS_ADMIN_PASSWORD | tail -n 1)"
    DASHBOARDS_HASH="$(bash "${HASH}" -env OS_DASHBOARDS_PASSWORD | tail -n 1)"
    case "${ADMIN_HASH}${DASHBOARDS_HASH}" in
      '$2'*'$2'*) ;;
      *) echo "FATAL: could not hash the passwords from the credentials secret."; exit 1 ;;
    esac
    cat <<EOF > "${CONF}/opensearch-security/internal_users.yml"
    ---
    _meta:
      type: "internalusers"
      config_version: 2
    admin:
      hash: "${ADMIN_HASH}"
      reserved: true
      backend_roles:
      - "admin"
      description: "Administrator; password from the credentials secret"
    kibanaserver:
      hash: "${DASHBOARDS_HASH}"
      reserved: true
      description: "OpenSearch Dashboards server user; password from the credentials secret"
    EOF

    # --- opensearch.yml ---
    cat <<EOF > "${CONF}/opensearch.yml"
    cluster.name: {{ .Values.clusterName }}
    node.name: ${NODE_NAME}
    network.host: 0.0.0.0
    discovery.seed_hosts:
    {{- range $i := until (int .Values.replicas) }}
      - replica-{{ $i }}.{{ include "opensearch.name" $ }}.${LOCATION}.{{ $.Values.global.cpln.gvc }}.cpln.local
    {{- end }}
    cluster.initial_cluster_manager_nodes:
    {{- range $i := until (int .Values.replicas) }}
      - replica-{{ $i }}.{{ include "opensearch.name" $ }}.${LOCATION}.{{ $.Values.global.cpln.gvc }}.cpln.local
    {{- end }}
    path.data: ${OS_HOME}/data
    http.port: 9200
    transport.port: 9300

    plugins.security.ssl.transport.keystore_type: PKCS12
    plugins.security.ssl.transport.keystore_filepath: certs/node.p12
    plugins.security.ssl.transport.keystore_alias: node
    plugins.security.ssl.transport.keystore_password: ${NODE_PASS}
    plugins.security.ssl.transport.truststore_type: PKCS12
    plugins.security.ssl.transport.truststore_filepath: certs/truststore.p12
    plugins.security.ssl.transport.truststore_password: ${TS_PASS}
    # Peers connect by IP, which no SAN names; trust comes from the CA and nodes_dn.
    transport.ssl.enforce_hostname_verification: false
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.keystore_type: PKCS12
    plugins.security.ssl.http.keystore_filepath: certs/node.p12
    plugins.security.ssl.http.keystore_alias: node
    plugins.security.ssl.http.keystore_password: ${NODE_PASS}
    plugins.security.ssl.http.truststore_type: PKCS12
    plugins.security.ssl.http.truststore_filepath: certs/truststore.p12
    plugins.security.ssl.http.truststore_password: ${TS_PASS}
    plugins.security.nodes_dn:
      - "CN=node-*,OU=node,O=${CERT_O}"
    plugins.security.authcz.admin_dn:
      - "CN=admin,OU=client,O=${CERT_O}"
    plugins.security.allow_default_init_securityindex: true
    plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
    plugins.security.audit.type: internal_opensearch
    plugins.security.enable_snapshot_restore_privilege: true
    plugins.security.check_snapshot_restore_write_privileges: true
    EOF

    # --- Re-apply the admin and kibanaserver passwords from the secret on every start ---
    # "add" replaces the whole user, so reserved and backend_roles are sent again.
    esc() { local s="${1//\\/\\\\}"; printf '%s' "${s//\"/\\\"}"; }
    printf '[{"op":"add","path":"/admin","value":{"password":"%s","reserved":true,"backend_roles":["admin"],"description":"Administrator; password from the credentials secret"}},{"op":"add","path":"/kibanaserver","value":{"password":"%s","reserved":true,"description":"OpenSearch Dashboards server user; password from the credentials secret"}}]' \
      "$(esc "${OS_ADMIN_PASSWORD}")" "$(esc "${OS_DASHBOARDS_PASSWORD}")" > "${CERTS}/reconcile.json"
    printf 'cert-type = "P12"\ncert = "%s/admin.p12:%s"\n' "${CERTS}" "${ADMIN_PASS}" > "${CERTS}/admin.curlrc"
    # The passwords are in reconcile.json now; nothing below needs them in its environment.
    unset OS_ADMIN_PASSWORD OS_DASHBOARDS_PASSWORD
    # The retry loop runs as a fresh process, not a forked subshell: a fork keeps this script's original
    # environment block (/proc/<pid>/environ, secrets included) for as long as it lives; an exec does not.
    cat > "${CERTS}/reconcile.sh" <<'EOF'
    CERTS="$1"
    code=000
    for _ in $(seq 1 90); do
      code="$(curl -sk -K "${CERTS}/admin.curlrc" -o "${CERTS}/reconcile.out" -w '%{http_code}' \
        -X PATCH https://127.0.0.1:9200/_plugins/_security/api/internalusers \
        -H 'Content-Type: application/json' --data-binary @"${CERTS}/reconcile.json" || true)"
      if [ "${code}" = "200" ]; then
        echo "security-reconcile: admin,kibanaserver updated"
        break
      fi
      sleep 10
    done
    if [ "${code}" != "200" ]; then
      echo "security-reconcile: FAILED ${code} $(head -c 300 "${CERTS}/reconcile.out" 2>/dev/null)"
    fi
    # The admin certificate is needed only for this call.
    rm -f "${CERTS}/reconcile.json" "${CERTS}/reconcile.out" "${CERTS}/admin.curlrc" "${CERTS}/admin.p12" "$0"
    EOF
    bash "${CERTS}/reconcile.sh" "${CERTS}" &

    exec "${OS_HOME}/opensearch-docker-entrypoint.sh"
