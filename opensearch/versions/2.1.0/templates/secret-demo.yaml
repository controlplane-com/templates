{{- if .Values.demoLogs.enabled }}
kind: secret
name: {{ include "opensearch.secretFluentBitDemo.name" . }}
description: Fluent Bit config for OpenSearch demo logs app
tags: {{ include "opensearch.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/app/*.log
        Parser            json
        Tag               app.*
        Refresh_Interval  5
        Read_from_Head    true

    [FILTER]
        Name    modify
        Match   *
        Add     cluster demo-cluster
        Add     environment demo

    [OUTPUT]
        Name            opensearch
        Match           *
        Host            {{ include "opensearch.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        Port            9200
        HTTP_User       admin
        HTTP_Passwd     ${OPENSEARCH_PASSWORD}
        tls             On
        tls.verify      Off
        Index           demo-logs
        Type            _doc
        Suppress_Type_Name On
        Retry_Limit     5
{{- end }}
