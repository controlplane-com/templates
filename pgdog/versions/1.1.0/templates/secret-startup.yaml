{{- include "pgdog.validate" . }}
kind: secret
name: {{ include "pgdog.secret.startup.name" . }}
description: PgDog startup script
tags: {{- include "pgdog.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  {{- /*
    PgDog reads credentials only from pgdog.toml / users.toml on disk — it has no
    environment-variable interpolation. Since 1.1.0 those credentials come from
    user-created prerequisite secrets, which are injected as env vars, so the two
    files are ASSEMBLED HERE at container start rather than rendered into a secret
    by Helm. The static half (general settings, [[databases]]) is still rendered
    and mounted read-only; this script copies it and appends what it must not
    contain.
  */}}
  payload: |-
    #!/bin/bash
    set -euo pipefail

    CONF_DIR=/tmp/pgdog
    mkdir -p "$CONF_DIR"
    chmod 700 "$CONF_DIR"

    # Emit a TOML basic string. Credentials come from secrets the USER created, so
    # they may legitimately contain " or \ — emitting them raw yields invalid TOML
    # and PgDog exits with a parse error that names no cause. Every value reaching
    # this function has already been through require(); do NOT validate here, this
    # runs inside $(...) where `exit` would only leave the subshell.
    toml_str() {
      local v=$1
      v=${v//\\/\\\\}
      v=${v//\"/\\\"}
      printf '"%s"' "$v"
    }

    # A key that is present but empty produces a PgDog that starts and then rejects
    # every login; a trailing newline (what `echo` adds) produces the same silent
    # auth failure. Fail here instead, naming the secret and the key.
    require() {
      local value=$1 what=$2
      if [[ -z "$value" ]]; then
        echo "FATAL: $what is missing or empty. See Prerequisites in the README." >&2
        exit 1
      fi
      if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
        echo "FATAL: $what contains a newline, and PgDog config values are single-line TOML strings. This is usually a trailing newline added by echo — recreate the secret with printf, not echo. See Prerequisites in the README." >&2
        exit 1
      fi
    }

    # ── pgdog.toml ──────────────────────────────────────────────────────────────
    require "${PGDOG_ADMIN_DATABASE:-}" "admin.database"
    require "${PGDOG_ADMIN_USER:-}" "admin.user"
    require "${PGDOG_ADMIN_PASSWORD:-}" "the payload of the opaque secret '{{ .Values.admin.passwordSecretName }}' (the PgDog admin password)"

    cp /etc/pgdog/pgdog.base.toml "$CONF_DIR/pgdog.toml"
    {
      echo ""
      echo "[admin]"
      echo "name = $(toml_str "${PGDOG_ADMIN_DATABASE}")"
      echo "user = $(toml_str "${PGDOG_ADMIN_USER}")"
      echo "password = $(toml_str "${PGDOG_ADMIN_PASSWORD}")"
    } >> "$CONF_DIR/pgdog.toml"

    # ── users.toml ──────────────────────────────────────────────────────────────
    : > "$CONF_DIR/users.toml"
    {{- range $i, $u := .Values.users }}

    require "${PGDOG_USER_{{ $i }}_USERNAME:-}" "key 'username' of the dictionary secret '{{ $u.credentialsSecretName }}' (users[{{ $i }}])"
    require "${PGDOG_USER_{{ $i }}_PASSWORD:-}" "key 'password' of the dictionary secret '{{ $u.credentialsSecretName }}' (users[{{ $i }}])"
    require "${PGDOG_USER_{{ $i }}_DATABASE:-}" "users[{{ $i }}].database"
    {
      echo "[[users]]"
      echo "name = $(toml_str "${PGDOG_USER_{{ $i }}_USERNAME}")"
      echo "password = $(toml_str "${PGDOG_USER_{{ $i }}_PASSWORD}")"
      echo "database = $(toml_str "${PGDOG_USER_{{ $i }}_DATABASE}")"
      echo ""
    } >> "$CONF_DIR/users.toml"
    {{- end }}

    chmod 600 "$CONF_DIR/pgdog.toml" "$CONF_DIR/users.toml"
    echo "PgDog config assembled: {{ len .Values.users }} pooled user(s), {{ len .Values.databases }} backend database entry(ies)."

    # exec so PgDog becomes PID 1 and receives the shutdown signal directly
    exec /usr/local/bin/pgdog --config "$CONF_DIR/pgdog.toml" --users "$CONF_DIR/users.toml"
