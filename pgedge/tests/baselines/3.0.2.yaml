# pgedge 3.0.2 — PostgreSQL 17 with the pooler waiting for the full replication mesh; the upgrade source
# for 4.0.0. Same shape as 4.0.0.yaml; no image is set, so the release runs 3.0.2's default (PostgreSQL 17).
locations: [aws-us-east-1, aws-us-east-2]
timeoutSeconds: 900

generated:
  pgpw: hex

secrets:
  creds:
    type: dictionary
    entries:
      username: e2e
      password: "{gen.pgpw}"
      database: e2e

vars:
  pg_user: e2e
  pg_password: "{gen.pgpw}"
  pg_db: e2e

values:
  locations:
    - name: aws-us-east-1
      replicas: 2
    - name: aws-us-east-2
      replicas: 2
  resources:
    minCpu: 250m
    minMemory: 512Mi
    maxCpu: 1
    maxMemory: 2Gi
  postgres:
    credentialsSecretName: "{secrets.creds.name}"
  proxy:
    minReplicas: 2
    maxReplicas: 2
  pgbouncer:
    minReplicas: 2
    maxReplicas: 2

# A 3.0.1 install upgraded in place: every node restarts, its daemon writes the mesh marker once all
# subscriptions replicate, and the new PgBouncer replicas become ready on it.
upgradeFrom:
  - version: 3.0.1
