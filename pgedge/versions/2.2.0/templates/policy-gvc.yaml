---
{{- /*
  The pgEdge container reads its own GVC at boot to confirm the GVC really has
  every location this release declares -- the platform does not validate
  localOptions locations, so a typo is otherwise accepted silently and simply
  never runs. Scoped to the ONE install GVC; never `target: all`, which would
  grant view on every GVC in the org.
*/}}
kind: policy
name: {{ include "pgedge.policy.gvc.name" . }}
description: pgEdge GVC read policy
tags: {{- include "pgedge.tags" . | nindent 2 }}
bindings:
  - permissions:
      - view
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "pgedge.identity.name" . }}
targetKind: gvc
targetLinks:
  - //gvc/{{ .Values.global.cpln.gvc }}
