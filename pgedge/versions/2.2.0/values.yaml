# ─── Locations ────────────────────────────────────────────────────────────────
# This chart deploys into the GVC you install into — it does NOT create one.
# Every location listed here MUST already exist in that GVC, or the pgEdge nodes
# refuse to initialise with a named error (see Prerequisites in the README).
# Extra locations in the GVC are fine: nothing pgEdge-related runs in them.
locations: # For replicas: use 1 for dev/testing, 3 for production
  - name: aws-us-west-2
    replicas: 3
  - name: aws-us-east-2
    replicas: 3
  - name: aws-eu-central-1
    replicas: 3

image: ghcr.io/pgedge/pgedge-postgres:17-spock5-standard

resources:
  minCpu: 500m
  minMemory: 1Gi
  maxCpu: 2
  maxMemory: 4Gi

postgres:
  # REQUIRED PREREQUISITE SECRET — CREATE IT BEFORE YOU INSTALL.
  # A `dictionary` secret holding exactly three keys: `username`, `password`
  # and `database`. If it does not exist at install time the deployment
  # WEDGES silently — `cpln logs` returns nothing at all. See Prerequisites
  # in the README for the exact `cpln secret create-dictionary` command.
  credentialsSecretName: my-pgedge-credentials

multiZone: false  # Set to true to spread replicas across availability zones within each location

volumeset:
  capacity: 10  # Initial capacity in GiB (minimum is 10)
  autoscaling:
    enabled: false  # Set to true to enable autoscaling
    maxCapacity: 100  # Maximum capacity in GiB when autoscaling is enabled
    minFreePercentage: 10  # Minimum free percentage to trigger scaling
    scalingFactor: 1.2  # How much to scale up when triggered

# ─── HAProxy failover tier (in front of the pgEdge nodes) ──────────────────────
# One HAProxy per location. Each location's HAProxy sends client traffic to ITS OWN
# location's node-0 (active) and falls back — in order — to the other local nodes,
# then to a remote location's nodes, only when the closer ones are unhealthy. This
# is what lets a client survive the death of its LOCAL node: pgcat alone empties its
# pool and returns AllServersDown when the local node dies.
#
# NOTE: this does NOT fail a client over when its WHOLE location is lost (that
# location's pgcat and HAProxy die too, and the mesh service DNS is location-pinned).
# See "Failover behaviour" in the README.
#
# Enabled by default because pgEdge's value proposition IS availability. Set
# proxy.enabled: false for the exact 2.1.0 shape (pgcat straight to the nodes) —
# appropriate for a single-location or dev install.
proxy:
  enabled: true
  image: haproxy:3.0.28  # pinned exact; Debian variant (perl needed by the startup gate)
  resources:
    cpu: 100m
    memory: 128Mi
  minReplicas: 2         # per location
  maxReplicas: 2         # per location

pgcat:
  image: ghcr.io/postgresml/pgcat:v1.2.0 # pinned: `latest` makes installs non-reproducible
  poolMode: transaction  # options: session, transaction, statement
  defaultPoolSize: 25    # Real Postgres connections pgcat maintains per pool
  # `routing` ONLY applies when proxy.enabled is false. With the failover tier on
  # (the default), pgcat pools a single backend — the local HAProxy — and all node
  # selection / local-preference is done by HAProxy, so `routing` is ignored.
  # How each pgcat pools the cluster's pgEdge nodes (proxy.enabled: false only):
  #   local         (default) — each location's pgcat pools ONLY that location's nodes,
  #                 with the local node as the write target. Every region serves reads AND
  #                 writes locally — true active/active, which is what pgEdge is for — and
  #                 losing one location does not stop writes in the others.
  #   single-writer — every pgcat (in all locations) pools the WHOLE cluster with ONE write
  #                 target (the first location's first node). Avoids last-update-wins
  #                 conflicts by funneling writes to one node, but writes STOP if that
  #                 location is down and reads are served cross-region. Choose this only if
  #                 your app cannot tolerate multi-master conflict resolution.
  routing: local         # local | single-writer  (ignored when proxy.enabled)
  resources:
    cpu: 500m
    memory: 256Mi
  minReplicas: 2         # per location
  maxReplicas: 4         # per location

internal_access: # Sets both pgedge and pgcat workloads
  type: same-gvc  # options: same-gvc, same-org, workload-list
  workloads:  # Only used when type is workload-list; list only your clients --
              # this release's pgedge and pgcat workloads are added automatically
    #- //gvc/GVC_NAME/workload/WORKLOAD_NAME

backup:
  enabled: false
  image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
  schedule: "0 2 * * *"   # daily at 2am UTC — runs in locations[0] only

  resources:
    cpu: 100m
    memory: 128Mi

  provider: aws  # Options: aws or gcp

  aws:
    bucket: my-backup-bucket
    region: us-east-1
    cloudAccountName: my-backup-cloudaccount
    policyName: my-backup-policy
    prefix: pgedge/backups  # folder where backups will be stored

  gcp:
    bucket: my-backup-bucket
    cloudAccountName: my-backup-cloudaccount
    prefix: pgedge/backups  # folder where backups will be stored
