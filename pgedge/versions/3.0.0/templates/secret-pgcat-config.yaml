---
kind: secret
name: {{ include "pgedge.secretPgcatConfig.name" . }}
description: pgCat startup script
tags: {{- include "pgedge.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu

    # pgcat reads a TOML file, and a cpln:// reference inside a file is never
    # resolved — the platform only resolves them for env vars. So the config is
    # assembled here, at container start, from the prerequisite secret. The
    # heredoc is unquoted, so ${VAR} expands; quoting it would defeat the point.
{{- if .Values.proxy.enabled }}

    # Failover tier ON (the default): pgcat pools a SINGLE backend — this
    # location's HAProxy (reached over the location-pinned service DNS). HAProxy
    # does all node selection (local node-0 active, other local nodes then remote
    # nodes as ordered backups), so pgcat is a pure pooler that never sees a dead
    # node and its per-backend ban logic can never strand a client. `pgcat.routing`
    # does not apply in this mode; read/write splitting is off (one backend).
    entry=$(printf '        ["%s.%s.cpln.local", 5432, "primary"],' \
      "{{ include "pgedge.proxy.name" . }}" "${CPLN_GVC}")
    SERVERS="${entry}
    "
    NODE_TOTAL=1
    PRIMARY_READS=true
{{- else }}

    # The server list is built here too, from the same PGEDGE_* env the pgEdge
    # nodes use, so pgcat's pool and the Spock mesh derive from ONE source.
    #   routing=local (default): each pgcat pools ONLY its own location's nodes —
    #     the local node-0 is the write target, other local nodes are read replicas —
    #     so every region reads AND writes locally (true active/active).
    #   routing=single-writer: every pgcat pools the WHOLE cluster with ONE write
    #     target (location[0] + node-0); everything else is a "replica".
    # NODE_TOTAL counts the nodes in THIS pool (local: local nodes; single-writer: all).
    # POSIX sh — no bash arrays.
    ROUTING="{{ .Values.pgcat.routing }}"
    LOCATION=$(basename "${CPLN_LOCATION}")
    SERVERS=""
    NODE_TOTAL=0
    i=0
    for loc in ${PGEDGE_LOCATIONS}; do
      count=$(echo "${PGEDGE_REPLICAS}" | cut -d' ' -f$((i + 1)))
      # Local routing pools only THIS location's nodes.
      if [ "${ROUTING}" = "local" ] && [ "${loc}" != "${LOCATION}" ]; then
        i=$((i + 1)); continue
      fi
      j=0
      while [ "${j}" -lt "${count}" ]; do
        if [ "${ROUTING}" = "local" ]; then
          # this location's node-0 is the write target; other local nodes are read replicas
          if [ "${j}" -eq 0 ]; then role="primary"; else role="replica"; fi
        else
          # single-writer: only location[0] node-0 is the write target
          if [ "${i}" -eq 0 ] && [ "${j}" -eq 0 ]; then role="primary"; else role="replica"; fi
        fi
        entry=$(printf '        ["replica-%s.%s.%s.%s.cpln.local", 5432, "%s"],' \
          "${j}" "${PGEDGE_WORKLOAD}" "${loc}" "${CPLN_GVC}" "${role}")
        SERVERS="${SERVERS}${entry}
    "
        NODE_TOTAL=$((NODE_TOTAL + 1))
        j=$((j + 1))
      done
      i=$((i + 1))
    done

    # pgcat's primary_reads_enabled defaults to false, so with read/write
    # splitting on it sends every plain SELECT to a `replica` entry. A
    # single-node cluster has none -- the only server is the primary -- so every
    # read fails with `AllServersDown` while writes succeed. values.yaml offers
    # one replica in one location for dev/testing, so that shape has to work.
    # Only turn it on when there is genuinely nothing else to read from:
    # multi-node clusters keep sending reads away from the write target.
    if [ "${NODE_TOTAL}" -le 1 ]; then PRIMARY_READS=true; else PRIMARY_READS=false; fi
{{- end }}

    echo "[pgcat] servers: (${NODE_TOTAL} node(s), primary_reads_enabled=${PRIMARY_READS})"
    printf '%s' "${SERVERS}"

    cat > /tmp/pgcat.toml <<EOF
    [general]
    host = "0.0.0.0"
    port = 5432
    admin_username = "pgcat_admin"
    admin_password = "${PGCAT_ADMIN_PASSWORD}"
    log_level = "info"

    [pools.${PG_DATABASE}]
    pool_mode = {{ .Values.pgcat.poolMode | quote }}
    default_pool_size = {{ .Values.pgcat.defaultPoolSize }}
    query_parser_enabled = true
    query_parser_read_write_splitting = {{ if .Values.proxy.enabled }}false{{ else }}true{{ end }}
    primary_reads_enabled = ${PRIMARY_READS}

        [pools.${PG_DATABASE}.users.0]
        username = "${PG_USERNAME}"
        password = "${PG_PASSWORD}"
        pool_size = {{ .Values.pgcat.defaultPoolSize }}

        [pools.${PG_DATABASE}.shards.0]
        database = "${PG_DATABASE}"
        servers = [
    ${SERVERS}    ]
    EOF

    exec /usr/bin/pgcat /tmp/pgcat.toml
