---
kind: secret
name: {{ include "pgedge.secretProxyStartup.name" . }}
description: HAProxy startup script for the pgEdge per-location failover tier
tags: {{- include "pgedge.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env sh
    set -eu

    # ── Per-location HAProxy in front of the pgEdge nodes ──────────────────────
    # pgEdge is multi-master: every node is writable, there is no leader and no
    # promotion. This proxy's only job is "prefer the local node, fall back to a
    # remote node when the local ones are unhealthy". So it pins the LOCAL
    # location's node-0 as the single ACTIVE server (all local client traffic
    # lands on one node — read-your-writes locally, the deliberate trade for not
    # spreading local reads), with the other local nodes and then the remote
    # nodes as ordered `backup` servers. HAProxy (no `allbackups`) uses the FIRST
    # healthy backup, so failover order is: local node-1, local node-2, …, then
    # the remote locations in `locations` order.

    LOCATION="$(basename "${CPLN_LOCATION:-}")"
    if [ -z "${LOCATION}" ]; then
      echo "ERROR: CPLN_LOCATION is empty; cannot derive location"
      exit 1
    fi
    # From the runtime built-in, never Helm: this chart does not name a GVC, so a
    # render-time name could only drift from where the workload actually runs.
    GVC="${CPLN_GVC:-}"
    if [ -z "${GVC}" ]; then
      echo "ERROR: CPLN_GVC is empty; cannot derive member hostnames"
      exit 1
    fi
    WORKLOAD="${PGEDGE_WORKLOAD}"
    if [ -z "${PG_CHECK_USER:-}" ]; then
      echo "ERROR: PG_CHECK_USER is empty; cannot health-check the nodes"
      exit 1
    fi

    # The cluster roster comes from the SAME PGEDGE_* env the pgEdge nodes
    # build their lists from, so the backend list can never disagree with
    # the mesh. POSIX sh — no arrays.
    ACTIVE=""          # this location's node-0
    LOCAL_BACKUP=""    # this location's other nodes (preferred fallback)
    REMOTE_BACKUP=""   # every remote location's nodes, in `locations` order

    i=0
    for LOC in ${PGEDGE_LOCATIONS}; do
      COUNT="$(echo "${PGEDGE_REPLICAS}" | cut -d' ' -f$((i + 1)))"
      J=0
      while [ "${J}" -lt "${COUNT}" ]; do
        HOST="replica-${J}.${WORKLOAD}.${LOC}.${GVC}.cpln.local"
        NAME="$(echo "${LOC}_${J}" | tr '.-' '__')"
        if [ "${LOC}" = "${LOCATION}" ]; then
          if [ "${J}" -eq 0 ]; then
            ACTIVE="${ACTIVE}
      server ${NAME} ${HOST}:5432 check"
          else
            LOCAL_BACKUP="${LOCAL_BACKUP}
      server ${NAME} ${HOST}:5432 check backup"
          fi
        else
          REMOTE_BACKUP="${REMOTE_BACKUP}
      server ${NAME} ${HOST}:5432 check backup"
        fi
        J=$((J + 1))
      done
      i=$((i + 1))
    done

    SERVERS="${ACTIVE}${LOCAL_BACKUP}${REMOTE_BACKUP}"
    echo "HAProxy pgEdge proxy in ${LOCATION}"
    echo "Backends (active=local node-0, then local-backup, then remote-backup):${SERVERS}"

    # ── Startup: runtime DNS, not a hard gate ─────────────────────────────────
    # The mesh DNS never returns NXDOMAIN: a name that is not registered yet gets
    # a placeholder address. HAProxy is therefore configured with a `resolvers`
    # section and re-resolves every server every 10 s, so an early wrong answer
    # heals itself and a node that comes up later is picked up without a restart.
    # That makes a blocking gate unnecessary -- and harmful: 2.2.0 waited for EVERY
    # node in EVERY location, so restarting this proxy while another location was
    # down kept the location that was still healthy offline. Now it waits briefly
    # for this location's node-0 only (so a fresh install's first connections
    # land locally), then starts regardless.
    # The probe sends a Postgres SSLRequest and needs the one-byte S/N reply only a
    # live backend produces (the sidecar completes a bare TCP connect for anything).
    probe_pg() {
      perl -e '
        use IO::Socket::INET;
        my ($host) = @ARGV;
        my $s = IO::Socket::INET->new(
          PeerAddr => $host, PeerPort => 5432, Proto => "tcp", Timeout => 3,
        ) or exit 1;
        # SSLRequest: length=8, code=80877103
        $s->send("\x00\x00\x00\x08\x04\xd2\x16\x2f") or exit 1;
        my $b = "";
        eval {
          local $SIG{ALRM} = sub { die "read timeout\n" };
          alarm 3;
          $s->recv($b, 1);
          alarm 0;
        };
        exit((defined $b && ($b eq "S" || $b eq "N")) ? 0 : 1);
      ' "$1" 2>/dev/null
    }

    LOCAL0="replica-0.${WORKLOAD}.${LOCATION}.${GVC}.cpln.local"
    WAIT_LIMIT=60
    WAIT_START="$(date +%s)"
    until probe_pg "${LOCAL0}"; do
      if [ $(( $(date +%s) - WAIT_START )) -ge "${WAIT_LIMIT}" ]; then
        echo "pgedge proxy: ${LOCAL0} not answering after ${WAIT_LIMIT}s -- starting anyway; health checks and runtime DNS route to whichever node is up"
        break
      fi
      sleep 3
    done

    CFG="/tmp/haproxy.cfg"
    cat > "${CFG}" <<EOF
    global
      log stdout format raw local0
      maxconn 4096
      stats socket /tmp/haproxy.sock mode 660 level admin

    defaults
      mode tcp
      log global
      option tcplog
      timeout connect 5s
      # Idle-session ceiling for long-lived (session-mode) clients. Dead nodes are
      # handled by health checks + on-marked-down shutdown-sessions, not by this.
      # Explicit keepalive timers (the kernel default idle is 2 h) close a session
      # whose peer vanished within ~1 min, so a dead pooler cannot hold node slots.
      timeout client  1h
      timeout server  1h
      option clitcpka
      option srvtcpka
      clitcpka-idle 30s
      clitcpka-intvl 10s
      clitcpka-cnt 3
      srvtcpka-idle 30s
      srvtcpka-intvl 10s
      srvtcpka-cnt 3
      timeout check   5s

    resolvers mesh
      parse-resolv-conf
      resolve_retries 3
      timeout resolve 1s
      timeout retry   1s
      hold valid    10s
      hold other    10s
      hold refused  10s
      hold nx       10s
      hold timeout  10s
      hold obsolete 30s

    frontend postgres_in
      bind *:5432
      default_backend pgedge_local_preferred

    frontend stats_page
      bind *:8405
      mode http
      stats enable
      stats uri /stats
      stats refresh 10s

    frontend health_status
      bind *:8404
      mode http
      monitor-uri /healthz
      acl no_healthy_backends nbsrv(pgedge_local_preferred) lt 1
      monitor fail if no_healthy_backends

    backend pgedge_local_preferred
      mode tcp
      option pgsql-check user ${PG_CHECK_USER}
      default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions resolvers mesh resolve-prefer ipv4 init-addr last,libc,none${SERVERS}
    EOF

    echo "Rendered HAProxy config:"
    cat "${CFG}"

    haproxy -c -f "${CFG}"
    exec haproxy -W -db -f "${CFG}"
