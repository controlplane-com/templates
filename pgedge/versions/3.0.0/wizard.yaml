# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: pgEdge
# The chart lists its locations and runs nothing in the GVC's other locations (defaultOptions scale 0).
gvc:
  minLocations: 1

steps:
  - id: nodes
    title: Nodes
    description: Where the pgEdge nodes run, how many run in each location, and their image and compute.
    docs: "#locations-and-replicas"
    sections:
      - fields:
          - type: note
            when: context.mode == 'upgrade'
            text: >-
              An upgrade restarts the pgEdge nodes one at a time within each location, and HAProxy
              carries the traffic. With a single node in a location, plan a write interruption of about
              a minute there.
          - type: note
            when: >-
              context.gvcLocations != null && self.locations.exists(l, l.name != '') &&
              context.gvcLocations.exists(g, !(g in self.locations.map(l, l.name)))
            text: GVC locations that are not listed here run nothing.
            textExpression: >-
              'GVC locations not listed here run nothing: ' +
              context.gvcLocations.filter(g, !(g in self.locations.map(l, l.name))).join(', ') + '.'
          - path: locations
            type: list
            label: Locations
            required: true
            minItems: 1
            uniqueBy: [name]
            widget: table
            newItem: { name: "", replicas: 3 }
            itemLabel: "item.replicas == null ? item.name : item.name + ' × ' + string(item.replicas)"
            description: >-
              One entry per location, with the number of pgEdge nodes it runs. The optional backup job
              runs only in the first location.
            help: >-
              Use 1 node per location for development and testing, and 3 in production, to survive a
              node loss within a location. Nodes added to a cluster that already holds data start
              without its tables and rows, so settle the locations and node counts before you load
              data.
            item:
              type: object
              fields:
                - path: name
                  type: ref
                  label: Location
                  required: true
                  ref: { kind: location, scope: gvc, format: name, mustExist: error }
                - path: replicas
                  type: integer
                  label: Nodes
                  required: true
                  min: 1
                  suggestions:
                    - { value: 1, label: "1 (development)" }
                    - { value: 2, label: "2" }
                    - { value: 3, label: "3 (production)" }
              rules:
                - rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
                  paths: [name]
                  message: >-
                    This location is not on the target GVC. The nodes refuse to initialize while a
                    listed location is missing: add it to the GVC or remove it here.
                - rule: item.replicas == null || item.replicas != 1
                  severity: info
                  paths: [replicas]
                  message: >-
                    With 1 node here, an upgrade stops this location's writes for about a minute, and a
                    node failure moves its traffic to another location. Use 3 nodes per location in
                    production.
          - path: multiZone
            type: boolean
            label: Spread replicas across zones
            description: Applies to the pgEdge nodes, PgBouncer and HAProxy in every listed location.
      - title: Image and resources
        docs: "#image-and-resources"
        fields:
          - path: image
            type: string
            format: image
            label: pgEdge image
            required: true
            rules:
              - rule: imageMajor(self.image) < 0 || imageMajor(self.image) == 17
                message: >-
                  The node start script runs PostgreSQL from `/usr/pgsql-17/bin`, so the image must be a
                  PostgreSQL 17 pgEdge image.
          - path: resources
            type: resources
            label: Resources per node
            required: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
    rules:
      - rule: size(self.locations) > 0
        mirrors: pgedge.validateLocations
        paths: [locations]
        message: List at least one location.
      - rule: self.locations.all(l, l.replicas == null || l.replicas >= 1)
        mirrors: pgedge.validateReplicas
        paths: [locations]
        message: Every location needs at least 1 node; to stop running in a location, remove it.
      - rule: isUnique(self.locations.filter(l, l.name != null && l.name != '').map(l, l.name))
        mirrors: pgedge.validateUniqueLocations
        paths: [locations]
        message: >-
          List each location once. A duplicate gives two nodes the same Spock node and subscription
          names.
      - rule: size(self.locations) != 1
        severity: info
        paths: [locations]
        message: >-
          With a single location, losing that location stops the database. Surviving a location loss needs
          at least 2 locations, with your application running in at least 2 of them.
      - rule: >-
          oldSelf == null || self.locations.all(l, l.name == null || l.name == '' || l.replicas == null ||
          oldSelf.locations.exists(o, o.name == l.name && o.replicas >= l.replicas))
        severity: info
        paths: [locations]
        message: >-
          New nodes join without the cluster's existing tables and rows: the chart subscribes them
          without an initial copy, so they receive only later changes, and changes to tables they lack
          cannot be applied. Add nodes before you load data, or move to a new release and restore a
          backup there.

  - id: credentials
    title: Credentials
    description: The prerequisite secret with the database user, password and name.
    docs: "#prerequisites"
    fields:
      - type: note
        severity: warning
        text: >-
          The credentials secret must exist **before** you install. If it is missing, the deployment
          waits and `cpln logs` shows nothing at all.
      - path: postgres.credentialsSecretName
        type: ref
        label: Database credentials secret
        required: true
        description: >-
          A dictionary secret with the keys `username`, `password` and `database`. Secret names are
          org-wide, so give each release its own.
        help: >-
          The nodes create this user and database when they first initialize, and keep the password in
          their Spock replication settings. PgBouncer, HAProxy and the optional backup job read the
          secret too. Use a user name, password and database name without spaces, quotes or
          backslashes, since the nodes, PgBouncer and HAProxy write them unquoted into their connection
          settings, and a database name of letters, digits, `_`, `.` or `-` (PgBouncer serves every
          database for any other name). Do not name the database `pgbouncer`: PgBouncer reserves that
          name for its admin console and refuses to start.
        docs: "#credentials"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [username, password, database]
          create:
            suggestName: "context.releaseName + '-pgedge-credentials'"
    rules:
      - rule: "!has(self.postgres.username) && !has(self.postgres.password) && !has(self.postgres.database)"
        mirrors: pgedge.validateCredentials
        paths: [postgres.credentialsSecretName]
        message: >-
          `postgres.username`, `postgres.password` and `postgres.database` were removed in 1.1.0. Put them
          in the dictionary secret and remove them from the values.
      - rule: oldSelf == null || self.postgres.credentialsSecretName == oldSelf.postgres.credentialsSecretName
        severity: info
        paths: [postgres.credentialsSecretName]
        message: >-
          The cluster keeps the user, password and database it was initialized with. Point at another
          secret only if it holds the same values: the pgEdge nodes, PgBouncer and the optional backup job
          log in with it, and HAProxy's health check uses its username.

  - id: storage
    title: Storage
    description: The volume of each pgEdge node, its snapshots and its growth.
    docs: "#volume-set"
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity per node
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            docs: "/reference/volumeset#capacity-and-billing"
      - id: snapshots
        title: Volume snapshots
        description: >-
          Snapshots of every node's volume. A final snapshot is taken when the volume set is deleted,
          with or without a schedule.
        docs: "/reference/volumeset#snapshots"
        fields:
          - path: volumeset.snapshots.schedule
            type: string
            format: cron
            label: Snapshot schedule (UTC)
            description: Leave it empty to turn scheduled snapshots off.
            pattern: '^\s*[0-5]?[0-9] +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+\s*$'
            patternMessage: >-
              Use 5 fields with a single fixed minute, such as `0 3 * * *`; macros such as `@daily` are not
              accepted. Snapshots cannot run more often than hourly.
          - path: volumeset.snapshots.retentionDuration
            type: string
            label: Keep snapshots for
            required: true
            placeholder: 7d
            pattern: '^\d+(\.\d+)?[dhm]$'
            patternMessage: Use a number followed by d, h or m, such as 7d or 12h.
        rules:
          - rule: >-
              self.volumeset.snapshots.schedule != null &&
              (self.volumeset.snapshots.schedule == '' ||
              self.volumeset.snapshots.schedule.trim().matches('^[0-5]?[0-9] +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+$'))
            mirrors: pgedge.validateSnapshots
            paths: [volumeset.snapshots.schedule]
            message: >-
              Snapshots run at most hourly: use a 5-field schedule with a single fixed minute, or an
              empty string ("") to turn them off.
      - id: autoscaling
        title: Grow storage automatically
        toggle: volumeset.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: A volume set cannot shrink. Keep the capacity at or above the installed size.

  - id: network
    title: Network and pooling
    description: >-
      Who can connect, the PgBouncer pooler that applications use, and the HAProxy failover tier behind
      it.
    sections:
      - id: access
        title: Network access
        docs: "#internal-access"
        fields:
          - path: internal_access.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Applies to the pgEdge nodes, PgBouncer and HAProxy. Nothing in this template is public.
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below, plus this release's own workloads.
          - path: internal_access.workloads
            type: list
            label: Allowed workloads
            description: >-
              Your client workloads, for example from another GVC. This release's own workloads always
              have access, so list only clients.
            when: self.internal_access.type in ['same-gvc', 'workload-list']
            widget: tags
            unique: true
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internal_access.type == 'same-gvc'
        rules:
          - when: self.internal_access.type == 'same-gvc' && context.gvc != null
            rule: "!self.internal_access.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
            severity: info
            paths: [internal_access.workloads]
            messageExpression: >-
              'Same GVC already allows every workload in this GVC: ' +
              self.internal_access.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
              ' can be removed from the list.'
            message: >-
              Same GVC already allows every workload in this GVC, so those entries can be removed from the
              list.
          - when: self.internal_access.type == 'workload-list'
            rule: size(self.internal_access.workloads) > 0
            severity: warning
            paths: [internal_access.workloads]
            message: With "Specific workloads" and an empty list, no client can connect.
      - id: pgbouncer
        title: PgBouncer connection pooler
        description: >-
          The endpoint applications connect to, on port 5432. It runs in every listed location and pools
          connections to that location's HAProxy.
        docs: "#pgbouncer-connection-pooler"
        fields:
          - type: note
            text: Applications connect to `RELEASE_NAME-pgbouncer.GVC_NAME.cpln.local:5432`.
            textExpression: >-
              context.gvc == null ? 'Applications connect to `' + context.releaseName +
              '-pgbouncer.GVC_NAME.cpln.local:5432`.' : 'Applications connect to `' + context.releaseName +
              '-pgbouncer.' + context.gvc + '.cpln.local:5432`.'
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '3.0.0') < 0
            text: >-
              3.0.0 replaces the pgcat workload with PgBouncer, and the client endpoint changes from
              `RELEASE_NAME-pgcat` to `RELEASE_NAME-pgbouncer` (port 5432 unchanged). After the upgrade,
              point applications at `RELEASE_NAME-pgbouncer.GVC_NAME.cpln.local:5432`. On a 2.2.0 release
              with the failover tier on, you can shorten the gap by pointing them at the HAProxy endpoint
              `RELEASE_NAME-pgedge-proxy.GVC_NAME.cpln.local:5432` first; it is unpooled, so stay well
              under about 97 connections per node.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '3.0.0') < 0
            text: >-
              `pgcat.routing: single-writer` has no equivalent in 3.0.0: every location writes to its own
              node, and concurrent writes to one row from different locations resolve last-update-wins. If
              your application needs one write target, route each entity's writes to one location.
          - path: pgbouncer.poolMode
            type: enum
            label: Pool mode
            widget: segmented
            required: true
            help: >-
              **Transaction** holds a server connection for one transaction: best for most web and API
              workloads. Protocol-level prepared statements work; session-level `SET`, advisory locks
              and `LISTEN` do not, and a temporary table works only within a single transaction.
              **Session** holds it for the whole client session: compatible with every PostgreSQL
              feature, with less reuse; a session idle for more than 1 hour is closed by the failover
              tier. **Statement** returns it after every statement and rejects multi-statement
              transactions.
            options:
              - { value: session, label: Session }
              - { value: transaction, label: Transaction }
              - { value: statement, label: Statement }
          # max: the chart's integer checks (_helpers.tpl:198-203) refuse 1000000 and above, which Helm
          # renders as 1e+06.
          - path: pgbouncer.defaultPoolSize
            type: integer
            label: Server connections per replica
            min: 1
            max: 999999
            required: true
            description: Real PostgreSQL connections each PgBouncer replica opens to its location's node.
            suggestions:
              - { value: 10, label: "10" }
              - { value: 15, label: "15" }
              - { value: 20, label: "20 (default)" }
          - path: pgbouncer.maxClientConn
            type: integer
            label: Client connections per replica
            min: 1
            max: 999999
            required: true
            suggestions: [100, 500, 1000, 5000]
          - path: pgbouncer.minReplicas
            type: integer
            label: Minimum PgBouncer replicas per location
            min: 1
            max: 999999
            required: true
            suggestions: [1, 2, 3, 4]
          - path: pgbouncer.maxReplicas
            type: integer
            label: Maximum PgBouncer replicas per location
            min: 1
            max: 999999
            required: true
            suggestions: [1, 2, 3, 4]
            description: PgBouncer scales between the minimum and the maximum on requests per second.
          - path: pgbouncer.image
            type: string
            format: image
            label: PgBouncer image
            required: true
            advanced: true
          - path: pgbouncer.resources
            type: resources
            label: PgBouncer resources
            required: true
            advanced: true
            description: PgBouncer is single-threaded; add replicas rather than cores.
        rules:
          - rule: self.pgbouncer.minReplicas <= self.pgbouncer.maxReplicas
            mirrors: pgedge.validatePgbouncer
            paths: [pgbouncer.minReplicas]
            message: The minimum PgBouncer replicas must not be greater than the maximum.
          - rule: "!has(self.pgbouncer.routing)"
            mirrors: pgedge.validatePgbouncer
            paths: [pgbouncer.poolMode]
            message: >-
              `pgbouncer.routing` does not exist in 3.0.0: PgBouncer cannot split reads from writes, and
              every location writes to its own node through HAProxy. Remove it from the values.
          - rule: "!self.pgbouncer.image.contains('pgcat')"
            mirrors: pgedge.validatePgbouncer
            paths: [pgbouncer.image]
            message: >-
              This is a pgcat image. PgBouncer replaced pgcat in 3.0.0; use a PgBouncer image such as the
              chart's default.
          - rule: self.pgbouncer.minReplicas >= 2
            severity: info
            paths: [pgbouncer.minReplicas]
            message: >-
              With 1 PgBouncer replica, a replica failure drops every connection of its location until
              it is replaced. 2 replicas per location (the default) keep the endpoint up.
          # README: Connection budget. Each node accepts 300 connections (max_connections=300 in the node start script).
          - rule: self.pgbouncer.defaultPoolSize * self.pgbouncer.maxReplicas <= 290
            severity: warning
            paths: [pgbouncer.defaultPoolSize, pgbouncer.maxReplicas]
            messageExpression: >-
              'The PgBouncer replicas of one location can open up to ' +
              string(self.pgbouncer.defaultPoolSize * self.pgbouncer.maxReplicas) +
              ' connections to its node, which accepts 300. Keep server connections per replica times maximum replicas under about 290.'
            message: >-
              The PgBouncer replicas of one location can open more connections than its node accepts
              (300). Keep server connections per replica times maximum replicas under about 290.
          - when: >-
              self.pgbouncer.defaultPoolSize != null && self.pgbouncer.maxReplicas != null &&
              self.pgbouncer.defaultPoolSize * self.pgbouncer.maxReplicas <= 290
            rule: self.pgbouncer.defaultPoolSize * self.pgbouncer.maxReplicas * size(self.locations) <= 290
            severity: info
            paths: [pgbouncer.defaultPoolSize, pgbouncer.maxReplicas]
            messageExpression: >-
              'After a failover one node can carry the pools of every location: up to ' +
              string(self.pgbouncer.defaultPoolSize * self.pgbouncer.maxReplicas * size(self.locations)) +
              ' connections for ' + string(size(self.locations)) + ' locations. Keep server connections per replica times maximum replicas times locations under about 290 of the 300 a node accepts.'
            message: >-
              After a failover one node can carry the pools of every location. Keep server connections
              per replica times maximum replicas times locations under about 290 of the 300 a node accepts.
      - id: proxy
        title: HAProxy failover tier
        description: >-
          Always on. Each location's HAProxy sends traffic to its own first node and fails over to the
          location's other nodes, then to the other locations in list order.
        docs: "#haproxy-failover-tier"
        fields:
          - type: note
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '3.0.0') < 0
            text: >-
              3.0.0 makes the failover tier permanent: a release that ran without it (before 2.2.0, or
              with `proxy.enabled: false`) gains it with this upgrade. The pgEdge nodes and their data are
              kept.
          - path: proxy.minReplicas
            type: integer
            label: Minimum HAProxy replicas per location
            min: 1
            required: true
            suggestions: [1, 2, 3]
          - path: proxy.maxReplicas
            type: integer
            label: Maximum HAProxy replicas per location
            min: 1
            required: true
            suggestions: [1, 2, 3]
            description: HAProxy scales between the minimum and the maximum on requests per second.
          - path: proxy.image
            type: string
            format: image
            label: HAProxy image
            required: true
            advanced: true
            description: A Debian-based HAProxy image; the startup check needs `perl`.
          - path: proxy.resources
            type: resources
            label: HAProxy resources
            required: true
            advanced: true
        rules:
          - rule: self.proxy.minReplicas <= self.proxy.maxReplicas
            mirrors: pgedge.validatePgbouncer
            paths: [proxy.minReplicas]
            message: The minimum HAProxy replicas must not be greater than the maximum.
          # The chart refuses only proxy.enabled: false, but CEL cannot read a key the values no longer
          # declare; the README's upgrade steps say to delete proxy.enabled whatever its value.
          - rule: "!has(self.proxy.enabled)"
            mirrors: pgedge.validateNoProxyToggle
            paths: [proxy.minReplicas]
            message: >-
              `proxy.enabled` was removed in 3.0.0: the HAProxy failover tier is always on, and the chart
              refuses `proxy.enabled: false`. Remove `proxy.enabled` from the values.
          - rule: self.proxy.minReplicas >= 2
            severity: info
            paths: [proxy.minReplicas]
            message: >-
              With 1 HAProxy replica, a replica failure interrupts its location's traffic until it is
              replaced. 2 replicas per location (the default) keep it serving.

  - id: backup
    title: Backups
    description: Scheduled database dumps to S3 or GCS, and the job that restores them.
    docs: "#backing-up"
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        description: >-
          A cron job dumps your database with `pg_dump` to S3 or GCS on a schedule, and restores a backup
          into every node on demand. Roles and large objects are not included. It runs only in the first
          listed location, so backups pause while that location is down.
        docs: "#backup"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '3.0.0') < 0
            text: >-
              Backups change format in 3.0.0 (one database, `pg_dump` custom format, `.dump`), and the
              restore reads only the new format. Run a backup right after upgrading:
              `cpln workload cron start RELEASE_NAME-pgedge-backup --gvc GVC_NAME --location FIRST_LOCATION`.
            textExpression: >-
              'Backups change format in 3.0.0 (one database, `pg_dump` custom format, `.dump`), and the restore reads only the new format. Run a backup right after upgrading: `cpln workload cron start ' +
              context.releaseName + '-pgedge-backup --gvc ' + (context.gvc == null ? 'GVC_NAME' : context.gvc) +
              ' --location ' + (size(self.locations) == 0 || self.locations[0].name == null || self.locations[0].name == '' ? 'FIRST_LOCATION' : self.locations[0].name) + '`.'
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: backup.schedule
            type: string
            format: cron
            label: Backup schedule (UTC)
            required: true
          # max: the chart's check (_helpers.tpl:81) refuses 1000000 and above, which Helm renders as 1e+06.
          - path: backup.activeDeadlineSeconds
            type: integer
            label: Stop a backup run after
            unit: seconds
            min: 1
            max: 999999
            required: true
            advanced: true
            description: >-
              A backup or restore still running after this long is stopped. Raise it for a large database.
            suggestions:
              - { value: 3600, label: "3600 (1 hour)" }
              - { value: 21600, label: "21600 (6 hours, default)" }
              - { value: 43200, label: "43200 (12 hours)" }
              - { value: 86400, label: "86400 (24 hours)" }
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
        rules:
          # values.yaml: 128Mi measured OOM-killing the GCS upload.
          - when: self.backup.provider == 'gcp'
            rule: memoryBytes(self.backup.resources.memory) > memoryBytes('128Mi')
            severity: warning
            paths: [backup.resources.memory]
            message: >-
              128Mi of memory or less was measured OOM-killing the GCS upload. Give the backup job more
              memory.
          - rule: self.backup.provider in ['aws', 'gcp']
            mirrors: pgedge.validateBackupConfig
            paths: [backup.provider]
            message: Choose AWS S3 or Google Cloud Storage as the backup destination.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        docs: "#aws-s3-prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              Create the bucket and the AWS IAM policy in your AWS account **before** you install, and
              have an AWS cloud account in Control Plane.
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits, dots or dashes, starting and ending with a letter or
              digit.
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              Allow `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject`, `s3:ListBucket`,
              `s3:GetObjectVersion`, `s3:DeleteObjectVersion`, `s3:GetBucketLocation`,
              `s3:AbortMultipartUpload`, `s3:ListBucketMultipartUploads` and `s3:ListMultipartUploadParts`
              on the bucket and its objects. Since 1.1.1 the backup identity no longer carries
              `aws::ReadOnlyAccess`, so a policy that relied on it for reads needs the full list.
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            required: true
            pattern: '^(?!/).*$'
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        docs: "#gcs-prerequisites"
        fields:
          - type: note
            severity: warning
            text: >-
              Create the bucket **before** you install, and have a GCP cloud account in Control Plane whose
              service account has the Storage Admin role.
          # identity.yaml interpolates the bucket unquoted: a value with " #" is cut short there.
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
            patternMessage: >-
              Use lowercase letters, digits, dots, dashes or underscores, starting and ending with a letter
              or digit.
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage
              Admin role. Control Plane uses it to give the backup job `roles/storage.objectAdmin` on this
              one bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            required: true
            pattern: '^(?!/).*$'
            patternMessage: Leave out the leading /.

rules:
  - rule: context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '2.0.0') >= 0
    message: >-
      Do not upgrade a 1.x release in place: 1.x created its own GVC, and the upgrade deletes that GVC
      with every workload, volume set and identity in it, including your data. Back up the old cluster
      with `pg_dump -Fc --no-owner --no-privileges --no-large-objects --exclude-extension=spock
      --exclude-schema=spock` (the flags the chart's own backup uses; the restore job reads only that
      format) into your backup bucket, install this version as a new release with another name in an
      existing GVC with backups on, restore the file with `RESTORE_FILE`, then uninstall the old release
      against the GVC you originally installed it into.
  - rule: "!has(self.gvc)"
    mirrors: pgedge.validateNoLegacyGvc
    message: >-
      The `gvc` key was removed in 2.0.0: the chart deploys into the GVC you install into, and
      `gvc.locations` moved to `locations`. Remove `gvc` from the values.
  - rule: "!has(self.pgcat)"
    mirrors: pgedge.validateNoPgcat
    message: >-
      The `pgcat` key was removed in 3.0.0, when PgBouncer replaced pgcat. Move `poolMode`,
      `defaultPoolSize`, `minReplicas`, `maxReplicas` and `resources` under `pgbouncer`, and remove
      `pgcat` from the values.

migrations:
  - { fromVersions: "<3.0.0", from: pgcat.poolMode, to: pgbouncer.poolMode }
  - { fromVersions: "<3.0.0", from: pgcat.defaultPoolSize, to: pgbouncer.defaultPoolSize }
  - { fromVersions: "<3.0.0", from: pgcat.minReplicas, to: pgbouncer.minReplicas }
  - { fromVersions: "<3.0.0", from: pgcat.maxReplicas, to: pgbouncer.maxReplicas }
  - { fromVersions: "<3.0.0", from: pgcat.resources.cpu, to: pgbouncer.resources.cpu }
  - { fromVersions: "<3.0.0", from: pgcat.resources.memory, to: pgbouncer.resources.memory }
  - fromVersions: "<3.0.0"
    from: pgcat.image
    note: >-
      PgBouncer replaced pgcat in 3.0.0 and runs the chart's pinned PgBouncer image (PgBouncer image,
      under Network and pooling).
  - fromVersions: "<3.0.0"
    from: pgcat.routing
    note: >-
      PgBouncer cannot split reads from writes, so `single-writer` has no equivalent; every location now
      writes to its own node through HAProxy, as 2.2.0 did by default.
  - fromVersions: "<3.0.0"
    from: proxy.enabled
    note: >-
      The HAProxy failover tier is always on from 3.0.0; a release that ran without it gains it with
      this upgrade.
