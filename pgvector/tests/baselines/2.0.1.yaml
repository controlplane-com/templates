# pgvector 2.0.1 — the recommended install: credentials in a prerequisite secret. PostgreSQL 19.
# Prod shape for this template (one instance on a volumeset, one location) at its default size.
locations: [aws-us-east-1]
timeoutSeconds: 600

generated:
  pgpw: hex

secrets:
  creds:
    type: dictionary
    entries:
      username: e2e
      password: "{gen.pgpw}"
      database: e2e

vars:
  pg_workload: "{release}-pgvector"
  pg_user: e2e
  pg_password: "{gen.pgpw}"
  pg_db: e2e

values:
  config:
    credentialsSecretName: "{secrets.creds.name}"

# Every 1.x release runs PostgreSQL 18, so a plain upgrade to 2.0.0 (default PostgreSQL 19) must be
# refused by the boot guard with the data untouched; the upgrade pinned to -pg18 then recovers it.
# 1.0.0 is the oldest version; it installs its own default image (pgvector 0.8.6 on PostgreSQL 18).
upgradeFrom:
  - version: 2.0.0
  - version: 1.0.3
    refused: {timeoutSeconds: 420}
    then: {set: {image: "pgvector/pgvector:0.8.7-pg18"}}
  - version: 1.0.0
    refused: {timeoutSeconds: 420}
    then: {set: {image: "pgvector/pgvector:0.8.7-pg18"}}
