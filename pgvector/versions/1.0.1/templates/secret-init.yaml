{{- include "pgvector.validate" . -}}
{{- /*
Mounted at /docker-entrypoint-initdb.d/00-pgvector.sql and executed by the
Postgres entrypoint ONLY when PGDATA is empty — i.e. on the very first boot.
The entrypoint runs *.sql with `--dbname "$POSTGRES_DB"`, so the statements land
in the user's database without the chart ever needing to know its name (that
name lives in a cpln:// secret reference Helm cannot resolve at render time).
`vector` is emitted unconditionally so the knob below cannot break the premise.
*/ -}}
kind: secret
name: {{ include "pgvector.secret.init.name" . }}
description: pgvector first-boot SQL
tags: {{- include "pgvector.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    CREATE EXTENSION IF NOT EXISTS vector;
    {{- range .Values.config.extraExtensions }}
    CREATE EXTENSION IF NOT EXISTS {{ . }};
    {{- end }}
