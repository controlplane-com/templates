# plane 2.0.0 default install: bundled PostgreSQL 19, Redis, RabbitMQ and object store, one replica of each Plane tier,
# private (no public endpoint). Every credential is a prerequisite secret CI creates; generated values
# are hex, so they are URL-safe for the connection URLs.
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  adminpw: hex                 # the god-mode admin the checks claim the instance with

secrets:
  app:
    type: dictionary
    keys: [SECRET_KEY, LIVE_SERVER_SECRET_KEY]
  db:
    type: dictionary
    keys: [password]
    entries: {username: plane, database: plane}
  redis:
    type: dictionary
    keys: [password]
  mq:
    type: dictionary
    keys: [password]
    entries: {username: plane}
  minio:
    type: dictionary
    keys: [accessKey, secretKey]

vars:
  admin_password: "{gen.adminpw}"

values:
  location: aws-us-east-1
  secrets:
    name: "{secrets.app.name}"
  postgres:
    config:
      credentialsSecretName: "{secrets.db.name}"
  redis:
    credentialsSecretName: "{secrets.redis.name}"
  rabbitmq:
    credentialsSecretName: "{secrets.mq.name}"
  storage:
    minio:
      credentialsSecretName: "{secrets.minio.name}"

# 2.0.0 runs the bundled PostgreSQL on 19, so a plain upgrade of a 1.0.0 release (data on PostgreSQL 16) must
# be REFUSED by the postgres boot guard with the data untouched; the upgrade pinned to postgres:16, as the
# guard says, then succeeds and the work item and attachment written on 1.0.0 survive.
upgradeFrom:
  - version: 1.0.0
    refused: {timeoutSeconds: 420}
    then: {set: {postgres: {image: "postgres:16"}}}
