{{- include "plane.validate" . -}}
{{- /*
  apps/admin/nginx/nginx.conf as shipped in makeplane/plane-admin:v1.4.2, copied
  VERBATIM except for one line: `listen 3000;` -> `listen 3002;`.

  Verified at build time by diffing this payload against
  `docker run --rm --entrypoint sh makeplane/plane-admin:v1.4.2 -c 'cat
  /etc/nginx/nginx.conf'` — the diff is exactly that one line. Re-run that diff
  when bumping plane.imageTag.

  Why a whole config file rather than an env var: four of this workload's six
  containers listen on 3000 and nginx has no PORT variable. space and live take
  PORT; admin needs its listen directive replaced. This is the `nginx` template's
  own pattern (mount the whole nginx.conf from an opaque secret).

  A cpln:// secret FILE mount lands world-readable (-rwxr--r-- root root), so
  nginx reads it without any securityOptions.filesystemGroupId — that is only
  needed for a volumeset, which mounts root-owned and unwritable.
*/}}
kind: secret
name: {{ include "plane.secret.adminNginx.name" . }}
description: Plane admin (god-mode) nginx config
tags: {{- include "plane.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    worker_processes 4;

    events {
      worker_connections 1024;
    }

    http {
      include mime.types;

      default_type  application/octet-stream;

      set_real_ip_from        0.0.0.0/0;
      real_ip_recursive       on;
      real_ip_header          X-Forwarded-For;
      limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

      access_log /dev/stdout;
      error_log /dev/stderr;

      server {
        listen 3002;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
          root   /usr/share/nginx/html;
          index  index.html index.htm;
          try_files $uri $uri/ /god-mode/index.html;
        }
      }
    }
