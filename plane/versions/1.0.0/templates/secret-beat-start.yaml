{{- include "plane.validate" . -}}
{{- /*
  The beat workload's startup: GVC boot check -> `migrate` -> upstream's own
  beat entrypoint.

  WHY MIGRATIONS LIVE HERE. Upstream ships a one-shot `migrator` service, and
  nothing else runs `migrate` — while `api` and `worker` both call
  `wait_for_migrations`, which loops FOREVER with no timeout. So something must
  migrate or the whole install hangs with no error anywhere. A `standard`
  workload cannot host a one-shot job (it completes, restarts, and reports
  `ready: false` permanently), and a `cron` workload would not run at install
  time — the first migration would wait for the next schedule tick. Beat is
  already pinned to exactly one replica for correctness (two schedulers double
  every periodic task), which is precisely the property a migration runner
  needs: no concurrent `migrate`, ever. And `migrate` is idempotent — upstream
  re-runs it on every migrator start — so a beat restart re-running it is safe.

  The coupling is real: if beat cannot start, nothing migrates and the API waits
  forever at "waiting for migrations". That is in the README and the briefing.

  Invoked as `bash <path>` because a secret-mounted file is not executable.

  NOTE ON INDENTATION: the two embedded python heredocs sit at the block-scalar
  indent so that, once YAML strips it, their bodies start at column 0. Indenting
  them one level further would be an IndentationError at runtime and would be
  invisible to `helm template`.
*/}}
kind: secret
name: {{ include "plane.secret.beatStart.name" . }}
description: Plane beat startup (GVC check, migrations, scheduler)
tags: {{- include "plane.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -uo pipefail

    cd /code

    CONFIGURED_LOCATION="{{ .Values.location }}"
    LOCATION="$(basename "${CPLN_LOCATION:-unknown}")"
    GVC="${CPLN_GVC:-}"
    {{ include "plane.deriveWebUrl" (dict "root" . "self" (include "plane.beat.name" .)) | nindent 4 }}

    # Upstream's own wait — everything below needs the database.
    python manage.py wait_for_db

    # "Fresh" is decided by a value the ENGINE writes, never by directory
    # emptiness: the count of rows in django_migrations. Zero applied => this is
    # a brand-new install and a topology mistake is FATAL; one or more applied
    # => WARN and continue, so this check can never be the reason a live Plane
    # stops scheduling.
    APPLIED_MIGRATIONS="$(python - <<'PYEOF'
    import os
    os.environ.setdefault("DJANGO_SETTINGS_MODULE", "plane.settings.production")
    import django
    django.setup()
    from django.db import connections, DEFAULT_DB_ALIAS
    from django.db.migrations.recorder import MigrationRecorder
    try:
        recorder = MigrationRecorder(connections[DEFAULT_DB_ALIAS])
        # has_table() is the distinction that matters. Querying the count
        # directly RAISES on a brand-new database (django_migrations does not
        # exist yet), which would land in the except branch and report the
        # install as "initialised" — inverting the guard on exactly the install
        # it exists to protect. Measured: it printed 1 on an empty database.
        print(recorder.migration_qs.count() if recorder.has_table() else 0)
    except Exception:
        # A genuine failure (cannot reach the database, unexpected error) is
        # UNKNOWN => treat as initialised, i.e. warn rather than refuse.
        print(1)
    PYEOF
    )"
    case "${APPLIED_MIGRATIONS}" in
      ''|*[!0-9]*) APPLIED_MIGRATIONS=1 ;;
    esac
    if [ "${APPLIED_MIGRATIONS}" -gt 0 ]; then HAS_DATA=true; else HAS_DATA=false; fi

    refuse_or_warn() {
      if [ "${HAS_DATA}" = "true" ]; then
        echo "[plane] WARNING: $*" >&2
        return 0
      fi
      echo "[plane] FATAL: $*" >&2
      exit 1
    }

    # --- Guard: never run outside the one configured location ---
    # defaultOptions.minScale/maxScale are 0 on every workload in this release,
    # so the platform should never place a replica anywhere else. This is the
    # last line of defence if it does.
    if [ "${LOCATION}" != "${CONFIGURED_LOCATION}" ]; then
      refuse_or_warn "this replica is running in location '${LOCATION}', but the release is configured for '${CONFIGURED_LOCATION}'. Redis, RabbitMQ and MinIO are each one volume bound to one replica in '${CONFIGURED_LOCATION}', so this replica cannot see any of them. Set 'location' in your values to the location you want."
    fi

    # --- GVC reconciliation: the direction the platform does NOT validate ---
    # A localOptions entry naming a location the GVC LACKS is accepted, stored,
    # and simply inert: the release runs NOTHING, anywhere, with no failed
    # deployment to observe. Helm cannot see a live GVC at render time, so ask
    # the GVC itself.
    #
    # KNOW WHAT THIS CAN AND CANNOT CATCH (measured 2026-08-31). It CANNOT catch
    # a wrong `location` on a FRESH INSTALL. Catching that would require beat to
    # be running, and beat is pinned to the same missing location, so it is
    # placed nowhere and logs zero lines — the branch is unreachable in exactly
    # the case it reads as if it covers. The README documents the real
    # diagnostic for that case (the `maxScale is set to 0` deployment message)
    # instead of promising this check.
    #
    # What it DOES catch is the drift direction: a GVC reshaped under a release
    # that is already running, where beat is alive to observe it. It also emits
    # the informational "the GVC also has locations this release does not use"
    # line, which is the branch that fires on a healthy install. Both are worth
    # keeping; neither is a substitute for reading the deployment message.
    #
    # Python's `requests`, not curl: the backend image is python:3.12.10-alpine
    # and has NO curl (verified against this tag), and $CPLN_ENDPOINT sits
    # behind istio-envoy, which answers HTTP/1.0 with `426 Upgrade Required` —
    # a trap that makes every attempt silently take the fail-open branch.
    # `requests` speaks HTTP/1.1.
    #
    # Bounded with timeout=(connect, read). A connect-only bound leaves an
    # accept-then-never-respond server unbounded, so both arms are set. Worst
    # case is 3 x 6 + 2 x 2 = 22s.
    GVC_LOCS="$(python - <<'PYEOF'
    import os, sys, time
    try:
        import requests
    except Exception:
        sys.exit(0)
    endpoint = os.environ.get("CPLN_ENDPOINT") or "http://api.cpln.io"
    org = os.environ.get("CPLN_ORG", "")
    gvc = os.environ.get("CPLN_GVC", "")
    token = os.environ.get("CPLN_TOKEN", "")
    url = "%s/org/%s/gvc/%s" % (endpoint, org, gvc)
    for attempt in range(3):
        try:
            r = requests.get(url, headers={"Authorization": token}, timeout=(5, 6))
        except Exception as exc:
            sys.stderr.write("[plane] GVC read failed (attempt %d/3): %s\n" % (attempt + 1, exc))
        else:
            # ANY non-200 — including a 403 from a missing `view` grant — means
            # "unknown", never "the GVC lacks the location". A 403 body is valid,
            # non-empty JSON: parsing it and finding no locations would report a
            # topology error the user would then go and "fix".
            if r.status_code == 200:
                try:
                    links = r.json()["spec"]["staticPlacement"]["locationLinks"]
                    print(" ".join(l.rsplit("/", 1)[-1] for l in links))
                except Exception as exc:
                    sys.stderr.write("[plane] could not parse the GVC location list: %s\n" % exc)
                sys.exit(0)
            sys.stderr.write("[plane] GVC read returned HTTP %d (attempt %d/3).\n" % (r.status_code, attempt + 1))
        if attempt < 2:
            time.sleep(2)
    PYEOF
    )"

    if [ -z "${GVC_LOCS}" ]; then
      echo "[plane] WARNING: could not read GVC '${GVC}' — skipping the GVC location check. If this persists, check that the identity has 'view' on the GVC via this chart's GVC policy." >&2
    else
      case " ${GVC_LOCS} " in
        *" ${CONFIGURED_LOCATION} "*)
          echo "[plane] GVC location check OK — '${GVC}' has '${CONFIGURED_LOCATION}'" ;;
        *)
          refuse_or_warn "location '${CONFIGURED_LOCATION}' is not a location of GVC '${GVC}' (it has: ${GVC_LOCS}). The platform accepts a localOptions entry for a location that does not exist without any error, so this release would run NOTHING, anywhere, with no failed deployment to observe. Add the location to the GVC, or set 'location' to one the GVC already has." ;;
      esac

      EXTRA=""
      for loc in ${GVC_LOCS}; do
        if [ "${loc}" != "${CONFIGURED_LOCATION}" ]; then EXTRA="${EXTRA}${loc} "; fi
      done
      if [ -n "${EXTRA}" ]; then
        echo "[plane] GVC '${GVC}' also has locations this release does not use: ${EXTRA% } — nothing Plane-related runs there."
      fi
    fi

    # --- Migrations: the reason api and worker can ever become ready ---
    set -e
    echo "[plane] applying database migrations (${APPLIED_MIGRATIONS} already applied)..."
    python manage.py migrate
    echo "[plane] migrations complete — starting the Celery scheduler."

    exec ./bin/docker-entrypoint-beat.sh
