{{- include "plane.validate" . -}}
{{- /*
  The routing table, adapted from apps/proxy/Caddyfile.ce @ v1.4.2.

  Every upstream is 127.0.0.1: web, space, admin, live and api are containers in
  THIS workload, sharing one network namespace, and none of them declares a
  port. That is the whole architecture, not an optimisation — Plane's frontends
  are built at IMAGE BUILD TIME with relative base URLs (VITE_API_BASE_URL="",
  VITE_LIVE_BASE_PATH="/live", VITE_ADMIN_BASE_PATH="/god-mode",
  VITE_SPACE_BASE_PATH="/spaces"), so all six services must answer on ONE
  origin. Splitting them into separate workloads breaks at runtime in a way that
  looks like a routing bug.

  Four upstream services listen on 3000. Inside one namespace that collides, so
  space and live are moved with their own PORT env var and admin with a mounted
  nginx.conf (nginx has no PORT). Ports and paths below were each confirmed to
  return 200 on loopback against the pinned images.

  MinIO is the one genuinely separate workload the proxy talks to: the API signs
  presigned asset URLs against the PUBLIC host, so the browser fetches
  https://{public}/{bucket}/... and Caddy forwards it. Caddy passes the Host
  header through unchanged, which is what makes the SigV4 signature validate.

  `auto_https off`: the platform terminates TLS at the edge and this server only
  ever listens on :80. `admin off`: Caddy's admin API would otherwise bind
  localhost:2019 inside a namespace shared with five other containers.
*/}}
kind: secret
name: {{ include "plane.secret.caddyfile.name" . }}
description: Plane proxy Caddyfile
tags: {{- include "plane.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    {
    	admin off
    	auto_https off
    	servers {
    		max_header_size 25MB
    		client_ip_headers X-Forwarded-For X-Real-IP
    		trusted_proxies static 0.0.0.0/0
    	}
    }

    :80 {
    	request_body {
    		max_size {{ .Values.plane.fileSizeLimit | int64 }}
    	}

    	redir /spaces /spaces/ permanent
    	reverse_proxy /spaces/* 127.0.0.1:3001

    	redir /god-mode /god-mode/ permanent
    	reverse_proxy /god-mode/* 127.0.0.1:3002

    	reverse_proxy /live/* 127.0.0.1:3003

    	reverse_proxy /api/* 127.0.0.1:8000
    	reverse_proxy /auth/* 127.0.0.1:8000
    	reverse_proxy /static/* 127.0.0.1:8000
    {{- if eq .Values.storage.type "minio" }}

    	reverse_proxy /{{ include "plane.bucket" . }}/* {{ include "plane.minio.host" . }}:9000
    	reverse_proxy /{{ include "plane.bucket" . }} {{ include "plane.minio.host" . }}:9000
    {{- end }}

    	reverse_proxy /* 127.0.0.1:3000
    }
