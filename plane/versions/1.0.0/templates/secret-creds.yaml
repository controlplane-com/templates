{{- include "plane.validate" . -}}
{{- /*
  Bundled-component credentials, read ONLY by containers in this release and
  unreachable from outside the GVC. No human ever types any of these into a
  client, which is the bundled-plumbing exception: they stay values with
  `change-me-…` defaults rather than becoming prerequisite secrets.

  Every one of them is consumed as a `cpln://` ENV VAR (or, for Redis, a
  container arg) — never interpolated into a string at render time. The URLs
  that need them are assembled with $(VAR) so the platform resolves the
  reference first; a `cpln://` written INTO a URL stays literal text.
*/}}
kind: secret
name: {{ include "plane.secret.creds.name" . }}
description: Plane bundled-component credentials
tags: {{- include "plane.tags" . | nindent 4 }}
type: dictionary
data:
  postgresUsername: {{ .Values.postgres.credentials.username | quote }}
  postgresPassword: {{ .Values.postgres.credentials.password | quote }}
  redisPassword: {{ .Values.redis.password | quote }}
  mqUsername: {{ .Values.rabbitmq.username | quote }}
  mqPassword: {{ .Values.rabbitmq.password | quote }}
{{- if eq .Values.storage.type "minio" }}
  minioAccessKey: {{ .Values.storage.minio.credentials.accessKey | quote }}
  minioSecretKey: {{ .Values.storage.minio.credentials.secretKey | quote }}
{{- end }}
