{{- include "plane.validate" . -}}
{{- /*
  Credentials for the BUNDLED database, in the shape the postgres subchart reads:
  exactly the keys username, password and database. postgres 3.4.0 stopped
  creating this secret and now takes only its NAME, which is why the chart on
  this side of the dependency owns it.

  SEPARATE from {release}-plane-creds on purpose. The subchart's policy grants
  its identity `reveal` on the WHOLE secret it is handed; the app's creds secret
  also carries the Redis, RabbitMQ and MinIO credentials, so handing that one
  over would give the Postgres identity all of them. The two database values are
  therefore rendered into both secrets, read by different identities.
*/}}
kind: secret
name: {{ include "plane.secret.db.name" . }}
description: Plane bundled PostgreSQL credentials
tags: {{- include "plane.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
