{{- include "plane.validate" . -}}
{{- /*
  A RabbitMQ conf.d drop-in, mounted at /etc/rabbitmq/conf.d/90-plane.conf so
  the image's own 10-defaults.conf still loads. It holds no credential (those
  arrive as RABBITMQ_DEFAULT_* env vars from the prerequisite secret).

  WHY THE PERMIT. Celery's remote-control mailbox (worker startup `mingle`,
  `inspect`, broadcast replies) declares non-durable, non-exclusive queues.
  RabbitMQ 4.x DENIES the deprecated `transient_nonexcl_queues` feature by
  default, so without this line the worker connects, fails its first
  queue.declare with `541 INTERNAL_ERROR - Feature transient_nonexcl_queues is
  deprecated`, and restarts its consumer forever: every task queues and nothing
  runs, while the workload looks healthy. Reproduced and fixed locally against
  rabbitmq:4.3.7 with makeplane/plane-backend:v1.4.3 (the worker reached
  `mingle: all alone` and wrote the issue-activity rows). The permit is the
  setting RabbitMQ's own error message names.
*/}}
kind: secret
name: {{ include "plane.secret.mqConf.name" . }}
description: Plane RabbitMQ configuration
tags: {{- include "plane.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    deprecated_features.permit.transient_nonexcl_queues = true
