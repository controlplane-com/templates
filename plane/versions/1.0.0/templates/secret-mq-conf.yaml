{{- include "plane.validate" . -}}
{{- /*
  This payload is mounted as a FILE. A `cpln://secret/...` reference is only
  resolved by the platform when it injects an ENV VAR — inside a mounted file it
  stays literal text. So no credential appears here: the default user, password
  and vhost arrive as RABBITMQ_DEFAULT_USER / _PASS / _VHOST env vars, which
  RabbitMQ 3.9+ reads natively (confirmed against rabbitmq:3.13.6-management-
  alpine: `rabbitmq-diagnostics list_vhosts` showed the configured vhost and
  `rabbitmqctl list_users` the configured user). This is also the `rabbitmq`
  template's own approach.

  `loopback_users = none` is deliberately NOT set: the default user must be able
  to authenticate from the Plane workloads, which are not loopback, and
  RabbitMQ's built-in `guest` loopback restriction does not apply to a
  differently-named user.
*/}}
kind: secret
name: {{ include "plane.secret.mqConf.name" . }}
description: Plane RabbitMQ configuration
tags: {{- include "plane.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    listeners.tcp.default = 5672
