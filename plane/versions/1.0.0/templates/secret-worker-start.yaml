{{- include "plane.validate" . -}}
{{- /*
  The Celery worker's startup: derive the app's PUBLIC URL, then hand off to
  upstream's own worker entrypoint.

  The worker sends the mail and builds the links: invites, notifications,
  webhook payloads. `CPLN_GLOBAL_ENDPOINT` is PER-WORKLOAD, so using it raw here
  would advertise the WORKER's own endpoint — which has no inbound at all. That
  is the chatwoot/twenty dead-mailer-link bug, and it is silent: mail sends, the
  link 404s for the recipient. See the deriveWebUrl helper for why the URL is
  rewritten rather than assembled.

  Invoked as `bash <path>` because a secret-mounted file is not executable.
*/}}
kind: secret
name: {{ include "plane.secret.workerStart.name" . }}
description: Plane worker startup (public-URL derivation)
tags: {{- include "plane.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    cd /code
    {{ include "plane.deriveWebUrl" (dict "root" . "self" (include "plane.worker.name" .)) | nindent 4 }}

    echo "[plane] worker advertising WEB_URL=${WEB_URL}"

    # The two waits upstream's docker-entrypoint-worker.sh performs, then celery
    # invoked HERE rather than by that script — the one thing it does not let us
    # set is the pool width.
    #
    # WHY THAT MATTERS. Upstream runs `celery -A plane worker -l info` with no
    # --concurrency, and Celery then sizes its prefork pool from the HOST's CPU
    # count, NOT from this container's `cpu` limit. On this platform that
    # started 16 Django children and OOM-killed this workload 65 times in 5.5
    # hours on the memory budget the chart used to ship. Nothing
    # said why: an OOM kill logs nothing inside the container, and this tier has
    # no probe, so the UI kept reporting success while every notification,
    # activity feed, invite mail, export, import and webhook silently never ran.
    # Celery also takes worker_concurrency only from Django settings (see
    # plane/celery.py: config_from_object(..., namespace="CELERY")), so there is
    # no environment variable to set — the flag is the only lever.
    python manage.py wait_for_db
    python manage.py wait_for_migrations

    echo "[plane] starting celery worker with --concurrency {{ int .Values.worker.concurrency }}"
    exec celery -A plane worker -l info --concurrency {{ int .Values.worker.concurrency }}
