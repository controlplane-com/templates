{{- include "plane.validate" . -}}
kind: volumeset
name: {{ include "plane.redis.volumeset.name" . }}
description: Plane Redis volume set
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "plane.tags" . | nindent 4 }}
spec:
  fileSystemType: ext4
  initialCapacity: {{ .Values.redis.volumeset.capacity }}
  performanceClass: general-purpose-ssd
