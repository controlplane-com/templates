{{- include "plane.validate" . -}}
{{- /*
  The Celery worker — notifications, activity feeds, exports, imports, invites.

  Not optional and not merged into the api tier: without it those tasks silently
  never happen while the UI reports success. Scaling it is `worker.replicas`;
  Celery distributes tasks across workers through the RabbitMQ queue with no
  peer discovery.

  NO PROBES, deliberately. Celery has no cheap health endpoint, and `celery
  inspect ping` is a broker round-trip slow and flaky enough to cause false
  restarts. This tier is supervised by exit status — which means `ready: true`
  here says "the process is running", NOT "it is consuming". If activity feeds
  or invite emails stop, read the logs rather than trusting the status.
*/}}
kind: workload
name: {{ include "plane.worker.name" . }}
description: Plane Celery worker — notifications, exports, imports, invites
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "plane.tags" . | nindent 4 }}
spec:
  type: standard
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "plane.identity.name" . }}
  containers:
    - name: worker
      image: makeplane/plane-backend:{{ .Values.plane.imageTag }}
      # Wrapper, not the image entrypoint (plane.script.worker): it derives the
      # APP workload's public URL and pins the Celery pool width. Inline, so no
      # secret or reveal grant is needed for it.
      command: /bin/bash
      args:
        - "-c"
        - {{- include "plane.inlineScript" (include "plane.script.worker" .) | nindent 10 }}
      inheritEnv: false
      minCpu: {{ .Values.worker.resources.minCpu | quote }}
      cpu: {{ .Values.worker.resources.maxCpu | quote }}
      minMemory: {{ .Values.worker.resources.minMemory | quote }}
      memory: {{ .Values.worker.resources.maxMemory | quote }}
      env:
        {{- include "plane.backendEnv" . | nindent 8 }}
  defaultOptions:
    {{- include "plane.defaultOptions" (dict "timeout" 300) | nindent 4 }}
  localOptions:
    {{- include "plane.localOptions" (dict "root" . "replicas" (int .Values.worker.replicas) "timeout" 300) | nindent 4 }}
  rolloutOptions:
    {{- /*
      maxUnavailableReplicas is RETAINED on a `standard` workload (the API drops
      it only on stateful ones). 25% of 1 replica rounds down to 0 unavailable
      and the surge up to 1, so a single replica is replaced before it stops.
      terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    maxSurgeReplicas: 25%
    maxUnavailableReplicas: 25%
    minReadySeconds: 0
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  firewallConfig:
    external:
      {{- include "plane.externalFirewall" (dict "root" . "public" false) | nindent 6 }}
    internal:
      {{- include "plane.internalFirewall" . | nindent 6 }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
