# ─── Location ─────────────────────────────────────────────────────────────────
# This chart deploys into the GVC you install into — it does NOT create one.
# Plane runs in exactly ONE location, and this names it. It MUST already be a
# location of that GVC; the beat workload reads the GVC at boot and refuses a
# FRESH install if it is not (see Important Notes in the README).
# Every workload this chart OWNS is pinned here. The bundled `postgres` SUBCHART
# is NOT — a parent cannot template a subchart's placement — so an extra GVC
# location starts a second Postgres there, with its own empty volume. Prefer a
# single-location GVC.
#
# One location is not a simplification. Redis, RabbitMQ and MinIO are each a
# single volume bound to a single replica; a second location would get its own
# empty copy of all three and a Plane that cannot see the first.
location: aws-us-east-1

# ─── Plane ────────────────────────────────────────────────────────────────────
plane:
  # ONE tag for all six Plane images — they are released together and mixing
  # versions across the API, frontends and live server is unsupported upstream.
  # Repositories: makeplane/plane-proxy, -frontend, -space, -admin, -live, -backend
  imageTag: v1.4.2

  # Replicas of the whole HTTP tier (proxy + web + space + admin + live + api).
  # 1 is the default; >=2 gives a rolling restart with no downtime. `live`
  # coordinates across replicas through Redis, so no sticky sessions are needed.
  replicas: 1

  # Public base URL used in notification emails, webhook payloads and CORS.
  # Empty = derive from the platform canonical endpoint (correct in almost all
  # cases). A custom domain MUST carry the scheme — the chart refuses to render
  # without one, since this value is also a CORS *and* CSRF trusted origin.
  appUrl: ""

  # Max upload size in bytes — enforced by BOTH the proxy and the API (5 MiB).
  fileSizeLimit: 5242880

  api:
    gunicornWorkers: 1  # gunicorn worker processes; each is ~1 extra CPU and ~300Mi

  resources:
    proxy:                 # Caddy — the single public entry point
      minCpu: 50m
      maxCpu: 200m
      minMemory: 64Mi
      maxMemory: 256Mi
    ui:                    # applied to EACH of web, space and admin
      minCpu: 50m
      maxCpu: 250m
      minMemory: 96Mi
      maxMemory: 384Mi
    live:                  # Hocuspocus collaborative-editing server
      minCpu: 100m
      maxCpu: 500m
      minMemory: 192Mi
      maxMemory: 512Mi
    api:                   # Django + gunicorn — the heavy tier
      minCpu: 250m
      maxCpu: 1000m
      minMemory: 512Mi
      maxMemory: 1536Mi

# ─── Background processing ────────────────────────────────────────────────────
worker:
  replicas: 1  # Celery workers; >=1. Scale up for heavy imports/exports
  resources:
    minCpu: 200m
    maxCpu: 1000m
    minMemory: 384Mi
    maxMemory: 1Gi

# The Celery scheduler. ALWAYS exactly one replica — two schedulers run every
# periodic task twice — so there is deliberately no replicas knob. This workload
# ALSO applies the database migrations; if it cannot start, nothing migrates and
# the API waits forever at "waiting for migrations".
beat:
  resources:
    minCpu: 50m
    maxCpu: 250m
    minMemory: 192Mi
    maxMemory: 512Mi

# ─── Prerequisite secret (USER-CREATED — MUST EXIST BEFORE INSTALL) ───────────
# A `dictionary` secret holding exactly two keys:
#   SECRET_KEY             — Django signing key. It also ENCRYPTS your instance
#                            configuration (SMTP password, OAuth secrets), so it
#                            cannot be rotated without making those unreadable.
#   LIVE_SERVER_SECRET_KEY — required by the live collaborative-editing server;
#                            it refuses to start without one.
# Both: `openssl rand -hex 32`. If the secret does not exist at install time the
# deployment WEDGES silently and `cpln logs` returns nothing at all — see
# Prerequisites in the README for the exact command and the diagnostic.
secrets:
  name: my-plane-secrets

# ─── Attachment / asset storage ───────────────────────────────────────────────
storage:
  type: minio           # minio | s3
  minio:                # bundled single-node MinIO (default)
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    credentials:        # internal plumbing; never typed into a client
      accessKey: change-me-plane-minio-access
      secretKey: change-me-plane-minio-secret
    bucket: uploads
    resources:
      cpu: 500m
      memory: 512Mi
    volumeset:
      capacity: 10      # GiB (minimum 10); mounted at /export
  s3:                   # external S3 or S3-compatible (set storage.type: s3)
    bucket: my-plane-bucket
    region: us-east-1
    endpoint: ""        # set for S3-compatible servers, e.g. http://my-minio.GVC.cpln.local:9000
    # Keyless auth (AWS, preferred): a Control Plane cloud account plus your
    # pre-created bucket-scoped IAM policy (full JSON in the README). Used only
    # when auth.secretName is empty.
    cloudAccountName: my-s3-cloud-account
    policyName: my-plane-s3-policy
    auth:
      # OPTIONAL prerequisite `dictionary` secret holding AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY — ONLY for S3-compatible servers (requires
      # endpoint set). AWS S3 is always keyless. e.g. my-plane-s3-keys
      secretName: ""

# ─── PostgreSQL (subchart: postgres) — all Plane data ─────────────────────────
# Pinned to postgres:16 because Plane supports "PostgreSQL 15.7+ or 16.x" only.
# NOTE: the postgres template's scheduled-backup feature requires PG 17+, so it
# is NOT usable at a Plane-supported version and is not surfaced here. The README
# carries a verified pg_dump / pg_restore procedure instead.
postgres:
  image: postgres:16
  credentials:
    username: plane
    password: change-me-plane-db   # template-managed cred for the bundled DB
    database: plane
  config:
    # Name of the dictionary secret this chart CREATES and the bundled postgres
    # reads. Secret names are org-wide: give each plane release its own name. A
    # second release left on this name is REFUSED at install (it is owned by the
    # first) — nothing is shared, overwritten or deleted.
    credentialsSecretName: my-plane-db-credentials
  resources:
    minCpu: 250m
    maxCpu: 1000m
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10        # GiB (minimum 10)

# ─── Redis / Valkey — Django cache and live-editor cross-replica sync ─────────
# REQUIRED. The live server refuses to start without it. Single node with AOF
# persistence; Plane takes a single REDIS_URL and has no Sentinel support, so
# the HA redis template is not used.
redis:
  image: valkey/valkey:8.1.9
  password: change-me-plane-redis   # template-managed; wired into REDIS_URL
  resources:
    cpu: 250m
    memory: 512Mi
  volumeset:
    capacity: 10        # GiB (minimum 10); AOF at /data

# ─── RabbitMQ — the Celery broker ─────────────────────────────────────────────
# REQUIRED. Plane 1.x runs Celery over AMQP, not Redis; there is no Redis-broker
# code path. Tag matches the one upstream ships and tests.
rabbitmq:
  image: rabbitmq:3.13.6-management-alpine
  username: plane
  password: change-me-plane-mq      # template-managed; wired into AMQP_URL
  vhost: plane
  resources:
    cpu: 500m
    memory: 768Mi
  volumeset:
    capacity: 10        # GiB (minimum 10); mnesia at /var/lib/rabbitmq

# ─── Access ───────────────────────────────────────────────────────────────────
# Plane has NO admin bootstrap credential: the first visitor to /god-mode claims
# the instance. So it ships CLOSED to the internet. Reach it over a port-forward
# tunnel, create the admin at http://localhost:8080/god-mode/, then set this to
# true and `helm upgrade` — see "First run" in the README for the exact commands.
# A firewall change takes 30 s to ~10 min to propagate.
publicAccess:
  enabled: false

# Who may reach Plane's workloads from inside the org. Every workload THIS
# release creates is ALWAYS allowed, whatever is set here — the API, workers and
# scheduler have to reach the database, cache, broker and object store.
# NOTE: the bundled PostgreSQL has its own scope under postgres.internalAccess
# (default same-gvc) — see "Restricting internal access" in the README.
internalAccess:
  type: same-gvc        # options: same-gvc, same-org, workload-list
  workloads: []         # only with workload-list, e.g. - //gvc/GVC_NAME/workload/WORKLOAD_NAME
