kind: policy
name: {{ include "pocketbase.policy.name" . }}
description: PocketBase secret access
tags: {{- include "pocketbase.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "pocketbase.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ include "pocketbase.secret.credentials.name" . }}
