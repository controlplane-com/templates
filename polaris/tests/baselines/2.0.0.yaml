# polaris 2.0.0 — the default install: one Polaris replica, its bootstrap workload and the single-instance
# PostgreSQL 19 metastore, one location, all three prerequisite secrets created by CI. No object storage:
# catalogs are metadata until a table is written.
locations: [aws-us-east-1]
# Also the wait for the upgrade scenario's starting install, which runs 1.3.1's HA baseline (about 6 minutes).
timeoutSeconds: 1200

generated:
  pgpw: hex
  clientsecret: hex
  signingkey: hex

secrets:
  db:
    type: dictionary
    entries:
      username: polaris
      password: "{gen.pgpw}"
      database: polaris
  root:
    type: dictionary
    entries:
      CLIENT_ID: root
      CLIENT_SECRET: "{gen.clientsecret}"
  signing:
    type: opaque
    payload: "{gen.signingkey}"

vars:
  pg_user: polaris
  pg_password: "{gen.pgpw}"
  pg_db: polaris
  client_id: root
  client_secret: "{gen.clientsecret}"

values:
  rootCredentials:
    secretName: "{secrets.root.name}"
  tokenSigningKey:
    secretName: "{secrets.signing.name}"
  postgres:
    config:
      credentialsSecretName: "{secrets.db.name}"

# The highly available metastore (postgres-highly-available 3.0.0: three Patroni members, three etcd, two
# HAProxy replicas): a fresh HA install, where ha-is-18 proves the new cluster's major.
variants:
  - name: ha
    values:
      postgres:
        enabled: false
      postgresHA:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"

# 1.3.1 is the previous version. Its baseline runs the HA metastore, so this upgrade moves
# postgres-highly-available 2.5.0 → 3.0.0, whose existing cluster keeps PostgreSQL 17: a plain upgrade
# (ha-upgrade-keeps-17). A refused single-instance upgrade from 1.3.1 is not expressible: the starting
# install always uses 1.3.1's own (HA) baseline.
upgradeFrom:
  - version: 1.3.1
