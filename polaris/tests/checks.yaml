# Feature checks for the polaris template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars (pg_user,
# pg_password, pg_db, client_id, client_secret).
#
# Every check runs from the HA metastore's patroni-postgres container, which has curl, psql and python3,
# and calls Polaris at its internal address, as an in-GVC query engine would. Polaris keeps its realm,
# principals and catalogs in PostgreSQL, so a token and a catalog read back only pass when the server,
# the bootstrap and the metastore all worked.
# (Inside scripts, write $VAR rather than the braced form: the runner fills {name} placeholders.)
checks:
  - id: cluster-healthy
    description: Patroni reports exactly one leader and every other member streaming from it.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        leaders = [x["name"] for x in m if x["role"] == "leader"]
        streaming = [x["name"] for x in m if x["role"] in ("replica", "sync_standby")
                     and (x["state"] == "streaming" or (x["state"] == "running" and isinstance(x.get("lag"), int)))]
        print(f"MEMBERS {len(m)} LEADERS {len(leaders)} STREAMING {len(streaming)}")
        '
    expect:
      stdout: "^MEMBERS 3 LEADERS 1 STREAMING 2$"
    retries: 20
    retryDelaySeconds: 15

  - id: polaris-healthy
    description: Polaris reports itself up on its in-GVC health interface.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 10 http://{release}-polaris.{gvc}.cpln.local:8182/q/health
    expect:
      stdout: '"status":\s*"UP"'
    retries: 10
    retryDelaySeconds: 15

  - id: token-and-catalog
    description: >-
      The root principal gets a token with its client credentials, creates a catalog named after the
      running version, and reads it back through the management API.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        U=http://{release}-polaris.{gvc}.cpln.local:8181
        N="e2e_$(echo '{version}' | tr . _)"
        T=$(curl -s -m 15 --user '{client_id}:{client_secret}' -d grant_type=client_credentials \
          -d scope=PRINCIPAL_ROLE:ALL "$U/api/catalog/v1/oauth/tokens" |
          python3 -c 'import json, sys; print(json.load(sys.stdin).get("access_token", ""))' 2>/dev/null)
        [ -n "$T" ] && echo "TOKEN ok" || echo "TOKEN failed"
        # 201 on the first run of this version, 409 when the catalog already exists (a re-run or a no-op
        # upgrade). Creating a catalog only writes metadata, so the bucket and endpoint below never have to
        # exist; the storage settings are the S3-compatible shape the README documents.
        curl -s -m 15 -o /dev/null -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
          -d "{\"catalog\":{\"name\":\"$N\",\"type\":\"INTERNAL\",\"properties\":{\"default-base-location\":\"s3://e2e-bucket/$N\"},\"storageConfigInfo\":{\"storageType\":\"S3\",\"allowedLocations\":[\"s3://e2e-bucket/$N\"],\"endpoint\":\"http://e2e-s3.example.com:8333\",\"pathStyleAccess\":true,\"stsUnavailable\":true,\"region\":\"us-east-1\"}}}" \
          "$U/api/management/v1/catalogs"
        curl -s -m 15 -H "Authorization: Bearer $T" "$U/api/management/v1/catalogs/$N" |
          python3 -c 'import json, sys; print("CATALOG " + json.load(sys.stdin)["name"])' 2>&1
    expect:
      stdout: "^TOKEN ok$[\\s\\S]*^CATALOG e2e_"
    retries: 6
    retryDelaySeconds: 15

  - id: rejects-bad-secret
    description: A wrong client secret gets no token (the control for the check above).
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 15 -o /dev/null -D - --user '{client_id}:wrong-secret' -d grant_type=client_credentials \
          -d scope=PRINCIPAL_ROLE:ALL http://{release}-polaris.{gvc}.cpln.local:8181/api/catalog/v1/oauth/tokens |
          awk 'NR==1 {print "TOKEN " $2}'
    expect:
      stdout: "^TOKEN 40[01]$"

  - id: data-survives-upgrade
    description: >-
      The catalog created on the version this scenario installed first is still there. On a fresh install
      that is the same version; after an upgrade it proves the metastore carried over.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        U=http://{release}-polaris.{gvc}.cpln.local:8181
        N="e2e_$(echo '{installed_version}' | tr . _)"
        T=$(curl -s -m 15 --user '{client_id}:{client_secret}' -d grant_type=client_credentials \
          -d scope=PRINCIPAL_ROLE:ALL "$U/api/catalog/v1/oauth/tokens" |
          python3 -c 'import json, sys; print(json.load(sys.stdin).get("access_token", ""))' 2>/dev/null)
        code=$(curl -s -m 15 -o /dev/null -D - -H "Authorization: Bearer $T" "$U/api/management/v1/catalogs/$N" | awk 'NR==1 {print $2}')
        echo "GET $N $code"
    expect:
      stdout: "^GET e2e_\\S+ 200$"
    retries: 4
    retryDelaySeconds: 15

  - id: pgvector-0-8-7-available
    description: The HA leader runs patroni-postgres 0.8, with pgvector 0.8.7 (CVE-2026-103484), from 1.3.1.
    issue: "#5376"
    since: 1.3.1
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select 'AVAIL ' || default_version from pg_available_extensions where name = 'vector'" 2>&1
    expect:
      stdout: "^AVAIL 0\\.8\\.7$"
    # After the upgrade the members restart one at a time; this runs long enough to reach the new leader.
    # helm --wait returns while the Patroni members are still restarting, and the old leader restarts
    # last (~4 min in); 20 x 30 s covers the rollout.
    retries: 20
    retryDelaySeconds: 30
