{{- if .Values.postgres.enabled }}
{{- /*
  Credentials for the BUNDLED single-instance metastore. Internal plumbing: no human
  ever types this password — it exists only so Polaris and its admin tool can reach
  their own Postgres — so the bundled-plumbing exception applies and it stays a
  template-created secret rather than a prerequisite the user has to create. (The
  credentials that DO guard access to Polaris itself — rootCredentials.secretName and
  tokenSigningKey.secretName — remain user-created prerequisite secrets, unchanged.)
  postgres 3.4.0 stopped creating this secret and now only takes its NAME, which is
  why the chart on this side of the dependency owns it.

  The three keys are named exactly as the postgres subchart reads them: username,
  password, database. The HA path is untouched — postgres-highly-available still
  creates its own {release}-postgres-config secret carrying the same three keys.
*/}}
kind: secret
name: {{ include "polaris.secret.db.name" . }}
description: Polaris bundled PostgreSQL metastore credentials
tags: {{- include "polaris.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
{{- end }}
