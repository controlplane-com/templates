              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix>, so ' #' starts a comment that
          # silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.minio.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.minio.prefix == oldSelf.postgresHA.backup.minio.prefix) ||
              [self.postgresHA.backup.minio.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.minio.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
    rules:
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: polaris.validate
        paths: [postgresHA.enabled, postgres.enabled]
        message: Enable exactly one metastore, either the single-instance or the highly available PostgreSQL.
      - rule: >-
          !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
          dyn(self.postgresHA)['proxy']['enabled'] == true || dyn(self.postgresHA)['proxy']['enabled'] == null
        mirrors: polaris.validate
        paths: [postgresHA.enabled]
        message: >-
          postgresHA.proxy.enabled must remain true: the HAProxy leader endpoint is Polaris's database endpoint.
          Remove it from the values, or set it to true.
      # postgres-highly-available 2.5.0 fails the render on a leftover postgres block.
      - rule: "!self.postgresHA.enabled || !has(self.postgresHA.postgres)"
        paths: [postgres.credentials.username]
        message: >-
          postgresHA.postgres was removed in 1.2.0: move its username, password and database to the metastore
          credentials (postgres.credentials) and remove the block from the values.
      # postgres 3.4.1 fails the render on leftover config.username, password or database.
      - rule: >-
          !self.postgres.enabled || (!has(self.postgres.config.username) && !has(self.postgres.config.password) &&
          !has(self.postgres.config.database))
        paths: [postgres.credentials.username]
        message: >-
          postgres.config.username, password and database were removed in 1.1.0: move them to the metastore
          credentials (postgres.credentials) and remove them from postgres.config.
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        message: >-
          Switching the database on an installed release deletes the current one, with all of Polaris's data, and
          starts an empty one. Keep the current database, or install a new release with the other database and
          move the data.
  - id: bootstrap
    title: Bootstrap
    description: The one-time job that creates the realm schema and the root principal, then idles.
    docs: "#bootstrap"
    fields:
      - path: bootstrap.image
        type: string
        format: image
        label: Admin tool image
        required: true
        advanced: true
        help: Keep this tag in lockstep with the Polaris image.
      - path: bootstrap.resources
        type: resources
        label: Resources
        required: true
        advanced: true
        description: Always one replica.
        cpu: { min: 25m }
        memory: { min: 32Mi }
    rules:
      - rule: cpuMillicores(self.bootstrap.resources.maxCpu) <= 4 * cpuMillicores(self.bootstrap.resources.minCpu)
        mirrors: polaris.validate.resources
        paths: [bootstrap.resources]
        message: The maximum CPU can be at most 4 times the minimum. Raise the minimum or lower the maximum.
      - rule: "[self.bootstrap.resources.minMemory, self.bootstrap.resources.maxMemory].all(m, string(m).matches('^[0-9]+(Mi|Gi)$'))"
        mirrors: polaris.validate.resources
        paths: [bootstrap.resources]
        message: Give memory in Mi or Gi (for example 512Mi or 2Gi).

# Rules over the imported values: their issues show on the imported fields' step (postgres:network).
rules:
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Polaris, which connects to its metastore like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: >-
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-polaris') in self.postgres.internalAccess.workloads &&
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-polaris-bootstrap') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: >-
      'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-polaris and //gvc/' + context.gvc +
      '/workload/' + context.releaseName + '-polaris-bootstrap, or Polaris cannot reach its metastore.'
    message: Add the Polaris and bootstrap workloads to the list, or Polaris cannot reach its metastore.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Polaris connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Metastore backups.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Metastore backups.
  - fromVersions: "<1.2.0"
    from: postgresHA.postgres
    note: >-
      The HA metastore's username, password and database moved to the metastore credentials (postgres.credentials),
      from which Polaris creates the secret; a release on the HA database keeps the values it was initialized with.
  # The HA database read postgresHA.postgres.* before 1.2.0; from 1.2.0 both modes read postgres.credentials.*.
  # Carry the values of the mode the release runs, whatever they are, so the database keeps its login.
  - fromVersions: ">=1.1.0 <1.2.0"
    to: postgres.credentials.username
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.username : self.postgres.credentials.username"
  - fromVersions: ">=1.1.0 <1.2.0"
    to: postgres.credentials.password
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.password : self.postgres.credentials.password"
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: ">=1.1.0 <1.2.0"
    to: postgres.credentials.database
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.database : self.postgres.credentials.database"
  - fromVersions: "<1.1.0"
    from: postgres.config.username
    to: postgres.credentials.username
  - fromVersions: "<1.1.0"
    from: postgres.config.password
    to: postgres.credentials.password
  - fromVersions: "<1.1.0"
    from: postgres.config.database
    to: postgres.credentials.database
  - fromVersions: "<1.1.0"
    to: postgres.credentials.username
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.username : self.postgres.config.username"
  - fromVersions: "<1.1.0"
    to: postgres.credentials.password
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.password : self.postgres.config.password"
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: "<1.1.0"
    to: postgres.credentials.database
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.database : self.postgres.config.database"
  - fromVersions: "<1.1.0"
    from: postgres.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Metastore backups.
  - fromVersions: "<1.1.0"
    from: postgres.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Metastore backups.
