# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Apache Polaris

# Polaris itself is stateless, but both bundled metastores are single-location stateful workloads with no
# location handling: postgres brings this limit with its import, and postgres-highly-available (no
# descriptor of its own, so its keys are parent fields below) needs the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Metastore server }
      - { id: storage, title: Metastore storage }
      - { id: network, title: Metastore network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Metastore backups }
    exclude:
      # Chosen in the Metastore step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # Polaris connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          Polaris and its bootstrap workload connect to the metastore like any other workload: keep Same GVC,
          or add both under Allowed workloads.

steps:
  - id: polaris
    title: Polaris
    description: The Polaris server image, its replicas and compute, and its single realm.
    sections:
      - title: Server
        docs: "#server"
        fields:
          - path: image
            type: string
            format: image
            label: Polaris image
            required: true
            help: Keep the bootstrap image on the same tag.
          - path: replicas
            type: integer
            label: Replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              The server is stateless; every replica shares the metastore and the token signing key. Use 2 or
              more for rolling upgrades without downtime.
          - path: resources
            type: resources
            label: Resources
            required: true
            description: Per replica. The JVM heap is a percentage of the maximum memory.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: jvm.maxRAMPercentage
            type: integer
            label: Maximum heap
            unit: "%"
            required: true
            min: 40
            max: 80
            suggestions: [60, 70, 75]
            description: The maximum JVM heap, as a percentage of the maximum memory.
            docs: "#jvm"
        rules:
          - rule: cpuMillicores(self.resources.maxCpu) <= 4 * cpuMillicores(self.resources.minCpu)
            mirrors: polaris.validate.resources
            paths: [resources]
            message: The maximum CPU can be at most 4 times the minimum. Raise the minimum or lower the maximum.
          - rule: "[self.resources.minMemory, self.resources.maxMemory].all(m, string(m).matches('^[0-9]+(Mi|Gi)$'))"
            mirrors: polaris.validate.resources
            paths: [resources]
            message: Give memory in Mi or Gi (for example 512Mi or 2Gi).
          - rule: self.replicas >= 1 && self.jvm.maxRAMPercentage >= 40 && self.jvm.maxRAMPercentage <= 80
            mirrors: polaris.validate
            paths: [replicas, jvm.maxRAMPercentage]
            message: Set at least 1 replica and a maximum heap between 40 and 80 percent.
      - title: Realm
        docs: "#realm"
        fields:
          - path: realm
            type: string
            label: Realm
            required: true
            pattern: '^[A-Za-z0-9_-]+$'
            patternMessage: Use letters, digits, hyphens or underscores.
            description: >-
              The one realm this install serves. Requests without a `Polaris-Realm` header resolve to it, which
              is what Trino needs.
            help: >-
              Permanent after the first install: renaming it bootstraps a new, empty realm and hides the
              existing catalogs.
        rules:
          - when: oldSelf != null
            rule: self.realm == oldSelf.realm
            severity: warning
            paths: [realm]
            message: >-
              A new realm name bootstraps an empty realm and hides every existing catalog. Changing it back makes
              them visible again.

  - id: credentials
    title: Credentials
    description: The prerequisite secrets for the root principal and the token signing key.
    docs: "#credentials"
    fields:
      - type: note
        severity: warning
        text: >-
          Both secrets must exist **before** you install. If one is missing, the deployment waits and
          `cpln logs` shows nothing at all.
      - path: rootCredentials.secretName
        type: ref
        label: Root credentials secret
        required: true
        description: >-
          A dictionary secret with the keys `CLIENT_ID` and `CLIENT_SECRET`, neither containing a comma. Trino,
          Spark and other clients authenticate with them.
        help: >-
          Applied once, when the realm is first bootstrapped; changing them later has no effect. Rotate by
          creating a new principal through the management API.
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [CLIENT_ID, CLIENT_SECRET]
          create:
            suggestName: "context.releaseName + '-polaris-root-credentials'"
      - path: tokenSigningKey.secretName
        type: ref
        label: Token signing key secret
        required: true
        description: An opaque secret with plain encoding holding a random string of 32 or more characters.
        help: Every replica signs and validates access tokens with it. Changing it invalidates every outstanding token.
        ref:
          kind: secret
          format: name
          filter: { secretType: [opaque] }
          mustExist: error
          allowCreate: true
          create:
            suggestName: "context.releaseName + '-polaris-signing-key'"
    rules:
      - rule: self.rootCredentials.secretName != '' && self.tokenSigningKey.secretName != ''
        mirrors: polaris.validate
        paths: [rootCredentials.secretName, tokenSigningKey.secretName]
        message: The root credentials secret and the token signing key secret are required.

  - id: storage
    title: Object storage
    description: Credentials Polaris uses for its own table-metadata I/O in an S3 or S3-compatible bucket.
    docs: "#object-storage"
    fields:
      - path: storage.credentialsSecretName
        type: ref
        label: Object storage credentials secret
        description: >-
          Optional. A dictionary secret with the keys `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`. Leave
          empty to run without object storage; catalogs on S3 then cannot read or write.
        help: >-
          A seaweedfs credentials secret works as-is. Query engines keep their own copy of the keys: this
          template does not vend credentials.
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
          create:
            suggestName: "context.releaseName + '-polaris-s3-credentials'"
      - path: storage.region
        type: string
        label: Region
        required: true
        placeholder: us-east-1
        description: The bucket's AWS region. S3-compatible servers ignore it, but the SDK requires one.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Polaris inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The Iceberg REST and management APIs on the canonical endpoint. Health and metrics stay internal.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Query engines in the GVC connect internally. Firewall changes take 30 seconds to a few minutes.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: polaris.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: database
    title: Metastore
    description: Which PostgreSQL holds every catalog, and the prerequisite secret with its credentials.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Metastore
            widget: cards
            required: true
            init: "self.postgresHA.enabled && !self.postgres.enabled ? 'ha' : 'single'"
            options:
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica on a persistent volume; minutes of downtime on a node failure.
                set: { postgresHA.enabled: false, postgres.enabled: true }
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the metastore choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the metastore choice above.
          - type: note
            severity: warning
            text: >-
              The metastore credentials secret must exist **before** you install; if it is missing, the
              deployment waits and `cpln logs` shows nothing at all.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        docs: "#single-instance-metastore"
        description: >-
          One PostgreSQL replica. Its server, storage, network and backups follow in the next steps.
        fields:
          - path: postgres.config.credentialsSecretName
            type: ref
            label: Metastore credentials secret
            required: true
            description: >-
              A dictionary secret with the keys `username`, `password` and `database`; the database name must be
              URL-safe.
            help: >-
              PostgreSQL reads these values only when its data directory is first initialized, and Polaris
              connects with them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then
              update the secret and force a redeployment.
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-polaris-db-credentials'"
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        docs: "#highly-available-metastore"
        description: >-
          3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint that Polaris connects through.
        fields:
          - path: postgresHA.config.credentialsSecretName
            type: ref
            label: Metastore credentials secret
            required: true
            description: >-
              A dictionary secret with the keys `username`, `password` and `database`; the database name must be
              URL-safe.
            help: >-
              PostgreSQL reads these values only when its data is first initialized, and Polaris connects with
              them. To change the password later, change it in the database first, then update the secret and
              force a redeployment.
              In HA mode the order differs: move the leader to member -0 first (see the README's HA rotation steps).
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-polaris-db-credentials'"
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, and every catalog definition with them.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: ha-backup
        title: Metastore backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Object
              Admin role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgresHA.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'minio'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgresHA.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.minio.credentialsSecretName
            type: ref
            label: MinIO credentials secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
          - path: postgresHA.backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - rule: "!has(self.postgresHA.backup.minio.accessKey) && !has(self.postgresHA.backup.minio.secretKey)"
            paths: [postgresHA.backup.minio.credentialsSecretName]
            message: >-
              postgresHA.backup.minio.accessKey and secretKey were removed in 1.2.1. Put them in the MinIO
              credentials secret and remove them from the values.
    rules:
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: polaris.validate
        paths: [postgresHA.enabled, postgres.enabled]
        message: Enable exactly one metastore, either the single-instance or the highly available PostgreSQL.
      - rule: "!self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled)"
        mirrors: polaris.validate
        paths: [postgresHA.enabled]
        message: >-
          postgresHA.proxy.enabled must remain true: the HAProxy leader endpoint is Polaris's database endpoint.
          Remove it from the values.
      - rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != null &&
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != ''
        mirrors: polaris.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: The metastore credentials secret is required.
      - rule: "!has(self.postgres.credentials)"
        mirrors: polaris.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          postgres.credentials was removed in 1.3.0: the metastore credentials are now a prerequisite
          dictionary secret named by the credentials secret field. Remove postgres.credentials from the values.
      - rule: "!has(self.postgresHA.postgres)"
        paths: [postgresHA.config.credentialsSecretName]
        message: >-
          postgresHA.postgres was removed in 1.2.0: put its username, password and database in the metastore
          credentials secret and remove the block from the values.
      - rule: >-
          !has(self.postgres.config.username) && !has(self.postgres.config.password) &&
          !has(self.postgres.config.database)
        paths: [postgres.config.credentialsSecretName]
        message: >-
          postgres.config.username, password and database were removed in 1.1.0: put them in the metastore
          credentials secret and remove them from the values.
      # Upgrading from 1.2.1 or earlier, the chart-created secret is deleted by the upgrade itself, so the new
      # prerequisite secret must have a different name (holding the same username, password and database).
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.3.0') < 0
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) !=
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          The previous version created the metastore secret itself, and this upgrade deletes it. Create a secret
          under a NEW name holding the same username, password and database, and name it here.
      - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.3.0') >= 0)
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) ==
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        severity: info
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          PostgreSQL reads the credentials only when its data is first initialized; pointing at another secret
          does not change the existing user or password.

  - id: bootstrap
    title: Bootstrap
    description: The one-time job that creates the realm schema and the root principal, then idles.
    docs: "#bootstrap"
    fields:
      - path: bootstrap.image
        type: string
        format: image
        label: Admin tool image
        required: true
        advanced: true
        help: Keep this tag in lockstep with the Polaris image.
      - path: bootstrap.resources
        type: resources
        label: Resources
        required: true
        advanced: true
        description: Always one replica.
        cpu: { min: 25m }
        memory: { min: 32Mi }
    rules:
      - rule: cpuMillicores(self.bootstrap.resources.maxCpu) <= 4 * cpuMillicores(self.bootstrap.resources.minCpu)
        mirrors: polaris.validate.resources
        paths: [bootstrap.resources]
        message: The maximum CPU can be at most 4 times the minimum. Raise the minimum or lower the maximum.
      - rule: "[self.bootstrap.resources.minMemory, self.bootstrap.resources.maxMemory].all(m, string(m).matches('^[0-9]+(Mi|Gi)$'))"
        mirrors: polaris.validate.resources
        paths: [bootstrap.resources]
        message: Give memory in Mi or Gi (for example 512Mi or 2Gi).

# Rules over the imported values: their issues show on the imported fields' step (postgres:network).
rules:
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Polaris, which connects to its metastore like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: >-
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-polaris') in self.postgres.internalAccess.workloads &&
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-polaris-bootstrap') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: >-
      'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-polaris and //gvc/' + context.gvc +
      '/workload/' + context.releaseName + '-polaris-bootstrap, or Polaris cannot reach its metastore.'
    message: Add the Polaris and bootstrap workloads to the list, or Polaris cannot reach its metastore.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Polaris connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.3.0"
    from: postgres.credentials
    note: >-
      This setting served both database modes (single-instance and HA). The metastore credentials are now a
      prerequisite dictionary secret (username, password, database). Create it under a NEW name with the values the
      database was initialized with, and choose it under Metastore.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Metastore backups.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Metastore backups.
  - fromVersions: "<1.2.0"
    from: postgresHA.postgres
    note: >-
      Put the username, password and database the HA metastore was initialized with in the metastore
      credentials secret, and choose it under Metastore.
  - fromVersions: "<1.1.0"
    from: postgres.config.username
    note: Put it in the metastore credentials secret (key username); choose the secret under Metastore.
  - fromVersions: "<1.1.0"
    from: postgres.config.password
    note: Put it in the metastore credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.1.0"
    from: postgres.config.database
    note: Put it in the metastore credentials secret (key database); choose the secret under Metastore.
