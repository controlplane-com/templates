# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: PostGIS
# One stateful replica on its own volume: every GVC location would run an independent copy.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: credentials
    title: Credentials
    description: The database user, password and name PostGIS creates on first start.
    fields:
      - type: note
        severity: warning
        textExpression: >-
          'This version takes the database credentials as values: they are stored in the Helm release
          and in the secret `' +
          (context.releaseName == null || context.releaseName == '' ? 'RELEASE_NAME' : context.releaseName) +
          '-conf`, which the chart creates. 1.4.0 and later read them from a dictionary secret you create instead.'
        text: >-
          This version takes the database credentials as values: they are stored in the Helm release
          and in the secret `RELEASE_NAME-conf`, which the chart creates. 1.4.0 and later read them
          from a dictionary secret you create instead.
      - path: config.username
        type: string
        label: Username
        required: true
        immutable: PostgreSQL creates the user once, when the volume is first initialized.
        description: The user your applications connect as.
      - path: config.password
        type: string
        label: Password
        required: true
        sensitive: true
        widget: password
        example: true
        help: >-
          PostgreSQL reads the password only when the volume is first initialized. To change it later,
          run `ALTER ROLE ... PASSWORD` first and then set the same value here.
      - path: postgres.database
        type: string
        label: Database name
        required: true
        immutable: PostgreSQL creates the database once, when the volume is first initialized.
    rules:
      - when: oldSelf == null || self.config.username != oldSelf.config.username
        rule: >-
          !self.config.username.matches('^\\s') &&
          !self.config.username.matches('^[!&*%@`"\\[\\]{}|>,#]') &&
          !self.config.username.startsWith("'") &&
          !self.config.username.matches('^[-?](\\s|$)') &&
          !self.config.username.matches(':(\\s|$)') &&
          !self.config.username.matches('\\s#') &&
          !self.config.username.matches('\\s$') &&
          !(self.config.username in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
          !self.config.username.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
          !self.config.username.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
          !self.config.username.matches('^[-+]?\\.(inf|Inf|INF)$') &&
          !self.config.username.matches('^\\.(nan|NaN|NAN)$') &&
          !self.config.username.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') &&
          !self.config.username.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt]|\\s+)[0-9]{1,2}:[0-9]{2}:[0-9]{2}')
        severity: warning
        paths: [config.username]
        message: >-
          This version writes the user name into its secret unquoted, so some values break the install or are
          stored as a number, date, true/false or nothing. Do not start it with a space, a quote or a YAML
          symbol such as ! & * % @ ` [ ] { } | > , # (or with - or ? and a space), leave out ': ', ' #'
          and a trailing ':' or space, and do not use a plain number, a date, true, false or null. 1.2.0
          and later quote it.
      - when: oldSelf == null || self.config.password != oldSelf.config.password
        rule: >-
          !self.config.password.matches('^\\s') &&
          !self.config.password.matches('^[!&*%@`"\\[\\]{}|>,#]') &&
          !self.config.password.startsWith("'") &&
          !self.config.password.matches('^[-?](\\s|$)') &&
          !self.config.password.matches(':(\\s|$)') &&
          !self.config.password.matches('\\s#') &&
          !self.config.password.matches('\\s$') &&
          !(self.config.password in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
          !self.config.password.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
          !self.config.password.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
          !self.config.password.matches('^[-+]?\\.(inf|Inf|INF)$') &&
          !self.config.password.matches('^\\.(nan|NaN|NAN)$') &&
          !self.config.password.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') &&
          !self.config.password.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt]|\\s+)[0-9]{1,2}:[0-9]{2}:[0-9]{2}')
        severity: warning
        paths: [config.password]
        message: >-
          This version writes the password into its secret unquoted, so some values break the install or are
          stored as a number, date, true/false or nothing. Do not start it with a space, a quote or a YAML
          symbol such as ! & * % @ ` [ ] { } | > , # (or with - or ? and a space), leave out ': ', ' #'
          and a trailing ':' or space, and do not use a plain number, a date, true, false or null. 1.2.0
          and later quote it.
      - when: oldSelf == null || self.postgres.database != oldSelf.postgres.database
        rule: >-
          !self.postgres.database.matches('^\\s') &&
          !self.postgres.database.matches('^[!&*%@`"\\[\\]{}|>,#]') &&
          !self.postgres.database.startsWith("'") &&
          !self.postgres.database.matches('^[-?](\\s|$)') &&
          !self.postgres.database.matches(':(\\s|$)') &&
          !self.postgres.database.matches('\\s#') &&
          !self.postgres.database.matches('\\s$') &&
          !(self.postgres.database in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
          !self.postgres.database.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
          !self.postgres.database.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
          !self.postgres.database.matches('^[-+]?\\.(inf|Inf|INF)$') &&
          !self.postgres.database.matches('^\\.(nan|NaN|NAN)$') &&
          !self.postgres.database.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') &&
          !self.postgres.database.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt]|\\s+)[0-9]{1,2}:[0-9]{2}:[0-9]{2}')
        severity: warning
        paths: [postgres.database]
        message: >-
          This version writes the database name into the PostGIS workload unquoted, so some values break the install or are
          stored as a number, date, true/false or nothing. Do not start it with a space, a quote or a YAML
          symbol such as ! & * % @ ` [ ] { } | > , # (or with - or ? and a space), leave out ': ', ' #'
          and a trailing ':' or space, and do not use a plain number, a date, true, false or null. 1.2.0
          and later quote it.
      - rule: oldSelf == null || self.config.password == oldSelf.config.password
        severity: info
        paths: [config.password]
        message: >-
          PostgreSQL reads the password only when the volume is first initialized, so a new value here does
          not change the database password. Run ALTER ROLE ... PASSWORD with the new password first.
      - when: oldSelf != null
        rule: self.config.password != 'password'
        severity: info
        paths: [config.password]
        message: >-
          The password is still the published default "password". Change it with ALTER ROLE ...
          PASSWORD, then set the same value here.

  - id: server
    title: Server
    description: The compute and storage of the single stateful PostGIS replica.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'upgrade'
        text: >-
          Every upgrade restarts the server. Nothing limits the rollout of a stateful workload, so plan a
          short write outage.
      - type: note
        text: >-
          This version runs the image `postgis/postgis:17-3.5` and lets any workload in this GVC connect on
          port 5432; it has no setting for either. 1.2.0 and later add both.
      - type: note
        text: >-
          This version creates a 20 GiB volume set and grows it automatically: by 1.1× whenever its free
          space falls below 10%, up to 1000 GiB. It has no setting for either. Uninstalling the release
          deletes the volume set; a final snapshot is kept for 7 days.
      - path: resources
        type: resources
        label: Resources
        required: true
        description: A single stateful replica.
        cpu: { min: 25m }
        memory: { min: 32Mi }
    rules:
      - when: oldSelf == null || self.resources != oldSelf.resources
        rule: self.resources.cpu.matches('^[0-9]+m$') && self.resources.memory.matches('[A-Za-z]$')
        severity: warning
        paths: [resources]
        message: >-
          This version writes CPU and memory unquoted: enter CPU in millicores (such as 1000m) and memory
          with a unit (such as 1Gi).
