              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [backup.gcp.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix> or gs://<bucket>/<prefix>, so ' #'
          # starts a comment that silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.backup.mode == 'wal-g' && self.backup.gcp.prefix != null
            rule: >-
              (oldSelf != null && self.backup.gcp.prefix == oldSelf.backup.gcp.prefix) ||
              [self.backup.gcp.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [backup.gcp.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: MinIO or S3-compatible
        when: self.backup.enabled && self.backup.provider == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
              The access key and secret key are values stored in the Helm release and in a secret the chart
              creates. 2.5.0 takes them from a secret you create instead.
          - path: backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: backup.minio.accessKey
            type: string
            label: Access key
            required: true
            example: true
          - path: backup.minio.secretKey
            type: string
            label: Secret key
            required: true
            sensitive: true
            widget: password
            example: true
          - path: backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (templates/workload-logical-backup.yaml) writes the prefix unquoted as its
          # BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.backup.mode == 'logical'
