rules:
  - rule: >-
      context.mode != 'upgrade' || context.fromVersion != '2.2.0' ||
      context.gvcLocations == null || size(context.gvcLocations) <= 1
    message: >-
      This release runs 2.2.0's multi-location mode, which 2.3.0 removed: this version would run an
      unrelated cluster in each location. Install this version as a new release and move the data with
      pg_dump instead.
  - rule: >-
      context.mode != 'upgrade' || context.fromVersion == null ||
      semverCompare(context.fromVersion, '2.0.0') >= 0
    message: >-
      2.0.0 renamed the PostgreSQL workload and its volume set, so upgrading a 1.x release deletes the old
      workload and its volume set with the data. Install this version as a new release and move the data
      with pg_dump instead.

migrations:
  - fromVersions: "<2.1.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<2.1.0"
    from: resources.memory
    to: resources.maxMemory
  # The new minimums (500m, 1Gi) would leave a carried maximum above 4 times the minimum, which a
  # stateful workload refuses, or above the maximum itself: raise the minimum to a quarter of the
  # maximum when needed, and lower it to the maximum when the maximum is below the new minimum.
  - fromVersions: "<2.1.0"
    to: resources.minCpu
    valueExpr: >-
      cpuMillicores(self.resources.cpu) < 500 ? string(cpuMillicores(self.resources.cpu)) + 'm' :
      cpuMillicores(self.resources.cpu) > 2000 ?
      string((cpuMillicores(self.resources.cpu) + 3) / 4 > cpuMillicores(self.resources.cpu) - 4000 ?
      (cpuMillicores(self.resources.cpu) + 3) / 4 : cpuMillicores(self.resources.cpu) - 4000) + 'm' : '500m'
    note: The single CPU value is now the maximum; the minimum is set so the maximum stays within 4 times it and within the platform's range.
  - fromVersions: "<2.1.0"
    to: resources.minMemory
    valueExpr: >-
      memoryBytes(self.resources.memory) < 1073741824 ? string(memoryBytes(self.resources.memory)) :
      memoryBytes(self.resources.memory) > 4294967296 ?
      string((memoryBytes(self.resources.memory) + 4194303) / 4194304 > (memoryBytes(self.resources.memory) + 1048575) / 1048576 - 4096 ?
      (memoryBytes(self.resources.memory) + 4194303) / 4194304 : (memoryBytes(self.resources.memory) + 1048575) / 1048576 - 4096) + 'Mi' : '1Gi'
    note: The single memory value is now the maximum; the minimum is set so the maximum stays within 4 times it and within the platform's range.
  - fromVersions: "<2.1.0"
    to: backup.provider
    valueExpr: "self.backup.gcp.enabled && !self.backup.aws.enabled ? 'gcp' : 'aws'"
    note: The destination is now chosen with Destination under Backups.
  - fromVersions: "<2.1.0"
    from: backup.aws.enabled
    note: Replaced by Destination under Backups.
  - fromVersions: "<2.1.0"
    from: backup.gcp.enabled
    note: Replaced by Destination under Backups.
  - fromVersions: "<2.1.0"
    from: backup.aws.s3.bucket
    to: backup.aws.bucket
  - fromVersions: "<2.1.0"
    from: backup.aws.s3.region
    to: backup.aws.region
  - fromVersions: "<2.1.0"
    from: backup.aws.s3.cloudAccountName
    to: backup.aws.cloudAccountName
  - fromVersions: "<2.1.0"
    from: backup.aws.s3.policyName
    to: backup.aws.policyName
  - fromVersions: "<2.1.0"
    from: backup.gcp.gcs.bucket
    to: backup.gcp.bucket
  - fromVersions: "<2.1.0"
    from: backup.gcp.gcs.cloudAccountName
    to: backup.gcp.cloudAccountName
  # The default folder changed from postgres/my-cluster to postgres/backups; keep the installed one so
  # existing backups stay in the same place.
  - fromVersions: "<2.1.0"
    from: backup.aws.s3.prefix
    to: backup.aws.prefix
  - fromVersions: "<2.1.0"
    to: backup.aws.prefix
    valueExpr: self.backup.aws.s3.prefix
    note: The folder prefix is kept as installed.
  - fromVersions: "<2.1.0"
    from: backup.gcp.gcs.prefix
    to: backup.gcp.prefix
  - fromVersions: "<2.1.0"
    to: backup.gcp.prefix
    valueExpr: self.backup.gcp.gcs.prefix
    note: The folder prefix is kept as installed.
  - fromVersions: "<2.3.0"
    from: postgres.walLevel
    note: >-
      2.3.0 removed the WAL level setting and writes wal_level replica. A cluster that already exists keeps
      the WAL level stored in its shared configuration.
  - fromVersions: "<2.3.0"
    from: global.locations
    note: >-
      2.3.0 removed multi-location mode and runs in a single location. Do not upgrade a release that set
      global.locations to this version.
