{{- if .Values.backup.enabled }}
kind: secret
name: {{ include "pg-ha.secretDatabase.name" . }}
description: Postgres Highly Available config
tags:
  {{- include "pg-ha.tags" . | nindent 4 }}
type: dictionary
data:
{{- /*
  Credentials are NOT here any more. They live in the user's prerequisite
  secret named by config.credentialsSecretName, and the workloads reference
  that secret directly. What remains is non-sensitive backup configuration.
*/}}
{{- if and .Values.backup.enabled (eq .Values.backup.provider "aws") }}
  backup-bucket: {{ .Values.backup.aws.bucket | quote }}
  aws-region: {{ .Values.backup.aws.region | quote }}
{{- end }}
{{- if and .Values.backup.enabled (eq .Values.backup.provider "gcp") }}
  backup-bucket: {{ .Values.backup.gcp.bucket | quote }}
{{- end }}
{{- if and .Values.backup.enabled (eq .Values.backup.provider "minio") }}
  backup-bucket: {{ .Values.backup.minio.bucket | quote }}
  minio-endpoint: {{ .Values.backup.minio.endpoint | quote }}
{{- end }}
{{- end }}
