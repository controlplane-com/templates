{{- include "pg-ha.validate" . -}}
kind: secret
name: {{ include "pg-ha.secretStartup.name" . }}
description: Patroni Postgres startup script
tags: {{- include "pg-ha.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -euo pipefail

    # --- Fix permissions for mounted data directory ---
    mkdir -p /var/lib/postgresql/data/pgdata
    chown -R postgres:postgres /var/lib/postgresql/data
    chmod 750 /var/lib/postgresql/data
    chmod 750 /var/lib/postgresql/data/pgdata || true

    # --- dynamic env vars ---
    LOCATION=$(basename "${CPLN_LOCATION}")
    HOSTNAME=${HOSTNAME}

    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
    WORKLOAD_NAME=$(echo "${HOSTNAME}" | sed 's/-[0-9]*$//')
    PATRONI_NAME="${WORKLOAD_NAME}-${REPLICA_INDEX}"
    PATRONI_RESTAPI_CONNECT_ADDRESS="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.{{ .Values.global.cpln.gvc }}.cpln.local:8008"
    SCOPE="{{ .Release.Name }}"
    NAMESPACE="/{{ .Release.Name }}/"

    PATRONI_ETCD3_HOSTS=""
    for i in $(seq 0 $(( {{ .Values.etcd.replicas }} - 1 )) ); do
        host="replica-${i}.{{ include "pg-ha.etcd.name" . }}.${LOCATION}.{{ .Values.global.cpln.gvc }}.cpln.local:2379"
        if [[ -z "$PATRONI_ETCD3_HOSTS" ]]; then
            PATRONI_ETCD3_HOSTS="$host"
        else
            PATRONI_ETCD3_HOSTS="${PATRONI_ETCD3_HOSTS},$host"
        fi
    done

    export PATRONI_NAME
    export PATRONI_RESTAPI_CONNECT_ADDRESS
    export PATRONI_ETCD3_HOSTS
    export PGDATA="/var/lib/postgresql/data/pgdata"

    echo "Starting Patroni node '${PATRONI_NAME}' with ETCD endpoints: ${PATRONI_ETCD3_HOSTS}"

    # --- generate minimal Patroni config dynamically ---

    # --- Credentials are interpolated into the YAML config written below, so
    # escape the two characters that can break a double-quoted YAML scalar.
    # Without this, a password containing a quote or a backslash yields an
    # unparseable config, and one containing #, &, *, %, @ or a colon-space
    # is silently misread as something other than what the user set.
    yaml_escape() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
    PGUSER_Y="$(yaml_escape "${PGUSER}")"
    PGPASSWORD_Y="$(yaml_escape "${PGPASSWORD}")"

    CONFIG_FILE="/tmp/patroni_config.yml"
    cat > "$CONFIG_FILE" <<EOF
    scope: ${SCOPE}
    namespace: ${NAMESPACE}
    name: ${PATRONI_NAME}

    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${PATRONI_RESTAPI_CONNECT_ADDRESS}

    etcd3:
      hosts: ${PATRONI_ETCD3_HOSTS}
      retry_timeout: 15

    postgresql:
      listen: 0.0.0.0:5432
      connect_address: replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.{{ .Values.global.cpln.gvc }}.cpln.local:5432
      data_dir: ${PGDATA}
      bin_dir: /usr/lib/postgresql/17/bin
      parameters:
        max_connections: 100
        shared_buffers: 128MB
        wal_level: {{ .Values.walLevel }}
        hot_standby: "on"
        max_slot_wal_keep_size: {{ max 1 (div .Values.volumeset.capacity 4) }}GB
    {{- if eq .Values.walLevel "logical" }}
        # PostgreSQL 17 failover slots: each replica keeps a synchronized copy of every logical slot
        # created with failover enabled (Debezium's slot.failover), so the slot is already on whichever
        # member becomes the leader. Slot sync needs hot_standby_feedback; Patroni already puts a
        # dbname in primary_conninfo, the other requirement.
        hot_standby_feedback: "on"
        sync_replication_slots: "on"
    {{- end }}
    {{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
        archive_mode: "on"
        archive_command: "wal-g wal-push %p"
        archive_timeout: 60s
        restore_command: "wal-g wal-fetch %f %p"
    {{- end }}
      authentication:
        replication:
          username: repl
          password: "${PGPASSWORD_Y}"
        superuser:
          username: "${PGUSER_Y}"
          password: "${PGPASSWORD_Y}"
    EOF

    # --- bootstrap only if PGDATA is empty ---
    if [ ! -d "$PGDATA" ] || [ -z "$(ls -A "$PGDATA")" ]; then
        echo "PGDATA is empty — bootstrapping cluster"
        cat >> "$CONFIG_FILE" <<EOF
    bootstrap:
      dcs:
        # Patroni enforces loop_wait + 2*retry_timeout <= ttl and, when that is
        # violated, SILENTLY rewrites loop_wait to 1 and retry_timeout to (ttl-1)/2
        # rather than failing. Keep any change to these three inside the rule.
        ttl: 45
        loop_wait: 10
        retry_timeout: 15
        maximum_lag_on_failover: 1048576
        # Do not demote a healthy primary just because etcd is unreachable: if every
        # member still answers the Patroni REST API, keep serving. Patroni only allows
        # a member listed in the /failsafe key to win a leader race, so this cannot
        # split-brain. This is the difference between riding out a DCS blip and taking
        # a failover for one.
        failsafe_mode: true
    {{- if eq .Values.walLevel "logical" }}
        # Logical replication slots are created by their clients (Debezium), not by Patroni.
        # Without this, Patroni drops any inactive slot it does not manage whenever it reloads
        # its slot list (a restart, a failover), and the client silently loses its position.
        # It also keeps Patroni away from the synchronized copies on the replicas.
        ignore_slots:
          - type: logical
    {{- end }}
        # No authentication block here: everything under bootstrap.dcs is stored in etcd and
        # served unauthenticated at :8008/config, and Patroni drops authentication from the
        # shared config anyway. The local postgresql.authentication above is what it uses.
        postgresql:
          # wal_level is shared config: Patroni ignores it in the local block above, so this
          # is the value that takes effect, and only when the cluster is first created.
          parameters:
            wal_level: {{ .Values.walLevel }}
            hot_standby: "on"
            max_slot_wal_keep_size: {{ max 1 (div .Values.volumeset.capacity 4) }}GB
    {{- if eq .Values.walLevel "logical" }}
            hot_standby_feedback: "on"
            sync_replication_slots: "on"
    {{- end }}
    {{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
            archive_mode: "on"
            archive_command: "wal-g wal-push %p"
            archive_timeout: 60s
            restore_command: "wal-g wal-fetch %f %p"
    {{- end }}
          use_pg_rewind: true
      initdb:
        - encoding: UTF8
        - data-checksums
      pg_hba:
        - host replication repl 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
      post_init: >
        sh -lc 'psql -h 127.0.0.1 -p 5432 -U ${PGUSER} -d postgres -c "CREATE DATABASE ${APP_DATABASE}"'
    EOF
    else
        echo "PGDATA exists — starting Patroni normally"
    fi
{{- if eq .Values.walLevel "logical" }}

    # --- remove a former leader's own logical slots once it is a replica ---
    # A member that loses the leadership keeps the slots it held as leader. On a replica they are
    # useless (the leader's copy is the live one), and PostgreSQL refuses to synchronize a slot
    # whose name is already taken by a slot that is not a synchronized copy, so the replica would
    # never get a usable copy of it. Synchronized copies (synced) are never touched, and nothing
    # runs while this member is the leader: pg_is_in_recovery() is checked in the same statement.
    (
      while true; do
        sleep 30
        psql -h 127.0.0.1 -p 5432 -U "${PGUSER}" -d postgres -Atq -c \
          "SELECT slot_name FROM (SELECT slot_name, pg_catalog.pg_drop_replication_slot(slot_name) FROM pg_catalog.pg_replication_slots WHERE slot_type = 'logical' AND NOT synced AND NOT active AND pg_catalog.pg_is_in_recovery()) AS dropped" \
          2>/dev/null | while read -r slot; do
            [ -n "${slot}" ] && echo "pg-ha: dropped logical slot '${slot}' left from when this member was the leader; the leader's synchronized copy replaces it"
          done || true
      done
    ) &
{{- end }}

    # --- drop privileges and start Patroni ---
    echo "Dropping privileges to postgres user..."
    exec gosu postgres patroni "$CONFIG_FILE"