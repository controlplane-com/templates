# Feature checks for the postgres-multi-location template. Each runs after install (and after each upgrade)
# on every version in its since/until range. Add a check with `since: <new version>` for every change you
# ship. Placeholders: {release} {gvc} {org} {version} {installed_version} {locations.N}, and the baseline
# vars (pg_user, pg_password, pg_db).
#
# Writes go through the HAProxy endpoint, the address applications use, so they only pass when the proxy
# routes to the current Patroni leader. pg_hba requires a password for every TCP connection.
checks:
  - id: cluster-healthy
    description: Patroni reports one member per location, exactly one leader and every other member streaming.
    exec:
      workload: "{release}-postgres"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        leaders = [x["name"] for x in m if x["role"] == "leader"]
        streaming = [x["name"] for x in m if x["role"] in ("replica", "sync_standby")
                     and (x["state"] == "streaming" or (x["state"] == "running" and isinstance(x.get("lag"), int)))]
        print(f"MEMBERS {len(m)} LEADERS {len(leaders)} STREAMING {len(streaming)}")
        '
    expect:
      stdout: "^MEMBERS 3 LEADERS 1 STREAMING 2$"
    # About five minutes: cross-region discovery after a cold install or an upgrade's restart can take
    # minutes to converge, so a failure here means a member that does not come back, not a slow one.
    retries: 20
    retryDelaySeconds: 15

  - id: write-reaches-every-location
    description: >-
      A row written through the proxy in one location reads back from every member directly, so it was
      replicated to all three locations.
    exec:
      workload: "{release}-postgres"
      container: patroni-postgres
      location: "{locations.2}"
      shell: bash
      script: |
        set -e
        export PGPASSWORD='{pg_password}'
        P={release}-postgres-proxy.{gvc}.cpln.local
        M="e2e-$(date +%s%N)"
        psql -h "$P" -U {pg_user} -d {pg_db} -v ON_ERROR_STOP=1 -qtA \
          -c "create table if not exists e2e (id serial primary key, version text not null, marker text not null)" \
          -c "insert into e2e (version, marker) values ('{version}', '$M')" >/dev/null
        hosts=$(curl -s localhost:8008/cluster | python3 -c '
        import json, sys
        for m in json.load(sys.stdin)["members"]: print(m["host"])
        ')
        found=0; total=0
        for h in $hosts; do
          total=$((total + 1))
          for i in $(seq 1 20); do
            if psql -h "$h" -U {pg_user} -d {pg_db} -qtA -c "select marker from e2e where marker = '$M'" 2>/dev/null | grep -qx "$M"; then
              found=$((found + 1)); break
            fi
            sleep 3
          done
        done
        echo "FOUND $found OF $total"
    expect:
      stdout: "^FOUND 3 OF 3$"
    retries: 6
    retryDelaySeconds: 15
    timeoutSeconds: 300

  - id: rejects-bad-password
    description: A wrong password is refused through the proxy (the control for the check above).
    exec:
      workload: "{release}-postgres"
      container: patroni-postgres
      shell: bash
      script: |
        PGPASSWORD=wrong-password psql -h {release}-postgres-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -c "select 1" 2>&1
        echo "EXIT=$?"
    expect:
      stdout: "password authentication failed"
      notStdout: "^EXIT=0$"

  - id: data-survives-upgrade
    description: >-
      The row written on the version this scenario installed first is still there. On a fresh install
      that is the same version; after an upgrade it proves the cluster's data carried over.
    exec:
      workload: "{release}-postgres"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        n=$(psql -h {release}-postgres-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select count(*) from e2e where version = '{installed_version}'" 2>&1)
        [ "${n:-0}" -ge 1 ] 2>/dev/null && echo PERSISTED || echo "MISSING (rows for {installed_version}: ${n:-none})"
    expect:
      stdout: "^PERSISTED$"
    retries: 4
    retryDelaySeconds: 15
