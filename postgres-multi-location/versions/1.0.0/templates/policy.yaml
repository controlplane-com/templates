{{- include "pg-ml.validate" . -}}
kind: policy
name: {{ include "pg-ml.policy.name" . }}
description: PostgreSQL multi-location policy
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.gvc.name }}/identity/{{ include "pg-ml.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ include "pg-ml.secretDatabase.name" . }}
  - //secret/{{ include "pg-ml.secretStartup.name" . }}
  {{- if .Values.proxy.enabled }}
  - //secret/{{ include "pg-ml.secretProxyStartup.name" . }}
  {{- end }}
