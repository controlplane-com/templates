{{- include "pg-ml.validate" . -}}
{{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
kind: secret
name: {{ include "pg-ml.secretWALG.name" . }}
description: WAL-G base backup sidecar script for PostgreSQL multi-location
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    : "${PGDATA:?Missing PGDATA}"
    : "${PATRONI_API:=http://127.0.0.1:8008}"
    : "${WALG_BACKUP_INTERVAL_SECONDS:=21600}"

    # This sidecar runs alongside EVERY Patroni member, in every location, and
    # only the one holding the leader lock pushes. That is why wal-g needs no
    # location selector: the archive follows the primary wherever it is elected.
    echo "WAL-G base backup sidecar started in ${CPLN_LOCATION##*/}"
    echo "PGDATA=${PGDATA}"
    echo "PATRONI_API=${PATRONI_API}"
    echo "Interval=${WALG_BACKUP_INTERVAL_SECONDS}s"

    # Small jitter so members do not all probe on the same second.
    sleep $(( RANDOM % 30 ))

    while true; do
      code="$(curl -s -o /dev/null -w "%{http_code}" "${PATRONI_API}/primary" || true)"

      if [ "${code}" = "200" ]; then
        echo "Leader confirmed. Running wal-g backup-push ${PGDATA}"
        wal-g backup-push "${PGDATA}"
        echo "Backup complete"
      else
        echo "Not the primary (/primary=${code}). Skipping backup."
      fi

      sleep "${WALG_BACKUP_INTERVAL_SECONDS}"
    done
{{- end }}
