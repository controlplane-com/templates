{{- include "pg-ml.validate" . -}}
kind: workload
name: {{ include "pg-ml.name" . }}
description: PostgreSQL 17 Patroni cluster stretched across locations
gvc: {{ .Values.global.gvc.name }}
tags:
  # Members must resolve each other during a simultaneous cold start, before any
  # of them is ready — Patroni's /readiness only returns 200 once a leader exists
  # or Postgres is up, which is exactly the cold multi-location case.
  cpln/publishNotReadyAddresses: "true"
  {{- include "pg-ml.tags" . | nindent 2 }}
spec:
  type: stateful
  containers:
    - name: patroni-postgres
      image: {{ .Values.image }}
      command: "/bin/bash"
      args:
        - "/patroni/start.sh"
      inheritEnv: false
      minCpu: {{ .Values.resources.minCpu | quote }}
      minMemory: {{ .Values.resources.minMemory | quote }}
      cpu: {{ .Values.resources.maxCpu | quote }}
      memory: {{ .Values.resources.maxMemory | quote }}
      env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      ports:
        - number: 8008
          protocol: tcp
        - number: 5432
          protocol: tcp
      volumes:
        - path: /var/lib/postgresql/data
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "pg-ml.volume.name" . }}
        - path: /patroni/start.sh
          uri: cpln://secret/{{ include "pg-ml.secretStartup.name" . }}.payload
      lifecycle:
        preStop:
          exec:
            command:
              - /bin/bash
              - -c
              - |
                set -uo pipefail
                # The Patroni member name is {workload}-{location}-{index} here, NOT
                # $HOSTNAME. start.sh writes it to /tmp/patroni_name; posting the wrong
                # leader name makes the switchover fail silently and turns a planned
                # restart into a hard failover.
                NAME=$(cat /tmp/patroni_name 2>/dev/null || echo "")
                ROLE=$(curl -fs --max-time 2 http://localhost:8008/patroni | python3 -c 'import sys,json; print(json.load(sys.stdin).get("role",""))' 2>/dev/null || echo "")
                if { [ "$ROLE" = "master" ] || [ "$ROLE" = "primary" ]; } && [ -n "$NAME" ]; then
                  curl -fs --max-time 10 -X POST http://localhost:8008/switchover -H 'Content-Type: application/json' -d "{\"leader\":\"${NAME}\"}" || true
                  for i in $(seq 1 20); do
                    R=$(curl -fs --max-time 1 http://localhost:8008/patroni | python3 -c 'import sys,json; print(json.load(sys.stdin).get("role",""))' 2>/dev/null)
                    [ "$R" = "replica" ] && break
                    sleep 1
                  done
                fi
      livenessProbe:
        httpGet:
          path: /liveness
          port: 8008
          scheme: HTTP
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
        successThreshold: 1
      readinessProbe:
        httpGet:
          path: /readiness
          port: 8008
          scheme: HTTP
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
        successThreshold: 1
  identityLink: //gvc/{{ .Values.global.gvc.name }}/identity/{{ include "pg-ml.identity.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: {{ (index .Values.global.gvc.locations 0).replicas | int }}
      metric: disabled
      minScale: {{ (index .Values.global.gvc.locations 0).replicas | int }}
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    # Written in FULL for every location: a minimal localOptions entry makes the
    # API backfill its own defaults, which would leave a location eligible to
    # scale on concurrency and boot Patroni members nobody asked for.
    {{- range $location := .Values.global.gvc.locations }}
    - location: //location/{{ $location.name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: {{ $location.replicas | int }}
        metric: disabled
        minScale: {{ $location.replicas | int }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  rolloutOptions:
    maxSurgeReplicas: 0%
    maxUnavailableReplicas: '1'
    minReadySeconds: 60
    scalingPolicy: OrderedReady
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    # Required for the per-replica, location-qualified names Patroni advertises
    # as restapi/postgresql connect_address.
    replicaDirect: true
  securityOptions:
    filesystemGroupId: 999
  supportDynamicTags: false
