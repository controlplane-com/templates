{{- include "pg-ml.validate" . -}}
{{- if .Values.proxy.enabled }}
kind: workload
name: {{ include "pg-ml.proxy.name" . }}
description: HAProxy leader-only PostgreSQL endpoint, present in every location
gvc: {{ .Values.global.gvc.name }}
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
spec:
  type: standard
  containers:
    - name: haproxy
      image: {{ .Values.proxy.image }}
      command: /bin/sh
      args:
        - /proxy/start.sh
      inheritEnv: false
      cpu: {{ .Values.proxy.resources.cpu | quote }}
      memory: {{ .Values.proxy.resources.memory | quote }}
      ports:
        - number: 5432
          protocol: tcp
        - number: 8404
          protocol: http
        - number: 8405
          protocol: http
      volumes:
        - path: /proxy/start.sh
          uri: cpln://secret/{{ include "pg-ml.secretProxyStartup.name" . }}.payload
  identityLink: //gvc/{{ .Values.global.gvc.name }}/identity/{{ include "pg-ml.identity.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: {{ .Values.proxy.maxReplicas | int }}
      metric: rps
      minScale: {{ .Values.proxy.minReplicas | int }}
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    # Written in full — see the note on the Patroni workload.
    {{- range $location := .Values.global.gvc.locations }}
    - location: //location/{{ $location.name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: {{ $.Values.proxy.maxReplicas | int }}
        metric: rps
        minScale: {{ $.Values.proxy.minReplicas | int }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
{{- end }}
