{{- include "pg-ml.validate" . -}}
{{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
kind: secret
name: {{ include "pg-ml.secretWALG.name" . }}
description: WAL-G base backup sidecar script for PostgreSQL multi-location
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    : "${PGDATA:?Missing PGDATA}"
    : "${PATRONI_API:=http://127.0.0.1:8008}"
    : "${WALG_BACKUP_INTERVAL_SECONDS:=21600}"

    # This sidecar runs alongside EVERY Patroni member, in every location, and
    # only the one holding the leader lock pushes. That is why wal-g needs no
    # location selector: the archive follows the primary wherever it is elected.
    echo "WAL-G base backup sidecar started in ${CPLN_LOCATION##*/}"
    echo "PGDATA=${PGDATA}"
    echo "PATRONI_API=${PATRONI_API}"
    echo "Interval=${WALG_BACKUP_INTERVAL_SECONDS}s"

    # Small jitter so members do not all probe on the same second.
    sleep $(( RANDOM % 30 ))

    # Sleep the FULL interval only after a base backup has actually been pushed.
    # Any other outcome retries in RETRY_SECONDS. This matters at boot: Patroni
    # needs ~20-100s to acquire the leader lock, so the first probe almost always
    # says "not primary". Sleeping the full interval there left WAL archiving for
    # up to 6 hours with NO base backup to restore against — measured, and the
    # restore window is exactly the gap. The same retry also means a newly
    # promoted leader takes its first base backup within a minute of failover
    # rather than at the end of the interval.
    : "${RETRY_SECONDS:=60}"

    while true; do
      code="$(curl -s -o /dev/null -w "%{http_code}" "${PATRONI_API}/primary" || true)"

      if [ "${code}" = "200" ]; then
        echo "Leader confirmed. Running wal-g backup-push ${PGDATA}"
        if wal-g backup-push "${PGDATA}"; then
          echo "Backup complete; next base backup in ${WALG_BACKUP_INTERVAL_SECONDS}s"
          sleep "${WALG_BACKUP_INTERVAL_SECONDS}"
        else
          # Do not wait a whole interval to retry a failed backup.
          echo "backup-push FAILED; retrying in ${RETRY_SECONDS}s" >&2
          sleep "${RETRY_SECONDS}"
        fi
      else
        # Replica, or Patroni not up yet. Cheap localhost probe; keep it short so
        # whoever holds the lock starts backing up promptly.
        echo "Not the primary (/primary=${code}); re-checking in ${RETRY_SECONDS}s"
        sleep "${RETRY_SECONDS}"
      fi
    done
{{- end }}
