{{- include "pg-ml.validate" . -}}
kind: secret
name: {{ include "pg-ml.secretStartup.name" . }}
description: Patroni startup script for PostgreSQL multi-location
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -euo pipefail

    # --- Fix permissions for the mounted data directory ---
    mkdir -p /var/lib/postgresql/data/pgdata
    chown -R postgres:postgres /var/lib/postgresql/data
    chmod 750 /var/lib/postgresql/data
    chmod 750 /var/lib/postgresql/data/pgdata || true

    # --- Database credentials come from the user-created prerequisite secret ---
    # They arrive as env vars (PG_USERNAME / PG_PASSWORD / PG_DATABASE) rather
    # than being rendered into this script, so no credential is ever written into
    # the Helm release. They are interpolated into a YAML config below, so escape
    # the two characters that can break a double-quoted YAML scalar.
    : "${PG_USERNAME:?Missing PG_USERNAME — is the credentials secret missing its 'username' key?}"
    : "${PG_PASSWORD:?Missing PG_PASSWORD — is the credentials secret missing its 'password' key?}"
    : "${PG_DATABASE:?Missing PG_DATABASE — is the credentials secret missing its 'database' key?}"

    yaml_escape() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
    PG_USERNAME_Y="$(yaml_escape "${PG_USERNAME}")"
    PG_PASSWORD_Y="$(yaml_escape "${PG_PASSWORD}")"

    # --- Derive this member's identity ---
    LOCATION="${CPLN_LOCATION##*/}"
    WORKLOAD_NAME="${CPLN_WORKLOAD##*/}"
    REPLICA_INDEX="${HOSTNAME##*-}"
    GVC="{{ .Values.global.gvc.name }}"

    # The member name MUST be unique across the WHOLE multi-location cluster.
    # replica-0 exists in EVERY location, so a {workload}-{index} scheme (what
    # postgres-highly-available uses, correctly, for a single location) would
    # produce duplicate Patroni member names here and an incoherent cluster.
    PATRONI_NAME="${WORKLOAD_NAME}-${LOCATION}-${REPLICA_INDEX}"

    # The preStop switchover hook reads this file. It must NOT use $HOSTNAME:
    # the member name and the hostname are different in a multi-location cluster,
    # and a switchover POSTed with the wrong leader name fails silently, turning
    # every planned restart into a hard failover.
    printf '%s' "${PATRONI_NAME}" > /tmp/patroni_name

    SELF_HOST="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"
    SCOPE="{{ .Release.Name }}"
    NAMESPACE="/{{ .Release.Name }}/"

    # One etcd endpoint per location — the DCS is stretched exactly like Patroni.
    PATRONI_ETCD3_HOSTS="{{ range $i, $loc := .Values.global.gvc.locations }}{{ if $i }},{{ end }}replica-0.{{ include "pg-ml.etcd.name" $ }}.{{ $loc.name }}.{{ $.Values.global.gvc.name }}.cpln.local:2379{{ end }}"

    {{- if .Values.primaryLocation }}
    # primaryLocation biases FAILOVER elections via Patroni's failover_priority
    # tag. That tag is only a tiebreaker between equally-caught-up candidates
    # during a failover — it says nothing about which member initialises an
    # empty cluster, which is why the bootstrap head start further down exists.
    # Changing this value on a live cluster DOES move the primary, because it is
    # baked into this script: editing it rolls every member and the election
    # that follows picks this location. `patronictl switchover` moves a live
    # primary without a restart.
    if [ "${LOCATION}" = "{{ .Values.primaryLocation }}" ]; then
      FAILOVER_PRIORITY=100
    else
      FAILOVER_PRIORITY=1
    fi
    {{- end }}

    export PGDATA="/var/lib/postgresql/data/pgdata"

    echo "Starting Patroni member '${PATRONI_NAME}' in ${LOCATION}"
    echo "  self:  ${SELF_HOST}"
    echo "  etcd3: ${PATRONI_ETCD3_HOSTS}"

    # --- Generate the Patroni config ---
    CONFIG_FILE="/tmp/patroni_config.yml"
    cat > "$CONFIG_FILE" <<EOF
    scope: ${SCOPE}
    namespace: ${NAMESPACE}
    name: ${PATRONI_NAME}
    {{- if .Values.primaryLocation }}

    tags:
      failover_priority: ${FAILOVER_PRIORITY}
    {{- end }}

    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${SELF_HOST}:8008

    etcd3:
      hosts: ${PATRONI_ETCD3_HOSTS}
      retry_timeout: 30

    postgresql:
      listen: 0.0.0.0:5432
      connect_address: ${SELF_HOST}:5432
      data_dir: ${PGDATA}
      bin_dir: /usr/lib/postgresql/17/bin
      parameters:
        max_connections: 100
        shared_buffers: 128MB
        wal_level: replica
        hot_standby: "on"
        max_slot_wal_keep_size: 10GB
    {{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
        archive_mode: "on"
        archive_command: "wal-g wal-push %p"
        archive_timeout: 60s
        restore_command: "wal-g wal-fetch %f %p"
    {{- end }}
      authentication:
        replication:
          username: repl
          password: "${PG_PASSWORD_Y}"
        superuser:
          username: "${PG_USERNAME_Y}"
          password: "${PG_PASSWORD_Y}"
    EOF

    # --- Bootstrap block: written only when PGDATA is empty ---
    #
    # Everything under `bootstrap.dcs` is written to the DCS ONCE, when the
    # cluster is first initialised, and is ignored on every later start. These
    # keys (ttl, loop_wait, retry_timeout, maximum_lag_on_failover, failsafe_mode,
    # use_pg_rewind and the replication parameters) CANNOT be set from local
    # config at all in Patroni 4.0.4 — which is why none of them is a values
    # knob: it would silently do nothing on `helm upgrade`. Change them on a
    # live cluster with `patronictl edit-config`.
    #
    # Timers satisfy Patroni's constraint loop_wait + 2 * retry_timeout <= ttl
    # (10 + 2*15 = 40 <= 45).
    #
    # maximum_lag_on_failover is 32 MiB, not the 1 MiB a single-location cluster
    # can afford: on an asynchronous cross-region link 1 MiB is about one second
    # of a 1 MB/s write stream, so every remote replica would be disqualified
    # from the leader race under real write load and the automatic promotion this
    # template exists to provide would simply never happen.
    if [ ! -d "$PGDATA" ] || [ -z "$(ls -A "$PGDATA")" ]; then
        echo "PGDATA is empty — bootstrapping cluster"
        cat >> "$CONFIG_FILE" <<EOF

    bootstrap:
      dcs:
        ttl: 45
        loop_wait: 10
        retry_timeout: 15
        maximum_lag_on_failover: 33554432
        failsafe_mode: true
        postgresql:
          use_pg_rewind: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_slot_wal_keep_size: 10GB
    {{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
            archive_mode: "on"
            archive_command: "wal-g wal-push %p"
            archive_timeout: 60s
            restore_command: "wal-g wal-fetch %f %p"
    {{- end }}
          authentication:
            replication:
              username: repl
              password: "${PG_PASSWORD_Y}"
            superuser:
              username: "${PG_USERNAME_Y}"
              password: "${PG_PASSWORD_Y}"
      initdb:
        - encoding: UTF8
        - data-checksums
      pg_hba:
        - host replication repl 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
      post_init: >
        sh -lc 'psql -h 127.0.0.1 -p 5432 -U ${PG_USERNAME} -d postgres -c "CREATE DATABASE ${PG_DATABASE}"'
    EOF
    {{- if .Values.primaryLocation }}

        # --- Give the preferred location a head start at bootstrapping ---
        #
        # failover_priority is a FAILOVER tiebreaker only: Patroni scopes it to
        # "the priority this node should have during failover ... if they
        # received/replayed the same amount of WAL". It has NO bearing on which
        # member initialises an empty cluster, so without this every member
        # races and the primary lands wherever one gets there first (observed
        # with primaryLocation aws-us-east-1: the leader bootstrapped in
        # aws-eu-central-1). Members OUTSIDE the preferred location therefore
        # hold back and let it take the leader lock first.
        #
        # This is a bias, not a lock, and it cannot split the cluster: the DCS
        # is the arbiter, so whoever loses the race finds the `initialize` key
        # already set and clones as a replica instead of initialising a second
        # cluster. Giving up early is therefore always safe.
        #
        # Only reached when PGDATA is empty, so every restart of an initialised
        # member skips it entirely.
        #
        # The 90 s ceiling is imposed by the liveness probe, not by taste.
        # Patroni does not bind :8008 until this returns, and the probe kills
        # the container at initialDelaySeconds 60 + failureThreshold 6 x
        # periodSeconds 10 = ~110 s after container start. A longer wait would
        # restart-loop the member instead of placing the primary. If the
        # preferred location is down, slow or misconfigured the wait expires,
        # this member bootstraps, and the log says so in as many words.
        if [ "${LOCATION}" != "{{ .Values.primaryLocation }}" ]; then
          # Every replica index the preferred location runs, from values.
          PREFERRED_INDICES="{{ range $loc := $.Values.global.gvc.locations }}{{ if eq $loc.name $.Values.primaryLocation }}{{ range $r := until (int $loc.replicas) }}{{ $r }} {{ end }}{{ end }}{{ end }}"
          BOOTSTRAP_WAIT_SECONDS=90
          BOOTSTRAP_DEADLINE=$(( $(date +%s) + BOOTSTRAP_WAIT_SECONDS ))
          CLUSTER_FOUND=0
          echo "Preferred primary is {{ .Values.primaryLocation }} — waiting up to ${BOOTSTRAP_WAIT_SECONDS}s for it to initialise the cluster"
          while [ "$(date +%s)" -lt "${BOOTSTRAP_DEADLINE}" ]; do
            for PIDX in ${PREFERRED_INDICES}; do
              # Re-check the deadline per host so a location running several
              # replicas cannot overshoot it by one timeout per replica.
              if [ "$(date +%s)" -ge "${BOOTSTRAP_DEADLINE}" ]; then
                break
              fi
              PHOST="replica-${PIDX}.${WORKLOAD_NAME}.{{ .Values.primaryLocation }}.${GVC}.cpln.local"
              # 200 on /primary means this host holds the leader lock.
              if curl -fs --max-time 2 -o /dev/null "http://${PHOST}:8008/primary"; then
                echo "Leader is up at ${PHOST} — joining it as a replica"
                CLUSTER_FOUND=1
                break
              fi
              # 200 on /replica means the cluster is already initialised and the
              # leader is somewhere else. Waiting longer cannot move it.
              if curl -fs --max-time 2 -o /dev/null "http://${PHOST}:8008/replica"; then
                echo "Cluster already initialised (${PHOST} is a replica) — joining it"
                CLUSTER_FOUND=1
                break
              fi
            done
            if [ "${CLUSTER_FOUND}" -eq 1 ]; then
              break
            fi
            sleep 2
          done
          if [ "${CLUSTER_FOUND}" -eq 0 ]; then
            echo "WARNING: no leader in {{ .Values.primaryLocation }} after ${BOOTSTRAP_WAIT_SECONDS}s — bootstrapping here instead. The primary will NOT start in the preferred location; move it later with 'patronictl switchover --candidate'."
          fi
        fi
    {{- end }}
    else
        echo "PGDATA exists — starting Patroni normally"
    fi

    # --- Drop privileges and start Patroni ---
    echo "Dropping privileges to the postgres user..."
    exec gosu postgres patroni "$CONFIG_FILE"
