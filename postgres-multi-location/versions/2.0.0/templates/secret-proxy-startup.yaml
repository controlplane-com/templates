{{- include "pg-ml.validate" . -}}
{{- if or .Values.proxy.enabled .Values.pgbouncer.enabled }}
kind: secret
name: {{ include "pg-ml.secretProxyStartup.name" . }}
description: HAProxy startup script for PostgreSQL multi-location
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env sh
    set -eu

    LOCATION="$(basename "${CPLN_LOCATION:-}")"
    if [ -z "${LOCATION}" ]; then
      echo "ERROR: CPLN_LOCATION is empty; cannot derive location"
      exit 1
    fi

    # From the runtime built-in, not from Helm: this chart no longer creates or
    # names a GVC, so a render-time name could only ever drift from where the
    # workload actually runs.
    GVC="${CPLN_GVC:-}"
    if [ -z "${GVC}" ]; then
      echo "ERROR: CPLN_GVC is empty; cannot derive member hostnames"
      exit 1
    fi
    WORKLOAD_NAME="{{ include "pg-ml.name" . }}"

    # The cluster roster, rendered at template time as "location:replicas" pairs
    # — the SAME list the Patroni workload's localOptions are built from, so the
    # backend list and the members can never disagree.
    TOPOLOGY="{{- range $loc := .Values.global.locations }}{{ $loc.name }}:{{ $loc.replicas }} {{ end }}"

    # Every Patroni member in EVERY location, as "<server-name>|<host>" pairs.
    # Each proxy tier knows about the whole cluster, so whichever location holds
    # the primary, every proxy reaches it.
    ENDPOINTS=""
    for T in ${TOPOLOGY}; do
      T_LOC="${T%%:*}"
      T_N="${T##*:}"
      T_I=0
      while [ "${T_I}" -lt "${T_N}" ]; do
        ENDPOINTS="${ENDPOINTS}pg-${T_LOC}-${T_I}|replica-${T_I}.${WORKLOAD_NAME}.${T_LOC}.${GVC}.cpln.local "
        T_I=$((T_I + 1))
      done
    done

    echo "Starting HAProxy Patroni leader proxy in ${LOCATION}"
    echo "Cluster endpoints: ${ENDPOINTS}"

    CFG="/tmp/haproxy.cfg"

    SERVERS=""
    for E in ${ENDPOINTS}; do
      SRV_NAME="${E%%|*}"
      SRV_HOST="${E##*|}"
      SERVERS="${SERVERS}
      server ${SRV_NAME} ${SRV_HOST}:5432 check port 8008"
    done

    # ─── Startup gate ────────────────────────────────────────────────────────
    # HAProxy resolves server hostnames exactly once, at process start, and the
    # mesh DNS never returns NXDOMAIN — names that do not exist yet resolve to
    # garbage addresses that are then pinned forever. Gate the start until every
    # Patroni endpoint, in every location, answers HTTP on :8008. ANY HTTP status
    # (200 and 503 alike) proves the address is a real Patroni; garbage addresses
    # answer nothing. The haproxy image ships no curl/wget, so probe with perl.
    #
    # The timeout is 900s rather than pg-ha's 600s because cross-region service
    # discovery can take ~114s to converge AFTER a workload reports ready.
    probe_patroni() {
      perl -e '
        use IO::Socket::INET;
        my ($host) = @ARGV;
        my $s = IO::Socket::INET->new(
          PeerAddr => $host, PeerPort => 8008, Proto => "tcp", Timeout => 3,
        ) or exit 1;
        $s->send("GET /health HTTP/1.0\r\nHost: $host\r\n\r\n") or exit 1;
        my $line;
        eval {
          local $SIG{ALRM} = sub { die "read timeout\n" };
          alarm 3;
          $line = <$s>;
          alarm 0;
        };
        exit((defined $line && $line =~ m|^HTTP/|) ? 0 : 1);
      ' "$1" 2>/dev/null
    }

    GATE_TIMEOUT=900
    GATE_START="$(date +%s)"
    echo "pg-ml proxy: startup gate — verifying every Patroni endpoint in every location answers HTTP on :8008 before starting haproxy (timeout ${GATE_TIMEOUT}s)"
    for E in ${ENDPOINTS}; do
      SRV_NAME="${E%%|*}"
      SRV_HOST="${E##*|}"
      ATTEMPT=1
      while ! probe_patroni "${SRV_HOST}"; do
        ELAPSED=$(( $(date +%s) - GATE_START ))
        echo "pg-ml proxy: waiting for Patroni endpoints before starting haproxy — ${SRV_NAME} (${SRV_HOST}) not responding yet (attempt ${ATTEMPT}, ${ELAPSED}s elapsed)"
        if [ "${ELAPSED}" -ge "${GATE_TIMEOUT}" ]; then
          echo "pg-ml proxy: giving up after ${GATE_TIMEOUT}s — ${SRV_NAME} (${SRV_HOST}) never answered HTTP on :8008; exiting so the platform restarts this container and re-checks"
          exit 1
        fi
        ATTEMPT=$((ATTEMPT + 1))
        sleep 3
      done
      echo "pg-ml proxy: ${SRV_NAME} (${SRV_HOST}) answered HTTP on :8008"
    done
    echo "pg-ml proxy: all Patroni endpoints answering — starting haproxy"
    # ─── End startup gate ────────────────────────────────────────────────────

    cat > "${CFG}" <<EOF
    global
      log stdout format raw local0
      maxconn 4096
      stats socket /tmp/haproxy.sock mode 660 level admin

    defaults
      mode tcp
      log global
      option tcplog
      timeout connect 5s
      timeout client  2m
      timeout server  2m
      timeout check   5s

    frontend postgres_primary
      bind *:5432
      default_backend patroni_primary

    frontend stats_page
      bind *:8405
      mode http
      stats enable
      stats uri /stats
      stats refresh 10s

    frontend health_status
      bind *:8404
      mode http
      monitor-uri /healthz
      acl no_healthy_backends nbsrv(patroni_primary) lt 1
      monitor fail if no_healthy_backends

    backend patroni_primary
      mode tcp
      option httpchk
      http-check connect port 8008
      http-check send meth GET uri /primary ver HTTP/1.0
      http-check expect status 200
      default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions
    ${SERVERS}
    EOF

    echo "Rendered HAProxy config:"
    cat "${CFG}"

    haproxy -c -f "${CFG}"

    exec haproxy -W -db -f "${CFG}"
{{- end }}
