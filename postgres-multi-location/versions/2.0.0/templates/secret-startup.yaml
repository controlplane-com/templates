{{- include "pg-ml.validate" . -}}
kind: secret
name: {{ include "pg-ml.secretStartup.name" . }}
description: Patroni startup script for PostgreSQL multi-location
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -euo pipefail

    # --- Fix permissions for the mounted data directory ---
    mkdir -p /var/lib/postgresql/data/pgdata
    chown -R postgres:postgres /var/lib/postgresql/data
    chmod 750 /var/lib/postgresql/data
    chmod 750 /var/lib/postgresql/data/pgdata || true

    # --- Database credentials come from the user-created prerequisite secret ---
    # They arrive as env vars (PG_USERNAME / PG_PASSWORD / PG_DATABASE) rather
    # than being rendered into this script, so no credential is ever written into
    # the Helm release. They are interpolated into a YAML config below, so escape
    # the two characters that can break a double-quoted YAML scalar.
    : "${PG_USERNAME:?Missing PG_USERNAME — is the credentials secret missing its 'username' key?}"
    : "${PG_PASSWORD:?Missing PG_PASSWORD — is the credentials secret missing its 'password' key?}"
    : "${PG_DATABASE:?Missing PG_DATABASE — is the credentials secret missing its 'database' key?}"

    yaml_escape() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
    PG_USERNAME_Y="$(yaml_escape "${PG_USERNAME}")"
    PG_PASSWORD_Y="$(yaml_escape "${PG_PASSWORD}")"

    # --- Derive this member's identity ---
    LOCATION="${CPLN_LOCATION##*/}"
    WORKLOAD_NAME="${CPLN_WORKLOAD##*/}"
    REPLICA_INDEX="${HOSTNAME##*-}"
    # From the runtime built-in, not from Helm: this chart no longer creates or
    # names a GVC, so a render-time name could only ever drift from where the
    # workload actually runs.
    GVC="${CPLN_GVC}"

    # The cluster roster, rendered at template time as "location:replicas" pairs.
    # Every hostname below is built from it and from ${CPLN_GVC} at runtime.
    TOPOLOGY="{{- range $loc := .Values.global.locations }}{{ $loc.name }}:{{ $loc.replicas }} {{ end }}"
    CONFIGURED_LOCS=""
    for T in ${TOPOLOGY}; do
      CONFIGURED_LOCS="${CONFIGURED_LOCS}${T%%:*} "
    done
    CONFIGURED_LOCS="${CONFIGURED_LOCS% }"

    # The member name MUST be unique across the WHOLE multi-location cluster.
    # replica-0 exists in EVERY location, so a {workload}-{index} scheme (what
    # postgres-highly-available uses, correctly, for a single location) would
    # produce duplicate Patroni member names here and an incoherent cluster.
    PATRONI_NAME="${WORKLOAD_NAME}-${LOCATION}-${REPLICA_INDEX}"

    # The preStop switchover hook reads this file. It must NOT use $HOSTNAME:
    # the member name and the hostname are different in a multi-location cluster,
    # and a switchover POSTed with the wrong leader name fails silently, turning
    # every planned restart into a hard failover.
    printf '%s' "${PATRONI_NAME}" > /tmp/patroni_name

    SELF_HOST="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"
    SCOPE="{{ .Release.Name }}"
    NAMESPACE="/{{ .Release.Name }}/"

    # --- Data-directory freshness ---
    # Read once, here, because the location checks below key off it: a FRESH
    # member is one that has never held data, so refusing to start it costs
    # nothing. An initialised member is a live cluster node and must never be
    # taken down by a configuration check.
    PG_DATA_DIR="/var/lib/postgresql/data/pgdata"
    if [ ! -d "${PG_DATA_DIR}" ] || [ -z "$(ls -A "${PG_DATA_DIR}" 2>/dev/null || true)" ]; then
      FRESH="true"
    else
      FRESH="false"
    fi

    # --- Check A: never form a member identity in an undeclared location ---
    # defaultOptions.minScale/maxScale are 0, so the platform should never place
    # a replica in a location this release did not ask for. This is the last
    # line of defence if it does, and the failure it prevents is severe: such a
    # member gets the FULL etcd3 host list, so it joins the DCS normally and can
    # WIN the leader election — while no HAProxy tier has it in its backend list
    # (those are rendered from the same values). The proxy then reports no
    # healthy primary, and PgBouncer and the nightly dump lose the database
    # entirely, with every replica still reporting ready.
    # Unconditional — fresh or not, this member must not join.
    case " ${CONFIGURED_LOCS} " in
      *" ${LOCATION} "*) : ;;
      *) echo "[patroni] FATAL: this member is running in location '${LOCATION}', which is not in the configured location list (${CONFIGURED_LOCS})." >&2
         echo "[patroni] It would join the cluster through etcd and could win the leader election, while no HAProxy tier routes to it — every client would lose the primary." >&2
         echo "[patroni] Remove this location from GVC '${GVC}', or add it to global.locations in your values." >&2
         exit 1 ;;
    esac

    # --- GVC location reconciliation (Checks B and C) ---
    # The platform accepts a localOptions entry naming a location the GVC does
    # not have: it is stored verbatim and is simply inert. Nothing reports it, so
    # a typo in global.locations yields a stack where the declared Patroni member
    # AND its etcd peer never start — and the etcd DCS either forms on a bare
    # majority (healthy-looking, zero fault tolerance) or never elects at all,
    # leaving Patroni waiting on a DCS that can never come. Helm cannot see a
    # live GVC at render time, and peer unreachability is not usable as the
    # signal — surviving a location outage is the product. So ask the GVC itself.
    #
    # Bounding: curl's own --retry is NOT used. --max-time is per ATTEMPT, not a
    # total, so `--max-time 10 --retry 3 --retry-delay 2` was measured at 46s
    # against a blackholed address on a sibling template (an NXDOMAIN control
    # returns in seconds and proves nothing about a hang). The retry is done in
    # shell, each attempt bounded twice: --max-time 8 normally fires, and
    # `timeout 12` is the backstop if curl itself hangs. Worst case 3x12 + 2x2 =
    # 40s. Both `timeout` (coreutils) and curl 7.81 are in this image.
    GVC_LOCS=""
    GVC_READ_OK="false"
    GVC_HTTP="000"
    GVC_TMP="$(mktemp)"
    for _try in 1 2 3; do
      GVC_HTTP=$(timeout 12 curl -sS -o "${GVC_TMP}" -w '%{http_code}' \
        --max-time 8 \
        -H "Authorization: ${CPLN_TOKEN:-}" \
        "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>/dev/null) || GVC_HTTP="000"
      if [ "${GVC_HTTP}" = "200" ]; then
        GVC_LOCS=$(tr -d ' \n' < "${GVC_TMP}" \
          | sed -n 's/.*"locationLinks":\[\([^]]*\)\].*/\1/p' \
          | tr ',' '\n' | sed 's#.*/##;s/"//g' | tr '\n' ' ')
        if [ -n "${GVC_LOCS}" ]; then
          GVC_READ_OK="true"
          break
        fi
      fi
      sleep 2
    done
    rm -f "${GVC_TMP}"

    if [ "${GVC_READ_OK}" != "true" ]; then
      # A control-plane hiccup must never be the reason a database refuses to
      # start. Skip the API-backed checks; Check A above still applies.
      echo "[patroni] WARNING: could not read the location list of GVC '${GVC}' (HTTP ${GVC_HTTP}) — skipping the GVC location check." >&2
    else
      TOTAL=0
      PRESENT=0
      MISSING=""
      for LOC in ${CONFIGURED_LOCS}; do
        TOTAL=$((TOTAL + 1))
        case " ${GVC_LOCS} " in
          *" ${LOC} "*) PRESENT=$((PRESENT + 1)) ;;
          *) MISSING="${MISSING}${LOC} " ;;
        esac
      done
      EXTRA=""
      for LOC in ${GVC_LOCS}; do
        case " ${CONFIGURED_LOCS} " in
          *" ${LOC} "*) : ;;
          *) EXTRA="${EXTRA}${LOC} " ;;
        esac
      done
      if [ -n "${EXTRA}" ]; then
        echo "[patroni] GVC '${GVC}' also has locations this release does not use: ${EXTRA% } — nothing runs there (minScale/maxScale are 0 outside localOptions)."
      fi

      # --- Check B: the etcd DCS must be able to reach quorum ---
      # Deliberately BEFORE check C: when locations are missing AND that costs
      # etcd its majority, both are true and "the DCS can never elect" is the
      # more specific and more actionable of the two. It also turns an unbounded
      # wait for a DCS that can never form into an immediate, named failure.
      if [ $((2 * PRESENT)) -le "${TOTAL}" ]; then
        if [ "${FRESH}" = "true" ]; then
          echo "[patroni] FATAL: the etcd DCS can never reach quorum. ${PRESENT} of ${TOTAL} configured locations (${CONFIGURED_LOCS}) exist in GVC '${GVC}' (which has: ${GVC_LOCS% })." >&2
          echo "[patroni] etcd runs one member per configured location and needs floor(${TOTAL}/2)+1 of them to elect. Without a DCS leader Patroni can never promote a primary. Refusing to wait for a leader that can never be elected." >&2
          echo "[patroni] Add the missing location(s) to the GVC, or remove them from global.locations in your values." >&2
          exit 1
        fi
        echo "[patroni] WARNING: only ${PRESENT} of ${TOTAL} configured locations (${CONFIGURED_LOCS}) exist in GVC '${GVC}' — below the majority the etcd DCS needs to elect." >&2
        echo "[patroni] This member is already initialised, so it keeps running rather than taking a live cluster down. See 'Recovering from a lost location' in the README." >&2
      # --- Check C: every declared location must exist in the GVC ---
      # Asymmetric on purpose: hard-fail ONLY on a fresh data directory. A fresh
      # member would bootstrap a cluster whose remaining members can never
      # exist — it would report healthy while sitting one location away from
      # permanent DCS quorum loss. An already-initialised member is a different
      # situation: a location removed from the GVC is indistinguishable from one
      # that is down, and surviving that is exactly what this template is for, so
      # hard-failing would turn "lost one location" into "lost the cluster".
      elif [ -n "${MISSING}" ]; then
        if [ "${FRESH}" = "true" ]; then
          echo "[patroni] FATAL: locations declared in global.locations are not in GVC '${GVC}': ${MISSING% }" >&2
          echo "[patroni] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
          echo "[patroni] ${PRESENT} of ${TOTAL} declared locations can actually start. That is a bare majority: the cluster would form, report healthy, and have ZERO fault tolerance — losing any one location would lose the DCS permanently. Refusing to bootstrap it." >&2
          echo "[patroni] Add the missing location(s) to the GVC, or remove them from global.locations in your values." >&2
          exit 1
        fi
        echo "[patroni] WARNING: locations declared in global.locations are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "[patroni] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "[patroni] This member is already initialised, so it keeps serving — but members in the missing location(s) will never appear, and only ${PRESENT} of ${TOTAL} declared locations exist." >&2
      else
        echo "[patroni] GVC location check OK — '${GVC}' has every configured location (${CONFIGURED_LOCS})"
      fi

      {{- if .Values.primaryLocation }}
      # Render can only compare primaryLocation against the VALUES list. If it
      # names a location the GVC lacks, no member runs there, the bootstrap head
      # start below expires, and the primary quietly lands somewhere else.
      case " ${GVC_LOCS} " in
        *" {{ .Values.primaryLocation }} "*) : ;;
        *) echo "[patroni] WARNING: primaryLocation is '{{ .Values.primaryLocation }}', which GVC '${GVC}' does not have (it has: ${GVC_LOCS% }). No member runs there, so the primary will start elsewhere." >&2 ;;
      esac
      {{- end }}
      {{- if and .Values.backup.enabled (eq .Values.backup.mode "logical") }}
      # Same hole for the backup cron's single-location selector — and that one
      # has no script of its own to warn from, so the members say it. A cron
      # unsuspended only in a location the GVC lacks never runs, anywhere, and
      # nothing reports it.
      case " ${GVC_LOCS} " in
        *" {{ .Values.backup.location }} "*) : ;;
        *) echo "[patroni] WARNING: backup.location is '{{ .Values.backup.location }}', which GVC '${GVC}' does not have (it has: ${GVC_LOCS% }). The nightly logical backup is suspended in every other location, so it will NEVER run." >&2 ;;
      esac
      {{- end }}
    fi

    # One etcd endpoint per location — the DCS is stretched exactly like Patroni.
    # The etcd workload name is a CROSS-CHART INVARIANT ({release}-etcd); see the
    # pg-ml.etcd.name helper.
    ETCD_WORKLOAD="{{ include "pg-ml.etcd.name" . }}"
    PATRONI_ETCD3_HOSTS=""
    for LOC in ${CONFIGURED_LOCS}; do
      ENTRY="replica-0.${ETCD_WORKLOAD}.${LOC}.${GVC}.cpln.local:2379"
      if [ -z "${PATRONI_ETCD3_HOSTS}" ]; then
        PATRONI_ETCD3_HOSTS="${ENTRY}"
      else
        PATRONI_ETCD3_HOSTS="${PATRONI_ETCD3_HOSTS},${ENTRY}"
      fi
    done

    {{- if .Values.primaryLocation }}
    # primaryLocation biases FAILOVER elections via Patroni's failover_priority
    # tag. That tag is only a tiebreaker between equally-caught-up candidates
    # during a failover — it says nothing about which member initialises an
    # empty cluster, which is why the bootstrap head start further down exists.
    # Changing this value on a live cluster DOES move the primary, because it is
    # baked into this script: editing it rolls every member and the election
    # that follows picks this location. `patronictl switchover` moves a live
    # primary without a restart.
    if [ "${LOCATION}" = "{{ .Values.primaryLocation }}" ]; then
      FAILOVER_PRIORITY=100
    else
      FAILOVER_PRIORITY=1
    fi
    {{- end }}

    export PGDATA="/var/lib/postgresql/data/pgdata"

    echo "Starting Patroni member '${PATRONI_NAME}' in ${LOCATION}"
    echo "  self:  ${SELF_HOST}"
    echo "  etcd3: ${PATRONI_ETCD3_HOSTS}"

    # --- Generate the Patroni config ---
    CONFIG_FILE="/tmp/patroni_config.yml"
    cat > "$CONFIG_FILE" <<EOF
    scope: ${SCOPE}
    namespace: ${NAMESPACE}
    name: ${PATRONI_NAME}
    {{- if .Values.primaryLocation }}

    tags:
      failover_priority: ${FAILOVER_PRIORITY}
    {{- end }}

    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${SELF_HOST}:8008

    etcd3:
      hosts: ${PATRONI_ETCD3_HOSTS}
      retry_timeout: 15

    postgresql:
      listen: 0.0.0.0:5432
      connect_address: ${SELF_HOST}:5432
      data_dir: ${PGDATA}
      bin_dir: /usr/lib/postgresql/17/bin
      parameters:
        max_connections: 100
        shared_buffers: 128MB
        wal_level: replica
        hot_standby: "on"
        max_slot_wal_keep_size: 10GB
    {{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
        archive_mode: "on"
        archive_command: "wal-g wal-push %p"
        archive_timeout: 60s
        restore_command: "wal-g wal-fetch %f %p"
    {{- end }}
      authentication:
        replication:
          username: repl
          password: "${PG_PASSWORD_Y}"
        superuser:
          username: "${PG_USERNAME_Y}"
          password: "${PG_PASSWORD_Y}"
    EOF

    # --- Bootstrap block: written only when PGDATA is empty ---
    #
    # Everything under `bootstrap.dcs` is written to the DCS ONCE, when the
    # cluster is first initialised, and is ignored on every later start. These
    # keys (ttl, loop_wait, retry_timeout, maximum_lag_on_failover, failsafe_mode,
    # use_pg_rewind and the replication parameters) CANNOT be set from local
    # config at all in Patroni 4.0.4 — which is why none of them is a values
    # knob: it would silently do nothing on `helm upgrade`. Change them on a
    # live cluster with `patronictl edit-config`.
    #
    # Timers satisfy Patroni's constraint loop_wait + 2 * retry_timeout <= ttl
    # (10 + 2*15 = 40 <= 45).
    #
    # maximum_lag_on_failover is 32 MiB, not the 1 MiB a single-location cluster
    # can afford: on an asynchronous cross-region link 1 MiB is about one second
    # of a 1 MB/s write stream, so every remote replica would be disqualified
    # from the leader race under real write load and the automatic promotion this
    # template exists to provide would simply never happen.
    if [ ! -d "$PGDATA" ] || [ -z "$(ls -A "$PGDATA")" ]; then
        echo "PGDATA is empty — bootstrapping cluster"
        cat >> "$CONFIG_FILE" <<EOF

    bootstrap:
      dcs:
        # Patroni enforces loop_wait + 2*retry_timeout <= ttl and, when that is
        # violated, SILENTLY rewrites loop_wait to 1 and retry_timeout to (ttl-1)/2
        # rather than failing. Keep any change to these three inside the rule.
        ttl: 45
        loop_wait: 10
        retry_timeout: 15
        maximum_lag_on_failover: 33554432
        failsafe_mode: true
        postgresql:
          use_pg_rewind: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_slot_wal_keep_size: 10GB
    {{- if and .Values.backup.enabled (eq .Values.backup.mode "wal-g") }}
            archive_mode: "on"
            archive_command: "wal-g wal-push %p"
            archive_timeout: 60s
            restore_command: "wal-g wal-fetch %f %p"
    {{- end }}
          authentication:
            replication:
              username: repl
              password: "${PG_PASSWORD_Y}"
            superuser:
              username: "${PG_USERNAME_Y}"
              password: "${PG_PASSWORD_Y}"
      initdb:
        - encoding: UTF8
        - data-checksums
      pg_hba:
        - host replication repl 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
      post_init: >
        sh -lc 'psql -h 127.0.0.1 -p 5432 -U ${PG_USERNAME} -d postgres -c "CREATE DATABASE ${PG_DATABASE}"'
    EOF
    {{- if .Values.primaryLocation }}

        # --- Give the preferred location a head start at bootstrapping ---
        #
        # failover_priority is a FAILOVER tiebreaker only: Patroni scopes it to
        # "the priority this node should have during failover ... if they
        # received/replayed the same amount of WAL". It has NO bearing on which
        # member initialises an empty cluster, so without this every member
        # races and the primary lands wherever one gets there first (observed
        # with primaryLocation aws-us-east-1: the leader bootstrapped in
        # aws-eu-central-1). Members OUTSIDE the preferred location therefore
        # hold back and let it take the leader lock first.
        #
        # This is a bias, not a lock, and it cannot split the cluster: the DCS
        # is the arbiter, so whoever loses the race finds the `initialize` key
        # already set and clones as a replica instead of initialising a second
        # cluster. Giving up early is therefore always safe.
        #
        # Only reached when PGDATA is empty, so every restart of an initialised
        # member skips it entirely.
        #
        # The 90 s ceiling is imposed by the liveness probe, not by taste.
        # Patroni does not bind :8008 until this returns, and the probe kills
        # the container at initialDelaySeconds 60 + failureThreshold 6 x
        # periodSeconds 10 = ~110 s after container start. A longer wait would
        # restart-loop the member instead of placing the primary. If the
        # preferred location is down, slow or misconfigured the wait expires,
        # this member bootstraps, and the log says so in as many words.
        if [ "${LOCATION}" != "{{ .Values.primaryLocation }}" ]; then
          # Every replica index the preferred location runs, from values.
          PREFERRED_INDICES="{{ range $loc := $.Values.global.locations }}{{ if eq $loc.name $.Values.primaryLocation }}{{ range $r := until (int $loc.replicas) }}{{ $r }} {{ end }}{{ end }}{{ end }}"
          BOOTSTRAP_WAIT_SECONDS=90
          BOOTSTRAP_DEADLINE=$(( $(date +%s) + BOOTSTRAP_WAIT_SECONDS ))
          CLUSTER_FOUND=0
          echo "Preferred primary is {{ .Values.primaryLocation }} — waiting up to ${BOOTSTRAP_WAIT_SECONDS}s for it to initialise the cluster"
          while [ "$(date +%s)" -lt "${BOOTSTRAP_DEADLINE}" ]; do
            for PIDX in ${PREFERRED_INDICES}; do
              # Re-check the deadline per host so a location running several
              # replicas cannot overshoot it by one timeout per replica.
              if [ "$(date +%s)" -ge "${BOOTSTRAP_DEADLINE}" ]; then
                break
              fi
              PHOST="replica-${PIDX}.${WORKLOAD_NAME}.{{ .Values.primaryLocation }}.${GVC}.cpln.local"
              # 200 on /primary means this host holds the leader lock.
              if curl -fs --max-time 2 -o /dev/null "http://${PHOST}:8008/primary"; then
                echo "Leader is up at ${PHOST} — joining it as a replica"
                CLUSTER_FOUND=1
                break
              fi
              # 200 on /replica means the cluster is already initialised and the
              # leader is somewhere else. Waiting longer cannot move it.
              if curl -fs --max-time 2 -o /dev/null "http://${PHOST}:8008/replica"; then
                echo "Cluster already initialised (${PHOST} is a replica) — joining it"
                CLUSTER_FOUND=1
                break
              fi
            done
            if [ "${CLUSTER_FOUND}" -eq 1 ]; then
              break
            fi
            sleep 2
          done
          if [ "${CLUSTER_FOUND}" -eq 0 ]; then
            echo "WARNING: no leader in {{ .Values.primaryLocation }} after ${BOOTSTRAP_WAIT_SECONDS}s — bootstrapping here instead. The primary will NOT start in the preferred location; move it later with 'patronictl switchover --candidate'."
          fi
        fi
    {{- end }}
    else
        echo "PGDATA exists — starting Patroni normally"
    fi

    # --- Drop privileges and start Patroni ---
    echo "Dropping privileges to the postgres user..."
    exec gosu postgres patroni "$CONFIG_FILE"
