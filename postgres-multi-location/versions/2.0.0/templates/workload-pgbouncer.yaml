{{- include "pg-ml.validate" . -}}
{{- if .Values.pgbouncer.enabled }}
kind: workload
name: {{ include "pg-ml.pgbouncer.name" . }}
description: PgBouncer connection pooler, present in every location
gvc: {{ .Values.global.cpln.gvc }}
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
spec:
  type: standard
  containers:
    - name: pgbouncer
      image: {{ .Values.pgbouncer.image }}
      inheritEnv: false
      # The upstream entrypoint writes DB_USER/DB_PASSWORD into userlist.txt between
      # double quotes WITHOUT escaping, so a credential containing a quote yields a
      # malformed file and every authentication fails. Write it ourselves first,
      # escaped the way pgbouncer expects (a quote is doubled); the entrypoint then
      # leaves it alone, because it only generates when the user is absent.
      # This must happen at runtime: DB_PASSWORD is a cpln:// reference the platform
      # resolves into the env var, so its value does not exist at render time.
      command: /bin/sh
      args:
        - -c
        - |
          esc() { printf '%s' "$1" | sed 's/"/""/g'; }
          printf '"%s" "%s"\n' "$(esc "$DB_USER")" "$(esc "$DB_PASSWORD")" \
            > /etc/pgbouncer/userlist.txt
          exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
      cpu: {{ .Values.pgbouncer.resources.cpu | quote }}
      memory: {{ .Values.pgbouncer.resources.memory | quote }}
      env:
        # Pools into HAProxy, not into a member directly, so leader routing and
        # failover stay transparent to the pooler.
        - name: DB_HOST
          value: {{ include "pg-ml.proxy.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: cpln://secret/{{ .Values.postgres.credentialsSecretName }}.username
        - name: DB_PASSWORD
          value: cpln://secret/{{ .Values.postgres.credentialsSecretName }}.password
        - name: DB_NAME
          value: cpln://secret/{{ .Values.postgres.credentialsSecretName }}.database
        - name: POOL_MODE
          value: {{ .Values.pgbouncer.poolMode | quote }}
        - name: DEFAULT_POOL_SIZE
          value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
        - name: MAX_CLIENT_CONN
          value: {{ .Values.pgbouncer.maxClientConn | quote }}
        - name: MAX_DB_CONNECTIONS
          value: {{ .Values.pgbouncer.maxDbConnections | quote }}
        - name: AUTH_TYPE
          value: plain
      ports:
        - number: 5432
          protocol: tcp
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "pg-ml.identity.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 0        # a GVC location this release did not ask for runs NOTHING
      metric: disabled
      minScale: 0        # localOptions below supplies the real counts
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    # A full override, not a patch — written in full; see the Patroni workload.
    {{- range $location := .Values.global.locations }}
    - location: //location/{{ $location.name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: {{ $.Values.pgbouncer.maxReplicas | int }}
        metric: rps
        minScale: {{ $.Values.pgbouncer.minReplicas | int }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  firewallConfig:
    {{- /* the empty lists are API backfills, declared so rendered == stored */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if eq .Values.internalAccess.type "workload-list" }}
      {{- /*
        This list governs ALL inbound internal traffic to the pooler. Your
        application clients belong here; this release's own workloads are
        appended so the tier is never cut off from the rest of the stack.
        The chart appends its own workloads rather than requiring the user to
        know — see pg-ml.ownWorkloadLinks.
      */}}
      {{- $own := splitList "\n" (trim (include "pg-ml.ownWorkloadLinks" .)) }}
      inboundAllowWorkload:
        {{- include "pg-ml.ownWorkloadLinks" . | nindent 8 }}
        {{- range .Values.internalAccess.workloads }}
        {{- if not (has (printf "- %s" .) $own) }}
        - {{ . }}
        {{- end }}
        {{- end }}
      {{- else if .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- else }}
      inboundAllowWorkload: []   # API backfill, declared so rendered == stored
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
{{- end }}
