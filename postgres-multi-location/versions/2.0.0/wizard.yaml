# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: PostgreSQL (multi-location)
# The chart fails below 2 listed locations, every listed location must be one of the GVC's, and GVC
# locations it does not list run nothing (defaultOptions scale 0 on every long-running tier), so the
# GVC needs at least 2.
gvc:
  minLocations: 2

# No `imports`: the bundled etcd-multi-location 2.0.0 is bound as parent fields under `etcd.` below,
# because grafana-multi-location imports this descriptor and nested imports are not supported (guide
# §16.10). The etcd chart's own checks are restated as parent rules without `mirrors` (their defines
# live in the subchart's _helpers.tpl).

steps:
  - id: locations
    title: Locations
    description: The locations the cluster spans, the Patroni members in each, and where the primary should run.
    sections:
      - id: locations
        title: Locations
        docs: "#locations-and-quorum"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.0.0') < 0
            text: >-
              Do not upgrade a 1.x release in place: 1.x created its own GVC, and this upgrade deletes it with
              every workload, volume set and identity in it, including the database volumes. Install 2.0.0 as a
              new release into an existing GVC, restore a dump of the old cluster into it, move your
              applications, then uninstall the old release. See
              [Migrating from version 1](#migrating-from-version-1).
          - type: note
            severity: warning
            when: context.mode == 'install'
            text: >-
              Migrating from a 1.x release? Install into an existing GVC other than the one the 1.x release
              created: that GVC still belongs to the old release, and uninstalling the old release deletes it
              with this release's workloads inside. See [Migrating from version 1](#migrating-from-version-1).
          - type: note
            severity: warning
            textExpression: >-
              'Every location you list must already be a location of the GVC you install into (check with ' +
              '`cpln gvc get ' + (context.gvc != null ? context.gvc : 'GVC_NAME') + ' -o yaml`, under ' +
              '`spec.staticPlacement.locationLinks`). On a fresh install the members read the GVC and refuse to ' +
              'start while one is missing, with a `[patroni] FATAL:` line in `cpln logs`. After a fresh install ' +
              'allow about two minutes before believing a member is unreachable: service discovery across ' +
              'regions can lag a ready member.'
            text: >-
              Every location you list must already be a location of the GVC you install into (check with
              `cpln gvc get GVC_NAME -o yaml`, under `spec.staticPlacement.locationLinks`). On a fresh install the
              members read the GVC and refuse to start while one is missing, with a `[patroni] FATAL:` line in
              `cpln logs`. After a fresh install allow about two minutes before believing a member is
              unreachable: service discovery across regions can lag a ready member.
          - type: note
            when: size(self.global.locations) >= 2
            text: >-
              The consensus store runs one etcd member per location, and the primary is promoted only while a
              majority of them agree.
            textExpression: >-
              string(size(self.global.locations)) + ' locations: the consensus store needs ' +
              string(size(self.global.locations) / 2 + 1) + ' of its ' + string(size(self.global.locations)) +
              ' members, one per location, to agree, so ' +
              ((size(self.global.locations) - 1) / 2 == 0 ?
              'losing either location leaves the survivor read-only until you promote it by hand.' :
              'automatic failover survives losing ' + string((size(self.global.locations) - 1) / 2) +
              ((size(self.global.locations) - 1) / 2 == 1 ? ' location.' : ' locations.'))
          - type: note
            when: >-
              context.gvcLocations != null && self.global.locations.exists(l, l.name != '') &&
              context.gvcLocations.exists(g, !(g in self.global.locations.map(l, l.name)))
            text: GVC locations not listed here run nothing from this release.
            textExpression: >-
              'GVC locations not listed here run nothing from this release: ' +
              context.gvcLocations.filter(g, !(g in self.global.locations.map(l, l.name))).join(', ') + '.'
          - path: global.locations
            type: list
            label: Locations
            required: true
            minItems: 2
            uniqueBy: [name]
            widget: table
            newItem: { name: "", replicas: 1 }
            itemLabel: "(item.name == null ? '' : item.name) + (item.replicas == null ? '' : ' × ' + string(item.replicas))"
            description: >-
              Members is the number of PostgreSQL members in that location. etcd always runs one member per
              location and ignores it.
            help: >-
              Three locations give automatic failover, five survive losing two, and two give a warm standby
              with manual promotion (see
              [Recovering from a lost location](#recovering-from-a-lost-location)). To remove a location,
              remove it from this list and from the GVC; there is no per-location suspend. For a cluster in a
              single location, use the postgres-highly-available template instead. Replication across locations
              is asynchronous, so a failover can lose the most recent transactions, and every member outside the
              primary's location receives the full WAL stream as billed cross-region traffic.
            item:
              type: object
              fields:
                - path: name
                  type: ref
                  label: Location
                  required: true
                  ref: { kind: location, scope: gvc, format: name, mustExist: error }
                - path: replicas
                  type: integer
                  label: Members
                  required: true
                  min: 1
                  suggestions: [1, 2, 3]
              rules:
                - when: context.mode == 'install'
                  rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
                  paths: [name]
                  message: >-
                    This location is not one of the target GVC's locations: no member can run there, and on a
                    fresh install every member that can read the GVC then refuses to start. Add the location to
                    the GVC, or pick another.
                  messageExpression: >-
                    item.name + ' is not one of the locations of the target GVC: no member can run there, and on a fresh install every member that can read the GVC then refuses to start. Add the location to the GVC, or pick another.'
                - when: context.mode == 'upgrade'
                  rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
                  severity: info
                  paths: [name]
                  message: >-
                    This location is not one of the GVC's locations, so no member runs there; the members
                    already running keep running and log a warning, and failover stops if the missing locations
                    cost the consensus store its majority. Add the location to the GVC, or remove it from the list.
                  messageExpression: >-
                    item.name + ' is not one of the locations of the GVC, so no member runs there; the members already running keep running and log a warning, and failover stops if the missing locations cost the consensus store its majority. Add the location to the GVC, or remove it from the list.'
                # pg-ml.validate refuses replicas below 1 (`int` of a missing key is 0 too); `min` and
                # `required` say it on the field, this rule carries the mirror.
                - rule: item.replicas == null || item.replicas >= 1
                  mirrors: pg-ml.validate
                  paths: [replicas]
                  message: >-
                    Every location runs at least one member. To stop running in a location, remove it from the
                    list; there is no per-location suspend.
            rules:
              - rule: size(self.global.locations) >= 2
                mirrors: pg-ml.validate
                message: >-
                  The cluster needs at least 2 locations: the bundled consensus store is itself stretched across
                  locations. For a single-location cluster, use the postgres-highly-available template.
              - rule: size(self.global.locations) != 2
                severity: info
                message: >-
                  Two locations give a warm standby, not automatic failover: after losing either one, the
                  surviving replica holds current data but stays read-only until you promote it by hand. Three
                  locations survive losing one.
              - rule: size(self.global.locations) < 4 || size(self.global.locations) % 2 == 1
                severity: info
                message: >-
                  An even number of locations survives no more location losses than one location fewer; 3
                  survives losing one, 5 survives losing two.
              - rule: >-
                  oldSelf == null || size(oldSelf.global.locations) == 0 ||
                  (size(self.global.locations) == size(oldSelf.global.locations) &&
                  self.global.locations.all(l, oldSelf.global.locations.exists(o, o.name == l.name)))
                severity: info
                message: >-
                  Changing the locations restarts every PostgreSQL and etcd member with a new roster. Plan a
                  maintenance window, and change the GVC's locations together with this list.
      - id: primary
        title: Preferred primary location
        docs: "#preferred-primary-location"
        fields:
          - path: primaryLocation
            type: enum
            label: Preferred primary location
            widget: select
            optionsFrom: self.global.locations.filter(l, l.name != null && l.name != '').map(l, l.name)
            description: Leave it empty for no preference, and the primary starts wherever a member is first.
            help: >-
              On a fresh install the members elsewhere wait up to 90 seconds for this location to initialize
              the cluster, then start it themselves and log a warning. Failover elections favour this location,
              but a restored location does not take the primary back on its own. To move a running primary
              without a restart, use `patronictl switchover`.
            rules:
              - rule: >-
                  self.primaryLocation == null || self.primaryLocation == '' ||
                  self.primaryLocation in self.global.locations.map(l, l.name)
                mirrors: pg-ml.validate
                message: Choose one of the listed locations as the preferred primary location, or leave it empty.
              - rule: >-
                  oldSelf == null || (oldSelf.primaryLocation == null ? '' : oldSelf.primaryLocation) ==
                  (self.primaryLocation == null ? '' : self.primaryLocation)
                severity: info
                message: >-
                  Changing the preferred location restarts every member, about two minutes without writes in
                  every location, and the election that follows moves the primary there. To move the primary
                  without a restart, use patronictl switchover and leave this setting as it is.

  - id: credentials
    title: Credentials
    description: The prerequisite secret with the database user, password and database name.
    fields:
      - type: note
        severity: warning
        text: >-
          The credentials secret must exist **before** you install. If it is missing, the deployment waits on
          it and `cpln logs` shows nothing at all; the reason is under `status.versions[].message` in
          `cpln workload get-deployments RELEASE_NAME-postgres --gvc GVC_NAME`.
        textExpression: >-
          'The credentials secret must exist **before** you install. If it is missing, the deployment waits on it and `cpln logs` shows nothing at all; the reason is under `status.versions[].message` in `cpln workload get-deployments ' +
          context.releaseName + '-postgres --gvc ' + (context.gvc != null ? context.gvc : 'GVC_NAME') + '`. Once the secret exists the deployment recovers on its own within about 10 minutes, or at once with `cpln workload force-redeployment ' +
          context.releaseName + '-postgres --gvc ' + (context.gvc != null ? context.gvc : 'GVC_NAME') + '`.'
      - path: postgres.credentialsSecretName
        type: ref
        label: Database credentials secret
        required: true
        description: >-
          A dictionary secret with the keys `username`, `password` and `database`. The PostgreSQL members,
          the optional pooler and the optional backups all read it.
        help: >-
          PostgreSQL applies these values only when the cluster is first created. Use plain identifiers for
          `username` and `database`: they are used unquoted when the database is created. Create the secret
          with:
          `cpln secret create-dictionary --name SECRET_NAME --entry username=postgres --entry password="$(openssl rand -hex 24)" --entry database=mydb`
        docs: "#credentials"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [username, password, database]
          create:
            suggestName: "context.releaseName + '-postgres-credentials'"
    rules:
      # pg-ml.validate refuses an empty name; `required` says it on the field, this rule carries the mirror.
      - rule: self.postgres.credentialsSecretName != null && self.postgres.credentialsSecretName != ''
        mirrors: pg-ml.validate
        paths: [postgres.credentialsSecretName]
        message: The database credentials secret is required.
      - rule: >-
          oldSelf == null || oldSelf.postgres.credentialsSecretName == null ||
          oldSelf.postgres.credentialsSecretName == '' ||
          self.postgres.credentialsSecretName == oldSelf.postgres.credentialsSecretName
        severity: info
        paths: [postgres.credentialsSecretName]
        message: >-
          PostgreSQL applies the credentials only when the cluster is first created; pointing at another secret
          does not change the existing user or password. Run ALTER ROLE for the user and for repl first so
          the new secret matches, as the Rotating the password steps describe.

  - id: server
    title: PostgreSQL
    description: The Patroni PostgreSQL image and the compute of each member.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'upgrade'
        text: >-
          Every upgrade restarts all members in every location together, also one that changes nothing:
          about two minutes without writes everywhere. Nothing limits the rollout of a stateful workload, so
          plan the upgrade as a short write outage.
      - path: image
        type: string
        format: image
        label: Patroni PostgreSQL image
        required: true
        description: PostgreSQL 17 with Patroni and WAL-G.
        docs: "#image-and-resources"
      - path: resources
        type: resources
        label: Resources
        required: true
        description: Per member.
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
        # workload-patroni-postgres.yaml quotes every key, and Helm prints a plain number of 1000000 or
        # more from a values file in exponent form ("2.147483648e+09"), which the platform refuses.
        rules:
          - rule: >-
              (self.resources.minMemory == null || type(self.resources.minMemory) == string) &&
              (self.resources.maxMemory == null || type(self.resources.maxMemory) == string)
            paths: [resources]
            message: >-
              Write the memory with a unit, such as 1Gi: Helm prints a plain byte count in exponent form, which
              the platform refuses.

  - id: storage
    title: Storage
    description: The volume set that holds each member's data directory.
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per member.
            help: >-
              Uninstalling the release deletes the volume set and takes a final snapshot of each volume, kept
              for 7 days.
            docs: "/reference/volumeset#capacity-and-billing"
      - id: autoscaling
        title: Grow storage automatically
        toggle: volumeset.autoscaling.enabled
        description: Each volume grows by the scaling factor whenever its free space falls below the threshold.
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: oldSelf == null || oldSelf.volumeset.capacity == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volumes.

  - id: network
    title: Network and pooling
    description: Who can connect, the leader-routing proxy and an optional connection pooler.
    sections:
      - title: Database access
        docs: "#internal-access"
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: >-
              Applies to the PostgreSQL members and to the proxy and pooler tiers. The database is never
              published to the internet. Access changes take up to a few minutes to reach every location.
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC, from any of its locations.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below. This release's own workloads can always connect.
          # Shown for every type: the workloads write any non-empty list into inboundAllowWorkload (under
          # same-gvc and same-org without the release's own links), and the platform validates every entry.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            widget: tags
            unique: true
            description: >-
              With Specific workloads, the client workloads allowed to connect; the chart adds this release's
              own workloads itself. The platform also applies the list with Same GVC, for clients in other GVCs.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internalAccess.type == 'same-gvc'
        rules:
          # pg-ml.validate refuses any other type; the options say it on the field, this rule carries the mirror.
          - rule: self.internalAccess.type in ['same-gvc', 'same-org', 'workload-list']
            mirrors: pg-ml.validate
            paths: [internalAccess.type]
            message: Choose Same GVC, Same org or Specific workloads.
          - when: self.internalAccess.type == 'workload-list'
            rule: size(self.internalAccess.workloads) > 0
            severity: warning
            paths: [internalAccess.workloads]
            message: With Specific workloads and an empty list, no client can connect; only this release's own workloads can.
          - when: self.internalAccess.type == 'same-gvc' && context.gvc != null
            rule: "!self.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
            severity: info
            paths: [internalAccess.workloads]
            messageExpression: >-
              'Same GVC already allows every workload in this GVC: ' +
              self.internalAccess.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
              ' can be removed from the list.'
            message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
          - when: self.internalAccess.type == 'same-org'
            rule: size(self.internalAccess.workloads) == 0
            severity: info
            paths: [internalAccess.workloads]
            message: Same org already lets every workload of the org connect, so these entries add nothing.
      # Not a toggle section: the chart runs the proxy when proxy.enabled OR pgbouncer.enabled is on
      # (workload-proxy.yaml:2), so its settings are shown under the same condition.
      - id: proxy
        title: Leader-routing proxy (HAProxy)
        description: >-
          An HAProxy tier in every location that always routes to the current primary, wherever it runs:
          the endpoint applications connect to.
        docs: "#leader-routing-proxy"
        fields:
          - type: note
            when: self.pgbouncer.enabled && !self.proxy.enabled
            text: The connection pooler is on and connects through this proxy, so the proxy runs anyway.
          - type: note
            when: "!self.pgbouncer.enabled && !self.proxy.enabled"
            text: Logical backups (on the Backups step) connect through this proxy, so leave it on if you plan to use them.
          - path: proxy.enabled
            type: boolean
            label: Run the proxy
            description: >-
              Without it, applications must find the primary themselves through the per-member addresses.
          # A floor of 1: the tier serves TCP on 5432, which cannot wake a tier scaled to zero.
          - path: proxy.minReplicas
            type: integer
            label: Minimum replicas per location
            required: true
            when: self.proxy.enabled || self.pgbouncer.enabled
            min: 1
            suggestions: [1, 2, 3, 5]
          - path: proxy.maxReplicas
            type: integer
            label: Maximum replicas per location
            required: true
            when: self.proxy.enabled || self.pgbouncer.enabled
            min: 1
            suggestions: [1, 2, 3, 5]
          - path: proxy.image
            type: string
            format: image
            label: HAProxy image
            required: true
            advanced: true
            when: self.proxy.enabled || self.pgbouncer.enabled
          - path: proxy.resources
            type: resources
            label: HAProxy resources
            required: true
            advanced: true
            when: self.proxy.enabled || self.pgbouncer.enabled
            description: Per replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
            rules:
              - rule: self.proxy.resources.memory == null || type(self.proxy.resources.memory) == string
                paths: [proxy.resources]
                message: >-
                  Write the memory with a unit, such as 128Mi: Helm prints a plain byte count in exponent form,
                  which the platform refuses.
        rules:
          - when: self.proxy.enabled || self.pgbouncer.enabled
            rule: self.proxy.maxReplicas >= self.proxy.minReplicas
            paths: [proxy.maxReplicas]
            message: The maximum replicas of the proxy must be at least its minimum.
      - id: pgbouncer
        title: Connection pooler (PgBouncer)
        toggle: pgbouncer.enabled
        description: >-
          A PgBouncer tier in every location, pooling into that location's proxy. When on, it becomes the
          endpoint applications connect to, and the proxy runs too.
        docs: "#pgbouncer"
        fields:
          - path: pgbouncer.poolMode
            type: enum
            label: Pool mode
            widget: segmented
            required: true
            help: >-
              **Transaction** holds a connection for one transaction: best for most web and API workloads,
              but not compatible with `SET` variables, temporary tables or advisory locks. **Session** holds it
              for the whole client session: compatible with everything, less reuse. **Statement** returns it
              after every statement: transactions are not supported.
            options:
              - { value: session, label: Session }
              - { value: transaction, label: Transaction }
              - { value: statement, label: Statement }
          - path: pgbouncer.defaultPoolSize
            type: integer
            label: Server connections per pool
            required: true
            min: 1
            suggestions: [10, 25, 50, 100]
            description: Per PgBouncer replica.
          - path: pgbouncer.maxClientConn
            type: integer
            label: Max client connections
            required: true
            min: 1
            suggestions: [100, 500, 1000, 5000]
            description: Per PgBouncer replica.
          - path: pgbouncer.maxDbConnections
            type: integer
            label: Max database connections
            required: true
            min: 1
            suggestions: [10, 25, 50, 100]
            description: >-
              Per PgBouncer replica. Replicas do not coordinate, so PostgreSQL can see this many times the
              maximum replicas in every location.
          - path: pgbouncer.minReplicas
            type: integer
            label: Minimum replicas per location
            required: true
            min: 1
            suggestions: [1, 2, 3, 5]
          - path: pgbouncer.maxReplicas
            type: integer
            label: Maximum replicas per location
            required: true
            min: 1
            suggestions: [1, 2, 3, 5]
          - path: pgbouncer.image
            type: string
            format: image
            label: PgBouncer image
            required: true
            advanced: true
          - path: pgbouncer.resources
            type: resources
            label: PgBouncer resources
            required: true
            advanced: true
            description: Per replica.
            cpu: { min: 25m }
            memory: { min: 32Mi }
            rules:
              - rule: self.pgbouncer.resources.memory == null || type(self.pgbouncer.resources.memory) == string
                paths: [pgbouncer.resources]
                message: >-
                  Write the memory with a unit, such as 128Mi: Helm prints a plain byte count in exponent form,
                  which the platform refuses.
        rules:
          # pg-ml.validate refuses another pool mode even with the pooler off; the options say it on the field
          # while the section is on, and the step rule below covers it while the section is off.
          - rule: self.pgbouncer.poolMode in ['session', 'transaction', 'statement']
            mirrors: pg-ml.validate
            paths: [pgbouncer.poolMode]
            message: Choose session, transaction or statement as the pool mode.
          - rule: self.pgbouncer.maxReplicas >= self.pgbouncer.minReplicas
            paths: [pgbouncer.maxReplicas]
            message: The maximum replicas of PgBouncer must be at least its minimum.
          - rule: self.pgbouncer.defaultPoolSize <= self.pgbouncer.maxClientConn
            severity: info
            paths: [pgbouncer.defaultPoolSize]
            message: The pool is larger than the number of client connections PgBouncer accepts.
          # README "PgBouncer connection pooler": max_connections is 100, of which 3 are reserved for
          # superusers; replicas do not coordinate.
          - rule: >-
              size(self.global.locations) * self.pgbouncer.maxReplicas * self.pgbouncer.maxDbConnections < 97
            severity: info
            paths: [pgbouncer.maxDbConnections]
            message: >-
              PostgreSQL accepts 100 connections, 3 of them reserved for superusers, and every PgBouncer replica
              in every location may open up to the max database connections. Under load clients then get
              "remaining connection slots are reserved" instead of waiting. Lower the max database connections
              or the maximum replicas.
            messageExpression: >-
              'Up to ' + string(size(self.global.locations) * self.pgbouncer.maxReplicas * self.pgbouncer.maxDbConnections) +
              ' server connections (' + string(size(self.global.locations)) + ' locations × ' +
              string(self.pgbouncer.maxReplicas) + ' replicas × ' + string(self.pgbouncer.maxDbConnections) +
              ') against the 97 PostgreSQL accepts from non-superusers. Under load clients then get "remaining connection slots are reserved" instead of waiting. Lower the max database connections or the maximum replicas.'
    rules:
      - when: "!self.pgbouncer.enabled"
        rule: self.pgbouncer.poolMode in ['session', 'transaction', 'statement']
        mirrors: pg-ml.validate
        paths: [pgbouncer.enabled]
        message: >-
          The pool mode must be session, transaction or statement, and the chart checks it even with the
          pooler off. Fix pgbouncer.poolMode in the values.

  - id: backup
    title: Backups
    description: Optional scheduled dumps, or continuous WAL archiving, to object storage.
    sections:
      - id: backup
        title: Backups
        toggle: backup.enabled
        description: >-
          Logical mode runs a nightly pg_dumpall in one location; WAL-G mode archives WAL continuously from
          whichever member is the primary. The bucket and, for AWS S3 and Google Cloud Storage, the cloud
          account must exist before you turn it on.
        docs: "#backups"
        fields:
          - type: note
            severity: warning
            when: >-
              oldSelf != null && oldSelf.backup.enabled == true &&
              (oldSelf.backup.mode == 'wal-g') != (self.backup.mode == 'wal-g')
            text: >-
              Switching to or from WAL-G changes `archive_mode`, so this upgrade restarts PostgreSQL in every
              location. Turning WAL-G on can take about 10 minutes to settle in a location; check that
              `archive_mode` is on in every location before relying on the archive.
          - path: backup.mode
            type: enum
            label: Backup mode
            widget: cards
            required: true
            options:
              - value: logical
                label: Logical dumps
                description: A scheduled pg_dumpall through the proxy, in one location. Portable SQL dumps.
              - value: wal-g
                label: WAL-G
                description: >-
                  A sidecar on every member; only the primary pushes WAL and periodic base backups, for
                  point-in-time recovery.
          - path: backup.location
            type: enum
            label: Run the backup job in
            required: true
            when: self.backup.mode == 'logical'
            optionsFrom: self.global.locations.filter(l, l.name != null && l.name != '').map(l, l.name)
            description: >-
              A cron workload would otherwise run in every location; the job runs only here. Pick the
              location nearest the bucket.
          - path: backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.backup.mode == 'logical'
          - path: backup.walg.intervalSeconds
            type: integer
            label: Time between base backups
            unit: seconds
            required: true
            when: self.backup.mode == 'wal-g'
            min: 1
            suggestions:
              - { value: 3600, label: "3600 (1 hour)" }
              - { value: 21600, label: "21600 (6 hours, default)" }
              - { value: 86400, label: "86400 (1 day)" }
          - path: backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.backup.mode == 'logical'
            description: Tag 17.x.x for PostgreSQL 17, 18.x.x for PostgreSQL 18.
          - path: backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
            description: >-
              The logical backup job, or the WAL-G sidecar next to each member. Google Cloud Storage needs at
              least the default 512Mi of memory.
            cpu: { min: 25m }
            memory: { min: 32Mi }
            rules:
              - rule: self.backup.resources.memory == null || type(self.backup.resources.memory) == string
                paths: [backup.resources]
                message: >-
                  Write the memory with a unit, such as 512Mi: Helm prints a plain byte count in exponent form,
                  which the platform refuses.
              # values.yaml and README: the GCP path is killed at 128Mi with no log output (logical jobs
              # report failed, the wal-g sidecar loops on OOMKilled); 512Mi is what was verified.
              - when: >-
                  self.backup.provider == 'gcp' && self.backup.resources.memory != null &&
                  type(self.backup.resources.memory) == string
                rule: memoryBytes(self.backup.resources.memory) >= 536870912
                severity: info
                paths: [backup.resources]
                message: >-
                  Below 512Mi the Google Cloud Storage path runs out of memory with no log output: logical jobs
                  only report failed, and the WAL-G sidecar restarts in a loop while no base backup is taken.
        rules:
          # pg-ml.validateBackup: the options say the mode and provider on their fields; these carry the mirror.
          - rule: self.backup.mode in ['logical', 'wal-g']
            mirrors: pg-ml.validateBackup
            paths: [backup.mode]
            message: Choose logical or wal-g as the backup mode.
          - rule: self.backup.provider in ['aws', 'gcp', 'minio']
            mirrors: pg-ml.validateBackup
            paths: [backup.provider]
            message: Choose aws, gcp or minio as the backup destination.
          - when: self.backup.mode == 'logical'
            rule: self.proxy.enabled || self.pgbouncer.enabled
            mirrors: pg-ml.validateBackup
            paths: [backup.mode]
            message: >-
              Logical backups dump the current primary through the leader-routing proxy. Turn on Run the proxy
              under Network and pooling, or choose WAL-G.
          - when: self.backup.mode == 'logical'
            rule: >-
              self.backup.location == null || self.backup.location == '' ||
              self.backup.location in self.global.locations.map(l, l.name)
            mirrors: pg-ml.validateBackup
            paths: [backup.location]
            message: >-
              The backup job must run in one of the listed locations; it is suspended everywhere else and would
              never run.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        docs: "#aws-s3"
        fields:
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) for the AWS account that holds the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              The policy needs the S3 actions listed under [AWS S3](#aws-s3), on the bucket and on its
              objects. The backup identity carries only `cpln-connector` and this policy, so an action missing
              from it is missing for the backups.
            pattern: '^[A-Za-z0-9+=,.@_-]+$'
            patternMessage: "Enter the name of your IAM policy, using letters, digits and + = , . @ _ -."
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        docs: "#gcs"
        fields:
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin
              role on the project. The chart also grants the backup identity Storage Object Admin on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.backup.enabled && self.backup.provider == 'minio'
        docs: "#minio"
        fields:
          - type: note
            severity: warning
            when: self.backup.mode == 'wal-g'
            text: >-
              With WAL-G every member reads the archive when it starts, so the endpoint must be reachable from
              every location. A MinIO workload in only one location leaves the members elsewhere restarting
              indefinitely while the primary keeps serving. Use an endpoint present in every location, or AWS
              S3 or Google Cloud Storage.
          - path: backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio.my-gvc.cpln.local:9000
            description: >-
              The S3 API address including the port. For a workload in a GVC use its full internal name,
              `WORKLOAD.GVC.cpln.local`.
          - path: backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: backup.minio.credentialsSecretName
            type: ref
            label: MinIO credentials secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            help: >-
              It must exist before you turn backups on: while it is missing, the deployment waits on it and
              `cpln logs` shows nothing. Create it with:
              `cpln secret create-dictionary --name SECRET_NAME --entry accessKey=MINIO_ACCESS_KEY --entry secretKey=MINIO_SECRET_KEY`
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
              create:
                suggestName: "context.releaseName + '-postgres-minio-credentials'"
          - path: backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.

  - id: etcd
    title: Consensus (etcd)
    description: The bundled etcd cluster, one member per location, that Patroni uses to elect the primary.
    sections:
      - title: etcd members
        docs: "#etcd-consensus-store"
        fields:
          - type: note
            when: context.mode == 'upgrade'
            text: >-
              A restart of the etcd tier costs about 20 seconds of writes; the cluster recovers on its own.
          - path: etcd.image
            type: string
            format: image
            label: etcd image
            required: true
          - path: etcd.resources
            type: resources
            label: etcd resources
            required: true
            description: Per member.
            cpu: { min: 25m }
            memory: { min: 32Mi }
            rules:
              - rule: self.etcd.resources.memory == null || type(self.etcd.resources.memory) == string
                paths: [etcd.resources]
                message: >-
                  Write the memory with a unit, such as 512Mi: Helm prints a plain byte count in exponent form,
                  which the platform refuses.
          - path: etcd.volumeset.capacity
            type: integer
            label: etcd initial capacity
            unit: GiB
            required: true
            description: Per member.
            # etcd-multi-location's volume set is general-purpose-ssd, which the platform allows from 10 to
            # 65536 GiB.
            min: 10
            max: 65536
            suggestions: [10, 20, 50]
        rules:
          - rule: oldSelf == null || oldSelf.etcd.volumeset.capacity == null || self.etcd.volumeset.capacity >= oldSelf.etcd.volumeset.capacity
            paths: [etcd.volumeset.capacity]
            message: Keep the etcd capacity at or above the installed value. Lowering it would not shrink the existing volumes.
      - id: raft
        title: Raft timers
        description: >-
          The defaults suit locations up to about 250 ms apart. Raise both in proportion for locations further
          apart.
        docs: "/template-catalog/templates/etcd-multi-location#raft-tuning"
        fields:
          - path: etcd.tuning.heartbeatIntervalMs
            type: integer
            label: Heartbeat interval
            required: true
            description: About 0.5 to 1.5 times the worst round trip between your locations.
            unit: ms
            # etcd refuses a heartbeat of 0, and no heartbeat above 5000 leaves an election timeout under
            # etcd-multi-location's 50000 cap at 10 times the heartbeat.
            min: 1
            max: 5000
          - path: etcd.tuning.electionTimeoutMs
            type: integer
            label: Election timeout
            required: true
            description: The defaults detect a dead etcd leader in about 5 seconds across US and EU regions.
            unit: ms
            max: 50000
        rules:
          # etcd-ml.validate (subchart): election >= 10 x heartbeat.
          - when: self.etcd.tuning.heartbeatIntervalMs <= 5000
            rule: self.etcd.tuning.electionTimeoutMs >= 10 * self.etcd.tuning.heartbeatIntervalMs
            paths: [etcd.tuning.electionTimeoutMs]
            message: >-
              The etcd election timeout must be at least 10 times the heartbeat interval; a shorter one makes
              members campaign over ordinary heartbeat jitter.
            messageExpression: >-
              'The etcd election timeout must be at least ' + string(10 * self.etcd.tuning.heartbeatIntervalMs) +
              ' ms, 10 times the heartbeat interval; a shorter one makes members campaign over ordinary heartbeat jitter.'
      - id: compaction
        title: Compaction and quota
        description: >-
          Patroni renews its leader lease every few seconds and every renewal is an etcd revision, so etcd
          grows with time alone until compaction removes old revisions. Compaction cannot be turned off.
        docs: "/template-catalog/templates/etcd-multi-location#compaction-and-backend-growth"
        fields:
          - path: etcd.tuning.autoCompactionMode
            type: enum
            label: Compaction mode
            widget: segmented
            required: true
            options:
              - { value: periodic, label: Periodic, description: Keep a time window of history. }
              - { value: revision, label: Revision, description: Keep a number of revisions. }
          - path: etcd.tuning.autoCompactionRetention
            type: string
            label: Compaction retention
            required: true
            description: >-
              How much history to keep: a duration in periodic mode (`1h`, `24h`), a number of revisions in
              revision mode.
            # etcd-ml.validateCompaction refuses ^0+[a-zA-Z]*$; a zero with decimals (0.0h) is zero too.
            pattern: '^(?!0+([.]0+)?[a-zA-Z]*$)'
            patternMessage: 'Use a retention above 0: a retention of 0 turns compaction off.'
          # A quota of 1000000 or more must be a quoted string: Helm prints a plain number that large in
          # exponent form, and etcd-ml.validateCompaction refuses it. The chart accepts a string of digits.
          - id: etcdQuotaLimit
            virtual: true
            type: enum
            label: Backend quota
            widget: segmented
            required: true
            init: >-
              type(self.etcd.tuning.quotaBackendBytes) == string ?
              (self.etcd.tuning.quotaBackendBytes == '4294967296' ? 'gib4' :
              self.etcd.tuning.quotaBackendBytes == '8589934592' ? 'gib8' : 'custom') :
              (type(self.etcd.tuning.quotaBackendBytes) == int && self.etcd.tuning.quotaBackendBytes == 0 ? 'default' : 'custom')
            description: etcd goes read-only when its backend reaches the quota.
            help: >-
              Leave it at the etcd default unless the keyspace outgrows 2 GiB; 8 GiB is etcd's own suggested
              maximum. Compaction does not shrink a backend that has already reached its quota.
            options:
              - { value: default, label: 2 GiB (etcd default), set: { etcd.tuning.quotaBackendBytes: 0 } }
              - { value: gib4, label: 4 GiB, set: { etcd.tuning.quotaBackendBytes: "4294967296" } }
              - { value: gib8, label: 8 GiB, set: { etcd.tuning.quotaBackendBytes: "8589934592" } }
              - { value: custom, label: Custom, description: "Another byte count, entered below." }
          - path: etcd.tuning.quotaBackendBytes
            type: yaml
            yamlType: any
            label: Custom quota
            required: true
            when: ui.etcdQuotaLimit == 'custom'
            description: 'A plain byte count in quotes, such as `"6442450944"` for 6 GiB.'
            rules:
              - rule: >-
                  type(self.etcd.tuning.quotaBackendBytes) == int ||
                  (type(self.etcd.tuning.quotaBackendBytes) == string && self.etcd.tuning.quotaBackendBytes.matches('^-?[0-9]+$'))
                message: >-
                  The etcd quota must be a plain byte count with no unit, such as "8589934592": etcd takes no
                  size suffix.
              - rule: >-
                  !(type(self.etcd.tuning.quotaBackendBytes) == int && self.etcd.tuning.quotaBackendBytes < 0) &&
                  !(type(self.etcd.tuning.quotaBackendBytes) == string && self.etcd.tuning.quotaBackendBytes.matches('^-0*[1-9][0-9]*$'))
                message: >-
                  The etcd quota must not be negative: etcd reads a negative quota as no quota at all. Choose
                  2 GiB (etcd default) for etcd's own limit.
              - rule: type(self.etcd.tuning.quotaBackendBytes) != int || self.etcd.tuning.quotaBackendBytes < 1000000
                message: >-
                  Write an etcd quota of 1000000 or more as a quoted string, such as "8589934592": Helm prints a
                  plain number that large in exponent form, which the chart refuses.
              # Sprig int64 turns "08589934592" and a 20-digit string into 0, so the chart passes them, and
              # etcd then reads a leading 0 as octal and refuses anything past 64 bits.
              - rule: >-
                  type(self.etcd.tuning.quotaBackendBytes) != string ||
                  !self.etcd.tuning.quotaBackendBytes.matches('^-?[0-9]+$') ||
                  self.etcd.tuning.quotaBackendBytes.matches('^-?(0|[1-9][0-9]{0,17})$')
                message: >-
                  Write the etcd quota as a plain decimal count without leading zeros and with at most 18
                  digits: etcd reads a leading 0 as an octal number.
              # The backend lives on the member's volume, which the platform caps at 65536 GiB.
              - when: >-
                  type(self.etcd.tuning.quotaBackendBytes) == string &&
                  self.etcd.tuning.quotaBackendBytes.matches('^[1-9][0-9]{0,17}$')
                rule: int(self.etcd.tuning.quotaBackendBytes) <= 70368744177664
                message: >-
                  The etcd quota cannot exceed 65536 GiB (70368744177664), the largest volume a member can have.
                  Use a smaller quota, such as "8589934592".
              - when: >-
                  type(self.etcd.tuning.quotaBackendBytes) == string &&
                  self.etcd.tuning.quotaBackendBytes.matches('^[1-9][0-9]{0,17}$') &&
                  int(self.etcd.tuning.quotaBackendBytes) <= 70368744177664
                rule: int(self.etcd.tuning.quotaBackendBytes) <= 8589934592
                severity: info
                message: >-
                  The etcd quota is above 8 GiB (8589934592), etcd's own suggested maximum; etcd warns about it at
                  startup.
              - rule: >-
                  !(type(self.etcd.tuning.quotaBackendBytes) == int && self.etcd.tuning.quotaBackendBytes > 0 &&
                  self.etcd.tuning.quotaBackendBytes < 2147483648) &&
                  !(type(self.etcd.tuning.quotaBackendBytes) == string &&
                  self.etcd.tuning.quotaBackendBytes.matches('^[1-9][0-9]{0,17}$') &&
                  int(self.etcd.tuning.quotaBackendBytes) < 2147483648)
                severity: info
                message: >-
                  The etcd quota is below etcd's default of 2 GiB, so the backend goes read-only sooner. Choose
                  2 GiB (etcd default) unless you mean to cap it lower.
              - when: >-
                  self.etcd.volumeset.capacity != null && type(self.etcd.tuning.quotaBackendBytes) == string &&
                  self.etcd.tuning.quotaBackendBytes.matches('^[1-9][0-9]{0,17}$')
                rule: int(self.etcd.tuning.quotaBackendBytes) < self.etcd.volumeset.capacity * 1073741824
                severity: info
                message: >-
                  The etcd quota is not below each etcd member's volume capacity, so the volume fills up before
                  the quota stops writes. Raise the etcd initial capacity, or lower the quota.
        rules:
          # etcd-ml.validateCompaction (subchart).
          - when: self.etcd.tuning.autoCompactionMode == 'periodic'
            rule: self.etcd.tuning.autoCompactionRetention.matches('^[0-9]+([.][0-9]+)?(ns|us|ms|s|m|h)$')
            paths: [etcd.tuning.autoCompactionRetention]
            message: >-
              In periodic mode the compaction retention is one number with one unit, such as 1h, 30m or 24h;
              etcd reads a bare number as hours.
          - when: self.etcd.tuning.autoCompactionMode == 'revision'
            rule: self.etcd.tuning.autoCompactionRetention.matches('^[0-9]+$')
            paths: [etcd.tuning.autoCompactionRetention]
            message: In revision mode the compaction retention is a plain revision count, such as 10000.
          # etcd 3.6: a retention that rounds to 0 creates no compactor, and one below 10ns crashes it at startup.
          - when: >-
              self.etcd.tuning.autoCompactionMode == 'periodic' &&
              self.etcd.tuning.autoCompactionRetention.matches('^[0-9]+([.][0-9]+)?(ns|us|ms|s|m|h)$')
            rule: duration(self.etcd.tuning.autoCompactionRetention) >= duration('10ns')
            paths: [etcd.tuning.autoCompactionRetention]
            message: >-
              A periodic compaction retention must be at least 10ns: etcd turns compaction off when the retention
              rounds to 0, and crashes at startup below 10ns. Use a duration such as 1h.
          - when: >-
              self.etcd.tuning.autoCompactionMode == 'periodic' &&
              self.etcd.tuning.autoCompactionRetention.matches('^[0-9]+([.][0-9]+)?(ns|us|ms|s|m|h)$')
            rule: duration(self.etcd.tuning.autoCompactionRetention) <= duration('2562047h')
            paths: [etcd.tuning.autoCompactionRetention]
            message: >-
              etcd cannot read a periodic compaction retention above 2562047h (about 292 years). Use a duration
              such as 24h.
          - when: >-
              self.etcd.tuning.autoCompactionMode == 'revision' &&
              self.etcd.tuning.autoCompactionRetention.matches('^[0-9]+$')
            rule: self.etcd.tuning.autoCompactionRetention.matches('^0*[0-9]{1,18}$')
            paths: [etcd.tuning.autoCompactionRetention]
            message: >-
              Keep the revision count to 18 digits, which keeps it inside the 64-bit integer etcd reads; etcd
              cannot start with a count past that integer.
      - title: Who can connect to etcd
        docs: /reference/workload/firewall
        fields:
          - path: etcd.internalAccess.type
            type: enum
            label: Who can connect to etcd
            widget: cards
            required: true
            description: >-
              etcd here has no TLS and no authentication: every workload allowed here can read and write the
              cluster state Patroni keeps in it.
            options:
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below, and the etcd members themselves.
          - path: etcd.internalAccess.workloads
            type: list
            label: Allowed etcd clients
            widget: tags
            unique: true
            description: >-
              With Specific workloads, every workload that reaches etcd, this release's PostgreSQL workload
              included: etcd adds only its own members.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.etcd.internalAccess.type == 'same-gvc'
        rules:
          - when: self.etcd.internalAccess.type == 'workload-list' && context.gvc != null
            rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-postgres') in self.etcd.internalAccess.workloads
            severity: warning
            paths: [etcd.internalAccess.workloads]
            messageExpression: >-
              'Add //gvc/' + context.gvc + '/workload/' + context.releaseName +
              '-postgres to the etcd clients, or Patroni cannot reach etcd and no member becomes the primary.'
            message: Add this release's PostgreSQL workload to the etcd clients, or Patroni cannot reach etcd and no member becomes the primary.
            fix:
              path: etcd.internalAccess.workloads
              items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-postgres']"
          - when: self.etcd.internalAccess.type == 'same-gvc' && context.gvc != null
            rule: >-
              !self.etcd.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))
            severity: info
            paths: [etcd.internalAccess.workloads]
            message: Same GVC already lets every workload in this GVC reach etcd, so those entries can be removed from the list.
          - when: self.etcd.internalAccess.type == 'same-org'
            rule: size(self.etcd.internalAccess.workloads) == 0
            severity: info
            paths: [etcd.internalAccess.workloads]
            message: Same org already lets every workload of the org reach etcd, so these entries add nothing.
      - id: recovery
        title: Disaster recovery
        when: >-
          context.mode == 'upgrade' ||
          (self.etcd.recovery.forceNewClusterInLocation != null && self.etcd.recovery.forceNewClusterInLocation != '')
        description: >-
          Emergency only, after the consensus store lost its majority for good (with two locations, the loss
          of either one): the etcd member in one surviving location restarts as a new single-member cluster.
        docs: "#recovering-from-a-lost-location"
        fields:
          - type: note
            severity: warning
            when: self.etcd.recovery.forceNewClusterInLocation != null && self.etcd.recovery.forceNewClusterInLocation != ''
            text: >-
              Once PostgreSQL accepts writes again, clear this setting with the next upgrade: while it is set,
              the etcd member forces a new cluster on every restart. Reset the volumes of the lost location's
              members before they rejoin.
          - path: etcd.recovery.forceNewClusterInLocation
            type: enum
            label: Force a new etcd cluster in
            widget: select
            optionsFrom: self.global.locations.filter(l, l.name != null && l.name != '').map(l, l.name)
            description: The surviving location. Leave it empty in normal operation.
            help: >-
              With three or more locations this is never needed: losing one location is an automatic failover.
              If the lost location is coming back, wait: a member that returns with its volume intact rejoins on
              its own.
            rules:
              # etcd-ml.validate (subchart): the location must be one of global.locations.
              - when: self.etcd.recovery.forceNewClusterInLocation != null && self.etcd.recovery.forceNewClusterInLocation != ''
                rule: self.etcd.recovery.forceNewClusterInLocation in self.global.locations.map(l, l.name)
                message: Choose one of the listed locations, or leave it empty.
              - when: >-
                  context.gvcLocations != null &&
                  self.etcd.recovery.forceNewClusterInLocation != null && self.etcd.recovery.forceNewClusterInLocation != ''
                rule: self.etcd.recovery.forceNewClusterInLocation in context.gvcLocations
                severity: warning
                message: >-
                  The GVC does not have this location, so no etcd member runs there and the new cluster is never
                  forced. Pick a location the GVC has.
              - when: context.mode == 'install'
                rule: self.etcd.recovery.forceNewClusterInLocation == null || self.etcd.recovery.forceNewClusterInLocation == ''
                severity: warning
                message: >-
                  Forcing a new etcd cluster is an emergency step for a running release that lost its majority
                  for good; a fresh install has nothing to recover, and the member would force a new cluster on
                  every restart. Leave it empty.

rules:
  - rule: context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '2.0.0') >= 0
    message: >-
      Do not upgrade a 1.x release to 2.0.0: the upgrade deletes the GVC that the 1.x chart created, with every
      workload, volume set and identity in it, including the database volumes. Install 2.0.0 as a new release
      in an existing GVC (not the one the 1.x release created), restore a dump of the old cluster into it, move
      your applications, then uninstall the old release.
  - rule: "!has(self.global.gvc)"
    mirrors: pg-ml.validateNoLegacyGvc
    paths: [global.locations]
    message: >-
      The global.gvc key was removed in 2.0.0: the chart deploys into the GVC you install into, and
      global.gvc.locations moved to global.locations. Remove global.gvc from the values. Never upgrade a 1.x
      release in place; install 2.0.0 as a new release.

migrations:
  # 1.x created its own GVC and kept the roster under global.gvc; 2.0.0 deploys into the GVC you install into.
  - fromVersions: "<2.0.0"
    from: global.gvc.locations
    to: global.locations
  - fromVersions: "<2.0.0"
    from: global.gvc.name
    note: 2.0.0 deploys into the GVC you install into and no longer creates one; there is nothing to name.
