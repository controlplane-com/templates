{{- include "pg-ml.validate" . -}}
{{- if or .Values.proxy.enabled .Values.pgbouncer.enabled }}
kind: secret
name: {{ include "pg-ml.secretProxyStartup.name" . }}
description: HAProxy startup script for PostgreSQL multi-location
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env sh
    set -eu

    LOCATION="$(basename "${CPLN_LOCATION:-}")"
    if [ -z "${LOCATION}" ]; then
      echo "ERROR: CPLN_LOCATION is empty; cannot derive location"
      exit 1
    fi

    # From the runtime built-in, not from Helm: this chart no longer creates or
    # names a GVC, so a render-time name could only ever drift from where the
    # workload actually runs.
    GVC="${CPLN_GVC:-}"
    if [ -z "${GVC}" ]; then
      echo "ERROR: CPLN_GVC is empty; cannot derive member hostnames"
      exit 1
    fi
    WORKLOAD_NAME="{{ include "pg-ml.name" . }}"

    # The cluster roster, rendered at template time as "location:replicas" pairs
    # — the SAME list the Patroni workload's localOptions are built from, so the
    # backend list and the members can never disagree.
    TOPOLOGY="{{- range $loc := .Values.global.locations }}{{ $loc.name }}:{{ $loc.replicas }} {{ end }}"

    # Every Patroni member in EVERY location, as "<server-name>|<host>" pairs.
    # Each proxy tier knows about the whole cluster, so whichever location holds
    # the primary, every proxy reaches it.
    ENDPOINTS=""
    for T in ${TOPOLOGY}; do
      T_LOC="${T%%:*}"
      T_N="${T##*:}"
      T_I=0
      while [ "${T_I}" -lt "${T_N}" ]; do
        ENDPOINTS="${ENDPOINTS}pg-${T_LOC}-${T_I}|replica-${T_I}.${WORKLOAD_NAME}.${T_LOC}.${GVC}.cpln.local "
        T_I=$((T_I + 1))
      done
    done

    echo "Starting HAProxy Patroni leader proxy in ${LOCATION}"
    echo "Cluster endpoints: ${ENDPOINTS}"

    CFG="/tmp/haproxy.cfg"

    SERVERS=""
    for E in ${ENDPOINTS}; do
      SRV_NAME="${E%%|*}"
      SRV_HOST="${E##*|}"
      SERVERS="${SERVERS}
      server ${SRV_NAME} ${SRV_HOST}:5432 check port 8008"
    done

    # ─── Startup: runtime DNS, not a hard gate ──────────────────────────────
    # The mesh DNS never returns NXDOMAIN: a name that is not registered yet
    # gets a placeholder address. HAProxy therefore re-resolves every server at
    # runtime (the `resolvers mesh` section below), so an early wrong answer
    # heals itself and a member that comes up later is picked up without a
    # restart. Earlier versions instead waited here for EVERY member to answer,
    # which on an upgrade (when the members are rolling too) kept the new proxy
    # from listening for minutes after the old one had been retired. Now it
    # waits at most 120s for ANY member's Patroni API, then starts regardless;
    # the readiness probe (/healthz: a leader is routable) is what keeps traffic
    # off a proxy that cannot reach the primary yet.
    # The haproxy image ships no curl/wget, so probe with perl. ANY HTTP status
    # (200 and 503 alike) proves the address is a real Patroni.
    probe_patroni() {
      perl -e '
        use IO::Socket::INET;
        my ($host) = @ARGV;
        my $s = IO::Socket::INET->new(
          PeerAddr => $host, PeerPort => 8008, Proto => "tcp", Timeout => 3,
        ) or exit 1;
        $s->send("GET /health HTTP/1.0\r\nHost: $host\r\n\r\n") or exit 1;
        my $line;
        eval {
          local $SIG{ALRM} = sub { die "read timeout\n" };
          alarm 3;
          $line = <$s>;
          alarm 0;
        };
        exit((defined $line && $line =~ m|^HTTP/|) ? 0 : 1);
      ' "$1" 2>/dev/null
    }

    any_patroni_answers() {
      for E in ${ENDPOINTS}; do
        SRV_HOST="${E##*|}"
        if probe_patroni "${SRV_HOST}"; then
          echo "pg-ml proxy: ${SRV_HOST} answered HTTP on :8008"
          return 0
        fi
      done
      return 1
    }

    WAIT_LIMIT=120
    WAIT_START="$(date +%s)"
    until any_patroni_answers; do
      if [ $(( $(date +%s) - WAIT_START )) -ge "${WAIT_LIMIT}" ]; then
        echo "pg-ml proxy: no Patroni member answered after ${WAIT_LIMIT}s — starting anyway; runtime DNS and health checks route to the leader once it is up"
        break
      fi
      sleep 3
    done
    # ─── End startup ─────────────────────────────────────────────────────────

    cat > "${CFG}" <<EOF
    global
      log stdout format raw local0
      maxconn 4096
      stats socket /tmp/haproxy.sock mode 660 level admin

    defaults
      mode tcp
      log global
      option tcplog
      timeout connect 5s
      timeout client  2m
      timeout server  2m
      timeout check   5s

    resolvers mesh
      parse-resolv-conf
      resolve_retries 3
      timeout resolve 1s
      timeout retry   1s
      # A changed address (a member registering after HAProxy started, or a
      # replica rescheduled onto a new address) is adopted once the old record's
      # hold obsolete period ends, so keep it short. The failure holds are long
      # on purpose: during a DNS blip HAProxy keeps the last good address
      # instead of putting every server into maintenance.
      hold valid    10s
      hold obsolete 30s
      hold other    5m
      hold refused  5m
      hold nx       5m
      hold timeout  5m

    frontend postgres_primary
      bind *:5432
      default_backend patroni_primary

    frontend stats_page
      bind *:8405
      mode http
      stats enable
      stats uri /stats
      stats refresh 10s

    frontend health_status
      bind *:8404
      mode http
      monitor-uri /healthz
      acl no_healthy_backends nbsrv(patroni_primary) lt 1
      monitor fail if no_healthy_backends

    backend patroni_primary
      mode tcp
      option httpchk
      http-check connect port 8008
      http-check send meth GET uri /primary ver HTTP/1.0
      http-check expect status 200
      default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions resolvers mesh resolve-prefer ipv4 init-addr last,libc,none
    ${SERVERS}
    EOF

    echo "Rendered HAProxy config:"
    cat "${CFG}"

    haproxy -c -f "${CFG}"

    exec haproxy -W -db -f "${CFG}"
{{- end }}
