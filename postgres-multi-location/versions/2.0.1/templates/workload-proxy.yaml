{{- include "pg-ml.validate" . -}}
{{- if or .Values.proxy.enabled .Values.pgbouncer.enabled }}
kind: workload
name: {{ include "pg-ml.proxy.name" . }}
description: HAProxy leader-only PostgreSQL endpoint, present in every location
gvc: {{ .Values.global.cpln.gvc }}
tags:
  {{- include "pg-ml.tags" . | nindent 2 }}
spec:
  type: standard
  containers:
    - name: haproxy
      image: {{ .Values.proxy.image }}
      command: /bin/sh
      args:
        - /proxy/start.sh
      inheritEnv: false
      cpu: {{ .Values.proxy.resources.cpu | quote }}
      memory: {{ .Values.proxy.resources.memory | quote }}
      ports:
        - number: 5432
          protocol: tcp
        - number: 8404
          protocol: http
        - number: 8405
          protocol: http
      # Ready once HAProxy is listening (its stats page answers), so an upgrade
      # keeps the old proxy replicas serving until a new one has started. Not
      # /healthz :8404: that fails whenever no leader is routable, and during a
      # failover the platform restarted proxy replicas after each leaderless
      # window, while clients were still routed to them (measured 2026-10-26).
      readinessProbe:
        httpGet:
          path: /stats
          port: 8405
          scheme: HTTP
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
        successThreshold: 1
      volumes:
        - path: /proxy/start.sh
          recoveryPolicy: retain   # API backfill, declared so rendered == stored
          uri: cpln://secret/{{ include "pg-ml.secretProxyStartup.name" . }}.payload
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "pg-ml.identity.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 0        # a GVC location this release did not ask for runs NOTHING
      metric: disabled
      minScale: 0        # localOptions below supplies the real counts
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  localOptions:
    # A full override, not a patch — written in full; see the Patroni workload.
    {{- range $location := .Values.global.locations }}
    - location: //location/{{ $location.name }}
      autoscaling:
        maxConcurrency: 0
        maxScale: {{ $.Values.proxy.maxReplicas | int }}
        metric: rps
        minScale: {{ $.Values.proxy.minReplicas | int }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  firewallConfig:
    {{- /* the empty lists are API backfills, declared so rendered == stored */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if eq .Values.internalAccess.type "workload-list" }}
      {{- /*
        This list governs ALL inbound internal traffic. PgBouncer and the
        nightly logical dump both connect to this tier on 5432, so a list
        naming only clients silently breaks them while every replica reports
        `ready: true`.
        The chart appends its own workloads rather than requiring the user to
        know — see pg-ml.ownWorkloadLinks.
      */}}
      {{- $own := splitList "\n" (trim (include "pg-ml.ownWorkloadLinks" .)) }}
      inboundAllowWorkload:
        {{- include "pg-ml.ownWorkloadLinks" . | nindent 8 }}
        {{- range .Values.internalAccess.workloads }}
        {{- if not (has (printf "- %s" .) $own) }}
        - {{ . }}
        {{- end }}
        {{- end }}
      {{- else if .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- else }}
      inboundAllowWorkload: []   # API backfill, declared so rendered == stored
      {{- end }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
{{- end }}
