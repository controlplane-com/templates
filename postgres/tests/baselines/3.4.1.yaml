# postgres 3.4.1 — the recommended install: credentials in a prerequisite secret.
# Prod shape for this template (one instance on a volumeset, one location) at its default size.
locations: [aws-us-east-1]
timeoutSeconds: 600

generated:
  pgpw: hex

secrets:
  creds:
    type: dictionary
    entries:
      username: e2e
      password: "{gen.pgpw}"
      database: e2e

vars:
  pg_user: e2e
  pg_password: "{gen.pgpw}"
  pg_db: e2e

values:
  config:
    credentialsSecretName: "{secrets.creds.name}"

# 3.2.0 is the version customers run most. Its plaintext config.* keys are refused from 3.4.0 on, so the
# upgrade switches to this baseline's values, with a secret holding the same password, as the README says.
upgradeFrom:
  - version: 3.2.0
    values: new
