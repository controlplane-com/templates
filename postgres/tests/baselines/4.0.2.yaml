# postgres 4.0.2 — the recommended install: credentials in a prerequisite secret.
# Prod shape for this template (one instance on a volumeset, one location) at its default size.
locations: [aws-us-east-1]
timeoutSeconds: 600

generated:
  pgpw: hex

secrets:
  creds:
    type: dictionary
    entries:
      username: e2e
      password: "{gen.pgpw}"
      database: e2e

vars:
  pg_user: e2e
  pg_password: "{gen.pgpw}"
  pg_db: e2e

values:
  config:
    credentialsSecretName: "{secrets.creds.name}"

# 4.0.0 defaults to PostgreSQL 19, so a plain upgrade of a 3.x release (data on PostgreSQL 18) must be
# REFUSED by the boot guard with the data untouched; the upgrade pinned to postgres:18, as the guard's
# message says, then succeeds and the data survives. 3.2.0 is the version customers run most. Its plaintext
# config.* keys are refused from 3.4.0 on, so that upgrade switches to this baseline's values.
upgradeFrom:
  - version: 4.0.1
  - version: 3.4.3
    refused: {timeoutSeconds: 420}
    then: {set: {image: "postgres:18"}}
  - version: 3.2.0
    values: new
    refused: {timeoutSeconds: 420}
    then: {set: {image: "postgres:18"}}
