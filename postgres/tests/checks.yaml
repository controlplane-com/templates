# Feature checks for the postgres template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars
# (pg_user, pg_password, pg_db).
#
# Every connection goes to the replica's own IP, not 127.0.0.1: the image trusts loopback without a
# password, so a loopback connection would pass the auth checks whatever the password was.
# No drift left on a default install (postgres 3.4.2 / redis 3.9.1): drift fails the run, not warns.
driftBlocks: true

checks:
  - id: write-read
    description: A row written over an authenticated TCP connection reads back.
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        set -e
        export PGPASSWORD='{pg_password}'
        H=$(hostname -i | awk '{print $1}')
        M="e2e-$(date +%s%N)"
        psql -h "$H" -U {pg_user} -d {pg_db} -v ON_ERROR_STOP=1 -qtA \
          -c "create table if not exists e2e (id serial primary key, version text not null, marker text not null)" \
          -c "insert into e2e (version, marker) values ('{version}', '$M')" >/dev/null
        psql -h "$H" -U {pg_user} -d {pg_db} -qtA -c "select marker from e2e where marker = '$M'" | grep -qx "$M" && echo "READ $M"
    expect:
      stdout: "^READ e2e-"
    retries: 4
    retryDelaySeconds: 15

  - id: rejects-bad-password
    description: A wrong password is refused over TCP (the control for the check above).
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        H=$(hostname -i | awk '{print $1}')
        PGPASSWORD=wrong-password psql -h "$H" -U {pg_user} -d {pg_db} -c "select 1" 2>&1
        echo "EXIT=$?"
    expect:
      stdout: "password authentication failed"
      notStdout: "^EXIT=0$"

  - id: data-survives-upgrade
    description: >-
      The row written on the version this scenario installed first is still there. On a fresh install
      that is the same version; after an upgrade it proves the data directory carried over.
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        H=$(hostname -i | awk '{print $1}')
        n=$(psql -h "$H" -U {pg_user} -d {pg_db} -qtA -c "select count(*) from e2e where version = '{installed_version}'")
        [ "${n:-0}" -ge 1 ] && echo PERSISTED || echo "MISSING (rows for {installed_version}: ${n:-none})"
    expect:
      stdout: "^PERSISTED$"

  - id: fresh-is-19
    description: A fresh install runs PostgreSQL 19 (an upgrade pinned to an older major keeps that major).
    since: 4.0.0
    scenarios: "^install "
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        H=$(hostname -i | awk '{print $1}')
        echo "SERVER_VERSION_NUM=$(psql -h "$H" -U {pg_user} -d {pg_db} -qtA -c 'show server_version_num')"
    expect:
      stdout: "^SERVER_VERSION_NUM=19[0-9]{4}$"

  - id: guard-passes
    description: >-
      On a matching data directory the major-version guard hands over to PostgreSQL: no guard file, and
      postgres is PID 1 (the guard exec'd the stock entrypoint). The control for guard-holds.
    since: 4.0.0
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        [ -e /tmp/pg-major-guard ] && echo GUARD_FILE_PRESENT || echo NO_GUARD_FILE
        echo "PID1=$(cat /proc/1/comm)"
    expect:
      stdout: "(?s)^NO_GUARD_FILE$.*^PID1=postgres$"

  - id: guard-holds
    description: >-
      A plain upgrade onto PostgreSQL 18 data is held by the guard: the data directory is still 18, no
      postgres process runs, and the guard file names the exact pin.
    since: 4.0.0
    phase: refused
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        echo "DATA=$(cat "$PGDATA/PG_VERSION")"
        grep -qx postgres /proc/[0-9]*/comm && echo POSTGRES_RUNNING || echo NO_POSTGRES
        cat /tmp/pg-major-guard
    expect:
      stdout: "(?s)^DATA=18$.*^NO_POSTGRES$.*REFUSING TO START.*--set image=postgres:18"
    retries: 8
