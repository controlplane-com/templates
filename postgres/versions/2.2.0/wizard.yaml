# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: PostgreSQL
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: server
    title: Server
    description: The compute of the single stateful Postgres replica.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'upgrade'
        text: >-
          Every upgrade restarts the server. Nothing limits the rollout of a stateful workload,
          so plan a short write outage.
      - type: note
        text: >-
          This version runs the image `postgres:17` and lets any workload in this GVC connect on
          port 5432; it has no setting for either. 3.0.0 and later add both.
      - path: resources
        type: resources
        label: Resources
        required: true
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }

  - id: credentials
    title: Credentials
    description: The database user, password and name Postgres creates on first start.
    fields:
      - type: note
        severity: warning
        textExpression: >-
          'This version takes the database credentials as values: they are stored in the Helm release
          and in the secret `' +
          (context.releaseName == null || context.releaseName == '' ? 'RELEASE_NAME' : context.releaseName) +
          '-pg-config`, which the chart creates. 3.4.0 and later read them from a dictionary secret you create instead.'
        text: >-
          This version takes the database credentials as values: they are stored in the Helm release
          and in the secret `RELEASE_NAME-pg-config`, which the chart creates. 3.4.0 and later read
          them from a dictionary secret you create instead.
      - path: config.username
        type: string
        label: Username
        required: true
        immutable: Postgres creates the user once, when the data directory is first initialized.
      - path: config.password
        type: string
        label: Password
        required: true
        sensitive: true
        widget: password
        example: true
        help: >-
          Postgres reads the password only when its data directory is first initialized. To
          change it later, run `ALTER ROLE ... PASSWORD` first and then set the same value here.
      - path: config.database
        type: string
        label: Database name
        required: true
        immutable: Postgres creates the database once, when the data directory is first initialized.
    rules:
      - when: oldSelf == null || self.config.username != oldSelf.config.username
        rule: >-
          [self.config.username].all(x,
            !x.matches('^\\s') && !x.matches('^[!&*%@`\'"\\[\\]{}|>,#]') && !x.matches('^[-?:](\\s|$)') && !x.matches('\\t') &&
            !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
            !(x in ['true','True','TRUE','false','False','FALSE','null','Null','NULL','~']) &&
            !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') && !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
            !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') && !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
        severity: warning
        paths: [config.username]
        message: >-
          This version writes the user name unquoted into YAML, so some values break the install or are stored as
          something else. Leave out a leading space or YAML symbol, ": " and " #", a trailing ":" or space, and tabs,
          and values that read as a number, a date, true/false or null. 3.1.0 and later quote it.
      - when: oldSelf == null || self.config.password != oldSelf.config.password
        rule: >-
          [self.config.password].all(x,
            !x.matches('^\\s') && !x.matches('^[!&*%@`\'"\\[\\]{}|>,#]') && !x.matches('^[-?:](\\s|$)') && !x.matches('\\t') &&
            !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
            !(x in ['true','True','TRUE','false','False','FALSE','null','Null','NULL','~']) &&
            !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') && !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
            !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') && !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
        severity: warning
        paths: [config.password]
        message: >-
          This version writes the password unquoted into YAML, so some values break the install or are stored as
          something else. Leave out a leading space or YAML symbol, ": " and " #", a trailing ":" or space, and tabs,
          and values that read as a number, a date, true/false or null. 3.1.0 and later quote it.
      - when: oldSelf == null || self.config.database != oldSelf.config.database
        rule: >-
          [self.config.database].all(x,
            !x.matches('^\\s') && !x.matches('^[!&*%@`\'"\\[\\]{}|>,#]') && !x.matches('^[-?:](\\s|$)') && !x.matches('\\t') &&
            !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
            !(x in ['true','True','TRUE','false','False','FALSE','null','Null','NULL','~']) &&
            !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') && !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
            !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') && !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
        severity: warning
        paths: [config.database]
        message: >-
          This version writes the database name unquoted into YAML, so some values break the install or are stored as
          something else. Leave out a leading space or YAML symbol, ": " and " #", a trailing ":" or space, and tabs,
          and values that read as a number, a date, true/false or null. 3.1.0 and later quote it.
      - rule: oldSelf == null || self.config.password == oldSelf.config.password
        severity: info
        paths: [config.password]
        message: >-
          Postgres reads the password only when the data directory is first initialized. Run
          ALTER ROLE ... PASSWORD with the new password first, or the chart hands the backup job a
          password the server does not accept.
      - when: oldSelf != null
        rule: self.config.password != 'password'
        severity: info
        paths: [config.password]
        message: >-
          The password is still the published default "password". Change it with ALTER ROLE ...
          PASSWORD, then set the same value here.

  - id: storage
    title: Storage
    description: The volume set that holds the data directory.
    sections:
      - fields:
          - type: note
            severity: info
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '2.1.0') < 0 && semverCompare(context.fromVersion, '2.0.0') >= 0
            text: >-
              2.0.0 created the volume set with 20 GiB and let it grow automatically up to 1000 GiB.
              This chart keeps 20 GiB but sets no automatic growth; 3.1.0 and later have settings for it.
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: >-
              Uninstalling the release deletes the volume set, so the data does not survive a
              reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
    rules:
      - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: backup
    title: Backups
    description: Scheduled logical backups to object storage.
    sections:
      - fields:
          - id: backupDestination
            virtual: true
            type: enum
            label: Scheduled backups
            widget: cards
            required: true
            init: >-
              !self.backup.enabled ? 'off' :
              self.backup.gcp.enabled && !self.backup.aws.enabled ? 'gcp' : 'aws'
            options:
              - value: "off"
                label: "Off"
                set: { backup.enabled: false, backup.aws.enabled: false, backup.gcp.enabled: false }
              - value: aws
                label: AWS S3
                set: { backup.enabled: true, backup.aws.enabled: true, backup.gcp.enabled: false }
              - value: gcp
                label: Google Cloud Storage
                set: { backup.enabled: true, backup.aws.enabled: false, backup.gcp.enabled: true }
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.backup.enabled
            pattern: '^\s*[0-9][0-9*,/-]*(\s+[0-9*,/-]+){4}\s*$'
            patternMessage: >-
              Use five fields of numbers, *, ranges, steps and lists, starting with a digit: this version
              writes the schedule unquoted, so a schedule that starts with * (such as */15 * * * *) fails
              to install. Write 0,15,30,45 * * * * instead.
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
            when: self.backup.enabled
      - title: AWS S3
        when: self.backup.enabled && self.backup.aws.enabled
        fields:
          - path: backup.aws.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: backup.aws.s3.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - when: oldSelf == null || self.backup.aws.s3.bucket != oldSelf.backup.aws.s3.bucket
            rule: >-
              [self.backup.aws.s3.bucket].all(x,
                !x.matches('^\\s') && !x.matches('^[!&*%@`\'"\\[\\]{}|>,#]') && !x.matches('^[-?:](\\s|$)') && !x.matches('\\t') &&
                !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
                !(x in ['true','True','TRUE','false','False','FALSE','null','Null','NULL','~']) &&
                !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') && !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
                !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') && !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [backup.aws.s3.bucket]
            message: >-
              This version writes the bucket name unquoted into YAML, so some values break the install or are stored
              as something else. Leave out a leading space or YAML symbol, ": " and " #", a trailing ":" or space, and
              tabs, and values that read as a number, a date, true/false or null. 3.1.0 and later quote it.
          - when: oldSelf == null || self.backup.aws.s3.prefix != oldSelf.backup.aws.s3.prefix
            rule: >-
              [self.backup.aws.s3.prefix].all(x,
                !x.matches('^\\s') && !x.matches('^[!&*%@`\'"\\[\\]{}|>,#]') && !x.matches('^[-?:](\\s|$)') && !x.matches('\\t') &&
                !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
                !(x in ['true','True','TRUE','false','False','FALSE','null','Null','NULL','~']) &&
                !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') && !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
                !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') && !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [backup.aws.s3.prefix]
            message: >-
              This version writes the prefix unquoted into YAML, so some values break the install or are stored as
              something else. Leave out a leading space or YAML symbol, ": " and " #", a trailing ":" or space, and
              tabs, and values that read as a number, a date, true/false or null. 3.1.0 and later quote it.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.gcp.enabled
        fields:
          - path: backup.gcp.gcs.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
            patternMessage: Use lowercase letters, numbers, dots, hyphens and underscores.
          - path: backup.gcp.gcs.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the
              Storage Admin role on the project.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.gcs.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - when: oldSelf == null || self.backup.gcp.gcs.bucket != oldSelf.backup.gcp.gcs.bucket
            rule: >-
              [self.backup.gcp.gcs.bucket].all(x,
                !x.matches('^\\s') && !x.matches('^[!&*%@`\'"\\[\\]{}|>,#]') && !x.matches('^[-?:](\\s|$)') && !x.matches('\\t') &&
                !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
                !(x in ['true','True','TRUE','false','False','FALSE','null','Null','NULL','~']) &&
                !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') && !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
                !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') && !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [backup.gcp.gcs.bucket]
            message: >-
              This version writes the bucket name unquoted into YAML, so some values break the install or are stored
              as something else. Leave out a leading space or YAML symbol, ": " and " #", a trailing ":" or space, and
              tabs, and values that read as a number, a date, true/false or null. 3.1.0 and later quote it.
          - when: oldSelf == null || self.backup.gcp.gcs.prefix != oldSelf.backup.gcp.gcs.prefix
            rule: >-
              [self.backup.gcp.gcs.prefix].all(x,
                !x.matches('^\\s') && !x.matches('^[!&*%@`\'"\\[\\]{}|>,#]') && !x.matches('^[-?:](\\s|$)') && !x.matches('\\t') &&
                !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
                !(x in ['true','True','TRUE','false','False','FALSE','null','Null','NULL','~']) &&
                !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') && !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
                !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') && !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [backup.gcp.gcs.prefix]
            message: >-
              This version writes the prefix unquoted into YAML, so some values break the install or are stored as
              something else. Leave out a leading space or YAML symbol, ": " and " #", a trailing ":" or space, and
              tabs, and values that read as a number, a date, true/false or null. 3.1.0 and later quote it.
    rules:
      - rule: >-
          self.backup.enabled ? self.backup.aws.enabled != self.backup.gcp.enabled :
          !self.backup.aws.enabled && !self.backup.gcp.enabled
        mirrors: pg.validateBackupConfig
        paths: [backup.enabled]
        message: >-
          With backups on, turn on exactly one of backup.aws.enabled and backup.gcp.enabled; with
          backups off, turn both off.

rules:
  - rule: >-
      context.mode != 'upgrade' || context.fromVersion == null ||
      semverCompare(context.fromVersion, '2.0.0') >= 0
    message: >-
      Do not upgrade a 1.x release in place: its volume set was named after the release, and
      this chart names it with a `-pg-vs` suffix, so the upgrade deletes the volume set holding
      your data. Install this version as a new release, restore a dump into it, then uninstall
      the old release.

migrations:
  - fromVersions: ">=2.0.0 <2.1.0"
    to: volumeset.capacity
    valueExpr: "20"
    note: 2.0.0 created the volume set with 20 GiB, and the existing volume would not shrink, so 20 is kept.
  - fromVersions: "<2.2.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<2.2.0"
    from: resources.memory
    to: resources.maxMemory
  - fromVersions: "<2.2.0"
    to: resources.maxCpu
    valueExpr: self.resources.cpu
    note: The single CPU value is now the maximum; the minimum is a new setting.
  - fromVersions: "<2.2.0"
    to: resources.maxMemory
    valueExpr: self.resources.memory
    note: The single memory value is now the maximum; the minimum is a new setting, and the maximum can be at most 4 times it.
  # The new minimums (200m, 128Mi) would leave the carried maximums (500m, 1024Mi by default) above the
  # 4:1 stateful ratio: raise each minimum to a quarter of its maximum when needed, and to the maximum
  # itself when the maximum is below the new minimum.
  - fromVersions: "<2.2.0"
    to: resources.minCpu
    valueExpr: >-
      cpuMillicores(self.resources.cpu) < 200 ? string(cpuMillicores(self.resources.cpu)) + 'm' :
      cpuMillicores(self.resources.cpu) > 800 ? string((cpuMillicores(self.resources.cpu) + 3) / 4) + 'm' : '200m'
    note: The minimum CPU is set so the maximum stays within 4 times it.
  - fromVersions: "<2.2.0"
    to: resources.minMemory
    valueExpr: >-
      memoryBytes(self.resources.memory) < 134217728 ? string(memoryBytes(self.resources.memory)) :
      memoryBytes(self.resources.memory) > 536870912 ? string((memoryBytes(self.resources.memory) + 4194303) / 4194304) + 'Mi' : '128Mi'
    note: The minimum memory is set so the maximum stays within 4 times it.
