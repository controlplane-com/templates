{{- include "pg.validate" . -}}
{{- if .Values.pgbouncer.enabled }}
kind: workload
name: {{ include "postgres.pgbouncer.name" . }}
gvc: {{ .Values.global.cpln.gvc }}
description: PgBouncer Connection Pooler
tags: {{- include "pg.tags" . | nindent 4 }}
spec:
  type: serverless
  identityLink: //identity/{{ include "postgres.identity.name" . }}
  containers:
    - name: pgbouncer
      image: {{ .Values.pgbouncer.image }}
      cpu: {{ .Values.pgbouncer.resources.cpu | quote }}
      memory: {{ .Values.pgbouncer.resources.memory | quote }}
      inheritEnv: false
      env:
        - name: DB_HOST
          value: {{ include "postgres.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: DB_PORT
          value: '5432'
        # Same user-created prerequisite secret the Postgres workload reads.
        - name: DB_USER
          value: 'cpln://secret/{{ .Values.config.credentialsSecretName }}.username'
        - name: DB_PASSWORD
          value: 'cpln://secret/{{ .Values.config.credentialsSecretName }}.password'
        - name: DB_NAME
          value: 'cpln://secret/{{ .Values.config.credentialsSecretName }}.database'
        - name: POOL_MODE
          value: {{ .Values.pgbouncer.poolMode | quote }}
        - name: DEFAULT_POOL_SIZE
          value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
        - name: MAX_CLIENT_CONN
          value: {{ .Values.pgbouncer.maxClientConn | quote }}
        - name: AUTH_TYPE
          value: plain
      ports:
        - number: 5432
          protocol: tcp
  defaultOptions:
    autoscaling:
      metric: disabled
      minScale: {{ .Values.pgbouncer.replicas }}
      maxScale: {{ .Values.pgbouncer.replicas }}
    capacityAI: false
  firewallConfig:
    {{- /* Every field is declared, empty lists included: the API backfills them,
    so omitting one makes a default install drift from the moment it is created. */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if and .Values.internalAccess.workloads (has .Values.internalAccess.type (list "same-gvc" "workload-list")) }}
      inboundAllowWorkload:
        {{- range .Values.internalAccess.workloads }}
        - {{ . }}
        {{- end }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
{{- end }}
