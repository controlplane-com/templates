# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: PostgreSQL
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: server
    title: Server
    description: The Postgres image and the compute of its single stateful replica.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'upgrade'
        text: >-
          Every upgrade restarts the server. Nothing limits the rollout of a stateful workload,
          so plan a short write outage.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '3.0.0') < 0 && semverCompare(context.fromVersion, '2.0.0') >= 0
        text: >-
          Before 3.0.0 the chart ran a fixed `postgres:17` image and named the server workload
          `RELEASE_NAME-pg-db`. The image is kept at `postgres:17`, because a different major version
          does not start on the existing data directory. The workload is now
          `RELEASE_NAME-postgres`, so point clients at `RELEASE_NAME-postgres.GVC_NAME.cpln.local`
          after the upgrade.
      - path: image
        type: string
        format: image
        label: Postgres image
        required: true
        help: >-
          For example `postgres:18` or `postgres:17`. The data directory is specific to a
          major version: a different major on an existing volume does not start.
      - path: resources
        type: resources
        label: Resources
        required: true
        docs: "#server-and-resources"
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
    rules:
      - rule: >-
          oldSelf == null || imageMajor(self.image) < 0 || imageMajor(oldSelf.image) < 0 ||
          imageMajor(self.image) == imageMajor(oldSelf.image)
        severity: warning
        paths: [image]
        message: >-
          The data directory belongs to the installed Postgres major version; a different major
          version does not start on it. Upgrade with a dump and restore instead.

  - id: credentials
    title: Credentials
    description: The prerequisite secret with the database user, password and name.
    fields:
      - type: note
        severity: warning
        text: >-
          The credentials secret must exist **before** you install. If it is missing, the
          deployment waits and `cpln logs` shows nothing at all.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '3.4.0') < 0 && semverCompare(context.fromVersion, '2.0.0') >= 0
        textExpression: >-
          'Before you upgrade: before 3.4.0 the chart kept the database user and password in the secret `' +
          (context.releaseName == null || context.releaseName == '' ? 'RELEASE_NAME' : context.releaseName) +
          '-pg-config` and the database name in the value `config.database`, and it no longer creates that secret. ' +
          'Read the user and password with `cpln secret reveal ' +
          (context.releaseName == null || context.releaseName == '' ? 'RELEASE_NAME' : context.releaseName) +
          '-pg-config -o yaml` and the database name from the `POSTGRES_DB` variable in `cpln workload get ' +
          (context.releaseName == null || context.releaseName == '' ? 'RELEASE_NAME' : context.releaseName) +
          (semverCompare(context.fromVersion, '3.0.0') < 0 ? '-pg-db' : '-postgres') +
          ' -o yaml`. Create a dictionary secret holding them as `username`, `password` and `database`, and choose it here.'
        text: >-
          Before you upgrade: before 3.4.0 the chart kept the database user and password in the secret
          `RELEASE_NAME-pg-config` and the database name in the value `config.database`, and it no
          longer creates that secret. Read the user and password with `cpln secret reveal
          RELEASE_NAME-pg-config -o yaml` and the database name from the `POSTGRES_DB` variable in
          `cpln workload get RELEASE_NAME-postgres -o yaml`. Create a dictionary secret holding them as
          `username`, `password` and `database`, and choose it here.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '3.4.0') < 0 && semverCompare(context.fromVersion, '2.0.0') >= 0
        text: >-
          Earlier versions defaulted the password to `password`, shared by every install that did not
          change it. If the password you revealed from `RELEASE_NAME-pg-config` is `password`, do not copy
          it into the new secret: run `ALTER ROLE <user> PASSWORD '<new password>'` first, then put the
          new password in the secret.
      - path: config.credentialsSecretName
        type: ref
        label: Database credentials secret
        required: true
        description: A dictionary secret with the keys `username`, `password` and `database`.
        help: >-
          Postgres reads these values only when its data directory is first initialized. To
          rotate the password later, run `ALTER ROLE ... PASSWORD` and then update the secret.
          The username and database must not contain spaces, or the readiness probe never passes.
        docs: "#credentials"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [username, password, database]
          create:
            suggestName: "context.releaseName + '-postgres-credentials'"
    rules:
      - rule: "!has(self.config.username) && !has(self.config.password) && !has(self.config.database)"
        mirrors: pg.validateCredentials
        paths: [config.credentialsSecretName]
        message: >-
          config.username, config.password and config.database were removed in 3.4.0. Put them
          in a dictionary secret and remove them from the values.
      - rule: oldSelf == null || self.config.credentialsSecretName == oldSelf.config.credentialsSecretName
        severity: info
        paths: [config.credentialsSecretName]
        message: >-
          Postgres reads the credentials only when the data directory is first initialized;
          pointing at another secret does not change the existing user or password.

  - id: storage
    title: Storage
    description: The volume set that holds the data directory.
    sections:
      - fields:
          - path: volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: >-
              Uninstalling the release deletes the volume set, so the data does not survive a
              reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
      - id: autoscaling
        title: Grow storage automatically
        toggle: volumeset.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.autoscaling.maxCapacity >= self.volumeset.capacity
            paths: [volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: network
    title: Network and pooling
    description: Who can connect, and an optional connection pooler.
    sections:
      - title: Network access
        docs: /reference/workload/firewall
        fields:
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Firewall changes take 30 to 150 seconds to take effect.
            options:
              - value: none
                label: None
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            description: Extra workloads allowed to connect, for example from another GVC.
            when: self.internalAccess.type in ['same-gvc', 'workload-list']
            widget: tags
            unique: true
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internalAccess.type == 'same-gvc'
      - id: pgbouncer
        title: Connection pooler (PgBouncer)
        toggle: pgbouncer.enabled
        description: When on, PgBouncer becomes the endpoint your applications connect to.
        docs: "#pgbouncer"
        fields:
          - type: note
            text: >-
              PgBouncer uses the same credentials secret and identity as Postgres, and the same
              "Who can connect" setting for its own firewall.
          - path: pgbouncer.poolMode
            type: enum
            label: Pool mode
            widget: segmented
            required: true
            help: >-
              **Transaction** holds a connection for one transaction: best for most web and API
              workloads, but not compatible with `SET` variables, temporary tables or advisory
              locks. **Session** holds it for the whole client session: compatible with
              everything, less reuse. **Statement** returns it after every statement:
              transactions are not supported.
            options:
              - { value: session, label: Session }
              - { value: transaction, label: Transaction }
              - { value: statement, label: Statement }
          - path: pgbouncer.defaultPoolSize
            type: integer
            label: Server connections per pool
            min: 1
            required: true
            suggestions: [10, 25, 50, 100]
          - path: pgbouncer.maxClientConn
            type: integer
            label: Max client connections
            min: 1
            required: true
            suggestions: [100, 500, 1000, 5000]
          - path: pgbouncer.replicas
            type: integer
            label: Replicas
            min: 1
            required: true
            suggestions: [1, 2, 3]
          - path: pgbouncer.image
            type: string
            format: image
            label: PgBouncer image
            required: true
            advanced: true
          - path: pgbouncer.resources
            type: resources
            label: PgBouncer resources
            required: true
            advanced: true
        rules:
          - rule: self.pgbouncer.defaultPoolSize <= self.pgbouncer.maxClientConn
            severity: info
            paths: [pgbouncer.defaultPoolSize]
            message: The pool is larger than the number of client connections PgBouncer accepts.
    rules:
      - when: self.internalAccess.type == 'same-gvc' && context.gvc != null
        rule: "!self.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
        severity: info
        paths: [internalAccess.workloads]
        messageExpression: >-
          'Same GVC already allows every workload in this GVC: ' +
          self.internalAccess.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
          ' can be removed from the list.'
        message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
      - rule: "!(self.internalAccess.type == 'none' && (self.pgbouncer.enabled || self.backup.enabled))"
        severity: warning
        paths: [internalAccess.type]
        message: >-
          "None" also blocks PgBouncer and the backup job, which connect to Postgres like any
          other workload.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: warning
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no client can connect.
      - when: self.internalAccess.type == 'workload-list' && context.gvc != null
        rule: >-
          (!self.pgbouncer.enabled ||
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-pgbouncer') in self.internalAccess.workloads) &&
          (!self.backup.enabled ||
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-postgres-backup') in self.internalAccess.workloads)
        severity: warning
        paths: [internalAccess.workloads]
        messageExpression: >-
          'The chart does not add its own workloads to the list. Add ' +
          (self.pgbouncer.enabled ? '//gvc/' + context.gvc + '/workload/' + context.releaseName + '-pgbouncer' : '') +
          (self.pgbouncer.enabled && self.backup.enabled ? ' and ' : '') +
          (self.backup.enabled ? '//gvc/' + context.gvc + '/workload/' + context.releaseName + '-postgres-backup' : '') +
          ', or they cannot connect.'
        fix:
          path: internalAccess.workloads
          items: >-
            (self.pgbouncer.enabled ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-pgbouncer'] : []) +
            (self.backup.enabled ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-postgres-backup'] : [])
        message: >-
          The chart does not add its own workloads to the list; add the PgBouncer and backup
          workloads, or they cannot connect.

  - id: backup
    title: Backups
    description: Scheduled logical backups to object storage.
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        docs: "#backup"
        fields:
          - path: backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            pattern: '^\s*[0-9*,/-]+(\s+[0-9*,/-]+){4}\s*$'
            patternMessage: Use five fields of numbers, *, ranges, steps and lists; macros such as @daily are not accepted.
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            description: Tag 18.x.x for Postgres 18, 17.x.x for Postgres 17.
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
        rules:
          - rule: >-
              imageMajor(self.image) < 0 || imageMajor(self.backup.image) < 0 ||
              imageMajor(self.backup.image) >= imageMajor(self.image)
            severity: warning
            paths: [backup.image]
            message: >-
              The backup image's major version must be at least the Postgres major version; an
              older pg_dump cannot dump a newer server.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        docs: "#aws-s3"
        fields:
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        docs: "#gcs"
        fields:
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
            patternMessage: Use lowercase letters, numbers, dots, hyphens and underscores.
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the
              Storage Admin role on the project.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.backup.enabled && self.backup.provider == 'minio'
        docs: "#minio"
        fields:
          - type: note
            severity: warning
            text: >-
              The secret with the keys `accessKey` and `secretKey` must exist **before** you install
              with backups on.
          - path: backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload.GVC_NAME.cpln.local:9000
            description: The URL including the port.
          - path: backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: backup.minio.credentialsSecretName
            type: ref
            label: MinIO credentials secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
          - path: backup.minio.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - rule: "!has(self.backup.minio.accessKey) && !has(self.backup.minio.secretKey)"
            mirrors: pg.validateBackupConfig
            paths: [backup.minio.credentialsSecretName]
            message: >-
              backup.minio.accessKey and backup.minio.secretKey were removed in 3.4.0. Put them in
              a dictionary secret and remove them from the values.
          - rule: "!(self.backup.enabled && self.backup.provider == 'minio' && self.backup.image.startsWith('controlplanecorporation/'))"
            severity: warning
            paths: [backup.image]
            message: MinIO needs ghcr.io/controlplane-com/backup-images/postgres-backup; this image has no MinIO support.
    rules:
      - rule: "!self.backup.enabled || imageMajor(self.image) < 0 || imageMajor(self.image) >= 17"
        severity: warning
        paths: [backup.enabled]
        message: Backups need Postgres 17 or later; the selected image is older.

rules:
  - rule: >-
      context.mode != 'upgrade' || context.fromVersion == null ||
      semverCompare(context.fromVersion, '2.0.0') >= 0
    message: >-
      Do not upgrade a 1.x release in place: its volume set was named after the release, and
      this chart names it with a `-pg-vs` suffix, so the upgrade deletes the volume set holding
      your data. Install this version as a new release, restore a dump into it, then uninstall
      the old release.

migrations:
  - fromVersions: "<3.4.0"
    from: config.username
    note: Credentials moved to a dictionary secret with the keys username, password and database; choose it under Credentials.
  - fromVersions: "<3.4.0"
    from: config.password
    note: Credentials moved to a dictionary secret with the keys username, password and database; choose it under Credentials.
  - fromVersions: "<3.4.0"
    from: config.database
    note: Credentials moved to a dictionary secret with the keys username, password and database; choose it under Credentials.
  - fromVersions: "<3.4.0"
    from: backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey, named by backup.minio.credentialsSecretName.
  - fromVersions: "<3.4.0"
    from: backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey, named by backup.minio.credentialsSecretName.
  - fromVersions: ">=2.0.0 <2.1.0"
    to: volumeset.capacity
    valueExpr: "20"
    note: 2.0.0 created the volume set with 20 GiB, and the existing volume would not shrink, so 20 is kept.
  - fromVersions: ">=2.0.0 <2.1.0"
    to: volumeset.autoscaling.enabled
    valueExpr: "true"
    note: 2.0.0 grew the volume set automatically up to 1000 GiB; growth stays on with the same limits.
  - fromVersions: ">=2.0.0 <2.1.0"
    to: volumeset.autoscaling.maxCapacity
    valueExpr: "1000"
  - fromVersions: ">=2.0.0 <2.1.0"
    to: volumeset.autoscaling.minFreePercentage
    valueExpr: "1"
  - fromVersions: ">=2.0.0 <2.1.0"
    to: volumeset.autoscaling.scalingFactor
    valueExpr: "1.1"
  - fromVersions: ">=2.0.0 <3.0.0"
    to: image
    valueExpr: "'postgres:17'"
    note: Before 3.0.0 the chart ran postgres:17, and the data directory belongs to that major version, so it is kept.
  - fromVersions: "<2.2.0"
    from: resources.cpu
    to: resources.maxCpu
  - fromVersions: "<2.2.0"
    from: resources.memory
    to: resources.maxMemory
  - fromVersions: "<2.2.0"
    to: resources.maxCpu
    valueExpr: self.resources.cpu
    note: The single CPU value is now the maximum; the minimum is a new setting.
  - fromVersions: "<2.2.0"
    to: resources.maxMemory
    valueExpr: self.resources.memory
    note: The single memory value is now the maximum; the minimum is a new setting, and the maximum can be at most 4 times it.
  # The new minimums (200m, 128Mi) would leave the carried maximums (500m, 1024Mi by default) above the
  # 4:1 stateful ratio: raise each minimum to a quarter of its maximum when needed, and to the maximum
  # itself when the maximum is below the new minimum.
  - fromVersions: "<2.2.0"
    to: resources.minCpu
    valueExpr: >-
      cpuMillicores(self.resources.cpu) < 200 ? string(cpuMillicores(self.resources.cpu)) + 'm' :
      cpuMillicores(self.resources.cpu) > 800 ? string((cpuMillicores(self.resources.cpu) + 3) / 4) + 'm' : '200m'
    note: The minimum CPU is set so the maximum stays within 4 times it.
  - fromVersions: "<2.2.0"
    to: resources.minMemory
    valueExpr: >-
      memoryBytes(self.resources.memory) < 134217728 ? string(memoryBytes(self.resources.memory)) :
      memoryBytes(self.resources.memory) > 536870912 ? string((memoryBytes(self.resources.memory) + 4194303) / 4194304) + 'Mi' : '128Mi'
    note: The minimum memory is set so the maximum stays within 4 times it.
  - fromVersions: ">=2.2.0 <3.1.0"
    to: backup.provider
    valueExpr: "self.backup.gcp.enabled && !self.backup.aws.enabled ? 'gcp' : 'aws'"
    note: The destination is now chosen with Destination under Backups.
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.aws.enabled
    note: Replaced by the Destination setting under Backups.
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.gcp.enabled
    note: Replaced by the Destination setting under Backups.
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.aws.s3.bucket
    to: backup.aws.bucket
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.aws.s3.region
    to: backup.aws.region
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.aws.s3.cloudAccountName
    to: backup.aws.cloudAccountName
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.aws.s3.policyName
    to: backup.aws.policyName
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.aws.s3.prefix
    to: backup.aws.prefix
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.gcp.gcs.bucket
    to: backup.gcp.bucket
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.gcp.gcs.cloudAccountName
    to: backup.gcp.cloudAccountName
  - fromVersions: ">=2.2.0 <3.1.0"
    from: backup.gcp.gcs.prefix
    to: backup.gcp.prefix
  - fromVersions: ">=2.2.0 <3.1.0"
    to: backup.aws.prefix
    valueExpr: "self.backup.enabled && self.backup.aws.enabled ? self.backup.aws.s3.prefix : null"
    note: Backups keep going to the folder the installed release wrote them to.
  - fromVersions: ">=2.2.0 <3.1.0"
    to: backup.gcp.prefix
    valueExpr: "self.backup.enabled && self.backup.gcp.enabled ? self.backup.gcp.gcs.prefix : null"
    note: Backups keep going to the folder the installed release wrote them to.
