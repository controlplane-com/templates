{{- include "pg.validate" . -}}
kind: workload
name: {{ include "postgres.name" . }}
gvc: {{ .Values.global.cpln.gvc }}
description: Postgres Database
tags: {{- include "pg.tags" . | nindent 4 }}
spec:
  type: stateful
  identityLink: //identity/{{ include "postgres.identity.name" . }}
  containers:
    - name: postgresql
      env:
        - name: PGDATA
          value: "/var/lib/postgresql/data/pg_data"
        # All three come from the user-created prerequisite secret, so no
        # database credential is ever written into the Helm release.
        - name: POSTGRES_DB
          value: 'cpln://secret/{{ .Values.config.credentialsSecretName }}.database'
        - name: POSTGRES_PASSWORD
          value: 'cpln://secret/{{ .Values.config.credentialsSecretName }}.password'
        - name: POSTGRES_USER
          value: 'cpln://secret/{{ .Values.config.credentialsSecretName }}.username'
      image: {{ .Values.image }}
      {{- /* The major-version guard runs first and then execs the stock
      entrypoint (see _script-guard.tpl). */}}
      command: /bin/bash
      args:
        - '-c'
        - {{ include "pg.inlineArg" (include "pg.script.guard" .) }}
      inheritEnv: false
      minCpu: {{ .Values.resources.minCpu | quote }}
      minMemory: {{ .Values.resources.minMemory | quote }}
      cpu: {{ .Values.resources.maxCpu | quote }}
      memory: {{ .Values.resources.maxMemory | quote }}
      ports:
        - number: 5432
          protocol: tcp
      volumes:
        - path: /var/lib/postgresql/data
          uri: 'cpln://volumeset/{{ include "postgres.volume.name" . }}'
      readinessProbe:
        exec:
          command:
            - sh
            - '-c'
            {{- /* A held guard prints its fix and fails. pg_isready dials TCP on
            loopback: during first boot the entrypoint runs a socket-only temporary
            server, which a bare pg_isready reports as ready. Startup window
            (the platform's implied startup probe) = 15 + 30 x 10 = 315 s. */}}
            - 'if [ -f /tmp/pg-major-guard ]; then head -n 4 /tmp/pg-major-guard; exit 1; fi; pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
        failureThreshold: 6
        initialDelaySeconds: 15
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 3
  defaultOptions:
    autoscaling:
      metric: disabled
      minScale: 1
      maxScale: 1
    {{- /* The API backfills these on a partial autoscaling block; declared so
    the stored spec matches the rendered one (Console Drift tab). */}}
      maxConcurrency: 0
      scaleToZeroDelay: 300
      target: 95
    capacityAI: false
    timeoutSeconds: 5
  rolloutOptions:
    {{- /*
    maxUnavailableReplicas is deliberately NOT set: the API drops it on a
    stateful workload, so sending it produces permanent drift AND implies a
    rolling-restart limit that is not in force.
    terminationGracePeriodSeconds is declared because the API backfills 90.
    */}}
    minReadySeconds: 0
    scalingPolicy: OrderedReady
    terminationGracePeriodSeconds: 90
  firewallConfig:
    {{- /* Every field is declared, empty lists included: the API backfills them,
    so omitting one makes a default install drift from the moment it is created. */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if and .Values.internalAccess.workloads (has .Values.internalAccess.type (list "same-gvc" "workload-list")) }}
      inboundAllowWorkload:
        {{- range .Values.internalAccess.workloads }}
        - {{ . }}
        {{- end }}
      {{- else }}
      inboundAllowWorkload: []
      {{- end }}
