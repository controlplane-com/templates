{{- include "prometheus.validate" . }}
kind: workload
name: {{ include "prometheus.name" . }}
description: Prometheus metrics database
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "prometheus.tags" . | nindent 4 }}
spec:
  type: stateful
  identityLink: //identity/{{ include "prometheus.identity.name" . }}
  containers:
    - name: prometheus
      image: {{ .Values.image }}
      inheritEnv: false
      args:
        - --config.file=/etc/prometheus-config/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.enable-remote-write-receiver
        # Prometheus's conventional 9090 is a Control Plane RESERVED port
        # (platform system use) — workloads may not bind it. Listen on 9095.
        - --web.listen-address=0.0.0.0:9095
        {{- if .Values.thanos.objectStorage.enabled }}
        # Thanos upload requirement: min == max block duration disables local
        # compaction so the sidecar ships immutable blocks.
        - --storage.tsdb.min-block-duration={{ .Values.thanos.objectStorage.blockDuration }}
        - --storage.tsdb.max-block-duration={{ .Values.thanos.objectStorage.blockDuration }}
        {{- end }}
      minCpu: {{ .Values.resources.minCpu | quote }}
      minMemory: {{ .Values.resources.minMemory | quote }}
      cpu: {{ .Values.resources.cpu | quote }}
      memory: {{ .Values.resources.memory | quote }}
      ports:
        - number: 9095
          protocol: http
      volumes:
        - path: /etc/prometheus-config/prometheus.yml
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "prometheus.secret.config.name" . }}.payload
        - path: /prometheus
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "prometheus.volume.name" . }}
        {{- range $i, $rw := .Values.remoteWrite }}
        {{- if $rw.basicAuth }}
        - path: /etc/prometheus/remote-write/rw-{{ $i }}/password
          recoveryPolicy: retain
          uri: cpln://secret/{{ $rw.basicAuth.passwordSecretName }}.payload
        {{- end }}
        {{- end }}
      # WAL replay after a restart of a full TSDB can take minutes and /-/ready
      # stays 503 throughout — hence the generous readiness ceiling (18 x 10s =
      # 180s; the platform caps failureThreshold at 20). Liveness is /-/healthy,
      # which returns 200 whenever the process is up (including during replay),
      # so it cannot restart-loop a replaying server.
      readinessProbe:
        httpGet:
          path: /-/ready
          port: 9095
          # explicit server defaults — prevents cosmetic drift vs the live workload
          scheme: HTTP
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 18
        successThreshold: 1
        timeoutSeconds: 3
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: 9095
          # explicit server defaults — prevents cosmetic drift vs the live workload
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 5
        successThreshold: 1
        timeoutSeconds: 5
    {{- if .Values.thanos.sidecar.enabled }}
    - name: thanos-sidecar
      image: {{ .Values.thanos.sidecar.image }}
      inheritEnv: false
      args:
        - sidecar
        - --prometheus.url=http://localhost:9095
        - --tsdb.path=/prometheus
        - --grpc-address=0.0.0.0:10901
        - --http-address=0.0.0.0:10902
        {{- if .Values.thanos.objectStorage.enabled }}
        - --objstore.config-file=/etc/thanos/objstore.yml
        {{- end }}
      minCpu: {{ .Values.thanos.sidecar.resources.minCpu | quote }}
      minMemory: {{ .Values.thanos.sidecar.resources.minMemory | quote }}
      cpu: {{ .Values.thanos.sidecar.resources.cpu | quote }}
      memory: {{ .Values.thanos.sidecar.resources.memory | quote }}
      ports:
        - number: 10901
          protocol: tcp
        - number: 10902
          protocol: http
      volumes:
        - path: /prometheus
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "prometheus.volume.name" . }}
        {{- if .Values.thanos.objectStorage.enabled }}
        - path: /etc/thanos/objstore.yml
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "prometheus.secret.objstore.name" . }}.payload
        {{- end }}
      # Sidecar readiness follows its connection to Prometheus (platform caps
      # failureThreshold at 20; 18 x 10s matches the prometheus container).
      readinessProbe:
        httpGet:
          path: /-/ready
          port: 10902
          # explicit server defaults — prevents cosmetic drift vs the live workload
          scheme: HTTP
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 18
        successThreshold: 1
        timeoutSeconds: 3
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: 10902
          # explicit server defaults — prevents cosmetic drift vs the live workload
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 5
        successThreshold: 1
        timeoutSeconds: 5
    {{- end }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 1
      metric: disabled
      minScale: 1
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 30
  firewallConfig:
    external:
      outboundAllowCIDR:
        - 0.0.0.0/0
      inboundAllowCIDR: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if eq .Values.internalAccess.type "workload-list" }}
      inboundAllowWorkload:
        {{- range .Values.internalAccess.workloads }}
        - {{ . }}
        {{- end }}
      {{- end }}
  loadBalancer:
    replicaDirect: true
  # The Prometheus image runs as nobody (65534) and cannot chown; forcing both
  # containers to 65534 gives the sidecar read access to Prometheus-written
  # blocks on the shared volume with no permission choreography.
  securityOptions:
    filesystemGroupId: 65534
    runAsUser: 65534
