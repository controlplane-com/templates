{{- include "rabbitmq.validate" . -}}
kind: policy
name: {{ include "rabbitmq.policy.name" . }}
description: RabbitMQ Policy
tags: {{- include "rabbitmq.tags" . | nindent 4 }}
origin: default
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "rabbitmq.identity.name" . }}
targetKind: secret
targetLinks:
  # The template-created rabbitmq.conf.
  - //secret/{{ include "rabbitmq.secret.name" . }}
  # The user-created default-user credentials — reveal on exactly that one secret.
  - //secret/{{ .Values.credentialsSecretName }}
