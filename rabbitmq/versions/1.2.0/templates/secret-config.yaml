{{- include "rabbitmq.validate" . -}}
kind: secret
name: {{ include "rabbitmq.secret.name" . }}
tags: {{- include "rabbitmq.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  {{- /*
  This payload is mounted as a FILE. A `cpln://secret/...` reference is only
  interpolated in an env var, never inside a mounted file — so the default user
  and password are NOT set here. They arrive as RABBITMQ_DEFAULT_USER /
  RABBITMQ_DEFAULT_PASS env vars on the container, which RabbitMQ 3.9+ reads
  natively.
  */}}
  payload: |-
    listeners.tcp.default = {{ .Values.rabbitmq_conf.listeners_tcp_default }}
