# redis-cluster 1.2.0 — a customer install as it looks today: the password inline in values, and every
# resource named after the release alone. Used as the starting point of an upgrade to a newer version.
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  redispw: hex

vars:
  rc_workload: "{release}"
  rc_password: "{gen.redispw}"

values:
  redis:
    password: "{gen.redispw}"
