# redis-cluster 1.7.0 — the recommended install: the password from a prerequisite secret.
# Prod shape for this template (six nodes, three shards with a replica each, one location) at its
# default size.
locations: [aws-us-east-1]
timeoutSeconds: 900

generated:
  redispw: hex

secrets:
  auth:
    type: dictionary
    entries:
      password: "{gen.redispw}"

vars:
  rc_workload: "{release}-redis-cluster"
  rc_password: "{gen.redispw}"

values:
  redis:
    auth:
      fromSecret:
        enabled: true
        name: "{secrets.auth.name}"

# 1.4.3 is the oldest version that starts on today's image, so it is the upgrade path that must work.
# 1.2.0 and 1.1.0 are the versions customers run (inline password); they cannot start a node on today's
# redis:7.2 at all, so their rows fail until the maintainer rules on them.
upgradeFrom:
  - version: 1.4.3
    values: new
  - version: 1.2.0
    values: new
  - version: 1.1.0
    values: new
