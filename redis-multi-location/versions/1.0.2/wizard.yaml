# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Redis Multi-Location
# createsGvc: true. The chart creates its own GVC from gvc.name with exactly the locations in gvc.locations
# (templates/gvc-locations.yaml), so there is no target GVC to limit and no gvc block (guide 14.2); the location
# rules work on gvc.locations instead.

steps:
  - id: topology
    title: GVC and locations
    description: >-
      The GVC this release creates, the locations the cluster runs in, how many Redis instances each location
      gets, and the images both tiers run.
    sections:
      - id: locations
        title: GVC and locations
        fields:
          - type: note
            severity: warning
            when: context.mode == 'install'
            text: >-
              This version creates its own GVC with the name below and runs everything in it. Use a name no GVC
              in the org has: a GVC of that name that no release manages is adopted, and uninstalling the
              release then deletes that GVC with every workload in it; one that another release manages makes
              the install fail. Uninstall the release against the GVC you install it into, not the GVC it
              creates.
          - type: note
            when: context.mode == 'install' && size(self.gvc.locations) >= 2
            text: >-
              Sentinel runs one instance per location. A failover starts once the quorum of Sentinels agrees the
              master is down, and needs a majority of all Sentinels to authorize it.
            textExpression: >-
              string(size(self.gvc.locations)) + ' locations, one Sentinel each. A failover starts once ' +
              (self.sentinel.quorum == null ? 'the quorum of' : string(self.sentinel.quorum)) +
              ' Sentinels agree the master is down, and needs ' + string(size(self.gvc.locations) / 2 + 1) +
              ' of them to authorize it.'
          - path: gvc.name
            type: string
            label: GVC name
            required: true
            immutable: >-
              The release runs in the GVC it created; another name would create a new, empty GVC and delete this
              one with everything in it.
            description: The GVC this release creates and runs in. Give every install its own.
            pattern: '^[a-z][a-z0-9-]{0,61}[a-z0-9]$'
            patternMessage: >-
              Use lowercase letters, digits and hyphens, starting with a letter and ending with a letter or digit.
            rules:
              # gvc-locations.yaml and every resource write the name unquoted (`name: {{ .Values.gvc.name }}`).
              - rule: >-
                  (oldSelf != null && self.gvc.name == oldSelf.gvc.name) ||
                  !(self.gvc.name in ['true', 'false', 'null'])
                severity: warning
                message: >-
                  The chart writes the GVC name unquoted, so true, false and null would be read as a boolean or
                  an empty value. Choose another name.
              - rule: self.gvc.name != 'my-redis-gvc'
                severity: info
                messageExpression: >-
                  'GVC names are org-wide, so a second release on the default name fails to install while the
                  first one manages that GVC. Give each release its own, for example ' + context.releaseName +
                  '-redis.'
                message: >-
                  GVC names are org-wide, so a second release on the default name fails to install while the first
                  one manages that GVC. Give each release its own.
          - path: gvc.locations
            type: list
            label: Locations
            required: true
            minItems: 2
            uniqueBy: [name]
            widget: table
            newItem: { name: "", replicas: 2 }
            itemLabel: "item.name + ' × ' + (item.replicas == null ? '?' : string(item.replicas))"
            description: >-
              The locations of the GVC this release creates, each with its number of Redis instances.
            help: >-
              The chart creates the GVC with exactly these locations, and runs one Sentinel in each. To remove a
              location, remove it from this list; never suspend a location, which permanently withdraws its
              endpoints from the other locations' service discovery.
            item:
              type: object
              fields:
                - path: name
                  type: ref
                  label: Location
                  required: true
                  ref: { kind: location, format: name, mustExist: error }
                - path: replicas
                  type: integer
                  label: Redis instances
                  required: true
                  min: 1
                  suggestions: [1, 2, 3]
            rules:
              - rule: size(self.gvc.locations) != 2
                severity: info
                message: >-
                  Two locations give no automatic failover: after losing one, the remaining Sentinel is not a
                  majority and cannot authorize one. Use 3 or 5 locations for automatic failover.
              - rule: size(self.gvc.locations) < 4 || size(self.gvc.locations) % 2 == 1
                severity: info
                message: >-
                  An even number of locations survives no more losses than one location fewer; 3 survives
                  losing one location, 5 survives losing two.
          - path: sentinel.quorum
            type: integer
            label: Sentinel quorum
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              How many Sentinels must agree that the master is down before a failover starts. Every Sentinel
              reads it again whenever it restarts.
            rules:
              - rule: self.sentinel.quorum == null || self.sentinel.quorum <= size(self.gvc.locations)
                severity: warning
                message: >-
                  The quorum is larger than the number of Sentinels (one per location), so they can never agree
                  and no failover would ever start. Lower it, or add locations.
        rules:
          - rule: size(self.gvc.locations) >= 2
            mirrors: redis.validateLocations
            paths: [gvc.locations]
            message: The chart needs at least 2 locations. For a single location, use the redis template instead.
      - id: images
        title: Images
        fields:
          - path: redis.image
            type: string
            format: image
            label: Redis image
            required: true
            help: >-
              The default is the image this version ships with; another tag is unproven with it. After changing
              it, check that RELEASE_NAME-redis reports ready in every location before relying on it.
          - path: sentinel.image
            type: string
            format: image
            label: Sentinel image
            required: true
            help: >-
              The default is the image this version ships with; another tag is unproven with it. After changing
              it, check that RELEASE_NAME-sentinel reports ready in every location before relying on it.
        rules:
          - rule: self.redis.image == null || !self.redis.image.matches(':[^:/@]*alpine')
            paths: [redis.image]
            message: >-
              An -alpine tag fails at start with "Bad directive": the chart builds its config in a way busybox
              does not support. Use a Debian-based tag such as redis:7.2.
          - rule: self.sentinel.image == null || !self.sentinel.image.matches(':[^:/@]*alpine')
            paths: [sentinel.image]
            message: >-
              An -alpine tag fails at start with "Bad directive": the chart builds its config in a way busybox
              does not support. Use a Debian-based tag such as redis:7.2.

  - id: auth
    title: Authentication
    description: Optional passwords for Redis and for Sentinel, taken as values in this version.
    sections:
      - fields:
          - type: note
            severity: warning
            when: ui.redisAuth == 'password' || ui.sentinelAuth == 'password'
            text: >-
              This version takes the passwords as values: they are stored in the Helm release in plain text.
              From 2.1.0 the chart reads them from secrets you create instead.
      - title: Redis
        fields:
          - id: redisAuth
            virtual: true
            type: enum
            label: Redis authentication
            widget: segmented
            required: true
            init: "self.redis.password == null || self.redis.password == '' ? 'none' : 'password'"
            options:
              - value: none
                label: No password
                set: { redis.password: "" }
              - value: password
                label: Password in values
                description: Stored in the release values.
          - path: redis.password
            type: string
            absent: true
            sensitive: true
            widget: password
            label: Redis password
            required: true
            when: ui.redisAuth == 'password'
            description: >-
              Every Redis instance uses it for `requirepass` and `masterauth`, and Sentinel to reach the master.
            rules:
              # secret-redis-config.yaml / secret-sentinel-config.yaml write `requirepass <password>` unquoted into
              # the config files, which Redis splits on whitespace and quotes.
              - rule: >-
                  (oldSelf != null && self.redis.password == oldSelf.redis.password) ||
                  !self.redis.password.matches('[\\s"\']')
                severity: warning
                message: >-
                  The chart writes the password into the Redis and Sentinel config files unquoted, so a space or
                  a quote stops Redis and Sentinel from starting or changes the password. Use letters, digits and
                  other punctuation, for example the output of openssl rand -hex 24.
      - title: Sentinel
        fields:
          - id: sentinelAuth
            virtual: true
            type: enum
            label: Sentinel authentication
            widget: segmented
            required: true
            init: "self.sentinel.password == null || self.sentinel.password == '' ? 'none' : 'password'"
            options:
              - value: none
                label: No password
                set: { sentinel.password: "" }
              - value: password
                label: Password in values
                description: Stored in the release values.
          - path: sentinel.password
            type: string
            absent: true
            sensitive: true
            widget: password
            label: Sentinel password
            required: true
            when: ui.sentinelAuth == 'password'
            description: >-
              Sentinel's own password, independent of the Redis one. Every Sentinel uses it for `requirepass`.
            rules:
              - rule: >-
                  (oldSelf != null && self.sentinel.password == oldSelf.sentinel.password) ||
                  !self.sentinel.password.matches('[\\s"\']')
                severity: warning
                message: >-
                  The chart writes the password into the Sentinel config file unquoted, so a space or a quote
                  stops Sentinel from starting or changes the password. Use letters, digits and other
                  punctuation, for example the output of openssl rand -hex 24.

  - id: resources
    title: Resources and storage
    description: Compute for every Redis instance and Sentinel, and the Redis data volumes.
    sections:
      - title: Redis
        fields:
          - path: redis.resources
            type: resources
            label: Redis resources
            required: true
            description: Per instance.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: redis.volumeset.initialCapacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per Redis instance; each instance has its own volume.
            help: >-
              Data survives an upgrade but not an uninstall: uninstalling the release deletes the volume
              sets.
            docs: "/reference/volumeset#capacity-and-billing"
          - type: note
            severity: warning
            text: >-
              Extra server arguments (`redis.extraArgs` in YAML) are added to the `redis-server` command
              line as written and are not checked. A wrong value can stop Redis from
              starting or drop the replication flag that follows it.
        rules:
          - rule: >-
              oldSelf == null || oldSelf.redis.volumeset.initialCapacity == null ||
              self.redis.volumeset.initialCapacity >= oldSelf.redis.volumeset.initialCapacity
            paths: [redis.volumeset.initialCapacity]
            message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - id: autoscaling
        title: Grow the volumes automatically
        toggle: redis.volumeset.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: redis.volumeset.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: redis.volumeset.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: redis.volumeset.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.redis.volumeset.autoscaling.maxCapacity >= self.redis.volumeset.initialCapacity
            paths: [redis.volumeset.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
      - title: Sentinel
        fields:
          - path: sentinel.resources
            type: resources
            label: Sentinel resources
            required: true
            description: Per Sentinel; each location runs exactly one, with a fixed 10 GiB volume.
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - type: note
            severity: warning
            text: >-
              Extra Sentinel arguments (`sentinel.extraArgs` in YAML) are added to the `redis-sentinel`
              command line as written and are not checked. A wrong value stops Sentinel from starting.

  - id: network
    title: Network
    description: Who can connect to Redis and Sentinel inside Control Plane.
    sections:
      - id: internal
        title: Internal access
        fields:
          - path: firewall.internalAllowType
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: Applies to both Redis and Sentinel. Firewall changes take 30 to 150 seconds to take effect.
            options:
              - value: same-gvc
                label: Same GVC
                description: Any workload in the GVC this release creates.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below, which must include this release's own.
          - path: firewall.workloads
            type: list
            absent: true
            label: Allowed workloads
            widget: tags
            unique: true
            description: >-
              Workloads allowed to connect. With Specific workloads, this version admits only the listed ones,
              so the list must also hold this release's own Redis and Sentinel workloads.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
            rules:
              - when: self.firewall.internalAllowType == 'same-gvc' && self.firewall.workloads != null
                rule: "!self.firewall.workloads.exists(w, w.startsWith('//gvc/' + self.gvc.name + '/workload/'))"
                severity: info
                message: Same GVC already allows every workload in this release's GVC, so those entries can be removed from the list.
              - when: self.firewall.internalAllowType == 'same-org' && self.firewall.workloads != null
                rule: size(self.firewall.workloads) == 0
                severity: info
                message: Same org already lets every workload of the org connect, so these entries add nothing.
              # workload-redis.yaml / workload-sentinel.yaml pass firewall.workloads through verbatim, so under
              # workload-list the cluster cannot reach itself unless its own workloads are listed (fixed in 3.0.0).
              - when: self.firewall.internalAllowType == 'workload-list' && context.releaseName != null
                rule: >-
                  self.firewall.workloads != null &&
                  ('//gvc/' + self.gvc.name + '/workload/' + context.releaseName + '-redis') in self.firewall.workloads &&
                  ('//gvc/' + self.gvc.name + '/workload/' + context.releaseName + '-sentinel') in self.firewall.workloads
                severity: warning
                messageExpression: >-
                  'This version does not add its own workloads to the list, so without them Sentinel cannot reach
                  Redis, and Redis replicas cannot reach the master. Add //gvc/' +
                  self.gvc.name + '/workload/' + context.releaseName + '-redis and //gvc/' + self.gvc.name +
                  '/workload/' + context.releaseName + '-sentinel. 3.0.0 adds them itself.'
                message: >-
                  This version does not add its own workloads to the list, so without them Sentinel cannot reach
                  Redis, and Redis replicas cannot reach the master. Add this release's Redis and Sentinel
                  workloads.
                fix:
                  path: firewall.workloads
                  items: >-
                    ['//gvc/' + self.gvc.name + '/workload/' + context.releaseName + '-redis',
                    '//gvc/' + self.gvc.name + '/workload/' + context.releaseName + '-sentinel']


rules:
  # 1.0.0 and 1.0.1 created one GVC per location named <release>-<location> (or, with no locations, ran in the
  # install GVC); 1.0.2 and later create one GVC from gvc.name, so an in-place upgrade prunes the old resources.
  - rule: context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '1.0.2') >= 0
    message: >-
      Do not upgrade a 1.0.0 or 1.0.1 release in place: those versions created one GVC per location (or ran in
      the install GVC), and this upgrade deletes those resources with their volume sets and data. Install this
      version as a new release, copy the keyspace across, then uninstall the old release.

migrations:
  # 1.0.0 and 1.0.1 listed location names as plain strings with one Redis count; the upgrade itself is blocked
  # (root rule).
  - fromVersions: "<1.0.2"
    to: gvc.locations
    valueExpr: "self.locations.map(l, {'name': l, 'replicas': self.redis.replicas})"
  - fromVersions: "<1.0.2"
    from: locations
    note: The location names are carried into gvc.locations, each with the Redis count.
  - fromVersions: "<1.0.2"
    from: redis.replicas
    note: The Redis count is now set per location, in gvc.locations.
