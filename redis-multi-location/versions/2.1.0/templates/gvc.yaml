{{- include "redis.validate" . -}}
{{- /*
This chart CREATES its GVC (createsGvc: true) — it is not optional, because the
GVC is what pins the deployment's locations. The only exception is being consumed
as a subchart, where the parent renders the one GVC for the release; rendering it
here too would emit two `kind: gvc` documents for the same release.
.Chart.IsRoot is a Helm built-in, true only for the top-level chart.

NOTE for a parent chart: the dedicated load balancer below is what makes
`publicAccess` work. A parent that turns publicAccess on must enable
`spec.loadBalancer.dedicated` on ITS OWN gvc resource — this chart cannot.
*/}}
{{- if .Chart.IsRoot }}
kind: gvc
name: {{ .Values.global.gvc.name }}
description: Redis multi-location GVC
tags: {{- include "redis.tags" . | nindent 4 }}
spec:
  {{- if or .Values.redis.publicAccess.enabled .Values.sentinel.publicAccess.enabled }}
  loadBalancer:
    dedicated: true
  {{- end }}
  staticPlacement:
    locationLinks:
    {{- /*
    Sorted, because the API STORES locationLinks alphabetically. Rendering them
    in values order made every install show drift against its own manifest from
    the moment it was created.
    */}}
    {{- $names := list }}
    {{- range .Values.global.gvc.locations }}{{ $names = append $names .name }}{{ end }}
    {{- range (sortAlpha $names) }}
      - //location/{{ . }}
    {{- end }}
{{- end }}
