{{- /*
No credential appears here. `requirepass`/`masterauth` are appended at container
start from the user-created secret named by redis.passwordSecretName, because
anything written into this payload is rendered by Helm and therefore stored in
the release.
*/}}
kind: secret
name: {{ include "redis.secretConfig.name" . }}
description: Redis Secret Config
tags: {{- include "redis.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    bind 0.0.0.0
    protected-mode no
    port 6379
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    repl-backlog-size 1gb
    repl-timeout 300
    client-output-buffer-limit slave 2gb 512mb 300
