{{- include "redis-ml.validate" . -}}
{{- if .Values.redis.publicAccess.enabled }}
kind: domain
name: {{ .Values.redis.publicAccess.address }}
description: {{ .Values.redis.publicAccess.address }}
tags: {{- include "redis-ml.tags" . | nindent 2 }}
spec:
  acceptAllHosts: false
  dnsMode: cname
  {{- $total := include "redis-ml.totalReplicas" . | int }}
  {{- if gt $total 0 }}
  ports:
    {{- range $i := until $total }}
    - number: {{ add 6380 $i }}
      protocol: tcp
      routes:
        - port: 6379
          prefix: /
          replica: {{ $i }}
          workloadLink: //gvc/{{ $.Values.global.cpln.gvc }}/workload/{{ include "redis-ml.name" $ }}
    {{- end }}
  {{- end }}
{{- end }}
