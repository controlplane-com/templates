{{- /*
No credential appears here — see the Redis config secret. `sentinel auth-pass`
and `requirepass` are appended at container start from the user-created secrets.
*/}}
kind: secret
name: {{ include "redis-ml.sentinelSecretConfig.name" . }}
description: Sentinel Secret Config
tags: {{- include "redis-ml.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    dir /tmp
    sentinel announce-hostnames yes
    sentinel resolve-hostnames yes
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1
