# redis 3.0.2 — the version customers run most, in production shape: auth from a prerequisite secret
# and persistence on both tiers. Used as the starting point of an upgrade to a newer version.
locations: [aws-us-east-1]
timeoutSeconds: 600

secrets:
  auth:
    type: dictionary
    keys: [password]

vars:
  redis_password: "{secrets.auth.password}"

values:
  redis:
    replicas: 3                   # 3.0.2 defaults to 2; production runs a master and two replicas
    auth:
      fromSecret:
        enabled: true
        name: "{secrets.auth.name}"
        passwordKey: password
    persistence:
      enabled: true
  sentinel:
    auth:
      fromSecret:
        enabled: true
        name: "{secrets.auth.name}"
        passwordKey: password
    persistence:
      enabled: true
