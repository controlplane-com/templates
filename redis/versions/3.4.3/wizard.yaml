# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Redis
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: topology
    title: Topology
    description: How many Redis nodes and Sentinels.
    sections:
      - title: Redis
        fields:
          - path: redis.replicas
            type: integer
            label: Redis nodes
            min: 1
            required: true
            suggestions: [1, 2, 3, 5]
            description: One primary plus replicas, each on its own volume when persistence is on.
          - path: redis.multiZone
            type: boolean
            label: Spread Redis nodes across zones
      - title: Sentinel
        fields:
          - type: note
            text: Failover needs a quorum of Sentinels to agree.
            textExpression: >-
              self.sentinel.quorumAutoCalculation ?
              'Failover needs ' + string(self.sentinel.replicas / 2 + 1) + ' of ' + string(self.sentinel.replicas) +
              ' Sentinels to agree (replicas / 2 + 1).' :
              'Failover needs ' + (self.sentinel.quorumOverride == null ? 'the quorum' : string(self.sentinel.quorumOverride)) +
              ' of ' + string(self.sentinel.replicas) + ' Sentinels to agree.'
          - path: sentinel.replicas
            type: integer
            label: Sentinels
            min: 1
            required: true
            suggestions: [1, 3, 5]
          - path: sentinel.quorumAutoCalculation
            type: boolean
            label: Calculate the quorum automatically
            description: The quorum is replicas / 2 + 1.
          - path: sentinel.quorumOverride
            type: integer
            label: Quorum
            min: 1
            required: true
            when: "!self.sentinel.quorumAutoCalculation"
            description: How many Sentinels must agree before a failover.
          - path: sentinel.multiZone
            type: boolean
            label: Spread Sentinels across zones
        rules:
          - rule: self.sentinel.replicas % 2 == 1
            severity: info
            paths: [sentinel.replicas]
            message: An odd number of Sentinels is recommended; an even number adds no fault tolerance.
          - when: "!self.sentinel.quorumAutoCalculation"
            rule: self.sentinel.quorumOverride <= self.sentinel.replicas
            paths: [sentinel.quorumOverride]
            message: The quorum can be at most the number of Sentinels.

  - id: auth
    title: Authentication
    description: How clients authenticate to Redis and to Sentinel.
    sections:
      - title: Redis
        fields:
          - id: redisAuth
            virtual: true
            type: enum
            label: Redis authentication
            widget: segmented
            required: true
            init: >-
              self.redis.auth.fromSecret.enabled ? 'secret' :
              self.redis.auth.password.enabled ? 'password' : 'none'
            options:
              - value: none
                label: No password
                set: { redis.auth.fromSecret.enabled: false, redis.auth.password.enabled: false }
              - value: password
                label: Password in values
                description: Stored in the release values.
                set: { redis.auth.fromSecret.enabled: false, redis.auth.password.enabled: true }
              - value: secret
                label: Password from a secret
                set: { redis.auth.fromSecret.enabled: true, redis.auth.password.enabled: false }
            rules:
              - rule: "!(self.redis.auth.fromSecret.enabled && self.redis.auth.password.enabled)"
                mirrors: validateAuth
                message: Redis has both a password in values and a password secret enabled; enable only one.
              - when: oldSelf != null
                rule: >-
                  (self.redis.auth.password.enabled || self.redis.auth.fromSecret.enabled) ==
                  (oldSelf.redis.auth.password.enabled || oldSelf.redis.auth.fromSecret.enabled)
                severity: warning
                message: >-
                  Turning Redis authentication on or off on a running release deadlocks the rollout: restarted
                  nodes cannot replicate from the not-yet-restarted primary. Keep the installed setting, or reinstall.
              - rule: >-
                  self.redis.auth.fromSecret.enabled == self.sentinel.auth.fromSecret.enabled &&
                  self.redis.auth.password.enabled == self.sentinel.auth.password.enabled
                severity: info
                message: Use the same authentication method on both tiers.

          - path: redis.auth.password.value
            type: string
            label: Redis password
            sensitive: true
            widget: password
            required: true
            example: true
            rules:
              - rule: >-
                  (oldSelf != null && oldSelf.redis.auth.password.enabled &&
                  self.redis.auth.password.value == oldSelf.redis.auth.password.value) ||
                  self.redis.auth.password.value.matches("^[^\\s\\x22\\x27\\\\\\x00-\\x1f\\x7f]+$")
                message: Leave out spaces, quotes and backslashes. The chart writes the Redis password into a configuration line.
            when: ui.redisAuth == 'password'
          - path: redis.auth.fromSecret.name
            type: ref
            label: Redis password secret
            required: true
            when: ui.redisAuth == 'secret'
            description: A dictionary secret; the key named below holds the password.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: warning
              allowCreate: true
              requiredKeysFrom: "[self.redis.auth.fromSecret.passwordKey]"
              create:
                suggestName: "context.releaseName + '-redis-password'"
          - path: redis.auth.fromSecret.passwordKey
            type: string
            label: Redis password key
            required: true
            pattern: '^[-._a-zA-Z0-9]+$'
            patternMessage: Use letters, digits, -, . and _.
            when: ui.redisAuth == 'secret'
      - title: Sentinel
        fields:
          - id: sentinelAuth
            virtual: true
            type: enum
            label: Sentinel authentication
            widget: segmented
            required: true
            init: >-
              self.sentinel.auth.fromSecret.enabled ? 'secret' :
              self.sentinel.auth.password.enabled ? 'password' : 'none'
            options:
              - value: none
                label: No password
                set: { sentinel.auth.fromSecret.enabled: false, sentinel.auth.password.enabled: false }
              - value: password
                label: Password in values
                description: Stored in the release values.
                set: { sentinel.auth.fromSecret.enabled: false, sentinel.auth.password.enabled: true }
              - value: secret
                label: Password from a secret
                set: { sentinel.auth.fromSecret.enabled: true, sentinel.auth.password.enabled: false }
            rules:
              - rule: "!(self.sentinel.auth.fromSecret.enabled && self.sentinel.auth.password.enabled)"
                mirrors: validateAuth
                message: Sentinel has both a password in values and a password secret enabled; enable only one.
              - when: oldSelf != null && oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled
                rule: >-
                  (self.sentinel.auth.password.enabled || self.sentinel.auth.fromSecret.enabled) ==
                  (oldSelf.sentinel.auth.password.enabled || oldSelf.sentinel.auth.fromSecret.enabled)
                severity: warning
                message: >-
                  With Sentinel persistence on, Sentinel keeps the configuration it wrote at its first start, so
                  turning its authentication on or off does not reach it and can deadlock the rollout. Keep the
                  installed setting, or reinstall.
          - path: sentinel.auth.password.value
            type: string
            label: Sentinel password
            sensitive: true
            widget: password
            required: true
            example: true
            rules:
              - rule: >-
                  (oldSelf != null && oldSelf.sentinel.auth.password.enabled &&
                  self.sentinel.auth.password.value == oldSelf.sentinel.auth.password.value) ||
                  self.sentinel.auth.password.value.matches("^[^\\s\\x22\\x27\\\\\\x00-\\x1f\\x7f]+$")
                message: Leave out spaces, quotes and backslashes. The chart writes the Sentinel password into a configuration line.
            when: ui.sentinelAuth == 'password'
          - path: sentinel.auth.fromSecret.name
            type: ref
            label: Sentinel password secret
            required: true
            when: ui.sentinelAuth == 'secret'
            description: A dictionary secret; the key named below holds the password.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: warning
              allowCreate: true
              requiredKeysFrom: "[self.sentinel.auth.fromSecret.passwordKey]"
              create:
                suggestName: "context.releaseName + '-sentinel-password'"
          - path: sentinel.auth.fromSecret.passwordKey
            type: string
            label: Sentinel password key
            required: true
            pattern: '^[-._a-zA-Z0-9]+$'
            patternMessage: Use letters, digits, -, . and _.
            when: ui.sentinelAuth == 'secret'
    rules:
      - rule: >-
          oldSelf == null || !self.redis.auth.password.enabled ||
          !oldSelf.redis.auth.password.enabled || self.redis.auth.password.value == oldSelf.redis.auth.password.value
        severity: warning
        paths: [redis.auth.password.value]
        message: >-
          Changing the Redis password on a running release deadlocks the rollout: restarted nodes cannot
          authenticate to the old primary. Keep the installed password, or reinstall.
      - rule: >-
          oldSelf == null || !self.sentinel.auth.password.enabled || !oldSelf.sentinel.auth.password.enabled ||
          self.sentinel.auth.password.value == oldSelf.sentinel.auth.password.value
        severity: warning
        paths: [sentinel.auth.password.value]
        message: >-
          Changing the Sentinel password on a running release deadlocks the rollout. Keep the installed
          password, or reinstall.
      - rule: >-
          !self.redis.auth.password.enabled || !(self.redis.auth.password.value in ['change-me-redis-password', 'change-me-sentinel-password']) ||
          (oldSelf != null && oldSelf.redis.auth.password.enabled && oldSelf.redis.auth.password.value == self.redis.auth.password.value)
        severity: warning
        paths: [redis.auth.password.value]
        messageExpression: >-
          '`' + self.redis.auth.password.value + '` is an example Redis password that the template or its README
          publishes. Choose your own.'
        message: This is an example Redis password that the template or its README publishes. Choose your own.
      - rule: >-
          oldSelf == null || !self.redis.auth.password.enabled || oldSelf.redis.auth.password.enabled ||
          self.redis.auth.password.value != 'your-password' ||
          self.redis.auth.password.value != oldSelf.redis.auth.password.value
        severity: warning
        paths: [redis.auth.password.value]
        message: Still has the example password `your-password`, which the template publishes. Replace it.
      - rule: >-
          !self.sentinel.auth.password.enabled || !(self.sentinel.auth.password.value in ['change-me-redis-password', 'change-me-sentinel-password']) ||
          (oldSelf != null && oldSelf.sentinel.auth.password.enabled && oldSelf.sentinel.auth.password.value == self.sentinel.auth.password.value)
        severity: warning
        paths: [sentinel.auth.password.value]
        messageExpression: >-
          '`' + self.sentinel.auth.password.value + '` is an example Sentinel password that the template or its README
          publishes. Choose your own.'
        message: This is an example Sentinel password that the template or its README publishes. Choose your own.
      - rule: >-
          oldSelf == null || !self.sentinel.auth.password.enabled || oldSelf.sentinel.auth.password.enabled ||
          self.sentinel.auth.password.value != 'your-password' ||
          self.sentinel.auth.password.value != oldSelf.sentinel.auth.password.value
        severity: warning
        paths: [sentinel.auth.password.value]
        message: Still has the example password `your-password`, which the template publishes. Replace it.
      - rule: >-
          oldSelf == null || !self.redis.auth.password.enabled ||
          !(self.redis.auth.password.value in ['change-me-redis-password', 'your-password', 'change-me-sentinel-password']) ||
          !oldSelf.redis.auth.password.enabled || oldSelf.redis.auth.password.value != self.redis.auth.password.value
        severity: info
        paths: [redis.auth.password.value]
        messageExpression: >-
          'This release runs on the example password `' + self.redis.auth.password.value +
          '`, which the template publishes.' + ' To change it, reinstall the release.'
        message: >-
          This release runs on an example Redis password the template publishes.
      - rule: >-
          oldSelf == null || !self.sentinel.auth.password.enabled ||
          !(self.sentinel.auth.password.value in ['change-me-sentinel-password', 'your-password', 'change-me-redis-password']) ||
          !oldSelf.sentinel.auth.password.enabled || oldSelf.sentinel.auth.password.value != self.sentinel.auth.password.value
        severity: info
        paths: [sentinel.auth.password.value]
        messageExpression: >-
          'This release runs on the example password `' + self.sentinel.auth.password.value +
          '`, which the template publishes.' + ' To change it, reinstall the release.'
        message: >-
          This release runs on an example Sentinel password the template publishes.
  - id: resources
    title: Resources and persistence
    description: Compute per node, and optional volumes that keep data across restarts.
    sections:
      - title: Redis
        description: Per node.
        fields:
          - path: redis.resources.cpu
            type: quantity
            quantity: cpu
            label: Redis CPU limit
            required: true
          - path: redis.resources.minCpu
            type: quantity
            quantity: cpu
            label: Redis CPU reservation
            required: true
          - path: redis.resources.memory
            type: quantity
            quantity: memory
            label: Redis memory limit
            required: true
          - path: redis.resources.minMemory
            type: quantity
            quantity: memory
            label: Redis memory reservation
            required: true
        rules:
          - rule: cpuMillicores(self.redis.resources.minCpu) <= cpuMillicores(self.redis.resources.cpu)
            paths: [redis.resources.minCpu]
            message: The Redis CPU reservation must not exceed the CPU limit.
          - rule: memoryBytes(self.redis.resources.minMemory) <= memoryBytes(self.redis.resources.memory)
            paths: [redis.resources.minMemory]
            message: The Redis memory reservation must not exceed the memory limit.
          - rule: cpuMillicores(self.redis.resources.cpu) <= 4 * cpuMillicores(self.redis.resources.minCpu)
            paths: [redis.resources.minCpu]
            message: In a stateful workload the Redis CPU limit can be at most 4 times the CPU reservation.
          - rule: memoryBytes(self.redis.resources.memory) <= 4 * memoryBytes(self.redis.resources.minMemory)
            paths: [redis.resources.minMemory]
            message: In a stateful workload the Redis memory limit can be at most 4 times the memory reservation.
          - rule: "![self.redis.resources.cpu, self.redis.resources.minCpu].exists(v, string(v).matches('^[0-9]+([.][0-9]+)?$'))"
            severity: warning
            paths: [redis.resources.cpu, redis.resources.minCpu]
            message: >-
              Give the Redis CPU values a unit, such as `1000m` for one core. This version writes them unquoted,
              so a bare number reaches the platform as a number and the workload is rejected at install; 3.8.0 fixes it.
      - id: redis-volume
        title: Persistent volume for Redis
        toggle: redis.persistence.enabled
        description: Persistence is decided at install; it cannot be turned on for a running release.
        docs: /reference/volumeset
        fields:
          - type: note
            severity: warning
            text: >-
              In this version the temp-file cleanup hook that runs when a node starts can delete a file Redis is
              still writing on a fresh volume, which crashes a new node or aborts a replica's first sync. 3.8.0
              moves the cleanup into the start script.
          - path: redis.persistence.volumes.data.initialCapacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Only sizes new volumes. An existing volume keeps its size and grows only through automatic growth.
            docs: "/reference/volumeset#capacity-and-billing"
          - path: redis.persistence.volumes.data.performanceClass
            type: enum
            label: Disk class
            widget: segmented
            required: true
            immutable: The disk class is fixed when the volume set is created.
            options:
              - { value: general-purpose-ssd, label: General purpose SSD }
              - { value: high-throughput-ssd, label: High throughput SSD }
          - path: redis.persistence.volumes.data.autoscaling
            type: object
            optional: true
            label: Grow the volume automatically
            docs: "/reference/volumeset#autoscaling"
            newValue: { maxCapacity: 100, minFreePercentage: 20, scalingFactor: 1.2 }
            fields:
              - path: maxCapacity
                type: integer
                label: Maximum capacity
                unit: GiB
                min: 10
                max: 65536
                required: true
                suggestions: [50, 100, 250, 500, 1000, 2000]
              - path: minFreePercentage
                type: integer
                label: Scale up below this free space
                unit: "%"
                min: 1
                max: 100
                required: true
                suggestions: [10, 20, 30]
              - path: scalingFactor
                type: number
                label: Scaling factor
                min: 1.1
                step: 0.1
                required: true
                suggestions:
                  - { value: 1.1, label: "1.1×" }
                  - { value: 1.2, label: "1.2× (default)" }
                  - { value: 1.5, label: "1.5×" }
                  - { value: 2, label: "2×" }
          - path: redis.persistence.volumes.data.fileSystemType
            type: enum
            label: File system
            widget: segmented
            required: true
            immutable: The file system is fixed when the volume set is created.
            advanced: true
            options:
              - { value: ext4, label: ext4 }
              - { value: xfs, label: XFS }
          - path: redis.persistence.volumes.data.snapshots
            type: object
            optional: true
            label: Scheduled snapshots
            advanced: true
            docs: "/reference/volumeset#snapshots"
            newValue: { retentionDuration: 7d, schedule: "0 0 * * *" }
            fields:
              - path: retentionDuration
                type: string
                format: retention
                label: Keep snapshots for
                required: true
                placeholder: 7d
              - path: schedule
                type: string
                format: cron
                label: Schedule (UTC)
                required: true
                pattern: '^[0-5]?[0-9] [^ ]+ [^ ]+ [^ ]+ [^ ]+$'
                patternMessage: A snapshot can run at most once an hour. Set one fixed minute, for example `0 3 * * *`.
          - path: redis.persistence.volumes.data.customEncryption
            type: object
            optional: true
            absent: true
            label: Encrypt with your own KMS key
            immutable: Encryption is chosen when the volume set is created.
            advanced: true
            newValue: { enabled: true, region: "", keyId: "" }
            fields:
              - path: enabled
                type: boolean
                label: Use the KMS key
              - path: region
                type: ref
                label: Location
                required: true
                help: The location whose volumes this AWS KMS key encrypts.
                ref: { kind: location, scope: gvc, format: name, mustExist: error }
              - path: keyId
                type: string
                label: KMS key ARN
                required: true
                placeholder: arn:aws:kms:us-east-1:123456789012:key/…
        rules:
          - rule: >-
              self.redis.persistence.volumes.data.performanceClass != 'high-throughput-ssd' ||
              self.redis.persistence.volumes.data.initialCapacity >= 200
            paths: [redis.persistence.volumes.data.initialCapacity]
            message: For Redis, a high throughput SSD needs an initial capacity of at least 200 GiB.
          - rule: >-
              self.redis.persistence.volumes.data.autoscaling == null ||
              self.redis.persistence.volumes.data.autoscaling.maxCapacity >= self.redis.persistence.volumes.data.initialCapacity
            paths: [redis.persistence.volumes.data.autoscaling.maxCapacity]
            message: The maximum Redis capacity must be at least the initial capacity.
          - rule: >-
              oldSelf == null || !oldSelf.redis.persistence.enabled ||
              self.redis.persistence.volumes.data.initialCapacity >= oldSelf.redis.persistence.volumes.data.initialCapacity
            paths: [redis.persistence.volumes.data.initialCapacity]
            message: Keep the Redis capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - title: Sentinel
        description: Per Sentinel.
        fields:
          - path: sentinel.resources.cpu
            type: quantity
            quantity: cpu
            label: Sentinel CPU limit
            required: true
          - path: sentinel.resources.minCpu
            type: quantity
            quantity: cpu
            label: Sentinel CPU reservation
            required: true
          - path: sentinel.resources.memory
            type: quantity
            quantity: memory
            label: Sentinel memory limit
            required: true
          - path: sentinel.resources.minMemory
            type: quantity
            quantity: memory
            label: Sentinel memory reservation
            required: true
        rules:
          - rule: cpuMillicores(self.sentinel.resources.minCpu) <= cpuMillicores(self.sentinel.resources.cpu)
            paths: [sentinel.resources.minCpu]
            message: The Sentinel CPU reservation must not exceed the CPU limit.
          - rule: memoryBytes(self.sentinel.resources.minMemory) <= memoryBytes(self.sentinel.resources.memory)
            paths: [sentinel.resources.minMemory]
            message: The Sentinel memory reservation must not exceed the memory limit.
          - rule: cpuMillicores(self.sentinel.resources.cpu) <= 4 * cpuMillicores(self.sentinel.resources.minCpu)
            paths: [sentinel.resources.minCpu]
            message: In a stateful workload the Sentinel CPU limit can be at most 4 times the CPU reservation.
          - rule: memoryBytes(self.sentinel.resources.memory) <= 4 * memoryBytes(self.sentinel.resources.minMemory)
            paths: [sentinel.resources.minMemory]
            message: In a stateful workload the Sentinel memory limit can be at most 4 times the memory reservation.
          - rule: "![self.sentinel.resources.cpu, self.sentinel.resources.minCpu].exists(v, string(v).matches('^[0-9]+([.][0-9]+)?$'))"
            severity: warning
            paths: [sentinel.resources.cpu, sentinel.resources.minCpu]
            message: >-
              Give the Sentinel CPU values a unit, such as `1000m` for one core. This version writes them unquoted,
              so a bare number reaches the platform as a number and the workload is rejected at install; 3.8.0 fixes it.
      - id: sentinel-volume
        title: Persistent volume for Sentinel
        toggle: sentinel.persistence.enabled
        description: >-
          Recommended in production: it keeps the post-failover primary across restarts, so replicas
          rejoin the real primary. Turn it on at install; it cannot be turned on for a running release.
        fields:
          - path: sentinel.persistence.volumes.data.initialCapacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Only sizes new volumes. An existing volume keeps its size and grows only through automatic growth.
          - path: sentinel.persistence.volumes.data.performanceClass
            type: enum
            label: Disk class
            widget: segmented
            required: true
            immutable: The disk class is fixed when the volume set is created.
            options:
              - { value: general-purpose-ssd, label: General purpose SSD }
              - { value: high-throughput-ssd, label: High throughput SSD }
          - path: sentinel.persistence.volumes.data.autoscaling
            type: object
            optional: true
            label: Grow the volume automatically
            newValue: { maxCapacity: 50, minFreePercentage: 20, scalingFactor: 1.2 }
            fields:
              - path: maxCapacity
                type: integer
                label: Maximum capacity
                unit: GiB
                min: 10
                max: 65536
                required: true
                suggestions: [50, 100, 250, 500, 1000, 2000]
              - path: minFreePercentage
                type: integer
                label: Scale up below this free space
                unit: "%"
                min: 1
                max: 100
                required: true
                suggestions: [10, 20, 30]
              - path: scalingFactor
                type: number
                label: Scaling factor
                min: 1.1
                step: 0.1
                required: true
                suggestions:
                  - { value: 1.1, label: "1.1×" }
                  - { value: 1.2, label: "1.2× (default)" }
                  - { value: 1.5, label: "1.5×" }
                  - { value: 2, label: "2×" }
          - path: sentinel.persistence.volumes.data.fileSystemType
            type: enum
            label: File system
            widget: segmented
            required: true
            immutable: The file system is fixed when the volume set is created.
            advanced: true
            options:
              - { value: ext4, label: ext4 }
              - { value: xfs, label: XFS }
          - path: sentinel.persistence.volumes.data.snapshots
            type: object
            optional: true
            label: Scheduled snapshots
            advanced: true
            newValue: { retentionDuration: 7d, schedule: "0 0 * * *" }
            fields:
              - path: retentionDuration
                type: string
                format: retention
                label: Keep snapshots for
                required: true
                placeholder: 7d
              - path: schedule
                type: string
                format: cron
                label: Schedule (UTC)
                required: true
                pattern: '^[0-5]?[0-9] [^ ]+ [^ ]+ [^ ]+ [^ ]+$'
                patternMessage: A snapshot can run at most once an hour. Set one fixed minute, for example `0 3 * * *`.
          - path: sentinel.persistence.volumes.data.customEncryption
            type: object
            optional: true
            absent: true
            label: Encrypt with your own KMS key
            immutable: Encryption is chosen when the volume set is created.
            advanced: true
            newValue: { enabled: true, region: "", keyId: "" }
            fields:
              - path: enabled
                type: boolean
                label: Use the KMS key
              - path: region
                type: ref
                label: Location
                required: true
                help: The location whose volumes this AWS KMS key encrypts.
                ref: { kind: location, scope: gvc, format: name, mustExist: error }
              - path: keyId
                type: string
                label: KMS key ARN
                required: true
                placeholder: arn:aws:kms:us-east-1:123456789012:key/…
        rules:
          - rule: >-
              self.sentinel.persistence.volumes.data.performanceClass != 'high-throughput-ssd' ||
              self.sentinel.persistence.volumes.data.initialCapacity >= 200
            paths: [sentinel.persistence.volumes.data.initialCapacity]
            message: For Sentinel, a high throughput SSD needs an initial capacity of at least 200 GiB.
          - rule: >-
              self.sentinel.persistence.volumes.data.autoscaling == null ||
              self.sentinel.persistence.volumes.data.autoscaling.maxCapacity >= self.sentinel.persistence.volumes.data.initialCapacity
            paths: [sentinel.persistence.volumes.data.autoscaling.maxCapacity]
            message: The maximum Sentinel capacity must be at least the initial capacity.
          - rule: >-
              oldSelf == null || !oldSelf.sentinel.persistence.enabled ||
              self.sentinel.persistence.volumes.data.initialCapacity >= oldSelf.sentinel.persistence.volumes.data.initialCapacity
            paths: [sentinel.persistence.volumes.data.initialCapacity]
            message: Keep the Sentinel capacity at or above the installed value. Lowering it would not shrink the existing volume.
    rules:
      - rule: oldSelf == null || oldSelf.redis.persistence.enabled != true || self.redis.persistence.enabled
        severity: info
        paths: [redis.persistence.enabled]
        message: >-
          Turning persistence off deletes the Redis volume set and the data on it, and it cannot be turned on
          again for this release.
      - rule: oldSelf == null || oldSelf.redis.persistence.enabled || !self.redis.persistence.enabled
        paths: [redis.persistence.enabled]
        message: >-
          Redis persistence cannot be turned on for a running release: the rollout stalls indefinitely. Turn it
          on at install, or reinstall.
      - rule: >-
          oldSelf == null || oldSelf.sentinel.persistence.enabled ||
          !self.sentinel.persistence.enabled
        paths: [sentinel.persistence.enabled]
        message: >-
          Sentinel persistence cannot be turned on for a running release: the rollout stalls indefinitely. Turn it
          on at install, or reinstall.

  - id: network
    title: Network
    description: Internal firewall, and optional public TCP access per tier.
    sections:
      - fields:
          - type: note
            text: >-
              Setting either external CIDR list of a tier renders both; the other one becomes empty.
      - title: Redis
        fields:
          - path: redis.firewall.internal_inboundAllowType
            type: enum
            label: Internal access to Redis
            docs: "/reference/workload/firewall#internal"
            widget: cards
            required: true
            options:
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC (recommended). }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
          # workload-redis.yaml writes any non-empty list into inboundAllowWorkload, whatever the type.
          - path: redis.firewall.inboundAllowWorkload
            type: list
            absent: true
            label: Allowed workloads
            description: Extra workloads allowed to connect, for example from another GVC.
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.redis.firewall.internal_inboundAllowType == 'same-gvc'
            rules:
              - when: self.redis.firewall.internal_inboundAllowType == 'same-gvc' && context.gvc != null
                rule: "!self.redis.firewall.inboundAllowWorkload.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
                severity: info
                messageExpression: >-
                  'Same GVC already allows every workload in this GVC: ' +
                  self.redis.firewall.inboundAllowWorkload.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
                  ' can be removed from the list.'
                message: Same GVC already allows every workload in this GVC, so those entries can be removed from the Redis list.
              - when: self.redis.firewall.internal_inboundAllowType == 'same-org'
                rule: size(self.redis.firewall.inboundAllowWorkload) == 0
                severity: info
                message: Same org already lets every workload of the org connect, so these Redis entries add nothing.
          - path: redis.firewall.external_inboundAllowCIDR
            type: list
            absent: true
            serialize: csv
            label: Public inbound CIDRs
            description: Addresses allowed to connect from the internet, e.g. `0.0.0.0/0`.
            item: { type: string, format: cidr }
          - path: redis.firewall.external_outboundAllowCIDR
            type: list
            absent: true
            serialize: csv
            label: Outbound CIDRs
            description: Addresses Redis may connect to outside the platform.
            item: { type: string, format: cidr }
          - path: redis.replicaDirect
            type: boolean
            label: Per-replica internal endpoints
            when: "!self.redis.publicAccess.enabled"
            docs: "/reference/workload/general#internal-endpoint-formatting"
            description: Public access turns this on.
      - id: redis-public
        title: Public TCP access to Redis
        toggle: redis.publicAccess.enabled
        description: Publishes one port per Redis node, from 6380, and forces per-replica endpoints. Redis then listens only on these ports, also inside the GVC.
        docs: "#public-access-and-firewall"
        fields:
          - type: note
            severity: warning
            text: >-
              Before you install or turn this on, add a TXT record `_cpln-<subdomain>` with your org name and a CNAME from the
              subdomain to `<gvc-alias>.cpln.app`, with proxying off. The platform refuses the domain without the TXT record, and clients cannot reach it without the CNAME.
          - path: redis.publicAccess.address
            type: string
            format: hostname
            label: Redis hostname
            required: true
            example: true
            pattern: '^([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+(?![eE][0-9]+$)[A-Za-z]([A-Za-z0-9-]*[A-Za-z0-9])?$'
            patternMessage: Enter a host name under a domain you own, such as `redis.your-domain.com`.
            description: A subdomain you own. The chart creates a domain with this name.
        rules:
          - rule: >-
              oldSelf == null || oldSelf.redis.publicAccess.enabled || self.redis.publicAccess.address != 'redis-test.example-cpln.com'
            severity: warning
            paths: [redis.publicAccess.address]
            message: Still has the example hostname `redis-test.example-cpln.com`. Enter a host name you own.
      - title: Sentinel
        fields:
          - path: sentinel.firewall.internal_inboundAllowType
            type: enum
            label: Internal access to Sentinel
            widget: cards
            required: true
            options:
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC (recommended). }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
          # workload-sentinel.yaml writes any non-empty list into inboundAllowWorkload, whatever the type.
          - path: sentinel.firewall.inboundAllowWorkload
            type: list
            absent: true
            label: Allowed workloads
            description: Extra workloads allowed to connect, for example from another GVC.
            widget: tags
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.sentinel.firewall.internal_inboundAllowType == 'same-gvc'
            rules:
              - when: self.sentinel.firewall.internal_inboundAllowType == 'same-gvc' && context.gvc != null
                rule: "!self.sentinel.firewall.inboundAllowWorkload.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
                severity: info
                messageExpression: >-
                  'Same GVC already allows every workload in this GVC: ' +
                  self.sentinel.firewall.inboundAllowWorkload.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
                  ' can be removed from the list.'
                message: Same GVC already allows every workload in this GVC, so those entries can be removed from the Sentinel list.
              - when: self.sentinel.firewall.internal_inboundAllowType == 'same-org'
                rule: size(self.sentinel.firewall.inboundAllowWorkload) == 0
                severity: info
                message: Same org already lets every workload of the org connect, so these Sentinel entries add nothing.
          - path: sentinel.firewall.external_inboundAllowCIDR
            type: list
            absent: true
            serialize: csv
            label: Public inbound CIDRs
            description: Addresses allowed to connect from the internet, e.g. `0.0.0.0/0`.
            item: { type: string, format: cidr }
          - path: sentinel.firewall.external_outboundAllowCIDR
            type: list
            absent: true
            serialize: csv
            label: Outbound CIDRs
            description: Addresses Sentinel may connect to outside the platform.
            item: { type: string, format: cidr }
          - path: sentinel.replicaDirect
            type: boolean
            label: Per-replica internal endpoints
            when: "!self.sentinel.publicAccess.enabled"
            description: Public access turns this on.
      - id: sentinel-public
        title: Public TCP access to Sentinel
        toggle: sentinel.publicAccess.enabled
        description: Publishes one port per Sentinel, from 26380, and forces per-replica endpoints. Sentinel then listens only on these ports, also inside the GVC.
        fields:
          - type: note
            severity: warning
            text: >-
              Before you install or turn this on, add a TXT record `_cpln-<subdomain>` with your org name and a CNAME from the
              subdomain to `<gvc-alias>.cpln.app`, with proxying off. The platform refuses the domain without the TXT record, and clients cannot reach it without the CNAME.
          - path: sentinel.publicAccess.address
            type: string
            format: hostname
            label: Sentinel hostname
            required: true
            example: true
            pattern: '^([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+(?![eE][0-9]+$)[A-Za-z]([A-Za-z0-9-]*[A-Za-z0-9])?$'
            patternMessage: Enter a host name under a domain you own, such as `redis-sentinel.your-domain.com`.
            description: A subdomain you own. The chart creates a domain with this name.
        rules:
          - rule: >-
              oldSelf == null || oldSelf.sentinel.publicAccess.enabled || self.sentinel.publicAccess.address != 'redis-sentinel-test.example-cpln.com'
            severity: warning
            paths: [sentinel.publicAccess.address]
            message: Still has the example hostname `redis-sentinel-test.example-cpln.com`. Enter a host name you own.
    rules:
      - when: self.redis.firewall.internal_inboundAllowType == 'workload-list' && context.gvc != null
        rule: >-
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-redis') in self.redis.firewall.inboundAllowWorkload &&
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-sentinel') in self.redis.firewall.inboundAllowWorkload &&
          (!self.backup.enabled ||
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-redis-backup') in self.redis.firewall.inboundAllowWorkload)
        severity: warning
        paths: [redis.firewall.inboundAllowWorkload]
        messageExpression: >-
          'The chart does not add its own workloads to the list. Add //gvc/' + context.gvc + '/workload/' +
          context.releaseName + '-redis' + (self.backup.enabled ? ', ' : ' and ') + '//gvc/' + context.gvc + '/workload/' + context.releaseName + '-sentinel' +
          (self.backup.enabled ? ' and //gvc/' + context.gvc + '/workload/' + context.releaseName + '-redis-backup, or replication, failover and backups cannot reach Redis.' : ', or replication and failover cannot reach Redis.')
        fix:
          path: redis.firewall.inboundAllowWorkload
          items: >-
            ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-redis',
            '//gvc/' + context.gvc + '/workload/' + context.releaseName + '-sentinel'] +
            (self.backup.enabled ? ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-redis-backup'] : [])
        message: >-
          The chart does not add its own workloads to the list. Add the Redis, Sentinel and (with backups)
          backup workloads, or they cannot reach Redis.
      - when: self.sentinel.firewall.internal_inboundAllowType == 'workload-list' && context.gvc != null
        rule: >-
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-sentinel') in self.sentinel.firewall.inboundAllowWorkload &&
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-redis') in self.sentinel.firewall.inboundAllowWorkload
        severity: warning
        paths: [sentinel.firewall.inboundAllowWorkload]
        messageExpression: >-
          'The chart does not add its own workloads to the list. Add //gvc/' + context.gvc + '/workload/' +
          context.releaseName + '-sentinel and //gvc/' + context.gvc + '/workload/' + context.releaseName +
          '-redis, or Sentinels and Redis nodes cannot reach Sentinel.'
        fix:
          path: sentinel.firewall.inboundAllowWorkload
          items: >-
            ['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-sentinel',
            '//gvc/' + context.gvc + '/workload/' + context.releaseName + '-redis']
        message: >-
          The chart does not add its own workloads to the list. Add the Sentinel and Redis workloads, or they
          cannot reach Sentinel.
      - when: self.redis.publicAccess.enabled
        rule: >-
          context.gvcSpec == null || (has(context.gvcSpec.loadBalancer) &&
          has(context.gvcSpec.loadBalancer.dedicated) && context.gvcSpec.loadBalancer.dedicated)
        paths: [redis.publicAccess.enabled]
        message: Redis public access needs a dedicated load balancer on the GVC. Enable it in the GVC settings first.
      - when: self.sentinel.publicAccess.enabled
        rule: >-
          context.gvcSpec == null || (has(context.gvcSpec.loadBalancer) &&
          has(context.gvcSpec.loadBalancer.dedicated) && context.gvcSpec.loadBalancer.dedicated)
        paths: [sentinel.publicAccess.enabled]
        message: Sentinel public access needs a dedicated load balancer on the GVC. Enable it in the GVC settings first.
      - when: self.redis.publicAccess.enabled && self.sentinel.publicAccess.enabled
        rule: self.redis.publicAccess.address != self.sentinel.publicAccess.address
        paths: [sentinel.publicAccess.address]
        message: Redis and Sentinel need different hostnames; each tier creates its own domain.
      - when: self.redis.publicAccess.enabled
        rule: self.redis.replicas <= 10
        paths: [redis.replicas, redis.publicAccess.enabled]
        message: Public access publishes one domain port per Redis node, and a domain has at most 10 ports.
      - when: self.sentinel.publicAccess.enabled
        rule: self.sentinel.replicas <= 10
        paths: [sentinel.replicas, sentinel.publicAccess.enabled]
        message: Public access publishes one domain port per Sentinel, and a domain has at most 10 ports.
      - when: oldSelf != null && oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled
        rule: self.redis.publicAccess.enabled == oldSelf.redis.publicAccess.enabled
        severity: warning
        paths: [redis.publicAccess.enabled]
        message: >-
          With Sentinel persistence on, Sentinel keeps the Redis address it saved at its first start, so this
          change leaves the nodes replicating from an address that no longer answers and deadlocks the rollout.
          Keep the installed setting, or reinstall.
      - when: oldSelf != null && oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled
        rule: >-
          !oldSelf.redis.publicAccess.enabled || !self.redis.publicAccess.enabled ||
          self.redis.publicAccess.address == oldSelf.redis.publicAccess.address
        severity: warning
        paths: [redis.publicAccess.address]
        message: >-
          With Sentinel persistence on, Sentinel keeps the Redis address it saved at its first start, so a new
          hostname leaves the nodes replicating from an address that no longer answers and deadlocks the rollout.
          Keep the installed hostname, or reinstall.
      - rule: >-
          oldSelf == null || self.redis.publicAccess.enabled == oldSelf.redis.publicAccess.enabled ||
          (oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled)
        severity: info
        paths: [redis.publicAccess.enabled]
        message: >-
          Turning public access on or off changes the ports Redis listens on, also inside the GVC (6379, or one
          port per node from 6380), and creates or deletes its domain. Update every client first.
      - when: oldSelf != null && oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled
        rule: self.sentinel.publicAccess.enabled == oldSelf.sentinel.publicAccess.enabled
        severity: warning
        paths: [sentinel.publicAccess.enabled]
        message: >-
          With Sentinel persistence on, Sentinel keeps the configuration it wrote at its first start, so this
          change does not reach it and deadlocks the rollout. Keep the installed setting, or reinstall.
      - rule: >-
          oldSelf == null || self.sentinel.publicAccess.enabled == oldSelf.sentinel.publicAccess.enabled ||
          (oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled)
        severity: info
        paths: [sentinel.publicAccess.enabled]
        message: >-
          Turning public access on or off changes the ports Sentinel listens on, also inside the GVC (26379, or one
          port per Sentinel from 26380), and creates or deletes its domain. Update every client first.
      - rule: >-
          oldSelf == null || !oldSelf.redis.publicAccess.enabled || !self.redis.publicAccess.enabled ||
          self.redis.publicAccess.address == oldSelf.redis.publicAccess.address ||
          (oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled)
        severity: info
        paths: [redis.publicAccess.address]
        message: >-
          Changing the Redis hostname replaces the domain: the chart deletes the domain of the old hostname
          and creates one for the new hostname, whose TXT and CNAME records must exist first. Clients
          of the old hostname lose access.
      - when: self.sentinel.publicAccess.enabled && !self.redis.publicAccess.enabled
        rule: "!self.redis.replicaDirect"
        paths: [redis.replicaDirect]
        message: >-
          With Sentinel public access on, the chart leaves the location out of the per-replica Redis address
          Sentinel monitors, so Sentinel never finds the primary. Turn off per-replica endpoints for Redis, or
          turn on Redis public access too.
      - when: self.redis.publicAccess.enabled && !self.sentinel.publicAccess.enabled
        rule: "!self.sentinel.replicaDirect"
        paths: [sentinel.replicaDirect]
        message: >-
          With Redis public access on, the chart leaves the location out of the per-replica Sentinel addresses
          the Redis nodes query, so no Redis node starts. Turn off per-replica endpoints for Sentinel, or turn on
          Sentinel public access too.
      - when: oldSelf != null && oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled && !oldSelf.redis.publicAccess.enabled && !self.redis.publicAccess.enabled
        rule: "!oldSelf.redis.replicaDirect || self.redis.replicaDirect"
        severity: warning
        paths: [redis.replicaDirect]
        message: >-
          With Sentinel persistence on, Sentinel keeps the addresses it saved at its first start, so this change leaves them pointing at names that no longer resolve and can deadlock the rollout. Keep the installed setting, or reinstall.
      - when: oldSelf != null && oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled && !oldSelf.sentinel.publicAccess.enabled && !self.sentinel.publicAccess.enabled
        rule: "!oldSelf.sentinel.replicaDirect || self.sentinel.replicaDirect"
        severity: warning
        paths: [sentinel.replicaDirect]
        message: >-
          With Sentinel persistence on, Sentinel keeps the addresses it saved at its first start, so this change leaves them pointing at names that no longer resolve and can deadlock the rollout. Keep the installed setting, or reinstall.
      - when: oldSelf != null && oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled && oldSelf.sentinel.publicAccess.enabled && self.sentinel.publicAccess.enabled
        rule: self.sentinel.publicAccess.address == oldSelf.sentinel.publicAccess.address
        severity: warning
        paths: [sentinel.publicAccess.address]
        message: >-
          With Sentinel persistence on, Sentinel keeps the addresses it saved at its first start, so this change leaves them pointing at names that no longer resolve and can deadlock the rollout. Keep the installed setting, or reinstall.
      - rule: >-
          oldSelf == null || !oldSelf.sentinel.publicAccess.enabled || !self.sentinel.publicAccess.enabled ||
          self.sentinel.publicAccess.address == oldSelf.sentinel.publicAccess.address ||
          (oldSelf.sentinel.persistence.enabled && self.sentinel.persistence.enabled)
        severity: info
        paths: [sentinel.publicAccess.address]
        message: >-
          Changing the Sentinel hostname replaces the domain: the chart deletes the domain of the old hostname
          and creates one for the new hostname, whose TXT and CNAME records must exist first. Clients
          of the old hostname lose access.
      - when: self.redis.publicAccess.enabled
        rule: size(self.redis.firewall.external_inboundAllowCIDR) > 0
        severity: warning
        paths: [redis.firewall.external_inboundAllowCIDR]
        message: Redis public access is on, but no inbound CIDR is allowed, so nobody can connect from outside.
      - when: self.sentinel.publicAccess.enabled
        rule: size(self.sentinel.firewall.external_inboundAllowCIDR) > 0
        severity: warning
        paths: [sentinel.firewall.external_inboundAllowCIDR]
        message: Sentinel public access is on, but no inbound CIDR is allowed, so nobody can connect from outside.

  - id: backup
    title: Backup and monitoring
    description: Optional scheduled backups to object storage and an optional metrics exporter.
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        description: >-
          Each run uploads a gzipped RDB file. The restore steps in this version's README do not restore
          anything: `redis-cli --rdb` downloads a dump from the server instead of loading one. Plan and test
          your own restore before you rely on backups.
        docs: "#backup"
        fields:
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            rules:
              - rule: self.backup.schedule.matches('^[0-9]')
                paths: [backup.schedule]
                message: >-
                  Start the schedule with a minute number, such as `0 */2 * * *`. This version writes the schedule
                  unquoted, so one that starts with `*` or `@` stops the chart from rendering; 3.5.0 fixes it.
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        docs: "#aws-s3"
        fields:
          - type: note
            text: >-
              This version also attaches the AWS managed policy `aws::ReadOnlyAccess` to the backup identity,
              which grants read access to every bucket in the AWS account. 3.5.1 removes it.
          - type: note
            severity: warning
            when: context.mode == 'install' || (oldSelf != null && !oldSelf.backup.enabled)
            text: >-
              The bucket and the IAM policy, with the full action list from the README, must exist in your AWS
              account **before** you install or turn backups on.
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            pattern: '^(aws::)?[A-Za-z0-9/+=,.@_-]+$'
            patternMessage: Enter the policy name, not its ARN.
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - rule: >-
              oldSelf == null || (oldSelf.backup.enabled && oldSelf.backup.provider == 'aws') ||
              self.backup.aws.bucket != 'my-backup-bucket'
            severity: warning
            paths: [backup.aws.bucket]
            message: Still has the example AWS bucket `my-backup-bucket`. Enter your own bucket.
          - rule: >-
              oldSelf == null || (oldSelf.backup.enabled && oldSelf.backup.provider == 'aws') ||
              self.backup.aws.policyName != 'my-backup-policy'
            severity: warning
            paths: [backup.aws.policyName]
            message: Still has the example policy name `my-backup-policy`. Enter the IAM policy you created.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        docs: "#gcs"
        fields:
          - type: note
            severity: warning
            when: context.mode == 'install' || (oldSelf != null && !oldSelf.backup.enabled)
            text: The bucket must exist in your GCP account **before** you install or turn backups on.
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin
              role.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - rule: >-
              oldSelf == null || (oldSelf.backup.enabled && oldSelf.backup.provider == 'gcp') ||
              self.backup.gcp.bucket != 'my-backup-bucket'
            severity: warning
            paths: [backup.gcp.bucket]
            message: Still has the example GCS bucket `my-backup-bucket`. Enter your own bucket.
      - id: metrics
        title: Metrics exporter
        toggle: redis.exporter.enabled
        description: >-
          Adds a redis_exporter sidecar; metrics are scraped from :9121/metrics. Authentication is wired
          automatically.
        docs: "#metrics-exporter"
        fields:
          - path: redis.exporter.dropMetrics
            type: list
            label: Drop metrics matching
            description: Regular expressions matched against metric names, e.g. `redis_commands_latencies_usec_bucket`.
            item: { type: string, label: Metric pattern }
          - path: redis.exporter.image
            type: string
            format: image
            label: Exporter image
            required: true
            advanced: true
          - path: redis.exporter.resources.cpu
            type: quantity
            quantity: cpu
            label: Exporter CPU limit
            required: true
            advanced: true
            description: A sidecar next to each Redis node.
          - path: redis.exporter.resources.minCpu
            type: quantity
            quantity: cpu
            label: Exporter CPU reservation
            required: true
            advanced: true
          - path: redis.exporter.resources.memory
            type: quantity
            quantity: memory
            label: Exporter memory limit
            required: true
            advanced: true
          - path: redis.exporter.resources.minMemory
            type: quantity
            quantity: memory
            label: Exporter memory reservation
            required: true
            advanced: true
        rules:
          - rule: cpuMillicores(self.redis.exporter.resources.minCpu) <= cpuMillicores(self.redis.exporter.resources.cpu)
            paths: [redis.exporter.resources.minCpu]
            message: The exporter CPU reservation must not exceed the CPU limit.
          - rule: memoryBytes(self.redis.exporter.resources.minMemory) <= memoryBytes(self.redis.exporter.resources.memory)
            paths: [redis.exporter.resources.minMemory]
            message: The exporter memory reservation must not exceed the memory limit.
          - rule: cpuMillicores(self.redis.exporter.resources.cpu) <= 4 * cpuMillicores(self.redis.exporter.resources.minCpu)
            paths: [redis.exporter.resources.minCpu]
            message: In a stateful workload the exporter CPU limit can be at most 4 times the CPU reservation.
          - rule: memoryBytes(self.redis.exporter.resources.memory) <= 4 * memoryBytes(self.redis.exporter.resources.minMemory)
            paths: [redis.exporter.resources.minMemory]
            message: In a stateful workload the exporter memory limit can be at most 4 times the memory reservation.
          - rule: "![self.redis.exporter.resources.cpu, self.redis.exporter.resources.minCpu].exists(v, string(v).matches('^[0-9]+([.][0-9]+)?$'))"
            severity: warning
            paths: [redis.exporter.resources.cpu, redis.exporter.resources.minCpu]
            message: >-
              Give the exporter CPU values a unit, such as `1000m` for one core. This version writes them unquoted,
              so a bare number reaches the platform as a number and the workload is rejected at install; 3.8.0 fixes it.
    rules:
      - when: self.backup.enabled
        rule: "!self.redis.publicAccess.enabled"
        severity: warning
        paths: [backup.enabled]
        message: >-
          With public access on, Redis listens only on its public ports (6380 and up), but the backup job
          connects on 6379, so every backup run fails. Turn off one of the two.
      - rule: "!self.backup.enabled || self.backup.provider in ['aws', 'gcp']"
        mirrors: redis.validateBackupConfig
        paths: [backup.provider]
        message: Backups need a destination, aws or gcp.
      - rule: oldSelf == null || !oldSelf.backup.enabled || self.backup.provider == oldSelf.backup.provider
        severity: info
        paths: [backup.provider]
        message: >-
          Switching the destination leaves the previous provider's cloud binding on the backup identity
          until you edit the identity or reinstall.

  - id: advanced
    title: Advanced
    description: Images, timeouts, replication tuning, health probes and extra workload settings.
    sections:
      - title: Images
        fields:
          - path: redis.image
            type: string
            format: image
            label: Redis image
            required: true
          - path: sentinel.image
            type: string
            format: image
            label: Sentinel image
            required: true
        rules:
          - rule: >-
              oldSelf == null || imageMajor(self.redis.image) < 0 || imageMajor(oldSelf.redis.image) < 0 ||
              imageMajor(self.redis.image) >= imageMajor(oldSelf.redis.image)
            severity: info
            paths: [redis.image]
            message: An older Redis major version cannot load data written by the installed one.
      - title: Timeouts
        fields:
          - path: redis.timeoutSeconds
            type: integer
            label: Redis request timeout
            unit: seconds
            min: 1
            max: 3600
            required: true
          - path: sentinel.timeoutSeconds
            type: integer
            label: Sentinel request timeout
            unit: seconds
            min: 1
            max: 3600
            required: true
      - title: Replication tuning
        fields:
          - path: redis.replication.backlogSize
            type: string
            label: Replication backlog size
            required: true
            pattern: '^\d+([bB]|[kKmMgG][bB]?)?$'
            patternMessage: Enter a whole number with an optional unit (b, k, kb, m, mb, g or gb), such as `1gb`.
            description: Peak write throughput times the disconnect you want to survive without a full resync, e.g. `1gb`.
          - path: redis.replication.timeout
            type: integer
            label: Replication timeout
            unit: seconds
            min: 1
            required: true
            description: Bounds a full resync plus loading the data.
          - path: redis.replication.slaveOutputBufferLimit
            type: string
            label: Replica output buffer limit
            required: true
            pattern: '^\d+([bB]|[kKmMgG][bB]?)? \d+([bB]|[kKmMgG][bB]?)? \d+$'
            patternMessage: Enter the hard limit, the soft limit and the seconds, such as `2gb 512mb 300`.
      - title: Health probes
        fields:
          - type: note
            textExpression: >-
              'Startup window: ' + string(self.redis.probes.readiness.initialDelaySeconds +
              30 * self.redis.probes.readiness.periodSeconds) +
              ' seconds (readiness initial delay + 30 × period). Raise the period if loading the data takes longer.'
            text: The startup window is the readiness initial delay plus 30 times its period.
          - path: redis.probes.readiness.failureThreshold
            type: integer
            label: Readiness failure threshold
            min: 1
            max: 20
            required: true
          - path: redis.probes.readiness.initialDelaySeconds
            type: integer
            label: Readiness initial delay
            unit: seconds
            min: 0
            max: 600
            required: true
          - path: redis.probes.readiness.periodSeconds
            type: integer
            label: Readiness period
            unit: seconds
            min: 1
            max: 600
            required: true
          - path: redis.probes.readiness.timeoutSeconds
            type: integer
            label: Readiness timeout
            unit: seconds
            min: 1
            max: 600
            required: true
          - path: redis.probes.liveness.failureThreshold
            type: integer
            label: Liveness failure threshold
            min: 1
            max: 20
            required: true
          - path: redis.probes.liveness.initialDelaySeconds
            type: integer
            label: Liveness initial delay
            unit: seconds
            min: 0
            max: 600
            required: true
          - path: redis.probes.liveness.periodSeconds
            type: integer
            label: Liveness period
            unit: seconds
            min: 1
            max: 600
            required: true
          - path: redis.probes.liveness.timeoutSeconds
            type: integer
            label: Liveness timeout
            unit: seconds
            min: 1
            max: 600
            required: true
      - title: Redis workload
        collapsible: true
        fields:
          - type: note
            severity: warning
            text: >-
              Extra server arguments (`redis.extraArgs`), the server command (`redis.serverCommand`) and the
              data directory (`redis.dataDir`) are set in YAML only. They go to the server command line as
              written and are not checked. A wrong value stops Redis from starting.
          - path: redis.env
            type: list
            label: Extra environment variables
            widget: table
            newItem: { name: "", value: "" }
            itemLabel: "item.name == '' ? 'Variable ' + string(index + 1) : item.name"
            uniqueBy: [name]
            item:
              type: object
              fields:
                - path: name
                  type: string
                  label: Name
                  required: true
                  pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                  patternMessage: Start with a letter or _, then use letters, digits and _.
                - path: value
                  type: string
                  label: Value
          - path: redis.tags
            type: map
            label: Extra tags
            widget: kv
            values: { type: string }
          - path: redis.requestRetryPolicy
            type: object
            optional: true
            label: Request retry policy
            docs: "/reference/workload/general#retryon"
            newValue:
              attempts: 2
              retryOn: [connect-failure, refused-stream, unavailable, cancelled, resource-exhausted, retriable-status-codes]
            fields:
              - path: attempts
                type: integer
                absent: true
                label: Attempts
                min: 1
                required: true
              - path: retryOn
                type: list
                absent: true
                label: Retry on
                widget: tags
                minItems: 1
                unique: true
                item:
                  type: enum
                  label: Condition
                  options:
                    - { value: connect-failure, label: connect-failure }
                    - { value: refused-stream, label: refused-stream }
                    - { value: unavailable, label: unavailable }
                    - { value: cancelled, label: cancelled }
                    - { value: resource-exhausted, label: resource-exhausted }
                    - { value: retriable-status-codes, label: retriable-status-codes }
      - title: Sentinel workload
        collapsible: true
        fields:
          - path: sentinel.env
            type: list
            label: Extra environment variables
            widget: table
            newItem: { name: "", value: "" }
            itemLabel: "item.name == '' ? 'Variable ' + string(index + 1) : item.name"
            uniqueBy: [name]
            item:
              type: object
              fields:
                - path: name
                  type: string
                  label: Name
                  required: true
                  pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                  patternMessage: Start with a letter or _, then use letters, digits and _.
                - path: value
                  type: string
                  label: Value
          - path: sentinel.tags
            type: map
            label: Extra tags
            widget: kv
            values: { type: string }
          - path: sentinel.requestRetryPolicy
            type: object
            optional: true
            label: Request retry policy
            newValue:
              attempts: 2
              retryOn: [connect-failure, refused-stream, unavailable, cancelled, resource-exhausted, retriable-status-codes]
            fields:
              - path: attempts
                type: integer
                absent: true
                label: Attempts
                min: 1
                required: true
              - path: retryOn
                type: list
                absent: true
                label: Retry on
                widget: tags
                minItems: 1
                unique: true
                item:
                  type: enum
                  label: Condition
                  options:
                    - { value: connect-failure, label: connect-failure }
                    - { value: refused-stream, label: refused-stream }
                    - { value: unavailable, label: unavailable }
                    - { value: cancelled, label: cancelled }
                    - { value: resource-exhausted, label: resource-exhausted }
                    - { value: retriable-status-codes, label: retriable-status-codes }

rules:
  - rule: >-
      context.mode != 'upgrade' || context.fromVersion == null || oldSelf == null ||
      semverCompare(context.fromVersion, '3.1.1') >= 0 ||
      (semverCompare(context.fromVersion, '3.0.0') >= 0 &&
      !oldSelf.redis.persistence.enabled && !oldSelf.sentinel.persistence.enabled)
    messageExpression: >-
      semverCompare(context.fromVersion, '3.0.0') < 0 ?
      'Do not upgrade a ' + context.fromVersion + ' release in place: 3.x is a different chart, and the upgrade can delete the volume set that holds the data. Install this version as a new release, copy the data across, then uninstall the old release. If the release set `locations`, it created its own GVCs, which this upgrade and the uninstall delete with everything inside.' :
      'Do not upgrade this release in place: 3.1.1 renamed the volume sets (' + context.releaseName + '-redis became ' + context.releaseName + '-redis-vs, and the same for Sentinel), so the upgrade deletes the volume sets this release runs on, with their data. Install this version as a new release, copy the data across, then uninstall the old release.'
    message: >-
      Do not upgrade this release in place: this version names the volume sets differently, so the upgrade
      deletes the ones the release runs on, with their data. Install this version as a new release, copy the data
      across, then uninstall the old release.

yamlOnly:
  - path: grafana
    reason: A Kubernetes GrafanaDashboard resource for the Grafana Operator; never reconciled on the managed platform.
  - path: redis.serverCommand
    reason: Correct for the Redis images; it only matters for exotic images, and a wrong value crash-loops the nodes.
  - path: redis.dataDir
    reason: Tied to the volume mount and the temp-file cleanup hooks; there is no reason to change it.

migrations:
  - fromVersions: "<3.2.0"
    assume: { backup.enabled: false }
  - fromVersions: "<3.0.4"
    assume: { redis.replicaDirect: false, sentinel.replicaDirect: false }
  # 3.0.2 to 3.3.0 defaulted to 2 Redis nodes (3.4.0 changed the default to 3): keep the count the release runs.
  - fromVersions: ">=3.0.2 <3.4.0"
    to: redis.replicas
    valueExpr: self.redis.replicas
    note: The release keeps the number of Redis nodes it runs; raise it here if you want more.
  # 3.0.3 defaulted multiZone to true (3.0.4 changed it to false): keep the placement the release runs.
  - fromVersions: "=3.0.3"
    to: redis.multiZone
    valueExpr: self.redis.multiZone
  - fromVersions: "=3.0.3"
    to: sentinel.multiZone
    valueExpr: self.sentinel.multiZone
  # 3.0.0 and 3.0.1 defaulted to Redis Stack (3.0.2 changed the default to plain Redis): keep the server the data was written by.
  - fromVersions: ">=3.0.0 <3.0.2"
    to: redis.image
    valueExpr: self.redis.image
    note: The release keeps the image it runs; data written by Redis Stack can hold module types that plain Redis cannot load.
  - fromVersions: ">=3.0.0 <3.0.2"
    to: sentinel.image
    valueExpr: self.sentinel.image
  - fromVersions: ">=3.0.0 <3.0.2"
    to: redis.serverCommand
    valueExpr: self.redis.serverCommand
  # 3.0.0 and 3.0.1 set both external CIDR lists to 0.0.0.0/0 by default; 3.0.2 left them unset. Keep what the release runs.
  - fromVersions: ">=3.0.0 <3.0.2"
    to: redis.firewall.external_inboundAllowCIDR
    valueExpr: "(type(self.redis.firewall.external_inboundAllowCIDR) == list ? dyn(dyn(self.redis.firewall.external_inboundAllowCIDR).join(',')) : dyn(self.redis.firewall.external_inboundAllowCIDR))"
    note: >-
      The release keeps the external CIDRs it runs; 3.0.0 and 3.0.1 allowed 0.0.0.0/0 by default. Clear the
      list under Network to close external access.
  - fromVersions: ">=3.0.0 <3.0.2"
    to: redis.firewall.external_outboundAllowCIDR
    valueExpr: "(type(self.redis.firewall.external_outboundAllowCIDR) == list ? dyn(dyn(self.redis.firewall.external_outboundAllowCIDR).join(',')) : dyn(self.redis.firewall.external_outboundAllowCIDR))"
  - fromVersions: ">=3.0.0 <3.0.2"
    to: sentinel.firewall.external_inboundAllowCIDR
    valueExpr: "(type(self.sentinel.firewall.external_inboundAllowCIDR) == list ? dyn(dyn(self.sentinel.firewall.external_inboundAllowCIDR).join(',')) : dyn(self.sentinel.firewall.external_inboundAllowCIDR))"
    note: >-
      The release keeps the external CIDRs it runs; 3.0.0 and 3.0.1 allowed 0.0.0.0/0 by default. Clear the
      list under Network to close external access.
  - fromVersions: ">=3.0.0 <3.0.2"
    to: sentinel.firewall.external_outboundAllowCIDR
    valueExpr: "(type(self.sentinel.firewall.external_outboundAllowCIDR) == list ? dyn(dyn(self.sentinel.firewall.external_outboundAllowCIDR).join(',')) : dyn(self.sentinel.firewall.external_outboundAllowCIDR))"
