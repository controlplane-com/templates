{{- if .Values.redpanda_console.enabled }}
{{- $adminUser := index .Values.redpanda.auth.users 0 }}
kind: secret
name: {{ include "redpanda.secret.consoleInit.name" . }}
description: Redpanda Console startup script
tags: {{- include "redpanda.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  {{- /*
    Console reads its Kafka and Schema Registry credentials from a config file on
    disk. Those credentials are now a user-created prerequisite secret, injected as
    env vars, and a mounted secret cannot interpolate one — so the config file is
    ASSEMBLED HERE at container start. Console does document env-var overrides of
    every config key, but the assembled file needs no assumption about how a nested
    key maps to an env var name, and it keeps one readable copy of the config.
  */}}
  payload: |-
    #!/bin/sh
    set -eu

    CONF_DIR=/tmp/redpanda-console
    CONF="$CONF_DIR/config.yaml"
    mkdir -p "$CONF_DIR"
    chmod 700 "$CONF_DIR"

    NL='
    '

    # Emit a single-quoted YAML scalar — the credentials come from a secret the user
    # created and may legitimately contain : # { or '.
    yaml_str() {
      printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"
    }

    # An empty or newline-bearing credential yields a console that starts and then
    # fails every broker connection with an authentication error naming no cause.
    require() {
      if [ -z "$1" ]; then
        echo "FATAL: $2 is missing or empty. See Prerequisites in the README." >&2
        exit 1
      fi
      case "$1" in
        *"$NL"*)
          echo "FATAL: $2 contains a newline — usually a trailing newline added by echo. Recreate the secret with printf, not echo. See Prerequisites in the README." >&2
          exit 1 ;;
      esac
    }

    require "${REDPANDA_CONSOLE_USERNAME:-}" "key 'username' of the dictionary secret '{{ $adminUser.credentialsSecretName }}'"
    require "${REDPANDA_CONSOLE_PASSWORD:-}" "key 'password' of the dictionary secret '{{ $adminUser.credentialsSecretName }}'"

    USER_Q=$(yaml_str "${REDPANDA_CONSOLE_USERNAME}")
    PASS_Q=$(yaml_str "${REDPANDA_CONSOLE_PASSWORD}")

    cat > "$CONF" <<CONSOLE_CFG
    kafka:
      brokers:
        - {{ include "redpanda.clusterName" . }}:{{ .Values.redpanda.listeners.kafka.internal.port }}
      sasl:
        enabled: true
        mechanism: {{ .Values.redpanda.auth.saslMechanism }}
        username: ${USER_Q}
        password: ${PASS_Q}
    redpanda:
      adminApi:
        enabled: true
        urls:
          - http://{{ include "redpanda.clusterName" . }}:{{ .Values.redpanda.listeners.adminApi.port }}
    schemaRegistry:
      enabled: true
      urls:
        - http://{{ include "redpanda.clusterName" . }}:{{ .Values.redpanda.listeners.schemaRegistry.port }}
      authentication:
        basic:
          username: ${USER_Q}
          password: ${PASS_Q}
    CONSOLE_CFG

    chmod 600 "$CONF"

    # exec so Console becomes PID 1 and receives the shutdown signal directly
    exec /app/console
{{- end }}
