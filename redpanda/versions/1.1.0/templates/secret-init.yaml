kind: secret
name: {{ include "redpanda.name" . }}-init
description: Redpanda broker startup script
tags: {{- include "redpanda.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |
    #!/bin/bash
    set -euo pipefail

    # ── Credentials ─────────────────────────────────────────────────────────────
    # Every SASL user's username and password comes from a `dictionary` secret the
    # USER created (redpanda.auth.users[].credentialsSecretName), injected as the
    # env vars below by the workload. Redpanda reads credentials only from
    # redpanda.yaml on disk, so the config is ASSEMBLED HERE at container start
    # rather than rendered — Helm never sees a credential.

    # Emit a single-quoted YAML scalar. These values come from secrets the user
    # created, so they may legitimately contain : # { or ' — emitting them raw
    # yields a config Redpanda refuses to parse, with an error naming no cause.
    yaml_str() {
      printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"
    }

    # A credential that is empty, or carries a trailing newline, produces a cluster
    # that starts and then rejects every login. Fail here instead, naming the secret
    # and the key so the user knows exactly what to fix.
    require() {
      local value=$1 what=$2
      if [[ -z "$value" ]]; then
        echo "FATAL: $what is missing or empty. See Prerequisites in the README." >&2
        exit 1
      fi
      if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
        echo "FATAL: $what contains a newline. This is usually a trailing newline added by echo — recreate the secret with printf, not echo. See Prerequisites in the README." >&2
        exit 1
      fi
    }
    {{- range $i, $u := .Values.redpanda.auth.users }}
    require "${REDPANDA_USER_{{ $i }}_USERNAME:-}" "key 'username' of the dictionary secret '{{ $u.credentialsSecretName }}' (redpanda.auth.users[{{ $i }}])"
    require "${REDPANDA_USER_{{ $i }}_PASSWORD:-}" "key 'password' of the dictionary secret '{{ $u.credentialsSecretName }}' (redpanda.auth.users[{{ $i }}])"
    {{- end }}

    # users[0] is the cluster superuser the internal clients authenticate as.
    SUPERUSER=$(yaml_str "${REDPANDA_USER_0_USERNAME}")
    SUPERPASS=$(yaml_str "${REDPANDA_USER_0_PASSWORD}")

    # Derive pod identity from hostname (e.g. myapp-cluster-2 -> ordinal=2, cluster=myapp-cluster)
    ORDINAL=$(echo "$HOSTNAME" | awk -F'-' '{print $NF}')
    CLUSTER_NAME=$(echo "$HOSTNAME" | sed 's/-[0-9]*$//')
    NODE_FQDN="${HOSTNAME}.${CLUSTER_NAME}"
    LOCATION_NAME=$(echo "$CPLN_LOCATION" | sed 's|.*/location/\([^/]*\)$|\1|')

    # Build seed_servers so every broker knows the full cluster topology on first boot
    SEED_SERVERS=""
    for i in $(seq 0 $(( {{ .Values.redpanda.replicas }} - 1 ))); do
        SEED_SERVERS="${SEED_SERVERS}    - host:
            address: ${CLUSTER_NAME}-${i}.${CLUSTER_NAME}
            port: 33145
    "
    done

    cat > /etc/redpanda/redpanda.yaml << REDPANDA_CFG
    redpanda:
      data_directory: /var/lib/redpanda/data
      node_id: ${ORDINAL}
      enable_sasl: true
      superusers:
        - ${SUPERUSER}
    {{- range .Values.redpanda.auth.superusers }}
        - {{ . | quote }}
    {{- end }}
      seed_servers:
    ${SEED_SERVERS}
      rpc_server:
        address: 0.0.0.0
        port: 33145
      advertised_rpc_api:
        address: ${NODE_FQDN}
        port: 33145
      kafka_api:
        - address: 0.0.0.0
          port: {{ .Values.redpanda.listeners.kafka.internal.port }}
          name: internal
          authentication_method: sasl
    {{- if .Values.redpanda.listeners.kafka.external }}
        - address: 0.0.0.0
          port: {{ .Values.redpanda.listeners.kafka.external.directReplicaRouting.containerPort }}
          name: external
          authentication_method: sasl
    {{- end }}
      advertised_kafka_api:
        - address: ${NODE_FQDN}
          port: {{ .Values.redpanda.listeners.kafka.internal.port }}
          name: internal
    {{- if .Values.redpanda.listeners.kafka.external }}
        - address: ${HOSTNAME}-${LOCATION_NAME}.{{ .Values.redpanda.listeners.kafka.external.directReplicaRouting.publicAddress }}
          port: {{ .Values.redpanda.listeners.kafka.external.directReplicaRouting.containerPort }}
          name: external
    {{- end }}
      admin:
        - address: 0.0.0.0
          port: {{ .Values.redpanda.listeners.adminApi.port }}
      default_topic_replications: {{ include "redpanda.defaultReplicationFactor" . }}
      transaction_coordinator_replication: {{ include "redpanda.defaultReplicationFactor" . }}
      id_allocator_replication: {{ include "redpanda.defaultReplicationFactor" . }}
      kafka_api_allow_everyone_if_no_acl_is_set_on_client_request: {{ .Values.redpanda.acl.allowEveryoneIfNoAclFound }}
    {{- if .Values.redpanda.secrets.cluster_id }}
      cluster_id: {{ .Values.redpanda.secrets.cluster_id | quote }}
    {{- end }}
    {{- range $key, $value := .Values.redpanda.extra_configurations }}
      {{ $key }}: {{ $value }}
    {{- end }}

    schema_registry:
      schema_registry_api:
        - address: 0.0.0.0
          port: {{ .Values.redpanda.listeners.schemaRegistry.port }}
          authentication_method: http_basic

    # Redpanda v25.2+ removed ephemeral credentials for internal clients.
    # The schema registry client needs explicit SASL credentials to reach the Kafka API.
    schema_registry_client:
      scram_username: ${SUPERUSER}
      scram_password: ${SUPERPASS}
      sasl_mechanism: {{ .Values.redpanda.auth.saslMechanism }}
    {{- if .Values.redpanda.listeners.pandaproxy.enabled }}

    pandaproxy:
      pandaproxy_api:
        - address: 0.0.0.0
          port: {{ .Values.redpanda.listeners.pandaproxy.port }}
          authentication_method: http_basic

    pandaproxy_client:
      scram_username: ${SUPERUSER}
      scram_password: ${SUPERPASS}
      sasl_mechanism: {{ .Values.redpanda.auth.saslMechanism }}
    {{- end }}
    REDPANDA_CFG

    # Remove stale pid lock from previous container; safe because our new container process
    # tree is separate — once the old container exits, the kernel releases the flock.
    rm -f /var/lib/redpanda/data/pid.lock

    exec redpanda --redpanda-cfg /etc/redpanda/redpanda.yaml --smp {{ .Values.redpanda.smp }} --reserve-memory {{ .Values.redpanda.reserveMemory }}
