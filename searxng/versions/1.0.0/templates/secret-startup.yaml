{{- if .Values.redis.enabled }}
---
kind: secret
name: {{ include "searxng.secret.startup.name" . }}
description: SearXNG startup wrapper — gates the boot on the datastore being reachable
type: opaque
tags: {{- include "searxng.tags" . | nindent 4 }}
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    # Gate SearXNG's start on the datastore actually being reachable.
    #
    # WHY THIS EXISTS: searx/valkeydb.py initialize() runs ONCE, at import. If
    # the datastore is unreachable at that instant it sets _CLIENT = None and is
    # never retried. searx/limiter.py then logs an error and RETURNS WITHOUT
    # INSTALLING THE LIMITER -- and a non-public instance keeps serving happily,
    # unthrottled, for the life of the process. Nothing downstream reports it:
    # settings.yml still says `limiter: true` and /healthz still returns 200.
    #
    # Helm applies SearXNG and the datastore in the same pass, and SearXNG wins
    # the race (ready in ~13 s; the datastore answers at ~16-22 s). So without
    # this gate, a fresh install with limiter.enabled: true has NO rate limiting
    # -- precisely the shape the README recommends for a public instance.
    # Measured on a clean install 2026-08-25: 25/25 unthrottled 200s.
    #
    # The probe uses SearXNG's OWN valkey client and its OWN SEARXNG_VALKEY_URL,
    # so it proves the thing that actually has to work, including auth. A
    # TCP-level check would not: the service-mesh sidecar completes a handshake
    # for any port whether or not anything is listening behind it.
    set -e

    WAIT_SECONDS="${SEARXNG_DATASTORE_WAIT_SECONDS:-180}"
    DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))

    while :; do
      if python3 -c '
    import os, sys, valkey
    try:
        valkey.Valkey.from_url(os.environ["SEARXNG_VALKEY_URL"]).ping()
    except Exception as exc:
        print("datastore not ready: %s" % exc, file=sys.stderr)
        sys.exit(1)
    '; then
        echo "searxng-startup: datastore reachable; starting SearXNG"
        break
      fi

      if [ "$(date +%s)" -ge "$DEADLINE" ]; then
        echo "searxng-startup: FATAL - datastore unreachable after ${WAIT_SECONDS}s." >&2
        echo "searxng-startup: refusing to start, because SearXNG would come up with" >&2
        echo "searxng-startup: the limiter silently disabled. Check the redis workload." >&2
        exit 1
      fi

      sleep 2
    done

    exec /usr/local/searxng/entrypoint.sh "$@"
{{- end }}
