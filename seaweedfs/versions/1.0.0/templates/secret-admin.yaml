{{- if .Values.adminUI.enabled }}
kind: secret
name: {{ include "seaweedfs.secret.admin.name" . }}
description: SeaweedFS admin UI credentials
tags:
  {{- include "seaweedfs.tags" . | nindent 4 }}
type: dictionary
data:
  WEED_ADMIN_USER: {{ .Values.adminUI.username | quote }}
  WEED_ADMIN_PASSWORD: {{ .Values.adminUI.password | quote }}
{{- end }}
