kind: policy
name: {{ include "seaweedfs.policy.name" . }}
description: SeaweedFS policy — reveal on exactly the secrets the workload mounts
tags:
  {{- include "seaweedfs.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "seaweedfs.identity.name" . }}
targetKind: secret
targetLinks:
  # The user-created S3 credentials — reveal on exactly that one secret.
  - //secret/{{ .Values.s3.credentialsSecretName }}
  {{- if .Values.adminUI.enabled }}
  # The user-created admin UI credentials, only while the UI is enabled.
  - //secret/{{ .Values.adminUI.credentialsSecretName }}
  {{- end }}
