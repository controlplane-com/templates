{{- include "sftpgo.validate" . }}
kind: workload
name: {{ include "sftpgo.name" . }}
description: SFTPGo
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "sftpgo.tags" . | nindent 4 }}
spec:
  type: stateful
  identityLink: //identity/{{ include "sftpgo.identity.name" . }}
  containers:
    - name: sftpgo
      image: {{ .Values.image }}
      inheritEnv: false
      minCpu: {{ .Values.resources.minCpu | quote }}
      minMemory: {{ .Values.resources.minMemory | quote }}
      cpu: {{ .Values.resources.maxCpu | quote }}
      memory: {{ .Values.resources.maxMemory | quote }}
      # Builds the users file from the chart-owned template plus the password env
      # vars below, then execs SFTPGo (see sftpgo.script.start).
      command: /bin/sh
      args:
        - -c
        - {{- include "sftpgo.inlineScript" (include "sftpgo.script.start" .) | nindent 10 }}
      env:
        - name: SFTPGO_DATA_PROVIDER__DRIVER
          value: bolt
        - name: SFTPGO_DATA_PROVIDER__NAME
          value: /var/lib/sftpgo/sftpgo.db
        - name: SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN
          value: '1'
        # Admin credentials come from the prerequisite dictionary secret. SFTPGo
        # only consumes them when the data provider has no admin yet, so an
        # already-initialised volumeset keeps the admin it created.
        - name: SFTPGO_DEFAULT_ADMIN_USERNAME
          value: 'cpln://secret/{{ .Values.admin.secretName }}.username'
        - name: SFTPGO_DEFAULT_ADMIN_PASSWORD
          value: 'cpln://secret/{{ .Values.admin.secretName }}.password'
        # The start script writes the users file here; SFTPGo deletes it once loaded.
        - name: SFTPGO_LOADDATA_FROM
          value: /tmp/sftpgo-users.json
        - name: SFTPGO_LOADDATA_MODE
          value: '0'
        - name: SFTPGO_LOADDATA_CLEAN
          value: 'true'
        {{- range $i, $u := .Values.users }}
        {{- if include "sftpgo.userWantsPassword" $u }}
        # Password of users[{{ $i }}] ({{ $u.username }}), from the userPasswords secret.
        - name: USERPW_{{ $i }}
          value: 'cpln://secret/{{ $.Values.userPasswords.secretName }}.{{ $u.username }}'
        {{- end }}
        {{- end }}
        {{- if eq .Values.storage.type "minio" }}
        # S3-compatible static keys from the prerequisite secret. The users file
        # omits access_key/access_secret, so SFTPGo's AWS SDK reads these.
        - name: AWS_ACCESS_KEY_ID
          value: 'cpln://secret/{{ .Values.storage.minio.credentialsSecretName }}.accessKey'
        - name: AWS_SECRET_ACCESS_KEY
          value: 'cpln://secret/{{ .Values.storage.minio.credentialsSecretName }}.secretKey'
        {{- end }}
        - name: SFTPGO_SFTPD__BINDINGS__0__PORT
          value: '2022'
        - name: SFTPGO_HTTPD__BINDINGS__0__PORT
          value: '8080'
      ports:
        - number: 2022
          protocol: tcp
        {{- if .Values.webAdmin.enabled }}
        - number: 8080
          protocol: http
        {{- end }}
      volumes:
        - path: /var/lib/sftpgo
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "sftpgo.volume.name" . }}
        - path: /etc/sftpgo/users.json
          recoveryPolicy: retain
          uri: cpln://secret/{{ include "sftpgo.secretUsers.name" . }}.payload
      readinessProbe:
        tcpSocket:
          port: 2022
        initialDelaySeconds: 1
        periodSeconds: 2
        failureThreshold: 20
        successThreshold: 1
        timeoutSeconds: 2
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 30
        failureThreshold: 5
        successThreshold: 1
        timeoutSeconds: 5
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 1
      metric: disabled
      minScale: 1
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 30
  # The image runs as UID/GID 1000 with no root entrypoint to chown
  # the freshly-provisioned (root-owned) volumeset mount. filesystemGroupId makes
  # /var/lib/sftpgo group-owned and group-writable by GID 1000 so SFTPGo can
  # create its bolt database and SSH host keys on first boot.
  securityOptions:
    filesystemGroupId: 1000
  firewallConfig:
    external:
      outboundAllowCIDR:
        - 0.0.0.0/0
      {{- if and (eq .Values.mode "always_warm") .Values.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if eq .Values.internalAccess.type "workload-list" }}
      inboundAllowWorkload:
        {{- range .Values.internalAccess.workloads }}
        - {{ . }}
        {{- end }}
        {{- if eq .Values.mode "scale_to_zero" }}
        - //gvc/{{ .Values.global.cpln.gvc }}/workload/{{ include "sftpgo.proxy.name" . }}
        {{- end }}
      {{- end }}
  {{- if and (eq .Values.mode "always_warm") .Values.publicAccess.enabled }}
  loadBalancer:
    direct:
      enabled: true
      ports:
        - containerPort: 2022
          externalPort: 2022
          protocol: TCP
          scheme: tcp
  {{- end }}
