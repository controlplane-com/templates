# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: SFTPGo

steps:
  - id: mode
    title: Mode
    description: Whether SFTPGo sleeps when idle behind a small always-on proxy, or stays running.
    sections:
      - docs: "#mode-and-scale-to-zero"
        fields:
          - path: mode
            type: enum
            label: Mode
            widget: cards
            required: true
            options:
              - value: scale_to_zero
                label: Scale to zero
                description: >-
                  SFTPGo suspends when idle; the proxy wakes it on the next connection. Clients
                  need a timeout of at least 120 seconds.
              - value: always_warm
                label: Always warm
                description: SFTPGo runs all the time with its own endpoint. Works with any client.
          - type: note
            severity: warning
            when: context.mode == 'upgrade' && oldSelf != null && self.mode != oldSelf.mode
            text: >-
              Switching modes moves the client-facing endpoint between the proxy and SFTPGo
              workloads. Plan a client cutover.
      - title: Scale to zero
        when: self.mode == 'scale_to_zero'
        fields:
          - path: scaleToZero.idleHold
            type: string
            label: Suspend after idle
            required: true
            pattern: '^[0-9]+(ms|s|m|h)$'
            patternMessage: A duration such as 90s, 5m or 1h.
            suggestions: [90s, 5m, 15m, 1h]
            description: SFTPGo suspends after this long with no active connection.
          - path: scaleToZero.proxy.image
            type: string
            format: image
            label: Proxy image
            required: true
            advanced: true
          - path: scaleToZero.proxy.resources
            type: resources
            label: Proxy resources
            required: true
            advanced: true
            description: All SFTP traffic flows through the proxy.

  - id: admin
    title: Administrator
    description: The prerequisite secret with the SFTPGo administrator login.
    fields:
      - type: note
        severity: warning
        text: >-
          The secrets this template reads must exist **before** you install. If one is missing,
          the deployment waits and `cpln logs` shows nothing at all.
      - path: admin.secretName
        type: ref
        label: Administrator secret
        required: true
        description: A dictionary secret with the keys `username` and `password`.
        help: >-
          This login guards the REST API and web admin. SFTPGo reads it only when its database
          has no administrator yet, on first boot; later changes go through the web admin or API.
        docs: "#admin-credentials-secret"
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeys: [username, password]
          create:
            secretType: dictionary
            suggestName: "context.releaseName + '-sftpgo-admin'"
    rules:
      - rule: "!has(self.admin.username) && !has(self.admin.password)"
        mirrors: sftpgo.validateRemovedKeys
        paths: [admin.secretName]
        message: >-
          admin.username and admin.password were removed in 1.1.0. Put them in the administrator
          secret and remove them from the values.
      - rule: oldSelf == null || self.admin.secretName == oldSelf.admin.secretName
        severity: info
        paths: [admin.secretName]
        message: >-
          SFTPGo reads the administrator login only on first boot; pointing at another secret
          does not change the existing administrator.

  - id: storage
    title: Storage
    description: The bucket that holds the SFTP files.
    sections:
      - docs: "#storage-backend"
        fields:
          - path: storage.type
            type: enum
            label: Storage backend
            widget: cards
            required: true
            options:
              - value: aws
                label: AWS S3
                description: Keyless, through a Control Plane cloud account.
              - value: gcp
                label: Google Cloud Storage
                description: Keyless, through a Control Plane cloud account.
              - value: minio
                label: S3-compatible
                description: MinIO, R2, Wasabi and others, with access keys from a secret.
      - title: AWS S3
        when: self.storage.type == 'aws'
        fields:
          - type: note
            severity: warning
            text: >-
              The bucket, the AWS cloud account and the IAM policy must exist **before** you install; the README's Storage setup section has the steps.
          - path: storage.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: storage.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: storage.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) for the bucket's account."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: >-
              An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
              The README has the policy JSON.
          - path: storage.aws.keyPrefix
            type: string
            label: Folder prefix
            placeholder: sftp/
            description: Optional bucket-wide folder; each user gets a folder below it.
      - title: Google Cloud Storage
        when: self.storage.type == 'gcp'
        fields:
          - type: note
            severity: warning
            text: >-
              The bucket and the GCP cloud account must exist **before** you install; the README's Storage setup section has the steps.
          - path: storage.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account). The template grants the
              workload `roles/storage.objectAdmin` on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: storage.gcp.keyPrefix
            type: string
            label: Folder prefix
            placeholder: sftp/
            description: Optional bucket-wide folder; each user gets a folder below it.
      - title: S3-compatible
        when: self.storage.type == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
              The bucket and the access keys secret must exist **before** you install; the README's Storage setup section has the steps.
          - type: note
            severity: warning
            when: context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '1.2.0') < 0
            text: >-
              Put the access keys this release uses **today** in the access keys secret; other keys
              lose access to the files already in the bucket.
          - path: storage.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://WORKLOAD_NAME.GVC_NAME.cpln.local:9000
            description: The URL including the scheme and port.
          - path: storage.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.minio.region
            type: string
            label: Region
            required: true
            placeholder: us-east-1
          - path: storage.minio.credentialsSecretName
            type: ref
            label: Access keys secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            help: To use new keys later, update the secret and force a redeployment of the SFTPGo workload.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
              create:
                secretType: dictionary
                suggestName: "context.releaseName + '-sftpgo-minio-credentials'"
          - path: storage.minio.keyPrefix
            type: string
            label: Folder prefix
            placeholder: sftp/
            description: Optional bucket-wide folder; each user gets a folder below it.
        rules:
          - rule: self.storage.minio.credentialsSecretName != context.releaseName + '-sftpgo-users'
            mirrors: sftpgo.validate
            paths: [storage.minio.credentialsSecretName]
            message: The chart creates a secret with this name itself. Name your secret something else.
    rules:
      - rule: "!has(self.storage.minio.accessKey) && !has(self.storage.minio.accessSecret)"
        mirrors: sftpgo.validateRemovedKeys
        paths: [storage.type]
        message: >-
          storage.minio.accessKey and storage.minio.accessSecret were removed in 1.2.0. Put them
          in a dictionary secret with the keys accessKey and secretKey, and remove them from the
          values.

  - id: users
    title: Users
    description: The SFTP logins. Each user is isolated to its own folder in the bucket.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'upgrade' && context.fromVersion != null && semverCompare(context.fromVersion, '1.2.0') < 0
        text: >-
          Passwords moved out of the values in 1.2.0. Create the passwords secret with each user's
          **current** password (read them with `cpln secret reveal RELEASE_NAME-sftpgo-users -o yaml`);
          a new value changes that user's login. A user with keys and a password keeps both through
          Password too. If the deployment then reports it is not allowed to reveal the secret, wait
          about 5 minutes and force a redeployment.
      - path: users
        type: list
        label: Users
        required: true
        uniqueBy: [username]
        widget: table
        newItem: { username: "", publicKeys: [] }
        itemLabel: item.username
        description: >-
          Declared users are re-applied on every start, so edits to them in the web admin are
          reverted. A user without public keys logs in with a password from the passwords secret.
        docs: "#users"
        item:
          type: object
          fields:
            - path: username
              type: string
              label: Username
              required: true
            - path: publicKeys
              type: list
              label: SSH public keys
              item: { type: string, placeholder: ssh-ed25519 AAAA... user@host }
            - path: passwordLogin
              type: boolean
              absent: true
              label: Password too
              description: >-
                Only for users with SSH keys: also accept a password. Users without keys always log in
                with a password.
            - path: keyPrefix
              type: string
              absent: true
              label: Folder override
              placeholder: custom/folder/
          rules:
            - rule: "!has(item.password)"
              mirrors: sftpgo.validateRemovedKeys
              paths: [username]
              message: >-
                users[].password was removed in 1.2.0. Put the password in the passwords secret
                under this username, and remove it from the values.
            - rule: >-
                (has(item.passwordLogin) && item.passwordLogin != null) ? (item.passwordLogin ||
                size(item.publicKeys) > 0) : true
              mirrors: sftpgo.validate
              paths: [passwordLogin]
              message: A user with password login off needs at least one public key, or it can never log in.
      - path: userPasswords.secretName
        type: ref
        label: User passwords secret
        required: true
        when: >-
          self.users.exists(u, (has(u.passwordLogin) && u.passwordLogin != null) ?
          u.passwordLogin : (!has(u.publicKeys) || u.publicKeys == null || size(u.publicKeys) == 0))
        description: >-
          A dictionary secret with one key per password user: the key is the username, the value
          its password.
        help: >-
          The value in this secret is the password: SFTPGo re-applies it on every start. To change
          a password, update the secret and force a redeployment of the SFTPGo workload.
        ref:
          kind: secret
          format: name
          filter: { secretType: [dictionary] }
          mustExist: error
          allowCreate: true
          requiredKeysFrom: >-
            self.users.filter(u, (has(u.passwordLogin) && u.passwordLogin != null) ?
            u.passwordLogin : (!has(u.publicKeys) || u.publicKeys == null ||
            size(u.publicKeys) == 0)).map(u, u.username)
          create:
            secretType: dictionary
            suggestName: "context.releaseName + '-sftpgo-user-passwords'"
    rules:
      - rule: self.userPasswords.secretName != context.releaseName + '-sftpgo-users'
        mirrors: sftpgo.validate
        paths: [userPasswords.secretName]
        message: The chart creates a secret with this name itself. Name your secret something else.

  - id: network
    title: Network
    description: Who can reach SFTP, and the web admin.
    sections:
      - title: Access
        docs: "#access"
        fields:
          - path: publicAccess.enabled
            type: boolean
            label: Public SFTP endpoint
            description: >-
              A dedicated load balancer on port 2022, on the proxy in scale-to-zero mode or on
              SFTPGo in always-warm mode.
          - path: internalAccess.type
            type: enum
            label: Who in Control Plane can connect to SFTPGo
            widget: cards
            required: true
            description: Firewall changes take up to a few minutes to take effect.
            options:
              - value: none
                label: None
                description: No workload can connect. Not allowed in scale-to-zero mode.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below, plus the proxy.
          - path: internalAccess.workloads
            type: list
            label: Allowed workloads
            when: self.internalAccess.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
          - path: webAdmin.enabled
            type: boolean
            label: Web admin port
            description: >-
              Declares SFTPGo's web admin and REST API port 8080. Reach it with
              `cpln port-forward`; the public endpoint serves SFTP only.
    rules:
      - rule: "!(self.mode == 'scale_to_zero' && self.internalAccess.type == 'none')"
        mirrors: sftpgo.validate
        paths: [internalAccess.type]
        message: Scale-to-zero mode needs internal access, so the proxy can reach SFTPGo.

  - id: server
    title: Server
    description: The SFTPGo image, its compute and the volume for its database and host keys.
    fields:
      - path: image
        type: string
        format: image
        label: SFTPGo image
        required: true
        help: >-
          Use an `alpine-slim` or `slim` tag: the chart runs a start script, which needs
          `/bin/sh` and `awk`. `distroless` tags have neither and do not start.
      - path: resources
        type: resources
        label: Resources
        required: true
        maxRatio: 4
        description: CPU governs transfer throughput and wake speed.
      - path: volumeset.capacity
        type: integer
        label: Volume capacity
        unit: GiB
        min: 10
        required: true
        description: Holds the embedded database and SSH host keys.
    rules:
      - rule: oldSelf == null || self.volumeset.capacity >= oldSelf.volumeset.capacity
        paths: [volumeset.capacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volume.

migrations:
  - fromVersions: "<1.1.0"
    from: admin.username
    note: The administrator login moved to a dictionary secret with the keys username and password; choose it under Administrator.
  - fromVersions: "<1.1.0"
    from: admin.password
    note: The administrator login moved to a dictionary secret with the keys username and password; choose it under Administrator.
  - fromVersions: "<1.2.0"
    from: storage.minio.accessKey
    note: S3-compatible keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Storage.
  - fromVersions: "<1.2.0"
    from: storage.minio.accessSecret
    note: S3-compatible keys moved to a dictionary secret with the keys accessKey and secretKey (put the old accessSecret under secretKey); choose it under Storage.
  - fromVersions: "<1.2.0"
    to: users
    valueExpr: >-
      self.users.map(u,
      (has(u.password) && u.password != null && u.password != '' && has(u.publicKeys) && u.publicKeys != null && size(u.publicKeys) > 0)
      ? (has(u.keyPrefix)
        ? {'username': u.username, 'publicKeys': u.publicKeys, 'passwordLogin': true, 'keyPrefix': u.keyPrefix}
        : {'username': u.username, 'publicKeys': u.publicKeys, 'passwordLogin': true})
      : (has(u.keyPrefix)
        ? {'username': u.username, 'publicKeys': (has(u.publicKeys) && u.publicKeys != null) ? u.publicKeys : [], 'keyPrefix': u.keyPrefix}
        : {'username': u.username, 'publicKeys': (has(u.publicKeys) && u.publicKeys != null) ? u.publicKeys : []}))
    note: >-
      User passwords moved to a dictionary secret keyed by username; choose it under Users. Put in
      each user's current password so the logins keep working. A user that had a password and
      public keys keeps both through passwordLogin.
