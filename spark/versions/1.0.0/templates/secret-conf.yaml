{{- include "spark.validate" . -}}
kind: secret
name: {{ include "spark.secret.conf.name" . }}
description: Rendered spark-defaults.conf (reverse proxy, pinned ports, event-log + S3A config)
tags:
  {{- include "spark.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    # ── Managed by the Control Plane Spark template ──
    # Reverse proxy: worker (:8081) and application (:4040) UIs are reachable
    # behind the Master UI, so only the master needs an ingress.
    spark.ui.reverseProxy               true
    # Pinned RPC / block-manager ports so driver<->executor traffic uses known,
    # firewall-declared ports across cpln workloads (default random ports are not
    # reachable through the mesh).
    spark.driver.port                   7071
    spark.driver.blockManager.port      7072
    spark.blockManager.port             7079
    {{- if .Values.historyServer.enabled }}
    # ── Event logging → object storage (History Server reads the same path) ──
    spark.eventLog.enabled              true
    # extraClassPath puts the boot-prelude connector jars on the driver AND
    # executor classpath. spark-defaults.conf is read by every spark-submit, so a
    # job submitted from a fresh exec shell can load S3AFileSystem and WRITE the
    # event log — the daemons get the same jars via SPARK_DIST_CLASSPATH.
    spark.driver.extraClassPath         {{ include "spark.extraJarsCp" . }}
    spark.executor.extraClassPath       {{ include "spark.extraJarsCp" . }}
    {{- if eq .Values.storage.provider "aws" }}
    spark.eventLog.dir                  s3a://{{ .Values.storage.bucket }}/{{ .Values.storage.prefix }}
    spark.history.fs.logDirectory       s3a://{{ .Values.storage.bucket }}/{{ .Values.storage.prefix }}
    spark.hadoop.fs.s3a.impl            org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.endpoint.region {{ .Values.storage.region }}
    # Keyless: the workload identity's cloud-account credentials are vended into
    # the AWS SDK default chain; S3A's default provider chain consumes them.
    spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.auth.IAMInstanceCredentialsProvider
    {{- end }}
    {{- if eq .Values.storage.provider "gcp" }}
    spark.eventLog.dir                  gs://{{ .Values.storage.bucket }}/{{ .Values.storage.prefix }}
    spark.history.fs.logDirectory       gs://{{ .Values.storage.bucket }}/{{ .Values.storage.prefix }}
    spark.hadoop.fs.gs.impl             com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem
    spark.hadoop.fs.AbstractFileSystem.gs.impl com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS
    # Keyless: the workload identity's GCP service-account credentials via ADC.
    spark.hadoop.fs.gs.auth.type        APPLICATION_DEFAULT
    {{- end }}
    {{- end }}
    {{- range $k, $v := .Values.sparkDefaults }}
    {{ $k }} {{ $v | quote }}
    {{- end }}
