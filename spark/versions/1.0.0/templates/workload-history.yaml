{{- if .Values.historyServer.enabled }}
{{- include "spark.validate" . -}}
kind: workload
name: {{ include "spark.history.name" . }}
description: Apache Spark History Server (Web UI :18080, object-storage backed)
tags:
  {{- include "spark.tags" . | nindent 4 }}
spec:
  type: standard
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "spark.identity.name" . }}
  containers:
    - name: spark-history
      image: {{ .Values.image }}
      inheritEnv: false
      command: "/bin/bash"
      args:
        - "-c"
        - |
          set -euo pipefail
          export SPARK_LOCAL_IP="$(hostname -i | awk '{print $1}')"
          {{- if eq .Values.storage.provider "aws" }}
          export SPARK_HISTORY_OPTS="-Dspark.history.fs.logDirectory=s3a://{{ .Values.storage.bucket }}/{{ .Values.storage.prefix }}"
          {{- end }}
          {{- if eq .Values.storage.provider "gcp" }}
          export SPARK_HISTORY_OPTS="-Dspark.history.fs.logDirectory=gs://{{ .Values.storage.bucket }}/{{ .Values.storage.prefix }}"
          {{- end }}
          {{- include "spark.jarPrelude" . | nindent 10 }}
          exec /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
      minCpu: {{ .Values.historyServer.minCpu | quote }}
      minMemory: {{ .Values.historyServer.minMemory | quote }}
      cpu: {{ .Values.historyServer.maxCpu | quote }}
      memory: {{ .Values.historyServer.maxMemory | quote }}
      ports:
        - number: 18080
          protocol: http
      volumes:
        - path: /opt/spark/conf/spark-defaults.conf
          uri: cpln://secret/{{ include "spark.secret.conf.name" . }}.payload
      readinessProbe:
        httpGet:
          path: /
          port: 18080
        initialDelaySeconds: 20
        periodSeconds: 15
        timeoutSeconds: 3
        failureThreshold: 20
      livenessProbe:
        httpGet:
          path: /
          port: 18080
        initialDelaySeconds: 40
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 6
  defaultOptions:
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 30
    autoscaling:
      metric: disabled
      minScale: 1
      maxScale: 1
      maxConcurrency: 0
      target: 100
      scaleToZeroDelay: 300
  firewallConfig:
    external:
      {{- if .Values.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundBlockedCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- end }}
  supportDynamicTags: false
{{- end }}
