{{- include "spark.validate" . -}}
kind: workload
name: {{ include "spark.worker.name" . }}
description: Apache Spark worker (executor host tier + Web UI :8081)
tags:
  {{- include "spark.tags" . | nindent 4 }}
spec:
  type: standard
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "spark.identity.name" . }}
  containers:
    - name: spark-worker
      image: {{ .Values.image }}
      inheritEnv: false
      command: "/bin/bash"
      args:
        - "-c"
        - |
          set -euo pipefail
          # Advertise the pod IP for RPC (via --host); leave SPARK_LOCAL_IP unset
          # so the Web UI binds 0.0.0.0 (reachable via the master reverse proxy).
          POD_IP="$(hostname -i | awk '{print $1}')"
          export SPARK_PUBLIC_DNS="$POD_IP"
          {{- if .Values.publicAccess.enabled }}
          # The worker generates its own page's links (incl. "Back to Master"), so it
          # needs the SAME external base as the master. Derive the master's public URL
          # from this worker's own per-workload endpoint by swapping the workload-name
          # prefix (form-agnostic — works whether or not the host carries an org alias).
          MASTER_PUBLIC=$(printf '%s' "${CPLN_GLOBAL_ENDPOINT%/}" | sed 's#{{ include "spark.worker.name" . }}#{{ include "spark.master.name" . }}#')
          export SPARK_DAEMON_JAVA_OPTS="${SPARK_DAEMON_JAVA_OPTS:-} -Dspark.ui.reverseProxyUrl=${MASTER_PUBLIC}"
          {{- end }}
          {{- include "spark.jarPrelude" . | nindent 10 }}
          exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
            {{ include "spark.master.url" . }} \
            --host "$POD_IP" --port 7078 --webui-port 8081 \
            --cores {{ .Values.workers.cores }} --memory {{ .Values.workers.memory }}
      minCpu: {{ .Values.workers.minCpu | quote }}
      minMemory: {{ .Values.workers.minMemory | quote }}
      cpu: {{ .Values.workers.maxCpu | quote }}
      memory: {{ .Values.workers.maxMemory | quote }}
      ports:
        - number: 8081
          protocol: tcp
        - number: 7078
          protocol: tcp
        - number: 7079
          protocol: tcp
        - number: 4040
          protocol: tcp
      volumes:
        - path: /opt/spark/conf/spark-defaults.conf
          uri: cpln://secret/{{ include "spark.secret.conf.name" . }}.payload
      readinessProbe:
        httpGet:
          path: /
          port: 8081
        initialDelaySeconds: 15
        periodSeconds: {{ if .Values.historyServer.enabled }}15{{ else }}10{{ end }}
        timeoutSeconds: 3
        failureThreshold: {{ if .Values.historyServer.enabled }}20{{ else }}6{{ end }}
      livenessProbe:
        httpGet:
          path: /
          port: 8081
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 6
  defaultOptions:
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 30
    autoscaling:
      metric: disabled
      minScale: {{ .Values.workers.replicas }}
      maxScale: {{ .Values.workers.replicas }}
      maxConcurrency: 0
      target: 100
      scaleToZeroDelay: 300
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundBlockedCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
    internal:
      inboundAllowType: {{ .Values.internalAccess.type }}
      {{- if .Values.internalAccess.workloads }}
      inboundAllowWorkload: {{ .Values.internalAccess.workloads | toYaml | nindent 8 }}
      {{- end }}
  supportDynamicTags: false
