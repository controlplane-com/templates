---
kind: secret
name: {{ include "supabase.kong.config.secret.name" . }}
description: Kong declarative routing config template for Supabase — key placeholders are filled in at container start
tags: {{- include "supabase.tags" . | nindent 2 }}
type: opaque
data:
  encoding: plain
  payload: |-
    # The API keys and the dashboard password below are placeholders, substituted
    # at container start from the prerequisite secrets (see workload-kong.yaml).
    # Kong 2.8 cannot read env vars from declarative config, so no credential is
    # ever rendered by Helm or stored in this secret.
    _format_version: '2.1'

    services:
      # Auth — open endpoints (no API key required)
      - name: auth-v1-open-verify
        url: http://{{ include "supabase.auth.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9999/verify
        routes:
          - name: auth-v1-open-verify
            strip_path: true
            paths:
              - /auth/v1/verify
        plugins:
          - name: cors

      - name: auth-v1-open-callback
        url: http://{{ include "supabase.auth.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9999/callback
        routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths:
              - /auth/v1/callback
        plugins:
          - name: cors

      - name: auth-v1-open-authorize
        url: http://{{ include "supabase.auth.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9999/authorize
        routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths:
              - /auth/v1/authorize
        plugins:
          - name: cors

      # Auth — health check (no key-auth, used by readiness probe)
      - name: auth-v1-open-health
        url: http://{{ include "supabase.auth.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9999/health
        routes:
          - name: auth-v1-open-health
            strip_path: true
            paths:
              - /auth/v1/health
        plugins:
          - name: cors

      # Auth — admin endpoints (service role JWT injected so GoTrue gets the right
      # Authorization). Because the bearer is injected, Kong itself is the only
      # authorization check: the `acl` plugin below restricts this route to the
      # `admin` group, which only the service_role consumer belongs to. Without it
      # the published anon key would be promoted to service_role on every call.
      - name: auth-v1-admin
        url: http://{{ include "supabase.auth.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9999/admin/
        routes:
          - name: auth-v1-admin-all
            strip_path: true
            paths:
              - /auth/v1/admin/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
              key_names:
                - apikey
                - Authorization
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
          - name: request-transformer
            config:
              replace:
                headers:
                  - "Authorization:Bearer __SUPABASE_SERVICE_ROLE_KEY__"
              add:
                headers:
                  - "Authorization:Bearer __SUPABASE_SERVICE_ROLE_KEY__"

      # Auth — protected endpoints
      - name: auth-v1
        url: http://{{ include "supabase.auth.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:9999/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths:
              - /auth/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
              key_names:
                - apikey
                - Authorization
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      # PostgREST — REST API
      - name: rest-v1
        url: http://{{ include "supabase.postgrest.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:3000/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths:
              - /rest/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
              key_names:
                - apikey
                - Authorization
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
    {{- if .Values.realtime.enabled }}

      # Realtime — WebSocket subscriptions
      - name: realtime-v1
        url: http://{{ include "supabase.realtime.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:4000/socket/
        routes:
          - name: realtime-v1-all
            strip_path: true
            paths:
              - /realtime/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
              key_names:
                - apikey
                - Authorization
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
    {{- end }}
    {{- if .Values.storage.enabled }}

      # Storage — file/object storage
      - name: storage-v1
        url: http://{{ include "supabase.storage.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:5000/
        routes:
          - name: storage-v1-all
            strip_path: true
            paths:
              - /storage/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
              key_names:
                - apikey
                - Authorization
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
    {{- end }}
    {{- if .Values.studio.enabled }}

      # pg_meta — runs as a sidecar on the Studio workload. It connects to Postgres
      # as supabase_admin and can execute arbitrary SQL, so it is admin-only.
      - name: meta
        url: http://{{ include "supabase.studio.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:8080/
        routes:
          - name: meta-all
            strip_path: true
            paths:
              - /pg/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
              key_names:
                - apikey
                - Authorization
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin

      # Studio dashboard — catch-all, matched only when no API route above does.
      # basic-auth is the dashboard's only login; Studio itself enforces nothing.
      - name: dashboard
        url: http://{{ include "supabase.studio.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:3000/
        routes:
          - name: dashboard-all
            strip_path: true
            paths:
              - /
        plugins:
          - name: cors
          - name: basic-auth
            config:
              hide_credentials: true
    {{- end }}

    consumers:
      - username: anon
        keyauth_credentials:
          - key: __SUPABASE_ANON_KEY__
      - username: service_role
        keyauth_credentials:
          - key: __SUPABASE_SERVICE_ROLE_KEY__
    {{- if .Values.studio.enabled }}
      - username: DASHBOARD
    {{- end }}

    # Group membership behind the `acl` plugin: only service_role is an admin, so
    # only it can reach /auth/v1/admin/ and /pg/.
    acls:
      - consumer: anon
        group: anon
      - consumer: service_role
        group: admin
    {{- if .Values.studio.enabled }}

    basicauth_credentials:
      - consumer: DASHBOARD
        username: {{ .Values.studio.username | quote }}
        password: '__SUPABASE_DASHBOARD_PASSWORD__'
    {{- end }}
