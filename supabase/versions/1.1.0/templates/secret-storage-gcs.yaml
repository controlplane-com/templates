{{- if and .Values.storage.enabled (eq .Values.storage.backend "gcs") }}
---
kind: secret
name: {{ include "supabase.storage.gcs.secret.name" . }}
description: GCS HMAC credentials for the Supabase Storage API
tags: {{- include "supabase.tags" . | nindent 2 }}
type: dictionary
data:
  accessKeyId: {{ .Values.storage.gcs.accessKeyId | quote }}
  secretAccessKey: {{ .Values.storage.gcs.secretAccessKey | quote }}
{{- end }}
