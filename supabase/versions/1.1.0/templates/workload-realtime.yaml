{{- if .Values.realtime.enabled }}
---
kind: workload
name: {{ include "supabase.realtime.name" . }}
description: Supabase Realtime — WebSocket subscriptions
tags: {{- include "supabase.tags" . | nindent 2 }}
gvc: {{ .Values.global.cpln.gvc }}
spec:
  type: standard
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "supabase.identity.name" . }}
  containers:
    - name: realtime
      image: {{ .Values.realtime.image }}
      inheritEnv: false
      minCpu: {{ .Values.realtime.resources.minCpu | quote }}
      cpu: {{ .Values.realtime.resources.maxCpu | quote }}
      minMemory: {{ .Values.realtime.resources.minMemory | quote }}
      memory: {{ .Values.realtime.resources.maxMemory | quote }}
      env:
        - name: PORT
          value: "4000"
        - name: DB_HOST
          value: {{ include "supabase.postgresHost" . }}
        - name: DB_PORT
          value: "5432"
        # Realtime uses supabase_admin — created by the supabase/postgres init scripts
        - name: DB_USER
          value: supabase_admin
        - name: DB_PASSWORD
          value: cpln://secret/{{ .Values.postgres.credentialsSecretName }}.password
        - name: DB_NAME
          value: cpln://secret/{{ .Values.postgres.credentialsSecretName }}.database
        - name: DB_AFTER_CONNECT_QUERY
          value: "SET search_path TO _realtime"
        - name: DB_ENC_KEY
          value: supabaserealtime
        # Realtime is multi-tenant even when self-hosted: it resolves a tenant from
        # the first label of the request Host, and refuses every connection with
        # `TenantNotFound` until a matching row exists in `_realtime.tenants`.
        # Kong proxies to this workload's own hostname, so the tenant's external_id
        # must be the workload name. The image's entrypoint seeds exactly that row
        # on boot when SEED_SELF_HOST is true, using API_JWT_SECRET as the tenant's
        # JWT secret and encrypting it with DB_ENC_KEY.
        - name: SEED_SELF_HOST
          value: "true"
        - name: SELF_HOST_TENANT_NAME
          value: {{ include "supabase.realtime.name" . }}
        - name: API_JWT_SECRET
          value: cpln://secret/{{ .Values.jwt.secretName }}.secret
        - name: SECRET_KEY_BASE
          value: cpln://secret/{{ .Values.jwt.secretName }}.secretKeyBase
        - name: ERL_AFLAGS
          value: -proto_dist inet_tcp
        - name: ENABLE_TAILSCALE
          value: "false"
        - name: DNS_NODES
          value: "''"
        - name: RLIMIT_NOFILE
          value: "10000"
        - name: APP_NAME
          value: realtime
        - name: FLY_ALLOC_ID
          value: fly123
        - name: FLY_APP_NAME
          value: realtime
      ports:
        - number: 4000
          protocol: http
      readinessProbe:
        httpGet:
          path: /
          port: 4000
          scheme: HTTP
        failureThreshold: 10
        initialDelaySeconds: 20
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 3
  defaultOptions:
    # Single replica, deliberately. The tenant seed above DELETES and re-inserts the
    # tenant row on every container start, so a second replica starting would wipe
    # the row the first one is serving. Multi-node Realtime needs Erlang clustering
    # (DNS_NODES peer discovery), which a standard workload cannot provide.
    autoscaling:
      metric: disabled
      minScale: 1
      maxScale: 1
    capacityAI: false
  firewallConfig:
    external:
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: workload-list
      inboundAllowWorkload:
        - //gvc/{{ .Values.global.cpln.gvc }}/workload/{{ include "supabase.kong.name" . }}
{{- end }}
