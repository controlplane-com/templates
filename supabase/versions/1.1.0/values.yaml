# ── Postgres ─────────────────────────────────────────────────────────────────
# Must use the Supabase-patched image — it pre-installs required extensions
# (pgvector, pg_graphql, pg_net, pgjwt, etc.) not present in the official image.
postgres:
  image: supabase/postgres:15.8.1.060

  # REQUIRED PREREQUISITE SECRET — CREATE IT BEFORE YOU INSTALL.
  # A `dictionary` secret holding exactly two keys: `password` and `database`.
  # If it does not exist at install time the deployment WEDGES waiting on it and
  # looks broken. See Prerequisites in the README for the exact command.
  # The login role name is fixed at `postgres` by the Supabase image — not configurable.
  credentialsSecretName: my-supabase-postgres-credentials

  resources:
    minCpu: 500m
    minMemory: 512Mi
    maxCpu: 2
    maxMemory: 2Gi

  volumeset:
    capacity: 10  # initial capacity in GiB (minimum is 10)
    autoscaling:
      enabled: false
      maxCapacity: 100
      minFreePercentage: 10
      scalingFactor: 1.2

  # Controls who can reach Postgres directly. All internal services in this
  # deployment connect to Postgres within the same GVC.
  internalAccess:
    type: same-gvc  # options: none, same-gvc, same-org, workload-list
    workloads:
      #- //gvc/GVC_NAME/workload/WORKLOAD_NAME

# ── Kong (API gateway — single entry point for all services) ──────────────────
# Pinned to 2.8 — Supabase's routing config is tested against this version.
# PostgREST, GoTrue, Realtime, and Storage are only reachable through Kong
# and are automatically scoped to the Kong workload internally.
kong:
  image: kong:2.8.1
  resources:
    minCpu: 100m
    minMemory: 256Mi
    maxCpu: 1000m
    maxMemory: 1Gi
  minReplicas: 1
  maxReplicas: 3

  # When enabled, Kong gets a public-facing endpoint. This also publishes the
  # Studio dashboard at `/` behind Kong's basic-auth login when studio.enabled.
  # siteUrl must be set to the resulting domain — GoTrue uses it for OAuth
  # redirect callbacks and magic link email links.
  publicAccess:
    enabled: false
    siteUrl: ""  # e.g. https://api.my-app.com — required when publicAccess is enabled

# ── PostgREST (auto-generated REST API) ───────────────────────────────────────
# Stateless — scales horizontally. Only reachable via Kong.
postgrest:
  image: postgrest/postgrest:v12.2.3
  resources:
    minCpu: 100m
    minMemory: 128Mi
    maxCpu: 500m
    maxMemory: 512Mi
  minReplicas: 1
  maxReplicas: 3

# ── Auth (GoTrue) ─────────────────────────────────────────────────────────────
# Stateless — scales horizontally. Only reachable via Kong.
auth:
  image: supabase/gotrue:v2.170.0
  resources:
    minCpu: 100m
    minMemory: 128Mi
    maxCpu: 500m
    maxMemory: 512Mi
  minReplicas: 1
  maxReplicas: 3

  disableSignup: false  # set true to prevent new user registration

  # SMTP — required for magic link (passwordless login), signup email
  # confirmation, and password reset. Disable to skip email-based flows entirely.
  # Can use any SMTP provider: Gmail, SendGrid, Mailgun, Postmark, etc.
  smtp:
    enabled: false
    host: smtp.example.com
    port: 587
    user: smtp-user
    # REQUIRED WHEN smtp.enabled — an `opaque` secret (encoding: plain) holding
    # only the SMTP password, created BEFORE install. Example: my-supabase-smtp-password
    passwordSecretName: ""
    senderName: Supabase
    senderEmail: noreply@example.com

  # OAuth providers — uncomment and fill in credentials for any you want to enable.
  # Supported: Apple, Azure, Bitbucket, Discord, Facebook, Figma, GitHub, GitLab,
  # Google, Kakao, Keycloak, LinkedIn, Notion, Slack, Spotify, Twitch, Twitter/X,
  # WorkOS, Zoom
  # The client ID is not sensitive and stays here; the client SECRET is issued by
  # the provider, so it goes in a PREREQUISITE opaque secret (encoding: plain)
  # whose payload is the secret itself, named per provider.
  # providers:
  #   github:
  #     clientId: "Iv1.0123456789abcdef"
  #     clientSecretName: my-supabase-github-oauth
  #   google:
  #     clientId: "1234567890-abc.apps.googleusercontent.com"
  #     clientSecretName: my-supabase-google-oauth

# ── Realtime (WebSocket subscriptions to database changes) ────────────────────
# Only reachable via Kong. Runs as a SINGLE replica and offers no replica knobs:
# the image seeds its own tenant row on every boot, so a second replica would
# delete the row the first one is serving, and multi-node Realtime needs Erlang
# peer clustering that a standard workload cannot provide.
realtime:
  enabled: true
  image: supabase/realtime:v2.34.47
  resources:
    minCpu: 100m
    minMemory: 128Mi
    maxCpu: 500m
    maxMemory: 512Mi

# ── Storage (file/object storage) ─────────────────────────────────────────────
# Disable if your app has no file upload requirements — saves a workload.
# backend: local  → stateful, single replica, volume-backed (dev/simple use)
# backend: s3/gcs → stateless, horizontally scalable, recommended for production
# Only reachable via Kong.
storage:
  enabled: true
  image: supabase/storage-api:v1.14.6
  resources:
    # backend: local makes this workload stateful, where the platform requires
    # maxCpu:minCpu <= 4:1 — keep that ratio if you change these.
    minCpu: 125m
    minMemory: 128Mi
    maxCpu: 500m
    maxMemory: 512Mi
  minReplicas: 1
  maxReplicas: 3

  backend: s3  # options: local, s3, gcs

  volumeset:      # only used when backend is local
    capacity: 10  # initial capacity in GiB (minimum is 10)
    autoscaling:
      enabled: false
      maxCapacity: 100
      minFreePercentage: 10
      scalingFactor: 1.2

  s3:             # only used when backend is s3
    bucket: my-supabase-storage-bucket
    region: us-east-1  # set `auto` for Cloudflare R2
    # AWS S3 (endpoint empty) — keyless access through a cloud account, no keys anywhere
    cloudAccountName: my-s3-cloudaccount
    policyName: my-supabase-storage-policy  # IAM policy granting s3:GetObject, s3:PutObject, s3:DeleteObject on the bucket
    # S3-COMPATIBLE (MinIO, Cloudflare R2, Wasabi, Backblaze B2) — set endpoint and
    # credentialsSecretName; cloudAccountName/policyName are then unused, because
    # keyless cloud identity is AWS-only.
    endpoint: ""  # e.g. http://my-minio-workload:9000 — empty means AWS S3
    forcePathStyle: true  # required by MinIO; harmless on R2, Wasabi and B2
    # REQUIRED PREREQUISITE SECRET when endpoint is set — a `dictionary` secret
    # holding `accessKeyId` and `secretAccessKey`, created BEFORE install.
    credentialsSecretName: ""  # e.g. my-supabase-s3-credentials

  gcs:            # only used when backend is gcs
    # GCS is accessed via S3-compatible API using HMAC keys (no cloud account needed)
    bucket: my-supabase-storage-bucket
    # PREREQUISITE dictionary secret with keys `accessKeyId` and `secretAccessKey`
    # — HMAC credentials are issued by Google, so they never transit values.
    credentialsSecretName: my-supabase-gcs-hmac

# ── Studio (web dashboard) + pg_meta ──────────────────────────────────────────
# pg_meta is the Postgres metadata API used exclusively by Studio. It is
# automatically deployed alongside Studio and scoped to only the Studio workload.
studio:
  enabled: true
  image: supabase/studio:2025.06.02-sha-8f2993d
  # Dashboard login, enforced by Kong's basic-auth plugin on the Studio route
  # (Studio itself has no login) — so the dashboard is only password-protected
  # when reached through Kong.
  username: supabase  # dashboard login name (not sensitive)
  # REQUIRED PREREQUISITE SECRET when studio.enabled — an `opaque` secret
  # (encoding: plain) holding only the dashboard password, created BEFORE install.
  # Use a single-line password with no newline.
  passwordSecretName: my-supabase-studio-password
  resources:
    minCpu: 100m
    minMemory: 256Mi
    maxCpu: 500m
    maxMemory: 512Mi

  # DIRECT inbound access to the Studio workload, bypassing Kong — and therefore
  # bypassing the dashboard login entirely. Leave empty (default) and reach the
  # dashboard through Kong (`cpln port-forward` it if not public). Only add
  # a CIDR you fully trust, and never 0.0.0.0/0.
  allowedCidrs: []
  #  - 203.0.113.0/24   # example: office IP range (unauthenticated access!)

  # Controls who can reach the Studio dashboard internally. Defaults to Kong only,
  # matching every other backend tier — Studio holds the service_role key, and
  # reaching it directly bypasses the Kong login. Widening this to same-gvc lets
  # any workload in the GVC open the dashboard unauthenticated.
  internalAccess:
    type: workload-list  # options: none, same-gvc, same-org, workload-list
    workloads: []        # Kong is added automatically; list any extra callers here

  meta:
    image: supabase/postgres-meta:v0.86.0
    resources:
      minCpu: 100m
      minMemory: 64Mi
      maxCpu: 200m
      maxMemory: 256Mi

# ── JWT ───────────────────────────────────────────────────────────────────────
# REQUIRED PREREQUISITE SECRET — CREATE IT BEFORE YOU INSTALL.
# A `dictionary` secret holding exactly four keys:
#   secret         — the HMAC-SHA256 signing key (≥ 32 chars)
#   anonKey        — a JWT with role "anon", signed by `secret`
#   serviceRoleKey — a JWT with role "service_role", signed by `secret`
#                    (bypasses row-level security — treat it as a root password)
#   secretKeyBase  — Realtime (Phoenix) cookie-signing key (≥ 64 chars)
# The keys must be signed by `secret` or every service returns bad_jwt. The README
# has a copy-paste snippet that mints all four consistently.
jwt:
  secretName: my-supabase-jwt

# ── PgBouncer (connection pooling) ───────────────────────────────────────────
pgbouncer:
  enabled: false
  image: edoburu/pgbouncer:v1.25.1-p0
  poolMode: transaction  # options: session, transaction, statement
  defaultPoolSize: 25
  maxClientConn: 1000
  replicas: 1
  resources:
    minCpu: 100m
    minMemory: 64Mi
    maxCpu: 200m
    maxMemory: 128Mi

# ── Backup ────────────────────────────────────────────────────────────────────
backup:
  enabled: false
  mode: logical  # options: logical (pg_dump cron), walg (continuous WAL archiving + base backups, supports PITR)
  provider: aws  # options: aws, gcp

  resources:
    minCpu: 100m
    minMemory: 128Mi
    maxCpu: 200m
    maxMemory: 256Mi

  logical:
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0  # pg_dump 17 is backward-compatible with Postgres 15
    schedule: "0 2 * * *"  # daily at 2am UTC

  walg:
    intervalSeconds: 21600  # base backup interval in seconds (default: every 6 hours)

  aws:
    bucket: my-supabase-backup-bucket
    region: us-east-1
    cloudAccountName: my-backup-cloudaccount
    policyName: my-backup-policy
    prefix: supabase/backups

  gcp:
    bucket: my-supabase-backup-bucket
    cloudAccountName: my-backup-cloudaccount
    prefix: supabase/backups
