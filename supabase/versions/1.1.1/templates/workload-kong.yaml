---
kind: workload
name: {{ include "supabase.kong.name" . }}
description: Supabase Kong API gateway
tags: {{- include "supabase.tags" . | nindent 2 }}
gvc: {{ .Values.global.cpln.gvc }}
spec:
  type: standard
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "supabase.identity.name" . }}
  containers:
    - name: kong
      image: {{ .Values.kong.image }}
      inheritEnv: false
      minCpu: {{ .Values.kong.resources.minCpu | quote }}
      cpu: {{ .Values.kong.resources.maxCpu | quote }}
      minMemory: {{ .Values.kong.resources.minMemory | quote }}
      memory: {{ .Values.kong.resources.maxMemory | quote }}
      # Kong 2.8 does not interpolate env vars in declarative config, so the
      # credentials cannot be baked into the mounted file. The boot wrapper
      # substitutes them from the prerequisite secrets into a rendered copy, then
      # hands off to Kong's own entrypoint. Values are escaped first: sed treats
      # \, & and the | delimiter specially in replacement text, and the dashboard
      # password lands inside a single-quoted YAML scalar.
      command: /bin/sh
      args:
        - -c
        - |
          set -e
          esc() { sed -e 's/[\\&|]/\\&/g'; }
          ANON=$(printf '%s' "$SUPABASE_ANON_KEY" | esc)
          SERVICE=$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | esc)
          {{- if .Values.studio.enabled }}
          DASHBOARD=$(printf '%s' "$DASHBOARD_PASSWORD" | sed -e "s/'/''/g" | esc)
          {{- end }}
          sed -e "s|__SUPABASE_ANON_KEY__|$ANON|g" \
              -e "s|__SUPABASE_SERVICE_ROLE_KEY__|$SERVICE|g" \
          {{- if .Values.studio.enabled }}
              -e "s|__SUPABASE_DASHBOARD_PASSWORD__|$DASHBOARD|g" \
          {{- end }}
              /usr/local/kong/declarative/kong.template.yaml > /tmp/kong.yaml
          exec /docker-entrypoint.sh kong docker-start
      env:
        - name: SUPABASE_ANON_KEY
          value: cpln://secret/{{ .Values.jwt.secretName }}.anonKey
        - name: SUPABASE_SERVICE_ROLE_KEY
          value: cpln://secret/{{ .Values.jwt.secretName }}.serviceRoleKey
        {{- if .Values.studio.enabled }}
        - name: DASHBOARD_PASSWORD
          value: cpln://secret/{{ .Values.studio.passwordSecretName }}.payload
        {{- end }}
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /tmp/kong.yaml
        - name: KONG_DNS_ORDER
          value: LAST,A,CNAME
        - name: KONG_PLUGINS
          value: request-transformer,cors,key-auth,acl,basic-auth
        - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
          value: 160k
        - name: KONG_NGINX_PROXY_PROXY_BUFFERS
          value: 64 160k
        - name: KONG_NGINX_WORKER_PROCESSES
          value: "2"
        - name: KONG_LOG_LEVEL
          value: notice
      ports:
        - number: 8000
          protocol: http
      volumes:
        - path: /usr/local/kong/declarative/kong.template.yaml
          uri: cpln://secret/{{ include "supabase.kong.config.secret.name" . }}.payload
      readinessProbe:
        httpGet:
          path: /auth/v1/health
          port: 8000
          scheme: HTTP
        failureThreshold: 10
        initialDelaySeconds: 30
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 5
  defaultOptions:
    autoscaling:
      metric: cpu
      target: 70
      minScale: {{ .Values.kong.minReplicas }}
      maxScale: {{ .Values.kong.maxReplicas }}
      scaleToZeroDelay: 300
    capacityAI: false
  firewallConfig:
    external:
      {{- if .Values.kong.publicAccess.enabled }}
      inboundAllowCIDR:
        - 0.0.0.0/0
      {{- else }}
      inboundAllowCIDR: []
      {{- end }}
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: same-gvc
