# yaml-language-server: $schema=../.schema/catalog.v1.schema.json
apiVersion: catalog.controlplane.com/v1
kind: TemplateCatalogEntry

title: Temporal
category: workflow
topology: stateless

summary: >-
  A Temporal server running the frontend, history, matching and worker services in one process,
  plus the Temporal Web UI, both internal to your org, backed by a bundled three-node PostgreSQL
  cluster with Patroni failover or, optionally, a single PostgreSQL instance. Schema setup and
  migrations run at boot, and optional scheduled database backups go to S3, GCS or an
  S3-compatible endpoint. Pick it to run durable workflows and long-running business processes
  written with the Temporal SDKs.

keywords:
  - durable execution
  - workflow engine
  - workflow orchestration
  - long-running workflows
  - durable workflows
  - sagas
  - microservice orchestration
  - temporal sdk
  - temporal web ui
  - grpc
  - retries
  - state machines
  - schedules
  - background jobs

useCases:
  - Run long-running business processes that resume after crashes and deploys
  - Orchestrate multi-step microservice calls with retries, timeouts and compensation
  - Replace hand-built job queues and state machines with durable workflows in code
  - Coordinate AI agent or human-approval steps that wait for hours or days
  - Schedule recurring or delayed workflows

alternativeTo:
  - Temporal Cloud
  - AWS Step Functions
  - Azure Durable Functions
  - Google Cloud Workflows
  - Cadence
  - Inngest

pickInsteadIf:
  - need: scheduled data pipelines defined as Python DAGs with a monitoring UI
    template: airflow
  - need: visual no-code automations that connect SaaS apps on triggers and webhooks
    template: n8n
  - need: a simple HTTP task queue with retries and rate limits, without workflow code
    template: cpln-task-runner

prerequisites:
  - kind: bucket
    valuesPath:
      - postgresHA.backup.aws.bucket
      - postgresHA.backup.gcp.bucket
      - postgresHA.backup.minio.bucket
      - postgres.backup.aws.bucket
      - postgres.backup.gcp.bucket
      - postgres.backup.minio.bucket
    required: false
    when: postgresHA.backup.enabled or postgres.backup.enabled
    description: Object storage bucket that receives the scheduled database backups.
  - kind: cloud-account
    valuesPath:
      - postgresHA.backup.aws.cloudAccountName
      - postgresHA.backup.gcp.cloudAccountName
      - postgres.backup.aws.cloudAccountName
      - postgres.backup.gcp.cloudAccountName
    required: false
    when: backups enabled with provider aws or gcp
    description: Control Plane cloud account for the backup bucket, plus a bucket-scoped IAM policy on AWS named by backup.aws.policyName.
  - kind: secret
    secretType: dictionary
    keys: [accessKey, secretKey]
    valuesPath: [postgresHA.backup.minio.credentialsSecretName, postgres.backup.minio.credentialsSecretName]
    required: false
    when: backups enabled with provider minio
    description: Access keys for the MinIO or S3-compatible backup endpoint.
