# temporal 3.0.0 — the default install: one Temporal server replica and the Web UI on highly available
# PostgreSQL (three Patroni members, three etcd members, two HAProxy replicas), one location, with the
# database credentials secret created by CI. `database` must be `temporal`.
locations: [aws-us-east-1]
# HA first boot: Patroni elects a leader before the admin sidecar can create and migrate the schemas.
timeoutSeconds: 1200

generated:
  pgpw: hex

secrets:
  db:
    type: dictionary
    entries:
      username: temporal
      password: "{gen.pgpw}"
      database: temporal

vars:
  pg_user: temporal
  pg_password: "{gen.pgpw}"
  pg_db: temporal

values:
  postgresHA:
    config:
      credentialsSecretName: "{secrets.db.name}"

# Single-instance PostgreSQL (the opt-in mode), which 3.0.0 moves to PostgreSQL 19: one more fresh install.
variants:
  - name: single
    values:
      postgresHA:
        enabled: false
      postgres:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"
    timeoutSeconds: 900

# 2.1.1 is the previous version (same values shape). Its baseline runs the HA database, so this upgrade
# moves postgres-highly-available 2.7.0 → 3.0.0, whose existing cluster keeps PostgreSQL 17: a plain
# upgrade. A refused single-instance upgrade from 2.1.1 is not expressible: the starting install always
# uses 2.1.1's own (HA) baseline.
upgradeFrom:
  - version: 2.1.1
