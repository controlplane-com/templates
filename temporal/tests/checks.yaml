# Feature checks for the temporal template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars (pg_user,
# pg_password, pg_db).
#
# The default-install checks run from the HA database's patroni-postgres container, which has curl, psql and
# python3, and call the Temporal server's HTTP API at its internal address, as an in-GVC client would; they are
# scoped off the [single] variant, which has no HA database. The [single] checks read PostgreSQL in its own
# container, and the CLI check (every scenario) runs the `temporal` CLI in the server's admin sidecar against
# 127.0.0.1:7233. Temporal
# keeps every workflow in PostgreSQL, so a started workflow that describes back proves the server, its
# schema and its database all work. No worker is needed: a started workflow stays Running until
# terminated. (Inside scripts, write $VAR rather than the braced form: the runner fills {name} placeholders.)
checks:
  - id: default-namespace-served
    description: The server serves the `default` namespace over its HTTP API (schema current, namespace created).
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 10 http://{release}-temporal.{gvc}.cpln.local:7243/api/v1/namespaces/default | python3 -c '
        import json, sys
        print("NAMESPACE " + json.load(sys.stdin)["namespaceInfo"]["name"])'
    expect:
      stdout: "^NAMESPACE default$"
    retries: 10
    retryDelaySeconds: 15

  - id: start-and-describe-workflow
    description: A workflow started with an id tagged with the running version describes back as Running.
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        U=http://{release}-temporal.{gvc}.cpln.local:7243/api/v1/namespaces/default/workflows
        V='{version}'
        W="e2e-$(echo "$V" | tr . -)"
        # A second start of the same id (a re-run or a no-op upgrade) is refused as already started; that is fine.
        curl -s -m 15 -o /dev/null -H 'Content-Type: application/json' \
          -d "{\"workflowId\":\"$W\",\"workflowType\":{\"name\":\"E2ECheck\"},\"taskQueue\":{\"name\":\"e2e\"}}" "$U/$W"
        curl -s -m 15 "$U/$W" | python3 -c '
        import json, sys
        i = json.load(sys.stdin)["workflowExecutionInfo"]
        print("WF " + i["execution"]["workflowId"] + " " + str(i["status"]))'
    expect:
      stdout: "^WF e2e-\\S+ \\S*RUNNING"
    retries: 6
    retryDelaySeconds: 15

  - id: unknown-workflow-not-found
    description: Describing a workflow that was never started is refused (the control for the check above).
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 15 http://{release}-temporal.{gvc}.cpln.local:7243/api/v1/namespaces/default/workflows/e2e-never-started-$(date +%s)
    expect:
      stdout: "(?i)not ?found"
      notStdout: "workflowExecutionInfo"

  - id: data-survives-upgrade
    description: >-
      The workflow started on the version this scenario installed first still describes. On a fresh
      install that is the same version; after an upgrade it proves the workflows carried over.
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        V='{installed_version}'
        W="e2e-$(echo "$V" | tr . -)"
        curl -s -m 15 "http://{release}-temporal.{gvc}.cpln.local:7243/api/v1/namespaces/default/workflows/$W" | python3 -c '
        import json, sys
        i = json.load(sys.stdin)["workflowExecutionInfo"]
        print("WF " + i["execution"]["workflowId"] + " " + str(i["status"]))'
    expect:
      stdout: "^WF e2e-\\S+ \\S*RUNNING"
    retries: 4
    retryDelaySeconds: 15

  - id: pgvector-0-8-7-available
    description: >-
      The HA leader runs an image with pgvector 0.8.7 (CVE-2026-103484): patroni-postgres 0.8 from 2.1.1, 0.9
      from 3.0.0.
    issue: "#5376"
    since: 2.1.1
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select 'AVAIL ' || default_version from pg_available_extensions where name = 'vector'" 2>&1
    expect:
      stdout: "^AVAIL 0\\.8\\.7$"
    # After the upgrade the members restart one at a time; this runs long enough to reach the new leader.
    # helm --wait returns while the Patroni members are still restarting, and the old leader restarts
    # last (~4 min in); 20 x 30 s covers the rollout.
    retries: 20
    retryDelaySeconds: 30

  - id: every-patroni-member-on-0-8
    description: >-
      Every Patroni member restarted onto an image with pgvector 0.8.7 (patroni-postgres 0.8 in 2.1.1, 0.9 from
      3.0.0) and is back in the cluster,
      not only the leader. The pgvector-0-8-7-available check passes as soon as the leader has moved to a
      restarted member, and the runner's readiness wait returns while the old leader is still restarting, so
      without this a member that never comes back (seen once in testing: the old leader stuck initializing for
      17 min) goes unseen.
    issue: "#5376"
    since: 2.1.1
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}' PGCONNECT_TIMEOUT=5
        LOC=$(basename "$CPLN_LOCATION")
        line="MEMBERS"
        for i in 0 1 2; do
          v=$(psql -h replica-$i.{release}-postgres-ha.$LOC.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
            -c "select default_version from pg_available_extensions where name = 'vector'" 2>/dev/null)
          line="$line $i=$v"
        done
        echo "$line HEALTHY $(curl -s -m 10 http://localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        print("%d/%d" % (len([x for x in m if x["state"] in ("running", "streaming")]), len(m)))' 2>&1)"
    expect:
      stdout: "^MEMBERS 0=0\\.8\\.7 1=0\\.8\\.7 2=0\\.8\\.7 HEALTHY 3/3$"
    # The old leader restarts last, a few minutes after the runner's readiness wait returns.
    retries: 24
    retryDelaySeconds: 30

  - id: ha-postgres-major
    description: >-
      The HA database (postgres-highly-available 3.0.0 from 3.0.0) runs PostgreSQL 18 on a cluster this version
      created, and a cluster created by 2.x keeps PostgreSQL 17 after the upgrade, on every member.
    since: 3.0.0
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        if [ "$(printf '%s\n' '{installed_version}' 3.0.0 | sort -V | head -1)" = 3.0.0 ]; then want=18; else want=17; fi
        curl -s -m 10 localhost:8008/cluster | python3 -c '
        import json, sys, urllib.request
        want = int(sys.argv[1])
        majors = []
        for m in json.load(sys.stdin)["members"]:
            v = json.load(urllib.request.urlopen(m["api_url"].rsplit("/", 1)[0] + "/patroni", timeout=5)).get("server_version", 0)
            majors.append(v // 10000)
        ok = len(majors) == 3 and all(x == want for x in majors)
        print(("MAJOR " if ok else "WRONG ") + "want=%d members=%s" % (want, majors))
        ' "$want"
    expect:
      stdout: "^MAJOR want="
    # The members restart one after another after an upgrade; the old leader restarts last.
    retries: 20
    retryDelaySeconds: 30

  - id: cli-history-and-visibility
    description: >-
      From the admin sidecar, the `temporal` CLI starts and signals a workflow, reads the signal back from its
      history (the temporal database) and finds the workflow with a list query (the temporal_visibility
      database); describing a workflow that was never started is refused (the control). Runs in every
      scenario, so it covers both database modes.
    since: 3.0.0
    exec:
      workload: "{release}-temporal"
      container: admin
      shell: sh
      script: |
        W="e2e-cli-$(date +%s)"
        temporal workflow start -n default --type E2ECheck --task-queue e2e -w "$W" >/dev/null 2>&1
        temporal workflow signal -n default -w "$W" --name ping --input 1 >/dev/null 2>&1
        sleep 3
        temporal workflow show -n default -w "$W" 2>&1 | grep -q WorkflowExecutionSignaled && echo HISTORY_OK
        temporal workflow list -n default -q "WorkflowId='$W'" 2>&1 | grep -q "Running.*$W" && echo VISIBILITY_OK
        temporal workflow describe -n default -w "e2e-never-started-$(date +%s)" >/dev/null 2>&1 \
          && echo UNKNOWN_FOUND || echo UNKNOWN_REFUSED
    expect:
      stdout: "(?s)^HISTORY_OK$.*^VISIBILITY_OK$.*^UNKNOWN_REFUSED$"
    retries: 10
    retryDelaySeconds: 15

  # ── Single-instance mode ([single] variant): PostgreSQL 19 from 3.0.0 ──
  - id: single-fresh-is-19
    description: >-
      A fresh single-instance install runs PostgreSQL 19 (the postgres 4.0.2 subchart), and both Temporal
      databases are on it at the schema levels server 1.32 needs (temporal 1.19, temporal_visibility 1.14).
    since: 3.0.0
    scenarios: "^install .*\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        H=$(hostname -i | awk '{print $1}')
        echo "SERVER_VERSION_NUM=$(psql -h "$H" -U {pg_user} -d postgres -qtA -c 'show server_version_num' 2>&1)"
        for db in temporal temporal_visibility; do
          echo "SCHEMA $db $(psql -h "$H" -U {pg_user} -d "$db" -qtA \
            -c "select curr_version from schema_version where version_partition = 0 and db_name = current_database()" 2>&1)"
        done
    expect:
      stdout: "(?s)^SERVER_VERSION_NUM=19[0-9]{4}$.*^SCHEMA temporal 1\\.19$.*^SCHEMA temporal_visibility 1\\.14$"
    retries: 8
    retryDelaySeconds: 15

  - id: single-guard-passes
    description: >-
      On its own PostgreSQL 19 data the major-version guard hands over to the server: no guard file, and
      postgres is PID 1.
    since: 3.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        [ -e /tmp/pg-major-guard ] && echo GUARD_FILE_PRESENT || echo NO_GUARD_FILE
        echo "PID1=$(cat /proc/1/comm)"
    expect:
      stdout: "(?s)^NO_GUARD_FILE$.*^PID1=postgres$"

  - id: single-rejects-bad-password
    description: In single-instance mode a wrong database password is refused (the control for the reads above).
    since: 3.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        H=$(hostname -i | awk '{print $1}')
        PGPASSWORD=wrong-password psql -h "$H" -U {pg_user} -d temporal -c "select 1" 2>&1
        echo "EXIT=$?"
    expect:
      stdout: "password authentication failed"
      notStdout: "^EXIT=0$"
