{{- if or .Values.postgres.enabled .Values.postgresHA.enabled }}
{{- /*
  Credentials for the BUNDLED database, in either mode. Internal plumbing: no human ever
  types this password — it exists only so Temporal can reach its own Postgres — so the
  bundled-plumbing exception applies and it stays a template-created secret rather than a
  prerequisite the user has to create. postgres 3.4.0 and postgres-highly-available 2.5.0
  stopped creating this secret and now only take its NAME, which is why the chart on this
  side of the dependency owns it.

  The three keys are named exactly as the postgres subchart reads them: username, password,
  database. Temporal itself reads only username and password — its main and visibility store
  names (`temporal` / `temporal_visibility`) are set on the server workload and created by
  the auto-setup entrypoint. Its name is postgresHA.config.credentialsSecretName in HA
  mode and postgres.config.credentialsSecretName in single-instance mode.
*/}}
kind: secret
name: {{ include "temporal.postgres.secret.name" . }}
description: Temporal bundled PostgreSQL credentials
tags: {{- include "temporal.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
{{- end }}
