# Rules over values outside the steps: their issues show on the fields named in paths.
rules:
  - rule: >-
      !self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled) ||
      dyn(self.postgresHA)['proxy']['enabled'] == true
    mirrors: temporal.validate
    paths: [postgresHA.config.credentialsSecretName]
    message: postgresHA.proxy.enabled must stay true; the HAProxy leader endpoint is Temporal's database endpoint.
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Temporal, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-temporal') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: "'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-temporal, or Temporal cannot reach its database.'"
    fix:
      path: postgres.internalAccess.workloads
      items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-temporal']"
    message: Add the Temporal server workload to the list, or Temporal cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Temporal connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  # 1.3.0 renamed the resource limits.
  - { fromVersions: "<1.3.0", from: resources.cpu, to: resources.maxCpu }
  - { fromVersions: "<1.3.0", from: resources.memory, to: resources.maxMemory }
  - { fromVersions: "<1.3.0", from: ui.resources.cpu, to: ui.resources.maxCpu }
  - { fromVersions: "<1.3.0", from: ui.resources.memory, to: ui.resources.maxMemory }
  # The database credentials moved to postgres.credentials (single-instance in 1.1.0, HA in 1.2.0), and the
  # running database keeps the user and password it was initialized with: carry the ACTIVE mode's values,
  # whatever they are, from wherever that version kept them.
  - fromVersions: "<1.1.0"
    to: postgres.credentials.username
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.username : self.postgres.config.username"
    note: PostgreSQL keeps the user it was initialized with, so the installed one is kept.
  - fromVersions: ">=1.1.0 <1.2.0"
    to: postgres.credentials.username
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.username : self.postgres.credentials.username"
    note: PostgreSQL keeps the user it was initialized with, so the installed one is kept.
  - fromVersions: "<1.1.0"
    to: postgres.credentials.password
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.password : self.postgres.config.password"
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: ">=1.1.0 <1.2.0"
    to: postgres.credentials.password
    valueExpr: "self.postgresHA.enabled ? self.postgresHA.postgres.password : self.postgres.credentials.password"
    note: PostgreSQL keeps the password it was initialized with, so the installed one is kept.
  - fromVersions: "<1.2.0"
    to: postgres.credentials.database
    valueExpr: "'temporal'"
    note: Temporal's main store is always the temporal database.
  - fromVersions: "<1.2.0"
    from: postgresHA.postgres
    note: Its username and password moved to postgres.credentials, from which Temporal creates the secret.
  - fromVersions: "<1.1.0"
    from: postgres.config.username
    note: Moved to postgres.credentials.username, from which Temporal creates the secret.
  - fromVersions: "<1.1.0"
    from: postgres.config.password
    note: Moved to postgres.credentials.password, from which Temporal creates the secret.
  - fromVersions: "<1.1.0"
    from: postgres.config.database
    note: Moved to postgres.credentials.database, from which Temporal creates the secret.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.accessKey
    note: >-
      The MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under
      Database backups.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.secretKey
    note: >-
      The MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under
      Database backups.
