apiVersion: v2
name: temporal
description: Temporal durable-execution server and Web UI on highly available PostgreSQL
type: application
version: 2.0.0
appVersion: "1.32.1"

dependencies:
  - name: cpln-common
    version: 1.0.0
    repository: "oci://ghcr.io/controlplane-com/templates"
  - name: postgres-highly-available
    alias: postgresHA
    version: 2.7.0
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgresHA.enabled
  - name: postgres
    version: 3.4.1
    repository: "oci://ghcr.io/controlplane-com/templates"
    condition: postgres.enabled

annotations:
  created: "2026-07-22"
  lastModified: "2026-10-14"
  createsGvc: false
