# Feature checks for the tidb template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars
# (app_user, app_password, app_db, root_password).
#
# The TiDB images carry no MySQL client, so SQL runs from the ProxySQL container (the baseline enables
# ProxySQL): to the tidb-server service directly, and to ProxySQL itself on 127.0.0.1:4000. Every client
# asks for utf8mb4, as the README says to: the CLI's locale default is latin1, which TiDB rejects through
# ProxySQL (ERROR 1273).
checks:
  - id: stores-up
    description: PD sees all three TiKV stores Up, one per location.
    exec:
      workload: "{release}-pd"
      container: tidb-pd
      shell: sh
      script: |
        s=$(curl -s 127.0.0.1:2379/pd/api/v1/stores)
        echo "UP $(echo "$s" | grep -o '"state_name": *"Up"' | wc -l | tr -d ' ')"
        echo "$s" | grep -o '"value": *"[a-z0-9-]*"' | sort -u | sed 's/^/LABEL /'
    expect:
      stdout: "^UP 3$"
    retries: 8
    retryDelaySeconds: 15

  - id: write-read-via-server
    description: A row written by the application user through the tidb-server service reads back.
    exec:
      workload: "{release}-proxysql"
      container: proxysql
      shell: bash
      script: |
        set -e
        export MYSQL_PWD='{app_password}'
        H={release}-server.{gvc}.cpln.local
        M="e2e-$(date +%s%N)"
        mysql --default-character-set=utf8mb4 -h "$H" -P 4000 -u {app_user} {app_db} -e "
          create table if not exists e2e (id bigint auto_random primary key, version varchar(32) not null, marker varchar(64) not null);
          insert into e2e (version, marker) values ('{version}', '$M');"
        mysql --default-character-set=utf8mb4 -h "$H" -P 4000 -u {app_user} {app_db} -N -B -e "select marker from e2e where marker = '$M'" | grep -qx "$M" && echo "READ $M"
    expect:
      stdout: "^READ e2e-"
    retries: 6
    retryDelaySeconds: 20
    timeoutSeconds: 180

  - id: write-read-via-proxysql
    description: The same round trip through the ProxySQL pooler.
    exec:
      workload: "{release}-proxysql"
      container: proxysql
      shell: bash
      script: |
        set -e
        export MYSQL_PWD='{app_password}'
        M="e2e-pool-$(date +%s%N)"
        mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 4000 -u {app_user} {app_db} -e "insert into e2e (version, marker) values ('{version}', '$M')"
        mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 4000 -u {app_user} {app_db} -N -B -e "select marker from e2e where marker = '$M'" | grep -qx "$M" && echo "READ $M"
    expect:
      stdout: "^READ e2e-pool-"
    retries: 6
    retryDelaySeconds: 20
    timeoutSeconds: 180

  - id: root-password-set
    description: Root authenticates with the secret's password, and not without one.
    exec:
      workload: "{release}-proxysql"
      container: proxysql
      shell: bash
      script: |
        H={release}-server.{gvc}.cpln.local
        MYSQL_PWD='{root_password}' mysql --default-character-set=utf8mb4 -h "$H" -P 4000 -u root -N -B -e "select concat('ROOT ', current_user())"
        mysql --default-character-set=utf8mb4 -h "$H" -P 4000 -u root --skip-password -e "select 1" 2>&1 | grep -m1 '^ERROR'
    expect:
      stdout: "(?s)^ROOT root@.*Access denied for user 'root'"

  - id: rejects-bad-password
    description: A wrong application password is refused (the control for the checks above).
    exec:
      workload: "{release}-proxysql"
      container: proxysql
      shell: bash
      script: |
        MYSQL_PWD=wrong-password mysql --default-character-set=utf8mb4 -h {release}-server.{gvc}.cpln.local -P 4000 -u {app_user} {app_db} -e "select 1" 2>&1
        echo "EXIT=$?"
    expect:
      stdout: "Access denied for user"
      notStdout: "^EXIT=0$"

  - id: data-survives-upgrade
    description: >-
      The row written on the version this scenario installed first is still there. On a fresh install
      that is the same version; after an upgrade it proves the cluster's data carried over.
    exec:
      workload: "{release}-proxysql"
      container: proxysql
      shell: bash
      script: |
        n=$(MYSQL_PWD='{app_password}' mysql --default-character-set=utf8mb4 -h {release}-server.{gvc}.cpln.local -P 4000 -u {app_user} {app_db} -N -B \
          -e "select count(*) from e2e where version = '{installed_version}'" 2>/tmp/e2e.err)
        [ "${n:-0}" -ge 1 ] 2>/dev/null && echo PERSISTED || echo "MISSING (rows for {installed_version}: ${n:-none}) $(grep -v WARNING /tmp/e2e.err)"
    expect:
      stdout: "^PERSISTED$"
    retries: 4
    retryDelaySeconds: 15
