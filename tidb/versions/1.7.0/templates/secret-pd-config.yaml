---
kind: secret
name: {{ include "tidb.pdSecret.name" . }}
description: {{ .Release.Name }} TiDB placement driver startup script
tags: {{- include "tidb.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    LOCATION=$(basename "${CPLN_LOCATION}")
    HOSTNAME=${HOSTNAME}
    GVC="{{ .Values.gvc.name }}"
    WORKLOAD_NAME="{{ include "tidb.pd.name" . }}"
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"

    # Parse LOCATIONS into individual location variables
    IFS=',' read -ra LOC_ARRAY <<< "$LOCATIONS"
    FIRST_LOCATION="${LOC_ARRAY[0]}"
    SECOND_LOCATION="${LOC_ARRAY[1]:-}"
    BOOTSTRAP_FQDN="replica-0.${WORKLOAD_NAME}.${FIRST_LOCATION}.${GVC}.cpln.local"

    # Restart peer: used when a node restarts with existing data and needs to re-join.
    # With 2+ locations, use replica-0 in the second location.
    # With 1 location (devMode), use replica-1 in the same location.
    if [[ -n "$SECOND_LOCATION" ]]; then
      RESTART_PEER_NAME="${SECOND_LOCATION}-0"
      RESTART_PEER_FQDN="replica-0.${WORKLOAD_NAME}.${SECOND_LOCATION}.${GVC}.cpln.local"
    else
      RESTART_PEER_NAME="${FIRST_LOCATION}-1"
      RESTART_PEER_FQDN="replica-1.${WORKLOAD_NAME}.${FIRST_LOCATION}.${GVC}.cpln.local"
    fi

    mkdir -p /data /etc/pd

    IS_BOOTSTRAP=false
    FORCE_NEW_CLUSTER=false
    HAS_DATA=false
    if [[ -d "/data/member" && $(find /data/member -type f 2>/dev/null | wc -l) -gt 0 ]]; then
      HAS_DATA=true
    fi

    if [[ "$LOCATION" == "$FIRST_LOCATION" && "$REPLICA_INDEX" == "0" ]]; then
        IS_BOOTSTRAP=true
        echo "This is the primary bootstrap replica."

        if [[ "$HAS_DATA" == "true" ]]; then
            echo "Persistent data found. Normal startup."
            FORCE_NEW_CLUSTER=false
        else
            echo "No persistent data found. Bootstrapping new cluster."
            FORCE_NEW_CLUSTER=true
        fi
    else
        echo "This replica will join the existing cluster via ${BOOTSTRAP_FQDN}"
    fi

    # Base PD config
    #
    # [replication] MUST be here, in the FIRST-BOOT config. PD reads it only while
    # bootstrapping and then persists it as cluster state in etcd; on every later
    # boot it ignores this file section entirely. It used to appear only in the
    # regenerate-on-restart config below, which meant it never took effect at all —
    # PD bootstrapped with its built-in default of max-replicas = 3 (observed live
    # 2026-08-07: the file said 2 and the PD API said 3). Getting this wrong is
    # invisible at render time and shows up only as a cluster that never becomes
    # ready, or as region-aware placement silently not working.
    #
    # Store labels are NOT set here. [labels] in pd.toml sets PD's own member
    # labels; the store label a placement rule matches on comes from TiKV, under
    # [server] labels in tikv.toml.
    # Any key appended to this file AFTER a [table] header is parsed INTO that
    # table, so `initial-cluster-state` is baked in here rather than echoed on
    # afterwards — appending it would silently make it `[replication]
    # initial-cluster-state`, which PD ignores.
    INITIAL_STATE=""
    if [[ "$IS_BOOTSTRAP" == "true" && "$FORCE_NEW_CLUSTER" == "true" ]]; then
        INITIAL_STATE='initial-cluster-state = "new"'
    fi

    cat > /etc/pd/pd.toml <<EOF
    name = "${LOCATION}-${REPLICA_INDEX}"
    data-dir = "/data"
    client-urls = "http://0.0.0.0:2379"
    peer-urls   = "http://0.0.0.0:2380"
    advertise-client-urls = "http://${SELF_FQDN}:2379"
    advertise-peer-urls   = "http://${SELF_FQDN}:2380"
    ${INITIAL_STATE}

    [replication]
{{- if .Values.devMode }}
    max-replicas = {{ include "tidb.devModeMaxReplicas" . }}
{{- else }}
    location-labels = ["region"]
{{- end }}
    EOF

    if [[ "$HAS_DATA" == "true" ]]; then
        echo "Existing PD data detected — regenerating clean config.toml"
        rm -f /etc/pd/pd.toml

        # Same rule as the first-boot config above: a key appended after a [table]
        # header is parsed INTO that table, so initial-cluster is computed here and
        # placed among the top-level keys rather than echoed on after [metric].
        if [[ "$IS_BOOTSTRAP" == "true" ]]; then
            INITIAL_CLUSTER="${RESTART_PEER_NAME}=http://${RESTART_PEER_FQDN}:2380"
            echo "joining with $RESTART_PEER_FQDN"
        else
            INITIAL_CLUSTER="$FIRST_LOCATION-0=http://${BOOTSTRAP_FQDN}:2380"
            echo "joining with $BOOTSTRAP_FQDN"
        fi

    # Recreate a clean pd.toml file
        cat > /etc/pd/pd.toml <<EOF
    name = "${LOCATION}-${REPLICA_INDEX}"
    data-dir = "/data"
    client-urls = "http://0.0.0.0:2379"
    peer-urls   = "http://0.0.0.0:2380"
    advertise-client-urls = "http://${SELF_FQDN}:2379"
    advertise-peer-urls   = "http://${SELF_FQDN}:2380"
    initial-cluster-state = "existing"
    initial-cluster = "${INITIAL_CLUSTER}"

    election-interval = "20000ms"
    tick-interval = "500ms"
    lease = 15
    
    [replication]
{{- if .Values.devMode }}
    # devMode: PD defaults max-replicas to 3, and location-labels would force those
    # 3 copies onto distinct regions. With the single location devMode exists to
    # allow, neither can ever be satisfied — every region stays under-replicated and
    # tidb-server never reaches ready. Relax both to what the install actually has,
    # so devMode is usable rather than merely passing render-time validation.
    max-replicas = {{ include "tidb.devModeMaxReplicas" . }}
{{- else }}
    location-labels = ["region"]
{{- end }}

    [log]
    level = "info"

    [metric]
    interval = "5s"
    EOF
    fi

    # Retry Helper Function
    retry_start_existing() {
      local attempt=1
      local max_attempts=5
      local delay=10
      while (( attempt <= max_attempts )); do
        echo "Attempt $attempt to start PD with existing data..."
        /pd-server --config=/etc/pd/pd.toml && return 0
        echo "Startup attempt $attempt failed. Retrying in ${delay}s..."
        sleep $delay
        ((attempt++))
      done
      echo "All restart attempts failed after ${max_attempts} tries. Exiting."
      exit 1
    }

    # Start PD
    if [[ "$IS_BOOTSTRAP" == "true" ]]; then
        if [[ "$FORCE_NEW_CLUSTER" == "true" ]]; then
            echo "Starting PD bootstrap with --force-new-cluster"
            exec /pd-server --config=/etc/pd/pd.toml --force-new-cluster
        else
            echo "Starting PD bootstrap normally (no --join)"
            exec /pd-server --config=/etc/pd/pd.toml
        fi
    else
        if [[ "$HAS_DATA" == "true" ]]; then
            echo "Persistent data found. Starting normally (existing cluster)."
            retry_start_existing
        else
            echo "Waiting for bootstrap PD to become healthy..."
            until curl -sf "http://${BOOTSTRAP_FQDN}:2379/pd/api/v1/health" \
                    | jq -e '.[0].health == true' >/dev/null \
                  && curl -sf "http://${BOOTSTRAP_FQDN}:2379/pd/api/v1/leader" \
                    | jq -e '.member_id' >/dev/null \
                  && curl -sf "http://${BOOTSTRAP_FQDN}:2379/pd/api/v1/members" \
                    | jq -e '.members | length >= 1' >/dev/null; do
                echo "Bootstrap PD not ready yet (waiting for at least 1 member)..."
                sleep 5
            done

            echo "Bootstrap PD is healthy. Joining cluster."
            exec /pd-server --config=/etc/pd/pd.toml --join="http://${BOOTSTRAP_FQDN}:2379"
        fi
    fi