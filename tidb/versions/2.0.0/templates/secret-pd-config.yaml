---
kind: secret
name: {{ include "tidb.pdSecret.name" . }}
description: {{ .Release.Name }} TiDB placement driver startup script
tags: {{- include "tidb.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    # GVC comes from the runtime built-in, not from Helm: it cannot then drift
    # from the GVC the workload is actually running in.
    LOCATION=$(basename "${CPLN_LOCATION}")
    HOSTNAME=${HOSTNAME}
    GVC="${CPLN_GVC}"
    WORKLOAD_NAME="{{ include "tidb.pd.name" . }}"
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"

    # Parse LOCATIONS into individual location variables
    IFS=',' read -ra LOC_ARRAY <<< "$LOCATIONS"
    FIRST_LOCATION="${LOC_ARRAY[0]}"
    SECOND_LOCATION="${LOC_ARRAY[1]:-}"
    BOOTSTRAP_FQDN="replica-0.${WORKLOAD_NAME}.${FIRST_LOCATION}.${GVC}.cpln.local"
    LOCATIONS_SPACED=" ${LOCATIONS//,/ } "

    mkdir -p /data /etc/pd

    HAS_DATA=false
    if [[ -d "/data/member" && $(find /data/member -type f 2>/dev/null | wc -l) -gt 0 ]]; then
      HAS_DATA=true
    fi

    # --- Guard: never form a PD member from an undeclared location ---
    # defaultOptions.minScale/maxScale are 0, so the platform should never place
    # a replica here at all. This is the last line of defence if it does. A PD
    # member in an undeclared location would join the quorum under a name nobody
    # dials — TiKV and tidb-server build their endpoint lists from `locations`,
    # so it would be paid for, counted for quorum, and unreachable.
    # Unconditional, fresh data directory or not.
    case "${LOCATIONS_SPACED}" in
      *" ${LOCATION} "*) : ;;
      *) echo "[tidb-pd] FATAL: this member is running in location '${LOCATION}', which is not in the configured location list (${LOCATIONS})." >&2
         echo "[tidb-pd] Refusing to join a quorum that no TiKV or tidb-server node will ever dial." >&2
         echo "[tidb-pd] Remove this location from the GVC, or add it to 'locations' in your values." >&2
         exit 1 ;;
    esac

    # --- GVC location reconciliation ---
    # The platform accepts a localOptions entry naming a location the GVC does
    # not have: it is stored verbatim, is inert, and nothing reports it. So a
    # typo in `locations` yields a cluster that waits forever for PD members
    # which can never appear, while `helm install` reports success. Helm cannot
    # see a live GVC at render time, so ask the GVC itself.
    #
    # Asymmetric on purpose: hard-fail ONLY when this member's data directory has
    # never been written. On a member that already has data a missing location is
    # indistinguishable from a location being down, and surviving that is the
    # whole point of the product. This check must never be the reason a live
    # cluster stops.
    #
    # `timeout` bounds the WHOLE call, and curl's own --retry is NOT used:
    # --max-time is PER ATTEMPT, so `--max-time 10 --retry 3 --retry-delay 2`
    # was measured at 46s against an unroutable address. Retrying in shell keeps
    # the worst case at 3*8 + 2*2 = 28s. An unresolvable hostname would return in
    # a few seconds and prove nothing about the bound, so it was measured against
    # a blackhole address instead.
    TIMEOUT_CMD="timeout 8"
    command -v timeout >/dev/null 2>&1 || TIMEOUT_CMD=""
    GVC_LOCS=""
    GVC_READ_OK="false"
    for _try in 1 2 3; do
      if GVC_JSON=$(${TIMEOUT_CMD} curl -sS --max-time 6 \
            -H "Authorization: ${CPLN_TOKEN:-}" \
            "${CPLN_ENDPOINT:-http://api.cpln.io}/org/${CPLN_ORG:-}/gvc/${GVC}" 2>/dev/null); then
        GVC_LOCS=$(printf '%s' "${GVC_JSON}" | tr -d ' \n' \
          | sed -n 's/.*"locationLinks":\[\([^]]*\)\].*/\1/p' \
          | tr ',' '\n' | sed 's#.*/##;s/"//g' | tr '\n' ' ')
        if [[ -n "${GVC_LOCS}" ]]; then
          GVC_READ_OK="true"
          break
        fi
      fi
      sleep 2
    done

    if [[ "${GVC_READ_OK}" != "true" ]]; then
      # A control-plane hiccup must never be the reason a database refuses to
      # start. Skip the API-backed check; the values-only guard above still applies.
      echo "[tidb-pd] WARNING: could not read the location list of GVC '${GVC}' -- skipping the GVC location check." >&2
    else
      MISSING=""
      for loc in ${LOCATIONS//,/ }; do
        case " ${GVC_LOCS} " in
          *" ${loc} "*) : ;;
          *) MISSING="${MISSING}${loc} " ;;
        esac
      done
      EXTRA=""
      for loc in ${GVC_LOCS}; do
        case "${LOCATIONS_SPACED}" in
          *" ${loc} "*) : ;;
          *) EXTRA="${EXTRA}${loc} " ;;
        esac
      done
      if [[ -n "${EXTRA}" ]]; then
        echo "[tidb-pd] GVC '${GVC}' also has locations this release does not use: ${EXTRA% } -- nothing TiDB-related runs there."
      fi
      if [[ -z "${MISSING}" ]]; then
        echo "[tidb-pd] GVC location check OK -- '${GVC}' has every configured location (${LOCATIONS})"
      elif [[ "${HAS_DATA}" != "true" ]]; then
        echo "[tidb-pd] FATAL: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "[tidb-pd] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "[tidb-pd] Refusing to bootstrap a cluster whose PD members can never all appear. Add the missing location(s) to the GVC, or remove them from 'locations' in your values." >&2
        exit 1
      else
        echo "[tidb-pd] WARNING: locations declared in values are not in GVC '${GVC}': ${MISSING% }" >&2
        echo "[tidb-pd] GVC '${GVC}' has: ${GVC_LOCS% }" >&2
        echo "[tidb-pd] This member already has data, so it keeps serving -- but PD members in the missing location(s) will never appear." >&2
      fi
    fi

    # Restart peer: used when a node restarts with existing data and needs to re-join.
    # With 2+ locations, use replica-0 in the second location.
    # With 1 location, use replica-1 in the same location.
    if [[ -n "$SECOND_LOCATION" ]]; then
      RESTART_PEER_NAME="${SECOND_LOCATION}-0"
      RESTART_PEER_FQDN="replica-0.${WORKLOAD_NAME}.${SECOND_LOCATION}.${GVC}.cpln.local"
    else
      RESTART_PEER_NAME="${FIRST_LOCATION}-1"
      RESTART_PEER_FQDN="replica-1.${WORKLOAD_NAME}.${FIRST_LOCATION}.${GVC}.cpln.local"
    fi

    IS_BOOTSTRAP=false
    FORCE_NEW_CLUSTER=false

    if [[ "$LOCATION" == "$FIRST_LOCATION" && "$REPLICA_INDEX" == "0" ]]; then
        IS_BOOTSTRAP=true
        echo "This is the primary bootstrap replica."

        if [[ "$HAS_DATA" == "true" ]]; then
            echo "Persistent data found. Normal startup."
            FORCE_NEW_CLUSTER=false
        else
            echo "No persistent data found. Bootstrapping new cluster."
            FORCE_NEW_CLUSTER=true
        fi
    else
        echo "This replica will join the existing cluster via ${BOOTSTRAP_FQDN}"
    fi

    # Base PD config
    #
    # [replication] MUST be here, in the FIRST-BOOT config. PD reads it only while
    # bootstrapping and then persists it as cluster state in etcd; on every later
    # boot it ignores this file section entirely. It used to appear only in the
    # regenerate-on-restart config below, which meant it never took effect at all —
    # PD bootstrapped with its built-in default of max-replicas = 3 (observed live
    # 2026-08-07: the file said 2 and the PD API said 3). Getting this wrong is
    # invisible at render time and shows up only as a cluster that never becomes
    # ready, or as region-aware placement silently not working.
    #
    # max-replicas is the number of TiKV nodes this install has, clamped to 3
    # (TiKV's own default). PD cannot place more copies than there are stores, so
    # a smaller install would otherwise leave every region permanently
    # under-replicated. Because PD persists this at bootstrap, it is fixed for the
    # life of the cluster — scaling TiKV up later does not raise it.
    #
    # location-labels is set on EVERY shape, including a single-location install.
    # It costs nothing there (one region value) and it is the only chance to set
    # it: a cluster bootstrapped without it can never become region-aware, even
    # after locations are added. 1.x set it only outside devMode.
    #
    # Store labels are NOT set here. [labels] in pd.toml sets PD's own member
    # labels; the store label a placement rule matches on comes from TiKV, under
    # [server] labels in tikv.toml.
    # Any key appended to this file AFTER a [table] header is parsed INTO that
    # table, so `initial-cluster-state` is baked in here rather than echoed on
    # afterwards — appending it would silently make it `[replication]
    # initial-cluster-state`, which PD ignores.
    INITIAL_STATE=""
    if [[ "$IS_BOOTSTRAP" == "true" && "$FORCE_NEW_CLUSTER" == "true" ]]; then
        INITIAL_STATE='initial-cluster-state = "new"'
    fi

    cat > /etc/pd/pd.toml <<EOF
    name = "${LOCATION}-${REPLICA_INDEX}"
    data-dir = "/data"
    client-urls = "http://0.0.0.0:2379"
    peer-urls   = "http://0.0.0.0:2380"
    advertise-client-urls = "http://${SELF_FQDN}:2379"
    advertise-peer-urls   = "http://${SELF_FQDN}:2380"
    ${INITIAL_STATE}

    [replication]
    max-replicas = {{ include "tidb.maxReplicas" . }}
    location-labels = ["region"]
    EOF

    if [[ "$HAS_DATA" == "true" ]]; then
        echo "Existing PD data detected — regenerating clean config.toml"
        rm -f /etc/pd/pd.toml

        # Same rule as the first-boot config above: a key appended after a [table]
        # header is parsed INTO that table, so initial-cluster is computed here and
        # placed among the top-level keys rather than echoed on after [metric].
        if [[ "$IS_BOOTSTRAP" == "true" ]]; then
            INITIAL_CLUSTER="${RESTART_PEER_NAME}=http://${RESTART_PEER_FQDN}:2380"
            echo "joining with $RESTART_PEER_FQDN"
        else
            INITIAL_CLUSTER="$FIRST_LOCATION-0=http://${BOOTSTRAP_FQDN}:2380"
            echo "joining with $BOOTSTRAP_FQDN"
        fi

    # Recreate a clean pd.toml file
        cat > /etc/pd/pd.toml <<EOF
    name = "${LOCATION}-${REPLICA_INDEX}"
    data-dir = "/data"
    client-urls = "http://0.0.0.0:2379"
    peer-urls   = "http://0.0.0.0:2380"
    advertise-client-urls = "http://${SELF_FQDN}:2379"
    advertise-peer-urls   = "http://${SELF_FQDN}:2380"
    initial-cluster-state = "existing"
    initial-cluster = "${INITIAL_CLUSTER}"

    election-interval = "20000ms"
    tick-interval = "500ms"
    lease = 15

    [replication]
    max-replicas = {{ include "tidb.maxReplicas" . }}
    location-labels = ["region"]

    [log]
    level = "info"

    [metric]
    interval = "5s"
    EOF
    fi

    # Retry Helper Function
    retry_start_existing() {
      local attempt=1
      local max_attempts=5
      local delay=10
      while (( attempt <= max_attempts )); do
        echo "Attempt $attempt to start PD with existing data..."
        /pd-server --config=/etc/pd/pd.toml && return 0
        echo "Startup attempt $attempt failed. Retrying in ${delay}s..."
        sleep $delay
        ((attempt++))
      done
      echo "All restart attempts failed after ${max_attempts} tries. Exiting."
      exit 1
    }

    # Start PD
    if [[ "$IS_BOOTSTRAP" == "true" ]]; then
        if [[ "$FORCE_NEW_CLUSTER" == "true" ]]; then
            echo "Starting PD bootstrap with --force-new-cluster"
            exec /pd-server --config=/etc/pd/pd.toml --force-new-cluster
        else
            echo "Starting PD bootstrap normally (no --join)"
            exec /pd-server --config=/etc/pd/pd.toml
        fi
    else
        if [[ "$HAS_DATA" == "true" ]]; then
            echo "Persistent data found. Starting normally (existing cluster)."
            retry_start_existing
        else
            echo "Waiting for bootstrap PD to become healthy..."
            until curl -sf "http://${BOOTSTRAP_FQDN}:2379/pd/api/v1/health" \
                    | jq -e '.[0].health == true' >/dev/null \
                  && curl -sf "http://${BOOTSTRAP_FQDN}:2379/pd/api/v1/leader" \
                    | jq -e '.member_id' >/dev/null \
                  && curl -sf "http://${BOOTSTRAP_FQDN}:2379/pd/api/v1/members" \
                    | jq -e '.members | length >= 1' >/dev/null; do
                echo "Bootstrap PD not ready yet (waiting for at least 1 member)..."
                sleep 5
            done

            echo "Bootstrap PD is healthy. Joining cluster."
            exec /pd-server --config=/etc/pd/pd.toml --join="http://${BOOTSTRAP_FQDN}:2379"
        fi
    fi
