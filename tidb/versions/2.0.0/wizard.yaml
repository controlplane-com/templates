# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: TiDB
# The chart lists its locations (localOptions per entry) and scales every other GVC location to 0.
gvc:
  minLocations: 1

steps:
  - id: cluster
    title: Cluster
    description: Where the PD, TiKV and TiDB server tiers run, how many of each, and their compute.
    sections:
      - id: locations
        fields:
          - type: note
            when: >-
              context.gvcLocations != null && self.locations.exists(l, l.name != '') &&
              context.gvcLocations.exists(g, !(g in self.locations.map(l, l.name)))
            text: GVC locations not listed here run nothing, and clients there cannot reach this cluster.
            textExpression: >-
              'GVC locations not listed here run nothing, and clients there cannot reach this cluster: ' +
              context.gvcLocations.filter(g, !(g in self.locations.map(l, l.name))).join(', ') + '.'
          - path: locations
            type: list
            label: Locations
            required: true
            minItems: 1
            uniqueBy: [name]
            widget: table
            newItem: { name: "", replicas: 1 }
            itemLabel: "item.name + ' × ' + (item.replicas == null ? '?' : string(item.replicas))"
            description: >-
              Each location runs the given number of TiKV nodes and the same number of TiDB servers. Clients
              reach only the TiDB servers in their own location.
            help: >-
              With three TiKV nodes and three PD members, one location survives the loss of a node, but not the
              loss of the location. Surviving the loss of a location needs at least three locations, and your
              application running in at least two of them.
            item:
              type: object
              fields:
                - path: name
                  type: ref
                  label: Location
                  required: true
                  ref: { kind: location, scope: gvc, format: name, mustExist: error }
                - path: replicas
                  type: integer
                  label: TiKV nodes and TiDB servers
                  required: true
                  min: 1
                  suggestions: [1, 2, 3, 5]
              rules:
                # README: Prerequisites; PD's GVC location check in secret-pd-config.yaml.
                - rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
                  paths: [name]
                  message: >-
                    This location is not in the target GVC. PD refuses to bootstrap a new cluster while a listed
                    location is missing from the GVC.
          - path: pdReplicas
            type: enum
            label: PD members
            widget: segmented
            required: true
            description: >-
              The placement driver quorum, spread evenly across the locations with any remainder in the first
              ones.
            options: [1, 3, 5, 7]
        rules:
          - rule: self.locations.all(l, l.replicas == null || l.replicas >= 1)
            mirrors: tidb.validateLocations
            paths: [locations]
            message: >-
              Every location needs replicas of at least 1. To stop running in a location, remove it from the
              list.
          - rule: self.pdReplicas in [1, 3, 5, 7]
            mirrors: tidb.validatePdReplicas
            paths: [pdReplicas]
            message: PD is Raft based, so it needs 1, 3, 5 or 7 members.
          # values.yaml: "1 is a single point of failure and is for testing only."
          - rule: self.pdReplicas != 1
            severity: info
            paths: [pdReplicas]
            message: A single PD member is a single point of failure; use it for testing only.
          # _helpers.tpl tidb.maxReplicas (total replicas, i.e. TiKV nodes, capped at 3; fixed at bootstrap).
          - when: context.mode == 'install' && self.locations.all(l, l.replicas != null)
            rule: sum(self.locations.map(l, l.replicas)) >= 3
            severity: info
            paths: [locations]
            messageExpression: >-
              'PD fixes the replication factor at the TiKV node count when the cluster first bootstraps (' +
              string(sum(self.locations.map(l, l.replicas))) +
              ' here, capped at 3), and adding TiKV nodes later does not raise it. Start with at least 3 TiKV
              nodes for 3-way replication.'
            message: >-
              PD fixes the replication factor when the cluster first bootstraps, at the number of TiKV nodes
              (capped at 3), and adding TiKV nodes later does not raise it. Start with at least 3 TiKV nodes for
              3-way replication.
          - when: >-
              self.locations.all(l, l.replicas != null) &&
              (oldSelf == null || oldSelf.locations.all(l, l.replicas != null))
            rule: >-
              oldSelf == null || sum(oldSelf.locations.map(l, l.replicas)) >= 3 ||
              sum(self.locations.map(l, l.replicas)) <= sum(oldSelf.locations.map(l, l.replicas))
            severity: info
            paths: [locations]
            message: >-
              Adding TiKV nodes does not raise the replication factor: PD fixed it when the cluster first
              bootstrapped, at the number of TiKV nodes then (capped at 3).
          # secret-pd-config.yaml: the first PD member of the FIRST location starts the cluster, and with no PD data
          # of its own it runs --force-new-cluster, so a first location without PD data starts a new, empty cluster.
          - when: >-
              oldSelf != null && size(oldSelf.locations) > 0 && size(self.locations) > 0 &&
              self.locations[0].name != ''
            rule: oldSelf == null || oldSelf.locations.exists(l, l.name == self.locations[0].name)
            severity: warning
            paths: [locations]
            message: >-
              The first location's first PD member starts the cluster, and one with no PD data starts a new, empty
              cluster. Keep a location this release already runs in first.
          - when: >-
              oldSelf != null && size(oldSelf.locations) > 0 && size(self.locations) > 0 &&
              self.locations[0].name != ''
            rule: >-
              oldSelf == null || oldSelf.locations[0].name == self.locations[0].name ||
              !oldSelf.locations.exists(l, l.name == self.locations[0].name)
            severity: info
            paths: [locations]
            message: >-
              The first location changed. Its first PD member starts the cluster when it has no PD data of its
              own, so the new first location must already run a PD member, or PD starts a new, empty cluster.
      - id: compute
        title: Compute
        description: The defaults are sized for testing.
        docs: "#images-and-resources"
        fields:
          # PD and TiKV are stateful, so maxRatio 4 (§6.7); the check needs the four-key shape and is inert on
          # these {cpu, memory} limit blocks.
          - path: resources.pd
            type: resources
            label: PD resources
            required: true
            description: Per PD member. For production, PD wants 4 to 8 CPU and 8 to 16Gi.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: resources.tikv
            type: resources
            label: TiKV resources
            required: true
            description: Per TiKV node. For production, TiKV wants 8 to 16 CPU and 32 to 64Gi, memory for caching.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: resources.server
            type: resources
            label: TiDB server resources
            required: true
            description: >-
              Per TiDB server. For production, 8 to 16 CPU and 16 to 32Gi; it scales with concurrent
              connections.
            cpu: { min: 25m }
            memory: { min: 32Mi }

  - id: database
    title: Database
    description: The prerequisite credentials secret, and the job that sets root's password and creates the database.
    sections:
      - id: auto-create
        title: Set the root password and create the database
        toggle: autoCreateDatabase.enabled
        description: >-
          An init job sets root's password and creates the application database and user, from a dictionary
          secret you create first. Root has no password until the job has run; off, it keeps none: set one with
          `ALTER USER` before any client can reach the cluster.
        fields:
          - type: note
            severity: warning
            text: >-
              The credentials secret must exist **before** you install. If it is missing, the deployment waits
              silently and `cpln logs` shows nothing; `cpln workload get-deployments` on the TiDB server workload
              shows the reason. Creating the secret repairs the deployment in about 5.5 to 10.5 minutes, or force
              a redeployment to skip the wait.
          # secret-db-config.yaml: the init job writes ROOT_PW, APP_USER, APP_PW and APP_DB into its SQL unescaped
          # (reproduced: a ' in a password yields IDENTIFIED BY 'pa'ss'). ALTER USER root runs first, then
          # CREATE DATABASE/USER; 2.2.0 escapes them (briefing).
          - type: note
            severity: warning
            text: >-
              In this version the init job writes the secret's values into SQL unescaped. A `'` or `\` in
              rootPassword leaves root without the secret's password (none, or a different one). A `'` or `\` in
              user or password, or a backtick in db, sets root's password but never creates the database and user.
              Either way the job keeps failing. 2.2.0 escapes them.
          - path: autoCreateDatabase.credentialsSecretName
            type: ref
            label: Credentials secret
            required: true
            description: A dictionary secret with the keys `rootPassword`, `user`, `password` and `db`.
            help: >-
              `user` may be at most 32 characters and `db` at most 64; longer ones make the init job fail after it
              has set root's password. Secret names are org-wide, so give each release its own. The values apply when the cluster is
              first initialized only: to rotate a password, run `ALTER USER` first, then update the secret to
              match.
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [rootPassword, user, password, db]
              create:
                suggestName: "context.releaseName + '-tidb-credentials'"
          - path: autoCreateDatabase.deployInitWorkload
            type: boolean
            label: Deploy the init job
            description: >-
              A cron job that sets the root password and creates the database and user. In this version it runs
              in every location of the GVC. Turn it off once the cluster is initialized.
          - path: autoCreateDatabase.schedule
            type: string
            format: cron
            label: Init job schedule (UTC)
            required: true
            when: self.autoCreateDatabase.deployInitWorkload
            description: >-
              The job exits at once when the database exists, so this only sets how soon after install it
              checks.
        rules:
          - rule: "!has(self.autoCreateDatabase.database)"
            mirrors: tidb.validate
            paths: [autoCreateDatabase.credentialsSecretName]
            message: >-
              autoCreateDatabase.database was removed in 1.8.0. Put rootPassword, user, password and db in the
              dictionary secret and remove the block from the values.
          # README: Important Notes ("Credentials apply on first initialization only").
          - rule: >-
              oldSelf == null || !oldSelf.autoCreateDatabase.enabled ||
              self.autoCreateDatabase.credentialsSecretName == oldSelf.autoCreateDatabase.credentialsSecretName
            severity: info
            paths: [autoCreateDatabase.credentialsSecretName]
            message: >-
              The credentials apply when the cluster is first initialized only; another secret does not change
              the existing users or passwords. Change them with `ALTER USER` first so they match the secret.
          # workload-db-init.yaml: the job is the only thing that sets root's password in this version.
          - when: context.mode == 'install'
            rule: self.autoCreateDatabase.deployInitWorkload
            severity: info
            paths: [autoCreateDatabase.deployInitWorkload]
            message: >-
              Without the init job nothing sets root's password or creates the database and user; root starts
              with no password.

  - id: storage
    title: Storage
    description: The TiKV and PD volume sets, and optional TiKV autoscaling.
    sections:
      - id: tikv-storage
        title: TiKV volumes
        description: One volume per TiKV node.
        fields:
          # volumeset.yaml: snapshots carry a retention but no schedule (as in 2.1.0; 2.2.0 README: "2.1.0 declared the
          # retention but never scheduled a snapshot").
          - type: note
            severity: warning
            text: >-
              This version takes no volume snapshots: the volume sets declare a retention but no schedule.
              2.2.0 snapshots every PD and TiKV volume daily. Rely on backups for recovery.
          - path: volumeset.tikv.capacity
            type: integer
            label: TiKV initial capacity
            required: true
            docs: "/reference/volumeset#capacity-and-billing"
            unit: GiB
            min: 10
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
      - id: tikv-autoscaling
        title: Grow TiKV storage automatically
        toggle: volumeset.tikv.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.tikv.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            required: true
            unit: GiB
            min: 10
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.tikv.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            required: true
            unit: "%"
            min: 1
            max: 100
            suggestions: [10, 20, 30]
          - path: volumeset.tikv.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            required: true
            min: 1.1
            step: 0.1
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.tikv.autoscaling.maxCapacity >= self.volumeset.tikv.capacity
            paths: [volumeset.tikv.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the TiKV initial capacity.
      - id: pd-storage
        title: PD volumes
        description: One volume per PD member. PD holds only cluster metadata, so it has no autoscaling.
        fields:
          - path: volumeset.pd.capacity
            type: integer
            label: PD initial capacity
            required: true
            unit: GiB
            min: 10
            suggestions: [10, 20, 50, 100]
    rules:
      - rule: oldSelf == null || self.volumeset.tikv.capacity >= oldSelf.volumeset.tikv.capacity
        paths: [volumeset.tikv.capacity]
        message: Keep the TiKV capacity at or above the installed value. Lowering it would not shrink the existing volume.
      - rule: oldSelf == null || self.volumeset.pd.capacity >= oldSelf.volumeset.pd.capacity
        paths: [volumeset.pd.capacity]
        message: Keep the PD capacity at or above the installed value. Lowering it would not shrink the existing volume.

  - id: access
    title: Access
    description: Who can reach each tier, and outbound internet access.
    sections:
      - fields:
          - type: note
            text: >-
              Every workload this release creates can always reach every tier; these settings are for your
              clients. Access changes take up to about 10 minutes to apply.
      - id: server-access
        title: TiDB servers
        description: >-
          The MySQL endpoint on port 4000. It takes no public inbound traffic: reach it over internal GVC DNS or
          `cpln port-forward`.
        fields:
          - path: internal_access.server.type
            type: enum
            label: Who can reach the TiDB servers
            widget: cards
            required: true
            options:
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: "The workloads listed below, plus this release's own." }
          - path: internal_access.server.workloads
            type: list
            label: TiDB server client workloads
            widget: tags
            unique: true
            required: true
            when: self.internal_access.server.type == 'workload-list'
            description: List your clients only; this release's own workloads are always allowed.
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
          # Chart bug (workload-server.yaml prints the list with Go formatting): two entries merge into one
          # string, and a leading ":" breaks the YAML. maxItems and the item pattern keep the render valid.
          - path: external_access.server_outboundAllowCIDR
            type: list
            label: TiDB server outbound CIDRs
            widget: tags
            description: Internet addresses the TiDB servers may connect to, such as `0.0.0.0/0`.
            maxItems: 1
            item:
              type: string
              format: cidr
              pattern: '^[^:]'
              patternMessage: Write a leading `::` with a zero, such as `0::/0`.
      - id: tikv-access
        title: TiKV
        fields:
          - path: internal_access.tikv.type
            type: enum
            label: Who can reach TiKV
            widget: cards
            required: true
            options:
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: "The workloads listed below, plus this release's own." }
          - path: internal_access.tikv.workloads
            type: list
            label: TiKV client workloads
            widget: tags
            unique: true
            when: self.internal_access.tikv.type == 'workload-list'
            description: Leave empty to allow only this release's own workloads.
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
          - path: external_access.tikv_outboundAllowCIDR
            type: list
            label: TiKV outbound CIDRs
            widget: tags
            description: >-
              Internet addresses TiKV may connect to. Ignored while backups are on: TiKV then gets `0.0.0.0/0` to
              upload to the bucket.
            maxItems: 1
            item:
              type: string
              format: cidr
              pattern: '^[^:]'
              patternMessage: Write a leading `::` with a zero, such as `0::/0`.
      - id: pd-access
        title: PD
        fields:
          - path: internal_access.pd.type
            type: enum
            label: Who can reach PD
            widget: cards
            required: true
            options:
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: "The workloads listed below, plus this release's own." }
          - path: internal_access.pd.workloads
            type: list
            label: PD client workloads
            widget: tags
            unique: true
            when: self.internal_access.pd.type == 'workload-list'
            description: Leave empty to allow only this release's own workloads.
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
          - path: external_access.pd_outboundAllowCIDR
            type: list
            label: PD outbound CIDRs
            widget: tags
            description: Internet addresses PD may connect to.
            maxItems: 1
            item:
              type: string
              format: cidr
              pattern: '^[^:]'
              patternMessage: Write a leading `::` with a zero, such as `0::/0`.

  - id: backup
    title: Backups
    description: Scheduled full-cluster backups with `br` to object storage.
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        description: >-
          A cron job in one location runs `br backup full` and writes a full cluster snapshot to S3 or GCS.
          While it is on, TiKV gets outbound access to `0.0.0.0/0`, because it uploads to the bucket directly.
        docs: "#backup"
        fields:
          - path: backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          # Chart bug: workload-backup.yaml writes the schedule unquoted, so a value starting with * or @ breaks
          # the YAML. The pattern keeps the first character a digit.
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            pattern: '^[0-9]'
            patternMessage: Start with the minute as a number, such as `0 2 * * *`; write `*/15` as `0-59/15`.
          - path: backup.location
            type: enum
            label: Run the backup job in
            required: true
            description: The job runs only there. Put it near your bucket to keep transfer costs down.
            optionsFrom: self.locations.filter(l, l.name != '').map(l, l.name)
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            pattern: '^.*[/:@].*$'
            patternMessage: Include a repository path or a tag, such as `ghcr.io/controlplane-com/backup-images/tidb-backup:8.5.7`.
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
          - path: backup.activeDeadlineSeconds
            type: integer
            label: Backup job time limit
            required: true
            advanced: true
            description: The job is stopped when a run takes longer.
            unit: seconds
            min: 1
            suggestions: [3600, 7200, 14400, 28800]
        rules:
          - rule: self.backup.location in self.locations.map(l, l.name)
            mirrors: tidb.validateBackupLocation
            paths: [backup.location]
            message: The backup location must be one of the configured locations, or the job never runs.
          # workload-backup.yaml: TIDB_PD_ADDR is the PD service name, which reaches only PD members in the
          # backup job's own location (2.2.0 README/briefing: "the service name only reaches PD in the backup's
          # own location, which may have none"). PD members fill the first locations first (tidb.pdEndpointList).
          - when: self.backup.location in self.locations.map(l, l.name) && self.pdReplicas in [1, 3, 5, 7]
            rule: >-
              self.pdReplicas >= size(self.locations) || self.locations[0].name == self.backup.location ||
              (self.pdReplicas >= 3 && (self.locations[1].name == self.backup.location ||
              self.locations[2].name == self.backup.location)) ||
              (self.pdReplicas >= 5 && (self.locations[3].name == self.backup.location ||
              self.locations[4].name == self.backup.location)) ||
              (self.pdReplicas >= 7 && (self.locations[5].name == self.backup.location ||
              self.locations[6].name == self.backup.location))
            severity: warning
            paths: [backup.location]
            message: >-
              No PD member runs in this location, and in this version the backup job reaches PD only in its own
              location, so every backup fails. Pick one of the first locations, which run the PD members.
          - rule: self.backup.provider in ['aws', 'gcp']
            mirrors: tidb.validateBackupConfig
            paths: [backup.provider]
            message: Choose AWS S3 or Google Cloud Storage as the destination.
          # README: Backing Up ("The backup image version must match the cluster version"). The backup tag's
          # version is compared without a packaging suffix (8.5.7-1 counts as 8.5.7).
          - when: >-
              self.backup.image != null && self.images.server != null && self.images.tikv != null &&
              self.images.pd != null && self.backup.image.matches('^[^@]*:v?[0-9][0-9A-Za-z.-]*$')
            rule: >-
              (self.images.server.contains('@') ||
              self.images.server.endsWith(':' + self.backup.image.split(':')[size(self.backup.image.split(':')) - 1].split('-')[0]) ||
              self.images.server.endsWith(':v' + self.backup.image.split(':')[size(self.backup.image.split(':')) - 1].split('-')[0])) &&
              (self.images.tikv.contains('@') ||
              self.images.tikv.endsWith(':' + self.backup.image.split(':')[size(self.backup.image.split(':')) - 1].split('-')[0]) ||
              self.images.tikv.endsWith(':v' + self.backup.image.split(':')[size(self.backup.image.split(':')) - 1].split('-')[0])) &&
              (self.images.pd.contains('@') ||
              self.images.pd.endsWith(':' + self.backup.image.split(':')[size(self.backup.image.split(':')) - 1].split('-')[0]) ||
              self.images.pd.endsWith(':v' + self.backup.image.split(':')[size(self.backup.image.split(':')) - 1].split('-')[0]))
            severity: warning
            paths: [backup.image]
            message: >-
              The backup image's version must match the PD, TiKV and TiDB server images: from v8.5.7, `br` refuses
              a cluster of another version. Change them together.
      - id: aws
        title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        fields:
          # Chart bug: the bucket is an unquoted env value, so a name YAML reads as a number, date, boolean or
          # null (123, 1e3, 2024-01-01, true, null) comes out as another type. The pattern rejects those.
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^(?!(yes|off|true|false|null)$)(?!0x[0-9a-f]+$)(?!0o[0-7]+$)(?!0b[01]+$)(?![0-9][0-9.]*e-?[0-9]+$)(?=.*[a-z])[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
            patternMessage: >-
              Use 3 to 63 lowercase letters, digits, dots and dashes, including a letter; a name YAML reads as a
              number, boolean or null (such as `1e3` or `true`) breaks the chart.
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              An AWS [cloud account](/guides/create-cloud-account). The release's identity uses it with the IAM
              policy below to reach the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              Allow `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject`, `s3:ListBucket`, `s3:GetObjectVersion`,
              `s3:DeleteObjectVersion`, `s3:GetBucketLocation`, `s3:AbortMultipartUpload`,
              `s3:ListBucketMultipartUploads` and `s3:ListMultipartUploadParts` on the bucket and its objects.
              The full policy is under [Backing up](#backing-up).
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            description: Backups land at `<bucket>/<prefix>/tidb-<timestamp>/`.
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.
      - id: gcs
        title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        fields:
          # Chart bug: as for the S3 bucket.
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^(?!(yes|off|true|false|null)$)(?!0x[0-9a-f_]+$)(?!0o[0-7_]+$)(?!0b[01_]+$)(?![0-9][0-9._]*e-?[0-9]+$)(?=.*[a-z])[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
            patternMessage: >-
              Use lowercase letters, digits, dots, dashes and underscores, including a letter; a name YAML reads as
              a number, boolean or null (such as `1e3` or `true`) breaks the chart.
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin
              (`roles/storage.admin`) role on the bucket. The chart also binds `roles/storage.objectAdmin` on the
              bucket to the release's identity.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            description: Backups land at `<bucket>/<prefix>/tidb-<timestamp>/`.
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.

  - id: advanced
    title: Advanced
    description: The PD, TiKV and TiDB server images.
    # Chart bug: every image is written unquoted, so a value YAML reads as null, a boolean or a number (null,
    # true, 1e3) comes out as another type. The patterns require a repository path, a tag or a digest.
    fields:
      - path: images.server
        type: string
        format: image
        label: TiDB server image
        required: true
        pattern: '^.*[/:@].*$'
        patternMessage: Include a repository path or a tag, such as `pingcap/tidb:v8.5.7`.
      - path: images.tikv
        type: string
        format: image
        label: TiKV image
        required: true
        pattern: '^.*[/:@].*$'
        patternMessage: Include a repository path or a tag, such as `pingcap/tikv:v8.5.7`.
      - path: images.pd
        type: string
        format: image
        label: PD image
        required: true
        pattern: '^.*[/:@].*$'
        patternMessage: Include a repository path or a tag, such as `pingcap/pd:v8.5.7`.

rules:
  # 2.1.0 README "Upgrading from 2.0.0" and briefing: a 2.0.0 bootstrap left store 1 never heartbeating on
  # 2 of 2 fresh default installs (PD self-hairpin, fixed in 2.1.0), and upgrading does not repair it.
  # Warning, not error: a warning still blocks Install, and an error rule must hold on the chart defaults (§8.10).
  - when: context.mode == 'install'
    rule: context.mode != 'install'
    severity: warning
    message: >-
      A fresh 2.0.0 install can bootstrap with a TiKV store that never comes up, so the cluster never serves
      SQL or runs without fault tolerance, and upgrading does not repair it. Install 2.1.0 or later instead.
  # README: Migrating from 1.x.
  - rule: context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '2.0.0') >= 0
    message: >-
      Do not upgrade a 1.x release in place: 1.x created its own GVC, and the upgrade deletes it with every
      workload, volume set and identity inside, including your data. Install this version as a new release
      with another name, restore a `br` backup into it, then uninstall the old release.
  - rule: "!has(self.gvc)"
    mirrors: tidb.validateNoLegacyGvc
    message: >-
      The gvc key was removed in 2.0.0: the chart deploys into the GVC you install into, and gvc.locations and
      gvc.pdReplicas moved to locations and pdReplicas. Remove gvc from the values.
  - rule: "!has(self.devMode)"
    mirrors: tidb.validateNoDevMode
    message: >-
      devMode was removed in 2.0.0: a single location needs no waiver any more. Remove devMode from the values.
  - rule: "!has(self.exposeServer)"
    mirrors: tidb.validateNoExposeServer
    message: >-
      exposeServer was removed in 2.0.0; it never published the MySQL port. Reach the TiDB servers over
      internal GVC DNS or `cpln port-forward`, and remove exposeServer from the values.

migrations:
  # 1.x releases cannot upgrade in place (root rule above); these say where each 1.x key went.
  - fromVersions: "<2.0.0"
    from: gvc.locations
    note: gvc.locations moved to locations in 2.0.0; set them under Cluster.
  - { fromVersions: "<2.0.0", from: gvc.pdReplicas, to: pdReplicas }
  - fromVersions: "<2.0.0"
    from: gvc.name
    note: 2.0.0 deploys into the GVC you install into and no longer creates one.
  - fromVersions: "<2.0.0"
    from: devMode
    note: devMode was removed in 2.0.0; a single location needs no waiver any more.
  - fromVersions: "<2.0.0"
    from: exposeServer
    note: exposeServer was removed in 2.0.0; reach the TiDB servers over internal GVC DNS or cpln port-forward.
  - fromVersions: "<1.8.0"
    from: autoCreateDatabase.database
    note: The credentials moved to a dictionary secret with the keys rootPassword, user, password and db; choose it under Database.
  - fromVersions: "<1.2.0"
    from: database
    note: The credentials moved to a dictionary secret with the keys rootPassword, user, password and db; choose it under Database.
  - fromVersions: "<1.2.0"
    from: internal_access.type
    note: Access is now set per tier; choose it for the TiDB servers, TiKV and PD under Access.
  - fromVersions: "<1.2.0"
    from: internal_access.workloads
    note: Access is now set per tier; list the client workloads for each tier under Access.
