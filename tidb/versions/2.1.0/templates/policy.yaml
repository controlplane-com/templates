---
kind: policy
name: {{ include "tidb.policy.name" . }}
description: TiDB secret reveal policy
tags: {{- include "tidb.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "tidb.identity.name" . }}
targetKind: secret
targetLinks:
  - //secret/{{ include "tidb.pdSecret.name" . }}
  - //secret/{{ include "tidb.serverSecret.name" . }}
  - //secret/{{ include "tidb.tikvSecret.name" . }}
{{- if .Values.autoCreateDatabase.enabled }}
  - //secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}
{{- end }}
{{- if and .Values.autoCreateDatabase.enabled .Values.autoCreateDatabase.deployInitWorkload }}
  - //secret/{{ include "tidb.dbInit.name" . }}
{{- end }}
