---
kind: workload
name: {{ include "tidb.pd.name" . }}
description: TiDB placement driver
tags:
  {{- /*
    Peer discovery must reach a replica on its replicaDirect endpoint while it is
    still NOT-READY during bootstrap. The platform otherwise RSTs all inbound to a
    not-ready replica (measured 2026-09-30) — which deadlocks PD/etcd raft join,
    since a member can only become ready by exchanging the peer traffic it can't
    receive until it is ready. This tag routes internal traffic to not-ready
    replicas. Precedent: redis (same tag, same reason). See
    PLATFORM-REPORT-replicaDirect-readiness-gating.md.
  */}}
  cpln/publishNotReadyAddresses: "true"
  {{- include "tidb.tags" . | nindent 2 }}
spec:
  type: stateful
  containers:
    - name: tidb-pd
      cpu: {{ .Values.resources.pd.cpu | quote }}
      image: {{ .Values.images.pd }}
      inheritEnv: false
      memory: {{ .Values.resources.pd.memory | quote }}
      command: "/bin/bash"
      args:
        - "/scripts/pd-startup.sh"
      ports:
        - number: 2379
          protocol: tcp
        - number: 2380
          protocol: tcp
      env:
        - name: LOCATIONS
          value: {{ include "tidb.locationNames" . | quote }}
        {{- /*
          The whole PD roster in bootstrap order, rendered once (same helper the
          TiKV/server endpoint lists use), so a member can find its own global
          ordinal and join the cluster ONE AT A TIME. Without serialized joins,
          members 2..N race to join a still-bootstrapping cluster and the
          bootstrap PD FATAL-crashes on `ErrEtcdMemberList` (reproduced 2/4
          cold starts on 2.0.0).
        */}}
        - name: PD_MEMBERS
          value: {{ include "tidb.pdEndpointList" . | quote }}
      readinessProbe:
        {{- /*
          Safe to gate readiness now that `cpln/publishNotReadyAddresses: "true"`
          (tag above) routes inbound/peer traffic to a not-ready replica — so the
          probe no longer blocks bootstrap. This makes `ready: true` mean "this PD
          is in a cluster with an elected leader". Self-scoped: it checks only
          THIS node's view of a leader, not every peer's health, so a peer going
          down never restarts a surviving PD (the readiness deadline restarts the
          container on this platform); the serialized bootstrap fits inside the
          deadline (failureThreshold ≤ 20).
        */}}
        exec:
          command:
            - /bin/sh
            - '-c'
            - >-
              curl -sf --max-time 4 http://localhost:2379/pd/api/v1/leader
              | grep -q '"member_id"'
        failureThreshold: 20
        initialDelaySeconds: 15
        periodSeconds: 15
        successThreshold: 1
        timeoutSeconds: 5
      volumes:
        - path: /data
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "tidb.pdVolume.name" . }}
        - path: /scripts/pd-startup.sh
          recoveryPolicy: retain   # API backfill, declared so rendered == stored
          uri: cpln://secret/{{ include "tidb.pdSecret.name" . }}.payload
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "tidb.identity.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      metric: disabled
      maxScale: 0   # a GVC location this release did not ask for runs NOTHING
      minScale: 0   # localOptions below supplies the real count for each configured location
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  {{- $locs := .Values.locations }}
  {{- $numLocs := len $locs }}
  {{- $pdReplicas := int .Values.pdReplicas }}
  {{- $baseReplicas := div $pdReplicas $numLocs }}
  {{- $remainder := mod $pdReplicas $numLocs }}
  {{- /*
    Every field defaultOptions carries is REPEATED in every entry. A localOptions
    entry is not a patch onto defaultOptions: the API completes a partial entry
    from its OWN platform defaults, so an omitted field falls through to a
    platform value rather than to the 0/0 shape above.
  */}}
  localOptions:
  {{- range $i, $loc := $locs }}
    {{- /*
        Replica distribution logic:
        - Distributes pdReplicas evenly across locations
        - Extra replicas (remainder) go to the first locations
        Example with 3 locations:
          pdReplicas=3: 1,1,1  |  pdReplicas=5: 2,2,1  |  pdReplicas=7: 3,2,2
        tidb.pdEndpointList in _helpers.tpl reproduces exactly this split, so
        the endpoints TiKV and tidb-server dial always match the PD members that
        actually exist.
    */ -}}
    {{- $replicas := $baseReplicas }}
    {{- if lt $i $remainder }}
      {{- $replicas = add $baseReplicas 1 }}
    {{- end }}
    {{- if gt (int $replicas) 0 }}
    - autoscaling:
        metric: disabled
        maxConcurrency: 0
        minScale: {{ $replicas }}
        maxScale: {{ $replicas }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      location: //location/{{ $loc.name }}
      suspend: false
      timeoutSeconds: 5
    {{- end }}
  {{- end }}
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: {{ .Values.external_access.pd_outboundAllowCIDR }}
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      {{- include "tidb.internalFirewall" (dict "root" . "access" .Values.internal_access.pd) | nindent 6 }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: true
  supportDynamicTags: false
