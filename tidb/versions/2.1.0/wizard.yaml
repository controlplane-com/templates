# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: TiDB
# The chart lists its locations and runs nothing in the GVC's other locations.
gvc:
  minLocations: 1

steps:
  - id: topology
    title: Locations
    description: Where PD, TiKV and the TiDB servers run.
    docs: "#locations"
    fields:
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '2.1.0') < 0
        text: >-
          This upgrade restarts PD, TiKV and the TiDB servers. Separate locations restart at the same
          time, so writes pause for up to about a minute while PD re-forms. A 2.0.0 install can be left
          with a TiKV store that never came up, which an upgrade does not repair: check that every store
          is `Up` first (see the README's "Upgrading from 2.0.0").
      - type: note
        when: >-
          context.gvcLocations != null &&
          context.gvcLocations.exists(g, !(g in self.locations.map(l, l.name)))
        textExpression: >-
          'GVC locations not listed here run nothing, and clients in them cannot reach this cluster: ' +
          context.gvcLocations.filter(g, !(g in self.locations.map(l, l.name))).join(', ') + '.'
      - path: locations
        type: list
        label: Locations
        required: true
        minItems: 1
        uniqueBy: [name]
        widget: table
        newItem: { name: "", tikvReplicas: 1, serverReplicas: 2 }
        itemLabel: "item.name + ': ' + string(item.tikvReplicas) + ' TiKV, ' + string(item.serverReplicas) + ' TiDB'"
        description: >-
          One entry per location. Clients reach only the TiDB servers in their own location, so run
          them in a listed location.
        help: >-
          Surviving the loss of a whole location needs at least three locations. Two or more TiDB
          servers per location, with the ProxySQL pooler on, keep a location serving through a server
          failure.
        item:
          type: object
          fields:
            - path: name
              type: ref
              label: Location
              required: true
              ref: { kind: location, scope: gvc, format: name, mustExist: error }
            - path: tikvReplicas
              type: integer
              label: TiKV nodes
              required: true
              min: 1
              widget: stepper
            - path: serverReplicas
              type: integer
              label: TiDB servers
              required: true
              min: 1
              widget: stepper
          rules:
            - rule: context.gvcLocations == null || item.name == '' || item.name in context.gvcLocations
              paths: [name]
              message: This location is not enabled on the target GVC; PD refuses to bootstrap.
            - rule: "!has(item.replicas)"
              mirrors: tidb.validateLocations
              paths: [name]
              message: >-
                replicas was split into tikvReplicas and serverReplicas in 2.1.0. Set both to the old
                value to keep the same shape, and remove replicas.
      - path: pdReplicas
        type: enum
        label: PD members
        widget: segmented
        required: true
        description: The total, spread evenly across the locations; the first locations take any remainder.
        options:
          - { value: 1, label: "1" }
          - { value: 3, label: "3" }
          - { value: 5, label: "5" }
          - { value: 7, label: "7" }
    rules:
      - rule: size(self.locations) > 0 && self.locations.all(l, l.name != null && l.name != '')
        mirrors: tidb.validateLocations
        paths: [locations]
        message: Every entry in the locations list needs a location name.
      - rule: >-
          self.locations.all(l, (l.tikvReplicas == null || l.tikvReplicas >= 1) &&
          (l.serverReplicas == null || l.serverReplicas >= 1))
        mirrors: tidb.validateLocations
        paths: [locations]
        message: >-
          Every location needs at least 1 TiKV node and 1 TiDB server; to stop running in a location,
          remove it.
      - rule: self.pdReplicas in [1, 3, 5, 7]
        mirrors: tidb.validatePdReplicas
        paths: [pdReplicas]
        message: PD members must be 1, 3, 5 or 7.
      - rule: self.pdReplicas != 1
        severity: info
        paths: [pdReplicas]
        message: A single PD member is a single point of failure; use it for testing only.
      - rule: >-
          sum(self.locations.map(l, l.tikvReplicas == null ? 0 : l.tikvReplicas)) >= 3
        severity: info
        paths: [locations]
        message: >-
          With fewer than 3 TiKV nodes in total, PD keeps fewer than 3 copies of each region, and that
          replication factor is fixed when the cluster is first created: adding nodes later does not
          raise it.

  - id: database
    title: Database
    description: The prerequisite credentials secret and the database created from it.
    docs: "#database-initialization"
    sections:
      - id: db-init
        title: Create the database and user
        toggle: autoCreateDatabase.enabled
        description: >-
          Sets the root password and creates the database and application user from a secret you
          create first.
        fields:
          - type: note
            severity: warning
            text: >-
              The credentials secret must exist **before** you install. If it is missing, the
              deployment waits and `cpln logs` shows nothing at all.
          - path: autoCreateDatabase.credentialsSecretName
            type: ref
            label: Credentials secret
            required: true
            description: A dictionary secret with the keys `rootPassword`, `user`, `password` and `db`.
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [rootPassword, user, password, db]
              create:
                suggestName: "context.releaseName + '-tidb-credentials'"
          - path: autoCreateDatabase.deployInitWorkload
            type: boolean
            label: Run the initialization job
            description: >-
              Turn it off after the first install has finished to remove the one-time job; the
              credentials stay available to the TiDB servers.
          - path: autoCreateDatabase.schedule
            type: string
            format: cron
            label: Initialization job schedule (UTC)
            required: true
            advanced: true
            when: self.autoCreateDatabase.deployInitWorkload
            description: How soon after install the database appears; later runs exit at once.
        rules:
          - rule: >-
              self.autoCreateDatabase.credentialsSecretName != null &&
              self.autoCreateDatabase.credentialsSecretName != ''
            mirrors: tidb.validate
            paths: [autoCreateDatabase.credentialsSecretName]
            message: The credentials secret is required.
          - rule: "!has(self.autoCreateDatabase.database)"
            mirrors: tidb.validate
            paths: [autoCreateDatabase.credentialsSecretName]
            message: >-
              autoCreateDatabase.database was removed in 2.0.0. Put rootPassword, user, password and db
              in the dictionary secret, and remove the block from the values.
          - rule: >-
              oldSelf == null ||
              self.autoCreateDatabase.credentialsSecretName == oldSelf.autoCreateDatabase.credentialsSecretName
            severity: info
            paths: [autoCreateDatabase.credentialsSecretName]
            message: >-
              The database and users are created once; pointing at another secret does not change the
              existing passwords.

  - id: resources
    title: Resources and storage
    description: Compute per replica of each tier, and the volumes of PD and TiKV.
    docs: "#images-and-resources"
    sections:
      - fields:
          - path: resources.pd
            type: resources
            label: PD resources
            required: true
            description: Per PD member.
          - path: resources.tikv
            type: resources
            label: TiKV resources
            required: true
            description: Per TiKV node. TiKV caches heavily, so memory matters most.
          - path: resources.server
            type: resources
            label: TiDB server resources
            required: true
            description: Per TiDB server; it scales with concurrent connections.
      - title: Storage
        docs: "#storage"
        fields:
          - path: volumeset.tikv.capacity
            type: integer
            label: TiKV initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per TiKV node.
            help: Uninstalling the release deletes the volume sets with the data.
          - path: volumeset.pd.capacity
            type: integer
            label: PD capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50]
            description: Per PD member. PD holds only cluster metadata.
      - id: tikv-autoscaling
        title: Grow TiKV storage automatically
        toggle: volumeset.tikv.autoscaling.enabled
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumeset.tikv.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 250, 500, 1000, 2000]
          - path: volumeset.tikv.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumeset.tikv.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.1, label: "1.1×" }
              - { value: 1.2, label: "1.2× (default)" }
              - { value: 1.5, label: "1.5×" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumeset.tikv.autoscaling.maxCapacity >= self.volumeset.tikv.capacity
            paths: [volumeset.tikv.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the TiKV initial capacity.
    rules:
      - rule: oldSelf == null || self.volumeset.tikv.capacity >= oldSelf.volumeset.tikv.capacity
        paths: [volumeset.tikv.capacity]
        message: A volume set cannot shrink. Keep the TiKV capacity at or above the installed size.
      - rule: oldSelf == null || self.volumeset.pd.capacity >= oldSelf.volumeset.pd.capacity
        paths: [volumeset.pd.capacity]
        message: A volume set cannot shrink. Keep the PD capacity at or above the installed size.

  - id: access
    title: Access and pooling
    description: Who can reach each tier, and an optional connection pooler.
    docs: "#access"
    sections:
      - title: TiDB servers
        description: >-
          The SQL endpoint. This release's own workloads are always allowed; firewall changes take 30
          seconds to a few minutes to take effect.
        fields:
          - path: internal_access.server.type
            type: enum
            label: Who can connect to the TiDB servers
            widget: cards
            required: true
            options:
              - { value: same-gvc, label: Same GVC, description: Any workload in this GVC. }
              - { value: same-org, label: Same org, description: Any workload in this org. }
              - { value: workload-list, label: Specific workloads, description: Only the workloads listed below. }
          - path: internal_access.server.workloads
            type: list
            label: Client workloads
            when: self.internal_access.server.type == 'workload-list'
            widget: tags
            description: List your clients only.
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
          - path: external_access.server_outboundAllowCIDR
            type: list
            label: TiDB server outbound CIDRs
            advanced: true
            description: Internet addresses the TiDB servers may reach. None by default.
            item: { type: string, format: cidr }
      - id: proxysql
        title: Connection pooler (ProxySQL)
        toggle: proxysql.enabled
        # The docs page gains this heading with the 2.1.0 docs update ("Connection Pooling (ProxySQL)").
        docs: "#connection-pooling-proxysql"
        description: >-
          A pooling tier in every location, at `RELEASE-proxysql` on port 4000. With two or more TiDB
          servers per location it keeps clients connected through a server failure. It uses the
          credentials secret and the TiDB servers' access settings, and clients must use the utf8mb4
          character set.
        fields:
          - path: proxysql.replicas
            type: integer
            label: Pooler replicas per location
            min: 1
            required: true
            suggestions: [1, 2, 3]
          - path: proxysql.image
            type: string
            format: image
            label: ProxySQL image
            required: true
            advanced: true
          - path: proxysql.resources
            type: resources
            label: ProxySQL resources
            required: true
            advanced: true
            description: Per pooler replica.
        rules:
          - rule: self.autoCreateDatabase.enabled
            mirrors: tidb.validate
            paths: [proxysql.enabled]
            message: >-
              ProxySQL authenticates clients with the credentials secret. Turn on "Create the database
              and user" in the Database step.
      - title: TiKV and PD
        description: The storage and placement tiers. Applications connect to the TiDB servers, not to these.
        fields:
          - path: internal_access.tikv.type
            type: enum
            label: Who can reach TiKV
            required: true
            options:
              - { value: same-gvc, label: Same GVC }
              - { value: same-org, label: Same org }
              - { value: workload-list, label: Specific workloads }
          - path: internal_access.tikv.workloads
            type: list
            label: TiKV client workloads
            when: self.internal_access.tikv.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
          - path: internal_access.pd.type
            type: enum
            label: Who can reach PD
            required: true
            options:
              - { value: same-gvc, label: Same GVC }
              - { value: same-org, label: Same org }
              - { value: workload-list, label: Specific workloads }
          - path: internal_access.pd.workloads
            type: list
            label: PD client workloads
            when: self.internal_access.pd.type == 'workload-list'
            widget: tags
            item:
              type: ref
              ref: { kind: workload, gvc: any, format: relativeLink, mustExist: warning }
          - path: external_access.tikv_outboundAllowCIDR
            type: list
            label: TiKV outbound CIDRs
            advanced: true
            description: Ignored while backups are on, because TiKV then uploads to the bucket and may reach any address.
            item: { type: string, format: cidr }
          - path: external_access.pd_outboundAllowCIDR
            type: list
            label: PD outbound CIDRs
            advanced: true
            item: { type: string, format: cidr }

  - id: backup
    title: Backups
    description: Scheduled full backups (br) to object storage.
    docs: "#backup"
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        fields:
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
          - path: backup.location
            type: enum
            label: Run the backup job in
            required: true
            optionsFrom: self.locations.filter(l, l.name != '').map(l, l.name)
            description: The one location the job runs in; put it near your bucket.
          - path: backup.activeDeadlineSeconds
            type: integer
            label: Time limit per backup
            unit: s
            min: 1
            required: true
            advanced: true
            suggestions: [3600, 14400, 43200]
          - path: backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            description: Its version must match the cluster's; update it together with the images.
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
        rules:
          - rule: self.backup.location != null && self.backup.location in self.locations.map(l, l.name)
            mirrors: tidb.validateBackupLocation
            paths: [backup.location]
            message: The backup location must be one of the configured locations, or the job never runs.
          - rule: self.backup.provider in ['aws', 'gcp']
            mirrors: tidb.validateBackupConfig
            paths: [backup.provider]
            message: Choose AWS S3 or Google Cloud Storage.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - type: note
            severity: warning
            text: >-
              No Google Cloud Storage backup has completed a verified run on this template. Use AWS S3
              for data you need to restore.
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the
              Storage Admin role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.

  - id: advanced
    title: Advanced
    description: The TiDB, TiKV and PD images.
    docs: "#images-and-resources"
    sections:
      - fields:
          - path: images.server
            type: string
            format: image
            label: TiDB server image
            required: true
          - path: images.tikv
            type: string
            format: image
            label: TiKV image
            required: true
          - path: images.pd
            type: string
            format: image
            label: PD image
            required: true
        rules:
          - rule: >-
              oldSelf == null || (self.images.server == oldSelf.images.server &&
              self.images.tikv == oldSelf.images.tikv && self.images.pd == oldSelf.images.pd)
            severity: info
            paths: [images.server]
            message: >-
              Changing an image restarts that tier. Keep the three images on one TiDB version, and the
              backup image on the same version when backups are on.

rules:
  - rule: context.mode != 'upgrade' || context.fromVersion == null || semverCompare(context.fromVersion, '2.0.0') >= 0
    message: >-
      Do not upgrade a 1.x release to 2.x: the upgrade deletes the GVC that the 1.x chart created,
      with all its data. Install this version as a new release, restore your data with br, then
      uninstall the old release.
  - rule: "!has(self.gvc)"
    mirrors: tidb.validateNoLegacyGvc
    message: >-
      The gvc key was removed in 2.0.0: the chart deploys into the GVC you install into, and
      gvc.locations and gvc.pdReplicas moved to locations and pdReplicas. Remove gvc from the values.
  - rule: "!has(self.devMode)"
    mirrors: tidb.validateNoDevMode
    message: devMode was removed in 2.0.0; a single location is allowed without it. Remove devMode from the values.
  - rule: "!has(self.exposeServer)"
    mirrors: tidb.validateNoExposeServer
    message: >-
      exposeServer was removed in 2.0.0; it never published the MySQL port. Reach the TiDB servers over
      internal GVC DNS or `cpln port-forward`, and remove exposeServer from the values.

migrations:
  # 2.1.0 split each location's `replicas` into tikvReplicas and serverReplicas, and the chart refuses
  # the old key. Carry the installed shape exactly, whatever the release set.
  - fromVersions: ">=2.0.0 <2.1.0"
    to: locations
    valueExpr: >-
      self.locations.map(l, {'name': l.name,
      'tikvReplicas': has(l.replicas) ? l.replicas : 3,
      'serverReplicas': has(l.replicas) ? l.replicas : 3})
    note: Each location's replicas became tikvReplicas and serverReplicas, both set to the installed count.
