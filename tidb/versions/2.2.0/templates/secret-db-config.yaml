{{- /*
  The credentials secret is NOT created here any more. It is a prerequisite the
  user creates, named by autoCreateDatabase.credentialsSecretName, holding
  rootPassword, user, password and db. What remains below is the init SCRIPT,
  which reads those values as environment variables at runtime.
*/}}
{{- if .Values.autoCreateDatabase.enabled }}
{{- if .Values.autoCreateDatabase.deployInitWorkload }}
---
kind: secret
name: {{ include "tidb.dbInit.name" . }}
description: {{ .Release.Name }} TiDB database initialization
tags: {{- include "tidb.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "Waiting for TiDB MySQL endpoint at ${TIDB_HOST}:${TIDB_PORT}..."

    # Each pass first checks whether the work is already done: from 2.2.0 the
    # bootstrapping TiDB server sets root's password itself, so on a fresh install
    # root is never passwordless and only this check can succeed.
    READY=false
    for i in {1..60}; do
      if mysql -h "${TIDB_HOST}" -P "${TIDB_PORT}" -u root -p"${ROOT_PW}" \
        -e "USE \`${APP_DB}\`" >/dev/null 2>&1; then
        echo "Database already initialized. Exiting."
        exit 0
      fi
      if mysql -h "${TIDB_HOST}" -P "${TIDB_PORT}" -u root -e "SELECT 1" >/dev/null 2>&1; then
        READY=true
        break
      fi

      echo "TiDB not ready yet, retrying in 5s..."
      sleep 5
    done

    if [[ "${READY}" != "true" ]]; then
      echo "ERROR: TiDB MySQL endpoint never became ready"
      exit 1
    fi

    echo "TiDB reachable with default root auth."

    # ---- Phase 1: bootstrap using passwordless root ----

    # Escaped exactly like the TiDB servers' init file: ' -> '' and \ -> \\ in
    # string literals, a backtick doubled in identifiers.
    sql_str() { local s=${1//\\/\\\\}; s=${s//"'"/"''"}; printf '%s' "$s"; }
    sql_id()  { printf '%s' "${1//\`/\`\`}"; }
    {
      printf "ALTER USER 'root'@'%%' IDENTIFIED BY '%s';\n" "$(sql_str "${ROOT_PW}")"
      printf 'CREATE DATABASE IF NOT EXISTS `%s`;\n' "$(sql_id "${APP_DB}")"
      printf "DROP USER IF EXISTS '%s'@'%%';\n" "$(sql_str "${APP_USER}")"
      printf "CREATE USER '%s'@'%%' IDENTIFIED BY '%s';\n" "$(sql_str "${APP_USER}")" "$(sql_str "${APP_PW}")"
      printf "GRANT ALL PRIVILEGES ON \`%s\`.* TO '%s'@'%%';\n" "$(sql_id "${APP_DB}")" "$(sql_str "${APP_USER}")"
    } | mysql -h "${TIDB_HOST}" -P "${TIDB_PORT}" -u root

    echo "Bootstrap complete. Root password set."

    # ---- Optional Phase 2: verify password auth ----

    mysql -h "${TIDB_HOST}" -P "${TIDB_PORT}" -u root -p"${ROOT_PW}" -e "SELECT 1" >/dev/null

    echo "Verified root password authentication."
    echo "TiDB database initialization complete."
{{- end }}
{{- end }}