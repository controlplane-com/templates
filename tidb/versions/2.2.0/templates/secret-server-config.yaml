---
kind: secret
name: {{ include "tidb.serverSecret.name" . }}
description: {{ .Release.Name }} TiDB server startup script
tags: {{- include "tidb.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    # PD_ENDPOINTS is rendered once for the whole chart (tidb.pdEndpointList) and
    # arrives space separated. Before 2.0.0 this script rebuilt the list itself
    # and assumed one PD per location, which is only true while pdReplicas equals
    # the location count.
    JOIN_PDS=$(echo ${PD_ENDPOINTS} | tr ' ' ',')

    echo "Waiting for TiKV stores to be ready via PD..."
    TIKV_READY=false
    for i in $(seq 1 60); do
      for pd_endpoint in ${PD_ENDPOINTS}; do
        stores=$(wget -qO- "http://${pd_endpoint}/pd/api/v1/stores" 2>/dev/null || echo "")
        if [ -n "$stores" ] && echo "$stores" | grep -q '"state_name": *"Up"'; then
          echo "TiKV ready."
          TIKV_READY=true
          break 2
        fi
      done
      echo "TiKV not ready yet (${i}/60), retrying in 10s..."
      sleep 10
    done

    if [ "${TIKV_READY}" != "true" ]; then
      echo "ERROR: TiKV stores never became ready. Exiting."
      exit 1
    fi

    mkdir -p /etc/tidb
    cat > /etc/tidb/tidb.toml <<EOF
    lease = "45s"

    [log]
    level = "info"

    [status]
    status-host = "0.0.0.0"
    status-port = 10080

    [pd-client]
    pd-server-timeout = 120
    EOF

    # Root gets its password from the server that BOOTSTRAPS the cluster, before it
    # serves anyone: TiDB runs --initialize-sql-file once, during the first
    # bootstrap, ahead of opening port 4000 (measured on v8.5.7). Without it root
    # stays passwordless until the db-init cron runs. Every server passes the flag
    # on every start; only the bootstrapping one executes it. db-init stays as the
    # backstop for clusters bootstrapped by 2.1.0, and for the one failure mode: a
    # file TiDB cannot parse is fatal and is not re-run on restart. Values are
    # escaped so no password or name can produce a parse error: ' -> '' and
    # \ -> \\ inside string literals, ` -> `` inside identifiers.
    INIT_ARGS=()
    if [[ -n "${ROOT_PW:-}" ]]; then
      # TiDB rejects these at EXECUTION time, which would be just as fatal as a parse
      # error -- so refuse them here, before anything bootstraps, with a clear reason.
      if (( ${#APP_USER} < 1 || ${#APP_USER} > 32 )); then
        echo "[tidb] FATAL: the credentials secret's 'user' must be 1-32 characters (got ${#APP_USER}); fix the secret, then force a redeployment" >&2; exit 1
      fi
      if (( ${#APP_DB} < 1 || ${#APP_DB} > 64 )) || [[ "${APP_DB}" == *" " ]]; then
        echo "[tidb] FATAL: the credentials secret's 'db' must be 1-64 characters and not end with a space; fix the secret, then force a redeployment" >&2; exit 1
      fi
      sql_str() { local s=${1//\\/\\\\}; s=${s//"'"/"''"}; printf '%s' "$s"; }
      sql_id()  { printf '%s' "${1//\`/\`\`}"; }
      ( umask 077
        {
          printf "ALTER USER 'root'@'%%' IDENTIFIED BY '%s';\n" "$(sql_str "${ROOT_PW}")"
          printf 'CREATE DATABASE IF NOT EXISTS `%s`;\n' "$(sql_id "${APP_DB}")"
          printf "CREATE USER IF NOT EXISTS '%s'@'%%' IDENTIFIED BY '%s';\n" "$(sql_str "${APP_USER}")" "$(sql_str "${APP_PW}")"
          printf "GRANT ALL PRIVILEGES ON \`%s\`.* TO '%s'@'%%';\n" "$(sql_id "${APP_DB}")" "$(sql_str "${APP_USER}")"
        } > /tmp/tidb-init.sql )
      INIT_ARGS=(--initialize-sql-file=/tmp/tidb-init.sql)
    fi

    # Readiness gate (see workload-server.yaml): the init file runs on the ONE
    # server that bootstraps, and the others can open :4000 a moment before its
    # ALTER USER reaches them — measured 2026-10-06 as ~2 s of passwordless root
    # on two of six servers. So a server is not ready, and the mesh routes it
    # nothing, until a raw handshake for root with an EMPTY password is refused.
    # A cluster whose root genuinely has no password (bootstrapped before 2.2.0
    # and never fixed by db-init) must not lose its SQL tier over it, so after
    # 120 s of an open root the gate passes, warns in the logs, and leaves the
    # repair to the db-init backstop, which needs the servers serving to run.
    # Probing stops for good once root has refused an empty password: every refused
    # probe is a failed root login, and a root with FAILED_LOGIN_ATTEMPTS would be
    # locked by a probe every 30 s (measured on v8.5.7). Root using another auth
    # plugin answers with an auth switch, which is completed with an empty password.
    # Each packet is read whole (a partial read misparses the greeting as the reply:
    # measured in test as false OPEN/OTHER and a root lockout). One run at a time,
    # so a server start costs exactly ONE refused root login (measured on v8.5.7).
    # Always written; readiness calls it only when autoCreateDatabase.enabled.
    cat > /tmp/root-guard.sh <<'GUARD'
    #!/usr/bin/env bash
    ok=/tmp/root-guard-ok
    since=/tmp/root-open-since
    # Once root has refused an empty password, stop probing: every refused probe is
    # a failed root login, which a root with FAILED_LOGIN_ATTEMPTS counts toward a lock.
    [ -f "$ok" ] && exit 0
    # The platform can run this twice at once (readiness and its derived startup
    # probe); only one run probes, the other reports the current state.
    exec 9>/tmp/root-guard.lock
    flock -n 9 || exit 1
    [ -f "$ok" ] && exit 0
    probe() {
      { exec 3<>/dev/tcp/127.0.0.1/4000; } 2>/dev/null || { echo CLOSED; return; }
      local h b len first
      # Read one whole packet and return its first payload byte in $first.
      rd() {
        h=$(timeout 1 dd bs=1 count=4 <&3 2>/dev/null | od -An -tu1)
        set -- $h
        [ $# -eq 4 ] || return 1
        len=$(( $1 + $2*256 + $3*65536 ))
        b=$(timeout 1 dd bs=1 count=$len <&3 2>/dev/null | od -An -tu1)
        set -- $b
        [ $# -eq "$len" ] || return 1
        first=$1
      }
      rd || { exec 3>&-; echo CLOSED; return; }
      # HandshakeResponse41 for user root with an empty auth response
      printf '\x3c\x00\x00\x01\x01\x82\x08\x00\x00\x00\x00\x01\x2d\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00root\x00\x00mysql_native_password\x00' >&3
      rd || { exec 3>&-; echo OTHER; return; }
      if [ "$first" = 254 ]; then
        # AuthSwitchRequest (root uses another auth plugin): answer with an empty password
        printf '\x00\x00\x00\x03' >&3
        rd || { exec 3>&-; echo OTHER; return; }
      fi
      exec 3>&-
      case "$first" in 255) echo DENIED;; 0) echo OPEN;; *) echo OTHER;; esac
    }
    case "$(probe)" in
      DENIED) rm -f "$since"; : > "$ok"; exit 0 ;;
      CLOSED) exit 1 ;;
    esac
    [ -f "$since" ] || date +%s > "$since"
    if (( $(date +%s) - $(cat "$since") >= 120 )); then
      if [ ! -f /tmp/root-guard-warned ]; then
        : > /tmp/root-guard-warned
        echo "[tidb] WARNING: root accepts an EMPTY password on this server; the db-init job sets it (autoCreateDatabase.deployInitWorkload), or set it yourself with ALTER USER" > /proc/1/fd/2 2>/dev/null || true
      fi
      exit 0
    fi
    exit 1
    GUARD
    chmod 0755 /tmp/root-guard.sh

    exec /tidb-server \
      --config /etc/tidb/tidb.toml \
      --path="${JOIN_PDS}" \
      --store="tikv" \
      "${INIT_ARGS[@]}"
