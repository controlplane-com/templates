---
kind: secret
name: {{ include "tidb.tikvSecret.name" . }}
description: {{ .Release.Name }} TiDB tikv startup script
tags: {{- include "tidb.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env bash
    set -euo pipefail

    # Basic environment setup. GVC comes from the runtime built-in, not from
    # Helm: it cannot then drift from the GVC the workload is running in.
    LOCATION=$(basename "${CPLN_LOCATION}")
    HOSTNAME=${HOSTNAME}
    GVC="${CPLN_GVC}"
    REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
    WORKLOAD_NAME="{{ include "tidb.tikv.name" . }}"
    SELF_FQDN="replica-${REPLICA_INDEX}.${WORKLOAD_NAME}.${LOCATION}.${GVC}.cpln.local"

    # --- Guard: never register a store from an undeclared location ---
    # defaultOptions.minScale/maxScale are 0, so the platform should never place
    # a replica here at all. This is the last line of defence if it does. A store
    # in an undeclared location registers with a region label PD's placement
    # rules were never told about, so it holds replicas outside the intended
    # spread while nothing in the chart ever refers to it.
    case " ${LOCATIONS//,/ } " in
      *" ${LOCATION} "*) : ;;
      *) echo "[tidb-tikv] FATAL: this store is running in location '${LOCATION}', which is not in the configured location list (${LOCATIONS})." >&2
         echo "[tidb-tikv] Refusing to register a store whose region label no placement rule knows about." >&2
         echo "[tidb-tikv] Remove this location from the GVC, or add it to 'locations' in your values." >&2
         exit 1 ;;
    esac

    # PD_ENDPOINTS is rendered once for the whole chart (tidb.pdEndpointList) and
    # arrives space separated, so TiKV, tidb-server and both readiness probes can
    # never disagree about which PD members exist.
    PD_TOML_ENDPOINTS=$(printf '"%s",' ${PD_ENDPOINTS} | sed 's/,$//')

    # Create TiKV config
    #
    # Store labels MUST live under [server], not in a top-level [labels] table —
    # TiKV silently ignores the latter (observed 2026-08-07: the parsed config
    # showed server.labels = {} and the store registered with labels=[]). The key
    # MUST be region, matching PD location-labels = ["region"]; it was zone, which
    # no location-label referenced, so region-aware placement could never work.
    #
    # This comment lives ABOVE the heredoc on purpose. The heredoc delimiter is
    # unquoted, so anything inside it is subject to shell expansion — a comment
    # placed within it is written into tikv.toml verbatim AND any backticks in it
    # are executed by bash at container start.
    echo "Generating /etc/tikv/tikv.toml for ${SELF_FQDN}"
    mkdir -p /etc/tikv
    cat > /etc/tikv/tikv.toml <<EOF
    [server]
    addr = "0.0.0.0:20160"
    advertise-addr = "${SELF_FQDN}:20160"
    status-addr = "0.0.0.0:20180"
    advertise-status-addr = "${SELF_FQDN}:20180"
    labels = { region = "${LOCATION}" }

    [log]
    level = "info"

    [storage]
    data-dir = "/data"
    reserve-space = "0GB"

    [pd]
    endpoints = [${PD_TOML_ENDPOINTS}]

    [raftstore]
    raftdb-path = "/data/raft"

    [rocksdb]
    wal-dir = "/data/wal"
    EOF

    # --- Wait for a STABLE PD cluster before starting ---
    # 2.0.0 started tikv-server immediately (only TiKV's own retry), and the
    # workload readiness probe passes on ANY one PD being healthy — so TiKV
    # registered against a still-forming PD cluster and hit `Connection reset by
    # peer` to all PD endpoints (reproduced). Gate here until EVERY PD member is
    # healthy WITH an elected leader. Uses curl (the readiness probe already does)
    # with a wget fallback, and grep — not jq, which the image may lack.
    if command -v curl >/dev/null 2>&1; then
      _http_get() { curl -sf --max-time 4 "$1" 2>/dev/null; }
    elif command -v wget >/dev/null 2>&1; then
      _http_get() { wget -qO- --timeout=4 "$1" 2>/dev/null; }
    else
      echo "[tidb-tikv] WARNING: neither curl nor wget present; cannot gate on PD — starting and relying on TiKV's own retry." >&2
      _http_get() { return 1; }
    fi

    PD_TOTAL=$(echo ${PD_ENDPOINTS} | wc -w | tr -d ' ')
    echo "[tidb-tikv] Waiting for a stable PD cluster: ${PD_TOTAL} member(s) healthy with a leader..."
    _waited=0
    _pd_stable=false
    while [ "${_waited}" -lt 600 ]; do
      for pd in ${PD_ENDPOINTS}; do
        _health=$(_http_get "http://${pd}/pd/api/v1/health" || echo "")
        [ -z "${_health}" ] && continue
        _healthy=$(printf '%s' "${_health}" | grep -oE '"health":[[:space:]]*true' | wc -l | tr -d ' ')
        if [ "${_healthy:-0}" -ge "${PD_TOTAL}" ] \
           && _http_get "http://${pd}/pd/api/v1/leader" | grep -q '"member_id"'; then
          echo "[tidb-tikv] PD cluster stable: ${_healthy}/${PD_TOTAL} members healthy with a leader."
          _pd_stable=true
          break
        fi
      done
      [ "${_pd_stable}" = "true" ] && break
      echo "[tidb-tikv]   PD not stable yet (need ${PD_TOTAL} healthy + leader, waited ${_waited}s)..."
      sleep 5
      _waited=$((_waited + 5))
    done
    if [ "${_pd_stable}" != "true" ]; then
      echo "[tidb-tikv] WARNING: PD cluster did not become stable within ${_waited}s; starting anyway and relying on TiKV's own retry." >&2
    fi

    # Retry Helper Function
    retry_start_tikv() {
      local attempt=1
      local max_attempts=3
      local delay=10
      while (( attempt <= max_attempts )); do
        echo "Attempt $attempt to start TiKV..."
        /tikv-server --config /etc/tikv/tikv.toml && return 0
        echo "TiKV startup attempt $attempt failed (non-zero or timed out). Retrying in ${delay}s..."
        sleep $delay
        ((attempt++))
      done
      echo "All TiKV restart attempts failed after ${max_attempts} tries. Exiting."
      exit 1
    }

    echo "Starting TiKV with retry logic..."
    retry_start_tikv
