{{ if and .Values.autoCreateDatabase.enabled .Values.autoCreateDatabase.deployInitWorkload }}
---
kind: workload
name: {{ include "tidb.dbInit.name" . }}
description: TiDB database initialization
tags: {{- include "tidb.tags" . | nindent 4 }}
spec:
  type: cron
  containers:
    - name: tidb-db-init
      image: mysql:8
      # The API backfills these three; declared so rendered == stored. Same values
      # it already ran at, not a knob -- a one-shot init job has no tuning story.
      cpu: "50m"
      memory: "128Mi"
      inheritEnv: false
      command: "/bin/bash"
      args:
        - /scripts/db-init.sh
      volumes:
        - path: /scripts/db-init.sh
          recoveryPolicy: retain   # API backfill, declared so rendered == stored
          uri: cpln://secret/{{ include "tidb.dbInit.name" . }}.payload
      env:
        - name: TIDB_HOST
          value: {{ include "tidb.server.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: TIDB_PORT
          value: "4000"
        - name: ROOT_PW
          value: cpln://secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}.rootPassword
        - name: APP_DB
          value: cpln://secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}.db
        - name: APP_USER
          value: cpln://secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}.user
        - name: APP_PW
          value: cpln://secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}.password
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "tidb.identity.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 0   # the job runs in exactly one location, named below
      metric: disabled
      minScale: 0
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: true   # a cron's schedule ignores 0/0 autoscaling: unsuspended only below
    timeoutSeconds: 10
  {{- /*
    One entry, for the first configured location. 1.x rendered an entry for
    EVERY location and set `suspend: true` on all but the first. 2.0.0-2.1.0
    relied on defaultOptions 0/0 instead, but a cron's schedule ignores
    autoscaling, so the job ran in every GVC location (measured 2026-10-06).
    defaultOptions now suspends it and this one entry unsuspends it, exactly like
    the backup cron. A cron has no inbound endpoints, so the localOptions[].suspend
    reachability trap does not apply.

    The entry carries every field defaultOptions carries: the API completes a
    partial localOptions entry from PLATFORM defaults, not from this workload's
    defaultOptions. 1.x sent only `location` and `suspend`, so the job actually
    ran with capacityAI on and a 5-second timeout.
  */}}
  localOptions:
    - autoscaling:
        maxConcurrency: 0
        maxScale: 1
        metric: disabled
        minScale: 1
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      location: //location/{{ (index .Values.locations 0).name }}
      suspend: false
      timeoutSeconds: 10
  firewallConfig:
    {{- /* the empty lists are API backfills, declared so rendered == stored */}}
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: same-gvc
      inboundAllowWorkload: []
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  job:
    # A cron models "run to completion"; the previous `standard` workload could
    # not. It completed, was restarted, completed again -- reporting
    # `ready: false` and `Deployment does not have minimum availability`
    # permanently while the cluster was perfectly healthy (measured: 7 restarts,
    # every one exitCode 0, reason Completed).
    #
    # Re-running is harmless: the script fast-exits when the database already
    # exists, before it reaches the non-idempotent CREATE USER. So every run
    # after the first is a no-op of a second or two. The schedule only controls
    # how soon after install the database appears.
    activeDeadlineSeconds: 600
    concurrencyPolicy: Forbid
    historyLimit: 5
    restartPolicy: Never
    schedule: {{ .Values.autoCreateDatabase.schedule | quote }}
  supportDynamicTags: false
{{ end }}
