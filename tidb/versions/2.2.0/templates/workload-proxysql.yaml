{{- if .Values.proxysql.enabled }}
---
kind: workload
name: {{ include "tidb.proxysql.name" . }}
description: ProxySQL connection pooler for TiDB
tags: {{- include "tidb.tags" . | nindent 4 }}
spec:
  type: standard
  containers:
    - name: proxysql
      cpu: {{ .Values.proxysql.resources.cpu | quote }}
      image: {{ .Values.proxysql.image }}
      command: "/bin/bash"
      args:
        - "-c"
        - {{- include "tidb.inlineScript" (include "tidb.script.proxysql" .) | nindent 10 }}
      inheritEnv: false
      env:
        - name: BACKEND_HOST
          value: {{ include "tidb.server.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local
        - name: APP_USER
          value: cpln://secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}.user
        - name: APP_PW
          value: cpln://secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}.password
        - name: ROOT_PW
          value: cpln://secret/{{ .Values.autoCreateDatabase.credentialsSecretName }}.rootPassword
      memory: {{ .Values.proxysql.resources.memory | quote }}
      ports:
        - number: 4000
          protocol: tcp
      readinessProbe:
        {{- /*
          ProxySQL's OWN health (its admin interface answers), not the backend's —
          the same reasoning as the tidb-server probe: keying every pooler replica
          off downstream state would pull the whole tier out of rotation in
          lockstep. A pooler whose backend is briefly unreachable returns errors
          and retries; it recovers the instant the backend does, with no restart.
        */}}
        exec:
          command:
            - /bin/bash
            - '-c'
            - >-
              mysql --skip-ssl --connect-timeout=3 -h 127.0.0.1 -P 6032 -u admin
              -p"$(cat /tmp/proxysql-admin)" -NBe 'SELECT 1' | grep -q '^1$'
        failureThreshold: 6
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 5
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "tidb.identity.name" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 0   # a GVC location this release did not ask for runs NOTHING
      metric: disabled
      minScale: 0   # localOptions below supplies the real count for each configured location
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 10
  {{- /*
    One pooler tier per configured location, same full-override shape as the
    server workload (a partial localOptions entry is completed from PLATFORM
    defaults, not from defaultOptions).
  */}}
  localOptions:
    {{- range $location := .Values.locations }}
    - autoscaling:
        maxConcurrency: 0
        maxScale: {{ $.Values.proxysql.replicas | int }}
        metric: disabled
        minScale: {{ $.Values.proxysql.replicas | int }}
        scaleToZeroDelay: 300
        target: 100
      capacityAI: false
      debug: false
      location: //location/{{ $location.name }}
      suspend: false
      timeoutSeconds: 10
    {{- end }}
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR: []
      outboundAllowHostname: []
      outboundAllowPort: []
      outboundBlockedCIDR: []
    internal:
      {{- /* Whoever may reach the SQL tier may reach its pooler. */}}
      {{- include "tidb.internalFirewall" (dict "root" . "access" .Values.internal_access.server) | nindent 6 }}
  loadBalancer:
    direct:
      enabled: false
      ports: []
    replicaDirect: false
  supportDynamicTags: false
{{- end }}
