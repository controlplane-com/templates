{{- if or .Values.proxy.enabled .Values.pgbouncer.enabled }}
kind: secret
name: {{ include "tsdb-ha.secretProxyStartup.name" . }}
description: HAProxy startup script for TimescaleDB Highly Available
tags:
  {{- include "tsdb-ha.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/usr/bin/env sh
    set -eu

    LOCATION="$(basename "${CPLN_LOCATION:-}")"
    if [ -z "${LOCATION}" ]; then
      echo "ERROR: CPLN_LOCATION is empty; cannot derive location"
      exit 1
    fi

    GVC="{{ .Values.global.cpln.gvc }}"
    WORKLOAD="{{ include "tsdb-ha.name" . }}"
    REPLICAS="{{ .Values.replicas }}"

    echo "Starting HAProxy Patroni leader proxy"
    echo "Derived location: ${LOCATION}"
    echo "Target workload: ${WORKLOAD}"
    echo "Replicas: ${REPLICAS}"

    CFG="/tmp/haproxy.cfg"

    SERVERS=""
    i=0
    while [ "${i}" -lt "${REPLICAS}" ]; do
      HOST="replica-${i}.${WORKLOAD}.${LOCATION}.${GVC}.cpln.local"
      SERVERS="${SERVERS}
      server pg${i} ${HOST}:5432 check port 8008"
      i=$((i + 1))
    done

    # ─── Startup: a short wait, not a hard gate ─────────────────────────────
    # Earlier versions waited here for EVERY member to answer, because HAProxy
    # resolves server names once and an unregistered mesh name was seen to get
    # a placeholder address. On an upgrade (the members roll too) that kept the
    # new proxy from listening for minutes after the old one was retired. The
    # replica names are per-replica mesh addresses that exist from the moment
    # the workload does (measured 2026-10-26), and HAProxy re-resolves them at
    # runtime anyway (`resolvers mesh`, as in pgedge), so this waits at most
    # 60s for ANY member's Patroni API and then starts regardless. The
    # readiness probe (/healthz: a leader is routable) keeps traffic off a
    # proxy that cannot reach the primary yet.
    # The haproxy image ships no curl/wget, so probe with perl. ANY HTTP status
    # (200 and 503 alike) proves the address is a real Patroni.
    probe_patroni() {
      perl -e '
        use IO::Socket::INET;
        my ($host) = @ARGV;
        my $s = IO::Socket::INET->new(
          PeerAddr => $host, PeerPort => 8008, Proto => "tcp", Timeout => 3,
        ) or exit 1;
        $s->send("GET /health HTTP/1.0\r\nHost: $host\r\n\r\n") or exit 1;
        my $line;
        eval {
          local $SIG{ALRM} = sub { die "read timeout\n" };
          alarm 3;
          $line = <$s>;
          alarm 0;
        };
        exit((defined $line && $line =~ m|^HTTP/|) ? 0 : 1);
      ' "$1" 2>/dev/null
    }

    any_patroni_answers() {
      i=0
      while [ "${i}" -lt "${REPLICAS}" ]; do
        SRV_HOST="replica-${i}.${WORKLOAD}.${LOCATION}.${GVC}.cpln.local"
        if probe_patroni "${SRV_HOST}"; then
          echo "tsdb-ha proxy: ${SRV_HOST} answered HTTP on :8008"
          return 0
        fi
        i=$((i + 1))
      done
      return 1
    }

    WAIT_LIMIT=60
    WAIT_START="$(date +%s)"
    until any_patroni_answers; do
      if [ $(( $(date +%s) - WAIT_START )) -ge "${WAIT_LIMIT}" ]; then
        echo "tsdb-ha proxy: no Patroni member answered after ${WAIT_LIMIT}s — starting anyway; runtime DNS and health checks route to the leader once it is up"
        break
      fi
      sleep 3
    done
    # ─── End startup ─────────────────────────────────────────────────────────

    # resolvers mesh: a changed address is adopted once the old record's hold
    # obsolete period ends (short); the failure holds are long so a DNS blip
    # keeps the last good address instead of putting servers into maintenance.
    cat > "${CFG}" <<EOF
    global
      log stdout format raw local0
      maxconn 4096
      stats socket /tmp/haproxy.sock mode 660 level admin

    defaults
      mode tcp
      log global
      option tcplog
      timeout connect 5s
      timeout client  2m
      timeout server  2m
      timeout check   5s

    resolvers mesh
      parse-resolv-conf
      resolve_retries 3
      timeout resolve 1s
      timeout retry   1s
      hold valid    10s
      hold obsolete 30s
      hold other    5m
      hold refused  5m
      hold nx       5m
      hold timeout  5m

    frontend postgres_primary
      bind *:5432
      default_backend patroni_primary

    frontend stats_page
      bind *:8405
      mode http
      stats enable
      stats uri /stats
      stats refresh 10s

    frontend health_status
      bind *:8404
      mode http
      monitor-uri /healthz
      acl no_healthy_backends nbsrv(patroni_primary) lt 1
      monitor fail if no_healthy_backends

    backend patroni_primary
      mode tcp
      option httpchk
      http-check connect port 8008
      http-check send meth GET uri /primary ver HTTP/1.0
      http-check expect status 200
      default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions resolvers mesh resolve-prefer ipv4 init-addr last,libc,none

    ${SERVERS}
    EOF

    echo "Rendered HAProxy config:"
    cat "${CFG}"

    # validate config before start (optional but nice)
    haproxy -c -f "${CFG}"

    exec haproxy -W -db -f "${CFG}"
{{- end }}
