# yaml-language-server: $schema=../.schema/catalog.v1.schema.json
apiVersion: catalog.controlplane.com/v1
kind: TemplateCatalogEntry

title: TimescaleDB
category: database
topology: single

summary: >-
  A single PostgreSQL server with the TimescaleDB extension preloaded and created, giving
  hypertables, columnar compression, continuous aggregates and retention policies, on a
  persistent, snapshotted volume tuned to the container size at first boot. Options: a
  PgBouncer pooler, a public TCP endpoint, and scheduled backups to S3, GCS or an S3-compatible
  endpoint. Pick it for metrics, IoT or event data queried with SQL in one location.

keywords:
  - time-series database
  - tsdb
  - timescale
  - hypertables
  - continuous aggregates
  - columnar compression
  - retention policies
  - downsampling
  - iot data
  - sensor data
  - metrics storage
  - event data
  - postgresql
  - pg
  - sql
  - pgbouncer
  - database backups

useCases:
  - Store IoT and sensor readings and query them with SQL
  - Application metrics or events with automatic compression and retention
  - Financial tick or pricing data with time-bucketed aggregates
  - Dashboards backed by continuously refreshed aggregates

alternativeTo:
  - Timescale Cloud
  - InfluxDB
  - InfluxDB Cloud
  - Amazon Timestream
  - QuestDB

compatibleWith: [postgres-wire]

pickInsteadIf:
  - need: time-series data with automatic failover
    template: timescaledb-highly-available
  - need: Prometheus metrics storage queried with PromQL
    template: prometheus
  - need: analytical queries over billions of rows in a columnar database
    template: clickhouse

related:
  - template: grafana
    relation: companion
    note: Dashboards and alerts over the time-series data

prerequisites:
  - kind: secret
    secretType: dictionary
    keys: [username, password, database]
    valuesPath: config.credentialsSecretName
    required: true
    description: Database credentials. Create it before installing; when it is missing the workload waits with no logs.
  - kind: bucket
    valuesPath: [backup.aws.bucket, backup.gcp.bucket, backup.minio.bucket]
    required: false
    when: backup.enabled
    description: Object storage bucket that receives the scheduled backups.
  - kind: cloud-account
    valuesPath: [backup.aws.cloudAccountName, backup.gcp.cloudAccountName]
    required: false
    when: backup.enabled with backup.provider aws or gcp
    description: Control Plane cloud account for the backup bucket's AWS account or GCP project; on GCP grant its service account the Storage Admin role.
  - kind: other
    valuesPath: backup.aws.policyName
    required: false
    when: backup.enabled with backup.provider aws
    description: AWS IAM policy scoped to the backup bucket (object read, write, delete and list actions); the README has the JSON.
  - kind: secret
    secretType: dictionary
    keys: [accessKey, secretKey]
    valuesPath: backup.minio.credentialsSecretName
    required: false
    when: backup.enabled with backup.provider minio
    description: Access keys for the MinIO or S3-compatible backup endpoint.
