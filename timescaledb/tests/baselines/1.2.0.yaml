# timescaledb 1.2.0 — the recommended install: credentials in a prerequisite secret.
# Prod shape for this template (one instance on a volumeset, one location) at its default size.
locations: [aws-us-east-1]
timeoutSeconds: 600

generated:
  pgpw: hex

secrets:
  creds:
    type: dictionary
    entries:
      username: e2e
      password: "{gen.pgpw}"
      database: e2e

vars:
  pg_workload: "{release}-timescaledb"
  pg_user: e2e
  pg_password: "{gen.pgpw}"
  pg_db: e2e

values:
  config:
    credentialsSecretName: "{secrets.creds.name}"

# No customer runs timescaledb yet; 1.1.1 is the previous version, upgraded with its own values the way a
# `helm upgrade -f my-values.yaml` would.
upgradeFrom:
  - version: 1.1.1
