---
kind: secret
name: {{ include "tooljet.db.secret.name" . }}
description: ToolJet database credentials (for PG_* / TOOLJET_DB_* / PGRST_DB_URI assembly)
tags: {{- include "tooljet.tags" . | nindent 4 }}
type: dictionary
data:
  postgresUsername: {{ .Values.postgres.credentials.username | quote }}
  postgresPassword: {{ .Values.postgres.credentials.password | quote }}
