---
kind: secret
name: {{ include "tooljet.secret.startup.name" . }}
description: ToolJet startup script — waits for a live Postgres, then execs the image entrypoint
tags: {{- include "tooljet.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -euo pipefail
    DB_HOST="{{ include "tooljet.postgres.host" . }}"
    DB_PORT=5432
    # The image entrypoint waits for Postgres with wait-for-it.sh, which is a NO-OP
    # on this platform: the mesh sidecar completes the bare TCP handshake even when
    # nothing is listening, so migrations then race a not-yet-ready Postgres and the
    # container exits non-zero on first boot. Speak real Postgres bytes instead — an
    # SSLRequest — and require the one-byte S/N reply only a live backend produces,
    # before handing off to the image entrypoint (which still boots PostgREST, creates
    # the databases and runs migrations, then execs the args we pass).
    pg_ready() {
      local reply=""
      exec 3<>"/dev/tcp/${DB_HOST}/${DB_PORT}" || return 1
      printf '\x00\x00\x00\x08\x04\xd2\x16\x2f' >&3 || { exec 3>&- 3<&- || true; return 1; }
      IFS= read -r -t 5 -n 1 reply <&3 || true
      exec 3>&- 3<&- || true
      [ "$reply" = "S" ] || [ "$reply" = "N" ]
    }
    echo "tooljet: waiting for Postgres at ${DB_HOST}:${DB_PORT}..."
    for i in $(seq 1 50); do
      if pg_ready 2>/dev/null; then echo "tooljet: Postgres is ready."; break; fi
      echo "tooljet: waiting for Postgres... (attempt ${i}/50)"; sleep 5
      [ "$i" -eq 50 ] && { echo "tooljet: Postgres not ready after 250s; exiting for restart" >&2; exit 1; }
    done
    exec /app/server/entrypoint.sh npm run start:prod
