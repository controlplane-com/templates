{{- range $i, $c := .Values.catalogs }}
{{- if $i }}
---
{{- end }}
kind: secret
name: {{ include "trino.secret.catalog.name" (dict "root" $ "catalog" $c.name) }}
description: Trino catalog properties for {{ $c.name }}
type: opaque
tags: {{- include "trino.tags" $ | nindent 4 }}
data:
  encoding: plain
  payload: |-
    {{- $c.properties | trim | nindent 4 }}
{{- end }}
