kind: secret
name: {{ include "trino.secret.coordinatorConfig.name" . }}
description: Trino coordinator config.properties
type: opaque
tags: {{- include "trino.tags" . | nindent 4 }}
data:
  encoding: plain
  payload: |-
    {{- include "trino.config.coordinator" . | nindent 4 }}
{{- if gt (int .Values.workers.replicas) 0 }}
---
kind: secret
name: {{ include "trino.secret.workerConfig.name" . }}
description: Trino worker config.properties
type: opaque
tags: {{- include "trino.tags" . | nindent 4 }}
data:
  encoding: plain
  payload: |-
    {{- include "trino.config.worker" . | nindent 4 }}
{{- end }}
---
kind: secret
name: {{ include "trino.secret.jvm.name" . }}
description: Trino jvm.config (shared by both tiers)
type: opaque
tags: {{- include "trino.tags" . | nindent 4 }}
data:
  encoding: plain
  payload: |-
    {{- include "trino.config.jvm" . | nindent 4 }}
---
kind: secret
name: {{ include "trino.secret.node.name" . }}
description: Trino node.properties (shared by both tiers)
type: opaque
tags: {{- include "trino.tags" . | nindent 4 }}
data:
  encoding: plain
  payload: |-
    {{- include "trino.config.node" . | nindent 4 }}
{{- if .Values.auth.enabled }}
---
kind: secret
name: {{ include "trino.secret.passwordAuthenticator.name" . }}
description: Trino password-authenticator.properties (file authenticator)
type: opaque
tags: {{- include "trino.tags" . | nindent 4 }}
data:
  encoding: plain
  payload: |-
    {{- include "trino.config.passwordAuthenticator" . | nindent 4 }}
{{- end }}
