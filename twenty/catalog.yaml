# yaml-language-server: $schema=../.schema/catalog.v1.schema.json
apiVersion: catalog.controlplane.com/v1
kind: TemplateCatalogEntry

title: Twenty
category: apps
topology: single

summary: >-
  Twenty CRM with customizable objects, pipelines, views and workflows and REST and GraphQL
  APIs: a server workload, a background worker and a bundled Redis job queue, backed by a
  single-instance PostgreSQL or a highly available Patroni cluster. Attachments live on a shared
  local volume or in AWS S3 or an S3-compatible bucket, which is required for more server
  replicas; scheduled database backups are optional. Pick it for a self-hosted, customizable
  CRM for sales pipelines and customer records.

keywords:
  - crm
  - customer relationship management
  - sales crm
  - sales pipeline
  - deal tracking
  - contact management
  - lead management
  - custom objects
  - graphql api
  - rest api

useCases:
  - Track contacts, companies and deals through a customizable sales pipeline
  - Model custom business objects, fields and views in a CRM
  - Sync CRM records with other systems through REST and GraphQL APIs
  - Replace a per-seat hosted CRM with one whose data stays in your own PostgreSQL

alternativeTo:
  - Salesforce
  - HubSpot CRM
  - Pipedrive
  - Attio
  - Zoho CRM

pickInsteadIf:
  - need: a live-chat widget and shared inbox for customer support conversations
    template: chatwoot
  - need: newsletters and email campaigns to subscriber lists
    template: listmonk
  - need: a spreadsheet-style database for arbitrary team data
    template: nocodb
  - need: building custom internal tools and admin panels
    template: tooljet

related:
  - template: n8n
    relation: companion
    note: Automates CRM workflows through Twenty's API and webhooks
  - template: minio
    relation: companion
    note: S3-compatible bucket for attachments, needed to run more than one server replica

prerequisites:
  - kind: secret
    secretType: opaque
    valuesPath: secrets.name
    required: true
    description: Opaque app key used as APP_SECRET and ENCRYPTION_KEY (write-once). When it is missing the deployment waits with no logs.
  - kind: secret
    secretType: opaque
    valuesPath: secrets.fallbackName
    required: false
    when: rotating the app key (secrets.fallbackName set)
    description: The previous app key, so stored OAuth tokens and TOTP secrets stay readable during a rotation.
  - kind: bucket
    valuesPath: storage.s3.bucket
    required: false
    when: storage.type s3
    description: AWS S3 or S3-compatible bucket for attachments. Required for twenty.replicas above 1.
  - kind: cloud-account
    valuesPath: storage.s3.cloudAccountName
    required: false
    when: storage.type s3 on AWS (storage.s3.endpoint empty)
    description: Control Plane AWS cloud account for keyless S3 access, plus a bucket-scoped IAM policy named in storage.s3.policyName.
  - kind: secret
    secretType: dictionary
    keys: [STORAGE_S3_ACCESS_KEY_ID, STORAGE_S3_SECRET_ACCESS_KEY]
    valuesPath: storage.s3.auth.secretName
    required: false
    when: storage.type s3 with storage.s3.endpoint set (MinIO or S3-compatible)
    description: Static access keys for the S3-compatible attachment bucket. AWS S3 itself accepts only the keyless cloud account.
  - kind: bucket
    valuesPath:
      - postgres.backup.aws.bucket
      - postgres.backup.gcp.bucket
      - postgres.backup.minio.bucket
      - postgresHA.backup.aws.bucket
      - postgresHA.backup.gcp.bucket
      - postgresHA.backup.minio.bucket
    required: false
    when: postgres.backup.enabled or postgresHA.backup.enabled
    description: Object storage bucket that receives the scheduled database backups.
  - kind: cloud-account
    valuesPath:
      - postgres.backup.aws.cloudAccountName
      - postgres.backup.gcp.cloudAccountName
      - postgresHA.backup.aws.cloudAccountName
      - postgresHA.backup.gcp.cloudAccountName
    required: false
    when: database backups enabled with provider aws or gcp
    description: Control Plane cloud account for the backup bucket, plus a bucket-scoped IAM policy on AWS or Storage Object Admin on GCS.
  - kind: secret
    secretType: dictionary
    keys: [accessKey, secretKey]
    valuesPath: [postgres.backup.minio.credentialsSecretName, postgresHA.backup.minio.credentialsSecretName]
    required: false
    when: database backups enabled with provider minio
    description: Access keys for the MinIO or S3-compatible backup endpoint.
