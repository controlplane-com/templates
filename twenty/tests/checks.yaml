# Feature checks for the twenty template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars (pg_user,
# pg_password, pg_db).
#
# Every check runs from the HA database's patroni-postgres container, which has curl, psql and python3.
# Twenty is called at its internal address; the database is read through the HAProxy endpoint, the
# address Twenty itself uses, so those checks only pass when the proxy routes to the current leader.
# (Inside scripts, write $VAR rather than the braced form: the runner fills {name} placeholders.)
checks:
  - id: cluster-healthy
    description: Patroni reports exactly one leader and every other member streaming from it.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        leaders = [x["name"] for x in m if x["role"] == "leader"]
        streaming = [x["name"] for x in m if x["role"] in ("replica", "sync_standby")
                     and (x["state"] == "streaming" or (x["state"] == "running" and isinstance(x.get("lag"), int)))]
        print(f"MEMBERS {len(m)} LEADERS {len(leaders)} STREAMING {len(streaming)}")
        '
    expect:
      stdout: "^MEMBERS 3 LEADERS 1 STREAMING 2$"
    retries: 20
    retryDelaySeconds: 15

  - id: twenty-healthy
    description: The Twenty server answers its health endpoint on its internal address.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 10 http://{release}-twenty.{gvc}.cpln.local:3000/healthz
    expect:
      stdout: '"status":\s*"ok"'
    retries: 10
    retryDelaySeconds: 15

  - id: migrations-ran
    description: >-
      Twenty's boot migrations created its core schema (workspaces and users) in the HA database, read
      through the HAProxy endpoint.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA -c "
          select 'CORE ' || count(*) filter (where table_name in ('workspace', 'user'))
          from information_schema.tables where table_schema = 'core'" 2>&1
    expect:
      stdout: "^CORE 2$"
    retries: 6
    retryDelaySeconds: 15

  - id: api-requires-auth
    description: >-
      The REST API is served and refuses a call without a token, rather than the gateway answering for a
      server that is not there.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 15 -o /dev/null -D - http://{release}-twenty.{gvc}.cpln.local:3000/rest/companies |
          awk 'NR==1 {print "REST " $2}'
    expect:
      stdout: "^REST 40[13]$"
    retries: 4
    retryDelaySeconds: 15

  - id: data-survives-upgrade
    description: >-
      A row written to the database on the version this scenario installed first is still there. On a
      fresh install that is the same version; after an upgrade it proves the HA database's data carried
      over the member restarts.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        P={release}-postgres-ha-proxy.{gvc}.cpln.local
        psql -h "$P" -U {pg_user} -d {pg_db} -v ON_ERROR_STOP=1 -qtA \
          -c "create table if not exists public.e2e_marker (version text primary key)" \
          -c "insert into public.e2e_marker values ('{version}') on conflict do nothing" >/dev/null 2>&1
        n=$(psql -h "$P" -U {pg_user} -d {pg_db} -qtA \
          -c "select count(*) from public.e2e_marker where version = '{installed_version}'" 2>&1)
        [ "$n" = 1 ] && echo PERSISTED || echo "MISSING (rows for {installed_version}: $n)"
    expect:
      stdout: "^PERSISTED$"
    retries: 4
    retryDelaySeconds: 15

  - id: pgvector-0-8-7-available
    description: The HA leader runs patroni-postgres 0.8, with pgvector 0.8.7 (CVE-2026-103484), from 1.4.1.
    issue: "#5376"
    since: 1.4.1
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select 'AVAIL ' || default_version from pg_available_extensions where name = 'vector'" 2>&1
    expect:
      stdout: "^AVAIL 0\\.8\\.7$"
    # After the upgrade the members restart one at a time; this runs long enough to reach the new leader.
    retries: 8
    retryDelaySeconds: 15
