# Feature checks for the twenty template. Each runs after install (and after each upgrade) on every
# version in its since/until range. Add a check with `since: <new version>` for every change you ship.
# Placeholders: {release} {gvc} {org} {version} {installed_version}, and the baseline vars (pg_user,
# pg_password, pg_db).
#
# The HA checks (the baseline and the upgrade) run from the HA database's patroni-postgres container, which
# has curl, psql and python3. Twenty is called at its internal address; the database is read through the
# HAProxy endpoint, the address Twenty itself uses, so those checks only pass when the proxy routes to the
# current leader. The [single] variant has no HA database: its checks run in the postgres container (psql)
# and in Twenty's own container, which calls the API on 127.0.0.1 with node.
# (Inside scripts, write $VAR rather than the braced form: the runner fills {name} placeholders.)
checks:
  - id: cluster-healthy
    scenarios: "^(?!.*\\[single\\])"
    description: Patroni reports exactly one leader and every other member streaming from it.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        leaders = [x["name"] for x in m if x["role"] == "leader"]
        streaming = [x["name"] for x in m if x["role"] in ("replica", "sync_standby")
                     and (x["state"] == "streaming" or (x["state"] == "running" and isinstance(x.get("lag"), int)))]
        print(f"MEMBERS {len(m)} LEADERS {len(leaders)} STREAMING {len(streaming)}")
        '
    expect:
      stdout: "^MEMBERS 3 LEADERS 1 STREAMING 2$"
    retries: 20
    retryDelaySeconds: 15

  - id: twenty-healthy
    scenarios: "^(?!.*\\[single\\])"
    description: The Twenty server answers its health endpoint on its internal address.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 10 http://{release}-twenty.{gvc}.cpln.local:3000/healthz
    expect:
      stdout: '"status":\s*"ok"'
    retries: 10
    retryDelaySeconds: 15

  - id: migrations-ran
    scenarios: "^(?!.*\\[single\\])"
    description: >-
      Twenty's boot migrations created its core schema (workspaces and users) in the HA database, read
      through the HAProxy endpoint.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA -c "
          select 'CORE ' || count(*) filter (where table_name in ('workspace', 'user'))
          from information_schema.tables where table_schema = 'core'" 2>&1
    expect:
      stdout: "^CORE 2$"
    retries: 6
    retryDelaySeconds: 15

  - id: api-requires-auth
    scenarios: "^(?!.*\\[single\\])"
    description: >-
      The REST API is served and refuses a call without a token, rather than the gateway answering for a
      server that is not there.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        curl -s -m 15 -o /dev/null -D - http://{release}-twenty.{gvc}.cpln.local:3000/rest/companies |
          awk 'NR==1 {print "REST " $2}'
    expect:
      stdout: "^REST 40[13]$"
    retries: 4
    retryDelaySeconds: 15

  - id: data-survives-upgrade
    scenarios: "^(?!.*\\[single\\])"
    description: >-
      A row written to the database on the version this scenario installed first is still there. On a
      fresh install that is the same version; after an upgrade it proves the HA database's data carried
      over the member restarts.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        P={release}-postgres-ha-proxy.{gvc}.cpln.local
        psql -h "$P" -U {pg_user} -d {pg_db} -v ON_ERROR_STOP=1 -qtA \
          -c "create table if not exists public.e2e_marker (version text primary key)" \
          -c "insert into public.e2e_marker values ('{version}') on conflict do nothing" >/dev/null 2>&1
        n=$(psql -h "$P" -U {pg_user} -d {pg_db} -qtA \
          -c "select count(*) from public.e2e_marker where version = '{installed_version}'" 2>&1)
        [ "$n" = 1 ] && echo PERSISTED || echo "MISSING (rows for {installed_version}: $n)"
    expect:
      stdout: "^PERSISTED$"
    retries: 4
    retryDelaySeconds: 15

  - id: crm-record-survives-upgrade
    scenarios: "^(?!.*\\[single\\])"
    description: >-
      Through Twenty's own API: the first user signs up and creates the workspace (on the first run), signs in
      with the real password while a wrong one is refused, writes a Company named after the running version,
      and reads back the Company the scenario's first version wrote. After an upgrade that proves CRM data
      written by the old version survives the HA database's member restarts and the app's own migrations.
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        python3 - <<'PY'
        import json, urllib.request, urllib.error
        B = "http://{release}-twenty.{gvc}.cpln.local:3000"
        EMAIL, PW = "e2e-admin@example.com", "E2e-" + "{pg_password}"[:20]

        def gql(path, query, variables, token=None):
            req = urllib.request.Request(B + path, json.dumps(dict(query=query, variables=variables)).encode(),
                                         dict([("content-type", "application/json")] +
                                              ([("authorization", "Bearer " + token)] if token else [])))
            try:
                with urllib.request.urlopen(req, timeout=60) as r:
                    return json.load(r)
            except urllib.error.HTTPError as e:
                return json.loads(e.read() or b"null") or dict(errors=[dict(message="HTTP %d" % e.code)])

        def data(resp, key):
            if resp.get("errors"):
                raise SystemExit("API ERROR %s: %s" % (key, resp["errors"][0].get("message")))
            return resp["data"][key]

        def login(password):
            return gql("/metadata", "mutation($e: String!, $p: String!, $o: String!) "
                       "{ getLoginTokenFromCredentials(email: $e, password: $p, origin: $o) { loginToken { token } } }",
                       dict(e=EMAIL, p=password, o=B))

        def access(login_token):
            r = gql("/metadata", "mutation($t: String!, $o: String!) { getAuthTokensFromLoginToken(loginToken: $t, "
                    "origin: $o) { tokens { accessOrWorkspaceAgnosticToken { token } } } }", dict(t=login_token, o=B))
            return data(r, "getAuthTokensFromLoginToken")["tokens"]["accessOrWorkspaceAgnosticToken"]["token"]

        exists = data(gql("/metadata", "query($e: String!) { checkUserExists(email: $e) { exists } }",
                          dict(e=EMAIL)), "checkUserExists")["exists"]
        if not exists:  # first run on this install: the real first-run flow, as the UI drives it
            t0 = data(gql("/metadata", "mutation($e: String!, $p: String!) { signUp(email: $e, password: $p) "
                          "{ tokens { accessOrWorkspaceAgnosticToken { token } } } }", dict(e=EMAIL, p=PW)),
                      "signUp")["tokens"]["accessOrWorkspaceAgnosticToken"]["token"]
            lt = data(gql("/metadata", "mutation($i: SignUpInNewWorkspaceInput) { signUpInNewWorkspace(input: $i) "
                          "{ loginToken { token } } }", dict(i=dict(displayName="E2E")), t0),
                      "signUpInNewWorkspace")["loginToken"]["token"]
            data(gql("/metadata", "mutation($i: ActivateWorkspaceInput!) { activateWorkspace(data: $i) { id } }",
                     dict(i=dict()), access(lt)), "activateWorkspace")

        wrong = login(PW + "-wrong")
        refused = bool(wrong.get("errors")) and not (wrong.get("data") or dict()).get("getLoginTokenFromCredentials")
        tok = access(data(login(PW), "getLoginTokenFromCredentials")["loginToken"]["token"])

        def companies(name):
            r = gql("/graphql", "query($n: String!) { companies(filter: { name: { eq: $n } }) { totalCount } }",
                    dict(n=name), tok)
            return data(r, "companies")["totalCount"]

        if companies("e2e-{version}") == 0:
            data(gql("/graphql", "mutation($n: String!) { createCompany(data: { name: $n }) { id } }",
                     dict(n="e2e-{version}"), tok), "createCompany")
        n = companies("e2e-{installed_version}")
        none = companies("e2e-never-written")
        print("COMPANY e2e-{installed_version} %d | CONTROL %d | WRONG-PASSWORD %s"
              % (n, none, "REFUSED" if refused else "ACCEPTED"))
        PY
    expect:
      stdout: "^COMPANY e2e-\\S+ 1 \\| CONTROL 0 \\| WRONG-PASSWORD REFUSED$"
    retries: 6
    retryDelaySeconds: 20
    timeoutSeconds: 180

  - id: pgvector-0-8-7-available
    scenarios: "^(?!.*\\[single\\])"
    description: The HA leader runs patroni-postgres 0.8, with pgvector 0.8.7 (CVE-2026-103484), from 1.4.1.
    issue: "#5376"
    since: 1.4.1
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}'
        psql -h {release}-postgres-ha-proxy.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
          -c "select 'AVAIL ' || default_version from pg_available_extensions where name = 'vector'" 2>&1
    expect:
      stdout: "^AVAIL 0\\.8\\.7$"
    # After the upgrade the members restart one at a time; this runs long enough to reach the new leader.
    # helm --wait returns while the Patroni members are still restarting, and the old leader restarts
    # last (~4 min in); 20 x 30 s covers the rollout.
    retries: 20
    retryDelaySeconds: 30

  - id: every-patroni-member-on-0-8
    scenarios: "^(?!.*\\[single\\])"
    description: >-
      Every Patroni member restarted onto patroni-postgres 0.8 (pgvector 0.8.7) and is back in the cluster,
      not only the leader. The pgvector-0-8-7-available check passes as soon as the leader has moved to a
      restarted member, and the runner's readiness wait returns while the old leader is still restarting, so
      without this a member that never comes back (seen once in testing: the old leader stuck initializing for
      17 min) goes unseen.
    issue: "#5376"
    since: 1.4.1
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        export PGPASSWORD='{pg_password}' PGCONNECT_TIMEOUT=5
        LOC=$(basename "$CPLN_LOCATION")
        line="MEMBERS"
        for i in 0 1 2; do
          v=$(psql -h replica-$i.{release}-postgres-ha.$LOC.{gvc}.cpln.local -U {pg_user} -d {pg_db} -qtA \
            -c "select default_version from pg_available_extensions where name = 'vector'" 2>/dev/null)
          line="$line $i=$v"
        done
        echo "$line HEALTHY $(curl -s -m 10 http://localhost:8008/cluster | python3 -c '
        import json, sys
        m = json.load(sys.stdin)["members"]
        print("%d/%d" % (len([x for x in m if x["state"] in ("running", "streaming")]), len(m)))' 2>&1)"
    expect:
      stdout: "^MEMBERS 0=0\\.8\\.7 1=0\\.8\\.7 2=0\\.8\\.7 HEALTHY 3/3$"
    # The old leader restarts last, a few minutes after the runner's readiness wait returns.
    retries: 24
    retryDelaySeconds: 30

  - id: ha-postgres-major
    description: >-
      The HA database (postgres-highly-available 3.0.0 from 2.0.0) runs PostgreSQL 18 on a cluster this version
      created, and a cluster created by 1.x keeps PostgreSQL 17 after the upgrade, on every member.
    since: 2.0.0
    scenarios: "^(?!.*\\[single\\])"
    exec:
      workload: "{release}-postgres-ha"
      container: patroni-postgres
      shell: bash
      script: |
        if [ "$(printf '%s\n' '{installed_version}' 2.0.0 | sort -V | head -1)" = 2.0.0 ]; then want=18; else want=17; fi
        curl -s -m 10 localhost:8008/cluster | python3 -c '
        import json, sys, urllib.request
        want = int(sys.argv[1])
        majors = []
        for m in json.load(sys.stdin)["members"]:
            v = json.load(urllib.request.urlopen(m["api_url"].rsplit("/", 1)[0] + "/patroni", timeout=5)).get("server_version", 0)
            majors.append(v // 10000)
        ok = len(majors) == 3 and all(x == want for x in majors)
        print(("MAJOR " if ok else "WRONG ") + "want=%d members=%s" % (want, majors))
        ' "$want"
    expect:
      stdout: "^MAJOR want="
    # The members restart one after another after an upgrade; the old leader restarts last.
    retries: 20
    retryDelaySeconds: 30

  # ── Single-instance mode ([single] variant): PostgreSQL 19 from 2.0.0 ──
  - id: single-fresh-is-19
    description: A fresh single-instance install runs PostgreSQL 19 (the postgres 4.0.2 subchart).
    since: 2.0.0
    scenarios: "^install .*\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT 'SERVER_VERSION_NUM=' || current_setting('server_version_num')"
    expect:
      stdout: "^SERVER_VERSION_NUM=19[0-9]{4}$"
    retries: 3

  - id: single-guard-passes
    description: >-
      On its own PostgreSQL 19 data the major-version guard hands over to the server: no guard file, and
      postgres is PID 1.
    since: 2.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        [ -e /tmp/pg-major-guard ] && echo GUARD_FILE_PRESENT || echo NO_GUARD_FILE
        echo "PID1=$(cat /proc/1/comm)"
    expect:
      stdout: "(?s)^NO_GUARD_FILE$.*^PID1=postgres$"

  - id: single-crm-on-19
    description: >-
      Twenty serves on PostgreSQL 19, through its own API on 127.0.0.1 (node; the image has no curl or python):
      the first user signs up and creates the workspace, signs in with the real password while a wrong one is
      refused, and writes and reads back a Company.
    since: 2.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-twenty"
      container: twenty
      shell: sh
      script: |
        node - <<'JS'
        const B = "http://127.0.0.1:3000";
        const EMAIL = "e2e-admin@example.com", PW = "E2e-" + "{pg_password}".slice(0, 20);
        async function gql(path, query, variables, token) {
          const headers = { "content-type": "application/json" };
          if (token) headers.authorization = "Bearer " + token;
          const r = await fetch(B + path, { method: "POST", headers: headers, body: JSON.stringify({ query: query, variables: variables }) });
          try { return await r.json(); } catch (e) { return { errors: [ { message: "HTTP " + r.status } ] }; }
        }
        function data(resp, key) {
          if (resp.errors) { console.log("API ERROR " + key + ": " + resp.errors[0].message); process.exit(0); }
          return resp.data[key];
        }
        const login = (pw) => gql("/metadata", "mutation($e: String!, $p: String!, $o: String!) { getLoginTokenFromCredentials(email: $e, password: $p, origin: $o) { loginToken { token } } }", { e: EMAIL, p: pw, o: B });
        async function access(lt) {
          const r = await gql("/metadata", "mutation($t: String!, $o: String!) { getAuthTokensFromLoginToken(loginToken: $t, origin: $o) { tokens { accessOrWorkspaceAgnosticToken { token } } } }", { t: lt, o: B });
          return data(r, "getAuthTokensFromLoginToken").tokens.accessOrWorkspaceAgnosticToken.token;
        }
        (async () => {
          const exists = data(await gql("/metadata", "query($e: String!) { checkUserExists(email: $e) { exists } }", { e: EMAIL }), "checkUserExists").exists;
          if (!exists) {
            const t0 = data(await gql("/metadata", "mutation($e: String!, $p: String!) { signUp(email: $e, password: $p) { tokens { accessOrWorkspaceAgnosticToken { token } } } }", { e: EMAIL, p: PW }), "signUp").tokens.accessOrWorkspaceAgnosticToken.token;
            const lt = data(await gql("/metadata", "mutation($i: SignUpInNewWorkspaceInput) { signUpInNewWorkspace(input: $i) { loginToken { token } } }", { i: { displayName: "E2E" } }, t0), "signUpInNewWorkspace").loginToken.token;
            data(await gql("/metadata", "mutation($i: ActivateWorkspaceInput!) { activateWorkspace(data: $i) { id } }", { i: { } }, await access(lt)), "activateWorkspace");
          }
          const wrong = await login(PW + "-wrong");
          const refused = Boolean(wrong.errors) && !(wrong.data && wrong.data.getLoginTokenFromCredentials);
          const tok = await access(data(await login(PW), "getLoginTokenFromCredentials").loginToken.token);
          const count = async (n) => data(await gql("/graphql", "query($n: String!) { companies(filter: { name: { eq: $n } }) { totalCount } }", { n: n }, tok), "companies").totalCount;
          if (await count("e2e-{version}") === 0) {
            data(await gql("/graphql", "mutation($n: String!) { createCompany(data: { name: $n }) { id } }", { n: "e2e-{version}" }, tok), "createCompany");
          }
          console.log("COMPANY " + (await count("e2e-{version}")) + " | CONTROL " + (await count("e2e-never-written")) + " | WRONG-PASSWORD " + (refused ? "REFUSED" : "ACCEPTED"));
        })().catch((e) => console.log("SCRIPT ERROR " + e.message));
        JS
    expect:
      stdout: "^COMPANY 1 \\| CONTROL 0 \\| WRONG-PASSWORD REFUSED$"
    retries: 6
    retryDelaySeconds: 20
    timeoutSeconds: 180

  - id: single-workspace-in-19
    description: >-
      The workspace the API check created lives in PostgreSQL 19: Twenty's core schema holds it, and its own
      workspace_ schema exists next to core, so Twenty's multi-schema layout works on 19.
    since: 2.0.0
    scenarios: "\\[single\\]"
    exec:
      workload: "{release}-postgres"
      container: postgresql
      shell: bash
      script: |
        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "
          select 'WORKSPACES=' || (select count(*) from core.workspace)
            || ' SCHEMAS=' || (select count(*) from pg_namespace where nspname like 'workspace\_%')
            || ' MAJOR=' || (current_setting('server_version_num')::int / 10000)" 2>&1
    expect:
      stdout: "^WORKSPACES=[1-9][0-9]* SCHEMAS=[1-9][0-9]* MAJOR=19$"
    retries: 6
    retryDelaySeconds: 15
