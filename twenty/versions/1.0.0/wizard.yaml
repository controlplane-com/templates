# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Twenty

# Both bundled databases and the bundled Redis are single-location stateful workloads with no location
# handling. The bundled postgres 3.3.0 and postgres-highly-available keys are parent fields below, as in the
# other templates' descriptors for the same chart versions.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: twenty
    title: Twenty
    description: The server, the background worker, and the prerequisite secret with Twenty's app key.
    sections:
      - title: Server
        docs: "#twenty-server"
        description: One image serving the web app and the REST and GraphQL API.
        fields:
          - type: note
            severity: warning
            text: >-
              In this version the server and the worker start without waiting for PostgreSQL, so on a fresh install
              their boot migrations can run before the database accepts connections, and the containers fail and
              restart until it does. Version 1.3.0 waits for a live PostgreSQL first.
          - path: twenty.image
            type: string
            format: image
            label: Twenty image
            required: true
            help: Pin a released tag such as `twentycrm/twenty:v2.26.1`; never `latest`.
          - path: twenty.replicas
            type: integer
            label: Server replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              More than one requires S3 attachment storage, and moves the boot migrations to the worker.
          - path: twenty.serverUrl
            type: string
            label: Public base URL
            placeholder: https://crm.example.com
            pattern: '^(https?://.+)?$'
            patternMessage: Include the scheme, for example https://crm.example.com.
            description: >-
              Must match the URL browsers use, or sign-in and CORS fail. Leave empty to use the canonical
              endpoint (or the in-GVC address when public access is off). Set it, with the scheme, whenever
              browsers use another address: a custom domain, or http://localhost:PORT through a port-forward.
          - path: twenty.dbPoolMaxConnections
            type: integer
            label: Database connections per process
            required: true
            min: 1
            suggestions: [5, 10, 20]
            advanced: true
            description: Each server replica and the worker open a pool this size; PostgreSQL has a finite limit.
          - path: twenty.resources
            type: resources
            label: Server resources
            required: true
            description: Per server replica. First-boot migrations and upgrade backfills need about 2Gi of memory.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.twenty.replicas >= 1
            mirrors: twenty.validate
            paths: [twenty.replicas]
            message: At least one server replica is required.
          - rule: self.twenty.dbPoolMaxConnections >= 1
            mirrors: twenty.validate
            paths: [twenty.dbPoolMaxConnections]
            message: Must be at least 1.
          - rule: self.twenty.replicas <= 1 || self.storage.type == 's3'
            mirrors: twenty.validate
            paths: [twenty.replicas, storage.type]
            message: >-
              More than one server replica needs S3 attachment storage: local attachments would not be visible
              to every replica.
      - title: Background worker
        docs: "#background-worker"
        description: >-
          One replica, which registers the cron jobs and runs the boot migrations when there is more than one
          server replica.
        fields:
          - path: worker.resources
            type: resources
            label: Worker resources
            required: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
      - title: App key
        docs: "#app-key-secret"
        fields:
          - type: note
            severity: warning
            text: >-
              The app-key secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: secrets.name
            type: ref
            label: App-key secret
            required: true
            description: >-
              An opaque secret whose value is a random string (`openssl rand -base64 32`). Twenty uses it as
              both `APP_SECRET` and `ENCRYPTION_KEY`.
            help: >-
              Write-once: pointing at a different key without setting the previous-key secret makes stored
              OAuth tokens and two-factor secrets unreadable and signs everyone out.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                suggestName: "context.releaseName + '-twenty-app-secret'"
          - path: secrets.fallbackName
            type: ref
            label: Previous app-key secret
            advanced: true
            description: >-
              Only while rotating the app key: an opaque secret holding the previous key, so data encrypted with
              it stays readable. Leave empty otherwise.
            docs: "#rotating-the-app-key"
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
        rules:
          - rule: self.secrets.name != null && self.secrets.name != ''
            mirrors: twenty.validate
            paths: [secrets.name]
            message: The app-key secret is required.
          - rule: oldSelf == null || oldSelf.secrets.name == self.secrets.name || self.secrets.fallbackName != ''
            severity: warning
            paths: [secrets.name]
            message: >-
              Changing the app key without the previous-key secret makes stored OAuth tokens and two-factor
              secrets unreadable and signs everyone out.

  - id: attachments
    title: Attachments
    description: Where uploaded files and attachments are stored.
    sections:
      - fields:
          - path: storage.type
            type: enum
            label: Attachment storage
            widget: cards
            required: true
            docs: "#attachment-storage"
            options:
              - value: local
                label: Local volume
                description: >-
                  A shared volume mounted by the server and the worker. One server replica only, and no
                  snapshots.
              - value: s3
                label: S3 bucket
                description: AWS S3 or an S3-compatible server. Required for more than one server replica.
        rules:
          - rule: self.storage.type in ['local', 's3']
            mirrors: twenty.validate
            paths: [storage.type]
            message: Choose where attachments are stored.
      - title: Local volume
        when: self.storage.type == 'local'
        fields:
          - path: storage.local.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100]
            help: Uninstalling the release deletes the volume set, so the files do not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: >-
              oldSelf == null || oldSelf.storage.type != 'local' ||
              self.storage.local.volumeset.capacity >= oldSelf.storage.local.volumeset.capacity
            paths: [storage.local.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - title: S3 bucket
        when: self.storage.type == 's3'
        docs: "#attachment-storage"
        fields:
          - id: s3Flavour
            virtual: true
            type: enum
            label: S3 provider
            widget: segmented
            required: true
            init: "self.storage.s3.endpoint == null || self.storage.s3.endpoint == '' ? 'aws' : 'compatible'"
            options:
              - value: aws
                label: AWS S3
                description: Keyless access through a Control Plane cloud account; static keys are not accepted.
                set: { storage.s3.endpoint: "", storage.s3.auth.secretName: "" }
              - value: compatible
                label: S3-compatible
                description: MinIO or another S3 server, with static keys in a secret.
          - path: storage.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            description: Any value for most S3-compatible servers.
          - path: storage.s3.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            when: ui.s3Flavour == 'compatible'
            placeholder: http://my-minio-workload:9000
            description: The S3 API address, with scheme and port.
          - path: storage.s3.auth.secretName
            type: ref
            label: Access keys secret
            required: true
            when: ui.s3Flavour == 'compatible'
            description: >-
              A dictionary secret with the keys `STORAGE_S3_ACCESS_KEY_ID` and `STORAGE_S3_SECRET_ACCESS_KEY`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [STORAGE_S3_ACCESS_KEY_ID, STORAGE_S3_SECRET_ACCESS_KEY]
          - path: storage.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            when: ui.s3Flavour == 'aws'
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            when: ui.s3Flavour == 'aws'
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
        rules:
          - rule: self.storage.type != 's3' || self.storage.s3.bucket != ''
            mirrors: twenty.validate
            paths: [storage.s3.bucket]
            message: The bucket is required.
          - rule: >-
              self.storage.type != 's3' || self.storage.s3.auth.secretName == '' ||
              self.storage.s3.endpoint != ''
            mirrors: twenty.validate
            # The secret field is hidden when the endpoint is empty, so the bucket carries the issue too.
            paths: [storage.s3.auth.secretName, storage.s3.bucket]
            message: >-
              Static keys are only for S3-compatible servers. For AWS S3, choose AWS S3 above and use a cloud
              account.
          - rule: >-
              self.storage.type != 's3' || self.storage.s3.auth.secretName != '' ||
              (self.storage.s3.cloudAccountName != '' && self.storage.s3.policyName != '')
            mirrors: twenty.validate
            paths: [storage.s3.cloudAccountName, storage.s3.policyName]
            message: AWS S3 needs a cloud account and an IAM policy name.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Twenty inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The web app and API on the canonical endpoint. The first person to sign up becomes the workspace
          admin, so sign up right after installing.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: twenty.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.

  - id: database
    title: Database
    description: Which PostgreSQL holds Twenty's data, and its login.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgresHA.enabled && !self.postgres.enabled ? 'ha' : 'single'"
            options:
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL 18 replica on a persistent volume; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - type: note
            severity: info
            when: oldSelf != null
            text: >-
              The database cannot be switched on a running release: the other choice is a separate, empty
              database, and Twenty would start over with an empty workspace.
      - id: credentials
        title: Database credentials
        description: >-
          The login of whichever PostgreSQL is chosen above. The chosen database creates its secret from these
          values (<release>-postgres-config for the highly available one, <release>-pg-config for the
          single-instance one), and Twenty reads it. There is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.4.0 takes them from a secret
              you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: >-
              Used as typed, so replace the published default. Letters, digits, - and _ only: Twenty puts it in
              its database connection URL.
            help: >-
              PostgreSQL keeps the password it was initialized with, so change it with `ALTER ROLE` before you
              change it here. The replication user `repl` uses the same password, so change that role too.
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.config.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgres.config.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: >-
              Used as typed, so replace the published default. Letters, digits, - and _ only: Twenty puts it in
              its database connection URL.
            help: PostgreSQL keeps the password it was initialized with, so change it with `ALTER ROLE` before you change it here.
          - path: postgres.config.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
        rules:
          # twenty.validate checks the active mode's password (twenty.postgres.password).
          - when: self.postgresHA.enabled
            rule: self.postgresHA.postgres.password.matches('^[A-Za-z0-9_-]+$')
            mirrors: twenty.validate
            paths: [postgresHA.postgres.password]
            message: >-
              Use only letters, digits, - and _: Twenty puts the password in its database connection URL, where
              other characters break it.
          - when: "!self.postgresHA.enabled"
            rule: self.postgres.config.password.matches('^[A-Za-z0-9_-]+$')
            mirrors: twenty.validate
            paths: [postgres.config.password]
            message: >-
              Use only letters, digits, - and _: Twenty puts the password in its database connection URL, where
              other characters break it.
          # Twenty builds PG_DATABASE_URL as postgres://$(PG_USER):$(PG_PASSWORD)@<host>:5432/<database>, with the
          # database name written unquoted into the env value (templates/_helpers.tpl, twenty.env.common).
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.username == oldSelf.postgres.config.username) ||
              self.postgres.config.username.matches('^[A-Za-z0-9_-]+$')
            severity: warning
            paths: [postgres.config.username]
            message: >-
              Use only letters, digits, - and _: Twenty puts the user unencoded in its database connection URL.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.database == oldSelf.postgres.config.database) ||
              self.postgres.config.database.matches('^[A-Za-z0-9_-]+$')
            severity: warning
            paths: [postgres.config.database]
            message: >-
              Use only letters, digits, - and _: Twenty writes the database name unencoded and unquoted at the end
              of its database connection URL.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              self.postgresHA.postgres.username.matches('^[A-Za-z0-9_-]+$')
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Use only letters, digits, - and _: Twenty puts the user unencoded in its database connection URL.
          # The HA database (postgres-highly-available 2.4.2) writes the user and password unquoted into an
          # unquoted shell heredoc that becomes Patroni's YAML config (loaded as YAML 1.1), and the user and
          # database name into an unquoted psql command and CREATE DATABASE (templates/secret-startup.yaml).
          # Reproduced (unleash 1.2.1 round) by running the heredoc with sh and loading the result with PyYAML:
          # YAML indicators at the start, a lone - ~ = and <<, numbers, dates, 1:30 and yes/no/on/off break or
          # change the value. The URL rule above already keeps out every other character.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              [self.postgresHA.postgres.password].all(x,
              !x.matches('[$`]') && !x.matches('\\\\([$`\\\\]|$)') &&
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']) && !(x in ['~', '=', '<<']) &&
              !x.matches('^[-+]?([0-9][0-9_]*|0b[01_]+|0x[0-9a-fA-F_]+)$') &&
              !x.matches('^[-+]?([0-9][0-9_]*)?\\.[0-9_]*([eE][-+][0-9]+)?$') &&
              !x.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              The highly available database writes the password unquoted into a shell script and its YAML config.
              Do not use a lone - or a value that reads as a number, a date, yes/no, on/off, true/false or null.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              (self.postgresHA.postgres.username.matches('^[A-Za-z_][A-Za-z0-9_.-]*$') &&
              !(self.postgresHA.postgres.username.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']))
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Start the user with a letter or underscore, and do not use yes/no, on/off, true/false or null. The
              highly available database writes the user unquoted into its YAML config and a psql command.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database) ||
              (self.postgresHA.postgres.database.matches('^[a-z_][a-z0-9_]*$') && size(self.postgresHA.postgres.database) <= 63 &&
              !(self.postgresHA.postgres.database in ['postgres','template0','template1','all','analyse','analyze','and','any','array','as','asc','asymmetric','authorization','binary','both','case','cast','check','collate','collation','column','concurrently','constraint','create','cross','current_catalog','current_date','current_role','current_schema','current_time','current_timestamp','current_user','default','deferrable','desc','distinct','do','else','end','except','false','fetch','for','foreign','freeze','from','full','grant','group','having','ilike','in','initially','inner','intersect','into','is','isnull','join','lateral','leading','left','like','limit','localtime','localtimestamp','natural','not','notnull','null','offset','on','only','or','order','outer','overlaps','placing','primary','references','returning','right','select','session_user','similar','some','symmetric','system_user','table','tablesample','then','to','trailing','true','union','unique','user','using','variadic','verbose','when','where','window','with']))
            severity: warning
            paths: [postgresHA.postgres.database]
            message: >-
              Use up to 63 lowercase letters, digits and underscores, starting with a letter or underscore, and
              not postgres, template0, template1 or an SQL reserved word such as user or order. The highly
              available database creates it with an unquoted CREATE DATABASE, which folds other names to
              lowercase (while Twenty connects with the name as typed) or fails, and a failure stops the cluster
              from being created.
          - when: self.postgresHA.enabled
            rule: oldSelf == null || self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Twenty loses its
              database connection after this upgrade.
          - when: self.postgres.enabled
            rule: oldSelf == null || self.postgres.config.password == oldSelf.postgres.config.password
            severity: info
            paths: [postgres.config.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Twenty loses its
              database connection after this upgrade.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: One PostgreSQL 18 replica on a persistent volume set, the default.
        fields:
          - path: postgres.image
            type: string
            format: image
            label: Postgres image
            required: true
            help: >-
              This version ships `postgres:18`; another image is unproven with it, so try it on a test release
              first. The data directory is specific to a major version: a different major on an existing volume
              does not start.
          - path: postgres.resources
            type: resources
            label: PostgreSQL resources
            required: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: postgres.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: >-
              oldSelf == null || imageMajor(self.postgres.image) < 0 || imageMajor(oldSelf.postgres.image) < 0 ||
              imageMajor(self.postgres.image) == imageMajor(oldSelf.postgres.image)
            severity: warning
            paths: [postgres.image]
            message: >-
              The data directory belongs to the installed Postgres major version; a different major version does
              not start on it. Upgrade with a dump and restore instead.
          - rule: oldSelf == null || self.postgres.volumeset.capacity >= oldSelf.postgres.volumeset.capacity
            paths: [postgres.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: single-backup
        title: Database backups
        toggle: postgres.backup.enabled
        when: self.postgres.enabled
        description: A scheduled logical dump of the single-instance PostgreSQL to object storage.
        fields:
          - path: postgres.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgres.backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            pattern: '^\s*[0-9][0-9*,/-]*(\s+[0-9*,/-]+){4}\s*$'
            patternMessage: >-
              Use five fields of numbers, *, ranges, steps and lists, starting with a digit: this version writes
              the schedule unquoted, so a schedule that starts with * (such as */15 * * * *) fails to install.
              Write 0,15,30,45 * * * * instead.
          - path: postgres.backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            description: Tag 18.x.x for the bundled PostgreSQL 18.
          - path: postgres.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
