  - id: redis
    title: Redis
    description: The bundled single-node Redis for Twenty's job queues and cache.
    fields:
      - path: redis.image
        type: string
        format: image
        label: Redis image
        required: true
      - type: note
        severity: warning
        text: >-
          The Redis password is stored in the Helm release in plain text. Version 1.4.0 takes it from a secret you
          create instead.
      - path: redis.auth.password
        type: string
        label: Redis password
        required: true
        sensitive: true
        widget: password
        example: true
        description: >-
          Used as typed, so replace the published default. Letters, digits, - and _ only: Twenty puts it in its
          Redis connection URL.
        help: >-
          Redis reads it at every start and keeps no copy on disk, so a new value takes effect once Redis, the
          server and the worker have restarted with it.
      - path: redis.resources
        type: resources
        label: Redis resources
        required: true
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
      - path: redis.volumeset.capacity
        type: integer
        label: Initial capacity
        unit: GiB
        min: 10
        max: 65536
        required: true
        suggestions: [10, 20, 50]
        help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
        docs: "/reference/volumeset#capacity-and-billing"
    rules:
      - rule: self.redis.auth.password.matches('^[A-Za-z0-9_-]+$')
        mirrors: twenty.validate
        paths: [redis.auth.password]
        message: >-
          Use only letters, digits, - and _: Twenty puts the Redis password in its connection URL, where other
          characters break it.
      - rule: oldSelf == null || self.redis.volumeset.capacity >= oldSelf.redis.volumeset.capacity
        paths: [redis.volumeset.capacity]
        message: A volume set cannot shrink. Keep the capacity at or above the installed size.

