{{- if .Values.postgres.enabled }}
{{- /*
  Credentials for the BUNDLED single-instance database. Internal plumbing: no human ever
  types this password — it exists only so Twenty can reach its own Postgres — so the
  bundled-plumbing exception applies and it stays a template-created secret rather than a
  prerequisite the user has to create. postgres 3.4.0 stopped creating this secret and now
  only takes its NAME, which is why the chart on this side of the dependency owns it.

  The three keys are named exactly as the postgres subchart reads them: username, password,
  database. The HA path uses postgres-highly-available's own {release}-postgres-config
  secret instead, which carries the same three keys.
*/}}
kind: secret
name: {{ include "twenty.secret.db.name" . }}
description: Twenty bundled PostgreSQL credentials
tags: {{- include "twenty.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.postgres.credentials.username | quote }}
  password: {{ .Values.postgres.credentials.password | quote }}
  database: {{ .Values.postgres.credentials.database | quote }}
{{- end }}
