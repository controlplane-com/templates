---
kind: secret
name: {{ include "twenty.secret.workerStart.name" . }}
description: Twenty worker start script (derives SERVER_URL, then execs the image entrypoint)
tags: {{- include "twenty.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
    cd /app/packages/twenty-server
    {{- if eq (include "twenty.serverUrl.derived" .) "true" }}
    # Worker-side consumers of SERVER_URL (logic-function-executor, links built
    # by background jobs) must point at the SERVER. CPLN_GLOBAL_ENDPOINT is
    # per-workload, so this worker's own endpoint would be advertised instead —
    # and with inbound closed it does not even resolve. The server's canonical
    # hostname differs only by the workload-name prefix, and the org alias
    # inside it is not available any other way.
    SERVER_URL="$(printf '%s' "${CPLN_GLOBAL_ENDPOINT:-}" \
      | sed 's|//{{ include "twenty.worker.name" . }}-|//{{ include "twenty.name" . }}-|')"
    # Never advertise an empty base URL — fall back to the in-GVC address.
    [ -n "$SERVER_URL" ] || SERVER_URL="http://{{ include "twenty.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:3000"
    export SERVER_URL
    echo "advertising SERVER_URL=$SERVER_URL"
    {{- end }}
    # The image entrypoint honours DISABLE_DB_MIGRATIONS /
    # DISABLE_CRON_JOBS_REGISTRATION and ends in `exec "$@"`, so migration
    # ownership works exactly as it does without this wrapper.
    exec /app/entrypoint.sh yarn worker:prod
