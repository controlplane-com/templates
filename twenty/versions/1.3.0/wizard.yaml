# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Twenty

# Both bundled databases and the bundled Redis are single-location stateful workloads with no location
# handling: postgres brings this limit with its import, and postgres-highly-available (no descriptor of its
# own, so its keys are parent fields below) and Redis need the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Twenty creates this secret itself (templates/secret-db.yaml) and names it in the Database step below.
      - config.credentialsSecretName
      # Twenty connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          Twenty connects to its database like any other workload: keep Same GVC, or add the Twenty server
          and worker workloads under Allowed workloads.

steps:
  - id: twenty
    title: Twenty
    description: The server, the background worker, and the prerequisite secret with Twenty's app key.
    sections:
      - title: Server
        docs: "#twenty-server"
        description: One image serving the web app and the REST and GraphQL API.
        fields:
          - path: twenty.image
            type: string
            format: image
            label: Twenty image
            required: true
            help: Pin a released tag such as `twentycrm/twenty:v2.26.1`; never `latest`.
          - path: twenty.replicas
            type: integer
            label: Server replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              More than one requires S3 attachment storage, and moves the boot migrations to the worker.
          - path: twenty.serverUrl
            type: string
            label: Public base URL
            placeholder: https://crm.example.com
            pattern: '^(https?://.+)?$'
            patternMessage: Include the scheme, for example https://crm.example.com.
            description: >-
              Must match the URL browsers use, or sign-in and CORS fail. Leave empty to use the canonical
              endpoint (or the in-GVC address when public access is off). Set it, with the scheme, whenever
              browsers use another address: a custom domain, or http://localhost:PORT through a port-forward.
          - path: twenty.dbPoolMaxConnections
            type: integer
            label: Database connections per process
            required: true
            min: 1
            suggestions: [5, 10, 20]
            advanced: true
            description: Each server replica and the worker open a pool this size; PostgreSQL has a finite limit.
          - path: twenty.resources
            type: resources
            label: Server resources
            required: true
            description: Per server replica. First-boot migrations and upgrade backfills need about 2Gi of memory.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.twenty.replicas >= 1
            mirrors: twenty.validate
            paths: [twenty.replicas]
            message: At least one server replica is required.
          - rule: self.twenty.dbPoolMaxConnections >= 1
            mirrors: twenty.validate
            paths: [twenty.dbPoolMaxConnections]
            message: Must be at least 1.
          - rule: self.twenty.replicas <= 1 || self.storage.type == 's3'
            mirrors: twenty.validate
            paths: [twenty.replicas, storage.type]
            message: >-
              More than one server replica needs S3 attachment storage: local attachments would not be visible
              to every replica.
      - title: Background worker
        docs: "#background-worker"
        description: >-
          One replica, which registers the cron jobs and runs the boot migrations when there is more than one
          server replica.
        fields:
          - path: worker.resources
            type: resources
            label: Worker resources
            required: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
      - title: App key
        docs: "#app-key-secret"
        fields:
          - type: note
            severity: warning
            text: >-
              The app-key secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: secrets.name
            type: ref
            label: App-key secret
            required: true
            description: >-
              An opaque secret whose value is a random string (`openssl rand -base64 32`). Twenty uses it as
              both `APP_SECRET` and `ENCRYPTION_KEY`.
            help: >-
              Write-once: pointing at a different key without setting the previous-key secret makes stored
              OAuth tokens and two-factor secrets unreadable and signs everyone out.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                suggestName: "context.releaseName + '-twenty-app-secret'"
          - path: secrets.fallbackName
            type: ref
            label: Previous app-key secret
            advanced: true
            description: >-
              Only while rotating the app key: an opaque secret holding the previous key, so data encrypted with
              it stays readable. Leave empty otherwise.
            docs: "#rotating-the-app-key"
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
        rules:
          - rule: self.secrets.name != null && self.secrets.name != ''
            mirrors: twenty.validate
            paths: [secrets.name]
            message: The app-key secret is required.
          - rule: oldSelf == null || oldSelf.secrets.name == self.secrets.name || self.secrets.fallbackName != ''
            severity: warning
            paths: [secrets.name]
            message: >-
              Changing the app key without the previous-key secret makes stored OAuth tokens and two-factor
              secrets unreadable and signs everyone out.

  - id: attachments
    title: Attachments
    description: Where uploaded files and attachments are stored.
    sections:
      - fields:
          - path: storage.type
            type: enum
            label: Attachment storage
            widget: cards
            required: true
            docs: "#attachment-storage"
            options:
              - value: local
                label: Local volume
                description: >-
                  A shared volume mounted by the server and the worker. One server replica only, and no
                  snapshots.
              - value: s3
                label: S3 bucket
                description: AWS S3 or an S3-compatible server. Required for more than one server replica.
        rules:
          - rule: self.storage.type in ['local', 's3']
            mirrors: twenty.validate
            paths: [storage.type]
            message: Choose where attachments are stored.
      - title: Local volume
        when: self.storage.type == 'local'
        fields:
          - path: storage.local.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100]
            help: Uninstalling the release deletes the volume set, so the files do not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: >-
              oldSelf == null || oldSelf.storage.type != 'local' ||
              self.storage.local.volumeset.capacity >= oldSelf.storage.local.volumeset.capacity
            paths: [storage.local.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - title: S3 bucket
        when: self.storage.type == 's3'
        docs: "#attachment-storage"
        fields:
          - id: s3Flavour
            virtual: true
            type: enum
            label: S3 provider
            widget: segmented
            required: true
            init: "self.storage.s3.endpoint == null || self.storage.s3.endpoint == '' ? 'aws' : 'compatible'"
            options:
              - value: aws
                label: AWS S3
                description: Keyless access through a Control Plane cloud account; static keys are not accepted.
                set: { storage.s3.endpoint: "", storage.s3.auth.secretName: "" }
              - value: compatible
                label: S3-compatible
                description: MinIO or another S3 server, with static keys in a secret.
          - path: storage.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            description: Any value for most S3-compatible servers.
          - path: storage.s3.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            when: ui.s3Flavour == 'compatible'
            placeholder: http://my-minio-workload:9000
            description: The S3 API address, with scheme and port.
          - path: storage.s3.auth.secretName
            type: ref
            label: Access keys secret
            required: true
            when: ui.s3Flavour == 'compatible'
            description: >-
              A dictionary secret with the keys `STORAGE_S3_ACCESS_KEY_ID` and `STORAGE_S3_SECRET_ACCESS_KEY`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [STORAGE_S3_ACCESS_KEY_ID, STORAGE_S3_SECRET_ACCESS_KEY]
          - path: storage.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            when: ui.s3Flavour == 'aws'
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            when: ui.s3Flavour == 'aws'
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
        rules:
          - rule: self.storage.type != 's3' || self.storage.s3.bucket != ''
            mirrors: twenty.validate
            paths: [storage.s3.bucket]
            message: The bucket is required.
          - rule: >-
              self.storage.type != 's3' || self.storage.s3.auth.secretName == '' ||
              self.storage.s3.endpoint != ''
            mirrors: twenty.validate
            # The secret field is hidden when the endpoint is empty, so the bucket carries the issue too.
            paths: [storage.s3.auth.secretName, storage.s3.bucket]
            message: >-
              Static keys are only for S3-compatible servers. For AWS S3, choose AWS S3 above and use a cloud
              account.
          - rule: >-
              self.storage.type != 's3' || self.storage.s3.auth.secretName != '' ||
              (self.storage.s3.cloudAccountName != '' && self.storage.s3.policyName != '')
            mirrors: twenty.validate
            paths: [storage.s3.cloudAccountName, storage.s3.policyName]
            message: AWS S3 needs a cloud account and an IAM policy name.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Twenty inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The web app and API on the canonical endpoint. The first person to sign up becomes the workspace
          admin, so sign up right after installing.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: twenty.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.

  - id: database
    title: Database
    description: Which PostgreSQL holds Twenty's data, and the credentials Twenty creates its database secret from.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgresHA.enabled && !self.postgres.enabled ? 'ha' : 'single'"
            options:
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL 18 replica on a persistent volume; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - type: note
            severity: info
            when: oldSelf != null
            text: >-
              The database cannot be switched on a running release: the other choice is a separate, empty
              database, and Twenty would start over with an empty workspace.
      - id: credentials
        title: Database credentials
        description: >-
          Used by whichever PostgreSQL is chosen above. Twenty creates the dictionary secret named below from
          these three values, and both PostgreSQL and Twenty read it; there is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.4.0 takes them from a secret
              you create instead.
          - path: postgres.credentials.username
            type: string
            label: Database user
            required: true
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgres.credentials.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            description: >-
              Used as typed, so replace the published default. Letters, digits, - and _ only: Twenty puts it in
              its database connection URL.
            help: >-
              PostgreSQL keeps the password it was initialized with, so change it with `ALTER ROLE` before you
              change it here. The highly available database's replication user `repl` uses the same password,
              so change that role too.
          - path: postgres.credentials.database
            type: string
            label: Database name
            required: true
            immutable: PostgreSQL creates this database once, when its data is first initialized.
        rules:
          - rule: self.postgres.credentials.password.matches('^[A-Za-z0-9_-]+$')
            mirrors: twenty.validate
            paths: [postgres.credentials.password]
            message: >-
              Use only letters, digits, - and _: Twenty puts the password in its database connection URL, where
              other characters break it.
          # Twenty builds PG_DATABASE_URL as postgres://$(PG_USER):$(PG_PASSWORD)@<host>:5432/<database>, with the
          # database name written unquoted into the env value (templates/_helpers.tpl, twenty.env.common).
          - rule: >-
              (oldSelf != null && self.postgres.credentials.username == oldSelf.postgres.credentials.username) ||
              self.postgres.credentials.username.matches('^[A-Za-z0-9_-]+$')
            severity: warning
            paths: [postgres.credentials.username]
            message: >-
              Use only letters, digits, - and _: Twenty puts the user unencoded in its database connection URL.
          - rule: >-
              (oldSelf != null && self.postgres.credentials.database == oldSelf.postgres.credentials.database) ||
              self.postgres.credentials.database.matches('^[A-Za-z0-9_-]+$')
            severity: warning
            paths: [postgres.credentials.database]
            message: >-
              Use only letters, digits, - and _: Twenty writes the database name unencoded and unquoted at the end
              of its database connection URL.
          # The HA database (postgres-highly-available 2.5.0) runs psql -U with the user unquoted and creates the
          # database with an unquoted CREATE DATABASE (templates/secret-startup.yaml).
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgres.credentials.database == oldSelf.postgres.credentials.database) ||
              (self.postgres.credentials.database.matches('^[a-z_][a-z0-9_]*$') && size(self.postgres.credentials.database) <= 63 &&
              !(self.postgres.credentials.database in ['postgres','template0','template1','all','analyse','analyze','and','any','array','as','asc','asymmetric','authorization','binary','both','case','cast','check','collate','collation','column','concurrently','constraint','create','cross','current_catalog','current_date','current_role','current_schema','current_time','current_timestamp','current_user','default','deferrable','desc','distinct','do','else','end','except','false','fetch','for','foreign','freeze','from','full','grant','group','having','ilike','in','initially','inner','intersect','into','is','isnull','join','lateral','leading','left','like','limit','localtime','localtimestamp','natural','not','notnull','null','offset','on','only','or','order','outer','overlaps','placing','primary','references','returning','right','select','session_user','similar','some','symmetric','system_user','table','tablesample','then','to','trailing','true','union','unique','user','using','variadic','verbose','when','where','window','with']))
            severity: warning
            paths: [postgres.credentials.database]
            message: >-
              Use up to 63 lowercase letters, digits and underscores, starting with a letter or underscore, and
              not postgres, template0, template1 or an SQL reserved word such as user or order. The highly
              available database creates it with an unquoted CREATE DATABASE, which folds other names to
              lowercase (while Twenty connects with the name as typed) or fails, and a failure stops the cluster
              from being created.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgres.credentials.username == oldSelf.postgres.credentials.username) ||
              self.postgres.credentials.username.matches('^[A-Za-z_][A-Za-z0-9_-]*$')
            severity: warning
            paths: [postgres.credentials.username]
            message: >-
              Start the user with a letter or underscore. The highly available database writes the user into an
              unquoted psql command.
          - rule: oldSelf == null || self.postgres.credentials.password == oldSelf.postgres.credentials.password
            severity: info
            paths: [postgres.credentials.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Twenty loses its
              database connection after this upgrade.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: >-
          One PostgreSQL replica, the default. Its server, storage, network and backups follow in the next
          steps.
        fields:
          - path: postgres.config.credentialsSecretName
            type: string
            label: Credentials secret name
            required: true
            description: The dictionary secret Twenty creates from the database credentials. Secret names are org-wide.
            pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
            patternMessage: Use lowercase letters, digits and hyphens, starting with a letter.
        rules:
          - rule: self.postgres.config.credentialsSecretName != 'my-twenty-db-credentials'
            severity: info
            paths: [postgres.config.credentialsSecretName]
            messageExpression: >-
              'Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Twenty release its own name, for example ' + context.releaseName +
              '-twenty-db-credentials.'
            message: >-
              Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Twenty release its own name.
          - rule: "!(self.postgres.config.credentialsSecretName in [context.releaseName + '-twenty-creds', context.releaseName + '-twenty-worker-start', context.releaseName + '-twenty-server-start'])"
            severity: warning
            paths: [postgres.config.credentialsSecretName]
            message: >-
              Choose another name: this chart already creates secrets named <release>-twenty-creds, <release>-twenty-worker-start and <release>-twenty-server-start, and
              two secrets of one name collide.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas (PostgreSQL 17), 3 etcd replicas and an HAProxy leader endpoint that Twenty
          connects through.
        fields:
          - type: note
            severity: warning
            text: >-
              The bundled highly available database creates its cluster with consensus timeouts that Patroni
              silently tightens, so a leader that cannot reach etcd for about 14 seconds is demoted.
          - type: note
            severity: warning
            text: >-
              The bundled highly available database also writes the database password into Patroni's shared
              configuration, which anything that can reach port 8008 of its members can read without
              authentication at `/config`.
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.0.1') < 0
            text: >-
              The installed version does not compact etcd. This upgrade turns compaction on but cannot shrink a
              backend that has already grown; check it first
              ([Upgrading From a Version Before 2.4.2](/template-catalog/templates/postgres-highly-available#upgrading-from-a-version-before-2-4-2)).
          - path: postgresHA.config.credentialsSecretName
            type: string
            label: Credentials secret name
            required: true
            description: The dictionary secret Twenty creates from the database credentials. Secret names are org-wide.
            pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
            patternMessage: Use lowercase letters, digits and hyphens, starting with a letter.
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.resources
            type: resources
            label: PostgreSQL resources
            required: true
            description: Per Patroni replica.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: self.postgresHA.config.credentialsSecretName != 'my-twenty-db-credentials'
            severity: info
            paths: [postgresHA.config.credentialsSecretName]
            messageExpression: >-
              'Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Twenty release its own name, for example ' + context.releaseName +
              '-twenty-db-credentials.'
            message: >-
              Secret names are org-wide: a release on this name is refused while another release manages that
              secret. Give each Twenty release its own name.
          # postgres-highly-available 2.5.0 renders a secret named <release>-postgres-config for its backup settings,
          # and 2.4.x (twenty 1.1.x and earlier) kept the database credentials in a chart secret of that name.
          - rule: >-
              !self.postgresHA.enabled ||
              (oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.2.0') >= 0 &&
              self.postgresHA.config.credentialsSecretName == oldSelf.postgresHA.config.credentialsSecretName &&
              !self.postgresHA.backup.enabled) ||
              self.postgresHA.config.credentialsSecretName != context.releaseName + '-postgres-config'
            severity: warning
            paths: [postgresHA.config.credentialsSecretName]
            message: >-
              Choose another name. The highly available database renders its own secret under this name when backups
              are on, and on an upgrade from twenty 1.1.x or earlier this is the old chart's secret, which the
              upgrade removes or rewrites.
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
          - rule: "!(self.postgresHA.config.credentialsSecretName in [context.releaseName + '-twenty-creds', context.releaseName + '-twenty-worker-start', context.releaseName + '-twenty-server-start'])"
            severity: warning
            paths: [postgresHA.config.credentialsSecretName]
            message: >-
              Choose another name: this chart already creates secrets named <release>-twenty-creds, <release>-twenty-worker-start and <release>-twenty-server-start, and
              two secrets of one name collide.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        fields:
          - type: note
            severity: warning
            when: self.postgresHA.backup.mode == 'wal-g'
            text: >-
              The WAL-G sidecar waits a full interval before its first base backup, so a new cluster archives WAL
              with nothing to restore it from for up to that long, and turning WAL-G on for a cluster that
              already exists does not start WAL archiving.
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
        rules:
          - when: self.postgresHA.backup.mode == 'wal-g'
            rule: memoryBytes(self.postgresHA.backup.resources.memory) >= memoryBytes('512Mi')
            severity: warning
            paths: [postgresHA.backup.resources]
            message: >-
              Give the WAL-G sidecar at least 512Mi of memory. With less it is killed for running out of memory
              during the base backup and no backup is written.
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        fields:
          - type: note
            severity: warning
            text: >-
              The backup identity of the bundled highly available database also carries the AWS managed policy
              ReadOnlyAccess, which can read every bucket in the AWS account, not only this one.
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.aws.prefix != null && self.postgresHA.backup.aws.prefix != ''
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              The logical backup job writes the prefix unquoted into its configuration. Do not start it with a
              space or a YAML symbol, avoid ": " and " #", and do not use a value that reads as a number, a date,
              true/false or null (such as 2024).
          # WAL-G mode writes the prefix unquoted inside s3://<bucket>/<prefix>, so ' #' starts a comment that
          # silently truncates it and ': ' or a trailing ':' breaks the YAML.
          - when: self.postgresHA.backup.mode == 'wal-g' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x, !x.contains(' #') && !x.contains(': ') &&
              !x.endsWith(':') && !x.endsWith(' ') && !x.matches('\\t'))
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: >-
              WAL-G writes the prefix unquoted into its configuration. Leave out " #", ": ", tabs, and a trailing
              colon or space.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
