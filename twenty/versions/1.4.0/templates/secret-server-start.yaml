---
kind: secret
name: {{ include "twenty.secret.serverStart.name" . }}
description: Twenty server start script (waits for Postgres, then execs the image entrypoint)
tags: {{- include "twenty.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
    cd /app/packages/twenty-server
    {{- include "twenty.dbGate" . | nindent 4 }}
    # The image entrypoint honours DISABLE_DB_MIGRATIONS / DISABLE_CRON_JOBS_REGISTRATION
    # and ends in `exec "$@"`, so migration ownership works exactly as it does without
    # this wrapper — the gate only guarantees Postgres is live before migrations run.
    exec /app/entrypoint.sh node dist/main
