---
kind: workload
name: {{ include "twenty.redis.name" . }}
description: Twenty Redis — BullMQ job queues and cache
gvc: {{ .Values.global.cpln.gvc }}
tags: {{- include "twenty.tags" . | nindent 4 }}
spec:
  type: stateful
  identityLink: //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "twenty.identity.name" . }}
  containers:
    - name: redis
      image: {{ .Values.redis.image }}
      inheritEnv: false
      minCpu: {{ .Values.redis.resources.minCpu | quote }}
      cpu: {{ .Values.redis.resources.maxCpu | quote }}
      minMemory: {{ .Values.redis.resources.minMemory | quote }}
      memory: {{ .Values.redis.resources.maxMemory | quote }}
      command: redis-server
      # AOF + noeviction per the upstream compose — an evicted key silently
      # drops queued jobs.
      args:
        - --requirepass
        - $(REDIS_PASSWORD)
        - --appendonly
        - "yes"
        - --maxmemory-policy
        - noeviction
      env:
        - name: REDIS_PASSWORD
          value: cpln://secret/{{ include "twenty.secret.creds.name" . }}.redisPassword
      ports:
        - number: 6379
          protocol: tcp
      readinessProbe:
        exec:
          command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 10
        successThreshold: 1
        timeoutSeconds: 3
      volumes:
        - path: /data
          recoveryPolicy: retain
          uri: cpln://volumeset/{{ include "twenty.redis.volumeset.name" . }}
  defaultOptions:
    autoscaling:
      metric: disabled
      minScale: 1
      maxScale: 1
      maxConcurrency: 0
      target: 100
      scaleToZeroDelay: 300
    capacityAI: false
    debug: false
    suspend: false
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR: []
    internal:
      inboundAllowType: same-gvc
  loadBalancer:
    direct:
      enabled: false
    replicaDirect: false
  supportDynamicTags: false
