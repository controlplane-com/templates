# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Twenty

# Both bundled databases and the bundled Redis are single-location stateful workloads with no location
# handling: postgres brings this limit with its import, and postgres-highly-available (no descriptor of its
# own, so its keys are parent fields below) and Redis need the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.4.1
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Chosen in the Database step below, next to the HA mode's secret, so both modes ask for it in one place.
      - config.credentialsSecretName
      # Twenty connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          Twenty connects to its database like any other workload: keep Same GVC, or add the Twenty server
          and worker workloads under Allowed workloads.

steps:
  - id: twenty
    title: Twenty
    description: The server, the background worker, and the prerequisite secret with Twenty's app key.
    sections:
      - title: Server
        docs: "#twenty-server"
        description: One image serving the web app and the REST and GraphQL API.
        fields:
          - path: twenty.image
            type: string
            format: image
            label: Twenty image
            required: true
            help: Pin a released tag such as `twentycrm/twenty:v2.26.1`; never `latest`.
          - path: twenty.replicas
            type: integer
            label: Server replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              More than one requires S3 attachment storage, and moves the boot migrations to the worker.
          - path: twenty.serverUrl
            type: string
            label: Public base URL
            placeholder: https://crm.example.com
            pattern: '^(https?://.+)?$'
            patternMessage: Include the scheme, for example https://crm.example.com.
            description: >-
              Must match the URL browsers use, or sign-in and CORS fail. Leave empty to use the canonical
              endpoint; set it only when a custom domain fronts the workload.
          - path: twenty.dbPoolMaxConnections
            type: integer
            label: Database connections per process
            required: true
            min: 1
            suggestions: [5, 10, 20]
            advanced: true
            description: Each server replica and the worker open a pool this size; PostgreSQL has a finite limit.
          - path: twenty.resources
            type: resources
            label: Server resources
            required: true
            description: Per server replica. First-boot migrations and upgrade backfills need about 2Gi of memory.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.twenty.replicas >= 1
            mirrors: twenty.validate
            paths: [twenty.replicas]
            message: At least one server replica is required.
          - rule: self.twenty.dbPoolMaxConnections >= 1
            mirrors: twenty.validate
            paths: [twenty.dbPoolMaxConnections]
            message: Must be at least 1.
          - rule: self.twenty.replicas <= 1 || self.storage.type == 's3'
            mirrors: twenty.validate
            paths: [twenty.replicas, storage.type]
            message: >-
              More than one server replica needs S3 attachment storage: local attachments would not be visible
              to every replica.
      - title: Background worker
        docs: "#background-worker"
        description: >-
          One replica, which registers the cron jobs and runs the boot migrations when there is more than one
          server replica.
        fields:
          - path: worker.resources
            type: resources
            label: Worker resources
            required: true
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
      - title: App key
        docs: "#app-key-secret"
        fields:
          - type: note
            severity: warning
            text: >-
              The app-key secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: secrets.name
            type: ref
            label: App-key secret
            required: true
            description: >-
              An opaque secret whose value is a random string (`openssl rand -base64 32`). Twenty uses it as
              both `APP_SECRET` and `ENCRYPTION_KEY`.
            help: >-
              Write-once: pointing at a different key without setting the previous-key secret makes stored
              OAuth tokens and two-factor secrets unreadable and signs everyone out.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                suggestName: "context.releaseName + '-twenty-app-secret'"
          - path: secrets.fallbackName
            type: ref
            label: Previous app-key secret
            advanced: true
            description: >-
              Only while rotating the app key: an opaque secret holding the previous key, so data encrypted with
              it stays readable. Leave empty otherwise.
            docs: "#rotating-the-app-key"
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
        rules:
          - rule: self.secrets.name != null && self.secrets.name != ''
            mirrors: twenty.validate
            paths: [secrets.name]
            message: The app-key secret is required.
          - rule: oldSelf == null || oldSelf.secrets.name == self.secrets.name || self.secrets.fallbackName != ''
            severity: warning
            paths: [secrets.name]
            message: >-
              Changing the app key without the previous-key secret makes stored OAuth tokens and two-factor
              secrets unreadable and signs everyone out.

  - id: attachments
    title: Attachments
    description: Where uploaded files and attachments are stored.
    sections:
      - fields:
          - path: storage.type
            type: enum
            label: Attachment storage
            widget: cards
            required: true
            docs: "#attachment-storage"
            options:
              - value: local
                label: Local volume
                description: >-
                  A shared volume mounted by the server and the worker. One server replica only, and no
                  snapshots.
              - value: s3
                label: S3 bucket
                description: AWS S3 or an S3-compatible server. Required for more than one server replica.
        rules:
          - rule: self.storage.type in ['local', 's3']
            mirrors: twenty.validate
            paths: [storage.type]
            message: Choose where attachments are stored.
      - title: Local volume
        when: self.storage.type == 'local'
        fields:
          - path: storage.local.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100]
            help: Uninstalling the release deletes the volume set, so the files do not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: >-
              oldSelf == null || oldSelf.storage.type != 'local' ||
              self.storage.local.volumeset.capacity >= oldSelf.storage.local.volumeset.capacity
            paths: [storage.local.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - title: S3 bucket
        when: self.storage.type == 's3'
        docs: "#attachment-storage"
        fields:
          - id: s3Flavour
            virtual: true
            type: enum
            label: S3 provider
            widget: segmented
            required: true
            init: "self.storage.s3.endpoint == null || self.storage.s3.endpoint == '' ? 'aws' : 'compatible'"
            options:
              - value: aws
                label: AWS S3
                description: Keyless access through a Control Plane cloud account; static keys are not accepted.
                set: { storage.s3.endpoint: "", storage.s3.auth.secretName: "" }
              - value: compatible
                label: S3-compatible
                description: MinIO or another S3 server, with static keys in a secret.
          - path: storage.s3.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: storage.s3.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            description: Any value for most S3-compatible servers.
          - path: storage.s3.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            when: ui.s3Flavour == 'compatible'
            placeholder: http://my-minio-workload:9000
            description: The S3 API address, with scheme and port.
          - path: storage.s3.auth.secretName
            type: ref
            label: Access keys secret
            required: true
            when: ui.s3Flavour == 'compatible'
            description: >-
              A dictionary secret with the keys `STORAGE_S3_ACCESS_KEY_ID` and `STORAGE_S3_SECRET_ACCESS_KEY`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [STORAGE_S3_ACCESS_KEY_ID, STORAGE_S3_SECRET_ACCESS_KEY]
          - path: storage.s3.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            when: ui.s3Flavour == 'aws'
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: storage.s3.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            when: ui.s3Flavour == 'aws'
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
        rules:
          - rule: self.storage.type != 's3' || self.storage.s3.bucket != ''
            mirrors: twenty.validate
            paths: [storage.s3.bucket]
            message: The bucket is required.
          - rule: >-
              self.storage.type != 's3' || self.storage.s3.auth.secretName == '' ||
              self.storage.s3.endpoint != ''
            mirrors: twenty.validate
            paths: [storage.s3.auth.secretName]
            message: >-
              Static keys are only for S3-compatible servers. For AWS S3, choose AWS S3 above and use a cloud
              account.
          - rule: >-
              self.storage.type != 's3' || self.storage.s3.auth.secretName != '' ||
              (self.storage.s3.cloudAccountName != '' && self.storage.s3.policyName != '')
            mirrors: twenty.validate
            paths: [storage.s3.cloudAccountName, storage.s3.policyName]
            message: AWS S3 needs a cloud account and an IAM policy name.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Twenty inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The web app and API on the canonical endpoint. The first person to sign up becomes the workspace
          admin, so sign up right after installing.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list']
        mirrors: twenty.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.

  - id: database
    title: Database
    description: Which PostgreSQL holds Twenty's data, and the prerequisite secret with its credentials.
    docs: "#database"
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgresHA.enabled && !self.postgres.enabled ? 'ha' : 'single'"
            options:
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL 18 replica on a volume with snapshots; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - type: note
            severity: warning
            text: >-
              The database credentials secret must exist **before** you install; if it is missing, the
              deployment waits and `cpln logs` shows nothing at all. Use only letters, digits, - and _ in its
              values: Twenty puts them in a connection URL.
          - type: note
            severity: info
            when: oldSelf != null
            text: >-
              The database cannot be switched on a running release: the other choice is a separate, empty
              database, and Twenty would start over with an empty workspace.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: >-
          One PostgreSQL replica, the default. Its server, storage, network and backups follow in the next
          steps.
        fields:
          - path: postgres.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data directory is first initialized, and Twenty
              connects with them. To change the password later, run `ALTER ROLE ... PASSWORD` first, then
              update the secret and force a redeployment.
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-twenty-db-credentials'"
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas (PostgreSQL 17), 3 etcd replicas and an HAProxy leader endpoint that Twenty
          connects through.
        fields:
          - path: postgresHA.config.credentialsSecretName
            type: ref
            label: Database credentials secret
            required: true
            description: A dictionary secret with the keys `username`, `password` and `database`.
            help: >-
              PostgreSQL reads these values only when its data is first initialized, and Twenty connects with
              them. To change the password later, change it in the database first, then update the secret and
              force a redeployment.
              In HA mode the order differs: move the leader to member -0 first (see the README's HA rotation steps).
            docs: "#prerequisites"
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password, database]
              create:
                suggestName: "context.releaseName + '-twenty-db-credentials'"
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.resources
            type: resources
            label: PostgreSQL resources
            required: true
            description: Per Patroni replica.
            maxRatio: 4
            cpu: { min: 25m }
            memory: { min: 32Mi }
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Object
              Admin role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgresHA.backup.gcp.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'minio'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload:9000
            description: The URL including the port.
          - path: postgresHA.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.minio.credentialsSecretName
            type: ref
            label: MinIO credentials secret
            required: true
            description: A dictionary secret with the keys `accessKey` and `secretKey`.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [accessKey, secretKey]
          - path: postgresHA.backup.minio.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          - rule: "!has(self.postgresHA.backup.minio.accessKey) && !has(self.postgresHA.backup.minio.secretKey)"
            paths: [postgresHA.backup.minio.credentialsSecretName]
            message: >-
              postgresHA.backup.minio.accessKey and secretKey were removed in 1.2.1. Put them in the MinIO
              credentials secret and remove them from the values.
    rules:
      - rule: self.postgresHA.enabled != self.postgres.enabled
        mirrors: twenty.validate
        paths: [postgresHA.enabled, postgres.enabled]
        message: Enable exactly one database, either the single-instance or the highly available PostgreSQL.
      - rule: "!self.postgresHA.enabled || !has(self.postgresHA.proxy) || !has(self.postgresHA.proxy.enabled)"
        mirrors: twenty.validate
        paths: [postgresHA.enabled]
        message: >-
          The HAProxy leader endpoint is how Twenty reaches the HA database, so it stays on: remove
          postgresHA.proxy.enabled from the values.
      - rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != null &&
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) != ''
        mirrors: twenty.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: The database credentials secret is required.
      - rule: "!has(self.postgres.credentials)"
        mirrors: twenty.validateDatabaseSecret
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          postgres.credentials was removed in 1.4.0: the database credentials are now a prerequisite
          dictionary secret named by the credentials secret field. Remove postgres.credentials from the values.
      - rule: "!has(self.postgresHA.postgres)"
        paths: [postgresHA.config.credentialsSecretName]
        message: >-
          postgresHA.postgres was removed in 1.2.0: put its username, password and database in the database
          credentials secret and remove the block from the values.
      - rule: >-
          !has(self.postgres.config.username) && !has(self.postgres.config.password) &&
          !has(self.postgres.config.database)
        paths: [postgres.config.credentialsSecretName]
        message: >-
          postgres.config.username, password and database were removed in 1.1.0: put them in the database
          credentials secret and remove them from the values.
      # Upgrading from 1.3.x or earlier, the chart-created secret is deleted by the upgrade itself, so the new
      # prerequisite secret must have a different name (holding the same username, password and database).
      - when: oldSelf != null && context.fromVersion != null && semverCompare(context.fromVersion, '1.4.0') < 0
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) !=
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          The previous version created the database secret itself, and this upgrade deletes it. Create a secret
          under a NEW name holding the same username, password and database, and name it here.
      - when: oldSelf != null && (context.fromVersion == null || semverCompare(context.fromVersion, '1.4.0') >= 0)
        rule: >-
          (self.postgresHA.enabled ? self.postgresHA.config.credentialsSecretName : self.postgres.config.credentialsSecretName) ==
          (oldSelf.postgresHA.enabled ? oldSelf.postgresHA.config.credentialsSecretName : oldSelf.postgres.config.credentialsSecretName)
        severity: info
        paths: [postgresHA.config.credentialsSecretName, postgres.config.credentialsSecretName]
        message: >-
          PostgreSQL reads the credentials only when its data is first initialized; pointing at another secret
          does not change the existing user or password.
      - rule: oldSelf == null || self.postgresHA.enabled == oldSelf.postgresHA.enabled
        severity: warning
        paths: [postgresHA.enabled, postgres.enabled]
        message: >-
          Switching the database on a running release points Twenty at a separate, empty database; the
          existing data is not migrated.

  - id: redis
    title: Redis
    description: The bundled single-node Redis for Twenty's job queues and cache.
    docs: "#redis"
    fields:
      - path: redis.image
        type: string
        format: image
        label: Redis image
        required: true
      - path: redis.auth.password
        type: string
        label: Redis password
        required: true
        sensitive: true
        widget: password
        pattern: '^[A-Za-z0-9_-]+$'
        patternMessage: Letters, digits, - and _ only; the password is part of the Redis connection URL.
        description: Stored in the release values. Change it before installing.
      - path: redis.resources
        type: resources
        label: Redis resources
        required: true
        maxRatio: 4
        cpu: { min: 25m }
        memory: { min: 32Mi }
      - path: redis.volumeset.capacity
        type: integer
        label: Initial capacity
        unit: GiB
        min: 10
        required: true
        suggestions: [10, 20, 50]
        help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
        docs: "/reference/volumeset#capacity-and-billing"
    rules:
      - rule: self.redis.auth.password != '' && self.redis.auth.password.matches('^[A-Za-z0-9_-]+$')
        mirrors: twenty.validate
        paths: [redis.auth.password]
        message: The Redis password may contain only letters, digits, - and _.
      - rule: oldSelf == null || self.redis.volumeset.capacity >= oldSelf.redis.volumeset.capacity
        paths: [redis.volumeset.capacity]
        message: A volume set cannot shrink. Keep the capacity at or above the installed size.

# Rules over the imported values: their issues show on the imported fields' step.
rules:
  - when: self.postgres.enabled
    rule: self.postgres.internalAccess.type != 'none'
    paths: [postgres.internalAccess.type]
    message: '"None" also blocks Twenty, which connects to its database like any other workload.'
  - when: self.postgres.enabled && self.postgres.internalAccess.type == 'workload-list' && context.gvc != null
    rule: >-
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-twenty') in self.postgres.internalAccess.workloads &&
      ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-twenty-worker') in self.postgres.internalAccess.workloads
    severity: warning
    paths: [postgres.internalAccess.workloads]
    messageExpression: >-
      'Add //gvc/' + context.gvc + '/workload/' + context.releaseName + '-twenty and //gvc/' + context.gvc +
      '/workload/' + context.releaseName + '-twenty-worker, or Twenty cannot reach its database.'
    message: Add the Twenty server and worker workloads to the list, or Twenty cannot reach its database.

yamlOnly:
  - path: postgres.pgbouncer
    reason: Twenty connects to <release>-postgres directly, so a PgBouncer in front of it would sit unused.

migrations:
  - fromVersions: "<1.4.0"
    from: postgres.credentials
    note: >-
      The database credentials are now a prerequisite dictionary secret (username, password, database). Create
      it under a NEW name with the values the database was initialized with, and choose it under Database.
  - fromVersions: "<1.2.0"
    from: postgresHA.postgres
    note: >-
      Put the username, password and database the HA database was initialized with in the database
      credentials secret, and choose it under Database.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.2.1"
    from: postgresHA.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.1.0"
    from: postgres.config.username
    note: Put it in the database credentials secret (key username); choose the secret under Database.
  - fromVersions: "<1.1.0"
    from: postgres.config.password
    note: Put it in the database credentials secret (key password). PostgreSQL keeps the password it was initialized with.
  - fromVersions: "<1.1.0"
    from: postgres.config.database
    note: Put it in the database credentials secret (key database); choose the secret under Database.
  - fromVersions: "<1.1.0"
    from: postgres.backup.minio.accessKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
  - fromVersions: "<1.1.0"
    from: postgres.backup.minio.secretKey
    note: MinIO keys moved to a dictionary secret with the keys accessKey and secretKey; choose it under Database backups.
