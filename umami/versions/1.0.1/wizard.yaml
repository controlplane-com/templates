# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Umami

# Umami itself is stateless, but both bundled databases are single-location stateful workloads with no
# location handling: postgres brings this limit with its import, and postgres-highly-available (no
# descriptor of its own, so its keys are parent fields below) needs the same.
gvc:
  minLocations: 1
  maxLocations: 1

imports:
  - template: postgres
    version: 3.3.0
    when: self.postgres.enabled
    title: Single-instance PostgreSQL
    after: database
    steps:
      - { id: server, title: Database server }
      - { id: storage, title: Database storage }
      - { id: network, title: Database network, description: Who can connect to the bundled PostgreSQL. }
      - { id: backup, title: Database backups }
    exclude:
      # Asked in the Database step below, next to the HA mode's credentials, so both modes ask for them in one place.
      - config.username
      - config.password
      - config.database
      # Umami connects to <release>-postgres directly: a pooler in front of it would sit unused (yamlOnly below).
      - pgbouncer
    override:
      internalAccess.type:
        description: >-
          Umami connects to its database like any other workload: keep Same GVC, or add the Umami workload
          under Allowed workloads.

steps:
  - id: umami
    title: Umami
    description: The Umami image, its compute, the app secret, and the tracker paths.
    sections:
      - title: Server
        fields:
          - path: image
            type: string
            format: image
            label: Umami image
            required: true
          # This version's block mixes cpu/memory (the limits) with minCpu/minMemory, so plain quantity fields
          # bind exactly the keys the workload reads.
          - path: resources.cpu
            type: quantity
            quantity: cpu
            label: Maximum CPU
            required: true
            min: 25m
            description: Per replica.
          - path: resources.minCpu
            type: quantity
            quantity: cpu
            label: Minimum CPU
            required: true
            min: 25m
          - path: resources.memory
            type: quantity
            quantity: memory
            label: Maximum memory
            required: true
            min: 32Mi
            description: Per replica.
          - path: resources.minMemory
            type: quantity
            quantity: memory
            label: Minimum memory
            required: true
            min: 32Mi
          - path: replicas
            type: integer
            label: Replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: >-
              Replicas are independent and share the database and the app secret; 2 or more give rolling
              restarts without downtime.
          - path: app.disableTelemetry
            type: boolean
            label: Turn off Umami's anonymous usage telemetry
        rules:
          - rule: cpuMillicores(self.resources.cpu) >= cpuMillicores(self.resources.minCpu)
            paths: [resources.minCpu]
            message: The minimum CPU cannot exceed the maximum CPU.
          - rule: memoryBytes(self.resources.memory) >= memoryBytes(self.resources.minMemory)
            paths: [resources.minMemory]
            message: The minimum memory cannot exceed the maximum memory.
          # Platform limit (nodelibs schema workload.ts): at most 8 MiB of memory per millicore of CPU.
          - rule: memoryBytes(self.resources.memory) <= 8 * 1048576 * cpuMillicores(self.resources.cpu)
            paths: [resources.memory]
            message: The maximum memory can be at most 8Mi per millicore of maximum CPU (for example 4Gi needs 512m).
          - rule: self.replicas >= 1
            mirrors: umami.validate
            paths: [replicas]
            message: Run at least one replica.
      - title: App secret
        fields:
          - type: note
            severity: warning
            text: >-
              The app secret is stored in the Helm release in plain text, and the chart writes it to the secret
              `RELEASE_NAME-umami-config`. Version 1.1.0 takes it from a secret you create instead.
          - path: app.appSecret
            type: string
            label: App secret
            required: true
            sensitive: true
            widget: password
            example: true
            description: A random string that signs auth tokens and sessions; replace the published default.
            help: >-
              Generate one with `openssl rand -base64 32`. Keep it for the life of the install; changing it logs
              every user out.
        rules:
          - rule: self.app.appSecret != ''
            mirrors: umami.validate
            paths: [app.appSecret]
            message: The app secret is required.
          - rule: oldSelf == null || self.app.appSecret == oldSelf.app.appSecret
            severity: info
            paths: [app.appSecret]
            message: Changing the app secret logs every user out.
      - title: Tracker
        docs: "#tracker"
        description: Custom paths for the tracking script and the collect endpoint make ad blockers less likely to block them.
        fields:
          - path: tracker.scriptName
            type: string
            label: Tracking script path
            placeholder: s.js
            description: Leave empty for the default `/script.js`.
          - path: tracker.collectEndpoint
            type: string
            label: Collect endpoint path
            placeholder: /api/track
            pattern: "^(/.*)?$"
            patternMessage: Start the path with /.
            description: Leave empty for the default `/api/send`.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Umami inside Control Plane.
    fields:
      - type: note
        severity: warning
        text: >-
          Umami seeds a fixed `admin` / `umami` login, and this version serves it on the public endpoint by
          default (1.1.0 turns public access off by default). Install privately, change that password over
          `cpln port-forward`, then turn on public access.
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The dashboard, the tracking script and the collect endpoint on the canonical endpoint. Tracking
          collects nothing until browsers on your sites can reach it.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: database
    title: Database
    description: Which PostgreSQL holds Umami's data, and the credentials it is created with.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgresHA.enabled && !self.postgres.enabled ? 'ha' : 'single'"
            options:
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica on a persistent volume; the default.
                set: { postgresHA.enabled: false, postgres.enabled: true }
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
          # Declared so the postgres import's condition is a field; the chooser above writes it.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
      - id: credentials
        title: Database credentials
        description: >-
          The login of whichever PostgreSQL is chosen above. The chosen database creates its secret from these
          values (<release>-postgres-config for the highly available one, <release>-pg-config for the
          single-instance one), and Umami reads it. There is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.4.0 takes them from a secret
              you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
            description: >-
              Umami puts it into its database connection URL, so use URL-safe characters (letters, digits, - and _).
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: >-
              Used as typed, so replace the published default. Umami puts it into its database connection URL, so
              use URL-safe characters (letters, digits, - and _).
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.config.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
            description: >-
              Umami puts it into its database connection URL, so use URL-safe characters (letters, digits, - and _).
          - path: postgres.config.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: >-
              Used as typed, so replace the published default. Umami puts it into its database connection URL, so
              use URL-safe characters (letters, digits, - and _).
          - path: postgres.config.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
        rules:
          # Umami builds DATABASE_URL from the user and password at container start and parses it as a URL.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.username == oldSelf.postgres.config.username) ||
              !self.postgres.config.username.matches('[:/?#%@]')
            severity: warning
            paths: [postgres.config.username]
            message: >-
              Leave out :, /, ?, #, % and @. Umami puts the user into its database connection URL, where they break it.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.password == oldSelf.postgres.config.password) ||
              !self.postgres.config.password.matches('[/?#%]')
            severity: warning
            paths: [postgres.config.password]
            message: >-
              Leave out /, ?, # and %. Umami puts the password into its database connection URL, where they break it.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              !self.postgresHA.postgres.username.matches('[:/?#%@]')
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Leave out :, /, ?, #, % and @. Umami puts the user into its database connection URL, where they break it.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              !self.postgresHA.postgres.password.matches('[/?#%]')
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              Leave out /, ?, # and %. Umami puts the password into its database connection URL, where they break it.
          # The HA database (postgres-highly-available 2.4.2) writes the user and password unquoted into an
          # unquoted shell heredoc that becomes Patroni's YAML config (loaded as YAML 1.1), and the user and
          # database name into an unquoted psql command and CREATE DATABASE (templates/secret-startup.yaml).
          # Reproduced by running the heredoc with sh and loading the result with PyYAML: $ and ` are expanded,
          # a \ before $ ` \ or at the end is consumed, YAML indicators at the start, ': ', ' #' and a lone
          # - ~ = break or alter the value, and numbers, dates, 1:30 and yes/no/on/off change type. Quotes, :
          # and ! inside the value are kept.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              [self.postgresHA.postgres.password].all(x,
              !x.matches('[$`]') && !x.matches('\\\\([$`\\\\]|$)') &&
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']) && !(x in ['~', '=', '<<']) &&
              !x.matches('^[-+]?([0-9][0-9_]*|0b[01_]+|0x[0-9a-fA-F_]+)$') &&
              !x.matches('^[-+]?([0-9][0-9_]*)?\\.[0-9_]*([eE][-+][0-9]+)?$') &&
              !x.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              The highly available database writes the password unquoted into a shell script and its YAML config.
              Leave out $ and `, a \ before $, ` or \ or at the end, a leading space or YAML symbol, ": " and " #", and
              values that read as a number, a date, yes/no, on/off, true/false, null or <<.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              (self.postgresHA.postgres.username.matches('^[A-Za-z_][A-Za-z0-9_.-]*$') &&
              !(self.postgresHA.postgres.username.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']))
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Use letters, digits, _ . and -, starting with a letter or underscore, and not yes/no, on/off,
              true/false or null. The highly available database writes the user unquoted into its YAML config and
              a psql command.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database) ||
              (self.postgresHA.postgres.database.matches('^[a-z_][a-z0-9_]*$') && size(self.postgresHA.postgres.database) <= 63 &&
              !(self.postgresHA.postgres.database in ['postgres','template0','template1','all','analyse','analyze','and','any','array','as','asc','asymmetric','authorization','binary','both','case','cast','check','collate','collation','column','concurrently','constraint','create','cross','current_catalog','current_date','current_role','current_schema','current_time','current_timestamp','current_user','default','deferrable','desc','distinct','do','else','end','except','false','fetch','for','foreign','freeze','from','full','grant','group','having','ilike','in','initially','inner','intersect','into','is','isnull','join','lateral','leading','left','like','limit','localtime','localtimestamp','natural','not','notnull','null','offset','on','only','or','order','outer','overlaps','placing','primary','references','returning','right','select','session_user','similar','some','symmetric','system_user','table','tablesample','then','to','trailing','true','union','unique','user','using','variadic','verbose','when','where','window','with']))
            severity: warning
            paths: [postgresHA.postgres.database]
            message: >-
              Use up to 63 lowercase letters, digits and underscores, starting with a letter or underscore, and
              not postgres, template0, template1 or an SQL reserved word such as user or order. The highly
              available database runs an unquoted CREATE DATABASE when it is first created: it folds other names
              to lowercase or fails, and a failure stops the cluster from being created, while Umami connects
              with the name as typed.
          # Umami's workload writes the database name unquoted at the end of its DATABASE_URL value: measured with
          # helm template + js-yaml, ' #' cuts the name off (Umami then connects to another database) and ': '
          # fails the render; ? / % change how Umami parses the URL.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.database == oldSelf.postgres.config.database) ||
              !self.postgres.config.database.matches('[\\s#?/%]') && !self.postgres.config.database.endsWith(':')
            severity: warning
            paths: [postgres.config.database]
            message: >-
              Use letters, digits, - and _ only. Umami writes the database name unquoted into its connection URL,
              where a space, #, ?, / or %, or a trailing colon, changes or breaks it.
          # The single-instance PostgreSQL's readiness probe runs pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          # through sh -c without quotes.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.username == oldSelf.postgres.config.username &&
              self.postgres.config.database == oldSelf.postgres.config.database) ||
              (!self.postgres.config.username.matches('\\s') && !self.postgres.config.database.matches('\\s'))
            severity: warning
            paths: [postgres.config.username, postgres.config.database]
            message: >-
              Leave out spaces: the database's readiness check passes the user and the database name to pg_isready
              unquoted, so it never becomes ready.
          - when: self.postgresHA.enabled
            rule: oldSelf == null || self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Umami loses its
              database connection after this upgrade.
          - when: self.postgres.enabled
            rule: oldSelf == null || self.postgres.config.password == oldSelf.postgres.config.password
            severity: info
            paths: [postgres.config.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Umami loses its
              database connection after this upgrade.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint that Umami connects through.
        fields:
          - type: note
            severity: warning
            text: >-
              The bundled highly available database creates the cluster with consensus timeouts that Patroni
              silently tightens, so a leader that cannot reach etcd for about 14 seconds is demoted.
          - type: note
            severity: warning
            text: >-
              The bundled highly available database writes the password into Patroni's shared configuration,
              which anything that can reach port 8008 of the members can read without authentication at `/config`.
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            max: 65536
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - type: note
            severity: warning
            when: self.postgresHA.backup.mode == 'wal-g'
            text: >-
              The bundled database's WAL-G sidecar waits a full interval before its first base backup, so a new
              cluster archives WAL with nothing to restore it from for up to that long, and turning WAL-G on for a
              cluster that already exists does not start WAL archiving.
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
        rules:
          - when: self.postgresHA.backup.mode == 'wal-g'
            rule: memoryBytes(self.postgresHA.backup.resources.memory) >= memoryBytes('512Mi')
            severity: warning
            paths: [postgresHA.backup.resources]
            message: >-
              Give the WAL-G sidecar at least 512Mi of memory. With less it is killed for running out of memory
              during the base backup and no backup is written.
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - type: note
            severity: warning
            text: >-
              The bundled database's backup identity also carries the AWS managed policy ReadOnlyAccess, which can
              read every bucket in the AWS account, not only this one.
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
        rules:
          # The logical backup job (postgres-highly-available templates/workload-logical-backup.yaml) writes the
          # prefix unquoted as its BACKUP_PREFIX env value, and backup.sh exits when it is empty.
          - when: self.postgresHA.backup.mode == 'logical'
            rule: self.postgresHA.backup.aws.prefix != null && self.postgresHA.backup.aws.prefix != ''
            severity: warning
            paths: [postgresHA.backup.aws.prefix]
            message: The logical backup job stops with an error when the prefix is empty.
          - when: self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.aws.prefix != null
            rule: >-
              (oldSelf != null && self.postgresHA.backup.aws.prefix == oldSelf.postgresHA.backup.aws.prefix) ||
              [self.postgresHA.backup.aws.prefix].all(x,
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x in ['true', 'True', 'TRUE', 'false', 'False', 'FALSE', 'null', 'Null', 'NULL', '~']) &&
              !x.matches('^[-+]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$') &&
              !x.matches('^[-+]?0(x[0-9a-fA-F]+|o[0-7]+|b[01]+)$') &&
