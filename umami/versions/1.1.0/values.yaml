image: ghcr.io/umami-software/umami:3.2.0

# Replica count for the stateless Umami app tier.
# 1 = proven single-instance shape. 2+ = always-on scaled tier for
# zero-downtime rolling restarts. Replicas are independent (no clustering);
# they only need the same database and the same app.appSecret.
replicas: 1

resources: # per replica
  cpu: 500m
  memory: 512Mi
  minCpu: 100m
  minMemory: 256Mi

# ─── Application ──────────────────────────────────────────────────────────────
app:
  # Name of an opaque secret (encoding: plain) holding the app secret, which signs
  # auth tokens and sessions — anyone holding it can forge a session. It never
  # transits values or the Helm release. The secret MUST EXIST BEFORE INSTALL or
  # the deployment wedges waiting on it; see README Prerequisites. Its value must
  # be stable for the life of the install (changing it logs everyone out).
  appSecretName: my-umami-app-secret
  disableTelemetry: true # opt out of Umami's anonymous usage telemetry

# ─── Tracker ──────────────────────────────────────────────────────────────────
tracker:
  scriptName: ""      # custom tracker script path, e.g. "s.js" (dodges ad blockers); "" = default /script.js
  collectEndpoint: "" # custom collect API path, e.g. "/api/track"; "" = default /api/send

# ─── Backing Store: single-instance PostgreSQL (default) ───────────────────────
postgres:
  enabled: true
  image: postgres:18
  config:
    username: umami
    password: change-me-umami-db # change before installing
    database: umami
  resources:
    minCpu: 250m
    maxCpu: 1
    minMemory: 512Mi
    maxMemory: 1Gi
  volumeset:
    capacity: 10 # initial capacity in GiB (minimum is 10)
  # Scheduled backups of the analytics database to object storage (off by default).
  # Pass-through to the postgres template's native backup — see README "Storage setup".
  backup:
    enabled: false
    image: ghcr.io/controlplane-com/backup-images/postgres-backup:18.1.0 # 18.1.0 = PG18, 17.1.0 = PG17
    schedule: "0 2 * * *"  # daily at 2am UTC
    resources:
      cpu: 100m
      memory: 128Mi
    provider: aws          # aws, gcp, or minio
    aws:
      bucket: my-backup-bucket
      region: us-east-1
      cloudAccountName: my-backup-cloudaccount
      policyName: my-backup-policy
      prefix: umami/backups
    gcp:
      bucket: my-backup-bucket
      cloudAccountName: my-backup-cloudaccount
      prefix: umami/backups
    minio:                 # any S3-compatible endpoint (e.g. an internal MinIO template)
      endpoint: http://my-minio-workload:9000
      bucket: my-backup-bucket
      accessKey: my-minio-username
      secretKey: my-minio-password
      prefix: umami/backups

# ─── Backing Store: Highly Available PostgreSQL (durable HA path) ──────────────
# Enable this and disable postgres for a Patroni-managed 3-replica store with
# automatic failover and an HAProxy leader endpoint.
postgresHA:
  enabled: false
  postgres:
    username: umami
    password: change-me-umami-db # change before installing
    database: umami
  replicas: 3
  volumeset:
    capacity: 10 # initial capacity in GiB per replica (minimum is 10)
  # Scheduled backups (off by default) — pass-through to the postgres-highly-available
  # template's native backup; see README "Storage setup".
  backup:
    enabled: false
    mode: logical          # logical or wal-g
    resources:
      cpu: 100m
      memory: 128Mi
    logical:
      image: ghcr.io/controlplane-com/backup-images/postgres-backup:17.1.0
      schedule: "0 2 * * *" # daily at 2am UTC
    walg:
      intervalSeconds: 21600 # every 6 hours
    provider: aws          # aws, gcp, or minio
    aws:
      bucket: my-backup-bucket
      region: us-east-1
      cloudAccountName: my-backup-cloudaccount
      policyName: my-backup-policy
      prefix: umami/backups
    gcp:
      bucket: my-backup-bucket
      cloudAccountName: my-backup-cloudaccount
      prefix: umami/backups
    minio:
      endpoint: http://my-minio-workload:9000
      bucket: my-backup-bucket
      accessKey: my-minio-username
      secretKey: my-minio-password
      prefix: umami/backups

# ─── Access ────────────────────────────────────────────────────────────────────
publicAccess:
  # false = nothing reaches Umami from the internet. Umami seeds a hardcoded
  # admin/umami account that cannot be overridden, so change that password over
  # internal access first, then set this true — browsers on the sites you track
  # must reach /script.js and /api/send for collection to work.
  enabled: false

internalAccess:
  type: same-gvc # options: none, same-gvc, same-org, workload-list
  workloads: []  # only used when type is same-gvc or workload-list
  # workloads:
  #   - //gvc/GVC_NAME/workload/WORKLOAD_NAME
