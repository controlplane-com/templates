# unleash 2.0.0 — the default install: highly available PostgreSQL (postgres-highly-available 3.0.0: three
# Patroni members, three etcd members, two HAProxy replicas), one Unleash replica, one location, both
# prerequisite secrets created by CI.
locations: [aws-us-east-1]
# HA first boot: Patroni elects a leader before Unleash can run its migrations (about 5-7 minutes).
timeoutSeconds: 1200

generated:
  pgpw: hex
  adminpw: hex

secrets:
  db:
    type: dictionary
    entries:
      username: unleash
      password: "{gen.pgpw}"
      database: unleash
  admin:
    type: dictionary
    entries:
      username: e2eadmin
      # Mixed character classes, in case Unleash applies its password policy to the seeded admin.
      password: "Aa1-{gen.adminpw}"

vars:
  pg_user: unleash
  pg_password: "{gen.pgpw}"
  pg_db: unleash
  admin_user: e2eadmin
  admin_password: "Aa1-{gen.adminpw}"

values:
  admin:
    secretName: "{secrets.admin.name}"
  postgresHA:
    config:
      credentialsSecretName: "{secrets.db.name}"

# Single-instance PostgreSQL (the opt-in mode), which 2.0.0 moves to PostgreSQL 19: one more fresh install.
variants:
  - name: single
    values:
      postgresHA:
        enabled: false
      postgres:
        enabled: true
        config:
          credentialsSecretName: "{secrets.db.name}"
    timeoutSeconds: 900

# 1.5.1 is the previous version (same values shape). Its baseline runs the HA database, so this upgrade
# moves postgres-highly-available 2.5.0 → 3.0.0, whose existing cluster keeps PostgreSQL 17: a plain
# upgrade. A refused single-instance upgrade from 1.5.1 is not expressible: the starting install always
# uses 1.5.1's own (HA) baseline.
upgradeFrom:
  - version: 1.5.1
