kind: secret
name: {{ include "unleash.secretStart.name" . }}
description: Unleash startup script (derives UNLEASH_URL from the canonical endpoint)
tags: {{- include "unleash.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
{{- if .Values.publicAccess.enabled }}
    # UNLEASH_URL feeds password-reset/signup/integration links, and the
    # canonical *.cpln.app hostname is only known at runtime — so derive it
    # here. CPLN_GLOBAL_ENDPOINT is already a full URL (https://...), NOT a
    # bare host — never prepend a second scheme.
    export UNLEASH_URL="${CPLN_GLOBAL_ENDPOINT}"
{{- else }}
    # No public endpoint — links point at the internal in-GVC address.
    export UNLEASH_URL="http://{{ include "unleash.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:4242"
{{- end }}
    # Wait for the database before starting. Unleash runs migrations immediately
    # on boot and does not retry: against postgres-highly-available it raced
    # Patroni's leader election and crash-looped for ~6 minutes with
    # "Failed to migrate db Error: read ECONNRESET", missing the readiness bar.
    # keycloak and listmonk already do this; unleash did not.
    i=0
    while [ "$i" -lt 60 ]; do
      if node -e "
        const net=require('net');
        const s=net.connect(Number(process.env.DATABASE_PORT||5432), process.env.DATABASE_HOST);
        s.on('connect',()=>{s.end();process.exit(0)});
        s.on('error',()=>process.exit(1));
        s.setTimeout(3000,()=>{s.destroy();process.exit(1)});
      " 2>/dev/null; then
        echo "database reachable after ${i}s"
        break
      fi
      i=$((i+2)); sleep 2
    done
    [ "$i" -lt 60 ] || echo "WARNING: database still unreachable after ${i}s — starting anyway"

    # Hand off to the image's own CMD (Dockerfile: WORKDIR /unleash,
    # CMD ["node", "dist/server.js"]); cd is defensive against WORKDIR drift.
    cd /unleash
    exec node dist/server.js
