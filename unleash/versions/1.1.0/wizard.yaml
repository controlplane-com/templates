# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Unleash

# Unleash itself is stateless, but both bundled databases are single-location stateful workloads with no
# location handling. Neither bundled chart (postgres 3.3.0, postgres-highly-available 2.4.2) has a
# descriptor in this repo, so their keys are parent fields below.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: unleash
    title: Unleash
    description: The Unleash image, its compute, and the prerequisite admin secret.
    sections:
      - title: Server
        fields:
          - type: note
            severity: warning
            text: >-
              In this version Unleash waits for its database with a TCP connect, which the platform mesh accepts
              before PostgreSQL is ready, so the first-boot migration can fail and Unleash restarts until the
              database is ready. Version 1.2.1 waits until PostgreSQL accepts queries.
          - path: image
            type: string
            format: image
            label: Unleash image
            required: true
          # This version names the limit resources.cpu / resources.memory next to the minimums, so the block is
          # four plain fields (the resources field type writes maxCpu/maxMemory, which this chart does not read).
          - path: resources.cpu
            type: quantity
            quantity: cpu
            label: Maximum CPU
            required: true
            min: 25m
            description: Per replica.
          - path: resources.minCpu
            type: quantity
            quantity: cpu
            label: Minimum CPU
            required: true
            min: 25m
          - path: resources.memory
            type: quantity
            quantity: memory
            label: Maximum memory
            required: true
            min: 32Mi
          - path: resources.minMemory
            type: quantity
            quantity: memory
            label: Minimum memory
            required: true
            min: 32Mi
          - path: replicas
            type: integer
            label: Replicas
            required: true
            min: 1
            suggestions: [1, 2, 3]
            description: The server is stateless; every replica serves the UI and the APIs from the same database.
        rules:
          # Platform workload schema: a minimum above its maximum is refused, and so is more than 8 MiB of
          # memory per millicore of CPU.
          - rule: >-
              cpuMillicores(self.resources.cpu) >= cpuMillicores(self.resources.minCpu) &&
              memoryBytes(self.resources.memory) >= memoryBytes(self.resources.minMemory)
            paths: [resources.minCpu, resources.minMemory]
            message: The minimum CPU and memory cannot exceed their maximum.
          - rule: memoryBytes(self.resources.memory) <= 8 * 1048576 * cpuMillicores(self.resources.cpu)
            paths: [resources.memory]
            message: Control Plane allows at most 8 MiB of memory per millicore of CPU; raise the CPU or lower the memory.
      - title: Admin account and API tokens
        docs: "#admin-account-and-api-tokens"
        fields:
          - type: note
            severity: warning
            text: >-
              The admin secret must exist **before** you install. If it is missing, the deployment waits and
              `cpln logs` shows nothing at all.
          - path: admin.secretName
            type: ref
            label: Admin secret
            required: true
            description: A dictionary secret with the keys `username` and `password`.
            help: >-
              Seeded on first boot only: the account then lives in the database, so change the password in the
              admin UI, not in the secret.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [username, password]
              create:
                suggestName: "context.releaseName + '-unleash-admin-credentials'"
          - path: apiTokens.secretName
            type: ref
            label: SDK API tokens secret
            description: >-
              Optional. A dictionary secret with the keys `backend` and `frontend`, each a token in the form
              `project:environment.secret`. Leave empty to create tokens in the admin UI instead.
            help: Seeded on first boot only; manage tokens in the admin UI afterwards.
            ref:
              kind: secret
              format: name
              filter: { secretType: [dictionary] }
              mustExist: error
              allowCreate: true
              requiredKeys: [backend, frontend]
              create:
                suggestName: "context.releaseName + '-unleash-api-tokens'"
        rules:
          # 1.0.x rendered its own admin secret named <release>-unleash-admin; upgrading to 1.1.0 or later
          # prunes it, so a release pointed at that name would reference a secret the upgrade deletes.
          - rule: >-
              context.mode != 'upgrade' || context.fromVersion == null ||
              semverCompare(context.fromVersion, '1.1.0') >= 0 ||
              self.admin.secretName != context.releaseName + '-unleash-admin'
            paths: [admin.secretName]
            message: >-
              That secret belongs to the 1.0.x release, and this upgrade deletes it. Create a new dictionary
              secret with the keys username and password and choose it here.
          - rule: "!has(self.admin.username) && !has(self.admin.password)"
            mirrors: unleash.validateAdmin
            paths: [admin.secretName]
            message: >-
              admin.username and admin.password were removed in 1.1.0. Put them in the admin secret and remove
              them from the values.

  - id: access
    title: Access
    description: The public endpoint, and which workloads can reach Unleash inside Control Plane.
    docs: "#access"
    fields:
      - path: publicAccess.enabled
        type: boolean
        label: Serve on the public HTTPS endpoint
        description: >-
          The admin UI and the SDK APIs on the canonical endpoint. Browser and external SDKs call
          `/api/frontend` and `/api/client` there.
      - path: internalAccess.type
        type: enum
        label: Who can connect internally
        widget: cards
        required: true
        description: Firewall changes take 30 seconds to a few minutes to take effect.
        options:
          - value: none
            label: None
            description: No workload can connect.
          - value: same-gvc
            label: Same GVC
            description: Any workload in this GVC.
          - value: same-org
            label: Same org
            description: Any workload in this org.
          - value: workload-list
            label: Specific workloads
            description: Only the workloads listed below.
      - path: internalAccess.workloads
        type: list
        label: Allowed workloads
        when: self.internalAccess.type == 'workload-list'
        widget: tags
        item:
          type: ref
          ref:
            kind: workload
            gvc: any
            format: relativeLink
            mustExist: warning
    rules:
      - rule: self.internalAccess.type in ['none', 'same-gvc', 'same-org', 'workload-list'] && self.replicas >= 1
        mirrors: unleash.validate
        paths: [internalAccess.type]
        message: Choose who can connect internally.
      - rule: self.internalAccess.type != 'workload-list' || size(self.internalAccess.workloads) > 0
        severity: info
        paths: [internalAccess.workloads]
        message: With "Specific workloads" and an empty list, no workload inside Control Plane can connect.

  - id: database
    title: Database
    description: Which PostgreSQL runs Unleash's data, its login, storage and backups.
    sections:
      - fields:
          - id: dbMode
            virtual: true
            type: enum
            label: Database
            widget: cards
            required: true
            init: "self.postgres.enabled && !self.postgresHA.enabled ? 'single' : 'ha'"
            options:
              - value: ha
                label: Highly available PostgreSQL
                description: Three Patroni replicas with automatic failover, etcd and an HAProxy leader endpoint.
                set: { postgresHA.enabled: true, postgres.enabled: false }
              - value: single
                label: Single-instance PostgreSQL
                description: One PostgreSQL replica; lighter, without failover.
                set: { postgresHA.enabled: false, postgres.enabled: true }
          # Declared so the database choice is stored in the values; the chooser above writes them.
          - path: postgres.enabled
            type: boolean
            label: Single-instance PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
          - path: postgresHA.enabled
            type: boolean
            label: Highly available PostgreSQL on
            readOnly: true
            advanced: true
            description: Set by the database choice above.
      - id: credentials
        title: Database credentials
        description: >-
          The login of whichever PostgreSQL is chosen above. The chosen database creates its secret from these
          values (<release>-postgres-config for the highly available one, <release>-pg-config for the
          single-instance one), and Unleash reads it. There is nothing to create first.
        fields:
          - type: note
            severity: warning
            text: >-
              These values are stored in the Helm release in plain text. Version 1.5.0 takes them from a secret
              you create instead.
          - path: postgresHA.postgres.username
            type: string
            label: Database user
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgresHA.postgres.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgresHA.enabled
            description: Used as typed, so replace the published default.
            help: >-
              PostgreSQL keeps the password it was initialized with, so change it with `ALTER ROLE` before you
              change it here. The replication user `repl` uses the same password, so change that role too.
          - path: postgresHA.postgres.database
            type: string
            label: Database name
            required: true
            when: self.postgresHA.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
          - path: postgres.config.username
            type: string
            label: Database user
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this user once, when its data is first initialized.
          - path: postgres.config.password
            type: string
            label: Database password
            required: true
            sensitive: true
            widget: password
            example: true
            when: self.postgres.enabled
            description: Used as typed, so replace the published default.
            help: PostgreSQL keeps the password it was initialized with, so change it with `ALTER ROLE` before you change it here.
          - path: postgres.config.database
            type: string
            label: Database name
            required: true
            when: self.postgres.enabled
            immutable: PostgreSQL creates this database once, when its data is first initialized.
        rules:
          # The single-instance PostgreSQL's readiness probe runs pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          # through sh -c without quotes (postgres 3.3.0 templates/workload-postgres.yaml).
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.database == oldSelf.postgres.config.database) ||
              !self.postgres.config.database.matches('\\s')
            severity: warning
            paths: [postgres.config.database]
            message: >-
              Leave out spaces: the database's readiness probe passes the name to pg_isready unquoted, so it
              never becomes ready.
          - when: self.postgres.enabled
            rule: >-
              (oldSelf != null && self.postgres.config.username == oldSelf.postgres.config.username) ||
              !self.postgres.config.username.matches('\\s')
            severity: warning
            paths: [postgres.config.username]
            message: >-
              Leave out spaces: the database's readiness probe passes the user name to pg_isready unquoted, so
              it never becomes ready.
          # The HA database (postgres-highly-available 2.4.2) writes the user and password unquoted into an
          # unquoted shell heredoc that becomes Patroni's YAML config (loaded as YAML 1.1), and the user and
          # database name into an unquoted psql command and CREATE DATABASE (templates/secret-startup.yaml).
          # Reproduced by running the heredoc with sh and loading the result with PyYAML: $ and ` are expanded,
          # a \ before $ ` \ or at the end is consumed, YAML indicators at the start, ': ', ' #' and a lone
          # - ~ = break or alter the value, and numbers, dates, 1:30 and yes/no/on/off change type. Quotes, :
          # and ! inside the value are kept.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password) ||
              [self.postgresHA.postgres.password].all(x,
              !x.matches('[$`]') && !x.matches('\\\\([$`\\\\]|$)') &&
              !x.matches('^\\s') && !x.matches("^[!&*%@`'\"\\[\\]{}|>,#]") && !x.matches('^[-?:](\\s|$)') &&
              !x.matches('\\t') && !x.contains(': ') && !x.contains(' #') && !x.endsWith(':') && !x.endsWith(' ') &&
              !(x.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']) && !(x in ['~', '=', '<<']) &&
              !x.matches('^[-+]?([0-9][0-9_]*|0b[01_]+|0x[0-9a-fA-F_]+)$') &&
              !x.matches('^[-+]?([0-9][0-9_]*)?\\.[0-9_]*([eE][-+][0-9]+)?$') &&
              !x.matches('^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\\.[0-9_]*)?$') &&
              !x.matches('^[-+]?\\.(inf|Inf|INF)$') && !x.matches('^\\.(nan|NaN|NAN)$') &&
              !x.matches('^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt\\s]|$)'))
            severity: warning
            paths: [postgresHA.postgres.password]
            message: >-
              The highly available database writes the password unquoted into a shell script and its YAML config.
              Leave out $ and `, a \ before $, ` or \ or at the end, a leading space or YAML symbol, ": " and " #", and
              values that read as a number, a date, yes/no, on/off, true/false, null or <<.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.username == oldSelf.postgresHA.postgres.username) ||
              (self.postgresHA.postgres.username.matches('^[A-Za-z_][A-Za-z0-9_.-]*$') &&
              !(self.postgresHA.postgres.username.lowerAscii() in ['true', 'false', 'null', 'yes', 'no', 'on', 'off']))
            severity: warning
            paths: [postgresHA.postgres.username]
            message: >-
              Use letters, digits, _ . and -, starting with a letter or underscore, and not yes/no, on/off,
              true/false or null. The highly available database writes the user unquoted into its YAML config and
              a psql command.
          - when: self.postgresHA.enabled
            rule: >-
              (oldSelf != null && self.postgresHA.postgres.database == oldSelf.postgresHA.postgres.database) ||
              self.postgresHA.postgres.database.matches('^[a-z_][a-z0-9_]*$')
            severity: warning
            paths: [postgresHA.postgres.database]
            message: >-
              Use lowercase letters, digits and underscores, starting with a letter or underscore. The highly
              available database creates it with an unquoted CREATE DATABASE, which folds the name to lowercase,
              while Unleash connects with the name as typed.
          - when: self.postgresHA.enabled
            rule: oldSelf == null || self.postgresHA.postgres.password == oldSelf.postgresHA.postgres.password
            severity: info
            paths: [postgresHA.postgres.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Unleash loses its
              database connection after this upgrade.
          - when: self.postgres.enabled
            rule: oldSelf == null || self.postgres.config.password == oldSelf.postgres.config.password
            severity: info
            paths: [postgres.config.password]
            message: >-
              PostgreSQL keeps the password it was initialized with. Run ALTER ROLE first, or Unleash loses its
              database connection after this upgrade.
      - id: single
        title: Single-instance PostgreSQL
        when: self.postgres.enabled
        description: One PostgreSQL replica on a persistent volume set.
        fields:
          - path: postgres.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            help: Uninstalling the release deletes the volume set, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgres.volumeset.capacity >= oldSelf.postgres.volumeset.capacity
            paths: [postgres.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: single-backup
        title: Database backups
        toggle: postgres.backup.enabled
        when: self.postgres.enabled
        description: A scheduled logical dump of the single-instance PostgreSQL to object storage.
        fields:
          - path: postgres.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgres.backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            pattern: '^\s*[0-9][0-9*,/-]*(\s+[0-9*,/-]+){4}\s*$'
            patternMessage: >-
              Use five fields of numbers, *, ranges, steps and lists, starting with a digit: this version writes
              the schedule unquoted, so a schedule that starts with * (such as */15 * * * *) fails to install.
              Write 0,15,30,45 * * * * instead.
          - path: postgres.backup.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            description: Tag 18.x.x for the bundled PostgreSQL 18.
          - path: postgres.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'aws'
        fields:
          - path: postgres.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgres.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgres.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgres.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgres.backup.aws.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'gcp'
        fields:
          - path: postgres.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgres.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account can write to the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgres.backup.gcp.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: MinIO or S3-compatible
        when: self.postgres.enabled && self.postgres.backup.enabled && self.postgres.backup.provider == 'minio'
        fields:
          - type: note
            severity: warning
            text: >-
              The access and secret keys are stored in the Helm release in plain text. Version 1.2.0 takes them
              from a secret you create instead.
          - path: postgres.backup.minio.endpoint
            type: string
            format: url
            label: S3 endpoint
            required: true
            example: true
            placeholder: http://my-minio-workload.GVC_NAME.cpln.local:9000
            description: The URL including the port.
          - path: postgres.backup.minio.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgres.backup.minio.accessKey
            type: string
            label: Access key
            required: true
            example: true
          - path: postgres.backup.minio.secretKey
            type: string
            label: Secret key
            required: true
            sensitive: true
            widget: password
            example: true
          - path: postgres.backup.minio.prefix
            type: string
            label: Folder prefix
            required: true
            description: The backup job stops with an error when the prefix is empty.
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - id: ha
        title: Highly available PostgreSQL
        when: self.postgresHA.enabled
        description: >-
          3 Patroni replicas, 3 etcd replicas and an HAProxy leader endpoint that Unleash connects through.
          Recommended for production.
        fields:
          - path: postgresHA.replicas
            type: integer
            label: PostgreSQL replicas
            required: true
            min: 1
            suggestions: [3, 5]
            description: Patroni replicas; one is the leader, the others are standbys ready to take over.
          - path: postgresHA.volumeset.capacity
            type: integer
            label: Initial capacity
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500, 1000]
            description: Per replica.
            help: Uninstalling the release deletes the volume sets, so the data does not survive a reinstall.
            docs: "/reference/volumeset#capacity-and-billing"
        rules:
          - rule: oldSelf == null || self.postgresHA.volumeset.capacity >= oldSelf.postgresHA.volumeset.capacity
            paths: [postgresHA.volumeset.capacity]
            message: A volume set cannot shrink. Keep the capacity at or above the installed size.
      - id: ha-backup
        title: Database backups
        toggle: postgresHA.backup.enabled
        when: self.postgresHA.enabled
        description: Logical dumps on a schedule, or continuous WAL-G archiving, to object storage.
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.mode
            type: enum
            label: Backup mode
            widget: segmented
            required: true
            options:
              - { value: logical, label: Logical dumps }
              - { value: wal-g, label: WAL-G }
          - path: postgresHA.backup.provider
            type: enum
            label: Destination
            widget: cards
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
              - { value: minio, label: MinIO or S3-compatible }
          - path: postgresHA.backup.logical.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
            when: self.postgresHA.backup.mode == 'logical'
          - path: postgresHA.backup.walg.intervalSeconds
            type: integer
            label: Interval between base backups
            unit: s
            min: 60
            required: true
            when: self.postgresHA.backup.mode == 'wal-g'
            suggestions: [3600, 21600, 86400]
          - path: postgresHA.backup.logical.image
            type: string
            format: image
            label: Backup image
            required: true
            advanced: true
            when: self.postgresHA.backup.mode == 'logical'
            description: Tag 17.x.x for the bundled PostgreSQL 17.
          - path: postgresHA.backup.resources
            type: resources
            label: Backup resources
            required: true
            advanced: true
      - title: AWS S3
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'aws'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: postgresHA.backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: postgresHA.backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) that can reach the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: postgresHA.backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
          - path: postgresHA.backup.aws.prefix
            type: string
            label: Folder prefix
            pattern: "^(?!/)"
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp'
        docs: "#backing-up"
        fields:
          - path: postgresHA.backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
          - path: postgresHA.backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) whose service account has the Storage Admin
              role on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: postgresHA.backup.gcp.prefix
            type: string
            label: Folder prefix
