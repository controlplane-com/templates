      - when: self.postgresHA.enabled && self.postgresHA.backup.enabled && self.postgresHA.backup.provider == 'gcp' && self.postgresHA.backup.mode == 'logical' && self.postgresHA.backup.gcp.prefix != null
        rule: >-
