kind: secret
name: {{ include "unleash.secretStart.name" . }}
description: Unleash startup script (derives UNLEASH_URL from the canonical endpoint)
tags: {{- include "unleash.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/sh
    set -eu
{{- if .Values.publicAccess.enabled }}
    # UNLEASH_URL feeds password-reset/signup/integration links, and the
    # canonical *.cpln.app hostname is only known at runtime — so derive it
    # here. CPLN_GLOBAL_ENDPOINT is already a full URL (https://...), NOT a
    # bare host — never prepend a second scheme.
    export UNLEASH_URL="${CPLN_GLOBAL_ENDPOINT}"
{{- else }}
    # No public endpoint — links point at the internal in-GVC address.
    export UNLEASH_URL="http://{{ include "unleash.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local:4242"
{{- end }}
    # Wait until Postgres accepts SQL — not merely a TCP connection. Unleash runs
    # migrations immediately on boot and does not retry, so it raced Patroni's
    # leader election and failed with "Failed to migrate db ... Connection
    # terminated unexpectedly".
    #
    # 1.2.0 checked this with a TCP connect, which was the wrong instrument: the
    # mesh accepts the connection before Postgres accepts queries, so the check
    # reported "reachable after 0s" and the migration still failed twice. A real
    # query is the only thing that answers the question being asked.
    #
    # Runs from /unleash so `pg` resolves out of the app's own node_modules. If it
    # cannot be resolved the loop exits immediately rather than blocking boot —
    # a missing probe must never be worse than no probe.
    #
    # The cap is 300s, not 90s. Measured 2026-08-19: against postgres-highly-available
    # Patroni took 232s to accept SQL. A 90s cap expired and handed control to Unleash
    # at exactly the wrong moment, reproducing the same two migration failures the probe
    # exists to prevent. The cap costs a fast start nothing — the loop exits the moment
    # SQL works (33s on single-instance in the same run).
    cd /unleash
    if node -e "require('pg')" 2>/dev/null; then
      i=0
      while [ "$i" -lt 300 ]; do
        if node -e "
          const { Client } = require('pg');
          const c = new Client({
            host: process.env.DATABASE_HOST,
            port: Number(process.env.DATABASE_PORT || 5432),
            user: process.env.DATABASE_USERNAME,
            password: process.env.DATABASE_PASSWORD,
            database: process.env.DATABASE_NAME,
            ssl: String(process.env.DATABASE_SSL) === 'true',
            connectionTimeoutMillis: 4000,
          });
          c.connect()
            .then(() => c.query('select 1'))
            .then(() => c.end())
            .then(() => process.exit(0))
            .catch(() => process.exit(1));
        " 2>/dev/null; then
          echo "database accepting SQL after ${i}s"
          break
        fi
        i=$((i+3)); sleep 3
      done
      [ "$i" -lt 300 ] || echo "WARNING: database not accepting SQL after ${i}s — starting anyway; migrations will likely fail and Unleash will restart"
    else
      echo "NOTE: pg client not resolvable — skipping the readiness probe"
    fi

    # Hand off to the image's own CMD (Dockerfile: WORKDIR /unleash,
    # CMD ["node", "dist/server.js"]); cd is defensive against WORKDIR drift.
    cd /unleash
    exec node dist/server.js
