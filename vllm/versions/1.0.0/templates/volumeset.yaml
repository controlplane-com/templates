kind: volumeset
name: {{ include "vllm.volume.name" . }}
gvc: {{ .Values.global.cpln.gvc }}
description: vLLM model cache (Hugging Face downloads and compile cache), one volume per replica
tags: {{- include "vllm.tags" . | nindent 4 }}
spec:
  fileSystemType: ext4
  initialCapacity: {{ .Values.volumeset.capacity | int }}
  performanceClass: general-purpose-ssd
  # A re-downloadable cache: no scheduled snapshots and no final snapshot on uninstall.
  snapshots:
    createFinalSnapshot: false
    retentionDuration: 1d
