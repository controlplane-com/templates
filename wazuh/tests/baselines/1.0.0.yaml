# wazuh 1.0.0 — the default production shape at the smallest size that runs: one manager (master), one indexer
# node and one dashboard, plus the demo agent so the whole pipeline (enrollment, events, analysis, indexing) is
# provable. Both public endpoints are off: CI drives everything by exec and the demo agent enrolls over internal
# DNS. Every credential is generated by CI; the fixed prefixes satisfy the password policy (starts with a
# letter, upper + lower + digit + symbol) and the hex cluster key is exactly 32 characters.
locations: [aws-us-east-1]
timeoutSeconds: 1500

generated:
  p1: hex
  p2: hex
  p3: hex
  p4: hex
  ck: hex
  cs: hex

secrets:
  creds:
    type: dictionary
    entries:
      indexerAdminPassword: "Wz1.{gen.p1}"
      dashboardServerPassword: "Wz2.{gen.p2}"
      apiPassword: "Wz3.{gen.p3}"
      enrollmentPassword: "Wz4.{gen.p4}"
      clusterKey: "{gen.ck}"
      dashboardCookieSecret: "Wzc.{gen.cs}{gen.cs}"

values:
  credentialsSecretName: "{secrets.creds.name}"
  demoAgent:
    enabled: true
  dashboard:
    publicAccess:
      enabled: false
  manager:
    publicAccess:
      enabled: false

# New template: no earlier version to upgrade from.
