{{- include "wazuh.validate" . -}}
{{- if .Values.demoAgent.enabled }}
kind: workload
name: {{ include "wazuh.demoAgent.name" . }}
gvc: {{ .Values.global.cpln.gvc }}
description: Wazuh demo agent (enrolls and sends sample events)
tags: {{- include "wazuh.tags" . | nindent 4 }}
spec:
  type: standard
  identityLink: //identity/{{ include "wazuh.identity.name" . }}
  containers:
    - name: agent
      image: {{ .Values.demoAgent.image }}
      inheritEnv: false
      cpu: {{ .Values.demoAgent.resources.cpu | quote }}
      memory: {{ .Values.demoAgent.resources.memory | quote }}
      command: /bin/bash
      args:
        - "-c"
        - {{ include "wazuh.inlineScript" (include "wazuh.script.demoAgent" .) | toJson }}
      env:
        - name: WAZUH_MANAGER_SERVER
          value: {{ printf "%s.%s.cpln.local" (include "wazuh.agentTarget.name" .) .Values.global.cpln.gvc }}
        - name: WAZUH_REGISTRATION_PASSWORD
          value: cpln://secret/{{ .Values.credentialsSecretName }}.enrollmentPassword
        - name: WAZUH_REGISTRATION_SERVER
          value: {{ include "wazuh.manager.host" . }}
  defaultOptions:
    autoscaling:
      maxConcurrency: 0
      maxScale: 1
      metric: disabled
      minScale: 1
      scaleToZeroDelay: 300
      target: 100
    capacityAI: false
    debug: false
    suspend: false
    timeoutSeconds: 5
  firewallConfig:
    external:
      inboundAllowCIDR: []
      inboundBlockedCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowHostname: []
      outboundBlockedCIDR: []
    internal:
      inboundAllowType: none
      inboundAllowWorkload: []
  rolloutOptions:
    maxSurgeReplicas: "1"
    maxUnavailableReplicas: "0"
    minReadySeconds: 0
    scalingPolicy: Parallel
    terminationGracePeriodSeconds: 90
{{- end }}
