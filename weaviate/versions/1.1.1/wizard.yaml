# yaml-language-server: $schema=../../../.schema/wizard.v1.schema.json
apiVersion: template-wizard.controlplane.com/v1
kind: TemplateWizard
title: Weaviate
# One stateful Raft cluster with no location handling: replicas join the cluster through replica 0 of
# their own location, so every GVC location would run a separate cluster with its own volumes.
gvc:
  minLocations: 1
  maxLocations: 1

steps:
  - id: authentication
    title: Authentication
    description: The prerequisite secret with the API key every client sends, and the user it maps to.
    fields:
      - type: note
        severity: warning
        when: >-
          context.mode == 'install' ||
          (context.fromVersion != null && semverCompare(context.fromVersion, '1.1.0') < 0)
        textExpression: >-
          'The API key secret must exist **before** you install or upgrade. If it is missing, the ' +
          'deployment waits on it and `cpln logs` shows nothing at all; the reason is in ' +
          '`cpln workload get-deployments ' + context.releaseName + '-weaviate --gvc ' +
          (context.gvc != null ? context.gvc : 'GVC_NAME') + '` under `status.versions[].message`. ' +
          'It recovers on its own within about 10 minutes of the secret being created, or at once with ' +
          '`cpln workload force-redeployment ' + context.releaseName + '-weaviate --gvc ' +
          (context.gvc != null ? context.gvc : 'GVC_NAME') + '`.'
        text: >-
          The API key secret must exist **before** you install or upgrade. If it is missing, the deployment
          waits on it and `cpln logs` shows nothing at all; the reason is in
          `cpln workload get-deployments RELEASE_NAME-weaviate --gvc GVC_NAME` under
          `status.versions[].message`. It recovers on its own within about 10 minutes of the secret being
          created, or at once with `cpln workload force-redeployment RELEASE_NAME-weaviate --gvc GVC_NAME`.
      - type: note
        severity: warning
        when: >-
          context.mode == 'upgrade' && context.fromVersion != null &&
          semverCompare(context.fromVersion, '1.1.0') < 0
        textExpression: >-
          'Version 1.1.0 moved the API key out of the values and into the secret below. Versions 1.0.0 and ' +
          '1.0.1 shipped a working API key as the default value, published in the public template repository ' +
          'and shared by every install that kept it. It is the only authentication Weaviate has, so treat the ' +
          'key of this release as compromised: create the secret below with a **new** key, and update every ' +
          'client after the upgrade. A key you set yourself also travelled in the Helm release, so rotate it too. ' +
          'The old key and any AI provider keys live in `' + context.releaseName + '-weaviate-credentials` ' +
          '(keys `api-key`, `openai-api-key`, `anthropic-api-key`, `cohere-api-key` and `huggingface-api-key`), ' +
          'and the upgrade removes them from it: read them first with `cpln secret reveal ' + context.releaseName +
          '-weaviate-credentials -o yaml` if you need them. See ' +
          '[Upgrading From 1.0.1 or Earlier](/template-catalog/templates/weaviate#upgrading-from-1-0-1-or-earlier).'
        text: >-
          Version 1.1.0 moved the API key out of the values and into the secret below. Versions 1.0.0 and
          1.0.1 shipped a working API key as the default value, published in the public template repository
          and shared by every install that kept it. It is the only authentication Weaviate has, so treat the
          key of this release as compromised: create the secret below with a **new** key, and update every
          client after the upgrade. A key you set yourself also travelled in the Helm release, so rotate it
          too. The old key and any AI provider keys live in `RELEASE_NAME-weaviate-credentials` (keys
          `api-key`, `openai-api-key`, `anthropic-api-key`, `cohere-api-key` and `huggingface-api-key`), and
          the upgrade removes them from it: read them first with
          `cpln secret reveal RELEASE_NAME-weaviate-credentials -o yaml` if you need them. See
          [Upgrading From 1.0.1 or Earlier](/template-catalog/templates/weaviate#upgrading-from-1-0-1-or-earlier).
      - path: apiKeySecretName
        type: ref
        label: API key secret
        required: true
        description: >-
          An opaque secret (encoding plain) whose whole content is the API key. Every client sends it as
          `Authorization: Bearer <key>`; there is no anonymous access. Keep your own copy: losing it locks
          you out of every collection.
        help: >-
          Create it with
          `printf '%s' "$(openssl rand -hex 32)" | cpln secret create-opaque --name API_KEY_SECRET_NAME --encoding plain -f -`.
          To rotate the key, change the secret, then run
          `cpln workload force-redeployment RELEASE_NAME-weaviate --gvc GVC_NAME`: until then the old key
          keeps working and the new one does not.
        docs: "#authentication"
        ref:
          kind: secret
          format: name
          filter: { secretType: [opaque] }
          mustExist: error
          allowCreate: true
          create:
            encoding: plain
            suggestName: "context.releaseName + '-weaviate-api-key'"
            hint: "Generate the key with: openssl rand -hex 32"
      - path: apiUser
        type: string
        label: API user
        required: true
        description: >-
          The user the API key maps to, and the one admin of the cluster. It is an identity, not a secret.
    rules:
      - rule: self.apiKeySecretName != null && self.apiKeySecretName != ''
        mirrors: weaviate.validate
        paths: [apiKeySecretName]
        message: The API key secret is required.
      - rule: self.apiUser != null && self.apiUser != ''
        mirrors: weaviate.validate
        paths: [apiUser]
        message: The API user is required.
      - rule: "!has(self.apiKey)"
        mirrors: weaviate.validate
        paths: [apiKeySecretName]
        message: >-
          apiKey was removed in 1.1.0, and the chart refuses it. Put a new key in an opaque secret, choose
          it as the API key secret, and remove apiKey from the values.
      - rule: >-
          oldSelf == null || context.fromVersion == null || semverCompare(context.fromVersion, '1.1.0') < 0 ||
          self.apiKeySecretName == oldSelf.apiKeySecretName
        severity: info
        paths: [apiKeySecretName]
        message: >-
          Another secret means another key, unless it holds the same one: every client must then send the
          new key, and the backup job uses it from its next run. The change restarts the cluster.

  - id: cluster
    title: Cluster
    description: The Weaviate nodes, their image and their compute.
    fields:
      - type: note
        severity: warning
        when: context.mode == 'upgrade' && self.replicas > 1
        textExpression: >-
          'An upgrade that changes the workload restarts the nodes one at a time, and a node can fail to ' +
          'rejoin the Raft cluster while still reporting ready, so about one request in ' + string(self.replicas) +
          ' then fails with 404 for collections that exist. Take a backup first, and after the upgrade check ' +
          'the cluster from inside `' + context.releaseName + '-weaviate` as described in ' +
          '[Scaling and Availability](/template-catalog/templates/weaviate#scaling-and-availability).'
        text: >-
          An upgrade that changes the workload restarts the nodes one at a time, and a node can fail to rejoin
          the Raft cluster while still reporting ready, so some requests then fail with 404 for collections
          that exist. Take a backup first, and after the upgrade check the cluster as described in
          [Scaling and Availability](/template-catalog/templates/weaviate#scaling-and-availability).
      - path: replicas
        type: integer
        label: Nodes
        min: 1
        required: true
        suggestions: [1, 3, 5]
        description: >-
          Each node has its own volume. Raft needs a majority of the nodes to elect a leader and accept
          schema changes, so three nodes survive the loss of one. A single node has no cluster membership
          to lose on a restart.
        docs: "#scaling-and-availability"
      - path: multiZone.enabled
        type: boolean
        label: Spread nodes across availability zones
        description: The location must support multiple zones.
        docs: "#placement"
      - path: image
        type: string
        format: image
        label: Weaviate image
        required: true
        docs: "#cluster"
      - path: cpu
        type: quantity
        quantity: cpu
        label: CPU per node
        required: true
        min: 25m
        suggestions: ["1", "2", "4", "8"]
        docs: "#resources"
      - path: memory
        type: quantity
        quantity: memory
        label: Memory per node
        required: true
        min: 32Mi
        suggestions: [2Gi, 4Gi, 8Gi, 16Gi, 32Gi]
        description: >-
          Vector indexes live in memory, so size memory rather than CPU: roughly vectors × dimensions × 4
          bytes × 1.5. Too little shows as out-of-memory restarts.
    rules:
      - rule: self.replicas >= 1
        mirrors: weaviate.validate
        paths: [replicas]
        message: Run at least one node.
      - rule: "!has(self.clusterName)"
        mirrors: weaviate.validate
        paths: [replicas]
        message: >-
          clusterName was removed in 1.1.0, and the chart refuses it. It was never used by any resource;
          remove it from the values.
      - rule: self.replicas != 2
        severity: info
        paths: [replicas]
        message: >-
          Two nodes survive no node loss, because Raft needs both for a majority. Use one node, or three
          or more.
      - rule: oldSelf == null || self.replicas == oldSelf.replicas
        severity: info
        paths: [replicas]
        message: >-
          Changing the number of nodes of a running cluster has not been verified for this template. Take a
          backup first, and check the cluster afterwards as described in Scaling and Availability.
      - rule: oldSelf == null || self.image == oldSelf.image
        severity: info
        paths: [image]
        message: >-
          A new image restarts every node on its existing data. Take a backup first, and read the Weaviate
          release notes for the versions in between.

  - id: search
    title: Search and AI modules
    description: Query defaults, and the AI providers Weaviate may call with your keys.
    sections:
      - title: AI providers
        description: >-
          Choose a provider's key secret only if Weaviate should call that provider. A chosen secret makes
          the provider live and billed to you, whether or not its modules are listed below, and opens
          outbound internet access for the cluster. Leave all four empty when you supply your own vectors.
        docs: "#ai-modules"
        fields:
          - path: modules.openai.apiKeySecretName
            type: ref
            label: OpenAI key secret
            description: >-
              An opaque secret (encoding plain) holding only the OpenAI key, for text2vec-openai,
              generative-openai and qna-openai. It must exist before you install.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                encoding: plain
                suggestName: "context.releaseName + '-weaviate-openai-key'"
          - path: modules.anthropic.apiKeySecretName
            type: ref
            label: Anthropic key secret
            description: >-
              An opaque secret (encoding plain) holding only the Anthropic key, for generative-anthropic.
              It must exist before you install.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                encoding: plain
                suggestName: "context.releaseName + '-weaviate-anthropic-key'"
          - path: modules.cohere.apiKeySecretName
            type: ref
            label: Cohere key secret
            description: >-
              An opaque secret (encoding plain) holding only the Cohere key, for text2vec-cohere and
              generative-cohere. It must exist before you install.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                encoding: plain
                suggestName: "context.releaseName + '-weaviate-cohere-key'"
          - path: modules.huggingface.apiKeySecretName
            type: ref
            label: Hugging Face key secret
            description: >-
              An opaque secret (encoding plain) holding only the Hugging Face key, for
              text2vec-huggingface. It must exist before you install.
            ref:
              kind: secret
              format: name
              filter: { secretType: [opaque] }
              mustExist: error
              allowCreate: true
              create:
                encoding: plain
                suggestName: "context.releaseName + '-weaviate-huggingface-key'"
        rules:
          - rule: "!has(self.modules.openai.apiKey)"
            mirrors: weaviate.validate
            paths: [modules.openai.apiKeySecretName]
            message: >-
              modules.openai.apiKey was removed in 1.1.0, and the chart refuses it. Put the key in an opaque
              secret, choose it as the OpenAI key secret, and remove modules.openai.apiKey from the values.
          - rule: "!has(self.modules.anthropic.apiKey)"
            mirrors: weaviate.validate
            paths: [modules.anthropic.apiKeySecretName]
            message: >-
              modules.anthropic.apiKey was removed in 1.1.0, and the chart refuses it. Put the key in an
              opaque secret, choose it as the Anthropic key secret, and remove modules.anthropic.apiKey from
              the values.
          - rule: "!has(self.modules.cohere.apiKey)"
            mirrors: weaviate.validate
            paths: [modules.cohere.apiKeySecretName]
            message: >-
              modules.cohere.apiKey was removed in 1.1.0, and the chart refuses it. Put the key in an opaque
              secret, choose it as the Cohere key secret, and remove modules.cohere.apiKey from the values.
          - rule: "!has(self.modules.huggingface.apiKey)"
            mirrors: weaviate.validate
            paths: [modules.huggingface.apiKeySecretName]
            message: >-
              modules.huggingface.apiKey was removed in 1.1.0, and the chart refuses it. Put the key in an
              opaque secret, choose it as the Hugging Face key secret, and remove modules.huggingface.apiKey
              from the values.
      - title: Query defaults
        docs: "#query-behavior"
        fields:
          - path: defaultVectorizerModule
            type: string
            label: Default vectorizer
            required: true
            suggestions: [none, text2vec-openai, text2vec-cohere, text2vec-huggingface]
            description: >-
              The module new collections use to compute vectors. Keep none when your application supplies
              the vectors; a provider module calls that provider on every insert and query.
          - path: modules.enabled
            type: list
            label: Modules
            widget: tags
            unique: true
            description: >-
              Listed for Weaviate's ENABLE_MODULES setting. On Weaviate 1.38 the API-based modules load
              whether or not they are listed; a provider's key secret is what turns it on. The backup module
              is added for you when backups are on.
            item:
              type: string
              label: Module
              suggestions:
                - text2vec-openai
                - text2vec-cohere
                - text2vec-huggingface
                - generative-openai
                - generative-cohere
                - generative-anthropic
                - qna-openai
                - ref2vec-centroid
          - path: queryDefaultsLimit
            type: integer
            label: Default result limit
            min: 1
            required: true
            suggestions: [10, 25, 50, 100]
            description: How many objects a query returns when it sets no limit of its own.
        rules:
          - when: self.defaultVectorizerModule in ['text2vec-openai', 'text2vec-cohere', 'text2vec-huggingface']
            rule: >-
              (self.defaultVectorizerModule == 'text2vec-openai' && self.modules.openai.apiKeySecretName != '') ||
              (self.defaultVectorizerModule == 'text2vec-cohere' && self.modules.cohere.apiKeySecretName != '') ||
              (self.defaultVectorizerModule == 'text2vec-huggingface' && self.modules.huggingface.apiKeySecretName != '')
            severity: info
            paths: [defaultVectorizerModule]
            message: >-
              This vectorizer calls a provider whose key secret is empty under AI providers, so inserts into
              new collections fail unless each client sends the provider key in a request header. Choose the
              provider's key secret, or keep none.

  - id: storage
    title: Storage
    description: The volume set that holds each node's objects and vector indexes.
    sections:
      - fields:
          - path: volumes.data.initialCapacity
            type: integer
            label: Initial capacity per node
            unit: GiB
            min: 10
            required: true
            suggestions: [10, 20, 50, 100, 250, 500]
            help: >-
              Each node has its own volume. The data survives redeploys; uninstalling the release deletes
              the volume set, and the data with it.
            docs: "#storage"
      - title: Grow storage automatically
        description: Each volume grows by the scaling factor whenever its free space falls below the threshold.
        docs: "/reference/volumeset#autoscaling"
        fields:
          - path: volumes.data.autoscaling.maxCapacity
            type: integer
            label: Maximum capacity per node
            unit: GiB
            min: 10
            required: true
            suggestions: [50, 100, 200, 500, 1000]
          - path: volumes.data.autoscaling.minFreePercentage
            type: integer
            label: Scale up below this free space
            unit: "%"
            min: 1
            max: 100
            required: true
            suggestions: [10, 20, 30]
          - path: volumes.data.autoscaling.scalingFactor
            type: number
            label: Scaling factor
            min: 1.1
            step: 0.1
            required: true
            suggestions:
              - { value: 1.2, label: "1.2×" }
              - { value: 1.5, label: "1.5× (default)" }
              - { value: 2, label: "2×" }
        rules:
          - rule: self.volumes.data.autoscaling.maxCapacity >= self.volumes.data.initialCapacity
            paths: [volumes.data.autoscaling.maxCapacity]
            message: The maximum capacity must be at least the initial capacity.
    rules:
      - rule: >-
          oldSelf == null || oldSelf.volumes.data.initialCapacity == null ||
          self.volumes.data.initialCapacity >= oldSelf.volumes.data.initialCapacity
        paths: [volumes.data.initialCapacity]
        message: Keep the capacity at or above the installed value. Lowering it would not shrink the existing volumes.

  - id: backup
    title: Backups
    description: Scheduled Weaviate backups to object storage.
    sections:
      - id: backup
        title: Scheduled backups
        toggle: backup.enabled
        description: >-
          A cron workload calls Weaviate's backup API on a schedule, which writes a full backup of every
          collection to an S3 or GCS bucket through a Control Plane cloud account. The bucket and the cloud
          account (for S3 also the IAM policy) must exist before you turn it on. Turning it on opens outbound
          internet access for the cluster. Check that the first backup lands in your bucket before you rely
          on the schedule.
        docs: "#backing-up"
        fields:
          - path: backup.provider
            type: enum
            label: Destination
            widget: segmented
            required: true
            options:
              - { value: aws, label: AWS S3 }
              - { value: gcp, label: Google Cloud Storage }
          - path: backup.schedule
            type: string
            format: cron
            label: Schedule (UTC)
            required: true
          - path: backup.resources
            type: resources
            label: Backup job resources
            required: true
            advanced: true
            cpu: { min: 25m }
            memory: { min: 32Mi }
        rules:
          - rule: self.backup.provider in ['aws', 'gcp']
            mirrors: weaviate.validate
            paths: [backup.provider]
            message: Choose AWS S3 or Google Cloud Storage as the backup destination.
      - title: AWS S3
        when: self.backup.enabled && self.backup.provider == 'aws'
        docs: "#aws-s3"
        fields:
          - type: note
            severity: warning
            when: >-
              context.mode == 'upgrade' && context.fromVersion != null &&
              semverCompare(context.fromVersion, '1.1.1') < 0 && oldSelf != null &&
              oldSelf.backup.enabled == true && oldSelf.backup.provider == 'aws'
            text: >-
              This version removes `aws::ReadOnlyAccess` from the backup identity. That managed policy
              granted read access to every bucket in your AWS account and was silently supplying any read
              action your bucket-scoped policy omitted. **Before you upgrade**, update your IAM policy to
              the full action list in [AWS S3](/template-catalog/templates/weaviate#aws-s3); if it already
              matches, no action is needed. See
              [Upgrading From 1.1.0](/template-catalog/templates/weaviate#upgrading-from-1-1-0).
          - path: backup.aws.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          - path: backup.aws.region
            type: string
            label: Bucket region
            required: true
            placeholder: us-east-1
            pattern: '^[a-z]{2}(-[a-z]+)+-\d$'
          - path: backup.aws.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: "An AWS [cloud account](/guides/create-cloud-account) for the AWS account that holds the bucket."
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [aws] }
              mustExist: error
          - path: backup.aws.policyName
            type: string
            label: IAM policy name
            required: true
            example: true
            description: An AWS IAM policy scoped to the bucket (an AWS object, not a Control Plane policy).
            help: >-
              The policy needs all ten S3 actions listed under
              [AWS S3](/template-catalog/templates/weaviate#aws-s3), on the bucket and on its objects. The
              backup identity carries only `cpln-connector` and this policy, so an action missing from it is
              missing for the backups.
            pattern: '^[A-Za-z0-9+=,.@_-]+$'
            patternMessage: "Enter the name of your IAM policy, using letters, digits and + = , . @ _ -."
          - path: backup.aws.path
            type: string
            label: Folder in the bucket
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.
      - title: Google Cloud Storage
        when: self.backup.enabled && self.backup.provider == 'gcp'
        docs: "#gcs"
        fields:
          - path: backup.gcp.bucket
            type: string
            label: Bucket
            required: true
            example: true
            pattern: '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$'
          - path: backup.gcp.cloudAccountName
            type: ref
            label: Cloud account
            required: true
            help: >-
              A GCP [cloud account](/guides/create-cloud-account) for the project that holds the bucket.
              Grant its service account `roles/storage.objectAdmin` on the bucket.
            ref:
              kind: cloudaccount
              format: name
              filter: { provider: [gcp] }
              mustExist: error
          - path: backup.gcp.path
            type: string
            label: Folder in the bucket
            pattern: '^(?!/)'
            patternMessage: Leave out the leading /.

  - id: network
    title: Network
    description: Which workloads can connect to Weaviate. It is never published to the internet.
    sections:
      - title: Access
        docs: "#access"
        fields:
          - type: note
            severity: info
            textExpression: >-
              'Applications connect to `' + context.releaseName + '-weaviate.' +
              (context.gvc != null ? context.gvc : 'GVC_NAME') +
              '.cpln.local` on port 8080 (REST and GraphQL) or 50051 (gRPC), with the header ' +
              '`Authorization: Bearer <API key>`.'
            text: >-
              Applications connect to `RELEASE_NAME-weaviate.GVC_NAME.cpln.local` on port 8080 (REST and
              GraphQL) or 50051 (gRPC), with the header `Authorization: Bearer <API key>`.
          - path: internalAccess.type
            type: enum
            label: Who can connect
            widget: cards
            required: true
            description: >-
              This template opens no public endpoint. Access changes take up to a couple of minutes to take
              effect.
            options:
              - value: none
                label: None
                description: No workload can connect.
              - value: same-gvc
                label: Same GVC
                description: Any workload in this GVC.
              - value: same-org
                label: Same org
                description: Any workload in this org.
              - value: workload-list
                label: Specific workloads
                description: Only the workloads listed below.
          # Shown while it matters or holds entries: the values comment says "used only with workload-list",
          # but workload-weaviate.yaml writes any non-empty list into inboundAllowWorkload, and the platform
          # applies the workload links with same-gvc and workload-list.
          - path: internalAccess.workloads
            when: self.internalAccess.type in ['same-gvc', 'workload-list'] || size(self.internalAccess.workloads) > 0
            type: list
            label: Allowed workloads
            widget: tags
            unique: true
            description: >-
              With Specific workloads, the only workloads allowed to connect; with Same GVC, extra workloads
              from other GVCs. The platform ignores the list with the other choices.
            item:
              type: ref
              ref:
                kind: workload
                gvc: any
                format: relativeLink
                mustExist: warning
                excludeTargetGvcWhen: self.internalAccess.type == 'same-gvc'
    rules:
      - rule: "!has(self.internal_access)"
        mirrors: weaviate.validate
        paths: [internalAccess.type]
        message: >-
          internal_access was renamed to internalAccess in 1.1.0, and the chart refuses the old key. Move
          its type and workloads under internalAccess, and remove internal_access from the values.
      - when: self.internalAccess.type == 'workload-list'
        rule: size(self.internalAccess.workloads) > 0
        severity: warning
        paths: [internalAccess.workloads]
        message: List at least one workload when Weaviate is open to specific workloads, or none can connect.
      - when: self.internalAccess.type == 'same-gvc' && context.gvc != null
        rule: "!self.internalAccess.workloads.exists(w, w.startsWith('//gvc/' + context.gvc + '/workload/'))"
        severity: info
        paths: [internalAccess.workloads]
        messageExpression: >-
          'Same GVC already allows every workload in this GVC: ' +
          self.internalAccess.workloads.filter(w, w.startsWith('//gvc/' + context.gvc + '/workload/')).map(w, context.gvc + '/' + w.substring(size('//gvc/' + context.gvc + '/workload/'))).join(', ') +
          ' can be removed from the list.'
        message: Same GVC already allows every workload in this GVC, so those entries can be removed from the list.
      - when: self.internalAccess.type == 'same-org'
        rule: size(self.internalAccess.workloads) == 0
        severity: info
        paths: [internalAccess.workloads]
        message: >-
          Same org already lets every workload of the org connect to Weaviate, so the workloads listed add
          nothing.
      - when: self.internalAccess.type == 'none'
        rule: size(self.internalAccess.workloads) == 0
        severity: warning
        paths: [internalAccess.workloads]
        message: >-
          The chart still writes the listed workloads into the firewall, where the platform checks every
          entry, but "None" lets none of them connect. Remove them.
      - when: self.internalAccess.type == 'none'
        rule: "!self.backup.enabled"
        severity: warning
        paths: [internalAccess.type]
        message: >-
          "None" also blocks the backup job, which calls Weaviate like any other workload, so no backup is
          taken.
      - when: self.internalAccess.type == 'workload-list' && context.gvc != null && self.backup.enabled
        rule: >-
          ('//gvc/' + context.gvc + '/workload/' + context.releaseName + '-weaviate-backup') in self.internalAccess.workloads
        severity: warning
        paths: [internalAccess.workloads]
        messageExpression: >-
          'The chart does not add its own backup job to the list. Add //gvc/' + context.gvc + '/workload/' +
          context.releaseName + '-weaviate-backup, or it cannot reach Weaviate and no backup is taken.'
        message: >-
          The chart does not add its own backup job to the list; add the backup workload, or it cannot reach
          Weaviate and no backup is taken.
        fix:
          path: internalAccess.workloads
          items: "['//gvc/' + context.gvc + '/workload/' + context.releaseName + '-weaviate-backup']"

migrations:
  # 1.1.0 moved every credential out of the values into prerequisite secrets.
  - fromVersions: "<1.1.0"
    from: apiKey
    note: >-
      The API key moved to an opaque secret; choose it under Authentication. 1.0.x shipped the published key
      21203583df918a538cecb1f96c85c4516c4c0e478be23f76466ad8a30adc68cc as the default, shared by every install
      that kept it: put a new key in the secret and update every client after the upgrade.
  - fromVersions: "<1.1.0"
    from: modules.openai.apiKey
    note: The OpenAI key moved to an opaque secret; choose it under Search and AI modules, or leave it empty to turn OpenAI off.
  - fromVersions: "<1.1.0"
    from: modules.anthropic.apiKey
    note: The Anthropic key moved to an opaque secret; choose it under Search and AI modules, or leave it empty to turn Anthropic off.
  - fromVersions: "<1.1.0"
    from: modules.cohere.apiKey
    note: The Cohere key moved to an opaque secret; choose it under Search and AI modules, or leave it empty to turn Cohere off.
  - fromVersions: "<1.1.0"
    from: modules.huggingface.apiKey
    note: The Hugging Face key moved to an opaque secret; choose it under Search and AI modules, or leave it empty to turn Hugging Face off.
  - fromVersions: "<1.1.0"
    from: clusterName
    note: clusterName was never used by any resource and was removed; nothing replaces it.
  # 1.1.0 renamed internal_access to internalAccess (same fields).
  - { fromVersions: "<1.1.0", from: internal_access.type, to: internalAccess.type }
  - { fromVersions: "<1.1.0", from: internal_access.workloads, to: internalAccess.workloads }
  # 1.1.0 changed the example backup destination names (my-backup-bucket became my-weaviate-backup-bucket,
  # my-s3-cloudaccount became my-s3-cloud-account, ...): carry the destination a 1.0.x release used even when
  # it is the old default. A null result computes nothing, so a destination the release did not use takes the
  # new defaults.
  - fromVersions: "<1.1.0"
    to: backup.aws.bucket
    valueExpr: "self.backup.enabled && self.backup.provider == 'aws' ? self.backup.aws.bucket : null"
    note: The release keeps the backup destination it used.
  - fromVersions: "<1.1.0"
    to: backup.aws.cloudAccountName
    valueExpr: "self.backup.enabled && self.backup.provider == 'aws' ? self.backup.aws.cloudAccountName : null"
    note: The release keeps the backup destination it used.
  - fromVersions: "<1.1.0"
    to: backup.aws.policyName
    valueExpr: "self.backup.enabled && self.backup.provider == 'aws' ? self.backup.aws.policyName : null"
    note: The release keeps the backup destination it used.
  - fromVersions: "<1.1.0"
    to: backup.gcp.bucket
    valueExpr: "self.backup.enabled && self.backup.provider == 'gcp' ? self.backup.gcp.bucket : null"
    note: The release keeps the backup destination it used.
  - fromVersions: "<1.1.0"
    to: backup.gcp.cloudAccountName
    valueExpr: "self.backup.enabled && self.backup.provider == 'gcp' ? self.backup.gcp.cloudAccountName : null"
    note: The release keeps the backup destination it used.
