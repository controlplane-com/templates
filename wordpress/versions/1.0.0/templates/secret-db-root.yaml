{{- /*
  The bundled database's root password, kept in a SEPARATE secret from the
  application credentials so the WordPress policy can grant `reveal` on the
  application credential without also handing out root. Only the MariaDB
  subchart's own identity can read this one.
*/}}
kind: secret
name: {{ include "wordpress.secret.dbRoot.name" . }}
description: WordPress bundled MariaDB root password
tags: {{- include "wordpress.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: {{ .Values.mariadb.credentials.rootPassword | quote }}
