{{- /*
  Credentials for the BUNDLED database, in the shape the mariadb subchart reads:
  exactly the keys username, password and database. Internal plumbing — no human
  ever types this password — so the bundled-plumbing exception applies and it
  stays a template-created secret rather than a prerequisite the user creates.
  mariadb 1.4.0 stopped creating this secret and now takes only its NAME, which
  is why the chart on this side of the dependency owns it.
*/}}
kind: secret
name: {{ include "wordpress.secret.db.name" . }}
description: WordPress bundled MariaDB application credentials
tags: {{- include "wordpress.tags" . | nindent 4 }}
type: dictionary
data:
  username: {{ .Values.mariadb.credentials.username | quote }}
  password: {{ .Values.mariadb.credentials.password | quote }}
  database: {{ .Values.mariadb.credentials.database | quote }}
