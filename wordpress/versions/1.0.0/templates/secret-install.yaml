{{- /*
  First-run installer, run by start.sh BEFORE Apache binds — so there is never a
  reachable /wp-admin/install.php for a stranger to claim, which is what lets
  publicAccess default to true.

  Credentials arrive as ENV (resolved by the platform from the prerequisite
  admin secret) and never appear on a command line or in a log.

  wp_install() does NOT guard itself, so the is_blog_installed() check is
  mandatory: without it a restart on an installed site would attempt a second
  install.
*/}}
kind: secret
name: {{ include "wordpress.secret.install.name" . }}
description: WordPress first-run installer
tags: {{- include "wordpress.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    <?php
    define('WP_INSTALLING', true);
    // wp-load.php expects a request context; the CLI has none.
    $_SERVER['HTTP_HOST']      = $_SERVER['HTTP_HOST'] ?? 'localhost';
    $_SERVER['REQUEST_URI']    = '/';
    $_SERVER['REQUEST_METHOD'] = 'GET';

    require_once '/var/www/html/wp-load.php';
    require_once ABSPATH . 'wp-admin/includes/upgrade.php';

    if (is_blog_installed()) {
        fwrite(STDERR, "cpln-bootstrap: WordPress is already installed - nothing to do\n");
        exit(0);
    }

    // The container has no mail transport, so the new-blog notification would
    // only waste time in a doomed wp_mail().
    add_filter('pre_wp_mail', '__return_false');

    $user = getenv('WP_ADMIN_USERNAME');
    $pass = getenv('WP_ADMIN_PASSWORD');
    $mail = getenv('WP_ADMIN_EMAIL');
    foreach (['WP_ADMIN_USERNAME' => $user, 'WP_ADMIN_PASSWORD' => $pass, 'WP_ADMIN_EMAIL' => $mail] as $k => $v) {
        if ($v === false || $v === '') {
            fwrite(STDERR, "cpln-bootstrap: $k is empty - the admin secret must hold the keys username, password and email\n");
            exit(1);
        }
    }

    $result = wp_install(getenv('WP_SITE_TITLE') ?: 'WordPress', $user, $mail, true, '', $pass);

    if (is_wp_error($result)) {
        fwrite(STDERR, "cpln-bootstrap: install failed: " . $result->get_error_message() . "\n");
        exit(1);
    }
    fwrite(STDERR, "cpln-bootstrap: WordPress installed; admin user '" . $user . "' created\n");
