{{- /*
  Mounted at /usr/local/etc/php/conf.d/zz-cpln-wordpress.ini. The `zz-` prefix
  sorts it after the image's own opcache-recommended.ini and error-logging.ini,
  so these win. Without it the stock php.ini-production caps uploads at 2M.
*/}}
kind: secret
name: {{ include "wordpress.secret.phpini.name" . }}
description: WordPress PHP limits (upload size, memory limit)
tags: {{- include "wordpress.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    upload_max_filesize = {{ .Values.php.uploadMaxSize }}
    post_max_size = {{ .Values.php.uploadMaxSize }}
    memory_limit = {{ .Values.php.memoryLimit }}
