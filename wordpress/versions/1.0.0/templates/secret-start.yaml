{{- /*
  Boot wrapper, run as `bash /cpln/start.sh`. Ordered contract:
    1. single-location GVC guard   2. docroot seed (one replica only)
    3. wp-config.php generation    4. wait for MariaDB
    5. first-run install           6. health endpoint   7. exec Apache

  Why a wrapper at all: with several replicas sharing one read-write-many
  docroot, a cold start would have every replica seed and install at once. The
  image's own entrypoint has no election, so this script performs one.
*/}}
kind: secret
name: {{ include "wordpress.secret.start.name" . }}
description: WordPress boot wrapper (GVC guard, docroot seed, first-run install)
tags: {{- include "wordpress.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    #!/bin/bash
    set -Eeuo pipefail

    DOCROOT=/var/www/html
    LOCK="$DOCROOT/.cpln-bootstrap.lock"
    DONE="$DOCROOT/.cpln-bootstrap-done"
    cd "$DOCROOT"

    log() { echo "cpln-bootstrap: $*" >&2; }

    # ── 0. Site URL ──────────────────────────────────────────────────────────────
    # WP_HOME/WP_SITEURL are derived from this via WORDPRESS_CONFIG_EXTRA, which is
    # read on EVERY request -- so a later `helm upgrade` changes the site URL even
    # though wp-config.php was generated on first boot.
{{- if .Values.wordpress.siteUrl }}
    export WP_SITE_URL="{{ .Values.wordpress.siteUrl }}"
{{- else if .Values.publicAccess.enabled }}
    # CPLN_GLOBAL_ENDPOINT is already a full https:// URL, NOT a bare host --
    # use it verbatim, never prepend a second scheme, never assemble it from parts.
    export WP_SITE_URL="${CPLN_GLOBAL_ENDPOINT:-}"
{{- else }}
    # No public endpoint -- links point at the internal in-GVC address.
    export WP_SITE_URL="http://{{ include "wordpress.name" . }}.{{ .Values.global.cpln.gvc }}.cpln.local"
{{- end }}

    # ── 1. Single-location GVC guard ─────────────────────────────────────────────
    # On a multi-location GVC the platform starts this workload AND the bundled
    # MariaDB in every location: two databases with two independent volumes behind
    # one DNS name, plus two divergent upload volumes. That is silent data
    # divergence, so a FRESH install refuses. An already-initialised docroot only
    # warns -- this check must never take a live site down.
    FRESH=no
    if [ ! -e wp-includes/version.php ] && [ ! -e index.php ]; then FRESH=yes; fi

    LOCATIONS=""
    if [ -n "${WP_GVC_LOCATIONS_OVERRIDE:-}" ]; then
      # Test hook: lets the >1-location disposition be exercised on a
      # single-location GVC. The chart never sets this.
      LOCATIONS="$WP_GVC_LOCATIONS_OVERRIDE"
      log "GVC location list overridden for testing: $LOCATIONS"
    elif [ -n "${CPLN_TOKEN:-}" ] && [ -n "${CPLN_ORG:-}" ] && [ -n "${CPLN_GVC:-}" ]; then
      # curl defaults to HTTP/1.1; $CPLN_ENDPOINT sits behind istio-envoy, which
      # answers HTTP/1.0 with 426. --max-time bounds the whole call, not just connect.
      GVC_JSON="$(curl -sS --connect-timeout 5 --max-time 15 --retry 2 --retry-delay 3 \
          -H "Authorization: $CPLN_TOKEN" \
          "${CPLN_ENDPOINT:-http://api.cpln.io}/org/$CPLN_ORG/gvc/$CPLN_GVC" 2>/dev/null || true)"
      if [ -n "$GVC_JSON" ]; then
        LOCATIONS="$(printf '%s' "$GVC_JSON" | php -r '
          $d = json_decode(stream_get_contents(STDIN), true);
          $l = $d["spec"]["staticPlacement"]["locationLinks"] ?? null;
          if (!is_array($l) || !count($l)) { exit(1); }
          echo implode(",", array_map(function ($x) { return basename($x); }, $l));
        ' 2>/dev/null || true)"
      fi
    fi

    if [ -z "$LOCATIONS" ]; then
      # A control-plane hiccup or a missing GVC policy must not stop a site booting.
      log "WARNING: could not read GVC '${CPLN_GVC:-?}' - single-location guard SKIPPED"
    else
      LOCATION_COUNT="$(printf '%s' "$LOCATIONS" | awk -F, '{print NF}')"
      if [ "$LOCATION_COUNT" -gt 1 ]; then
        if [ "$FRESH" = yes ]; then
          log "FATAL: GVC '${CPLN_GVC:-?}' has $LOCATION_COUNT locations ($LOCATIONS)."
          log "FATAL: This template supports a SINGLE-location GVC only. In a multi-location"
          log "FATAL: GVC the platform runs one WordPress AND one MariaDB per location, each"
          log "FATAL: with its own volume - the media library and the database silently split."
          log "FATAL: Install into a single-location GVC instead."
          exit 1
        fi
        log "WARNING: GVC '${CPLN_GVC:-?}' has $LOCATION_COUNT locations ($LOCATIONS) - this site's"
        log "WARNING: data may be split per location. Not failing: the docroot is already initialised."
      else
        log "single-location GVC ok ($LOCATIONS)"
      fi
    fi

    # ── 2. Bootstrap election ────────────────────────────────────────────────────
    # The docroot is read-write-many, so on a cold start every replica would seed and
    # install at once. mkdir is atomic on POSIX and on network filesystems, so
    # exactly one replica wins. Keyed on .cpln-bootstrap-done rather than on an empty
    # docroot, so a crash between "seeded" and "installed" is still repaired.
    HOLD=no
    if [ ! -e "$DONE" ]; then
      if mkdir "$LOCK" 2>/dev/null; then
        HOLD=yes
        log "this replica is bootstrapping the site"
      else
        log "another replica is bootstrapping; waiting..."
        WAITED=0
        while [ ! -e "$DONE" ]; do
          if [ "$WAITED" -ge 600 ]; then
            # The holder died mid-bootstrap. Clear the lock and exit non-zero so the
            # platform restarts us and this replica can take the lock next time,
            # rather than wedging on an orphaned lock forever.
            log "ERROR: timed out after ${WAITED}s waiting for the bootstrap replica; releasing the stale lock and restarting"
            rmdir "$LOCK" 2>/dev/null || true
            exit 1
          fi
          sleep 5
          WAITED=$((WAITED + 5))
        done
        log "bootstrap completed elsewhere after ${WAITED}s"
      fi
    fi

    # ── 3. Seed the docroot ──────────────────────────────────────────────────────
    # We seed rather than letting the image entrypoint do it, for one reason the
    # entrypoint cannot solve: with several replicas sharing one volume, only the
    # lock holder above may write. Ownership is set the way the entrypoint sets it
    # (tar --owner/--group www-data) -- measured working on the platform's shared
    # volumeset. Do NOT use --no-same-owner: it leaves root-owned directories that
    # www-data cannot write into, which breaks plugin installs and media uploads.
    if [ "$HOLD" = yes ] && [ "$FRESH" = yes ]; then
      log "seeding WordPress into $DOCROOT ..."
      tar --create --file - --directory /usr/src/wordpress --owner www-data --group www-data . \
        | tar --extract --file - --directory "$DOCROOT"
      if ! chown -R www-data:www-data "$DOCROOT" 2>/dev/null; then
        log "WARNING: chown failed on this storage - falling back to a permissive mode"
        chmod -R a+rwX "$DOCROOT" 2>/dev/null || log "WARNING: chmod fallback also failed; plugin installs and uploads may fail"
      fi
      log "seed complete ($(du -sh "$DOCROOT" 2>/dev/null | cut -f1))"
    fi

    # ── 4. wp-config.php ─────────────────────────────────────────────────────────
    # The image's own alias runs the setup for ANY command. It generates
    # wp-config.php with eight unique auth salts (once, on the shared volume, so
    # every replica signs cookies identically) and is a no-op once it exists.
    docker-ensure-installed.sh true

    # ── 5. Wait for the database ─────────────────────────────────────────────────
    log "waiting for the database at ${WORDPRESS_DB_HOST:-?} ..."
    WAITED=0
    until php -r '
      $hp = getenv("WORDPRESS_DB_HOST");
      $port = 3306;
      if (strpos($hp, ":") !== false) { list($hp, $port) = explode(":", $hp, 2); $port = (int) $port; }
      mysqli_report(MYSQLI_REPORT_OFF);
      $c = @mysqli_connect($hp, getenv("WORDPRESS_DB_USER"), getenv("WORDPRESS_DB_PASSWORD"), getenv("WORDPRESS_DB_NAME"), $port);
      exit($c ? 0 : 1);
    ' 2>/dev/null; do
      if [ "$WAITED" -ge 300 ]; then
        log "FATAL: database ${WORDPRESS_DB_HOST:-?} not reachable after ${WAITED}s"
        exit 1
      fi
      sleep 5
      WAITED=$((WAITED + 5))
    done
    log "database reachable after ${WAITED}s"

    # ── 6. First-run install ─────────────────────────────────────────────────────
    if [ "$HOLD" = yes ]; then
      php /cpln/install.php
      : > "$DONE"
      rmdir "$LOCK" 2>/dev/null || true
    fi

    # ── 7. Health endpoint ───────────────────────────────────────────────────────
    # Rewritten every boot so an upgrade refreshes it. Written via a temp file so a
    # concurrent replica never serves a half-written file.
    cat > "$DOCROOT/.cpln-health.php.tmp" <<'HEALTH'
    <?php
    // Written by the cpln start script. Safe to delete; it is recreated on boot.
    if (isset($_GET['shallow'])) { echo 'ok'; exit; }
    define('WP_USE_THEMES', false);
    require_once __DIR__ . '/wp-load.php';
    if (!is_blog_installed()) { http_response_code(503); echo 'not-installed'; exit; }
    echo 'ok';
    HEALTH
    mv -f "$DOCROOT/.cpln-health.php.tmp" "$DOCROOT/cpln-health.php"
    chown www-data:www-data "$DOCROOT/cpln-health.php" 2>/dev/null || true

    log "handing off to Apache"
    exec apache2-foreground
